# DI QUALE TESTATA E' QUESTA RIGA? — un lettore che non passa dalla RLS
#   script.fn_get_testata_id_di_riga(p_documento text, p_riga_id bigint) RETURNS bigint
#   Brief: brief-db-righe-esclusione-solo-non-si-vende (§8.2 B3; decisione di
#   Tid, 2026-10-04)
#
# -- PERCHE' --------------------------------------------------------
#   Il building block «le righe di un documento si toccano solo in bozza»
#   (vendite.trgfn_doc_righe_lock_fuori_bozza) legge la testata dalla colonna
#   FK della riga. Le tabelle NIPOTI — i componenti di una riga di contratto o
#   di offerta, i rientri di una riga di reso — hanno una FK verso la RIGA:
#   per sapere in che stato e' il documento serve prima risalire dalla riga
#   alla testata. Il building block impara a farlo (20261005-16), e questo e'
#   il passo che gli manca.
#
# -- PERCHE' SECURITY DEFINER -----------------------------------------
#   Le righe hanno RLS (contratti_righe, offerte_commerciali_eccezioni,
#   resi_righe). Un guard che leggesse la riga sotto RLS non distinguerebbe
#   «la riga non c'e' piu'» (cascade) da «non la vedo», e diventerebbe
#   fail-open proprio per chi sta fuori perimetro. E' la stessa ragione del
#   gemello script.fn_get_stato_testata_documento, di cui copia la forma:
#   STABLE, search_path chiuso, tutto qualificato, DEFINER del PROPRIETARIO
#   (chi migra possiede anche le righe: il pgTAP lo asserisce).
#
# -- PERIMETRO ----------------------------------------------------------
#   Legge UNA colonna (la FK verso la testata) di UNA riga, da un elenco
#   CHIUSO di tabelle scelto dal tipo di documento: nessun nome di tabella
#   arriva dal chiamante, nessun SQL dinamico. Tipi: CONTRATTO, OFFERTA, RESO
#   — quelli che hanno oggi un nipote sotto il lock. Un tipo nuovo si
#   aggiunge col suo primo adottante, non prima: un ramo senza chiamanti non
#   lo prova nessuno.
#   Contratto: NULL = la riga non esiste (cascade partito dalla riga, o FK
#   che parlera'). Qualunque altro tipo: E_DOC_TIPO_NON_GESTITO (TECNICO),
#   come il gemello.
#
# ⚠️ Tipi nudi DICHIARATI: p_riga_id e il ritorno sono POLIMORFI (l'id di tre
#    tabelle diverse), non c'e' UNA colonna da ancorare. Stessa nota del
#    gemello.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261005-15-create-fn-get-testata-id-di-riga-mctit.yaml

  - changeSet:
      id: 20261005-15-create-fn-get-testata-id-di-riga
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Nasce script.fn_get_testata_id_di_riga(documento, riga): lettore SECURITY DEFINER della
        testata di una riga di documento (CONTRATTO, OFFERTA, RESO), per il lock delle tabelle
        nipoti fuori bozza. Brief: brief-db-righe-esclusione-solo-non-si-vende (§8.2 B3).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "0"
            sql: >
              SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script' AND p.proname = 'fn_get_testata_id_di_riga';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_get_testata_id_di_riga(p_documento text, p_riga_id bigint)
               RETURNS bigint
               LANGUAGE plpgsql
               STABLE SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public'
              AS $function$
              -- ⚠️ Tipi nudi DICHIARATI: p_riga_id e il ritorno sono POLIMORFI
              --   (l'id di tre tabelle di righe, l'id di tre testate): non c'e'
              --   UNA colonna da ancorare.
              DECLARE
                v_testata_id bigint;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Rispondere a «di quale testata e' questa riga?» SENZA
                --   passare dalla RLS delle righe. Serve al lock delle
                --   tabelle NIPOTI (vendite.trgfn_doc_righe_lock_fuori_bozza
                --   montato a livello RIGA): componenti e rientri hanno la
                --   FK verso la riga, non verso la testata.
                --
                -- Contratto:
                --   - NULL     -> la riga NON esiste (cascade partito dalla
                --     riga, o FK che parlera'). Il chiamante la tratta come
                --     il gemello tratta la testata assente: passa.
                --   - un id    -> la testata della riga (la FK e' NOT NULL
                --     su tutte e tre le tabelle).
                --
                -- ⛔ Elenco CHIUSO di tabelle, scelto dal tipo di documento:
                --    nessun nome arriva dal chiamante, nessun SQL dinamico.
                --    Un DEFINER che leggesse una tabella qualunque per id
                --    sarebbe una porta su ogni colonna bigint del database.
                -- =========================================================
                IF p_riga_id IS NULL OR p_riga_id <= 0 THEN
                  RETURN NULL;   -- il chiamante lo legge come «assente»
                END IF;

                IF p_documento = 'CONTRATTO' THEN
                  SELECT r.contratto_id INTO v_testata_id
                    FROM vendite.contratti_righe r
                   WHERE r.id = p_riga_id;

                ELSIF p_documento = 'OFFERTA' THEN
                  SELECT e.offerta_id INTO v_testata_id
                    FROM vendite.offerte_commerciali_eccezioni e
                   WHERE e.id = p_riga_id;

                ELSIF p_documento = 'RESO' THEN
                  SELECT r.reso_id INTO v_testata_id
                    FROM vendite.resi_righe r
                   WHERE r.id = p_riga_id;

                ELSE
                  -- Errore di CHIAMANTE, non di dato: nessuna persona sceglie
                  -- questo valore (stesso codice del gemello
                  -- script.fn_get_stato_testata_documento).
                  PERFORM script.fn_log_and_raise_error(
                    'script',
                    'fn_get_testata_id_di_riga',
                    'E_DOC_TIPO_NON_GESTITO',
                    jsonb_build_object('documento', p_documento,
                                       'riga_id',   p_riga_id),
                    NULL::uuid,
                    COALESCE(p_documento, '<null>'));
                END IF;

                RETURN v_testata_id;
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_get_testata_id_di_riga(p_documento text, p_riga_id bigint)
              IS 'Lettore SECURITY DEFINER della testata di una riga di documento: risponde a «di quale testata e'' questa riga?» senza passare dalla RLS delle righe. Nasce il 2026-10-05 per vendite.trgfn_doc_righe_lock_fuori_bozza montato a livello RIGA, cioe'' sulle tabelle NIPOTI (componenti di una riga di contratto o di offerta, rientri di una riga di reso), che hanno la FK verso la riga e non verso la testata. ⛔ SECURITY DEFINER del PROPRIETARIO, non di un superuser: le righe hanno RLS, e un guard che le leggesse da invoker non distinguerebbe «la riga non c''e'' piu''» (cascade) da «non la vedo», diventando fail-open per chi sta fuori perimetro — la stessa ragione del gemello script.fn_get_stato_testata_documento. CONTRATTO: NULL = riga assente; un id = la sua testata (la FK e'' NOT NULL). PERIMETRO: legge una colonna di una riga da un elenco CHIUSO di tabelle scelto dal tipo — CONTRATTO (vendite.contratti_righe.contratto_id), OFFERTA (vendite.offerte_commerciali_eccezioni.offerta_id), RESO (vendite.resi_righe.reso_id); nessun nome di tabella dal chiamante, nessun SQL dinamico. Qualunque altro tipo e'' un errore di chiamante (E_DOC_TIPO_NON_GESTITO, TECNICO). Un tipo nuovo entra col suo primo adottante. Brief: brief-db-righe-esclusione-solo-non-si-vende (§8.2 B3).';

              GRANT EXECUTE ON FUNCTION script.fn_get_testata_id_di_riga(text, bigint) TO PUBLIC;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_get_testata_id_di_riga(text, bigint);
