# BB: SCRIVERE UNA RIGA, E RILEGGERLA A ISTRUZIONE FINITA
#   script.fn_scrivi_riga_da_jsonb prende un quarto parametro, p_rileggi_per
#   (text[], default NULL): le colonne di p_dati che individuano la riga.
#   Con il parametro, la INSERT non fa RETURNING e la riga si RILEGGE dopo,
#   per quelle colonne. Senza, tutto come prima.
#   Brief: brief-db-processi-accensione-per-ambiente, §5-ter.2 (2b-1, lotto 5).
#
# -- PERCHE' -------------------------------------------------------------
#   Billing account e cliente sono in RLS, e la loro policy di lettura passa
#   dal legame BA -> emittente, che scrive un trigger AFTER (z90_link_ef).
#   Un RETURNING chiede di vedere la riga PRIMA di quel trigger: sotto la RLS
#   la riga non ancora legata ricade sull'emittente di default, e se chi
#   agisce non e' quello l'INSERT muore («la nuova riga viola la regola di
#   sicurezza»). La rilettura a istruzione finita e' la forma che i builder
#   pgTAP usano da 20260912-38; ora la scrivono i BB del lotto 5, ed e' gia'
#   la seconda copia: sta qui.
#
# -- LA FIRMA ------------------------------------------------------------
#   Un parametro in coda con default: i chiamanti di oggi (due e tre
#   argomenti, posizionali) restano identici. Non e' un CREATE OR REPLACE: la
#   firma cambia, quindi DROP della vecchia e CREATE nello stesso changeSet.
#   I chiamanti sono plpgsql (nessuna dipendenza in pg_depend), e la
#   finestra fra DROP e CREATE sta nella transazione del changeSet.
#   Corpo di partenza: la doc auto-generata (20261017-05).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261018-34-update-fn-scrivi-riga-da-jsonb-rilettura-mctit.yaml

  - changeSet:
      id: 20261018-34-update-fn-scrivi-riga-da-jsonb-rilettura
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        script.fn_scrivi_riga_da_jsonb prende p_rileggi_per (text[], in coda, default NULL): la
        INSERT senza RETURNING e la riga riletta a istruzione finita per quelle colonne, per le
        tabelle in RLS il cui legame lo scrive un AFTER. Senza il parametro nulla cambia.
        Brief: brief-db-processi-accensione-per-ambiente (2b-1, lotto 5).
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION script.fn_scrivi_riga_da_jsonb(regclass, jsonb, jsonb);

              CREATE FUNCTION script.fn_scrivi_riga_da_jsonb(
                  p_tabella     regclass,
                  p_dati        jsonb,
                  p_dove        jsonb  DEFAULT NULL::jsonb,
                  p_rileggi_per text[] DEFAULT NULL::text[])
               RETURNS jsonb
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_colonne     text;   -- colonne di p_dati, quotate
                  v_valori      text;   -- le stesse, lette dal record r
                  v_dove_col    text;   -- colonne di p_dove, quotate
                  v_dove_val    text;
                  v_chiave_col  text;   -- colonne di p_rileggi_per, quotate
                  v_chiave_val  text;
                  v_riga        jsonb;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Scrivere una riga di p_tabella con le SOLE colonne di
                  --   p_dati (valori convertiti da jsonb_populate_record):
                  --     * p_dove NULL     -> INSERT; le assenti al DEFAULT;
                  --     * p_dove {col: v} -> UPDATE delle righe con quei
                  --                          valori; le assenti invariate.
                  --   Ritorna la riga scritta (to_jsonb), NULL se l'UPDATE
                  --   non trova righe. p_dati vuoto: INSERT DEFAULT VALUES,
                  --   oppure nessuna scrittura e la riga com'e'.
                  --   p_rileggi_per (solo INSERT): le colonne di p_dati che
                  --   individuano la riga; la INSERT non fa RETURNING e la
                  --   riga si rilegge a istruzione finita (tabelle in RLS
                  --   il cui legame lo scrive un trigger AFTER).
                  --
                  -- Regole:
                  --   - le chiavi le sceglie chi chiama (rifiutare o scartare
                  --     e' una regola sua): qui ogni chiave e' una colonna;
                  --   - UPDATE: una riga. Se p_dove ne individua piu' d'una le
                  --     scrive tutte e ritorna la prima: p_dove e' una chiave;
                  --   - rilettura: ogni colonna della chiave e' valorizzata in
                  --     p_dati; una riga scritta e non visibile e' un errore.
                  -- =========================================================
                  IF p_tabella IS NULL
                     OR p_dati IS NULL OR jsonb_typeof(p_dati) <> 'object'
                     OR (p_dove IS NOT NULL
                         AND (jsonb_typeof(p_dove) <> 'object' OR p_dove = '{}'::jsonb))
                     OR (p_rileggi_per IS NOT NULL
                         AND (p_dove IS NOT NULL
                              OR cardinality(p_rileggi_per) = 0
                              OR EXISTS (SELECT 1 FROM unnest(p_rileggi_per) AS k
                                          WHERE jsonb_typeof(p_dati -> k) IS DISTINCT FROM 'string'
                                            AND jsonb_typeof(p_dati -> k) IS DISTINCT FROM 'number'
                                            AND jsonb_typeof(p_dati -> k) IS DISTINCT FROM 'boolean'))) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'script', 'script.fn_scrivi_riga_da_jsonb', 'E_SCRIPT_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('tabella',     p_tabella::text,
                                             'tipo_dati',   jsonb_typeof(p_dati),
                                             'tipo_dove',   jsonb_typeof(p_dove),
                                             'rileggi_per', to_jsonb(p_rileggi_per)),
                          NULL::uuid,
                          'script.fn_scrivi_riga_da_jsonb',
                          'tabella, dati o chiave della riga mancanti');
                  END IF;

                  SELECT string_agg(quote_ident(k), ', ' ORDER BY k),
                         string_agg('r.' || quote_ident(k), ', ' ORDER BY k)
                    INTO v_colonne, v_valori
                    FROM jsonb_object_keys(p_dati) AS k;

                  IF p_dove IS NULL AND p_rileggi_per IS NOT NULL THEN
                      -- La rilettura: INSERT senza RETURNING, poi la riga per
                      -- la chiave, quando i trigger AFTER hanno finito.
                      EXECUTE format(
                          'INSERT INTO %s AS t (%s) SELECT %s FROM jsonb_populate_record(NULL::%s, $1) AS r',
                          p_tabella, v_colonne, v_valori, p_tabella)
                        USING p_dati;

                      SELECT string_agg('t.' || quote_ident(k), ', ' ORDER BY k),
                             string_agg('r.' || quote_ident(k), ', ' ORDER BY k)
                        INTO v_chiave_col, v_chiave_val
                        FROM unnest(p_rileggi_per) AS k;

                      EXECUTE format(
                          'SELECT to_jsonb(t.*) FROM %s AS t, jsonb_populate_record(NULL::%s, $1) AS r '
                          'WHERE ROW(%s) = ROW(%s)',
                          p_tabella, p_tabella, v_chiave_col, v_chiave_val)
                         INTO v_riga
                        USING p_dati;

                      IF v_riga IS NULL THEN
                          PERFORM script.fn_log_and_raise_error(
                              'script', 'script.fn_scrivi_riga_da_jsonb', 'E_SCRIPT_CHIAMATA_NON_VALIDA',
                              jsonb_build_object('tabella',     p_tabella::text,
                                                 'rileggi_per', to_jsonb(p_rileggi_per)),
                              NULL::uuid,
                              'script.fn_scrivi_riga_da_jsonb',
                              'riga scritta ma non visibile a chi chiama');
                      END IF;

                      RETURN v_riga;
                  END IF;

                  IF p_dove IS NULL THEN
                      IF v_colonne IS NULL THEN
                          EXECUTE format(
                              'INSERT INTO %s AS t DEFAULT VALUES RETURNING to_jsonb(t.*)',
                              p_tabella)
                             INTO v_riga;
                      ELSE
                          EXECUTE format(
                              'INSERT INTO %s AS t (%s) SELECT %s FROM jsonb_populate_record(NULL::%s, $1) AS r '
                              'RETURNING to_jsonb(t.*)',
                              p_tabella, v_colonne, v_valori, p_tabella)
                             INTO v_riga
                            USING p_dati;
                      END IF;
                      RETURN v_riga;
                  END IF;

                  SELECT string_agg('t.' || quote_ident(k), ', ' ORDER BY k),
                         string_agg('w.' || quote_ident(k), ', ' ORDER BY k)
                    INTO v_dove_col, v_dove_val
                    FROM jsonb_object_keys(p_dove) AS k;

                  IF v_colonne IS NULL THEN
                      EXECUTE format(
                          'SELECT to_jsonb(t.*) FROM %s AS t, jsonb_populate_record(NULL::%s, $1) AS w '
                          'WHERE ROW(%s) = ROW(%s)',
                          p_tabella, p_tabella, v_dove_col, v_dove_val)
                         INTO v_riga
                        USING p_dove;
                  ELSE
                      -- ROW(...) anche con una colonna sola.
                      EXECUTE format(
                          'UPDATE %s AS t SET (%s) = ROW(%s) '
                          '  FROM jsonb_populate_record(NULL::%s, $1) AS r, '
                          '       jsonb_populate_record(NULL::%s, $2) AS w '
                          ' WHERE ROW(%s) = ROW(%s) '
                          'RETURNING to_jsonb(t.*)',
                          p_tabella, v_colonne, v_valori, p_tabella, p_tabella,
                          v_dove_col, v_dove_val)
                         INTO v_riga
                        USING p_dati, p_dove;
                  END IF;

                  RETURN v_riga;
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_scrivi_riga_da_jsonb(regclass, jsonb, jsonb, text[]) IS
                  'BB (2026-10-17, rev 2026-10-18): scrive una riga di p_tabella con le SOLE colonne di p_dati, valori convertiti da jsonb_populate_record sul tipo di riga. p_dove NULL: INSERT, le colonne assenti al DEFAULT (p_dati vuoto: DEFAULT VALUES). p_dove {colonna: valore, ...}: UPDATE delle righe con quei valori, le colonne assenti invariate (p_dati vuoto: nessuna scrittura, ritorna la riga). Ritorna la riga scritta (to_jsonb), NULL se l''UPDATE non trova righe. p_rileggi_per (rev 2026-10-18, solo INSERT): le colonne di p_dati che individuano la riga, tutte valorizzate; la INSERT non fa RETURNING e la riga si rilegge a istruzione finita, per le tabelle in RLS il cui legame lo scrive un trigger AFTER (billing account e cliente: la policy passa dal legame BA -> emittente di z90_link_ef). Una riga scritta e non visibile: E_SCRIPT_CHIAMATA_NON_VALIDA. Le chiavi le sceglie chi chiama: ogni chiave deve essere una colonna (rifiutare o scartare quelle estranee e'' una regola del chiamante). I trigger della tabella scattano come sempre. INVOKER. Chiamata malformata: E_SCRIPT_CHIAMATA_NON_VALIDA. Regola del 2: prende il posto delle copie in config.fn_pannello_scrivi (passo 3) e vendite.fn_create_contratto (passi 3 e 4); la rilettura, della forma dei builder pgTAP del cliente (20260912-38). Brief: brief-db-processi-accensione-per-ambiente (2b-1).';
      rollback:
        - sql:
            sql: >
              SELECT 'rollback manuale: ricreare la firma a tre argomenti da 20261017-05';
