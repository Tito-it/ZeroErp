# script.fn_available_actions_lotto — capability del lotto di fatturazione
#   (risposta-db-azioni-lista-lotto.md §3.1; richiesta BE §4.1)
#
# OTTAVA della famiglia (ordine, ddt, reso, offerta, preventivo,
#   contratto, commessa): stesso contratto, stesso posto, stessi
#   consumatori FE (useDrawerActions / DrawerActionsBar /
#   useEntityCapabilities). Si consuma sul DETTAGLIO — get_lotto — come
#   tutte le sorelle: nessuna lista del progetto chiama una capability
#   per riga, e questa non fa eccezione (motivazione nel §3.3 della
#   risposta: la riga di lista porta gia' stato_doc_fiscale_codice,
#   stato_lotto e tipo_lotto, che sono gli stessi campi su cui il drawer
#   gate oggi).
#
# ── DATA-DRIVEN DOVE LA MATRICE C'E' GIA' ────────────────────────────────
#   Tre dei verbi sono transizioni vere di config.stati_doc_fiscale_transizioni
#   e nascono da li', dal `meta` seedato il 2026-08-04:
#     EMESSA->DEFINITIVA  -> numera            (riga 3)
#     EMESSA->DRAFT       -> riporta_a_draft   (riga 2, riaperta il 2026-08-03)
#     DRAFT ->ANNULLATA   -> annulla           (riga 11)
#   Il filtro sulla matrice e' lo STESSO predicato del guard vivo
#   (trgfn_fatturazione_lotti_guard_stato): ammesso + solo_fattura=false +
#   meta.tipo_lotto compatibile. Se domani la matrice cambia, cambiano
#   insieme il guard e i pulsanti — non si toccano due posti.
#
# ── RISTAMPA: CABLATA, E VA BENE COSI' ───────────────────────────────────
#   Non e' una transizione (stampare e' leggere, I-4): e' un'azione
#   applicativa disponibile su lotto DEFINITIVA. Cablata qui, come
#   push_commessa in fn_available_actions_ddt.
#
# ── 🔴 COSA NON ESPONE, E PERCHE' ────────────────────────────────────────
#   avanza_step e rilancia_step NON sono qui. Il loro gate e' fatto di tre
#   pezzi: criticita' attive (dato DB), esistenza dello step successivo
#   (registry DB) e distinzione avanza/rilancio dello stesso step (D-Q p.1),
#   che oggi vive TUTTO in LottoPipelineRunner._resolve_steps_for_run +
#   lotto_segnalazioni_service. Ricostruirlo qui creerebbe la SECONDA
#   COPIA proprio della regola che questo lavoro serve a de-duplicare.
#   Finche' quel gate sta in Python, il DB non finge di possederlo: il
#   verdetto sull'avanzamento resta del runner, che e' anche l'unico che
#   lo applica davvero. Farlo scendere e' una decisione a se' (vedi §5
#   della risposta al BE) e va fatta in un colpo solo, non a meta'.
#
# ── ENABLED: IL CONTRATTO ────────────────────────────────────────────────
#   Come per la commessa: la presenza di un'azione in available_actions
#   NON significa piu' eseguibile. I consumatori devono leggere `enabled`
#   e mostrare `reasons` a tooltip. can_change_state e' calcolato sulle
#   sole azioni ABILITATE e sulle sole TRANSIZIONI (la ristampa non
#   cambia stato).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260804-06-create-fn-available-actions-lotto-mctit.yaml

  - changeSet:
      id: 20260804-06-create-fn-available-actions-lotto
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Capability del lotto di fatturazione per il detail API: available_actions
        (numera/riporta_a_draft/annulla dalla matrice + ristampa cablata) con
        enabled/reasons dalle fn_check pure, can_change_state, stato_codice,
        tipo_lotto. Ottava della famiglia fn_available_actions_*.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_available_actions_lotto(
                  p_lotto_id vendite.fatturazione_lotti.id%TYPE
              )
               RETURNS jsonb
               LANGUAGE plpgsql
               STABLE
              AS $function$
              -- Scopo:
              --   Capability del lotto di fatturazione per il detail API.
              --   Mirror data-driven di fn_available_actions_commessa: le
              --   transizioni manuali (meta.manuale=true + action_key/label_key)
              --   sono esposte come bottoni, le automatiche no. enabled/reasons
              --   arrivano dalle funzioni pure script.fn_check_lotto_annullabile
              --   e script.fn_check_lotto_riportabile_a_draft — le STESSE che le
              --   due fn di mutazione usano per sollevare (sorgente unica: la UI
              --   non puo' divergere dal DB).
              --   🔴 NON espone avanza_step / rilancia_step: quel gate vive nel
              --   runner Python (steps + criticita' + rilancio dello stesso
              --   step, D-Q p.1) e ricostruirlo qui sarebbe la seconda copia
              --   della regola che stiamo eliminando.
              DECLARE
                  v_stato_id     vendite.fatturazione_lotti.stato_doc_fiscale_id%TYPE;
                  v_stato_cod    config.stati_doc_fiscale.codice_interno%TYPE;
                  v_tipo_lotto   vendite.fatturazione_lotti.tipo_lotto%TYPE;
                  v_actions      jsonb;
                  v_can_change   boolean := false;
                  v_mot_annulla  jsonb;
                  v_mot_riporta  jsonb;
              BEGIN
                  -- Stato corrente + tipo. LEFT JOIN: un lotto senza stato deve
                  -- restare una riga (e non avere azioni), non sparire.
                  SELECT fl.stato_doc_fiscale_id, sdf.codice_interno, fl.tipo_lotto
                    INTO v_stato_id, v_stato_cod, v_tipo_lotto
                    FROM vendite.fatturazione_lotti fl
                    LEFT JOIN config.stati_doc_fiscale sdf
                      ON sdf.id = fl.stato_doc_fiscale_id
                   WHERE fl.id = p_lotto_id;

                  IF NOT FOUND THEN
                      RETURN NULL;
                  END IF;

                  -- Motivi ostativi dei due verbi distruttivi, calcolati UNA
                  -- volta sola. Le fn sono pure: [] quando l'uscita e' lecita.
                  v_mot_annulla := script.fn_check_lotto_annullabile(p_lotto_id);
                  v_mot_riporta := script.fn_check_lotto_riportabile_a_draft(p_lotto_id);

                  -- Transizioni manuali disponibili dallo stato corrente.
                  -- ⚠️ Il predicato sulla matrice e' lo STESSO del guard vivo
                  -- (vendite.trgfn_fatturazione_lotti_guard_stato): ammesso,
                  -- solo_fattura = false, meta.tipo_lotto compatibile. Non si
                  -- filtra su solo_lotto: il guard non lo fa, e le righe del
                  -- lotto sono esattamente quelle non-solo_fattura.
                  SELECT COALESCE(
                      jsonb_agg(
                          jsonb_build_object(
                              'key',              t.meta->>'action_key',
                              'target_state',     sa.codice_interno,
                              'label_key',        t.meta->>'label_key',
                              'severity',         t.meta->>'severity',
                              'icon',             t.meta->>'icon',
                              'requires_confirm', COALESCE((t.meta->>'requires_confirm')::boolean, false),
                              'outlined',         COALESCE((t.meta->>'outlined')::boolean, false),
                              'enabled',          CASE t.meta->>'action_key'
                                                    WHEN 'annulla'         THEN jsonb_array_length(v_mot_annulla) = 0
                                                    WHEN 'riporta_a_draft' THEN jsonb_array_length(v_mot_riporta) = 0
                                                    ELSE true
                                                  END,
                              'reasons',          CASE t.meta->>'action_key'
                                                    WHEN 'annulla'         THEN v_mot_annulla
                                                    WHEN 'riporta_a_draft' THEN v_mot_riporta
                                                    ELSE '[]'::jsonb
                                                  END
                          )
                          ORDER BY sa.ordine
                      ),
                      '[]'::jsonb
                  )
                  INTO v_actions
                  FROM config.stati_doc_fiscale_transizioni t
                  JOIN config.stati_doc_fiscale sa ON sa.id = t.stato_to_id
                  WHERE t.stato_from_id = v_stato_id
                    AND t.ammesso IS TRUE
                    AND t.solo_fattura IS FALSE
                    AND ((t.meta->>'tipo_lotto') IS NULL OR (t.meta->>'tipo_lotto') = v_tipo_lotto)
                    AND COALESCE((t.meta->>'manuale')::boolean, false) IS TRUE
                    AND (t.meta->>'action_key') IS NOT NULL
                    AND (t.meta->>'label_key')  IS NOT NULL;

                  -- can_change_state sulle sole azioni ABILITATE e sulle sole
                  -- TRANSIZIONI: si calcola PRIMA di appendere la ristampa,
                  -- che non cambia stato. Con le azioni disabilitate ora
                  -- presenti in lista, un semplice array_length sarebbe
                  -- sempre true.
                  SELECT EXISTS (
                      SELECT 1
                        FROM jsonb_array_elements(v_actions) AS a
                       WHERE COALESCE((a->>'enabled')::boolean, true) IS TRUE
                  ) INTO v_can_change;

                  -- Ristampa massiva (C-8): azione applicativa, non transizione
                  -- — stampare e' leggere (I-4). Disponibile su lotto
                  -- DEFINITIVA, cioe' quando le fatture sono numerate.
                  IF v_stato_cod = 'DEFINITIVA' THEN
                      v_actions := v_actions || jsonb_build_array(
                          jsonb_build_object(
                              'key',              'ristampa',
                              'target_state',     NULL,
                              'label_key',        'vendite.lotti.azione_ristampa',
                              'severity',         'secondary',
                              'icon',             'pi pi-print',
                              'requires_confirm', true,
                              'outlined',         true,
                              'enabled',          true,
                              'reasons',          '[]'::jsonb
                          )
                      );
                  END IF;

                  RETURN jsonb_build_object(
                      'available_actions', v_actions,
                      'can_change_state',  v_can_change,
                      'stato_codice',      v_stato_cod,
                      'tipo_lotto',        v_tipo_lotto
                  );
              END;
              $function$;

              -- COMMENT e DROP esigono tipi RISOLTI: qui il %TYPE non si usa.
              COMMENT ON FUNCTION script.fn_available_actions_lotto(bigint)
              IS 'Capability del lotto di fatturazione per il detail API: available_actions + can_change_state + stato_codice + tipo_lotto. Ottava della famiglia fn_available_actions_*, mirror di fn_available_actions_commessa. I verbi numera / riporta_a_draft / annulla nascono DATA-DRIVEN da config.stati_doc_fiscale_transizioni (meta seedato il 2026-08-04) con lo STESSO predicato del guard vivo vendite.trgfn_fatturazione_lotti_guard_stato (ammesso + solo_fattura=false + meta.tipo_lotto compatibile): matrice e pulsanti non possono divergere. La ristampa e'' cablata perche'' non e'' una transizione (stampare e'' leggere, I-4) ed e'' disponibile su lotto DEFINITIVA. ATTENZIONE CONTRATTO: la presenza di un''azione in available_actions NON significa eseguibile — i consumatori devono leggere enabled e mostrare reasons; enabled/reasons di annulla e riporta_a_draft arrivano dalle funzioni PURE script.fn_check_lotto_annullabile / _riportabile_a_draft, le STESSE usate dalle fn di mutazione per sollevare. can_change_state e'' calcolato sulle sole azioni ABILITATE e sulle sole transizioni (la ristampa non cambia stato). 🔴 NON espone avanza_step / rilancia_step: quel gate (step successivo + criticita'' + rilancio dello stesso step, D-Q p.1) vive in LottoPipelineRunner e ricostruirlo qui sarebbe una seconda copia della regola. Fallback NULL se il lotto non esiste. rev 2026-08-04.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_available_actions_lotto(bigint);
