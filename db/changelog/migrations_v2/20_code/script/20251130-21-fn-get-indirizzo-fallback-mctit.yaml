databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20251130-21-fn-get-indirizzo-fallback-mctit.yaml

  - changeSet:
      id: 20251130-21-fn-get-indirizzo-fallback
      author: mctit
      comment: >
        Refactor script.fn_get_indirizzo per restituire un singolo indirizzo completo
        (stesso output esteso di script.fn_get_indirizzi_by_ruolo) per soggetto_ruolo e tipo_indirizzo
        identificato da config.tipi_indirizzi.codice_interno.
        Internamente delega a script.fn_get_indirizzi_by_ruolo e seleziona al massimo una riga.
        Integrazione con logica di fallback su config.tipi_ruolo_tipi_indirizzo.fallback_tipo_indirizzo_id

      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |



              CREATE OR REPLACE FUNCTION script.fn_get_indirizzo(
                  p_soggetto_ruolo_id bigint,
                  p_tipo_codice       character varying
              )
              RETURNS TABLE(
                  -- output principale (coerente con fn_get_indirizzi_by_ruolo)
                  tipo_indirizzo         varchar,
                  indirizzo_completo     text,
                  geoloc                 geometry,

                  -- base tecnica
                  indirizzo_id           bigint,
                  soggetto_ruolo_id      bigint,
                  tipo_indirizzo_id      integer,
                  indirizzo_dettaglio_id bigint,
                  indirizzo_libero       text,
                  is_normalizzato        boolean,

                  -- geografica strutturata
                  stato_id               integer,
                  stato_descrizione      varchar(100),
                  stato_iso2             char(2),

                  regione_id             integer,
                  regione_descrizione    varchar(80),

                  provincia_id           integer,
                  provincia_sigla        varchar(10),
                  provincia_descrizione  varchar(80),

                  comune_id              integer,
                  comune_descrizione     varchar(100),

                  codice_postale_id      integer,
                  cap_codice             char(10),

                  -- campi raw (internazionali / indirizzo libero)
                  locality               varchar(100),
                  administrative_area    varchar(100),
                  sublocality            varchar(100),
                  postal_box             varchar(20)
              )
              LANGUAGE sql
              COST 100
              STABLE PARALLEL UNSAFE
              ROWS 10
              AS $BODY$
              /*
                  Funzione: script.fn_get_indirizzo(p_soggetto_ruolo_id, p_tipo_codice)

                  Scopo:
                  Restituire UN solo indirizzo "migliore" per:
                  - soggetto_ruolo (p_soggetto_ruolo_id)
                  - tipo_indirizzo identificato da config.tipi_indirizzi.codice_interno (p_tipo_codice)

                  Comportamento:
                  - Delega la logica di composizione/fallback A/B/C a script.fn_get_indirizzi_by_ruolo(...),
                    che gestisce:
                      A) indirizzo normalizzato (indirizzo_dettaglio_id NON NULL)
                      B) indirizzo libero nazionale
                      C) indirizzo libero / estero
                  - Filtra per tipo_indirizzo = p_tipo_codice.
                  - Grazie al vincolo UNIQUE (soggetto_ruolo_id, tipo_indirizzo_id) su anagrafiche.indirizzi
                    ci si attende al massimo una riga per combinazione soggetto_ruolo/tipo.
                   Attenzione ho eliminato il LIMIT 1 per restituire comunque tutti i dati tecnici
                   anche in caso di anomalie (più indirizzi dello stesso tipo). In tal caso
                   la funzione restituirà più righe (da gestire a livello applicativo).
                  - Se non esiste alcun indirizzo per il tipo richiesto, verifica se esiste
                    una configurazione di fallback in config.tipi_ruolo_tipi_indirizzo.fallback_tipo_indirizzo_id
                    per il (tipo_ruolo del soggetto_ruolo, tipo_indirizzo richiesto).
                    In tal caso richiama nuovamente script.fn_get_indirizzi_by_ruolo(...)
                    per recuperare gli indirizzi del tipo di fallback.

                  Output:
                  - Stesso schema di fn_get_indirizzi_by_ruolo:
                    tipo_indirizzo, indirizzo_completo, geoloc,
                    id tecnici, flag is_normalizzato,
                    stato/regione/provincia/comune/CAP,
                    campi "raw" internazionali.
              */
              WITH
              -- 1) Indirizzi per il tipo richiesto
              base AS (
                  SELECT
                      f.*,
                      1 AS priority
                  FROM script.fn_get_indirizzi_by_ruolo(p_soggetto_ruolo_id) f
                  WHERE f.tipo_indirizzo = p_tipo_codice
              ),

              -- 2) Configurazione di fallback per (tipo_ruolo, tipo_indirizzo)
              fallback_conf AS (
                  SELECT
                      m.fallback_tipo_indirizzo_id
                  FROM anagrafiche.soggetti_ruoli sr
                  JOIN config.tipi_indirizzi ti_req
                      ON ti_req.codice_interno = p_tipo_codice
                  JOIN config.tipi_ruolo_tipi_indirizzo m
                      ON m.tipo_ruolo_id    = sr.tipo_ruolo_id
                    AND m.tipo_indirizzo_id = ti_req.id
                  WHERE sr.id = p_soggetto_ruolo_id
                    AND m.fallback_tipo_indirizzo_id IS NOT NULL
                  LIMIT 1
              ),

              -- 3) Indirizzi per il tipo di fallback (solo se base è vuota)
              fallback AS (
                  SELECT
                      f.*,
                      2 AS priority
                  FROM fallback_conf fc
                  JOIN config.tipi_indirizzi ti_fb
                      ON ti_fb.id = fc.fallback_tipo_indirizzo_id
                  JOIN script.fn_get_indirizzi_by_ruolo(p_soggetto_ruolo_id) f
                      ON f.tipo_indirizzo = ti_fb.codice_interno
                  WHERE NOT EXISTS (SELECT 1 FROM base)
              ),

              -- 4) Unione ordinata: prima il tipo richiesto, poi l’eventuale fallback
              all_rows AS (
                  SELECT * FROM base
                  UNION ALL
                  SELECT * FROM fallback
              )
              SELECT
                  tipo_indirizzo,
                  indirizzo_completo,
                  geoloc,
                  indirizzo_id,
                  soggetto_ruolo_id,
                  tipo_indirizzo_id,
                  indirizzo_dettaglio_id,
                  indirizzo_libero,
                  is_normalizzato,
                  stato_id,
                  stato_descrizione,
                  stato_iso2,
                  regione_id,
                  regione_descrizione,
                  provincia_id,
                  provincia_sigla,
                  provincia_descrizione,
                  comune_id,
                  comune_descrizione,
                  codice_postale_id,
                  cap_codice,
                  locality,
                  administrative_area,
                  sublocality,
                  postal_box
              FROM all_rows
              ORDER BY priority, tipo_indirizzo, indirizzo_id;
              $BODY$;

              COMMENT ON FUNCTION script.fn_get_indirizzo(bigint, character varying)
                IS 'Restituisce un singolo indirizzo completo per soggetto_ruolo e tipo (config.tipi_indirizzi.codice_interno).
                Delegata a fn_get_indirizzi_by_ruolo per la logica di composizione A/B/C e fallback (normalizzato, libero nazionale, estero).
                Output allineato a fn_get_indirizzi_by_ruolo (dati tecnici + struttura geografica + campi internazionali). 
                Integra logica di fallback su config.tipi_ruolo_tipi_indirizzo.fallback_tipo_indirizzo_id.';

  - changeSet:
      id: 20251201-01-fn-get-indirizzo-fallback
      author: mctit
      comment: >
        Restituisce uno o più indirizzi completi per soggetto_ruolo e tipo (config.tipi_indirizzi.codice_interno).
        Usa fn_get_indirizzi_by_ruolo per la composizione A/B/C (normalizzato, libero nazionale, estero).
        Integra logica di fallback multi-livello basata su config.tipi_ruolo_tipi_indirizzo.fallback_tipo_indirizzo_id,
        seguendo la catena finché non trova almeno un indirizzo o la catena termina / va in loop.
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |

              CREATE OR REPLACE FUNCTION script.fn_get_indirizzo(
                  p_soggetto_ruolo_id bigint,
                  p_tipo_codice       character varying
              )
              RETURNS TABLE(
                  tipo_indirizzo         character varying,
                  indirizzo_completo     text,
                  geoloc                 geometry,
                  indirizzo_id           bigint,
                  soggetto_ruolo_id      bigint,
                  tipo_indirizzo_id      integer,
                  indirizzo_dettaglio_id bigint,
                  indirizzo_libero       text,
                  is_normalizzato        boolean,
                  stato_id               integer,
                  stato_descrizione      character varying,
                  stato_iso2             character,
                  regione_id             integer,
                  regione_descrizione    character varying,
                  provincia_id           integer,
                  provincia_sigla        character varying,
                  provincia_descrizione  character varying,
                  comune_id              integer,
                  comune_descrizione     character varying,
                  codice_postale_id      integer,
                  cap_codice             character,
                  locality               character varying,
                  administrative_area    character varying,
                  sublocality            character varying,
                  postal_box             character varying
              )
              LANGUAGE plpgsql
              STABLE
              PARALLEL UNSAFE
              COST 100
              ROWS 10
              AS $function$
              /*
                  Funzione: script.fn_get_indirizzo(p_soggetto_ruolo_id, p_tipo_codice)

                  Nuova logica:
                  - Prova il tipo richiesto (p_tipo_codice).
                  - Se non trova indirizzi:
                      * legge da config.tipi_ruolo_tipi_indirizzo il fallback_tipo_indirizzo_id
                        per (tipo_ruolo del soggetto_ruolo, tipo_indirizzo corrente),
                      * risale la catena di fallback finché:
                          - trova almeno un indirizzo per un tipo, oppure
                          - la catena termina (fallback NULL), oppure
                          - rileva un loop nella catena (ciclo A→B→A).

                  Per ogni tipo provato, i dati vengono recuperati da:
                      script.fn_get_indirizzi_by_ruolo(p_soggetto_ruolo_id)
                Output:
                - Stesso schema di fn_get_indirizzi_by_ruolo:
                  tipo_indirizzo, indirizzo_completo, geoloc,
                  id tecnici, flag is_normalizzato,
                  stato/regione/provincia/comune/CAP,
                  campi "raw" internazionali.
              */

              DECLARE
                  v_tipo_ruolo_id      bigint;
                  v_current_codice     text := p_tipo_codice;
                  v_current_tipo_id    bigint;
                  v_fallback_tipo_id   bigint;
                  v_rows_found         integer;
                  v_visited_tipo_ids   bigint[] := '{}'::bigint[];
              BEGIN
                  -- Ricavo il tipo_ruolo legato al soggetto_ruolo
                  SELECT sr.tipo_ruolo_id
                  INTO v_tipo_ruolo_id
                  FROM anagrafiche.soggetti_ruoli sr
                  WHERE sr.id = p_soggetto_ruolo_id;

                  IF v_tipo_ruolo_id IS NULL THEN
                      -- soggetto_ruolo non valido: nessun indirizzo
                      RETURN;
                  END IF;

                  LOOP
                      -- 1) Provo il tipo corrente (v_current_codice)
                      RETURN QUERY
                      SELECT
                          f.tipo_indirizzo,
                          f.indirizzo_completo,
                          f.geoloc,
                          f.indirizzo_id,
                          f.soggetto_ruolo_id,
                          f.tipo_indirizzo_id,
                          f.indirizzo_dettaglio_id,
                          f.indirizzo_libero,
                          f.is_normalizzato,
                          f.stato_id,
                          f.stato_descrizione,
                          f.stato_iso2,
                          f.regione_id,
                          f.regione_descrizione,
                          f.provincia_id,
                          f.provincia_sigla,
                          f.provincia_descrizione,
                          f.comune_id,
                          f.comune_descrizione,
                          f.codice_postale_id,
                          f.cap_codice,
                          f.locality,
                          f.administrative_area,
                          f.sublocality,
                          f.postal_box
                      FROM script.fn_get_indirizzi_by_ruolo(p_soggetto_ruolo_id) f
                      WHERE f.tipo_indirizzo = v_current_codice;

                      GET DIAGNOSTICS v_rows_found = ROW_COUNT;

                      -- Se ho trovato almeno un indirizzo, ho finito
                      IF v_rows_found > 0 THEN
                          RETURN;
                      END IF;

                      -- 2) Nessun indirizzo per questo tipo: cerco fallback in matrice

                      -- Ricavo id del tipo_indirizzo corrente
                      SELECT ti.id
                      INTO v_current_tipo_id
                      FROM config.tipi_indirizzi ti
                      WHERE ti.codice_interno = v_current_codice;

                      IF v_current_tipo_id IS NULL THEN
                          -- Tipo non riconosciuto: non posso proseguire
                          RETURN;
                      END IF;

                      -- Protezione da loop nella catena di fallback
                      IF v_current_tipo_id = ANY (v_visited_tipo_ids) THEN
                          -- Rilevato ciclo A->B->A: esco senza risultati
                          RETURN;
                      END IF;

                      v_visited_tipo_ids := array_append(v_visited_tipo_ids, v_current_tipo_id);

                      -- Cerco il prossimo fallback per (tipo_ruolo, tipo_indirizzo corrente)
                      SELECT m.fallback_tipo_indirizzo_id
                      INTO v_fallback_tipo_id
                      FROM config.tipi_ruolo_tipi_indirizzo m
                      WHERE m.tipo_ruolo_id     = v_tipo_ruolo_id
                        AND m.tipo_indirizzo_id = v_current_tipo_id
                        AND m.attivo            = TRUE
                        AND (m.valido_dal IS NULL OR m.valido_dal <= current_date)
                        AND (m.valido_al  IS NULL OR m.valido_al  >= current_date)
                      LIMIT 1;

                      -- Nessun fallback configurato: esco senza risultati
                      IF v_fallback_tipo_id IS NULL THEN
                          RETURN;
                      END IF;

                      -- Traduco il fallback id in codice_interno per il prossimo ciclo
                      SELECT ti.codice_interno
                      INTO v_current_codice
                      FROM config.tipi_indirizzi ti
                      WHERE ti.id = v_fallback_tipo_id;

                      IF v_current_codice IS NULL THEN
                          -- Configurazione incoerente (id senza codice_interno): esco
                          RETURN;
                      END IF;

                      -- Loop: riprovo con il nuovo tipo (v_current_codice)
                  END LOOP;
              END;
              $function$;


              COMMENT ON FUNCTION script.fn_get_indirizzo(bigint, character varying)
                  IS 'Restituisce uno o più indirizzi completi per soggetto_ruolo e tipo (config.tipi_indirizzi.codice_interno).
                Usa fn_get_indirizzi_by_ruolo per la composizione A/B/C (normalizzato, libero nazionale, estero).
                Integra logica di fallback multi-livello basata su config.tipi_ruolo_tipi_indirizzo.fallback_tipo_indirizzo_id,
                seguendo la catena finché non trova almeno un indirizzo o la catena termina / va in loop.';
