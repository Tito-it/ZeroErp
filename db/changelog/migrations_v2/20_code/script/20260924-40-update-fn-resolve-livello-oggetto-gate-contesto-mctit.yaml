# P-2 — IL GATE DI CONTESTO CHE MANCAVA: script.fn_resolve_livello_oggetto
#   Brief: brief-db-magazzino-verbi-con-permesso, sezione 2.4
#   Decisione: D-5 di brief-db-permesso-nel-verbo-di-scrittura
#
# -- IL DIFETTO -----------------------------------------------------------------------------------
#   Il 2026-04-21 (changeSet 20260421-04) i resolver dei permessi sono stati resi
#   consapevoli del contesto: se app.ruolo_applicativo e' valorizzata e diversa da
#   OPERATORE, rispondono fail-closed. Il changeSet dichiarava «i 4 resolver»:
#   fn_resolve_livello_area, fn_check_azione_processo, fn_get_user_permissions_map,
#   fn_get_user_actions_map. fn_resolve_livello_oggetto non c'era — una
#   dimenticanza, non una scelta: il suo ramo di FALLBACK passa da
#   fn_resolve_livello_area e quindi aveva il gate, il ramo dell'OVERRIDE no.
#   ⇒ Un utente con un override per oggetto, in una veste diversa (portale,
#   shop) con lo stesso auth_user, riceveva il livello dell'override.
#   Il backend chiama questa funzione per ogni endpoint con un model
#   (PermissionResolver.get_livello_oggetto): il difetto e' vivo oggi.
#
# -- LA CORREZIONE -------------------------------------------------------------------------------
#   Passo 0, IDENTICO a quello di fn_resolve_livello_area (stessa GUC, stesso
#   cast, stesso esito BLOCCATO). La catena 1-4 non cambia.
#   ⚠️ GUC vuota (psql, test senza contesto): comportamento invariato, come nel
#   resolver d'area.
#
# -- LA FIRMA NON CAMBIA -------------------------------------------------------------------------
#   Stessi nomi e stessi tipi SCIOLTI (integer, character varying x3, RETURNS
#   config.livello_accesso): CREATE OR REPLACE senza DROP. I tipi si scrivono
#   ancorati con %TYPE (regola di Tid: firma, DECLARE, RETURNS), e si
#   sciolgono negli stessi di prima.
#   Doc auto-generata letta il 2026-09-24 come corpo di partenza.
#
# -- FUORI DA QUESTO CHANGESET, DICHIARATO -------------------------------------------------------
#   script.fn_get_user_object_permissions_map non ha il gate, ma non decide:
#   restituisce gli override cosi' come sono, e al 2026-09-24 il backend non la
#   chiama (solo un pgTAP). Segnalata nel brief, non toccata.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260924-40-update-fn-resolve-livello-oggetto-gate-contesto-mctit.yaml

  - changeSet:
      id: 20260924-40-update-fn-resolve-livello-oggetto-gate-contesto
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_resolve_livello_oggetto: passo 0, il gate di contesto dei resolver
        (app.ruolo_applicativo valorizzata e diversa da OPERATORE -> BLOCCATO), identico a
        fn_resolve_livello_area. Mancava dal 20260421-04: l'override per oggetto valeva anche fuori
        dalla veste operatore. Firma invariata. Brief: brief-db-magazzino-verbi-con-permesso §2.4.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script' AND p.proname = 'fn_resolve_livello_oggetto'
                 AND pg_get_function_identity_arguments(p.oid) =
                     'p_auth_user_id integer, p_app_label character varying, p_model_name character varying, p_area_schema_db character varying';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_resolve_livello_oggetto(
                  p_auth_user_id   config.user_override_oggetti.auth_user_id%TYPE,
                  p_app_label      config.user_override_oggetti.app_label%TYPE,
                  p_model_name     config.user_override_oggetti.model_name%TYPE,
                  p_area_schema_db config.aree_funzionali.schema_db%TYPE
              )
              RETURNS config.user_override_oggetti.livello%TYPE
              LANGUAGE plpgsql
              STABLE
              AS $function$
              DECLARE
                  v_livello   config.user_override_oggetti.livello%TYPE;
                  v_ctx_ruolo anagrafiche.identita_digitali.ruolo_applicativo%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Risolve il livello di accesso per un singolo model
                  --   Django (app_label + model_name). Se esiste un override
                  --   oggetto lo usa, altrimenti risale alla catena area
                  --   via fn_resolve_livello_area.
                  --
                  -- Catena (rev 2026-09-24, gate di contesto):
                  --   0. Gate GUC: se app.ruolo_applicativo popolata e
                  --      != OPERATORE -> BLOCCATO (fail-closed), come
                  --      fn_resolve_livello_area.
                  --   1. Assenza identita OPERATORE attiva -> BLOCCATO
                  --   2. fn_is_super_admin -> TUTTO
                  --   3. Override utente oggetto (se valido)
                  --   4. Fallback -> fn_resolve_livello_area
                  -- =========================================================

                  -- 0. Gate contesto GUC (fail-closed su non-OPERATORE).
                  v_ctx_ruolo := NULLIF(
                      current_setting('app.ruolo_applicativo', true), ''
                  )::config.ruolo_applicativo;

                  IF v_ctx_ruolo IS NOT NULL
                     AND v_ctx_ruolo <> 'OPERATORE'::config.ruolo_applicativo THEN
                      RETURN 'BLOCCATO'::config.livello_accesso;
                  END IF;

                  -- 1. Identita OPERATORE attiva.
                  IF NOT script.fn_has_identita_attiva(
                             p_auth_user_id,
                             'OPERATORE'::config.ruolo_applicativo) THEN
                      RETURN 'BLOCCATO'::config.livello_accesso;
                  END IF;

                  -- 2. Super admin? Bypass totale.
                  IF script.fn_is_super_admin(p_auth_user_id) THEN
                      RETURN 'TUTTO'::config.livello_accesso;
                  END IF;

                  -- 3. Override utente oggetto.
                  SELECT uoo.livello
                    INTO v_livello
                    FROM config.user_override_oggetti uoo
                   WHERE uoo.auth_user_id = p_auth_user_id
                     AND uoo.app_label    = p_app_label
                     AND uoo.model_name   = p_model_name
                     AND uoo.validita @> CURRENT_DATE;

                  IF FOUND THEN
                      RETURN v_livello;
                  END IF;

                  -- 4. Fallback alla catena area.
                  RETURN script.fn_resolve_livello_area(p_auth_user_id, p_area_schema_db);
              END
              $function$;

              COMMENT ON FUNCTION script.fn_resolve_livello_oggetto(integer, character varying, character varying, character varying) IS
                  'Risolve il livello di accesso per un model (app_label + model_name): override utente '
                  'per oggetto, altrimenti la catena d''area (fn_resolve_livello_area). Context-aware: '
                  'app.ruolo_applicativo valorizzata e diversa da OPERATORE -> BLOCCATO (passo 0, come '
                  'fn_resolve_livello_area; mancava dal 20260421-04 ed e'' stato aggiunto il 2026-09-24, '
                  'brief-db-magazzino-verbi-con-permesso §2.4). Poi: identita'' OPERATORE attiva, super '
                  'admin, override per oggetto valido, fallback d''area. La chiama il backend per gli '
                  'endpoint con un model (PermissionResolver.get_livello_oggetto).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Il corpo precedente, dalla doc auto-generata del 2026-09-24: senza passo 0.
              CREATE OR REPLACE FUNCTION script.fn_resolve_livello_oggetto(
                  p_auth_user_id integer, p_app_label character varying,
                  p_model_name character varying, p_area_schema_db character varying)
              RETURNS config.livello_accesso
              LANGUAGE plpgsql
              STABLE
              AS $function$
              DECLARE
                  v_livello config.user_override_oggetti.livello%TYPE;
              BEGIN
                  IF NOT script.fn_has_identita_attiva(p_auth_user_id, 'OPERATORE'::config.ruolo_applicativo) THEN
                      RETURN 'BLOCCATO'::config.livello_accesso;
                  END IF;
                  IF script.fn_is_super_admin(p_auth_user_id) THEN
                      RETURN 'TUTTO'::config.livello_accesso;
                  END IF;
                  SELECT uoo.livello INTO v_livello
                    FROM config.user_override_oggetti uoo
                   WHERE uoo.auth_user_id = p_auth_user_id
                     AND uoo.app_label    = p_app_label
                     AND uoo.model_name   = p_model_name
                     AND uoo.validita @> CURRENT_DATE;
                  IF FOUND THEN
                      RETURN v_livello;
                  END IF;
                  RETURN script.fn_resolve_livello_area(p_auth_user_id, p_area_schema_db);
              END
              $function$;
