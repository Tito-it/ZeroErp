# I domini muti: la nota di stato arriva anche qui — commessa.
#   Uno di quattro changeSet gemelli (20260811-01, 20260811-02, 20260811-03, 20260811-04):
#   contratto, reso, offerta, commessa. Slice §3 di
#   attivita-urgenti-del-10-08.md, aperta dalla
#   verifica del BE e decisa da Tid.
#
# 🔴 IL DIFETTO, e perche' e' peggiorato ieri. Questo dominio non emetteva
#   AFFATTO `stato_info_key`: la sua fn_available_actions_* non lo esponeva,
#   mentre il drawer del frontend lo legge gia' — il cablaggio c'era ed era
#   inerte. Fino a ieri la cosa si confondeva col comportamento generale
#   («la nota risponde alla barra vuota, e qui non compare mai»); da quando
#   la nota **spiega lo stato** e compare sempre (decisione §5 di Tid,
#   20260810-04/-05/-06), questi domini sono rimasti gli unici in cui uno
#   stato chiuso non dice niente. Verificato nel codice dal BE, non dedotto.
#
# ℹ️ COSA CAMBIA — gli stessi tre punti dei changeSet di ieri: una variabile,
#   una colonna nella SELECT di testata, un campo nel jsonb_build_object. La
#   funzione **raggiungeva gia'** la propria tabella di stato con un JOIN,
#   quindi non c'e' nessun JOIN nuovo da aggiungere.
#
# 🔴 LA PROPRIETA' NEL `meta` SI CHIAMA `nessuna_azione_key`, IL CAMPO DEL
#   BLOB `stato_info_key`. L'asimmetria e' voluta e va conosciuta:
#   `scripts/check_i18n_keys.py` trova le chiavi seminate **per quel nome**
#   (`RE_SEED_KEY` sui CSV, elenco `_PROP_KEY`), e rinominarla senza toccare
#   il guard nello stesso commit lo renderebbe **verde per cecita'** — non
#   rosso, verde. Rinominare anche la proprieta' e' una slice a se'.
#
# ⚠️ Il campo e' **sempre presente** nel blob, col valore a `null` quando non
#   si applica: filtrare con l'operatore di presenza risponde vero per TUTTI
#   i documenti. Va guardato il valore.
#
# ⚠️ EFFETTO MISURATO: **ZERO documenti**. Nessuna commessa e' oggi in
#   CHIUSA o ANNULLATA, quindi il ramo non ha soggetti vivi e non lo si
#   vedra' a video. Va fatto lo stesso — la regola del presidio pretende che
#   ogni stato in fase CHIUSO dichiari la sua chiave, e il giorno in cui la
#   prima commessa si chiude la nota c'e' gia' — ma va detto che qui il
#   verde non ha misurato niente.
#
# ⚠️ IL `lotto` NON E' IN QUESTA SLICE, ed e' una decisione: non ha una
#   tabella di stato propria, usa `config.stati_doc_fiscale` CONDIVISA con
#   `vendite.fatture` (8 FK). Il testo dovrebbe essere vero sia per un lotto
#   sia per una fattura, e `fn_available_actions_fattura` non esiste: meta'
#   dei consumatori non e' scritta. Restano dichiarati aperti.
#
# 🔴 CHIAVI i18n PER IL FE (dal seed di vendite/stati_commessa.csv), da tradurre: senza,
#   il guard `check_i18n_keys.py` resta rosso — ed e' voluto.
#
# Nessun'altra modifica al corpo.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260811-04-update-fn-available-actions-commessa-stato-info-key-mctit.yaml

  - changeSet:
      id: 20260811-04-update-fn-available-actions-commessa-stato-info-key
      author: mctit

      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        fn_available_actions_commessa: espone stato_info_key dal meta dello
        stato corrente, emesso sempre che lo stato lo dichiari. Il dominio
        era fra i cinque muti mentre il drawer leggeva gia' il campo.
      preConditions:
        - onFail: HALT
        - and:
            - columnExists:
                schemaName: vendite
                tableName: stati_commessa
                columnName: meta
            - columnExists:
                schemaName: vendite
                tableName: stati_commessa
                columnName: fase
            - sqlCheck:
                expectedResult: 1
                sql: >
                  SELECT count(*) FROM pg_proc p
                  JOIN pg_namespace n ON n.oid = p.pronamespace
                  WHERE n.nspname = 'script'
                    AND p.proname = 'fn_available_actions_commessa'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_available_actions_commessa(p_commessa_id vendite.commesse.id%TYPE)
               RETURNS jsonb
               LANGUAGE plpgsql
               STABLE
              AS $function$
              -- Scopo:
              --   Capability della commessa per il detail/stato API. Mirror
              --   data-driven di fn_available_actions_ordine, senza azioni
              --   applicative (solo stato). Le transizioni utente
              --   (meta.manuale=true + action_key/label_key) sono esposte come
              --   bottoni; le automatiche no.
              --   rev 2026-07-24: + enabled/reasons su chiudi/annulla, dalle
              --   funzioni pure script.fn_check_commessa_chiudibile /
              --   _annullabile — le STESSE che
              --   vendite.trgfn_commesse_guard_transizione usa per sollevare
              --   (sorgente unica: la UI non puo' divergere dal guard).
              --   rev 2026-08-04: stessa cosa per l'ingresso in
              --   PRONTA_FATTURAZIONE, che da oggi e' un'azione manuale
              --   (brief-db-emittibilita-visibile-e-sbloccabile §3.3).
              --   rev 2026-08-06: + target_state_descrizione, la forma leggibile
              --   dello stato di destinazione. Serve alla frase di conferma
              --   «portare il documento nello stato X»: il codice_interno non e'
              --   quella forma — PRONTA_FATTURAZIONE ne e' l'esempio piu' netto
              --   — e tradurlo nel FE sarebbe una seconda copia del vocabolario
              --   degli stati.
              --   rev 2026-08-11: + stato_info_key, la nota che spiega cosa sta
              --   succedendo quando il documento e' in uno stato chiuso. Arriva dal
              --   `meta` dello stato, e viene emessa SEMPRE che lo stato la dichiari —
              --   anche accanto a un'azione ancora abilitata: la nota spiega lo STATO,
              --   non risponde a una barra vuota (decisione §5 di Tid, gia' applicata a
              --   preventivo/ordine/DDT con 20260810-04/-05/-06). Questo dominio era
              --   fra i cinque che non emettevano affatto il campo, mentre il drawer lo
              --   legge gia': il cablaggio c'era ed era inerte.
              --   ⚠️ La PROPRIETA' nel meta si chiama `nessuna_azione_key` mentre il
              --   campo del blob si chiama `stato_info_key`. L'asimmetria e' voluta:
              --   scripts/check_i18n_keys.py trova le chiavi seminate per QUEL nome
              --   (RE_SEED_KEY sui CSV, elenco _PROP_KEY), e rinominarla senza toccare
              --   il guard lo renderebbe verde per cecita'.
              --   ⚠️ Il campo e' SEMPRE presente nel blob, col valore a null quando non
              --   si applica: filtrare per presenza risponde vero per tutti i documenti,
              --   va guardato il valore.
              --   brief-db-vie-uscita-operatore §12.6; attivita-urgenti-del-10-08 §3.
              DECLARE
                  v_stato_id      vendite.commesse.stato_commessa_id%TYPE;
                  v_stato_cod     vendite.stati_commessa.codice_interno%TYPE;
                  v_stato_info_key text;
                  v_modificabile  vendite.stati_commessa.modificabile%TYPE;
                  v_emittibile    vendite.stati_commessa.emittibile%TYPE;
                  v_actions       jsonb;
                  v_can_change    boolean := false;
                  v_mot_pronta    jsonb;
                  v_mot_chiudi    jsonb;
                  v_mot_annulla   jsonb;
              BEGIN
                  -- Stato corrente + flag governance (data-driven).
                  SELECT c.stato_commessa_id, sc.codice_interno, sc.modificabile, sc.emittibile,
                         sc.meta->>'nessuna_azione_key'
                    INTO v_stato_id, v_stato_cod, v_modificabile, v_emittibile, v_stato_info_key
                    FROM vendite.commesse c
                    JOIN vendite.stati_commessa sc ON sc.id = c.stato_commessa_id
                   WHERE c.id = p_commessa_id;

                  IF NOT FOUND THEN
                      RETURN NULL;
                  END IF;

                  -- Motivi ostativi alle destinazioni con regola di dominio,
                  -- calcolati UNA VOLTA SOLA e riusati sotto per enabled e
                  -- reasons. Le fn sono pure: ritornano [] quando e' lecito.
                  v_mot_pronta  := script.fn_check_commessa_pronta_fatturazione(p_commessa_id);
                  v_mot_chiudi  := script.fn_check_commessa_chiudibile(p_commessa_id);
                  v_mot_annulla := script.fn_check_commessa_annullabile(p_commessa_id);

                  -- Transizioni manuali (utente) disponibili dallo stato corrente.
                  -- Filtri: attivo, manuale=true, presenza action_key/label_key.
                  -- Le automatiche (manuale=false, senza action_key) sono escluse.
                  SELECT COALESCE(
                      jsonb_agg(
                          jsonb_build_object(
                              'key',              t.meta->>'action_key',
                              'target_state',     sa.codice_interno,
                              -- Forma leggibile della destinazione: la colonna
                              -- accanto, nello stesso JOIN. Il FE non puo'
                              -- derivarla dal codice (PRONTA_FATTURAZIONE).
                              'target_state_descrizione', sa.descrizione,
                              'label_key',        t.meta->>'label_key',
                              'severity',         t.meta->>'severity',
                              'icon',             t.meta->>'icon',
                              'requires_confirm', COALESCE((t.meta->>'requires_confirm')::boolean, false),
                              'outlined',         COALESCE((t.meta->>'outlined')::boolean, false),
                              'enabled',          CASE sa.codice_interno
                                                    WHEN 'PRONTA_FATTURAZIONE' THEN jsonb_array_length(v_mot_pronta)  = 0
                                                    WHEN 'CHIUSA'              THEN jsonb_array_length(v_mot_chiudi)  = 0
                                                    WHEN 'ANNULLATA'           THEN jsonb_array_length(v_mot_annulla) = 0
                                                    ELSE true
                                                  END,
                              'reasons',          CASE sa.codice_interno
                                                    WHEN 'PRONTA_FATTURAZIONE' THEN v_mot_pronta
                                                    WHEN 'CHIUSA'              THEN v_mot_chiudi
                                                    WHEN 'ANNULLATA'           THEN v_mot_annulla
                                                    ELSE '[]'::jsonb
                                                  END
                          )
                          ORDER BY sa.ordine
                      ),
                      '[]'::jsonb
                  )
                  INTO v_actions
                  FROM vendite.transizioni_stati_commessa t
                  JOIN vendite.stati_commessa sa ON sa.id = t.stato_a_id
                  WHERE t.stato_da_id = v_stato_id
                    AND t.attivo IS TRUE
                    AND COALESCE((t.meta->>'manuale')::boolean, false) IS TRUE
                    AND (t.meta->>'action_key') IS NOT NULL
                    AND (t.meta->>'label_key') IS NOT NULL;

                  -- can_change_state sulle sole azioni ABILITATE: con le azioni
                  -- disabilitate presenti in lista, jsonb_array_length(v_actions) > 0
                  -- sarebbe sempre true.
                  SELECT EXISTS (
                      SELECT 1
                        FROM jsonb_array_elements(v_actions) AS a
                       WHERE COALESCE((a->>'enabled')::boolean, true) IS TRUE
                  ) INTO v_can_change;

                  RETURN jsonb_build_object(
                      'available_actions', v_actions,
                      'can_change_state',  v_can_change,
                      'can_edit_righe',    v_modificabile,
                      'is_emittibile',     v_emittibile,
                      'stato_info_key',    v_stato_info_key,
                      'stato_codice',      v_stato_cod
                  );
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_available_actions_commessa(p_commessa_id bigint)
              IS 'Capability della commessa per il detail/stato API: azioni manuali disponibili dallo stato corrente, con enabled/reasons dalle funzioni pure fn_check_commessa_pronta_fatturazione / _chiudibile / _annullabile — le stesse usate dal guard di transizione, cosi'' la UI non puo'' divergere. rev 2026-08-04: aggiunta la destinazione PRONTA_FATTURAZIONE, diventata azione manuale. rev 2026-08-06: + target_state_descrizione accanto a target_state (vendite.stati_commessa.descrizione della destinazione). Serve alla frase di conferma «portare il documento nello stato X»: il codice_interno non e'' la forma leggibile — PRONTA_FATTURAZIONE e'' l''esempio piu'' netto della famiglia — e derivarla nel FE sarebbe una seconda copia del vocabolario degli stati. rev 2026-08-11: + stato_info_key, la nota di stato letta dal meta dello stato corrente ed emessa SEMPRE che lo stato la dichiari, anche accanto a un''azione ancora abilitata: la nota spiega lo STATO e non risponde a una barra vuota (decisione §5 di Tid, gia'' applicata a preventivo/ordine/DDT con 20260810-04/-05/-06). Questo dominio era fra i cinque che non emettevano affatto il campo mentre il drawer lo legge gia'': il cablaggio c''era ed era inerte. ⚠️ La PROPRIETA'' nel meta resta nessuna_azione_key mentre il campo del blob si chiama stato_info_key: scripts/check_i18n_keys.py trova le chiavi seminate per quel nome, e rinominarla senza toccare il guard lo renderebbe verde per cecita''. ⚠️ Il campo e'' SEMPRE presente nel blob, col valore a null quando non si applica: filtrare per presenza risponde vero per tutti i documenti, va guardato il valore. brief-db-vie-uscita-operatore §12.6; attivita-urgenti-del-10-08 §3.';
