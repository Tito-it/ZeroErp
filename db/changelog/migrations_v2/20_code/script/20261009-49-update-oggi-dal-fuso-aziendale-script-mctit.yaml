            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_get_permessi_effettivi_azioni(p_auth_user_id anagrafiche.identita_digitali.auth_user_id%TYPE, p_permission_codename config.azioni_processo.permission_codename%TYPE DEFAULT NULL::character varying)
               RETURNS TABLE(permission_codename config.azioni_processo.permission_codename%TYPE, azione_id config.azioni_processo.id%TYPE, area_id config.azioni_processo.area_id%TYPE, attivo config.azioni_processo.attivo%TYPE, abilitata_specifica config.user_override_azioni.abilitata%TYPE, livello_area config.user_override_aree.livello%TYPE, livello_minimo_area config.azioni_processo.livello_minimo_area%TYPE, abilitata config.user_override_azioni.abilitata%TYPE, limitata_da_area boolean)
               LANGUAGE plpgsql
               STABLE
              AS $function$
              -- Scopo: la catena delle azioni di processo di un operatore, col tetto d'area
              --   (brief-db-permessi-tetto-area). Sede unica: la leggono
              --   fn_check_azione_processo, fn_get_user_actions_map e il pannello permessi.
              DECLARE
                  v_ctx_ruolo    anagrafiche.identita_digitali.ruolo_applicativo%TYPE;
                  v_has_identita boolean;   -- flag calcolato (fn_has_identita_attiva)
                  v_is_super     boolean;   -- flag calcolato (fn_is_super_admin)
              BEGIN
                  -- 0. Gate contesto GUC (fail-closed su non-OPERATORE).
                  v_ctx_ruolo := NULLIF(
                      current_setting('app.ruolo_applicativo', true), ''
                  )::config.ruolo_applicativo;

                  IF v_ctx_ruolo IS NOT NULL
                     AND v_ctx_ruolo <> 'OPERATORE'::config.ruolo_applicativo THEN
                      v_has_identita := false;
                      v_is_super     := false;
                  ELSE
                      -- 1-2. Identita' OPERATORE attiva, super admin.
                      v_has_identita := script.fn_has_identita_attiva(
                                            p_auth_user_id,
                                            'OPERATORE'::config.ruolo_applicativo);
                      v_is_super     := v_has_identita
                                        AND script.fn_is_super_admin(p_auth_user_id);
                  END IF;

                  RETURN QUERY
                  WITH voci AS (
                      -- Tutto il catalogo (mappa, pannello).
                      SELECT ap.permission_codename AS v_codename, ap.id AS v_azione_id,
                             ap.area_id AS v_area_id, ap.attivo AS v_attivo,
                             ap.livello_minimo_area AS v_minimo
                        FROM config.azioni_processo ap
                       WHERE p_permission_codename IS NULL
                      UNION ALL
                      -- Una sola azione (resolver puntuale): la riga c'e' anche per un
                      -- codename fuori catalogo, e li' vale il default.
                      SELECT q.codename, ap.id, ap.area_id, ap.attivo, ap.livello_minimo_area
                        FROM (VALUES (p_permission_codename)) q(codename)
                        LEFT JOIN config.azioni_processo ap
                          ON ap.permission_codename = q.codename
                       WHERE p_permission_codename IS NOT NULL
                  ),
                  livelli AS (
                      -- Il livello d'area: dalla sede della catena d'area, una volta per area.
                      SELECT d.l_area_id,
                             script.fn_resolve_livello_area(p_auth_user_id, d.l_schema_db) AS l_livello
                        FROM (SELECT DISTINCT v.v_area_id AS l_area_id, af.schema_db AS l_schema_db
                                FROM voci v
                                JOIN config.aree_funzionali af ON af.id = v.v_area_id) d
                  ),
                  specifiche AS (
                      -- 3. La catena senza tetto: override valido -> profilo -> negata.
                      SELECT v.*, l.l_livello,
                             CASE
                                 WHEN NOT v_has_identita THEN false
                                 WHEN v_is_super          THEN true
                                 ELSE COALESCE(uoa.abilitata, e.abilitata, false)
                             END AS s_specifica
                        FROM voci v
                        LEFT JOIN livelli l
                          ON l.l_area_id = v.v_area_id
                        LEFT JOIN config.user_override_azioni uoa
                          ON uoa.auth_user_id = p_auth_user_id
                         AND uoa.azione_id    = v.v_azione_id
                         AND uoa.validita @> (SELECT script.fn_data_operativa())
                        LEFT JOIN script.fn_get_permessi_ereditati_azioni(p_auth_user_id) e
                          ON e.azione_id = v.v_azione_id
                  ),
                  effettive AS (
                      -- 4. Il tetto: il super admin lo precede, tutti gli altri lo subiscono.
                      SELECT s.*,
                             CASE
                                 WHEN v_is_super THEN true
                                 ELSE s.s_specifica
                                      AND script.fn_area_consente_azione(s.l_livello, s.v_minimo)
                             END AS s_effettiva
                        FROM specifiche s
                  )
                  SELECT f.v_codename, f.v_azione_id, f.v_area_id, f.v_attivo,
                         f.s_specifica, f.l_livello, f.v_minimo,
                         f.s_effettiva,
                         f.s_specifica AND NOT f.s_effettiva
                    FROM effettive f;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_get_permessi_effettivi_oggetti(p_auth_user_id config.user_override_oggetti.auth_user_id%TYPE, p_app_label config.user_override_oggetti.app_label%TYPE DEFAULT NULL::character varying, p_model_name config.user_override_oggetti.model_name%TYPE DEFAULT NULL::character varying)
               RETURNS TABLE(app_label config.area_model_overrides.app_label%TYPE, model_name config.area_model_overrides.model_name%TYPE, area_schema_db config.aree_funzionali.schema_db%TYPE, livello_override config.user_override_oggetti.livello%TYPE, livello_area config.user_override_aree.livello%TYPE, livello_specifico config.user_override_oggetti.livello%TYPE, livello config.user_override_oggetti.livello%TYPE, limitato_da_area boolean)
               LANGUAGE plpgsql
               STABLE
              AS $function$
              -- Scopo: la catena degli oggetti di un operatore, col tetto d'area
              --   (brief-db-permessi-tetto-area). Sede unica: la leggono
              --   fn_resolve_livello_oggetto, fn_get_user_object_permissions_map e il
              --   pannello permessi.
              DECLARE
                  v_ctx_ruolo    anagrafiche.identita_digitali.ruolo_applicativo%TYPE;
                  v_has_identita boolean;   -- flag calcolato (fn_has_identita_attiva)
                  v_is_super     boolean;   -- flag calcolato (fn_is_super_admin)
              BEGIN
                  -- 0. Gate contesto GUC (fail-closed su non-OPERATORE).
                  v_ctx_ruolo := NULLIF(
                      current_setting('app.ruolo_applicativo', true), ''
                  )::config.ruolo_applicativo;

                  IF v_ctx_ruolo IS NOT NULL
                     AND v_ctx_ruolo <> 'OPERATORE'::config.ruolo_applicativo THEN
                      v_has_identita := false;
                      v_is_super     := false;
                  ELSE
                      -- 1-2. Identita' OPERATORE attiva, super admin.
                      v_has_identita := script.fn_has_identita_attiva(
                                            p_auth_user_id,
                                            'OPERATORE'::config.ruolo_applicativo);
                      v_is_super     := v_has_identita
                                        AND script.fn_is_super_admin(p_auth_user_id);
                  END IF;

                  RETURN QUERY
                  WITH voci AS (
                      -- Tutto il catalogo degli oggetti (mappa di /me/, pannello).
                      SELECT amo.app_label AS v_app, amo.model_name AS v_modello
                        FROM config.area_model_overrides amo
                       WHERE p_app_label IS NULL AND p_model_name IS NULL
                      UNION ALL
                      -- Un solo oggetto (resolver puntuale), a catalogo o no.
                      SELECT p_app_label, p_model_name
                       WHERE p_app_label IS NOT NULL OR p_model_name IS NOT NULL
                  ),
                  con_area AS (
                      -- 3. L'area e' quella dell'oggetto, non quella del chiamante (R4).
                      SELECT v.v_app, v.v_modello,
                             script.fn_area_di_oggetto(v.v_app, v.v_modello) AS v_area
                        FROM voci v
                  ),
                  livelli AS (
                      SELECT d.l_area,
                             script.fn_resolve_livello_area(p_auth_user_id, d.l_area) AS l_livello
                        FROM (SELECT DISTINCT ca.v_area AS l_area FROM con_area ca) d
                  ),
                  grezzi AS (
                      SELECT ca.v_app, ca.v_modello, ca.v_area,
                             uoo.livello AS g_override, l.l_livello
                        FROM con_area ca
                        LEFT JOIN livelli l
                          ON l.l_area IS NOT DISTINCT FROM ca.v_area
                        LEFT JOIN config.user_override_oggetti uoo
                          ON uoo.auth_user_id = p_auth_user_id
                         AND uoo.app_label    = ca.v_app
                         AND uoo.model_name   = ca.v_modello
                         AND uoo.validita @> (SELECT script.fn_data_operativa())
                  ),
                  calcolo AS (
                      -- 4. Senza tetto (la catena di ieri) e col tetto.
                      SELECT g.*,
                             CASE
                                 WHEN NOT v_has_identita THEN 'BLOCCATO'::config.livello_accesso
                                 WHEN v_is_super          THEN 'TUTTO'::config.livello_accesso
                                 ELSE COALESCE(g.g_override, g.l_livello,
                                               'BLOCCATO'::config.livello_accesso)
                             END AS c_specifico,
                             CASE
                                 WHEN NOT v_has_identita THEN 'BLOCCATO'::config.livello_accesso
                                 WHEN v_is_super          THEN 'TUTTO'::config.livello_accesso
                                 ELSE script.fn_livello_con_tetto_area(g.g_override, g.l_livello)
                             END AS c_effettivo
                        FROM grezzi g
                  )
                  SELECT c.v_app, c.v_modello, c.v_area, c.g_override, c.l_livello,
                         c.c_specifico, c.c_effettivo,
                         c.c_effettivo IS DISTINCT FROM c.c_specifico
                    FROM calcolo c;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_get_user_permissions_map(p_auth_user_id anagrafiche.identita_digitali.auth_user_id%TYPE)
               RETURNS jsonb
               LANGUAGE plpgsql
               STABLE
              AS $function$
              DECLARE
                  v_has_identita boolean;   -- flag calcolato (fn_has_identita_attiva)
                  v_is_super     boolean;   -- flag calcolato (fn_is_super_admin)
                  v_ctx_ruolo    anagrafiche.identita_digitali.ruolo_applicativo%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Mappa livello accesso per tutte le aree funzionali
                  --   attive (single roundtrip). JSONB { "schema": "LIV", ... }.
                  --
                  -- Catena (context-aware dal 21-04-2026):
                  --   1. Guard parametro obbligatorio
                  --   2. Gate GUC: se app.ruolo_applicativo popolata e
                  --      != OPERATORE -> v_has_identita=false, v_is_super=false
                  --      (il CASE nel jsonb_object_agg produce BLOCCATO
                  --      per tutte le aree).
                  --   3. Altrimenti pre-calcolo dei due flag.
                  --   4. Per area attiva: override, poi ereditato
                  --      (fn_get_permessi_ereditati_aree), poi BLOCCATO.
                  -- Rev 20260925-85: l'ereditato non si ricalcola qui (erano le
                  -- CTE livelli_user/best_per_area): lo da' il building block,
                  -- sede unica dello spareggio e della veste OPERATORE (D-1, D-2).
                  -- =========================================================

                  -- 1. Guard parametro obbligatorio.
                  IF p_auth_user_id IS NULL OR p_auth_user_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'script.fn_get_user_permissions_map',
                          'E_ADMIN_VALIDAZIONE',
                          jsonb_build_object('p_auth_user_id', p_auth_user_id),
                          NULL::uuid,
                          'p_auth_user_id obbligatorio e > 0.'
                      );
                  END IF;

                  -- 2-3. Gate contesto GUC + pre-calcolo flag.
                  v_ctx_ruolo := NULLIF(
                      current_setting('app.ruolo_applicativo', true), ''
                  )::config.ruolo_applicativo;

                  IF v_ctx_ruolo IS NOT NULL
                     AND v_ctx_ruolo <> 'OPERATORE'::config.ruolo_applicativo THEN
                      -- Fail-closed: mappa produrra' BLOCCATO per ogni area.
                      v_has_identita := false;
                      v_is_super     := false;
                  ELSE
                      v_has_identita := script.fn_has_identita_attiva(
                                            p_auth_user_id,
                                            'OPERATORE'::config.ruolo_applicativo);
                      v_is_super     := script.fn_is_super_admin(p_auth_user_id);
                  END IF;

                  -- 4. Aggregazione jsonb: override, poi ereditato, poi BLOCCATO.
                  RETURN (
                      SELECT COALESCE(
                          jsonb_object_agg(
                              af.schema_db,
                              CASE
                                  WHEN NOT v_has_identita
                                      THEN 'BLOCCATO'
                                  WHEN v_is_super
                                      THEN 'TUTTO'
                                  ELSE COALESCE(
                                      uoa.livello,
                                      e.livello,
                                      'BLOCCATO'::config.livello_accesso
                                  )::text
                              END
                          ),
                          '{}'::jsonb
                      )
                        FROM config.aree_funzionali af
                        LEFT JOIN config.user_override_aree uoa
                          ON uoa.auth_user_id = p_auth_user_id
                         AND uoa.area_id = af.id
                         AND uoa.validita @> (SELECT script.fn_data_operativa())
                        LEFT JOIN script.fn_get_permessi_ereditati_aree(p_auth_user_id) e
                          ON e.area_id = af.id
                       WHERE af.attivo = TRUE
                  );
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_guard_utility_tipo_ruolo(p_utility_id config.utilities.id%TYPE, p_tipo_ruolo_id config.utilities_tipi_ruolo.tipo_ruolo_id%TYPE, p_context text DEFAULT NULL::text)
               RETURNS void
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_has_matrix BOOLEAN := false;
                  v_is_allowed BOOLEAN := false;
              BEGIN
                  -- Guard: parametri obbligatori e > 0
                  IF p_utility_id IS NULL OR p_utility_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          'script.fn_guard_utility_tipo_ruolo',
                          'E_ERRORE_PARAMETRI',
                          jsonb_build_object(
                              'detail', 'p_utility_id obbligatorio e > 0',
                              'p_utility_id', p_utility_id,
                              'context', p_context
                          ),
                          NULL::uuid,
                          concat('p_utility_id non valido: ', p_utility_id::text, ' context: ', p_context)
                      );
                  END IF;

                  IF p_tipo_ruolo_id IS NULL OR p_tipo_ruolo_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          'script.fn_guard_utility_tipo_ruolo',
                          'E_ERRORE_PARAMETRI',
                          jsonb_build_object(
                              'detail', 'p_tipo_ruolo_id obbligatorio e > 0',
                              'p_tipo_ruolo_id', p_tipo_ruolo_id,
                              'context', p_context
                          ),
                          NULL::uuid,
                          concat('p_tipo_ruolo_id non valido: ', p_tipo_ruolo_id::text, ' context: ', p_context)
                      );
                  END IF;

                  -- NOTA: le due query EXISTS sulla matrice hanno condizioni
                  -- identiche tranne tipo_ruolo_id. Scelta progettuale: si
                  -- mantengono separate per rendere esplicito il pattern a 2 step
                  -- (1: la matrice esiste? → fail-open se no; 2: il ruolo e'
                  -- ammesso? → fail-close se no). Unificarle in una sola query
                  -- con FILTER peggiorerebbe la leggibilita' senza beneficio
                  -- prestazionale (tabella config con poche righe).

                  -- 1) Esiste matrice attiva/valida per utility?
                  SELECT EXISTS (
                      SELECT 1
                        FROM config.utilities_tipi_ruolo m
                       WHERE m.utility_id = p_utility_id
                         AND m.attivo = true
                         AND (m.valido_dal IS NULL OR m.valido_dal <= (SELECT script.fn_data_operativa()))
                         AND (m.valido_al IS NULL OR m.valido_al >= (SELECT script.fn_data_operativa()))
                  )
                  INTO v_has_matrix;

                  -- Fail-open: nessuna regola attiva/valida → nessun vincolo
                  IF NOT v_has_matrix THEN
                      RETURN;
                  END IF;

                  -- 2) Matrice presente: il ruolo deve essere esplicitamente ammesso
                  SELECT EXISTS (
                      SELECT 1
                        FROM config.utilities_tipi_ruolo m
                       WHERE m.utility_id = p_utility_id
                         AND m.tipo_ruolo_id = p_tipo_ruolo_id
                         AND m.attivo = true
                         AND (m.valido_dal IS NULL OR m.valido_dal <= (SELECT script.fn_data_operativa()))
                         AND (m.valido_al IS NULL OR m.valido_al >= (SELECT script.fn_data_operativa()))
                  )
                  INTO v_is_allowed;

                  IF NOT v_is_allowed THEN
                      -- Fix: E_GENERICO → E_UTILITY_RUOLO_NON_AMMESSO
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          'script.fn_guard_utility_tipo_ruolo',
                          'E_UTILITY_RUOLO_NON_AMMESSO',
                          jsonb_build_object(
                              'utility_id', p_utility_id,
                              'tipo_ruolo_id', p_tipo_ruolo_id,
                              'context', p_context
                          ),
                          NULL::uuid,
                          p_tipo_ruolo_id::text,
                          p_utility_id::text
                      );
                  END IF;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_resolve_livello_area(p_auth_user_id anagrafiche.identita_digitali.auth_user_id%TYPE, p_area_schema_db config.aree_funzionali.schema_db%TYPE)
               RETURNS config.livello_accesso
               LANGUAGE plpgsql
               STABLE
              AS $function$
              DECLARE
                  v_livello    config.user_override_aree.livello%TYPE;
                  v_ctx_ruolo  anagrafiche.identita_digitali.ruolo_applicativo%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Risolve livello accesso area per un'area funzionale.
                  --
                  -- Catena (context-aware dal 21-04-2026):
                  --   0. Gate GUC: se app.ruolo_applicativo popolata e
                  --      != OPERATORE -> BLOCCATO (fail-closed).
                  --   1. Assenza identita OPERATORE attiva -> BLOCCATO
                  --   2. fn_is_super_admin -> TUTTO
                  --   3. Override utente area (se valido temporalmente)
                  --   4. Ereditato dal profilo: fn_get_permessi_ereditati_aree
                  --      (sola veste OPERATORE; AD_HOC 1 > REPARTO 2 > PORTALE 3)
                  --   5. Default -> BLOCCATO
                  -- Rev 20260925-83: il passo 4 non riscrive lo spareggio, lo
                  -- legge dal building block (sede unica, D-2) — e con esso la
                  -- veste OPERATORE (D-1): prima contavano i profili di tutte le
                  -- vesti dell'utente.
                  -- =========================================================

                  -- 0. Gate contesto GUC (fail-closed su non-OPERATORE).
                  v_ctx_ruolo := NULLIF(
                      current_setting('app.ruolo_applicativo', true), ''
                  )::config.ruolo_applicativo;

                  IF v_ctx_ruolo IS NOT NULL
                     AND v_ctx_ruolo <> 'OPERATORE'::config.ruolo_applicativo THEN
                      RETURN 'BLOCCATO'::config.livello_accesso;
                  END IF;

                  -- 1. Identita OPERATORE attiva (helper DRY).
                  IF NOT script.fn_has_identita_attiva(
                             p_auth_user_id,
                             'OPERATORE'::config.ruolo_applicativo) THEN
                      RETURN 'BLOCCATO'::config.livello_accesso;
                  END IF;

                  -- 2. Super admin? Bypass totale.
                  IF script.fn_is_super_admin(p_auth_user_id) THEN
                      RETURN 'TUTTO'::config.livello_accesso;
                  END IF;

                  -- 3. Override utente area (invariato).
                  SELECT uoa.livello
                    INTO v_livello
                    FROM config.user_override_aree uoa
                    JOIN config.aree_funzionali af ON af.id = uoa.area_id
                   WHERE uoa.auth_user_id = p_auth_user_id
                     AND af.schema_db = p_area_schema_db
                     AND uoa.validita @> (SELECT script.fn_data_operativa());

                  IF FOUND THEN
                      RETURN v_livello;
                  END IF;

                  -- 4. Ereditato dal profilo: una riga al massimo per area
                  --    (DISTINCT ON nel building block, schema_db unico).
                  SELECT e.livello
                    INTO v_livello
                    FROM script.fn_get_permessi_ereditati_aree(p_auth_user_id) e
                    JOIN config.aree_funzionali af
                      ON af.id = e.area_id
                   WHERE af.schema_db = p_area_schema_db;

                  IF FOUND THEN
                      RETURN v_livello;
                  END IF;

                  -- 5. Default sicuro.
                  RETURN 'BLOCCATO'::config.livello_accesso;
              END
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_veste_utilizzabile(p_identita_id anagrafiche.identita_digitali.id%TYPE)
               RETURNS boolean
               LANGUAGE sql
               STABLE
              BEGIN ATOMIC
               SELECT (EXISTS ( SELECT 1
                          FROM ((anagrafiche.identita_digitali idg
                            JOIN anagrafiche.soggetti_ruoli sr ON ((sr.id = idg.soggetto_ruolo_id)))
                            JOIN anagrafiche.soggetti s ON ((s.id = sr.soggetto_id)))
                         WHERE ((idg.id = fn_veste_utilizzabile.p_identita_id) AND idg.attivo AND (idg.valido_dal <= (SELECT script.fn_data_operativa())) AND ((idg.valido_al IS NULL) OR (idg.valido_al >= (SELECT script.fn_data_operativa()))) AND s.attivo AND ((idg.ruolo_applicativo <> 'OPERATORE'::config.ruolo_applicativo) OR idg.tecnica OR (EXISTS ( SELECT 1
                                  FROM anagrafiche.risorse_umane ru
                                 WHERE ((ru.soggetto_ruolo_id = idg.soggetto_ruolo_id) AND ru.attivo AND (ru.valido_dal <= (SELECT script.fn_data_operativa())) AND ((ru.valido_al IS NULL) OR (ru.valido_al >= (SELECT script.fn_data_operativa())))))))))) AS "exists";
              END;
