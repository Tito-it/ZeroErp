# COMMENT DI DIECI FUNZIONI DEL GIRO: APOSTROFI RADDOPPIATI DUE VOLTE
#   Brief: brief-db-veste-utilizzabile §7.4
#
#   La nota «Rev 2026-10-07» in coda al COMMENT di dieci funzioni del giro
#   (20261007-02, -03, -06, -07, -08, -11 … -15) e' stata scritta con gli
#   apostrofi gia' raddoppiati e poi raddoppiata di nuovo: nel testo vivo si legge
#   «e''» al posto di «e'». Solo testo: nessun corpo cambia. I COMMENT di -04, -05
#   e -09 li riscrivono -17, -18 e -21. Il COMMENT nuovo e' quello applicato con
#   ogni «''''» ridotto a «''» (provato uguale carattere per carattere).

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261007-22-fix-comment-apostrofi-veste-utilizzabile-mctit.yaml

  - changeSet:
      id: 20261007-22-fix-comment-apostrofi-veste-utilizzabile
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        COMMENT di dieci funzioni del giro: apostrofi raddoppiati due volte nella nota del 2026-10-07, corretti. Nessun corpo cambia. Brief: brief-db-veste-utilizzabile.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 10
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname || '.' || p.proname IN ('script.fn_has_identita_attiva', 'script.fn_is_super_admin_account', 'script.fn_get_profili_accesso_applicabili', 'script.fn_get_setup_status', 'anagrafiche.fn_sync_auth_user_is_active', 'script.fn_scope_cliente_ownership', 'script.fn_scope_fornitore_ownership', 'script.fn_scope_ba_ownership', 'script.fn_scope_ba_ownership_via_fattura', 'script.fn_scope_identita_processo');
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION script.fn_has_identita_attiva(anagrafiche.identita_digitali.auth_user_id%TYPE, anagrafiche.identita_digitali.ruolo_applicativo%TYPE) IS 'Verifica se la credenziale (auth_user_id) ha una veste del ruolo_applicativo dato utilizzabile oggi, secondo script.fn_veste_utilizzabile. Helper DRY per le funzioni di risoluzione permessi/scope (§4.6.B.0 WIP multi-face-auth). LANGUAGE sql STABLE, fail-closed su NULL. Rev 2026-10-07 (brief-db-veste-utilizzabile): la regola non e'' piu'' ricopiata qui, la legge da script.fn_veste_utilizzabile (soggetto attivo e, per l''operatore umano, rapporto attivo e nelle sue date compresi).';

              COMMENT ON FUNCTION script.fn_is_super_admin_account(anagrafiche.identita_digitali.auth_user_id%TYPE) IS 'La CREDENZIALE (django.auth_user.id) ha un binding SUPER_ADMIN attivo: identita'' OPERATORE attiva e valida oggi, binding e profilo attivi. Senza il cancello della veste: e'' la seconda delle due domande di script.fn_is_super_admin, che la chiede nel suo ramo ELSE (estratta il 2026-09-29, regola del 2). La usa da sola script.fn_totp_obbligatorio: l''obbligo del secondo fattore vale su tutte le porte, anche dove il bypass dei permessi non si accende. Non e'' la domanda dell''anti-lockout (fn_check_almeno_un_super_admin_attivo), che conta tutti gli amministratori raggiungibili. LANGUAGE sql, STABLE, INVOKER, inlineabile. Brief: brief-db-secondo-fattore-totp §2. Rev 2026-10-07 (brief-db-veste-utilizzabile): «identita'' OPERATORE attiva e valida oggi» si legge da script.fn_veste_utilizzabile, non da una copia di attivo + finestra.';

              COMMENT ON FUNCTION script.fn_get_profili_accesso_applicabili(anagrafiche.identita_digitali.auth_user_id%TYPE, anagrafiche.identita_digitali.ruolo_applicativo%TYPE) IS 'Profili applicabili a un auth_user, dal piu'' specifico al piu'' generale: AD_HOC priorita'' 1 (sull''identita''), REPARTO 2 (sull''unita'' organizzativa), PORTALE 3 (sulla veste). Rev 20260925-80 (D-3 di brief-db-pgtap-permessi-ereditati): PORTALE era 2, a pari merito col REPARTO, e sotto la veste OPERATORE lo spareggio per priorita'' sceglieva a caso. p_ruolo_applicativo NULL = tutte le vesti (legacy), valorizzato = solo quella veste; con una veste sola ogni priorita'' ha al massimo un profilo (indici unici dei binding e di risorse_umane). I resolver dei permessi da operatore passano ''OPERATORE'' tramite script.fn_get_permessi_ereditati_aree / _azioni (D-1). Rev 2026-10-02 (brief-db-be-fe-area-accessi R-DB-1): una veste spenta si riconosce solo da attivo; il controllo su DISABILITATO (rami AD_HOC e PORTALE) e'' caduto con il tipo. Rev 2026-10-07 (brief-db-veste-utilizzabile): la veste conta se e'' utilizzabile oggi (script.fn_veste_utilizzabile) in tutti e tre i rami; nel ramo REPARTO il controllo del rapporto (prima solo ru.attivo) e'' quello del building block, con le date.';

              COMMENT ON FUNCTION script.fn_get_setup_status() IS 'Stato di setup operatore-emittente in un singolo jsonb. Refactor §4.6.B.10: source of truth operatori = identita_digitali (OPERATORE attiva); admin = fn_is_super_admin. Rev 2026-10-07 (brief-db-veste-utilizzabile): un operatore conta se la sua veste e'' utilizzabile oggi (script.fn_veste_utilizzabile), non piu'' attivo + finestra ricopiati.';

              COMMENT ON FUNCTION anagrafiche.fn_sync_auth_user_is_active(anagrafiche.identita_digitali.auth_user_id%TYPE) IS 'Sincronizza django.auth_user.is_active via OR sulle N identita digitali dello stesso auth_user (modello SSO multi-veste post 20-04-2026). is_active=true se almeno una identita e'' utilizzabile (attiva, finestra valida, soggetto attivo). Return true se ha modificato auth_user. Rev 2026-10-02 (brief-db-be-fe-area-accessi R-DB-1): spenta si legge solo da attivo, il controllo su DISABILITATO e'' caduto con il tipo (chk_identita_digitali_ruolo_non_ritirato). Rev 2026-10-07 (brief-db-veste-utilizzabile): «utilizzabile» si legge da script.fn_veste_utilizzabile, che per l''operatore umano guarda anche il rapporto: la fine del rapporto scritta dal drawer spegne la credenziale se non resta un''altra veste utilizzabile.';

              COMMENT ON FUNCTION script.fn_scope_cliente_ownership(anagrafiche.identita_digitali.id%TYPE, anagrafiche.soggetti_ruoli.id%TYPE) IS 'Scope policy CLIENTE_OWNERSHIP: ritorna true se il soggetto_ruolo cliente target coincide con il soggetto_ruolo dell''identita e l''identita e'' in veste CLIENTE_PORTALE o SHOP_CUSTOMER attiva. STABLE, inlineable. Rev 2026-10-07 (brief-db-veste-utilizzabile): l''identita'' deve essere utilizzabile oggi (script.fn_veste_utilizzabile), non solo accesa: una veste scaduta non vede piu'' i suoi dati.';

              COMMENT ON FUNCTION script.fn_scope_fornitore_ownership(anagrafiche.identita_digitali.id%TYPE, anagrafiche.soggetti_ruoli.id%TYPE) IS 'Scope policy FORNITORE_OWNERSHIP: ritorna true se il soggetto_ruolo del fornitore target coincide con il soggetto_ruolo dell''identita e l''identita e'' in veste FORNITORE_PORTALE attiva. STABLE, inlineable. Rev 2026-10-07 (brief-db-veste-utilizzabile): l''identita'' deve essere utilizzabile oggi (script.fn_veste_utilizzabile), non solo accesa: una veste scaduta non vede piu'' i suoi dati.';

              COMMENT ON FUNCTION script.fn_scope_ba_ownership(anagrafiche.identita_digitali.id%TYPE, anagrafiche.billing_account.id%TYPE) IS 'Scope policy BA_OWNERSHIP ruolo-aware (post 20-04-2026): true se l''identita e'' in veste cliente (CLIENTE_PORTALE o SHOP_CUSTOMER) attiva e condivide il soggetto_ruolo col BA. Il filtro canale_origine e'' demandato alle policy RLS (portale B2B senza filtro, shop con canale=SHOP). STABLE, inlineable, fail-closed. Rev 2026-10-07 (brief-db-veste-utilizzabile): «attiva» e'' diventata «utilizzabile oggi» (script.fn_veste_utilizzabile): una veste scaduta non vede piu'' i suoi dati.';

              COMMENT ON FUNCTION script.fn_scope_ba_ownership_via_fattura(anagrafiche.identita_digitali.id%TYPE, vendite.fatture.id%TYPE) IS 'Scope policy BA_OWNERSHIP via fattura: ritorna true se il billing_account della fattura target appartiene al soggetto_ruolo dell''identita (via BA.soggetto_ruolo_id). Wrapper per tabelle figlie senza billing_account_id diretto (es. vendite.fatture_scadenze). STABLE, inlineable. Rev 2026-10-07 (brief-db-veste-utilizzabile): l''identita'' deve essere utilizzabile oggi (script.fn_veste_utilizzabile), non solo accesa.';

              COMMENT ON FUNCTION script.fn_scope_identita_processo(anagrafiche.identita_digitali.auth_user_id%TYPE, dbops.processi.codice%TYPE) IS 'Dice se p_auth_user_id e'' l''identita'' tecnica VIVA del processo p_processo_codice. ⭐ Nasce il 2026-09-05 per togliere due copie dello stesso EXISTS dalla policy rls_email_outbox_ambito (USING e WITH CHECK): la famiglia duplica anche altrove, ma li'' e'' UNA CHIAMATA, e due chiamate identiche non possono divergere — dieci righe si''. ⭐ E la regola e'' piu'' stretta di quella che sostituisce: guarda CINQUE livelli (legame attivo, processo vivo, identita'' attiva, ruolo OPERATORE, utente Django attivo) invece del solo legame, perche'' un''identita'' revocata a un livello solo avrebbe continuato a leggere. ⚠️ L''emittente non entra: qui si chiede «chi sei», non «su quale azienda lavori» — quello e'' dbops.vw_processi_roster, e legarli toglierebbe la lettura delle email di SISTEMA, che di azienda non ne hanno. ⚠️ LANGUAGE sql STABLE perche'' una policy si valuta per riga e il pianificatore la puo'' incorporare. ⛔ Niente STRICT: con un parametro NULL l''EXISTS non trova niente e la funzione torna false — fail-closed per costruzione, non per coincidenza. ⚠️ django.* si attraversa da script.fn_get_auth_user_stato (plpgsql, late-bound), mai da una vista: regola presa col changeSet 20260905-30. Rev 2026-10-07 (brief-db-veste-utilizzabile): il livello «identita'' attiva» e'' diventato «identita'' utilizzabile oggi» (script.fn_veste_utilizzabile: accesa, nelle sue date, soggetto attivo; l''identita'' tecnica non pretende un rapporto).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION script.fn_has_identita_attiva(anagrafiche.identita_digitali.auth_user_id%TYPE, anagrafiche.identita_digitali.ruolo_applicativo%TYPE) IS 'Verifica se la credenziale (auth_user_id) ha una veste del ruolo_applicativo dato utilizzabile oggi, secondo script.fn_veste_utilizzabile. Helper DRY per le funzioni di risoluzione permessi/scope (§4.6.B.0 WIP multi-face-auth). LANGUAGE sql STABLE, fail-closed su NULL. Rev 2026-10-07 (brief-db-veste-utilizzabile): la regola non e'''' piu'''' ricopiata qui, la legge da script.fn_veste_utilizzabile (soggetto attivo e, per l''''operatore umano, rapporto attivo e nelle sue date compresi).';

              COMMENT ON FUNCTION script.fn_is_super_admin_account(anagrafiche.identita_digitali.auth_user_id%TYPE) IS 'La CREDENZIALE (django.auth_user.id) ha un binding SUPER_ADMIN attivo: identita'' OPERATORE attiva e valida oggi, binding e profilo attivi. Senza il cancello della veste: e'' la seconda delle due domande di script.fn_is_super_admin, che la chiede nel suo ramo ELSE (estratta il 2026-09-29, regola del 2). La usa da sola script.fn_totp_obbligatorio: l''obbligo del secondo fattore vale su tutte le porte, anche dove il bypass dei permessi non si accende. Non e'' la domanda dell''anti-lockout (fn_check_almeno_un_super_admin_attivo), che conta tutti gli amministratori raggiungibili. LANGUAGE sql, STABLE, INVOKER, inlineabile. Brief: brief-db-secondo-fattore-totp §2. Rev 2026-10-07 (brief-db-veste-utilizzabile): «identita'''' OPERATORE attiva e valida oggi» si legge da script.fn_veste_utilizzabile, non da una copia di attivo + finestra.';

              COMMENT ON FUNCTION script.fn_get_profili_accesso_applicabili(anagrafiche.identita_digitali.auth_user_id%TYPE, anagrafiche.identita_digitali.ruolo_applicativo%TYPE) IS 'Profili applicabili a un auth_user, dal piu'' specifico al piu'' generale: AD_HOC priorita'' 1 (sull''identita''), REPARTO 2 (sull''unita'' organizzativa), PORTALE 3 (sulla veste). Rev 20260925-80 (D-3 di brief-db-pgtap-permessi-ereditati): PORTALE era 2, a pari merito col REPARTO, e sotto la veste OPERATORE lo spareggio per priorita'' sceglieva a caso. p_ruolo_applicativo NULL = tutte le vesti (legacy), valorizzato = solo quella veste; con una veste sola ogni priorita'' ha al massimo un profilo (indici unici dei binding e di risorse_umane). I resolver dei permessi da operatore passano ''OPERATORE'' tramite script.fn_get_permessi_ereditati_aree / _azioni (D-1). Rev 2026-10-02 (brief-db-be-fe-area-accessi R-DB-1): una veste spenta si riconosce solo da attivo; il controllo su DISABILITATO (rami AD_HOC e PORTALE) e'' caduto con il tipo. Rev 2026-10-07 (brief-db-veste-utilizzabile): la veste conta se e'''' utilizzabile oggi (script.fn_veste_utilizzabile) in tutti e tre i rami; nel ramo REPARTO il controllo del rapporto (prima solo ru.attivo) e'''' quello del building block, con le date.';

