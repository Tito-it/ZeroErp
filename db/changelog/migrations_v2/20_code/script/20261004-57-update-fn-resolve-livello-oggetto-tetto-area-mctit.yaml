# R4 — fn_resolve_livello_oggetto: L'AREA E' UN TETTO, ED E' QUELLA DELL'OGGETTO
#   Brief: brief-db-permessi-tetto-area, sezioni 1, 3 (D-1, D-3) e 4 (R4)
#
#   Fino a ieri l'override sull'oggetto SOSTITUIVA l'area (passo 3 -> RETURN): TUTTO su
#   anagrafiche.cliente con Anagrafiche BLOCCATO => accesso pieno. Ora il livello e' il piu'
#   restrittivo fra override e area (script.fn_livello_con_tetto_area), letto dalla sede
#   comune script.fn_get_permessi_effettivi_oggetti (-54), con la mappa e il pannello.
#
#   ⭐ L'AREA LA RICAVA LA FUNZIONE (script.fn_area_di_oggetto), non il chiamante: col tetto
#   un'area sbagliata sarebbe un tetto sbagliato. p_area_schema_db e' SUPERATO ma RESTA
#   nella firma: il backend passa i parametri per posizione, e togliere il quarto rompe
#   ogni punto di chiamata e i pgTAP, mentre tenerlo non ne tocca nessuno. Oggi il
#   backend gli passa gia' get_area_schema_db(app_label, model_name), la stessa regola di
#   fn_area_di_oggetto: per lui non cambia niente. Il ritiro lo decide Tid (brief §9).
#
#   ⚠️ Oggetto NULL (app e model) -> BLOCCATO anche per il super admin (prima: il livello
#   dell'area passata). Chiamata rotta: fn_guard_livello non la fa, il backend nemmeno.
#   Lo eredita script.fn_guard_livello, senza modifiche (R7).
#   Firma invariata, CREATE OR REPLACE. Rollback: il corpo vivo (20260924-40).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261004-57-update-fn-resolve-livello-oggetto-tetto-area-mctit.yaml

  - changeSet:
      id: 20261004-57-update-fn-resolve-livello-oggetto-tetto-area
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_resolve_livello_oggetto: L'AREA E' UN TETTO, ED E' QUELLA DELL'OGGETTO. Brief:
        brief-db-permessi-tetto-area.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script' AND p.proname IN ('fn_get_permessi_effettivi_oggetti');
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_resolve_livello_oggetto(
                  p_auth_user_id   config.user_override_oggetti.auth_user_id%TYPE,
                  p_app_label      config.user_override_oggetti.app_label%TYPE,
                  p_model_name     config.user_override_oggetti.model_name%TYPE,
                  p_area_schema_db config.aree_funzionali.schema_db%TYPE
              )
              RETURNS config.user_override_oggetti.livello%TYPE
              LANGUAGE plpgsql
              STABLE
              SECURITY INVOKER
              AS $function$
              DECLARE
                  v_livello config.user_override_oggetti.livello%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Risolve il livello di accesso per un singolo model
                  --   Django (app_label + model_name), col tetto d'area.
                  --
                  -- Catena (rev 20261004-57, brief-db-permessi-tetto-area):
                  --   la legge da script.fn_get_permessi_effettivi_oggetti, sede
                  --   unica: gate di contesto, identita' OPERATORE attiva, super
                  --   admin (prima del tetto), poi il piu' restrittivo fra
                  --   l'override sull'oggetto e il livello della SUA area
                  --   (script.fn_area_di_oggetto, script.fn_livello_con_tetto_area).
                  --
                  -- ⚠️ p_area_schema_db e' SUPERATO (R4): l'area la ricava la
                  --   funzione dall'oggetto, perche' col tetto un'area sbagliata
                  --   sarebbe un tetto sbagliato. Il parametro resta nella firma
                  --   (i chiamanti passano per posizione); il ritiro lo decide Tid.
                  -- =========================================================

                  -- Nessun oggetto: niente da risolvere, BLOCCATO. Senza questa riga
                  -- la sede comune leggerebbe i due NULL come «tutto il catalogo».
                  IF p_app_label IS NULL AND p_model_name IS NULL THEN
                      RETURN 'BLOCCATO'::config.livello_accesso;
                  END IF;

                  SELECT e.livello
                    INTO v_livello
                    FROM script.fn_get_permessi_effettivi_oggetti(
                             p_auth_user_id, p_app_label, p_model_name) e;

                  RETURN COALESCE(v_livello, 'BLOCCATO'::config.livello_accesso);
              END
              $function$;

              COMMENT ON FUNCTION script.fn_resolve_livello_oggetto(config.user_override_oggetti.auth_user_id%TYPE, config.user_override_oggetti.app_label%TYPE, config.user_override_oggetti.model_name%TYPE, config.aree_funzionali.schema_db%TYPE) IS
                  'Risolve il livello di accesso per un model (app_label + model_name) col TETTO D''AREA: il piu'' restrittivo fra l''override utente sull''oggetto e il livello della sua area (l''override puo'' solo restringere, mai allargare). Legge la catena da script.fn_get_permessi_effettivi_oggetti (sede unica, con fn_get_user_object_permissions_map e il pannello permessi): gate di contesto (app.ruolo_applicativo diversa da OPERATORE -> BLOCCATO), identita'' OPERATORE attiva, super admin -> TUTTO (prima del tetto), area dell''oggetto da script.fn_area_di_oggetto, script.fn_livello_con_tetto_area. ⚠️ p_area_schema_db e'' superato: l''area la ricava la funzione e il parametro non si legge piu'' (resta in firma, il ritiro lo decide Tid). Oggetto NULL -> BLOCCATO. La chiamano il backend (PermissionResolver.get_livello_oggetto) e script.fn_guard_livello. Rev 20261004-57 (brief-db-permessi-tetto-area R4).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_resolve_livello_oggetto(p_auth_user_id integer, p_app_label character varying, p_model_name character varying, p_area_schema_db character varying)
               RETURNS config.livello_accesso
               LANGUAGE plpgsql
               STABLE
              AS $function$
              DECLARE
                  v_livello   config.user_override_oggetti.livello%TYPE;
                  v_ctx_ruolo anagrafiche.identita_digitali.ruolo_applicativo%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Risolve il livello di accesso per un singolo model
                  --   Django (app_label + model_name). Se esiste un override
                  --   oggetto lo usa, altrimenti risale alla catena area
                  --   via fn_resolve_livello_area.
                  --
                  -- Catena (rev 2026-09-24, gate di contesto):
                  --   0. Gate GUC: se app.ruolo_applicativo popolata e
                  --      != OPERATORE -> BLOCCATO (fail-closed), come
                  --      fn_resolve_livello_area.
                  --   1. Assenza identita OPERATORE attiva -> BLOCCATO
                  --   2. fn_is_super_admin -> TUTTO
                  --   3. Override utente oggetto (se valido)
                  --   4. Fallback -> fn_resolve_livello_area
                  -- =========================================================

                  -- 0. Gate contesto GUC (fail-closed su non-OPERATORE).
                  v_ctx_ruolo := NULLIF(
                      current_setting('app.ruolo_applicativo', true), ''
                  )::config.ruolo_applicativo;

                  IF v_ctx_ruolo IS NOT NULL
                     AND v_ctx_ruolo <> 'OPERATORE'::config.ruolo_applicativo THEN
                      RETURN 'BLOCCATO'::config.livello_accesso;
                  END IF;

                  -- 1. Identita OPERATORE attiva.
                  IF NOT script.fn_has_identita_attiva(
                             p_auth_user_id,
                             'OPERATORE'::config.ruolo_applicativo) THEN
                      RETURN 'BLOCCATO'::config.livello_accesso;
                  END IF;

                  -- 2. Super admin? Bypass totale.
                  IF script.fn_is_super_admin(p_auth_user_id) THEN
                      RETURN 'TUTTO'::config.livello_accesso;
                  END IF;

                  -- 3. Override utente oggetto.
                  SELECT uoo.livello
                    INTO v_livello
                    FROM config.user_override_oggetti uoo
                   WHERE uoo.auth_user_id = p_auth_user_id
                     AND uoo.app_label    = p_app_label
                     AND uoo.model_name   = p_model_name
                     AND uoo.validita @> CURRENT_DATE;

                  IF FOUND THEN
                      RETURN v_livello;
                  END IF;

                  -- 4. Fallback alla catena area.
                  RETURN script.fn_resolve_livello_area(p_auth_user_id, p_area_schema_db);
              END
              $function$;

              COMMENT ON FUNCTION script.fn_resolve_livello_oggetto(p_auth_user_id integer, p_app_label character varying, p_model_name character varying, p_area_schema_db character varying)
              IS 'Risolve il livello di accesso per un model (app_label + model_name): override utente per oggetto, altrimenti la catena d''area (fn_resolve_livello_area). Context-aware: app.ruolo_applicativo valorizzata e diversa da OPERATORE -> BLOCCATO (passo 0, come fn_resolve_livello_area; mancava dal 20260421-04 ed e'' stato aggiunto il 2026-09-24, brief-db-magazzino-verbi-con-permesso §2.4). Poi: identita'' OPERATORE attiva, super admin, override per oggetto valido, fallback d''area. La chiama il backend per gli endpoint con un model (PermissionResolver.get_livello_oggetto).';
