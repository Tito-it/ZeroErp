# ------------------------------------------------------------
# IL BUILDER LEGGE LO STATO INIZIALE DALLA TESTATA
#   Brief: brief-modello-documento-vendita §15.13 (K-3, Tid 2026-10-27).
#
#   dbops.fn_pgtap_crea_ddt_riconsegna leggeva lo stato iniziale passando il vocabolario
#   (config.stati_doc_ddt) accanto alla testata (vendite.ddt): una copia della mappa
#   script.fn_doc_stato_modello. Ora lo legge dalla testata con
#   script.fn_doc_stato_iniziale_id (20261027-29). Nient'altro cambia.
#
#   Corpo dall'ultimo changeSet (20261025-06-create-fn-pgtap-crea-ddt-riconsegna), verificato uguale al corpo
#   vivo (pg_get_functiondef sullo scratch, 2026-10-27): la firma tiene i
#   %TYPE che la doc auto-generata scioglie. Firma invariata; GRANT
#   restano (CREATE OR REPLACE), il COMMENT riceve la sua riga «Rev».
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261027-36-update-fn-pgtap-crea-ddt-riconsegna-stato-iniziale-dalla-testata-mctit.yaml

  - changeSet:
      id: 20261027-36-update-fn-pgtap-crea-ddt-riconsegna-stato-iniziale-dalla-testata
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.fn_pgtap_crea_ddt_riconsegna: lo stato iniziale dalla testata (vendite.ddt) con
        script.fn_doc_stato_iniziale_id, non dal vocabolario.
        Brief: brief-modello-documento-vendita §15.13.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script' AND p.proname = 'fn_doc_stato_iniziale_id';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_pgtap_crea_ddt_riconsegna(
                   p_reso_id              vendite.resi.id%TYPE,
                   p_stato_codice_interno config.stati_doc_ddt.codice_interno%TYPE DEFAULT 'CONSEGNATO',
                   p_resi_riga_id         vendite.resi_righe.id%TYPE DEFAULT NULL,
                   p_quantita             vendite.ddt_righe.qta_operativa%TYPE DEFAULT NULL,
                   p_data                 vendite.ddt.data%TYPE DEFAULT NULL,
                   p_causale_codice       config.causali_trasporto.codice%TYPE DEFAULT 'VENDITA')
               RETURNS TABLE(
                   ddt_id           vendite.ddt.id%TYPE,
                   ddt_uid          vendite.ddt.uid%TYPE,
                   ddt_riga_id      vendite.ddt_righe.id%TYPE,
                   quantita         vendite.ddt_righe.quantita%TYPE,
                   stato_doc_ddt_id vendite.ddt.stato_doc_ddt_id%TYPE)
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              -- Scopo: dare a una fixture pgTAP la BOLLA DI RI-CONSEGNA di un
              --   reso per ri-consegna confermato, nello stato chiesto (default
              --   CONSEGNATO), per la strada vera del dominio.
              -- Uso:
              --   CREATE TEMP TABLE tmp_ric AS
              --   SELECT * FROM dbops.fn_pgtap_crea_ddt_riconsegna(
              --              (SELECT reso_id FROM tmp_r), p_resi_riga_id => (SELECT resi_riga_id FROM tmp_r),
              --              p_quantita => 2, p_data => DATE '2026-09-01');
              -- ⛔ Restituisce la PRIMA riga della bolla: con piu' righe il test
              --   le legge da se'.
              -- ⚠️ Esce con i vincoli IMMEDIATE, come ogni helper.
              DECLARE
                  v_stato_id   config.stati_doc_ddt.id%TYPE;
                  v_abortito   config.stati_doc_ddt.is_abortito%TYPE;
                  v_causale_id config.causali_trasporto.id%TYPE;
                  v_righe      jsonb;      -- la grammatica della madre
                  v_ddt        vendite.ddt.id%TYPE;
              BEGIN
                  -- 0. I parametri si giudicano PRIMA di costruire.
                  SELECT s.id, s.is_abortito INTO v_stato_id, v_abortito
                    FROM config.stati_doc_ddt s
                   WHERE s.codice_interno = p_stato_codice_interno
                     AND s.attivo IS TRUE;
                  IF v_stato_id IS NULL THEN
                      RAISE EXCEPTION
                          'fn_pgtap_crea_ddt_riconsegna: nessuno stato attivo della bolla con codice_interno = %',
                          coalesce(p_stato_codice_interno::text, 'NULL');
                  END IF;
                  IF v_abortito THEN
                      RAISE EXCEPTION
                          'fn_pgtap_crea_ddt_riconsegna: % e'' uno stato abortito — la bolla di ri-consegna ha i legami e si annulla col verbo vendite.fn_annulla_ddt: chiedere EMESSO e annullare dal test',
                          p_stato_codice_interno;
                  END IF;

                  SELECT c.id INTO v_causale_id
                    FROM config.causali_trasporto c
                   WHERE c.codice = p_causale_codice
                     AND c.attivo IS TRUE;
                  IF v_causale_id IS NULL THEN
                      RAISE EXCEPTION
                          'fn_pgtap_crea_ddt_riconsegna: nessuna causale di trasporto attiva con codice = %',
                          coalesce(p_causale_codice::text, 'NULL');
                  END IF;

                  -- La quantita' vale per UNA riga del reso: le due si danno insieme.
                  IF (p_resi_riga_id IS NULL) <> (p_quantita IS NULL) THEN
                      RAISE EXCEPTION
                          'fn_pgtap_crea_ddt_riconsegna: p_resi_riga_id e p_quantita vanno insieme (senza, si ri-consegna tutto il reso)';
                  END IF;

                  -- 1. La bolla dalla madre.
                  v_righe := CASE WHEN p_resi_riga_id IS NOT NULL THEN
                                 jsonb_build_array(jsonb_build_object(
                                     'resi_riga_id', p_resi_riga_id, 'qta', p_quantita))
                             END;
                  v_ddt := vendite.fn_genera_ddt_riconsegna(p_reso_id, v_righe, p_data);

                  -- 2. Cio' che l'emissione pretende e la madre non ha portato.
                  UPDATE vendite.ddt d
                     SET causale_trasporto_id = v_causale_id
                   WHERE d.id = v_ddt
                     AND d.causale_trasporto_id IS NULL;

                  INSERT INTO vendite.ddt_indirizzi (ddt_id, tipo_indirizzo_id, snapshot)
                  SELECT v_ddt, ti.id, jsonb_build_object('display', 'pgTAP ' || ti.codice_interno)
                    FROM config.tipi_indirizzi ti
                   WHERE ti.codice_interno = ANY (script.fn_indirizzi_obbligatori_mancanti(
                             'DDT_VENDITA',
                             (SELECT array_agg(di.tipo_indirizzo_id)::integer[]
                                FROM vendite.ddt_indirizzi di
                               WHERE di.ddt_id = v_ddt)))
                  ON CONFLICT DO NOTHING;

                  -- 3. Lo stato chiesto, per la matrice.
                  IF v_stato_id IS DISTINCT FROM script.fn_doc_stato_iniziale_id('vendite.ddt'::regclass) THEN
                      PERFORM dbops.fn_pgtap_porta_a_stato('vendite.ddt'::regclass, v_ddt, p_stato_codice_interno);
                  END IF;

                  -- Contratto dichiarato, non fiducia nel chiamato.
                  SET CONSTRAINTS ALL IMMEDIATE;

                  RETURN QUERY
                  SELECT d.id, d.uid, dr.id, dr.quantita, d.stato_doc_ddt_id
                    FROM vendite.ddt d
                    JOIN LATERAL (
                        SELECT r.id, r.quantita
                          FROM vendite.ddt_righe r
                         WHERE r.ddt_id = d.id
                         ORDER BY r.riga_nr, r.id
                         LIMIT 1) dr ON true
                   WHERE d.id = v_ddt;
              END;
              $function$;

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION dbops.fn_pgtap_crea_ddt_riconsegna(bigint,character varying,bigint,numeric,date,character varying)
                IS 'Fixture pgTAP: la BOLLA DI RI-CONSEGNA di un reso per ri-consegna confermato, nello stato chiesto (secondo parametro, default CONSEGNATO), per la strada vera del dominio. ⭐ Esiste per la TRAPPOLA D''ORDINE che i file ricopiavano dopo vendite.fn_genera_ddt_riconsegna: indirizzo e causale riscritti a mano, passaggi fino a consegnata. La bolla la fa la madre: tutto cio'' che il reso lascia da ri-consegnare, oppure p_quantita della riga p_resi_riga_id (i due insieme, o nessuno), alla data p_data (NULL = data operativa); la madre copia causale e indirizzi dalla bolla d''origine. Cio'' che l''emissione pretende e la madre non ha portato lo completa: la causale p_causale_codice (default VENDITA) solo se manca, gli indirizzi obbligatori dell''ambito DDT_VENDITA mancanti (come dbops.fn_pgtap_crea_ddt_da_ordine). Lo stato si raggiunge con dbops.fn_pgtap_porta_a_stato, sotto i guard veri; uno stato abortito si rifiuta prima di costruire (l''annullo di una bolla con legami e'' del verbo vendite.fn_annulla_ddt). Il reso lo costruisce dbops.fn_pgtap_crea_reso; le regole (reso confermato, tipo per ri-consegna, residuo) le giudica la madre. Restituisce la bolla, la PRIMA riga con la sua quantita'' base e lo stato. ⚠️ Esce con i vincoli IMMEDIATE, come ogni helper. Brief: brief-db-pgtap-reso-costruito (D-3), 2026-10-25. Rev 2026-10-27 (20261027-36, brief-modello-documento-vendita §15.13): lo stato iniziale dalla testata (vendite.ddt) con script.fn_doc_stato_iniziale_id, non dal vocabolario.';
