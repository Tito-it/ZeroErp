# ------------------------------------------------------------
# fn_sync_functions_owner: CAMBIA IL PROPRIETARIO di funzioni. E' la terza
#   delle tre, e quella con il potere piu' largo.
# ── D6 di migliorie-generali-da-test-valutazione.md ───────────────────
#   Tre `SECURITY DEFINER` di proprieta' di `postgres`, eseguibili da PUBLIC,
#   SENZA `search_path`. Non sfruttabili oggi (i corpi qualificano quasi tutto e
#   `zeroerp_app` non ha CREATE su nessuno schema nel path), ma la difesa era
#   tutta in un GRANT che nessun presidio verificava: il giorno in cui a un
#   ruolo servisse CREATE da qualche parte, tre funzioni con i privilegi del
#   superutente diventerebbero una scala.
#
# ── ⭐ IL PIN E LA SUA FORMA ───────────────────────────────────────────
#   `SET search_path TO 'pg_catalog', 'public', 'pg_temp'` — NELLA DEFINIZIONE,
#   non con `ALTER FUNCTION`: un `CREATE OR REPLACE` successivo che dimentica la
#   clausola azzererebbe il pin in silenzio (provato il 2026-09-12, memoria
#   «una DEFINER col search_path blindato accieca la INVOKER»). E con `public`
#   dentro, perche' il path della DEFINER vale per TUTTO cio' che chiama, e la
#   catena tocca estensioni che vivono in `public` (`dblink`): la forma
#   «prudente» `pg_catalog, pg_temp` la accecherebbe. `pg_temp` ULTIMO ed
#   esplicito: se non e' elencato PostgreSQL lo cerca per PRIMO per le
#   relazioni.
#
# ── ⛔ IL PRESTITO NON BASTA: la sync non puo' prestarsi e restituirsi ─
#   Per 39/-40 il registro dichiara owner il migratore, fn_sync_functions_owner()
#   (DEFINER di postgres) passa la funzione, CREATE OR REPLACE, restituzione.
#   Per fn_sync_functions_owner STESSA il giro si rompe a meta': una volta del
#   migratore non e' piu' DEFINER di postgres, e la restituzione («ALTER
#   FUNCTION … OWNER TO postgres» eseguita dal migratore) fallisce.
#   ⚠️ E `context: provision` non e' una via: in sviluppo si migra con
#   `liquibase5.sh update` SENZA contesti e come `titodb` — la prima stesura di
#   questo file e' morta cosi', due volte, su «bisogna essere proprietari».
#
# ── ⭐ LA COPIA DI SERVIZIO: due DEFINER di postgres, una alla volta ──────
#   Il meccanismo del registro permette di far cambiare owner a QUALUNQUE
#   funzione da un DEFINER di postgres. Ne basta uno vivo in ogni momento:
#     1. si crea `fn_sync_functions_owner_boot`, copia della definizione VIVA
#        (pg_get_functiondef: nessun corpo duplicato qui dentro);
#     2. la sync VIVA (postgres) da' la copia a postgres — riga temporanea nel
#        registro;
#     3. la COPIA (postgres) presta l'originale al migratore;
#     4. CREATE OR REPLACE dell'originale, con il pin;
#     5. la COPIA restituisce l'originale a postgres;
#     6. l'ORIGINALE (di nuovo postgres, e pinnato) riprende la copia al
#        migratore, che la DROPPA; le due righe temporanee escono dal registro.
#   Un changeSet = una transazione: un errore in mezzo annulla tutto, righe
#   di registro comprese. Da zero (CI: la sync non e' ancora di postgres)
#   ogni passaggio di owner e' un no-op con WARNING, il CREATE OR REPLACE e'
#   dell'owner, e la provision-post indurisce dopo — come per 39/-40.
#
# ── 🔴 E QUESTO GIRO DICE UNA COSA SUL PRODOTTO ────────────────────────
#   Chi puo' scrivere dbops.sec_functions_owner ED eseguire la sync puo' fare
#   lo stesso: rendersi proprietario delle sei funzioni indurite (DoS del
#   canale di log, e ALTER FUNCTION … SET su una DEFINER che poi torna a
#   postgres). Letto il 2026-09-12: `zeroerp_app` ha INSERT/UPDATE sul
#   registro e EXECUTE sulla sync (=X a PUBLIC). Non arriva al superuser (non
#   ha CREATE su nessuno schema, e le funzioni non si risolvono da pg_temp),
#   ma e' la faccia concreta del «valutare il ritiro di EXECUTE a PUBLIC» di
#   D6: registro e sync vanno riservati al migratore. Brief §3.
#
# Corpo dalla doc auto-gen (= vivo); firma/RETURNS/DECLARE con %TYPE dove il
# tipo e' quello di una colonna (la doc auto-gen li scioglie).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20260912-41-update-fn-sync-functions-owner-search-path-mctit.yaml

  - changeSet:
      id: 20260912-41-update-fn-sync-functions-owner-search-path
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.fn_sync_functions_owner: pin search_path = pg_catalog, public, pg_temp
        nella definizione (D6), sostituita dal migratore attraverso una copia di
        servizio che fa da secondo DEFINER di postgres (vedi testata). Corpo invariato.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'dbops' AND p.proname = 'fn_sync_functions_owner'
                 AND pg_catalog.pg_get_function_identity_arguments(p.oid) = '';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- ========================================================
              -- 1) LA COPIA DI SERVIZIO, dalla definizione VIVA (vedi testata)
              -- ========================================================
              DO $boot$
              DECLARE
                  v_def text;
              BEGIN
                  v_def := pg_get_functiondef('dbops.fn_sync_functions_owner()'::regprocedure);
                  v_def := replace(v_def,
                                   'FUNCTION dbops.fn_sync_functions_owner()',
                                   'FUNCTION dbops.fn_sync_functions_owner_boot()');
                  EXECUTE v_def;
              END
              $boot$;

              -- 2) la copia passa a postgres attraverso la sync VIVA
              INSERT INTO dbops.sec_functions_owner
                  (id, schema_name, function_name, arg_types, required_owner, note)
              SELECT max(s.id) + 1, 'dbops', 'fn_sync_functions_owner_boot', '', 'postgres',
                     'temporanea: 20260912-41'
                FROM dbops.sec_functions_owner s;

              SELECT dbops.fn_sync_functions_owner();

              -- 3) prestito dell'ORIGINALE al migratore, attraverso la COPIA
              INSERT INTO dbops.sec_functions_owner
                  (id, schema_name, function_name, arg_types, required_owner, note)
              SELECT max(s.id) + 1, 'dbops', 'fn_sync_functions_owner', '', current_user,
                     'temporanea: 20260912-41'
                FROM dbops.sec_functions_owner s;

              SELECT dbops.fn_sync_functions_owner_boot();

              -- 4) l'originale, con il pin
              CREATE OR REPLACE FUNCTION dbops.fn_sync_functions_owner()
               RETURNS void
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              DECLARE
                  r              dbops.sec_functions_owner%ROWTYPE;
                  v_regproc      regprocedure;
                  v_owner_oid    oid;
                  v_owner_name   text;
                  v_required_oid oid;
              BEGIN

              -- ------------------------------------------------------------
              -- dbops.fn_sync_functions_owner()
              -- Sincronizza l'owner delle funzioni "sensibili" in base alla
              -- tabella dbops.sec_functions_owner.
              --
              -- NOTE:
              --  - Va idealmente posseduta da postgres e SECURITY DEFINER
              --    per poter cambiare owner ad altre funzioni.
              -- ------------------------------------------------------------


                  FOR r IN
                      SELECT *
                      FROM dbops.sec_functions_owner
                      ORDER BY schema_name, function_name, arg_types
                  LOOP
                      -- Costruisco la signature per to_regprocedure:
                      -- se arg_types = '' → nessun argomento
                      IF r.arg_types = '' THEN
                          v_regproc := to_regprocedure(
                              format('%I.%I()',
                                  r.schema_name,
                                  r.function_name)
                          );
                      ELSE
                          v_regproc := to_regprocedure(
                              format('%I.%I(%s)',
                                  r.schema_name,
                                  r.function_name,
                                  r.arg_types)
                          );
                      END IF;

                      IF v_regproc IS NULL THEN
                          RAISE WARNING
                              'fn_sync_functions_owner: funzione non trovata: %.%(%).',
                              r.schema_name, r.function_name, r.arg_types;
                          CONTINUE;
                      END IF;

                      -- Owner corrente
                      SELECT p.proowner, pg_get_userbyid(p.proowner)
                      INTO v_owner_oid, v_owner_name
                      FROM pg_proc p
                      WHERE p.oid = v_regproc;

                      -- Owner richiesto
                      SELECT oid
                      INTO v_required_oid
                      FROM pg_roles
                      WHERE rolname = r.required_owner;

                      IF v_required_oid IS NULL THEN
                          RAISE WARNING
                              'fn_sync_functions_owner: ruolo richiesto "%" non esiste (%.%(%)).',
                              r.required_owner, r.schema_name, r.function_name, r.arg_types;
                          CONTINUE;
                      END IF;

                      -- Se già coincide → niente da fare
                      IF v_owner_oid = v_required_oid THEN
                          CONTINUE;
                      END IF;

                      -- TENTO ALTER FUNCTION OWNER TO ...
                      BEGIN
                          EXECUTE format(
                              'ALTER FUNCTION %s OWNER TO %I',
                              v_regproc,
                              r.required_owner
                          );

                          RAISE NOTICE
                              'fn_sync_functions_owner: cambiato owner funzione %.%(%): % -> %.',
                              r.schema_name, r.function_name, r.arg_types,
                              v_owner_name, r.required_owner;

                      EXCEPTION
                          WHEN insufficient_privilege THEN
                              RAISE WARNING
                                  'fn_sync_functions_owner: privilegi insufficienti per ALTER FUNCTION %.%(%): owner attuale %, richiesto %.',
                                  r.schema_name, r.function_name, r.arg_types,
                                  v_owner_name, r.required_owner;
                          WHEN others THEN
                              RAISE WARNING
                                  'fn_sync_functions_owner: errore inatteso su funzione %.%(%): % %.',
                                  r.schema_name, r.function_name, r.arg_types,
                                  SQLSTATE, SQLERRM;
                      END;
                  END LOOP;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_sync_functions_owner()
              IS 'Allinea il proprietario delle funzioni elencate in dbops.sec_functions_owner al ruolo richiesto (ALTER FUNCTION ... OWNER TO). Eseguita dalla passata provision-post come postgres (90_end/20251123-12). SECURITY DEFINER di postgres: dal 2026-09-12 (D6) con search_path pinnato a pg_catalog, public, pg_temp — il pin sta nella definizione, un CREATE OR REPLACE che lo dimentica lo azzera.';

              -- 5) restituzione dell'originale a postgres, attraverso la COPIA
              UPDATE dbops.sec_functions_owner
                 SET required_owner = 'postgres'
               WHERE schema_name = 'dbops' AND function_name = 'fn_sync_functions_owner'
                 AND arg_types = '' AND note = 'temporanea: 20260912-41';

              SELECT dbops.fn_sync_functions_owner_boot();

              -- 6) l'ORIGINALE (di nuovo di postgres, e pinnato) riprende la copia
              --    al migratore, che la droppa; via le righe temporanee.
              UPDATE dbops.sec_functions_owner
                 SET required_owner = current_user
               WHERE schema_name = 'dbops' AND function_name = 'fn_sync_functions_owner_boot'
                 AND note = 'temporanea: 20260912-41';

              SELECT dbops.fn_sync_functions_owner();

              DROP FUNCTION dbops.fn_sync_functions_owner_boot();

              DELETE FROM dbops.sec_functions_owner
               WHERE note = 'temporanea: 20260912-41';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Il corpo precedente (senza pin) e' nella doc auto-gen alla revisione
              -- prima di questa. Non si riscrive un corpo stantio.
              SELECT 1;
