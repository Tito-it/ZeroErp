# brief-db-coda-lavori-generica §3 — enqueue atomico nella coda lavori.
#
# Unica porta d'ingresso della coda: valida il job_type contro il registry
# (dbops.coda_lavori_tipi), risolve i default per-tipo (run_as, max_tentativi),
# e INSERT idempotente sui job vivi (ON CONFLICT sull'unique parziale ->
# ritorna l'id del job vivo esistente, nessun doppione). Una singola INSERT su
# connessione autocommit e' atomica per costruzione. Callable sia da Python sia
# da trigger/altro codice DB (enqueue transazionale da dominio, origine=TRIGGER).
# Claim/reaper/marca NON sono qui: li fa il worker BE in SQL diretto.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20260720-09-create-fn-accoda-lavoro-mctit.yaml

  - changeSet:
      id: 20260720-09-create-fn-accoda-lavoro
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.fn_accoda_lavoro: enqueue atomico idempotente nella coda lavori
        generica. Guard job_type esistente/attivo (E_JOB_TYPE_NON_TROVATO/
        NON_ATTIVO), risoluzione default run_as/max_tentativi dal tipo, guard
        coerenza OPERATORE<->scope, INSERT ON CONFLICT DO NOTHING sull'unique
        parziale vivo. Ritorna l'id (nuovo o del job vivo esistente).
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                { schemaName: dbops, tableName: coda_lavori }
            - tableExists:
                { schemaName: dbops, tableName: coda_lavori_tipi }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_accoda_lavoro(
                  p_job_type        text,
                  p_payload         jsonb       DEFAULT '{}'::jsonb,
                  p_run_as          text        DEFAULT NULL,
                  p_scope           jsonb       DEFAULT NULL,
                  p_idempotency_key text        DEFAULT NULL,
                  p_priorita        smallint    DEFAULT 100,
                  p_run_after       timestamptz DEFAULT NULL,
                  p_max_tentativi   int         DEFAULT NULL,
                  p_origine         text        DEFAULT 'API'
              ) RETURNS bigint
                LANGUAGE plpgsql
                VOLATILE
              AS $function$
              DECLARE
                  v_tipo     dbops.coda_lavori_tipi%ROWTYPE;
                  v_run_as   dbops.coda_lavori.run_as%TYPE;
                  v_max_tent dbops.coda_lavori.max_tentativi%TYPE;
                  v_id       dbops.coda_lavori.id%TYPE;
              BEGIN
                  -- Scopo: enqueue atomico idempotente. Valida il tipo, risolve i
                  --   default, INSERT idempotente sui job vivi. Una sola INSERT ->
                  --   atomica per costruzione (autocommit). Callable da trigger.

                  -- Guard parametro: job_type obbligatorio e non vuoto.
                  IF p_job_type IS NULL OR btrim(p_job_type) = '' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'dbops.fn_accoda_lavoro', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_job_type'),
                          NULL::uuid, 'p_job_type obbligatorio');
                  END IF;

                  -- Guard: tipo registrato in coda_lavori_tipi.
                  SELECT * INTO v_tipo
                    FROM dbops.coda_lavori_tipi
                   WHERE codice = p_job_type;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'dbops.fn_accoda_lavoro', 'E_JOB_TYPE_NON_TROVATO',
                          jsonb_build_object('job_type', p_job_type),
                          NULL::uuid, p_job_type);
                  END IF;

                  -- Guard: tipo attivo (l'handler dev'essere registrato lato BE).
                  IF NOT v_tipo.attivo THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'dbops.fn_accoda_lavoro', 'E_JOB_TYPE_NON_ATTIVO',
                          jsonb_build_object('job_type', p_job_type),
                          NULL::uuid, p_job_type);
                  END IF;

                  -- Risoluzione default per-tipo se non passati.
                  v_run_as   := COALESCE(p_run_as, v_tipo.run_as_default);
                  v_max_tent := COALESCE(p_max_tentativi, v_tipo.max_tentativi_default);

                  -- Guard coerenza run_as<->scope (messaggio parlante prima del
                  -- CHECK di tabella): OPERATORE senza scope girerebbe senza filtro
                  -- RLS. Il caso simmetrico (SISTEMA con scope) lo copre il CHECK.
                  IF v_run_as = 'OPERATORE' AND p_scope IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'dbops.fn_accoda_lavoro', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_scope', 'run_as', v_run_as),
                          NULL::uuid, 'p_scope obbligatorio per run_as=OPERATORE');
                  END IF;

                  -- Enqueue idempotente sui job vivi: l'unique parziale
                  -- uq_coda_lavori_vivo_idem assorbe il doppione vivo (stessa
                  -- job_type+idempotency_key in PENDING/IN_CORSO).
                  INSERT INTO dbops.coda_lavori (
                      job_type, payload, run_as, scope, origine, priorita,
                      stato, max_tentativi, run_after, idempotency_key
                  ) VALUES (
                      p_job_type,
                      COALESCE(p_payload, '{}'::jsonb),
                      v_run_as,
                      p_scope,
                      p_origine,
                      COALESCE(p_priorita, 100::smallint),
                      'PENDING',
                      v_max_tent,
                      p_run_after,
                      p_idempotency_key
                  )
                  ON CONFLICT (job_type, idempotency_key)
                      WHERE idempotency_key IS NOT NULL
                        AND stato IN ('PENDING', 'IN_CORSO')
                      DO NOTHING
                  RETURNING id INTO v_id;

                  -- Conflitto idempotente (nessuna riga inserita): ritorna l'id
                  -- del job vivo esistente, senza creare doppioni.
                  IF v_id IS NULL THEN
                      SELECT id INTO v_id
                        FROM dbops.coda_lavori
                       WHERE job_type = p_job_type
                         AND idempotency_key = p_idempotency_key
                         AND stato IN ('PENDING', 'IN_CORSO')
                       ORDER BY id
                       LIMIT 1;
                  END IF;

                  RETURN v_id;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_accoda_lavoro(text, jsonb, text, jsonb, text, smallint, timestamptz, int, text) IS
                  'Enqueue atomico idempotente nella coda lavori generica dbops.coda_lavori. Valida il job_type contro dbops.coda_lavori_tipi (E_JOB_TYPE_NON_TROVATO/NON_ATTIVO), risolve i default per-tipo (run_as, max_tentativi), verifica la coerenza OPERATORE<->scope, INSERT ON CONFLICT DO NOTHING sull''unique parziale vivo (uq_coda_lavori_vivo_idem). Ritorna l''id del job (nuovo o, in caso di conflitto idempotente, del job vivo esistente). Callable da Python e da trigger/codice DB (origine=TRIGGER). Brief: brief-db-coda-lavori-generica §3.';
      rollback:
        - sql:
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS dbops.fn_accoda_lavoro(
                  text, jsonb, text, jsonb, text, smallint, timestamptz, int, text);
