# Helper di fixture pgTAP: il MONDO MINIMO di un test di dominio — l'azienda con
#   il suo operatore, il contesto aperto su di lui, e un cliente fatturabile
#   legato a quella azienda — in una chiamata sola.
#
# ── ⛔ IL DIFETTO, ed e' del building block, non dei file ─────────────
#   I builder atomici esistono e sono buoni (fn_pgtap_crea_emittente_operatore,
#   fn_pgtap_crea_cliente_ba, fn_pgtap_crea_articolo, fn_pgtap_crea_soggetto_*,
#   script.fn_pgtap_registro_fattura): ognuno sa costruire la SUA entita'.
#   Cio' che non esiste e' la COMPOSIZIONE — ed e' esattamente il pezzo che
#   porta la regola d'ordine:
#
#     1. prima il mondo, POI script.fn_pgtap_set_contesto_operatore();
#     2. con un operatore in sessione il legame BA -> emittente lo scrive il
#        trigger z90, verso l'emittente di CHI AGISCE: chiedere il legame anche
#        col terzo parametro fa sbattere i due su uq_emittenti_fiscali_ba;
#     3. gli helper escono con i vincoli IMMEDIATE, e chi vuole la finestra
#        differita la riapre dichiarandolo (rev 20260921-18).
#
#   ⇒ Quella regola oggi non sta in nessun oggetto: sta riscritta a mano in ogni
#   file, e un file scritto prima che fosse nota non la rispetta — su dbdev non
#   si vede, su un database ricostruito muore nel fixture.
#
# ── ⚠️ IL FATTO DATATO (2026-09-22, letture sui file del repo) ────────
#   Dei 361 file a registro in db/pgtap/baseline-rossi-ci.tsv, 205 compongono il
#   mondo PESCANDO (`CREATE TEMP TABLE …_refs AS SELECT (SELECT … LIMIT 1)`),
#   170 pescano un billing account e TRE usano un builder. E' un fatto, non il
#   motivo: il motivo e' che una fixture dichiara il mondo che le serve, e la
#   regola d'ordine appartiene all'oggetto che compone, non al chiamante.
#
# ── ⭐ COSA NON ENTRA, e il criterio e' uno ───────────────────────────
#   Entra cio' che ha una TRAPPOLA D'ORDINE, non cio' che serve spesso:
#     * il registro di fatturazione NO: script.fn_pgtap_registro_fattura() si
#       semina gia' dal contesto e lo crea se manca. Nessuna trappola;
#     * l'articolo NO: i flag (gestito_a_magazzino, requires_lotto,
#       requires_serial) sono il CASO del test, non un default;
#     * i cataloghi di 80_data NO: quelli ci sono anche da zero — non si
#       costruiscono, si scelgono, e la cura li' e' un ORDER BY stabile;
#     * due aziende o due clienti NO: sono i builder atomici, chiamati due
#       volte. Un parametro «quanti» sarebbe un ramo in piu' per ogni chiamante.
#
# ── ⚠️ IL RAMO B NON E' UN'OTTIMIZZAZIONE ────────────────────────────
#   Con un contesto gia' aperto l'azienda NON si ricostruisce: e' correttezza.
#   Il trigger z90 lega il BA all'emittente di chi agisce, quindi un'azienda
#   nuova lascerebbe il cliente legato a quella VECCHIA e sotto RLS il BA non si
#   vedrebbe — il difetto che fn_pgtap_crea_cliente_ba dichiara nel suo RAISE.
#
# ── ⚠️ L'ORDINE DEI PARAMETRI, e lo ha trovato il banco di prova ─────
#   p_etichetta PRIMA, p_sigla dopo. Nella prima stesura era il contrario, e la
#   prima chiamata scritta a mano — `fn_pgtap_crea_mondo_cliente('secondo
#   cliente')` — e' finita nella SIGLA: col guard ha sollevato, ma senza
#   contesto aperto avrebbe provato a creare un emittente con quel codice e
#   sarebbe morta su chk_emittenti_fiscali_codice_forma, tre passi piu' in la'
#   dalla causa. Il parametro che il chiamante scrive sempre va per primo.
#
# Permessi: funzione di chi migra, non SECURITY DEFINER, non in
# dbops.sec_functions_owner. Stessa forma di 20260909-26 e 20260909-31.
# Brief: brief-db-fixture-che-costruiscono-giro-2.md §3.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20260922-17-create-fn-pgtap-crea-mondo-cliente-mctit.yaml

  - changeSet:
      id: 20260922-17-create-fn-pgtap-crea-mondo-cliente
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Helper di fixture pgTAP: dbops.fn_pgtap_crea_mondo_cliente() compone il
        mondo minimo di un test di dominio — azienda + operatore (o quella di
        chi e' gia' in sessione), contesto aperto, cliente fatturabile legato a
        quella azienda — e ne ritorna tutte le chiavi. Porta dentro l'oggetto la
        regola d'ordine fra mondo, legame del BA e contesto, che oggi e'
        riscritta a mano in ogni file.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_pgtap_crea_mondo_cliente(
                  p_etichetta text                                      DEFAULT 'pgTAP',
                  p_sigla     anagrafiche.emittenti_fiscali.codice%TYPE DEFAULT NULL
              )
               RETURNS TABLE (
                  emittente_fiscale_id        anagrafiche.emittenti_fiscali.id%TYPE,
                  emittente_codice            anagrafiche.emittenti_fiscali.codice%TYPE,
                  emittente_soggetto_ruolo_id anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE,
                  auth_user_id                anagrafiche.identita_digitali.auth_user_id%TYPE,
                  identita_id                 anagrafiche.identita_digitali.id%TYPE,
                  billing_account_id          anagrafiche.billing_account.id%TYPE,
                  istanza_utility_id          anagrafiche.billing_account.istanza_utility_id%TYPE,
                  cliente_soggetto_ruolo_id   anagrafiche.billing_account.soggetto_ruolo_id%TYPE,
                  cliente_soggetto_id         anagrafiche.soggetti.id%TYPE,
                  utility_id                  anagrafiche.billing_account.utility_id%TYPE
               )
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: dare a una fixture pgTAP il mondo minimo di un test di
              --   dominio in una chiamata — l'azienda con il suo operatore, il
              --   contesto aperto su di lui e un cliente fatturabile legato a
              --   QUELLA azienda — con la regola d'ordine dentro l'oggetto.
              -- Uso, al posto del blocco «refs» e della riga di contesto:
              --   CREATE TEMP TABLE tmp_mondo AS
              --   SELECT * FROM dbops.fn_pgtap_crea_mondo_cliente('DASH');
              -- ⚠️ Esce con i vincoli IMMEDIATE, come ogni helper: chi vuole la
              --   finestra differita la riapre subito dopo con
              --   SET CONSTRAINTS ALL DEFERRED, e lo dichiara in testa al file.
              DECLARE
                  v_user_id   anagrafiche.identita_digitali.auth_user_id%TYPE;
                  v_identita  anagrafiche.identita_digitali.id%TYPE;
                  v_ef_id     anagrafiche.emittenti_fiscali.id%TYPE;
                  v_ef_codice anagrafiche.emittenti_fiscali.codice%TYPE;
                  v_ef_sr_id  anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE;
                  v_ba_id     anagrafiche.billing_account.id%TYPE;
                  v_ist_id    anagrafiche.billing_account.istanza_utility_id%TYPE;
                  v_cli_sr_id anagrafiche.billing_account.soggetto_ruolo_id%TYPE;
                  v_cli_sog   anagrafiche.soggetti.id%TYPE;
                  v_utility   anagrafiche.billing_account.utility_id%TYPE;
                  v_link_sr   anagrafiche.emittenti_fiscali_billing_account.emittente_soggetto_ruolo_id%TYPE;
              BEGIN
                  -- La domanda e' «c'e' un contesto?», e si fa alla GUC che le
                  -- policy leggono davvero: non a script.fn_pgtap_emittente_operatore(),
                  -- che ha un ripiego suo e risponderebbe un emittente anche
                  -- senza contesto — qui servirebbe come discriminante, e non lo e'.
                  v_user_id := NULLIF(current_setting('app.current_user_id', true), '')::integer;

                  IF v_user_id IS NULL THEN
                      -- ── RAMO A: nessun contesto (CI, installazione nuova, o
                      --    un file che chiama questa funzione per prima).
                      --    Il mondo si COSTRUISCE, e il contesto si apre DOPO:
                      --    e' l'ordine che il cliente pretende (vedi sotto).
                      SELECT ceo.emittente_fiscale_id, ceo.emittente_codice,
                             ceo.soggetto_ruolo_id, ceo.auth_user_id, ceo.identita_id
                        INTO v_ef_id, v_ef_codice, v_ef_sr_id, v_user_id, v_identita
                        FROM dbops.fn_pgtap_crea_emittente_operatore(p_sigla) ceo;

                      PERFORM script.fn_pgtap_set_contesto_operatore(v_user_id);
                  ELSE
                      -- ── RAMO B: un contesto c'e' gia' (dbdev, o la riga di
                      --    contesto del template chiamata prima). L'azienda NON
                      --    si ricostruisce: il trigger z90 lega il BA a quella
                      --    di CHI AGISCE, quindi costruirne una nuova lascerebbe
                      --    il cliente legato all'altra e sotto RLS invisibile.
                      IF p_sigla IS NOT NULL THEN
                          RAISE EXCEPTION
                              'fn_pgtap_crea_mondo_cliente: p_sigla = % chiesta con un contesto gia'' aperto (auth_user_id = %): qui l''azienda non si sceglie, e'' quella di chi agisce. Per una SECONDA azienda si chiamano i builder atomici (dbops.fn_pgtap_crea_emittente_operatore + dbops.fn_pgtap_crea_cliente_ba col terzo parametro), prima del contesto',
                              p_sigla, v_user_id;
                      END IF;

                      SELECT ef.id, ef.codice, ef.soggetto_ruolo_id
                        INTO v_ef_id, v_ef_codice, v_ef_sr_id
                        FROM config.user_emittenti_fiscali uef
                        JOIN anagrafiche.emittenti_fiscali ef
                          ON ef.id = uef.emittente_fiscale_id
                       WHERE uef.auth_user_id = v_user_id;

                      -- ⚠️ Guard sul RISULTATO: un operatore senza riga in
                      --   user_emittenti_fiscali e' fail-closed dal 2026-08-18
                      --   (P-2a) e non vede NESSUN emittente. Tornare una tupla
                      --   con un NULL dentro manderebbe il chiamante a cercare
                      --   il difetto tre passi piu' in la'.
                      IF v_ef_id IS NULL THEN
                          RAISE EXCEPTION
                              'fn_pgtap_crea_mondo_cliente: l''operatore di contesto (auth_user_id = %) non ha un emittente in config.user_emittenti_fiscali: la fixture ha aperto un contesto che non puo'' scrivere. Aprire il contesto senza argomento (script.fn_pgtap_set_contesto_operatore()), o chiamare questa funzione PRIMA del contesto',
                              v_user_id;
                      END IF;

                      -- Una sola riga per costruzione: uq_identita_digitali_auth_user_ruolo_attivo
                      -- e' UNIQUE su (auth_user_id, ruolo_applicativo) WHERE attivo.
                      SELECT idg.id
                        INTO v_identita
                        FROM anagrafiche.identita_digitali idg
                       WHERE idg.auth_user_id = v_user_id
                         AND idg.ruolo_applicativo = 'OPERATORE'::config.ruolo_applicativo
                         AND idg.attivo;

                      IF v_identita IS NULL THEN
                          RAISE EXCEPTION
                              'fn_pgtap_crea_mondo_cliente: nessuna identita'' OPERATORE attiva per auth_user_id = %: il contesto e'' aperto su un utente che l''applicazione non farebbe entrare',
                              v_user_id;
                      END IF;
                  END IF;

                  -- Il cliente, in entrambi i rami DOPO il contesto e SENZA
                  -- terzo parametro: il legame lo scrive il trigger z90 verso
                  -- l'emittente di chi agisce, che qui e' quello giusto per
                  -- costruzione. Chiederlo anche col parametro farebbe sbattere
                  -- i due su uq_emittenti_fiscali_ba (rev 20260912-38).
                  SELECT c.billing_account_id, c.istanza_utility_id,
                         c.soggetto_ruolo_id, c.soggetto_id, c.utility_id
                    INTO v_ba_id, v_ist_id, v_cli_sr_id, v_cli_sog, v_utility
                    FROM dbops.fn_pgtap_crea_cliente_ba(p_etichetta) c;

                  -- ⚠️ Il legame si VERIFICA, non si spera. Se il trigger ha
                  --   legato il BA a un'altra azienda — succede quando il
                  --   contesto e' aperto su un operatore di un altro emittente —
                  --   il mondo che si sta tornando non e' coerente, e il file
                  --   morirebbe venti righe piu' in la' su una policy.
                  --   La tabella del legame non e' in RLS: la lettura vale anche
                  --   come zeroerp_app.
                  SELECT efba.emittente_soggetto_ruolo_id
                    INTO v_link_sr
                    FROM anagrafiche.emittenti_fiscali_billing_account efba
                   WHERE efba.billing_account_id = v_ba_id;

                  IF v_link_sr IS DISTINCT FROM v_ef_sr_id THEN
                      RAISE EXCEPTION
                          'fn_pgtap_crea_mondo_cliente: il billing account % risulta legato all''emittente sr = % invece che a % (l''azienda di chi agisce): il mondo non e'' coerente',
                          v_ba_id, v_link_sr, v_ef_sr_id;
                  END IF;

                  -- Contratto dichiarato, non fiducia nel chiamato: si esce con
                  -- i vincoli IMMEDIATE come ogni helper. Oggi e' un no-op —
                  -- fn_pgtap_crea_cliente_ba li richiude gia' — e domani e' la
                  -- riga che tiene il contratto se quel corpo cambia.
                  SET CONSTRAINTS ALL IMMEDIATE;

                  RETURN QUERY
                  SELECT v_ef_id, v_ef_codice, v_ef_sr_id, v_user_id, v_identita,
                         v_ba_id, v_ist_id, v_cli_sr_id, v_cli_sog, v_utility;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_pgtap_crea_mondo_cliente(text, character varying)
              IS 'Fixture pgTAP: il MONDO MINIMO di un test di dominio in una chiamata — azienda + operatore + contesto aperto + cliente fatturabile legato a quella azienda — e ritorna tutte le chiavi. ⭐ Esiste per la REGOLA D''ORDINE, non per fare l''elenco della spesa: prima il mondo, poi il contesto, e il legame BA -> emittente lo scrive il trigger z90 verso chi agisce (chiederlo anche col terzo parametro di fn_pgtap_crea_cliente_ba li fa sbattere su uq_emittenti_fiscali_ba). ⚠️ Con un contesto gia'' aperto RIUSA l''azienda di chi agisce e rifiuta p_sigla: una seconda azienda si costruisce coi builder atomici, prima del contesto. ⛔ NON comprende registro (script.fn_pgtap_registro_fattura si semina dal contesto), articolo (i flag sono il caso del test) ne'' i cataloghi di 80_data, che da zero ci sono e vanno scelti con un ORDER BY stabile. ⚠️ Esce con i vincoli IMMEDIATE: chi li vuole differiti riapre con SET CONSTRAINTS ALL DEFERRED e lo dichiara in testa al file (rev 20260921-18). Brief: brief-db-fixture-che-costruiscono-giro-2.md';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS dbops.fn_pgtap_crea_mondo_cliente(text, character varying);
