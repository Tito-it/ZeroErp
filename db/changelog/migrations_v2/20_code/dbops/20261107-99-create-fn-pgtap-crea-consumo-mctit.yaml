# ------------------------------------------------------------
# IL CONSUMO DELLE FIXTURE: dbops.fn_pgtap_crea_consumo, dbops.fn_pgtap_consumo_della_commessa
#   Brief: brief-db-sorgente-documento-e-riga §7.2 lotto C, giro C.3 (le fixture, Tid 2026-11-07).
#
#   Il builder della riga di commessa dava alla riga la commessa stessa come provenienza (tipo
#   COMMESSA, l'id della commessa, una chiave PGT-SEG-... scritta a mano): non e' una provenienza
#   del modello. Al suo posto un consumo vero, il documento piu' leggero: niente righe, letto
#   solo dal suo lister (che scarta un consumo gia' in commessa), dal risolutore dell'emittente
#   (dal billing account) e da fn_riporta_attivita_da_emettere; stesso tipo documento di default
#   della commessa (FRONTOFFICE).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261107-99-create-fn-pgtap-crea-consumo-mctit.yaml

  - changeSet:
      id: 20261107-99-create-fn-pgtap-crea-consumo
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.fn_pgtap_crea_consumo e dbops.fn_pgtap_consumo_della_commessa: il consumo che le
        fixture usano come documento d'origine di una riga di commessa. brief-db-sorgente-documento-
        e-riga §7.2 lotto C, giro C.3.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE FUNCTION dbops.fn_pgtap_crea_consumo(
                  p_billing_account_id anagrafiche.billing_account.id%TYPE,
                  p_competenza_mese    vendite.attivita_consumi.competenza_mese%TYPE DEFAULT NULL,
                  p_meta               vendite.attivita_consumi.meta%TYPE DEFAULT NULL)
               RETURNS TABLE(consumo_id       vendite.attivita_consumi.id%TYPE,
                             consumo_uid      vendite.attivita_consumi.uid%TYPE,
                             sorgente_tipo_id vendite.commesse_attivita.sorgente_tipo_id%TYPE,
                             segment_key      vendite.commesse_attivita.segment_key%TYPE)
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              -- Scopo: dare a una fixture pgTAP un documento d'origine vero per una riga
              --   di commessa, il piu' leggero che il modello ammette: un consumo
              --   (vendite.attivita_consumi), che non ha righe. Lo scrive il test come
              --   lo scriverebbe il calcolo dei consumi: billing account e mese (di
              --   default quello corrente). Restituisce anche il tipo della provenienza
              --   (ATTIVITA_CONSUMI) e la chiave del push che il push dei consumi
              --   comporrebbe (script.fn_segment_key): un test che scrive piu' righe
              --   dallo stesso consumo la estende col suffisso ':<etichetta>'.
              -- Uso:
              --   CREATE TEMP TABLE _src AS SELECT * FROM dbops.fn_pgtap_crea_consumo(<ba>);
              --   ... p_sorgente_tipo_id => (SELECT sorgente_tipo_id FROM _src),
              --       p_sorgente_uid     => (SELECT consumo_id::text FROM _src),
              --       p_segment_key      => (SELECT segment_key FROM _src) || ':A' ...
              -- ⚠️ Sotto la RLS il billing account deve stare nel perimetro di chi
              --   agisce (lo stesso della commessa della fixture).
              -- ⚠️ Esce con i vincoli IMMEDIATE, come ogni helper.
              DECLARE
                  v_id   vendite.attivita_consumi.id%TYPE;
                  v_uid  vendite.attivita_consumi.uid%TYPE;
                  v_tipo vendite.commesse_attivita.sorgente_tipo_id%TYPE;
              BEGIN
                  IF p_billing_account_id IS NULL OR p_billing_account_id <= 0 THEN
                      RAISE EXCEPTION
                          'fn_pgtap_crea_consumo: serve il billing account (> 0), ricevuto %',
                          p_billing_account_id;
                  END IF;
              
                  SELECT s.id INTO v_tipo
                    FROM config.sorgenti s
                   WHERE s.codice_interno = 'ATTIVITA_CONSUMI' AND s.attivo;
              
                  INSERT INTO vendite.attivita_consumi (billing_account_id, competenza_mese, meta)
                  VALUES (p_billing_account_id,
                          date_trunc('month', COALESCE(p_competenza_mese, (SELECT script.fn_data_operativa())))::date,
                          jsonb_build_object('test_scope', 'pgtap_consumo') || COALESCE(p_meta, '{}'::jsonb))
                  RETURNING id, uid INTO v_id, v_uid;
              
                  SET CONSTRAINTS ALL IMMEDIATE;
              
                  RETURN QUERY
                  SELECT v_id, v_uid, v_tipo, script.fn_segment_key('ATTIVITA_CONSUMI', v_uid::text);
              END;
              $function$;
              
              COMMENT ON FUNCTION dbops.fn_pgtap_crea_consumo(anagrafiche.billing_account.id%TYPE, vendite.attivita_consumi.competenza_mese%TYPE, vendite.attivita_consumi.meta%TYPE) IS
                'Fixture pgTAP: un consumo (vendite.attivita_consumi) sul billing account dato, nel mese dato o in quello corrente, con meta test_scope = pgtap_consumo; restituisce anche il tipo della provenienza (ATTIVITA_CONSUMI) e la chiave del push che il push dei consumi comporrebbe (script.fn_segment_key), che un test estende col suffisso :<etichetta> (cosi'' ogni riga ha la sua base) per scrivere piu'' righe dallo stesso consumo. E'' il documento d''origine piu'' leggero che il modello ammette per una riga di commessa: non ha righe, quindi la provenienza e'' il documento intero (tipo ATTIVITA_CONSUMI, l''id in sorgente_id). Lo usa dbops.fn_pgtap_crea_commessa_attivita quando il test non dichiara una sorgente. Sotto la RLS il billing account deve stare nel perimetro di chi agisce. Un billing account mancante o <= 0 parla. Esce con i vincoli IMMEDIATE.';
              
              GRANT EXECUTE ON FUNCTION dbops.fn_pgtap_crea_consumo(anagrafiche.billing_account.id%TYPE, vendite.attivita_consumi.competenza_mese%TYPE, vendite.attivita_consumi.meta%TYPE) TO zeroerp_app;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE FUNCTION dbops.fn_pgtap_consumo_della_commessa(
                  p_commessa_id vendite.commesse.id%TYPE)
               RETURNS TABLE(consumo_id       vendite.attivita_consumi.id%TYPE,
                             consumo_uid      vendite.attivita_consumi.uid%TYPE,
                             sorgente_tipo_id vendite.commesse_attivita.sorgente_tipo_id%TYPE,
                             segment_key      vendite.commesse_attivita.segment_key%TYPE)
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              -- Scopo: il consumo di prova di una commessa, lo stesso a ogni chiamata: lo
              --   trova (meta pgtap_commessa_id) o lo crea sul billing account della
              --   commessa (dbops.fn_pgtap_crea_consumo). Per i test che scrivono piu'
              --   righe di commessa con la madre: una provenienza sola, un link solo, e la
              --   chiave del push estesa col suffisso ':<etichetta>' per ogni riga.
              -- Uso:
              --   p_sorgente_tipo_id => (SELECT x.sorgente_tipo_id FROM dbops.fn_pgtap_consumo_della_commessa(c) x),
              --   p_sorgente_uid     => (SELECT x.consumo_id::text FROM dbops.fn_pgtap_consumo_della_commessa(c) x),
              --   p_segment_key      => (SELECT x.segment_key FROM dbops.fn_pgtap_consumo_della_commessa(c) x) || ':A1'
              -- ⚠️ VOLATILE: ogni istruzione interna vede il consumo scritto da una
              --   chiamata precedente della stessa istruzione.
              DECLARE
                  v_ba vendite.commesse.billing_account_id%TYPE;
              BEGIN
                  RETURN QUERY
                  SELECT ac.id, ac.uid, s.id, script.fn_segment_key('ATTIVITA_CONSUMI', ac.uid::text)
                    FROM vendite.attivita_consumi ac
                    JOIN config.sorgenti s ON s.codice_interno = 'ATTIVITA_CONSUMI'
                   WHERE ac.meta @> jsonb_build_object('pgtap_commessa_id', p_commessa_id)
                   ORDER BY ac.id
                   LIMIT 1;
                  IF FOUND THEN
                      RETURN;
                  END IF;
              
                  SELECT c.billing_account_id INTO v_ba
                    FROM vendite.commesse c
                   WHERE c.id = p_commessa_id;
                  IF v_ba IS NULL THEN
                      RAISE EXCEPTION 'fn_pgtap_consumo_della_commessa: nessuna commessa con id = %', p_commessa_id;
                  END IF;
              
                  RETURN QUERY
                  SELECT c.* FROM dbops.fn_pgtap_crea_consumo(
                      v_ba, NULL, jsonb_build_object('pgtap_commessa_id', p_commessa_id)) c;
              END;
              $function$;
              
              COMMENT ON FUNCTION dbops.fn_pgtap_consumo_della_commessa(vendite.commesse.id%TYPE) IS
                'Fixture pgTAP: il consumo di prova di una commessa, lo stesso a ogni chiamata: lo trova (meta pgtap_commessa_id) o lo crea sul billing account della commessa (dbops.fn_pgtap_crea_consumo). Restituisce id e uid del consumo, il tipo della provenienza (ATTIVITA_CONSUMI) e la chiave del push del consumo, che il test estende col suffisso :<etichetta> (cosi'' ogni riga ha la sua base) per scrivere piu'' righe di commessa dalla stessa provenienza (un link solo alla commessa). Una commessa che non esiste parla.';
              
              GRANT EXECUTE ON FUNCTION dbops.fn_pgtap_consumo_della_commessa(vendite.commesse.id%TYPE) TO zeroerp_app;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION dbops.fn_pgtap_consumo_della_commessa(vendite.commesse.id%TYPE);
              DROP FUNCTION dbops.fn_pgtap_crea_consumo(anagrafiche.billing_account.id%TYPE, vendite.attivita_consumi.competenza_mese%TYPE, vendite.attivita_consumi.meta%TYPE);
