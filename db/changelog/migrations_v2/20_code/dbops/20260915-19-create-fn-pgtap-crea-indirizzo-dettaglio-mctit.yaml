# HELPER DI FIXTURE pgTAP: UN INDIRIZZO SI FABBRICA, NON SI CERCA
#   dbops.fn_pgtap_crea_indirizzo_dettaglio(p_etichetta) -> indirizzi_dettaglio.id
#   Brief: brief-db-magazzino-lotto-1-terreno-vuoto, sezione 7 e 11
#
# -- IL FATTO, misurato il 2026-09-15 su zeroerp_ci (scripts/ci-local.sh --fresh) --
#   Tre pgTAP del Lotto 1 di magazzino (movimenti-attesi-forma, movimenti-vincoli-v2,
#   valore-giacenza-forma) piu' rls/test-rls-magazzino-perimetro-v1 muoiono in
#   ERRORE_FIXTURE su un database ricostruito da zero, cioe' senza eseguire una
#   sola asserzione. La riga e' la stessa in tutti e quattro:
#
#     SELECT i.id INTO v_ind FROM anagrafiche.indirizzi_dettaglio i
#      WHERE i.attivo ORDER BY i.id LIMIT 1;
#
#   anagrafiche.indirizzi_dettaglio e' DATO DI MACCHINA: su dev ce ne sono
#   centinaia, su un DB nuovo zero. magazzino.magazzini.indirizzo_dettaglio_id e'
#   NOT NULL, quindi senza indirizzo non nasce un magazzino e non nasce niente.
#   E' il corollario della regola zero (AGENTS.md): «un test che itera su cio'
#   che c'e' passa a vuoto — o si sostituisce con un test che i soggetti se li
#   fabbrica». Quattro file con la stessa riga: regola del 2, si estrae.
#
# -- PERCHE' SI PUO' FABBRICARE ------------------------------------------------
#   config.stradario e' SEED (80_data, 4278 righe anche da zero): un indirizzo
#   e' (stradario_id, civico) piu' quello che il trigger BEFORE INSERT
#   anagrafiche.trgfn_indirizzi_dettaglio_normalize calcola da solo — via_norm,
#   civico_norm, indirizzo_normalizzato (tutti NOT NULL, ma il trigger BEFORE ROW
#   li riempie prima del vincolo). Stampo: anagrafiche/test-indirizzi-fallback.
#
# -- LA FORMA ------------------------------------------------------------------
#   Civico 99999 (un numero che una via vera non ha) e interno = etichetta:
#   due chiamate con etichette diverse danno due indirizzi (il test RLS ha due
#   aziende), la stessa etichetta ritorna lo stesso id — e' l'UNIQUE
#   uq_indirizzi_dettaglio_norm su (stradario, civico, coalesce dei sub-campi)
#   con ON CONFLICT DO UPDATE ... RETURNING, come lo stampo. Idempotente anche
#   su una macchina dove una riga cosi' fosse rimasta (i test annullano, ma un
#   RAISE a meta' fixture con un runner senza transazione la lascerebbe).
#   Provato il 15-09 su zeroerp_ci in transazione annullata: 'mag A' -> 1,
#   'mag B' -> 2, 'mag A' -> 1; via_norm/civico_norm riempiti dal trigger.
#
# Permessi: funzione di titodb, non SECURITY DEFINER, non in
# dbops.sec_functions_owner -> CREATE OR REPLACE liscio, nessun GRANT
# (stessa forma di 20260909-26). Nessuna RLS su indirizzi_dettaglio: dal
# runner zeroerp_app scrive come da applicazione.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20260915-19-create-fn-pgtap-crea-indirizzo-dettaglio-mctit.yaml

  - changeSet:
      id: 20260915-19-create-fn-pgtap-crea-indirizzo-dettaglio
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Helper di fixture pgTAP: dbops.fn_pgtap_crea_indirizzo_dettaglio(p_etichetta)
        fabbrica un anagrafiche.indirizzi_dettaglio sul primo stradario di seed invece
        di cercarne uno esistente — dato di macchina, assente su un DB ricostruito da
        zero, dove quattro pgTAP di magazzino morivano in ERRORE_FIXTURE. Brief:
        brief-db-magazzino-lotto-1-terreno-vuoto, sezione 7.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: anagrafiche
                tableName: indirizzi_dettaglio
            - tableExists:
                schemaName: config
                tableName: stradario
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_pgtap_crea_indirizzo_dettaglio(
                  p_etichetta text DEFAULT 'pgTAP'
              )
               RETURNS anagrafiche.indirizzi_dettaglio.id%TYPE
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: dare a una fixture pgTAP un indirizzo (anagrafiche.indirizzi_dettaglio)
              --   FABBRICANDOLO, non cercandolo: e' dato di macchina, e su un database
              --   ricostruito da zero non ce n'e' nessuno; config.stradario invece e' seed.
              --   Etichette diverse -> indirizzi diversi; la stessa etichetta -> lo stesso id.
              -- Uso:
              --   v_ind := dbops.fn_pgtap_crea_indirizzo_dettaglio('magazzino A');
              DECLARE
                  v_stradario_id config.stradario.id%TYPE;
                  v_id           anagrafiche.indirizzi_dettaglio.id%TYPE;
              BEGIN
                  -- Il primo stradario di seed: uno vale l'altro, serve solo come ancora.
                  SELECT s.id INTO v_stradario_id
                    FROM config.stradario s
                   ORDER BY s.id
                   LIMIT 1;
                  IF v_stradario_id IS NULL THEN
                      RAISE EXCEPTION 'fn_pgtap_crea_indirizzo_dettaglio: config.stradario e'' vuoto — e'' un seed di 80_data, non un dato di macchina';
                  END IF;

                  -- via_norm, civico_norm e indirizzo_normalizzato li calcola il trigger
                  -- BEFORE INSERT (trgfn_indirizzi_dettaglio_normalize). L'ON CONFLICT e'
                  -- sull'espressione esatta di uq_indirizzi_dettaglio_norm.
                  INSERT INTO anagrafiche.indirizzi_dettaglio (stradario_id, civico, interno, altro)
                  VALUES (v_stradario_id, 99999, left(p_etichetta, 10), 'Fixture pgTAP: ' || p_etichetta)
                  ON CONFLICT (stradario_id, civico,
                               COALESCE(estensione_civico, ''::character varying),
                               COALESCE(palazzina,         ''::character varying),
                               COALESCE(scala,             ''::character varying),
                               COALESCE(piano,             ''::character varying),
                               COALESCE(interno,           ''::character varying))
                  DO UPDATE SET data_update = now()
                  RETURNING id INTO v_id;

                  RETURN v_id;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_pgtap_crea_indirizzo_dettaglio(text)
              IS 'Helper di fixture pgTAP: fabbrica un anagrafiche.indirizzi_dettaglio (civico 99999 sul primo stradario di seed, interno = etichetta) e ne ritorna l''id; etichette diverse danno indirizzi diversi, la stessa etichetta lo stesso id. Esiste perche'' indirizzi_dettaglio e'' DATO DI MACCHINA: su un database ricostruito da zero non ce n''e'' nessuno, e una fixture che ne cerca uno «attivo» muore in ERRORE_FIXTURE senza eseguire un''asserzione — misurato il 2026-09-15 su quattro pgTAP di magazzino (magazzini.indirizzo_dettaglio_id e'' NOT NULL). ⚠️ Non e'' un indirizzo vero: un test che verifichi la normalizzazione o la geolocalizzazione si costruisce il suo.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS dbops.fn_pgtap_crea_indirizzo_dettaglio(text);
