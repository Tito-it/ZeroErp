# dbops.fn_search_column_usage: i vincoli si leggono, e i corpi dal building
# block. Firma ancorata, COMMENT nuovo.
#   Brief: brief-db-revisione-dbops, D54 + D15 (giro 1), §3.2.
#
# Base: baseline/sql/dbops/fn_search_column_usage.sql, uguale al vivo.
#   1. D54 — il ramo dei vincoli cercava il nome in pg_constraint.conbin, dove
#      le colonne sono scritte `:varattno N` e non per nome: rispondeva sempre
#      vuoto. Ora cerca nel testo di pg_get_constraintdef (CHECK, FK, UNIQUE,
#      PRIMARY KEY, EXCLUDE), che nomina le colonne.
#   2. D15 — il ramo delle funzioni leggeva prosrc: cieco sulle BEGIN ATOMIC, e
#      una colonna nominata in un commento contava. Ora dbops.fn_corpo_funzione
#      (20261104-20).
#   3. La firma si ancora al catalogo: il parametro e' un nome di colonna
#      (pg_attribute.attname), schema_name e' pg_namespace.nspname.
#      object_type e' un'etichetta calcolata, object_name il nome di oggetti di
#      cataloghi diversi (vista, regola, funzione, vincolo): text.
#      ⚠️ text → name cambia l'identita': DROP e CREATE. Nessun chiamante
#      (censimento del giro C1, 2026-11-04). I GRANT li rifa' il loop di ci_apply.
#   4. Non aveva COMMENT (§3.2): lo prende.
#   Il confronto resta per SOTTOSTRINGA e senza distinguere le maiuscole
#   (ILIKE), in tutti i rami, com'era.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261104-31-update-fn-search-column-usage-vincoli-e-corpo-mctit.yaml

  - changeSet:
      id: 20261104-31-update-fn-search-column-usage-vincoli-e-corpo
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.fn_search_column_usage: il ramo dei vincoli legge pg_get_constraintdef (conbin non
        nomina le colonne: rispondeva sempre vuoto), quello delle funzioni dbops.fn_corpo_funzione;
        firma ancorata; COMMENT.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'dbops' AND p.proname = 'fn_corpo_funzione';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION IF EXISTS dbops.fn_search_column_usage(text);

              CREATE FUNCTION dbops.fn_search_column_usage(
                  p_column_name pg_catalog.pg_attribute.attname%TYPE
              )
              RETURNS TABLE(
                  object_type text,                                -- etichetta calcolata
                  schema_name pg_catalog.pg_namespace.nspname%TYPE,
                  object_name text                                 -- oggetti di cataloghi diversi
              )
              LANGUAGE sql
              STABLE
              SECURITY INVOKER
              AS $function$
                  -- Viste
                  SELECT 'view'::text        AS object_type,
                         schemaname          AS schema_name,
                         viewname::text      AS object_name
                    FROM pg_catalog.pg_views
                   WHERE definition ILIKE '%' || p_column_name || '%'

                  UNION ALL

                  -- Viste materializzate
                  SELECT 'materialized_view'::text,
                         schemaname,
                         matviewname::text
                    FROM pg_catalog.pg_matviews
                   WHERE definition ILIKE '%' || p_column_name || '%'

                  UNION ALL

                  -- Regole
                  SELECT 'rule'::text,
                         schemaname,
                         rulename::text
                    FROM pg_catalog.pg_rules
                   WHERE definition ILIKE '%' || p_column_name || '%'

                  UNION ALL

                  -- Funzioni: il corpo senza commenti, anche delle BEGIN ATOMIC
                  SELECT 'function'::text,
                         n.nspname,
                         p.proname::text
                    FROM pg_catalog.pg_proc p
                    JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
                   WHERE dbops.fn_corpo_funzione(p.oid) ILIKE '%' || p_column_name || '%'

                  UNION ALL

                  -- Vincoli: la definizione in chiaro. conbin scrive le colonne
                  -- per numero (:varattno N) e non le nominerebbe mai.
                  SELECT 'constraint'::text,
                         n.nspname,
                         con.conname::text
                    FROM pg_catalog.pg_constraint con
                    JOIN pg_catalog.pg_namespace n ON n.oid = con.connamespace
                   WHERE pg_catalog.pg_get_constraintdef(con.oid) ILIKE '%' || p_column_name || '%';
              $function$;

              COMMENT ON FUNCTION dbops.fn_search_column_usage(pg_catalog.pg_attribute.attname%TYPE) IS
                  'Strumento DBA: dove si nomina una colonna, dato il suo nome. Cerca nelle definizioni di viste, viste materializzate e regole, nel corpo delle funzioni (letto da dbops.fn_corpo_funzione: senza commenti, anche per le funzioni SQL BEGIN ATOMIC) e nella definizione dei vincoli (pg_get_constraintdef: CHECK, FK, UNIQUE, chiavi). Il confronto e'' per SOTTOSTRINGA e senza maiuscole: cercando id esce quasi tutto, e un nome uguale in un''altra tabella esce lo stesso. E'' un elenco da guardare, non le dipendenze: quelle esatte stanno in pg_depend. Nessun chiamante applicativo.';
      rollback:
        - sql:
            dbms: postgresql
            sql: |
              -- Il verso di ritiro e' un changeSet nuovo dal corpo di baseline/sql/dbops/fn_search_column_usage.sql.
              SELECT 1;
