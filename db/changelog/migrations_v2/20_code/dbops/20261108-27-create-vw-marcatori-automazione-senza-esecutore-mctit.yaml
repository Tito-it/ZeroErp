# D35/D37 — IL PRESIDIO: una colonna che promette un'automazione ha un esecutore
#   Brief: brief-db-revisione-dbops, giro 7 (§20). Perimetro deciso da Tid
#   (2026-11-07): tx_id, storicizza, cleanup_at.
#
# ── ⭐ IL CRITERIO, dal catalogo e non da un elenco ─────────────────
#   Il marcatore e' il NOME della colonna, come lo leggono i runner:
#     tx_id      → dbops.fn_run_automations_tx_id monta dbops.trgfn_tx_id_managed;
#     storicizza → la provision crea la shadow, fn_run_automations_storico monta
#                  script.trgfn_storico_generic;
#     cleanup_at → fn_run_automations_cleanup scade e purga.
#   Una tabella e' SERVITA DAI RUNNER se e' una tabella ordinaria (relkind 'r',
#   partizioni comprese: i runner le scorrono una a una), il suo schema e' fra
#   quelli di dbops.fn_resolve_scope e dbops.fn_table_in_scope la ammette: e'
#   lo stesso filtro che i runner applicano (letto sui loro corpi, 2026-11-07).
#   Per tx_id e storicizza vale anche il trigger montato A MANO (dbops monta cosi'
#   i suoi registri: processi, coda_lavori, rls_perimetro_debito). Per
#   cleanup_at no: il purge e' solo il runner, e una tabella in
#   dbops.automation_cleanup_exclusions (enabled) non la purga nessuno.
#
# ── ⚠️ «NELL'AMBITO» E NON «TRIGGER MONTATO», per i runner ──────────
#   Una tabella nuova nell'ambito non ha i trigger finche' la convergenza non
#   gira (ci_apply, o i job notturni su dbdev): la promessa ha un esecutore,
#   che arriva. Guardare il trigger farebbe rosso il presidio fra l'apply e la
#   convergenza, cioe' su un caso che il modello prevede.
#
# ⛔ Fuori dal criterio: lo schema storico (le shadow ricopiano le colonne della
#   madre: i loro marcatori sono una copia, non una promessa) e gli schemi di
#   sistema. Un trigger DISABILITATO non e' un esecutore.
#
# ⭐ Tre stati, come dbops.vw_rls_perimetro_scoperto: NON_DICHIARATO e' un
#   allarme, DEBITO_DICHIARATO e' atteso (riga in
#   dbops.marcatori_automazione_debito), DEBITO_ESTINTO e' una riga di registro
#   che non trova piu' il suo caso e va tolta.
#
# Le funzioni trigger si riconoscono per nome e schema, non per OID: una
#   costante regprocedure nella vista legherebbe la funzione alla vista.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261108-27-create-vw-marcatori-automazione-senza-esecutore-mctit.yaml

  - changeSet:
      id: 20261108-27-create-vw-marcatori-automazione-senza-esecutore
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Crea dbops.vw_marcatori_automazione_senza_esecutore: le tabelle con una colonna tx_id,
        storicizza o cleanup_at che nessuna automazione serve, con lo stato del debito dichiarato in
        dbops.marcatori_automazione_debito. Brief: brief-db-revisione-dbops, giro 7.
      preConditions:
        - onFail: HALT
        - tableExists:
            { schemaName: dbops, tableName: marcatori_automazione_debito }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW dbops.vw_marcatori_automazione_senza_esecutore
              WITH (security_invoker = on) AS
              WITH ambito AS (
                  -- Una volta sola: e' la stessa risposta per ogni tabella.
                  SELECT dbops.fn_resolve_scope(NULL::text[]) AS schemi
              ), tabelle AS (
                  SELECT c.oid,
                         n.nspname::text AS schema_tabella,
                         c.relname::text AS nome_tabella,
                         (n.nspname::text = ANY (a.schemi)
                          AND dbops.fn_table_in_scope(n.nspname::text, c.relname::text)) AS servita_dai_runner
                    FROM pg_class c
                    JOIN pg_namespace n ON n.oid = c.relnamespace
                   CROSS JOIN ambito a
                   WHERE c.relkind = 'r'
                     AND n.nspname <> ALL (ARRAY['information_schema'::name, 'storico'::name])
                     AND n.nspname !~ '^pg_'
              ), marcatori AS (
                  SELECT t.oid, t.schema_tabella, t.nome_tabella, t.servita_dai_runner, m.marcatore
                    FROM tabelle t
                    JOIN pg_attribute att
                      ON att.attrelid = t.oid
                     AND att.attnum > 0
                     AND NOT att.attisdropped
                    JOIN (VALUES ('tx_id'::name,      'TX_ID'::text),
                                 ('storicizza'::name, 'STORICIZZA'::text),
                                 ('cleanup_at'::name, 'CLEANUP_AT'::text)) m(colonna, marcatore)
                      ON m.colonna = att.attname
              ), esecutori AS (
                  SELECT m.*,
                         EXISTS (
                             SELECT 1
                               FROM pg_trigger tg
                               JOIN pg_proc p ON p.oid = tg.tgfoid
                               JOIN pg_namespace pn ON pn.oid = p.pronamespace
                              WHERE tg.tgrelid = m.oid
                                AND NOT tg.tgisinternal
                                AND tg.tgenabled <> 'D'
                                AND (pn.nspname, p.proname) = (CASE m.marcatore
                                                                   WHEN 'TX_ID'      THEN 'dbops'::name
                                                                   WHEN 'STORICIZZA' THEN 'script'::name
                                                               END,
                                                               CASE m.marcatore
                                                                   WHEN 'TX_ID'      THEN 'trgfn_tx_id_managed'::name
                                                                   WHEN 'STORICIZZA' THEN 'trgfn_storico_generic'::name
                                                               END)
                         ) AS trigger_a_mano,
                         EXISTS (
                             SELECT 1
                               FROM dbops.automation_cleanup_exclusions e
                              WHERE e.enabled
                                AND e.schema_name = m.schema_tabella
                                AND e.table_name  = m.nome_tabella
                         ) AS esclusa_dalla_pulizia
                    FROM marcatori m
              ), scoperti AS (
                  SELECT e.marcatore,
                         e.schema_tabella,
                         e.nome_tabella,
                         CASE
                             WHEN e.marcatore = 'TX_ID' THEN
                                 'il trigger di dbops.trgfn_tx_id_managed: la tabella non e'' nell''ambito delle automazioni e nessuno lo ha montato a mano, quindi tx_id resta vuoto'
                             WHEN e.marcatore = 'STORICIZZA' THEN
                                 'il trigger di script.trgfn_storico_generic: la tabella non e'' nell''ambito delle automazioni e nessuno lo ha montato a mano, quindi storicizza non produce nessuna versione'
                             WHEN e.esclusa_dalla_pulizia THEN
                                 'il purge: la tabella e'' esclusa da dbops.automation_cleanup_exclusions, quindi cleanup_at non fa scadere niente'
                             ELSE
                                 'il purge: la tabella non e'' nell''ambito delle automazioni, quindi cleanup_at non fa scadere niente'
                         END AS manca
                    FROM esecutori e
                   WHERE CASE e.marcatore
                             WHEN 'CLEANUP_AT' THEN NOT (e.servita_dai_runner AND NOT e.esclusa_dalla_pulizia)
                             ELSE NOT (e.servita_dai_runner OR e.trigger_a_mano)
                         END
              )
              SELECT s.marcatore,
                     s.schema_tabella,
                     s.nome_tabella,
                     s.manca,
                     CASE WHEN d.id IS NULL THEN 'NON_DICHIARATO'::text
                          ELSE 'DEBITO_DICHIARATO'::text
                     END AS stato,
                     d.ragione,
                     d.data_registrazione
                FROM scoperti s
                LEFT JOIN dbops.marcatori_automazione_debito d
                  ON d.marcatore      = s.marcatore
                 AND d.schema_tabella = s.schema_tabella
                 AND d.nome_tabella   = s.nome_tabella
              UNION ALL
              SELECT d.marcatore,
                     d.schema_tabella,
                     d.nome_tabella,
                     'niente: il marcatore ha un esecutore, la colonna non c''e'' piu'' o la tabella non esiste. La riga va tolta dal CSV del registro'::text AS manca,
                     'DEBITO_ESTINTO'::text AS stato,
                     d.ragione,
                     d.data_registrazione
                FROM dbops.marcatori_automazione_debito d
               WHERE NOT EXISTS (
                         SELECT 1
                           FROM scoperti s
                          WHERE s.marcatore      = d.marcatore
                            AND s.schema_tabella = d.schema_tabella
                            AND s.nome_tabella   = d.nome_tabella);

              COMMENT ON VIEW dbops.vw_marcatori_automazione_senza_esecutore IS
                  'Le tabelle con una colonna che promette un''automazione che nessuno esegue: tx_id senza il trigger di dbops.trgfn_tx_id_managed, storicizza senza quello di script.trgfn_storico_generic, cleanup_at senza il purge. Una tabella e'' servita dai runner se e'' ordinaria (partizioni comprese), il suo schema e'' in dbops.fn_resolve_scope e dbops.fn_table_in_scope la ammette; per tx_id e storicizza basta anche il trigger montato a mano e abilitato; per cleanup_at no, e una tabella esclusa in dbops.automation_cleanup_exclusions resta scoperta. Lo schema storico e gli schemi di sistema sono fuori: le shadow ricopiano le colonne della madre. Tre stati: NON_DICHIARATO e'' un allarme, DEBITO_DICHIARATO e'' il debito noto di dbops.marcatori_automazione_debito, DEBITO_ESTINTO e'' una riga di registro da togliere. A catalogo in dbops.presidi; lo prova dbops/test-marcatori-automazione-senza-esecutore-v1.';
              COMMENT ON COLUMN dbops.vw_marcatori_automazione_senza_esecutore.marcatore IS
                  'TX_ID, STORICIZZA o CLEANUP_AT: la colonna che promette, nel vocabolario del CHECK di dbops.marcatori_automazione_debito.';
              COMMENT ON COLUMN dbops.vw_marcatori_automazione_senza_esecutore.manca IS
                  'Che cosa manca perche'' la promessa sia mantenuta, in una frase: l''esecutore e il perche'' non c''e''.';
              COMMENT ON COLUMN dbops.vw_marcatori_automazione_senza_esecutore.stato IS
                  'NON_DICHIARATO (allarme), DEBITO_DICHIARATO (riga nel registro), DEBITO_ESTINTO (riga del registro senza piu'' il suo caso). Lo stato atteso per il catalogo dei presidi e'' DEBITO_DICHIARATO.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP VIEW IF EXISTS dbops.vw_marcatori_automazione_senza_esecutore;
