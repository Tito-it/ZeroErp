# dbops.fn_apply_automazione_guard_utility_tipo_ruolo: la porta storica chiama il runner (N5). La chiama
#   ancora ci_apply/20250627-31, che non si riscrive: una sola regola, nessuna copia. Corpo di partenza dal
#   catalogo dello scratch (2026-11-08); rollback = corpo e COMMENT di prima. Brief: brief-db-revisione-dbops, giro 10c, blocco 10c-2 (§28).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261110-02-update-fn-apply-automazione-guard-utility-porta-al-runner-mctit.yaml

  - changeSet:
      id: 20261110-02-update-fn-apply-automazione-guard-utility-porta-al-runner
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        fn_apply_automazione_guard_utility_tipo_ruolo: la porta storica chiama il runner. Brief: brief-db-revisione-dbops, giro 10c, blocco 10c-2 (§28).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_proc
               WHERE oid = to_regprocedure('dbops.fn_apply_automazione_guard_utility_tipo_ruolo(text,boolean)')
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_proc
               WHERE oid = to_regprocedure('dbops.fn_run_automations_guard_utility(text,text[],boolean)')
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_apply_automazione_guard_utility_tipo_ruolo(p_exec_mode text DEFAULT 'AUTO'::text, p_dry_run boolean DEFAULT false)
               RETURNS void
               LANGUAGE plpgsql
              AS $function$
              BEGIN
                -- Scopo: la porta storica del guard utility/tipo ruolo, che il primo giro di ci_apply
                --   chiama ancora. Il lavoro lo fa il runner che converge,
                --   dbops.fn_run_automations_guard_utility, su tutto l'ambito: qui non c'e' una seconda
                --   copia della regola.
                PERFORM dbops.fn_run_automations_guard_utility(p_exec_mode, NULL, p_dry_run);
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_apply_automazione_guard_utility_tipo_ruolo(text, boolean) IS
              'La porta storica del guard utility/tipo ruolo: chiama dbops.fn_run_automations_guard_utility(p_exec_mode, NULL, p_dry_run), il runner che porta i trigger allo stato di dbops.automazione_guard_utility_tipo_ruolo. Resta perche'' la chiama il primo giro di ci_apply; il processo automations_guard_utility chiama il runner.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_apply_automazione_guard_utility_tipo_ruolo(p_exec_mode text DEFAULT 'AUTO'::text, p_dry_run boolean DEFAULT false)
               RETURNS void
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                rconf record;
                v_trigger_name text;
                v_table_qualified text;
              BEGIN
                FOR rconf IN
                  SELECT *
                   FROM dbops.automazione_guard_utility_tipo_ruolo
                   WHERE enabled = true
                     AND (
                       upper(btrim(exec_mode)) = 'AUTO'
                       OR upper(btrim(exec_mode)) = upper(btrim(p_exec_mode))
                     )
                     AND soggetto_ruolo_column LIKE '%_soggetto_ruolo_id'
                   ORDER BY schema_name, table_name
                LOOP
                  IF NOT dbops.fn_col_exists(rconf.schema_name, rconf.table_name, rconf.utility_column)
                     OR NOT dbops.fn_col_exists(rconf.schema_name, rconf.table_name, rconf.soggetto_ruolo_column)
                  THEN
                    CONTINUE;
                  END IF;

                  v_table_qualified := quote_ident(rconf.schema_name) || '.' || quote_ident(rconf.table_name);
                  v_trigger_name := COALESCE(
                    rconf.trigger_name,
                    dbops.fn_name_from_template(
                      'trg_{table}_a10_guard_utility_tipo_ruolo_ins_upd',
                      rconf.schema_name,
                      rconf.table_name,
                      NULL,
                      NULL,
                      NULL,
                      NULL
                    )
                  );

                  IF p_dry_run THEN
                    CONTINUE;
                  END IF;

                  EXECUTE format('DROP TRIGGER IF EXISTS %I ON %s;', v_trigger_name, v_table_qualified);

                  EXECUTE format(
                    'CREATE TRIGGER %I
                     BEFORE INSERT OR UPDATE OF %I, %I ON %s
                     FOR EACH ROW
                     EXECUTE FUNCTION script.trgfn_guard_utility_tipo_ruolo_by_cols(%L, %L);',
                    v_trigger_name,
                    rconf.utility_column,
                    rconf.soggetto_ruolo_column,
                    v_table_qualified,
                    rconf.utility_column,
                    rconf.soggetto_ruolo_column
                  );
                END LOOP;
              END;
              $function$
              ;

              COMMENT ON FUNCTION dbops.fn_apply_automazione_guard_utility_tipo_ruolo(text,boolean) IS 'Applica trigger guard utility->tipo_ruolo sulle tabelle configurate in dbops.automazione_guard_utility_tipo_ruolo.';
