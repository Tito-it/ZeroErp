# dbops.fn_idempotency_prenota — LA RIPRESA DI UNA KEY IN CORSO LA DICHIARA IL CHIAMANTE
#   Brief: brief-be-verifica-documentazione-api §I.7.3 (decisione di Tid del
#   2026-10-23: unità di lavoro dichiarata).
#
# -- PERCHE' ---------------------------------------------------------------------
#   La ripresa di una key in_progress oltre la soglia (D6, 20261023-04) e' sicura
#   a una condizione: che l'esito completed si scriva nella STESSA transazione
#   dell'operazione. Allora una in_progress orfana vuol dire «nessun commit».
#   La condizione non vale per ogni endpoint: quelli che lavorano A PASSI, con
#   un commit per passo (la pipeline del lotto, la numerazione del lotto, il
#   push delle commesse), possono lasciare orfana una key dopo aver gia' fatto
#   commit di una parte del lavoro. Riprenderla la rifarebbe.
#   ⇒ La funzione non puo' saperlo da sola: lo dichiara il chiamante, a ogni
#   richiesta. La dichiarazione e' della richiesta, non della key: nessuna
#   colonna nuova.
#
# -- CHE COSA CAMBIA -----------------------------------------------------------------
#   * parametro nuovo in coda, p_ripresa_ammessa boolean:
#       true  → come oggi: oltre la soglia una in_progress si riprende (ramo 5);
#       false → una in_progress resta IN_CORSO anche oltre la soglia, finche'
#               la key scade o il frontend ne genera una nuova dopo il gesto;
#     una failed si riprende in entrambi i casi: l'esito l'ha scritto il
#     backend, quindi lo stato e' noto;
#   * ⛔ la dichiarazione e' OBBLIGATORIA. Il DEFAULT NULL c'e' solo perche'
#     p_request_id, prima, ne ha uno (un parametro accodato lo pretende); NULL
#     e' E_SCRIPT_CHIAMATA_NON_VALIDA. Un default true accenderebbe la ripresa
#     a chi non l'ha dichiarata, cioe' proprio il caso non sicuro; un default
#     false spegnerebbe in silenzio la ripresa a chi si dimentica di
#     dichiararla. Nessuno dei due e' un valore del modello;
#   * con p_ripresa_ammessa false la soglia non si legge: non decide niente.
#   * ⛔ FIRMA NUOVA: DROP della firma a quattro e CREATE. Accanto alla vecchia,
#     (a, b, c, d DEFAULT …) e (a, b, c, d DEFAULT …, e DEFAULT …) renderebbero
#     ambigua ogni chiamata a tre o quattro argomenti.
#
# -- CHI LA CHIAMA (censiti il 2026-10-23) ----------------------------------------------
#   * il pgTAP dbops/test-idempotency-prenota-v1, riscritto nello stesso giro;
#   * il backend NON ancora: BE-1 (IdempotencyStore.claim_or_replay) la
#     adotta dopo questo apply, gia' con il parametro (§I.7.4).
#   Nessuna vista, nessuna funzione del DB la chiama.
#
#   Corpo dalla doc auto-gen (identico a 20261023-04, verificato il 2026-10-23);
#   firma, RETURNS TABLE, DROP e COMMENT con %TYPE; SECURITY INVOKER esplicito.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261023-06-update-fn-idempotency-prenota-ripresa-ammessa-mctit.yaml

  - changeSet:
      id: 20261023-06-update-fn-idempotency-prenota-ripresa-ammessa
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.fn_idempotency_prenota riceve p_ripresa_ammessa (obbligatorio): la ripresa di una key
        in_progress oltre la soglia vale solo se il chiamante dichiara che completed sta nella
        transazione dell'operazione; con false la key resta IN_CORSO. Firma nuova: DROP della
        firma a quattro. Brief: brief-be-verifica-documentazione-api §I.7.3.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION IF EXISTS dbops.fn_idempotency_prenota(
                  dbops.idempotency_keys.idempotency_key%TYPE,
                  dbops.idempotency_keys.auth_user_id%TYPE,
                  dbops.idempotency_keys.endpoint%TYPE,
                  dbops.idempotency_keys.request_id%TYPE);

              CREATE OR REPLACE FUNCTION dbops.fn_idempotency_prenota(
                  p_idempotency_key  dbops.idempotency_keys.idempotency_key%TYPE,
                  p_auth_user_id     dbops.idempotency_keys.auth_user_id%TYPE,
                  p_endpoint         dbops.idempotency_keys.endpoint%TYPE,
                  p_request_id       dbops.idempotency_keys.request_id%TYPE DEFAULT NULL,
                  -- dichiarazione della richiesta, non della key: nessuna colonna
                  -- di cui sia il riflesso. Obbligatoria: NULL e' un errore.
                  p_ripresa_ammessa  boolean DEFAULT NULL)
               RETURNS TABLE (
                  -- ESEGUI | REPLAY | IN_CORSO: un verdetto, nessuna colonna di cui sia il riflesso
                  esito            text,
                  response_payload dbops.idempotency_keys.response_payload%TYPE)
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              DECLARE
                  v_riga           dbops.idempotency_keys%ROWTYPE;
                  -- il valore grezzo del parametro, prima della validazione
                  v_soglia_testo   config.parameters.default_value%TYPE;
                  -- secondi: un intero validato, non una colonna
                  v_soglia_secondi integer;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Prenotare una Idempotency-Key per una richiesta, e dire al
                  --   backend che cosa fare:
                  --     ESEGUI   — la key e' sua: esegua l'operazione;
                  --     REPLAY   — l'operazione e' gia' stata fatta: rimandi
                  --                response_payload;
                  --     IN_CORSO — la sta eseguendo un'altra richiesta: 409
                  --                E_IDEMPOTENCY_IN_PROGRESS (lo solleva il backend).
                  --
                  -- Regole:
                  --   - key nuova                         → ESEGUI
                  --   - key di un altro utente o endpoint → E_IDEMPOTENCY_KEY_RIUSATA
                  --   - completed                         → REPLAY
                  --   - failed                            → ripresa, ESEGUI
                  --   - in_progress entro la soglia       → IN_CORSO
                  --   - in_progress oltre la soglia:
                  --       ripresa ammessa                 → ripresa, ESEGUI (D6)
                  --       ripresa non ammessa             → IN_CORSO
                  --
                  -- ⛔ La ripresa di una in_progress e' sicura solo se il backend
                  --   scrive completed nella stessa transazione dell'operazione:
                  --   e' cio' che dichiara p_ripresa_ammessa (changeSet 20261023-06).
                  -- =========================================================

                  -- Guard di parametro: forme che nessuna richiesta produce.
                  IF NULLIF(btrim(p_idempotency_key), '') IS NULL
                     OR NULLIF(btrim(p_endpoint), '') IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'dbops', 'dbops.fn_idempotency_prenota', 'E_SCRIPT_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('detail', 'key ed endpoint obbligatori',
                                             'p_endpoint', p_endpoint),
                          NULL::uuid,
                          'dbops.fn_idempotency_prenota',
                          'la key e l''endpoint della richiesta sono obbligatori');
                  END IF;

                  -- La ripresa si dichiara sempre: ne' true ne' false sono un
                  -- default del modello (intestazione di 20261023-06).
                  IF p_ripresa_ammessa IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'dbops', 'dbops.fn_idempotency_prenota', 'E_SCRIPT_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('detail', 'p_ripresa_ammessa obbligatorio',
                                             'p_endpoint', p_endpoint),
                          NULL::uuid,
                          'dbops.fn_idempotency_prenota',
                          'il chiamante deve dichiarare se la ripresa di una key in corso e'' ammessa');
                  END IF;

                  -- 1. Key nuova: la prenotazione e' di chi la scrive.
                  INSERT INTO dbops.idempotency_keys (
                      idempotency_key, request_id, status, auth_user_id, endpoint)
                  VALUES (p_idempotency_key, p_request_id, 'in_progress', p_auth_user_id, p_endpoint)
                  ON CONFLICT (idempotency_key) DO NOTHING
                  RETURNING * INTO v_riga;

                  IF FOUND THEN
                      RETURN QUERY SELECT 'ESEGUI'::text, NULL::jsonb;
                      RETURN;
                  END IF;

                  -- 2. La key c'e'. FOR UPDATE: due riprese concorrenti non
                  --    eseguono entrambe, e un'operazione che sta scrivendo
                  --    completed si aspetta per l'istante del suo commit.
                  SELECT * INTO v_riga
                    FROM dbops.idempotency_keys k
                   WHERE k.idempotency_key = p_idempotency_key
                     FOR UPDATE;

                  IF NOT FOUND THEN
                      -- Purgata fra i due passi (la regola 24 la fa scadere dopo
                      -- un giorno): e' di nuovo una key nuova. Se un'altra
                      -- richiesta l'ha appena riscritta, e' sua e sta lavorando.
                      INSERT INTO dbops.idempotency_keys (
                          idempotency_key, request_id, status, auth_user_id, endpoint)
                      VALUES (p_idempotency_key, p_request_id, 'in_progress', p_auth_user_id, p_endpoint)
                      ON CONFLICT (idempotency_key) DO NOTHING;
                      RETURN QUERY SELECT (CASE WHEN FOUND THEN 'ESEGUI' ELSE 'IN_CORSO' END)::text,
                                          NULL::jsonb;
                      RETURN;
                  END IF;

                  -- 3. D7: la key e' di chi l'ha prenotata, su quell'endpoint.
                  --    ⚠️ endpoint NULL = riga nata prima del 2026-10-23: nessun
                  --    legame da confrontare.
                  --    ⛔ Nel contesto non entrano utente ed endpoint dell'ALTRO:
                  --    sono proprio cio' che non va rivelato a chi rimanda la key.
                  IF v_riga.endpoint IS NOT NULL
                     AND (v_riga.endpoint     IS DISTINCT FROM p_endpoint
                       OR v_riga.auth_user_id IS DISTINCT FROM p_auth_user_id) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'dbops', 'dbops.fn_idempotency_prenota', 'E_IDEMPOTENCY_KEY_RIUSATA',
                          jsonb_build_object('detail', 'key prenotata da un altro utente o su un altro endpoint',
                                             'endpoint', p_endpoint),
                          NULL::uuid,
                          VARIADIC ARRAY[]::text[]);
                  END IF;

                  -- 4. Fatta: si rimanda la risposta salvata.
                  --    ⭐ Si decide dalla RISPOSTA e non dall'esito: per
                  --    chk_idempotency_keys_risposta_solo_completed (20261023-03)
                  --    c'e' se e solo se la key e' completed. Cosi' la funzione non
                  --    nomina gli esiti che scrive il backend: il presidio C1
                  --    (dbops.vw_stati_check_scrittori) e' testuale, e conterebbe
                  --    questa funzione fra i loro scrittori.
                  IF v_riga.response_payload IS NOT NULL THEN
                      RETURN QUERY SELECT 'REPLAY'::text, v_riga.response_payload;
                      RETURN;
                  END IF;

                  -- 5. In corso: entro la soglia lavora qualcun altro; oltre, chi
                  --    lavorava e' morto (D6) e si riprende, se il chiamante
                  --    dichiara che la morte vuol dire «nessun commit».
                  --    prenotata_at e' l'ora della prenotazione o della ripresa
                  --    (20261023-03); non data_update, che il trigger di audit
                  --    riscrive a ogni UPDATE.
                  IF v_riga.status = 'in_progress' THEN
                      -- Ripresa non ammessa: l'operazione lavora a passi, e una
                      -- key orfana puo' coprire un lavoro gia' in parte
                      -- committato. Resta in corso; la soglia non decide niente.
                      IF NOT p_ripresa_ammessa THEN
                          RETURN QUERY SELECT 'IN_CORSO'::text, NULL::jsonb;
                          RETURN;
                      END IF;

                      SELECT p.default_value INTO v_soglia_testo
                        FROM config.parameters p
                       WHERE p.code = 'SYSTEM_IDEMPOTENZA_IN_CORSO_SECONDI';

                      -- Fail-loud: assente, vuoto o non intero positivo e'
                      -- un'installazione rotta, mai un valore di ripiego.
                      IF COALESCE(v_soglia_testo, '') !~ '^[1-9][0-9]{0,5}$' THEN
                          PERFORM script.fn_log_and_raise_error(
                              'dbops', 'dbops.fn_idempotency_prenota', 'E_CONFIG_MANCANTE',
                              jsonb_build_object('config',    'config.parameters',
                                                 'parametro', 'SYSTEM_IDEMPOTENZA_IN_CORSO_SECONDI',
                                                 'valore',    v_soglia_testo),
                              NULL::uuid,
                              VARIADIC ARRAY['parametro SYSTEM_IDEMPOTENZA_IN_CORSO_SECONDI (intero positivo)']);
                      END IF;
                      v_soglia_secondi := v_soglia_testo::integer;

                      IF v_riga.prenotata_at > now() - make_interval(secs => v_soglia_secondi) THEN
                          RETURN QUERY SELECT 'IN_CORSO'::text, NULL::jsonb;
                          RETURN;
                      END IF;
                  END IF;

                  -- 6. Ripresa: failed (l'esito l'ha scritto il backend: lo stato
                  --    e' noto, con o senza ripresa ammessa), o in_progress
                  --    abbandonata con ripresa ammessa. La riga si lega a chi la
                  --    riprende (le righe senza legame lo prendono qui).
                  UPDATE dbops.idempotency_keys k
                     SET status           = 'in_progress',
                         request_id       = p_request_id,
                         tx_id            = NULL,
                         response_payload = NULL,
                         auth_user_id     = p_auth_user_id,
                         endpoint         = p_endpoint,
                         prenotata_at     = now(),
                         data_update      = now(),
                         user_update      = CURRENT_USER
                   WHERE k.idempotency_key = p_idempotency_key;

                  RETURN QUERY SELECT 'ESEGUI'::text, NULL::jsonb;
              END;
              $function$;

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION dbops.fn_idempotency_prenota(
                  dbops.idempotency_keys.idempotency_key%TYPE,
                  dbops.idempotency_keys.auth_user_id%TYPE,
                  dbops.idempotency_keys.endpoint%TYPE,
                  dbops.idempotency_keys.request_id%TYPE,
                  boolean)
                IS 'Prenota una Idempotency-Key per una richiesta e risponde al backend: ESEGUI (la key e'' sua), REPLAY (operazione gia'' fatta: response_payload), IN_CORSO (la sta eseguendo un''altra richiesta: il backend solleva E_IDEMPOTENCY_IN_PROGRESS). Una key failed si riprende sempre. Una key in_progress da oltre SYSTEM_IDEMPOTENZA_IN_CORSO_SECONDI (config.parameters, sopra il timeout di gunicorn) si riprende solo con p_ripresa_ammessa = true (D6), che il chiamante dichiara quando completed sta nella STESSA transazione dell''operazione: allora una in_progress orfana vuol dire «nessun commit». Con false (operazione a passi) resta IN_CORSO. p_ripresa_ammessa e'' obbligatorio: NULL e'' E_SCRIPT_CHIAMATA_NON_VALIDA. Una key prenotata da un altro utente o su un altro endpoint solleva E_IDEMPOTENCY_KEY_RIUSATA (D7); le righe nate prima del 2026-10-23 (endpoint NULL) non hanno legame e lo prendono alla ripresa. La prenotazione committa da sola: le altre richieste la vedono subito e non aspettano. SECURITY INVOKER. Brief: brief-be-verifica-documentazione-api D6, D7, §I.7.3.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS dbops.fn_idempotency_prenota(text, integer, text, uuid, boolean);
              -- la firma a quattro si ricrea da 20261023-04, se servisse
