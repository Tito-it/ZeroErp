# dbops.fn_pgtap_crea_commessa: LO STATO, IL BILLING ACCOUNT DEL TEST, L'ATTIVITA'
#   Brief: brief-modello-documento-vendita §4-quinquies, Q-2 (Tid, 2026-10-24:
#   «estendi i builder esistenti»).
#
# -- IL DIFETTO -----------------------------------------------------------
#   Sei pgTAP costruivano a mano la stessa «commessa emittibile»: INSERT della
#   testata, attivita' APPROVATA scritta colonna per colonna (articolo, unita'
#   di misura e tipo documento pescati «il primo per id»), poi il passaggio di
#   stato. E' la strada d'uscita dalla bozza che il primo giro del cantiere ha
#   accentrato (20261024-22), ricopiata in sei posti; e la pesca, su un
#   database ricostruito da zero, non trova niente (Q-4).
#
# -- I PARAMETRI NUOVI (in coda, DEFAULT NULL) ----------------------------
#   * p_stato_codice_interno: lo stato in cui la commessa deve arrivare.
#     NULL o lo stato iniziale: come prima. Un altro: ci arriva per la
#     matrice (dbops.fn_pgtap_porta_a_stato), sotto i guard veri.
#   * p_billing_account_id: il cliente di un'altra fixture (la seconda
#     commessa dello stesso cliente, quella del lotto del test). Si verifica
#     col building block dbops.fn_pgtap_cliente_ba_del_mondo, come nei
#     builder di contratto, ordine e fattura.
#   * p_con_attivita: scrive UN'attivita' APPROVATA e NON_EMESSA con
#     dbops.fn_pgtap_crea_commessa_attivita, PRIMA del passaggio di stato.
#     NULL (il default) = solo se lo stato chiesto non e' l'iniziale: e' il
#     lavoro che l'uscita dalla bozza pretende (PRONTA_FATTURAZIONE la vuole,
#     script.fn_check_commessa_pronta_fatturazione). true / false lo
#     decide il chiamante.
#   ⛔ La sorgente ROOT non la scrive: la madre non la scrive, la pretende il
#   pull della fatturazione, ed e' il caso del test.
#
# -- IL RETURNS: DUE COLONNE IN CODA --------------------------------------
#   attivita_id (NULL senza attivita') e stato_commessa_id, come
#   dbops.fn_pgtap_crea_contratto e fn_pgtap_crea_fattura che restituiscono
#   lo stato raggiunto. Le nove colonne di prima restano dove sono.
#
# -- LA FIRMA: DROP + CREATE -----------------------------------------------
#   Tre parametri in piu' e due colonne di RETURNS: un CREATE OR REPLACE
#   creerebbe un overload (e non puo' cambiare il RETURNS). Chiamanti censiti
#   il 2026-10-24: 11 pgTAP, 2 test Django (test_prezzo_riga_commessa_db,
#   test_group_attivita_parametri_importo_db), tutti a un argomento: restano
#   validi. ⚠️ test_prezzo_riga_commessa_db sonda la firma vecchia con
#   richiedi_db_provvisto("dbops.fn_pgtap_crea_commessa(text)"): con la firma
#   nuova SALTA in silenzio. Richiesta al team BE nel brief.
#   Corpo dal catalogo vivo (2026-10-24); SECURITY INVOKER esplicito.
#   Permessi: funzione di chi migra, non SECURITY DEFINER (come 20261007-25).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261024-26-update-fn-pgtap-crea-commessa-stato-e-ba-mctit.yaml

  - changeSet:
      id: 20261024-26-update-fn-pgtap-crea-commessa-stato-e-ba
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.fn_pgtap_crea_commessa: tre parametri in coda (p_stato_codice_interno,
        p_billing_account_id, p_con_attivita) e due colonne in coda al RETURNS (attivita_id,
        stato_commessa_id). La commessa arriva nello stato chiesto per la matrice, sul cliente del
        test, con l'attivita' che l'uscita dalla bozza pretende. DROP + CREATE. Brief:
        brief-modello-documento-vendita (Q-2).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION IF EXISTS dbops.fn_pgtap_crea_commessa(text);

              CREATE FUNCTION dbops.fn_pgtap_crea_commessa(
                   -- l'etichetta e' un frammento di testo della fixture: tipo nudo.
                   p_etichetta            text DEFAULT 'pgTAP'::text,
                   p_stato_codice_interno vendite.stati_commessa.codice_interno%TYPE DEFAULT NULL,
                   p_billing_account_id   vendite.commesse.billing_account_id%TYPE DEFAULT NULL,
                   -- un interruttore del chiamante, non il riflesso di una colonna.
                   p_con_attivita         boolean DEFAULT NULL)
               RETURNS TABLE(
                   commessa_id                 vendite.commesse.id%TYPE,
                   commessa_codice             vendite.commesse.codice%TYPE,
                   emittente_fiscale_id        anagrafiche.emittenti_fiscali.id%TYPE,
                   emittente_soggetto_ruolo_id anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE,
                   auth_user_id                anagrafiche.identita_digitali.auth_user_id%TYPE,
                   billing_account_id          anagrafiche.billing_account.id%TYPE,
                   istanza_utility_id          anagrafiche.billing_account.istanza_utility_id%TYPE,
                   cliente_soggetto_ruolo_id   anagrafiche.billing_account.soggetto_ruolo_id%TYPE,
                   utility_id                  anagrafiche.billing_account.utility_id%TYPE,
                   attivita_id                 vendite.commesse_attivita.id%TYPE,
                   stato_commessa_id           vendite.commesse.stato_commessa_id%TYPE)
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              -- Scopo: dare a una fixture pgTAP una COMMESSA del mondo in una
              --   chiamata: azienda, operatore, cliente e commessa aperta
              --   dalla madre del dominio, nello stato chiesto.
              -- Uso:
              --   CREATE TEMP TABLE tmp_c AS
              --   SELECT * FROM dbops.fn_pgtap_crea_commessa('rls commesse');
              --   -- una commessa emittibile del cliente di un'altra fixture:
              --   SELECT * FROM dbops.fn_pgtap_crea_commessa(
              --              'pull', 'PRONTA_FATTURAZIONE',
              --              (SELECT billing_account_id FROM tmp_cliente));
              -- ⛔ Le attivita' le scrive solo per uscire dalla bozza (o se
              --   p_con_attivita lo chiede): UNA, da
              --   dbops.fn_pgtap_crea_commessa_attivita. Le altre sono il
              --   caso del test, e cosi' la sorgente ROOT.
              -- ⚠️ Senza contesto aperto, il mondo lo apre sull'operatore che
              --   costruisce. Esce con i vincoli IMMEDIATE, come ogni helper.
              -- rev 2026-10-24 (20261024-26, brief-modello-documento-vendita
              --   Q-2): stato, billing account del test e attivita'.
              DECLARE
                  v_ef_id     anagrafiche.emittenti_fiscali.id%TYPE;
                  v_ef_sr_id  anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE;
                  v_user_id   anagrafiche.identita_digitali.auth_user_id%TYPE;
                  v_ba_id     anagrafiche.billing_account.id%TYPE;
                  v_ist_id    anagrafiche.billing_account.istanza_utility_id%TYPE;
                  v_cli_sr_id anagrafiche.billing_account.soggetto_ruolo_id%TYPE;
                  v_utility   anagrafiche.billing_account.utility_id%TYPE;
                  v_commessa  vendite.commesse.id%TYPE;
                  v_codice    vendite.commesse.codice%TYPE;
                  v_iniziale  vendite.stati_commessa.id%TYPE;
                  v_target    vendite.stati_commessa.id%TYPE;
                  v_attivita  vendite.commesse_attivita.id%TYPE;
                  v_stato_id  vendite.commesse.stato_commessa_id%TYPE;
              BEGIN
                  -- 0. Lo stato si giudica PRIMA di costruire: un codice che
                  --    non c'e' parla qui, nominando il builder.
                  v_iniziale := script.fn_stato_iniziale_id('vendite.stati_commessa'::regclass);
                  IF p_stato_codice_interno IS NOT NULL THEN
                      SELECT s.id INTO v_target
                        FROM vendite.stati_commessa s
                       WHERE s.codice_interno = p_stato_codice_interno
                         AND s.attivo IS TRUE;
                      IF v_target IS NULL THEN
                          RAISE EXCEPTION
                              'fn_pgtap_crea_commessa: nessuno stato di commessa attivo con codice_interno = %',
                              p_stato_codice_interno;
                      END IF;
                  END IF;

                  -- 1. Il mondo. Senza p_billing_account_id costruisce anche il
                  --    cliente; con, riusa quello e prende solo l'azienda di chi
                  --    agisce (il mondo la riusa quando un contesto c'e').
                  SELECT m.emittente_fiscale_id, m.emittente_soggetto_ruolo_id,
                         m.auth_user_id, m.billing_account_id, m.istanza_utility_id,
                         m.cliente_soggetto_ruolo_id, m.utility_id
                    INTO v_ef_id, v_ef_sr_id, v_user_id, v_ba_id, v_ist_id,
                         v_cli_sr_id, v_utility
                    FROM dbops.fn_pgtap_crea_mondo_cliente(p_etichetta) m;

                  IF p_billing_account_id IS NOT NULL THEN
                      -- ⚠️ Il BA chiesto si VERIFICA prima di usarlo, dal building
                      --   block: uno di un'altra azienda solleva qui, nominando
                      --   questo builder.
                      SELECT c.billing_account_id, c.istanza_utility_id,
                             c.cliente_soggetto_ruolo_id, c.utility_id
                        INTO v_ba_id, v_ist_id, v_cli_sr_id, v_utility
                        FROM dbops.fn_pgtap_cliente_ba_del_mondo(
                                 p_billing_account_id, v_ef_sr_id, 'fn_pgtap_crea_commessa') c;
                  END IF;

                  -- 2. La madre: codice, emittente e stato iniziale li decide lei.
                  v_commessa := vendite.fn_get_or_create_commessa(
                      p_billing_account_id => v_ba_id,
                      p_utility_id         => v_utility,
                      p_competenza_dal     => date_trunc('month', (SELECT script.fn_data_operativa()))::date,
                      p_competenza_al      => (date_trunc('month', (SELECT script.fn_data_operativa()))
                                               + interval '1 month - 1 day')::date,
                      p_meta               => jsonb_build_object('test_scope', 'pgtap_' || p_etichetta),
                      p_force_new          => true);

                  SELECT c.codice INTO v_codice
                    FROM vendite.commesse c
                   WHERE c.id = v_commessa;

                  -- 3. Il lavoro, PRIMA del passaggio: l'uscita dalla bozza lo
                  --    pretende, e in bozza le righe si scrivono.
                  IF COALESCE(p_con_attivita,
                              v_target IS NOT NULL AND v_target IS DISTINCT FROM v_iniziale) THEN
                      SELECT a.attivita_id INTO v_attivita
                        FROM dbops.fn_pgtap_crea_commessa_attivita(v_commessa) a;
                  END IF;

                  -- 4. Lo stato, per la matrice, sotto i guard veri.
                  IF v_target IS NOT NULL AND v_target IS DISTINCT FROM v_iniziale THEN
                      PERFORM dbops.fn_pgtap_porta_a_stato('vendite.commesse'::regclass, v_commessa,
                                                           p_stato_codice_interno);
                  END IF;

                  -- Contratto dichiarato, non fiducia nel chiamato.
                  SET CONSTRAINTS ALL IMMEDIATE;

                  SELECT c.stato_commessa_id INTO v_stato_id
                    FROM vendite.commesse c
                   WHERE c.id = v_commessa;

                  RETURN QUERY
                  SELECT v_commessa, v_codice, v_ef_id, v_ef_sr_id, v_user_id,
                         v_ba_id, v_ist_id, v_cli_sr_id, v_utility,
                         v_attivita, v_stato_id;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_pgtap_crea_commessa(text, vendite.stati_commessa.codice_interno%TYPE, vendite.commesse.billing_account_id%TYPE, boolean)
              IS 'Fixture pgTAP: una COMMESSA del mondo in una chiamata: azienda, operatore e cliente (dbops.fn_pgtap_crea_mondo_cliente) e la commessa aperta dalla madre vendite.fn_get_or_create_commessa (p_force_new), con competenza nel mese corrente. Codice, emittente e stato iniziale li decide la madre, come in produzione. ⭐ Secondo parametro: lo stato da raggiungere (NULL o l''iniziale: resta li''), per la matrice con dbops.fn_pgtap_porta_a_stato, sotto i guard veri. ⚠️ Terzo parametro: il billing account di un cliente gia'' costruito, verificato da dbops.fn_pgtap_cliente_ba_del_mondo (un BA di un''altra azienda solleva). Quarto parametro: scrive UN''attivita'' APPROVATA e NON_EMESSA (dbops.fn_pgtap_crea_commessa_attivita) prima del passaggio; NULL = solo se lo stato chiesto non e'' l''iniziale, perche'' l''uscita dalla bozza la pretende. ⛔ Le altre attivita'' e la sorgente ROOT sono il caso del test. Ritorna le chiavi, l''attivita'' scritta (o NULL) e lo stato raggiunto. ⚠️ Senza contesto aperto lo apre sull''operatore che costruisce; esce con i vincoli IMMEDIATE. Brief: brief-db-fixture-rls-documenti-costruiti. Rev 2026-10-24 (20261024-26, brief-modello-documento-vendita Q-2): stato, billing account e attivita'', DROP + CREATE.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- ⚠️ Il rollback NON ricrea la versione precedente: va ri-applicato il
              --    20261009-59 dopo questo DROP.
              DROP FUNCTION IF EXISTS dbops.fn_pgtap_crea_commessa(text, vendite.stati_commessa.codice_interno%TYPE, vendite.commesse.billing_account_id%TYPE, boolean);
