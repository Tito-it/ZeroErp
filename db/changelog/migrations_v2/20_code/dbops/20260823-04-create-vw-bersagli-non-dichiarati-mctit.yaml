# IL CANCELLO DEL VOCABOLARIO DEI BERSAGLI
#   dbops.vw_bersagli_non_dichiarati
#   Brief: brief-db-bersaglio-errore.md
#          §6 lotto L3 · passo T-4 · domanda Q-D (chiusa da Tid il 2026-08-22)
#
# ── ⭐ E' QUESTO CANCELLO A RENDERE SICURA UNA DECISIONE ─────────────
#   Tid ha scelto che `config.tipi_entita` cresca UNA VOCE PER VOLTA, insieme
#   al messaggio che la usa, invece di nascere seminato largo: niente voci che
#   promettono una destinazione che nessuna schermata sa raggiungere.
#
#   Quella scelta e' sicura SOLO se dimenticare la voce e' impossibile. Ed e'
#   il mestiere di questa vista: chi scrive un bersaglio su un tipo non
#   dichiarato lo scopre in CI, non in esercizio.
#
# ── ⚠️ E' IL GEMELLO DI vw_codici_errore_da_dichiarare, NON DI ───────
#    vw_eventi_non_dichiarati — e la differenza conta
#   `vw_eventi_non_dichiarati` (20260822-60) legge `vendite.event_log`, cioe'
#   i DATI, perche' i codici evento li scrive PYTHON e su pg_proc non ci sono.
#   Il bersaglio invece lo scrive il DATABASE, nei corpi plpgsql: qui la misura
#   giusta e' il SORGENTE, come per i codici errore.
#
#   ⭐ La differenza non e' di stile: una vista sui dati e' cieca su un ambiente
#   senza traffico e non dice mai «tutto a posto» con certezza — dice solo «non
#   e' ancora successo». Una vista sul sorgente misura cosa il codice FA, e da
#   quella si puo' far dipendere una build.
#
# ── COME MISURA ─────────────────────────────────────────────────────
#   Due filtri in cascata, e il primo e' quello che tiene bassi i falsi
#   positivi:
#     1. solo le funzioni che nel corpo nominano `bersaglio` — cioe' quelle che
#        un bersaglio lo costruiscono davvero;
#     2. dentro quelle, ogni letterale nella forma `'tipo', 'MAIUSCOLO'`.
#
#   ⚠️ I commenti si tolgono PRIMA di cercare, come fa la gemella dei codici
#   errore: un tipo nominato in un commento non e' un tipo scritto, e senza
#   quella riga il conteggio si gonfia in silenzio.
#
#   ⚠️ Cosa NON vede, e va detto invece di lasciarlo credere: un tipo costruito
#   per concatenazione o passato in una variabile. E' lo stesso limite della
#   gemella, e la risposta e' la stessa: fra i due errori possibili si sceglie
#   quello che si corregge guardando i falsi positivi, non quello che non si
#   vede.
#
# ── PERCHE' ANCHE «OBSOLETO» E NON SOLO «ASSENTE» ───────────────────
#   Un tipo ritirato con `obsoleto_dal` resta a catalogo — e' il modo di casa
#   per deprecare senza rompere le istanze che lo referenziano — ma un
#   bersaglio NUOVO verso una voce ritirata e' un difetto uguale a un tipo mai
#   dichiarato: manda l'operatore verso qualcosa che il progetto ha smesso di
#   raggiungere. Le due righe si distinguono nella colonna `motivo`, cosi' chi
#   legge la build sa se deve seminare o correggere.
#
# ── ⛔ E il rubinetto NON si chiude con una FK ───────────────────────
#   Non c'e' niente da vincolare: il bersaglio vive dentro un `jsonb`, non in
#   una colonna. Ma la ragione vera e' un'altra, ed e' la stessa gia' scritta
#   per `event_code`: il canale d'errore non puo' rifiutare di funzionare
#   perche' una voce di catalogo manca. Il bersaglio storto si perde, l'errore
#   di dominio parte lo stesso (W_BERSAGLIO_MALFORMATO), e a protestare e' la
#   BUILD — non l'operatore.
#
# Dipendenze: config.tipi_entita (20260822-53).
# Verifica: db/pgtap/dbops/test-vw-bersagli-non-dichiarati.sql
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20260823-04-create-vw-bersagli-non-dichiarati-mctit.yaml

  - changeSet:
      id: 20260823-04-create-vw-bersagli-non-dichiarati
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Il cancello del vocabolario dei bersagli: i tipi scritti nei corpi plpgsql vivi che
        costruiscono un bersaglio e che config.tipi_entita non dichiara (o dichiara come
        ritirati). ⭐ E' cio' che rende sicura la scelta di far crescere il catalogo una
        voce per volta: dimenticarsene fa fallire la build, non l'operatore. Gemella di
        vw_codici_errore_da_dichiarare (legge il SORGENTE) e non di
        vw_eventi_non_dichiarati (che legge i dati, perche' quei codici li scrive Python).
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: tipi_entita
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW dbops.vw_bersagli_non_dichiarati
              WITH (security_invoker = true) AS
              SELECT m[1]                                     AS tipo,
                     CASE WHEN te.codice IS NULL THEN 'ASSENTE'
                          ELSE 'OBSOLETO' END                 AS motivo,
                     count(DISTINCT p.oid)                    AS n_funzioni,
                     string_agg(DISTINCT n.nspname || '.' || p.proname, ', '
                                ORDER BY n.nspname || '.' || p.proname) AS funzioni
                FROM pg_proc p
                JOIN pg_namespace n
                  ON n.oid = p.pronamespace
                -- ⚠️ Commenti tolti PRIMA di cercare: un tipo nominato in un
                --    commento non e' un tipo scritto, e senza questa riga il
                --    conteggio si gonfia in silenzio (stessa riga, stessa
                --    ragione, di dbops.vw_codici_errore_da_dichiarare).
                CROSS JOIN LATERAL regexp_matches(
                       regexp_replace(p.prosrc, '--[^\n]*', '', 'g'),
                       '''tipo''\s*,\s*''([A-Z][A-Z0-9_]{0,30})''', 'g') AS m
                LEFT JOIN config.tipi_entita te
                  ON te.codice = m[1]
               WHERE n.nspname NOT IN ('pg_catalog', 'information_schema')
                 AND p.prolang = (SELECT oid FROM pg_language WHERE lanname = 'plpgsql')
                 -- Solo le funzioni che un bersaglio lo costruiscono davvero:
                 -- e' il filtro che tiene bassi i falsi positivi, perche' la
                 -- coppia 'tipo','MAIUSCOLO' da sola vive anche altrove.
                 AND p.prosrc LIKE '%bersaglio%'
                 AND (te.codice IS NULL OR te.obsoleto_dal <= CURRENT_DATE)
               GROUP BY m[1],
                        CASE WHEN te.codice IS NULL THEN 'ASSENTE' ELSE 'OBSOLETO' END;

              COMMENT ON VIEW dbops.vw_bersagli_non_dichiarati IS
                  'Il cancello del vocabolario dei bersagli: ogni tipo scritto in un corpo '
                  'plpgsql vivo che costruisce un bersaglio (commenti esclusi) e che '
                  'config.tipi_entita non dichiara — motivo ASSENTE — o dichiara come '
                  'ritirato — motivo OBSOLETO, perche'' un bersaglio NUOVO verso una voce '
                  'ritirata manda l''operatore dove il progetto ha smesso di andare. '
                  '⭐ E'' cio'' che rende sicura la decisione di far crescere il catalogo UNA '
                  'VOCE PER VOLTA insieme al messaggio che la usa (Tid, 2026-08-22): '
                  'dimenticare la voce fa fallire la BUILD, non l''operatore. ⚠️ Gemella di '
                  'dbops.vw_codici_errore_da_dichiarare, che legge il SORGENTE — e NON di '
                  'dbops.vw_eventi_non_dichiarati, che legge i dati perche'' quei codici li '
                  'scrive Python: qui il bersaglio lo scrive il database, quindi la misura '
                  'giusta e'' pg_proc. Una vista sui dati sarebbe cieca su un ambiente senza '
                  'traffico, e da una misura cieca non si puo'' far dipendere una build. '
                  '⚠️ Non vede i tipi costruiti per concatenazione o passati in una '
                  'variabile: stesso limite della gemella, e la stessa scelta — fra i due '
                  'errori possibili si preferisce quello che si corregge guardando i falsi '
                  'positivi. ⛔ E il rubinetto non si chiude con una FK: il bersaglio vive '
                  'in un jsonb, e comunque il canale d''errore non puo'' smettere di '
                  'funzionare perche'' manca una voce di catalogo — il bersaglio storto si '
                  'perde (W_BERSAGLIO_MALFORMATO) e l''errore di dominio parte lo stesso.';

              GRANT SELECT ON dbops.vw_bersagli_non_dichiarati TO PUBLIC;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP VIEW IF EXISTS dbops.vw_bersagli_non_dichiarati;
