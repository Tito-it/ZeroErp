# dbops.fn_pgtap_crea_ordine: lo stato e la valuta dalle loro sedi.
#   Brief: brief-db-revisione-dbops, D73 e D74 (giro 8, blocco 8c).
#
# Base: doc auto-generata del 2026-11-07, verificata uguale al vivo dello scratch.
#
# ⚠️ PERCHE'. D73: lo stato si cercava sul vocabolario SENZA il filtro attivo, accanto alla sede
#   script.fn_doc_stato_id:
#   uno stato spento non si rifiutava prima di costruire. Ora la chiama. D74: la valuta dalla catena del dominio
#   (vendite.fn_get_valuta_id), non la prima del catalogo. Firma e risultato
#   invariati. COMMENT al presente (§5d).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261108-51-update-fn-pgtap-crea-ordine-stato-e-valuta-dalle-sedi-mctit.yaml

  - changeSet:
      id: 20261108-51-update-fn-pgtap-crea-ordine-stato-e-valuta-dalle-sedi
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.fn_pgtap_crea_ordine: stato da script.fn_doc_stato_id, valuta da vendite.fn_get_valuta_id (D73, D74).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'dbops' AND p.proname = 'fn_pgtap_crea_ordine';
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script' AND p.proname = 'fn_doc_stato_id';
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'vendite' AND p.proname = 'fn_get_valuta_id';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_pgtap_crea_ordine(
                  -- l'etichetta e' un frammento di testo della fixture: tipo nudo.
                  p_etichetta            text DEFAULT 'pgTAP'::text,
                  p_stato_codice_interno config.stati_doc_ordini.codice_interno%TYPE DEFAULT 'DRAFT',
                  p_billing_account_id   vendite.ordini.billing_account_id%TYPE DEFAULT NULL,
                  p_data                 vendite.ordini.data%TYPE DEFAULT NULL)
              RETURNS TABLE(
                  ordine_id                   vendite.ordini.id%TYPE,
                  ordine_uid                  vendite.ordini.uid%TYPE,
                  emittente_fiscale_id        anagrafiche.emittenti_fiscali.id%TYPE,
                  emittente_soggetto_ruolo_id anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE,
                  auth_user_id                anagrafiche.identita_digitali.auth_user_id%TYPE,
                  billing_account_id          anagrafiche.billing_account.id%TYPE,
                  istanza_utility_id          anagrafiche.billing_account.istanza_utility_id%TYPE,
                  cliente_soggetto_ruolo_id   anagrafiche.billing_account.soggetto_ruolo_id%TYPE,
                  utility_id                  anagrafiche.billing_account.utility_id%TYPE,
                  stato_doc_ordine_id         config.stati_doc_ordini.id%TYPE,
                  valuta_id                   config.valute.id%TYPE)
              LANGUAGE plpgsql
              SECURITY INVOKER
              AS $function$
              -- Scopo: dare a una fixture pgTAP un ORDINE di vendita del mondo
              --   in una chiamata: azienda, operatore, cliente e testata.
              -- Uso:
              --   CREATE TEMP TABLE tmp_o AS
              --   SELECT * FROM dbops.fn_pgtap_crea_ordine('rls ordini');
              --   -- il secondo ordine dello STESSO cliente (rev 20261022-10):
              --   SELECT * FROM dbops.fn_pgtap_crea_ordine(
              --              'rls ordini 2', 'DRAFT',
              --              (SELECT billing_account_id FROM tmp_o));
              --   -- l'ordine di una data passata (rev 20261025-03):
              --   SELECT * FROM dbops.fn_pgtap_crea_ordine('chiusure', p_data => DATE '2026-08-05');
              -- ⛔ Le righe NON le scrive: sono il caso del test.
              -- ⭐ rev 2026-10-24 (20261024-23, brief-modello-documento-vendita N-1):
              --   l'ordine NASCE nello stato iniziale (trigger della nascita); uno
              --   stato diverso si raggiunge con dbops.fn_pgtap_porta_a_stato, sotto
              --   i guard veri. Un passaggio che pretende cio' che il builder non
              --   scrive (righe, indirizzi…) qui fallisce: il test lo scrive e porta
              --   avanti da se'.
              -- ⭐ rev 2026-10-25 (20261025-03, brief-db-pgtap-bolla-e-reso-costruiti
              --   D-1): la data dell'ordine si sceglie ALLA NASCITA, nell'INSERT: fuori
              --   bozza e' congelata, e un UPDATE dopo il builder dipenderebbe
              --   dall'ordine della fixture. NULL = il default della colonna.
              -- ⚠️ Senza contesto aperto, il mondo lo apre sull'operatore che
              --   costruisce. Esce con i vincoli IMMEDIATE, come ogni helper.
              DECLARE
                  v_ef_id     anagrafiche.emittenti_fiscali.id%TYPE;
                  v_ef_sr_id  anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE;
                  v_user_id   anagrafiche.identita_digitali.auth_user_id%TYPE;
                  v_ba_id     anagrafiche.billing_account.id%TYPE;
                  v_ist_id    anagrafiche.billing_account.istanza_utility_id%TYPE;
                  v_cli_sr_id anagrafiche.billing_account.soggetto_ruolo_id%TYPE;
                  v_utility   anagrafiche.billing_account.utility_id%TYPE;
                  v_stato_id  config.stati_doc_ordini.id%TYPE;
                  v_valuta_id config.valute.id%TYPE;
                  v_ordine    vendite.ordini.id%TYPE;
                  v_uid       vendite.ordini.uid%TYPE;
              BEGIN
                  -- Il guard sul parametro PRIMA di costruire: uno stato
                  -- sbagliato non deve lasciare un mondo a meta'.
                  -- Lo stato dalla sede della traduzione codice -> id
                  -- (script.fn_doc_stato_id): solo uno stato ATTIVO e' una destinazione.
                  v_stato_id := script.fn_doc_stato_id('vendite.ordini'::regclass, p_stato_codice_interno);

                  IF v_stato_id IS NULL THEN
                      RAISE EXCEPTION
                          'fn_pgtap_crea_ordine: nessuno stato documento ordine attivo con codice_interno = %',
                          p_stato_codice_interno;
                  END IF;

                  SELECT c.emittente_fiscale_id, c.emittente_soggetto_ruolo_id,
                         c.auth_user_id, c.billing_account_id, c.istanza_utility_id,
                         c.cliente_soggetto_ruolo_id, c.utility_id
                    INTO v_ef_id, v_ef_sr_id, v_user_id, v_ba_id, v_ist_id,
                         v_cli_sr_id, v_utility
                    FROM dbops.fn_pgtap_cliente_del_builder(
                             p_etichetta, p_billing_account_id, 'fn_pgtap_crea_ordine') c;

                  -- La valuta dalla catena del dominio (vendite.fn_get_valuta_id:
                  -- billing account, poi emittente, poi gestore), come la risolvono i
                  -- trigger di default dei documenti: non la prima del catalogo.
                  v_valuta_id := vendite.fn_get_valuta_id(v_ba_id, v_ef_sr_id);

                  -- ⚠️ data e' NOT NULL con un DEFAULT di tabella: NULL vuol dire
                  --   «quello della tabella». Due rami invece di ricopiare qui il
                  --   default: la sede del default resta il DDL.
                  IF p_data IS NULL THEN
                      INSERT INTO vendite.ordini (
                          soggetto_ruolo_id, billing_account_id, utility_id,
                          valuta_id, emittente_fiscale_id, meta)
                      VALUES (v_cli_sr_id, v_ba_id, v_utility,
                              v_valuta_id, v_ef_id,
                              jsonb_build_object('test_scope', 'pgtap_' || p_etichetta))
                      RETURNING id, uid INTO v_ordine, v_uid;
                  ELSE
                      INSERT INTO vendite.ordini (
                          soggetto_ruolo_id, billing_account_id, utility_id,
                          valuta_id, emittente_fiscale_id, data, meta)
                      VALUES (v_cli_sr_id, v_ba_id, v_utility,
                              v_valuta_id, v_ef_id, p_data,
                              jsonb_build_object('test_scope', 'pgtap_' || p_etichetta))
                      RETURNING id, uid INTO v_ordine, v_uid;
                  END IF;

                  -- Lo stato chiesto (rev 20261024-23): il documento e' nato nello stato
                  -- iniziale; se il test ne vuole un altro, ci arriva per la matrice.
                  IF v_stato_id IS DISTINCT FROM script.fn_doc_stato_iniziale_id('vendite.ordini'::regclass) THEN
                      PERFORM dbops.fn_pgtap_porta_a_stato('vendite.ordini'::regclass, v_ordine, p_stato_codice_interno);
                  END IF;

                  -- Contratto dichiarato, non fiducia nel chiamato.
                  SET CONSTRAINTS ALL IMMEDIATE;

                  RETURN QUERY
                  SELECT v_ordine, v_uid, v_ef_id, v_ef_sr_id, v_user_id,
                         v_ba_id, v_ist_id, v_cli_sr_id, v_utility,
                         v_stato_id, v_valuta_id;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_pgtap_crea_ordine(text, config.stati_doc_ordini.codice_interno%TYPE, vendite.ordini.billing_account_id%TYPE, vendite.ordini.data%TYPE) IS
                  'Fixture pgTAP: un ORDINE di vendita del mondo in una chiamata: azienda, operatore e cliente (dbops.fn_pgtap_cliente_del_builder: quello del terzo parametro, verificato dell''azienda di chi agisce, o uno nuovo del mondo) e la testata, con l''emittente del mondo, il billing account, la sua utility e la valuta della catena del dominio (vendite.fn_get_valuta_id: billing account, poi emittente, poi gestore). Numero, anno, registro e fatturazione_trigger li assegnano i trigger del dominio, come in produzione. Quarto parametro: la data dell''ordine, scritta alla nascita (NULL = il default della colonna). Lo stato: lo traduce script.fn_doc_stato_id, quindi uno stato spento o inesistente solleva prima di costruire; l''ordine nasce nello stato iniziale della testata (script.fn_doc_stato_iniziale_id) e, se il secondo parametro ne chiede un altro, ci arriva per la matrice con dbops.fn_pgtap_porta_a_stato, sotto i guard veri; un passaggio che pretende cio'' che il builder non scrive (le righe, per la conferma) si ferma: il test chiede la bozza, scrive le righe e porta avanti da se''. ⛔ NON scrive righe: sono il caso del test (le scrive dbops.fn_pgtap_crea_ordine_con_righe). ⚠️ Senza contesto aperto lo apre sull''operatore che costruisce; esce con i vincoli IMMEDIATE.';
      rollback:
        - sql:
            dbms: postgresql
            sql: |
              -- Il verso di ritiro e' un changeSet nuovo dal corpo della doc auto-generata
              -- del 2026-11-07.
              SELECT 1;
