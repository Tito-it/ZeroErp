# dbops.fn_apply_cleanup_at e dbops.fn_purge_cleanup_expired: la scadenza sta in cleanup_at,
#   nome fisso (decisione di Tid, §27.2). p_cleanup_column resta in firma (i parametri non si
#   tolgono) e puo' solo confermare cleanup_at; fn_apply_cleanup_at non indovina piu' la base
#   (era data_insert, una terza regola accanto a quelle di trigger e runner): la sceglie il
#   chiamante con dbops.fn_cleanup_at_regola. Corpi di partenza dal catalogo dello scratch
#   (2026-11-08); rollback = corpi e COMMENT di prima.
#   Brief: brief-db-revisione-dbops, giro 10b, blocco 10b-3 (§27).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261109-88-update-fn-apply-e-purge-cleanup-colonna-fissa-mctit.yaml

  - changeSet:
      id: 20261109-88-update-fn-apply-e-purge-cleanup-colonna-fissa
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        fn_apply_cleanup_at e fn_purge_cleanup_expired: colonna fissa cleanup_at, base obbligatoria. Brief: brief-db-revisione-dbops, giro 10b, blocco 10b-3 (§27).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_proc
               WHERE oid = to_regprocedure('dbops.fn_apply_cleanup_at(text,text,text,text,integer,boolean,boolean)')
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_proc
               WHERE oid = to_regprocedure('dbops.fn_purge_cleanup_expired(text,text,text,integer,boolean)')
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_apply_cleanup_at(p_schema text, p_table text, p_cleanup_column text, p_base_ts_column text, p_ttl_days integer, p_apply_on_update boolean DEFAULT false, p_dry_run boolean DEFAULT false)
               RETURNS integer
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_base_col text := NULLIF(btrim(p_base_ts_column), '');
                v_sql text;
                v_count integer := 0;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Scrive cleanup_at = <colonna base> + ttl_days sulle righe
                --   di una tabella (il pregresso del cleanup).
                --
                -- Regole:
                --   - p_ttl_days obbligatorio (>= 0)
                --   - p_base_ts_column obbligatoria: la sceglie chi chiama, con
                --     dbops.fn_cleanup_at_regola (il runner); qui non si indovina
                --   - la colonna e' cleanup_at, nome fisso del framework:
                --     p_cleanup_column puo' solo confermarlo (NULL o 'cleanup_at')
                --   - se p_dry_run=true ritorna il conteggio righe potenziali
                --   - se apply_on_update=false aggiorna solo righe senza cleanup_at
                --   - righe con la base NULL: non si toccano (non scadono)
                -- =========================================================

                IF p_schema IS NULL OR p_table IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'dbops', 'fn_apply_cleanup_at', 'E_GENERICO',
                    jsonb_build_object('detail','schema/table obbligatori'),
                    NULL::uuid,
                    'p_schema e p_table obbligatori'
                  );
                END IF;

                IF NULLIF(btrim(p_cleanup_column), '') IS DISTINCT FROM NULL
                   AND btrim(p_cleanup_column) <> 'cleanup_at' THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database', 'dbops.fn_apply_cleanup_at', 'E_PARAMETRO_INVALIDO',
                    jsonb_build_object('parametro', 'p_cleanup_column', 'valore', p_cleanup_column),
                    NULL::uuid, 'la colonna della scadenza e'' cleanup_at');
                END IF;

                IF v_base_col IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database', 'dbops.fn_apply_cleanup_at', 'E_PARAMETRO_INVALIDO',
                    jsonb_build_object('parametro', 'p_base_ts_column'),
                    NULL::uuid, 'p_base_ts_column obbligatoria');
                END IF;

                IF p_ttl_days IS NULL OR p_ttl_days < 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'dbops', 'fn_apply_cleanup_at', 'E_GENERICO',
                    jsonb_build_object('detail','ttl_days non valido'),
                    NULL::uuid,
                    'p_ttl_days deve essere >= 0'
                  );
                END IF;

                IF NOT dbops.fn_col_exists(p_schema, p_table, 'cleanup_at') THEN
                  RETURN 0;
                END IF;

                IF NOT dbops.fn_col_exists(p_schema, p_table, v_base_col) THEN
                  RETURN 0;
                END IF;

                IF p_apply_on_update THEN
                  v_sql := format(
                    'SELECT count(*) FROM %I.%I WHERE %I IS NOT NULL AND (cleanup_at IS NULL OR cleanup_at <> (%I + make_interval(days => %s)))',
                    p_schema, p_table, v_base_col, v_base_col, p_ttl_days
                  );
                ELSE
                  v_sql := format(
                    'SELECT count(*) FROM %I.%I WHERE cleanup_at IS NULL AND %I IS NOT NULL',
                    p_schema, p_table, v_base_col
                  );
                END IF;

                IF p_dry_run THEN
                  EXECUTE v_sql INTO v_count;
                  RETURN v_count;
                END IF;

                IF p_apply_on_update THEN
                  v_sql := format(
                    'UPDATE %I.%I SET cleanup_at = %I + make_interval(days => %s) WHERE %I IS NOT NULL AND (cleanup_at IS NULL OR cleanup_at <> (%I + make_interval(days => %s)))',
                    p_schema, p_table, v_base_col, p_ttl_days,
                    v_base_col, v_base_col, p_ttl_days
                  );
                ELSE
                  v_sql := format(
                    'UPDATE %I.%I SET cleanup_at = %I + make_interval(days => %s) WHERE cleanup_at IS NULL AND %I IS NOT NULL',
                    p_schema, p_table, v_base_col, p_ttl_days, v_base_col
                  );
                END IF;

                EXECUTE v_sql;
                GET DIAGNOSTICS v_count = ROW_COUNT;
                RETURN v_count;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_apply_cleanup_at(text, text, text, text, integer, boolean, boolean) IS
              'Scrive cleanup_at = colonna base + p_ttl_days sulle righe di p_schema.p_table: il pregresso del cleanup, chiamato da dbops.fn_run_automations_cleanup con la regola di dbops.fn_cleanup_at_regola. p_base_ts_column obbligatoria (la sceglie il chiamante, qui non si indovina); p_cleanup_column puo'' solo confermare cleanup_at, nome fisso del framework (NULL o ''cleanup_at'', altro → E_PARAMETRO_INVALIDO). p_apply_on_update false: solo le righe con cleanup_at NULL; true: anche quelle con una scadenza diversa. Le righe con la base NULL non si toccano. p_dry_run: conta senza scrivere. Tabella senza cleanup_at o senza la colonna base: 0. Ritorna le righe scritte (o contate).';

              CREATE OR REPLACE FUNCTION dbops.fn_purge_cleanup_expired(p_schema text, p_table text, p_cleanup_column text DEFAULT 'cleanup_at'::text, p_batch_limit integer DEFAULT 5000, p_dry_run boolean DEFAULT false)
               RETURNS integer
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_limit integer := COALESCE(NULLIF(p_batch_limit, 0), 5000);
                v_sql text;
                v_deleted integer := 0;
                v_total integer := 0;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Elimina record con cleanup_at scaduto, a batch.
                --
                -- Regole:
                --   - cleanup_at deve esistere; e' il nome fisso del framework:
                --     p_cleanup_column puo' solo confermarlo (NULL o 'cleanup_at')
                --   - p_batch_limit default 5000
                --   - se p_dry_run=true ritorna il numero record eleggibili
                -- =========================================================
                IF p_schema IS NULL OR p_table IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'dbops', 'fn_purge_cleanup_expired', 'E_GENERICO',
                    jsonb_build_object('detail','schema/table obbligatori'),
                    NULL::uuid,
                    'p_schema e p_table obbligatori'
                  );
                END IF;

                IF NULLIF(btrim(p_cleanup_column), '') IS DISTINCT FROM NULL
                   AND btrim(p_cleanup_column) <> 'cleanup_at' THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database', 'dbops.fn_purge_cleanup_expired', 'E_PARAMETRO_INVALIDO',
                    jsonb_build_object('parametro', 'p_cleanup_column', 'valore', p_cleanup_column),
                    NULL::uuid, 'la colonna della scadenza e'' cleanup_at');
                END IF;

                IF v_limit < 1 THEN
                  v_limit := 5000;
                END IF;

                IF NOT dbops.fn_col_exists(p_schema, p_table, 'cleanup_at') THEN
                  RETURN 0;
                END IF;

                IF p_dry_run THEN
                  v_sql := format(
                    'SELECT count(*) FROM %I.%I WHERE cleanup_at IS NOT NULL AND cleanup_at <= now()',
                    p_schema, p_table
                  );
                  EXECUTE v_sql INTO v_total;
                  RETURN v_total;
                END IF;

                LOOP
                  v_sql := format($f$
                    WITH del AS (
                      DELETE FROM %I.%I
                      WHERE ctid IN (
                        SELECT ctid
                        FROM %I.%I
                        WHERE cleanup_at IS NOT NULL AND cleanup_at <= now()
                        ORDER BY cleanup_at
                        LIMIT %s
                      )
                      RETURNING 1
                    )
                    SELECT count(*) FROM del
                  $f$, p_schema, p_table, p_schema, p_table, v_limit);

                  EXECUTE v_sql INTO v_deleted;
                  v_total := v_total + COALESCE(v_deleted, 0);

                  EXIT WHEN v_deleted IS NULL OR v_deleted = 0;
                END LOOP;

                RETURN v_total;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_purge_cleanup_expired(text, text, text, integer, boolean) IS
              'Cancella a batch le righe di p_schema.p_table con cleanup_at scaduto (cleanup_at <= now()); cleanup_at NULL non scade. p_cleanup_column puo'' solo confermare cleanup_at, nome fisso del framework (NULL o ''cleanup_at'', altro → E_PARAMETRO_INVALIDO). p_batch_limit: righe per batch (default 5000, 0 o negativo = 5000). p_dry_run: conta senza cancellare. Tabella senza cleanup_at: 0. Ritorna le righe cancellate (o contate). La chiama dbops.fn_run_automations_cleanup per le regole CLEANUP_PURGE.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_apply_cleanup_at(p_schema text, p_table text, p_cleanup_column text, p_base_ts_column text, p_ttl_days integer, p_apply_on_update boolean DEFAULT false, p_dry_run boolean DEFAULT false)
               RETURNS integer
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_cleanup_col text := COALESCE(NULLIF(btrim(p_cleanup_column), ''), 'cleanup_at');
                v_base_col text := NULLIF(btrim(p_base_ts_column), '');
                v_sql text;
                v_count integer := 0;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Calcola cleanup_at con TTL fisso a partire da una colonna
                --   timestamp di base (es. data_insert, executed_at, ecc.).
                --
                -- Regole:
                --   - p_ttl_days obbligatorio (>= 0)
                --   - se p_dry_run=true ritorna il conteggio righe potenziali
                --   - se apply_on_update=false aggiorna solo righe senza cleanup_at
                -- =========================================================

                IF p_schema IS NULL OR p_table IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'dbops', 'fn_apply_cleanup_at', 'E_GENERICO',
                    jsonb_build_object('detail','schema/table obbligatori'),
                    NULL::uuid,
                    'p_schema e p_table obbligatori'
                  );
                END IF;

                IF p_ttl_days IS NULL OR p_ttl_days < 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'dbops', 'fn_apply_cleanup_at', 'E_GENERICO',
                    jsonb_build_object('detail','ttl_days non valido'),
                    NULL::uuid,
                    'p_ttl_days deve essere >= 0'
                  );
                END IF;

                IF v_base_col IS NULL THEN
                  v_base_col := 'data_insert';
                END IF;

                IF NOT dbops.fn_col_exists(p_schema, p_table, v_cleanup_col) THEN
                  RETURN 0;
                END IF;

                IF NOT dbops.fn_col_exists(p_schema, p_table, v_base_col) THEN
                  RETURN 0;
                END IF;

                IF p_apply_on_update THEN
                  v_sql := format(
                    'SELECT count(*) FROM %I.%I WHERE %I IS NOT NULL AND (%I IS NULL OR %I <> (%I + make_interval(days => %s)))',
                    p_schema, p_table, v_base_col, v_cleanup_col, v_cleanup_col, v_base_col, p_ttl_days
                  );
                ELSE
                  v_sql := format(
                    'SELECT count(*) FROM %I.%I WHERE %I IS NULL AND %I IS NOT NULL',
                    p_schema, p_table, v_cleanup_col, v_base_col
                  );
                END IF;

                IF p_dry_run THEN
                  EXECUTE v_sql INTO v_count;
                  RETURN v_count;
                END IF;

                IF p_apply_on_update THEN
                  v_sql := format(
                    'UPDATE %I.%I SET %I = %I + make_interval(days => %s) WHERE %I IS NOT NULL AND (%I IS NULL OR %I <> (%I + make_interval(days => %s)))',
                    p_schema, p_table, v_cleanup_col, v_base_col, p_ttl_days,
                    v_base_col, v_cleanup_col, v_cleanup_col, v_base_col, p_ttl_days
                  );
                ELSE
                  v_sql := format(
                    'UPDATE %I.%I SET %I = %I + make_interval(days => %s) WHERE %I IS NULL AND %I IS NOT NULL',
                    p_schema, p_table, v_cleanup_col, v_base_col, p_ttl_days, v_cleanup_col, v_base_col
                  );
                END IF;

                EXECUTE v_sql;
                GET DIAGNOSTICS v_count = ROW_COUNT;
                RETURN v_count;
              END;
              $function$
              ;

              COMMENT ON FUNCTION dbops.fn_apply_cleanup_at(text,text,text,text,integer,boolean,boolean) IS '
              Helper per calcolare cleanup_at con TTL fisso.

              Parametri:
              - p_schema, p_table: tabella target.
              - p_cleanup_column: colonna di cleanup (default cleanup_at).
              - p_base_ts_column: colonna timestamp di base (es. data_insert).
              - p_ttl_days: giorni di retention.
              - p_apply_on_update: se true ricalcola anche su righe già valorizzate.
              - p_dry_run: se true non aggiorna e ritorna il numero righe potenziali.
              ';
              CREATE OR REPLACE FUNCTION dbops.fn_purge_cleanup_expired(p_schema text, p_table text, p_cleanup_column text DEFAULT 'cleanup_at'::text, p_batch_limit integer DEFAULT 5000, p_dry_run boolean DEFAULT false)
               RETURNS integer
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_cleanup_col text := COALESCE(NULLIF(btrim(p_cleanup_column), ''), 'cleanup_at');
                v_limit integer := COALESCE(NULLIF(p_batch_limit, 0), 5000);
                v_sql text;
                v_deleted integer := 0;
                v_total integer := 0;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Elimina record con cleanup_at scaduto, a batch.
                --
                -- Regole:
                --   - cleanup_at deve esistere
                --   - p_batch_limit default 5000
                --   - se p_dry_run=true ritorna il numero record eleggibili
                -- =========================================================

                IF p_schema IS NULL OR p_table IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'dbops', 'fn_purge_cleanup_expired', 'E_GENERICO',
                    jsonb_build_object('detail','schema/table obbligatori'),
                    NULL::uuid,
                    'p_schema e p_table obbligatori'
                  );
                END IF;

                IF v_limit < 1 THEN
                  v_limit := 5000;
                END IF;

                IF NOT dbops.fn_col_exists(p_schema, p_table, v_cleanup_col) THEN
                  RETURN 0;
                END IF;

                IF p_dry_run THEN
                  v_sql := format(
                    'SELECT count(*) FROM %I.%I WHERE %I IS NOT NULL AND %I <= now()',
                    p_schema, p_table, v_cleanup_col, v_cleanup_col
                  );
                  EXECUTE v_sql INTO v_total;
                  RETURN v_total;
                END IF;

                LOOP
                  v_sql := format($f$
                    WITH del AS (
                      DELETE FROM %I.%I
                      WHERE ctid IN (
                        SELECT ctid
                        FROM %I.%I
                        WHERE %I IS NOT NULL AND %I <= now()
                        ORDER BY %I
                        LIMIT %s
                      )
                      RETURNING 1
                    )
                    SELECT count(*) FROM del
                  $f$, p_schema, p_table, p_schema, p_table, v_cleanup_col, v_cleanup_col, v_cleanup_col, v_limit);

                  EXECUTE v_sql INTO v_deleted;
                  v_total := v_total + COALESCE(v_deleted, 0);

                  EXIT WHEN v_deleted IS NULL OR v_deleted = 0;
                END LOOP;

                RETURN v_total;
              END;
              $function$
              ;

              COMMENT ON FUNCTION dbops.fn_purge_cleanup_expired(text,text,text,integer,boolean) IS '
              Helper per cancellare record scaduti in base a cleanup_at.

              Parametri:
              - p_schema, p_table: tabella target.
              - p_cleanup_column: colonna di cleanup (default cleanup_at).
              - p_batch_limit: limite batch di cancellazione (default 5000).
              - p_dry_run: se true non elimina e ritorna il numero eleggibile.
              ';
