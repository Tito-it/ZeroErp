# dbops.vw_bersagli_non_dichiarati: il corpo dal building block.
#   Brief: brief-db-revisione-dbops, D14 (giro 1).
#
# Base: 20_code/dbops/20261009-53 (corpo da pg_get_viewdef), verificato uguale
# al vivo. Cambia solo la lettura del corpo: dbops.fn_corpo_funzione
# (20261104-20) al posto di prosrc senza i soli commenti di riga, che lasciava
# un ('tipo', 'X') scritto in un commento a blocco e toglieva quello scritto
# dopo un '--' dentro un letterale.
#   Il prefiltro `prosrc LIKE '%bersaglio%'` resta: la vista guarda il solo
#   plpgsql, che prosrc ce l'ha sempre, e il prefiltro e' un sovrainsieme.
#   ⛔ security_invoker si ripete: un CREATE OR REPLACE che non lo dice lo azzera.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261104-22-update-vw-bersagli-non-dichiarati-corpo-dal-bb-mctit.yaml

  - changeSet:
      id: 20261104-22-update-vw-bersagli-non-dichiarati-corpo-dal-bb
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.vw_bersagli_non_dichiarati legge il corpo con dbops.fn_corpo_funzione
        (commenti tolti rispettando i letterali).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'dbops' AND p.proname = 'fn_corpo_funzione';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW dbops.vw_bersagli_non_dichiarati WITH (security_invoker=true) AS
               SELECT m.m[1] AS tipo,
                      CASE
                          WHEN (te.codice IS NULL) THEN 'ASSENTE'::text
                          ELSE 'OBSOLETO'::text
                      END AS motivo,
                  count(DISTINCT p.oid) AS n_funzioni,
                  string_agg(DISTINCT (((n.nspname)::text || '.'::text) || (p.proname)::text), ', '::text ORDER BY (((n.nspname)::text || '.'::text) || (p.proname)::text)) AS funzioni
                 FROM (((pg_proc p
                   JOIN pg_namespace n ON ((n.oid = p.pronamespace)))
                   CROSS JOIN LATERAL regexp_matches((dbops.fn_corpo_funzione(p.oid) COLLATE "C"), '''tipo''\s*,\s*''([A-Z][A-Z0-9_]{0,30})'''::text, 'g'::text) m(m))
                   LEFT JOIN config.tipi_entita te ON ((te.codice = m.m[1])))
                WHERE ((n.nspname <> ALL (ARRAY['pg_catalog'::name, 'information_schema'::name])) AND (p.prolang = ( SELECT pg_language.oid
                         FROM pg_language
                        WHERE (pg_language.lanname = 'plpgsql'::name))) AND (p.prosrc ~~ '%bersaglio%'::text) AND ((te.codice IS NULL) OR (te.obsoleto_dal <= (SELECT script.fn_data_operativa()))))
                GROUP BY m.m[1],
                      CASE
                          WHEN (te.codice IS NULL) THEN 'ASSENTE'::text
                          ELSE 'OBSOLETO'::text
                      END;
      rollback:
        - sql:
            dbms: postgresql
            sql: |
              -- Il verso di ritiro e' un changeSet nuovo dal corpo di 20261009-53.
              SELECT 1;
