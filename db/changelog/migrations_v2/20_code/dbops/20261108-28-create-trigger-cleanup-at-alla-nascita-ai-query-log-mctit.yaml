# D36 — dbops.ai_query_log SCADE: novanta giorni, come gli altri registri
#   Brief: brief-db-revisione-dbops, giro 7 (§20), decisione Q4 di Tid
#   (2026-11-05): ai_query_log nell'ambito, scadenza 90 giorni.
#
# ── ⭐ I QUATTRO PEZZI DELLA SCADENZA, nello stesso giro ────────────
#     1. la colonna cleanup_at      — c'e' dalla nascita (20260331-21);
#     2. la regola CLEANUP_AT       — 28 in automation_rules_tbl.csv: 90 giorni,
#                                     base data_insert (la tabella non ha un
#                                     orario dell'evento diverso dall'INSERT);
#     3. il trigger alla nascita    — QUESTO changeSet;
#     4. un guard sul DELETE         — nessuno: la tabella non ne ha.
#   Lo scope sta in automation_scope.csv (dbops,ai_query_log): senza, il purge
#   non la vedeva, e il COMMENT prometteva una «retention via cleanup_at» che
#   non c'era. Le righe sono testo digitato dagli utenti.
#
# ── ⚠️ CHE COSA PORTA LO SCOPE OLTRE ALLA SCADENZA (letto sui runner) ──
#   AUDIT_UPDATE e TX_ID solo dove ci sono le colonne (qui no), STORICO solo
#   con storicizza (no), LOCK_COLUMNS, ATTIVO, DELETE_BLOCK e OVERLAP solo dai
#   loro registri. Nessuna FK, quindi niente nella politica degli indici.
#
# ⭐ Il trigger regge chi scrive: il backend inserisce come zeroerp_app, lo stesso
#   ruolo che gia' attraversa il trigger su request_log (20261023-02); nessuno
#   scrive ai_query_log via dblink (il limite di error_log e audit_log).
#
# Fase _m50_ come gli altri registri: nessun _a10_ che riscriva l'orario.
# COMMENT della tabella e di due colonne riscritti (M9 del brief).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261108-28-create-trigger-cleanup-at-alla-nascita-ai-query-log-mctit.yaml

  - changeSet:
      id: 20261108-28-create-trigger-cleanup-at-alla-nascita-ai-query-log
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Trigger trg_ai_query_log_m50_cleanup_at_ins (BEFORE INSERT, dbops.trgfn_cleanup_at_alla_nascita):
        la scadenza nasce con la riga, dalla regola CLEANUP_AT 28 (90 giorni). COMMENT riscritti.
        Brief: brief-db-revisione-dbops, giro 7 (D36, M9).
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                { schemaName: dbops, tableName: ai_query_log }
            - sqlCheck:
                expectedResult: "1"
                sql: >
                  SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'dbops' AND p.proname = 'trgfn_cleanup_at_alla_nascita';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_ai_query_log_m50_cleanup_at_ins ON dbops.ai_query_log;
              CREATE TRIGGER trg_ai_query_log_m50_cleanup_at_ins
                  BEFORE INSERT ON dbops.ai_query_log
                  FOR EACH ROW
                  EXECUTE FUNCTION dbops.trgfn_cleanup_at_alla_nascita();

              COMMENT ON TABLE dbops.ai_query_log IS
                  'Registro delle interazioni con l''assistente AI: il testo inviato dall''utente, gli strumenti invocati, la risposta, token, durata e provider. Il backend la scrive solo in INSERT. Scade: cleanup_at nasce con la riga (data_insert + il termine della regola CLEANUP_AT della tabella in dbops.automation_rules_tbl, 90 giorni) e il purge delle automazioni cancella le righe scadute; la tabella e'' nell''ambito di dbops.automation_scope.';
              COMMENT ON COLUMN dbops.ai_query_log.user_id IS
                  'L''utente dell''applicazione (django.auth_user.id) che ha inviato la query. Nessun vincolo di chiave esterna: lo schema django e'' dell''applicazione, e il valore lo scrive il backend.';
              COMMENT ON COLUMN dbops.ai_query_log.cleanup_at IS
                  'Quando la riga scade. La scrive all''INSERT dbops.trgfn_cleanup_at_alla_nascita, da data_insert e dal termine della regola CLEANUP_AT della tabella; il valore passato dal chiamante non conta. NULL = non scade: solo le righe nate prima del trigger, che il job delle scadenze riempie.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_ai_query_log_m50_cleanup_at_ins ON dbops.ai_query_log;
              COMMENT ON TABLE dbops.ai_query_log IS
                  'Log interazioni assistente AI: registra input utente, strumenti invocati, risposta LLM, metriche token/durata e provider. Append-only con retention via cleanup_at.';
              COMMENT ON COLUMN dbops.ai_query_log.user_id IS
                  'FK auth_user.id — operatore che ha inviato la query AI.';
              COMMENT ON COLUMN dbops.ai_query_log.cleanup_at IS
                  'Timestamp retention per pulizia schedulata (pattern standard dbops).';
