                        LEFT JOIN vivo v1     ON v1.rel = t.rel AND v1.trg = vt.trg1
                  )
                  SELECT cf.sch, cf.tbl, cf.azione, cf.trg, cf.cols, cf.args,
                         COALESCE(cf.trgs, ARRAY[]::text[]), cf.perse
                    FROM confronto cf
                   WHERE cf.azione IS NOT NULL
                   ORDER BY cf.sch, cf.tbl;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_lock_columns_divergenze(text, text[]) IS
                  'Il lock di colonna ATTESO (codice_interno implicito + righe attive di dbops.automation_lock_columns; una riga di un altro exec_mode resta attesa se la colonna e'' gia'' bloccata) confrontato con quello VIVO (ogni trigger su script.trgfn_lock_columns, qualunque nome abbia). Una riga per tabella che diverge: azione CREA, RIGENERA o TOGLIE; colonne_perse = colonne bloccate dal vivo che il registro non nomina affatto (una riga con enabled = false e'' invece una decisione di togliere il blocco). Criterio unico di dbops.fn_run_automations_lock_columns e del presidio pgTAP dbops/test-lock-columns-convergenza. Brief: brief-db-lock-di-colonna-fuori-registro §4 D2-D3.';
