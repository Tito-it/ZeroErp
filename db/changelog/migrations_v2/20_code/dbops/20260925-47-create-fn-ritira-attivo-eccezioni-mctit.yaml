# P-2 — dbops.fn_ritira_attivo_eccezioni(): toglie i trigger ATTIVO gia'
#   generati per le FK a registro in dbops.automazione_attivo_eccezioni
#   Brief: brief-db-blocco-login-per-credenziale, sezione 12.3
#
# ── UNA SEDE, DUE CHIAMANTI ─────────────────────────────────────────
#   - dbops.fn_run_automations_attivo (20260925-48), in testa a ogni giro: chi
#     genera i trigger e' anche chi li ritira quando la coppia diventa
#     un'eccezione (CI: passata ci_apply; dev: job pgAgent automations_attivo);
#   - 90_end/20260925-50, una volta: su dbdev i trigger ci sono gia' e il job
#     gira solo la sera — senza, fino ad allora un SUPER_ADMIN non si crea.
#
# ── ⛔ PER FUNZIONE E ARGOMENTI, NON PER NOME ──────────────────────────
#   I nomi generati oltre i 63 caratteri sono HASHATI
#   (trg_profili_accesso_bindings_a10_identita_digitali_requi_880a4c): un
#   ritiro per nome si romperebbe al primo cambio di template. Il trigger si
#   riconosce da cio' che fa:
#     - require (sul FIGLIO): dbops.trgfn_child_requires_active_parent,
#       argomenti (schema_padre, tabella_padre, attivo_padre, colonna_fk, rif_padre)
#       -> figlio = tabella del trigger, colonna_fk = argomento 4;
#     - block (sul PADRE): dbops.trgfn_prevent_deactivate_if_children,
#       argomenti (schema_figlia, tabella_figlia, colonna_fk, rif_padre, attivo_padre)
#       -> argomenti 1, 2, 3.
#   `tgargs` e' un bytea separato da NUL: si legge con encode(…, 'escape').
#
# ⚠️ §11.5 delle linee guida: questa funzione fa DDL su trigger generati da
#   ci_apply. E' lecito perche' e' DROP … IF EXISTS e perche' su un database
#   nuovo, prima del ci_apply, non trova niente e torna 0.
# INVOKER: gira come il migratore o come il job, proprietari delle tabelle.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20260925-47-create-fn-ritira-attivo-eccezioni-mctit.yaml

  - changeSet:
      id: 20260925-47-create-fn-ritira-attivo-eccezioni
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.fn_ritira_attivo_eccezioni(): toglie i trigger ATTIVO (require sul figlio, block sul
        padre) gia' generati per le FK a registro in dbops.automazione_attivo_eccezioni,
        riconoscendoli per funzione e argomenti, non per nome. Torna quanti ne ha tolti. Chiamata
        dal motore (20260925-48) e una volta da 90_end (20260925-50). Brief:
        brief-db-blocco-login-per-credenziale §12.3.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_ritira_attivo_eccezioni()
              RETURNS integer
              LANGUAGE plpgsql
              SECURITY INVOKER
              AS $function$
              -- Scopo: togliere i trigger ATTIVO gia' generati per le FK dichiarate
              --   eccezione in dbops.automazione_attivo_eccezioni.
              -- Uso: SELECT dbops.fn_ritira_attivo_eccezioni();  -- quanti ne ha tolti
              DECLARE
                  r      record;
                  v_n    integer := 0;
              BEGIN
                  FOR r IN
                      WITH trg AS (
                          SELECT t.tgname,
                                 t.tgrelid,
                                 p.proname,
                                 -- tgargs: bytea con gli argomenti separati da NUL.
                                 string_to_array(rtrim(encode(t.tgargs, 'escape'), '\000'), '\000') AS a
                            FROM pg_trigger t
                            JOIN pg_proc p      ON p.oid = t.tgfoid
                            JOIN pg_namespace n ON n.oid = p.pronamespace
                           WHERE NOT t.tgisinternal
                             AND n.nspname = 'dbops'
                             AND p.proname IN ('trgfn_child_requires_active_parent',
                                               'trgfn_prevent_deactivate_if_children')
                      )
                      SELECT trg.tgname, trg.tgrelid::regclass AS rel
                        FROM trg
                        JOIN dbops.automazione_attivo_eccezioni e
                          ON (    trg.proname = 'trgfn_child_requires_active_parent'
                              AND trg.tgrelid = to_regclass(format('%I.%I', e.schema_figlia, e.tabella_figlia))
                              AND trg.a[4]    = e.colonna_fk)
                          OR (    trg.proname = 'trgfn_prevent_deactivate_if_children'
                              AND trg.a[1]    = e.schema_figlia
                              AND trg.a[2]    = e.tabella_figlia
                              AND trg.a[3]    = e.colonna_fk)
                  LOOP
                      EXECUTE format('DROP TRIGGER IF EXISTS %I ON %s', r.tgname, r.rel);
                      RAISE NOTICE 'fn_ritira_attivo_eccezioni: ritirato % su %', r.tgname, r.rel;
                      v_n := v_n + 1;
                  END LOOP;

                  RETURN v_n;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_ritira_attivo_eccezioni() IS
                  'Toglie i trigger ATTIVO gia'' generati per le FK dichiarate eccezione in dbops.automazione_attivo_eccezioni: il require sul figlio (dbops.trgfn_child_requires_active_parent, colonna FK = argomento 4) e il block sul padre (dbops.trgfn_prevent_deactivate_if_children, argomenti 1-3 = schema, tabella e colonna FK della figlia). Li riconosce per FUNZIONE e ARGOMENTI, non per nome (i nomi generati oltre 63 caratteri sono hashati). Torna quanti ne ha tolti. Chiamata in testa da dbops.fn_run_automations_attivo (chi genera ritira) e una volta da 90_end/20260925-50. Brief: brief-db-blocco-login-per-credenziale §12.3.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS dbops.fn_ritira_attivo_eccezioni();
