databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20260216-05-create-fn-seed-apply-automazione-guard-utility-tipo-ruolo-mctit.yaml

  - changeSet:
      id: 20260216-05-create-fn-seed-apply-automazione-guard-utility-tipo-ruolo
      author: mctit
      # ⚠️ Era `true`. In CI Liquibase gira DUE volte (--contexts="!provision" poi
      #   --contexts=ci_apply): un runOnChange ri-esegue nella seconda passata, FUORI
      #   dall'ordine di timeline, e rimette questo corpo sopra le revisioni piu'
      #   recenti. Regola dal 2026-08-06: in 00_schema e 20_code runOnChange e' VIETATO
      #   (cancello scripts/guardrail_run_on_change.py). Per aggiornare un oggetto si
      #   crea un file nuovo con numerazione successiva, non si rigira questo.
      runOnChange: false
      validCheckSums:
        - ANY
      comment: >
        Crea funzioni dbops per:
        - seed configurazione guard utility->tipo_ruolo;
        - apply trigger guard sulle tabelle configurate.

      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_seed_automazione_guard_utility_tipo_ruolo(
                p_schemas text[] DEFAULT NULL
              )
              RETURNS void
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_schemas text[];
                rtab record;
                v_soggetto_ruolo_col text;
              BEGIN
                v_schemas := dbops.fn_resolve_scope(p_schemas);

                FOR rtab IN
                  SELECT n.nspname AS schema_name,
                         c.relname AS table_name
                    FROM pg_class c
                    JOIN pg_namespace n ON n.oid = c.relnamespace
                   WHERE c.relkind = 'r'
                     AND n.nspname = ANY(v_schemas)
                     AND n.nspname <> 'storico'
                     AND dbops.fn_table_in_scope(n.nspname, c.relname)
                     AND dbops.fn_col_exists(n.nspname, c.relname, 'utility_id')
                LOOP
                  SELECT att.attname
                    INTO v_soggetto_ruolo_col
                    FROM pg_constraint con
                    JOIN unnest(con.conkey) WITH ORDINALITY AS k(attnum, ord) ON true
                    JOIN pg_attribute att
                      ON att.attrelid = con.conrelid
                     AND att.attnum = k.attnum
                    JOIN pg_class cref ON cref.oid = con.confrelid
                    JOIN pg_namespace nref ON nref.oid = cref.relnamespace
                    JOIN pg_class c ON c.oid = con.conrelid
                    JOIN pg_namespace n ON n.oid = c.relnamespace
                   WHERE con.contype = 'f'
                     AND n.nspname = rtab.schema_name
                     AND c.relname = rtab.table_name
                     AND nref.nspname = 'anagrafiche'
                     AND cref.relname = 'soggetti_ruoli'
                     AND att.attname LIKE '%_soggetto_ruolo_id'
                   ORDER BY
                     att.attname
                   LIMIT 1;

                  IF v_soggetto_ruolo_col IS NULL THEN
                    SELECT a.attname
                      INTO v_soggetto_ruolo_col
                      FROM pg_attribute a
                      JOIN pg_class c ON c.oid = a.attrelid
                      JOIN pg_namespace n ON n.oid = c.relnamespace
                     WHERE n.nspname = rtab.schema_name
                       AND c.relname = rtab.table_name
                       AND a.attnum > 0
                       AND NOT a.attisdropped
                       AND a.attname LIKE '%_soggetto_ruolo_id'
                     ORDER BY a.attname
                     LIMIT 1;
                  END IF;

                  IF v_soggetto_ruolo_col IS NULL THEN
                    CONTINUE;
                  END IF;

                  INSERT INTO dbops.automazione_guard_utility_tipo_ruolo (
                    schema_name,
                    table_name,
                    utility_column,
                    soggetto_ruolo_column,
                    enabled,
                    exec_mode,
                    meta
                  )
                  VALUES (
                    rtab.schema_name,
                    rtab.table_name,
                    'utility_id',
                    v_soggetto_ruolo_col,
                    true,
                    'AUTO',
                    jsonb_build_object(
                      'seed', 'auto_detect_fk_soggetti_ruoli',
                      'seeded_at', now()
                    )
                  )
                  ON CONFLICT (schema_name, table_name) DO NOTHING;
                END LOOP;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_seed_automazione_guard_utility_tipo_ruolo(text[])
              IS 'Popola dbops.automazione_guard_utility_tipo_ruolo autodetectando tabelle con utility_id + colonna ruolo (FK diretta o naming *_soggetto_ruolo_id).';

              CREATE OR REPLACE FUNCTION dbops.fn_apply_automazione_guard_utility_tipo_ruolo(
                p_exec_mode text DEFAULT 'AUTO',
                p_dry_run boolean DEFAULT false
              )
              RETURNS void
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                rconf record;
                v_trigger_name text;
                v_table_qualified text;
              BEGIN
                FOR rconf IN
                  SELECT *
                   FROM dbops.automazione_guard_utility_tipo_ruolo
                   WHERE enabled = true
                     AND (
                       upper(btrim(exec_mode)) = 'AUTO'
                       OR upper(btrim(exec_mode)) = upper(btrim(p_exec_mode))
                     )
                     AND soggetto_ruolo_column LIKE '%_soggetto_ruolo_id'
                   ORDER BY schema_name, table_name
                LOOP
                  IF NOT dbops.fn_col_exists(rconf.schema_name, rconf.table_name, rconf.utility_column)
                     OR NOT dbops.fn_col_exists(rconf.schema_name, rconf.table_name, rconf.soggetto_ruolo_column)
                  THEN
                    CONTINUE;
                  END IF;

                  v_table_qualified := quote_ident(rconf.schema_name) || '.' || quote_ident(rconf.table_name);
                  v_trigger_name := COALESCE(
                    rconf.trigger_name,
                    dbops.fn_name_from_template(
                      'trg_{table}_a10_guard_utility_tipo_ruolo_ins_upd',
                      rconf.schema_name,
                      rconf.table_name,
                      NULL,
                      NULL,
                      NULL,
                      NULL
                    )
                  );

                  IF p_dry_run THEN
                    CONTINUE;
                  END IF;

                  EXECUTE format('DROP TRIGGER IF EXISTS %I ON %s;', v_trigger_name, v_table_qualified);

                  EXECUTE format(
                    'CREATE TRIGGER %I
                     BEFORE INSERT OR UPDATE OF %I, %I ON %s
                     FOR EACH ROW
                     EXECUTE FUNCTION script.trgfn_guard_utility_tipo_ruolo_by_cols(%L, %L);',
                    v_trigger_name,
                    rconf.utility_column,
                    rconf.soggetto_ruolo_column,
                    v_table_qualified,
                    rconf.utility_column,
                    rconf.soggetto_ruolo_column
                  );
                END LOOP;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_apply_automazione_guard_utility_tipo_ruolo(text, boolean)
              IS 'Applica trigger guard utility->tipo_ruolo sulle tabelle configurate in dbops.automazione_guard_utility_tipo_ruolo.';
