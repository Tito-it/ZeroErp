# Helper di fixture pgTAP: un PUNTO DI PRELIEVO (anagrafiche.pdp) nuovo, su un
#   indirizzo suo, per l'utility scelta dal test.
#
# ── ⛔ IL DIFETTO ────────────────────────────────────────────────────
#   `anagrafiche.pdp` e' dato di MACCHINA: su un database ricostruito dai
#   changelog e' vuota. Quattro file del lotto 2 cercavano «un PDP GAS con
#   indirizzo valorizzato» e morivano — tre su «Non e' stato fornito un valore
#   per pdp_id» (script.fn_subentro_cliente), uno su un'asserzione di
#   precondizione. Un quinto (`anagrafiche/test-istanza-cliente-chain`) il PDP
#   se lo costruiva gia', a mano e su uno stradario cablato (`stradario_id = 4`):
#   regola del 2, la copia si ritira nello stesso giro.
#
# ── ⭐ LA FORMA, e la trappola che porta ────────────────────────────
#   Un PDP e' un INSERT, ma con DUE unicita' da rispettare: `uq_pdp_codice`
#   (il codice, globale) e `uq_pdp_addr_utility` (un indirizzo ha al piu' un
#   PDP per utility). La seconda e' quella che si sbaglia:
#   dbops.fn_pgtap_crea_indirizzo_dettaglio e' IDEMPOTENTE sull'etichetta — la
#   stessa etichetta risponde lo stesso indirizzo, e l'etichetta entra TRONCATA
#   a 10 caratteri in `interno` — quindi due PDP chiesti con etichette che
#   iniziano uguali finirebbero sullo stesso indirizzo e il secondo morirebbe.
#   ⇒ Il builder sceglie un numero libero (sui codici PGTAPPDPnnnnnn; la
#   tabella non e' in RLS, il massimo e' quello di tutti) e da quel numero
#   deriva SIA il codice SIA l'etichetta corta dell'indirizzo: nuovi entrambi,
#   per costruzione.
#
# ── ⭐ COSA NON ENTRA ────────────────────────────────────────────────
#   Il CLIENTE e l'ISTANZA sul PDP: sono il caso dei test (subentro, disdetta,
#   istanza da PDP), e ognuno li vuole in un modo suo. `cliente_id` resta NULL.
#
# Permessi: funzione di chi migra, non SECURITY DEFINER, non in
# dbops.sec_functions_owner.
# Brief: brief-db-fixture-che-costruiscono-giro-2.md §11, lotto 2.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20260923-09-create-fn-pgtap-crea-pdp-mctit.yaml

  - changeSet:
      id: 20260923-09-create-fn-pgtap-crea-pdp
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Helper di fixture pgTAP: dbops.fn_pgtap_crea_pdp() costruisce un punto
        di prelievo nuovo per l'utility scelta (per codice_interno, default
        GAS), su un indirizzo di dettaglio suo: codice e indirizzo derivano da
        un numero libero, cosi' uq_pdp_codice e uq_pdp_addr_utility sono
        rispettate per costruzione. anagrafiche.pdp e' dato di macchina.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_pgtap_crea_pdp(
                  p_utility_codice config.utilities.codice_interno%TYPE DEFAULT 'GAS'
              )
               RETURNS TABLE (
                  pdp_id                 anagrafiche.pdp.id%TYPE,
                  pdp_codice             anagrafiche.pdp.pdp%TYPE,
                  utility_id             anagrafiche.pdp.utility_id%TYPE,
                  indirizzo_dettaglio_id anagrafiche.pdp.indirizzo_dettaglio_id%TYPE
               )
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: dare a una fixture pgTAP un PUNTO DI PRELIEVO nuovo, su un
              --   indirizzo suo, per l'utility scelta. anagrafiche.pdp e' dato di
              --   MACCHINA: da zero e' vuota.
              -- Uso:
              --   CREATE TEMP TABLE tmp_pdp AS SELECT * FROM dbops.fn_pgtap_crea_pdp();
              --   CREATE TEMP TABLE tmp_pdp AS SELECT * FROM dbops.fn_pgtap_crea_pdp('ENERGIA');
              -- ⛔ Cliente e istanza sul PDP NON li scrive: sono il caso del test.
              DECLARE
                  v_utility anagrafiche.pdp.utility_id%TYPE;
                  v_n       bigint;
                  v_ind     anagrafiche.pdp.indirizzo_dettaglio_id%TYPE;
                  v_codice  anagrafiche.pdp.pdp%TYPE;
                  v_id      anagrafiche.pdp.id%TYPE;
              BEGIN
                  SELECT u.id INTO v_utility
                    FROM config.utilities u
                   WHERE u.codice_interno = p_utility_codice;

                  IF v_utility IS NULL THEN
                      RAISE EXCEPTION
                          'fn_pgtap_crea_pdp: nessuna utility con codice_interno = % (config.utilities)',
                          p_utility_codice;
                  END IF;

                  -- ⭐ UN numero libero, e da lui DUE cose nuove. Il codice e'
                  --   UNIQUE globale; l'indirizzo va nuovo perche' uq_pdp_addr_utility
                  --   ammette un solo PDP per (indirizzo, utility), e il builder
                  --   dell'indirizzo e' idempotente sull'etichetta, troncata a 10
                  --   caratteri: 'PDP' + 6 cifre ci sta intera.
                  --   anagrafiche.pdp non e' in RLS: il massimo e' di tutti.
                  SELECT COALESCE(max(substring(p.pdp from 9)::bigint), 0) + 1
                    INTO v_n
                    FROM anagrafiche.pdp p
                   WHERE p.pdp ~ '^PGTAPPDP[0-9]{6}$';

                  v_codice := 'PGTAPPDP' || lpad(v_n::text, 6, '0');
                  v_ind    := dbops.fn_pgtap_crea_indirizzo_dettaglio(
                                  'PDP' || lpad(v_n::text, 6, '0'));

                  -- Lo stato lo mette trgfn_pdp_set_default_stato.
                  INSERT INTO anagrafiche.pdp (pdp, utility_id, indirizzo_dettaglio_id)
                  VALUES (v_codice, v_utility, v_ind)
                  RETURNING id INTO v_id;

                  RETURN QUERY SELECT v_id, v_codice, v_utility, v_ind;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_pgtap_crea_pdp(character varying)
              IS 'Fixture pgTAP: un PUNTO DI PRELIEVO nuovo (anagrafiche.pdp, dato di MACCHINA: da zero e'' vuota) per l''utility scelta per codice_interno (default GAS), su un indirizzo di dettaglio suo. ⭐ Codice e indirizzo derivano da UN numero libero sui codici PGTAPPDPnnnnnn: uq_pdp_codice e uq_pdp_addr_utility sono rispettate per costruzione. ⚠️ L''indirizzo va nuovo apposta: dbops.fn_pgtap_crea_indirizzo_dettaglio e'' idempotente sull''etichetta (troncata a 10 caratteri), e due PDP della stessa utility sullo stesso indirizzo il modello non li ammette. ⛔ Cliente e istanza sul PDP NON li scrive: sono il caso del test. Ritorna pdp_id, pdp_codice, utility_id, indirizzo_dettaglio_id. Brief: brief-db-fixture-che-costruiscono-giro-2.md';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS dbops.fn_pgtap_crea_pdp(character varying);
