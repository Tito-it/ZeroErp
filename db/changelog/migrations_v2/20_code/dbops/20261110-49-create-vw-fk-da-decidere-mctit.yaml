# dbops.vw_fk_da_decidere: il presidio della politica degli indici (Q14 ②, N6).
#   Brief: brief-db-revisione-dbops, giro 10d, blocco 10d-2 (§29).
#
#   Prima il presidio era vw_fk_senza_indice stessa, filtrata sul flag: una FK
#   decisa a false ne usciva, e la scoperta scriveva false su ogni FK nuova,
#   quindi le FK nuove uscivano tutte. Ora il fatto (vw_fk_senza_indice) e il
#   presidio sono due viste. Tre casi, nella colonna caso:
#     - DA_DECIDERE: FK scoperta senza riga o con la riga DA_DECIDERE;
#     - CON_INDICE_NON_APPLICATA: FK decisa CON_INDICE e ancora scoperta (una
#       promessa non mantenuta: l'apply non e' girato, o il comando non ha
#       creato l'indice che la copre);
#     - FUORI_AMBITO: una riga di politica su uno schema che la politica non
#       governa, quindi l'apply non la applica.
#   Una FK SENZA_INDICE scoperta e' decisa: non compare.
#   Catalogata in presidi.csv / presidi_testi.csv (LAVORAZIONE, SETTIMANALE).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261110-49-create-vw-fk-da-decidere-mctit.yaml

  - changeSet:
      id: 20261110-49-create-vw-fk-da-decidere
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.vw_fk_da_decidere: le FK da decidere, le CON_INDICE non applicate, le righe fuori ambito.
        Brief: brief-db-revisione-dbops, giro 10d.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM information_schema.columns
               WHERE table_schema = 'dbops' AND table_name = 'vw_fk_senza_indice'
                 AND column_name = 'decisione'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW dbops.vw_fk_da_decidere AS
              SELECT v.schema_name,
                     v.table_name,
                     v.constraint_name,
                     CASE WHEN v.decisione = 'CON_INDICE' THEN 'CON_INDICE_NON_APPLICATA' ELSE 'DA_DECIDERE' END AS caso,
                     v.decisione,
                     v.create_index_suggestion AS dll_command
                FROM dbops.vw_fk_senza_indice v
               WHERE v.decisione IS NULL
                  OR v.decisione IN ('DA_DECIDERE', 'CON_INDICE')
              UNION ALL
              SELECT p.schema_name,
                     p.table_name,
                     p.constraint_name,
                     'FUORI_AMBITO' AS caso,
                     p.decisione,
                     p.dll_command
                FROM dbops.fk_index_policy p
               WHERE NOT dbops.fn_indici_schema_nell_ambito(p.schema_name);

              COMMENT ON VIEW dbops.vw_fk_da_decidere IS
                  'Presidio della politica degli indici delle FK (dbops.fk_index_policy). caso DA_DECIDERE: una FK scoperta (dbops.vw_fk_senza_indice) senza riga o con la riga DA_DECIDERE, cioe'' una FK su cui nessuno ha deciso; si decide con una riga CON_INDICE o SENZA_INDICE nel CSV della politica. caso CON_INDICE_NON_APPLICATA: una FK decisa CON_INDICE e ancora scoperta, perche'' dbops.apply_fk_index_policy non e'' girato o il comando non crea un indice che la copra. caso FUORI_AMBITO: una riga su uno schema che la politica non governa (dbops.fn_indici_schema_nell_ambito), che l''apply non applica. Una FK SENZA_INDICE e'' decisa e non compare. decisione e'' quella della riga (NULL se non c''e''), dll_command il comando proposto o scritto.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP VIEW IF EXISTS dbops.vw_fk_da_decidere;
