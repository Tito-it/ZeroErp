  - logicalFilePath: migrations_v2/20_code/dbops/20261108-54-update-fn-pgtap-crea-fattura-stato-e-valuta-dalle-sedi-mctit.yaml

  - changeSet:
      id: 20261108-54-update-fn-pgtap-crea-fattura-stato-e-valuta-dalle-sedi
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.fn_pgtap_crea_fattura: stato da script.fn_doc_stato_id, valuta da vendite.fn_get_valuta_id (D73, D74).
      preConditions:
