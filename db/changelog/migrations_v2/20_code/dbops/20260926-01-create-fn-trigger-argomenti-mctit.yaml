# dbops.fn_trigger_argomenti(bytea): gli argomenti di un trigger
#   (pg_trigger.tgargs) come text[]. Building block, regola del 2.
#   Brief: brief-db-lock-di-colonna-fuori-registro, sezione 7
#
# ── PERCHE' UN BUILDING BLOCK ───────────────────────────────────────
#   Chi riconosce un trigger generico (una funzione, tanti trigger) lo
#   riconosce dagli ARGOMENTI, non dal nome. Dal 26-09 sono due funzioni:
#   dbops.fn_ritira_attivo_eccezioni (20260925-47) e la convergenza del lock
#   (dbops.fn_lock_columns_divergenze, 20260926-03). ⇒ Alla seconda copia si
#   estrae, e la prima si ritira nello stesso giro (20260926-02).
#
# ── ⛔ PERCHE' NON encode(tgargs, 'escape') ─────────────────────────────
#   La forma in uso, string_to_array(rtrim(encode(tgargs,'escape'),'\000'),
#   '\000'), ha due difetti. Provati il 2026-09-26 su zeroerp_ci:
#   1. rtrim(testo, '\000') toglie l'INSIEME di caratteri {'\', '0'}, non la
#      sequenza: un ultimo argomento che finisce con uno zero lo perde.
#      'col', 'E_X10'  ->  {col,E_X1}.
#   2. 'escape' trasforma ogni byte con il bit alto in \nnn: un argomento
#      non ASCII ('citta' con l'accento) torna come citta\303\240.
#   Qui si lavora sui BYTE: ogni argomento in tgargs e' chiuso da un NUL
#   (catalogo di PostgreSQL, pg_trigger.tgargs), si tagliano i pezzi fra
#   un NUL e il successivo e si riconvertono con la codifica del server.
#
# STABLE e non IMMUTABLE: legge server_encoding. Nessun accesso a tabelle.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20260926-01-create-fn-trigger-argomenti-mctit.yaml

  - changeSet:
      id: 20260926-01-create-fn-trigger-argomenti
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.fn_trigger_argomenti(bytea): gli argomenti di un trigger come text[],
        tagliati sui byte NUL e riconvertiti con la codifica del server. Sostituisce
        la forma encode(…,'escape') + rtrim, che tronca un argomento finale che
        termina con zero e storpia i caratteri non ASCII.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 0
            sql: >
              SELECT count(*) FROM pg_proc
               WHERE proname = 'fn_trigger_argomenti'
                 AND pronamespace = 'dbops'::regnamespace
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE FUNCTION dbops.fn_trigger_argomenti(p_tgargs bytea)
              RETURNS text[]
              LANGUAGE sql
              STABLE
              PARALLEL SAFE
              AS $$
                -- Scopo: gli argomenti di un trigger (pg_trigger.tgargs) come text[],
                --   nell'ordine del CREATE TRIGGER. Vuoto se il trigger non ne ha.
                -- Ogni argomento e' chiuso da un byte NUL: il pezzo n va dal NUL n-1
                -- (escluso) al NUL n (escluso).
                WITH nul AS (
                    SELECT i AS fine,
                           lag(i, 1, -1) OVER (ORDER BY i) AS inizio,
                           row_number()  OVER (ORDER BY i) AS n
                      FROM generate_series(0, COALESCE(length(p_tgargs), 0) - 1) AS g(i)
                     WHERE get_byte(p_tgargs, i) = 0
                )
                SELECT COALESCE(
                         array_agg(convert_from(substring(p_tgargs FROM inizio + 2 FOR fine - inizio - 1),
                                                current_setting('server_encoding'))
                                   ORDER BY n),
                         ARRAY[]::text[])
                  FROM nul;
              $$;

              COMMENT ON FUNCTION dbops.fn_trigger_argomenti(bytea)
              IS 'Gli argomenti di un trigger (pg_trigger.tgargs) come text[], nell''ordine del CREATE TRIGGER; vuoto se non ne ha. Taglia sui byte NUL e riconverte con la codifica del server: la forma encode(tgargs,''escape'') + rtrim(…,''\000'') tronca un argomento finale che termina con zero (rtrim toglie l''insieme {\,0}) e storpia i caratteri non ASCII. Building block per chi riconosce un trigger generico dai suoi argomenti. Brief: brief-db-lock-di-colonna-fuori-registro §7.';
      rollback:
        - sql:
            dbms: postgresql
            sql: DROP FUNCTION IF EXISTS dbops.fn_trigger_argomenti(bytea);
