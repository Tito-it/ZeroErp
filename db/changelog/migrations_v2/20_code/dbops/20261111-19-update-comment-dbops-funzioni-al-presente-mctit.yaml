# I COMMENT DELLE FUNZIONI E PROCEDURE DI dbops, AL PRESENTE
#   Brief: brief-db-revisione-dbops, giro 14 (§34).
#
# ── PERCHE' ─────────────────────────────────────────────────────────
#   linee-guida-sql §5d: il COMMENT descrive l'oggetto al presente. Questi
#   portavano nomi di brief, marcatori di revisione, id di changeSet, sigle di
#   decisione, date di cronaca e misure; alcuni dicevano cose false (le M di
#   §3.1 del brief, riverificate in §34.3 sulla struttura di oggi). Dopo questo
#   giro il presidio dbops/test-comment-al-presente-v1 tiene il perimetro.
#
# ── CHE COSA CAMBIA ─────────────────────────────────────────────────
#   * Riscritti al presente i COMMENT con una marca, le fixture comprese;
#     corrette le frasi false (M4, M5, M6, M11, M25, M26, M27, M29, M33, M36);
#     i COMMENT impaginati in markdown diventano prosa.
#   * Nuovi: fn_list_indices, fn_schema_in_scope, fn_schema_match,
#     fn_table_in_scope (con il doppio significato di *all scritto).
#   * Fuori: dbops.fn_storico_arma_scope (20261111-22) e le due funzioni di
#     postgres, fn_generate_tx_id e fn_sync_functions_owner (20261111-24).
#   Solo COMMENT ON (55 istruzioni), nessun corpo. Testi di partenza
#   letti su dbdev; il rollback rimette quelli di oggi (IS NULL dove mancava).
#   Nessuna preCondition: un COMMENT su un oggetto che non c'e' fallisce da
#   se', e nessuno degli oggetti nasce dopo 20_code.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261111-19-update-comment-dbops-funzioni-al-presente-mctit.yaml

  - changeSet:
      id: 20261111-19-update-comment-dbops-funzioni-al-presente
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        COMMENT al presente (linee-guida-sql §5d) delle funzioni e procedure di dbops. Brief: brief-db-revisione-dbops, giro 14.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION dbops.fn_accensione_a_mano_ammessa_su_valori(boolean,boolean,text) IS
                'Il divieto di accendere a mano in PRODUZIONE un processo non accendibile (dbops.processi.accendibile_in_produzione = false), puro sui valori: e'' l''unico posto dove e'' scritto. In ordine: una scelta che non accende (false, o NULL = torna al default) -> true; processo accendibile, o senza sveglia -> true; ambiente SVILUPPO -> true; PRODUZIONE -> false; ambiente non dichiarato -> NULL (non decidibile). Lo leggono il guard di dbops.processi_accensione (dbops.trgfn_processi_accensione_guard: rifiuta con E_PROCESSO_NON_ACCENDIBILE_IN_PRODUZIONE, e con NULL E_CONFIG_MANCANTE), la regola dbops.fn_processo_acceso_su_valori (ignora una riga accesa che il divieto non ammette) e il backend per la capability del drawer, con acceso = true. IMMUTABLE e LANGUAGE sql (si inlinea), senza STRICT. Sui valori perche'' l''ambiente dell''installazione non cambia e la CI e'' SVILUPPO.';

              COMMENT ON FUNCTION dbops.fn_accoda_chiusura_scadenze() IS
                'Accoda un lavoro di chiusura scadenze per OGNI azienda del roster (dbops.vw_processi_roster), con l''identita'' tecnica di quella azienda nello scope: e'' cio'' che sveglia il job pgAgent, che non esegue il lavoro. Nessun processo di classe DOMINIO esegue dentro pgAgent, dove non ha identita'' e dove un fallimento non arriva a nessuno. Isolamento per azienda: un EXCEPTION per riga, cosi'' se un''azienda fallisce le altre vengono accodate lo stesso. Idempotente per (azienda, giorno operativo, script.fn_data_operativa) senza l''ora: due sveglie nello stesso giorno sono la stessa intenzione. run_as OPERATORE e non SISTEMA, come pretende il guard di classe di dbops.fn_accoda_lavoro. emittente_attivo_id e'' congelato all''accodamento: senza, il worker girerebbe in modalita'' globale e un lavoro chiesto per un''azienda toccherebbe anche le altre. Ritorna un riepilogo jsonb invece di sollevare: chi chiama e'' un job notturno, e un riepilogo finisce nel giornale mentre un''eccezione si perde.';

              COMMENT ON FUNCTION dbops.fn_check_funzioni_riferimenti_morti() IS
                'Compila con plpgsql_check ogni funzione plpgsql non di estensione e classifica i difetti in otto classi: REALE, ORFANA, NON_MISURATO, FP_DEFINER_PRIVILEGIO, FP_RAMO_ALTRA_TABELLA, FP_SQL_DINAMICO, FP_TRANSITION_TABLE, FP_VARIADIC. Fonte unica: la leggono scripts/sql/check_funzioni_riferimenti_morti.sql, il pgTAP db/pgtap/dbops/test-riferimenti-morti-v1.sql e i presidi dbops.vw_riferimenti_morti_da_sanare e dbops.vw_riferimenti_morti_rientrati. Richiede l''estensione plpgsql_check. NON_MISURATO e'' la classe di chi non si e'' potuto controllare: plpgsql_check ha sollevato invece di rispondere e il gestore EXCEPTION ha scritto error:CHECK-KO:. Chi consuma la tratta come un ROSSO, mai come assenza di difetti, come l''estensione assente. FP_DEFINER_PRIVILEGIO: un 42501 (permesso negato) dentro una funzione SECURITY DEFINER misurata da chi non ne e'' il proprietario ne'' membro del suo ruolo non e'' un riferimento morto, perche'' il corpo di una DEFINER gira coi privilegi del proprietario; la domanda giusta la fanno gli altri occhi del presidio (il conteggio come proprietario, il guardrail in CI come superuser). Chi e'' proprietario e prende un 42501 resta REALE. Il search_path e'' fissato nella definizione (pg_catalog, public, pg_temp) e la chiamata a plpgsql_check_function e'' qualificata con public.: servono entrambi. La funzione e'' SECURITY INVOKER e gira anche dentro dbops.fn_conta_presidio_per_variante, che e'' SECURITY DEFINER con search_path = pg_catalog, pg_temp: senza il pin ne erediterebbe il path, plpgsql_check_function non si risolverebbe (42883, l''estensione sta in public) e ogni funzione uscirebbe NON_MISURATO. Il search_path governa anche la risoluzione dei riferimenti DENTRO le funzioni che si compilano: senza public resterebbero falsi REALE le funzioni che nominano un''estensione senza schema (unaccent, dblink, il tipo geometry), come e'' normale in esercizio. public nel pin e'' nel path reale dell''applicazione, quindi la misura compila nel contesto in cui quelle funzioni girano. ⚠️ Un CREATE OR REPLACE che perde la clausola SET non fallisce: riporta il presidio a mentire.';

              COMMENT ON FUNCTION dbops.fn_codice_maiuscolo_perimetro(text[]) IS
                'Automazione CODICE_MAIUSCOLO: per ogni tabella dell''ambito che ha una colonna codice, o che ha gia'' il trigger, dice se script.trgfn_codice_maiuscolo e'' DOVUTO, quali trigger su quella funzione sono vivi e l''azione che li allinea: CREA (dovuto, nessuno vivo), RIGENERA (dovuto, piu'' di uno), TOGLIE (non dovuto, vivo), NULL (a posto). Perimetro: relkind r, schemi di dbops.fn_resolve_scope(p_schemas) meno storico, dbops.fn_table_in_scope, colonna codice di tipo stringa non generata. Dovuto = nel perimetro e non in dbops.automazione_codice_eccezioni (regola per esclusione). Il trigger vivo si riconosce dalla funzione, mai dal nome; i vivi si cercano solo negli schemi della corsa. E'' la sede unica della regola: la leggono dbops.fn_run_automations_codice_maiuscolo, la convergenza di ogni migrate (90_end), il pgTAP di presidio e la bonifica delle righe gia'' scritte.';

              COMMENT ON FUNCTION dbops.fn_conta_presidio(text) IS
                'Conta le righe che CHIEDONO UN INTERVENTO su una vista di presidio dichiarata in dbops.presidi: la somma dei gruppi di dbops.fn_conta_presidio_per_variante, che e'' la sede unica del perimetro (una vista non a catalogo solleva E_PRESIDIO_NON_A_CATALOGO, non torna zero) e del filtro (colonna_stato, stato_atteso) letto dal catalogo. SECURITY INVOKER: non legge le viste da se''; l''attraversamento della row level security (viste security_invoker su tabelle protette, che da un percorso senza GUC tornerebbero zero per cecita'') lo fa la sede, DEFINER del proprietario. ⛔ Torna un bigint e mai le righe. ⚠️ La colonna dbops.presidi.perimetro dice un''altra cosa, cioe'' se il chiamante puo'' anche ELENCARE le righe.';

              COMMENT ON FUNCTION dbops.fn_conta_presidio_per_variante(text) IS
                'Conta le righe che CHIEDONO UN INTERVENTO su una vista di presidio dichiarata in dbops.presidi, raggruppate per il valore della colonna nominata da dbops.presidi.colonna_variante (la causa della riga): una riga per valore presente, il NULL come gruppo a se''. Presidio senza colonna_variante: una riga sola, variante NULL, il conteggio intero anche a zero. E'' la sede unica del conteggio dei presidi: perimetro (catalogo, altrimenti E_PRESIDIO_NON_A_CATALOGO) e filtro di stato (colonna_stato IS DISTINCT FROM stato_atteso) stanno qui; dbops.fn_conta_presidio ne e'' la somma, cosi'' le due risposte non possono divergere. SECURITY DEFINER del proprietario, non di un superuser, con search_path pg_catalog, pg_temp: le viste security_invoker su tabelle in row level security, lette da un percorso senza GUC di sessione (un management command), tornerebbero zero per cecita''. E'' l''unico punto che attraversa la RLS: dbops.fn_conta_presidio e'' INVOKER e passa da qui. ⛔ Torna NUMERI per gruppo e mai le righe; il valore del gruppo e'' un codice di catalogo (dbops.presidi_cause), non un dato di dominio. Lettori: il digest (raggruppa per chi agisce della causa) e il pannello (conteggio accanto a ogni causa).';

              COMMENT ON FUNCTION dbops.fn_dati_di_sviluppo_ammessi_su_valori(text) IS
                'La regola, pura sul valore (IMMUTABLE, sql): i dati di sviluppo (le etichette di prova, il verbo anagrafiche.fn_provisiona_dati_di_sviluppo) sono ammessi solo se l''ambiente e'' SVILUPPO. NULL resta NULL: l''ambiente mancante lo dice il lettore script.fn_ambiente_installazione (E_CONFIG_MANCANTE). La leggono il guard dbops.trgfn_etichette_di_prova_guard e il verbo, passando l''ambiente vero; i pgTAP la chiamano coi due valori, perche'' la CI e'' SVILUPPO e l''ambiente non cambia.';

              COMMENT ON FUNCTION dbops.fn_ensure_storico_table(text,text,text,boolean,boolean) IS
                'Crea la shadow storico.<tabella> di una tabella base, se manca; se c''e'' gia'' non la tocca. Struttura standard: id bigserial, la colonna p_fk_col col tipo della chiave primaria monocampo della madre (altrimenti di id; senza nessuna delle due E_STORICO_PARENT_PK_NOT_FOUND), change_type, tipo_operazione, snapshot jsonb, user_insert, data_insert, tx_id, valid_from, valid_to; indice BTree su p_fk_col e, con p_create_gin_index, GIN sullo snapshot. Nessuna FK fisica verso la madre, per scelta: lo storico sopravvive a delete e pulizie. Creata la tabella, chiama dbops.fn_storico_arma_scope (origine_schema, scope_emittente_fiscale_id e, se dbops.storico_scope_policy dice che la madre e'' protetta, la RLS dello scope congelato) e cede la shadow al proprietario della madre: l''archivio di una tabella e'' di chi possiede la tabella, cosi'' la convergenza da Liquibase non la salta anche quando a crearla e'' il job pgAgent. La cessione la fa solo chi puo'' (superuser o membro del proprietario della madre); altrimenti audit WARN. p_dry_run: nessun DDL, audit DRYRUN. Ogni esito va in dbops.audit_log. Un errore di struttura esce come E_STORICO_PROVISION; un guasto dell''ambiente (script.fn_sqlstate_di_ambiente) si scrive nel registro errori e si rilancia col suo SQLSTATE, cosi'' il presidio dei job lo manda a chi gestisce l''ambiente.';

              COMMENT ON FUNCTION dbops.fn_get_child_fk_col(oid) IS
                'Il nome della colonna figlia di un vincolo di foreign key, dato l''OID del vincolo (pg_constraint.oid): legge conrelid e la prima colonna (conkey[1]) e risale a pg_attribute. Per una FK composta restituisce solo la colonna in posizione 1; NULL se l''OID non e'' un vincolo. La chiama dbops.fn_run_automations_attivo, che lavora sulle FK a una colonna. Legge solo i cataloghi di sistema, ma e'' dichiarata VOLATILE.';

              COMMENT ON FUNCTION dbops.fn_get_override_col(text,text,text,text) IS
                'Il nome della colonna che una tabella usa per un ruolo logico delle automazioni: l''override di dbops.automation_overrides_cols per (p_schema, p_table, p_role), una riga sola per chiave primaria, altrimenti p_default. I ruoli sono quelli del CHECK della tabella: ATTIVO_COL, STORICIZZA_COL, STORICO_FK, CODICE_COL, CODICE_INTERNO_COL. Non verifica che la colonna esista: per quello dbops.fn_col_exists. La usano i generatori e i trigger delle automazioni (ATTIVO, storico, provisioning dello storico), il risolutore dello scope dello storico e il presidio dbops.vw_marcatori_automazione_senza_esecutore.';

              COMMENT ON FUNCTION dbops.fn_get_pgagent_job_stato(text) IS
                'Che cosa sa pgAgent di un job: se e'' abilitato, quando ha girato l''ultima volta, quando girera'' la prossima. Sono le due date che il giornale non ha, e servono a rispondere a «tutti i lavori hanno una programmazione, e stanno partendo?». ⛔ E'' una funzione plpgsql e non un JOIN dentro una vista perche'' lo schema pgagent puo'' mancare (in CI la fase 85_pgagent non gira): una vista si risolve alla CREATE e il migrate si fermerebbe dove l''estensione non c''e''. SECURITY DEFINER del proprietario degli oggetti, che su pgagent ha i permessi, nessun superuser: zeroerp_app non ha USAGE sullo schema pgagent, e concederglielo aprirebbe anche pga_joblog, l''output dei comandi eseguiti. E'' una porta stretta: tre campi di UN job nominato. Torna zero righe se l''estensione manca, se il jobname e'' NULL o se quel job non esiste.';

              COMMENT ON FUNCTION dbops.fn_grant_storico_shadows(boolean) IS
                'Allinea i privilegi delle shadow storico.* a quelli della loro madre, derivandoli invece di elencarli: per ogni tabella storico.<t> la cui madre porta un trigger script.trgfn_storico_generic, concede SELECT, INSERT e UPDATE ai ruoli che sulla madre hanno INSERT o UPDATE. Nessun nome scritto: il marcatore e'' il trigger, quindi una tabella che esce dalla storicizzazione esce da qui da sola, e una shadow nuova e'' coperta senza che nessuno se ne ricordi. ⛔ Mai DELETE: uno snapshot SCD non si cancella, la stessa regola del loop dei grant e del provisioning, che tolgono il DELETE su tutto lo schema storico. Legge pg_class.relacl e non information_schema.role_table_grants, che mostra solo i grant del ruolo connesso. Verifica l''esito di ogni GRANT invece di supporlo: quando il concedente non e'' proprietario della shadow PostgreSQL emette un WARNING e prosegue senza sollevare. Il trigger di storicizzazione e'' SECURITY INVOKER e scrive nella shadow come il ruolo che aggiorna la madre: senza questi privilegi fallisce l''UPDATE sulla madre, non solo lo storico. Dove il GRANT resta senza effetto (la shadow e'' di un altro ruolo e chi esegue non puo'' concedere) registra un audit WARN e prosegue invece di fermare il migrate; la shadow di norma e'' del proprietario della madre, a cui la cede dbops.fn_ensure_storico_table. Riepilogo in dbops.audit_log (OK, o DRYRUN con p_dry_run). Idempotente e forward-only: non revoca mai, e non scrive dove i privilegi ci sono gia''. La chiama il 90_end a ogni migrate (runAlways).';

              COMMENT ON FUNCTION dbops.fn_guardiano_digest() IS
                'Il corpo del job pgAgent guardiano_digest: chi guarda il guardiano. Legge lo stato di digest_presidi da dbops.vw_processi_programmazione (il criterio di MUTO sta li'', non qui; processo assente: E_CONFIG_MANCANTE) e se e'' MUTO accoda UN lavoro NOTIFICA_DIGEST_MUTO per giorno operativo su dbops.coda_lavori, run_as SISTEMA, con chiave guardiano_digest:<giorno> controllata in qualunque stato, perche'' dbops.fn_accoda_lavoro deduplica solo fra i lavori vivi. ⛔ Non manda una mail: pgAgent non spedisce e non conosce il destinatario, che e'' un fatto di deploy e resta nel backend. Il lavoro lo esegue draina_coda_lavori, che spedisce col destinatario suo. E'' la guardia reciproca: il digest guarda tutti, pgAgent guarda il digest, e il guardiano e'' a catalogo come PGAGENT quindi il panorama guarda anche lui. ⚠️ Solo MUTO, non MAI_PARTITO: un digest mai installato lo dice il panorama nel pannello, e un avviso orario su un''installazione nuova insegnerebbe a ignorare il guardiano. Se il tipo NOTIFICA_DIGEST_MUTO e'' spento (attivo = false), l''accodamento solleva E_JOB_TYPE_NON_ATTIVO: la corsa e'' rossa in maintenance.vw_job_run_da_guardare, cioe'' «ho visto e non ho potuto dirlo», e non si aggira. Torna l''esito come testo: DIGEST_<stato>, GIA_NOTIFICATO_OGGI, ACCODATO:<id>.';

              COMMENT ON FUNCTION dbops.fn_idempotency_prenota(text,integer,text,uuid,boolean) IS
                'Prenota una Idempotency-Key per una richiesta e risponde al backend: ESEGUI (la key e'' sua), REPLAY (operazione gia'' fatta: response_payload), IN_CORSO (la sta eseguendo un''altra richiesta: il backend solleva E_IDEMPOTENCY_IN_PROGRESS). Una key failed si riprende sempre. Una key in_progress da oltre la soglia (dbops.fn_idempotency_soglia_secondi, sopra il timeout di gunicorn) si riprende solo con p_ripresa_ammessa = true, che il chiamante dichiara quando completed sta nella STESSA transazione dell''operazione: allora una in_progress orfana vuol dire «nessun commit». Con false (operazione a passi) resta IN_CORSO. p_ripresa_ammessa e'' obbligatorio: NULL e'' E_SCRIPT_CHIAMATA_NON_VALIDA. Una key prenotata da un altro utente o su un altro endpoint solleva E_IDEMPOTENCY_KEY_RIUSATA: ogni key e'' legata alla richiesta che l''ha prenotata (endpoint NOT NULL). La funzione non fa commit: il backend la chiama in autocommit, fuori dalla transazione dell''operazione, perche'' la prenotazione sia visibile subito alle altre richieste. SECURITY INVOKER.';

              COMMENT ON FUNCTION dbops.fn_idempotency_soglia_secondi() IS
                'La soglia in secondi oltre cui una Idempotency-Key rimasta in_progress conta come abbandonata e si puo'' riprendere: il default nudo del parametro SYSTEM_IDEMPOTENZA_IN_CORSO_SECONDI, senza override, validato da script.fn_intero_positivo_da_testo (E_CONFIG_MANCANTE se assente, vuoto o non intero positivo). Sede unica della lettura: la usano dbops.fn_idempotency_prenota e il controllo del backend all''avvio, che rifiuta di partire se la soglia non supera il timeout di gunicorn. SECURITY INVOKER.';

              COMMENT ON FUNCTION dbops.fn_imposta_accensione_processo(text,boolean,text) IS
                'Il verbo della scelta a mano: accende (true), spegne (false) o rimette al default per ambiente (NULL) la sveglia di un processo su questa installazione, col motivo, obbligatorio anche per il default. Tutti e tre i gesti scrivono la riga di dbops.processi_accensione (acceso NULL = segue il default): la riga e'' l''ultimo gesto, la storia sta in storico.processi_accensione. Chi e quando li scrive l''audit generato dalle automazioni (script.trgfn_audit_data_user_generic, app.jwt_user), non il verbo. Restituisce lo stato effettivo dopo il gesto (dbops.fn_processo_acceso_dichiarato). I limiti li dice il guard della tabella (E_PROCESSO_SENZA_SVEGLIA, E_PROCESSO_NON_SPEGNIBILE, E_PROCESSO_ACCENSIONE_MOTIVO_OBBLIGATORIO, E_PROCESSO_NON_ACCENDIBILE_IN_PRODUZIONE); codice inesistente: E_PROCESSO_NON_TROVATO. INVOKER: il permesso e'' del backend, come per Esegui ora.';

              COMMENT ON FUNCTION dbops.fn_list_indices(text,text) IS
                'Strumento DBA: gli indici di uno schema, o di una sola tabella se p_table non e'' NULL, con tabella, nome, unicita'', chiave primaria e definizione (pg_get_indexdef), in ordine di tabella e di indice. Legge solo i cataloghi di sistema; nessun chiamante nel database ne'' nel backend.';

              COMMENT ON FUNCTION dbops.fn_pgtap_articolo_correggi_struttura(uuid,jsonb) IS
                'Builder pgTAP: cambia i flag strutturali di un articolo gia'' usato dalla porta vera, catalogo.fn_articolo_correggi_struttura, come un SUPER_ADMIN costruito (dbops.fn_pgtap_crea_operatore_umano(.., true)), poi rimette app.current_user_id e app.ruolo_applicativo di chi chiama (anche vuoti). INVOKER: non aggira niente. Per i test che provano che cosa succede a valle quando un articolo cambia dopo l''uso.';

              COMMENT ON FUNCTION dbops.fn_pgtap_azienda_di_chi_agisce(text) IS
                'Fixture pgTAP, building block: l''azienda del contesto aperto, cioe'' emittente (id, codice, soggetto_ruolo) e operatore (auth_user_id, identita), risolta con la regola di produzione script.fn_resolve_emittente_for_user, la stessa del trigger z90 che lega il billing account. La usano dbops.fn_pgtap_crea_mondo_cliente, dbops.fn_pgtap_cliente_del_builder e script.fn_pgtap_emittente_operatore. Solleva, nominando il chiamante (p_chiamante), senza contesto, senza azienda o senza identita'' OPERATORE attiva. STABLE: non scrive.';

              COMMENT ON FUNCTION dbops.fn_pgtap_cf_libero() IS
                'Fixture pgTAP: un codice fiscale VALIDO secondo script.fn_valida_codice_fiscale e non ancora presente in anagrafiche.soggetti. Sorella di dbops.fn_pgtap_piva_libera: stesso problema (uq_soggetto_idstato_id_fiscale_univoco contro identificativi gia'' scritti), stessa soluzione. Il carattere di controllo non lo calcola, lo CERCA provando l''alfabeto e chiedendo al validatore di dominio: reimplementare l''algoritmo qui vorrebbe dire tenerne due copie. ⚠️ Non e'' un generatore di codici fiscali reali: il corpo e'' fittizio e serve solo a superare validatore e unicita'' in un test. Vede anche le righe non ancora committate.';

              COMMENT ON FUNCTION dbops.fn_pgtap_cliente_del_builder(text,bigint,text) IS
                'Fixture pgTAP, building block dei builder di commessa, contratto, bolla senza ordine, fattura, lotto e ordine: il cliente su cui il builder scrive. Senza billing account: il mondo (dbops.fn_pgtap_crea_mondo_cliente: azienda, operatore, contesto e un cliente nuovo). Col billing account di un''altra fixture: l''azienda di chi agisce (dbops.fn_pgtap_azienda_di_chi_agisce, serve un contesto aperto) e quel BA verificato (dbops.fn_pgtap_cliente_ba_del_mondo: uno di un''altra azienda solleva, nominando p_chiamante), senza costruire un cliente in piu''.';

              COMMENT ON FUNCTION dbops.fn_pgtap_concedi_azione(integer,character varying) IS
                'Fixture pgTAP: concede un''azione di processo a un utente con un override (config.user_override_azioni, abilitata, valido da oggi senza scadenza), idempotente sulla UNIQUE (utente, azione), e la fa VALERE: se l''area dell''azione non arriva al suo livello_minimo_area (script.fn_area_consente_azione, il tetto d''area) scrive un override d''area al minimo, valido da oggi. Un override d''area valido gia'' scritto dal test che chiude l''area -> RAISE: la fixture non scavalca la scelta del test. Serve ai pgTAP dei verbi che applicano un''azione con script.fn_guard_azione: l''operatore di dbops.fn_pgtap_crea_emittente_operatore non ha ne'' azioni ne'' aree. Azione inesistente -> RAISE. Solo per i pgTAP.';

              COMMENT ON FUNCTION dbops.fn_pgtap_crea_articolo(character varying,boolean,boolean,boolean,bigint,smallint,boolean,boolean,bigint,bigint) IS
                'Fixture pgTAP: un articolo COSTRUITO INTERO, con la struttura scelta dal test; pescarne uno dal catalogo darebbe un articolo qualunque, e un rifiuto che sembra un test rosso. p_uom_id: l''unita'' BASE, colonna bloccata; senza, la prima attiva del seed. Gli altri parametri: gestito_a_magazzino, requires_lotto, requires_serial, listino_tipologia_id, is_composito, is_solo_componente, natura_vendita_id (NULL = il default di tabella) e causale_onere_id: sono le colonne che catalogo.trgfn_articoli_guard_struttura_se_usato congela su un articolo usato, e il builder le valorizza tutte nell''INSERT, perche'' un UPDATE di correzione dopo il builder dipenderebbe dall''ordine della fixture. Le combinazioni le giudicano i guard della tabella. Solo per i pgTAP.';

              COMMENT ON FUNCTION dbops.fn_pgtap_crea_cliente(text,integer,bigint,character varying) IS
                'Fixture pgTAP: un cliente COMPLETO, cioe'' dbops.fn_pgtap_crea_cliente_ba (soggetto, ruolo CL, istanza, billing account; stessi primi tre parametri) piu'' la riga di anagrafiche.clienti sul BA appena nato, scritta dalla madre anagrafiche.fn_crea_cliente, che la rilegge a istruzione finita. Stato dal quarto parametro (codice_interno, default AT) e le date che quello stato pretende (trgfn_clienti_guard_stato_date), decise qui: attivazione = data operativa per attivi, sospesi e chiusi; sospensione per SF/SC; chiusura per i chiusi. Utility di default: la prima che non richiede il PDP. Rende cliente_id e le colonne di dbops.fn_pgtap_crea_cliente_ba. Usabile come zeroerp_app con un operatore dell''emittente del BA in sessione; altrimenti la rilettura risponde E_SCRIPT_CHIAMATA_NON_VALIDA.';

              COMMENT ON FUNCTION dbops.fn_pgtap_crea_commessa(text,character varying,bigint,boolean,boolean) IS
                'Fixture pgTAP: una COMMESSA del mondo in una chiamata: azienda, operatore e cliente (dbops.fn_pgtap_cliente_del_builder) e la commessa aperta dalla madre vendite.fn_get_or_create_commessa (p_force_new), con competenza nel mese corrente. Codice, emittente e stato iniziale li decide la madre, come in produzione; lo stato iniziale si legge dalla testata (vendite.commesse) con script.fn_doc_stato_iniziale_id. Secondo parametro: lo stato da raggiungere (NULL o l''iniziale: resta li''), per la matrice con dbops.fn_pgtap_porta_a_stato, sotto i guard veri. ⚠️ Terzo parametro: il billing account di un cliente gia'' costruito, verificato (un BA di un''altra azienda solleva); con lui non si costruisce un cliente in piu''. Senza, il cliente e'' uno nuovo del mondo (dbops.fn_pgtap_crea_mondo_cliente). Quarto parametro: scrive UN''attivita'' APPROVATA e NON_EMESSA (dbops.fn_pgtap_crea_commessa_attivita) prima del passaggio; NULL = solo se lo stato chiesto non e'' l''iniziale, perche'' l''uscita dalla bozza la pretende. Quinto parametro: scrive la sorgente ROOT (sorgente COMMESSA, l''id della commessa in sorgente_id), quella che il pull della fatturazione pretende. ⛔ Le altre attivita'' e le altre sorgenti sono il caso del test. Ritorna le chiavi, l''attivita'' scritta (o NULL) e lo stato raggiunto. ⚠️ Senza contesto aperto lo apre sull''operatore che costruisce; esce con i vincoli IMMEDIATE.';

              COMMENT ON FUNCTION dbops.fn_pgtap_crea_contratto(text,character varying,bigint,bigint,date,date,date,bigint) IS
                'Fixture pgTAP (e smoke): un CONTRATTO del mondo in una chiamata, cioe'' azienda, operatore e cliente (dbops.fn_pgtap_cliente_del_builder) e la testata nello stato scelto, e ritorna tutte le chiavi. Nasce dalla madre di produzione vendite.fn_create_contratto (numero, testata DRAFT, indirizzo di default), con l''emittente di chi agisce dichiarato. Terzo parametro: il billing account di un cliente gia'' costruito (per esempio quello di una commessa, perche'' un contratto citato da una riga deve essere del BA della sua commessa); verificato da dbops.fn_pgtap_cliente_ba_del_mondo, un BA di un''altra azienda solleva, e non si costruisce un cliente in piu''. Senza, il cliente e'' uno nuovo del mondo (dbops.fn_pgtap_crea_mondo_cliente). Quarto parametro: l''offerta da cui il contratto nasce, dalla push vendite.fn_push_offerta_a_contratto (stato ACCETTATA e idempotenza li giudica lei; listino, indirizzi, righe e utility dall''offerta), sul cliente dell''offerta: un billing account diverso solleva. Quinto-ottavo parametro: periodo (valido_dal, valido_al), data e listino del test, passati alla madre; NULL = quelli della madre, e con ATTIVO senza listino il builder ne costruisce uno del mondo; insieme al figlio di un''offerta sollevano (li decide la push). Stati: DRAFT; ATTIVO dal verbo del contratto, attraverso dbops.fn_pgtap_porta_a_stato (la porta rifiuta l''UPDATE dello stato; la fixture concede l''azione all''operatore; senza righe nessun motivo scatta, e un secondo ATTIVO sovrapposto sullo stesso BA lo rifiuta il modello); ANNULLATO dal verbo vendite.fn_annulla_contratto, con i legami dichiarati da vendite.fn_documento_legami (il figlio ha la sua offerta). ⛔ CESSATO e ogni altro codice sollevano prima di scrivere: CESSATO vuole valido_al e passa da ATTIVO, ed e'' il caso del test. ⛔ Non scrive righe, eccezioni ne'' scheda di fornitura. ⚠️ Esce con i vincoli IMMEDIATE, come ogni helper.';

              COMMENT ON FUNCTION dbops.fn_pgtap_crea_emittente_operatore(character varying,text) IS
                'Helper di fixture pgTAP: un''azienda su cui lavorare PIU'' l''operatore che la ha nel perimetro. Senza operatore il contesto di sessione resta vuoto e il dominio solleva «Nessun emittente fiscale attivo». ⚠️ L''operatore e'' un utente TECNICO, perche'' script.fn_crea_utente_tecnico e'' l''unico percorso di produzione che lega un utente a un emittente; per cio'' che i test attraversano e'' un operatore a tutti gli effetti (identita'' OPERATORE attiva, non super admin, un emittente nel perimetro). ⛔ Non usarlo dove il soggetto del test e'' l''operatore UMANO (flag tecnica, profili di accesso): li'' il caso va costruito, con dbops.fn_pgtap_crea_operatore_umano. Il chiamante deve poi puntarci il contesto: PERFORM script.fn_pgtap_set_contesto_operatore(auth_user_id). ⚠️ Esce con i vincoli IMMEDIATE, come ogni helper.';

              COMMENT ON FUNCTION dbops.fn_pgtap_crea_filiale_bancaria(text) IS
                'Fixture pgTAP: una filiale bancaria costruita (soggetto della banca, ruolo BANK_B coi suoi indirizzi obbligatori, e la filiale) dentro la finestra dei vincoli differiti, che e'' la trappola per cui questo builder esiste. ⚠️ anagrafiche.bank_branches e'' dato di MACCHINA, non seed di 80_data: su un database ricostruito e'' vuota, e un test che la pescasse morirebbe sul NOT NULL di bank_branch_id. ⛔ Il conto bancario non lo scrive: IBAN e titolare sono il caso del test. ⚠️ Esce con i vincoli IMMEDIATE, come ogni helper.';

              COMMENT ON FUNCTION dbops.fn_pgtap_crea_magazzino(character varying,boolean) IS
                'Fixture pgTAP: un magazzino dell''emittente dell''operatore in sessione (script.fn_pgtap_emittente_operatore: il guard di scope lo pretende), con un indirizzo fabbricato (dbops.fn_pgtap_crea_indirizzo_dettaglio) e usa_ubicazioni scelto dal test. La riga la scrive il building block magazzino.fn_crea_magazzino. Da chiamare dopo script.fn_pgtap_set_contesto_operatore.';

              COMMENT ON FUNCTION dbops.fn_pgtap_crea_operatore_umano(text,boolean) IS
                'Fixture pgTAP: un OPERATORE UMANO (persona fisica, risorsa umana, utente, identita'' OPERATORE attiva) costruito chiamando la madre di produzione anagrafiche.fn_crea_operatore_v2, volendo SUPER ADMIN (secondo parametro). Aggiunge solo cio'' che una fixture non sceglie bene da se'': la finestra differita (il guard degli indirizzi del soggetto e'' DEFERRABLE e gli indirizzi arrivano all''ultimo passo), un codice fiscale libero e lo username derivato, il sesso esplicito (la madre non ha default), un indirizzo di dettaglio. La madre crea la veste OPERATORE spenta, come per un invito; il builder fa il passo che in esercizio fa l''attivazione dell''invito e la accende col building block anagrafiche.fn_accendi_veste. Diverso da dbops.fn_pgtap_crea_emittente_operatore, che costruisce un utente TECNICO legato alla sua azienda: questo nasce SENZA azienda, come in produzione (un super admin senza azienda e'' il caso normale, multi-emittente, e toglierla dopo non si puo''). Per legarlo a un emittente: script.fn_change_user_emittenti_scope. ⚠️ Non apre il contesto; esce con i vincoli IMMEDIATE. ⛔ Cio'' che scrive si legge in un''istruzione SEPARATA: un JOIN o una funzione STABLE (script.fn_is_super_admin) nella stessa istruzione della chiamata vede la snapshot di prima.';

              COMMENT ON FUNCTION dbops.fn_pgtap_crea_pdp(character varying) IS
                'Fixture pgTAP: un PUNTO DI PRELIEVO nuovo (anagrafiche.pdp, dato di MACCHINA: da zero e'' vuota) per l''utility scelta per codice_interno (default GAS), su un indirizzo di dettaglio suo. Codice e indirizzo derivano da UN numero libero sui codici PGTAPPDPnnnnnn: uq_pdp_codice e uq_pdp_addr_utility sono rispettate per costruzione. ⚠️ L''indirizzo va nuovo apposta: dbops.fn_pgtap_crea_indirizzo_dettaglio e'' idempotente sull''etichetta (troncata a 10 caratteri), e due PDP della stessa utility sullo stesso indirizzo il modello non li ammette. ⛔ Cliente e istanza sul PDP non li scrive: sono il caso del test. Ritorna pdp_id, pdp_codice, utility_id, indirizzo_dettaglio_id.';

              COMMENT ON FUNCTION dbops.fn_pgtap_crea_roster_processo(text,character varying) IS
                'Helper di fixture pgTAP: crea un''azienda e le aggancia l''utente tecnico di un processo automatico, cosi'' la coppia (processo, azienda) compare in dbops.vw_processi_roster. Delega a dbops.fn_pgtap_crea_emittente_operatore: e'' il suo caso in cui il processo e'' il SOGGETTO del test, e quindi non ha un default. ⚠️ Pretende django.auth_user, che costruisce manage.py migrate e non Liquibase.';

              COMMENT ON FUNCTION dbops.fn_pgtap_crea_soggetto_pg(text,integer,integer,text) IS
                'Fixture pgTAP: crea un soggetto PERSONA GIURIDICA gia'' valido, dalle madri del dominio: testata, contatto di default e dati societari da anagrafiche.fn_crea_soggetto_pg, indirizzi da anagrafiche.fn_crea_indirizzi_soggetto. I valori li decide la configurazione: forma giuridica la prima ammessa dalla natura, REA e capitale solo se la forma li prevede, niente dati societari se la natura li vieta; partita IVA libera (dbops.fn_pgtap_piva_libera) o quella del test, che e'' anche il codice fiscale; lo stato per id, passato alla madre col suo codice ISO2 (un codice ambiguo lo rifiuta la madre). Indirizzi: uno del primo tipo obbligatorio della matrice del tipo di soggetto (config.tipi_soggetto_dettaglio_tipi_indirizzo), nella forma dello stato (dbops.fn_pgtap_indirizzo_libero_forma), copiato dalla madre sugli altri obbligatori; una natura senza tipi obbligatori nasce senza indirizzi. Apre e RICHIUDE la finestra dei tre guard DEFERRABLE INITIALLY DEFERRED di anagrafiche.soggetti, che il SET CONSTRAINTS ALL IMMEDIATE del preambolo farebbe scattare prima che la saga esista: al ritorno i vincoli sono IMMEDIATE, e un chiamante che dopo costruisce a mano un''altra saga deve aprirsi la sua finestra. Una natura PF la rifiuta la madre (E_SOGGETTO_CREAZIONE_NATURA_ERRATA): la persona fisica ha la sua porta. Ritorna l''id del soggetto.';

              COMMENT ON FUNCTION dbops.fn_pgtap_crea_soggetto_ruolo(uuid,character varying,integer) IS
                'Fixture pgTAP: assegna a un soggetto un ruolo gia'' completo dei suoi indirizzi OBBLIGATORI, letti da config.tipi_ruolo_tipi_indirizzo. ⚠️ Gli indirizzi di RUOLO sono un layer separato da quelli di SOGGETTO: hanno una matrice propria e un guard proprio, e un indirizzo di soggetto non soddisfa il guard del ruolo (il suo ripiego porta a un altro TIPO, non all''altro LAYER). Il ruolo lo crea o lo ritrova anagrafiche.fn_get_or_create_soggetto_ruolo; gli indirizzi li scrive il verbo anagrafiche.fn_crea_indirizzi_ruolo (copia sui tipi obbligatori, salta quelli gia'' presenti), da un indirizzo libero nella forma che il guard pretende per lo stato (dbops.fn_pgtap_indirizzo_libero_forma: comune e CAP del catalogo, oppure localita''). Come la sorella dbops.fn_pgtap_crea_soggetto_pg, apre e RICHIUDE la finestra dei vincoli differiti. Ritorna il soggetto_ruolo_id. ⚠️ Esce con i vincoli IMMEDIATE, come ogni helper.';

              COMMENT ON FUNCTION dbops.fn_pgtap_fattura_attivita(text,bigint[],bigint) IS
                'Fixture pgTAP: le ATTIVITA'' di commessa del test (secondo parametro, id di vendite.commesse_attivita, tutte dello stesso conto) emesse e agganciate a una FATTURA vera in bozza, una riga per attivita''. Esiste per la trappola d''ordine: emissione prima della lettura, attivita'' fatturabile letta per attivita'' (non per segmento, che con le rettifiche prende la riga sbagliata), testata coerente con l''emittente, righe in istruzioni a parte e in bozza, aggancio dopo la riga (il guard sul fatturato ammette solo vuoto -> valorizzato). L''emissione dalla madre vendite.fn_emit_attivita_fatturabili_da_commessa, una volta per commessa (emette tutte le attivita'' approvate e non emesse di quelle commesse), col marchio del lotto se c''e''. La testata: senza lotto dbops.fn_pgtap_crea_fattura in bozza sul conto delle attivita''; con p_lotto_id la madre vendite.fn_get_or_create_fattura_header. Le righe: quantita'', prezzo, articolo, unita'' e competenza dall''attivita'' fatturabile, prima IVA attiva, imponibile = quantita'' per prezzo. L''aggancio fattura_riga_id; col lotto anche lock_in_fatturazione e lock_batch_id del lotto. Del dominio nessuna funzione scrive le righe di fattura (le scrive il backend): il builder fa gli INSERT. ⛔ La fattura resta in bozza: portarla avanti, emetterla o toglierla (vendite.fn_cleanup_fatture_by_ids) e'' il caso del test. Restituisce, nell''ordine delle attivita'', attivita'', attivita'' fatturabile, fattura e riga. Attivita'' assenti, ripetute, di conti diversi, senza un''attivita'' fatturabile libera, o un lotto inesistente sollevano. ⚠️ Esce con i vincoli IMMEDIATE, come ogni helper.';

              COMMENT ON FUNCTION dbops.fn_pgtap_indirizzo_libero_forma(integer) IS
                'Helper di fixture pgTAP: una riga con comune_id, codice_postale_id, locality, postal_code nella forma che anagrafiche.trgfn_indirizzi_guard_forma_libera pretende per lo stato. Stato col catalogo completo (config.stati.catalogo_comuni_completo): il primo comune dello stato con un CAP, e quel CAP (ordine per id, deterministico). Altrimenti locality ''Localita pgTAP'' e postal_code ''00000''. La regola si legge dal flag, come il guard: le fixture non se la inventano. Lo usano dbops.fn_pgtap_crea_soggetto_ruolo, dbops.fn_pgtap_crea_soggetto_pg e le fixture dei pgTAP.';

              COMMENT ON FUNCTION dbops.fn_pgtap_piva_libera() IS
                'Fixture pgTAP: una partita IVA valida (cifra di controllo verificata da script.fn_valida_partita_iva) e non ancora presente in anagrafiche.soggetti, ne'' come partita IVA ne'' come codice fiscale o identificativo fiscale univoco. Delega a dbops.fn_pgtap_piva_libera(0). Dentro una sola istruzione due chiamate tornano lo stesso valore: un identificativo diventa occupato solo quando la riga e'' inserita. Per due valori distinti nella stessa istruzione si usa la sorella con p_skip (0, 1, …).';

              COMMENT ON FUNCTION dbops.fn_pgtap_piva_libera(integer) IS
                'Come dbops.fn_pgtap_piva_libera(), ma salta le prime p_skip libere. Serve perche'' la sorella senza argomenti torna lo STESSO valore se la si chiama due volte nella stessa istruzione: e'' l''insert della riga a rendere occupato un identificativo, e dentro una sola SELECT non c''e'' nessun insert in mezzo. Una fixture che vuole due partite IVA distinte usa fn(0) e fn(1). Firma separata e senza DEFAULT di proposito: un default renderebbe ambigue le chiamate a zero argomenti.';

              COMMENT ON FUNCTION dbops.fn_pgtap_porta_a_stato(regclass,bigint,text) IS
                'Fixture pgTAP: porta una testata di vendita dallo stato corrente allo stato p_stato (codice_interno) per il percorso piu'' corto della sua matrice dei passaggi, sotto i guard veri: le condizioni d''uscita dalla bozza (righe, indirizzi, prezzi…) le scrive prima il test. La mappa delle testate (colonna di stato, vocabolario, matrice, filtro) la legge da script.fn_doc_stato_modello; lo stato voluto da script.fn_doc_stato_id. Se la testata ha la porta (script.trgfn_doc_stato_solo_dal_verbo montato, letto dal catalogo) ogni passo e'' il verbo del documento, sui soli passaggi manuali, con l''azione del passaggio (script.fn_doc_passaggio) concessa all''utente del contesto da dbops.fn_pgtap_concedi_azione: la fixture porta lo stato, non prova il permesso. Una testata senza la porta passa con un UPDATE per passo, su tutti i passaggi della matrice. I verbi: bolla vendite.fn_cambia_stato_ddt; preventivo vendite.fn_cambia_stato_preventivo; ordine vendite.fn_cambia_stato_ordine; contratto vendite.fn_cambia_stato_contratto (CESSATO vuole valido_al arrivata, che scrive il test); offerta vendite.fn_cambia_stato_offerta, con una motivazione della fixture dove il passaggio la chiede; commessa vendite.fn_cambia_stato_commessa; reso vendite.fn_conferma_reso e vendite.fn_annulla_reso. Fattura, lotto e versione di listino percorrono anche i passaggi di processo, ognuno col suo verbo: la fattura vendite.fn_fattura_proietta_stato; il lotto vendite.fn_cambia_stato_lotto sui manuali e vendite.fn_lotto_proietta_stato_step sugli altri (un lotto con fatture si muove invece col giro, vendite.fn_sync_lotto_fatture_stato); la versione di listino ATTIVA da vendite.fn_attiva_versione_listino e CHIUSA da vendite.fn_chiudi_versioni_listino_scadute, che chiude ogni versione scaduta e vuole valido_al passata, scritta prima dal test. Gli stati di processo che nascono da un altro documento (EVASO e PARZIALMENTE_EVASO dell''ordine, SUPERATA dell''offerta) non si raggiungono da qui: si costruiscono evadendo o creando una revisione. Restituisce il codice_interno dello stato raggiunto, che e'' sempre p_stato: se il passaggio non e'' avvenuto solleva. Un documento nasce solo nello stato iniziale (script.trgfn_doc_stato_iniziale): una fixture che vuole un documento avanti lo crea e lo porta avanti da qui. Errori del chiamante (testata non gestita, id, stato o percorso inesistenti, porta senza verbo noto, stato non raggiunto): RAISE EXCEPTION. ⚠️ Esce con i vincoli IMMEDIATE, come ogni helper.';

              COMMENT ON FUNCTION dbops.fn_regexp_occorrenze(text,text) IS
                'Le occorrenze di una regex in un testo, una riga per ognuna coi gruppi catturati nell''array: lo stesso risultato di regexp_matches(testo, pattern, ''g''). Esiste per dichiarare la cardinalita'' vera (ROWS 1): regexp_matches ne dichiara 10, e in dbops.vw_funzioni_check_codici quel 10, moltiplicato da due ricorsioni, porta la stima del piano sopra jit_above_cost quando le statistiche di pg_proc contano piu'' corpi (lo presidia il pgTAP test-vw-funzioni-check-codici-sotto-jit-v1). plpgsql perche'' una LANGUAGE sql verrebbe inlineata e il ROWS ignorato. Non STRICT: con un argomento NULL non da'' righe, come regexp_matches. Da usare dove la stima moltiplica un piano, non al posto di ogni regexp_matches.';

              COMMENT ON FUNCTION dbops.fn_run_automations_codice_maiuscolo(text,text[],boolean) IS
                'Automazione CODICE_MAIUSCOLO: porta i trigger script.trgfn_codice_maiuscolo (BEFORE INSERT OR UPDATE FOR EACH ROW) allo stato di dbops.fn_codice_maiuscolo_perimetro: CREA dove e'' dovuto e manca, RIGENERA dove ce n''e'' piu'' di uno, TOGLIE dove non e'' dovuto (un''eccezione di dbops.automazione_codice_eccezioni, una colonna tolta, una tabella fuori ambito). Regola per esclusione: ogni colonna codice dell''ambito, tranne le eccezioni. Il nome viene dal template della regola CODICE_MAIUSCOLO di dbops.automation_rules_tbl, che e'' anche l''interruttore: senza regola accesa la tabella non si tocca (audit WARN NO_RULE) e la convergenza del migrate si ferma. Il trigger vivo si riconosce dalla funzione, mai dal nome. Dry run con audit DRYRUN; nel giro vero audit OK per azione. Errore strutturato E_CODICE_MAIUSCOLO; un guasto dell''ambiente (script.fn_sqlstate_di_ambiente) si rilancia col suo SQLSTATE. Chiamata a ogni migrate (90_end, runAlways) e dal job notturno automations_lock_columns.';

              COMMENT ON FUNCTION dbops.fn_run_automations_storico_provision(text,text[],boolean) IS
                'Provisioning delle shadow storico.<tabella> con le regole STORICO_PROVISION di dbops.automation_rules_tbl. Per ogni tabella (relkind r) degli schemi di dbops.fn_resolve_scope(p_schemas), escluso storico, che dbops.fn_table_in_scope ammette, applica le regole abilitate che valgono per lo schema (dbops.fn_schema_match) e per la tabella (target_table *all o ILIKE) e la cui exec_mode e'' AUTO o uguale a p_exec_mode (il CHECK della tabella ammette AUTO, CI, SCHEDULED). Una tabella entra solo se ha la colonna del flag di storicizzazione (storicizza, o l''override STORICIZZA_COL di dbops.automation_overrides_cols); la colonna che punta alla madre nella shadow e'' <tabella>_id, o l''override STORICO_FK. Per ognuna chiama dbops.fn_ensure_storico_table, che crea la shadow solo se manca e non modifica quelle esistenti; il parametro create_gin_index della regola chiede l''indice GIN sullo snapshot. p_dry_run: nessun DDL, audit DRYRUN.';

              COMMENT ON FUNCTION dbops.fn_schema_in_scope(text,text[]) IS
                'Il target di schema di una regola delle automazioni (dbops.automation_rules_tbl.target_schema) vale per l''elenco di schemi p_schemas? *all vale per qualunque schema; altrimenti il nome deve stare nell''elenco (confronto senza maiuscole). Target NULL, o elenco vuoto per un target che non e'' *all: false. ⚠️ Qui *all significa «qualunque schema»; in dbops.fn_resolve_scope lo stesso *all nell''elenco degli schemi significa «usa l''ambito di dbops.automation_scope, o il ripiego». IMMUTABLE. La usa dbops.fn_run_automations_attivo.';

              COMMENT ON FUNCTION dbops.fn_schema_match(text,text) IS
                'Il target di schema di una regola delle automazioni (dbops.automation_rules_tbl.target_schema) vale per lo schema p_schema? *all vale per qualunque schema; altrimenti il nome deve coincidere (confronto senza maiuscole). Target NULL: false. ⚠️ Qui *all significa «qualunque schema»; in dbops.fn_resolve_scope lo stesso *all nell''elenco degli schemi significa «usa l''ambito di dbops.automation_scope, o il ripiego». IMMUTABLE. La usano i generatori delle automazioni per scegliere le regole di una tabella.';

              COMMENT ON FUNCTION dbops.fn_sessione_del_migratore() IS
                'La sessione e'' di chi amministra il database? true se il ruolo di LOGIN (session_user) e'' membro del proprietario dello schema dbops (il migratore, in ogni ambiente) o un superuser. session_user e non current_user perche'' dentro una SECURITY DEFINER current_user e'' il proprietario; limite dichiarato: un SET ROLE non cambia session_user. Fail-closed (NULL = false), non solleva: rifiuta il chiamante. La chiamano dbops.fn_sync_functions_owner (RAISE nudo, canale di log protetto), script.fn_blocca_credenziale e script.fn_totp_disabilita_device (lo sblocco del secondo fattore dal server). INVOKER, STABLE.';

              COMMENT ON FUNCTION dbops.fn_storico_arma_scope_tutte(boolean) IS
                'Applica dbops.fn_storico_arma_scope a ogni madre che porta il trigger di storico (il marcatore e'' il trigger, non un elenco) e registra un riepilogo nell''audit: madri viste, shadow allineate, armate, saltate perche'' di un altro proprietario, senza shadow. Rete che converge: la chiamano il 90_end runAlways a ogni migrate e il provisioning da superuser.';

              COMMENT ON FUNCTION dbops.fn_storico_backfill_scope(text,text) IS
                'Backfill dello scope congelato sulle versioni gia'' scritte della shadow storico.<tabella> di una madre: alle righe con origine_schema NULL assegna lo schema della madre e scope_emittente_fiscale_id risolto da dbops.fn_storico_risolvi_scope sullo SNAPSHOT (per il modo PADRE risale al padre com''e'' oggi: e'' il limite dichiarato del backfill). Nelle shadow condivise fra due madri omonime attribuisce la versione alla madre di cui lo snapshot porta almeno una chiave ESCLUSIVA (jsonb_exists_any); le versioni senza chiavi esclusive restano NULL, e le conta il riepilogo di dbops.fn_storico_backfill_scope_tutte. Porta origine_schema a NOT NULL quando nessuna riga resta NULL e il chiamante ha i privilegi del proprietario della shadow (pg_has_role USAGE: il proprietario, un suo membro con INHERIT, un superuser). Idempotente.';

              COMMENT ON FUNCTION dbops.fn_storico_backfill_scope_tutte() IS
                'Applica dbops.fn_storico_backfill_scope a ogni madre col trigger di storico e registra un riepilogo nell''audit (madri, versioni aggiornate, residue a NULL, saltate). Idempotente: la chiamano il 90_end una volta e il provisioning da superuser.';

              COMMENT ON FUNCTION dbops.fn_storico_risolvi_scope(text,text,jsonb,integer) IS
                'Risolve l''emittenti_fiscali.id a cui appartiene la riga (to_jsonb) di una madre storicizzata, seguendo la strada dichiarata in dbops.storico_scope_policy: EF (copia), SR (converte 1:1), BA (l''unico emittente del billing account), COPPIA (la colonna dichiara due nomi, «<istanza>,<utility>», la chiave di anagrafiche.billing_account: il BA della coppia lo trova script.fn_get_ba_id_da_coppia, e se ne prende l''emittente come nel modo BA), PADRE (carica la riga del padre per id o, se il padre non e'' piu'' vivo, la sua ultima versione nello storico, normale in un DELETE a cascata dove il padre sparisce prima che il figlio scriva, e si richiama ricorsivamente), NESSUNO (NULL). La chiama il trigger di storico per congelare lo scope nella shadow. SECURITY DEFINER del proprietario, non di un superuser: catturare lo scope e'' un atto di sistema e deve vedere il padre anche quando chi scrive non lo vedrebbe sotto RLS; attraversa la RLS perche'' chi migra possiede le tabelle (ENABLE senza FORCE), e il pgTAP lo asserisce. Non solleva mai (madre non mappata, colonna vuota, coppia senza BA, padre sparito danno NULL, fail-closed sulla shadow), tranne su una catena che non termina (E_STORICO_SCOPE_CATENA_CICLICA).';

              COMMENT ON FUNCTION dbops.fn_table_in_scope(text,text) IS
                'La tabella p_schema.p_table e'' nell''ambito delle automazioni secondo dbops.automation_scope? true se la tabella di ambito non c''e'' o e'' vuota, se non ha righe per quello schema (lo schema intero), se una riga dello schema ha table_like = *all, o se p_table soddisfa il LIKE di una riga dello schema. Lo schema si confronta senza maiuscole, table_like cosi'' com''e''. Il filtro sugli schemi lo fa prima dbops.fn_resolve_scope: qui si decide solo la tabella. STABLE. La usano i generatori e i riconciliatori delle automazioni.';

              COMMENT ON FUNCTION dbops.fn_trigger_argomenti(bytea) IS
                'Gli argomenti di un trigger (pg_trigger.tgargs) come text[], nell''ordine del CREATE TRIGGER; vuoto se non ne ha. Taglia sui byte NUL e riconverte con la codifica del server: la forma encode(tgargs,''escape'') + rtrim(…,''\000'') tronca un argomento finale che termina con zero (rtrim toglie l''insieme {\,0}) e storpia i caratteri non ASCII. Building block per chi riconosce un trigger generico dai suoi argomenti: i riconoscitori e i riconciliatori delle automazioni ATTIVO, DELETE_BLOCK e guard utility, i lock di colonna (script.fn_doc_lock_montaggi, dbops.vw_lock_columns_vivi) e i presidi dei codici d''errore.';

              COMMENT ON FUNCTION dbops.trgfn_cleanup_at_alla_nascita() IS
                'BEFORE INSERT generico: scrive NEW.cleanup_at = colonna base + ttl_days con la regola di dbops.fn_cleanup_at_regola, la stessa che dbops.fn_run_automations_cleanup applica al pregresso. Nessuna regola, o una regola che non si applica (tabella esclusa, colonna base assente) -> cleanup_at NULL, la riga non scade; colonna base NULL sulla riga -> NULL, la scadenza la scrive il job quando la base c''e''. Una tabella senza cleanup_at passa intatta. Alla nascita e non con l''UPDATE del job perche'' su un registro quell''UPDATE riscriverebbe data_update/user_update e passerebbe dai trigger di UPDATE; il job resta per il pregresso. ⚠️ Sovrascrive cio'' che passa il chiamante: un diario non lascia scegliere quando scade. Fase m50: dopo gli a10 che riscrivono l''orario. Si monta a mano (trg_<tabella>_m50_cleanup_at_ins) sui registri che non ammettono l''UPDATE del job.';

              COMMENT ON FUNCTION dbops.trgfn_coda_archiviazione() IS
                'Governa la bandiera archiviato delle due code (dbops.coda_lavori, vendite.fatture_stampa_coda): rifiuta l''archiviazione di una riga VIVA, riabbassa la bandiera quando una riga archiviata torna viva, e deriva archiviato_il e archiviato_da. Una funzione per due tabelle: le colonne sono identiche per costruzione e due copie divergerebbero al primo che tocca una sola delle code. «Viva» e'' PENDING o IN_CORSO, la stessa definizione che conta il badge in topbar, e il predicato e'' scritto in negativo e non come elenco dei terminali, che fra le due code sono elenchi diversi. Il reset non e'' cortesia: senza, una riga archiviata e poi rimessa in coda dal requeue sarebbe viva e invisibile. ⛔ Il nome non porta guard perche'' la funzione scrive NEW. Errore: E_CODA_ARCHIVIAZIONE_NON_AMMESSA (CONFLITTO_STATO): non c''e'' nessun campo da correggere, c''e'' una riga ancora viva.';

              COMMENT ON FUNCTION dbops.trgfn_installazione_guard_immutabile() IS
                'Guard su dbops.installazione: rifiuta UPDATE e DELETE (trigger di riga) e TRUNCATE (trigger di istruzione) con E_AMBIENTE_IMMUTABILE. L''ambiente si scrive una volta, alla nascita, dalla fase post del provisioning, e non cambia in nessuna delle due direzioni: un database di sviluppo non si certifica pulito, una copia della produzione resta produzione. Anche un UPDATE allo stesso valore e'' rifiutato. Il proprietario puo'' disattivare il trigger: la difesa contro un DBA malevolo sono i ruoli, non un guard.';

              COMMENT ON FUNCTION dbops.trgfn_tx_id_managed() IS
                'Trigger function di audit: valorizza NEW.tx_id. Se NEW.tx_id e'' gia'' valorizzato normalizza la stringa vuota e ritorna subito, senza leggere config.parameters ne'' script.*: il resto del corpo serve solo a calcolare il valore quando manca. Quando NEW.tx_id IS NULL: bypass a due livelli, il parametro config.parameters.tx_id_bypass_enabled e poi la GUC myapp.bypass_tx_id_check, che si legge sempre quando il parametro non accende il bypass; parametro assente o NULL vale spento e lascia W_TXID_BYPASS_PARAMETRO_ASSENTE nel log, senza fermare la scrittura. Col bypass: il tx_id di sessione (GUC dbops.tx_id) o script.uuid_nil(). Senza bypass: se la GUC dbops.tx_id e'' impostata, l''id deve esistere in dbops.transaction_ids, altrimenti avverte (W_TXID_NOT_REGISTERED) e assegna script.uuid_nil(); una GUC che non e'' un uuid vale assente; se la GUC e'' assente chiama dbops.fn_get_or_create_session_tx_id(), e se quella fallisce solleva E_TXID_GENERATION. Il valore assegnato e'' quello di questi rami, con uuidv7() come ripiego se resta NULL: la GUC non si rilegge alla fine. Una lettura del parametro che fallisce solleva E_SQL_READ_TABLE. Convenzione: E_ = errore bloccante, W_ = avviso scritto solo nel log.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION dbops.fn_accensione_a_mano_ammessa_su_valori(boolean,boolean,text) IS
                'Il divieto di accendere a mano in PRODUZIONE un processo non accendibile (dbops.processi.accendibile_in_produzione = false), puro sui valori: l''unico posto dove e'' scritto. In ordine: una scelta che non accende (false, o NULL = torna al default) -> true; processo accendibile, o senza sveglia -> true; ambiente SVILUPPO -> true; PRODUZIONE -> false; ambiente non dichiarato -> NULL (non decidibile). Lo leggono il guard di dbops.processi_accensione (rifiuta con E_PROCESSO_NON_ACCENDIBILE_IN_PRODUZIONE; NULL -> E_CONFIG_MANCANTE), la regola dbops.fn_processo_acceso_su_valori (ignora una riga accesa che il divieto non ammette) e il backend per la capability del drawer, con acceso = true. IMMUTABLE e LANGUAGE sql (si inlinea), senza STRICT. Sui valori perche'' l''ambiente e'' immutabile e la CI e'' SVILUPPO. Brief: brief-db-processi-accensione-per-ambiente (R-BE-5).';

              COMMENT ON FUNCTION dbops.fn_accoda_chiusura_scadenze() IS
                'Accoda un lavoro di chiusura scadenze per OGNI azienda del roster, con l''identita'' tecnica di quella azienda nello scope. ⭐ E'' cio'' che il job pgAgent chiama al posto di dbops.fn_apply_chiusura_scadenze: da qui in poi pgAgent SVEGLIA e non lavora, ed e'' la regola presa il 2026-09-05 — nessun processo di classe DOMINIO esegue dentro pgAgent, dove non ha identita'' e dove un fallimento non arriva a nessuno (R-12: sei mesi di fallimenti silenziosi). ⭐ Isolamento per azienda: un EXCEPTION per riga, cosi'' se A fallisce B e C vengono accodate lo stesso — prima un errore su una tabella fermava tutto, per tutti. ⚠️ Idempotente per (azienda, GIORNO) senza l''ora: due sveglie nello stesso giorno sono la stessa intenzione. ⚠️ run_as OPERATORE e non SISTEMA: lo pretende il guard di classe di fn_accoda_lavoro, ed e'' il punto del cantiere. ⚠️ emittente_attivo_id e'' CONGELATO all''accodamento: senza, il worker girerebbe in modalita'' globale e un lavoro chiesto dentro A toccherebbe anche B. ⚠️ Ritorna un riepilogo invece di sollevare: chi chiama e'' un job notturno, e un riepilogo finisce nel giornale mentre un''eccezione si perde.';

              COMMENT ON FUNCTION dbops.fn_check_funzioni_riferimenti_morti() IS
                'Compila con plpgsql_check ogni funzione plpgsql non-estensione e classifica i difetti (REALE, ORFANA, NON_MISURATO, FP_*). Fonte unica: la usano sia scripts/sql/check_funzioni_riferimenti_morti.sql sia il pgTAP db/pgtap/dbops/test-riferimenti-morti-v1.sql. Richiede l''estensione plpgsql_check. NON_MISURATO dal 2026-09-10: e'' la classe di chi NON SI E'' POTUTO CONTROLLARE - plpgsql_check ha sollevato invece di rispondere, e il gestore EXCEPTION ha scritto error:CHECK-KO:. Prima quella forma cadeva nell''ELSE e usciva come REALE, cioe'' una funzione non misurata veniva riferita come riferimento morto: il 2026-09-10 su dbdev sono uscite 779 righe su 780 funzioni, con un registro del debito di DUE voci e lo stesso controllo verde in CI. NON_MISURATO va trattato come un ROSSO da chi consuma, mai come assenza di difetti: e'' la stessa regola che questo presidio applica gia'' all''estensione ASSENTE. Il search_path e'' PINNATO dal 2026-09-12 (pg_catalog, public, pg_temp) e la chiamata a plpgsql_check_function e'' qualificata con public.: sono DUE strati della stessa cosa e servono entrambi. Questa funzione e'' SECURITY INVOKER e gira anche DENTRO dbops.fn_conta_presidio, che e'' SECURITY DEFINER con search_path = pg_catalog, pg_temp: senza il pin ereditava quello, plpgsql_check_function non si risolveva (42883, l''estensione sta in public) e OGNI funzione del database usciva NON_MISURATO - il digest riferiva 784 riferimenti morti mentre la lettura diretta della stessa vista rispondeva 0, e delle 37 righe di dbops.presidi divergeva solo quella. ⛔ Ma il search_path governa anche la risoluzione dei riferimenti DENTRO le funzioni che si compilano: con la sola chiamata qualificata restavano QUATTRO falsi REALE - unaccent in config.trgfn_stradario_generale_normalize, dblink in dbops.fn_audit_end e fn_get_or_create_session_tx_id, il tipo geometry in script.fn_get_stradario - cioe'' funzioni sane che nominano un''estensione senza schema, come e'' normale e come funziona in esercizio. public nel pin non e'' arbitrario: e'' nel path reale dell''applicazione, quindi la misura compila nel contesto in cui quelle funzioni girano davvero. ⚠️ Chi rifa'' questa funzione tenga il pin: un CREATE OR REPLACE che perde la clausola SET non fallisce - riporta il presidio a mentire, ed e'' la stessa trappola di security_invoker su CREATE OR REPLACE VIEW. Lo prende solo il test 7 del suo pgTAP, che conta attraverso fn_conta_presidio. Brief: brief-db-un-destinatario-per-i-presidi 13.2. ⭐ FP_DEFINER_PRIVILEGIO dal 2026-09-14: un 42501 (permesso negato) dentro una funzione SECURITY DEFINER misurata da chi non e'' il suo proprietario ne'' membro del suo ruolo NON e'' un riferimento morto - il corpo di una DEFINER gira coi privilegi del proprietario, e la domanda giusta la fanno gli altri occhi del presidio (fn_conta_presidio come proprietario, il guardrail in CI come superuser). Trovato dal primo digest settimanale: dbops.fn_get_pgagent_job_stato usciva REALE come zeroerp_app e non usciva affatto come titodb, e la riga 7 del registro risultava insieme necessaria e di troppo sulla stessa macchina. Chi e'' proprietario e prende un 42501 resta REALE. Le classi sono OTTO.';

              COMMENT ON FUNCTION dbops.fn_codice_maiuscolo_perimetro(text[]) IS
                'Automazione CODICE_MAIUSCOLO (decisione Tid 2026-11-04): per ogni tabella dell''ambito che ha una colonna codice, o che ha gia'' il trigger, dice se script.trgfn_codice_maiuscolo e'' DOVUTO, quali trigger su quella funzione sono vivi e l''azione che li allinea: CREA (dovuto, nessuno vivo), RIGENERA (dovuto, piu'' di uno), TOGLIE (non dovuto, vivo), NULL (a posto). Perimetro: relkind r, schemi di dbops.fn_resolve_scope(p_schemas) meno storico, dbops.fn_table_in_scope, colonna codice di tipo stringa non generata. Dovuto = nel perimetro e non in dbops.automazione_codice_eccezioni (regola per esclusione). Il trigger vivo si riconosce dalla funzione, mai dal nome; i vivi si cercano solo negli schemi della corsa. E'' la sede unica della regola: la leggono dbops.fn_run_automations_codice_maiuscolo, la convergenza di ogni migrate (90_end), il pgTAP di presidio e la bonifica una tantum delle righe gia'' scritte.';

              COMMENT ON FUNCTION dbops.fn_conta_presidio(text) IS
                'Conta le righe che CHIEDONO UN INTERVENTO su una vista di presidio dichiarata in dbops.presidi: la SOMMA dei gruppi di dbops.fn_conta_presidio_per_variante, che e'' la sede unica del perimetro (una vista non a catalogo solleva E_PRESIDIO_NON_A_CATALOGO, non torna zero) e del filtro (colonna_stato, stato_atteso) letto dal catalogo. Dal 2026-10-10 e'' SECURITY INVOKER: non legge piu'' le viste da se'', e l''attraversamento della row level security (tre viste security_invoker su tabelle protette, che da un percorso senza GUC — un management command — tornerebbero ZERO per cecita'') lo fa la sede, DEFINER del proprietario. ⛔ Torna un bigint e MAI le righe. ⚠️ La colonna dbops.presidi.perimetro dice un''altra cosa, cioe'' se il chiamante puo'' anche ELENCARE le righe. Brief: brief-db-un-destinatario-per-i-presidi §4.1, brief-db-presidio-processi-testo-per-causa §6.2.';

              COMMENT ON FUNCTION dbops.fn_conta_presidio_per_variante(text) IS
                'Conta le righe che CHIEDONO UN INTERVENTO su una vista di presidio dichiarata in dbops.presidi, raggruppate per il valore della colonna nominata da dbops.presidi.colonna_variante (la causa della riga): una riga per valore presente, il NULL come gruppo a se''. Presidio senza colonna_variante: una riga sola, variante NULL, il conteggio intero anche a zero. ⭐ E'' la SEDE UNICA del conteggio dei presidi: perimetro (catalogo, altrimenti E_PRESIDIO_NON_A_CATALOGO) e filtro di stato (colonna_stato IS DISTINCT FROM stato_atteso) stanno qui; dbops.fn_conta_presidio ne e'' la somma, cosi'' le due risposte non possono divergere. ⭐ SECURITY DEFINER del PROPRIETARIO, non di un superuser, per la stessa ragione di fn_conta_presidio: le viste security_invoker su tabelle in row level security, da un percorso senza GUC di sessione, tornerebbero ZERO per cecita''. ⛔ Torna NUMERI per gruppo e MAI le righe; il valore del gruppo e'' un codice di catalogo (dbops.presidi_cause), non un dato di dominio. Lettori: il digest (raggruppa per chi agisce della causa) e il pannello (conteggio accanto a ogni causa). Brief: brief-db-presidio-processi-testo-per-causa §6.2 (R-2).';

              COMMENT ON FUNCTION dbops.fn_dati_di_sviluppo_ammessi_su_valori(text) IS
                'La regola, pura sul valore (IMMUTABLE, sql): i dati di sviluppo (le etichette di prova, il verbo anagrafiche.fn_provisiona_dati_di_sviluppo) sono ammessi solo se l''ambiente e'' SVILUPPO. NULL resta NULL: l''ambiente mancante lo dice il lettore script.fn_ambiente_installazione (E_CONFIG_MANCANTE). La leggono il guard dbops.trgfn_etichette_di_prova_guard e il verbo, passando l''ambiente vero; i pgTAP la chiamano coi due valori (la CI e'' SVILUPPO e l''ambiente non cambia). Brief: brief-db-processi-accensione-per-ambiente (R-4, §5.5).';

              COMMENT ON FUNCTION dbops.fn_ensure_storico_table(text,text,text,boolean,boolean) IS
                'Provisioning idempotente della tabella di storico (schema storico) per una tabella base.
              Crea storico.<table_base> se mancante, con struttura standard (snapshot jsonb, audit cols, finestre valid_from/to)
              e indice BTree su fk logica. La FK fisica verso la tabella base NON viene creata per scelta progettuale. Supporta dry-run con audit. Rev 2026-09-11: dopo la creazione chiama dbops.fn_storico_arma_scope, che aggiunge origine_schema e scope_emittente_fiscale_id (con indice) e, se dbops.storico_scope_policy dice che la madre è protetta, accende la RLS con le policy dello scope congelato. Rev 2026-09-11 (decisione a): creata e armata, la shadow viene CEDUTA al proprietario della madre — l''archivio di una tabella è di chi possiede la tabella — così la convergenza da Liquibase non la salta anche quando a crearla è il job pgAgent come postgres. Solo se chi crea può cederla (superuser o membro), altrimenti WARN. Brief: brief-db-rls-storico-scope-congelato §4b, §4d. ⭐ Rev 2026-10-16: nel gestore WHEN others, un guasto dell''AMBIENTE (script.fn_sqlstate_di_ambiente: 08, 53, 57, 58, 42501, 55P03) si rilancia COM''E'', col suo SQLSTATE, dopo averlo scritto nel registro errori con lo stesso codice e contesto (fn_log_error_only). Prima diventava P0001 col codice dell''involucro, e il presidio dei job (maintenance.vw_job_run_da_guardare) lo mandava allo sviluppo. I difetti di struttura escono come prima. Brief: brief-db-presidio-job-run-a-chi-tocca D8, D11.';

              COMMENT ON FUNCTION dbops.fn_get_child_fk_col(oid) IS
                '
                Ritorna il **nome della colonna figlia** (lato *child*) coinvolta in un
                vincolo di **foreign key** identificato dall’OID del vincolo
                (`pg_constraint.oid`).

                • **Ritorno**: `text` — Nome della colonna (`pg_attribute.attname`) sul
                  lato child. Restituisce **NULL** se l’OID non corrisponde ad alcun vincolo
                  o se non è possibile risalire alla colonna.

                • **Parametro**
                  - `p_conoid oid`: OID del vincolo in `pg_constraint`.

                • **Logica**
                  - Legge da `pg_constraint` il `conrelid` (tabella child) e l’indice della
                    prima colonna `conkey[1]`.
                  - Risale a `pg_attribute` per ottenere `attname` della colonna child.

                • **Casi d’uso**
                  - Utility nei processi di automazione per derivare il nome della colonna
                    figlia partendo dal vincolo FK (es. generazione trigger/validation).

                • **Note**
                  - La funzione considera **solo la prima colonna** della FK:
                    per vincoli **composti** restituisce la colonna in posizione 1.
                    Estensioni future potrebbero esporre **tutte** le colonne
                    (es. funzione che ritorna `text[]`).
                  - Non applica filtri su colonne “dropped”; qualora necessario, valutare
                    l’uso di `a.attisdropped = false`.
                  - La funzione è di fatto **STABLE** (consulta soli cataloghi di sistema).

                ';

              COMMENT ON FUNCTION dbops.fn_get_override_col(text,text,text,text) IS
                '
                Ritorna il **nome della colonna** da usare per un certo *ruolo logico* (es. `AUDIT_TS`,
                `AUDIT_USER`, `ATTIVO_COL`, `STORICO_FK`) verificando prima un **override** nella tabella
                `dbops.automation_overrides_cols`. Se non presente, restituisce il **valore di default**
                passato in input.

                 **Ritorno**: `text` — Nome colonna effettivo (override se presente, altrimenti `p_default`).

                 **Parametri**
                  - `p_schema text`: schema della tabella.
                  - `p_table  text`: nome della tabella.
                  - `p_role   text`: ruolo logico della colonna (chiave su `automation_overrides_cols.col_role`).
                  - `p_default text`: nome colonna di default da usare in assenza di override.

                 **Note implementative**
                  - Query diretta su `dbops.automation_overrides_cols` con `LIMIT 1`.
                  - Usa `COALESCE(..., p_default)` per garantire sempre un valore di ritorno.

                 **Casi d’uso tipici**
                  - Generazione/validazione automatica di trigger e funzioni che dipendono da colonne “convenzione”.
                  - Personalizzazione per tabella di audit columns o fk di storico.

                 **Limitazioni**
                  - Non valida l’esistenza reale della colonna; in combinazione usare `dbops._col_exists`.
                ';

              COMMENT ON FUNCTION dbops.fn_get_pgagent_job_stato(text) IS
                'Che cosa sa pgAgent di un job: se e'' abilitato, quando ha girato l''ultima volta, quando girera'' la prossima. Sono le due date che il nostro giornale non ha, e servono a rispondere a «tutti i lavori hanno una programmazione, e stanno partendo?». ⛔ E'' una FUNZIONE plpgsql e non un JOIN dentro una vista perche'' 85_pgagent in CI e'' MARK_RAN: una vista si risolve alla CREATE e il migrate si fermerebbe dove l''estensione non c''e'' — stessa regola presa per django.* col changeSet 20260905-30. ⭐ SECURITY DEFINER dal 20260906-08, ed e'' una CORREZIONE: era INVOKER, e zeroerp_app non ha USAGE sullo schema pgagent — la vista di panorama era illeggibile proprio da chi deve usarla («permesso negato per lo schema pgagent»). L''alternativa era un GRANT sullo schema all''applicazione, che avrebbe aperto anche pga_joblog (l''output dei comandi eseguiti): per far leggere tre date si sarebbe concesso un archivio. ⇒ Porta stretta: tre campi innocui di UN job nominato. ⚠️ Basta il proprietario degli oggetti, che su pgagent ha gia'' i permessi: nessun superuser. ⚠️ Torna ZERO RIGHE se l''estensione manca, se il jobname e'' NULL o se quel job non esiste. ⭐ Il difetto l''ha trovato test-riferimenti-morti-v1, compilando la funzione con plpgsql_check: nessuna prova manuale l''aveva visto, perche'' giravano tutte da titodb.';

              COMMENT ON FUNCTION dbops.fn_grant_storico_shadows(boolean) IS
                'Allinea i privilegi delle shadow storico.* a quelli della loro madre, DERIVANDOLI invece di elencarli: per ogni tabella storico.<t> la cui madre porta un trigger script.trgfn_storico_generic, concede SELECT/INSERT/UPDATE ai ruoli che sulla madre hanno INSERT o UPDATE. ⭐ Nessun nome scritto da nessuna parte: il marcatore e'' il TRIGGER, quindi una tabella che esce dalla storicizzazione esce da qui da sola, e una shadow nuova e'' coperta senza che nessuno se ne ricordi. ⛔ MAI DELETE, ed e'' una regola di dominio: uno snapshot SCD non si cancella — la stessa che asserisce il test 19 di db/pgtap/rls/test-role-batch-fatturazione-postura.sql. Per questo la regola NON e'' «copia i privilegi della madre»: sulla madre il ruolo batch ha anche DELETE. ⚠️ Legge pg_class.relacl e non information_schema.role_table_grants, che mostra solo i grant del ruolo CONNESSO e da un altro ruolo risponde zero righe sempre (e'' il difetto che aveva reso muto il test 8 della postura). ⚠️ Verifica l''ESITO di ogni GRANT invece di supporlo: quando il concedente non e'' proprietario dell''oggetto PostgreSQL emette un WARNING e prosegue, non solleva — un EXCEPTION WHEN insufficient_privilege non scatterebbe mai e la funzione registrerebbe OK senza aver concesso niente. ⚠️ Il trigger di storicizzazione e'' SECURITY INVOKER: scrive nella shadow come il ruolo che aggiorna la madre, quindi senza questi privilegi e'' l''UPDATE sulla madre a fallire, non solo lo storico a perdersi. 🔴 LIMITE: un GRANT lo da'' il proprietario, e le shadow ereditano il proprietario da chi ha eseguito l''automazione — misurate il 2026-09-02, cinque di postgres e quattro di titodb. Dove non e'' proprietaria la funzione REGISTRA e prosegue (audit SKIP) invece di fermare il migrate: a concedere sara'' il provisioning, che gira da superuser. Idempotente e forward-only: non revoca mai, e non scrive dove i privilegi ci sono gia''. Chiamata da migrations_v2/90_end/20260902-10-run-grant-storico-shadows.';

              COMMENT ON FUNCTION dbops.fn_guardiano_digest() IS
                'Il corpo del job pgAgent guardiano_digest: chi guarda il guardiano. Legge lo stato di digest_presidi da dbops.vw_processi_programmazione — il criterio di MUTO sta LA'', accanto al CASE, non qui — e se e'' MUTO accoda UN lavoro NOTIFICA_DIGEST_MUTO per giorno su dbops.coda_lavori (chiave guardiano_digest:<giorno>, controllata in qualunque stato perche'' fn_accoda_lavoro dedupe solo fra PENDING/IN_CORSO). ⛔ Non manda una mail: pgAgent non spedisce e non conosce il destinatario, che e'' un fatto di deploy e resta nel backend. Il lavoro lo esegue draina_coda_lavori — il processo piu'' vivo, con badge in topbar — che spedisce col destinatario suo. ⭐ E'' la guardia reciproca: il digest guarda tutti, pgAgent guarda il digest, e il guardiano e'' a catalogo come PGAGENT quindi il panorama guarda anche lui. ⚠️ Solo MUTO, non MAI_PARTITO: un digest mai installato lo dice il panorama nel pannello, e un nagging orario su un''installazione nuova insegnerebbe a ignorare il guardiano. ⚠️ Finche'' il tipo NOTIFICA_DIGEST_MUTO e'' attivo = false (backend senza handler), il digest vivo tiene il job verde, e il digest MUTO fa sollevare E_JOB_TYPE_NON_ATTIVO — corsa rossa in vw_job_run_da_guardare, cioe'' «ho visto e non ho potuto dirlo»: voluto, non si aggira. Torna l''esito come testo: DIGEST_<stato>, GIA_NOTIFICATO_OGGI, ACCODATO:<id>. Brief: brief-db-quattro-processi-senza-presidio §10.2, decisione di Tid 2026-09-11.';

              COMMENT ON FUNCTION dbops.fn_idempotency_prenota(text,integer,text,uuid,boolean) IS
                'Prenota una Idempotency-Key per una richiesta e risponde al backend: ESEGUI (la key e'' sua), REPLAY (operazione gia'' fatta: response_payload), IN_CORSO (la sta eseguendo un''altra richiesta: il backend solleva E_IDEMPOTENCY_IN_PROGRESS). Una key failed si riprende sempre. Una key in_progress da oltre la soglia (dbops.fn_idempotency_soglia_secondi, sopra il timeout di gunicorn) si riprende solo con p_ripresa_ammessa = true (D6), che il chiamante dichiara quando completed sta nella STESSA transazione dell''operazione: allora una in_progress orfana vuol dire «nessun commit». Con false (operazione a passi) resta IN_CORSO. p_ripresa_ammessa e'' obbligatorio: NULL e'' E_SCRIPT_CHIAMATA_NON_VALIDA. Una key prenotata da un altro utente o su un altro endpoint solleva E_IDEMPOTENCY_KEY_RIUSATA (D7): ogni key e'' legata alla richiesta che l''ha prenotata (endpoint NOT NULL). La prenotazione committa da sola: le altre richieste la vedono subito e non aspettano. SECURITY INVOKER. Brief: brief-be-verifica-documentazione-api D6, D7, §I.7.3, §I.5, §I.11.';

              COMMENT ON FUNCTION dbops.fn_idempotency_soglia_secondi() IS
                'La soglia in secondi oltre cui una Idempotency-Key rimasta in_progress conta come abbandonata e si puo'' riprendere (D6): il default nudo di SYSTEM_IDEMPOTENZA_IN_CORSO_SECONDI, senza override, validato da script.fn_intero_positivo_da_testo (E_CONFIG_MANCANTE se assente, vuoto o non intero positivo). La sede unica della lettura: la usano dbops.fn_idempotency_prenota e il presidio di BE-5 all''avvio del backend, che rifiuta di partire se la soglia non supera il timeout di gunicorn. SECURITY INVOKER. Brief: brief-be-verifica-documentazione-api §I.11.';

              COMMENT ON FUNCTION dbops.fn_imposta_accensione_processo(text,boolean,text) IS
                'Il verbo della scelta a mano: accende (true), spegne (false) o rimette al default per ambiente (NULL) la sveglia di un processo su questa installazione, col motivo, obbligatorio anche per il default. Tutti e tre i gesti scrivono la riga di dbops.processi_accensione (acceso NULL = segue il default): la riga e'' l''ultimo gesto, la storia sta in storico.processi_accensione. Chi e quando li scrive l''audit generato da ci_apply (script.trgfn_audit_data_user_generic, app.jwt_user), non il verbo. Restituisce lo stato effettivo dopo il gesto (dbops.fn_processo_acceso_dichiarato). I limiti li dice il guard della tabella (E_PROCESSO_SENZA_SVEGLIA, E_PROCESSO_NON_SPEGNIBILE, E_PROCESSO_ACCENSIONE_MOTIVO_OBBLIGATORIO); codice inesistente: E_PROCESSO_NON_TROVATO. INVOKER: il permesso e'' del backend, come per Esegui ora. Brief: brief-db-processi-accensione-per-ambiente (A-2, S-1, R-BE-1).';

              COMMENT ON FUNCTION dbops.fn_list_indices(text,text) IS
                NULL;

              COMMENT ON FUNCTION dbops.fn_pgtap_articolo_correggi_struttura(uuid,jsonb) IS
