              COMMENT ON FUNCTION dbops.fn_pgtap_crea_magazzino(character varying,boolean) IS
                'Fixture pgTAP: un magazzino dell''emittente dell''operatore in sessione (script.fn_pgtap_emittente_operatore: il guard di scope lo pretende), con un indirizzo fabbricato (dbops.fn_pgtap_crea_indirizzo_dettaglio) e usa_ubicazioni scelto dal test. Da chiamare dopo fn_pgtap_set_contesto_operatore. Rev 20261018-41: la riga la scrive il BB magazzino.fn_crea_magazzino (regola del 2, brief-db-processi-accensione-per-ambiente 2b-1 lotto 7).';

              COMMENT ON FUNCTION dbops.fn_pgtap_crea_operatore_umano(text,boolean) IS
                'Fixture pgTAP: un OPERATORE UMANO — persona fisica, risorsa umana, utente, identita'' OPERATORE ATTIVA — costruito chiamando la madre di produzione anagrafiche.fn_crea_operatore_v2, volendo SUPER ADMIN (secondo parametro). Aggiunge solo cio'' che una fixture non sceglie bene da se'': la finestra differita (il guard degli indirizzi del soggetto e'' DEFERRABLE e gli indirizzi arrivano all''ultimo passo), un codice fiscale libero adesso e lo username derivato, un indirizzo di dettaglio. ⭐ Rev 20260925-45: la madre crea la veste OPERATORE SPENTA (regola unica dell''invito, brief-db-blocco-login-per-credenziale §12), e il builder fa il passo che in esercizio fa l''attivazione dell''invito (il backend): accende la veste, con lo stesso UPDATE di identita_digitali.attivo. ⭐ Diverso da dbops.fn_pgtap_crea_emittente_operatore, che costruisce un utente TECNICO legato alla sua azienda: questo nasce SENZA azienda, come in produzione — un super admin senza azienda e'' il caso normale (multi-emittente), e toglierla dopo non si puo''. Per legarlo a un emittente: script.fn_change_user_emittenti_scope. ⚠️ Non apre il contesto; esce con i vincoli IMMEDIATE. ⛔ Cio'' che scrive si legge in un''istruzione SEPARATA: un JOIN o una funzione STABLE (script.fn_is_super_admin) nella stessa istruzione della chiamata vede la snapshot di prima. Brief: brief-db-fixture-che-costruiscono-giro-2.md Rev 20261009-30 (brief-db-sesso-senza-default): passa il sesso esplicito alla madre, che non ha piu'' il default ''M''. Rev 20261018-64: la veste OPERATORE la accende il BB anagrafiche.fn_accendi_veste (regola del 2, brief-db-processi-accensione-per-ambiente 2b-3); comportamento invariato.';

              COMMENT ON FUNCTION dbops.fn_pgtap_crea_pdp(character varying) IS
                'Fixture pgTAP: un PUNTO DI PRELIEVO nuovo (anagrafiche.pdp, dato di MACCHINA: da zero e'' vuota) per l''utility scelta per codice_interno (default GAS), su un indirizzo di dettaglio suo. ⭐ Codice e indirizzo derivano da UN numero libero sui codici PGTAPPDPnnnnnn: uq_pdp_codice e uq_pdp_addr_utility sono rispettate per costruzione. ⚠️ L''indirizzo va nuovo apposta: dbops.fn_pgtap_crea_indirizzo_dettaglio e'' idempotente sull''etichetta (troncata a 10 caratteri), e due PDP della stessa utility sullo stesso indirizzo il modello non li ammette. ⛔ Cliente e istanza sul PDP NON li scrive: sono il caso del test. Ritorna pdp_id, pdp_codice, utility_id, indirizzo_dettaglio_id. Brief: brief-db-fixture-che-costruiscono-giro-2.md';

              COMMENT ON FUNCTION dbops.fn_pgtap_crea_roster_processo(text,character varying) IS
                'Helper di fixture pgTAP: crea un''azienda e le aggancia l''utente tecnico di un processo automatico, cosi'' la coppia (processo, azienda) compare in dbops.vw_processi_roster. ⭐ Rev 2026-09-09: il corpo e'' passato a dbops.fn_pgtap_crea_emittente_operatore, di cui questa e'' il caso in cui il processo e'' il SOGGETTO del test e quindi non ha un default. ⚠️ Pretende django.auth_user, che costruisce manage.py migrate e non Liquibase.';

              COMMENT ON FUNCTION dbops.fn_pgtap_crea_soggetto_pg(text,integer,integer,text) IS
                'Fixture pgTAP: crea un soggetto PERSONA GIURIDICA gia'' valido, dalle madri del dominio: testata, contatto di default e dati societari da anagrafiche.fn_crea_soggetto_pg, indirizzi da anagrafiche.fn_crea_indirizzi_soggetto. I valori li decide la configurazione: forma giuridica la prima ammessa dalla natura, REA e capitale solo se la forma li prevede, niente dati societari se la natura li vieta; partita IVA libera (dbops.fn_pgtap_piva_libera) o quella del test, che e'' anche il codice fiscale; lo stato per id, passato alla madre col suo codice ISO2 (un codice ambiguo lo rifiuta la madre). Indirizzi: uno del primo tipo obbligatorio della matrice del tipo di soggetto (config.tipi_soggetto_dettaglio_tipi_indirizzo), nella forma dello stato (dbops.fn_pgtap_indirizzo_libero_forma), copiato dalla madre sugli altri obbligatori; una natura senza tipi obbligatori nasce senza indirizzi. ⭐ Apre e RICHIUDE la finestra dei tre guard DEFERRABLE INITIALLY DEFERRED di anagrafiche.soggetti, che il SET CONSTRAINTS ALL IMMEDIATE del preambolo farebbe scattare prima che la saga esista: al ritorno i vincoli sono IMMEDIATE, e un chiamante che dopo costruisce a mano un''altra saga deve aprirsi la sua finestra. Una natura PF la rifiuta la madre (E_SOGGETTO_CREAZIONE_NATURA_ERRATA): la persona fisica ha la sua porta. Ritorna l''id del soggetto.';

              COMMENT ON FUNCTION dbops.fn_pgtap_crea_soggetto_ruolo(uuid,character varying,integer) IS
                'Assegna a un soggetto un ruolo gia'' completo dei suoi indirizzi OBBLIGATORI, letti da config.tipi_ruolo_tipi_indirizzo. ⚠️ Gli indirizzi di RUOLO sono un layer separato da quelli di SOGGETTO: hanno una matrice propria e un guard proprio, e un indirizzo di soggetto non soddisfa il guard del ruolo — il suo fallback porta a un altro TIPO, non all''altro LAYER. Come la sorella, apre e RICHIUDE la finestra dei vincoli differiti. Idempotente sugli indirizzi: il ruolo puo'' gia'' esistere (fn_get_or_create_soggetto_ruolo) e non si duplica cio'' che ha gia''. Ritorna il soggetto_ruolo_id. Brief: brief-db-bonifica-baseline-pgtap-vendite.md Rev 2026-10-17: gli indirizzi li scrive il verbo anagrafiche.fn_crea_indirizzi_ruolo (auto-clone dei tipi obbligatori, skip dei presenti; regola del 2, brief-db-processi-accensione-per-ambiente 2b-1 lotto 2). Firma e ritorno invariati. Rev 2026-10-18: l''indirizzo libero nella forma che il guard pretende per lo stato (dbops.fn_pgtap_indirizzo_libero_forma: comune e CAP del catalogo, oppure localita''); prima Roma/00100/RM nella forma estera anche per l''Italia. ⚠️ Esce con i vincoli IMMEDIATE, come ogni helper.';

              COMMENT ON FUNCTION dbops.fn_pgtap_fattura_attivita(text,bigint[],bigint) IS
                'Fixture pgTAP: le ATTIVITA'' di commessa del test (secondo parametro, id di vendite.commesse_attivita, tutte dello stesso conto) emesse e agganciate a una FATTURA vera in bozza, una riga per attivita''. ⭐ Esiste per la TRAPPOLA D''ORDINE che i file ricopiavano: emissione prima della lettura, attivita'' fatturabile letta per attivita'' (non per segmento, che con le rettifiche prende la riga sbagliata), testata coerente con l''emittente, righe in istruzioni a parte e in bozza, aggancio dopo la riga (il guard sul fatturato ammette solo vuoto -> valorizzato). L''emissione dalla madre vendite.fn_emit_attivita_fatturabili_da_commessa, una volta per commessa (emette tutte le attivita'' approvate e non emesse di quelle commesse), col marchio del lotto se c''e''. La testata: senza lotto dbops.fn_pgtap_crea_fattura in bozza sul conto delle attivita''; con p_lotto_id la madre vendite.fn_get_or_create_fattura_header. Le righe: quantita'', prezzo, articolo, unita'' e competenza dall''attivita'' fatturabile, prima IVA attiva, imponibile = quantita'' per prezzo. L''aggancio fattura_riga_id; col lotto anche lock_in_fatturazione e lock_batch_id del lotto. Del dominio nessuna funzione scrive le righe di fattura (le scrive il backend): il builder fa gli INSERT. ⛔ La fattura resta in bozza: portarla avanti, emetterla o toglierla (vendite.fn_cleanup_fatture_by_ids) e'' il caso del test. Restituisce, nell''ordine delle attivita'', attivita'', attivita'' fatturabile, fattura e riga. Attivita'' assenti, ripetute, di conti diversi, senza un''attivita'' fatturabile libera, o un lotto inesistente sollevano. ⚠️ Esce con i vincoli IMMEDIATE, come ogni helper.';

              COMMENT ON FUNCTION dbops.fn_pgtap_indirizzo_libero_forma(integer) IS
                'Helper di fixture pgTAP (2026-10-18): una riga con comune_id, codice_postale_id, locality, postal_code nella forma che anagrafiche.trgfn_indirizzi_guard_forma_libera pretende per lo stato. Stato col catalogo completo (config.stati.catalogo_comuni_completo): il primo comune dello stato con un CAP, e quel CAP (ordine per id, deterministico). Altrimenti locality ''Localita pgTAP'' e postal_code ''00000''. La regola si legge dal flag, come il guard: le fixture non se la inventano. Lo usano dbops.fn_pgtap_crea_soggetto_ruolo, fn_pgtap_crea_soggetto_pg e le fixture dei pgTAP. D-2 di Tid, richiesta BE in brief-db-processi-accensione-per-ambiente §6.11.';

              COMMENT ON FUNCTION dbops.fn_pgtap_piva_libera() IS
                'Fixture pgTAP: una partita IVA valida (cifra di controllo verificata da script.fn_valida_partita_iva) e non ancora presente in anagrafiche.soggetti, ne'' come partita IVA ne'' come codice fiscale o identificativo fiscale univoco. Delega a dbops.fn_pgtap_piva_libera(0). Due chiamate danno valori diversi solo se fra l''una e l''altra la prima e'' stata inserita: dentro una sola istruzione tornano lo stesso valore, e per due valori distinti si usa la sorella con p_skip (0, 1, …).';

              COMMENT ON FUNCTION dbops.fn_pgtap_piva_libera(integer) IS
                'Come dbops.fn_pgtap_piva_libera(), ma salta le prime p_skip libere. ⚠️ Serve perche'' la sorella senza argomenti torna lo STESSO valore se la si chiama due volte nella stessa ISTRUZIONE: e'' l''insert della riga a rendere occupato un identificativo, e dentro una sola SELECT non c''e'' nessun insert in mezzo. Una fixture che vuole due partite IVA distinte usa fn(0) e fn(1). Firma separata e senza DEFAULT di proposito: un default renderebbe ambigue le chiamate a zero argomenti gia'' scritte.';

              COMMENT ON FUNCTION dbops.fn_pgtap_porta_a_stato(regclass,bigint,text) IS
                'Fixture pgTAP: porta una testata di vendita dallo stato corrente allo stato p_stato (codice_interno) per il percorso piu'' corto della sua matrice dei passaggi, sotto i guard veri: le condizioni d''uscita dalla bozza (righe, indirizzi, prezzi…) le scrive prima il test. La mappa delle testate (colonna di stato, vocabolario, matrice, filtro) la legge da script.fn_doc_stato_modello; lo stato voluto da script.fn_doc_stato_id. Testate senza la porta: un UPDATE per passo, tutti i passaggi della matrice. Testate con la porta (script.trgfn_doc_stato_solo_dal_verbo montato, letto dal catalogo): ogni passo e'' il verbo del documento, sui soli passaggi manuali, con l''azione del passaggio (script.fn_doc_passaggio) concessa all''utente del contesto da dbops.fn_pgtap_concedi_azione: la fixture porta lo stato, non prova il permesso. I verbi: bolla vendite.fn_cambia_stato_ddt; preventivo vendite.fn_cambia_stato_preventivo; ordine vendite.fn_cambia_stato_ordine; contratto vendite.fn_cambia_stato_contratto (CESSATO vuole valido_al arrivata, che scrive il test); offerta vendite.fn_cambia_stato_offerta, con una motivazione della fixture dove il passaggio la chiede; commessa vendite.fn_cambia_stato_commessa; reso vendite.fn_conferma_reso e vendite.fn_annulla_reso. Fattura, lotto e versione di listino percorrono anche i passaggi di processo, ognuno col suo verbo: la fattura vendite.fn_fattura_proietta_stato; il lotto vendite.fn_cambia_stato_lotto sui manuali e vendite.fn_lotto_proietta_stato_step sugli altri (un lotto con fatture si muove invece col giro, vendite.fn_sync_lotto_fatture_stato); la versione di listino ATTIVA da vendite.fn_attiva_versione_listino e CHIUSA da vendite.fn_chiudi_versioni_listino_scadute, che chiude ogni versione scaduta e vuole valido_al passata, scritta prima dal test. Gli stati di processo che nascono da un altro documento (EVASO e PARZIALMENTE_EVASO dell''ordine, SUPERATA dell''offerta) non si raggiungono da qui: si costruiscono evadendo o creando una revisione. Restituisce il codice_interno dello stato raggiunto, che e'' sempre p_stato: se il passaggio non e'' avvenuto solleva. Un documento nasce solo nello stato iniziale (script.trgfn_doc_stato_iniziale): una fixture che vuole un documento avanti lo crea e lo porta avanti da qui. Errori del chiamante (testata non gestita, id, stato o percorso inesistenti, porta senza verbo noto, stato non raggiunto): RAISE EXCEPTION. ⚠️ Esce con i vincoli IMMEDIATE, come ogni helper.';

              COMMENT ON FUNCTION dbops.fn_regexp_occorrenze(text,text) IS
                'Le occorrenze di una regex in un testo, una riga per ognuna coi gruppi catturati nell''array: lo stesso risultato di regexp_matches(testo, pattern, ''g''). Esiste per DICHIARARE la cardinalita'' vera (ROWS 1): regexp_matches ne dichiara 10, e in dbops.vw_funzioni_check_codici quel 10, moltiplicato da due ricorsioni, portava la stima sopra jit_above_cost appena le statistiche di pg_proc contavano piu'' corpi (rosso di test-vw-funzioni-check-codici-sotto-jit-v1 su zeroerp_ci, 2026-10-12). plpgsql perche'' una LANGUAGE sql verrebbe inlineata e il ROWS ignorato. Precedente: 20261008-21 (ROWS 1 dichiarato). Non STRICT: con un argomento NULL non da'' righe, come regexp_matches. Da usare dove la stima moltiplica un piano, non al posto di ogni regexp_matches.';

              COMMENT ON FUNCTION dbops.fn_run_automations_codice_maiuscolo(text,text[],boolean) IS
                'Automazione CODICE_MAIUSCOLO (decisione Tid 2026-11-04): porta i trigger script.trgfn_codice_maiuscolo (BEFORE INSERT OR UPDATE FOR EACH ROW) allo stato di dbops.fn_codice_maiuscolo_perimetro: CREA dove e'' dovuto e manca, RIGENERA dove ce n''e'' piu'' di uno, TOGLIE dove non e'' dovuto (un''eccezione di dbops.automazione_codice_eccezioni, una colonna tolta, una tabella fuori ambito). Regola per esclusione: ogni colonna codice dell''ambito, tranne le eccezioni. Il nome viene dal template della regola CODICE_MAIUSCOLO di dbops.automation_rules_tbl, che e'' anche l''interruttore: senza regola accesa la tabella non si tocca (audit WARN NO_RULE) e la convergenza del migrate si ferma. Il trigger vivo si riconosce dalla funzione, mai dal nome. Dry run con audit DRYRUN; nel giro vero audit OK per azione. Errore strutturato E_CODICE_MAIUSCOLO; un guasto dell''ambiente (script.fn_sqlstate_di_ambiente) si rilancia col suo SQLSTATE. Chiamata a ogni migrate (90_end, runAlways) e dal job notturno automations_lock_columns.';

              COMMENT ON FUNCTION dbops.fn_run_automations_storico_provision(text,text[],boolean) IS
                '
                Provisioning automatico delle tabelle storico (storico.<tabella>) tramite regole in dbops.automation_rules_tbl.

                Scopo:
                - Scansiona le tabelle degli schemi in scope (risolti da fn_resolve_scope), escludendo lo schema storico.
                - Per ogni tabella, applica le regole abilitate con rule_type = ''''STORICO_PROVISION'''' compatibili con exec_mode e target schema/table.
                - Se la tabella espone una colonna di flag storicizza (default ''''storicizza'''', override tramite automation_overrides_cols: key ''''STORICIZZA_COL''''),
                  invoca fn_ensure_storico_table per creare/aggiornare la corrispondente tabella in storico.*.
                - La colonna FK nello storico è calcolata come <table_name>_id (override tramite automation_overrides_cols: key ''''STORICO_FK'''').
                - Parametro create_gin_index (in params JSON della regola) abilita la creazione dell''''indice GIN sullo snapshot nello storico.

                Parametri:
                - p_exec_mode: modalità di esecuzione (es. ''''AUTO'''', ''''MANUAL''''); una regola è applicata se exec_mode = ''''AUTO'''' oppure exec_mode = p_exec_mode.
                - p_schemas: lista schemi target; può includere scope/wildcard risolti da fn_resolve_scope.
                - p_dry_run: se TRUE, esegue in modalità simulata (nessun DDL effettivo), demandando la gestione al helper fn_ensure_storico_table.

                Note:
                - Le tabelle prive della colonna storicizza (o override) vengono ignorate.
                - La funzione è pensata per essere richiamata da automazioni/maintenance e si appoggia agli helper dbops per scope, override e provisioning.
                ';

              COMMENT ON FUNCTION dbops.fn_schema_in_scope(text,text[]) IS
                NULL;

              COMMENT ON FUNCTION dbops.fn_schema_match(text,text) IS
                NULL;

              COMMENT ON FUNCTION dbops.fn_sessione_del_migratore() IS
                'La sessione e'' di chi amministra il database? true se il ruolo di LOGIN (session_user) e'' membro del proprietario dello schema dbops — il migratore, in ogni ambiente — o un superuser. session_user e non current_user perche'' dentro una SECURITY DEFINER current_user e'' il proprietario; limite dichiarato: un SET ROLE non cambia session_user. Fail-closed (NULL = false), non solleva: rifiuta il chiamante. La chiamano dbops.fn_sync_functions_owner (RAISE nudo, canale di log protetto) e script.fn_totp_disabilita_device (lo sblocco del secondo fattore dal server). Estratta il 2026-09-29 (regola del 2). INVOKER, STABLE. Brief: brief-db-secondo-fattore-totp §3.';

              COMMENT ON FUNCTION dbops.fn_storico_arma_scope_tutte(boolean) IS
                'Applica dbops.fn_storico_arma_scope a ogni madre che porta il trigger di storico (il marcatore è il trigger, non un elenco) e registra un riepilogo nell''audit: madri viste, shadow allineate, armate, saltate perché di un altro proprietario, senza shadow. Rete che converge: la chiamano il 90_end runAlways a ogni migrate e il provisioning da superuser. Brief: brief-db-rls-storico-scope-congelato §4b.';

              COMMENT ON FUNCTION dbops.fn_storico_backfill_scope(text,text) IS
                'Backfill dello scope congelato sulle versioni gia'' scritte della shadow storico.<tabella> di una madre: alle righe con origine_schema NULL assegna lo schema della madre e scope_emittente_fiscale_id risolto da dbops.fn_storico_risolvi_scope sullo SNAPSHOT (per i modi PADRE risale al padre com''e'' oggi: e'' il limite dichiarato del backfill). Nelle shadow condivise fra due madri omonime attribuisce la versione alla madre di cui lo snapshot porta almeno una chiave ESCLUSIVA (jsonb_exists_any); le versioni senza chiavi esclusive restano NULL e il pgTAP le conta come debito. Porta origine_schema a NOT NULL quando nessuna riga resta NULL e il chiamante ha i privilegi del proprietario della shadow (pg_has_role USAGE: il proprietario, un suo membro con INHERIT, un superuser). Idempotente.';

              COMMENT ON FUNCTION dbops.fn_storico_backfill_scope_tutte() IS
                'Applica dbops.fn_storico_backfill_scope a ogni madre col trigger di storico e registra un riepilogo nell''audit (madri, versioni aggiornate, residue a NULL, saltate). Idempotente: la chiamano il 90_end one-shot e il provisioning da superuser. Brief: brief-db-rls-storico-scope-congelato §4b.';

              COMMENT ON FUNCTION dbops.fn_storico_risolvi_scope(text,text,jsonb,integer) IS
                'Risolve l''emittenti_fiscali.id a cui appartiene la riga (to_jsonb) di una madre storicizzata, seguendo la strada dichiarata in dbops.storico_scope_policy: EF (copia), SR (converte 1:1), BA (l''unico emittente del billing account), PADRE (carica la riga del padre per id — o, se il padre non è più vivo, la sua ULTIMA VERSIONE nello storico: normale in un DELETE a cascata, dove il padre sparisce prima che il figlio scriva — e si richiama, ricorsivamente), NESSUNO (NULL). La chiama il trigger di storico per congelare lo scope nella shadow. ⚠️ SECURITY DEFINER del PROPRIETARIO, non di un superuser: catturare lo scope è un atto di sistema e deve vedere il padre anche quando chi scrive non lo vedrebbe sotto RLS; attraversa la RLS perché chi migra possiede le tabelle (ENABLE senza FORCE), e il pgTAP lo asserisce. Non solleva mai — madre non mappata, colonna vuota, padre sparito danno NULL, fail-closed sulla shadow — tranne su una catena che non termina (E_STORICO_SCOPE_CATENA_CICLICA). Brief: brief-db-rls-storico-scope-congelato §4b. rev 2026-10-09 (brief-db-istanza-nasce-col-ba, decisione di Tid): modo COPPIA — la colonna dichiara due nomi, «<istanza>,<utility>», la chiave di anagrafiche.billing_account (istanza_utility_id, utility_id); il resolver trova il BA della coppia con script.fn_get_ba_id_da_coppia (la stessa domanda della policy di istanze_dati_precontrattuali) e ne prende l''emittente come nel modo BA. Coppia senza BA o colonna vuota: NULL. Primo adottante: anagrafiche.istanze_dati_precontrattuali (RLS accesa in 28d9beeb6). Rev 2026-10-21 (20261021-28): il BA della coppia da script.fn_get_ba_id_da_coppia.';

              COMMENT ON FUNCTION dbops.fn_table_in_scope(text,text) IS
                NULL;

              COMMENT ON FUNCTION dbops.fn_trigger_argomenti(bytea) IS
                E'Gli argomenti di un trigger (pg_trigger.tgargs) come text[], nell''ordine del CREATE TRIGGER; vuoto se non ne ha. Taglia sui byte NUL e riconverte con la codifica del server: la forma encode(tgargs,''escape'') + rtrim(…,''\\000'') tronca un argomento finale che termina con zero (rtrim toglie l''insieme {\\,0}) e storpia i caratteri non ASCII. Building block per chi riconosce un trigger generico dai suoi argomenti. Brief: brief-db-lock-di-colonna-fuori-registro §7.';

              COMMENT ON FUNCTION dbops.trgfn_cleanup_at_alla_nascita() IS
                'BEFORE INSERT generico: scrive NEW.cleanup_at = colonna base + ttl_days con la regola di dbops.fn_cleanup_at_regola, la stessa che dbops.fn_run_automations_cleanup applica al pregresso. Nessuna regola, o una regola che non si applica (tabella esclusa, colonna base assente) → cleanup_at NULL, la riga non scade; colonna base NULL sulla riga → NULL, la scadenza la scrive il job quando la base c''e''. Una tabella senza cleanup_at passa intatta. ⭐ Alla nascita e non con l''UPDATE del job perche'' su un registro quell''UPDATE riscriverebbe data_update/user_update e passerebbe dai trigger di UPDATE; il job resta per il pregresso. ⚠️ Sovrascrive cio'' che passa il chiamante: un diario non lascia scegliere quando scade. Fase _m50_: dopo gli _a10_ che riscrivono l''orario. Si monta a mano (trg_<tabella>_m50_cleanup_at_ins) sui registri che non ammettono l''UPDATE del job.';

              COMMENT ON FUNCTION dbops.trgfn_coda_archiviazione() IS
                'Governa la bandiera `archiviato` delle due code (dbops.coda_lavori, vendite.fatture_stampa_coda): rifiuta l''archiviazione di una riga VIVA, riabbassa la bandiera quando una riga archiviata torna viva, e deriva `archiviato_il`/`archiviato_da`. ⭐ UNA funzione per DUE tabelle: le colonne sono identiche per costruzione e due copie divergerebbero al primo che tocca una sola delle due code. ⭐ «Viva» e'' PENDING|IN_CORSO — la stessa definizione che conta il badge in topbar — e il predicato e'' scritto in NEGATIVO e non come elenco dei terminali, che fra le due code sono elenchi diversi. ⭐ Il RESET (una riga che torna al lavoro torna nell''elenco) non e'' cortesia: senza, una riga archiviata e poi rimessa in coda dal requeue sarebbe viva e invisibile, cioe'' il difetto che il guard impedisce, rientrato dalla porta di servizio. ⛔ Il nome non porta `guard` perche'' la funzione scrive NEW. Errore: E_CODA_ARCHIVIAZIONE_NON_AMMESSA (CONFLITTO_STATO): non c''e'' nessun campo da correggere, c''e'' una riga ancora viva. Piano: brief-db-archiviazione-righe-code.';

              COMMENT ON FUNCTION dbops.trgfn_installazione_guard_immutabile() IS
                'Guard su dbops.installazione: rifiuta UPDATE e DELETE (trigger di riga) e TRUNCATE (trigger di istruzione) con E_AMBIENTE_IMMUTABILE. L''ambiente si scrive una volta, alla nascita, dalla fase post del provisioning, e non cambia in nessuna delle due direzioni: un database di sviluppo non si certifica pulito, una copia della produzione resta produzione (decisione di Tid del 2026-10-16). Anche un UPDATE allo stesso valore e'' rifiutato. Il proprietario puo'' disattivare il trigger: la difesa contro un DBA malevolo sono i ruoli, non un guard. Brief: brief-db-processi-accensione-per-ambiente.';

              COMMENT ON FUNCTION dbops.trgfn_tx_id_managed() IS
                'Trigger function di audit: valorizza NEW.tx_id. Se NEW.tx_id e'' gia'' valorizzato normalizza la stringa vuota e ritorna subito, senza leggere config.parameters ne'' script.*: il resto del corpo serve solo a calcolare il valore quando manca. Quando NEW.tx_id IS NULL: bypass a due livelli, il parametro config.parameters.tx_id_bypass_enabled e poi la GUC myapp.bypass_tx_id_check, che si legge sempre quando il parametro non accende il bypass; parametro assente o NULL vale spento e lascia W_TXID_BYPASS_PARAMETRO_ASSENTE nel log, senza fermare la scrittura. Col bypass: il tx_id di sessione (GUC dbops.tx_id) o script.uuid_nil(). Senza bypass: se la GUC dbops.tx_id e'' impostata, l''id deve esistere in dbops.transaction_ids, altrimenti avverte (W_TXID_NOT_REGISTERED) e assegna script.uuid_nil(); una GUC che non e'' un uuid vale assente; se la GUC e'' assente chiama dbops.fn_get_or_create_session_tx_id(). Il valore assegnato e'' sempre quello di questi rami: la GUC non si rilegge alla fine. Una lettura del parametro che fallisce solleva E_SQL_READ_TABLE. Convenzione: E_ = errore bloccante, W_ = avviso scritto solo nel log.';
