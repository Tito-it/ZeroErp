              COMMENT ON FUNCTION dbops.fn_pgtap_crea_cliente(text,integer,bigint,character varying) IS
                'Fixture pgTAP: un cliente COMPLETO, cioe'' dbops.fn_pgtap_crea_cliente_ba (soggetto, ruolo CL, istanza, billing account; stessi primi tre parametri) piu'' la riga di anagrafiche.clienti sul BA appena nato. Rev 20261018-38: la riga la scrive la madre anagrafiche.fn_crea_cliente (regola del 2, brief-db-processi-accensione-per-ambiente 2b-1 lotto 5), che la rilegge a istruzione finita. Stato dal quarto parametro (codice_interno, default AT) e le date che quello stato pretende (trgfn_clienti_guard_stato_date), decise qui: attivazione = data operativa per attivi, sospesi e chiusi; sospensione per SF/SC; chiusura per i chiusi. Utility di default: la prima che non richiede il PDP. Rende cliente_id e le colonne di fn_pgtap_crea_cliente_ba. Usabile come zeroerp_app con un operatore dell''emittente del BA in sessione; altrimenti la rilettura risponde E_SCRIPT_CHIAMATA_NON_VALIDA.';

              COMMENT ON FUNCTION dbops.fn_pgtap_crea_commessa(text,character varying,bigint,boolean,boolean) IS
                'Fixture pgTAP: una COMMESSA del mondo in una chiamata: azienda, operatore e cliente (dbops.fn_pgtap_crea_mondo_cliente) e la commessa aperta dalla madre vendite.fn_get_or_create_commessa (p_force_new), con competenza nel mese corrente. Codice, emittente e stato iniziale li decide la madre, come in produzione; lo stato iniziale si legge dalla testata (vendite.commesse) con script.fn_doc_stato_iniziale_id. Secondo parametro: lo stato da raggiungere (NULL o l''iniziale: resta li''), per la matrice con dbops.fn_pgtap_porta_a_stato, sotto i guard veri. ⚠️ Terzo parametro: il billing account di un cliente gia'' costruito, verificato da dbops.fn_pgtap_cliente_ba_del_mondo (un BA di un''altra azienda solleva); con lui non si costruisce un cliente in piu'' (dbops.fn_pgtap_cliente_del_builder). Quarto parametro: scrive UN''attivita'' APPROVATA e NON_EMESSA (dbops.fn_pgtap_crea_commessa_attivita) prima del passaggio; NULL = solo se lo stato chiesto non e'' l''iniziale, perche'' l''uscita dalla bozza la pretende. Quinto parametro: scrive la sorgente ROOT (sorgente COMMESSA, l''id della commessa in sorgente_id), quella che il pull della fatturazione pretende. ⛔ Le altre attivita'' e le altre sorgenti sono il caso del test. Ritorna le chiavi, l''attivita'' scritta (o NULL) e lo stato raggiunto. ⚠️ Senza contesto aperto lo apre sull''operatore che costruisce; esce con i vincoli IMMEDIATE.';

              COMMENT ON FUNCTION dbops.fn_pgtap_crea_contratto(text,character varying,bigint,bigint,date,date,date,bigint) IS
                'Fixture pgTAP (e smoke): un CONTRATTO del mondo in una chiamata — azienda, operatore e cliente (dbops.fn_pgtap_crea_mondo_cliente) e la testata nello stato scelto — e ritorna tutte le chiavi. ⭐ Nasce dalla MADRE di produzione vendite.fn_create_contratto (numero, testata DRAFT, indirizzo di default), con l''emittente di chi agisce dichiarato. ⚠️ Terzo parametro: il billing account di un cliente gia'' costruito (per esempio quello di una commessa, perche'' un contratto citato da una riga deve essere del BA della sua commessa); viene verificato, e un BA di un''altra azienda solleva. ⭐ Quarto parametro: l''offerta da cui il contratto nasce, dalla push vendite.fn_push_offerta_a_contratto (stato ACCETTATA e idempotenza li giudica lei; listino, indirizzi, righe e utility dall''offerta), sul cliente dell''offerta: un billing account diverso solleva. Quinto-ottavo parametro (rev 20261024-33): periodo (valido_dal, valido_al), data e listino del test, passati alla madre; NULL = quelli della madre, e con ATTIVO senza listino il builder ne costruisce uno del mondo; insieme al figlio di un''offerta sollevano (li decide la push). Stati (D-2 di Tid, 2026-10-21): DRAFT; ATTIVO per la strada del guard di transizione (senza righe nessun motivo scatta; un secondo ATTIVO sovrapposto sullo stesso BA lo rifiuta il modello); ANNULLATO dal verbo vendite.fn_annulla_contratto, con i legami dichiarati da vendite.fn_documento_legami (il figlio ha la sua offerta). ⛔ CESSATO e ogni altro codice sollevano prima di scrivere: CESSATO vuole valido_al e passa da ATTIVO, e'' il caso del test. ⛔ NON scrive righe, eccezioni ne'' scheda di fornitura. ⚠️ Esce con i vincoli IMMEDIATE, come ogni helper. Richiesta BE R-1 del 2026-10-21 (smoke-group-attivita-contratto). Rev 2026-10-22: il billing account del terzo parametro lo verifica il building block dbops.fn_pgtap_cliente_ba_del_mondo (regola del 2, estratto alla terza copia). Rev 2026-10-24 (20261024-28, brief-modello-documento-vendita Q-2): il figlio di un''offerta, DROP + CREATE; 20261024-33 (R-2): periodo, data e listino. Rev 2026-10-24 (20261024-40, §4-octies): col billing account del test non costruisce piu'' un cliente in piu'' (dbops.fn_pgtap_cliente_del_builder). rev 2026-10-26 (20261026-13, brief-modello-documento-vendita §11): ATTIVO dal verbo del contratto, attraverso dbops.fn_pgtap_porta_a_stato (la porta rifiuta l''UPDATE dello stato; la fixture concede emetti_contratto all''operatore).';

              COMMENT ON FUNCTION dbops.fn_pgtap_crea_emittente_operatore(character varying,text) IS
                'Helper di fixture pgTAP: un''azienda su cui lavorare PIU'' l''operatore che la ha nel perimetro. Senza operatore il contesto di sessione resta vuoto e il dominio solleva «Nessun emittente fiscale attivo» — misurato il 2026-09-09 su 102 dei 185 file di vendite che sul database scratch morivano nel fixture. ⚠️ L''operatore e'' un utente TECNICO, perche'' script.fn_crea_utente_tecnico e'' l''unico percorso di produzione che lega un utente a un emittente; per cio'' che i test attraversano e'' un operatore a tutti gli effetti (identita'' OPERATORE attiva, non super admin, un emittente nel perimetro). ⛔ Non usarlo dove il soggetto del test e'' l''operatore UMANO — flag tecnica, profili di accesso: li'' il caso va costruito. Il chiamante deve poi puntarci il contesto: PERFORM script.fn_pgtap_set_contesto_operatore(auth_user_id). ⚠️ Esce con i vincoli IMMEDIATE, come ogni helper.';

