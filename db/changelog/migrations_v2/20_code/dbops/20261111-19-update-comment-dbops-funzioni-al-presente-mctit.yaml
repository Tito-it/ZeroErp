              COMMENT ON FUNCTION dbops.fn_pgtap_azienda_di_chi_agisce(text) IS
                'Fixture pgTAP (building block): l''azienda del contesto aperto — emittente (id, codice, soggetto_ruolo) e operatore (auth_user_id, identita) — risolta con la regola di produzione script.fn_resolve_emittente_for_user, la stessa del trigger z90 che lega il billing account. Estratta dal «ramo B» di dbops.fn_pgtap_crea_mondo_cliente; la usano il mondo e dbops.fn_pgtap_cliente_del_builder. Solleva, nominando il chiamante (p_chiamante), senza contesto, senza azienda o senza identita'' OPERATORE attiva. STABLE: non scrive. Brief: brief-modello-documento-vendita (§4-octies), 2026-10-24.';

              COMMENT ON FUNCTION dbops.fn_pgtap_cf_libero() IS
                'Restituisce un codice fiscale VALIDO secondo script.fn_valida_codice_fiscale e non ancora presente in anagrafiche.soggetti, per le fixture pgTAP. Sorella di dbops.fn_pgtap_piva_libera: stesso problema (uq_soggetto_idstato_id_fiscale_univoco contro identificativi inchiodati nel codice e residui non cancellabili), stessa soluzione. ⭐ Il carattere di controllo non lo calcola, lo CERCA provando l''alfabeto e chiedendo al validatore di dominio: reimplementare l''algoritmo qui vorrebbe dire tenerne due copie e vederle divergere. ⚠️ Non e'' un generatore di codici fiscali reali — il corpo e'' fittizio e serve solo a superare validatore e unicita'' in un test. Vede anche le righe non ancora committate. Brief: brief-db-bonifica-baseline-pgtap-vendite.md';

              COMMENT ON FUNCTION dbops.fn_pgtap_cliente_del_builder(text,bigint,text) IS
                'Fixture pgTAP (building block dei builder di commessa, contratto, fattura, ordine e lotto): il cliente su cui il builder scrive. Senza billing account: il mondo (dbops.fn_pgtap_crea_mondo_cliente: azienda, operatore, contesto e un cliente nuovo). Col billing account di un''altra fixture: l''azienda di chi agisce (dbops.fn_pgtap_azienda_di_chi_agisce, serve un contesto aperto) e quel BA verificato (dbops.fn_pgtap_cliente_ba_del_mondo: uno di un''altra azienda solleva, nominando p_chiamante), SENZA costruire un cliente in piu''. Sostituisce il blocco che i cinque builder ricopiavano. Brief: brief-modello-documento-vendita (§4-octies), 2026-10-24.';

              COMMENT ON FUNCTION dbops.fn_pgtap_concedi_azione(integer,character varying) IS
                'Fixture pgTAP: concede un''azione di processo a un utente con un override (config.user_override_azioni, abilitata, valido da oggi senza scadenza), idempotente sulla UNIQUE (utente, azione), e la fa VALERE: dal tetto d''area (brief-db-permessi-tetto-area) se l''area dell''azione non arriva al suo livello_minimo_area (script.fn_area_consente_azione) scrive un override d''area AL MINIMO, valido da oggi. Un override d''area valido gia'' scritto dal test che chiude l''area -> RAISE (la fixture non scavalca la scelta del test). Serve ai pgTAP dei verbi che applicano un''azione con script.fn_guard_azione: l''operatore di fn_pgtap_crea_emittente_operatore non ha ne'' azioni ne'' aree. Azione inesistente -> RAISE. Solo per i pgTAP (brief-db-magazzino-verbi-con-permesso §3.2; rev 20261004-59).';

