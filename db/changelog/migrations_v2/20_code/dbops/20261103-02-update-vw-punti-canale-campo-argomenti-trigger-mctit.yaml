                         CASE WHEN cc.canale = 'IN_CHIAMATA' THEN 'IN_VARIABILE' ELSE cc.canale END AS canale,
                         cc.chiave, cc.nome_in_chiave
                    FROM letterali l
                    JOIN chiamate_canale cc ON cc.oid = l.oid AND cc.via = 'DIRETTO'
                                            AND cc.testo !~ '''E_[A-Z0-9_]+'''
                   WHERE NOT EXISTS (SELECT 1 FROM diretti d WHERE d.oid = l.oid AND d.codice = l.codice)
              ), primo_motivo AS (
                  -- (C) PRIMO_MOTIVO: l'UNIONE dei codici di tutte le check del
                  -- corpo; il canale e' quello della chiamata O del motivo
                  SELECT cc.oid, cc.funzione, k.codice, cc.n,
                         CASE WHEN cc.canale = 'IN_CHIAMATA'   THEN 'IN_CHIAMATA'
                              WHEN k.motivo_chiave IS NOT NULL THEN 'IN_CHIAMATA'
                              ELSE cc.canale END AS canale,
                         coalesce(cc.chiave, k.motivo_chiave) AS chiave,
                         cc.nome_in_chiave,
                         k.check_funzione
                    FROM chiamate_canale cc
                    LEFT JOIN dbops.vw_funzioni_check_codici k ON k.funzione = cc.funzione
                   WHERE cc.via = 'PRIMO_MOTIVO'
              ), motivo AS (
                  -- (M) MOTIVO: la fn_check_* che EMETTE il codice
                  SELECT DISTINCT k.check_schema || '.' || k.check_funzione AS funzione, k.codice,
                         CASE WHEN k.motivo_chiave IS NOT NULL THEN 'IN_CHIAMATA' ELSE 'NESSUNO' END AS canale,
                         k.motivo_chiave AS chiave
                    FROM dbops.vw_funzioni_check_codici k
                   WHERE k.codice IS NOT NULL
              ), tutti AS (
                  SELECT oid, funzione, codice, 'DIRETTO'::text AS via, n, canale, chiave, nome_in_chiave,
                         NULL::text AS check_funzione
                    FROM diretti
                  UNION ALL
                  SELECT oid, funzione, codice, 'DIRETTO', n, canale, chiave, nome_in_chiave, NULL
                    FROM diretti_variabile
                  UNION ALL
                  SELECT oid, funzione, codice, 'PRIMO_MOTIVO', n, canale, chiave, nome_in_chiave, check_funzione
                    FROM primo_motivo
              ), aggregati AS (
                  -- una riga per (funzione, codice, via): il canale MIGLIORE
                  -- fra le chiamate attribuite («almeno un punto»), e i due
                  -- conteggi per leggere il resto
                  SELECT t.funzione, t.codice, t.via,
                         (array_agg(t.canale         ORDER BY r.rango DESC, t.n))[1] AS canale,
                         (array_agg(t.chiave         ORDER BY r.rango DESC, t.n))[1] AS chiave,
                         (array_agg(t.nome_in_chiave ORDER BY r.rango DESC, t.n))[1] AS nome_in_chiave,
                         count(DISTINCT t.n)::int AS n_chiamate,
                         count(DISTINCT t.n) FILTER (WHERE t.canale IN ('IN_CHIAMATA', 'IN_VARIABILE'))::int AS n_con_canale,
                         string_agg(DISTINCT t.check_funzione, ', ' ORDER BY t.check_funzione) AS check_funzioni
                    FROM tutti t
                    JOIN rango r ON r.canale = t.canale
                   GROUP BY t.funzione, t.codice, t.via
              )
              SELECT funzione, codice, via, canale, chiave, nome_in_chiave,
                     n_chiamate, n_con_canale, check_funzioni
                FROM aggregati
              UNION ALL
              SELECT funzione, codice, 'MOTIVO', canale, chiave, NULL, NULL, NULL, NULL
                FROM motivo
              UNION ALL
              -- (D) NOMINATO: il letterale sta nel corpo ma la funzione non lo
              -- solleva con l'helper ne' lo emette come motivo
              SELECT l.funzione, l.codice, 'NOMINATO', NULL, NULL, NULL, NULL, NULL, NULL
                FROM letterali l
               WHERE NOT EXISTS (SELECT 1 FROM tutti t WHERE t.oid = l.oid AND t.codice = l.codice)
                 AND NOT EXISTS (SELECT 1 FROM motivo m WHERE m.funzione = l.funzione AND m.codice = l.codice);
