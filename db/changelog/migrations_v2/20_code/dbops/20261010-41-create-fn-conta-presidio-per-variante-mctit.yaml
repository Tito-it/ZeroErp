# brief-db-presidio-processi-testo-per-causa §6.2 — R-2: IL CONTEGGIO PER CAUSA.
#
# ── Il difetto che chiude ─────────────────────────────────────────
#   Dal 2026-10-09 un presidio puo' dichiarare `colonna_variante`: le sue righe
#   sono guasti DIVERSI, ognuno col suo testo e col suo «chi agisce»
#   (dbops.presidi_cause). Ma il conteggio era UNO per presidio
#   (dbops.fn_conta_presidio), e le righe il backend le ha solo a CAMPIONE
#   (5 nel digest, 20 nel pannello). Raggruppare il campione darebbe conteggi
#   per causa sbagliati appena le righe superano il campione, e una causa
#   SVILUPPO oltre la quinta riga non arriverebbe mai al gruppo dello sviluppo:
#   lo stesso difetto del testo unico, spostato sul conteggio.
#
# ── ⭐ La forma: QUESTA e' la sede del conteggio, fn_conta_presidio la somma ─
#   Il contratto del brief chiede lo stesso perimetro e lo stesso filtro di
#   fn_conta_presidio, e «meglio se condividono la costruzione del FROM …
#   WHERE: due copie del filtro divergono». Regola del 2: alla seconda
#   occorrenza la logica ha UNA sede. Il conteggio per variante contiene il
#   conteggio intero (e' la somma dei gruppi), il contrario no — quindi la
#   sede e' questa, e il changeSet -42 riduce fn_conta_presidio alla somma.
#   ⭐ Cosi' le due risposte non possono divergere per costruzione: non serve
#   un test che provi che OGGI coincidono, serve quello che prova che
#   fn_conta_presidio non contiene piu' il filtro (pgTAP del giro, test 9).
#
# ── Il contratto (brief §6.2) ─────────────────────────────────────
#   1. perimetro = catalogo: vista attiva e non obsoleta in dbops.presidi,
#      altrimenti E_PRESIDIO_NON_A_CATALOGO (lo stesso codice di sempre: il
#      sito che solleva si sposta qui, non se ne aggiunge uno);
#      filtro `colonna_stato IS DISTINCT FROM stato_atteso` quando c'e';
#   2. GROUP BY la colonna nominata da colonna_variante (%I); una riga per
#      valore PRESENTE, i valori a zero non escono;
#   3. presidio SENZA colonna_variante: UNA riga, variante NULL, conteggio
#      intero — anche zero. Il BE ha una lettura sola, e nessun codice nuovo;
#   4. una riga con la colonna della variante a NULL, in un presidio che la
#      dichiara, esce come gruppo NULL: il modello lo ammette (la colonna di
#      una vista non porta NOT NULL) anche se la vista dei processi oggi non
#      lo produce. ⛔ Non si fonde con nessun altro gruppo e non si scarta:
#      sparirebbe dal conteggio in silenzio;
#   5. GRANT EXECUTE a zeroerp_app.
#
# ── ⭐ SECURITY DEFINER del PROPRIETARIO, come fn_conta_presidio ─────
#   Stessa ragione, stesso testo: alcune viste a catalogo sono security_invoker
#   su tabelle in row level security, e da un percorso senza le GUC di
#   sessione (il management command del digest) tornerebbero ZERO per
#   cecita'. E stesso limite: torna NUMERI per gruppo, mai le righe.
#   ⚠️ Il valore della variante ESCE, ed e' voluto: e' un codice di
#   catalogo (dbops.presidi_cause), non un dato di dominio. Una
#   colonna_variante che proiettasse un dato di riga trasformerebbe questa
#   funzione in un elenco aggirando la RLS: e' il catalogo a deciderlo
#   (colonna_variante si scrive solo dal CSV di 80_data), e il pgTAP del
#   presidio pretende che i valori della colonna siano le cause a catalogo
#   (dbops/test-presidio-processi-testo-per-causa-v1, test 3-4).
#
# ⚠️ search_path pinnato come fn_conta_presidio ('pg_catalog', 'pg_temp'):
#   la vista e' nominata qualificata, e cio' che la vista chiama lo risolve
#   il proprio corpo (il caso del 2026-09-12 si e' chiuso pinnando la
#   funzione chiamata, 20260912-37, non allargando questa).
#
# ⛔ Nessuna preCondition sul contenuto di 80_data (linee-guida-sql §11.4).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261010-41-create-fn-conta-presidio-per-variante-mctit.yaml

  - changeSet:
      id: 20261010-41-create-fn-conta-presidio-per-variante
      author: mctit
      failOnError: true
      comment: >
        Crea dbops.fn_conta_presidio_per_variante(text): conta le righe che
        chiedono un intervento su una vista di presidio a catalogo, raggruppate
        per il valore della colonna dichiarata in dbops.presidi.colonna_variante
        (una riga sola con variante NULL se il presidio non la dichiara). Sede
        unica del perimetro e del filtro di stato: fn_conta_presidio ne diventa
        la somma (-42). SECURITY DEFINER del proprietario. R-2 di
        brief-db-presidio-processi-testo-per-causa.
      preConditions:
        - onFail: HALT
        - and:
            - columnExists:
                { schemaName: dbops, tableName: presidi, columnName: colonna_variante }
            - columnExists:
                { schemaName: dbops, tableName: presidi_testi, columnName: variante }
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_conta_presidio_per_variante(
                  p_vista dbops.presidi.vista%TYPE
              ) RETURNS TABLE (
                  variante   dbops.presidi_testi.variante%TYPE,
                  -- ⚠️ tipo esplicito: e' un CONTEGGIO, nessuna colonna ne e'
                  --   il riflesso. bigint perche' e' il tipo di count(*), e
                  --   RETURN QUERY pretende la corrispondenza esatta.
                  conteggio  bigint
              )
              LANGUAGE plpgsql
              SECURITY DEFINER
              SET search_path TO 'pg_catalog', 'pg_temp'
              AS $function$
              DECLARE
                  v_riga     dbops.presidi%ROWTYPE;
                  v_schema   text;
                  v_relname  text;
                  v_filtro   text;
                  v_sql      text;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Contare le righe che CHIEDONO UN INTERVENTO su una vista
                  --   di presidio, per gruppo della colonna che il catalogo
                  --   dichiara come variante (la causa della riga),
                  --   attraversando la row level security dove serve, e senza
                  --   mai restituire le righe.
                  --
                  -- ⭐ E' la SEDE UNICA del conteggio dei presidi: perimetro,
                  --   rifiuto e filtro di stato stanno qui e solo qui.
                  --   dbops.fn_conta_presidio e' la somma di questi gruppi.
                  --
                  -- ⛔ Il perimetro e' il CATALOGO: una vista non dichiarata
                  --   non si conta. E' cio' che impedisce a questa funzione di
                  --   diventare una porta per contare qualunque relazione del
                  --   database aggirando la row level security.
                  -- =========================================================

                  -- ⚠️ Il NULL cade nello stesso ramo del nome sconosciuto, ed
                  --   e' voluto: `vista = NULL` non trova niente. UN SOLO SITO
                  --   CHE SOLLEVA.
                  SELECT * INTO v_riga
                    FROM dbops.presidi
                   WHERE vista = p_vista
                     AND attivo
                     AND obsoleto_dal IS NULL;

                  -- ⚠️ SELECT INTO senza righe NON solleva: il controllo va
                  --   scritto, o si prosegue su un catalogo che non ha risposto.
                  IF NOT FOUND THEN
                      -- ⛔ Nel VARIADIC il NOME DELLA VISTA CHIESTA, la cosa
                      --   che una persona riconosce; il ripiego serve al NULL.
                      PERFORM script.fn_log_and_raise_error(
                          'dbops', 'fn_conta_presidio_per_variante',
                          'E_PRESIDIO_NON_A_CATALOGO',
                          jsonb_build_object('vista', p_vista),
                          NULL::uuid,
                          coalesce(nullif(btrim(p_vista), ''), '(nessuna vista indicata)'));
                  END IF;

                  v_schema  := split_part(v_riga.vista, '.', 1);
                  v_relname := split_part(v_riga.vista, '.', 2);

                  -- ⭐ Il filtro di stato, scritto UNA volta per i due rami.
                  --   ⛔ Si conta «DIVERSO DALLO STATO ATTESO», non «uguale a
                  --   uno degli stati di allarme»: uno stato NUOVO aggiunto
                  --   domani alla vista cade cosi' nell'allarme invece che nel
                  --   silenzio.
                  --   ⚠️ IS DISTINCT FROM e non <>: un NULL nella colonna di
                  --   stato e' «non atteso», e con <> la riga uscirebbe dal
                  --   conteggio in silenzio.
                  --   ⚠️ Senza colonna_stato il $1 resta inusato: EXECUTE …
                  --   USING ne prende il tipo dal valore, non lo deduce.
                  v_filtro := CASE
                                  WHEN v_riga.colonna_stato IS NULL THEN ''
                                  ELSE format(' WHERE %I IS DISTINCT FROM $1',
                                              v_riga.colonna_stato)
                              END;

                  -- ⛔ SQL dinamico con %I, mai per concatenazione di nomi: i
                  --   nomi vengono da una tabella, e una tabella si scrive.
                  IF v_riga.colonna_variante IS NULL THEN
                      -- Presidio senza variante: SENZA GROUP BY l'aggregato
                      -- torna sempre UNA riga, anche a zero (contratto 3).
                      v_sql := format('SELECT NULL::text, count(*) FROM %I.%I',
                                      v_schema, v_relname)
                               || v_filtro;
                  ELSE
                      -- ⚠️ ::text perche' la colonna della vista puo' avere un
                      --   tipo suo, e la variante a catalogo e' testo.
                      -- ⭐ GROUP BY tiene il NULL come gruppo a se' (contratto
                      --   4): non si fonde e non si perde.
                      -- ⚠️ ORDER BY per una risposta stabile; il NULL in coda.
                      v_sql := format('SELECT %I::text, count(*) FROM %I.%I',
                                      v_riga.colonna_variante, v_schema, v_relname)
                               || v_filtro
                               || ' GROUP BY 1 ORDER BY 1 NULLS LAST';
                  END IF;

                  RETURN QUERY EXECUTE v_sql USING v_riga.stato_atteso;
              END
              $function$;

              COMMENT ON FUNCTION dbops.fn_conta_presidio_per_variante(dbops.presidi.vista%TYPE) IS
                  'Conta le righe che CHIEDONO UN INTERVENTO su una vista di presidio dichiarata in dbops.presidi, raggruppate per il valore della colonna nominata da dbops.presidi.colonna_variante (la causa della riga): una riga per valore presente, il NULL come gruppo a se''. Presidio senza colonna_variante: una riga sola, variante NULL, il conteggio intero anche a zero. ⭐ E'' la SEDE UNICA del conteggio dei presidi: perimetro (catalogo, altrimenti E_PRESIDIO_NON_A_CATALOGO) e filtro di stato (colonna_stato IS DISTINCT FROM stato_atteso) stanno qui; dbops.fn_conta_presidio ne e'' la somma, cosi'' le due risposte non possono divergere. ⭐ SECURITY DEFINER del PROPRIETARIO, non di un superuser, per la stessa ragione di fn_conta_presidio: le viste security_invoker su tabelle in row level security, da un percorso senza GUC di sessione, tornerebbero ZERO per cecita''. ⛔ Torna NUMERI per gruppo e MAI le righe; il valore del gruppo e'' un codice di catalogo (dbops.presidi_cause), non un dato di dominio. Lettori: il digest (raggruppa per chi agisce della causa) e il pannello (conteggio accanto a ogni causa). Brief: brief-db-presidio-processi-testo-per-causa §6.2 (R-2).';

              -- ⚠️ Solo zeroerp_app: i privilegi dei ruoli batch stanno nel
              --   provisioning, mai in un changeSet (linee-guida-sql §11.6).
              GRANT EXECUTE ON FUNCTION dbops.fn_conta_presidio_per_variante(dbops.presidi.vista%TYPE) TO zeroerp_app;
      rollback:
        - sql:
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS dbops.fn_conta_presidio_per_variante(text);
