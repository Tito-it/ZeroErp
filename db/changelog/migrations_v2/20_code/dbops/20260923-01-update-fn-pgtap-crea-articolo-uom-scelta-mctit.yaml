# `dbops.fn_pgtap_crea_articolo` prende un quinto parametro: la UoM BASE.
#
# ── ⛔ «UNA VALE L'ALTRA» E' VERO FINO A UN CERTO PUNTO ───────────────
#   Il commento della rev 20260918-26 dice «UoM: la prima attiva del seed (una
#   vale l'altra)», e per un articolo di magazzino lo e'. ⛔ Smette di esserlo
#   per un test che misura le CONVERSIONI: `trgfn_uom_conversioni_guard_tipo`
#   ammette una conversione globale solo fra UoM della **stessa tipologia**,
#   quindi un test che vuole una conversione diretta e una inversa ha bisogno
#   di TRE unita' della stessa famiglia. La prima attiva del seed e' `PZ`
#   (tipo 8), e quella famiglia ne ha due: il test non puo' costruire il suo
#   caso, e non per colpa sua.
#
# ── ⚠️ E LA UoM NON SI CAMBIA DOPO ───────────────────────────────────
#   `catalogo.articoli.uom_id` e' una colonna LOCCATA
#   (`trgfn_lock_columns`): la fixture non puo' costruire l'articolo e poi
#   spostarne la base. O la sceglie alla nascita, o non la sceglie.
#
# ── ⭐ COSA CAMBIA ───────────────────────────────────────────────────
#   Un quinto parametro `p_uom_id`, **in coda e con DEFAULT NULL**: chi non lo
#   passa ha esattamente il comportamento di prima (la prima UoM attiva del
#   seed). Le 23 fixture che oggi la chiamano passano al massimo quattro
#   argomenti posizionali e non cambiano di una riga.
#   ⚠️ Serve DROP + CREATE, non `CREATE OR REPLACE`: un parametro in piu' crea
#   un OVERLOAD, e una chiamata a quattro argomenti diventerebbe ambigua fra le
#   due firme.
#   ⚠️ Il guard sul parametro e' sul RISULTATO, non sulla forma: una UoM
#   inesistente o spenta viene rifiutata parlando, invece di arrivare alla FK.
#
# Nessun pgTAP pinna la firma di questa funzione (censito il 2026-09-23:
# nessun `has_function`/`identity_arguments` che la nomini).
# Brief: brief-db-fixture-che-costruiscono-giro-2.md §5, lotto 1.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20260923-01-update-fn-pgtap-crea-articolo-uom-scelta-mctit.yaml

  - changeSet:
      id: 20260923-01-update-fn-pgtap-crea-articolo-uom-scelta
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.fn_pgtap_crea_articolo prende un quinto parametro opzionale
        p_uom_id (la UoM base dell'articolo): serve ai test che misurano le
        conversioni, ammesse solo fra UoM della stessa tipologia, e la colonna
        uom_id e' loccata quindi non si puo' cambiare dopo. DROP + CREATE
        perche' un parametro in piu' sarebbe un overload ambiguo; chi non passa
        il parametro ha il comportamento di prima.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION IF EXISTS dbops.fn_pgtap_crea_articolo(
                  character varying, boolean, boolean, boolean);

              CREATE OR REPLACE FUNCTION dbops.fn_pgtap_crea_articolo(
                  p_codice          character varying,
                  p_gestito         boolean DEFAULT true,
                  p_requires_lotto  boolean DEFAULT false,
                  p_requires_serial boolean DEFAULT false,
                  p_uom_id          catalogo.articoli.uom_id%TYPE DEFAULT NULL
              )
               RETURNS uuid
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: dare a una fixture pgTAP un articolo COSTRUITO con i flag che il
              --   test sceglie (gestito a magazzino, per lotti, per seriale): pescarne uno
              --   dal catalogo darebbe un articolo non gestito, cioe' un rifiuto che
              --   sembra un test rosso. UoM: la prima attiva del seed (una vale l'altra).
              -- Uso: v_art := dbops.fn_pgtap_crea_articolo('PGT-A', true, true, false);
              -- ⭐ Rev 20260923-01: `p_uom_id` per chi la UoM base la deve SCEGLIERE —
              --   chi misura le conversioni, che il guard ammette solo fra unita' della
              --   stessa tipologia. La colonna e' loccata: o si sceglie qui, o mai piu'.
              DECLARE
                  v_uom catalogo.unita_misura.id%TYPE;
                  v_id  catalogo.articoli.id%TYPE;
              BEGIN
                  IF p_uom_id IS NULL THEN
                      SELECT u.id INTO v_uom FROM catalogo.unita_misura u WHERE u.attivo ORDER BY u.id LIMIT 1;
                      IF v_uom IS NULL THEN
                          RAISE EXCEPTION 'fn_pgtap_crea_articolo: catalogo.unita_misura e'' vuoto — e'' un seed di 80_data';
                      END IF;
                  ELSE
                      -- ⚠️ Guard sul RISULTATO: una UoM inesistente o spenta qui parla,
                      --   invece di arrivare alla FK con un messaggio che non nomina
                      --   ne' la fixture ne' il parametro.
                      SELECT u.id INTO v_uom
                        FROM catalogo.unita_misura u
                       WHERE u.id = p_uom_id AND u.attivo;
                      IF v_uom IS NULL THEN
                          RAISE EXCEPTION
                              'fn_pgtap_crea_articolo: p_uom_id = % non e'' una unita'' di misura attiva a catalogo',
                              p_uom_id;
                      END IF;
                  END IF;

                  INSERT INTO catalogo.articoli (codice, descrizione, uom_id,
                                                 gestito_a_magazzino, requires_lotto, requires_serial)
                  VALUES (p_codice, 'Fixture pgTAP: ' || p_codice, v_uom,
                          COALESCE(p_gestito, true), COALESCE(p_requires_lotto, false), COALESCE(p_requires_serial, false))
                  RETURNING id INTO v_id;
                  RETURN v_id;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_pgtap_crea_articolo(character varying, boolean, boolean, boolean, bigint)
              IS 'Fixture pgTAP: un articolo COSTRUITO con i flag scelti dal test (gestito_a_magazzino, requires_lotto, requires_serial). Pescare un articolo dal catalogo darebbe uno non gestito e un E_MAG_ARTICOLO_NON_GESTITO che sembra un test rosso (brief magazzino Lotto 2, sezione 5). ⭐ Rev 20260923-01: quinto parametro p_uom_id, la UoM BASE — senza, resta la prima attiva del seed. Serve a chi misura le CONVERSIONI: catalogo.trgfn_uom_conversioni_guard_tipo le ammette solo fra unita'' della stessa tipologia, e articoli.uom_id e'' una colonna loccata, quindi la base si sceglie alla nascita o non si sceglie piu''. Solo per i pgTAP.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Il corpo a quattro parametri e' nella doc auto-gen alla revisione
              -- 20260918-26. Non si riscrive un corpo stantio.
              SELECT 1;
