# IL GEMELLO CHE NEGA UN'AZIONE DI FIXTURE
#   dbops.fn_pgtap_nega_azione
#   Brief: brief-db-porte-aperte-dalla-sola-guc §15 (giro 10-quater; D-AI a, D-AJ a, D-AK a di Tid, 2026-11-27).
#
#   Un test che prova il rifiuto di un'azione NEGATA a un utente scriveva a mano
#   una riga di config.user_override_azioni con abilitata = false (fra gli altri
#   vendite/tests/db/test_commessa_cambia_stato_db.py, censimento §15.5). Con la
#   tabella in sola lettura per l'app (90_end/20261126-62) la riga la scrive
#   dbops.fn_pgtap_scrivi_override (20261126-55), dal verbo del SUPER_ADMIN.
#   Un builder gemello, non un parametro di dbops.fn_pgtap_concedi_azione: la
#   firma di quello resta identica, e negare non ha il tetto d'area.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261126-58-create-fn-pgtap-nega-azione-mctit.yaml

  - changeSet:
      id: 20261126-58-create-fn-pgtap-nega-azione
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.fn_pgtap_nega_azione: nega a un utente di fixture un'azione di processo, con un override abilitata = false dal verbo del SUPER_ADMIN. brief-db-porte-aperte-dalla-sola-guc §15.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_pgtap_nega_azione(
                  p_auth_user_id        config.user_override_azioni.auth_user_id%TYPE,
                  p_permission_codename config.azioni_processo.permission_codename%TYPE)
               RETURNS config.user_override_azioni.id%TYPE
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: negare a un utente di fixture un'azione di processo, con un
              --   override utente abilitata = false, valido da oggi e senza scadenza:
              --   e' cosi' che un test costruisce il caso «azione negata», anche
              --   quando il profilo la concede. Solo per i pgTAP.
              -- Uso: PERFORM dbops.fn_pgtap_nega_azione(
              --          (SELECT auth_user_id FROM _mondo), 'cambia_stato_commessa');
              DECLARE
                  v_azione_id   config.azioni_processo.id%TYPE;
                  v_override_id config.user_override_azioni.id%TYPE;
              BEGIN
                  SELECT ap.id INTO v_azione_id
                    FROM config.azioni_processo ap
                   WHERE ap.permission_codename = p_permission_codename;

                  IF v_azione_id IS NULL THEN
                      RAISE EXCEPTION 'fn_pgtap_nega_azione: azione di processo % inesistente', p_permission_codename;
                  END IF;

                  PERFORM dbops.fn_pgtap_scrivi_override(
                      'config.user_override_azioni'::regclass, p_auth_user_id,
                      jsonb_build_object('azione_id', v_azione_id),
                      jsonb_build_object('abilitata',  false,
                                         'motivo',     'Fixture pgTAP: azione negata',
                                         'valido_dal', (SELECT script.fn_data_operativa()),
                                         'valido_al',  NULL));

                  SELECT uoz.id INTO v_override_id
                    FROM config.user_override_azioni uoz
                   WHERE uoz.auth_user_id = p_auth_user_id
                     AND uoz.azione_id    = v_azione_id;

                  RETURN v_override_id;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_pgtap_nega_azione(config.user_override_azioni.auth_user_id%TYPE, config.azioni_processo.permission_codename%TYPE) IS
                $c$Fixture pgTAP: nega a un utente un'azione di processo con un override (config.user_override_azioni, abilitata = false, valido da oggi senza scadenza), idempotente sulla UNIQUE (utente, azione): è così che un test costruisce il caso «azione negata», anche quando il profilo la concede. Lo scrive il verbo del SUPER_ADMIN config.fn_imposta_override_azioni, da dbops.fn_pgtap_scrivi_override: le altre voci dell'utente restano, i loro id cambiano. Ritorna l'id della riga. Gemello di dbops.fn_pgtap_concedi_azione, senza il tetto d'area. Azione inesistente -> RAISE. Solo per i pgTAP.$c$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION IF EXISTS dbops.fn_pgtap_nega_azione(config.user_override_azioni.auth_user_id%TYPE, config.azioni_processo.permission_codename%TYPE);
