databaseChangeLog:
  - logicalFilePath: /migrations_v2/20_code/dbops/20251114-03-fn_generate_tx_id-mctit.yaml

  - changeSet:
      id: 20251114-03-fn_generate_tx_id
      author: mctit

      changes:
        - sql:
            splitStatements: false
            stripComments: true
            sql: |

              CREATE OR REPLACE FUNCTION dbops.fn_generate_tx_id(
                  p_generating_function text,
                  p_session_info jsonb DEFAULT '{}'::jsonb)
                    RETURNS uuid
                    LANGUAGE 'plpgsql'
                    COST 100
                    VOLATILE SECURITY DEFINER PARALLEL UNSAFE
                AS $BODY$
                DECLARE
                    -- v_tx UUID := gen_random_uuid();
                    v_tx UUID := uuidv7();
                BEGIN
                    -- Genera un nuovo UUID e lo inserisce in dbops.transaction_ids
                    INSERT INTO dbops.transaction_ids (
                        id,
                        generating_function,
                        session_info
                    ) VALUES (
                        v_tx,
                        p_generating_function,
                        p_session_info
                    );

                    RETURN v_tx;
                END;
                $BODY$;

                COMMENT ON FUNCTION dbops.fn_generate_tx_id(text, jsonb)
                    IS 'Genera un nuovo tx_id UUID, lo inserisce in dbops.transaction_ids 
                        con generating_function e session_info, e lo restituisce';
