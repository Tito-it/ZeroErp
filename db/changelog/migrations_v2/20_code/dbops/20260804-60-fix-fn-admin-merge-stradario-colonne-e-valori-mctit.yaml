# Bonifica riferimenti morti — F2, dove riparare il nome non basta
#   Brief: docs/it/dev/work-done/brief-db-bonifica-riferimenti-morti.md
#
# ── IL DIFETTO SEGNALATO ─────────────────────────────────────────────────
#   «la colonna "id_comune_orig" della relazione "stradario_trasformazioni"
#   non esiste». Vero: le colonne sono `via_id_orig` e `via_id_nuovo`.
#
# ── 🔴 IL DIFETTO CHE IL CONTROLLO NON POTEVA VEDERE ─────────────────────
#   Guardando cosa ci si scriveva dentro:
#
#     (SELECT comune_id FROM config.stradario WHERE id = p_id_orig)
#     (SELECT comune_id FROM config.stradario WHERE id = p_id_target)
#
#   La funzione fonde due **vie**: prende due id di `config.stradario` e
#   ripunta `anagrafiche.indirizzi_dettaglio.stradario_id` dall'una
#   all'altra. Il comune non e' cio' che si trasforma — e' un attributo di
#   entrambe, spesso lo stesso.
#
#   ⚠️ Rinominare e basta avrebbe prodotto la peggiore delle riparazioni:
#   una funzione che gira, non solleva niente, e scrive nello storico
#   record **falsi ma plausibili** — due id di comune in colonne che si
#   chiamano `via_id_*`. plpgsql_check non puo' accorgersene: i tipi
#   tornano, i nomi (riparati) tornano, e la semantica non e' una proprieta'
#   che si compili. E' il limite del presidio, e va detto: il controllo
#   trova i riferimenti che non si risolvono, non i riferimenti che si
#   risolvono verso la cosa sbagliata.
#
#   Si registrano quindi `p_id_orig` / `p_id_target`, gli stessi id su cui
#   agisce la `UPDATE` di propagazione due righe piu' sotto.
#
# ── PERCHE' SI RIPARA E NON SI DROPPA ────────────────────────────────────
#   Zero consumatori nel repo, `storico.stradario_trasformazioni` a zero
#   righe: non e' mai stata eseguita. Il criterio applicato altrove in
#   questo giro (`20260804-48`) direbbe di droppare — ma li' le tabelle
#   sottostanti erano state tolte di proposito, e riscrivere avrebbe voluto
#   dire inventare un requisito. Qui e' l'opposto: `config.stradario`,
#   `storico.stradario_trasformazioni` e `anagrafiche.indirizzi_dettaglio`
#   sono tutte vive, la tabella di storico esiste **apposta** per questa
#   operazione e non ha altri scrittori. Droppare lascerebbe una tabella
#   senza il codice che la riempie: un residuo al posto di un altro.
#
# ── ⚠️ COSA RESTA DA DECIDERE (segnalato, non fatto qui) ─────────────────
#   La funzione registra nell'audit e propaga, ma **non tocca** la riga
#   di `config.stradario` sorgente: dopo la fusione `p_id_orig` resta
#   selezionabile. Se la fusione deve anche ritirare la via vecchia, il
#   modo giusto e' il pattern `obsoleto_dal` (asse «selezionabile per il
#   nuovo» separato da `attivo`), non un `attivo = false` che romperebbe le
#   istanze gia' referenziate. E' una decisione di dominio, non una
#   bonifica: va nel brief.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20260804-60-fix-fn-admin-merge-stradario-colonne-e-valori-mctit.yaml

  - changeSet:
      id: 20260804-60-fix-fn-admin-merge-stradario-colonne-e-valori
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        F2 — dbops.fn_admin_merge_stradario: le colonne di
        storico.stradario_trasformazioni sono via_id_orig/via_id_nuovo, e vi si
        scriveva il comune_id invece degli id di stradario. Riparare solo i nomi
        avrebbe prodotto record falsi ma plausibili: corretti nomi e valori.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_admin_merge_stradario(p_id_orig integer, p_id_target integer, p_event_type character DEFAULT 'F'::bpchar, p_event_date date DEFAULT CURRENT_DATE, p_note text DEFAULT NULL::text)
               RETURNS void
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_audit_id  BIGINT;
                v_start_ts  TIMESTAMPTZ := clock_timestamp();
              BEGIN
                -- Audit log: inserimento iniziale
                INSERT INTO dbops.audit_log(function_name, params, status)
                VALUES(
                  'admin_merge_stradario',
                  json_build_object(
                    'p_id_orig', p_id_orig,
                    'p_id_target', p_id_target,
                    'p_event_type', p_event_type,
                    'p_event_date', p_event_date,
                    'p_note', p_note
                  ),
                  'STARTED'
                ) RETURNING id INTO v_audit_id;

                -- Validazioni
                IF p_id_orig = p_id_target THEN
                  RAISE EXCEPTION 'Origine e destinazione devono differire';
                END IF;
                PERFORM 1 FROM config.stradario WHERE id = p_id_orig;
                IF NOT FOUND THEN
                  RAISE EXCEPTION 'Stradario % non trovato', p_id_orig;
                END IF;
                PERFORM 1 FROM config.stradario WHERE id = p_id_target;
                IF NOT FOUND THEN
                  RAISE EXCEPTION 'Stradario % non trovato', p_id_target;
                END IF;

                -- Inserimento in storico.stradario_trasformazioni
                --
                -- rev 2026-08-04 (bonifica riferimenti morti, F2): due difetti, e il
                --   secondo era invisibile al controllo.
                --   1) I nomi: le colonne sono `via_id_orig` / `via_id_nuovo`, non
                --      `id_comune_orig` / `id_comune_nuovo`.
                --   2) ⚠️ I VALORI: si scriveva il `comune_id` delle due righe di
                --      stradario. Ma questa funzione fonde due **vie** — sposta
                --      anagrafiche.indirizzi_dettaglio.stradario_id da p_id_orig a
                --      p_id_target — e il comune non e' cio' che si sta trasformando.
                --      Riparare solo i nomi avrebbe prodotto record che dicono «la via 12
                --      e' diventata la via 47» riportando due id di comune: una
                --      trasformazione falsa, per giunta credibile. Si registrano gli id
                --      di stradario, gli stessi su cui agisce la UPDATE qui sotto.
                INSERT INTO storico.stradario_trasformazioni(
                  via_id_orig,
                  via_id_nuovo,
                  tipo_evento,
                  data_evento,
                  note
                ) VALUES (
                  p_id_orig,
                  p_id_target,
                  p_event_type,
                  p_event_date,
                  p_note
                );

                -- Propagazione su indirizzi_dettaglio
                UPDATE anagrafiche.indirizzi_dettaglio
                   SET stradario_id = p_id_target
                 WHERE stradario_id = p_id_orig;

                -- Audit log: success
                UPDATE dbops.audit_log
                   SET status     = 'OK',
                       duration_ms = FLOOR(EXTRACT(EPOCH FROM clock_timestamp() - v_start_ts) * 1000)
                 WHERE id = v_audit_id;

              EXCEPTION WHEN OTHERS THEN
                -- Audit log: errore
                UPDATE dbops.audit_log
                   SET status     = 'ERROR',
                       message    = SQLERRM,
                       duration_ms = FLOOR(EXTRACT(EPOCH FROM clock_timestamp() - v_start_ts) * 1000)
                 WHERE id = v_audit_id;
                RAISE;
              END;
              $function$
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              SELECT 1;
