# Helper di fixture pgTAP: il GESTORE dell'installazione — e' un singleton,
#   quindi si PRENDE se c'e' e si costruisce solo se non c'e'.
#
# ── ⛔ IL DIFETTO ────────────────────────────────────────────────────
#   `anagrafiche.gestori` e' dato di MACCHINA: su un database ricostruito e'
#   vuota. Quattro file di `anagrafiche/` leggono «il primo Gestore» e su un
#   database da zero non trovano niente: le loro temp table restano vuote e i
#   test muoiono, o peggio passano su una riga che non esiste.
#
# ── ⚠️ ED E' UN SINGLETON, QUINDI NON SI «COSTRUISCE» E BASTA ────────
#   Un secondo gestore lo rifiuta un guard — «Esiste gia' un record di gestore.
#   Non e' possibile crearne un secondo» (misurato su dbdev il 2026-09-23).
#   ⇒ La forma giusta e' PRENDI-O-COSTRUISCI: su dbdev la funzione risponde il
#   gestore che c'e' e non tocca niente, in CI lo costruisce. Un builder che
#   creasse sempre renderebbe il file rosso proprio sulla macchina dove oggi e'
#   verde.
#   ⚠️ Nota al margine: il vincolo che porta il nome del singleton —
#   `uq_gestori_singleton`, `EXCLUDE USING gist (id WITH =) WHERE id IS NOT NULL`
#   — vieta due righe con lo STESSO id, cioe' ripete la primary key e non
#   impedisce un secondo gestore. A impedirlo e' il guard. Il nome promette una
#   cosa che la definizione non fa: e' il §4-bis della guida sui presidi.
#
# ── ⭐ COSA NON ENTRA ────────────────────────────────────────────────
#   I conti bancari del gestore NO: uso, IBAN e predefinito sono il caso dei
#   quattro file, e ognuno ne vuole uno diverso.
#
# Permessi: funzione di chi migra, non SECURITY DEFINER, non in
# dbops.sec_functions_owner.
# Brief: brief-db-fixture-che-costruiscono-giro-2.md §11, lotto 2.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20260923-06-create-fn-pgtap-crea-gestore-mctit.yaml

  - changeSet:
      id: 20260923-06-create-fn-pgtap-crea-gestore
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Helper di fixture pgTAP: dbops.fn_pgtap_crea_gestore() risponde il
        gestore dell'installazione, costruendolo (soggetto + ruolo GE + riga)
        solo se non ce n'e' uno. anagrafiche.gestori e' dato di macchina ed e'
        un singleton presidiato da un guard: su dbdev la funzione prende quello
        che c'e', in CI lo costruisce.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_pgtap_crea_gestore(
                  p_etichetta text DEFAULT 'pgTAP'
              )
               RETURNS TABLE (
                  gestore_id                anagrafiche.gestori.id%TYPE,
                  gestore_soggetto_ruolo_id anagrafiche.gestori.soggetto_ruolo_id%TYPE,
                  gestore_soggetto_id       anagrafiche.soggetti.id%TYPE
               )
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: dare a una fixture pgTAP il GESTORE dell'installazione.
              --   `anagrafiche.gestori` e' dato di MACCHINA: da zero e' vuota, e
              --   «il primo gestore» non esiste.
              -- ⚠️ PRENDI-O-COSTRUISCI, e non e' pigrizia: il gestore e' un
              --   singleton, e un secondo lo rifiuta un guard. Su dbdev questa
              --   funzione risponde quello che c'e' e non scrive niente.
              -- Uso:
              --   CREATE TEMP TABLE tmp_gestore AS
              --   SELECT * FROM dbops.fn_pgtap_crea_gestore('conto gestore');
              -- ⛔ I conti bancari del gestore NON li scrive: sono il caso del test.
              -- ⚠️ Esce con i vincoli IMMEDIATE, come ogni helper.
              DECLARE
                  v_id  anagrafiche.gestori.id%TYPE;
                  v_sr  anagrafiche.gestori.soggetto_ruolo_id%TYPE;
                  v_sog anagrafiche.soggetti.id%TYPE;
              BEGIN
                  SELECT g.id, g.soggetto_ruolo_id, sr.soggetto_id
                    INTO v_id, v_sr, v_sog
                    FROM anagrafiche.gestori g
                    JOIN anagrafiche.soggetti_ruoli sr ON sr.id = g.soggetto_ruolo_id
                   ORDER BY g.id
                   LIMIT 1;

                  IF v_id IS NOT NULL THEN
                      RETURN QUERY SELECT v_id, v_sr, v_sog;
                      RETURN;
                  END IF;

                  -- ⛔ LA FINESTRA DIFFERITA: il ruolo GE ha i suoi indirizzi
                  --   obbligatori e un guard differito, e il preambolo dei pgTAP
                  --   mette i vincoli IMMEDIATE.
                  SET CONSTRAINTS ALL DEFERRED;

                  v_sog := dbops.fn_pgtap_crea_soggetto_pg('Gestore ' || p_etichetta);
                  v_sr  := dbops.fn_pgtap_crea_soggetto_ruolo(
                               v_sog, 'GE'::character varying);

                  INSERT INTO anagrafiche.gestori
                      (soggetto_ruolo_id, descrizione, cd_prod_software, valuta_id)
                  VALUES (v_sr, 'Gestore pgTAP ' || p_etichetta, 'ZEROERP',
                          (SELECT v.id FROM config.valute v ORDER BY v.id LIMIT 1))
                  RETURNING id INTO v_id;

                  -- Saga completa: i guard differiti scattano QUI, su un mondo
                  -- finito.
                  SET CONSTRAINTS ALL IMMEDIATE;

                  RETURN QUERY SELECT v_id, v_sr, v_sog;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_pgtap_crea_gestore(text)
              IS 'Fixture pgTAP: il GESTORE dell''installazione — lo PRENDE se c''e'', lo costruisce (soggetto + ruolo GE + riga, dentro la finestra differita) se non c''e''. ⚠️ anagrafiche.gestori e'' dato di MACCHINA: su un database ricostruito e'' vuota, e i quattro file che leggevano «il primo Gestore» non trovavano niente. ⛔ Prendi-o-costruisci e non costruisci-sempre, perche'' il gestore e'' un SINGLETON: un secondo lo rifiuta un guard, quindi un builder che creasse sempre sarebbe rosso proprio su dbdev. ⛔ I conti bancari del gestore NON li scrive: uso, IBAN e predefinito sono il caso del test. ⚠️ Esce con i vincoli IMMEDIATE, come ogni helper. Brief: brief-db-fixture-che-costruiscono-giro-2.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS dbops.fn_pgtap_crea_gestore(text);
