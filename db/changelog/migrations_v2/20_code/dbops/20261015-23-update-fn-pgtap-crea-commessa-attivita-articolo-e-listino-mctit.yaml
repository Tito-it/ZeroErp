# ------------------------------------------------------------
# dbops.fn_pgtap_crea_commessa_attivita: L'ARTICOLO E IL LISTINO DAL CHIAMANTE
#   Richiesta del team BE, 2026-10-14.
#
# -- IL DIFETTO -----------------------------------------------------------
#   Dal guard A-10 (catalogo.trgfn_articoli_guard_struttura_se_usato,
#   2026-10-13) un articolo USATO non cambia i flag strutturali, fra cui
#   listino_tipologia_id. Il builder costruiva l'articolo al suo interno,
#   senza flag, e lo metteva subito sulla riga di commessa: chi voleva un
#   articolo della tipologia di un listino (o con un'altra natura, un altro
#   flag) lo riceveva gia' usato, cioe' non piu' modificabile. Due fixture
#   avevano ripiegato sulla MADRE con ~40 argomenti ricopiati (il test Django
#   test_prezzo_riga_commessa_db e il pgTAP
#   test-riga-listino-propagata-dalla-commessa-v1): regola del 2.
#
# -- IL CONFINE DEL BUILDER (da qui in avanti) -----------------------------
#   Il builder decide il CONTESTO: commessa, istanza del billing account,
#   competenza, sorgente COMMESSA, APPROVATA e NON_EMESSA, segment key,
#   quantita' 1. Il chiamante sceglie l'OGGETTO (l'articolo) e la PROVENIENZA
#   del prezzo (prezzo, versione e riga di listino). Tutto il resto (tipo
#   movimento, quantita' negative, rettifiche, oneri, contratto, promo) passa
#   dalla madre: un builder con tutti i parametri della madre e' una seconda
#   madre.
#
# -- I PARAMETRI NUOVI (in coda, DEFAULT NULL) ----------------------------
#   * p_articolo_id: l'articolo gia' costruito dal chiamante, coi flag che
#     gli servono. Assente: lo costruisce come prima. Un articolo che non
#     esiste parla (altrimenti la madre morirebbe su uom_id, senza dire
#     perche').
#   * p_listino_riga_id: la riga di listino che ha dato il prezzo. Se c'e',
#     l'unita' di misura e' la SUA (il risolutore la cerca con l'unita' della
#     riga) e, se mancano, articolo e versione si ricavano da lei. Una riga
#     che non esiste parla.
#   * p_listino_versione_id: la versione sotto cui la riga e' registrata.
#     Con la sola versione (senza riga) e' «registrata sotto V1».
#   ⛔ Il builder NON controlla la coerenza fra articolo, riga e versione: la
#   tiene la tabella (vendite.trgfn_attivita_guard_listino_riga,
#   20261015-21/-22), per tutti, test compresi.
#
# -- LA FIRMA: DROP + CREATE -----------------------------------------------
#   Un CREATE OR REPLACE con tre parametri in piu' creerebbe un OVERLOAD, e
#   la chiamata a un argomento (la piu' comune) diventerebbe ambigua.
#   RETURNS TABLE invariato. Chiamanti censiti il 2026-10-15 (6 pgTAP,
#   backend/scripts/tests/_smoke_commessa.py): usano i primi due argomenti,
#   restano validi. Corpo: dal 20261013-18 (l'ultimo), con i %TYPE.
#   Permessi: funzione di chi migra, non SECURITY DEFINER (come 20261007-26).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261015-23-update-fn-pgtap-crea-commessa-attivita-articolo-e-listino-mctit.yaml

  - changeSet:
      id: 20261015-23-update-fn-pgtap-crea-commessa-attivita-articolo-e-listino
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.fn_pgtap_crea_commessa_attivita: tre parametri in coda (p_articolo_id,
        p_listino_versione_id, p_listino_riga_id), DEFAULT NULL. Il chiamante passa un articolo gia'
        costruito coi suoi flag (dal guard A-10 un articolo usato non li cambia piu') e la provenienza
        del prezzo. DROP + CREATE. Richiesta del team BE, 2026-10-14.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION IF EXISTS dbops.fn_pgtap_crea_commessa_attivita(bigint, numeric);

              CREATE FUNCTION dbops.fn_pgtap_crea_commessa_attivita(
                  p_commessa_id         vendite.commesse.id%TYPE,
                  p_prezzo_snapshot     vendite.commesse_attivita.prezzo_snapshot%TYPE DEFAULT 10,
                  p_articolo_id         vendite.commesse_attivita.articolo_id%TYPE DEFAULT NULL,
                  p_listino_versione_id vendite.commesse_attivita.listino_versione_id%TYPE DEFAULT NULL,
                  p_listino_riga_id     vendite.commesse_attivita.listino_riga_id%TYPE DEFAULT NULL)
               RETURNS TABLE(attivita_id vendite.commesse_attivita.id%TYPE, articolo_id vendite.commesse_attivita.articolo_id%TYPE, uom_id vendite.commesse_attivita.uom_id%TYPE, competenza_dal vendite.commesse_attivita.competenza_dal%TYPE, competenza_al vendite.commesse_attivita.competenza_al%TYPE)
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: dare a una fixture pgTAP un'ATTIVITA' approvata su una
              --   commessa gia' costruita, scritta dalla madre del dominio.
              -- Uso:
              --   CREATE TEMP TABLE tmp_a AS
              --   SELECT * FROM dbops.fn_pgtap_crea_commessa_attivita(
              --              (SELECT commessa_id FROM tmp_c));
              --   Con un articolo costruito prima (coi suoi flag) e il listino:
              --   SELECT * FROM dbops.fn_pgtap_crea_commessa_attivita(
              --              p_commessa_id         => ...,
              --              p_articolo_id         => ...,
              --              p_listino_versione_id => ...,
              --              p_listino_riga_id     => ...);
              -- ⛔ L'emissione NON la fa: e' il caso del test.
              -- ⛔ La coerenza articolo / riga / versione la tiene la tabella.
              -- ⚠️ Esce con i vincoli IMMEDIATE, come ogni helper.
              DECLARE
                  v_ba_id    vendite.commesse.billing_account_id%TYPE;
                  v_dal      vendite.commesse_attivita.competenza_dal%TYPE;
                  v_al       vendite.commesse_attivita.competenza_al%TYPE;
                  v_ist_id   anagrafiche.billing_account.istanza_utility_id%TYPE;
                  v_articolo vendite.commesse_attivita.articolo_id%TYPE;
                  v_uom      vendite.commesse_attivita.uom_id%TYPE;
                  v_versione vendite.commesse_attivita.listino_versione_id%TYPE;
                  v_attivita vendite.commesse_attivita.id%TYPE;
                  v_riga     record;
              BEGIN
                  SELECT c.billing_account_id,
                         COALESCE(c.competenza_dal, date_trunc('month', (SELECT script.fn_data_operativa()))::date),
                         COALESCE(c.competenza_al,
                                  (date_trunc('month', (SELECT script.fn_data_operativa())) + interval '1 month - 1 day')::date)
                    INTO v_ba_id, v_dal, v_al
                    FROM vendite.commesse c
                   WHERE c.id = p_commessa_id;

                  -- ⚠️ Guard sul parametro: una commessa che non esiste
                  --   farebbe morire la madre su un NULL che non la nomina.
                  IF v_ba_id IS NULL THEN
                      RAISE EXCEPTION
                          'fn_pgtap_crea_commessa_attivita: nessuna commessa con id = %',
                          p_commessa_id;
                  END IF;

                  SELECT ba.istanza_utility_id INTO v_ist_id
                    FROM anagrafiche.billing_account ba
                   WHERE ba.id = v_ba_id;

                  v_versione := p_listino_versione_id;

                  -- La riga di listino, se c'e': da lei l'unita' di misura e,
                  --   se il chiamante non li da', articolo e versione.
                  IF p_listino_riga_id IS NOT NULL THEN
                      SELECT lr.articolo_id, lr.uom_id, lr.listino_versione_id
                        INTO v_riga
                        FROM vendite.listini_righe lr
                       WHERE lr.id = p_listino_riga_id;

                      IF NOT FOUND THEN
                          RAISE EXCEPTION
                              'fn_pgtap_crea_commessa_attivita: nessuna riga di listino con id = %',
                              p_listino_riga_id;
                      END IF;

                      v_articolo := COALESCE(p_articolo_id, v_riga.articolo_id);
                      v_uom      := v_riga.uom_id;
                      v_versione := COALESCE(v_versione, v_riga.listino_versione_id);
                  ELSIF p_articolo_id IS NOT NULL THEN
                      v_articolo := p_articolo_id;
                  ELSE
                      -- L'articolo si costruisce: il catalogo, da zero, e' vuoto.
                      v_articolo := dbops.fn_pgtap_crea_articolo(
                          ('PGT-ATT-' || substr(md5(clock_timestamp()::text || p_commessa_id::text), 1, 12))::varchar,
                          false);
                  END IF;

                  IF v_uom IS NULL THEN
                      SELECT a.uom_id INTO v_uom
                        FROM catalogo.articoli a
                       WHERE a.id = v_articolo;

                      -- ⚠️ Guard sul parametro: un articolo che non esiste
                      --   farebbe morire la madre su uom_id, senza nominarlo.
                      IF NOT FOUND THEN
                          RAISE EXCEPTION
                              'fn_pgtap_crea_commessa_attivita: nessun articolo con id = %',
                              v_articolo;
                      END IF;
                  END IF;

                  SELECT r.attivita_id INTO v_attivita
                    FROM vendite.fn_upsert_commessa_attivita(
                      p_commessa_id                   => p_commessa_id,
                      p_segment_key                   => ('PGT-SEG-' || substr(md5(clock_timestamp()::text || v_articolo::text), 1, 12))::varchar,
                      p_articolo_id                   => v_articolo,
                      p_istanza_utility_id            => v_ist_id,
                      p_data_attivita                 => v_dal,
                      p_uom_id                        => v_uom,
                      p_quantita                      => 1.000000,
                      p_competenza_mese               => date_trunc('month', v_dal)::date,
                      p_competenza_dal                => v_dal,
                      p_competenza_al                 => v_al,
                      p_prezzo_snapshot               => p_prezzo_snapshot,
                      p_prezzo_base_snapshot          => NULL,
                      p_origine_prezzo                => NULL,
                      p_tipo_variazione_applicata     => NULL,
                      p_valore_variazione_applicata   => NULL,
                      p_promo_id                      => NULL,
                      p_contratto_id                  => NULL,
                      p_categoria_cliente_id_snapshot => NULL,
                      p_classe_utenza_id_snapshot     => NULL,
                      p_listino_versione_id           => v_versione,
                      p_listino_riga_id               => p_listino_riga_id,
                      p_stato_approvazione            => 'APPROVATA',
                      p_stato_emissione               => 'NON_EMESSA',
                      p_sorgente_tipo_id              => (SELECT s.id FROM config.sorgenti s
                                                           WHERE s.codice_interno = 'COMMESSA' AND s.attivo),
                      p_sorgente_uid                  => p_commessa_id::text,
                      p_tipo_movimento                => 'NORMALE',
                      p_meta                          => jsonb_build_object('test_scope', 'pgtap_commessa_attivita')) r;

                  -- Contratto dichiarato, non fiducia nel chiamato.
                  SET CONSTRAINTS ALL IMMEDIATE;

                  RETURN QUERY
                  SELECT v_attivita, v_articolo, v_uom, v_dal, v_al;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_pgtap_crea_commessa_attivita(bigint, numeric, uuid, bigint, bigint)
              IS 'Fixture pgTAP: un''ATTIVITA'' su una commessa gia'' costruita (dbops.fn_pgtap_crea_commessa), scritta dalla madre vendite.fn_upsert_commessa_attivita: APPROVATA e NON_EMESSA, con la commessa come sorgente, quantita'' 1 e prezzo snapshot FIXED (secondo parametro, default 10). Il builder decide il CONTESTO (istanza dal billing account della commessa, competenza dalla commessa o il mese corrente, sorgente, stati, segment key); il chiamante sceglie l''OGGETTO e la PROVENIENZA del prezzo: p_articolo_id (un articolo gia'' costruito coi suoi flag: dal guard A-10 un articolo usato non li cambia piu''; assente, lo costruisce dbops.fn_pgtap_crea_articolo, non gestito), p_listino_versione_id (la versione sotto cui la riga e'' registrata), p_listino_riga_id (la riga di listino del prezzo: da lei l''unita'' di misura e, se mancano, articolo e versione). Tutto il resto passa dalla madre. ⛔ La coerenza fra articolo, riga e versione la tiene la tabella (vendite.trgfn_attivita_guard_listino_riga). ⛔ NON emette e non lega a una fattura: e'' il caso del test. ⚠️ Una commessa, un articolo o una riga di listino inesistenti parlano. Esce con i vincoli IMMEDIATE. rev 2026-10-15: i tre parametri in coda (richiesta del team BE), DROP + CREATE.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- ⚠️ Il rollback NON ricrea la versione precedente: va ri-applicato il
              --    20261013-18 dopo questo DROP.
              DROP FUNCTION IF EXISTS dbops.fn_pgtap_crea_commessa_attivita(bigint, numeric, uuid, bigint, bigint);
