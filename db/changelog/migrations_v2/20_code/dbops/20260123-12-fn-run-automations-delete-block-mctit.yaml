databaseChangeLog:
  - logicalFilePath: /migrations_v2/20_code/dbops/20260123-12-fn-run-automations-delete-block-mctit.yaml

  - changeSet:
      id: 20260123-12-fn-run-automations-delete-block
      author: mctit
      comment: >
        Esegue l'automazione DELETE_BLOCK: applica i trigger di blocco DELETE
        definiti in dbops.automation_delete_block con bypass via GUC.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_run_automations_delete_block(
                p_exec_mode text,
                p_schemas text[],
                p_dry_run boolean)
                  RETURNS void
                  LANGUAGE 'plpgsql'
                  COST 100
                  VOLATILE PARALLEL UNSAFE
              AS $BODY$
              DECLARE
                v_schemas text[];
                rconf record;
                rel regclass;
                v_trigger_name text;
              BEGIN
                v_schemas := dbops.fn_resolve_scope(p_schemas);

                FOR rconf IN
                  SELECT d.*
                    FROM dbops.automation_delete_block d
                   WHERE d.enabled
                     AND d.schema_name = ANY(v_schemas)
                     AND dbops.fn_table_in_scope(d.schema_name, d.table_name)
                   ORDER BY d.id
                LOOP
                  rel := to_regclass(format('%I.%I', rconf.schema_name, rconf.table_name));
                  IF rel IS NULL THEN
                    IF p_dry_run THEN
                      PERFORM dbops.fn_audit_log_once(
                        p_function_name => 'dbops.fn_run_automations_delete_block',
                        p_status        => 'DRYRUN',
                        p_rule_type     => 'DELETE_BLOCK',
                        p_exec_mode     => p_exec_mode,
                        p_parts         => ARRAY['DELETE_BLOCK'],
                        p_dry_run       => true,
                        p_params        => jsonb_build_object(
                                            'action','SKIP',
                                            'reason','TABLE_NOT_FOUND',
                                            'table', rconf.schema_name||'.'||rconf.table_name
                                          ),
                        p_message       => 'Skip: table not found'
                      );
                    END IF;
                    CONTINUE;
                  END IF;

                  v_trigger_name := COALESCE(
                    rconf.trigger_name,
                    format('trg_%s_a10_delete_block_dlt', rconf.table_name)
                  );

                  IF dbops.fn_trigger_exists_by_name(rel, v_trigger_name) THEN
                    CONTINUE;
                  END IF;

                  IF p_dry_run THEN
                    PERFORM dbops.fn_audit_log_once(
                      p_function_name => 'dbops.fn_run_automations_delete_block',
                      p_status        => 'DRYRUN',
                      p_rule_type     => 'DELETE_BLOCK',
                      p_exec_mode     => p_exec_mode,
                      p_parts         => ARRAY['DELETE_BLOCK'],
                      p_dry_run       => true,
                      p_params        => jsonb_build_object(
                                          'table', rconf.schema_name||'.'||rconf.table_name,
                                          'trigger', v_trigger_name,
                                          'guc_key', rconf.guc_key,
                                          'action','DRYRUN_CREATE_TRIGGER'
                                        ),
                      p_message       => 'Trigger would be created'
                    );
                  ELSE
                    BEGIN
                      PERFORM dbops.fn_apply_delete_block_trigger(
                        rconf.schema_name,
                        rconf.table_name,
                        rconf.guc_key,
                        rconf.trigger_name
                      );
                    EXCEPTION WHEN others THEN
                      PERFORM script.fn_log_and_raise_error(
                        'dbops',
                        'run_automations',
                        'E_DELETE_BLOCK',
                        jsonb_build_object(
                          'where','DELETE_BLOCK',
                          'table', rconf.schema_name||'.'||rconf.table_name,
                          'error', SQLERRM
                        ),
                        NULL::uuid,
                        SQLERRM
                      );
                    END;
                  END IF;
                END LOOP;
              END;
              $BODY$;

              COMMENT ON FUNCTION dbops.fn_run_automations_delete_block(text, text[], boolean)
                IS 'Applica i trigger DELETE_BLOCK configurati in dbops.automation_delete_block.';
