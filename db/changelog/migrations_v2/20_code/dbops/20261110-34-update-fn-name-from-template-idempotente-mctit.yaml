# dbops.fn_name_from_template: il taglio oltre i 63 caratteri non lascia un trattino basso in coda (decisione di
#   Tid, §28.11). Prima left(s, 56) poteva finire con '_', e col separatore dell'hash nasceva un doppio '__': ripassato
#   al template, la pulizia dei trattini ripetuti dava un nome diverso. Cambiano i nomi lunghi che finivano cosi'
#   (fatto datato, 2026-11-08: 58 trigger ATTIVO, che il loro runner rigenera, e uno di audit, rinominato dal -35).
#   Corpo di partenza dal catalogo dello scratch; rollback = corpo e COMMENT di prima. Brief: brief-db-revisione-dbops, giro 10c, blocco 10c-4 (§28.11-28.13).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261110-34-update-fn-name-from-template-idempotente-mctit.yaml

  - changeSet:
      id: 20261110-34-update-fn-name-from-template-idempotente
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        fn_name_from_template: idempotente, il taglio non lascia un trattino in coda. Brief: brief-db-revisione-dbops, giro 10c, blocco 10c-4 (§28.11-28.13).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_proc
               WHERE oid = to_regprocedure('dbops.fn_name_from_template(text,text,text,text,text,text,text)')
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_name_from_template(p_template text, p_schema text, p_table text, p_parent text DEFAULT NULL::text, p_child text DEFAULT NULL::text, p_fk text DEFAULT NULL::text, p_op text DEFAULT NULL::text)
               RETURNS text
               LANGUAGE plpgsql
              AS $function$
                DECLARE
                  s text;
                  h6 text := CASE WHEN p_fk IS NOT NULL AND length(p_fk)>0
                              THEN substr(to_hex(hashtextextended(p_fk,0)),1,6) ELSE '' END;
                  s_no_if text;
                BEGIN
                  -- ----------------------------------------------
                  --  p_template → stringa modello, può contenere placeholder come 
                  --  {schema}, {table}, {parent}, {child}, {fk}, {op}.
                  --       es. {schema}.{table} → {schema}.{table}
                  --   p_schema → nome dello schema di destinazione.
                  --   p_table → nome della tabella di destinazione.
                  --   p_parent → nome della tabella padre (per FK).
                  --   p_child → nome della tabella figlia (per FK).
                  --   p_fk → nome della foreign key.
                  --    p_op → operazione (INS, UPD, DEL, ecc.).
                  ----------------------------------------------

                  --s := p_template;
                  s  := COALESCE(p_template, '{table}');


                  s := replace(s, '{schema}', COALESCE(p_schema,''));
                  s := replace(s, '{table}',  COALESCE(p_table,''));
                  s := replace(s, '{parent}', COALESCE(p_parent,''));
                  s := replace(s, '{child}',  COALESCE(p_child,''));
                  s := replace(s, '{fk}',     COALESCE(p_fk,''));
                  s := replace(s, '{op}',     COALESCE(p_op,''));

                  -- hash sempre (se presente nel template esplicito)
                  s := replace(s,'{fkhash6}',h6);

                  -- hash solo se il nome è lungo
                  IF position('{fkhash6_if_long}' IN s) > 0 THEN
                    s_no_if := replace(s,'{fkhash6_if_long}','');
                    IF length(s_no_if) > 63 THEN
                      s := replace(s,'{fkhash6_if_long}',h6);
                    ELSE
                      s := s_no_if;
                    END IF;
                  END IF;

                  -- elimina i doppi underscore 
                  s:= regexp_replace(s, '_{2,}', '_', 'g');
                  s := regexp_replace(s, '^_+|_+$', '', 'g');

                   -- guard 63 char con hash consistente
                  -- ⭐ Il taglio non lascia un trattino basso in coda: se lo lasciasse, col separatore
                  --   dell'hash diventerebbe un doppio «__», e ripassato al template (la pulizia qui
                  --   sopra) il nome cambierebbe. Cosi' un nome gia' risolto, ripassato, esce uguale.
                  IF length(s) > 63 THEN
                    s := rtrim(left(s, 63-1-6), '_') || '_' || substr(to_hex(hashtextextended(s,0)), 1, 6);
                  END IF;

                  RETURN s;
                END;
                $function$
              ;

              COMMENT ON FUNCTION dbops.fn_name_from_template(text, text, text, text, text, text, text) IS
              'Il nome di un oggetto generato (trigger, vincolo, funzione) da un template: sostituisce i segnaposto {schema}, {table}, {parent}, {child}, {fk}, {op}, {fkhash6} (le prime sei cifre esadecimali dell''hash di p_fk) e {fkhash6_if_long} (l''hash solo se il nome supera i 63 caratteri), riduce i trattini bassi ripetuti e toglie quelli in testa e in coda. Oltre i 63 caratteri, il limite di PostgreSQL, accorcia e aggiunge _ + sei cifre dell''hash del nome intero; il taglio non lascia un trattino basso in coda, cosi'' il risultato e'' idempotente: un nome gia'' risolto, ripassato, esce uguale. Per i nomi che un registro dichiara riga per riga c''e'' dbops.fn_nome_oggetto_dichiarato.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_name_from_template(p_template text, p_schema text, p_table text, p_parent text DEFAULT NULL::text, p_child text DEFAULT NULL::text, p_fk text DEFAULT NULL::text, p_op text DEFAULT NULL::text)
               RETURNS text
               LANGUAGE plpgsql
              AS $function$
                DECLARE
                  s text;
                  h6 text := CASE WHEN p_fk IS NOT NULL AND length(p_fk)>0
                              THEN substr(to_hex(hashtextextended(p_fk,0)),1,6) ELSE '' END;
                  s_no_if text;
                BEGIN
                  -- ----------------------------------------------
                  --  p_template → stringa modello, può contenere placeholder come 
                  --  {schema}, {table}, {parent}, {child}, {fk}, {op}.
                  --       es. {schema}.{table} → {schema}.{table}
                  --   p_schema → nome dello schema di destinazione.
                  --   p_table → nome della tabella di destinazione.
                  --   p_parent → nome della tabella padre (per FK).
                  --   p_child → nome della tabella figlia (per FK).
                  --   p_fk → nome della foreign key.
                  --    p_op → operazione (INS, UPD, DEL, ecc.).
                  ----------------------------------------------

                  --s := p_template;
                  s  := COALESCE(p_template, '{table}');


                  s := replace(s, '{schema}', COALESCE(p_schema,''));
                  s := replace(s, '{table}',  COALESCE(p_table,''));
                  s := replace(s, '{parent}', COALESCE(p_parent,''));
                  s := replace(s, '{child}',  COALESCE(p_child,''));
                  s := replace(s, '{fk}',     COALESCE(p_fk,''));
                  s := replace(s, '{op}',     COALESCE(p_op,''));

                  -- hash sempre (se presente nel template esplicito)
                  s := replace(s,'{fkhash6}',h6);

                  -- hash solo se il nome è lungo
                  IF position('{fkhash6_if_long}' IN s) > 0 THEN
                    s_no_if := replace(s,'{fkhash6_if_long}','');
                    IF length(s_no_if) > 63 THEN
                      s := replace(s,'{fkhash6_if_long}',h6);
                    ELSE
                      s := s_no_if;
                    END IF;
                  END IF;

                  -- elimina i doppi underscore 
                  s:= regexp_replace(s, '_{2,}', '_', 'g');
                  s := regexp_replace(s, '^_+|_+$', '', 'g');

                   -- guard 63 char con hash consistente
                  IF length(s) > 63 THEN
                    s := left(s, 63-1-6) || '_' || substr(to_hex(hashtextextended(s,0)), 1, 6);
                  END IF;

                  RETURN s;
                END;
                $function$
              ;

              COMMENT ON FUNCTION dbops.fn_name_from_template(text,text,text,text,text,text,text) IS 'Questa funzione ha lo scopo di generare in modo dinamico un nome di oggetto (trigger, funzione, ecc.) 
                  a partire da un template parametrico, garantendo che:
                  1)I segnaposto nel template vengano sostituiti con i valori reali di schema, tabella, parent, child, 
                  chiave esterna o operazione.
                  2)   Il nome finale non superi il limite di PostgreSQL (63 caratteri): in caso di overflow
                   viene troncato e completato con un digest hash per assicurare l’univocità.';
