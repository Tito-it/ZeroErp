# LA FIXTURE DEI pgTAP CHE CREA UN OPERATORE, COL CANCELLO DEI DATI DI SVILUPPO
#   dbops.fn_pgtap_fixture_crea_operatore
#   Brief: brief-db-porte-aperte-dalla-sola-guc §14 (giro 10-bis; D-AC a, D-AD b, D-AE a, D-AF a di Tid, 2026-11-26) (D-AE a).
#
#   I builder dei pgTAP lavorano come app. Con lo scope e i legami in sola
#   lettura (90_end/20261126-24) e la creazione dell'operatore riservata al
#   SUPER_ADMIN (20261126-10), il primo SUPER_ADMIN di fixture non ha nessuno
#   da cui farsi creare. Questa funzione e' la sola strada senza permesso
#   aperta all'app: SECURITY DEFINER, chiama la primitiva
#   anagrafiche.fn_applica_crea_operatore (20261126-09), e parte solo dove
#   partono i dati di sviluppo, con la regola del provisioning
#   (dbops.fn_dati_di_sviluppo_ammessi_su_valori, E_DATI_DI_SVILUPPO_IN_PRODUZIONE).
#   ⚠️ Il limite, dichiarato: in SVILUPPO l'app puo' crearsi un SUPER_ADMIN di
#   fixture, come gia' col provisioning. dbops.installazione e' in sola lettura
#   per l'app: l'ambiente non lo cambia lei.
#   Firma e risultato quelli del verbo (20261125-68), cosi' il builder cambia
#   solo il nome della chiamata.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261126-15-create-fn-pgtap-fixture-crea-operatore-mctit.yaml

  - changeSet:
      id: 20261126-15-create-fn-pgtap-fixture-crea-operatore
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.fn_pgtap_fixture_crea_operatore: la fixture dei pgTAP che crea un operatore dalla primitiva, solo dove sono ammessi i dati di sviluppo. brief-db-porte-aperte-dalla-sola-guc §14.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_pgtap_fixture_crea_operatore(
                  p_soggetto_id anagrafiche.soggetti.id%TYPE DEFAULT NULL::uuid,
                  p_cognome anagrafiche.soggetti.cognome%TYPE DEFAULT NULL::text,
                  p_nome anagrafiche.soggetti.nome%TYPE DEFAULT NULL::text,
                  p_codice_fiscale anagrafiche.soggetti.codice_fiscale%TYPE DEFAULT NULL::text,
                  p_username text DEFAULT NULL::text,  -- colonna di django.auth_user: niente %TYPE
                  p_email text DEFAULT NULL::text,  -- colonna di django.auth_user: niente %TYPE
                  p_password_hash text DEFAULT NULL::text,  -- colonna di django.auth_user: niente %TYPE
                  p_qualifica_id anagrafiche.risorse_umane.qualifica_id%TYPE DEFAULT NULL::integer,
                  p_unita_organizzativa_id anagrafiche.risorse_umane.unita_organizzativa_id%TYPE DEFAULT NULL::integer,
                  p_data_nascita anagrafiche.soggetti.data_nascita%TYPE DEFAULT NULL::date,
                  p_sesso anagrafiche.soggetti.sesso%TYPE DEFAULT NULL::bpchar,
                  p_is_super_admin boolean DEFAULT false,  -- un interruttore del chiamante
                  p_valido_dal anagrafiche.risorse_umane.valido_dal%TYPE DEFAULT script.fn_data_operativa(),
                  p_valido_al anagrafiche.risorse_umane.valido_al%TYPE DEFAULT NULL::date,
                  p_comune_nascita_id anagrafiche.soggetti.comune_id%TYPE DEFAULT NULL::integer,
                  p_indirizzo_resid_dettaglio_id anagrafiche.indirizzi_dettaglio.id%TYPE DEFAULT NULL::bigint,
                  p_indirizzo_domfisc_dettaglio_id anagrafiche.indirizzi_dettaglio.id%TYPE DEFAULT NULL::bigint,
                  p_riusa_auth_user_id integer DEFAULT NULL::integer  -- id di django.auth_user: niente %TYPE
              )
               RETURNS TABLE(auth_user_id integer, username text, credenziale_riusata boolean)  -- colonne di django.auth_user e un esito: niente %TYPE
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              -- Scopo:
              --   Fixture dei pgTAP: creare un operatore (anche SUPER_ADMIN) senza chiedere
              --   permessi, solo dove sono ammessi i dati di sviluppo.
              --
              -- Regole:
              --   - in PRODUZIONE: E_DATI_DI_SVILUPPO_IN_PRODUZIONE, prima di ogni scrittura;
              --   - argomenti, regole e risultato: quelli di anagrafiche.fn_crea_operatore,
              --     tramite la sua primitiva anagrafiche.fn_applica_crea_operatore.
              DECLARE
                  v_ambiente dbops.installazione.ambiente%TYPE;
              BEGIN
                  -- Il cancello: solo dove sono ammessi i dati di sviluppo.
                  v_ambiente := script.fn_ambiente_installazione();
                  IF NOT dbops.fn_dati_di_sviluppo_ammessi_su_valori(v_ambiente) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'dbops', 'dbops.fn_pgtap_fixture_crea_operatore',
                          'E_DATI_DI_SVILUPPO_IN_PRODUZIONE',
                          jsonb_build_object('ambiente', v_ambiente),
                          NULL::uuid,
                          v_ambiente);
                  END IF;

                  RETURN QUERY
                  SELECT o.auth_user_id, o.username, o.credenziale_riusata
                    FROM anagrafiche.fn_applica_crea_operatore(p_soggetto_id, p_cognome, p_nome, p_codice_fiscale, p_username, p_email, p_password_hash, p_qualifica_id, p_unita_organizzativa_id, p_data_nascita, p_sesso, p_is_super_admin, p_valido_dal, p_valido_al, p_comune_nascita_id, p_indirizzo_resid_dettaglio_id, p_indirizzo_domfisc_dettaglio_id, p_riusa_auth_user_id) o;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_pgtap_fixture_crea_operatore(p_soggetto_id uuid, p_cognome text, p_nome text, p_codice_fiscale text, p_username text, p_email text, p_password_hash text, p_qualifica_id integer, p_unita_organizzativa_id integer, p_data_nascita date, p_sesso character, p_is_super_admin boolean, p_valido_dal date, p_valido_al date, p_comune_nascita_id integer, p_indirizzo_resid_dettaglio_id bigint, p_indirizzo_domfisc_dettaglio_id bigint, p_riusa_auth_user_id integer)
              IS 'Fixture dei pgTAP: crea un operatore, anche SUPER_ADMIN, con la primitiva anagrafiche.fn_applica_crea_operatore, senza chiedere permessi; argomenti, regole e risultato sono quelli del verbo anagrafiche.fn_crea_operatore. SECURITY DEFINER ed eseguibile dall''applicazione, perché il primo SUPER_ADMIN di un test non ha nessuno da cui farsi creare: per questo parte solo dove sono ammessi i dati di sviluppo (dbops.fn_dati_di_sviluppo_ammessi_su_valori sull''ambiente dell''installazione), e in PRODUZIONE solleva E_DATI_DI_SVILUPPO_IN_PRODUZIONE. La usa dbops.fn_pgtap_crea_operatore_umano; un test non la chiama da sé.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION IF EXISTS dbops.fn_pgtap_fixture_crea_operatore(p_soggetto_id uuid, p_cognome text, p_nome text, p_codice_fiscale text, p_username text, p_email text, p_password_hash text, p_qualifica_id integer, p_unita_organizzativa_id integer, p_data_nascita date, p_sesso character, p_is_super_admin boolean, p_valido_dal date, p_valido_al date, p_comune_nascita_id integer, p_indirizzo_resid_dettaglio_id bigint, p_indirizzo_domfisc_dettaglio_id bigint, p_riusa_auth_user_id integer);
