# LA CODA DI STAMPA E' ESENTE DAL GUARD UNICO, COL MOTIVO: dbops.fn_sorgenti_orfane_perimetro
#   Brief: brief-db-sorgente-documento-e-riga §7.2 lotto D, giro D.1 (D-3).
#
#   vendite.fatture_stampa_coda resta nel perimetro (sorgente_tipo_id e
#   sorgente_id), ma la sua chiave e' una FK vera verso vendite.fatture, ON DELETE
#   CASCADE: l'esistenza e la cancellazione le tiene la FK. Il guard unico con
#   BLOCCA fermerebbe la cancellazione di una fattura che la FK porta via con la
#   sua coda; con CANCELLA farebbe la stessa cosa della FK, una seconda volta. E la
#   cleanup delle fatture (vendite.fn_cleanup_fatture_by_ids) trova le figlie da
#   pg_constraint: senza la FK la coda non la vedrebbe. Esente dal guard, non
#   dagli orfani (la FK li rende impossibili, il presidio lo conferma).
#   CREATE OR REPLACE con la stessa firma; corpo dal 20261107-49, uguale al vivo
#   (dbdev e scratch, 2026-11-07). COMMENT riscritto al presente. Rollback: il
#   corpo del 20261107-49.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261108-21-update-fn-sorgenti-orfane-perimetro-esenzione-coda-stampa-mctit.yaml

  - changeSet:
      id: 20261108-21-update-fn-sorgenti-orfane-perimetro-esenzione-coda-stampa
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.fn_sorgenti_orfane_perimetro: la coda di stampa esente dal guard unico (FK vera verso la
        fattura). brief-db-sorgente-documento-e-riga §7.2 lotto D, giro D.1.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_sorgenti_orfane_perimetro()
              RETURNS TABLE(
                  tabella                regclass,
                  schema_tabella         pg_catalog.pg_namespace.nspname%TYPE,
                  nome_tabella           pg_catalog.pg_class.relname%TYPE,
                  grammatica             text,
                  ha_sorgente_id         boolean,
                  ha_sorgente_uid        boolean,
                  ha_sorgente_riga       boolean,
                  ha_sorgente_dettaglio  boolean,
                  orfani_esclusi_perche  text,
                  guard_esente_perche    text)
              LANGUAGE sql
              STABLE
              SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              BEGIN ATOMIC
                  WITH col AS (
                      SELECT a.attrelid,
                             bool_or(a.attname = 'sorgente_tipo_id')   AS ha_tipo,
                             bool_or(a.attname = 'sorgente_id')        AS ha_id,
                             bool_or(a.attname = 'sorgente_uid')       AS ha_uid,
                             bool_or(a.attname = 'sorgente_riga')      AS ha_riga,
                             bool_or(a.attname = 'sorgente_dettaglio') AS ha_dett
                        FROM pg_catalog.pg_attribute a
                       WHERE a.attnum > 0 AND NOT a.attisdropped
                         AND a.attname IN ('sorgente_tipo_id', 'sorgente_id', 'sorgente_uid',
                                           'sorgente_riga', 'sorgente_dettaglio')
                       GROUP BY a.attrelid
                  ),
                  esenzioni(tabella, orfani_perche, guard_perche) AS (
                      VALUES
                        (pg_catalog.to_regclass('pratiche.reconcile_errori'),
                         'e'' un log: rimanda per costruzione anche a documenti che non ci sono piu''',
                         'e'' un log scritto dentro un EXCEPTION: un guard d''esistenza lo farebbe tacere'),
                        (pg_catalog.to_regclass('vendite.fatture_stampa_coda'),
                         NULL::text,
                         'sorgente_id e'' una FK vera verso vendite.fatture (ON DELETE CASCADE): esistenza '
                         || 'e cancellazione le tiene la FK, e la cleanup delle fatture trova la coda da pg_constraint')
                  )
                  SELECT c.oid::regclass,
                         n.nspname,
                         c.relname,
                         CASE
                             WHEN EXISTS (SELECT 1 FROM script.fn_sorgente_guard_montaggi() m
                                           WHERE m.tabella = c.oid::regclass) THEN 'UNICO'
                             WHEN EXISTS (SELECT 1 FROM pg_catalog.pg_trigger tg
                                           WHERE tg.tgrelid = c.oid AND NOT tg.tgisinternal
                                             AND tg.tgfoid = 'script.trgfn_guard_sorgente_polimorfa_tipizzata()'::regprocedure)
                                 THEN 'MODELLO_A'
                             ELSE 'TESTUALE'
                         END,
                         col.ha_id,
                         col.ha_uid,
                         col.ha_riga,
                         col.ha_dett,
                         e.orfani_perche,
                         e.guard_perche
                    FROM col
                    JOIN pg_catalog.pg_class c     ON c.oid = col.attrelid
                    JOIN pg_catalog.pg_namespace n ON n.oid = c.relnamespace
                    LEFT JOIN esenzioni e          ON e.tabella = c.oid::regclass
                   WHERE c.relkind IN ('r', 'p')
                     AND n.nspname <> 'storico'
                     AND col.ha_tipo
                     AND (col.ha_id OR col.ha_uid)
                     AND (c.relpersistence <> 't'
                          OR (n.oid = pg_catalog.pg_my_temp_schema()
                              AND pg_catalog.has_table_privilege(c.oid, 'SELECT')))
                   ORDER BY n.nspname, c.relname;
              END;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION dbops.fn_sorgenti_orfane_perimetro() IS
                'Il perimetro della provenienza polimorfa: ogni tabella (fuori lo storico) con sorgente_tipo_id e almeno una fra sorgente_id e sorgente_uid, con le colonne che ha e la sua GRAMMATICA, dal guard che monta: UNICO (script.trgfn_guard_sorgente: tipo + sorgente_id | sorgente_uid + riga + dettaglio), MODELLO_A (script.trgfn_guard_sorgente_polimorfa_tipizzata: la chiave in sorgente_riga per id, in sorgente_uid per uid), TESTUALE (nessun guard: la chiave in sorgente_uid, come id o uid, in testo o uuid). Le esenzioni sono dichiarate con il motivo, in due colonne: orfani_esclusi_perche (fuori dal presidio degli orfani) e guard_esente_perche (fuori dal guard unico); il log dei reconcile (pratiche.reconcile_errori), fuori da tutte e due, e la coda di stampa (vendite.fatture_stampa_coda), fuori dal solo guard unico perche'' la sua chiave e'' una FK vera verso la fattura. Delle tabelle temporanee, solo quelle della sessione leggibili da chi chiede. Derivato dal catalogo di PostgreSQL, non da un elenco: una tabella nuova con la provenienza entra da sola. Lo leggono dbops.fn_sorgenti_orfane e il presidio di struttura (dbops/test-sorgenti-struttura-v1).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
