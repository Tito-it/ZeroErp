# ------------------------------------------------------------
# LA FIXTURE DEI pgTAP CHE CREA UN UTENTE TECNICO, COL CANCELLO DEI DATI DI SVILUPPO
#   dbops.fn_pgtap_fixture_crea_utente_tecnico
#   Brief: brief-db-porte-aperte-dalla-sola-guc §14 (giro 10-bis; D-AC a, D-AD b, D-AE a, D-AF a di Tid, 2026-11-26) (D-AE a).
#
#   La gemella di 20261126-15 per l'utente tecnico, su cui poggia
#   dbops.fn_pgtap_crea_emittente_operatore: il verbo script.fn_crea_utente_tecnico
#   chiede il SUPER_ADMIN (20261126-14). SECURITY DEFINER, chiama la primitiva
#   script.fn_applica_crea_utente_tecnico (20261126-13), col cancello dei dati
#   di sviluppo. Firma e risultato quelli del verbo.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261126-16-create-fn-pgtap-fixture-crea-utente-tecnico-mctit.yaml

  - changeSet:
      id: 20261126-16-create-fn-pgtap-fixture-crea-utente-tecnico
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.fn_pgtap_fixture_crea_utente_tecnico: la fixture dei pgTAP che crea un utente tecnico dalla primitiva, solo dove sono ammessi i dati di sviluppo. brief-db-porte-aperte-dalla-sola-guc §14.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_pgtap_fixture_crea_utente_tecnico(
                  p_processo_codice   dbops.processi.codice%TYPE,
                  p_emittente_codice  anagrafiche.emittenti_fiscali.codice%TYPE,
                  p_profilo_codice    config.profili_accesso.codice%TYPE DEFAULT NULL)
               RETURNS anagrafiche.identita_digitali.auth_user_id%TYPE
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              -- Scopo:
              --   Fixture dei pgTAP: creare l'utente tecnico di un processo per un
              --   emittente senza chiedere permessi, solo dove sono ammessi i dati di
              --   sviluppo.
              --
              -- Regole:
              --   - in PRODUZIONE: E_DATI_DI_SVILUPPO_IN_PRODUZIONE, prima di ogni scrittura;
              --   - argomenti, regole e risultato: quelli di script.fn_crea_utente_tecnico,
              --     tramite la sua primitiva script.fn_applica_crea_utente_tecnico.
              DECLARE
                  v_ambiente dbops.installazione.ambiente%TYPE;
              BEGIN
                  -- Il cancello: solo dove sono ammessi i dati di sviluppo.
                  v_ambiente := script.fn_ambiente_installazione();
                  IF NOT dbops.fn_dati_di_sviluppo_ammessi_su_valori(v_ambiente) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'dbops', 'dbops.fn_pgtap_fixture_crea_utente_tecnico',
                          'E_DATI_DI_SVILUPPO_IN_PRODUZIONE',
                          jsonb_build_object('ambiente', v_ambiente),
                          NULL::uuid,
                          v_ambiente);
                  END IF;

                  RETURN script.fn_applica_crea_utente_tecnico(p_processo_codice, p_emittente_codice, p_profilo_codice);
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_pgtap_fixture_crea_utente_tecnico(p_processo_codice text, p_emittente_codice character varying, p_profilo_codice character varying)
              IS 'Fixture dei pgTAP: crea l''utente tecnico di un processo per un emittente con la primitiva script.fn_applica_crea_utente_tecnico, senza chiedere permessi; argomenti, regole e risultato sono quelli del verbo script.fn_crea_utente_tecnico. SECURITY DEFINER ed eseguibile dall''applicazione: parte solo dove sono ammessi i dati di sviluppo (dbops.fn_dati_di_sviluppo_ammessi_su_valori sull''ambiente dell''installazione), e in PRODUZIONE solleva E_DATI_DI_SVILUPPO_IN_PRODUZIONE. La usa dbops.fn_pgtap_crea_emittente_operatore; un test non la chiama da sé.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION IF EXISTS dbops.fn_pgtap_fixture_crea_utente_tecnico(p_processo_codice text, p_emittente_codice character varying, p_profilo_codice character varying);
