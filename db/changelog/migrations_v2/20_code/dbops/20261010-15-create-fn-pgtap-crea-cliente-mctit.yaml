# ------------------------------------------------------------
# dbops.fn_pgtap_crea_cliente: LA FIXTURE ARRIVA FINO AL CLIENTE
#   Brief: brief-db-codici-non-trovato-email-e-permessi (R-9, regola del 2)
#
# -- IL DIFETTO ---------------------------------------------------------
#   dbops.fn_pgtap_crea_cliente_ba si ferma al billing account. La riga di
#   anagrafiche.clienti la scriveva a mano ogni test che serve un cliente,
#   pgTAP e test Django sul DB vero, e le copie erano gia' diverse fra loro:
#   stato PR in una, AT piu' la data di attivazione in un'altra (con AT
#   senza data il trigger trgfn_clienti_set_periodo rifiuta, E_DATA_APERTURA).
#
# -- COSA FA ------------------------------------------------------------
#   Chiama fn_pgtap_crea_cliente_ba (stessi tre parametri, stesso ordine) e
#   scrive la riga di clienti sul billing account appena nato:
#   * ruolo e istanza sono quelli del BA (fk_clienti_ba_cliente,
#     fk_clienti_billing_account); la utility la copia il trigger dal BA
#     (script.fn_cliente_dal_billing_account, 20261010-02);
#   * stato dal quarto parametro (default AT). Le date seguono lo stato
#     come le pretende trgfn_clienti_set_periodo: attivazione oggi (data
#     operativa) salvo pre-contratto e annullato (macro IS e AN), chiusura
#     oggi per gli stati di macro CH;
#   * utility di default: la prima che NON richiede il PDP. Un punto di
#     prelievo non appartiene a questa fixture: chi passa una utility che
#     lo richiede riceve il rifiuto del trigger, ed e' giusto cosi'.
#   Rende le colonne di fn_pgtap_crea_cliente_ba con cliente_id in testa.
#
# ⚠️ SENZA RETURNING, come fn_pgtap_crea_cliente_ba (rev 20260912-38): sotto
#   la RLS la riga si rilegge a istruzione finita dal billing account
#   (uq_clienti_billing_account: un BA, un cliente).
# ⚠️ Stesse regole d'ordine di fn_pgtap_crea_cliente_ba: con un operatore in
#   sessione il BA si lega al SUO emittente (trigger z90); da owner il terzo
#   parametro si chiede PRIMA di aprire il contesto.
# ⚠️ Le copie si ritirano nello stesso giro: script/test-search-scope-interno-v1
#   e anagrafiche/test-fn-get-evento-stato-corrente-cliente-v1 (pgTAP, team
#   DB); test_ricerca_liste_db e test_search_detail_non_trovato_db (Python,
#   backend). Le altre INSERT su clienti nei pgTAP hanno la riga come
#   SOGGETTO del test (vincoli, guard, RLS in scrittura) o costruiscono una
#   catena loro: restano, censite nel brief.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261010-15-create-fn-pgtap-crea-cliente-mctit.yaml

  - changeSet:
      id: 20261010-15-create-fn-pgtap-crea-cliente
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Nasce dbops.fn_pgtap_crea_cliente: la fixture pgTAP di un cliente completo (soggetto,
        ruolo CL, istanza, billing account e riga di anagrafiche.clienti con uno stato ammesso e
        le sue date). Ritira le copie a mano della riga clienti. Brief:
        brief-db-codici-non-trovato-email-e-permessi (R-9).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >-
              SELECT count(*) FROM pg_proc p
                JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'dbops' AND p.proname = 'fn_pgtap_crea_cliente_ba'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE FUNCTION dbops.fn_pgtap_crea_cliente(
                  -- Etichetta libera della fixture: nessuna colonna di cui sia il riflesso.
                  p_etichetta                    text DEFAULT 'pgTAP',
                  p_utility_id                   config.utilities.id%TYPE DEFAULT NULL,
                  p_emittente_soggetto_ruolo_id  anagrafiche.emittenti_fiscali_billing_account.emittente_soggetto_ruolo_id%TYPE DEFAULT NULL,
                  p_stato_codice_interno         config.stati_cliente.codice_interno%TYPE DEFAULT 'AT')
              RETURNS TABLE(
                  cliente_id          anagrafiche.clienti.id%TYPE,
                  billing_account_id  anagrafiche.billing_account.id%TYPE,
                  istanza_utility_id  anagrafiche.billing_account.istanza_utility_id%TYPE,
                  soggetto_ruolo_id   anagrafiche.billing_account.soggetto_ruolo_id%TYPE,
                  soggetto_id         anagrafiche.soggetti.id%TYPE,
                  utility_id          anagrafiche.billing_account.utility_id%TYPE)
              LANGUAGE plpgsql
              AS $function$
              -- Scopo: dare a una fixture pgTAP un cliente COMPLETO, fino alla
              --   riga di anagrafiche.clienti, con uno stato ammesso e le date
              --   che quello stato pretende.
              -- Uso:
              --   CREATE TEMP TABLE tmp_cli AS
              --   SELECT * FROM dbops.fn_pgtap_crea_cliente('RICERCA');
              DECLARE
                  v_ba_id       anagrafiche.billing_account.id%TYPE;
                  v_ist_id      anagrafiche.billing_account.istanza_utility_id%TYPE;
                  v_sr_id       anagrafiche.billing_account.soggetto_ruolo_id%TYPE;
                  v_soggetto_id anagrafiche.soggetti.id%TYPE;
                  v_utility_id  anagrafiche.billing_account.utility_id%TYPE;
                  v_stato_id    config.stati_cliente.id%TYPE;
                  v_macro       config.stati_cliente.codice%TYPE;
                  v_cliente_id  anagrafiche.clienti.id%TYPE;
                  v_oggi        anagrafiche.clienti.data_attivazione%TYPE;
              BEGIN
                  SELECT sc.id, sc.codice
                    INTO v_stato_id, v_macro
                    FROM config.stati_cliente sc
                   WHERE sc.codice_interno = p_stato_codice_interno;

                  IF v_stato_id IS NULL THEN
                      RAISE EXCEPTION
                          'fn_pgtap_crea_cliente: stato cliente % non a catalogo', p_stato_codice_interno;
                  END IF;

                  SELECT c.billing_account_id, c.istanza_utility_id, c.soggetto_ruolo_id,
                         c.soggetto_id, c.utility_id
                    INTO v_ba_id, v_ist_id, v_sr_id, v_soggetto_id, v_utility_id
                    FROM dbops.fn_pgtap_crea_cliente_ba(
                             p_etichetta,
                             COALESCE(p_utility_id,
                                      (SELECT u.id FROM config.utilities u
                                        WHERE NOT u.richiede_pdp
                                        ORDER BY u.id LIMIT 1)),
                             p_emittente_soggetto_ruolo_id) c;

                  v_oggi := script.fn_data_operativa();

                  -- Le date come le pretende trgfn_clienti_set_periodo: AT vuole
                  -- l'attivazione, gli stati CH la chiusura (>= attivazione).
                  -- Pre-contratto (IS) e annullato (AN) non hanno attivazione.
                  -- ⚠️ Ruolo e istanza dal BA: sono le sue copie (FK composte),
                  --   la utility la mette il trigger dal BA.
                  INSERT INTO anagrafiche.clienti
                      (billing_account_id, istanza_utility_id, soggetto_ruolo_id,
                       stato_cliente_id, data_attivazione, data_chiusura)
                  VALUES
                      (v_ba_id, v_ist_id, v_sr_id, v_stato_id,
                       CASE WHEN v_macro IN ('IS', 'AN') THEN NULL ELSE v_oggi END,
                       CASE WHEN v_macro = 'CH' THEN v_oggi END);

                  -- Senza RETURNING: sotto la RLS si rilegge a istruzione finita.
                  SELECT c.id INTO v_cliente_id
                    FROM anagrafiche.clienti c
                   WHERE c.billing_account_id = v_ba_id;

                  IF v_cliente_id IS NULL THEN
                      RAISE EXCEPTION
                          'fn_pgtap_crea_cliente: il cliente del billing account % e'' stato scritto ma non si legge: sotto la RLS serve un operatore dell''emittente del BA in sessione',
                          v_ba_id;
                  END IF;

                  RETURN QUERY
                  SELECT v_cliente_id, v_ba_id, v_ist_id, v_sr_id, v_soggetto_id, v_utility_id;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_pgtap_crea_cliente(text, config.utilities.id%TYPE, anagrafiche.emittenti_fiscali_billing_account.emittente_soggetto_ruolo_id%TYPE, config.stati_cliente.codice_interno%TYPE)
              IS 'Fixture pgTAP: un cliente COMPLETO, cioe'' dbops.fn_pgtap_crea_cliente_ba (soggetto, ruolo CL, istanza, billing account; stessi primi tre parametri) piu'' la riga di anagrafiche.clienti sul BA appena nato, con ruolo e istanza del BA (la utility la copia il trigger). Stato dal quarto parametro (codice_interno, default AT); le date le pretende trgfn_clienti_set_periodo: attivazione = data operativa salvo pre-contratto e annullato (macro IS, AN), chiusura = data operativa per gli stati di macro CH. Utility di default: la prima che non richiede il PDP. Rende cliente_id e le colonne di fn_pgtap_crea_cliente_ba. Senza RETURNING (rilettura dal BA, uq_clienti_billing_account): usabile come zeroerp_app con un operatore in sessione, stesse regole d''ordine di fn_pgtap_crea_cliente_ba. Nasce il 2026-10-10 (brief-db-codici-non-trovato-email-e-permessi R-9): regola del 2 sulle copie a mano della riga clienti nelle fixture.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS dbops.fn_pgtap_crea_cliente(text, config.utilities.id%TYPE, anagrafiche.emittenti_fiscali_billing_account.emittente_soggetto_ruolo_id%TYPE, config.stati_cliente.codice_interno%TYPE);
