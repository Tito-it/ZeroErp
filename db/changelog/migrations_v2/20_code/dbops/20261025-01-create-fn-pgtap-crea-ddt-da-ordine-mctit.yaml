# ------------------------------------------------------------
# dbops.fn_pgtap_crea_ddt_da_ordine: LA BOLLA CONSEGNATA NATA DA UN ORDINE
#   Brief: brief-db-pgtap-bolla-e-reso-costruiti §4.1, giro 1 (via di Tid,
#   2026-10-25).
#
# -- IL DIFETTO -----------------------------------------------------------
#   I pgTAP che hanno bisogno di una bolla consegnata nata da un ordine
#   riscrivono ognuno la stessa strada, in un ordine obbligato: ordine in
#   bozza con una riga, conferma, bolla dalla madre
#   vendite.fn_genera_ddt_da_ordine, indirizzo di consegna e causale di
#   trasporto, poi i passaggi EMESSO -> SPEDITO -> CONSEGNATO scritti uno per
#   uno. Quando una regola di uno dei passi cambia, si correggono tutte le
#   copie.
#
# -- IL BUILDER -----------------------------------------------------------
#   * L'ordine dal builder dbops.fn_pgtap_crea_ordine (in bozza), con UNA
#     riga di un articolo costruito (merce non gestita, salvo p_articolo_id),
#     il trigger di fatturazione chiesto (si scrive solo in bozza) e la
#     conferma per la matrice. Con p_ordine_id la bolla nasce invece da un
#     ordine che il test ha gia' costruito e confermato: righe speciali, piu'
#     spedizioni dalla stessa riga.
#   * La bolla dalla MADRE vendite.fn_genera_ddt_da_ordine: tutto il residuo,
#     oppure p_qta_da_evadere (l'ordine ha una sola riga) o p_righe (la
#     grammatica della madre), alla data p_data.
#   * Cio' che l'emissione pretende: la causale per codice e gli indirizzi
#     obbligatori dell'ambito DDT_VENDITA che la cascata dall'ordine non ha
#     portato (script.fn_indirizzi_obbligatori_mancanti, come
#     dbops.fn_pgtap_crea_ddt).
#   * Lo stato chiesto (default CONSEGNATO) per la matrice, con
#     dbops.fn_pgtap_porta_a_stato, sotto i guard veri. Chi deve lavorare
#     sulla bolla in bozza (una riga a mano, un legame, un prezzo tolto) la
#     chiede in DRAFT e la porta avanti da se'.
#   ⛔ La bolla in bozza per il magazzino resta di dbops.fn_pgtap_crea_ddt.
#   Permessi: funzione di chi migra, SECURITY INVOKER.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261025-01-create-fn-pgtap-crea-ddt-da-ordine-mctit.yaml

  - changeSet:
      id: 20261025-01-create-fn-pgtap-crea-ddt-da-ordine
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.fn_pgtap_crea_ddt_da_ordine: la bolla di fixture nata da un ordine confermato con la madre
        vendite.fn_genera_ddt_da_ordine, con causale e indirizzi obbligatori, portata allo stato chiesto
        (default CONSEGNATO) per la matrice. Brief: brief-db-pgtap-bolla-e-reso-costruiti (giro 1).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE FUNCTION dbops.fn_pgtap_crea_ddt_da_ordine(
                   -- l'etichetta e' un frammento di testo della fixture: tipo nudo.
                   p_etichetta            text DEFAULT 'pgTAP'::text,
                   p_stato_codice_interno config.stati_doc_ddt.codice_interno%TYPE DEFAULT 'CONSEGNATO',
                   p_billing_account_id   anagrafiche.billing_account.id%TYPE DEFAULT NULL,
                   p_quantita             vendite.ordini_righe.qta_operativa%TYPE DEFAULT NULL,
                   p_prezzo               vendite.ordini_righe.prezzo_unitario%TYPE DEFAULT NULL,
                   p_articolo_id          catalogo.articoli.id%TYPE DEFAULT NULL,
                   p_fatturazione_trigger vendite.ordini.fatturazione_trigger%TYPE DEFAULT NULL,
                   p_ordine_id            vendite.ordini.id%TYPE DEFAULT NULL,
                   p_qta_da_evadere       vendite.ddt_righe.qta_operativa%TYPE DEFAULT NULL,
                   -- la grammatica di vendite.fn_genera_ddt_da_ordine, non una colonna.
                   p_righe                jsonb DEFAULT NULL,
                   p_data                 vendite.ddt.data%TYPE DEFAULT NULL,
                   p_causale_codice       config.causali_trasporto.codice%TYPE DEFAULT 'VENDITA')
               RETURNS TABLE(
                   ddt_id                    vendite.ddt.id%TYPE,
                   ddt_uid                   vendite.ddt.uid%TYPE,
                   ddt_riga_id               vendite.ddt_righe.id%TYPE,
                   quantita                  vendite.ddt_righe.quantita%TYPE,
                   ordine_id                 vendite.ordini.id%TYPE,
                   ordine_uid                vendite.ordini.uid%TYPE,
                   ordine_riga_id            vendite.ordini_righe.id%TYPE,
                   articolo_id               catalogo.articoli.id%TYPE,
                   billing_account_id        anagrafiche.billing_account.id%TYPE,
                   cliente_soggetto_ruolo_id vendite.ordini.soggetto_ruolo_id%TYPE,
                   emittente_fiscale_id      vendite.ordini.emittente_fiscale_id%TYPE,
                   auth_user_id              anagrafiche.identita_digitali.auth_user_id%TYPE,
                   stato_doc_ddt_id          vendite.ddt.stato_doc_ddt_id%TYPE)
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              -- Scopo: dare a una fixture pgTAP una BOLLA nata da un ordine
              --   confermato, nello stato chiesto (default CONSEGNATO), per la
              --   strada vera del dominio.
              -- Uso:
              --   CREATE TEMP TABLE tmp_b AS
              --   SELECT * FROM dbops.fn_pgtap_crea_ddt_da_ordine('resi');
              --   -- due spedizioni dalla stessa riga, 4 e 6:
              --   CREATE TEMP TABLE tmp_a AS
              --   SELECT * FROM dbops.fn_pgtap_crea_ddt_da_ordine('sped', p_quantita => 10,
              --                                                    p_qta_da_evadere => 4);
              --   SELECT * FROM dbops.fn_pgtap_crea_ddt_da_ordine('sped',
              --              p_ordine_id => (SELECT ordine_id FROM tmp_a), p_qta_da_evadere => 6);
              --   -- la bolla in bozza, per scriverle cio' che il test prova:
              --   SELECT * FROM dbops.fn_pgtap_crea_ddt_da_ordine('bozza', 'DRAFT');
              -- ⛔ Restituisce la PRIMA riga della bolla: con piu' righe il test
              --   le legge da se'.
              -- ⚠️ Senza contesto aperto, il mondo lo apre sull'operatore che
              --   costruisce. Esce con i vincoli IMMEDIATE, come ogni helper.
              DECLARE
                  v_stato_id   config.stati_doc_ddt.id%TYPE;
                  v_causale_id config.causali_trasporto.id%TYPE;
                  v_ordine     vendite.ordini.id%TYPE;
                  v_ordine_uid vendite.ordini.uid%TYPE;
                  v_riga_ord   vendite.ordini_righe.id%TYPE;
                  v_articolo   catalogo.articoli.id%TYPE;
                  v_iva_id     config.iva.id%TYPE;
                  v_ba_id      anagrafiche.billing_account.id%TYPE;
                  v_cli_sr_id  vendite.ordini.soggetto_ruolo_id%TYPE;
                  v_ef_id      vendite.ordini.emittente_fiscale_id%TYPE;
                  v_user_id    anagrafiche.identita_digitali.auth_user_id%TYPE;
                  v_righe      jsonb;      -- la grammatica della madre
                  v_ddt        vendite.ddt.id%TYPE;
                  v_n          integer;    -- righe d'ordine attive: un conteggio
              BEGIN
                  -- 0. I parametri si giudicano PRIMA di costruire: un errore
                  --    del chiamante non deve lasciare un mondo a meta'.
                  SELECT s.id INTO v_stato_id
                    FROM config.stati_doc_ddt s
                   WHERE s.codice_interno = p_stato_codice_interno
                     AND s.attivo IS TRUE;
                  IF v_stato_id IS NULL THEN
                      RAISE EXCEPTION
                          'fn_pgtap_crea_ddt_da_ordine: nessuno stato attivo della bolla con codice_interno = %',
                          coalesce(p_stato_codice_interno::text, 'NULL');
                  END IF;

                  SELECT c.id INTO v_causale_id
                    FROM config.causali_trasporto c
                   WHERE c.codice = p_causale_codice
                     AND c.attivo IS TRUE;
                  IF v_causale_id IS NULL THEN
                      RAISE EXCEPTION
                          'fn_pgtap_crea_ddt_da_ordine: nessuna causale di trasporto attiva con codice = %',
                          coalesce(p_causale_codice::text, 'NULL');
                  END IF;

                  IF p_righe IS NOT NULL AND p_qta_da_evadere IS NOT NULL THEN
                      RAISE EXCEPTION
                          'fn_pgtap_crea_ddt_da_ordine: p_righe e p_qta_da_evadere insieme — la quantita'' da evadere sta gia'' in p_righe';
                  END IF;

                  -- Cliente, riga e trigger sono dell'ordine: con un ordine
                  -- gia' costruito non si scelgono qui.
                  IF p_ordine_id IS NOT NULL
                     AND (p_billing_account_id IS NOT NULL OR p_quantita IS NOT NULL
                          OR p_prezzo IS NOT NULL OR p_articolo_id IS NOT NULL
                          OR p_fatturazione_trigger IS NOT NULL) THEN
                      RAISE EXCEPTION
                          'fn_pgtap_crea_ddt_da_ordine: con p_ordine_id cliente, riga e trigger di fatturazione sono quelli dell''ordine — non si passano';
                  END IF;

                  -- 1. L'ordine confermato.
                  IF p_ordine_id IS NULL THEN
                      SELECT o.ordine_id, o.ordine_uid, o.billing_account_id,
                             o.cliente_soggetto_ruolo_id, o.emittente_fiscale_id, o.auth_user_id
                        INTO v_ordine, v_ordine_uid, v_ba_id, v_cli_sr_id, v_ef_id, v_user_id
                        FROM dbops.fn_pgtap_crea_ordine(p_etichetta, 'DRAFT', p_billing_account_id) o;

                      -- Il trigger di fatturazione e' una condizione della bozza.
                      IF p_fatturazione_trigger IS NOT NULL THEN
                          UPDATE vendite.ordini o
                             SET fatturazione_trigger = p_fatturazione_trigger
                           WHERE o.id = v_ordine;
                      END IF;

                      -- L'articolo si costruisce: il catalogo, da zero, e' vuoto.
                      v_articolo := COALESCE(p_articolo_id, dbops.fn_pgtap_crea_articolo(
                          ('PGT-DDT-' || substr(md5(clock_timestamp()::text || v_ordine::text), 1, 12))::varchar,
                          false));

                      -- Il catalogo di sistema si SCEGLIE, con il suo ORDER BY.
                      SELECT i.id INTO v_iva_id
                        FROM config.iva i
                       WHERE i.attivo IS TRUE
                       ORDER BY i.id
                       LIMIT 1;

                      INSERT INTO vendite.ordini_righe (
                          ordine_id, riga_nr, articolo_id, descrizione,
                          qta_operativa, quantita, prezzo_unitario, iva_id, meta)
                      VALUES (
                          v_ordine, 1, v_articolo, left('Fixture pgTAP: ' || p_etichetta, 150),
                          COALESCE(p_quantita, 10), COALESCE(p_quantita, 10), COALESCE(p_prezzo, 25),
                          v_iva_id, jsonb_build_object('test_scope', 'pgtap_' || p_etichetta))
                      RETURNING id INTO v_riga_ord;

                      PERFORM dbops.fn_pgtap_porta_a_stato('vendite.ordini'::regclass, v_ordine, 'CONFERMATO');
                  ELSE
                      SELECT o.id, o.uid, o.billing_account_id, o.soggetto_ruolo_id, o.emittente_fiscale_id
                        INTO v_ordine, v_ordine_uid, v_ba_id, v_cli_sr_id, v_ef_id
                        FROM vendite.ordini o
                       WHERE o.id = p_ordine_id;
                      IF NOT FOUND THEN
                          RAISE EXCEPTION
                              'fn_pgtap_crea_ddt_da_ordine: ordine id = % non esiste o non e'' visibile',
                              p_ordine_id;
                      END IF;
                      v_user_id := NULLIF(current_setting('app.current_user_id', true), '')::integer;

                      -- La quantita' da evadere vale per LA riga: con piu' righe
                      -- il test dice quale con p_righe.
                      IF p_qta_da_evadere IS NOT NULL THEN
                          SELECT count(*), min(r.id) INTO v_n, v_riga_ord
                            FROM vendite.ordini_righe r
                           WHERE r.ordine_id = v_ordine
                             AND r.attivo IS TRUE;
                          IF v_n <> 1 THEN
                              RAISE EXCEPTION
                                  'fn_pgtap_crea_ddt_da_ordine: p_qta_da_evadere vuole un ordine con una sola riga attiva (l''ordine % ne ha %) — usare p_righe',
                                  v_ordine, v_n;
                          END IF;
                      END IF;
                  END IF;

                  -- 2. La bolla dalla madre: tutto il residuo, o cio' che il test chiede.
                  v_righe := COALESCE(p_righe,
                      CASE WHEN p_qta_da_evadere IS NOT NULL THEN
                          jsonb_build_array(jsonb_build_object(
                              'ordine_riga_id', v_riga_ord, 'qta_da_evadere', p_qta_da_evadere))
                      END);
                  v_ddt := vendite.fn_genera_ddt_da_ordine(v_ordine, v_righe, p_data);

                  -- 3. Cio' che l'emissione pretende: la causale e gli indirizzi
                  --    obbligatori che la cascata dall'ordine non ha portato.
                  UPDATE vendite.ddt d
                     SET causale_trasporto_id = v_causale_id
                   WHERE d.id = v_ddt;

                  INSERT INTO vendite.ddt_indirizzi (ddt_id, tipo_indirizzo_id, snapshot)
                  SELECT v_ddt, ti.id, jsonb_build_object('display', 'pgTAP ' || ti.codice_interno)
                    FROM config.tipi_indirizzi ti
                   WHERE ti.codice_interno = ANY (script.fn_indirizzi_obbligatori_mancanti(
                             'DDT_VENDITA',
                             (SELECT array_agg(di.tipo_indirizzo_id)::integer[]
                                FROM vendite.ddt_indirizzi di
                               WHERE di.ddt_id = v_ddt)))
                  ON CONFLICT DO NOTHING;

                  -- 4. Lo stato chiesto, per la matrice: la bolla e' nata nello
                  --    stato iniziale (trigger della nascita).
                  IF v_stato_id IS DISTINCT FROM script.fn_stato_iniziale_id('config.stati_doc_ddt'::regclass) THEN
                      PERFORM dbops.fn_pgtap_porta_a_stato('vendite.ddt'::regclass, v_ddt, p_stato_codice_interno);
                  END IF;

                  -- Contratto dichiarato, non fiducia nel chiamato.
                  SET CONSTRAINTS ALL IMMEDIATE;

                  RETURN QUERY
                  SELECT d.id, d.uid, dr.id, dr.quantita,
                         v_ordine, v_ordine_uid, f.ordine_riga_id, dr.articolo_id,
                         v_ba_id, v_cli_sr_id, v_ef_id, v_user_id, d.stato_doc_ddt_id
                    FROM vendite.ddt d
                    JOIN LATERAL (
                        SELECT r.id, r.quantita, r.articolo_id
                          FROM vendite.ddt_righe r
                         WHERE r.ddt_id = d.id
                         ORDER BY r.riga_nr, r.id
                         LIMIT 1) dr ON true
                    LEFT JOIN LATERAL (
                        SELECT ff.ordine_riga_id
                          FROM vendite.ordini_righe_fulfillment ff
                         WHERE ff.ddt_riga_id = dr.id
                         ORDER BY ff.id
                         LIMIT 1) f ON true
                   WHERE d.id = v_ddt;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_pgtap_crea_ddt_da_ordine(text, config.stati_doc_ddt.codice_interno%TYPE, anagrafiche.billing_account.id%TYPE, vendite.ordini_righe.qta_operativa%TYPE, vendite.ordini_righe.prezzo_unitario%TYPE, catalogo.articoli.id%TYPE, vendite.ordini.fatturazione_trigger%TYPE, vendite.ordini.id%TYPE, vendite.ddt_righe.qta_operativa%TYPE, jsonb, vendite.ddt.data%TYPE, config.causali_trasporto.codice%TYPE)
              IS 'Fixture pgTAP: una BOLLA nata da un ORDINE confermato, nello stato chiesto (secondo parametro, default CONSEGNATO), per la strada vera del dominio. ⭐ Esiste per la TRAPPOLA D''ORDINE che ogni file ricopiava: ordine in bozza con la riga, conferma, bolla dalla madre vendite.fn_genera_ddt_da_ordine, causale e indirizzi che l''emissione pretende, passaggi per la matrice. L''ordine lo costruisce dbops.fn_pgtap_crea_ordine (terzo parametro: il billing account di un cliente gia'' costruito), con UNA riga di p_quantita (default 10) a p_prezzo (default 25), dell''articolo p_articolo_id o di uno costruito (merce non gestita), la prima IVA attiva e il trigger di fatturazione p_fatturazione_trigger (scritto in bozza; NULL = quello ereditato dal billing account). Con p_ordine_id la bolla nasce invece da un ordine gia'' costruito e confermato dal test, e cliente, riga e trigger non si passano (solleva). La quantita'': tutto il residuo; p_qta_da_evadere per l''unica riga attiva dell''ordine; p_righe nella grammatica della madre (i due insieme sollevano). p_data: la data della bolla (NULL = data operativa). p_causale_codice: la causale di trasporto per codice (default VENDITA). Gli indirizzi obbligatori dell''ambito DDT_VENDITA che la cascata dall''ordine non ha portato li scrive come dbops.fn_pgtap_crea_ddt. Lo stato si raggiunge con dbops.fn_pgtap_porta_a_stato, sotto i guard veri: chi deve scrivere sulla bolla in bozza (una riga a mano, un legame, un prezzo tolto) la chiede in DRAFT e la porta avanti da se''. Restituisce bolla, PRIMA riga della bolla con la sua quantita'' base, ordine e riga d''ordine evasa, articolo, cliente, emittente, operatore e stato. Uno stato, una causale o un ordine inesistenti sollevano prima di costruire. ⛔ La bolla in bozza per il magazzino, senza ordine, resta di dbops.fn_pgtap_crea_ddt. ⚠️ Senza contesto aperto lo apre sull''operatore che costruisce; esce con i vincoli IMMEDIATE. Brief: brief-db-pgtap-bolla-e-reso-costruiti (giro 1), 2026-10-25.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION IF EXISTS dbops.fn_pgtap_crea_ddt_da_ordine(text, config.stati_doc_ddt.codice_interno%TYPE, anagrafiche.billing_account.id%TYPE, vendite.ordini_righe.qta_operativa%TYPE, vendite.ordini_righe.prezzo_unitario%TYPE, catalogo.articoli.id%TYPE, vendite.ordini.fatturazione_trigger%TYPE, vendite.ordini.id%TYPE, vendite.ddt_righe.qta_operativa%TYPE, jsonb, vendite.ddt.data%TYPE, config.causali_trasporto.codice%TYPE);
