# ⭐ dbops.fn_run_automations_delete_block: UN GUASTO DELL'AMBIENTE ESCE COL SUO SQLSTATE.
#   Brief: brief-db-presidio-job-run-a-chi-tocca (§10.1, D8, D10, D11)
#
# Il gestore `WHEN others` (un gestore: E_DELETE_BLOCK) catturava QUALUNQUE errore della
# DDL generata e lo rilanciava come P0001 col codice dell'involucro. Un 42501
# (manca un diritto) o un 55P03 (lock) arrivava al giornale dei job come difetto
# del programma, e il presidio lo mandava allo sviluppo.
#   ⇒ Se script.fn_sqlstate_di_ambiente(SQLSTATE) dice si':
#       1. fn_log_error_only con lo stesso codice e contesto (D11: il contesto,
#          cioe' quale tabella e quale trigger, serve a chi rimedia);
#       2. RAISE; senza argomenti, che rilancia l'eccezione ORIGINALE.
#     Altrimenti l'involucro di prima, invariato.
#   Il contesto si costruisce una volta (v_ctx_errore, ancorata a
#   dbops.error_log.context%TYPE) e serve le due chiamate: due copie dello
#   stesso jsonb_build_object prima o poi divergerebbero.
#   ⚠️ La decisione sta nel predicato (20261016-44). Il rilancio NON si puo'
#   estrarre in una funzione: RAISE; vive solo dentro il gestore.
#
# Firma invariata. ⚠️ Corpo dal doc auto-generato (allineato al database);
#   cambiano DECLARE e il gestore. COMMENT vivo con la revisione in coda.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261016-52-update-fn-run-automations-delete-block-ambiente-rilancia-mctit.yaml

  - changeSet:
      id: 20261016-52-update-fn-run-automations-delete-block-ambiente-rilancia
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.fn_run_automations_delete_block: nel gestore WHEN others un guasto dell'ambiente si scrive nel registro
        errori e si rilancia com'e' (SQLSTATE originale), gli altri escono col codice di prima.
        Brief: brief-db-presidio-job-run-a-chi-tocca D8, D11.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_proc p
               WHERE p.oid = to_regprocedure('script.fn_sqlstate_di_ambiente(text)')
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_run_automations_delete_block(p_exec_mode text, p_schemas text[], p_dry_run boolean)
               RETURNS void
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                -- ⭐ Rev 2026-10-16: il contesto dell'errore, costruito una volta e usato
                --   dalle due chiamate del gestore (registro e involucro).
                v_ctx_errore dbops.error_log.context%TYPE;
                v_schemas text[];
                rconf record;
                rel regclass;
                v_trigger_name text;
              BEGIN
                v_schemas := dbops.fn_resolve_scope(p_schemas);

                FOR rconf IN
                  SELECT d.*
                    FROM dbops.automation_delete_block d
                   WHERE d.enabled
                     AND d.schema_name = ANY(v_schemas)
                     AND dbops.fn_table_in_scope(d.schema_name, d.table_name)
                   ORDER BY d.id
                LOOP
                  rel := to_regclass(format('%I.%I', rconf.schema_name, rconf.table_name));
                  IF rel IS NULL THEN
                    IF p_dry_run THEN
                      PERFORM dbops.fn_audit_log_once(
                        p_function_name => 'dbops.fn_run_automations_delete_block',
                        p_status        => 'DRYRUN',
                        p_rule_type     => 'DELETE_BLOCK',
                        p_exec_mode     => p_exec_mode,
                        p_parts         => ARRAY['DELETE_BLOCK'],
                        p_dry_run       => true,
                        p_params        => jsonb_build_object(
                                            'action','SKIP',
                                            'reason','TABLE_NOT_FOUND',
                                            'table', rconf.schema_name||'.'||rconf.table_name
                                          ),
                        p_message       => 'Skip: table not found'
                      );
                    END IF;
                    CONTINUE;
                  END IF;

                  v_trigger_name := COALESCE(
                    rconf.trigger_name,
                    format('trg_%s_a10_delete_block_dlt', rconf.table_name)
                  );

                  IF dbops.fn_trigger_exists_by_name(rel, v_trigger_name) THEN
                    CONTINUE;
                  END IF;

                  IF p_dry_run THEN
                    PERFORM dbops.fn_audit_log_once(
                      p_function_name => 'dbops.fn_run_automations_delete_block',
                      p_status        => 'DRYRUN',
                      p_rule_type     => 'DELETE_BLOCK',
                      p_exec_mode     => p_exec_mode,
                      p_parts         => ARRAY['DELETE_BLOCK'],
                      p_dry_run       => true,
                      p_params        => jsonb_build_object(
                                          'table', rconf.schema_name||'.'||rconf.table_name,
                                          'trigger', v_trigger_name,
                                          'guc_key', rconf.guc_key,
                                          'action','DRYRUN_CREATE_TRIGGER'
                                        ),
                      p_message       => 'Trigger would be created'
                    );
                  ELSE
                    BEGIN
                      PERFORM dbops.fn_apply_delete_block_trigger(
                        rconf.schema_name,
                        rconf.table_name,
                        rconf.guc_key,
                        rconf.trigger_name
                      );
                    EXCEPTION WHEN others THEN
                      -- ⭐ Rev 2026-10-16 (brief-db-presidio-job-run-a-chi-tocca D8, D10, D11):
                      --   un guasto dell'AMBIENTE (script.fn_sqlstate_di_ambiente: connessione,
                      --   risorse, arresto, sistema, privilegio, lock) si rilancia COM'E', col suo
                      --   SQLSTATE: l'involucro lo faceva diventare P0001, e il presidio dei job lo
                      --   mandava allo sviluppo. Prima si scrive nel registro errori, col contesto.
                      v_ctx_errore := jsonb_build_object(
                          'where','DELETE_BLOCK',
                          'table', rconf.schema_name||'.'||rconf.table_name,
                          'error', SQLERRM
                        );
                      IF script.fn_sqlstate_di_ambiente(SQLSTATE) THEN
                        PERFORM script.fn_log_error_only(
                            'dbops', 'run_automations', 'E_DELETE_BLOCK',
                            v_ctx_errore, NULL::uuid, SQLERRM);
                        RAISE;
                      END IF;
                      PERFORM script.fn_log_and_raise_error(
                          'dbops', 'run_automations', 'E_DELETE_BLOCK',
                          v_ctx_errore, NULL::uuid, SQLERRM);
                    END;
                  END IF;
                END LOOP;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_run_automations_delete_block(p_exec_mode text, p_schemas text[], p_dry_run boolean)
              IS 'Applica i trigger DELETE_BLOCK configurati in dbops.automation_delete_block. ⭐ Rev 2026-10-16: nel gestore WHEN others, un guasto dell''AMBIENTE (script.fn_sqlstate_di_ambiente: 08, 53, 57, 58, 42501, 55P03) si rilancia COM''E'', col suo SQLSTATE, dopo averlo scritto nel registro errori con lo stesso codice e contesto (fn_log_error_only). Prima diventava P0001 col codice dell''involucro, e il presidio dei job (maintenance.vw_job_run_da_guardare) lo mandava allo sviluppo. I difetti di struttura escono come prima. Brief: brief-db-presidio-job-run-a-chi-tocca D8, D11.';
      rollback:
        - sql:
            dbms: postgresql
            sql: |
              -- Il verso di ritiro e' un changeSet nuovo (corpo di prima dal doc auto-generato).
              SELECT 1;
