# IL PRESIDIO C1 COSTAVA MEZZO SECONDO A CHIAMATA — e il suo pgTAP la chiama 17 volte
#   rev di dbops.vw_stati_check_scrittori (20260921-16)
#   ⛔ Stesso risultato, riga per riga: cambia COME si cerca, non che cosa si trova.
#
# -- LA MISURA, CON LA SUA DATA -------------------------------------------------------------------
#   2026-09-22, dbdev: una chiamata della vista ~535 ms; il suo pgTAP
#   (dbops/test-stati-check-scrittori-v1) ~8,3 s, perche' interroga le due viste
#   diciassette volte. Dentro i 535 ms: ~190 ms il CTE `scrittori`, ~340 ms
#   `indiretti`.
#   Dopo questa rev: **~230 ms** a chiamata, e il pgTAP **3,7 s**. Col secondo
#   rimedio — il test prende DUE fotografie invece di diciassette interrogazioni,
#   una per ciascuno dei suoi due momenti — scende a **1,2 s**. I due rimedi sono
#   indipendenti: col test nuovo e la vista vecchia sono 2,3 s.
#
# -- IL DIFETTO DI FORMA: PROVARE OGNI COPPIA -----------------------------------------------------
#   Tutti e due i CTE erano un prodotto cartesiano con un test testuale per
#   coppia:
#     scrittori  = 29 tabelle x 2250 funzioni   -> 65 000 regex sul sorgente
#     indiretti  = 242 coppie x 2250 funzioni   -> 545 000 strpos sul sorgente
#   ⭐ La forma giusta e' l'opposta, ed e' la stessa lezione del join sotto
#   policy: **si estrae una volta e poi si confronta per uguaglianza**.
#     * `scritture`: da ogni funzione si estraggono UNA volta i nomi qualificati
#       che scrive (`UPDATE|INSERT INTO|MERGE INTO <schema>.<tabella>`), e si
#       uniscono alle colonne di stato per uguaglianza. L'identificatore estratto
#       e' massimale, quindi `magazzino.inventari_righe` non si confonde con
#       `magazzino.inventari`: e' lo stesso lavoro che faceva il `\M` della regex
#       vecchia;
#     * `funzioni_citanti`: un solo passaggio con l'alternativa di TUTTI i
#       letterali di stato tiene le poche funzioni che ne nominano almeno uno; il
#       dettaglio a coppie gira poi su quel sottoinsieme.
#   ⚠️ I letterali entrano nell'alternativa **escapati**: un valore di stato con
#   dentro un metacarattere oggi non c'e', ma «oggi non c'e'» non e' una ragione.
#
# -- CHE COSA NON CAMBIA --------------------------------------------------------------------------
#   Il perimetro (le colonne di stato col CHECK a lista), i cinque esiti,
#   `scrittori_fn` / `scrittori_indiretti` / i nomi, il ramo DEBITO_ESTINTO e la
#   coda UNION ALL delle dichiarazioni orfane. ⛔ Il criterio resta quello che e':
#   **testuale**, coi suoi due limiti gia' dichiarati nel pgTAP (la trappola 1 al
#   test 6, il punto cieco a tre salti al test 9). Questa rev non lo allarga e non
#   lo stringe — solo, non lo paga 545 000 volte.
#
# -- PROVA DI EQUIVALENZA -------------------------------------------------------------------------
#   Vecchia e nuova confrontate con EXCEPT nei due versi sul catalogo vivo di
#   dbdev: zero righe di differenza (114 righe per parte). Ed e' una prova di
#   REFACTOR, non del criterio: quello lo provano i test 4..14 del pgTAP, che i
#   casi se li COSTRUISCONO.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20260922-23-update-vw-stati-check-scrittori-estrai-una-volta-mctit.yaml

  - changeSet:
      id: 20260922-23-update-vw-stati-check-scrittori-estrai-una-volta
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.vw_stati_check_scrittori: stessa misura, estratta una volta sola invece che provata
        per coppia (i nomi scritti da ogni funzione, i letterali citati in un passaggio solo).
        Output identico riga per riga; il costo scende da ~535 ms a chiamata. Brief:
        brief-db-presidio-stati-mai-scritti (§3-bis), ricaduta del Lotto 2-bis di magazzino.
      preConditions:
        - onFail: HALT
        - and:
            - viewExists:
                schemaName: dbops
                viewName: vw_stati_check_scrittori
            - tableExists:
                schemaName: dbops
                tableName: stati_check_dichiarazioni
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- ⚠️ Nessun WITH (security_invoker): la vista non lo ha, e un refactor
              --    non cambia la postura di lettura — cambierebbe CHI vede che cosa.
              CREATE OR REPLACE VIEW dbops.vw_stati_check_scrittori AS
              WITH colonne AS (
                  -- Le colonne di STATO con un CHECK a lista di valori. Il perimetro si
                  -- legge dal vincolo, non da un elenco scritto a mano.
                  SELECT n.nspname::text AS schema_tabella,
                         c.relname::text AS nome_tabella,
                         a.attname::text AS colonna,
                         k.oid           AS con_oid,
                         k.conname::text AS vincolo,
                         substring(pg_get_expr(d.adbin, d.adrelid), '^''([^'']*)''') AS valore_default
                    FROM pg_constraint k
                    JOIN pg_class c ON c.oid = k.conrelid
                    JOIN pg_namespace n ON n.oid = c.relnamespace
                    JOIN pg_attribute a ON a.attrelid = c.oid AND a.attnum = k.conkey[1]
                    LEFT JOIN pg_attrdef d ON d.adrelid = c.oid AND d.adnum = a.attnum
                   WHERE k.contype = 'c'
                     AND array_length(k.conkey, 1) = 1
                     AND c.relkind = ANY (ARRAY['r'::"char", 'p'::"char"])
                     AND n.nspname <> ALL (ARRAY['pg_catalog'::name, 'information_schema'::name])
                     AND pg_get_constraintdef(k.oid) ~ '= ANY \(\(?ARRAY\['
                     AND (a.attname ~ '^stato(_|$)' OR a.attname = 'status'
                          OR a.attname = 'esito' OR a.attname = 'severity')
              ), valori AS (
                  SELECT co.schema_tabella, co.nome_tabella, co.colonna, co.con_oid, co.vincolo,
                         co.valore_default,
                         m.m[1] AS valore,
                         '''' || m.m[1] || '''' AS letterale
                    FROM colonne co,
                         LATERAL regexp_matches(pg_get_constraintdef(co.con_oid), '''([^'']*)''::', 'g') m(m)
              ), funzioni AS MATERIALIZED (
                  -- Il sorgente SENZA commenti: un commento che nomina una tabella o un
                  -- valore non e' codice, e contarlo sarebbe il difetto che questa vista
                  -- cerca di misurare.
                  SELECT p.oid,
                         p.proname::text AS proname,
                         pn.nspname::text || '.' || p.proname::text AS funzione,
                         regexp_replace(regexp_replace(p.prosrc, '/\*.*?\*/', '', 'g'), '--[^\n]*', '', 'g') AS sorgente
                    FROM pg_proc p
                    JOIN pg_namespace pn ON pn.oid = p.pronamespace
                    JOIN pg_language l ON l.oid = p.prolang
                   WHERE pn.nspname <> ALL (ARRAY['pg_catalog'::name, 'information_schema'::name])
                     AND l.lanname = ANY (ARRAY['plpgsql'::name, 'sql'::name])
              ), scritture AS MATERIALIZED (
                  -- ⭐ SI ESTRAE UNA VOLTA, POI SI CONFRONTA PER UGUAGLIANZA. Prima si
                  --   provava ogni coppia (tabella, funzione) con una regex: 29 x 2250.
                  --   L'identificatore estratto e' MASSIMALE, quindi inventari_righe non
                  --   si confonde con inventari — e' il lavoro che faceva il \M.
                  SELECT f.oid, f.proname, f.funzione, f.sorgente,
                         lower(m.m[3]) AS tabella_scritta
                    FROM funzioni f,
                         LATERAL regexp_matches(
                             f.sorgente,
                             '(?i)(update|insert\s+into|merge\s+into)\s+(only\s+)?([a-z_][a-z0-9_$]*\.[a-z_][a-z0-9_$]*)',
                             'g') m(m)
              ), scrittori AS MATERIALIZED (
                  SELECT DISTINCT t.schema_tabella, t.nome_tabella,
                         s.oid, s.proname, s.funzione, s.sorgente
                    FROM (SELECT DISTINCT schema_tabella, nome_tabella FROM colonne) t
                    JOIN scritture s ON s.tabella_scritta = t.schema_tabella || '.' || t.nome_tabella
              ), letterali AS (
                  -- Un solo passaggio sui sorgenti, con l'alternativa di tutti i valori.
                  -- ⚠️ Escapati: un valore di stato con un metacarattere oggi non c'e',
                  --    ma «oggi non c'e'» non e' una ragione per non escaparlo.
                  SELECT '''(' || string_agg(DISTINCT regexp_replace(v.valore, '([.^$|()\[\]{}*+?\\-])', '\\\&', 'g'), '|') || ')''' AS rx
                    FROM valori v
              ), funzioni_citanti AS MATERIALIZED (
                  SELECT f.* FROM funzioni f, letterali l WHERE f.sorgente ~ l.rx
              ), diretti AS (
                  -- Scrive la tabella E nomina il letterale.
                  SELECT v.con_oid, v.valore, s.funzione
                    FROM valori v
                    JOIN scrittori s ON s.schema_tabella = v.schema_tabella
                                    AND s.nome_tabella = v.nome_tabella
                                    AND strpos(s.sorgente, v.letterale) > 0
              ), indiretti AS (
                  -- Il secondo salto: chi passa il letterale a uno scrittore posizionale.
                  SELECT DISTINCT v.con_oid, v.valore, c.funzione
                    FROM valori v
                    JOIN scrittori s ON s.schema_tabella = v.schema_tabella
                                    AND s.nome_tabella = v.nome_tabella
                    JOIN funzioni_citanti c ON c.oid <> s.oid
                                           AND strpos(c.sorgente, v.letterale) > 0
                                           AND strpos(c.sorgente, s.proname) > 0
                                           AND c.sorgente ~ ('\m' || s.proname || '\s*\([^;]*' || v.letterale)
              ), misura AS (
                  SELECT v.schema_tabella, v.nome_tabella, v.colonna, v.vincolo, v.valore,
                         v.valore_default = v.valore AS ha_default,
                         (SELECT count(*)::integer FROM diretti x
                           WHERE x.con_oid = v.con_oid AND x.valore = v.valore) AS scrittori_fn,
                         (SELECT count(*)::integer FROM indiretti x
                           WHERE x.con_oid = v.con_oid AND x.valore = v.valore) AS scrittori_indiretti,
                         (SELECT string_agg(DISTINCT x.funzione, ', ' ORDER BY x.funzione)
                            FROM (SELECT diretti.funzione FROM diretti
                                   WHERE diretti.con_oid = v.con_oid AND diretti.valore = v.valore
                                  UNION ALL
                                  SELECT indiretti.funzione FROM indiretti
                                   WHERE indiretti.con_oid = v.con_oid AND indiretti.valore = v.valore) x) AS scrittori_nomi,
                         (SELECT string_agg(DISTINCT s.funzione, ', ' ORDER BY s.funzione)
                            FROM scrittori s
                           WHERE s.schema_tabella = v.schema_tabella
                             AND s.nome_tabella = v.nome_tabella) AS scrittori_tabella
                    FROM valori v
              )
              SELECT m.schema_tabella, m.nome_tabella, m.colonna, m.vincolo, m.valore,
                     m.ha_default, m.scrittori_fn, m.scrittori_indiretti, m.scrittori_nomi,
                     m.scrittori_tabella,
                     CASE
                         WHEN m.scrittori_fn > 0 OR m.scrittori_indiretti > 0
                             THEN CASE WHEN d.id IS NULL THEN 'SCRITTO' ELSE 'DEBITO_ESTINTO' END
                         WHEN m.ha_default
                             THEN CASE WHEN d.id IS NULL THEN 'SCRITTO_DA_DEFAULT' ELSE 'DEBITO_ESTINTO' END
                         WHEN d.id IS NULL THEN 'NON_DICHIARATO'
                         WHEN d.canale = 'APPLICAZIONE' THEN 'DICHIARATO_APPLICAZIONE'
                         ELSE 'ESENTE'
                     END AS esito,
                     d.canale, d.ragione, d.data_registrazione
                FROM misura m
                LEFT JOIN dbops.stati_check_dichiarazioni d
                       ON d.schema_tabella = m.schema_tabella
                      AND d.nome_tabella = m.nome_tabella
                      AND d.colonna = m.colonna
                      AND d.valore = m.valore
              UNION ALL
              -- Le dichiarazioni rimaste senza il loro valore (uscito dal CHECK).
              SELECT d.schema_tabella, d.nome_tabella, d.colonna,
                     NULL::text AS vincolo, d.valore,
                     NULL::boolean AS ha_default,
                     NULL::integer AS scrittori_fn,
                     NULL::integer AS scrittori_indiretti,
                     NULL::text AS scrittori_nomi,
                     NULL::text AS scrittori_tabella,
                     'DEBITO_ESTINTO' AS esito,
                     d.canale, d.ragione, d.data_registrazione
                FROM dbops.stati_check_dichiarazioni d
               WHERE NOT EXISTS (SELECT 1 FROM valori v
                                  WHERE v.schema_tabella = d.schema_tabella
                                    AND v.nome_tabella = d.nome_tabella
                                    AND v.colonna = d.colonna
                                    AND v.valore = d.valore);

              COMMENT ON VIEW dbops.vw_stati_check_scrittori IS
                  'PRESIDIO C1 — uno stato previsto dal modello (nel CHECK a lista di una colonna '
                  'di stato) e mai scritto. Una riga per (colonna, valore) con il suo esito: '
                  'SCRITTO (una funzione scrive la tabella e nomina il letterale, oppure lo passa '
                  'a uno scrittore posizionale: il secondo salto), SCRITTO_DA_DEFAULT, '
                  'DICHIARATO_APPLICAZIONE / ESENTE (sta in dbops.stati_check_dichiarazioni), '
                  'NON_DICHIARATO (il debito da sanare) e DEBITO_ESTINTO nei due versi. '
                  '⚠️ Il criterio e'' TESTUALE e ha due limiti, dichiarati nel suo pgTAP: '
                  'nominare non e'' scrivere (test 6) e a tre salti il letterale non si segue '
                  'piu'' (test 9). ⭐ Rev 2026-09-22: stessa misura, estratta UNA volta invece '
                  'che provata per coppia — i nomi scritti da ogni funzione e i letterali citati '
                  'si ricavano con un passaggio solo, poi si confrontano per uguaglianza. Output '
                  'identico riga per riga (EXCEPT nei due versi su dbdev), costo per chiamata da '
                  '~535 ms a ~230 ms. '
                  'Brief: brief-db-presidio-stati-mai-scritti §3-bis.';

              GRANT SELECT ON dbops.vw_stati_check_scrittori TO zeroerp_app;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- La definizione precedente (20260921-16), ripresa dal catalogo vivo.
              CREATE OR REPLACE VIEW dbops.vw_stati_check_scrittori AS
               WITH colonne AS (
                       SELECT n.nspname::text AS schema_tabella,
                          c.relname::text AS nome_tabella,
                          a.attname::text AS colonna,
                          k.oid AS con_oid,
                          k.conname::text AS vincolo,
                          "substring"(pg_get_expr(d.adbin, d.adrelid), '^''([^'']*)'''::text) AS valore_default
                         FROM pg_constraint k
                           JOIN pg_class c ON c.oid = k.conrelid
                           JOIN pg_namespace n ON n.oid = c.relnamespace
                           JOIN pg_attribute a ON a.attrelid = c.oid AND a.attnum = k.conkey[1]
                           LEFT JOIN pg_attrdef d ON d.adrelid = c.oid AND d.adnum = a.attnum
                        WHERE k.contype = 'c'::"char" AND array_length(k.conkey, 1) = 1 AND (c.relkind = ANY (ARRAY['r'::"char", 'p'::"char"])) AND (n.nspname <> ALL (ARRAY['pg_catalog'::name, 'information_schema'::name])) AND pg_get_constraintdef(k.oid) ~ '= ANY \(\(?ARRAY\['::text AND (a.attname ~ '^stato(_|$)'::text OR a.attname = 'status'::name OR a.attname = 'esito'::name OR a.attname = 'severity'::name)
                      ), valori AS (
                       SELECT co.schema_tabella,
                          co.nome_tabella,
                          co.colonna,
                          co.con_oid,
                          co.vincolo,
                          co.valore_default,
                          m.m[1] AS valore,
                          (''''::text || m.m[1]) || ''''::text AS letterale
                         FROM colonne co,
                          LATERAL regexp_matches(pg_get_constraintdef(co.con_oid), '''([^'']*)''::'::text, 'g'::text) m(m)
                      ), funzioni AS MATERIALIZED (
                       SELECT p.oid,
                          p.proname::text AS proname,
                          (pn.nspname::text || '.'::text) || p.proname::text AS funzione,
                          regexp_replace(regexp_replace(p.prosrc, '/\*.*?\*/'::text, ''::text, 'g'::text), '--[^\n]*'::text, ''::text, 'g'::text) AS sorgente
                         FROM pg_proc p
                           JOIN pg_namespace pn ON pn.oid = p.pronamespace
                           JOIN pg_language l ON l.oid = p.prolang
                        WHERE (pn.nspname <> ALL (ARRAY['pg_catalog'::name, 'information_schema'::name])) AND (l.lanname = ANY (ARRAY['plpgsql'::name, 'sql'::name]))
                      ), scrittori AS MATERIALIZED (
                       SELECT t.schema_tabella,
                          t.nome_tabella,
                          f.oid,
                          f.proname,
                          f.funzione,
                          f.sorgente
                         FROM ( SELECT DISTINCT colonne.schema_tabella,
                                  colonne.nome_tabella
                                 FROM colonne) t
                           JOIN funzioni f ON strpos(lower(f.sorgente), (t.schema_tabella || '.'::text) || t.nome_tabella) > 0 AND f.sorgente ~* (((('(UPDATE|INSERT\s+INTO|MERGE\s+INTO)\s+(ONLY\s+)?'::text || t.schema_tabella) || '\.'::text) || t.nome_tabella) || '\M'::text)
                      ), diretti AS (
                       SELECT v.con_oid,
                          v.valore,
                          s.funzione
                         FROM valori v
                           JOIN scrittori s ON s.schema_tabella = v.schema_tabella AND s.nome_tabella = v.nome_tabella AND strpos(s.sorgente, v.letterale) > 0
                      ), indiretti AS (
                       SELECT DISTINCT v.con_oid,
                          v.valore,
                          c.funzione
                         FROM valori v
                           JOIN funzioni c ON strpos(c.sorgente, v.letterale) > 0
                           JOIN scrittori s ON s.schema_tabella = v.schema_tabella AND s.nome_tabella = v.nome_tabella AND s.oid <> c.oid AND strpos(c.sorgente, s.proname) > 0 AND c.sorgente ~ ((('\m'::text || s.proname) || '\s*\([^;]*'::text) || v.letterale)
                      ), misura AS (
                       SELECT v.schema_tabella,
                          v.nome_tabella,
                          v.colonna,
                          v.vincolo,
                          v.valore,
                          v.valore_default = v.valore AS ha_default,
                          ( SELECT count(*)::integer AS count
                                 FROM diretti x
                                WHERE x.con_oid = v.con_oid AND x.valore = v.valore) AS scrittori_fn,
                          ( SELECT count(*)::integer AS count
                                 FROM indiretti x
                                WHERE x.con_oid = v.con_oid AND x.valore = v.valore) AS scrittori_indiretti,
                          ( SELECT string_agg(DISTINCT x.funzione, ', '::text ORDER BY x.funzione) AS string_agg
                                 FROM ( SELECT diretti.funzione
                                         FROM diretti
                                        WHERE diretti.con_oid = v.con_oid AND diretti.valore = v.valore
                                      UNION ALL
                                       SELECT indiretti.funzione
                                         FROM indiretti
                                        WHERE indiretti.con_oid = v.con_oid AND indiretti.valore = v.valore) x) AS scrittori_nomi,
                          ( SELECT string_agg(DISTINCT s.funzione, ', '::text ORDER BY s.funzione) AS string_agg
                                 FROM scrittori s
                                WHERE s.schema_tabella = v.schema_tabella AND s.nome_tabella = v.nome_tabella) AS scrittori_tabella
                         FROM valori v
                      )
               SELECT m.schema_tabella,
                  m.nome_tabella,
                  m.colonna,
                  m.vincolo,
                  m.valore,
                  m.ha_default,
                  m.scrittori_fn,
                  m.scrittori_indiretti,
                  m.scrittori_nomi,
                  m.scrittori_tabella,
                      CASE
                          WHEN m.scrittori_fn > 0 OR m.scrittori_indiretti > 0 THEN
                          CASE
                              WHEN d.id IS NULL THEN 'SCRITTO'::text
                              ELSE 'DEBITO_ESTINTO'::text
                          END
                          WHEN m.ha_default THEN
                          CASE
                              WHEN d.id IS NULL THEN 'SCRITTO_DA_DEFAULT'::text
                              ELSE 'DEBITO_ESTINTO'::text
                          END
                          WHEN d.id IS NULL THEN 'NON_DICHIARATO'::text
                          WHEN d.canale = 'APPLICAZIONE'::text THEN 'DICHIARATO_APPLICAZIONE'::text
                          ELSE 'ESENTE'::text
                      END AS esito,
                  d.canale,
                  d.ragione,
                  d.data_registrazione
                 FROM misura m
                   LEFT JOIN dbops.stati_check_dichiarazioni d ON d.schema_tabella = m.schema_tabella AND d.nome_tabella = m.nome_tabella AND d.colonna = m.colonna AND d.valore = m.valore
              UNION ALL
               SELECT d.schema_tabella,
                  d.nome_tabella,
                  d.colonna,
                  NULL::text AS vincolo,
                  d.valore,
                  NULL::boolean AS ha_default,
                  NULL::integer AS scrittori_fn,
                  NULL::integer AS scrittori_indiretti,
                  NULL::text AS scrittori_nomi,
                  NULL::text AS scrittori_tabella,
                  'DEBITO_ESTINTO'::text AS esito,
                  d.canale,
                  d.ragione,
                  d.data_registrazione
                 FROM dbops.stati_check_dichiarazioni d
                WHERE NOT (EXISTS ( SELECT 1
                         FROM valori v
                        WHERE v.schema_tabella = d.schema_tabella AND v.nome_tabella = d.nome_tabella AND v.colonna = d.colonna AND v.valore = d.valore));
