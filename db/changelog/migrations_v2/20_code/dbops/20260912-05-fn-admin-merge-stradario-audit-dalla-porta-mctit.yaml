# `dbops.fn_admin_merge_stradario` scrive l'audit DALLA PORTA — decisione (a), 12-09-2026.
#   Brief: brief-db-rls-storico-scope-congelato.md §4d
#
# Era una delle due sole funzioni del database che scrivevano dbops.audit_log
# «a mano»: INSERT diretto seguito da UPDATE di chiusura. Tre cose non andavano:
#   1. lo status iniziale era 'STARTED', che `chk_audit_status` NON ammette
#      (START, OK, ERROR, DRYRUN, WARN): la funzione falliva alla PRIMA riga;
#   2. l'UPDATE di chiusura l'applicazione non puo' piu' farlo (REVOKE del
#      2026-09-11): se un giorno la chiamasse amm_software, morirebbe li';
#   3. nel ramo ERROR l'UPDATE veniva annullato dal RAISE che segue: la riga di
#      errore non e' mai esistita.
# Ora: UNA chiamata a fn_audit_log_once a fine lavoro, con esito, conteggio dei
# ripuntati e durata nel result — come le altre 17 funzioni di dbops. Il ramo
# ERROR resta per il canale fuori transazione (dblink).
#
# ⚠️ Le tre validazioni sollevano ancora RAISE EXCEPTION in chiaro, senza codice
#   registrato. Non si tocca qui: e' uno strumento DBA senza chiamanti
#   applicativi, e coniare tre codici (con messaggi e rigenerazione BE) e' un
#   altro lavoro — debito registrato nel brief.
#
# ⭐ Corpo dalla doc auto-gen; firma a %TYPE (identita' invariata:
#   integer, integer, character, date, text).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20260912-05-fn-admin-merge-stradario-audit-dalla-porta-mctit.yaml

  - changeSet:
      id: 20260912-05-fn-admin-merge-stradario-audit-dalla-porta
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.fn_admin_merge_stradario: l'audit si scrive dalla porta fn_audit_log_once,
        una volta a fine lavoro, invece di INSERT diretto (status STARTED, non
        ammesso dal CHECK) e UPDATE di chiusura (che l'app non puo' piu' fare).
        Identita' invariata, firma a %TYPE. Brief
        brief-db-rls-storico-scope-congelato §4d.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'dbops' AND p.proname = 'fn_admin_merge_stradario';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_admin_merge_stradario(
                  p_id_orig    config.stradario.id%TYPE,
                  p_id_target  config.stradario.id%TYPE,
                  p_event_type storico.stradario_trasformazioni.tipo_evento%TYPE DEFAULT 'F',
                  p_event_date storico.stradario_trasformazioni.data_evento%TYPE DEFAULT CURRENT_DATE,
                  p_note       storico.stradario_trasformazioni.note%TYPE        DEFAULT NULL
              )
              RETURNS void
              LANGUAGE plpgsql
              AS $function$
              -- Scopo: fondere due vie (config.stradario): registra la trasformazione in
              --   storico.stradario_trasformazioni e ripunta chi riferiva l'origine sulla
              --   destinazione. Strumento DBA.
              --
              -- rev 2026-09-12 (brief-db-rls-storico-scope-congelato §4d, decisione a): il
              --   registro dbops.audit_log si scrive dalla PORTA fn_audit_log_once, una volta
              --   a fine lavoro, come le altre funzioni di dbops. Prima: INSERT diretto con
              --   status 'STARTED' — che chk_audit_status NON ammette, quindi la funzione
              --   falliva alla prima riga — e UPDATE di chiusura, che l'applicazione non puo'
              --   piu' fare (REVOKE del 2026-09-11) e che nel ramo ERROR veniva comunque
              --   annullato dal RAISE. Il ramo ERROR resta per la scrittura fuori transazione
              --   (dblink), dove ha senso; in transazione si annulla col resto, com'era.
              DECLARE
                v_start_ts  timestamptz := clock_timestamp();
                v_ripuntati integer := 0;
                v_params    jsonb := jsonb_build_object(
                    'p_id_orig',    p_id_orig,
                    'p_id_target',  p_id_target,
                    'p_event_type', p_event_type,
                    'p_event_date', p_event_date,
                    'p_note',       p_note);
              BEGIN
                -- Validazioni. ⚠️ Messaggi in chiaro, senza codice registrato: e' uno
                -- strumento DBA che oggi nessuno chiama dall'applicazione. Quando lo fara',
                -- i tre motivi vanno a catalogo (debito registrato nel brief).
                IF p_id_orig = p_id_target THEN
                  RAISE EXCEPTION 'Origine e destinazione devono differire';
                END IF;
                PERFORM 1 FROM config.stradario WHERE id = p_id_orig;
                IF NOT FOUND THEN
                  RAISE EXCEPTION 'Stradario % non trovato', p_id_orig;
                END IF;
                PERFORM 1 FROM config.stradario WHERE id = p_id_target;
                IF NOT FOUND THEN
                  RAISE EXCEPTION 'Stradario % non trovato', p_id_target;
                END IF;

                -- La trasformazione, nel suo registro (non e' una shadow: e' il registro
                -- delle fusioni, letto da script.fn_get_vie_discendenti).
                INSERT INTO storico.stradario_trasformazioni(via_id_orig, via_id_nuovo, tipo_evento, data_evento, note)
                VALUES (p_id_orig, p_id_target, p_event_type, p_event_date, p_note);

                -- Propagazione: chi riferiva l'origine ora riferisce la destinazione.
                UPDATE anagrafiche.indirizzi_dettaglio
                   SET stradario_id = p_id_target
                 WHERE stradario_id = p_id_orig;
                GET DIAGNOSTICS v_ripuntati = ROW_COUNT;

                -- Audit dalla porta, una volta, con esito e conteggi.
                PERFORM dbops.fn_audit_log_once(
                  p_function_name => 'fn_admin_merge_stradario',
                  p_status        => 'OK',
                  p_params        => v_params,
                  p_rows_affected => v_ripuntati,
                  p_result        => jsonb_build_object('indirizzi_ripuntati', v_ripuntati,
                                                        'duration_ms', floor(extract(epoch from clock_timestamp() - v_start_ts) * 1000)),
                  p_message       => format('Stradario %s fuso in %s', p_id_orig, p_id_target));
              EXCEPTION WHEN OTHERS THEN
                -- In transazione questa riga si annulla col RAISE, com'era gia'; con il
                -- canale dblink acceso sopravvive, ed e' l'unico caso in cui serve.
                PERFORM dbops.fn_audit_log_once(
                  p_function_name => 'fn_admin_merge_stradario',
                  p_status        => 'ERROR',
                  p_params        => v_params,
                  p_message       => SQLERRM,
                  p_sqlstate      => SQLSTATE);
                RAISE;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_admin_merge_stradario(integer, integer, character, date, text) IS
                'Strumento DBA: fonde due vie di config.stradario — registra la trasformazione in storico.stradario_trasformazioni (il registro delle fusioni, non una shadow) e ripunta sulla destinazione chi riferiva l''origine. Rev 2026-09-12: l''audit si scrive dalla porta dbops.fn_audit_log_once, una volta a fine lavoro (prima: INSERT con status STARTED, non ammesso dal CHECK, e UPDATE di chiusura che l''app non puo'' piu'' fare). Le validazioni sollevano ancora messaggi in chiaro senza codice registrato: debito dichiarato, da saldare quando la funzione sara'' chiamata dall''applicazione. Brief: brief-db-rls-storico-scope-congelato §4d.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Il corpo precedente e' nella doc auto-gen alla revisione prima di
              -- questa. Non si riscrive un corpo stantio.
              SELECT 1;
