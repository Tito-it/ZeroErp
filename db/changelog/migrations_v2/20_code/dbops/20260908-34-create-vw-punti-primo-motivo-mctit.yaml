# V-0 — LA RISALITA PUNTO -> CHECK DIVENTA UN OGGETTO, E NON E' CODICE NUOVO
#
# ── ⭐ COSA SI ESTRAE, E DA DOVE ────────────────────────────────────
#   Questa derivazione esiste gia', scritta una volta e PROVATA PER MUTAZIONE:
#   e' la vista temporanea `punti_primo_motivo` dentro
#   db/pgtap/script/test-rubinetto-primo-motivo-v1.sql. Vive in `pg_temp`,
#   quindi ogni altro presidio che ne avesse bisogno se la ricopierebbe — ed e'
#   esattamente il modo in cui due presidi sullo stesso fatto cominciano a
#   dissentire senza che nessuno se ne accorga.
#
#   ⇒ Consumatori previsti: il rubinetto stesso (che la interroga invece di
#   ridefinirla), lo scanner dell'arita' dei messaggi (test 4-5 di
#   db/pgtap/script/test-catalogo-messaggi-errore-completo.sql, che oggi salta
#   questi punti con `CONTINUE WHEN v_code IS NULL`) e la lente
#   scripts/sql/check_messaggio_vs_condizione.sql.
#
# ── ⛔ COSA QUESTA VISTA NON SERVE ──────────────────────────────────
#   NON serve a dbops.vw_codici_errore_forme_condizione, e vale scriverlo qui
#   perche' e' l'errore che il brief ha fatto e corretto. Quella vista classifica
#   la FORMA DELLA GUARDIA sopra il punto; nel pattern §12.5 quella riga e'
#   sempre `IF jsonb_array_length(v_motivi) > 0 THEN`, identica ovunque, e non
#   dice niente sul perche'. Risalire di li' alla check e attribuirle i suoi
#   codici li archivierebbe TUTTI sotto IGNOTO — che lo snapshot del rubinetto
#   B-7 scarta (`WHERE NOT solo_ignoto`). Zero candidati nuovi, e una copertura
#   che SEMBRA cresciuta. La forma giusta e' un'altra ed e' nel changeSet -35:
#   si classifica dove il codice viene NOMINATO.
#
# ── ⭐ PESSIMISTA DI PROPOSITO ──────────────────────────────────────
#   I codici sono l'UNIONE di quelli nominati da TUTTE le fn_check_* citate nel
#   corpo, perche' la vista legge il testo e non sa quale ramo sia stato preso.
#   vendite.trgfn_commesse_guard_transizione ne sceglie una fra TRE con un CASE e
#   solleva da un punto solo; vendite.trgfn_ordini_guard_transizione ne nomina
#   due su due rami.
#   ⇒ Un presidio che scegliesse il ramo ottimista assolverebbe il caso che deve
#   segnalare. E un falso positivo qui costa UNA RIGA in piu' nel VARIADIC, non
#   un rifiuto sbagliato: e' il verso dell'errore che si sceglie di correre, ed
#   e' lo stesso gia' scelto da dbops.vw_codici_errore_da_dichiarare.
#
# ── ⚠️ IL MARCATORE E' `->> 'codice'`, NON `-> 0 ->> 'codice'` ──────
#   Costa ripeterlo perche' e' costato una prova per mutazione (§7.1 di
#   brief-db-coda-primo-motivo-in-un-posto-solo): col secondo, dieci siti su
#   dieci sfuggono, perche' usano la variabile d'appoggio
#   (`v_primo := v_motivi -> 0;` su una riga a se'). L'invariante vero e' «il
#   codice non e' un letterale, viene da un motivo».
#
# ── ⚠️ IL RAMO CIECO E' UN DATO, NON UN'ASSENZA ─────────────────────
#   Le LEFT JOIN sono volute: un punto che non si lega a nessuna fn_check_*
#   deve COMPARIRE con check_funzione NULL, non sparire. Un presidio che salta
#   cio' che non capisce diventa verde per sottrazione.
#
# ── ⚠️ `security_invoker` VA SPECIFICATO ────────────────────────────
#   PostgreSQL lo azzera a ogni CREATE OR REPLACE VIEW e la reloption non
#   compare in pg_get_viewdef: si perde in silenzio.
#
# Misura del 2026-09-08, provata in transazione su dbdev: 12 punti, 0 in
# perimetro, 0 rami ciechi — gli stessi numeri della vista temporanea che
# sostituisce; i due siti multi-check sono commesse (3 check, 4 codici) e
# ordini (2 check, 2 codici).
#
# Brief: brief-db-i-motivi-si-fermano-dentro-la-check.md (V-0)
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20260908-34-create-vw-punti-primo-motivo-mctit.yaml

  - changeSet:
      id: 20260908-34-create-vw-punti-primo-motivo
      author: mctit
      failOnError: true
      comment: >
        dbops.vw_punti_primo_motivo: sede unica della risalita «punto che
        solleva -> fn_check_* -> codici che quella nomina». Estratta dalla vista
        temporanea del rubinetto, dove nessun altro presidio poteva leggerla.
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: 1
                sql: >-
                  SELECT count(*) FROM pg_namespace WHERE nspname = 'dbops'
            - sqlCheck:
                expectedResult: 1
                sql: >-
                  SELECT count(*) FROM pg_proc p
                    JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'script'
                     AND p.proname = 'fn_raise_primo_motivo_se_presente'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              CREATE OR REPLACE VIEW dbops.vw_punti_primo_motivo
              WITH (security_invoker=true) AS
              WITH punti AS (
                  -- Un PUNTO: una funzione plpgsql che passa a
                  -- fn_log_and_raise_error un codice LETTO da un motivo
                  -- (`->> 'codice'`) invece che scritto come letterale.
                  SELECT (n.nspname)::text AS sch, (p.proname)::text AS fn,
                         p.oid, p.prosrc
                    FROM pg_proc p
                    JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname <> ALL (ARRAY['pg_catalog'::name, 'information_schema'::name])
                     AND p.prolang = (SELECT oid FROM pg_language WHERE lanname = 'plpgsql')
                     AND p.prosrc ~ 'fn_log_and_raise_error\s*\([^;]*->> ''codice'''
                     -- L'helper e' la SEDE della coda, non un suo residuo.
                     AND NOT (n.nspname = 'script' AND p.proname = 'fn_raise_primo_motivo_se_presente')
              ), legami AS (
                  -- TUTTE le fn_check_* nominate nel corpo, non solo quella
                  -- assegnata a `v_motivi`: un CASE ne sceglie una fra tre, e
                  -- un riconoscimento ancorato a `:=` la perderebbe.
                  SELECT DISTINCT pt.sch, pt.fn, m[1] AS csch, m[2] AS cfn
                    FROM punti pt
                    CROSS JOIN LATERAL regexp_matches(pt.prosrc, '(\w+)\.(fn_check_\w+)\s*\(', 'g') m
              ), check_viste AS (
                  SELECT l.sch, l.fn, l.csch, l.cfn,
                         (c.prosrc ~ '''valori''') AS emette_valori,
                         c.prosrc AS csrc
                    FROM legami l
                    JOIN pg_namespace cn ON cn.nspname = l.csch
                    JOIN pg_proc c ON c.proname = l.cfn AND c.pronamespace = cn.oid
              )
              SELECT pt.sch,
                     pt.fn,
                     ((pt.sch || '.'::text) || pt.fn) AS funzione,
                     cv.csch AS check_schema,
                     cv.cfn  AS check_funzione,
                     cv.emette_valori AS check_emette_valori,
                     -- I codici che quella check NOMINA come motivo. NULL se la
                     -- check non ne nomina nessuno, o se il punto non si lega a
                     -- nessuna check: e' il ramo cieco, e deve COMPARIRE.
                     (mc.m)[1] AS codice
                FROM punti pt
                LEFT JOIN check_viste cv ON cv.sch = pt.sch AND cv.fn = pt.fn
                LEFT JOIN LATERAL regexp_matches(cv.csrc, '''codice''\s*,\s*''(E_[A-Z0-9_]+)''', 'g') mc(m) ON true;

              COMMENT ON VIEW dbops.vw_punti_primo_motivo IS
              'I punti che sollevano il codice del PRIMO MOTIVO di una script.fn_check_* (linee-guida-sql §12.5.2), legati alla check da cui il motivo viene e ai codici che quella nomina. Una riga per (punto, check, codice).
              SEDE UNICA della risalita punto->check: prima viveva in una vista temporanea dentro db/pgtap/script/test-rubinetto-primo-motivo-v1.sql, quindi ogni altro presidio che ne avesse bisogno se la sarebbe ricopiata — ed e'' cosi'' che due presidi sullo stesso fatto cominciano a dissentire.
              COME SI USA. (A) il perimetro dell''helper: SELECT sch, fn, count(check_funzione) AS check_trovate, coalesce(bool_or(check_emette_valori), false) AS in_perimetro FROM dbops.vw_punti_primo_motivo GROUP BY 1,2; (B) i codici che un punto puo'' sollevare: SELECT DISTINCT funzione, codice FROM dbops.vw_punti_primo_motivo WHERE codice IS NOT NULL.
              ⭐ PESSIMISTA DI PROPOSITO, ed e'' la scelta portante: i codici sono l''UNIONE di quelli nominati da TUTTE le check citate nel corpo, perche'' la vista legge il testo e non sa quale ramo sia stato preso. Un presidio che scegliesse il ramo ottimista assolverebbe il caso che deve segnalare; e un falso positivo qui costa una riga in piu'' nel VARIADIC, non un rifiuto sbagliato.
              ⚠️ RAMO CIECO — un punto con check_funzione NULL non e'' «a posto»: e'' un sito che la lettura non sa legare alla sua check, e va visto. E'' il test 3 di test-rubinetto-primo-motivo-v1.sql.
              ⛔ NON serve a dbops.vw_codici_errore_forme_condizione: quella classifica la forma della GUARDIA, e sopra questi punti la guardia e'' sempre «IF jsonb_array_length(v_motivi) > 0», che non dice niente. Li'' si classifica dove il codice e'' NOMINATO (changeSet 20260908-35).
              ⚠️ E'' un''euristica su pg_proc.prosrc: riconosce la forma scritta, non il significato. Brief: docs/it/dev/work-in-progress/brief-db-i-motivi-si-fermano-dentro-la-check.md, passo V-0.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP VIEW IF EXISTS dbops.vw_punti_primo_motivo;
