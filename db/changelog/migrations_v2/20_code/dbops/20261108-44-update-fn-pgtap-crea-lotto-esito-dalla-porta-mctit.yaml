# dbops.fn_pgtap_crea_lotto: l'esito del gruppo trattenuto dalla porta del dominio.
#   Brief: brief-db-revisione-dbops, D67 e D73 (giro 8, blocco 8a).
#
# Base: doc auto-generata del 2026-11-07 (= 20_code/dbops/20261024-40).
#
# ⚠️ PERCHE'. L'esito era un INSERT su vendite.fatturazione_lotti_esiti accanto
#   alla porta vendite.fn_segna_esito_gruppo_lotto: un ERRORE senza
#   errore_quando, una forma che la pipeline non produce. Ora chiama la porta;
#   la porta non solleva, quindi la fixture controlla che abbia marcato il
#   gruppo. D73: lo stato chiesto da script.fn_doc_stato_id, piu' la condizione
#   del lotto (applica_lotto). Firma e risultato invariati. COMMENT al presente
#   (§5d). Presidio:
#   test 8 di dbops/test-fn-pgtap-crea-lotto-v1.
# ------------------------------------------------------------

