  - logicalFilePath: migrations_v2/20_code/dbops/20261108-44-update-fn-pgtap-crea-lotto-esito-dalla-porta-mctit.yaml

  - changeSet:
      id: 20261108-44-update-fn-pgtap-crea-lotto-esito-dalla-porta
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.fn_pgtap_crea_lotto: l'esito trattenuto da vendite.fn_segna_esito_gruppo_lotto (D67).
      preConditions:
        - onFail: HALT
        - sqlCheck:
