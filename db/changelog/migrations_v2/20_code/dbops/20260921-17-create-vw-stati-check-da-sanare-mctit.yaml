# brief-db-presidio-stati-mai-scritti §2.4 — LA LISTA DI LAVORO del presidio
# C1: la misura (20260921-16) filtrata sui due esiti che chiedono un gesto.
#
# ── ⭐ PERCHE' UNA SECONDA VISTA E NON UN WHERE NEL TEST ──────────────
#   E' la forma di `vw_riferimenti_morti_da_sanare` accanto alla sua misura:
#   la riga di `dbops.presidi` (natura CANCELLO) punta QUI, e `fn_conta_presidio`
#   conta questa vista intera — «diverso da zero» e' il rosso. La misura resta
#   consultabile per intero, con i sani, per capire COME un valore risulta
#   scritto (scrittori_nomi) e dove cercare sul lato Python (scrittori_tabella).
#
# ── ⛔ I DUE ESITI SONO DUE GESTI DIVERSI ────────────────────────────
#   NON_DICHIARATO = un valore che nessuno scrive e nessuno ha guardato:
#   o si scrive lo scrittore, o si dichiara nel registro con il canale e la
#   ragione. DEBITO_ESTINTO = una riga di registro che non serve piu': si
#   toglie dal CSV e si cancella con un DELETE forward-only (loadUpdateData
#   non cancella). Il messaggio del pgTAP nomina la riga e l'esito, perche'
#   su un difetto senza altri sintomi sapere QUALE e' meta' del lavoro.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20260921-17-create-vw-stati-check-da-sanare-mctit.yaml

  - changeSet:
      id: 20260921-17-create-vw-stati-check-da-sanare
      author: mctit
      failOnError: true
      comment: >
        Crea dbops.vw_stati_check_da_sanare: le righe di
        dbops.vw_stati_check_scrittori con esito NON_DICHIARATO o
        DEBITO_ESTINTO — la lista di lavoro del presidio C1, che DEVE essere
        vuota. E' la vista che dbops.presidi cataloga come CANCELLO.
      preConditions:
        - onFail: HALT
        - viewExists:
            schemaName: dbops
            viewName: vw_stati_check_scrittori
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW dbops.vw_stati_check_da_sanare AS
              SELECT s.schema_tabella,
                     s.nome_tabella,
                     s.colonna,
                     s.valore,
                     s.esito,
                     s.canale,
                     s.ragione,
                     s.data_registrazione,
                     s.scrittori_tabella,
                     CASE s.esito
                         WHEN 'NON_DICHIARATO' THEN
                              'nessuna funzione, nessun default e nessuna dichiarazione: o si scrive lo scrittore, o la riga entra in dbops.stati_check_dichiarazioni con il canale e la ragione'
                         ELSE 'la riga di registro non serve piu'': il valore ha trovato uno scrittore a DB, o e'' uscito dal CHECK. Va tolta dal CSV e cancellata con un DELETE forward-only'
                     END AS da_fare
                FROM dbops.vw_stati_check_scrittori s
               WHERE s.esito IN ('NON_DICHIARATO', 'DEBITO_ESTINTO');

              COMMENT ON VIEW dbops.vw_stati_check_da_sanare IS
                  'La lista di lavoro del presidio C1: i valori di una colonna di stato che nessuno scrive e nessuno ha dichiarato (NON_DICHIARATO), e le righe del registro dbops.stati_check_dichiarazioni che non servono piu'' (DEBITO_ESTINTO). DEVE restare vuota, ed e'' un CANCELLO: la fa rossa in CI db/pgtap/dbops/test-stati-check-scrittori-v1.sql, e sul lato Python il test del backend verifica le righe DICHIARATO_APPLICAZIONE della misura. Non e'' un filtro da allargare per farla tacere: si allarga il registro, con la ragione. Brief: brief-db-presidio-stati-mai-scritti §2.4.';

              DO $grant$
              BEGIN
                  IF EXISTS (SELECT 1 FROM pg_catalog.pg_roles
                              WHERE rolname = 'zeroerp_app') THEN
                      GRANT SELECT ON dbops.vw_stati_check_da_sanare TO zeroerp_app;
                  ELSE
                      RAISE NOTICE 'ruolo zeroerp_app assente: GRANT saltato';
                  END IF;
              END
              $grant$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP VIEW IF EXISTS dbops.vw_stati_check_da_sanare;
