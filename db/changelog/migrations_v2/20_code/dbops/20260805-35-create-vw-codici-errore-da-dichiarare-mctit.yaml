# LA MISURA del terzo lato: quali codici errore il database puo' nominare
#   Brief: brief-db-be-terzo-lato-presidio-codici.md
#   Registro: 20260805-36 · Seed: 20260805-37
#
# ── PERCHE' UNA VISTA E NON UNA QUERY IN OGNI PRESIDIO ──────────────────
#   Il terzo lato ha DUE lettori: il cancello (che vivra' lato backend, come
#   test Django) e chiunque debba capire quanti codici mancano. Se ognuno si
#   scrive la propria query, le due sponde misurano cose diverse — ed e'
#   successo davvero: la prima stima diceva 133 dal backend e 141 dal DB, e una
#   terza «raffinata» diceva 137. Tre numeri per lo stesso fatto.
#   Una vista sola, qui, e nessuno riscrive il regex.
#
# ── ⚠️ LA REGOLA E' VOLUTAMENTE LARGA, E VA SAPUTO PERCHE' ──────────────
#   La vista raccoglie **ogni letterale `E_*` che compare in un corpo plpgsql
#   vivo**, tolti i commenti. Non solo quelli dentro una chiamata a
#   `fn_log_and_raise_error`.
#
#   Sembra impreciso, ed e' invece la scelta giusta. Restringere ai soli
#   letterali dentro la chiamata che solleva **perde i codici del gruppo C** —
#   quelli che arrivano da un'espressione (`v_motivi -> 0 ->> 'codice'`), dove
#   il letterale vive dentro la funzione pura `fn_check_*` e non dentro la
#   PERFORM. Sono 19 codici, e 4 di essi non hanno policy: la misura «precisa»
#   li dichiarava conformi, cioe' mentiva.
#
#   Fra i due errori possibili, questo presidio sceglie il meno costoso:
#     · larga  -> al massimo si registra una policy che nessuno usera'. Costa
#                 una riga in un dizionario;
#     · stretta -> un codice arriva a un utente senza che nessuno abbia deciso
#                 che tipo di risposta e', e non se ne accorge nessuno.
#
#   ⚠️ E' lo stesso motivo per cui il check dei riferimenti morti e' «un
#   setaccio, non una lista»: un presidio che sbaglia per eccesso si corregge
#   guardando i falsi positivi; uno che sbaglia per difetto non si corregge,
#   perche' non si vede.
#
# ── COSA NON VEDE (limiti dichiarati) ───────────────────────────────────
#   · i codici costruiti a runtime per concatenazione (`'E_' || v_suffisso`):
#     non esistono come letterale. Nessuno oggi lo fa, ma non e' presidiato;
#   · i codici sollevati con `RAISE EXCEPTION` diretto senza passare
#     dall'helper: 135 punti in 46 funzioni. Quelli non portano il codice al
#     backend in nessun modo, quindi sono un problema diverso e piu' grosso;
#   · le funzioni non plpgsql (SQL puro): non possono sollevare per questa via.
#
#   `da_trigger` distingue chi e' sul percorso di una richiesta vera da chi sta
#   in una funzione che potrebbe non essere mai chiamata dal web: serve a dare
#   un ordine alle decisioni, non a escludere nessuno.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20260805-35-create-vw-codici-errore-da-dichiarare-mctit.yaml

  - changeSet:
      id: 20260805-35-create-vw-codici-errore-da-dichiarare
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Misura canonica del terzo lato: ogni codice E_* nominato da un corpo
        plpgsql vivo, con l'indicazione se la funzione che lo nomina e' agganciata
        a un trigger. Una sola definizione, letta sia dal cancello CI sia da chi
        deve capire quanti codici mancano: tre misure diverse dello stesso fatto
        sono gia' costate una giornata di riconciliazione.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW dbops.vw_codici_errore_da_dichiarare
              WITH (security_invoker = true) AS
              SELECT m[1]                                   AS codice,
                     bool_or(t.agganciata)                  AS da_trigger,
                     count(DISTINCT p.oid)                  AS n_funzioni,
                     string_agg(DISTINCT n.nspname || '.' || p.proname, ', '
                                ORDER BY n.nspname || '.' || p.proname) AS funzioni
                FROM pg_proc p
                JOIN pg_namespace n
                  ON n.oid = p.pronamespace
                CROSS JOIN LATERAL (
                       SELECT EXISTS (SELECT 1 FROM pg_trigger tg
                                       WHERE tg.tgfoid = p.oid AND NOT tg.tgisinternal) AS agganciata
                     ) t,
                     -- ⚠️ Commenti tolti PRIMA di cercare: un codice nominato in
                     -- un commento non e' un codice sollevato, e senza questa
                     -- riga il conteggio si gonfia in silenzio.
                     LATERAL regexp_matches(
                       regexp_replace(p.prosrc, '--[^\n]*', '', 'g'),
                       '''(E_[A-Z0-9_]+)''', 'g') AS m
               WHERE n.nspname NOT IN ('pg_catalog', 'information_schema')
                 AND p.prolang = (SELECT oid FROM pg_language WHERE lanname = 'plpgsql')
               GROUP BY m[1];

              COMMENT ON VIEW dbops.vw_codici_errore_da_dichiarare IS
              'Misura canonica del "terzo lato" del presidio sui codici errore: ogni codice E_* nominato da un corpo plpgsql vivo (commenti esclusi), con da_trigger = la funzione che lo nomina e'' agganciata a un trigger, quindi sta sul percorso di una richiesta. ⚠️ VOLUTAMENTE LARGA: raccoglie ogni letterale, non solo quelli dentro una chiamata a fn_log_and_raise_error, perche'' restringere perderebbe i codici che arrivano da espressione (gruppo C: v_motivi -> 0 ->> ''codice'') — 19 codici, 4 dei quali senza policy. Fra i due errori possibili si sceglie quello che si corregge guardando i falsi positivi, non quello che non si vede. Non vede: codici costruiti per concatenazione, e i RAISE EXCEPTION diretti che non passano dall''helper. Brief: brief-db-be-terzo-lato-presidio-codici.md.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP VIEW IF EXISTS dbops.vw_codici_errore_da_dichiarare;
