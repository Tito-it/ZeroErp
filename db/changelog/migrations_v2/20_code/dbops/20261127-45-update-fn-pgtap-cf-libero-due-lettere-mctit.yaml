# IL CODICE FISCALE DI FIXTURE VARIA SU DUE LETTERE, NON SU UNA
#   dbops.fn_pgtap_cf_libero
#
#   Il difetto (rossi della baseline del 2026-11-28): il corpo variava su UNA
#   lettera, quindi i codici possibili erano 26 in tutto il database. Ogni
#   persona fisica di fixture ne consuma uno, e ne consumano anche le righe che
#   restano: i soggetti di sviluppo (fn_provisiona_dati_di_sviluppo) e quelli
#   che un chiamante con COMMIT lascia sul database. Un pgTAP che costruisce
#   piu' persone dei codici rimasti si ferma nel setup con «nessun codice
#   fiscale libero trovato», che con la regola del test non c'entra.
#   Il limite e' del modello della fixture, non dei dati di oggi: una fixture
#   che si esaurisce dopo 26 soggetti si esaurisce comunque, prima o poi.
#
#   La correzione: varia anche la sesta lettera del corpo (TST?P?80A01H501),
#   26 x 26 = 676 corpi. Il carattere di controllo resta CERCATO dal
#   validatore di dominio, mai calcolato qui. I codici di prima sono un
#   sottoinsieme dei nuovi (sesta lettera G): i residui restano occupati e
#   vengono saltati come prima.
#
#   Accanto, 20261127-46: dbops.fn_pgtap_entra_come_super_admin riusa un solo
#   SUPER_ADMIN per transazione, che e' la causa per cui un test consumava un
#   codice per ogni permesso concesso.
#
#   Corpo dal catalogo (pg_get_functiondef), non da uno YAML.
#   Permessi: CREATE OR REPLACE conserva l'ACL; nessun GRANT.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261127-45-update-fn-pgtap-cf-libero-due-lettere-mctit.yaml

  - changeSet:
      id: 20261127-45-update-fn-pgtap-cf-libero-due-lettere
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.fn_pgtap_cf_libero: il corpo varia su due lettere (676 codici invece di 26), il carattere di controllo resta cercato dal validatore di dominio.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_pgtap_cf_libero()
               -- un codice fiscale di fixture: nessuna colonna di cui sia il riflesso
               RETURNS text
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: dare a una fixture pgTAP un codice fiscale VALIDO e non
              --   ancora usato, cosi' nessun test deve piu' cancellare il
              --   soggetto residuo della corsa precedente per poter ripartire.
              DECLARE
                  v_lettere text := 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';  -- l'alfabeto: nessuna colonna
                  v_corpo   text;  -- i primi 15 caratteri: nessuna colonna
                  v_cf      text;  -- il candidato: nessuna colonna
                  v_i       int;   -- la quarta lettera: nessuna colonna
                  v_k       int;   -- la sesta lettera: nessuna colonna
                  v_j       int;   -- il carattere di controllo: nessuna colonna
              BEGIN
                  -- Il corpo varia su DUE lettere (la quarta e la sesta): 676 corpi.
                  -- Con una sola i codici erano 26 per tutto il database, e i
                  -- soggetti residui li esaurivano.
                  -- Il CARATTERE DI CONTROLLO non si calcola, si CERCA: si provano
                  -- le 26 lettere e si tiene quella che script.fn_valida_codice_fiscale
                  -- accetta. Cosi' la regola resta UNA, quella di dominio.
                  FOR v_i IN 1..26 LOOP
                      FOR v_k IN 1..26 LOOP
                          v_corpo := 'TST' || substr(v_lettere, v_i, 1)
                                     || 'P' || substr(v_lettere, v_k, 1)
                                     || '80A01' || 'H501';
                          FOR v_j IN 1..26 LOOP
                              v_cf := v_corpo || substr(v_lettere, v_j, 1);
                              CONTINUE WHEN NOT script.fn_valida_codice_fiscale(v_cf);
                              -- Il controllo e' uno solo per corpo: se il codice
                              -- valido e' occupato si passa al corpo seguente.
                              IF NOT EXISTS (SELECT 1 FROM anagrafiche.soggetti s
                                              WHERE s.codice_fiscale = v_cf
                                                 OR s.id_fiscale_univoco_cf_piva = v_cf) THEN
                                  RETURN v_cf;
                              END IF;
                              EXIT;
                          END LOOP;
                      END LOOP;
                  END LOOP;

                  RAISE EXCEPTION 'fn_pgtap_cf_libero: nessun codice fiscale libero trovato';
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_pgtap_cf_libero()
              IS 'Fixture pgTAP: un codice fiscale VALIDO secondo script.fn_valida_codice_fiscale e non ancora presente in anagrafiche.soggetti. Sorella di dbops.fn_pgtap_piva_libera: stesso problema (uq_soggetto_idstato_id_fiscale_univoco contro identificativi gia'' scritti), stessa soluzione. Il corpo varia su due lettere (676 codici possibili). Il carattere di controllo non lo calcola, lo CERCA provando l''alfabeto e chiedendo al validatore di dominio: reimplementare l''algoritmo qui vorrebbe dire tenerne due copie. ⚠️ Non e'' un generatore di codici fiscali reali: il corpo e'' fittizio e serve solo a superare validatore e unicita'' in un test. Vede anche le righe non ancora committate.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_pgtap_cf_libero()
               RETURNS text
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_lettere text := 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
                  v_corpo   text;
                  v_cf      text;
                  v_i       int;
                  v_j       int;
              BEGIN
                  FOR v_i IN 1..26 LOOP
                      v_corpo := 'TST' || substr(v_lettere, v_i, 1) || 'PG'
                                 || '80A01' || 'H501';
                      FOR v_j IN 1..26 LOOP
                          v_cf := v_corpo || substr(v_lettere, v_j, 1);
                          IF script.fn_valida_codice_fiscale(v_cf)
                             AND NOT EXISTS (SELECT 1 FROM anagrafiche.soggetti s
                                              WHERE s.codice_fiscale = v_cf
                                                 OR s.id_fiscale_univoco_cf_piva = v_cf) THEN
                              RETURN v_cf;
                          END IF;
                      END LOOP;
                  END LOOP;

                  RAISE EXCEPTION 'fn_pgtap_cf_libero: nessun codice fiscale libero trovato';
              END;
              $function$;
