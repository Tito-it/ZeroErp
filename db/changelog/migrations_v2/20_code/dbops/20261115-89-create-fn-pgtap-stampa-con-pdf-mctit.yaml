# ------------------------------------------------------------
# FIXTURE pgTAP: UNA STAMPA COL SUO PDF PRINCIPALE
#   dbops.fn_pgtap_stampa_con_pdf(text)   (nuova)
#
# -- PERCHE' --------------------------------------------------------------
#   Dal 20261115-88 una stampa senza file principale non si registra: il guard
#   e' differito, e i pgTAP girano con SET CONSTRAINTS ALL IMMEDIATE, quindi
#   scatta a fine istruzione. Stampa e file in una CTE sola non si possono
#   scrivere da applicazione: la policy del file risolve l'azienda dalla stampa
#   (script.fn_resolve_emittente_fiscale_id), che nella snapshot della CTE non
#   c'e' ancora, e nega. La forma e' quella del servizio: due istruzioni, e il
#   guard giudica dopo la seconda.
#   Sette pgTAP costruiscono stampe: la finestra differita ricopiata sette
#   volte sarebbe sette copie della stessa regola. Un helper, sul modello di
#   dbops.fn_pgtap_codice_errore (che gia' riceve l'istruzione come testo).
#
# -- CHE COSA FA --------------------------------------------------------------
#   Riceve l'INSERT della stampa senza RETURNING, la esegue (RETURNING id e'
#   suo), scrive il PDF principale (tipo PDF_FINALE per codice_interno), e
#   giudica subito: apre la finestra differita del solo
#   trg_documenti_generati_a10_guard_file_principale_ins e la richiude con
#   IMMEDIATE, che fa scattare il guard. Gli altri vincoli restano come il
#   test li ha messi. SECURITY INVOKER: scrive con l'identita' del test, sotto
#   le sue policy.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261115-89-create-fn-pgtap-stampa-con-pdf-mctit.yaml

  - changeSet:
      id: 20261115-89-create-fn-pgtap-stampa-con-pdf
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.fn_pgtap_stampa_con_pdf: registra in un pgTAP una stampa col suo PDF principale, in
        due istruzioni come il servizio, e fa giudicare subito il guard differito del file
        principale. Solo per i pgTAP.
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_pgtap_stampa_con_pdf(
                  -- l'INSERT della stampa, senza RETURNING: testo SQL, nessuna colonna la rispecchia
                  p_insert_stampa text)
               RETURNS documenti.documenti_generati.id%TYPE
               LANGUAGE plpgsql
               VOLATILE
               SECURITY INVOKER
              AS $function$
              -- Scopo: in un pgTAP, una stampa col suo PDF principale. Solo per i pgTAP.
              -- Uso:
              --   SELECT dbops.fn_pgtap_stampa_con_pdf($$INSERT INTO documenti.documenti_generati (…) SELECT …$$);
              --   SELECT is(dbops.fn_pgtap_codice_errore(
              --            $$SELECT dbops.fn_pgtap_stampa_con_pdf($i$INSERT …$i$)$$), NULL, 'passa');
              DECLARE
                  v_id documenti.documenti_generati.id%TYPE;
              BEGIN
                  SET CONSTRAINTS documenti.trg_documenti_generati_a10_guard_file_principale_ins DEFERRED;

                  EXECUTE p_insert_stampa || ' RETURNING id' INTO STRICT v_id;

                  INSERT INTO documenti.documenti_generati_file (
                      documento_generato_id, file_tipo_id, mime_type, file_name,
                      file_size_bytes, storage_key, sha256, ordinamento, is_principale)
                  SELECT g.id, t.id, 'application/pdf', g.nome_file,
                         1024, 'pgtap/stampe/' || g.uid::text || '.pdf', repeat('f', 64), 1, true
                    FROM documenti.documenti_generati g
                    CROSS JOIN documenti.tipi_file_documento t
                   WHERE g.id = v_id
                     AND t.codice_interno = 'PDF_FINALE';

                  -- IMMEDIATE fa scattare adesso il guard rimasto in sospeso: la stampa
                  -- si giudica qui, non al ROLLBACK del test (che non giudica niente).
                  SET CONSTRAINTS documenti.trg_documenti_generati_a10_guard_file_principale_ins IMMEDIATE;

                  RETURN v_id;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_pgtap_stampa_con_pdf(text) IS
                  'Fixture pgTAP (building block): esegue l''INSERT di una stampa ricevuto come testo (senza RETURNING), scrive il suo PDF principale (tipo PDF_FINALE) e rende l''id della stampa. Due istruzioni, come il servizio: in una CTE sola la policy del file non vedrebbe la stampa. Apre la finestra differita del solo trg_documenti_generati_a10_guard_file_principale_ins e la richiude con IMMEDIATE, che fa giudicare subito il guard; gli altri vincoli restano come il test li ha messi. SECURITY INVOKER: scrive sotto le policy di chi chiama. Solo per i pgTAP.';
      rollback:
        - sql:
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS dbops.fn_pgtap_stampa_con_pdf(text);
