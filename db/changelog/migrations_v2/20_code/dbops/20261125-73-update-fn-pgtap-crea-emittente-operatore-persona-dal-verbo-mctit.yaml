# ------------------------------------------------------------
# dbops.fn_pgtap_crea_emittente_operatore: con p_persona l'azienda entra nel
# perimetro dell'operatore dal verbo, non dalla primitiva.
#
#   Il 20261125-71 legava la persona all'azienda con
#   script.fn_applica_user_emittenti_scope: la primitiva che l'applicazione non
#   esegue (20261124-06). Col runner app la fixture si fermava con «permesso
#   negato», e con lei ogni test che la chiama con p_persona.
#
#   La strada c'e' gia': dbops.fn_pgtap_sposta_scope_operatore, che passa dal
#   verbo script.fn_change_user_emittenti_scope con un SUPER_ADMIN di fixture e
#   rimette il contesto com'era. Si usa quella (regola del 2: niente seconda
#   porta). Firma, RETURNS TABLE e ramo di default invariati: CREATE OR
#   REPLACE. Il COMMENT si riscrive.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261125-73-update-fn-pgtap-crea-emittente-operatore-persona-dal-verbo-mctit.yaml

  - changeSet:
      id: 20261125-73-update-fn-pgtap-crea-emittente-operatore-persona-dal-verbo
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.fn_pgtap_crea_emittente_operatore: con p_persona l'azienda entra nel perimetro della persona dal
        verbo (dbops.fn_pgtap_sposta_scope_operatore), non dalla primitiva che l'app non esegue.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 2
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc
               WHERE pronamespace = 'dbops'::regnamespace
                 AND proname IN ('fn_pgtap_crea_operatore_umano', 'fn_pgtap_sposta_scope_operatore')
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_pgtap_crea_emittente_operatore(
                  p_sigla           anagrafiche.emittenti_fiscali.codice%TYPE DEFAULT NULL,
                  p_processo_codice text DEFAULT 'chiusura_scadenze_daily',  -- chiave del registro dei processi, testo libero
                  p_persona         boolean DEFAULT false                      -- un interruttore del chiamante
              )
               RETURNS TABLE (
                  emittente_fiscale_id anagrafiche.emittenti_fiscali.id%TYPE,
                  emittente_codice     anagrafiche.emittenti_fiscali.codice%TYPE,
                  soggetto_ruolo_id    anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE,
                  auth_user_id         anagrafiche.identita_digitali.auth_user_id%TYPE,
                  identita_id          anagrafiche.identita_digitali.id%TYPE
               )
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_ef          record;
                  v_auth_user   anagrafiche.identita_digitali.auth_user_id%TYPE;
                  v_identita_id anagrafiche.identita_digitali.id%TYPE;
              BEGIN
                  SELECT * INTO v_ef FROM dbops.fn_pgtap_crea_emittente(p_sigla);

                  IF p_persona THEN
                      -- Una persona: l'operatore umano dal percorso di
                      -- produzione, poi l'azienda nel suo perimetro.
                      SELECT ou.auth_user_id, ou.identita_id
                        INTO v_auth_user, v_identita_id
                        FROM dbops.fn_pgtap_crea_operatore_umano(
                                 'pgTAP-' || v_ef.emittente_codice, false) ou;
                      PERFORM dbops.fn_pgtap_sposta_scope_operatore(
                                  v_auth_user, v_ef.emittente_fiscale_id);
                      PERFORM config.fn_imposta_emittente_attivo(
                                  v_auth_user, v_ef.emittente_fiscale_id);
                  ELSE
                      SET CONSTRAINTS ALL DEFERRED;

                      v_auth_user := script.fn_crea_utente_tecnico(
                                         p_processo_codice  := p_processo_codice,
                                         p_emittente_codice := v_ef.emittente_codice);

                      SET CONSTRAINTS ALL IMMEDIATE;

                      SELECT idg.id
                        INTO v_identita_id
                        FROM anagrafiche.identita_digitali idg
                       WHERE idg.auth_user_id = v_auth_user
                         AND idg.attivo;
                  END IF;

                  IF v_identita_id IS NULL THEN
                      RAISE EXCEPTION
                          'fn_pgtap_crea_emittente_operatore: nessuna identita'' attiva per auth_user_id=%',
                          v_auth_user;
                  END IF;

                  RETURN QUERY
                  SELECT v_ef.emittente_fiscale_id, v_ef.emittente_codice,
                         v_ef.soggetto_ruolo_id, v_auth_user, v_identita_id;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_pgtap_crea_emittente_operatore(
                  anagrafiche.emittenti_fiscali.codice%TYPE, text, boolean) IS
                  'Helper di fixture pgTAP: un''azienda su cui lavorare PIU'' l''operatore che la ha nel perimetro. Senza operatore il contesto di sessione resta vuoto e il dominio solleva «Nessun emittente fiscale attivo». Di default l''operatore e'' un utente TECNICO (script.fn_crea_utente_tecnico, col processo p_processo_codice): per cio'' che i test attraversano e'' un operatore a tutti gli effetti (identita'' OPERATORE attiva, non super admin, un emittente nel perimetro). Con p_persona l''operatore e'' una PERSONA (dbops.fn_pgtap_crea_operatore_umano, non super admin), portata sull''azienda da dbops.fn_pgtap_sposta_scope_operatore (il verbo script.fn_change_user_emittenti_scope, con un SUPER_ADMIN di fixture) e con l''azienda come emittente attivo: serve dove il test fa dell''operatore un SUPER_ADMIN o gli lega un profilo, perche'' un''identita'' tecnica non ha mai il SUPER_ADMIN. Il chiamante deve poi puntarci il contesto: PERFORM script.fn_pgtap_set_contesto_operatore(auth_user_id). ⚠️ Esce con i vincoli IMMEDIATE, come ogni helper.';
      rollback:
        - sql:
            splitStatements: false
            sql: |
              SELECT 1;  -- forward-only: la versione precedente e' il 20261125-71
