# Liquibase changelog per Zero ERP
# ------------------------------------------------------------
# Aggiorna fn_apply_automazione_overlap con doppio codepath:
# se range_col IS NOT NULL usa la colonna daterange nativa,
# altrimenti mantiene il comportamento attuale.
# Vedi: migrazione-daterange.md §4.4
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20260412-02-update-fn-apply-automazione-overlap-range-col-mctit.yaml

  - changeSet:
      id: 20260412-02-update-fn-apply-automazione-overlap-range-col
      author: mctit
      runOnChange: false
      comment: >
        Dual codepath per colonna daterange nativa: se range_col IS NOT NULL
        il vincolo EXCLUDE usa la colonna direttamente (%I WITH &&),
        altrimenti costruisce il range al volo (comportamento precedente).
        Aggiunge anche validazione range_col: verifica che la colonna esista
        e sia di tipo daterange/tstzrange.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_apply_automazione_overlap(p_exec_mode text, p_dry_run boolean)
               RETURNS void
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                rconf record;
                v_rel regclass;
                v_cols text[];
                v_col text;
                v_key_expr text;
                v_range_expr text;
                v_bounds text;
                v_constraint text;
                v_constraint_exists boolean;
                v_any_exclusion boolean;
                v_skip_status text;
              BEGIN
                v_skip_status := CASE WHEN p_dry_run THEN 'DRYRUN' ELSE 'WARN' END;
                FOR rconf IN
                  SELECT *
                    FROM dbops.automazione_overlap
                   WHERE active
                     AND (upper(btrim(exec_mode)) = 'AUTO' OR exec_mode = p_exec_mode)
                   ORDER BY target_schema, target_table
                LOOP
                  v_rel := (quote_ident(rconf.target_schema)||'.'||quote_ident(rconf.target_table))::regclass;

                  IF rconf.key_columns IS NULL OR array_length(rconf.key_columns, 1) IS NULL THEN
                    PERFORM dbops.fn_audit_log_once(
                      p_function_name => 'dbops.fn_apply_automazione_overlap',
                      p_status        => v_skip_status,
                      p_rule_type     => 'OVERLAP',
                      p_exec_mode     => p_exec_mode,
                      p_parts         => ARRAY['OVERLAP'],
                      p_dry_run       => p_dry_run,
                      p_params        => jsonb_build_object(
                                          'table', rconf.target_schema||'.'||rconf.target_table,
                                          'reason', 'NO_KEY_COLUMNS'
                                        ),
                      p_message       => 'Skip: key_columns missing'
                    );
                    CONTINUE;
                  END IF;

                  -- Validazione colonne periodo: se range_col e` valorizzata verifica
                  -- che esista nella tabella, altrimenti verifica valido_dal_col/valido_al_col
                  IF rconf.range_col IS NOT NULL THEN
                    IF NOT dbops.fn_col_exists(rconf.target_schema, rconf.target_table, rconf.range_col) THEN
                      PERFORM dbops.fn_audit_log_once(
                        p_function_name => 'dbops.fn_apply_automazione_overlap',
                        p_status        => v_skip_status,
                        p_rule_type     => 'OVERLAP',
                        p_exec_mode     => p_exec_mode,
                        p_parts         => ARRAY['OVERLAP'],
                        p_dry_run       => p_dry_run,
                        p_params        => jsonb_build_object(
                                            'table', rconf.target_schema||'.'||rconf.target_table,
                                            'range_col', rconf.range_col,
                                            'reason', 'RANGE_COL_MISSING'
                                          ),
                        p_message       => 'Skip: range_col not found in table'
                      );
                      CONTINUE;
                    END IF;
                  ELSE
                    IF NOT dbops.fn_col_exists(rconf.target_schema, rconf.target_table, rconf.valido_dal_col)
                       OR NOT dbops.fn_col_exists(rconf.target_schema, rconf.target_table, rconf.valido_al_col) THEN
                      PERFORM dbops.fn_audit_log_once(
                        p_function_name => 'dbops.fn_apply_automazione_overlap',
                        p_status        => v_skip_status,
                        p_rule_type     => 'OVERLAP',
                        p_exec_mode     => p_exec_mode,
                        p_parts         => ARRAY['OVERLAP'],
                        p_dry_run       => p_dry_run,
                        p_params        => jsonb_build_object(
                                            'table', rconf.target_schema||'.'||rconf.target_table,
                                            'valido_dal_col', rconf.valido_dal_col,
                                            'valido_al_col', rconf.valido_al_col,
                                            'reason', 'PERIOD_COLUMNS_MISSING'
                                          ),
                        p_message       => 'Skip: period columns missing'
                      );
                      CONTINUE;
                    END IF;
                  END IF;

                  -- Costruzione key expression
                  v_cols := ARRAY[]::text[];
                  FOREACH v_col IN ARRAY rconf.key_columns
                  LOOP
                    IF dbops.fn_col_exists(rconf.target_schema, rconf.target_table, v_col) THEN
                      v_cols := array_append(v_cols, quote_ident(v_col) || ' WITH =');
                    END IF;
                  END LOOP;

                  IF array_length(v_cols, 1) IS NULL THEN
                    PERFORM dbops.fn_audit_log_once(
                      p_function_name => 'dbops.fn_apply_automazione_overlap',
                      p_status        => v_skip_status,
                      p_rule_type     => 'OVERLAP',
                      p_exec_mode     => p_exec_mode,
                      p_parts         => ARRAY['OVERLAP'],
                      p_dry_run       => p_dry_run,
                      p_params        => jsonb_build_object(
                                          'table', rconf.target_schema||'.'||rconf.target_table,
                                          'key_columns', rconf.key_columns,
                                          'reason', 'KEY_COLUMNS_NOT_FOUND'
                                        ),
                      p_message       => 'Skip: key_columns not found in table'
                    );
                    CONTINUE;
                  END IF;

                  -- Costruzione range expression: dual codepath
                  IF rconf.range_col IS NOT NULL THEN
                    -- Colonna daterange/tstzrange nativa: uso diretto
                    v_range_expr := format('%I WITH &&', rconf.range_col);
                  ELSE
                    -- Costruzione range al volo da colonne separate (retrocompatibile)
                    v_bounds := COALESCE(NULLIF(btrim(rconf.range_bounds), ''), '[]');
                    v_range_expr := format(
                      'daterange(%I, COALESCE(%I, ''infinity''::date), %L) WITH &&',
                      rconf.valido_dal_col,
                      rconf.valido_al_col,
                      v_bounds
                    );
                  END IF;

                  v_key_expr := array_to_string(v_cols, ', ');

                  v_constraint := COALESCE(rconf.constraint_name,
                                   dbops.fn_name_from_template('ex_{table}_no_overlap', rconf.target_schema, rconf.target_table, NULL, NULL, NULL, NULL));

                  -- Se il nome e` gia` usato da un indice o altro oggetto, usa un suffisso
                  IF EXISTS (
                    SELECT 1
                      FROM pg_class c
                      JOIN pg_namespace n ON n.oid = c.relnamespace
                     WHERE n.nspname = rconf.target_schema
                       AND c.relname = v_constraint
                  ) THEN
                    v_constraint := dbops.fn_name_from_template('ex_{table}_no_overlap_c', rconf.target_schema, rconf.target_table, NULL, NULL, NULL, NULL);
                  END IF;

                  SELECT EXISTS (
                    SELECT 1
                      FROM pg_constraint con
                     WHERE con.conrelid = v_rel
                       AND con.contype = 'x'
                       AND con.conname = v_constraint
                  )
                  INTO v_constraint_exists;

                  -- Verifica se esiste gia` un vincolo EXCLUDE che referenzia le colonne periodo
                  -- Per range_col cerca il nome colonna, per le colonne separate cerca valido_dal_col
                  SELECT EXISTS (
                    SELECT 1
                      FROM pg_constraint con
                     WHERE con.conrelid = v_rel
                       AND con.contype = 'x'
                       AND pg_get_constraintdef(con.oid) ILIKE '%' ||
                           COALESCE(rconf.range_col, rconf.valido_dal_col) || '%'
                  )
                  INTO v_any_exclusion;

                  IF v_constraint_exists OR v_any_exclusion THEN
                    PERFORM dbops.fn_audit_log_once(
                      p_function_name => 'dbops.fn_apply_automazione_overlap',
                      p_status        => v_skip_status,
                      p_rule_type     => 'OVERLAP',
                      p_exec_mode     => p_exec_mode,
                      p_parts         => ARRAY['OVERLAP'],
                      p_dry_run       => p_dry_run,
                      p_params        => jsonb_build_object(
                                          'table', rconf.target_schema||'.'||rconf.target_table,
                                          'constraint', v_constraint,
                                          'reason', 'EXCLUDE_EXISTS'
                                        ),
                      p_message       => 'Skip: exclude constraint already present'
                    );
                    CONTINUE;
                  END IF;

                  IF p_dry_run THEN
                    PERFORM dbops.fn_audit_log_once(
                      p_function_name => 'dbops.fn_apply_automazione_overlap',
                      p_status        => 'DRYRUN',
                      p_rule_type     => 'OVERLAP',
                      p_exec_mode     => p_exec_mode,
                      p_parts         => ARRAY['OVERLAP'],
                      p_dry_run       => true,
                      p_params        => jsonb_build_object(
                                          'table', rconf.target_schema||'.'||rconf.target_table,
                                          'constraint', v_constraint,
                                          'key_columns', rconf.key_columns,
                                          'range_col', rconf.range_col,
                                          'valido_dal_col', rconf.valido_dal_col,
                                          'valido_al_col', rconf.valido_al_col,
                                          'range_bounds', COALESCE(rconf.range_bounds, '[]'),
                                          'action', 'DRYRUN_CREATE_EXCLUDE'
                                        ),
                      p_message       => 'Exclude constraint would be created'
                    );
                    CONTINUE;
                  END IF;

                  EXECUTE format(
                    'ALTER TABLE %I.%I ADD CONSTRAINT %I EXCLUDE USING gist (%s, %s)',
                    rconf.target_schema,
                    rconf.target_table,
                    v_constraint,
                    v_key_expr,
                    v_range_expr
                  );
                  PERFORM dbops.fn_audit_log_once(
                    p_function_name => 'dbops.fn_apply_automazione_overlap',
                    p_status        => 'OK',
                    p_rule_type     => 'OVERLAP',
                    p_exec_mode     => p_exec_mode,
                    p_parts         => ARRAY['OVERLAP'],
                    p_dry_run       => false,
                    p_params        => jsonb_build_object(
                                        'table', rconf.target_schema||'.'||rconf.target_table,
                                        'constraint', v_constraint,
                                        'key_columns', rconf.key_columns,
                                        'range_col', rconf.range_col,
                                        'valido_dal_col', rconf.valido_dal_col,
                                        'valido_al_col', rconf.valido_al_col,
                                        'range_bounds', COALESCE(rconf.range_bounds, '[]'),
                                        'action', 'CREATE_EXCLUDE'
                                      ),
                    p_message       => 'Exclude constraint created'
                  );
                END LOOP;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_apply_automazione_overlap(p_exec_mode text, p_dry_run boolean)
              IS 'Applica i vincoli EXCLUDE GiST in base a dbops.automazione_overlap. Supporta dual codepath: colonna daterange nativa (range_col) o espressione calcolata (valido_dal_col/valido_al_col).';
