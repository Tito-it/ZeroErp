# Il building block «il corpo di una funzione, senza i commenti».
#   Brief: brief-db-revisione-dbops, D14 + D15 (giro 1).
#
# ⛔ IL DIFETTO. Nove viste e due strumenti di dbops leggono il corpo delle
#   funzioni per cercarci un codice, una tabella scritta, un valore. Ognuno
#   toglieva i commenti a modo suo (solo `--`; `--` e `/* */`; solo le righe che
#   iniziano con `--`; niente), e nessuno rispettava i letterali: un codice dopo
#   un `'--'` scritto in una stringa spariva, un nome dentro un commento a
#   blocco accendeva un cancello. E tutti leggevano pg_proc.prosrc, che per una
#   funzione SQL `BEGIN ATOMIC` e' VUOTO (il corpo sta in prosqlbody, linee
#   guida SQL §5c): un cancello non vedeva lo scrittore, un ESENTE non
#   diventava mai DEBITO_ESTINTO.
#   ⇒ Una regola sola, in due funzioni:
#     - dbops.fn_testo_senza_commenti(text): il testo senza `--` e `/* */`, con
#       i letterali `'…'`, `E'…'` e gli identificatori `"…"` lasciati intatti;
#     - dbops.fn_corpo_funzione(oid): il corpo di una funzione passato da lei,
#       da prosrc o, per una BEGIN ATOMIC, da pg_get_function_sqlbody.
#
# ── Come regge la regex ─────────────────────────────────────────────────────
#   Un'alternativa sola, letta da sinistra: un letterale (catturato e rimesso
#   con \1), un commento di riga, un commento a blocco (scartati). Il primo
#   carattere decide il ramo (`'`, `E'`, `"`, `--`, `/*`), quindi un `--` dentro
#   un letterale cade nel letterale, che comincia prima, e un apice dentro un
#   commento cade nel commento.
#   ⚠️ PostgreSQL rende GREEDY un'alternativa al primo livello: un `/\*.*?\*/`
#     qui si mangerebbe tutto fino all'ULTIMO `*/`. Il commento a blocco e'
#     scritto in modo che non possa contenere `*/` (`(?:[^*]|\*+[^*/])*\*+/`),
#     e la lunghezza massima e' quella giusta.
#   Limiti dichiarati: le stringhe dollar-quoted interne (`$q$…$q$`) non sono
#   riconosciute come letterali (ne' i commenti a blocco annidati): un `--`
#   dentro un $q$ si toglie fino a fine riga. Nessun lettore di oggi ci conta.
#
# ── Perche' search_path = pg_catalog su fn_corpo_funzione ───────────────────
#   pg_get_function_sqlbody deparsa i nomi relativi al search_path della
#   sessione (linee guida SQL §5c): con `vendite` nel path stamperebbe
#   `ddt_righe`, e un lettore che cerca `vendite.ddt_righe` non lo troverebbe.
#   Con pg_catalog stampa tutto qualificato, per chiunque la chiami.
#   La clausola SET la rende non incorporabile: si chiama una volta per
#   funzione letta, come si leggeva prosrc.
#
# ── ⚠️ La collation ──────────────────────────────────────────────────────
#   prosrc ha la collation del catalogo ("C"); il risultato di una funzione
#   senza argomenti collazionabili prende quella di default. I lettori che
#   sostituiscono prosrc scrivono `dbops.fn_corpo_funzione(p.oid) COLLATE "C"`:
#   le colonne derivate e le regex (\w, ~*) restano quelle di prima.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261104-20-create-fn-corpo-funzione-senza-commenti-mctit.yaml

  - changeSet:
      id: 20261104-20-create-fn-corpo-funzione-senza-commenti
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.fn_testo_senza_commenti(text) e dbops.fn_corpo_funzione(oid): il corpo di una
        funzione senza i commenti, rispettando i letterali, e anche per le funzioni BEGIN ATOMIC.
        La regola unica per chi cerca qualcosa nei corpi (D14, D15).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "0"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'dbops'
                 AND p.proname IN ('fn_testo_senza_commenti', 'fn_corpo_funzione');
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- Tipi espliciti (text in ingresso e in uscita): un testo SQL qualunque,
              -- nessuna colonna di cui sia il riflesso. Il corpo di una funzione ci
              -- arriva da dbops.fn_corpo_funzione, che ancora i suoi.
              CREATE FUNCTION dbops.fn_testo_senza_commenti(p_testo text)
              RETURNS text
              LANGUAGE sql
              IMMUTABLE
              PARALLEL SAFE
              SECURITY INVOKER
              AS $function$
                  -- Gruppo 1: un letterale E'…' (con \' e ''), '…' (con ''), o un
                  -- identificatore "…": si rimette com'e'. Fuori dal gruppo: un
                  -- commento di riga o a blocco, che si toglie.
                  SELECT pg_catalog.regexp_replace(
                             p_testo,
                             '((?:[Ee]''(?:[^''\\]|\\.|'''')*''|''(?:[^'']|'''')*''|"(?:[^"]|"")*"))|--[^\n]*|/\*(?:[^*]|\*+[^*/])*\*+/',
                             '\1',
                             'g');
              $function$;

              COMMENT ON FUNCTION dbops.fn_testo_senza_commenti(text) IS
                  'Il testo SQL senza i commenti: toglie i commenti di riga (--) e quelli a blocco (/* */), e lascia intatti i letterali ''…'' ed E''…'' e gli identificatori "…", anche quando contengono -- o /*. Un''espressione sola, letta da sinistra: il primo carattere decide se comincia un letterale o un commento. Non riconosce come letterali le stringhe dollar-quoted interne ($q$…$q$) ne'' i commenti a blocco annidati. Senza un testo restituisce NULL. Da usare attraverso dbops.fn_corpo_funzione quando il testo e'' il corpo di una funzione.';

              -- Ancorata al catalogo: il parametro e' l'oid di una riga di pg_proc,
              -- il risultato e' il suo corpo (prosrc, o il deparse di prosqlbody,
              -- che e' testo uguale).
              CREATE FUNCTION dbops.fn_corpo_funzione(
                  p_funzione pg_catalog.pg_proc.oid%TYPE
              )
              RETURNS pg_catalog.pg_proc.prosrc%TYPE
              LANGUAGE sql
              STABLE
              PARALLEL SAFE
              SECURITY INVOKER
              SET search_path = pg_catalog
              AS $function$
                  -- prosrc e' vuoto per una BEGIN ATOMIC: il corpo sta in
                  -- prosqlbody, e lo deparsa pg_get_function_sqlbody, coi nomi
                  -- qualificati perche' il search_path qui e' pg_catalog.
                  SELECT dbops.fn_testo_senza_commenti(
                             CASE
                                 WHEN p.prosqlbody IS NULL THEN p.prosrc
                                 ELSE pg_catalog.pg_get_function_sqlbody(p.oid)
                             END)
                    FROM pg_catalog.pg_proc p
                   WHERE p.oid = p_funzione;
              $function$;

              COMMENT ON FUNCTION dbops.fn_corpo_funzione(pg_catalog.pg_proc.oid%TYPE) IS
                  'Il corpo di una funzione senza i commenti, come lo leggono i presidi e gli strumenti che cercano nei corpi un codice, una tabella o un valore. Per una funzione SQL BEGIN ATOMIC, dove pg_proc.prosrc e'' vuoto, il corpo viene da pg_get_function_sqlbody, deparsato coi nomi qualificati (search_path = pg_catalog sulla funzione); per le altre da prosrc. I commenti li toglie dbops.fn_testo_senza_commenti, rispettando i letterali. Un oid che non e'' una funzione restituisce NULL. ⚠️ Il risultato ha la collation di default, mentre pg_proc.prosrc ha quella del catalogo ("C"): chi deve dare colonne e regex uguali a quelle lette da prosrc scrive dbops.fn_corpo_funzione(p.oid) COLLATE "C" (senza, \w e ~* cambiano sui caratteri non ASCII, e un CREATE OR REPLACE VIEW rifiuta il cambio di collation di una colonna). ⛔ Chi cerca nei corpi passa da qui: togliere i commenti da prosrc con una regex propria e'' la copia che questa funzione ha ritirato.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS dbops.fn_corpo_funzione(pg_catalog.pg_proc.oid%TYPE);
              DROP FUNCTION IF EXISTS dbops.fn_testo_senza_commenti(text);
