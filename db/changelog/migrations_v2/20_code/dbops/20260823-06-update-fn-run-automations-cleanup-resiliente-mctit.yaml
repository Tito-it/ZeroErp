# UNA TABELLA CHE RIFIUTA NON FERMA IL GIRO
#   dbops.fn_run_automations_cleanup
#   Brief: brief-db-event-log-scope-e-riga-parlante.md §1.3
#   Rilievo di Tid, 2026-08-23, chiudendo il cantiere di event_log.
#
# ── 🔴 IL DIFETTO ──────────────────────────────────────────────────
#   L'orchestratore del cleanup scorre le tabelle in scope e, per ognuna, le
#   regole che la riguardano. Il doppio ciclo **non ha nessun `EXCEPTION`**:
#   basta che UNA tabella si opponga alla cancellazione perche' la funzione
#   muoia li'.
#
#     > E cio' che muore non e' la pulizia di quella tabella: e' **il giro**.
#     > Le tabelle che venivano dopo, quella notte, non vengono pulite affatto.
#
#   ⚠️ E nessuno lo saprebbe. Non e' un errore che qualcuno legge: e' una cosa
#   che **smette di succedere**, e la si scopre mesi dopo da un disco pieno.
#
# ── DA DOVE SALTA FUORI ────────────────────────────────────────────
#   Da `vendite.event_log`, che e' append-only e doveva convivere con la
#   retention (§1.3 del brief). Risolvendolo li' e' emerso che **due tabelle
#   sono sedute sulla stessa mina, solo non ancora armata**: `fatture_log` e
#   `fatturazione_lotti_log` hanno il guard `vendite.trgfn_logs_guard_delete`
#   e NON hanno `cleanup_at` — il giorno che qualcuno gliela aggiunge (gesto di
#   dieci secondi, e ragionevole) il giro comincia a morire.
#
#   ⛔ **Questo changeSet NON decide quanto deve vivere la storia delle
#   fatture**: quella e' una decisione di dominio, con implicazioni fiscali, e
#   ha un'altra sede. Qui si toglie di mezzo il fatto che la decisione di
#   qualcuno possa rompere il lavoro di tutti.
#
# ── ⭐ LA CURA E' IL QUARTO MEMBRO DI UNA FAMIGLIA CHE ESISTE GIA' ──
#   La funzione sa gia' saltare una tabella e dirlo. Lo fa in tre casi, tutti
#   con la stessa forma — `fn_audit_log_once(status => 'WARN', skip_reason =>
#   …)` e `CONTINUE`:
#
#     EXCLUDED · NO_CLEANUP_COLUMN · MISSING_TTL_DAYS · MISSING_BASE_TS_COLUMN
#
#   Mancava il caso «la tabella si e' opposta». Adesso c'e', e si chiama
#   **`BLOCKED_BY_TABLE`**. Non e' un try/catch aggiunto sopra: e' il ramo che
#   quella famiglia non aveva.
#
#   ⭐ **E il canale era gia' pronto**: `dbops.fn_audit_log_once` ha da sempre i
#   parametri `p_sqlstate` e `p_error_context`, e qui non li usava nessuno.
#
# ── ⚠️ DUE SCELTE DENTRO IL RIMEDIO ────────────────────────────────
#   1. **`status = 'ERROR'`, non `WARN`.** I WARN di questa funzione sono salti
#      **dichiarati** (esclusa, senza colonna, senza ttl): cose che qualcuno ha
#      deciso. Questo non e' dichiarato — e' una tabella che si e' opposta — e
#      deve distinguersi a colpo d'occhio. In `dbops.audit_log` oggi le righe
#      `ERROR` sono **zero**: la prima che comparira' vorra' dire qualcosa.
#   2. **`query_canceled` viene RI-SOLLEVATO.** Se qualcuno ferma il job, il
#      job si ferma: un annullamento non e' una tabella che rifiuta, e
#      inghiottirlo trasformerebbe uno stop in un giro che finge di lavorare.
#
#   ⚠️ Il costo, detto: ogni regola gira ora in una **sottotransazione** (e' cio'
#   che un blocco `EXCEPTION` implica in PL/pgSQL). Su qualche centinaio di
#   tabelle non si misura; su milioni sarebbe un'altra conversazione.
#
# ── 🧪 LA CONTROPROVA, MISURATA ────────────────────────────────────
#   `db/pgtap/dbops/test-cleanup-framework.sql` cresce da 12 a 16 asserzioni.
#   Le quattro nuove usano il guard **vero** (`trgfn_logs_guard_delete`), non un
#   trigger finto scritto per l'occasione. Misurato prima e dopo:
#
#     senza questa revisione → not ok 13, 15, 16   (e la 14 verde: il veto morde)
#     con questa revisione   → 16 su 16
#
#   ⭐ **E il test ha scoperto un secondo difetto, suo**: le asserzioni 11 e 12
#   erano **cieche**. `dbops.automation_scope` per lo schema `dbops` elenca tre
#   tabelle sole (`error_log`, `idempotency_keys`, `sessioni_utente`), quindi la
#   tabella di prova restava fuori e le due asserzioni cadevano nel ramo
#   «ok(true, scope non include tabella test)». Verdi per dichiarazione di
#   cecita', da sempre: l'orchestratore non era esercitato **mai**. Adesso la
#   fixture mette in scope le proprie tabelle, e le due asserzioni verificano.
#
# Dipendenze: nessuna. Consumo: il job settimanale di manutenzione.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20260823-06-update-fn-run-automations-cleanup-resiliente-mctit.yaml

  - changeSet:
      id: 20260823-06-update-fn-run-automations-cleanup-resiliente
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        dbops.fn_run_automations_cleanup: una tabella che rifiuta di essere pulita non fa
        piu' morire l'intero giro. Il doppio ciclo non aveva nessun EXCEPTION, quindi un
        solo veto (un trigger append-only, il guard sul DELETE dei log) fermava la passata
        e le tabelle successive non venivano piu' pulite — in silenzio. Adesso la tabella
        viene SALTATA e il rifiuto lascia una riga ERROR in audit_log con lo SQLSTATE:
        e' il quarto membro della famiglia di salti che la funzione aveva gia'
        (EXCLUDED, NO_CLEANUP_COLUMN, MISSING_TTL_DAYS), e si chiama BLOCKED_BY_TABLE.
        ⛔ query_canceled resta un'eccezione che si ri-solleva: uno stop e' uno stop.
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT COUNT(*) FROM pg_proc p
                    JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'dbops'
                     AND p.proname = 'fn_run_automations_cleanup';
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT COUNT(*) FROM pg_proc p
                    JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'dbops'
                     AND p.proname = 'fn_audit_log_once'
                     AND pg_get_function_identity_arguments(p.oid) LIKE '%p_sqlstate%';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |

              CREATE OR REPLACE FUNCTION dbops.fn_run_automations_cleanup(p_exec_mode text, p_schemas text[], p_dry_run boolean)
               RETURNS void
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_schemas text[];
                rtab record;
                rrule record;
                v_is_excluded boolean;
                v_cleanup_col text;
                v_base_col text;
                v_ttl_days integer;
                v_apply_on_update boolean;
                v_batch_limit integer;
                v_rows integer;
                v_params jsonb;
                v_rule_type text;
                -- ⭐ Le tre variabili del rifiuto: una tabella che si oppone non ferma il
                --   giro, ma non sparisce nemmeno — il suo SQLSTATE e il suo messaggio
                --   finiscono nell'audit.
                v_sqlstate text;
                v_errmsg text;
                v_errctx text;
              BEGIN

              /*
                Scopo
                -----
                Orchestratore per il framework di cleanup basato su cleanup_at.
                Applica due tipi di regola su tabelle in scope:
                - CLEANUP_AT   : calcola cleanup_at con TTL fisso
                - CLEANUP_PURGE: elimina record scaduti in batch

                Logica
                ------
                1) risolve lo scope (dbops.fn_resolve_scope)
                2) itera le tabelle fisiche nello scope (dbops.fn_table_in_scope)
                3) salta tabelle in dbops.automation_cleanup_exclusions (enabled=true)
                4) applica regole compatibili con exec_mode e target schema/table
                5) logga sempre su dbops.audit_log tramite fn_audit_log_once
              */

                v_schemas := dbops.fn_resolve_scope(p_schemas);

                FOR rtab IN
                  SELECT n.nspname AS schema_name,
                         c.relname AS table_name
                    FROM pg_class c
                    JOIN pg_namespace n ON n.oid=c.relnamespace
                   WHERE c.relkind='r'
                     AND n.nspname = ANY(v_schemas)
                     AND dbops.fn_table_in_scope(n.nspname, c.relname)
                LOOP
                  SELECT EXISTS(
                    SELECT 1
                      FROM dbops.automation_cleanup_exclusions e
                     WHERE e.enabled
                       AND e.schema_name = rtab.schema_name
                       AND e.table_name  = rtab.table_name
                  ) INTO v_is_excluded;

                  IF v_is_excluded THEN
                    PERFORM dbops.fn_audit_log_once(
                      p_function_name => 'dbops.fn_run_automations_cleanup',
                      p_status        => 'WARN',
                      p_rule_type     => 'CLEANUP',
                      p_exec_mode     => p_exec_mode,
                      p_parts         => ARRAY['CLEANUP'],
                      p_dry_run       => p_dry_run,
                      p_params        => jsonb_build_object(
                                          'table', rtab.schema_name||'.'||rtab.table_name,
                                          'skip_reason', 'EXCLUDED'
                                        ),
                      p_message       => 'Tabella esclusa da automation_cleanup_exclusions'
                    );
                    CONTINUE;
                  END IF;

                  FOR rrule IN
                    SELECT *
                      FROM dbops.automation_rules_tbl r
                     WHERE r.enabled
                       AND upper(btrim(r.rule_type)) IN ('CLEANUP_AT','CLEANUP_PURGE')
                       AND (upper(btrim(r.exec_mode)) = 'AUTO' OR r.exec_mode = p_exec_mode)
                       AND dbops.fn_schema_match(r.target_schema, rtab.schema_name)
                       AND (UPPER(r.target_table) = '*ALL' OR rtab.table_name ILIKE r.target_table)
                     ORDER BY r.priority, r.id
                  LOOP
                    v_rule_type := upper(btrim(rrule.rule_type));
                    v_params := COALESCE(rrule.params, '{}'::jsonb);
                    v_cleanup_col := COALESCE(NULLIF(btrim(v_params->>'cleanup_column'), ''), 'cleanup_at');

                    IF NOT dbops.fn_col_exists(rtab.schema_name, rtab.table_name, v_cleanup_col) THEN
                      PERFORM dbops.fn_audit_log_once(
                        p_function_name => 'dbops.fn_run_automations_cleanup',
                        p_status        => 'WARN',
                        p_rule_type     => v_rule_type,
                        p_exec_mode     => p_exec_mode,
                        p_parts         => ARRAY[v_rule_type],
                        p_dry_run       => p_dry_run,
                        p_params        => jsonb_build_object(
                                            'table', rtab.schema_name||'.'||rtab.table_name,
                                            'cleanup_column', v_cleanup_col,
                                            'skip_reason', 'NO_CLEANUP_COLUMN'
                                          ),
                        p_message       => 'Colonna cleanup non presente'
                      );
                      CONTINUE;
                    END IF;

                    IF v_rule_type = 'CLEANUP_AT' THEN
                      v_ttl_days := (v_params->>'ttl_days')::integer;
                      v_apply_on_update := COALESCE((v_params->>'apply_on_update')::boolean, false);
                      v_base_col := NULLIF(btrim(v_params->>'base_ts_column'), '');

                      IF v_base_col IS NULL THEN
                        IF dbops.fn_col_exists(rtab.schema_name, rtab.table_name, 'data_insert') THEN
                          v_base_col := 'data_insert';
                        ELSIF dbops.fn_col_exists(rtab.schema_name, rtab.table_name, 'executed_at') THEN
                          v_base_col := 'executed_at';
                        ELSIF dbops.fn_col_exists(rtab.schema_name, rtab.table_name, 'occurred_at') THEN
                          v_base_col := 'occurred_at';
                        ELSIF dbops.fn_col_exists(rtab.schema_name, rtab.table_name, 'created_at') THEN
                          v_base_col := 'created_at';
                        END IF;
                      END IF;

                      IF v_ttl_days IS NULL THEN
                        PERFORM dbops.fn_audit_log_once(
                          p_function_name => 'dbops.fn_run_automations_cleanup',
                          p_status        => 'WARN',
                          p_rule_type     => v_rule_type,
                          p_exec_mode     => p_exec_mode,
                          p_parts         => ARRAY[v_rule_type],
                          p_dry_run       => p_dry_run,
                          p_params        => jsonb_build_object(
                                              'table', rtab.schema_name||'.'||rtab.table_name,
                                              'cleanup_column', v_cleanup_col,
                                              'skip_reason', 'MISSING_TTL_DAYS'
                                            ),
                          p_message       => 'Parametro ttl_days mancante'
                        );
                        CONTINUE;
                      END IF;

                      IF v_base_col IS NULL OR NOT dbops.fn_col_exists(rtab.schema_name, rtab.table_name, v_base_col) THEN
                        PERFORM dbops.fn_audit_log_once(
                          p_function_name => 'dbops.fn_run_automations_cleanup',
                          p_status        => 'WARN',
                          p_rule_type     => v_rule_type,
                          p_exec_mode     => p_exec_mode,
                          p_parts         => ARRAY[v_rule_type],
                          p_dry_run       => p_dry_run,
                          p_params        => jsonb_build_object(
                                              'table', rtab.schema_name||'.'||rtab.table_name,
                                              'cleanup_column', v_cleanup_col,
                                              'base_ts_column', v_base_col,
                                              'skip_reason', 'MISSING_BASE_TS_COLUMN'
                                            ),
                          p_message       => 'Colonna base_ts non presente'
                        );
                        CONTINUE;
                      END IF;

                      BEGIN
                        v_rows := dbops.fn_apply_cleanup_at(
                          rtab.schema_name,
                          rtab.table_name,
                          v_cleanup_col,
                          v_base_col,
                          v_ttl_days,
                          v_apply_on_update,
                          p_dry_run
                        );

                        PERFORM dbops.fn_audit_log_once(
                          p_function_name => 'dbops.fn_run_automations_cleanup',
                          p_status        => CASE WHEN p_dry_run THEN 'DRYRUN' ELSE 'OK' END,
                          p_rule_type     => v_rule_type,
                          p_exec_mode     => p_exec_mode,
                          p_parts         => ARRAY[v_rule_type],
                          p_dry_run       => p_dry_run,
                          p_rows_affected => v_rows,
                          p_params        => jsonb_build_object(
                                              'table', rtab.schema_name||'.'||rtab.table_name,
                                              'cleanup_column', v_cleanup_col,
                                              'base_ts_column', v_base_col,
                                              'ttl_days', v_ttl_days,
                                              'apply_on_update', v_apply_on_update
                                            ),
                          p_message       => 'cleanup_at calcolato'
                        );
                      EXCEPTION
                        -- ⛔ Un annullamento resta un annullamento: se qualcuno ferma il job,
                        --    il job si ferma. Non e' una tabella che rifiuta.
                        WHEN query_canceled THEN
                          RAISE;
                        -- ⭐ Tutto il resto: la tabella viene SALTATA, non subita. Prima di
                        --    questa rete un solo veto (un trigger append-only, un guard sul
                        --    DELETE dei log) faceva morire l'INTERO giro: le tabelle che
                        --    venivano dopo non venivano piu' pulite, e nessuno lo sapeva.
                        --    ⚠️ Lo status e' ERROR e non WARN di proposito: i WARN di questa
                        --    funzione sono salti DICHIARATI (esclusa, senza colonna, senza
                        --    ttl). Questo non e' dichiarato — e' una tabella che si e'
                        --    opposta, e va distinta a colpo d'occhio.
                        WHEN OTHERS THEN
                          GET STACKED DIAGNOSTICS
                            v_sqlstate = RETURNED_SQLSTATE,
                            v_errmsg   = MESSAGE_TEXT,
                            v_errctx   = PG_EXCEPTION_CONTEXT;
                          PERFORM dbops.fn_audit_log_once(
                            p_function_name => 'dbops.fn_run_automations_cleanup',
                            p_status        => 'ERROR',
                            p_rule_type     => v_rule_type,
                            p_exec_mode     => p_exec_mode,
                            p_parts         => ARRAY[v_rule_type],
                            p_dry_run       => p_dry_run,
                            p_sqlstate      => v_sqlstate,
                            p_error_context => v_errctx,
                            p_params        => jsonb_build_object(
                                                'table', rtab.schema_name||'.'||rtab.table_name,
                                                'cleanup_column', v_cleanup_col,
                                                'skip_reason', 'BLOCKED_BY_TABLE'
                                              ),
                            p_message       => v_errmsg
                          );
                      END;

                    ELSIF v_rule_type = 'CLEANUP_PURGE' THEN
                      v_batch_limit := COALESCE((v_params->>'batch_limit')::integer, 5000);

                      BEGIN
                        v_rows := dbops.fn_purge_cleanup_expired(
                          rtab.schema_name,
                          rtab.table_name,
                          v_cleanup_col,
                          v_batch_limit,
                          p_dry_run
                        );

                        PERFORM dbops.fn_audit_log_once(
                          p_function_name => 'dbops.fn_run_automations_cleanup',
                          p_status        => CASE WHEN p_dry_run THEN 'DRYRUN' ELSE 'OK' END,
                          p_rule_type     => v_rule_type,
                          p_exec_mode     => p_exec_mode,
                          p_parts         => ARRAY[v_rule_type],
                          p_dry_run       => p_dry_run,
                          p_rows_affected => v_rows,
                          p_params        => jsonb_build_object(
                                              'table', rtab.schema_name||'.'||rtab.table_name,
                                              'cleanup_column', v_cleanup_col,
                                              'batch_limit', v_batch_limit
                                            ),
                          p_message       => 'cleanup eseguito'
                        );
                      EXCEPTION
                        -- ⛔ Un annullamento resta un annullamento: se qualcuno ferma il job,
                        --    il job si ferma. Non e' una tabella che rifiuta.
                        WHEN query_canceled THEN
                          RAISE;
                        -- ⭐ Tutto il resto: la tabella viene SALTATA, non subita. Prima di
                        --    questa rete un solo veto (un trigger append-only, un guard sul
                        --    DELETE dei log) faceva morire l'INTERO giro: le tabelle che
                        --    venivano dopo non venivano piu' pulite, e nessuno lo sapeva.
                        --    ⚠️ Lo status e' ERROR e non WARN di proposito: i WARN di questa
                        --    funzione sono salti DICHIARATI (esclusa, senza colonna, senza
                        --    ttl). Questo non e' dichiarato — e' una tabella che si e'
                        --    opposta, e va distinta a colpo d'occhio.
                        WHEN OTHERS THEN
                          GET STACKED DIAGNOSTICS
                            v_sqlstate = RETURNED_SQLSTATE,
                            v_errmsg   = MESSAGE_TEXT,
                            v_errctx   = PG_EXCEPTION_CONTEXT;
                          PERFORM dbops.fn_audit_log_once(
                            p_function_name => 'dbops.fn_run_automations_cleanup',
                            p_status        => 'ERROR',
                            p_rule_type     => v_rule_type,
                            p_exec_mode     => p_exec_mode,
                            p_parts         => ARRAY[v_rule_type],
                            p_dry_run       => p_dry_run,
                            p_sqlstate      => v_sqlstate,
                            p_error_context => v_errctx,
                            p_params        => jsonb_build_object(
                                                'table', rtab.schema_name||'.'||rtab.table_name,
                                                'cleanup_column', v_cleanup_col,
                                                'skip_reason', 'BLOCKED_BY_TABLE'
                                              ),
                            p_message       => v_errmsg
                          );
                      END;
                    END IF;
                  END LOOP;
                END LOOP;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_run_automations_cleanup(text, text[], boolean)
              IS 'Orchestratore cleanup_at con regole in dbops.automation_rules_tbl. Regole supportate: CLEANUP_AT (calcola cleanup_at con TTL fisso) e CLEANUP_PURGE (elimina i record scaduti, a batch). Parametri: p_exec_mode (AUTO/CI/SCHEDULED), p_schemas (scope schemi, NULL -> resolve da automation_scope), p_dry_run. ⭐ rev 2026-08-23: una tabella che RIFIUTA di essere pulita non fa piu'' morire il giro. Prima non c''era nessun EXCEPTION nel doppio ciclo, quindi un solo veto — un trigger append-only, il guard sul DELETE dei log — fermava l''intera passata e le tabelle successive non venivano piu'' pulite, senza che nessuno lo sapesse. Adesso la tabella viene saltata e il rifiuto lascia una riga ERROR in dbops.audit_log con SQLSTATE e contesto (skip_reason = BLOCKED_BY_TABLE): e'' il quarto membro della famiglia di salti che la funzione aveva gia'' (EXCLUDED, NO_CLEANUP_COLUMN, MISSING_TTL_DAYS, MISSING_BASE_TS_COLUMN). ⚠️ status ERROR e non WARN di proposito: i WARN sono salti DICHIARATI, questo e'' una tabella che si e'' opposta. ⛔ query_canceled si ri-solleva: un annullamento resta un annullamento. ⚠️ Ogni regola gira ora in una sottotransazione, che e'' cio'' che un blocco EXCEPTION implica.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |

              CREATE OR REPLACE FUNCTION dbops.fn_run_automations_cleanup(p_exec_mode text, p_schemas text[], p_dry_run boolean)
               RETURNS void
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_schemas text[];
                rtab record;
                rrule record;
                v_is_excluded boolean;
                v_cleanup_col text;
                v_base_col text;
                v_ttl_days integer;
                v_apply_on_update boolean;
                v_batch_limit integer;
                v_rows integer;
                v_params jsonb;
                v_rule_type text;
              BEGIN

              /*
                Scopo
                -----
                Orchestratore per il framework di cleanup basato su cleanup_at.
                Applica due tipi di regola su tabelle in scope:
                - CLEANUP_AT   : calcola cleanup_at con TTL fisso
                - CLEANUP_PURGE: elimina record scaduti in batch

                Logica
                ------
                1) risolve lo scope (dbops.fn_resolve_scope)
                2) itera le tabelle fisiche nello scope (dbops.fn_table_in_scope)
                3) salta tabelle in dbops.automation_cleanup_exclusions (enabled=true)
                4) applica regole compatibili con exec_mode e target schema/table
                5) logga sempre su dbops.audit_log tramite fn_audit_log_once
              */

                v_schemas := dbops.fn_resolve_scope(p_schemas);

                FOR rtab IN
                  SELECT n.nspname AS schema_name,
                         c.relname AS table_name
                    FROM pg_class c
                    JOIN pg_namespace n ON n.oid=c.relnamespace
                   WHERE c.relkind='r'
                     AND n.nspname = ANY(v_schemas)
                     AND dbops.fn_table_in_scope(n.nspname, c.relname)
                LOOP
                  SELECT EXISTS(
                    SELECT 1
                      FROM dbops.automation_cleanup_exclusions e
                     WHERE e.enabled
                       AND e.schema_name = rtab.schema_name
                       AND e.table_name  = rtab.table_name
                  ) INTO v_is_excluded;

                  IF v_is_excluded THEN
                    PERFORM dbops.fn_audit_log_once(
                      p_function_name => 'dbops.fn_run_automations_cleanup',
                      p_status        => 'WARN',
                      p_rule_type     => 'CLEANUP',
                      p_exec_mode     => p_exec_mode,
                      p_parts         => ARRAY['CLEANUP'],
                      p_dry_run       => p_dry_run,
                      p_params        => jsonb_build_object(
                                          'table', rtab.schema_name||'.'||rtab.table_name,
                                          'skip_reason', 'EXCLUDED'
                                        ),
                      p_message       => 'Tabella esclusa da automation_cleanup_exclusions'
                    );
                    CONTINUE;
                  END IF;

                  FOR rrule IN
                    SELECT *
                      FROM dbops.automation_rules_tbl r
                     WHERE r.enabled
                       AND upper(btrim(r.rule_type)) IN ('CLEANUP_AT','CLEANUP_PURGE')
                       AND (upper(btrim(r.exec_mode)) = 'AUTO' OR r.exec_mode = p_exec_mode)
                       AND dbops.fn_schema_match(r.target_schema, rtab.schema_name)
                       AND (UPPER(r.target_table) = '*ALL' OR rtab.table_name ILIKE r.target_table)
                     ORDER BY r.priority, r.id
                  LOOP
                    v_rule_type := upper(btrim(rrule.rule_type));
                    v_params := COALESCE(rrule.params, '{}'::jsonb);
                    v_cleanup_col := COALESCE(NULLIF(btrim(v_params->>'cleanup_column'), ''), 'cleanup_at');

                    IF NOT dbops.fn_col_exists(rtab.schema_name, rtab.table_name, v_cleanup_col) THEN
                      PERFORM dbops.fn_audit_log_once(
                        p_function_name => 'dbops.fn_run_automations_cleanup',
                        p_status        => 'WARN',
                        p_rule_type     => v_rule_type,
                        p_exec_mode     => p_exec_mode,
                        p_parts         => ARRAY[v_rule_type],
                        p_dry_run       => p_dry_run,
                        p_params        => jsonb_build_object(
                                            'table', rtab.schema_name||'.'||rtab.table_name,
                                            'cleanup_column', v_cleanup_col,
                                            'skip_reason', 'NO_CLEANUP_COLUMN'
                                          ),
                        p_message       => 'Colonna cleanup non presente'
                      );
                      CONTINUE;
                    END IF;

                    IF v_rule_type = 'CLEANUP_AT' THEN
                      v_ttl_days := (v_params->>'ttl_days')::integer;
                      v_apply_on_update := COALESCE((v_params->>'apply_on_update')::boolean, false);
                      v_base_col := NULLIF(btrim(v_params->>'base_ts_column'), '');

                      IF v_base_col IS NULL THEN
                        IF dbops.fn_col_exists(rtab.schema_name, rtab.table_name, 'data_insert') THEN
                          v_base_col := 'data_insert';
                        ELSIF dbops.fn_col_exists(rtab.schema_name, rtab.table_name, 'executed_at') THEN
                          v_base_col := 'executed_at';
                        ELSIF dbops.fn_col_exists(rtab.schema_name, rtab.table_name, 'occurred_at') THEN
                          v_base_col := 'occurred_at';
                        ELSIF dbops.fn_col_exists(rtab.schema_name, rtab.table_name, 'created_at') THEN
                          v_base_col := 'created_at';
                        END IF;
                      END IF;

                      IF v_ttl_days IS NULL THEN
                        PERFORM dbops.fn_audit_log_once(
                          p_function_name => 'dbops.fn_run_automations_cleanup',
                          p_status        => 'WARN',
                          p_rule_type     => v_rule_type,
                          p_exec_mode     => p_exec_mode,
                          p_parts         => ARRAY[v_rule_type],
                          p_dry_run       => p_dry_run,
                          p_params        => jsonb_build_object(
                                              'table', rtab.schema_name||'.'||rtab.table_name,
                                              'cleanup_column', v_cleanup_col,
                                              'skip_reason', 'MISSING_TTL_DAYS'
                                            ),
                          p_message       => 'Parametro ttl_days mancante'
                        );
                        CONTINUE;
                      END IF;

                      IF v_base_col IS NULL OR NOT dbops.fn_col_exists(rtab.schema_name, rtab.table_name, v_base_col) THEN
                        PERFORM dbops.fn_audit_log_once(
                          p_function_name => 'dbops.fn_run_automations_cleanup',
                          p_status        => 'WARN',
                          p_rule_type     => v_rule_type,
                          p_exec_mode     => p_exec_mode,
                          p_parts         => ARRAY[v_rule_type],
                          p_dry_run       => p_dry_run,
                          p_params        => jsonb_build_object(
                                              'table', rtab.schema_name||'.'||rtab.table_name,
                                              'cleanup_column', v_cleanup_col,
                                              'base_ts_column', v_base_col,
                                              'skip_reason', 'MISSING_BASE_TS_COLUMN'
                                            ),
                          p_message       => 'Colonna base_ts non presente'
                        );
                        CONTINUE;
                      END IF;

                      v_rows := dbops.fn_apply_cleanup_at(
                        rtab.schema_name,
                        rtab.table_name,
                        v_cleanup_col,
                        v_base_col,
                        v_ttl_days,
                        v_apply_on_update,
                        p_dry_run
                      );

                      PERFORM dbops.fn_audit_log_once(
                        p_function_name => 'dbops.fn_run_automations_cleanup',
                        p_status        => CASE WHEN p_dry_run THEN 'DRYRUN' ELSE 'OK' END,
                        p_rule_type     => v_rule_type,
                        p_exec_mode     => p_exec_mode,
                        p_parts         => ARRAY[v_rule_type],
                        p_dry_run       => p_dry_run,
                        p_rows_affected => v_rows,
                        p_params        => jsonb_build_object(
                                            'table', rtab.schema_name||'.'||rtab.table_name,
                                            'cleanup_column', v_cleanup_col,
                                            'base_ts_column', v_base_col,
                                            'ttl_days', v_ttl_days,
                                            'apply_on_update', v_apply_on_update
                                          ),
                        p_message       => 'cleanup_at calcolato'
                      );

                    ELSIF v_rule_type = 'CLEANUP_PURGE' THEN
                      v_batch_limit := COALESCE((v_params->>'batch_limit')::integer, 5000);

                      v_rows := dbops.fn_purge_cleanup_expired(
                        rtab.schema_name,
                        rtab.table_name,
                        v_cleanup_col,
                        v_batch_limit,
                        p_dry_run
                      );

                      PERFORM dbops.fn_audit_log_once(
                        p_function_name => 'dbops.fn_run_automations_cleanup',
                        p_status        => CASE WHEN p_dry_run THEN 'DRYRUN' ELSE 'OK' END,
                        p_rule_type     => v_rule_type,
                        p_exec_mode     => p_exec_mode,
                        p_parts         => ARRAY[v_rule_type],
                        p_dry_run       => p_dry_run,
                        p_rows_affected => v_rows,
                        p_params        => jsonb_build_object(
                                            'table', rtab.schema_name||'.'||rtab.table_name,
                                            'cleanup_column', v_cleanup_col,
                                            'batch_limit', v_batch_limit
                                          ),
                        p_message       => 'cleanup eseguito'
                      );
                    END IF;
                  END LOOP;
                END LOOP;
              END;
              $function$;
