              END;
              $function$;

              DO $c$
              BEGIN
                  EXECUTE format('COMMENT ON FUNCTION dbops.fn_get_or_create_session_tx_id() IS %L',
                      replace(coalesce(obj_description('dbops.fn_get_or_create_session_tx_id()'::regprocedure, 'pg_proc'), ''), '⭐ rev 2026-10-18 (20261018-52, D-3b-3): genera sulla connessione persistente logconn invece di aprirne una a ogni transazione (~12 -> ~1,3 ms); la stringa di connessione resta il ripiego. ', ''));
              END
              $c$;

