# IL TX_ID SI GENERA SULLA CONNESSIONE DI LOG GIA' APERTA
#   dbops.fn_get_or_create_session_tx_id()
#   Brief: brief-db-plancache-funzioni-con-query-incorporate §5sexies, D-3b-3.
#
# ── IL DIFETTO ──────────────────────────────────────────────────────
#   Il passo 1 apre (o trova aperta) la connessione persistente 'logconn'
#   (script.fn_ensure_logconn), ma il passo 3 chiamava dblink con la STRINGA
#   di connessione (myapp.dblink_log_connection): dblink apriva e chiudeva una
#   connessione nuova a ogni chiamata, cioe' alla prima scrittura di ogni
#   transazione (305 trigger tx_id), e 'logconn' restava inutilizzata.
#   Fatti datati (2026-10-18, dbdev): da superuser connessione 26 ms,
#   fn_generate_tx_id sulla connessione aperta 1,3 ms (0,07 ms di esecuzione
#   remota); come app la prima chiamata di ogni transazione 12-13 ms.
#
# ── LA CURA ─────────────────────────────────────────────────────────
#   dblink('logconn', ...) quando 'logconn' e' aperta. Ripiego sulla stringa
#   (il comportamento di prima) se non c'e' — il passo 1 puo' non aprirla
#   (too_many_connections) — e se la chiamata sulla persistente fallisce
#   (connessione caduta): la si chiude e si riprova una volta da una nuova.
#   Il resto invariato: sentinella uuid_nil senza GUC su ogni guasto, GUC
#   dbops.tx_id locale alla transazione, registrazione autonoma.
#   Corpo vivo = 20260912-40 (verificato riga per riga, 2026-10-18).
#
# ── PRESTITO DI PROPRIETA' ──────────────────────────────────────────
#   La funzione e' di postgres (dbops.sec_functions_owner): il rito di
#   20260912-40, nelle modifiche e nel rollback.

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261018-52-update-fn-get-or-create-session-tx-id-logconn-persistente-mctit.yaml

  - changeSet:
      id: 20261018-52-update-fn-get-or-create-session-tx-id-logconn-persistente
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.fn_get_or_create_session_tx_id genera il tx_id sulla connessione persistente logconn invece di aprirne una a ogni transazione; la stringa di connessione resta il ripiego. D-3b-3.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'dbops' AND p.proname = 'fn_get_or_create_session_tx_id'
                 AND pg_catalog.pg_get_function_identity_arguments(p.oid) = ''
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'dbops' AND p.proname = 'fn_sync_functions_owner'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- ========================================================
              -- PRESTITO DI PROPRIETA' (precedenti 20260722-10, 20260912-40)
              -- ========================================================
              UPDATE dbops.sec_functions_owner
                 SET required_owner = current_user
               WHERE schema_name   = 'dbops'
                 AND function_name = 'fn_get_or_create_session_tx_id';

              SELECT dbops.fn_sync_functions_owner();

              CREATE OR REPLACE FUNCTION dbops.fn_get_or_create_session_tx_id()
               RETURNS dbops.transaction_ids.id%TYPE
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              DECLARE
                  v_tx_id        dbops.transaction_ids.id%TYPE;
                  v_dblink_conn  text;
              BEGIN
                  ----------------------------------------------------------------------
                  -- 0) Se esiste gia' un tx_id in sessione, riusalo e basta
                  ----------------------------------------------------------------------
                  BEGIN
                      v_tx_id := current_setting('dbops.tx_id', true)::uuid;
                  EXCEPTION WHEN OTHERS THEN
                      v_tx_id := NULL;
                  END;

                  IF v_tx_id IS NOT NULL THEN
                      RETURN v_tx_id;
                  END IF;

                  ----------------------------------------------------------------------
                  -- 1) Assicura la connessione di log (helper canonico, come in v1).
                  --    Rispetta myapp.log_with_dblink (default 'on'), la connstring
                  --    assente e il too_many_connections: non blocca mai il chiamante.
                  ----------------------------------------------------------------------
                  PERFORM script.fn_ensure_logconn();

                  ----------------------------------------------------------------------
                  -- 2) Verifica che il parametro di connessione dblink sia impostato
                  ----------------------------------------------------------------------
                  BEGIN
                      v_dblink_conn := current_setting('myapp.dblink_log_connection', true);
                  EXCEPTION WHEN OTHERS THEN
                      v_dblink_conn := NULL;
                  END;

                  IF v_dblink_conn IS NULL OR length(trim(v_dblink_conn)) = 0 THEN
                      -- Ripiego (a): nessun canale. Sentinella, e NIENTE set_config:
                      -- pubblicare un id non registrato avvelenerebbe la sessione e
                      -- farebbe fallire ogni scrittura tx_id-managed successiva.
                      RAISE WARNING
                          'dbops.fn_get_or_create_session_tx_id: parametro myapp.dblink_log_connection non impostato; uso la sentinella uuid_nil e non pubblico la GUC di sessione. '
                          'Impostare il parametro a livello DATABASE/ROLE o ALTER SYSTEM.';

                      RETURN script.uuid_nil();
                  END IF;

                  ----------------------------------------------------------------------
                  -- 3) Generazione tx_id tramite dblink verso il DB di log.
                  --    E' l'unico percorso che REGISTRA in dbops.transaction_ids, e lo
                  --    fa su una connessione separata: la registrazione sopravvive al
                  --    rollback della transazione di business (autonomia).
                  --    ⭐ Rev 2026-10-18 (20261018-52, D-3b-3 di brief-db-plancache-
                  --    funzioni-con-query-incorporate): sulla connessione PERSISTENTE
                  --    'logconn', quella che il passo 1 apre o trova gia' aperta. Fino a
                  --    oggi qui si passava la STRINGA di connessione, e dblink apriva e
                  --    chiudeva una connessione a ogni chiamata, cioe' a ogni
                  --    transazione che scrive: ~12 ms ciascuna, contro 1,3 ms sulla
                  --    connessione aperta (misura da superuser, dbdev, 2026-10-18), con
                  --    'logconn' aperta e inutilizzata.
                  --    La stringa resta il ripiego: se 'logconn' non c'e' (il passo 1 non
                  --    l'ha potuta aprire: too_many_connections) e se e' caduta (server
                  --    riavviato): la si chiude e si riprova UNA volta da una connessione
                  --    nuova, come faceva sempre la versione di prima.
                  ----------------------------------------------------------------------
                  BEGIN
                      IF 'logconn' = ANY (coalesce(dblink_get_connections(), ARRAY[]::text[])) THEN
                          BEGIN
                              SELECT tx_id
                              INTO v_tx_id
                              FROM dblink(
                                  'logconn',
                                  $gen$
                                      SELECT dbops.fn_generate_tx_id(
                                          'dbops.fn_get_or_create_session_tx_id',
                                          jsonb_build_object('source','fn_get_or_create')
                                      )
                                  $gen$
                              ) AS t(tx_id uuid);
                          EXCEPTION WHEN OTHERS THEN
                              BEGIN
                                  PERFORM dblink_disconnect('logconn');
                              EXCEPTION WHEN OTHERS THEN
                                  NULL;
                              END;
                              SELECT tx_id
                              INTO v_tx_id
                              FROM dblink(
                                  v_dblink_conn,
                                  $gen$
                                      SELECT dbops.fn_generate_tx_id(
                                          'dbops.fn_get_or_create_session_tx_id',
                                          jsonb_build_object('source','fn_get_or_create')
                                      )
                                  $gen$
                              ) AS t(tx_id uuid);
                          END;
                      ELSE
                          SELECT tx_id
                          INTO v_tx_id
                          FROM dblink(
                              v_dblink_conn,
                              $gen$
                                  SELECT dbops.fn_generate_tx_id(
                                      'dbops.fn_get_or_create_session_tx_id',
                                      jsonb_build_object('source','fn_get_or_create')
                                  )
                              $gen$
                          ) AS t(tx_id uuid);
                      END IF;

                      -- Ripiego (b): dblink ha risposto ma con NULL -> niente id
                      -- registrato, quindi sentinella e nessuna pubblicazione.
                      IF v_tx_id IS NULL THEN
                          RAISE WARNING
                              'dbops.fn_get_or_create_session_tx_id: dblink ha restituito NULL; uso la sentinella uuid_nil e non pubblico la GUC di sessione.';
                          RETURN script.uuid_nil();
                      END IF;

                      -- Solo qui l'id e' REGISTRATO: si puo' pubblicare.
                      -- Scope LOCALE alla transazione (v1): un identificativo di
                      -- transazione non deve sopravvivere alla transazione.
                      PERFORM set_config('dbops.tx_id', v_tx_id::text, TRUE);

                  EXCEPTION WHEN OTHERS THEN
                      -- Ripiego (c): errore dblink -> sentinella, nessuna pubblicazione.
                      RAISE WARNING
                          'dbops.fn_get_or_create_session_tx_id: errore durante la chiamata dblink a dbops.fn_generate_tx_id: %; uso la sentinella uuid_nil e non pubblico la GUC di sessione.',
                          SQLERRM;

                      RETURN script.uuid_nil();
                  END;

                  ----------------------------------------------------------------------
                  -- 4) Ritorna il tx_id (mai NULL)
                  ----------------------------------------------------------------------
                  RETURN v_tx_id;
              END;
              $function$;

              DO $c$
              BEGIN
                  EXECUTE format('COMMENT ON FUNCTION dbops.fn_get_or_create_session_tx_id() IS %L',
                      '⭐ rev 2026-10-18 (20261018-52, D-3b-3): genera sulla connessione persistente logconn invece di aprirne una a ogni transazione (~12 -> ~1,3 ms); la stringa di connessione resta il ripiego. ' || coalesce(obj_description('dbops.fn_get_or_create_session_tx_id()'::regprocedure, 'pg_proc'), ''));
              END
              $c$;

              -- ========================================================
              -- RESTITUZIONE DELLA PROPRIETA': il registro torna a dichiarare postgres e
              -- si risincronizza. Rete di sicurezza: 90_end/20251123-04 (runAlways).
              -- ========================================================
              UPDATE dbops.sec_functions_owner
                 SET required_owner = 'postgres'
               WHERE schema_name   = 'dbops'
                 AND function_name = 'fn_get_or_create_session_tx_id';

              SELECT dbops.fn_sync_functions_owner();
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- ========================================================
              -- PRESTITO DI PROPRIETA' (precedenti 20260722-10, 20260912-40)
              -- ========================================================
