# dbops.fn_run_automations_cleanup restituisce il suo riepilogo: una corsa
# con tabelle che hanno rifiutato e' rossa.
#   Brief: brief-db-revisione-dbops, D40 (giro 1, blocco 1c).
#
# Base: 20_code/dbops/20260823-06, verificato uguale al vivo.
#
# ⚠️ IL DIFETTO. Una tabella che rifiuta la pulizia (un guard sul DELETE, un
#   trigger append-only) non ferma il giro, ed e' giusto: viene saltata e
#   lascia una riga ERROR in dbops.audit_log (BLOCKED_BY_TABLE). Ma la
#   funzione era void: maintenance.fn_run_and_log non riceveva niente, e la
#   corsa del job automations_cleanup restava VERDE in
#   maintenance.vw_job_run_da_guardare. Il rifiuto si vedeva solo andando a
#   cercarlo nell'audit. E' D5 di brief-db-revisione-maintenance, che quel
#   giro ha chiuso per l'apply della storicizzazione (20261103-67) e non qui.
#
# ⭐ LA CORREZIONE. La stessa logica, regola per regola, ma la funzione
#   RESTITUISCE il riepilogo come jsonb, nella forma di
#   maintenance.fn_apply_storicizza_defaults:
#     _applicate  le regole applicate (OK, o DRYRUN nel dry run)
#     _saltate    i salti DICHIARATI (EXCLUDED, NO_CLEANUP_COLUMN,
#                 MISSING_TTL_DAYS, MISSING_BASE_TS_COLUMN)
#     _falliti    le tabelle che hanno rifiutato (BLOCKED_BY_TABLE)
#     _saltate_motivi  i salti contati per motivo
#     _righe      le righe toccate dalle regole applicate
#     _dettaglio  i rifiuti, uno per uno, con tabella, regola, SQLSTATE e
#                 messaggio. ⚠️ I salti NON ci vanno: una regola *ALL ne fa uno
#                 per ogni tabella senza la colonna (924 sullo scratch, fatto
#                 datato 2026-11-04), e finirebbero a ogni corsa in meta.esito
#   Il job la chiama gia' con una SELECT
#   (maintenance.proc_automations_cleanup_job): fn_run_and_log legge
#   l'esito, e _falliti > 0 rende la corsa rossa con E_JOB_ESITO_CON_SCARTI
#   senza annullare le tabelle pulite. Il wrapper non cambia.
#   Le righe di audit restano tutte com'erano.
#
# ⚠️ LA FORMA. Cambia il tipo restituito (void -> jsonb): CREATE OR REPLACE
#   non lo permette, quindi DROP e CREATE nella stessa transazione. Nessun
#   oggetto dipende dalla funzione (la chiamano per nome il wrapper e i
#   pgTAP; nessun altro corpo la invoca). EXECUTE all'app torna dai default
#   privileges del migratore, com'era prima del DROP: lo verifica
#   db/pgtap/dbops/test-cleanup-framework.sql.
#   Firma con %TYPE: p_exec_mode e p_dry_run finiscono in dbops.audit_log,
#   i tipi risolti sono quelli di oggi (text, boolean).
#   Tipi espliciti, con la ragione: p_schemas text[] (%TYPE non fa array);
#   RETURNS jsonb (un riepilogo, nessuna colonna lo porta); i valori letti dai
#   params jsonb della regola (colonne, ttl, batch, apply_on_update) che
#   nessuna colonna porta; i contatori e il flag di esclusione, locali.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261104-51-update-fn-run-automations-cleanup-riepilogo-mctit.yaml

  - changeSet:
      id: 20261104-51-update-fn-run-automations-cleanup-riepilogo
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.fn_run_automations_cleanup restituisce il riepilogo jsonb (_applicate,
        _saltate, _saltate_motivi, _falliti, _righe, _dettaglio): una corsa del job con tabelle che hanno
        rifiutato diventa rossa in vw_job_run_da_guardare (D40). void -> jsonb: DROP e
        CREATE.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'dbops' AND p.proname = 'fn_run_automations_cleanup';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION dbops.fn_run_automations_cleanup(
                  dbops.audit_log.exec_mode%TYPE, text[], dbops.audit_log.dry_run%TYPE);

              CREATE FUNCTION dbops.fn_run_automations_cleanup(
                  p_exec_mode dbops.audit_log.exec_mode%TYPE,
                  p_schemas   text[],
                  p_dry_run   dbops.audit_log.dry_run%TYPE)
              RETURNS jsonb
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                -- text[]: %TYPE non fa array
                v_schemas text[];
                rtab record;
                rrule record;
                -- flag locale
                v_is_excluded boolean;
                -- text, integer, boolean: valori letti dai params jsonb della
                -- regola, nessuna colonna li porta
                v_cleanup_col text;
                v_base_col text;
                v_ttl_days integer;
                v_apply_on_update boolean;
                v_batch_limit integer;
                v_rows dbops.audit_log.rows_affected%TYPE;
                v_params dbops.automation_rules_tbl.params%TYPE;
                v_rule_type dbops.automation_rules_tbl.rule_type%TYPE;
                -- ⭐ Le tre variabili del rifiuto: una tabella che si oppone non ferma il
                --   giro, ma non sparisce nemmeno — il suo SQLSTATE e il suo messaggio
                --   finiscono nell'audit, e la tabella nel riepilogo.
                v_sqlstate dbops.audit_log.sqlstate%TYPE;
                v_errmsg dbops.audit_log.message%TYPE;
                v_errctx dbops.audit_log.error_context%TYPE;
                -- ⭐ Il riepilogo che il job legge (contatori locali).
                v_applicate integer := 0;
                v_saltate   integer := 0;
                v_falliti   integer := 0;
                v_righe     bigint  := 0;
                -- i salti dichiarati si CONTANO per motivo: una regola *ALL ne fa
                -- uno per ogni tabella senza la colonna, e il dettaglio di ognuno
                -- finirebbe a ogni corsa nel giornale del job
                v_saltate_motivi jsonb := '{}'::jsonb;
                -- i rifiuti, uno per uno: sono cio' che va guardato
                v_dettaglio jsonb   := '[]'::jsonb;
              BEGIN

              /*
                Scopo
                -----
                Orchestratore per il framework di cleanup basato su cleanup_at.
                Applica due tipi di regola su tabelle in scope:
                - CLEANUP_AT   : calcola cleanup_at con TTL fisso
                - CLEANUP_PURGE: elimina record scaduti in batch

                Logica
                ------
                1) risolve lo scope (dbops.fn_resolve_scope)
                2) itera le tabelle fisiche nello scope (dbops.fn_table_in_scope)
                3) salta tabelle in dbops.automation_cleanup_exclusions (enabled=true)
                4) applica regole compatibili con exec_mode e target schema/table
                5) logga sempre su dbops.audit_log tramite fn_audit_log_once
                6) restituisce il riepilogo: _falliti > 0 rende rossa la corsa del job
              */

                v_schemas := dbops.fn_resolve_scope(p_schemas);

                FOR rtab IN
                  SELECT n.nspname AS schema_name,
                         c.relname AS table_name
                    FROM pg_class c
                    JOIN pg_namespace n ON n.oid=c.relnamespace
                   WHERE c.relkind='r'
                     AND n.nspname = ANY(v_schemas)
                     AND dbops.fn_table_in_scope(n.nspname, c.relname)
                LOOP
                  SELECT EXISTS(
                    SELECT 1
                      FROM dbops.automation_cleanup_exclusions e
                     WHERE e.enabled
                       AND e.schema_name = rtab.schema_name
                       AND e.table_name  = rtab.table_name
                  ) INTO v_is_excluded;

                  IF v_is_excluded THEN
                    PERFORM dbops.fn_audit_log_once(
                      p_function_name => 'dbops.fn_run_automations_cleanup',
                      p_status        => 'WARN',
                      p_rule_type     => 'CLEANUP',
                      p_exec_mode     => p_exec_mode,
                      p_parts         => ARRAY['CLEANUP'],
                      p_dry_run       => p_dry_run,
                      p_params        => jsonb_build_object(
                                          'table', rtab.schema_name||'.'||rtab.table_name,
                                          'skip_reason', 'EXCLUDED'
                                        ),
                      p_message       => 'Tabella esclusa da automation_cleanup_exclusions'
                    );
                    v_saltate := v_saltate + 1;
                    v_saltate_motivi := jsonb_set(v_saltate_motivi, '{EXCLUDED}',
                        to_jsonb(COALESCE((v_saltate_motivi ->> 'EXCLUDED')::integer, 0) + 1));
                    CONTINUE;
                  END IF;

                  FOR rrule IN
                    SELECT *
                      FROM dbops.automation_rules_tbl r
                     WHERE r.enabled
                       AND upper(btrim(r.rule_type)) IN ('CLEANUP_AT','CLEANUP_PURGE')
                       AND (upper(btrim(r.exec_mode)) = 'AUTO' OR r.exec_mode = p_exec_mode)
                       AND dbops.fn_schema_match(r.target_schema, rtab.schema_name)
                       AND (UPPER(r.target_table) = '*ALL' OR rtab.table_name ILIKE r.target_table)
                     ORDER BY r.priority, r.id
                  LOOP
                    v_rule_type := upper(btrim(rrule.rule_type));
                    v_params := COALESCE(rrule.params, '{}'::jsonb);
                    v_cleanup_col := COALESCE(NULLIF(btrim(v_params->>'cleanup_column'), ''), 'cleanup_at');

                    IF NOT dbops.fn_col_exists(rtab.schema_name, rtab.table_name, v_cleanup_col) THEN
                      PERFORM dbops.fn_audit_log_once(
                        p_function_name => 'dbops.fn_run_automations_cleanup',
                        p_status        => 'WARN',
                        p_rule_type     => v_rule_type,
                        p_exec_mode     => p_exec_mode,
                        p_parts         => ARRAY[v_rule_type],
                        p_dry_run       => p_dry_run,
                        p_params        => jsonb_build_object(
                                            'table', rtab.schema_name||'.'||rtab.table_name,
                                            'cleanup_column', v_cleanup_col,
                                            'skip_reason', 'NO_CLEANUP_COLUMN'
                                          ),
                        p_message       => 'Colonna cleanup non presente'
                      );
                      v_saltate := v_saltate + 1;
                      v_saltate_motivi := jsonb_set(v_saltate_motivi, '{NO_CLEANUP_COLUMN}',
                          to_jsonb(COALESCE((v_saltate_motivi ->> 'NO_CLEANUP_COLUMN')::integer, 0) + 1));
                      CONTINUE;
                    END IF;

                    IF v_rule_type = 'CLEANUP_AT' THEN
                      v_ttl_days := (v_params->>'ttl_days')::integer;
                      v_apply_on_update := COALESCE((v_params->>'apply_on_update')::boolean, false);
                      v_base_col := NULLIF(btrim(v_params->>'base_ts_column'), '');

                      IF v_base_col IS NULL THEN
                        IF dbops.fn_col_exists(rtab.schema_name, rtab.table_name, 'data_insert') THEN
                          v_base_col := 'data_insert';
                        ELSIF dbops.fn_col_exists(rtab.schema_name, rtab.table_name, 'executed_at') THEN
                          v_base_col := 'executed_at';
                        ELSIF dbops.fn_col_exists(rtab.schema_name, rtab.table_name, 'occurred_at') THEN
                          v_base_col := 'occurred_at';
                        ELSIF dbops.fn_col_exists(rtab.schema_name, rtab.table_name, 'created_at') THEN
                          v_base_col := 'created_at';
                        END IF;
                      END IF;

                      IF v_ttl_days IS NULL THEN
                        PERFORM dbops.fn_audit_log_once(
                          p_function_name => 'dbops.fn_run_automations_cleanup',
                          p_status        => 'WARN',
                          p_rule_type     => v_rule_type,
                          p_exec_mode     => p_exec_mode,
                          p_parts         => ARRAY[v_rule_type],
                          p_dry_run       => p_dry_run,
                          p_params        => jsonb_build_object(
                                              'table', rtab.schema_name||'.'||rtab.table_name,
                                              'cleanup_column', v_cleanup_col,
                                              'skip_reason', 'MISSING_TTL_DAYS'
                                            ),
                          p_message       => 'Parametro ttl_days mancante'
                        );
                        v_saltate := v_saltate + 1;
                        v_saltate_motivi := jsonb_set(v_saltate_motivi, '{MISSING_TTL_DAYS}',
                            to_jsonb(COALESCE((v_saltate_motivi ->> 'MISSING_TTL_DAYS')::integer, 0) + 1));
                        CONTINUE;
                      END IF;

                      IF v_base_col IS NULL OR NOT dbops.fn_col_exists(rtab.schema_name, rtab.table_name, v_base_col) THEN
                        PERFORM dbops.fn_audit_log_once(
                          p_function_name => 'dbops.fn_run_automations_cleanup',
                          p_status        => 'WARN',
                          p_rule_type     => v_rule_type,
                          p_exec_mode     => p_exec_mode,
                          p_parts         => ARRAY[v_rule_type],
                          p_dry_run       => p_dry_run,
                          p_params        => jsonb_build_object(
                                              'table', rtab.schema_name||'.'||rtab.table_name,
                                              'cleanup_column', v_cleanup_col,
                                              'base_ts_column', v_base_col,
                                              'skip_reason', 'MISSING_BASE_TS_COLUMN'
                                            ),
                          p_message       => 'Colonna base_ts non presente'
                        );
                        v_saltate := v_saltate + 1;
                        v_saltate_motivi := jsonb_set(v_saltate_motivi, '{MISSING_BASE_TS_COLUMN}',
                            to_jsonb(COALESCE((v_saltate_motivi ->> 'MISSING_BASE_TS_COLUMN')::integer, 0) + 1));
                        CONTINUE;
                      END IF;

                      BEGIN
                        v_rows := dbops.fn_apply_cleanup_at(
                          rtab.schema_name,
                          rtab.table_name,
                          v_cleanup_col,
                          v_base_col,
                          v_ttl_days,
                          v_apply_on_update,
                          p_dry_run
                        );

                        PERFORM dbops.fn_audit_log_once(
                          p_function_name => 'dbops.fn_run_automations_cleanup',
                          p_status        => CASE WHEN p_dry_run THEN 'DRYRUN' ELSE 'OK' END,
                          p_rule_type     => v_rule_type,
                          p_exec_mode     => p_exec_mode,
                          p_parts         => ARRAY[v_rule_type],
                          p_dry_run       => p_dry_run,
                          p_rows_affected => v_rows,
                          p_params        => jsonb_build_object(
                                              'table', rtab.schema_name||'.'||rtab.table_name,
                                              'cleanup_column', v_cleanup_col,
                                              'base_ts_column', v_base_col,
                                              'ttl_days', v_ttl_days,
                                              'apply_on_update', v_apply_on_update
                                            ),
                          p_message       => 'cleanup_at calcolato'
                        );
                        v_applicate := v_applicate + 1;
                        v_righe := v_righe + COALESCE(v_rows, 0);
                      EXCEPTION
                        -- ⛔ Un annullamento resta un annullamento: se qualcuno ferma il job,
                        --    il job si ferma. Non e' una tabella che rifiuta.
                        WHEN query_canceled THEN
                          RAISE;
                        -- ⭐ Tutto il resto: la tabella viene SALTATA, non subita. Prima di
                        --    questa rete un solo veto (un trigger append-only, un guard sul
                        --    DELETE dei log) faceva morire l'INTERO giro: le tabelle che
                        --    venivano dopo non venivano piu' pulite, e nessuno lo sapeva.
                        --    ⚠️ Lo status e' ERROR e non WARN di proposito: i WARN di questa
                        --    funzione sono salti DICHIARATI (esclusa, senza colonna, senza
                        --    ttl). Questo non e' dichiarato — e' una tabella che si e'
                        --    opposta, e va distinta a colpo d'occhio. Per questo conta in
                        --    _falliti, e la corsa del job diventa rossa.
                        WHEN OTHERS THEN
                          GET STACKED DIAGNOSTICS
                            v_sqlstate = RETURNED_SQLSTATE,
                            v_errmsg   = MESSAGE_TEXT,
                            v_errctx   = PG_EXCEPTION_CONTEXT;
                          PERFORM dbops.fn_audit_log_once(
                            p_function_name => 'dbops.fn_run_automations_cleanup',
                            p_status        => 'ERROR',
                            p_rule_type     => v_rule_type,
                            p_exec_mode     => p_exec_mode,
                            p_parts         => ARRAY[v_rule_type],
                            p_dry_run       => p_dry_run,
                            p_sqlstate      => v_sqlstate,
                            p_error_context => v_errctx,
                            p_params        => jsonb_build_object(
                                                'table', rtab.schema_name||'.'||rtab.table_name,
                                                'cleanup_column', v_cleanup_col,
                                                'skip_reason', 'BLOCKED_BY_TABLE'
                                              ),
                            p_message       => v_errmsg
                          );
                          v_falliti := v_falliti + 1;
                          v_dettaglio := v_dettaglio || jsonb_build_object(
                              'tabella',   rtab.schema_name||'.'||rtab.table_name,
                              'regola',    v_rule_type,
                              'motivo',    'BLOCKED_BY_TABLE',
                              'sqlstate',  v_sqlstate,
                              'messaggio', v_errmsg);
                      END;

                    ELSIF v_rule_type = 'CLEANUP_PURGE' THEN
                      v_batch_limit := COALESCE((v_params->>'batch_limit')::integer, 5000);

                      BEGIN
                        v_rows := dbops.fn_purge_cleanup_expired(
                          rtab.schema_name,
                          rtab.table_name,
                          v_cleanup_col,
                          v_batch_limit,
                          p_dry_run
                        );

                        PERFORM dbops.fn_audit_log_once(
                          p_function_name => 'dbops.fn_run_automations_cleanup',
                          p_status        => CASE WHEN p_dry_run THEN 'DRYRUN' ELSE 'OK' END,
                          p_rule_type     => v_rule_type,
                          p_exec_mode     => p_exec_mode,
                          p_parts         => ARRAY[v_rule_type],
                          p_dry_run       => p_dry_run,
                          p_rows_affected => v_rows,
                          p_params        => jsonb_build_object(
                                              'table', rtab.schema_name||'.'||rtab.table_name,
                                              'cleanup_column', v_cleanup_col,
                                              'batch_limit', v_batch_limit
                                            ),
                          p_message       => 'cleanup eseguito'
                        );
                        v_applicate := v_applicate + 1;
                        v_righe := v_righe + COALESCE(v_rows, 0);
                      EXCEPTION
                        -- ⛔ Un annullamento resta un annullamento (vedi sopra).
                        WHEN query_canceled THEN
                          RAISE;
                        -- ⭐ Il rifiuto: tabella saltata, riga ERROR, conta in _falliti
                        --    (vedi sopra).
                        WHEN OTHERS THEN
                          GET STACKED DIAGNOSTICS
                            v_sqlstate = RETURNED_SQLSTATE,
                            v_errmsg   = MESSAGE_TEXT,
                            v_errctx   = PG_EXCEPTION_CONTEXT;
                          PERFORM dbops.fn_audit_log_once(
                            p_function_name => 'dbops.fn_run_automations_cleanup',
                            p_status        => 'ERROR',
                            p_rule_type     => v_rule_type,
                            p_exec_mode     => p_exec_mode,
                            p_parts         => ARRAY[v_rule_type],
                            p_dry_run       => p_dry_run,
                            p_sqlstate      => v_sqlstate,
                            p_error_context => v_errctx,
                            p_params        => jsonb_build_object(
                                                'table', rtab.schema_name||'.'||rtab.table_name,
                                                'cleanup_column', v_cleanup_col,
                                                'skip_reason', 'BLOCKED_BY_TABLE'
                                              ),
                            p_message       => v_errmsg
                          );
                          v_falliti := v_falliti + 1;
                          v_dettaglio := v_dettaglio || jsonb_build_object(
                              'tabella',   rtab.schema_name||'.'||rtab.table_name,
                              'regola',    v_rule_type,
                              'motivo',    'BLOCKED_BY_TABLE',
                              'sqlstate',  v_sqlstate,
                              'messaggio', v_errmsg);
                      END;
                    END IF;
                  END LOOP;
                END LOOP;

                RETURN jsonb_build_object(
                    '_applicate', v_applicate,
                    '_saltate',   v_saltate,
                    '_saltate_motivi', v_saltate_motivi,
                    '_falliti',   v_falliti,
                    '_righe',     v_righe,
                    '_dettaglio', v_dettaglio);
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_run_automations_cleanup(
                  dbops.audit_log.exec_mode%TYPE, text[], dbops.audit_log.dry_run%TYPE) IS
                  'Orchestratore del framework di cleanup, con le regole di dbops.automation_rules_tbl: CLEANUP_AT calcola cleanup_at con un TTL fisso, CLEANUP_PURGE elimina a batch le righe scadute. Parametri: p_exec_mode (AUTO/CI/SCHEDULED), p_schemas (gli schemi; NULL = dbops.automation_scope), p_dry_run. Ogni regola gira in una sottotransazione: una tabella che RIFIUTA (un guard sul DELETE, un trigger append-only) viene saltata e non ferma il giro, e lascia in dbops.audit_log una riga ERROR con SQLSTATE e contesto (skip_reason = BLOCKED_BY_TABLE); status ERROR e non WARN, perche'' i WARN sono i salti dichiarati (EXCLUDED, NO_CLEANUP_COLUMN, MISSING_TTL_DAYS, MISSING_BASE_TS_COLUMN). query_canceled si ri-solleva: un annullamento resta un annullamento. Restituisce il riepilogo jsonb: _applicate, _saltate (i salti dichiarati), _falliti (le tabelle che hanno rifiutato), _saltate_motivi (i salti contati per motivo), _righe, _dettaglio (i rifiuti uno per uno, con tabella, regola, SQLSTATE e messaggio; i salti non ci vanno, si contano). Il job automations_cleanup la chiama con una SELECT dentro maintenance.fn_run_and_log: _falliti > 0 rende la corsa rossa (E_JOB_ESITO_CON_SCARTI) senza annullare le tabelle pulite.';
      rollback:
        - sql:
            dbms: postgresql
            sql: |
              -- Il verso di ritiro e' un changeSet nuovo dal corpo di 20260823-06
              -- (void: DROP e CREATE anche al ritorno).
              SELECT 1;
