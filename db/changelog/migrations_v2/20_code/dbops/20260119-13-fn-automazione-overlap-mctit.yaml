databaseChangeLog:
  - logicalFilePath: /migrations_v2/20_code/dbops/20260119-13-fn-automazione-overlap-mctit.yaml

  - changeSet:
      id: 20260119-13-fn-automazione-overlap
      author: mctit
      runAlways: false
      validCheckSum:
        - ANY
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |

              CREATE OR REPLACE FUNCTION dbops.fn_seed_automazione_overlap(
                p_schemas text[] DEFAULT NULL
              )
              RETURNS void
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_schemas text[];
                rtab record;
                v_dal_col text;
                v_al_col text;
                v_active boolean;
                v_key_cols text[];
                v_note text;
                v_con record;
                v_con_def text;
                v_idx record;
                v_idx_def text;
                v_cols_text text;
                v_cols_arr text[];
                v_constraint_name text;
                v_rel regclass;
              BEGIN
                v_schemas := dbops.fn_resolve_scope(p_schemas);

                FOR rtab IN
                  SELECT n.nspname AS schema_name,
                         c.relname AS table_name,
                         (quote_ident(n.nspname)||'.'||quote_ident(c.relname))::regclass AS rel
                    FROM pg_class c
                    JOIN pg_namespace n ON n.oid=c.relnamespace
                   WHERE c.relkind='r'
                     AND n.nspname = ANY(v_schemas)
                     AND n.nspname <> 'storico'
                     AND dbops.fn_table_in_scope(n.nspname, c.relname)
                LOOP
                  v_rel := rtab.rel;
                  v_dal_col := NULL;
                  v_al_col := NULL;
                  v_active := false;
                  v_key_cols := NULL;
                  v_note := NULL;
                  v_constraint_name := NULL;

                  IF dbops.fn_col_exists(rtab.schema_name, rtab.table_name, 'valido_dal')
                     AND dbops.fn_col_exists(rtab.schema_name, rtab.table_name, 'valido_al') THEN
                    v_dal_col := 'valido_dal';
                    v_al_col := 'valido_al';
                  ELSIF dbops.fn_col_exists(rtab.schema_name, rtab.table_name, 'valid_from')
                     AND dbops.fn_col_exists(rtab.schema_name, rtab.table_name, 'valid_to') THEN
                    v_dal_col := 'valid_from';
                    v_al_col := 'valid_to';
                  ELSE
                    CONTINUE;
                  END IF;

                  -- 1) Esclude se esiste un vincolo EXCLUDE gia' definito
                  SELECT con.conname AS conname,
                         pg_get_constraintdef(con.oid) AS condef
                    INTO v_con
                    FROM pg_constraint con
                   WHERE con.conrelid = v_rel
                     AND con.contype = 'x'
                   ORDER BY con.oid
                   LIMIT 1;

                  IF FOUND THEN
                    v_con_def := v_con.condef;
                    v_constraint_name := v_con.conname;
                    SELECT array_agg(m[1])
                      INTO v_key_cols
                      FROM regexp_matches(v_con_def, '([a-zA-Z_][a-zA-Z0-9_]*) WITH =', 'g') AS m;
                    IF array_length(v_key_cols, 1) IS NOT NULL THEN
                      v_active := true;
                      v_note := 'exclude_constraint_detected';
                    ELSE
                      v_note := 'exclude_detected_keys_not_parsed';
                    END IF;
                  END IF;

                  -- 2) Se non trovato, prova con indice GiST con daterange
                  IF NOT v_active THEN
                    FOR v_idx IN
                      SELECT idx.relname AS index_name,
                             pg_get_indexdef(idx.oid) AS idx_def
                        FROM pg_index i
                        JOIN pg_class idx ON idx.oid = i.indexrelid
                       WHERE i.indrelid = v_rel
                         AND i.indisvalid
                    LOOP
                      v_idx_def := v_idx.idx_def;
                      IF v_idx_def ILIKE '%USING gist%'
                         AND v_idx_def ILIKE '%' || v_dal_col || '%'
                         AND v_idx_def ILIKE '%daterange(%'
                      THEN
                        v_cols_text := substring(v_idx_def FROM 'USING gist \\((.*)\\)$');
                        v_cols_text := regexp_replace(v_cols_text, 'daterange\\(.*\\)$', '', 'g');
                        v_cols_text := regexp_replace(btrim(v_cols_text), ',\\s*$', '');
                        IF v_cols_text IS NOT NULL AND btrim(v_cols_text) <> '' THEN
                          v_cols_arr := string_to_array(v_cols_text, ',');
                          SELECT array_agg(btrim(c)) INTO v_key_cols FROM unnest(v_cols_arr) AS c;
                        END IF;

                        IF array_length(v_key_cols, 1) IS NOT NULL THEN
                          v_active := true;
                          v_note := 'gist_index_detected';
                        ELSE
                          v_note := 'gist_index_keys_not_parsed';
                        END IF;
                        EXIT;
                      END IF;
                    END LOOP;
                  END IF;

                  -- 3) Se ancora non attivo, prova con UNIQUE/PK che include il periodo
                  IF NOT v_active THEN
                    FOR v_con IN
                      SELECT conname, contype, conkey
                        FROM pg_constraint
                       WHERE conrelid = v_rel
                         AND contype IN ('p','u')
                    LOOP
                      SELECT array_agg(att.attname ORDER BY u.ord)
                        INTO v_cols_arr
                        FROM unnest(v_con.conkey) WITH ORDINALITY AS u(attnum, ord)
                        JOIN pg_attribute att
                          ON att.attrelid = v_rel
                         AND att.attnum = u.attnum;

                      IF v_cols_arr IS NOT NULL AND v_dal_col = ANY(v_cols_arr) THEN
                        v_key_cols := array_remove(v_cols_arr, v_dal_col);
                        v_key_cols := array_remove(v_key_cols, v_al_col);
                        IF array_length(v_key_cols, 1) IS NOT NULL THEN
                          v_active := true;
                          v_note := 'unique_with_period_detected';
                        ELSE
                          v_note := 'unique_detected_no_keys';
                        END IF;
                        EXIT;
                      END IF;
                    END LOOP;
                  END IF;

                  IF NOT v_active AND v_note IS NULL THEN
                    v_note := 'non_versionata_o_non_rilevabile';
                  END IF;

                  -- 4) Fallback: mappa chiavi note per tabelle versionate senza indizi strutturali
                  IF v_key_cols IS NULL OR array_length(v_key_cols, 1) IS NULL THEN
                    IF rtab.schema_name = 'vendite' AND rtab.table_name = 'contratti' THEN
                      v_key_cols := ARRAY['billing_account_id','istanza_utility_id','utility_id','ambito'];
                      v_active := true;
                      v_note := 'default_keys_assigned';
                    ELSIF rtab.schema_name = 'catalogo' AND rtab.table_name = 'articoli_componenti' THEN
                      v_key_cols := ARRAY['prodotto_id','componente_id'];
                      v_active := true;
                      v_note := 'default_keys_assigned';
                    ELSIF rtab.schema_name = 'catalogo' AND rtab.table_name = 'unita_misura_conversioni' THEN
                      v_key_cols := ARRAY['uom_from_id','uom_to_id'];
                      v_active := true;
                      v_note := 'default_keys_assigned';
                    END IF;
                  END IF;

                  INSERT INTO dbops.automazione_overlap (
                    target_schema,
                    target_table,
                    key_columns,
                    valido_dal_col,
                    valido_al_col,
                    range_bounds,
                    constraint_name,
                    active,
                    exec_mode,
                    note,
                    data_insert,
                    user_insert,
                    data_update,
                    user_update
                  )
                  VALUES (
                    rtab.schema_name,
                    rtab.table_name,
                    v_key_cols,
                    v_dal_col,
                    v_al_col,
                    '[]',
                    v_constraint_name,
                    v_active,
                    'AUTO',
                    v_note,
                    now(),
                    CURRENT_USER,
                    now(),
                    CURRENT_USER
                  )
                  ON CONFLICT (target_schema, target_table)
                  DO UPDATE SET
                    key_columns     = EXCLUDED.key_columns,
                    valido_dal_col  = EXCLUDED.valido_dal_col,
                    valido_al_col   = EXCLUDED.valido_al_col,
                    range_bounds    = EXCLUDED.range_bounds,
                    constraint_name = EXCLUDED.constraint_name,
                    active          = EXCLUDED.active,
                    exec_mode       = EXCLUDED.exec_mode,
                    note            = EXCLUDED.note,
                    data_update     = now(),
                    user_update     = CURRENT_USER;
                END LOOP;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_seed_automazione_overlap(text[])
                IS 'Popola dbops.automazione_overlap rilevando tabelle con valido_dal/valido_al o valid_from/valid_to.';

              CREATE OR REPLACE FUNCTION dbops.fn_apply_automazione_overlap(
                p_exec_mode text,
                p_dry_run boolean
              )
              RETURNS void
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                rconf record;
                v_rel regclass;
                v_cols text[];
                v_col text;
                v_key_expr text;
                v_range_expr text;
                v_bounds text;
                v_constraint text;
                v_constraint_exists boolean;
                v_any_exclusion boolean;
                v_skip_status text;
              BEGIN
                v_skip_status := CASE WHEN p_dry_run THEN 'DRYRUN' ELSE 'WARN' END;
                FOR rconf IN
                  SELECT *
                    FROM dbops.automazione_overlap
                   WHERE active
                     AND (upper(btrim(exec_mode)) = 'AUTO' OR exec_mode = p_exec_mode)
                   ORDER BY target_schema, target_table
                LOOP
                  v_rel := (quote_ident(rconf.target_schema)||'.'||quote_ident(rconf.target_table))::regclass;

                  IF rconf.key_columns IS NULL OR array_length(rconf.key_columns, 1) IS NULL THEN
                    PERFORM dbops.fn_audit_log_once(
                      p_function_name => 'dbops.fn_apply_automazione_overlap',
                      p_status        => v_skip_status,
                      p_rule_type     => 'OVERLAP',
                      p_exec_mode     => p_exec_mode,
                      p_parts         => ARRAY['OVERLAP'],
                      p_dry_run       => p_dry_run,
                      p_params        => jsonb_build_object(
                                          'table', rconf.target_schema||'.'||rconf.target_table,
                                          'reason', 'NO_KEY_COLUMNS'
                                        ),
                      p_message       => 'Skip: key_columns missing'
                    );
                    CONTINUE;
                  END IF;

                  IF NOT dbops.fn_col_exists(rconf.target_schema, rconf.target_table, rconf.valido_dal_col)
                     OR NOT dbops.fn_col_exists(rconf.target_schema, rconf.target_table, rconf.valido_al_col) THEN
                    PERFORM dbops.fn_audit_log_once(
                      p_function_name => 'dbops.fn_apply_automazione_overlap',
                      p_status        => v_skip_status,
                      p_rule_type     => 'OVERLAP',
                      p_exec_mode     => p_exec_mode,
                      p_parts         => ARRAY['OVERLAP'],
                      p_dry_run       => p_dry_run,
                      p_params        => jsonb_build_object(
                                          'table', rconf.target_schema||'.'||rconf.target_table,
                                          'valido_dal_col', rconf.valido_dal_col,
                                          'valido_al_col', rconf.valido_al_col,
                                          'reason', 'PERIOD_COLUMNS_MISSING'
                                        ),
                      p_message       => 'Skip: period columns missing'
                    );
                    CONTINUE;
                  END IF;

                  v_cols := ARRAY[]::text[];
                  FOREACH v_col IN ARRAY rconf.key_columns
                  LOOP
                    IF dbops.fn_col_exists(rconf.target_schema, rconf.target_table, v_col) THEN
                      v_cols := array_append(v_cols, quote_ident(v_col) || ' WITH =');
                    END IF;
                  END LOOP;

                  IF array_length(v_cols, 1) IS NULL THEN
                    PERFORM dbops.fn_audit_log_once(
                      p_function_name => 'dbops.fn_apply_automazione_overlap',
                      p_status        => v_skip_status,
                      p_rule_type     => 'OVERLAP',
                      p_exec_mode     => p_exec_mode,
                      p_parts         => ARRAY['OVERLAP'],
                      p_dry_run       => p_dry_run,
                      p_params        => jsonb_build_object(
                                          'table', rconf.target_schema||'.'||rconf.target_table,
                                          'key_columns', rconf.key_columns,
                                          'reason', 'KEY_COLUMNS_NOT_FOUND'
                                        ),
                      p_message       => 'Skip: key_columns not found in table'
                    );
                    CONTINUE;
                  END IF;

                  v_bounds := COALESCE(NULLIF(btrim(rconf.range_bounds), ''), '[]');
                  v_range_expr := format(
                    'daterange(%I, COALESCE(%I, ''infinity''::date), %L) WITH &&',
                    rconf.valido_dal_col,
                    rconf.valido_al_col,
                    v_bounds
                  );

                  v_key_expr := array_to_string(v_cols, ', ');

                  v_constraint := COALESCE(rconf.constraint_name,
                                   dbops.fn_name_from_template('ex_{table}_no_overlap', rconf.target_schema, rconf.target_table, NULL, NULL, NULL, NULL));

                  -- Se il nome e' gia' usato da un indice o altro oggetto, usa un suffisso
                  IF EXISTS (
                    SELECT 1
                      FROM pg_class c
                      JOIN pg_namespace n ON n.oid = c.relnamespace
                     WHERE n.nspname = rconf.target_schema
                       AND c.relname = v_constraint
                  ) THEN
                    v_constraint := dbops.fn_name_from_template('ex_{table}_no_overlap_c', rconf.target_schema, rconf.target_table, NULL, NULL, NULL, NULL);
                  END IF;

                  SELECT EXISTS (
                    SELECT 1
                      FROM pg_constraint con
                     WHERE con.conrelid = v_rel
                       AND con.contype = 'x'
                       AND con.conname = v_constraint
                  )
                  INTO v_constraint_exists;

                  SELECT EXISTS (
                    SELECT 1
                      FROM pg_constraint con
                     WHERE con.conrelid = v_rel
                       AND con.contype = 'x'
                       AND pg_get_constraintdef(con.oid) ILIKE '%' || rconf.valido_dal_col || '%'
                       AND pg_get_constraintdef(con.oid) ILIKE '%' || rconf.valido_al_col || '%'
                  )
                  INTO v_any_exclusion;

                  IF v_constraint_exists OR v_any_exclusion THEN
                    PERFORM dbops.fn_audit_log_once(
                      p_function_name => 'dbops.fn_apply_automazione_overlap',
                      p_status        => v_skip_status,
                      p_rule_type     => 'OVERLAP',
                      p_exec_mode     => p_exec_mode,
                      p_parts         => ARRAY['OVERLAP'],
                      p_dry_run       => p_dry_run,
                      p_params        => jsonb_build_object(
                                          'table', rconf.target_schema||'.'||rconf.target_table,
                                          'constraint', v_constraint,
                                          'reason', 'EXCLUDE_EXISTS'
                                        ),
                      p_message       => 'Skip: exclude constraint already present'
                    );
                    CONTINUE;
                  END IF;

                  IF p_dry_run THEN
                    PERFORM dbops.fn_audit_log_once(
                      p_function_name => 'dbops.fn_apply_automazione_overlap',
                      p_status        => 'DRYRUN',
                      p_rule_type     => 'OVERLAP',
                      p_exec_mode     => p_exec_mode,
                      p_parts         => ARRAY['OVERLAP'],
                      p_dry_run       => true,
                      p_params        => jsonb_build_object(
                                          'table', rconf.target_schema||'.'||rconf.target_table,
                                          'constraint', v_constraint,
                                          'key_columns', rconf.key_columns,
                                          'valido_dal_col', rconf.valido_dal_col,
                                          'valido_al_col', rconf.valido_al_col,
                                          'range_bounds', v_bounds,
                                          'action', 'DRYRUN_CREATE_EXCLUDE'
                                        ),
                      p_message       => 'Exclude constraint would be created'
                    );
                    CONTINUE;
                  END IF;

                  EXECUTE format(
                    'ALTER TABLE %I.%I ADD CONSTRAINT %I EXCLUDE USING gist (%s, %s)',
                    rconf.target_schema,
                    rconf.target_table,
                    v_constraint,
                    v_key_expr,
                    v_range_expr
                  );
                  PERFORM dbops.fn_audit_log_once(
                    p_function_name => 'dbops.fn_apply_automazione_overlap',
                    p_status        => 'OK',
                    p_rule_type     => 'OVERLAP',
                    p_exec_mode     => p_exec_mode,
                    p_parts         => ARRAY['OVERLAP'],
                    p_dry_run       => false,
                    p_params        => jsonb_build_object(
                                        'table', rconf.target_schema||'.'||rconf.target_table,
                                        'constraint', v_constraint,
                                        'key_columns', rconf.key_columns,
                                        'valido_dal_col', rconf.valido_dal_col,
                                        'valido_al_col', rconf.valido_al_col,
                                        'range_bounds', v_bounds,
                                        'action', 'CREATE_EXCLUDE'
                                      ),
                    p_message       => 'Exclude constraint created'
                  );
                END LOOP;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_apply_automazione_overlap(text, boolean)
                IS 'Applica i vincoli EXCLUDE GiST in base a dbops.automazione_overlap.';
