# dbops.fn_processo_acceso_su_valori, dbops.trgfn_processi_accensione_guard: «senza sveglia»
#   vale per il ritiro RAGGIUNTO (script.fn_e_obsoleto), non per la data scritta (D11, N1, N2).
#   Brief: brief-db-revisione-dbops, giro 9, blocco 9a (§24).
#
#   fn_processo_acceso_su_valori passa da IMMUTABLE a STABLE: il ritiro dipende
#   dalla data di oggi. Firma invariata. Il COMMENT di fn_processo_acceso_dichiarato
#   si riscrive (stessa famiglia), il corpo no. Corpi presi dal catalogo dello
#   scratch (2026-11-08); rollback = i corpi e i COMMENT di prima.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261109-42-update-processo-vivo-accensione-mctit.yaml

  - changeSet:
      id: 20261109-42-update-processo-vivo-accensione
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        La sveglia e la scelta a mano leggono il ritiro raggiunto (script.fn_e_obsoleto), non la data scritta. Brief: brief-db-revisione-dbops, giro 9.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_constraint
               WHERE conrelid = 'dbops.processi'::regclass
                 AND conname = 'chk_processi_ritiro_con_data'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_processo_acceso_su_valori(p_canale text, p_obsoleto_dal date, p_spegnibile boolean, p_acceso_in_sviluppo boolean, p_acceso_in_produzione boolean, p_acceso_a_mano boolean, p_ambiente text, p_accendibile_in_produzione boolean)
               RETURNS boolean
               LANGUAGE sql
               STABLE
              AS $function$
                  -- Scopo: la sveglia del processo e' accesa? NULL = senza
                  --   sveglia, oppure non decidibile (ambiente non dichiarato).
                  --   L'ordine dei rami e' la regola (vedi intestazione).
                  SELECT CASE
                           WHEN p_canale = 'CODA' OR script.fn_e_obsoleto(p_obsoleto_dal) THEN NULL
                           WHEN p_spegnibile IS FALSE                          THEN true
                           -- La scelta a mano decide solo se il divieto di
                           -- accensione in PRODUZIONE la ammette: una riga
                           -- accesa scritta prima della regola si ignora.
                           WHEN p_acceso_a_mano IS NOT NULL
                            AND dbops.fn_accensione_a_mano_ammessa_su_valori(
                                    p_acceso_a_mano,
                                    p_accendibile_in_produzione,
                                    p_ambiente)                            THEN p_acceso_a_mano
                           WHEN p_ambiente = 'SVILUPPO'                        THEN p_acceso_in_sviluppo
                           WHEN p_ambiente = 'PRODUZIONE'                      THEN p_acceso_in_produzione
                           ELSE NULL
                         END;
              $function$
              ;

              COMMENT ON FUNCTION dbops.fn_processo_acceso_su_valori(text, date, boolean, boolean, boolean, boolean, text, boolean) IS
                  'La regola dell''accensione della sveglia di un processo, sui valori: l''unico posto dove e'' scritta. In ordine: senza sveglia (canale CODA, o ritiro raggiunto secondo script.fn_e_obsoleto: un ritiro programmato ha la sveglia fino al suo giorno) -> NULL; non spegnibile -> true, senza leggere scelta a mano ne'' ambiente; scelta a mano presente e ammessa dal divieto di accensione in PRODUZIONE (dbops.fn_accensione_a_mano_ammessa_su_valori) -> la scelta, altrimenti la riga si ignora; ambiente SVILUPPO o PRODUZIONE -> il default di quell''ambiente dal catalogo; ambiente non dichiarato -> NULL (non decidibile: chi decide lo rende E_CONFIG_MANCANTE). LANGUAGE sql STABLE (si inlinea; STABLE perche'' il ritiro dipende dalla data di oggi), senza STRICT: i NULL sono casi normali. Sui valori perche'' l''ambiente e'' immutabile e la CI e'' SVILUPPO: i pgTAP provano il ramo PRODUZIONE passando il valore. La leggono dbops.fn_processo_acceso_dichiarato e, attraverso di lei, maintenance.fn_sveglia_accesa e il panorama dbops.vw_processi_programmazione.';

              CREATE OR REPLACE FUNCTION dbops.trgfn_processi_accensione_guard()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_codice                    dbops.processi.codice%TYPE;
                  v_canale                    dbops.processi.canale%TYPE;
                  v_obsoleto_dal              dbops.processi.obsoleto_dal%TYPE;
                  v_spegnibile                dbops.processi.spegnibile%TYPE;
                  v_accendibile_in_produzione dbops.processi.accendibile_in_produzione%TYPE;
                  -- La risposta del predicato: nessuna colonna di cui sia
                  -- il riflesso.
                  v_ammessa                   boolean;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   La scelta a mano vale solo dove c'e' una sveglia da
                  --   accendere o spegnere, non spegne mai un processo
                  --   non spegnibile (A-5) e non accende in PRODUZIONE un
                  --   processo non accendibile (R-BE-5).
                  --
                  -- Ordine dei rifiuti (il primo che parla e' quello che
                  -- l'operatore legge):
                  --   1. senza sveglia: non c'e' niente da scegliere;
                  --   2. non spegnibile: lo spegnimento e' vietato;
                  --   3. non accendibile in PRODUZIONE: l'accensione e'
                  --      vietata;
                  --   4. motivo vuoto: la scelta e' incompleta.
                  -- =========================================================
                  SELECT p.codice, p.canale, p.obsoleto_dal, p.spegnibile,
                         p.accendibile_in_produzione
                    INTO v_codice, v_canale, v_obsoleto_dal, v_spegnibile,
                         v_accendibile_in_produzione
                    FROM dbops.processi p
                   WHERE p.id = NEW.processo_id;

                  -- Un processo inesistente lo rifiuta la FK: qui non si
                  -- anticipa.
                  IF NOT FOUND THEN
                      RETURN NEW;
                  END IF;

                  -- 1. Senza sveglia: CODA (li avvia una persona) o ritirato
                  --    (data del ritiro raggiunta: un ritiro programmato ha
                  --    ancora la sua sveglia fino a quel giorno).
                  IF v_canale = 'CODA' OR script.fn_e_obsoleto(v_obsoleto_dal) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'dbops', 'trgfn_processi_accensione_guard', 'E_PROCESSO_SENZA_SVEGLIA',
                          jsonb_build_object('processo_codice', v_codice,
                                             'canale',          v_canale,
                                             'obsoleto_dal',    v_obsoleto_dal),
                          NULL::uuid,
                          v_codice);
                  END IF;

                  -- 2. Non spegnibile: si puo' solo confermare acceso.
                  --    ⚠️ IS FALSE e non NOT: spegnibile NULL su un processo
                  --    con sveglia e' un catalogo incompleto, e lo rifiuta
                  --    chk_processi_accensione quando e' convalidato.
                  IF NOT NEW.acceso AND v_spegnibile IS FALSE THEN
                      PERFORM script.fn_log_and_raise_error(
                          'dbops', 'trgfn_processi_accensione_guard', 'E_PROCESSO_NON_SPEGNIBILE',
                          jsonb_build_object('processo_codice', v_codice,
                                             'campo',           'acceso'),
                          NULL::uuid,
                          v_codice);
                  END IF;

                  -- 3. Non accendibile in PRODUZIONE. Il predicato e' quello
                  --    della regola dello stato effettivo; NULL = ambiente non
                  --    dichiarato, e lo dice il lettore che decide.
                  v_ammessa := dbops.fn_accensione_a_mano_ammessa_su_valori(
                                   NEW.acceso,
                                   v_accendibile_in_produzione,
                                   script.fn_ambiente_dichiarato());

                  IF v_ammessa IS NOT TRUE THEN
                      IF v_ammessa IS NULL THEN
                          -- Solleva E_CONFIG_MANCANTE.
                          PERFORM script.fn_ambiente_installazione();
                      END IF;

                      PERFORM script.fn_log_and_raise_error(
                          'dbops', 'trgfn_processi_accensione_guard', 'E_PROCESSO_NON_ACCENDIBILE_IN_PRODUZIONE',
                          jsonb_build_object('processo_codice', v_codice,
                                             'campo',           'acceso'),
                          NULL::uuid,
                          v_codice);
                  END IF;

                  -- 4. Il motivo: chi viene dopo deve capire perche'.
                  IF NEW.motivo IS NULL OR btrim(NEW.motivo) = '' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'dbops', 'trgfn_processi_accensione_guard', 'E_PROCESSO_ACCENSIONE_MOTIVO_OBBLIGATORIO',
                          jsonb_build_object('processo_codice', v_codice,
                                             'campo',           'motivo'),
                          NULL::uuid,
                          v_codice);
                  END IF;

                  RETURN NEW;
              END;
              $function$
              ;

              COMMENT ON FUNCTION dbops.trgfn_processi_accensione_guard() IS
                  'Guard BEFORE INSERT OR UPDATE su dbops.processi_accensione. In ordine: un processo senza sveglia (canale CODA, o ritiro raggiunto secondo script.fn_e_obsoleto) non ha scelta a mano (E_PROCESSO_SENZA_SVEGLIA): un ritiro programmato la ammette fino al suo giorno; un processo non spegnibile non si spegne (E_PROCESSO_NON_SPEGNIBILE); in un''installazione PRODUZIONE un processo non accendibile (dbops.processi.accendibile_in_produzione = false) non si accende a mano (E_PROCESSO_NON_ACCENDIBILE_IN_PRODUZIONE; predicato dbops.fn_accensione_a_mano_ammessa_su_valori, ambiente non dichiarato -> E_CONFIG_MANCANTE); il motivo e'' obbligatorio (E_PROCESSO_ACCENSIONE_MOTIVO_OBBLIGATORIO). La regola e'' del dato: il verbo dbops.fn_imposta_accensione_processo non la ripete. Se il catalogo cambia dopo che una riga e'' stata scritta, lo stato effettivo (dbops.fn_processo_acceso_su_valori) ignora la riga.';

              COMMENT ON FUNCTION dbops.fn_processo_acceso_dichiarato(text) IS
                  'Lo stato della sveglia di un processo su questa installazione: legge dbops.processi (default per ambiente, spegnibile, accendibile in produzione, data del ritiro), dbops.processi_accensione (la scelta a mano) e script.fn_ambiente_dichiarato(), e chiede la regola a dbops.fn_processo_acceso_su_valori. Non solleva: NULL per un processo senza sveglia (CODA, ritiro raggiunto), inesistente, o con l''ambiente non dichiarato. E'' la lettura di chi descrive (il panorama dbops.vw_processi_programmazione); chi decide usa maintenance.fn_sveglia_accesa, che rende quei NULL errori.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
