# ------------------------------------------------------------
# dbops.fn_run_automations_tx_id: la regola vale per la tabella che nomina, non per un modello
#   di nomi. target_table e' '*all' o il nome esatto di una tabella (decisione di Tid,
#   2026-11-13, strada b): il confronto da ILIKE diventa =, e '*all' si confronta nella
#   forma canonica che il vincolo chk_automation_rules_tbl_target_table_nome_esatto
#   (90_end/20261112-66) garantisce. Con ILIKE il '_' di un nome valeva come jolly: una
#   regola su event_log copriva anche una eventXlog. L'insieme di tabelle lo dice
#   l'ambito (dbops.automation_scope), non la regola.
#   Residuo di brief-db-revisione-dbops §27.8, chiuso in framework-automazione-db-migliorie
#   §2.4 (archiviato).
#
# ℹ️ La testata e' ri-ancorata (linee-guida-sql §5g): i tipi risolti sono gli stessi del
#   vivo, la firma non cambia.
# Corpo di partenza: 20261109-68-update-fn-run-automations-tx-id-per-funzione-mctit.yaml, uguale al vivo di dbdev e
#   dello scratch (2026-11-13). Rollback = il corpo di prima.
# Presidio: dbops/test-registro-regole-vincoli-v1.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261112-67-update-fn-run-automations-tx-id-target-table-esatta-mctit.yaml

  - changeSet:
      id: 20261112-67-update-fn-run-automations-tx-id-target-table-esatta
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        fn_run_automations_tx_id: target_table e' '*all' o il nome esatto di una tabella, il confronto e' = e non ILIKE.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_proc
               WHERE oid = to_regprocedure('dbops.fn_run_automations_tx_id(text,text[],boolean)')
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_run_automations_tx_id(
                  p_exec_mode dbops.automation_rules_tbl.exec_mode%TYPE,
                  -- array: %TYPE non compone con [] (elementi: dbops.automation_scope.schema_name)
                  p_schemas   text[],
                  -- interruttore del chiamante: nessuna colonna ne e' il riflesso
                  p_dry_run   boolean
              )
               RETURNS void
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                -- ⭐ Rev 2026-10-16: il contesto dell'errore, costruito una volta e usato
                --   dalle due chiamate del gestore (registro e involucro).
                v_ctx_errore dbops.error_log.context%TYPE;
                -- array: %TYPE non compone con [] (elementi: dbops.automation_scope.schema_name)
                v_schemas text[];
                rtab record;
                rrule record;
                -- la tabella del giro come OID: nessuna colonna la porta
                rel  regclass;
                -- esito calcolato qui: nessuna colonna ne e' il riflesso
                has_txid boolean;
                tmpl     dbops.automation_rules_tbl.name_template%TYPE;
                trg_name pg_catalog.pg_trigger.tgname%TYPE;
              BEGIN


              /*
                Scopo
                -----
                Esegue l'automazione di provisioning dei trigger "TX_ID managed" sulle tabelle in scope,
                applicando le regole abilitate in dbops.automation_rules_tbl di tipo 'TX_ID'.

                La funzione:
                1) risolve lo scope degli schemi (dbops.fn_resolve_scope),
                2) scorre tutte le tabelle fisiche (pg_class.relkind='r') degli schemi target
                  filtrate da dbops.fn_table_in_scope(schema, table),
                3) per ogni tabella applica le regole TX_ID compatibili con:
                  - enabled = true
                  - rule_type = 'TX_ID'
                  - exec_mode = 'AUTO' oppure exec_mode = p_exec_mode
                  - match su schema (dbops.fn_schema_match)
                  - match su tabella: '*all' oppure il nome esatto (r.target_table = tabella)
                4) verifica la pre-condizione tecnica: la tabella deve avere una colonna tx_id di tipo uuid
                  (information_schema.columns).
                  Se la colonna non esiste, la tabella viene ignorata (non crea colonne, crea solo trigger).

                Trigger generato
                ----------------
                Per le tabelle idonee, la funzione assicura l'esistenza del trigger:
                  BEFORE INSERT OR UPDATE
                  EXECUTE FUNCTION dbops.trgfn_tx_id_managed()
                Il nome del trigger è derivato da un template:
                  - rrule.name_template (obbligatorio per TX_ID: CHECK del registro)
                  - dbops.fn_name_from_template per generare un nome coerente e standardizzato.

                Esistenza del trigger
                ---------------------
                Il trigger si riconosce dalla FUNZIONE (dbops.trgfn_tx_id_managed), qualunque nome abbia: il nome
                serve solo a crearlo. Un trigger con un altro nome non ne riceve un secondo.

                Modalità DRY RUN
                ---------------
                Se p_dry_run=true non esegue DDL (CREATE TRIGGER) e registra invece un audit
                con dbops.fn_audit_log_once indicando cosa verrebbe creato.

                Error handling
                --------------
                In caso di errore nella creazione del trigger, log strutturato e rilancio tramite
                script.fn_log_and_raise_error includendo tabella, contesto ('TX_ID') e SQLERRM.
              */


                v_schemas := dbops.fn_resolve_scope(p_schemas);
                FOR rtab IN
                  SELECT n.nspname AS schema_name,
                        c.relname AS table_name,
                        (quote_ident(n.nspname)||'.'||quote_ident(c.relname))::regclass AS rel
                  FROM pg_class c
                  JOIN pg_namespace n ON n.oid=c.relnamespace
                  WHERE c.relkind='r'
                    AND n.nspname = ANY(v_schemas)
                    AND dbops.fn_table_in_scope(n.nspname, c.relname)
                LOOP
                  rel := rtab.rel;

                  FOR rrule IN
                    SELECT *
                      FROM dbops.automation_rules_tbl r
                    WHERE r.enabled
                      AND upper(btrim(r.rule_type))='TX_ID'
                      AND dbops.fn_schema_match(r.target_schema, rtab.schema_name)
                      AND (r.target_table = '*all' OR rtab.table_name = r.target_table)
                      --AND (r.exec_mode='AUTO' OR r.exec_mode=p_exec_mode)
                      AND (upper(btrim(r.exec_mode)) = 'AUTO' OR r.exec_mode = p_exec_mode)
                    ORDER BY r.priority, r.id
                  LOOP

                    SELECT EXISTS(
                      SELECT 1 FROM information_schema.columns
                      WHERE table_schema=rtab.schema_name
                        AND table_name =rtab.table_name
                        AND column_name='tx_id' AND udt_name='uuid'
                    ) INTO has_txid;

                    IF has_txid THEN
                      tmpl     := rrule.name_template;
                      trg_name := dbops.fn_name_from_template(tmpl, rtab.schema_name, rtab.table_name, NULL,NULL,NULL,NULL);

                      IF NOT dbops.fn_trigger_exists_by_function(rel, 'dbops', 'trgfn_tx_id_managed')
                      THEN
                        IF p_dry_run THEN

                          PERFORM dbops.fn_audit_log_once(
                                p_function_name => 'dbops.fn_run_automations_tx_id',
                                p_status        => 'DRYRUN',
                                -- il tipo di regola, non il codice d'errore (era 'E_TX_ID')
                                p_rule_type     => 'TX_ID',
                                p_exec_mode     => p_exec_mode,
                                p_parts         => ARRAY['TX_ID'],
                                p_dry_run       => true,
                                p_params        => jsonb_build_object(
                                                    'table', rtab.schema_name||'.'||rtab.table_name,
                                                    'trigger', trg_name,
                                                    'action', 'DRYRUN_CREATE_TRIGGER'
                                                  ),
                                p_message       => 'Trigger would be created'
                              );

                        ELSE
                          BEGIN
                            EXECUTE format($f$
                              CREATE TRIGGER %I
                              BEFORE INSERT OR UPDATE ON %I.%I
                              FOR EACH ROW
                              EXECUTE FUNCTION dbops.trgfn_tx_id_managed()
                            $f$, trg_name, rtab.schema_name, rtab.table_name);
                          EXCEPTION WHEN others THEN
                              -- ⭐ Rev 2026-10-16 (brief-db-presidio-job-run-a-chi-tocca D8, D10, D11):
                              --   un guasto dell'AMBIENTE (script.fn_sqlstate_di_ambiente: connessione,
                              --   risorse, arresto, sistema, privilegio, lock) si rilancia COM'E', col suo
                              --   SQLSTATE: l'involucro lo faceva diventare P0001, e il presidio dei job lo
                              --   mandava allo sviluppo. Prima si scrive nel registro errori, col contesto.
                              v_ctx_errore := jsonb_build_object(
                                  'where','TX_ID',
                                  'table', rtab.schema_name||'.'||rtab.table_name,
                                  'error', SQLERRM
                                );
                              IF script.fn_sqlstate_di_ambiente(SQLSTATE) THEN
                                PERFORM script.fn_log_error_only(
                                    'dbops', 'run_automations', 'E_TX_ID',
                                    v_ctx_errore, NULL::uuid, SQLERRM);
                                RAISE;
                              END IF;
                              PERFORM script.fn_log_and_raise_error(
                                  'dbops', 'run_automations', 'E_TX_ID',
                                  v_ctx_errore, NULL::uuid, SQLERRM);

                          END;
                        END IF;
                      END IF;
                    END IF;
                  END LOOP;
                END LOOP;
              END;
              $function$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_run_automations_tx_id(p_exec_mode text, p_schemas text[], p_dry_run boolean)
               RETURNS void
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                -- ⭐ Rev 2026-10-16: il contesto dell'errore, costruito una volta e usato
                --   dalle due chiamate del gestore (registro e involucro).
                v_ctx_errore dbops.error_log.context%TYPE;
                v_schemas text[];
                rtab record;
                rrule record;
                rel  regclass;
                has_txid boolean;
                tmpl     text;
                trg_name text;
              BEGIN


              /*
                Scopo
                -----
                Esegue l'automazione di provisioning dei trigger "TX_ID managed" sulle tabelle in scope,
                applicando le regole abilitate in dbops.automation_rules_tbl di tipo 'TX_ID'.

                La funzione:
                1) risolve lo scope degli schemi (dbops.fn_resolve_scope),
                2) scorre tutte le tabelle fisiche (pg_class.relkind='r') degli schemi target
                  filtrate da dbops.fn_table_in_scope(schema, table),
                3) per ogni tabella applica le regole TX_ID compatibili con:
                  - enabled = true
                  - rule_type = 'TX_ID'
                  - exec_mode = 'AUTO' oppure exec_mode = p_exec_mode
                  - match su schema (dbops.fn_schema_match)
                  - match su tabella: '*ALL' oppure pattern ILIKE su r.target_table
                4) verifica la pre-condizione tecnica: la tabella deve avere una colonna tx_id di tipo uuid
                  (information_schema.columns).
                  Se la colonna non esiste, la tabella viene ignorata (non crea colonne, crea solo trigger).

                Trigger generato
                ----------------
                Per le tabelle idonee, la funzione assicura l'esistenza del trigger:
                  BEFORE INSERT OR UPDATE
                  EXECUTE FUNCTION dbops.trgfn_tx_id_managed()
                Il nome del trigger è derivato da un template:
                  - rrule.name_template (obbligatorio per TX_ID: CHECK del registro)
                  - dbops.fn_name_from_template per generare un nome coerente e standardizzato.

                Esistenza del trigger
                ---------------------
                Il trigger si riconosce dalla FUNZIONE (dbops.trgfn_tx_id_managed), qualunque nome abbia: il nome
                serve solo a crearlo. Un trigger con un altro nome non ne riceve un secondo.

                Modalità DRY RUN
                ---------------
                Se p_dry_run=true non esegue DDL (CREATE TRIGGER) e registra invece un audit
                con dbops.fn_audit_log_once indicando cosa verrebbe creato.

                Error handling
                --------------
                In caso di errore nella creazione del trigger, log strutturato e rilancio tramite
                script.fn_log_and_raise_error includendo tabella, contesto ('TX_ID') e SQLERRM.
              */


                v_schemas := dbops.fn_resolve_scope(p_schemas);
                FOR rtab IN
                  SELECT n.nspname AS schema_name,
                        c.relname AS table_name,
                        (quote_ident(n.nspname)||'.'||quote_ident(c.relname))::regclass AS rel
                  FROM pg_class c
                  JOIN pg_namespace n ON n.oid=c.relnamespace
                  WHERE c.relkind='r'
                    AND n.nspname = ANY(v_schemas)
                    AND dbops.fn_table_in_scope(n.nspname, c.relname)
                LOOP
                  rel := rtab.rel;

                  FOR rrule IN
                    SELECT *
                      FROM dbops.automation_rules_tbl r
                    WHERE r.enabled
                      AND upper(btrim(r.rule_type))='TX_ID'
                      AND dbops.fn_schema_match(r.target_schema, rtab.schema_name)
                      AND (UPPER(r.target_table) = '*ALL' OR rtab.table_name ILIKE r.target_table)
                      --AND (r.exec_mode='AUTO' OR r.exec_mode=p_exec_mode)
                      AND (upper(btrim(r.exec_mode)) = 'AUTO' OR r.exec_mode = p_exec_mode)
                    ORDER BY r.priority, r.id
                  LOOP

                    SELECT EXISTS(
                      SELECT 1 FROM information_schema.columns
                      WHERE table_schema=rtab.schema_name
                        AND table_name =rtab.table_name
                        AND column_name='tx_id' AND udt_name='uuid'
                    ) INTO has_txid;

                    IF has_txid THEN
                      tmpl     := rrule.name_template;
                      trg_name := dbops.fn_name_from_template(tmpl, rtab.schema_name, rtab.table_name, NULL,NULL,NULL,NULL);

                      IF NOT dbops.fn_trigger_exists_by_function(rel, 'dbops', 'trgfn_tx_id_managed')
                      THEN
                        IF p_dry_run THEN

                          PERFORM dbops.fn_audit_log_once(
                                p_function_name => 'dbops.fn_run_automations_tx_id',
                                p_status        => 'DRYRUN',
                                -- il tipo di regola, non il codice d'errore (era 'E_TX_ID')
                                p_rule_type     => 'TX_ID',
                                p_exec_mode     => p_exec_mode,
                                p_parts         => ARRAY['TX_ID'],
                                p_dry_run       => true,
                                p_params        => jsonb_build_object(
                                                    'table', rtab.schema_name||'.'||rtab.table_name,
                                                    'trigger', trg_name,
                                                    'action', 'DRYRUN_CREATE_TRIGGER'
                                                  ),
                                p_message       => 'Trigger would be created'
                              );

