# ------------------------------------------------------------
# Cade la funzione che aggiornava `vendite.mv_ddt_ordini`, ritirata dal
#   `20260805-21`. Senza la vista, questa funzione e' un `REFRESH` su un oggetto
#   che non esiste: fallirebbe alla prima chiamata, se qualcuno la chiamasse.
#
# ℹ️ Nessuno la chiamava, ed e' il motivo per cui la vista era ferma: non una
#   funzione, non un job pgagent, non il backend. Verificato prima di decidere.
#
# ⚠️ NUMERO PIU' ALTO DELLA VISTA, e non e' indifferente. L'autogen mescola
#   `00_schema` e `20_code` ordinando per numero: con `-21` (drop della vista)
#   prima di `-22` la funzione muore quando il suo bersaglio non c'e' gia' piu',
#   che e' l'ordine giusto. Al contrario non ci sarebbe stato danno — il corpo
#   e' plpgsql, quindi il riferimento si risolve solo a runtime — ma l'ordine
#   racconta la verita': prima si ritira la cosa, poi il suo accessorio.
#
# ⚠️ FIRMA COMPLETA NEL `DROP`, non il nome nudo: `fn_refresh_mv_ddt_ordini`
#   prende due argomenti con default (`boolean, integer`). Senza la firma, il
#   giorno in cui esistesse un omonimo il `DROP` diventerebbe ambiguo e la
#   migrazione si fermerebbe con un errore che non dice niente di utile.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20260805-22-drop-fn-refresh-mv-ddt-ordini-mctit.yaml

  - changeSet:
      id: 20260805-22-drop-fn-refresh-mv-ddt-ordini
      author: mctit

      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Ritira dbops.fn_refresh_mv_ddt_ordini insieme alla vista materializzata
        che aggiornava (20260805-21). Nessun chiamante: ne' funzioni, ne' job
        pgagent, ne' backend.
      preConditions:
        # Come per la vista: se non c'e' piu' non e' un errore, e non si marca.
        - onFail: CONTINUE
        - onError: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_proc p
              JOIN pg_namespace n ON n.oid = p.pronamespace
              WHERE n.nspname = 'dbops' AND p.proname = 'fn_refresh_mv_ddt_ordini'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION IF EXISTS dbops.fn_refresh_mv_ddt_ordini(boolean, integer);
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Ripristino non fornito: la funzione ha senso solo insieme alla
              -- vista, e il rollback del 20260805-21 ricrea la vista ma non
              -- questa. Se servisse davvero tornare indietro, la definizione
              -- vive nella storia del changeSet 20251029-13 (e nel fix
              -- 20260804-45): riprenderla da li' e' piu' onesto che tenerne qui
              -- una copia che nessuno terrebbe aggiornata.
              SELECT 1;
