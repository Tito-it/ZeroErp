# I CINQUE BUILDER COL BILLING ACCOUNT DEL TEST: NIENTE PIU' CLIENTI IN PIU'
#   Brief: brief-modello-documento-vendita §4-octies (Tid, 2026-10-24).
#
#   dbops.fn_pgtap_crea_commessa, _contratto, _fattura, _ordine e _lotto
#   ricopiavano lo stesso blocco (il mondo, poi la verifica del BA del test), e
#   il mondo costruiva sempre un cliente: col BA del test ne restava uno inutile
#   a ogni chiamata. Il blocco diventa una chiamata al building block
#   dbops.fn_pgtap_cliente_del_builder (20261024-38): senza BA il mondo come
#   prima, col BA l'azienda di chi agisce e il BA verificato, senza clienti in
#   piu'. Regola del 2: le cinque copie si ritirano in questo giro.
#   Corpi dagli ultimi YAML (-23, -31, -32, -33, -36), firme invariate:
#   CREATE OR REPLACE. Cambia solo il blocco del cliente (e il suo commento).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261024-40-update-builder-pgtap-cliente-del-builder-mctit.yaml

  - changeSet:
      id: 20261024-40-update-builder-pgtap-cliente-del-builder
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        I cinque builder pgTAP col billing account del test (commessa, contratto, fattura, ordine, lotto)
        prendono il cliente da dbops.fn_pgtap_cliente_del_builder e non costruiscono piu' un cliente in
        piu'. Le cinque copie del blocco si ritirano. Brief: brief-modello-documento-vendita (§4-octies).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_pgtap_crea_commessa(
                   -- l'etichetta e' un frammento di testo della fixture: tipo nudo.
                   p_etichetta            text DEFAULT 'pgTAP'::text,
                   p_stato_codice_interno vendite.stati_commessa.codice_interno%TYPE DEFAULT NULL,
                   p_billing_account_id   vendite.commesse.billing_account_id%TYPE DEFAULT NULL,
                   -- un interruttore del chiamante, non il riflesso di una colonna.
                   p_con_attivita         boolean DEFAULT NULL,
                   p_con_sorgente_root    boolean DEFAULT false)
               RETURNS TABLE(
                   commessa_id                 vendite.commesse.id%TYPE,
                   commessa_codice             vendite.commesse.codice%TYPE,
                   emittente_fiscale_id        anagrafiche.emittenti_fiscali.id%TYPE,
                   emittente_soggetto_ruolo_id anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE,
                   auth_user_id                anagrafiche.identita_digitali.auth_user_id%TYPE,
                   billing_account_id          anagrafiche.billing_account.id%TYPE,
                   istanza_utility_id          anagrafiche.billing_account.istanza_utility_id%TYPE,
                   cliente_soggetto_ruolo_id   anagrafiche.billing_account.soggetto_ruolo_id%TYPE,
                   utility_id                  anagrafiche.billing_account.utility_id%TYPE,
                   attivita_id                 vendite.commesse_attivita.id%TYPE,
                   stato_commessa_id           vendite.commesse.stato_commessa_id%TYPE)
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              -- Scopo: dare a una fixture pgTAP una COMMESSA del mondo in una
              --   chiamata: azienda, operatore, cliente e commessa aperta
              --   dalla madre del dominio, nello stato chiesto.
              -- Uso:
              --   CREATE TEMP TABLE tmp_c AS
              --   SELECT * FROM dbops.fn_pgtap_crea_commessa('rls commesse');
              --   -- una commessa emittibile del cliente di un'altra fixture:
              --   SELECT * FROM dbops.fn_pgtap_crea_commessa(
              --              'pull', 'PRONTA_FATTURAZIONE',
              --              (SELECT billing_account_id FROM tmp_cliente));
              -- ⛔ Le attivita' le scrive solo per uscire dalla bozza (o se
              --   p_con_attivita lo chiede): UNA, da
              --   dbops.fn_pgtap_crea_commessa_attivita. Le altre sono il
              --   caso del test. La sorgente ROOT la scrive se
              --   p_con_sorgente_root lo chiede (il pull la pretende).
              -- ⚠️ Senza contesto aperto, il mondo lo apre sull'operatore che
              --   costruisce. Esce con i vincoli IMMEDIATE, come ogni helper.
              -- rev 2026-10-24 (20261024-26, brief-modello-documento-vendita
              --   Q-2): stato, billing account del test e attivita'.
              -- rev 2026-10-24 (20261024-32, R-3): la sorgente ROOT.
              DECLARE
                  v_ef_id     anagrafiche.emittenti_fiscali.id%TYPE;
                  v_ef_sr_id  anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE;
                  v_user_id   anagrafiche.identita_digitali.auth_user_id%TYPE;
                  v_ba_id     anagrafiche.billing_account.id%TYPE;
                  v_ist_id    anagrafiche.billing_account.istanza_utility_id%TYPE;
                  v_cli_sr_id anagrafiche.billing_account.soggetto_ruolo_id%TYPE;
                  v_utility   anagrafiche.billing_account.utility_id%TYPE;
                  v_commessa  vendite.commesse.id%TYPE;
                  v_codice    vendite.commesse.codice%TYPE;
                  v_iniziale  vendite.stati_commessa.id%TYPE;
                  v_target    vendite.stati_commessa.id%TYPE;
                  v_attivita  vendite.commesse_attivita.id%TYPE;
                  v_stato_id  vendite.commesse.stato_commessa_id%TYPE;
              BEGIN
                  -- 0. Lo stato si giudica PRIMA di costruire: un codice che
                  --    non c'e' parla qui, nominando il builder.
                  v_iniziale := script.fn_stato_iniziale_id('vendite.stati_commessa'::regclass);
                  IF p_stato_codice_interno IS NOT NULL THEN
                      SELECT s.id INTO v_target
                        FROM vendite.stati_commessa s
                       WHERE s.codice_interno = p_stato_codice_interno
                         AND s.attivo IS TRUE;
                      IF v_target IS NULL THEN
                          RAISE EXCEPTION
                              'fn_pgtap_crea_commessa: nessuno stato di commessa attivo con codice_interno = %',
                              p_stato_codice_interno;
                      END IF;
                  END IF;

                  -- 1. Il mondo. Senza p_billing_account_id costruisce anche il
                  --    cliente; con, riusa quello e prende solo l'azienda di chi
                  --    agisce, senza costruire un cliente in piu'
                  --    (dbops.fn_pgtap_cliente_del_builder, rev 20261024-40).
                  SELECT c.emittente_fiscale_id, c.emittente_soggetto_ruolo_id,
                         c.auth_user_id, c.billing_account_id, c.istanza_utility_id,
                         c.cliente_soggetto_ruolo_id, c.utility_id
                    INTO v_ef_id, v_ef_sr_id, v_user_id, v_ba_id, v_ist_id,
                         v_cli_sr_id, v_utility
                    FROM dbops.fn_pgtap_cliente_del_builder(
                             p_etichetta, p_billing_account_id, 'fn_pgtap_crea_commessa') c;

                  -- 2. La madre: codice, emittente e stato iniziale li decide lei.
                  v_commessa := vendite.fn_get_or_create_commessa(
                      p_billing_account_id => v_ba_id,
                      p_utility_id         => v_utility,
                      p_competenza_dal     => date_trunc('month', (SELECT script.fn_data_operativa()))::date,
                      p_competenza_al      => (date_trunc('month', (SELECT script.fn_data_operativa()))
                                               + interval '1 month - 1 day')::date,
                      p_meta               => jsonb_build_object('test_scope', 'pgtap_' || p_etichetta),
                      p_force_new          => true);

                  SELECT c.codice INTO v_codice
                    FROM vendite.commesse c
                   WHERE c.id = v_commessa;

                  -- 2-bis. La sorgente ROOT: la commessa e' la radice di se'
                  --    stessa. Sorgente COMMESSA, chiave = l'id (key_selector
                  --    `id` della sorgente): la riga esiste per costruzione.
                  IF p_con_sorgente_root THEN
                      INSERT INTO vendite.commesse_sorgenti
                          (commessa_id, sorgente_tipo_id, sorgente_uid, ruolo_link)
                      VALUES (v_commessa,
                              (SELECT s.id FROM config.sorgenti s
                                WHERE s.codice_interno = 'COMMESSA' AND s.attivo IS TRUE),
                              v_commessa::text, 'ROOT');
                  END IF;

                  -- 3. Il lavoro, PRIMA del passaggio: l'uscita dalla bozza lo
                  --    pretende, e in bozza le righe si scrivono.
                  IF COALESCE(p_con_attivita,
                              v_target IS NOT NULL AND v_target IS DISTINCT FROM v_iniziale) THEN
                      SELECT a.attivita_id INTO v_attivita
                        FROM dbops.fn_pgtap_crea_commessa_attivita(v_commessa) a;
                  END IF;

                  -- 4. Lo stato, per la matrice, sotto i guard veri.
                  IF v_target IS NOT NULL AND v_target IS DISTINCT FROM v_iniziale THEN
                      PERFORM dbops.fn_pgtap_porta_a_stato('vendite.commesse'::regclass, v_commessa,
                                                           p_stato_codice_interno);
                  END IF;

                  -- Contratto dichiarato, non fiducia nel chiamato.
                  SET CONSTRAINTS ALL IMMEDIATE;

                  SELECT c.stato_commessa_id INTO v_stato_id
                    FROM vendite.commesse c
                   WHERE c.id = v_commessa;

                  RETURN QUERY
                  SELECT v_commessa, v_codice, v_ef_id, v_ef_sr_id, v_user_id,
                         v_ba_id, v_ist_id, v_cli_sr_id, v_utility,
                         v_attivita, v_stato_id;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_pgtap_crea_commessa(text, vendite.stati_commessa.codice_interno%TYPE, vendite.commesse.billing_account_id%TYPE, boolean, boolean)
              IS 'Fixture pgTAP: una COMMESSA del mondo in una chiamata: azienda, operatore e cliente (dbops.fn_pgtap_crea_mondo_cliente) e la commessa aperta dalla madre vendite.fn_get_or_create_commessa (p_force_new), con competenza nel mese corrente. Codice, emittente e stato iniziale li decide la madre, come in produzione. ⭐ Secondo parametro: lo stato da raggiungere (NULL o l''iniziale: resta li''), per la matrice con dbops.fn_pgtap_porta_a_stato, sotto i guard veri. ⚠️ Terzo parametro: il billing account di un cliente gia'' costruito, verificato da dbops.fn_pgtap_cliente_ba_del_mondo (un BA di un''altra azienda solleva). Quarto parametro: scrive UN''attivita'' APPROVATA e NON_EMESSA (dbops.fn_pgtap_crea_commessa_attivita) prima del passaggio; NULL = solo se lo stato chiesto non e'' l''iniziale, perche'' l''uscita dalla bozza la pretende. Quinto parametro: scrive la sorgente ROOT (sorgente COMMESSA, chiave l''id della commessa), quella che il pull della fatturazione pretende. ⛔ Le altre attivita'' e le altre sorgenti sono il caso del test. Ritorna le chiavi, l''attivita'' scritta (o NULL) e lo stato raggiunto. ⚠️ Senza contesto aperto lo apre sull''operatore che costruisce; esce con i vincoli IMMEDIATE. Brief: brief-db-fixture-rls-documenti-costruiti. Rev 2026-10-24 (20261024-26, brief-modello-documento-vendita Q-2): stato, billing account e attivita'', DROP + CREATE; 20261024-32 (R-3): la sorgente ROOT. Rev 2026-10-24 (20261024-40, §4-octies): col billing account del test non costruisce piu'' un cliente in piu'' (dbops.fn_pgtap_cliente_del_builder).';

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_pgtap_crea_contratto(
                   -- l'etichetta e' un frammento di testo della fixture, non
                   -- il riflesso di una colonna: tipo nudo.
                   p_etichetta            text DEFAULT 'pgTAP'::text,
                   p_stato_codice_interno config.stati_doc_contratti.codice_interno%TYPE DEFAULT 'DRAFT',
                   p_billing_account_id   vendite.contratti.billing_account_id%TYPE DEFAULT NULL,
                   p_offerta_id           vendite.contratti.offerta_id%TYPE DEFAULT NULL,
                   p_valido_dal           vendite.contratti.valido_dal%TYPE DEFAULT NULL,
                   p_valido_al            vendite.contratti.valido_al%TYPE DEFAULT NULL,
                   p_data                 vendite.contratti.data%TYPE DEFAULT NULL,
                   p_listino_id           vendite.contratti.listino_id%TYPE DEFAULT NULL)
               RETURNS TABLE(
                   contratto_id                vendite.contratti.id%TYPE,
                   numero                      vendite.contratti.numero%TYPE,
                   emittente_fiscale_id        anagrafiche.emittenti_fiscali.id%TYPE,
                   emittente_soggetto_ruolo_id anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE,
                   auth_user_id                anagrafiche.identita_digitali.auth_user_id%TYPE,
                   billing_account_id          anagrafiche.billing_account.id%TYPE,
                   istanza_utility_id          anagrafiche.billing_account.istanza_utility_id%TYPE,
                   cliente_soggetto_ruolo_id   anagrafiche.billing_account.soggetto_ruolo_id%TYPE,
                   utility_id                  anagrafiche.billing_account.utility_id%TYPE,
                   stato_doc_contratto_id      vendite.contratti.stato_doc_contratto_id%TYPE)
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              -- Scopo: dare a una fixture pgTAP (o a uno smoke) un CONTRATTO del
              --   mondo in una chiamata — azienda, operatore, cliente e testata
              --   nello stato scelto — nato dalla madre di produzione.
              -- Uso:
              --   CREATE TEMP TABLE tmp_k AS
              --   SELECT * FROM dbops.fn_pgtap_crea_contratto('atto', 'ATTIVO');
              --   -- il contratto del cliente di un'altra fixture:
              --   SELECT * FROM dbops.fn_pgtap_crea_contratto(
              --              'atto', 'ATTIVO',
              --              (SELECT billing_account_id FROM tmp_commessa));
              --   -- il figlio di un'offerta ACCETTATA, poi annullato:
              --   SELECT * FROM dbops.fn_pgtap_crea_contratto(
              --              'figlio', 'ANNULLATO', NULL,
              --              (SELECT offerta_id FROM tmp_offerta));
              -- ⛔ Righe, eccezioni e scheda di fornitura NON le scrive: sono il
              --   caso del test (un figlio le eredita dall'offerta, dalla push).
              -- ⚠️ Esce con i vincoli IMMEDIATE, come ogni helper.
              -- rev 2026-10-24 (20261024-28, brief-modello-documento-vendita
              --   Q-2): p_offerta_id, il figlio nasce dalla push.
              -- rev 2026-10-24 (20261024-33, R-2): periodo, data e listino del
              --   test, alla madre.
              DECLARE
                  v_ef_id     anagrafiche.emittenti_fiscali.id%TYPE;
                  v_ef_sr_id  anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE;
                  v_user_id   anagrafiche.identita_digitali.auth_user_id%TYPE;
                  v_ba_id     anagrafiche.billing_account.id%TYPE;
                  v_ist_id    anagrafiche.billing_account.istanza_utility_id%TYPE;
                  v_cli_sr_id anagrafiche.billing_account.soggetto_ruolo_id%TYPE;
                  v_utility   anagrafiche.billing_account.utility_id%TYPE;
                  v_contratto vendite.contratti.id%TYPE;
                  v_numero    vendite.contratti.numero%TYPE;
                  v_stato_id  vendite.contratti.stato_doc_contratto_id%TYPE;
                  v_listino   vendite.contratti.listino_id%TYPE;
                  v_ba_off    vendite.offerte_commerciali.billing_account_id%TYPE;
                  -- CONTEGGIO dei legami da confermare all'annullo.
                  v_legami    integer;
              BEGIN
                  -- 0. Lo stato si giudica PRIMA di costruire (D-2 di Tid):
                  --    CESSATO vuole valido_al e passa da ATTIVO con la regola
                  --    della cessazione, ed e' il caso del test.
                  IF p_stato_codice_interno IS NULL
                     OR p_stato_codice_interno NOT IN ('DRAFT', 'ATTIVO', 'ANNULLATO') THEN
                      RAISE EXCEPTION
                          'fn_pgtap_crea_contratto: stato % non costruibile dal builder (DRAFT, ATTIVO, ANNULLATO). CESSATO vuole valido_al e passa da ATTIVO: lo costruisce il test',
                          coalesce(p_stato_codice_interno::text, 'NULL');
                  END IF;

                  -- 0-bis. L'offerta: il figlio ha il cliente della madre, e
                  --    periodo e listino glieli da' la push.
                  IF p_offerta_id IS NOT NULL
                     AND (p_valido_dal IS NOT NULL OR p_valido_al IS NOT NULL
                          OR p_data IS NOT NULL OR p_listino_id IS NOT NULL) THEN
                      RAISE EXCEPTION
                          'fn_pgtap_crea_contratto: il figlio dell''offerta % nasce dalla push, che decide periodo, data e listino dall''offerta: non si chiedono insieme',
                          p_offerta_id;
                  END IF;
                  IF p_offerta_id IS NOT NULL THEN
                      SELECT o.billing_account_id INTO v_ba_off
                        FROM vendite.offerte_commerciali o
                       WHERE o.id = p_offerta_id;
                      IF NOT FOUND THEN
                          RAISE EXCEPTION
                              'fn_pgtap_crea_contratto: nessuna offerta con id = % visibile a chi agisce',
                              p_offerta_id;
                      END IF;
                      IF p_billing_account_id IS NOT NULL
                         AND p_billing_account_id IS DISTINCT FROM v_ba_off THEN
                          RAISE EXCEPTION
                              'fn_pgtap_crea_contratto: il billing account % non e'' quello dell''offerta % (%): il figlio nasce sul cliente della madre',
                              p_billing_account_id, p_offerta_id, v_ba_off;
                      END IF;
                  END IF;

                  -- 1. Il mondo. Senza p_billing_account_id costruisce anche il
                  --    cliente; con, riusa quello e prende solo l'azienda di chi
                  --    agisce, senza costruire un cliente in piu'
                  --    (dbops.fn_pgtap_cliente_del_builder, rev 20261024-40).
                  SELECT c.emittente_fiscale_id, c.emittente_soggetto_ruolo_id,
                         c.auth_user_id, c.billing_account_id, c.istanza_utility_id,
                         c.cliente_soggetto_ruolo_id, c.utility_id
                    INTO v_ef_id, v_ef_sr_id, v_user_id, v_ba_id, v_ist_id,
                         v_cli_sr_id, v_utility
                    FROM dbops.fn_pgtap_cliente_del_builder(
                             p_etichetta, COALESCE(p_billing_account_id, v_ba_off), 'fn_pgtap_crea_contratto') c;

                  IF p_offerta_id IS NOT NULL THEN
                      -- 2-3. Il figlio nasce dalla push: listino, indirizzi,
                      --    righe e utility dall'offerta; stato e idempotenza li
                      --    giudica lei.
                      v_contratto := vendite.fn_push_offerta_a_contratto(p_offerta_id, NULL, false);

                      SELECT k.numero INTO v_numero
                        FROM vendite.contratti k
                       WHERE k.id = v_contratto;
                  ELSE
                      -- 2. Il listino, solo per ATTIVO: un contratto si attiva su un
                      --    listino con una versione attiva, o con una riga AGGIUNTA
                      --    con prezzo (trgfn_contratti_freeze_listino_versione). Le
                      --    righe sono del test; il listino del mondo e' quello di
                      --    chi agisce, per l'utility del cliente
                      --    (dbops.fn_pgtap_crea_listino). DRAFT e ANNULLATO nascono
                      --    senza: il listino lo sceglie il test.
                      --    Il listino del test, se lo da' (rev 20261024-33).
                      v_listino := p_listino_id;
                      IF p_stato_codice_interno = 'ATTIVO' AND v_listino IS NULL THEN
                          SELECT l.listino_id INTO v_listino
                            FROM dbops.fn_pgtap_crea_listino(v_utility, p_etichetta) l;
                      END IF;

                      -- 3. La nascita dalla madre: numero, testata DRAFT, indirizzo
                      --    di default. L'emittente si dichiara: e' quello di chi
                      --    agisce, a cui il BA e' legato.
                      SELECT c.contratto_id, c.numero
                        INTO v_contratto, v_numero
                        -- jsonb_strip_nulls: senza listino la chiave non si
                        -- manda, e la colonna prende il suo default.
                        FROM vendite.fn_create_contratto(
                                 jsonb_strip_nulls(jsonb_build_object(
                                     'billing_account_id',   v_ba_id,
                                     'istanza_utility_id',   v_ist_id,
                                     'utility_id',           v_utility,
                                     'emittente_fiscale_id', v_ef_id,
                                     'listino_id',           v_listino,
                                     'valido_dal',           p_valido_dal,
                                     'valido_al',            p_valido_al,
                                     'data',                 p_data,
                                     'meta', jsonb_build_object('test_scope', 'pgtap_' || p_etichetta)))) c;
                  END IF;

                  -- 4. Lo stato, per la strada dell'applicazione.
                  IF p_stato_codice_interno = 'ATTIVO' THEN
                      -- Il guard di transizione giudica: prezzi, indirizzi,
                      -- righe, contratto sovrapposto.
                      UPDATE vendite.contratti k
                         SET stato_doc_contratto_id = (SELECT s.id
                                                         FROM config.stati_doc_contratti s
                                                        WHERE s.codice_interno = 'ATTIVO')
                       WHERE k.id = v_contratto;
                  ELSIF p_stato_codice_interno = 'ANNULLATO' THEN
                      -- Il verbo. I legami (un figlio ha la sua offerta) si
                      -- dichiarano come fa chi conferma: contati dalla sede unica.
                      SELECT count(*)::integer INTO v_legami
                        FROM vendite.fn_documento_legami('CONTRATTO', v_contratto);
                      PERFORM vendite.fn_annulla_contratto(v_contratto, NULLIF(v_legami, 0));
                  END IF;

                  -- Contratto dichiarato, non fiducia nel chiamato.
                  SET CONSTRAINTS ALL IMMEDIATE;

                  SELECT k.stato_doc_contratto_id INTO v_stato_id
                    FROM vendite.contratti k
                   WHERE k.id = v_contratto;

                  RETURN QUERY
                  SELECT v_contratto, v_numero, v_ef_id, v_ef_sr_id, v_user_id,
                         v_ba_id, v_ist_id, v_cli_sr_id, v_utility, v_stato_id;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_pgtap_crea_contratto(text, config.stati_doc_contratti.codice_interno%TYPE, vendite.contratti.billing_account_id%TYPE, vendite.contratti.offerta_id%TYPE, vendite.contratti.valido_dal%TYPE, vendite.contratti.valido_al%TYPE, vendite.contratti.data%TYPE, vendite.contratti.listino_id%TYPE)
              IS 'Fixture pgTAP (e smoke): un CONTRATTO del mondo in una chiamata — azienda, operatore e cliente (dbops.fn_pgtap_crea_mondo_cliente) e la testata nello stato scelto — e ritorna tutte le chiavi. ⭐ Nasce dalla MADRE di produzione vendite.fn_create_contratto (numero, testata DRAFT, indirizzo di default), con l''emittente di chi agisce dichiarato. ⚠️ Terzo parametro: il billing account di un cliente gia'' costruito (per esempio quello di una commessa, perche'' un contratto citato da una riga deve essere del BA della sua commessa); viene verificato, e un BA di un''altra azienda solleva. ⭐ Quarto parametro: l''offerta da cui il contratto nasce, dalla push vendite.fn_push_offerta_a_contratto (stato ACCETTATA e idempotenza li giudica lei; listino, indirizzi, righe e utility dall''offerta), sul cliente dell''offerta: un billing account diverso solleva. Quinto-ottavo parametro (rev 20261024-33): periodo (valido_dal, valido_al), data e listino del test, passati alla madre; NULL = quelli della madre, e con ATTIVO senza listino il builder ne costruisce uno del mondo; insieme al figlio di un''offerta sollevano (li decide la push). Stati (D-2 di Tid, 2026-10-21): DRAFT; ATTIVO per la strada del guard di transizione (senza righe nessun motivo scatta; un secondo ATTIVO sovrapposto sullo stesso BA lo rifiuta il modello); ANNULLATO dal verbo vendite.fn_annulla_contratto, con i legami dichiarati da vendite.fn_documento_legami (il figlio ha la sua offerta). ⛔ CESSATO e ogni altro codice sollevano prima di scrivere: CESSATO vuole valido_al e passa da ATTIVO, e'' il caso del test. ⛔ NON scrive righe, eccezioni ne'' scheda di fornitura. ⚠️ Esce con i vincoli IMMEDIATE, come ogni helper. Richiesta BE R-1 del 2026-10-21 (smoke-group-attivita-contratto). Rev 2026-10-22: il billing account del terzo parametro lo verifica il building block dbops.fn_pgtap_cliente_ba_del_mondo (regola del 2, estratto alla terza copia). Rev 2026-10-24 (20261024-28, brief-modello-documento-vendita Q-2): il figlio di un''offerta, DROP + CREATE; 20261024-33 (R-2): periodo, data e listino. Rev 2026-10-24 (20261024-40, §4-octies): col billing account del test non costruisce piu'' un cliente in piu'' (dbops.fn_pgtap_cliente_del_builder).';

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_pgtap_crea_fattura(
                   -- l'etichetta e' un frammento di testo della fixture: tipo nudo.
                   p_etichetta            text DEFAULT 'pgTAP'::text,
                   p_stato_codice_interno config.stati_doc_fiscale.codice_interno%TYPE DEFAULT 'DRAFT',
                   p_billing_account_id   vendite.fatture.billing_account_id%TYPE DEFAULT NULL,
                   -- due interruttori del chiamante, non il riflesso di una colonna.
                   p_spoglia_indirizzi    boolean DEFAULT false,
                   p_spoglia_intestazione boolean DEFAULT false,
                   p_minimo               vendite.fatture.minimo%TYPE DEFAULT false,
                   p_totale_a_pagare      vendite.fatture.totale_a_pagare%TYPE DEFAULT NULL,
                   p_termine_pagamento_id vendite.fatture.termine_pagamento_id%TYPE DEFAULT NULL)
               RETURNS TABLE(
                   fattura_id                  vendite.fatture.id%TYPE,
                   registro_id                 vendite.registri_fatturazione.id%TYPE,
                   emittente_fiscale_id        anagrafiche.emittenti_fiscali.id%TYPE,
                   emittente_soggetto_ruolo_id anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE,
                   auth_user_id                anagrafiche.identita_digitali.auth_user_id%TYPE,
                   billing_account_id          anagrafiche.billing_account.id%TYPE,
                   istanza_utility_id          anagrafiche.billing_account.istanza_utility_id%TYPE,
                   cliente_soggetto_ruolo_id   anagrafiche.billing_account.soggetto_ruolo_id%TYPE,
                   utility_id                  anagrafiche.billing_account.utility_id%TYPE,
                   tipo_doc_fiscale_id         config.tipi_doc_fiscale.id%TYPE,
                   stato_doc_fiscale_id        config.stati_doc_fiscale.id%TYPE,
                   valuta_id                   config.valute.id%TYPE)
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              -- Scopo: dare a una fixture pgTAP una FATTURA del mondo in una
              --   chiamata — azienda, operatore, cliente, registro coerente e
              --   testata —
              --   con l'ordine obbligato dentro l'oggetto invece che nel file.
              -- Uso:
              --   CREATE TEMP TABLE tmp_f AS
              --   SELECT * FROM dbops.fn_pgtap_crea_fattura('sistemazioni');
              --   -- la seconda fattura dello STESSO cliente:
              --   SELECT * FROM dbops.fn_pgtap_crea_fattura(
              --              'sistemazioni 2', 'DRAFT',
              --              (SELECT billing_account_id FROM tmp_f));
              --   -- fuori bozza, ma senza indirizzi ne' intestazione:
              --   SELECT * FROM dbops.fn_pgtap_crea_fattura(
              --              'nuda', 'DEFINITIVA', NULL, true, true);
              -- ⛔ Righe, scadenze, contabili e movimenti NON li scrive: sono il
              --   caso del test.
              -- ⭐ rev 2026-10-24 (20261024-25, brief-modello-documento-vendita N-1):
              --   la fattura NASCE nello stato iniziale (trigger della nascita); uno
              --   stato diverso si raggiunge con dbops.fn_pgtap_porta_a_stato, sotto
              --   i guard veri. Un passaggio che pretende cio' che il builder non
              --   scrive (righe, indirizzi…) qui fallisce: il test lo scrive e porta
              --   avanti da se'.
              -- ⭐ rev 2026-10-24 (20261024-27, Q-2): p_spoglia_indirizzi e
              --   p_spoglia_intestazione. La spoliazione si fa nell'ultimo stato
              --   non congelato del percorso (congela_fiscale = false), letto dal
              --   vocabolario: li' i guard di congelamento non scattano.
              -- ⭐ rev 2026-10-24 (20261024-36, R-5): minimo, totale a pagare e
              --   termine di pagamento alla nascita, nell'INSERT.
              -- ⚠️ Esce con i vincoli IMMEDIATE, come ogni helper.
              DECLARE
                  v_ef_id     anagrafiche.emittenti_fiscali.id%TYPE;
                  v_ef_sr_id  anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE;
                  v_user_id   anagrafiche.identita_digitali.auth_user_id%TYPE;
                  v_ba_id     anagrafiche.billing_account.id%TYPE;
                  v_ist_id    anagrafiche.billing_account.istanza_utility_id%TYPE;
                  v_cli_sr_id anagrafiche.billing_account.soggetto_ruolo_id%TYPE;
                  v_utility   anagrafiche.billing_account.utility_id%TYPE;
                  v_tipo_id   config.tipi_doc_fiscale.id%TYPE;
                  v_stato_id  config.stati_doc_fiscale.id%TYPE;
                  v_ordine    config.stati_doc_fiscale.ordine%TYPE;
                  v_sosta     config.stati_doc_fiscale.codice_interno%TYPE;
                  v_valuta_id config.valute.id%TYPE;
                  v_registro  vendite.registri_fatturazione.id%TYPE;
                  v_fattura   vendite.fatture.id%TYPE;
                  v_spoglia   boolean := COALESCE(p_spoglia_indirizzi, false)
                                         OR COALESCE(p_spoglia_intestazione, false);
              BEGIN
                  -- 0. Lo stato si giudica PRIMA di costruire.
                  SELECT s.id, s.ordine INTO v_stato_id, v_ordine
                    FROM config.stati_doc_fiscale s
                   WHERE s.codice_interno = p_stato_codice_interno;

                  IF v_stato_id IS NULL THEN
                      RAISE EXCEPTION
                          'fn_pgtap_crea_fattura: nessuno stato documento fiscale con codice_interno = %',
                          p_stato_codice_interno;
                  END IF;

                  IF v_spoglia THEN
                      IF v_stato_id = script.fn_stato_iniziale_id('config.stati_doc_fiscale'::regclass) THEN
                          RAISE EXCEPTION
                              'fn_pgtap_crea_fattura: % e'' lo stato iniziale, e una fattura che resta in bozza nasce gia'' senza indirizzi e intestazione: non c''e'' niente da spogliare',
                              p_stato_codice_interno;
                      END IF;

                      -- La sosta: l'ultimo stato non congelato prima di quello
                      -- chiesto (o lui stesso), dal vocabolario.
                      SELECT s.codice_interno INTO v_sosta
                        FROM config.stati_doc_fiscale s
                       WHERE s.attivo IS TRUE
                         AND s.iniziale IS FALSE
                         AND s.congela_fiscale IS FALSE
                         AND s.ordine <= v_ordine
                       ORDER BY s.ordine DESC, s.id
                       LIMIT 1;

                      IF v_sosta IS NULL THEN
                          RAISE EXCEPTION
                              'fn_pgtap_crea_fattura: nessuno stato non congelato (congela_fiscale = false) prima di % in cui spogliare la fattura',
                              p_stato_codice_interno;
                      END IF;
                  END IF;

                  -- 1. Il mondo. Senza p_billing_account_id costruisce anche il
                  --    cliente; con, riusa quello e prende solo l'azienda di chi
                  --    agisce, senza costruire un cliente in piu'
                  --    (dbops.fn_pgtap_cliente_del_builder, rev 20261024-40).
                  SELECT c.emittente_fiscale_id, c.emittente_soggetto_ruolo_id,
                         c.auth_user_id, c.billing_account_id, c.istanza_utility_id,
                         c.cliente_soggetto_ruolo_id, c.utility_id
                    INTO v_ef_id, v_ef_sr_id, v_user_id, v_ba_id, v_ist_id,
                         v_cli_sr_id, v_utility
                    FROM dbops.fn_pgtap_cliente_del_builder(
                             p_etichetta, p_billing_account_id, 'fn_pgtap_crea_fattura') c;

                  -- 2. La coppia (emittente, utility) NON si scrive piu' (rev
                  --    20261021-17, brief-db-modelli-documento-standard §10.7 R-4):
                  --    senza la riga valgono i parametri di sistema dell'utility
                  --    (anagrafiche.fn_parametri_importo_utility), e una testata
                  --    fiscale non la pretende piu'. Scriverla nascondeva ai test
                  --    proprio il caso dell'emittente nuovo.

                  -- 3. Il catalogo si SCEGLIE, e ogni scelta ha il suo ORDER BY.
                  SELECT t.id INTO v_tipo_id
                    FROM config.tipi_doc_fiscale t
                   WHERE t.attivo IS TRUE ORDER BY t.id LIMIT 1;

                  SELECT v.id INTO v_valuta_id
                    FROM config.valute v ORDER BY v.id LIMIT 1;

                  -- 4. Il registro dell'azienda di chi agisce: lo crea se non
                  --    c'e', e non ne pesca uno di un'altra (il guard
                  --    trgfn_fatture_guard_registro_emittente lo rifiuterebbe).
                  v_registro := script.fn_pgtap_registro_fattura(v_ef_sr_id);

                  INSERT INTO vendite.fatture (
                      registro_id, data, emittente_soggetto_ruolo_id, billing_account_id,
                      tipo_doc_fiscale_id, valuta_id, utility_id, meta,
                      minimo, totale_a_pagare, termine_pagamento_id)
                  VALUES (v_registro, (SELECT script.fn_data_operativa()), v_ef_sr_id, v_ba_id,
                          v_tipo_id, v_valuta_id, v_utility,
                          jsonb_build_object('test_scope', 'pgtap_' || p_etichetta),
                          COALESCE(p_minimo, false), p_totale_a_pagare, p_termine_pagamento_id)
                  RETURNING id INTO v_fattura;

                  -- Lo stato chiesto (rev 20261024-25): il documento e' nato nello stato
                  -- iniziale; se il test ne vuole un altro, ci arriva per la matrice.
                  -- Per uscire dalla bozza la fattura vuole indirizzi e
                  -- intestazione congelati: li scrive, come la pipeline prima
                  -- di emettere, coi suoi building block. Righe con IVA,
                  -- scadenze e numero restano del test.
                  IF v_stato_id IS DISTINCT FROM script.fn_stato_iniziale_id('config.stati_doc_fiscale'::regclass) THEN
                      PERFORM vendite.fn_snapshot_indirizzi_fattura(v_fattura);
                      PERFORM vendite.fn_snapshot_intestazione_fattura(v_fattura);

                      -- La spoliazione (rev 20261024-27): nella sosta i guard di
                      -- congelamento non scattano; poi il resto del percorso.
                      IF v_spoglia THEN
                          PERFORM dbops.fn_pgtap_porta_a_stato('vendite.fatture'::regclass, v_fattura, v_sosta);

                          IF COALESCE(p_spoglia_indirizzi, false) THEN
                              DELETE FROM vendite.fatture_indirizzi fi
                               WHERE fi.fattura_id = v_fattura;
                          END IF;

                          IF COALESCE(p_spoglia_intestazione, false) THEN
                              UPDATE vendite.fatture f
                                 SET emittente_snapshot = NULL,
                                     cliente_snapshot   = NULL
                               WHERE f.id = v_fattura;
                          END IF;
                      END IF;

                      IF NOT v_spoglia OR v_sosta IS DISTINCT FROM p_stato_codice_interno THEN
                          PERFORM dbops.fn_pgtap_porta_a_stato('vendite.fatture'::regclass, v_fattura, p_stato_codice_interno);
                      END IF;
                  END IF;

                  -- Contratto dichiarato, non fiducia nel chiamato.
                  SET CONSTRAINTS ALL IMMEDIATE;

                  RETURN QUERY
                  SELECT v_fattura, v_registro, v_ef_id, v_ef_sr_id, v_user_id,
                         v_ba_id, v_ist_id, v_cli_sr_id, v_utility,
                         v_tipo_id, v_stato_id, v_valuta_id;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_pgtap_crea_fattura(text, config.stati_doc_fiscale.codice_interno%TYPE, vendite.fatture.billing_account_id%TYPE, boolean, boolean, vendite.fatture.minimo%TYPE, vendite.fatture.totale_a_pagare%TYPE, vendite.fatture.termine_pagamento_id%TYPE)
              IS 'Fixture pgTAP: una FATTURA del mondo in una chiamata — azienda, operatore e cliente (dbops.fn_pgtap_crea_mondo_cliente), il registro coerente con l''emittente di chi agisce (script.fn_pgtap_registro_fattura) e la testata nello stato scelto. ⭐ Esiste per la CATENA D''ORDINE: cliente legato a chi agisce, registro dell''azienda giusta, valuta risolvibile — tre anelli che su un database ricostruito non esistono e che ogni file riscriveva a mano. ⭐ Lo stato: la fattura nasce nello stato iniziale (trigger della nascita) e, se il test ne chiede un altro, ci arriva per la matrice (dbops.fn_pgtap_porta_a_stato) sotto i guard veri, con indirizzi e intestazione scritti dai building block come fa la pipeline. ⚠️ Terzo parametro: un billing account gia'' costruito, per la SECONDA fattura dello stesso cliente; viene verificato (dbops.fn_pgtap_cliente_ba_del_mondo), e un BA di un''altra azienda solleva. Quarto e quinto parametro: la fattura arriva nello stato chiesto SENZA indirizzi e/o SENZA intestazione congelata; si spoglia nell''ultimo stato non congelato del percorso (congela_fiscale = false, letto dal vocabolario). Spogliare una fattura che resta in bozza solleva. Dal sesto all''ottavo parametro (rev 20261024-36, R-5): minimo, totale a pagare e termine di pagamento, scritti alla nascita nell''INSERT della testata. ⛔ NON scrive righe, scadenze, contabili ne'' movimenti: sono il caso del test. ⚠️ Esce con i vincoli IMMEDIATE, come ogni helper. Brief: brief-db-fixture-che-costruiscono-giro-2. Rev 2026-10-21 (20261021-17): la coppia (emittente, utility) non si scrive piu''. Rev 2026-10-22: il BA lo verifica il building block. Rev 2026-10-24 (20261024-25, -27, brief-modello-documento-vendita N-1 e Q-2): nascita in bozza e spoliazione, DROP + CREATE; 20261024-36 (R-5): minimo, totale a pagare, termine. Rev 2026-10-24 (20261024-40, §4-octies): col billing account del test non costruisce piu'' un cliente in piu'' (dbops.fn_pgtap_cliente_del_builder).';

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_pgtap_crea_ordine(
                   -- l'etichetta e' un frammento di testo della fixture: tipo nudo.
                   p_etichetta            text DEFAULT 'pgTAP'::text,
                   p_stato_codice_interno config.stati_doc_ordini.codice_interno%TYPE DEFAULT 'DRAFT',
                   p_billing_account_id   vendite.ordini.billing_account_id%TYPE DEFAULT NULL)
               RETURNS TABLE(
                   ordine_id                   vendite.ordini.id%TYPE,
                   ordine_uid                  vendite.ordini.uid%TYPE,
                   emittente_fiscale_id        anagrafiche.emittenti_fiscali.id%TYPE,
                   emittente_soggetto_ruolo_id anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE,
                   auth_user_id                anagrafiche.identita_digitali.auth_user_id%TYPE,
                   billing_account_id          anagrafiche.billing_account.id%TYPE,
                   istanza_utility_id          anagrafiche.billing_account.istanza_utility_id%TYPE,
                   cliente_soggetto_ruolo_id   anagrafiche.billing_account.soggetto_ruolo_id%TYPE,
                   utility_id                  anagrafiche.billing_account.utility_id%TYPE,
                   stato_doc_ordine_id         config.stati_doc_ordini.id%TYPE,
                   valuta_id                   config.valute.id%TYPE)
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              -- Scopo: dare a una fixture pgTAP un ORDINE di vendita del mondo
              --   in una chiamata: azienda, operatore, cliente e testata.
              -- Uso:
              --   CREATE TEMP TABLE tmp_o AS
              --   SELECT * FROM dbops.fn_pgtap_crea_ordine('rls ordini');
              --   -- il secondo ordine dello STESSO cliente (rev 20261022-10):
              --   SELECT * FROM dbops.fn_pgtap_crea_ordine(
              --              'rls ordini 2', 'DRAFT',
              --              (SELECT billing_account_id FROM tmp_o));
              -- ⛔ Le righe NON le scrive: sono il caso del test.
              -- ⭐ rev 2026-10-24 (20261024-23, brief-modello-documento-vendita N-1):
              --   l'ordine NASCE nello stato iniziale (trigger della nascita); uno
              --   stato diverso si raggiunge con dbops.fn_pgtap_porta_a_stato, sotto
              --   i guard veri. Un passaggio che pretende cio' che il builder non
              --   scrive (righe, indirizzi…) qui fallisce: il test lo scrive e porta
              --   avanti da se'.
              -- ⚠️ Senza contesto aperto, il mondo lo apre sull'operatore che
              --   costruisce. Esce con i vincoli IMMEDIATE, come ogni helper.
              DECLARE
                  v_ef_id     anagrafiche.emittenti_fiscali.id%TYPE;
                  v_ef_sr_id  anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE;
                  v_user_id   anagrafiche.identita_digitali.auth_user_id%TYPE;
                  v_ba_id     anagrafiche.billing_account.id%TYPE;
                  v_ist_id    anagrafiche.billing_account.istanza_utility_id%TYPE;
                  v_cli_sr_id anagrafiche.billing_account.soggetto_ruolo_id%TYPE;
                  v_utility   anagrafiche.billing_account.utility_id%TYPE;
                  v_stato_id  config.stati_doc_ordini.id%TYPE;
                  v_valuta_id config.valute.id%TYPE;
                  v_ordine    vendite.ordini.id%TYPE;
                  v_uid       vendite.ordini.uid%TYPE;
              BEGIN
                  -- Il guard sul parametro PRIMA di costruire: uno stato
                  -- sbagliato non deve lasciare un mondo a meta'.
                  SELECT s.id INTO v_stato_id
                    FROM config.stati_doc_ordini s
                   WHERE s.codice_interno = p_stato_codice_interno;

                  IF v_stato_id IS NULL THEN
                      RAISE EXCEPTION
                          'fn_pgtap_crea_ordine: nessuno stato documento ordine con codice_interno = %',
                          p_stato_codice_interno;
                  END IF;

                  SELECT c.emittente_fiscale_id, c.emittente_soggetto_ruolo_id,
                         c.auth_user_id, c.billing_account_id, c.istanza_utility_id,
                         c.cliente_soggetto_ruolo_id, c.utility_id
                    INTO v_ef_id, v_ef_sr_id, v_user_id, v_ba_id, v_ist_id,
                         v_cli_sr_id, v_utility
                    FROM dbops.fn_pgtap_cliente_del_builder(
                             p_etichetta, p_billing_account_id, 'fn_pgtap_crea_ordine') c;

                  SELECT v.id INTO v_valuta_id
                    FROM config.valute v ORDER BY v.id LIMIT 1;

                  INSERT INTO vendite.ordini (
                      soggetto_ruolo_id, billing_account_id, utility_id,
                      valuta_id, emittente_fiscale_id, meta)
                  VALUES (v_cli_sr_id, v_ba_id, v_utility,
                          v_valuta_id, v_ef_id,
                          jsonb_build_object('test_scope', 'pgtap_' || p_etichetta))
                  RETURNING id, uid INTO v_ordine, v_uid;

                  -- Lo stato chiesto (rev 20261024-23): il documento e' nato nello stato
                  -- iniziale; se il test ne vuole un altro, ci arriva per la matrice.
                  IF v_stato_id IS DISTINCT FROM script.fn_stato_iniziale_id('config.stati_doc_ordini'::regclass) THEN
                      PERFORM dbops.fn_pgtap_porta_a_stato('vendite.ordini'::regclass, v_ordine, p_stato_codice_interno);
                  END IF;

                  -- Contratto dichiarato, non fiducia nel chiamato.
                  SET CONSTRAINTS ALL IMMEDIATE;

                  RETURN QUERY
                  SELECT v_ordine, v_uid, v_ef_id, v_ef_sr_id, v_user_id,
                         v_ba_id, v_ist_id, v_cli_sr_id, v_utility,
                         v_stato_id, v_valuta_id;
              END;
              $function$;

        - sql:
