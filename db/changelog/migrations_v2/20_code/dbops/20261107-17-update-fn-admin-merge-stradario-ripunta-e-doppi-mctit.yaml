# dbops.fn_admin_merge_stradario: la fusione di due vie funziona anche quando
# la via ha indirizzi, e si ferma con l'elenco se due sarebbero uguali.
#   Brief: brief-db-revisione-dbops, D3, D45, R6 (giro 2, decisione Q1).
#
# Base: 20_code/dbops/20261009-46 (l'ultimo changeSet della funzione),
# verificato uguale al vivo (doc auto-generata).
#
# ⚠️ IL DIFETTO (D3). L'UPDATE di anagrafiche.indirizzi_dettaglio.stradario_id
#   non accendeva zeroerp.maintenance_indirizzi_dettaglio: il guard
#   anagrafiche.trgfn_indirizzi_dettaglio_protect_update rifiutava con
#   E_COLONNA_NON_MODIFICABILE, e la fusione si annullava appena la via aveva un
#   indirizzo. Due indirizzi uguali sulle due vie collidevano poi su
#   uq_indirizzi_dettaglio_norm_v2 col 23505.
#
# ⭐ LA CORREZIONE.
#   - Il ripuntamento lo fa dbops.fn_fusione_ripunta_figlie, con le figlie da
#     pg_constraint (la stessa regola della fusione dei comuni): prima cerca i
#     doppi e si ferma con E_MERGE_RIGHE_DOPPIE e l'elenco, senza unire niente;
#   - la porta degli indirizzi si apre solo attorno al ripuntamento, con
#     set_config(..., true), e si richiude subito dopo al valore di prima: dopo
#     la fusione, nella stessa transazione, il cambio a mano e' di nuovo
#     rifiutato. Se il ripuntamento solleva non serve richiuderla a mano:
#     annullando la transazione, o il savepoint di chi chiama, PostgreSQL
#     riporta il parametro al valore di prima;
#   - D45: le tre validazioni con codice registrato (E_MERGE_ORIGINE_UGUALE_
#     DESTINAZIONE, E_STRADARIO_NON_TROVATO, E_DBOPS_CHIAMATA_NON_VALIDA per un
#     id assente), al posto dei RAISE in chiaro;
#   - R6: la durata nella colonna duration_ms, con il nuovo p_duration_ms di
#     dbops.fn_audit_log_once, e non piu' in result.
#   - Il ramo EXCEPTION che scriveva la riga d'audit ERROR esce: senza il canale
#     dblink (D60) quella riga si annullava sempre col RAISE. Il fallimento lo
#     registra error_log, dal codice.
#   - Q16 (Tid, b): la via d'origine resta ed e' marcata come soppressa
#     (config.stradario.obsoleto_dal, 00_schema/config/20261107-09), con la
#     data dell'evento ma mai oltre la data operativa: una soppressione e' un
#     fatto avvenuto. Si segna DOPO il ripuntamento, quando nessuno la
#     riferisce piu'. Una via gia' soppressa non si fonde piu', ne' come
#     origine (non ha piu' niente da spostare) ne' come destinazione (gli
#     indirizzi finirebbero su una via che non si sceglie): E_STRADARIO_SOPPRESSO.
#
# ⚠️ IL NUMERO. Il changeSet era il -05 e si e' fermato al primo apply: il
#   DECLARE nomina config.stradario.obsoleto_dal%TYPE, che il CREATE FUNCTION
#   risolve subito, e la colonna nasce in 00_schema/config/20261107-09. Il
#   migrate esegue in ordine di numero su tutti i livelli: la fusione delle vie
#   passa al -17, dopo la colonna. Non era entrato in nessun databasechangelog.
#
# Firma ancorata con %TYPE alle colonne (config.stradario.id e il registro
#   delle trasformazioni): i tipi risolti sono quelli di prima (integer,
#   character, date, text), quindi l'identita' non cambia e basta CREATE OR
#   REPLACE. dbops/test-character-n-v1 la censisce per p_event_type character.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261107-17-update-fn-admin-merge-stradario-ripunta-e-doppi-mctit.yaml

  - changeSet:
      id: 20261107-17-update-fn-admin-merge-stradario-ripunta-e-doppi
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.fn_admin_merge_stradario: ripunta col building block (doppi fermati con
        l'elenco), apre la porta degli indirizzi solo attorno al ripuntamento (D3); codici
        registrati (D45); durata in colonna (R6); la via d'origine resta, soppressa, e una via
        soppressa non si fonde (Q16).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'dbops' AND p.proname = 'fn_admin_merge_stradario';
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'dbops' AND p.proname = 'fn_fusione_ripunta_figlie';
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_attribute
               WHERE attrelid = 'config.stradario'::regclass
                 AND attname = 'obsoleto_dal' AND NOT attisdropped;
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_admin_merge_stradario(
                  p_id_orig    config.stradario.id%TYPE,
                  p_id_target  config.stradario.id%TYPE,
                  p_event_type storico.stradario_trasformazioni.tipo_evento%TYPE DEFAULT 'F'::bpchar,
                  p_event_date storico.stradario_trasformazioni.data_evento%TYPE DEFAULT script.fn_data_operativa(),
                  p_note       storico.stradario_trasformazioni.note%TYPE        DEFAULT NULL::text
              )
              RETURNS void
              LANGUAGE plpgsql
              AS $function$
              -- Scopo: fondere due vie (config.stradario): registra la trasformazione
              --   in storico.stradario_trasformazioni e ripunta sulla destinazione
              --   tutto cio' che riferiva l'origine. Strumento DBA.
              DECLARE
                  v_chi          dbops.error_log.function_name%TYPE := 'dbops.fn_admin_merge_stradario';
                  v_inizio       timestamptz := clock_timestamp();   -- solo per misurare la durata
                  v_manutenzione text;                               -- un parametro di sessione, non una colonna
                  v_ripuntati    dbops.audit_log.result%TYPE;
                  v_soppressa_id  config.stradario.id%TYPE;
                  v_soppressa_dal config.stradario.obsoleto_dal%TYPE;
                  v_params       dbops.audit_log.params%TYPE := jsonb_build_object(
                      'p_id_orig',    p_id_orig,
                      'p_id_target',  p_id_target,
                      'p_event_type', p_event_type,
                      'p_event_date', p_event_date,
                      'p_note',       p_note);
              BEGIN
                  IF p_id_orig IS NULL OR p_id_target IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', v_chi, 'E_DBOPS_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('campo', CASE WHEN p_id_orig IS NULL THEN 'p_id_orig' ELSE 'p_id_target' END),
                          NULL::uuid,
                          v_chi, 'origine e destinazione sono obbligatorie');
                  END IF;
                  IF p_id_orig = p_id_target THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', v_chi, 'E_MERGE_ORIGINE_UGUALE_DESTINAZIONE',
                          jsonb_build_object('campo', 'p_id_target', 'id', p_id_orig),
                          NULL::uuid,
                          p_id_orig::text);
                  END IF;
                  IF NOT EXISTS (SELECT 1 FROM config.stradario s WHERE s.id = p_id_orig) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', v_chi, 'E_STRADARIO_NON_TROVATO',
                          jsonb_build_object('campo', 'p_id_orig', 'id', p_id_orig),
                          NULL::uuid,
                          p_id_orig::text);
                  END IF;
                  IF NOT EXISTS (SELECT 1 FROM config.stradario s WHERE s.id = p_id_target) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', v_chi, 'E_STRADARIO_NON_TROVATO',
                          jsonb_build_object('campo', 'p_id_target', 'id', p_id_target),
                          NULL::uuid,
                          p_id_target::text);
                  END IF;

                  -- Una via soppressa non si fonde piu' (Q16): ne' come origine
                  -- ne' come destinazione.
                  SELECT s.id, s.obsoleto_dal
                    INTO v_soppressa_id, v_soppressa_dal
                    FROM config.stradario s
                   WHERE s.id IN (p_id_orig, p_id_target)
                     AND s.obsoleto_dal IS NOT NULL
                   ORDER BY s.id = p_id_orig DESC
                   LIMIT 1;
                  IF v_soppressa_id IS NOT NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', v_chi, 'E_STRADARIO_SOPPRESSO',
                          jsonb_build_object('campo', CASE WHEN v_soppressa_id = p_id_orig THEN 'p_id_orig' ELSE 'p_id_target' END,
                                             'id', v_soppressa_id,
                                             'obsoleto_dal', v_soppressa_dal),
                          NULL::uuid,
                          v_soppressa_id::text, to_char(v_soppressa_dal, 'DD/MM/YYYY'));
                  END IF;

                  -- La trasformazione, nel suo registro (non e' una shadow: e' il
                  -- registro delle fusioni).
                  INSERT INTO storico.stradario_trasformazioni(via_id_orig, via_id_nuovo, tipo_evento, data_evento, note)
                  VALUES (p_id_orig, p_id_target, p_event_type, p_event_date, p_note);

                  -- La porta degli indirizzi, aperta solo per il ripuntamento e
                  -- richiusa al valore di prima. Se il ripuntamento solleva, il
                  -- parametro torna da solo al valore di prima con l'annullamento.
                  v_manutenzione := current_setting('zeroerp.maintenance_indirizzi_dettaglio', true);
                  PERFORM set_config('zeroerp.maintenance_indirizzi_dettaglio', 'on', true);

                  v_ripuntati := dbops.fn_fusione_ripunta_figlie(
                      'config.stradario'::regclass, p_id_orig, p_id_target, v_chi);

                  PERFORM set_config('zeroerp.maintenance_indirizzi_dettaglio',
                                     COALESCE(v_manutenzione, ''), true);

                  -- La via d'origine resta, soppressa (Q16): ora nessuno la riferisce.
                  UPDATE config.stradario s
                     SET obsoleto_dal = LEAST(p_event_date, script.fn_data_operativa())
                   WHERE s.id = p_id_orig;

                  PERFORM dbops.fn_audit_log_once(
                      p_function_name => v_chi,
                      p_status        => 'OK',
                      p_params        => v_params,
                      p_rows_affected => (SELECT COALESCE(sum(v::int), 0)::int
                                            FROM jsonb_each_text(v_ripuntati) AS e(k, v)),
                      p_result        => jsonb_build_object('ripuntati', v_ripuntati),
                      p_message       => format('Via %s fusa in %s', p_id_orig, p_id_target),
                      p_duration_ms   => floor(extract(epoch FROM clock_timestamp() - v_inizio) * 1000)::int);
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_admin_merge_stradario(integer, integer, character, date, text) IS
                  'Strumento DBA: fonde la via p_id_orig in p_id_target (config.stradario). Registra la trasformazione in storico.stradario_trasformazioni (il registro delle fusioni, non una shadow) e ripunta sulla destinazione tutte le tabelle che riferivano l''origine, lette dal catalogo (dbops.fn_fusione_ripunta_figlie). Per gli indirizzi (anagrafiche.indirizzi_dettaglio) apre la porta zeroerp.maintenance_indirizzi_dettaglio solo attorno al ripuntamento e la richiude subito dopo. Poi segna la via d''origine come soppressa (obsoleto_dal, con la data dell''evento e mai oltre la data operativa): resta, come radice della catena delle trasformazioni, ma non si sceglie piu'' per il nuovo. Una via gia'' soppressa non si fonde, ne'' come origine ne'' come destinazione (E_STRADARIO_SOPPRESSO). Se due righe diventerebbero uguali si ferma prima di scrivere, con E_MERGE_RIGHE_DOPPIE e l''elenco dei doppi: nessuna unione automatica. Rifiuta anche con E_MERGE_ORIGINE_UGUALE_DESTINAZIONE, E_STRADARIO_NON_TROVATO ed E_DBOPS_CHIAMATA_NON_VALIDA. Scrive una riga di dbops.audit_log con le righe ripuntate per tabella e la durata.';
      rollback:
        - sql:
            dbms: postgresql
            sql: |
              -- Il verso di ritiro e' un changeSet nuovo dal corpo di 20261009-46.
              SELECT 1;
