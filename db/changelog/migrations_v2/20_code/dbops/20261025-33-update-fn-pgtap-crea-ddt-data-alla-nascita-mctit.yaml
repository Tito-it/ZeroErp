# dbops.fn_pgtap_crea_ddt: LA DATA DELLA BOLLA ALLA NASCITA
#   Brief: brief-db-pgtap-reso-costruito §7.3, E-5 (Tid, 2026-10-25).
#
#   La bolla senza ordine di fixture (dbops.fn_pgtap_crea_ddt_senza_ordine,
#   20261025-34) nasce da questo builder, e i test che la usano scelgono la
#   data (per esempio numerazione-trasloco, che fa divergere l'anno della data
#   da quello dell'emissione). Fuori bozza la data e' congelata: si sceglie
#   nell'INSERT, non con un UPDATE dopo il builder.
#   * Sesto parametro p_data, in coda; NULL = la data operativa, come prima.
#   * Corpo del 20261020-62 per il resto identico. La firma cambia: DROP +
#     CREATE; le chiamate esistenti (cinque argomenti al piu') restano valide.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261025-33-update-fn-pgtap-crea-ddt-data-alla-nascita-mctit.yaml

  - changeSet:
      id: 20261025-33-update-fn-pgtap-crea-ddt-data-alla-nascita
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.fn_pgtap_crea_ddt: sesto parametro p_data, la data della bolla alla nascita.
        Brief: brief-db-pgtap-reso-costruito (E-5).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION IF EXISTS dbops.fn_pgtap_crea_ddt(anagrafiche.billing_account.id%TYPE, anagrafiche.soggetti_ruoli.id%TYPE, config.causali_trasporto.codice%TYPE, magazzino.magazzini.id%TYPE, magazzino.magazzini.id%TYPE);

              CREATE FUNCTION dbops.fn_pgtap_crea_ddt(
                  p_billing_account_id  anagrafiche.billing_account.id%TYPE,
                  p_destinatario_sr_id  anagrafiche.soggetti_ruoli.id%TYPE,
                  p_causale_codice      config.causali_trasporto.codice%TYPE,
                  p_magazzino_id        magazzino.magazzini.id%TYPE DEFAULT NULL,
                  p_magazzino_arrivo_id magazzino.magazzini.id%TYPE DEFAULT NULL,
                  p_data                vendite.ddt.data%TYPE DEFAULT NULL)
               RETURNS vendite.ddt.id%TYPE
               LANGUAGE plpgsql
              AS $function$
              -- rev 2026-10-25 (20261025-33, brief-db-pgtap-reso-costruito E-5): p_data,
              --   la data della bolla alla nascita (NULL = data operativa, come prima).
              -- rev 2026-10-20 (20261020-62, brief-db-grammatica-unica-documenti, 2d G-6):
              --   l'ambito degli indirizzi DDT diventa DDT_VENDITA, il codice della
              --   sorgente; firma e RETURNS ancorati.
              -- Scopo: una bolla in bozza per un pgTAP, costruita e non pescata.
              -- Uso: v_ddt := dbops.fn_pgtap_crea_ddt(<ba>, <sr cliente>, 'VENDITA', <mag>);
              DECLARE
                  v_ef      vendite.ddt.emittente_fiscale_id%TYPE;
                  v_draft   config.stati_doc_ddt.id%TYPE;
                  v_causale config.causali_trasporto.id%TYPE;
                  v_utility vendite.ddt.utility_id%TYPE;
                  v_valuta  vendite.ddt.valuta_id%TYPE;
                  v_id      vendite.ddt.id%TYPE;
              BEGIN
                  v_ef := script.fn_pgtap_emittente_operatore();
                  IF v_ef IS NULL THEN
                      RAISE EXCEPTION 'fn_pgtap_crea_ddt: nessun emittente per l''operatore in sessione — chiamare prima fn_pgtap_set_contesto_operatore';
                  END IF;
                  SELECT s.id INTO v_draft FROM config.stati_doc_ddt s WHERE s.codice_interno = 'DRAFT' AND s.attivo;
                  SELECT c.id INTO v_causale FROM config.causali_trasporto c WHERE c.codice = p_causale_codice AND c.attivo;
                  IF v_draft IS NULL OR v_causale IS NULL THEN
                      RAISE EXCEPTION 'fn_pgtap_crea_ddt: stato DRAFT o causale di trasporto % assenti — sono seed di 80_data', p_causale_codice;
                  END IF;
                  SELECT ba.utility_id INTO v_utility FROM anagrafiche.billing_account ba WHERE ba.id = p_billing_account_id;
                  SELECT v.id INTO v_valuta FROM config.valute v ORDER BY v.id LIMIT 1;

                  INSERT INTO vendite.ddt (data, stato_doc_ddt_id, destinatario_soggetto_ruolo_id,
                                           billing_account_id, utility_id, valuta_id, emittente_fiscale_id,
                                           causale_trasporto_id, magazzino_id, magazzino_arrivo_id,
                                           storicizza, meta)
                  VALUES (COALESCE(p_data, (SELECT script.fn_data_operativa())), v_draft, p_destinatario_sr_id,
                          p_billing_account_id, v_utility, v_valuta, v_ef,
                          v_causale, p_magazzino_id, p_magazzino_arrivo_id,
                          false, jsonb_build_object('test_scope', 'pgtap_crea_ddt'))
                  RETURNING id INTO v_id;

                  -- Gli indirizzi che l'emissione pretende per l'ambito DDT.
                  INSERT INTO vendite.ddt_indirizzi (ddt_id, tipo_indirizzo_id, snapshot)
                  SELECT v_id, ti.id, '{"display":"pgtap"}'::jsonb
                    FROM config.tipi_indirizzi ti
                   WHERE ti.codice_interno = ANY (script.fn_indirizzi_obbligatori_mancanti('DDT_VENDITA', NULL))
                  ON CONFLICT DO NOTHING;

                  SET CONSTRAINTS ALL IMMEDIATE;
                  RETURN v_id;
              END;
              $function$;
              COMMENT ON FUNCTION dbops.fn_pgtap_crea_ddt(anagrafiche.billing_account.id%TYPE, anagrafiche.soggetti_ruoli.id%TYPE, config.causali_trasporto.codice%TYPE, magazzino.magazzini.id%TYPE, magazzino.magazzini.id%TYPE, vendite.ddt.data%TYPE) IS
                'Fixture pgTAP: una bolla in DRAFT dell''emittente dell''operatore in sessione (script.fn_pgtap_emittente_operatore), per il cliente passato dal test (dal suo fn_pgtap_crea_mondo_cliente: costruito, non pescato), con la causale di trasporto per CODICE, i magazzini scelti (NULL = il default del predefinito, D-L3-h) e gli indirizzi obbligatori dell''ambito DDT. Le righe restano al test. Esce con i vincoli IMMEDIATE. Solo per i pgTAP (brief-db-magazzino-lotto-3-scarico-da-ddt, sezione 5). Rev 2026-10-20 (20261020-62, brief-db-grammatica-unica-documenti 2d, G-6): l''ambito degli indirizzi DDT diventa DDT_VENDITA, il codice della sorgente. Sesto parametro (rev 2026-10-25, 20261025-33, brief-db-pgtap-reso-costruito E-5): la data della bolla, alla nascita (NULL = data operativa); DROP + CREATE.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION IF EXISTS dbops.fn_pgtap_crea_ddt(anagrafiche.billing_account.id%TYPE, anagrafiche.soggetti_ruoli.id%TYPE, config.causali_trasporto.codice%TYPE, magazzino.magazzini.id%TYPE, magazzino.magazzini.id%TYPE, vendite.ddt.data%TYPE);

              CREATE FUNCTION dbops.fn_pgtap_crea_ddt(
                  p_billing_account_id  anagrafiche.billing_account.id%TYPE,
                  p_destinatario_sr_id  anagrafiche.soggetti_ruoli.id%TYPE,
                  p_causale_codice      config.causali_trasporto.codice%TYPE,
                  p_magazzino_id        magazzino.magazzini.id%TYPE DEFAULT NULL,
                  p_magazzino_arrivo_id magazzino.magazzini.id%TYPE DEFAULT NULL)
               RETURNS vendite.ddt.id%TYPE
               LANGUAGE plpgsql
              AS $function$
              -- rev 2026-10-20 (20261020-62, brief-db-grammatica-unica-documenti, 2d G-6):
              --   l'ambito degli indirizzi DDT diventa DDT_VENDITA, il codice della
              --   sorgente; firma e RETURNS ancorati.
              -- Scopo: una bolla in bozza per un pgTAP, costruita e non pescata.
              -- Uso: v_ddt := dbops.fn_pgtap_crea_ddt(<ba>, <sr cliente>, 'VENDITA', <mag>);
              DECLARE
                  v_ef      vendite.ddt.emittente_fiscale_id%TYPE;
                  v_draft   config.stati_doc_ddt.id%TYPE;
                  v_causale config.causali_trasporto.id%TYPE;
                  v_utility vendite.ddt.utility_id%TYPE;
                  v_valuta  vendite.ddt.valuta_id%TYPE;
                  v_id      vendite.ddt.id%TYPE;
              BEGIN
                  v_ef := script.fn_pgtap_emittente_operatore();
                  IF v_ef IS NULL THEN
                      RAISE EXCEPTION 'fn_pgtap_crea_ddt: nessun emittente per l''operatore in sessione — chiamare prima fn_pgtap_set_contesto_operatore';
                  END IF;
                  SELECT s.id INTO v_draft FROM config.stati_doc_ddt s WHERE s.codice_interno = 'DRAFT' AND s.attivo;
                  SELECT c.id INTO v_causale FROM config.causali_trasporto c WHERE c.codice = p_causale_codice AND c.attivo;
                  IF v_draft IS NULL OR v_causale IS NULL THEN
                      RAISE EXCEPTION 'fn_pgtap_crea_ddt: stato DRAFT o causale di trasporto % assenti — sono seed di 80_data', p_causale_codice;
                  END IF;
                  SELECT ba.utility_id INTO v_utility FROM anagrafiche.billing_account ba WHERE ba.id = p_billing_account_id;
                  SELECT v.id INTO v_valuta FROM config.valute v ORDER BY v.id LIMIT 1;

                  INSERT INTO vendite.ddt (data, stato_doc_ddt_id, destinatario_soggetto_ruolo_id,
                                           billing_account_id, utility_id, valuta_id, emittente_fiscale_id,
                                           causale_trasporto_id, magazzino_id, magazzino_arrivo_id,
                                           storicizza, meta)
                  VALUES ((SELECT script.fn_data_operativa()), v_draft, p_destinatario_sr_id,
                          p_billing_account_id, v_utility, v_valuta, v_ef,
                          v_causale, p_magazzino_id, p_magazzino_arrivo_id,
                          false, jsonb_build_object('test_scope', 'pgtap_crea_ddt'))
                  RETURNING id INTO v_id;

                  -- Gli indirizzi che l'emissione pretende per l'ambito DDT.
                  INSERT INTO vendite.ddt_indirizzi (ddt_id, tipo_indirizzo_id, snapshot)
                  SELECT v_id, ti.id, '{"display":"pgtap"}'::jsonb
                    FROM config.tipi_indirizzi ti
                   WHERE ti.codice_interno = ANY (script.fn_indirizzi_obbligatori_mancanti('DDT_VENDITA', NULL))
                  ON CONFLICT DO NOTHING;

                  SET CONSTRAINTS ALL IMMEDIATE;
                  RETURN v_id;
              END;
              $function$;
              COMMENT ON FUNCTION dbops.fn_pgtap_crea_ddt(bigint,bigint,character varying,bigint,bigint) IS
                'Fixture pgTAP: una bolla in DRAFT dell''emittente dell''operatore in sessione (script.fn_pgtap_emittente_operatore), per il cliente passato dal test (dal suo fn_pgtap_crea_mondo_cliente: costruito, non pescato), con la causale di trasporto per CODICE, i magazzini scelti (NULL = il default del predefinito, D-L3-h) e gli indirizzi obbligatori dell''ambito DDT. Le righe restano al test. Esce con i vincoli IMMEDIATE. Solo per i pgTAP (brief-db-magazzino-lotto-3-scarico-da-ddt, sezione 5). Rev 2026-10-20 (20261020-62, brief-db-grammatica-unica-documenti 2d, G-6): l''ambito degli indirizzi DDT diventa DDT_VENDITA, il codice della sorgente.';
