# ------------------------------------------------------------
# IL SECONDO ORDINE DELLO STESSO CLIENTE
#   dbops.fn_pgtap_crea_ordine (rev; corpo vivo dalla doc dbzero)
#   Richiesta BE del 2026-10-21 (R-3, §9.11 di brief-be-utenti-di-sviluppo);
#   via di Tid, 2026-10-22.
#
# Il caso: smoke-push-termine-documento-commessa.py vuole due ordini dello
#   stesso cliente; ogni chiamata del builder costruiva un cliente nuovo, e lo
#   smoke scriveva ancora l'ordine con un INSERT del BE. Fattura e contratto il
#   terzo parametro lo hanno gia'.
#
# La correzione: p_billing_account_id facoltativo (DEFAULT NULL). Con, il
#   cliente e' quello del BA, verificato dell'azienda di chi agisce dal
#   building block dbops.fn_pgtap_cliente_ba_del_mondo (20261022-09); senza,
#   tutto come prima.
#   ⛔ FIRMA NUOVA: un parametro in piu' non si aggiunge con CREATE OR REPLACE
#   (nascerebbe un secondo overload, e con i DEFAULT le chiamate a due
#   argomenti diventerebbero ambigue). DROP della firma vecchia e CREATE della
#   nuova nello stesso changeSet. I chiamanti a uno o due argomenti restano
#   validi grazie al DEFAULT; chi nomina la firma per testo va adeguato:
#   db/pgtap/dbops/test-fn-pgtap-crea-ordine-v1.sql (adeguato qui) e il test
#   Django backend/apps/vendite/tests/db/test_origine_ordine_sorgente_db.py
#   (richiedi_db_provvisto con la firma: ricaduta BE).
#   Firma e RETURNS TABLE ancorati (%TYPE; il risultato risolve identico);
#   l'etichetta resta text. SECURITY INVOKER esplicito.
# Verifica: db/pgtap/dbops/test-fn-pgtap-crea-ordine-v1.sql (test 7-8 nuovi).
#
# Ritorno indietro: DROP della firma nuova e il corpo e il COMMENT di
#   20261007-23 (nel rollback).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261022-10-update-fn-pgtap-crea-ordine-terzo-parametro-mctit.yaml

  - changeSet:
      id: 20261022-10-update-fn-pgtap-crea-ordine-terzo-parametro
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.fn_pgtap_crea_ordine: terzo parametro facoltativo p_billing_account_id, per il secondo
        ordine dello stesso cliente, verificato da dbops.fn_pgtap_cliente_ba_del_mondo. Firma nuova: DROP
        + CREATE. Richiesta BE R-3, §9.11.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION dbops.fn_pgtap_crea_ordine(text, character varying);

              CREATE FUNCTION dbops.fn_pgtap_crea_ordine(
                   -- l'etichetta e' un frammento di testo della fixture: tipo nudo.
                   p_etichetta            text DEFAULT 'pgTAP'::text,
                   p_stato_codice_interno config.stati_doc_ordini.codice_interno%TYPE DEFAULT 'DRAFT',
                   p_billing_account_id   vendite.ordini.billing_account_id%TYPE DEFAULT NULL)
               RETURNS TABLE(
                   ordine_id                   vendite.ordini.id%TYPE,
                   ordine_uid                  vendite.ordini.uid%TYPE,
                   emittente_fiscale_id        anagrafiche.emittenti_fiscali.id%TYPE,
                   emittente_soggetto_ruolo_id anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE,
                   auth_user_id                anagrafiche.identita_digitali.auth_user_id%TYPE,
                   billing_account_id          anagrafiche.billing_account.id%TYPE,
                   istanza_utility_id          anagrafiche.billing_account.istanza_utility_id%TYPE,
                   cliente_soggetto_ruolo_id   anagrafiche.billing_account.soggetto_ruolo_id%TYPE,
                   utility_id                  anagrafiche.billing_account.utility_id%TYPE,
                   stato_doc_ordine_id         config.stati_doc_ordini.id%TYPE,
                   valuta_id                   config.valute.id%TYPE)
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              -- Scopo: dare a una fixture pgTAP un ORDINE di vendita del mondo
              --   in una chiamata: azienda, operatore, cliente e testata.
              -- Uso:
              --   CREATE TEMP TABLE tmp_o AS
              --   SELECT * FROM dbops.fn_pgtap_crea_ordine('rls ordini');
              --   -- il secondo ordine dello STESSO cliente (rev 20261022-10):
              --   SELECT * FROM dbops.fn_pgtap_crea_ordine(
              --              'rls ordini 2', 'DRAFT',
              --              (SELECT billing_account_id FROM tmp_o));
              -- ⛔ Le righe NON le scrive: sono il caso del test.
              -- ⚠️ Senza contesto aperto, il mondo lo apre sull'operatore che
              --   costruisce. Esce con i vincoli IMMEDIATE, come ogni helper.
              DECLARE
                  v_ef_id     anagrafiche.emittenti_fiscali.id%TYPE;
                  v_ef_sr_id  anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE;
                  v_user_id   anagrafiche.identita_digitali.auth_user_id%TYPE;
                  v_ba_id     anagrafiche.billing_account.id%TYPE;
                  v_ist_id    anagrafiche.billing_account.istanza_utility_id%TYPE;
                  v_cli_sr_id anagrafiche.billing_account.soggetto_ruolo_id%TYPE;
                  v_utility   anagrafiche.billing_account.utility_id%TYPE;
                  v_stato_id  config.stati_doc_ordini.id%TYPE;
                  v_valuta_id config.valute.id%TYPE;
                  v_ordine    vendite.ordini.id%TYPE;
                  v_uid       vendite.ordini.uid%TYPE;
              BEGIN
                  -- Il guard sul parametro PRIMA di costruire: uno stato
                  -- sbagliato non deve lasciare un mondo a meta'.
                  SELECT s.id INTO v_stato_id
                    FROM config.stati_doc_ordini s
                   WHERE s.codice_interno = p_stato_codice_interno;

                  IF v_stato_id IS NULL THEN
                      RAISE EXCEPTION
                          'fn_pgtap_crea_ordine: nessuno stato documento ordine con codice_interno = %',
                          p_stato_codice_interno;
                  END IF;

                  SELECT m.emittente_fiscale_id, m.emittente_soggetto_ruolo_id,
                         m.auth_user_id, m.billing_account_id, m.istanza_utility_id,
                         m.cliente_soggetto_ruolo_id, m.utility_id
                    INTO v_ef_id, v_ef_sr_id, v_user_id, v_ba_id, v_ist_id,
                         v_cli_sr_id, v_utility
                    FROM dbops.fn_pgtap_crea_mondo_cliente(p_etichetta) m;

                  -- Il terzo parametro (rev 20261022-10): il cliente di un mondo gia'
                  -- costruito, per il secondo ordine dello stesso cliente. Il building
                  -- block lo verifica dell'azienda di chi agisce e ne torna le chiavi.
                  IF p_billing_account_id IS NOT NULL THEN
                      SELECT c.billing_account_id, c.istanza_utility_id,
                             c.cliente_soggetto_ruolo_id, c.utility_id
                        INTO v_ba_id, v_ist_id, v_cli_sr_id, v_utility
                        FROM dbops.fn_pgtap_cliente_ba_del_mondo(
                                 p_billing_account_id, v_ef_sr_id, 'fn_pgtap_crea_ordine') c;
                  END IF;

                  SELECT v.id INTO v_valuta_id
                    FROM config.valute v ORDER BY v.id LIMIT 1;

                  INSERT INTO vendite.ordini (
                      soggetto_ruolo_id, billing_account_id, utility_id,
                      stato_doc_ordine_id, valuta_id, emittente_fiscale_id, meta)
                  VALUES (v_cli_sr_id, v_ba_id, v_utility,
                          v_stato_id, v_valuta_id, v_ef_id,
                          jsonb_build_object('test_scope', 'pgtap_' || p_etichetta))
                  RETURNING id, uid INTO v_ordine, v_uid;

                  -- Contratto dichiarato, non fiducia nel chiamato.
                  SET CONSTRAINTS ALL IMMEDIATE;

                  RETURN QUERY
                  SELECT v_ordine, v_uid, v_ef_id, v_ef_sr_id, v_user_id,
                         v_ba_id, v_ist_id, v_cli_sr_id, v_utility,
                         v_stato_id, v_valuta_id;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_pgtap_crea_ordine(text, config.stati_doc_ordini.codice_interno%TYPE, vendite.ordini.billing_account_id%TYPE)
              IS 'Fixture pgTAP: un ORDINE di vendita del mondo in una chiamata: azienda, operatore e cliente (dbops.fn_pgtap_crea_mondo_cliente) e la testata nello stato scelto alla nascita, con l''emittente del mondo, il suo billing account, la sua utility e la prima valuta del catalogo. Numero, anno, registro e fatturazione_trigger li assegnano i trigger del dominio, come in produzione. ⛔ NON scrive righe: sono il caso del test. ⛔ Non cambia stato: vendite.ordini ha un guard di transizione, lo stato si sceglie col secondo parametro. ⚠️ Senza contesto aperto lo apre sull''operatore che costruisce; esce con i vincoli IMMEDIATE. Brief: brief-db-fixture-rls-documenti-costruiti. ⚠️ Terzo parametro (rev 2026-10-22, 20261022-10, richiesta BE R-3): il billing account di un cliente gia'' costruito, per il secondo ordine dello stesso cliente; verificato dell''azienda di chi agisce da dbops.fn_pgtap_cliente_ba_del_mondo, e un BA di un''altra azienda solleva.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION dbops.fn_pgtap_crea_ordine(text, character varying, bigint);

              CREATE OR REPLACE FUNCTION dbops.fn_pgtap_crea_ordine(p_etichetta text DEFAULT 'pgTAP'::text, p_stato_codice_interno character varying DEFAULT 'DRAFT'::character varying)
               RETURNS TABLE(ordine_id bigint, ordine_uid uuid, emittente_fiscale_id bigint, emittente_soggetto_ruolo_id bigint, auth_user_id integer, billing_account_id bigint, istanza_utility_id bigint, cliente_soggetto_ruolo_id bigint, utility_id integer, stato_doc_ordine_id bigint, valuta_id integer)
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: dare a una fixture pgTAP un ORDINE di vendita del mondo
              --   in una chiamata: azienda, operatore, cliente e testata.
              -- Uso:
              --   CREATE TEMP TABLE tmp_o AS
              --   SELECT * FROM dbops.fn_pgtap_crea_ordine('rls ordini');
              -- ⛔ Le righe NON le scrive: sono il caso del test.
              -- ⚠️ Senza contesto aperto, il mondo lo apre sull'operatore che
              --   costruisce. Esce con i vincoli IMMEDIATE, come ogni helper.
              DECLARE
                  v_ef_id     anagrafiche.emittenti_fiscali.id%TYPE;
                  v_ef_sr_id  anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE;
                  v_user_id   anagrafiche.identita_digitali.auth_user_id%TYPE;
                  v_ba_id     anagrafiche.billing_account.id%TYPE;
                  v_ist_id    anagrafiche.billing_account.istanza_utility_id%TYPE;
                  v_cli_sr_id anagrafiche.billing_account.soggetto_ruolo_id%TYPE;
                  v_utility   anagrafiche.billing_account.utility_id%TYPE;
                  v_stato_id  config.stati_doc_ordini.id%TYPE;
                  v_valuta_id config.valute.id%TYPE;
                  v_ordine    vendite.ordini.id%TYPE;
                  v_uid       vendite.ordini.uid%TYPE;
              BEGIN
                  -- Il guard sul parametro PRIMA di costruire: uno stato
                  -- sbagliato non deve lasciare un mondo a meta'.
                  SELECT s.id INTO v_stato_id
                    FROM config.stati_doc_ordini s
                   WHERE s.codice_interno = p_stato_codice_interno;

                  IF v_stato_id IS NULL THEN
                      RAISE EXCEPTION
                          'fn_pgtap_crea_ordine: nessuno stato documento ordine con codice_interno = %',
                          p_stato_codice_interno;
                  END IF;

                  SELECT m.emittente_fiscale_id, m.emittente_soggetto_ruolo_id,
                         m.auth_user_id, m.billing_account_id, m.istanza_utility_id,
                         m.cliente_soggetto_ruolo_id, m.utility_id
                    INTO v_ef_id, v_ef_sr_id, v_user_id, v_ba_id, v_ist_id,
                         v_cli_sr_id, v_utility
                    FROM dbops.fn_pgtap_crea_mondo_cliente(p_etichetta) m;

                  SELECT v.id INTO v_valuta_id
                    FROM config.valute v ORDER BY v.id LIMIT 1;

                  INSERT INTO vendite.ordini (
                      soggetto_ruolo_id, billing_account_id, utility_id,
                      stato_doc_ordine_id, valuta_id, emittente_fiscale_id, meta)
                  VALUES (v_cli_sr_id, v_ba_id, v_utility,
                          v_stato_id, v_valuta_id, v_ef_id,
                          jsonb_build_object('test_scope', 'pgtap_' || p_etichetta))
                  RETURNING id, uid INTO v_ordine, v_uid;

                  -- Contratto dichiarato, non fiducia nel chiamato.
                  SET CONSTRAINTS ALL IMMEDIATE;

                  RETURN QUERY
                  SELECT v_ordine, v_uid, v_ef_id, v_ef_sr_id, v_user_id,
                         v_ba_id, v_ist_id, v_cli_sr_id, v_utility,
                         v_stato_id, v_valuta_id;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_pgtap_crea_ordine(text, character varying)
              IS 'Fixture pgTAP: un ORDINE di vendita del mondo in una chiamata: azienda, operatore e cliente (dbops.fn_pgtap_crea_mondo_cliente) e la testata nello stato scelto alla nascita, con l''emittente del mondo, il suo billing account, la sua utility e la prima valuta del catalogo. Numero, anno, registro e fatturazione_trigger li assegnano i trigger del dominio, come in produzione. ⛔ NON scrive righe: sono il caso del test. ⛔ Non cambia stato: vendite.ordini ha un guard di transizione, lo stato si sceglie col secondo parametro. ⚠️ Senza contesto aperto lo apre sull''operatore che costruisce; esce con i vincoli IMMEDIATE. Brief: brief-db-fixture-rls-documenti-costruiti.';
