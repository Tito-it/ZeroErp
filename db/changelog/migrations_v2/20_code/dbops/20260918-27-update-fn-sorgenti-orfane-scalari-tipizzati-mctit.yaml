# P-8 (rev) — dbops.fn_sorgenti_orfane(): il record letto da SQL DINAMICO
#   diventa TRE SCALARI TIPIZZATI. Stesso comportamento, stessa firma.
#   Brief: brief-db-magazzino-lotto-2-motore, sezione 4.7 e sezione 5
#   (trappola «record + SQL dinamico»).
#
# -- IL ROSSO, DOPO L'APPLY DEL 18-09 (12:23) ----------------------------------------
#   db/pgtap/dbops/test-riferimenti-morti-v1.sql, test 2 («nessun riferimento
#   morto fuori dal registro del debito»), col runner come app:
#     dbops.fn_sorgenti_orfane -> error:55000:29:RETURN QUERY:il record "v_s"
#                                 non e' stato ancora assegnato
#     dbops.fn_sorgenti_orfane -> error:XX000:29:RETURN QUERY:cached plan is
#                                 not valid plan
#   Nessuna classe FP_* copre quella forma (FP_SQL_DINAMICO prende solo il
#   42601 dentro un EXECUTE): usciva REALE, cioe' «riferimento morto», e il
#   presidio era rosso su una funzione che a runtime lavora (6/6 nel suo pgTAP,
#   zero orfani su dev).
#
# -- LA CAUSA E' LA FORMA, E LO DICE plpgsql_check STESSO -------------------------------
#   `FOR v_s IN EXECUTE format(...)` con `v_s record`: la struttura della tupla
#   di un record riempito da una query DINAMICA e' indeterminata al momento del
#   controllo, quindi ogni `v_s.campo` che segue e' «non ancora assegnato», e il
#   piano che ne dipende non si costruisce (XX000). La riga 18 lo avvisava gia':
#     warning:00000:18:ciclo FOR su una istruzione EXECUTE:cannot determinate
#     a result of dynamic SQL — Hint: Don't use dynamic SQL and record type
#     together, when you would check function.
#   `v_t record` dal SELECT STATICO su fn_sorgenti_orfane_perimetro() invece va
#   bene: le colonne le conosce.
#
# -- IL RIMEDIO E' SUL MODELLO, NON NEL REGISTRO -------------------------------------------
#   I tre campi letti dal ciclo interno sono COLONNE di config.sorgenti (id,
#   key_selector, target_table): si dichiarano con %TYPE (regola di Tid del
#   18-09, P-0: %TYPE anche nel DECLARE) e il ciclo diventa
#     FOR v_tipo_id, v_key_selector, v_target_table IN EXECUTE ...
#   — PL/pgSQL accetta una lista di scalari come bersaglio del FOR ... IN
#   EXECUTE, e plpgsql_check ne conosce i tipi.
#   ⛔ Non una riga in riferimenti_morti_esenzioni: quel registro e' un DEBITO
#   datato, e qui non c'e' un debito — c'e' una funzione nata oggi, non ancora
#   committata, con una forma che il presidio non sa leggere. Si cambia la
#   forma. (Il file -25 e' gia' EXECUTED su dbdev: si supera, non si riscrive.)
#
# -- PROVATO (transazione annullata, dbdev, 18-09) ---------------------------------------
#   plpgsql_check_function sul corpo nuovo: solo `warning extra` («OUT variable
#   maybe unmodified», inevitabile con RETURN QUERY EXECUTE), ZERO `error:`;
#   fn_sorgenti_orfane() -> 0 orfani, perimetro 6/6 di magazzino; il pgTAP
#   dbops/test-sorgenti-orfane-v1 col corpo nuovo iniettato dopo il preambolo:
#   6/6 ok (compreso il 4: il bersaglio cancellato esce come UNA riga).
#
# ⚠️ Lezione per il prossimo cantiere (brief, sezione 5): ogni funzione plpgsql
#   NUOVA passa dal presidio dei riferimenti morti, e un `record` riempito da
#   SQL dinamico e' REALE per quel presidio. La forma giusta e' questa.
databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20260918-27-update-fn-sorgenti-orfane-scalari-tipizzati-mctit.yaml

  - changeSet:
      id: 20260918-27-update-fn-sorgenti-orfane-scalari-tipizzati
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.fn_sorgenti_orfane: il record del ciclo interno (letto da EXECUTE) diventa tre
        scalari con %TYPE su config.sorgenti — plpgsql_check non sa determinare la tupla di un
        record riempito da SQL dinamico e il presidio dei riferimenti morti lo riferiva REALE
        (55000 + XX000 sul RETURN QUERY). Stesso comportamento, stessa firma. Brief:
        brief-db-magazzino-lotto-2-motore, sezione 4.7 (P-8 rev).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'dbops' AND p.proname = 'fn_sorgenti_orfane';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_sorgenti_orfane()
              RETURNS TABLE (
                  tabella                  regclass,
                  riga_id                  bigint,
                  sorgente_tipo_id         config.sorgenti.id%TYPE,
                  sorgente_codice_interno  config.sorgenti.codice_interno%TYPE,
                  sorgente_riga            bigint,
                  sorgente_uid             text,      -- text: nel perimetro convivono uuid e text
                  target_table             config.sorgenti.target_table%TYPE
              )
              LANGUAGE plpgsql
              STABLE
              SECURITY DEFINER
              SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              -- Scopo: le righe la cui sorgente (tipo + chiave) punta a un record del
              --   target_table che non c'e' piu' (D-9). Il guard tipizzato impedisce di
              --   INSERIRLE; questa funzione trova quelle rimaste orfane DOPO, cancellando il
              --   bersaglio — la FK non c'e' e non puo' esserci. Per ogni tabella del
              --   perimetro e per ogni sorgente_tipo_id presente, un anti-join dinamico
              --   verso target_table sulla chiave che key_selector dichiara (id | uid).
              -- DEFINER del PROPRIETARIO (attraversa la RLS: un orfano in una tabella
              --   protetta va visto comunque), STABLE: legge e basta. I nomi di tabella e
              --   colonna vengono dal catalogo (regclass, %I): mai da un input.
              -- ⚠️ rev 18-09: il ciclo interno legge TRE SCALARI TIPIZZATI, non un record.
              --   Un `record` riempito da SQL DINAMICO ha tupla indeterminata per
              --   plpgsql_check: ogni campo letto dopo e' «non ancora assegnato» (55000) e
              --   il presidio dei riferimenti morti lo riferisce REALE. Con i tipi
              --   dichiarati (%TYPE su config.sorgenti) il controllo sa cosa legge.
              --   `v_t` resta un record: viene da un SELECT statico, le colonne si sanno.
              DECLARE
                  v_t             record;
                  v_tipo_id       config.sorgenti.id%TYPE;
                  v_key_selector  config.sorgenti.key_selector%TYPE;
                  v_target_table  config.sorgenti.target_table%TYPE;
              BEGIN
                  FOR v_t IN SELECT * FROM dbops.fn_sorgenti_orfane_perimetro() LOOP
                      -- Per ogni tipo di sorgente presente nella tabella: il bersaglio e la
                      -- chiave dichiarati a catalogo (regclass e key_selector).
                      FOR v_tipo_id, v_key_selector, v_target_table IN
                          EXECUTE format(
                              'SELECT DISTINCT s.id, s.key_selector, s.target_table '
                              '  FROM %1$s x JOIN config.sorgenti s ON s.id = x.%2$I '
                              ' WHERE s.target_table IS NOT NULL',
                              v_t.tabella, v_t.col_tipo)
                      LOOP
                          -- La chiave: uid -> t.uid = x.sorgente_uid; altrimenti t.id = x.sorgente_riga.
                          -- Scelta QUI, non in un CASE SQL: il bersaglio potrebbe non avere uid.
                          -- Confronto su ::text: non tutte le tabelle del perimetro tipizzano
                          -- sorgente_uid come uuid (vendite ne ha di text).
                          RETURN QUERY EXECUTE format(
                              $q$
                              SELECT %1$L::regclass, x.id::bigint, s.id, s.codice_interno,
                                     x.%2$I::bigint, x.%3$I::text, s.target_table
                                FROM %1$s x
                                JOIN config.sorgenti s ON s.id = x.%4$I
                               WHERE x.%4$I = %5$L
                                 AND x.%6$I IS NOT NULL
                                 AND NOT EXISTS (SELECT 1 FROM %7$s t WHERE t.%8$I::text = x.%6$I::text)
                              $q$,
                              v_t.tabella::text, v_t.col_riga, v_t.col_uid, v_t.col_tipo, v_tipo_id,
                              CASE WHEN v_key_selector = 'uid' THEN v_t.col_uid ELSE v_t.col_riga END,
                              v_target_table::text,
                              CASE WHEN v_key_selector = 'uid' THEN 'uid' ELSE 'id' END);
                      END LOOP;
                  END LOOP;
                  RETURN;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_sorgenti_orfane() IS
                  'Le righe la cui SORGENTE (sorgente_tipo_id + sorgente_riga | sorgente_uid) punta a '
                  'un record di config.sorgenti.target_table che non esiste piu'' (D-9, aggancio '
                  '8-quater). Perimetro derivato dal vincolo (fn_sorgenti_orfane_perimetro: FK verso '
                  'config.sorgenti + le due colonne di chiave), anti-join dinamico per tabella e per '
                  'tipo sulla chiave che key_selector dichiara (id | uid). Il guard tipizzato del '
                  'Lotto 1 impedisce di inserire un orfano; qui si trovano quelli creati dopo, '
                  'cancellando il bersaglio — la FK non c''e'' e non puo'' esserci. SECURITY DEFINER '
                  'del PROPRIETARIO, non di un superuser (attraversa la RLS), STABLE. Letta da '
                  'dbops.vw_sorgenti_orfane, che deve restare vuota. ⚠️ rev 18-09 (20260918-27): il '
                  'ciclo interno legge tre scalari con %TYPE su config.sorgenti e non un record — un '
                  'record riempito da SQL dinamico ha tupla indeterminata per plpgsql_check, e il '
                  'presidio dei riferimenti morti (test-riferimenti-morti-v1) lo riferiva REALE '
                  '(55000 sul RETURN QUERY). Chi tocca questa funzione tenga la forma: la regola '
                  'vale per ogni FOR ... IN EXECUTE. Brief: brief-db-magazzino-lotto-2-motore, '
                  'sezione 4.7.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Il rollback e' la forma del 20260918-25: si riapplica quel changeSet.
              SELECT 1;
