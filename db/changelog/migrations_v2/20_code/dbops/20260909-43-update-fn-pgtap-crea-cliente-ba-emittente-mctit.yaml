# FIXTURE — `dbops.fn_pgtap_crea_cliente_ba` impara a LEGARE il billing account
#   a un emittente. Serve alla slice CONTRATTI (20260909-44..46) e a quella
#   OFFERTE (il passo dopo).
#   Brief: brief-db-perimetro-emittente-righe-documento.md §7
#
# ── ⛔ PERCHE' SERVE, ed e' una cosa che si scopre solo al quinto documento ──
#   `vendite.contratti` e `vendite.offerte_commerciali` portano
#   `billing_account_id` **NOT NULL**, mentre ddt, resi e preventivi lo hanno
#   nullable. Su tutte e sette le testate c'e' un guard
#   `trgfn_<documento>_guard_emittente_ba` che pretende
#       emittente_fiscale_id = anagrafiche.fn_get_emittente_fiscale_pk(billing_account_id)
#   Con il BA nullo il guard esce subito — ed e' il motivo per cui le slice
#   precedenti non l'hanno mai incontrato. Con il BA valorizzato morde.
#
#   ⚠️ E il modo in cui morde e' insidioso: `fn_get_emittente_fiscale_pk` non
#   trova nessuna riga in `emittenti_fiscali_billing_account` per quel BA e
#   **ricade sull'emittente di DEFAULT** dell'installazione. Quindi non fallisce
#   con «legame mancante»: risponde un emittente PLAUSIBILE ma di un'altra
#   azienda, e il guard rifiuta il documento. Una fixture che costruisce due
#   mondi separati e non lega il BA sta di fatto chiedendo un contratto per
#   l'azienda sbagliata.
#
# ── ⭐ PERCHE' NEL HELPER E NON NEI DUE TEST ──────────────────────────
#   Il legame BA -> emittente e' UNA regola. Scritta due volte — una nel pgTAP
#   dei contratti e una in quello delle offerte — prima o poi le due divergono.
#   Lo stesso argomento per cui `test-rls-resi-ef-whitelist-write.sql` ha perso
#   la sua `mk_op()` fatta a mano.
#
# ── ⚠️ SI DROPPA E SI RICREA, non si fa `CREATE OR REPLACE` ───────────
#   Un parametro in piu' crea un **overload**: resterebbero due funzioni, e una
#   chiamata a due argomenti diventerebbe ambigua («function is not unique»).
#   Si droppa la versione a due parametri e si crea quella a tre, con i due
#   vecchi che mantengono il loro default: i chiamanti esistenti
#   (`fn_pgtap_crea_cliente_ba('RLS ddt A')`) continuano a risolvere.
#
# ⭐ Il parametro e' OPZIONALE e il comportamento senza di lui e' identico a
#   prima: le fixture di preventivi, ordini, ddt e resi non cambiano di una riga.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20260909-43-update-fn-pgtap-crea-cliente-ba-emittente-mctit.yaml

  - changeSet:
      id: 20260909-43-update-fn-pgtap-crea-cliente-ba-emittente
      author: mctit
      runOnChange: false
      comment: >
        dbops.fn_pgtap_crea_cliente_ba accetta un terzo parametro opzionale
        p_emittente_soggetto_ruolo_id: quando valorizzato lega il billing
        account a quell'emittente in anagrafiche.emittenti_fiscali_billing_account,
        cosi' i guard <documento>_guard_emittente_ba delle testate con BA NOT
        NULL (contratti, offerte_commerciali) trovano l'emittente atteso invece
        di ricadere sul default dell'installazione. DROP + CREATE perche' un
        parametro in piu' sarebbe un overload ambiguo.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION IF EXISTS dbops.fn_pgtap_crea_cliente_ba(text, integer);

              CREATE OR REPLACE FUNCTION dbops.fn_pgtap_crea_cliente_ba(
                  p_etichetta                   text    DEFAULT 'pgTAP',
                  p_utility_id                  integer DEFAULT NULL,
                  p_emittente_soggetto_ruolo_id bigint  DEFAULT NULL
              )
               RETURNS TABLE(billing_account_id bigint, istanza_utility_id bigint,
                             soggetto_ruolo_id bigint, soggetto_id uuid, utility_id integer)
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: dare a una fixture pgTAP un cliente FATTURABILE, cioe'
              --   la catena minima che i documenti pretendono: soggetto ->
              --   ruolo CL -> istanza utility -> billing account.
              -- Uso:
              --   CREATE TEMP TABLE tmp_cli AS
              --   SELECT * FROM dbops.fn_pgtap_crea_cliente_ba('RLS preventivi');
              -- ⭐ Terzo parametro (2026-09-09): l'emittente a cui LEGARE il BA.
              --   Serve alle testate con `billing_account_id` NOT NULL —
              --   contratti e offerte_commerciali — il cui guard
              --   `trgfn_<doc>_guard_emittente_ba` confronta l'emittente del
              --   documento con `anagrafiche.fn_get_emittente_fiscale_pk(ba)`.
              --   Senza legame quella funzione NON fallisce: ricade
              --   sull'emittente di DEFAULT, cioe' risponde un'altra azienda.
              DECLARE
                  v_soggetto_id anagrafiche.soggetti.id%TYPE;
                  v_sr_id       anagrafiche.soggetti_ruoli.id%TYPE;
                  v_ist_id      anagrafiche.billing_account.istanza_utility_id%TYPE;
                  v_ba_id       anagrafiche.billing_account.id%TYPE;
                  v_utility_id  anagrafiche.billing_account.utility_id%TYPE;
                  v_codice      text;
              BEGIN
                  v_utility_id := COALESCE(
                      p_utility_id,
                      (SELECT u.id FROM config.utilities u ORDER BY u.id LIMIT 1));

                  IF v_utility_id IS NULL THEN
                      RAISE EXCEPTION
                          'fn_pgtap_crea_cliente_ba: nessuna utility a catalogo';
                  END IF;

                  -- Codice libero: `codice` e' UNIQUE e non filtra su nessuno
                  -- stato, quindi una sigla fissa farebbe collidere la seconda
                  -- chiamata con la prima — lo stesso motivo per cui esistono
                  -- fn_pgtap_piva_libera e la sigla PGTRnnnn dell'emittente.
                  SELECT 'PGTAPBA' || lpad((COALESCE(max(substring(b.codice from 8)::bigint), 0) + 1)::text, 5, '0')
                    INTO v_codice
                    FROM anagrafiche.billing_account b
                   WHERE b.codice ~ '^PGTAPBA[0-9]{5}$';
                  v_codice := COALESCE(v_codice, 'PGTAPBA00001');

                  v_soggetto_id := dbops.fn_pgtap_crea_soggetto_pg(
                                       'Cliente ' || p_etichetta || ' ' || v_codice);
                  v_sr_id       := dbops.fn_pgtap_crea_soggetto_ruolo(
                                       v_soggetto_id, 'CL'::character varying);

                  -- ⛔ LA FINESTRA DIFFERITA. `trgfn_istanze_utilities_require_utility_dichiarata`
                  --   verifica al COMMIT che l'istanza abbia un satellite
                  --   (BA / dato precontrattuale / cliente). Con i vincoli
                  --   IMMEDIATE — come li mette il preambolo obbligatorio dei
                  --   pgTAP — scatterebbe sul primo INSERT, cioe' prima che il
                  --   billing account possa esistere.
                  SET CONSTRAINTS ALL DEFERRED;

                  -- ⚠️ `fittizia = true`: chk_istanza_fittizia_indirizzo vuole
                  --   O il flag O un indirizzo di dettaglio, e a una fixture
                  --   l'indirizzo non serve.
                  INSERT INTO anagrafiche.istanze_utilities (codice, soggetto_id, fittizia)
                  VALUES (v_codice, v_soggetto_id, TRUE)
                  RETURNING id INTO v_ist_id;

                  -- ⚠️ `validita` NON si nomina: e' GENERATED (PG18).
                  -- ⚠️ `valuta_id` VALORIZZATA, e non e' pignoleria.
                  --   La risoluzione della valuta di un documento e' una
                  --   catena «BA -> emittente -> gestore»: su dbdev regge
                  --   l'ultimo anello, perche' un gestore c'e'. Su un database
                  --   ricostruito dai changelog non c'e' nessuno dei tre, e il
                  --   primo documento muore con «Configurazione mancante:
                  --   valuta non risolta (BA/emittente/gestore)».
                  --   ⭐ Misurato il 2026-09-09: e' la causa di 11 dei 185 file
                  --   di vendite che sullo scratch morivano nel fixture.
                  --   Chiudendo l'anello piu' vicino al documento, la fixture
                  --   non dipende piu' da com'e' configurata la macchina.
                  INSERT INTO anagrafiche.billing_account
                      (istanza_utility_id, soggetto_ruolo_id, utility_id,
                       codice, categoria_cliente_id, valuta_id)
                  VALUES (v_ist_id, v_sr_id, v_utility_id, v_codice,
                          (SELECT cc.id FROM anagrafiche.categorie_clienti cc
                            ORDER BY cc.id LIMIT 1),
                          (SELECT v.id FROM config.valute v ORDER BY v.id LIMIT 1))
                  RETURNING id INTO v_ba_id;

                  -- ⭐ IL LEGAME BA -> EMITTENTE, se il chiamante lo chiede.
                  --   `is_default = false`: e' un legame PER QUESTO BA, non
                  --   l'emittente di default dell'installazione — quello e' una
                  --   riga con `billing_account_id IS NULL` e non va toccata da
                  --   una fixture.
                  IF p_emittente_soggetto_ruolo_id IS NOT NULL THEN
                      INSERT INTO anagrafiche.emittenti_fiscali_billing_account
                          (emittente_soggetto_ruolo_id, billing_account_id, is_default)
                      VALUES (p_emittente_soggetto_ruolo_id, v_ba_id, false);
                  END IF;

                  -- Saga completa: i guard differiti scattano QUI, su un mondo
                  -- finito. ⚠️ Senza la richiusura il ROLLBACK del test se li
                  -- porterebbe via NON verificati.
                  SET CONSTRAINTS ALL IMMEDIATE;

                  RETURN QUERY
                  SELECT v_ba_id, v_ist_id, v_sr_id, v_soggetto_id, v_utility_id;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_pgtap_crea_cliente_ba(text, integer, bigint)
              IS 'Fixture pgTAP: crea la catena minima di un cliente fatturabile (soggetto -> ruolo CL -> istanza utility -> billing account). Il terzo parametro, opzionale, e'' il soggetto_ruolo dell''EMITTENTE a cui legare il billing account in anagrafiche.emittenti_fiscali_billing_account: serve alle testate con billing_account_id NOT NULL (contratti, offerte_commerciali), il cui guard confronta l''emittente del documento con anagrafiche.fn_get_emittente_fiscale_pk(ba). ⚠️ Senza legame quella funzione non fallisce: ricade sull''emittente di DEFAULT, cioe'' risponde un''altra azienda. Brief: brief-db-perimetro-emittente-righe-documento.md';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS dbops.fn_pgtap_crea_cliente_ba(text, integer, bigint);
