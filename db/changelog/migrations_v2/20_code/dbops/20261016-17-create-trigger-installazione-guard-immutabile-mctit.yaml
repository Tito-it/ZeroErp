# I DUE TRIGGER DELL'AMBIENTE IMMUTABILE
#   Montano dbops.trgfn_installazione_guard_immutabile (20261016-16) su
#   dbops.installazione: uno di riga (UPDATE, DELETE), uno di istruzione
#   (TRUNCATE, che i trigger di riga non vedono).
#   Brief: brief-db-processi-accensione-per-ambiente
#
#   Fase a05: e' un rifiuto «questa cosa non si tocca», e deve parlare prima
#   di qualunque altro guard (linee-guida-trigger, fasi).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261016-17-create-trigger-installazione-guard-immutabile-mctit.yaml

  - changeSet:
      id: 20261016-17-create-trigger-installazione-guard-immutabile
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Monta su dbops.installazione il guard dell'ambiente immutabile: di riga su UPDATE e DELETE,
        di istruzione su TRUNCATE. Brief: brief-db-processi-accensione-per-ambiente.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists: { schemaName: dbops, tableName: installazione }
            - sqlCheck:
                expectedResult: 1
                sql: >
                  SELECT count(*) FROM pg_proc p
                    JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'dbops'
                     AND p.proname = 'trgfn_installazione_guard_immutabile'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TRIGGER trg_installazione_a05_guard_immutabile_upd_dlt
                  BEFORE UPDATE OR DELETE ON dbops.installazione
                  FOR EACH ROW
                  EXECUTE FUNCTION dbops.trgfn_installazione_guard_immutabile();

              CREATE TRIGGER trg_installazione_a05_guard_immutabile_trn
                  BEFORE TRUNCATE ON dbops.installazione
                  FOR EACH STATEMENT
                  EXECUTE FUNCTION dbops.trgfn_installazione_guard_immutabile();

              COMMENT ON TRIGGER trg_installazione_a05_guard_immutabile_upd_dlt ON dbops.installazione IS
                  'L''ambiente non cambia e non si cancella (E_AMBIENTE_IMMUTABILE). Gemello di istruzione: trg_installazione_a05_guard_immutabile_trn. Brief: brief-db-processi-accensione-per-ambiente.';
              COMMENT ON TRIGGER trg_installazione_a05_guard_immutabile_trn ON dbops.installazione IS
                  'Il TRUNCATE non attraversa i trigger di riga: lo rifiuta questo (E_AMBIENTE_IMMUTABILE). Brief: brief-db-processi-accensione-per-ambiente.';
      rollback:
        - sql:
            dbms: postgresql
            sql: |
              DROP TRIGGER IF EXISTS trg_installazione_a05_guard_immutabile_trn ON dbops.installazione;
              DROP TRIGGER IF EXISTS trg_installazione_a05_guard_immutabile_upd_dlt ON dbops.installazione;
