# I COMMENT DI TABELLE, COLONNE, VISTE, VINCOLI E INDICI DI dbops, AL PRESENTE
#   Brief: brief-db-revisione-dbops, giro 14 (§34).
#
# ── PERCHE' ─────────────────────────────────────────────────────────
#   linee-guida-sql §5d: il COMMENT descrive l'oggetto al presente. Questi
#   portavano nomi di brief, marcatori di revisione, id di changeSet, sigle di
#   decisione, date di cronaca e misure; alcuni dicevano cose false (le M di
#   §3.1 del brief, riverificate in §34.3 sulla struttura di oggi). Dopo questo
#   giro il presidio dbops/test-comment-al-presente-v1 tiene il perimetro.
#
# ── CHE COSA CAMBIA ─────────────────────────────────────────────────
#   * Riscritti al presente i COMMENT con una marca; corrette le frasi false
#     (M1 automation_scope, M2 i sei modi di storico_scope_policy, M8, M17,
#     M28, M32, M34, piu' quelle trovate rileggendo: accensione dei processi,
#     tolleranza, canale, il presidio dei bypass).
#   * Nuovi: dbops.audit_log e le due colonne di dbops.automation_scope.
#   Solo COMMENT ON (108 istruzioni), nessun corpo. Testi di partenza
#   letti su dbdev; il rollback rimette quelli di oggi (IS NULL dove mancava).
#   Nessuna preCondition: un COMMENT su un oggetto che non c'e' fallisce da
#   se', e nessuno degli oggetti nasce dopo 20_code.
#   ⛔ Corretto il 2026-11-11: il COMMENT su chk_presidi_chi_agisce_se_allarma
#   e' uscito da qui. Il vincolo nasce in 90_end (20261006-07): su un database
#   ricostruito da zero questo file gira prima e il COMMENT falliva («constraint
#   ... does not exist»). Il COMMENT al presente sta in 90_end/20261111-66.
#   validCheckSums ANY perche' dove il changeSet e' gia' girato il checksum e'
#   quello del testo di prima.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261111-18-update-comment-dbops-tabelle-e-viste-al-presente-mctit.yaml

  - changeSet:
      id: 20261111-18-update-comment-dbops-tabelle-e-viste-al-presente
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        COMMENT al presente (linee-guida-sql §5d) di tabelle, colonne, viste, vincoli e indici di dbops. Brief: brief-db-revisione-dbops, giro 14.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON TABLE dbops.audit_log IS
                'Il registro tecnico delle automazioni e degli strumenti DBA: una riga per esito di un lavoro (funzione, stato, durata, righe toccate, parametri e risultato, l''errore se c''e''). Lo stato e'' OK, ERROR, DRYRUN o WARN (chk_audit_status). La porta di scrittura e'' dbops.fn_audit_log_once; la riga nasce nella transazione del chiamante e si annulla con lei: un esito che deve sopravvivere a un errore sta in dbops.error_log. Ci scrivono solo funzioni di dbops e maintenance: lo presidia dbops.vw_audit_log_scrittori_fuori_perimetro, perche'' il registro non deve contenere dati di dominio. La scadenza delle righe (cleanup_at) la governa la regola CLEANUP_AT di dbops.automation_rules_tbl.';

              COMMENT ON TABLE dbops.automation_delete_block IS
                'Il registro del blocco delle DELETE: una riga per tabella (uq_automation_delete_block_table) su cui una DELETE passa solo se la GUC guc_key e'' accesa nella sessione. dbops.fn_run_automations_delete_block porta i trigger (script.trgfn_delete_block_by_guc, BEFORE DELETE FOR EACH ROW) allo stato del registro: crea quello atteso, rigenera quello diverso, toglie quello di una riga spenta (enabled = false); il nome e'' trigger_name o il template di dbops.fn_nome_oggetto_dichiarato. Un trigger della funzione su una tabella che il registro non nomina ferma il giro (E_DELETE_BLOCK). Il confronto fra registro e trigger vivi e'' dbops.fn_delete_block_divergenze.';

              COMMENT ON TABLE dbops.automation_scope IS
                'L''ambito delle automazioni: quali schemi e quali tabelle i runner (ATTIVO, LOCK_COLUMNS, DATE_VALIDITA, audit, storicizzazione, CLEANUP_AT, DELETE_BLOCK, overlap, CODICE_MAIUSCOLO) e la politica degli indici delle FK governano. Una riga = uno schema e un filtro di tabella (table_like: *all o un pattern LIKE). Gli schemi li risolve dbops.fn_resolve_scope, il filtro per tabella dbops.fn_table_in_scope, la politica degli indici dbops.fn_indici_schema_nell_ambito (per schema). Un registro vuoto vuol dire tutti gli schemi utente tranne storico; uno schema senza righe e'' fuori. Nessun runner legge la tabella da se''.';

              COMMENT ON TABLE dbops.automazione_attivo_eccezioni IS
                'Le FK che l''automazione ATTIVO non lega: per una riga qui, dbops.fn_run_automations_attivo non genera ne'' il block sul padre ne'' il require sul figlio, e dbops.fn_ritira_attivo_eccezioni toglie quelli gia'' generati. Una FK per riga (schema e tabella del FIGLIO, colonna FK; uq_automazione_attivo_eccezioni_fk), col motivo obbligatorio e non vuoto (chk_automazione_attivo_eccezioni_motivo): un''eccezione senza perche'' e'' un buco nel framework. Seed da 80_data (CSV dbops/automazione_attivo_eccezioni.csv).';

              COMMENT ON TABLE dbops.automazione_chiusura_scadenze IS
                'Il registro del framework di chiusura per scadenza: una riga per tabella con un ciclo di stato e un valido_al, che dice come si chiude una riga scaduta (lo stato chiuso, quelli che si chiudono, il verbo di chiusura se la testata e'' sotto la porta degli stati). La legge dbops.fn_apply_chiusura_scadenze, chiamata dall''handler della coda dei lavori una volta per azienda, con l''identita'' e la RLS di quell''azienda: per questo i bersagli sono solo processi di DOMINIO.';

              COMMENT ON TABLE dbops.automazione_codice_eccezioni IS
                'Le colonne codice che l''automazione CODICE_MAIUSCOLO non normalizza. La regola e'' per esclusione: ogni colonna codice di una tabella dell''ambito si salva in upper(btrim(...)) (script.trgfn_codice_maiuscolo), e una tabella nuova nasce presidiata. Qui stanno le colonne codice che non sono un codice dell''operatore: una chiave tecnica letta dal codice per nome, o un codice esterno dove il maiuscolo conta. Il motivo e'' obbligatorio. Una riga toglie il trigger al giro successivo (dbops.fn_run_automations_codice_maiuscolo, azione TOGLIE). codice_interno non e'' nel perimetro: lo scrive la migrazione. Seed da 80_data (CSV dbops/automazione_codice_eccezioni.csv).';

              COMMENT ON TABLE dbops.automazione_overlap IS
                'Il registro dei vincoli anti-sovrapposizione temporale: una riga per tabella (target_schema, target_table) da cui dbops.fn_apply_automazione_overlap genera un EXCLUDE GiST. La chiave di gruppo e'' key_columns (array JSON di nomi di colonna) piu'' key_expressions (array JSON di espressioni), nell''ordine dell''array (chk_automazione_overlap_chiavi); il periodo e'' range_col, o in sua assenza valido_dal_col/valido_al_col con range_bounds; where_predicate rende il vincolo parziale. Il nome e'' constraint_name o il template ex_<tabella>_no_overlap. Si applicano le righe active con exec_mode AUTO o uguale a quello della corsa. key_expressions e where_predicate sono DDL di fiducia: le scrive solo chi migra. Seed da 80_data (CSV dbops/automazione_overlap.csv).';

              COMMENT ON TABLE dbops.cause_fallimento IS
                'Il vocabolario delle cause per cui un lavoro automatico fallisce: AMBIENTE (server, connessione, risorse, ruoli del database), PROGRAMMA (serve una modifica al codice o al database), CONFIGURAZIONE (si sistema dalle impostazioni dell''applicazione). Lo dichiarano dbops.processi.causa_fallimento (la natura dei fallimenti del processo quando l''ambiente e'' sano) e config.codici_errore.causa_fallimento (la natura di un errore preciso, quando lo sa), con FK verso questa tabella. maintenance.vw_job_run_da_guardare ne ricava la causa di ogni riga, e dbops.presidi_cause dice a chi tocca: le cause di quel presidio coincidono con questo vocabolario (pgTAP maintenance/test-vw-job-run-da-guardare-causa-v1). Seed: 80_data/sql/dbops/cause_fallimento.csv.';

              COMMENT ON TABLE dbops.coda_lavori_tipi IS
                'Il catalogo dei tipi di lavoro della coda dei lavori (dbops.coda_lavori). codice e'' il job_type; handler_code la chiave di dispatch verso il registro degli handler del backend (nessun import dinamico); processo_codice il processo di dbops.processi a cui il tipo appartiene; run_as_default e max_tentativi_default i valori che un lavoro prende se chi accoda non li passa. Un tipo spento (attivo = false) non si accoda.';

              COMMENT ON TABLE dbops.codici_errore_senza_policy IS
                'Registro del debito del terzo lato: i codici errore che una funzione viva puo'' nominare e che non hanno una voce nella mappa generata delle politiche d''errore del backend (backend/apps/core/services/error_policies_generated.py). Effetto del difetto: l''operatore legge comunque la frase giusta (viene dal catalogo), ma il tipo di risposta HTTP resta appiattito su 400 anche quando la verita'' e'' 404 o 403. Si chiude a lotti per dominio, partendo dai da_trigger. Esiste per tenere acceso il cancello mentre il debito si salda: e'' un debito, deve calare, e il cancello pretende che una voce che ha ottenuto la sua politica venga tolta. La misura e'' dbops.vw_codici_errore_da_dichiarare.';

              COMMENT ON TABLE dbops.installazione IS
                'L''ambiente di questa installazione: SVILUPPO o PRODUZIONE. Una riga sola (id = 1), vuota alla nascita: la scrive la fase post di scripts/sql/provision_zeroerp.sql col parametro -v ambiente=..., una volta, e poi non cambia piu'' (guard dbops.trgfn_installazione_guard_immutabile, E_AMBIENTE_IMMUTABILE). Nessun default: un changeSet troverebbe database gia'' esistenti e li dichiarerebbe al posto di chi li conosce. Fuori da config.parameters: il mirror CSV la riscriverebbe e l''app la potrebbe cambiare. L''app la legge e non la scrive. Si legge con script.fn_ambiente_installazione() (che fallisce se manca) o script.fn_ambiente_dichiarato() (che torna NULL, per i panorami).';

              COMMENT ON TABLE dbops.lock_columns_conditional IS
                'Il registro dei lock condizionali: una colonna di una tabella che non si modifica quando condition_expr, valutata sulla riga, e'' vera. condition_expr riceve l''id della riga come $1 (il cast al tipo della chiave lo scrive l''espressione, per esempio $1::uuid). Complementare a dbops.automation_lock_columns, i lock senza condizione. Lo legge dbops.fn_non_editable_fields, che da'' al form i campi non modificabili di una riga; il rifiuto della modifica lo fa il guard della tabella, con lo stesso predicato. Si scrive solo da migrazione.';

              COMMENT ON TABLE dbops.messaggi_errore_codici_legacy IS
                'Registro del debito ereditato sulla convenzione dei codici errore (E_{MODULO}_{TIPO}, W_ per i warning: docs/it/dev/api.md). Ci va un codice che arriva da fuori gia'' fuori convenzione e che non conviene rinominare; il CHECK chk_messaggi_errore_codici_legacy_non_conforme impedisce di registrarci un codice conforme. Un registro vuoto e'' un registro in pari, non inutile: il controllo (B) di scripts/sql/guardrail_codice_errore_strutturato.sql lo legge, ed e'' pronto per la prossima eredita'' di codici. Non e'' un elenco di eccezioni: una famiglia nuova con una semantica sua si risolve allargando la convenzione, non registrandola qui; per questo non c''e'' una colonna motivo, e l''orologio del debito e'' data_registrazione. Da non confondere con dbops.codici_errore_senza_policy, il registro del terzo lato.';

              COMMENT ON TABLE dbops.presidi IS
                'Catalogo delle viste di presidio: per ogni vista, che cosa significa una sua riga. E'' il terzo pezzo accanto alla misura (la vista) e al registro del debito (le voci note): dice chi la legge. Non e'' un elenco nel backend perche'' sarebbe una seconda sorgente di verita'', e divergerebbe alla prima vista nuova: il presidio nascerebbe fuori dal digest, in silenzio. Nessuna colonna soglia: il debito si tiene con un registro di voci per nome, perche'' un intero e'' cieco sullo scambio (un debito saldato piu'' un difetto nuovo lasciano il numero fermo). E nessun destinatario: a chi arriva la posta di questa macchina e'' un fatto di deploy, non di catalogo.';

              COMMENT ON TABLE dbops.presidi_cause IS
                'Le cause di un presidio le cui righe sono guasti diversi (dbops.presidi.colonna_variante valorizzata), ognuna con chi la spegne. La causa ha il suo a-chi-tocca (chi_agisce, stesso dominio di dbops.presidi.chi_agisce) e i suoi testi per lingua (dbops.presidi_testi, FK (vista, variante) -> (vista, causa)): un solo chi_agisce per presidio sarebbe sbagliato per alcune righe, come lo sarebbe un testo unico (il presidio dei processi e'' del SISTEMISTA, ma NON_PROGRAMMATO e GIRA_E_NON_REGISTRA toccano allo SVILUPPO). dbops.presidi.chi_agisce resta il valore del presidio nel suo insieme. Completezza nei pgTAP: le cause stanno solo sui presidi che dichiarano colonna_variante, ognuna ha il testo it (dbops/test-presidi-testi-v1); il catalogo coincide con le cause che la vista puo'' produrre (il test del presidio). Seed: 80_data/sql/dbops/presidi_cause.csv, caricato dal mirror dei testi prima dei testi.';

              COMMENT ON TABLE dbops.presidi_testi IS
                'Il testo di un presidio per chi deve agire, per lingua: significato (cosa vuol dire una riga) e azione (cosa fare per spegnerlo). Non sostituisce il COMMENT della vista ne'' la nota di dbops.presidi: quelli sono scritti per chi mantiene il presidio. Chi lo spegne e'' un dato del presidio, non del testo: dbops.presidi.chi_agisce. Lo leggono il pannello dei processi automatici e il digest (che va per email, senza i locali del frontend: per questo il testo sta a DB, come config.messaggi_errore). variante NULL e'' il testo del presidio; valorizzata e'' il testo delle righe la cui colonna dbops.presidi.colonna_variante vale quel valore. Chiave (vista, lingua, variante) NULLS NOT DISTINCT. Il testo generico non fa da ripiego per una variante senza testo; una lingua che manca ripiega sull''italiano della stessa variante. La completezza (ogni presidio attivo, non obsoleto e non INVENTARIO ha la riga it generica; ogni variante ha la sua riga it) la garantisce il pgTAP dbops/test-presidi-testi-v1, perche'' un CHECK non guarda un''altra tabella; che ogni causa che la vista puo'' produrre abbia il suo testo lo garantisce il pgTAP del presidio. Seed: 80_data/sql/dbops/presidi_testi.csv.';

              COMMENT ON TABLE dbops.processi IS
                'Registro di catalogo dei processi automatici: quali esistono, di che classe (MANUTENZIONE, AMMINISTRAZIONE, DOMINIO) e su quale canale. Il codice e'' l''attore di una corsa (maintenance.job_run_log.processo_codice, FK). La classe e'' una dichiarazione di chi progetta il processo, verificata dal DB in una direzione sola (DOMINIO senza percorso verso un emittente -> dbops.vw_processi_dominio_senza_emittente). Qui stanno anche l''accensione di default per ambiente, il contratto di liveness e la convergenza in CI. Il legame processo -> utente tecnico e'' dato di macchina e sta in dbops.processi_identita; la scelta a mano dell''accensione in dbops.processi_accensione.';

              COMMENT ON TABLE dbops.processi_accensione IS
                'La scelta a mano di questa installazione sulla sveglia di un processo: acceso, spento o tornato al default, col motivo. Scavalca il default per ambiente di dbops.processi (acceso_in_sviluppo, acceso_in_produzione). La riga dice l''ultimo gesto (chi, quando, perche''): acceso NULL = segue il default; assenza della riga = nessuno l''ha mai toccata. La storia dei gesti e'' in storico.processi_accensione; chi e'' l''utente lo scrive l''audit generato (app.jwt_user). Dato di macchina (come dbops.processi_identita): nessun seed, la scrive l''operatore col verbo dbops.fn_imposta_accensione_processo. Un non spegnibile non si spegne e un processo senza sveglia (CODA, ritirato) non ha righe: dbops.trgfn_processi_accensione_guard. Lo stato effettivo lo dice dbops.fn_processo_acceso_dichiarato (e maintenance.fn_sveglia_accesa per le sveglie).';

              COMMENT ON TABLE dbops.processi_identita IS
                'Legame processo -> utente tecnico (django.auth_user.id). Un processo ha un utente per emittente, non uno in tutto: config.user_emittenti_fiscali e'' uno-a-uno sull''utente (uq_user_emittenti_fiscali_auth_user), e solo il super admin e'' multi-emittente. Il vincolo qui e'' quindi UNIQUE(auth_user_id) (uq_processi_identita_auth_user): un utente tecnico serve un processo solo, un processo puo'' averne piu'' d''uno. L''emittente non si ripete in questa tabella: sta in config.user_emittenti_fiscali, e duplicarlo sarebbe una seconda sorgente di verita''. Meta'' di macchina del registro: il suo seed va marcato context: dati_macchina.';

              COMMENT ON TABLE dbops.rls_perimetro_debito IS
                'Registro del debito del perimetro RLS: le tabelle che il criterio di dbops.vw_rls_perimetro_scoperto trova scoperte e che restano tali per una decisione. Una riga zittisce il presidio su quella tabella e su quel criterio soltanto. Dichiarare un debito non lo assolve: dice perche'' e'' qui, non che va bene che ci sia. E'' un registro e deve calare: il presidio pretende che una riga rientrata venga tolta (stato DEBITO_ESTINTO).';

              COMMENT ON TABLE dbops.soggetti_di_prova IS
                'L''etichetta di un soggetto di prova: una riga per ogni soggetto creato dal verbo dei dati di sviluppo (anagrafiche.fn_provisiona_dati_di_sviluppo), nella stessa transazione: gli emittenti, i clienti, il fornitore, le persone dietro le credenziali. Si etichettano le radici, non le righe: contratti, BA e documenti si ritrovano dalla radice a cui sono legati. Non cambia e non si toglie; in un''installazione PRODUZIONE non nasce (guard dbops.trgfn_etichette_di_prova_guard). L''app la legge e non la scrive. Il presidio dbops.vw_radici_di_prova_in_produzione la guarda.';

              COMMENT ON TABLE dbops.stati_check_dichiarazioni IS
                'Registro del presidio degli stati mai scritti (dbops.vw_stati_check_da_sanare): i valori ammessi dal CHECK di una colonna di stato che il criterio di dbops.vw_stati_check_scrittori non trova scritti da nessuna funzione ne'' dal default, e che restano cosi'' per una dichiarazione. Il canale dice chi verifica la riga: APPLICAZIONE = lo scrive un repository del backend, lo verifica il test del backend; ESENTE = esente dal criterio per la ragione scritta, lo verifica il pgTAP nel verso DEBITO_ESTINTO. ESENTE non vuol dire non scritto: vuol dire che il criterio testuale non lo vede (per esempio una copia colonna -> colonna). E'' un registro e deve calare: una riga rientrata va tolta.';

              COMMENT ON TABLE dbops.storico_scope_policy IS
                'La mappa di dove sta l''emittente di una tabella, una riga per madre storicizzata (chiave schema + tabella). La legge dbops.fn_storico_risolvi_scope quando il trigger di storico scrive una versione: il valore risolto si congela nella shadow (scope_emittente_fiscale_id) e non si ricalcola piu'': un archivio che cambia col presente non e'' un archivio. Sei modi (chk_storico_scope_policy_modo, forma in chk_storico_scope_policy_forma): EF (colonna emittente_fiscale_id in riga), SR (colonna emittente_soggetto_ruolo_id, convertita in EF uno a uno), PADRE (si risale via FK e si continua sulla riga del padre, ricorsivamente), BA (un billing account ha esattamente un emittente), COPPIA (la colonna dichiara due nomi, istanza e utility, la chiave di anagrafiche.billing_account: l''emittente e'' quello del BA della coppia), NESSUNO (la madre non e'' protetta: la shadow non si arma, e la ragione, obbligatoria, dice perche''). E'' anche il registro del debito: una madre col trigger di storico senza riga, o in RLS con modo NESSUNO, e'' un rosso di db/pgtap/dbops/test-storico-scope-policy-v1.sql.';

              COMMENT ON COLUMN dbops.automation_scope.schema_name IS
                'Lo schema nell''ambito delle automazioni. Uno schema con almeno una riga e'' nell''ambito; per la politica degli indici delle FK basta questo (dbops.fn_indici_schema_nell_ambito).';

              COMMENT ON COLUMN dbops.automation_scope.table_like IS
                'Il filtro delle tabelle dello schema: *all (default) = tutte, altrimenti un pattern LIKE sul nome della tabella. Con piu'' righe per lo schema basta che una corrisponda (dbops.fn_table_in_scope).';

              COMMENT ON COLUMN dbops.audit_log.executed_by IS
                'Ruolo di database che ha eseguito l''operazione (default current_user). E'' il ruolo, non l''operatore: zeroerp_app per cio'' che passa dal backend, il migratore per le automazioni, il ruolo del canale dblink per le righe scritte fuori transazione. L''operatore viaggia nelle GUC app.* e nel tx_id. Le righe che portano la parola letterale CURRENT_USER vengono da un default che scriveva la stringa: non si ricostruiscono e restano in chiaro.';

              COMMENT ON COLUMN dbops.audit_sources.storico_table IS
                'Nome qualificato schema.tabella della shadow di storico della sorgente (es. storico.user_override_aree). Lo legge script.fn_audit_summary per il dispatch dinamico (format %I.%I), e lo espone la vista script.vw_audit_sources.';

              COMMENT ON COLUMN dbops.automazione_chiusura_scadenze.verbo_chiusura IS
                'Il verbo che chiude le righe scadute della testata, quando la testata e'' sotto la porta degli stati (script.trgfn_doc_stato_solo_dal_verbo): schema.funzione, senza argomenti, ritorna quante righe ha chiuso. NULL = nessuna porta, il job fa l''UPDATE dinamico. Una testata sotto la porta senza verbo e'' una configurazione non valida (E_AUTOMAZIONE_CHIUSURA_CONFIG_INVALIDA). Testo e non regprocedure: che punti a una funzione viva lo controlla il job.';

              COMMENT ON COLUMN dbops.automazione_overlap.where_predicate IS
                'Predicato per un EXCLUDE parziale (es. attivo IS TRUE). NULL = vincolo totale. Frammento DDL di fiducia, iniettato com''e'' nel vincolo: lo scrive solo chi migra, mai un input applicativo.';

              COMMENT ON COLUMN dbops.coda_lavori.archiviato IS
                'La riga e'' stata messa via dall''elenco, non spenta. Serve a ripulire la lista delle code senza spostare i numeri che l''operatore sta leggendo: i conteggi del pannello degli esiti della fatturazione sono un GROUP BY sullo stato senza filtro di visibilita'', quindi una cancellazione li farebbe calare e un annullamento sposterebbe la ripartizione. Un solo lettore: la lista. Se la leggessero anche claim, drainer o reaper, archiviare diventerebbe un annullamento silenzioso. Non si chiama disabilitato (il nome della stessa idea su fatture_log e fatturazione_lotti_log): la'' le righe sono segnali passivi, qui sono lavoro, e disabilitato su una riga di coda si leggerebbe non eseguirlo. Solo una riga non viva si archivia (chk_coda_lavori_archiviato_non_vivo e trg_coda_lavori_a10_archiviazione_upd): archiviarne una viva la lascerebbe nel conteggio del badge e fuori dall''elenco. Una riga che torna viva (requeue) riabbassa la bandiera da sola.';

              COMMENT ON COLUMN dbops.coda_lavori.archiviato_da IS
                'Chi ha messo via la riga: la GUC app.jwt_user (l''utente reale del token), con ripiego su CURRENT_USER fuori dal web, la stessa espressione di script.trgfn_audit_data_user_generic. Derivata come archiviato_il, dallo stesso trigger. Non la sostituisce user_update, per la stessa ragione per cui data_update non sostituisce archiviato_il: dicono l''ultima scrittura, qualunque essa sia. L''archiviazione vale per tutti, non per operatore: questa colonna dice chi, non a chi.';

              COMMENT ON COLUMN dbops.coda_lavori.archiviato_il IS
                'Quando la riga e'' stata messa via. Derivata: la scrive dbops.trgfn_coda_archiviazione, non chi archivia; una colonna scritta a mano potrebbe dire una cosa che archiviato smentisce. data_update non la sostituisce: risponde a quando e'' stata toccata, questa a quando e'' stata messa via, e sono due domande. Torna NULL quando la bandiera si abbassa.';

              COMMENT ON COLUMN dbops.coda_lavori.run_as IS
                'Con o senza emittente. OPERATORE = il lavoro gira dentro il perimetro di un emittente, e lo scope catturato all''enqueue porta l''identita'' completa di chi l''ha chiesto (RLS attiva, nessun bypass). SISTEMA = nessun emittente: il lavoro tocca solo cio'' che non appartiene a un perimetro (manutenzione del database, amministrazione). L''attore non e'' questa colonna: e'' il codice del processo su maintenance.job_run_log, e ce l''hanno entrambi i valori.';

              COMMENT ON COLUMN dbops.coda_lavori_tipi.processo_codice IS
                'Il processo di dbops.processi a cui questo tipo di lavoro appartiene (fk_coda_lavori_tipi_processi). La classe non si ripete qui: si legge da dbops.processi, cosi'' non ci sono due scritture dello stesso fatto che possano dissentire. La usa dbops.fn_accoda_lavoro per rifiutare un lavoro di classe DOMINIO accodato con run_as diverso da OPERATORE: il default per tipo e'' un suggerimento sovrascrivibile, questo e'' il vincolo.';

              COMMENT ON COLUMN dbops.coda_lavori_tipi.run_as_default IS
                'Il run_as di un lavoro di questo tipo se chi accoda non lo passa. OPERATORE: il lavoro gira con l''identita'' catturata nello scope e appartiene a un''azienda. SISTEMA: niente scope ne'' azienda; sotto la row level security della coda lo vedono il super admin e l''utente tecnico del drenatore. Sotto un processo CODA di DOMINIO il tipo e'' OPERATORE; sotto un CODA di MANUTENZIONE puo'' essere SISTEMA, con chi preme come attore nel payload; sotto un PGAGENT e'' SISTEMA (pgTAP test-coda-tipi-canale-e-run-as). Il vincolo vero e'' il guard di classe di dbops.fn_accoda_lavoro: un lavoro DOMINIO e'' sempre OPERATORE.';

              COMMENT ON COLUMN dbops.codici_errore_senza_policy.da_trigger IS
                'La funzione che nomina il codice e'' agganciata a un trigger, quindi il codice sta sul percorso di una richiesta vera e arriva davvero a un utente. Serve a dare un ordine alle decisioni (questi vengono prima), non a escludere gli altri.';

              COMMENT ON COLUMN dbops.idempotency_keys.endpoint IS
                'Metodo e percorso della richiesta che ha prenotato la key, senza query string. Obbligatorio: ogni key e'' legata alla richiesta che l''ha prenotata, e si rimanda solo su quella.';

              COMMENT ON COLUMN dbops.idempotency_keys.prenotata_at IS
                'Ora della prenotazione della key, o della sua ultima ripresa (dbops.fn_idempotency_prenota). Una key in_progress piu'' vecchia di SYSTEM_IDEMPOTENZA_IN_CORSO_SECONDI conta come abbandonata e si riprende. Non data_update: quella la riscrive il trigger di audit a ogni UPDATE.';

              COMMENT ON COLUMN dbops.installazione.ambiente IS
                'SVILUPPO o PRODUZIONE. Si sceglie all''installazione, come parametro della fase post del provisioning, e non cambia piu'': un database di sviluppo contiene dati nati fuori da ogni regola (smoke, prove) e non si certifica pulito; una copia della produzione resta produzione.';

              COMMENT ON COLUMN dbops.messaggi_errore_codici_legacy.codice IS
                'Codice cosi'' come sta in config.messaggi_errore. Esce da questo registro quando viene rinominato secondo convenzione oppure eliminato: in entrambi i casi la riga va tolta con un changeSet 80_data, e il controllo (C) del guardrail lo pretende. Sono conformi sia E_ (errori, si sollevano) sia W_ (warning, si scrivono solo nel log); un W_ sollevato darebbe HTTP 500 lato backend, e il controllo (E) del guardrail lo vieta.';

              COMMENT ON COLUMN dbops.presidi.chi_agisce IS
                'Chi puo'' spegnere il presidio. AMMINISTRATORE: si spegne dall''applicazione, quindi chi legge il pannello. SISTEMISTA: server, servizi, schedulatori, ruoli del database. SVILUPPO: serve una modifica al codice o al database. E'' un dato e non una frase dentro dbops.presidi_testi.azione perche'' il pannello deve poter distinguere tocca a te da inoltra e il digest deve poter raggruppare. Obbligatoria su ogni natura tranne INVENTARIO, che non si accende (chk_presidi_chi_agisce_se_allarma, in 90_end perche'' il valore lo scrive il mirror del CSV).';

              COMMENT ON COLUMN dbops.presidi.colonna_variante IS
                'La colonna della vista da cui si legge, per ogni riga, la variante del testo per chi agisce (dbops.presidi_testi.variante). NULL = il presidio ha un testo solo. Serve quando le righe della vista sono guasti diversi con rimedi diversi: un testo unico sarebbe sbagliato per alcune di loro (per esempio direbbe di eseguire ora un servizio sempre acceso). Il testo generico non fa da ripiego per una variante senza testo: darebbe il rimedio sbagliato, in silenzio. Che la colonna esista nella vista, e che ogni valore che la vista puo'' produrre abbia il suo testo italiano, lo presidiano i pgTAP (dbops/test-presidi-testi-v1 e il test del presidio).';

              COMMENT ON COLUMN dbops.presidi.nota IS
                'Il motivo: perche'' quella natura, e su un debito che cosa lo chiuderebbe. NOT NULL e non vuota per vincolo del database e non per test, come vuole la guida dei presidi: e'' l''unica regola che non si puo'' dimenticare di applicare.';

              COMMENT ON COLUMN dbops.presidi.presidiato_da IS
                'Dove il presidio gia'' vive, per la natura CANCELLO: il file del test o del guardrail. Obbligatorio su quella natura: dire che e'' gia'' presidiata senza dire dove e'' l''etichetta rassicurante che la guida dei presidi dichiara piu'' pericolosa di un errore.';

              COMMENT ON COLUMN dbops.presidi.stato_atteso IS
                'L''unico valore di colonna_stato che non chiede un intervento: l''allarme e'' diverso da questo. Si dichiara lo stato atteso e non quelli di allarme, e il verso e'' la scelta portante: elencare gli allarmi sarebbe permissivo, perche'' uno stato nuovo aggiunto alla vista non sarebbe nell''elenco e cadrebbe nel silenzio. Cosi'' invece uno stato nuovo cade nell''allarme, e chi lo aggiunge deve venire qui a decidere: e'' la stessa scelta del COMMENT di dbops.vw_processi_programmazione per la colonna da_guardare. Prende anche il caso a piu'' valori: su dbops.vw_rls_perimetro_scoperto, diverso da DEBITO_DICHIARATO prende sia NON_DICHIARATO (un allarme) sia DEBITO_ESTINTO (una riga di registro da togliere) senza nominarli.';

              COMMENT ON COLUMN dbops.presidi_testi.variante IS
                'NULL = il testo del presidio. Valorizzata = il testo delle righe della vista la cui colonna dbops.presidi.colonna_variante ha questo valore (per il presidio dei processi: la causa). Il generico non fa da ripiego per una variante che manca: darebbe il rimedio sbagliato, in silenzio. Non vuota per vincolo.';

              COMMENT ON COLUMN dbops.processi.accendibile_in_produzione IS
                'Se in un''installazione di PRODUZIONE la sveglia del processo si puo'' accendere a mano. false per un processo che li'' non deve girare mai, per esempio perche'' scrive dati di prova (smoke_notturno): la scelta a mano accesa e'' rifiutata (E_PROCESSO_NON_ACCENDIBILE_IN_PRODUZIONE) e, se c''e'' gia'', lo stato effettivo la ignora. Il gemello di spegnibile. Un non accendibile e'' spento di default in produzione (chk_processi_accensione). In SVILUPPO non conta. NULL sui soli processi di canale CODA, valorizzata su tutti gli altri (chk_processi_accensione). La regola: dbops.fn_accensione_a_mano_ammessa_su_valori.';

              COMMENT ON COLUMN dbops.processi.acceso_in_produzione IS
                'Se la sveglia del processo e'' accesa di default in un''installazione di PRODUZIONE. NULL sui soli processi di canale CODA, valorizzata su tutti gli altri (chk_processi_accensione). La scelta a mano di una macchina (dbops.processi_accensione) lo scavalca.';

              COMMENT ON COLUMN dbops.processi.acceso_in_sviluppo IS
                'Se la sveglia del processo e'' accesa di default in un''installazione di SVILUPPO (dbops.installazione.ambiente). NULL sui soli processi di canale CODA, valorizzata su tutti gli altri (chk_processi_accensione). La scelta a mano di una macchina (dbops.processi_accensione) lo scavalca.';

              COMMENT ON COLUMN dbops.processi_bersagli.debito_dichiarato IS
                'Dice se la comparsa di questa riga in un presidio e'' attesa. Un presidio sempre acceso viene ignorato, e il giorno in cui compare una riga vera nessuno la distingue dal rumore: per questo il bersaglio atteso si dichiara qui e il presidio lo tace. Una colonna e non un elenco dentro la vista: i bersagli crescono coi processi, e un elenco in una vista invecchierebbe e si aggiornerebbe con un changeSet invece che col CSV. Il perche'' sta in note: questo flag risponde a una domanda sola. Il default e'' false, ed e'' la parte che protegge: un bersaglio nuovo nasce non dichiarato, quindi se finisce in un presidio e'' un allarme.';

              COMMENT ON COLUMN dbops.processi.canale IS
                'Chi fa partire il processo (chk_processi_canale). PGAGENT: lo scheduler del database. COMMAND: una persona o un cron. CODA: un operatore che lo accoda dall''applicazione, e il lavoro porta la sua identita''. CODA_AUTOMATICA: passa dalla coda, ma a metterlo in coda e'' un automatismo, quindi nessuno gli presta un nome e l''identita'' tecnica gli serve come a un job di pgAgent. Non vuol dire run_as SISTEMA: un lavoro di dominio va accodato con run_as = OPERATORE anche qui (lo pretende il guard di classe in dbops.fn_accoda_lavoro). Cio'' che distingue non e'' come gira, ma chi lo mette in coda.';

              COMMENT ON COLUMN dbops.processi.causa_fallimento IS
                'Di che natura sono i fallimenti di questo processo quando l''ambiente e'' sano (dbops.cause_fallimento): PROGRAMMA se un suo rosso chiede una modifica al codice, AMBIENTE se chiede un intervento sul server o sui ruoli del database, CONFIGURAZIONE se si sistema dalle impostazioni dell''applicazione. maintenance.vw_job_run_da_guardare la usa come ultima parola: prima vengono la corsa morta senza chiudersi e lo SQLSTATE dell''ambiente (AMBIENTE), poi il codice d''errore che dichiara la sua causa (config.codici_errore.causa_fallimento). Obbligatoria su ogni processo, anche CODA e ritirati (NOT NULL e FK in 90_end). Seed: 80_data/sql/dbops/processi.csv.';

              COMMENT ON COLUMN dbops.processi.ci_esclusione IS
                'Perche'' il job pgAgent non gira nella convergenza strutturale in CI (job operativo su dati e orologio, oppure con un giro suo altrove). Distingue fuori apposta da dimenticato. In alternativa a ci_ordine e ci_procedura (chk_processi_convergenza_ci).';

              COMMENT ON COLUMN dbops.processi.ci_ordine IS
                'Posizione del job nella convergenza strutturale che ci_apply esegue in CI, in ordine crescente e positivo. Valorizzata insieme a ci_procedura, in alternativa a ci_esclusione, per ogni processo con un job pgAgent (chk_processi_convergenza_ci).';

              COMMENT ON COLUMN dbops.processi.ci_procedura IS
                'La procedura che il job pgAgent chiama, per esteso con la firma (es. maintenance.proc_automations_attivo_job()): la convergenza in CI fa CALL di questa. Non si deriva dal codice del processo.';

              COMMENT ON COLUMN dbops.processi.corsa_verdetto_completo IS
                'Ogni corsa di questo processo e'' un verdetto completo: ricontrolla tutto il suo perimetro, quindi un verde chiude i rossi che lo precedono. Il criterio: dopo un verde, resta qualcosa che il rosso aveva lasciato e il verde non ha ricontrollato? Se si'', false (le code, l''invio mail, la fatturazione batch: un elemento fallito resta fallito, la corsa dopo ne lavora altri). Lo legge maintenance.vw_job_run_da_guardare: per un verdetto completo il motivo intermittente scatta solo se il lavoro e'' ricaduto dopo essere tornato verde (almeno due tratti rossi nei sette giorni), e una corsa in corso da meno di un''ora non conta finche'' non chiude. Con false un rosso negli ultimi sette giorni basta. Vale per ogni corsia del processo (jobname): ognuna dev''essere completa sul proprio perimetro. Seed: 80_data/sql/dbops/processi.csv.';

              COMMENT ON COLUMN dbops.processi.jobname_pgagent IS
                'Il nome del job pgAgent che sveglia questo processo. Non e'' derivabile dal codice: un job puo'' chiamare un wrapper che registra nel giornale con un altro nome (automations_cleanup_weekly registra come automations_cleanup), e un presidio costruito sul join per nome nascerebbe con falsi allarmi. NULL non e'' un dato mancante: significa che il processo non lo sveglia pgAgent (i COMMAND li programma crontab, fuori dal database, e i CODA li sveglia il backend). Nessuna FK verso pgagent.pga_job: in CI quella tabella non esiste (85_pgagent e'' MARK_RAN) e una FK la renderebbe un prerequisito strutturale. Il legame lo verifica dbops.vw_processi_programmazione: se il job nominato non c''e'', la riga lo dice invece di sparire.';

              COMMENT ON COLUMN dbops.processi.segno_di_vita IS
                'Dove il database cerca il segno di vita del processo (chk_processi_segno_di_vita). GIORNALE (default): l''ultima corsa su maintenance.job_run_log, confrontata con tolleranza_minuti; e'' la forma dei timer. SESSIONE: una connessione viva in pg_stat_activity con application_name = codice; e'' la forma dei servizi sempre accesi, come un listener LISTEN/NOTIFY, che scrivono una sola corsa all''avvio. Una sessione e'' un fatto, non una dichiarazione: se il processo muore la sessione sparisce, se sta riconnettendo non c''e''. Niente battito sul giornale (che e'' il giornale delle corse), niente tabella nuova. application_name si legge da qualunque ruolo senza pg_read_all_stats. Il backend deve presentarsi con application_name = codice del processo. Per SESSIONE la tolleranza e'' NULL (chk_processi_sessione_senza_tolleranza): la domanda e'' se c''e'' adesso. Solo i COMMAND possono dichiarare SESSIONE (chk_processi_contratto_solo_command).';

              COMMENT ON COLUMN dbops.processi.spegnibile IS
                'Se la sveglia del processo si puo'' spegnere. false quando, spento, si romperebbe la sicurezza o la correttezza dei dati senza che nessuno se ne accorga: un non spegnibile e'' acceso di default in tutti e due gli ambienti (chk_processi_accensione), la scelta a mano non lo spegne (E_PROCESSO_NON_SPEGNIBILE) e lo stato effettivo non legge l''ambiente. NULL sui soli processi di canale CODA, valorizzata su tutti gli altri (chk_processi_accensione).';

              COMMENT ON COLUMN dbops.processi.tolleranza_minuti IS
                'Il contratto di liveness del processo: se sto bene, lascio un segno di vita almeno ogni N minuti (positivo, chk_processi_tolleranza_positiva). NULL = la liveness non si presidia da qui (un processo a SESSIONE, un timer senza contratto, i PGAGENT che hanno la programmazione in pgagent.*). Sta a catalogo e non nel deploy perche'' il lettore che serve vive nel database: il guardiano del digest e'' un job pgAgent e legge solo qui; il file delle sveglie del deploy non la ripete. Non e'' indipendente dalla cadenza: la tolleranza e'' il contratto, la cadenza (oncalendar, nel deploy) e'' come l''host lo onora, e un timer piu'' lento della tolleranza lo viola; quella verifica e'' del backend. Un processo spento su questa installazione (default per ambiente e scelta a mano, dbops.processi_accensione) non si misura. Solo sui COMMAND (chk_processi_contratto_solo_command). Lo legge dbops.vw_processi_programmazione: un COMMAND con contratto e'' OK, MUTO o MAI_PARTITO.';

              COMMENT ON COLUMN dbops.request_log.emittente_attivo_id IS
                'anagrafiche.emittenti_fiscali.id su cui l''utente stava operando (GUC app.current_emittente_id). NULL = nessuna impersonazione. Nessuna FK, di proposito: log ad alto volume con purge, un record storico non deve impedire di rimuovere un emittente. Insieme a storico.user_emittente_attivo copre l''audit dell''azienda attiva: qui i tentativi, anche respinti (status 403), nella gemella storica i cambi riusciti.';

              COMMENT ON COLUMN dbops.stati_check_dichiarazioni.canale IS
                'Chi verifica la dichiarazione. APPLICAZIONE = il valore lo scrive un repository del backend (anche passandolo come parametro a una funzione): il test del backend pretende il letterale in un file Python non di test che nomini la tabella o uno dei suoi scrittori, e fa rosso se sparisce. ESENTE = il criterio non lo vede per la ragione scritta (cantiere aperto, tabella senza scrittori, copia da un''altra colonna): il pgTAP fa rosso se uno scrittore compare a DB (DEBITO_ESTINTO). Il CHECK e'' la sorgente da cui il pgTAP legge i canali ammessi.';


              COMMENT ON INDEX dbops.ix_error_log_area_occurred_at IS
                'Filtro area (esatto) della consultazione di error_log, con il tempo in coda per l''ORDER BY. Da solo o insieme a function_name (il planner sceglie il piu'' selettivo).';

              COMMENT ON INDEX dbops.ix_error_log_function_name_occurred_at IS
                'Filtro function_name della consultazione di error_log, esatto o a prefisso. text_pattern_ops: la collation del database e'' it_IT.UTF-8 e un btree ordinario non serve LIKE ''x%''; serve = e LIKE ''x%'', mai ILIKE: il backend filtra con LIKE (i nomi di funzione sono minuscoli per convenzione).';

              COMMENT ON INDEX dbops.ix_error_log_occurred_at IS
                'La finestra data_da/data_a della consultazione di error_log: il filtro sempre presente e la prima pagina (ORDER BY occurred_at DESC LIMIT n).';

              COMMENT ON INDEX dbops.ix_error_log_tx_id IS
                'Il ponte dal giornale (script.vw_giornale_entita.tx_id) agli appunti tecnici della stessa transazione: lettura esatta, tx_id NOT NULL.';

              COMMENT ON VIEW dbops.vw_af_senza_giro IS
                'Attivita'' fatturabili libere (non fatturate, non in fatturazione: lock_in_fatturazione falso o NULL) che nessun giro ha marchiato (emit_batch_id NULL), con l''emittente del billing account. E'' la controparte del marchio del giro: senza, un''attivita'' che un giro salta diventa una fattura che non nasce, e nessuno se ne accorge; questa vista la rende visibile. Lista di lavoro (natura LAVORAZIONE in dbops.presidi, cadenza settimanale): il pregresso non si esclude, perche'' quelle righe sono la popolazione del difetto, e cala da solo quando il pull ri-adotta le righe e ci scrive il proprio giro. Non elenca il lavoro mai entrato in fatturazione (una commessa che nessun giro ha pullato non ha righe qui): quella domanda ha la sua superficie nella lane. security_invoker; il digest conta da proprietario (dbops.fn_conta_presidio, perimetro DEFINER).';

              COMMENT ON VIEW dbops.vw_ambiente_non_dichiarato IS
                'PRESIDIO: una riga se questa installazione non ha ancora dichiarato il suo ambiente (dbops.installazione vuota). DEVE restare vuota. La tabella nasce vuota di proposito, senza un default da changeSet: l''ambiente lo scrive una volta la fase post di scripts/sql/provision_zeroerp.sql con -v ambiente=SVILUPPO|PRODUZIONE. Finche'' manca, script.fn_ambiente_installazione() da'' E_CONFIG_MANCANTE: il provisioning di sviluppo non parte e le sveglie spegnibili falliscono. Questo presidio dice la causa una volta, a chi la sistema; il panorama dei processi non ha una causa per questo (un fatto, un presidio). Legge script.fn_ambiente_dichiarato(), che non solleva.';

              COMMENT ON VIEW dbops.vw_articoli_a_magazzino_prontezza IS
                'Presidio di PRONTEZZA del magazzino: UNA riga, stato = MARCATI se esiste almeno un articolo attivo con gestito_a_magazzino, altrimenti NESSUNO_MARCATO. Esiste perche'' gestito_a_magazzino nasce false (fail-safe): senza una spia, un magazzino senza articoli gestiti resterebbe vuoto senza che nessun rosso lo dica. In dbops.presidi: natura ZERO, colonna_stato = stato, stato_atteso = MARCATI: dbops.fn_conta_presidio conta le righe IS DISTINCT FROM MARCATI, quindi lo zero suona e il pieno tace. catalogo.articoli non ha RLS: perimetro LIBERO. Cadenza SETTIMANALE: una condizione di prontezza, non un incidente.';

              COMMENT ON VIEW dbops.vw_audit_log_scrittori_fuori_perimetro IS
                'CANCELLO, deve restare VUOTA. Le funzioni che scrivono in dbops.audit_log (DML diretto, o via la porta dbops.fn_audit_log_once) e che stanno FUORI dal perimetro dichiarato nella vista stessa: dbops e maintenance. dbops.audit_log e'' un registro TECNICO (le automazioni e gli strumenti DBA, letto dall''amministrazione) e non deve contenere dati di dominio: il presidio giusto non e'' una policy di perimetro sul registro, ma impedire alla fonte che una funzione di vendite, anagrafiche o pagamenti ci scriva. Una riga qui fa rosso db/pgtap/dbops/test-audit-log-perimetro-scrittori-v1.sql, che gira in CI. Allargare il perimetro e'' un changeSet su questa vista. Il corpo si legge con dbops.fn_corpo_funzione: senza commenti, con i letterali intatti, anche per le funzioni SQL BEGIN ATOMIC. Le letture del registro non contano; la porta e'' esclusa per nome. security_invoker: legge solo il catalogo.';

              COMMENT ON VIEW dbops.vw_bersagli_non_dichiarati IS
                'Il cancello del vocabolario dei bersagli: ogni tipo scritto in un corpo vivo leggibile, plpgsql o sql (dbops.fn_corpo_leggibile), che costruisce un bersaglio (commenti esclusi) e che config.tipi_entita non dichiara (motivo ASSENTE) o dichiara come ritirato (motivo OBSOLETO: un bersaglio nuovo verso una voce ritirata manda l''operatore dove il progetto ha smesso di andare). Rende sicuro far crescere il catalogo una voce per volta, insieme al messaggio che la usa: dimenticare la voce fa fallire la BUILD, non l''operatore. Gemella di dbops.vw_codici_errore_da_dichiarare, che legge il SORGENTE, e NON di dbops.vw_eventi_non_dichiarati, che legge i dati perche'' quei codici li scrive Python: qui il bersaglio lo scrive il database, quindi la fonte giusta e'' pg_proc. Una vista sui dati sarebbe cieca su un ambiente senza traffico, e da una lettura cieca non si fa dipendere una build. Non vede i tipi costruiti per concatenazione o passati in una variabile: stesso limite della gemella, e la stessa scelta (fra i due errori possibili, quello che si corregge guardando i falsi positivi). Il rubinetto non si chiude con una FK: il bersaglio vive in un jsonb, e il canale d''errore non smette di funzionare perche'' manca una voce di catalogo: il bersaglio storto si perde (W_BERSAGLIO_MALFORMATO) e l''errore di dominio parte lo stesso.';

              COMMENT ON VIEW dbops.vw_coda_lavori_da_guardare IS
                'I lavori di coda (dbops.coda_lavori, non archiviati) che chiedono un occhio, col motivo: falliti (ERRORE, tentativi esauriti), presi e mai chiusi (IN_CORSO con claimed_at oltre un''ora fa: il worker e'' morto a meta''), mai presi (PENDING con run_after, o la nascita, oltre un''ora fa: il worker non sta girando). DEVE restare VUOTA. Il terzo motivo e'' il meno visibile: un worker spento non produce errori, produce ASSENZA. La soglia di un''ora non viene da una misura ma dal fatto che il drenatore gira di continuo: una soglia dedotta dai tempi di oggi si taglierebbe addosso al carico di oggi. Fuori ANNULLATO (deciso da qualcuno) e archiviato (gia'' guardato): un presidio che elenca cio'' che qualcuno ha gia'' visto smette di essere una lista di cose da fare. security_invoker; il digest conta da proprietario (dbops.fn_conta_presidio, perimetro DEFINER).';

              COMMENT ON VIEW dbops.vw_codici_errore_argomenti_trigger IS
                'SEDE UNICA della lettura «i codici E_* che un trigger passa alla sua funzione negli argomenti» (pg_trigger.tgargs, tagliati da dbops.fn_trigger_argomenti): una riga per (trigger, argomento) che e'' per INTERO un codice (^E_[A-Z0-9_]+$; una sottostringa no: ORDINE_VENDITA non e'' E_VENDITA). Serve ai building block trigger che ricevono il codice da TG_ARGV (trgfn_lock_columns, trgfn_doc_*_lock_fuori_bozza, trgfn_doc_guard_emittente_ba e simili), che il corpo della funzione non nomina. Lettori: dbops.vw_punti_canale_campo e dbops.vw_codici_errore_da_dichiarare. tabella e funzione sono TESTO schema.nome (un regclass in colonna si stampa col search_path di chi legge); posizione parte da 1, come fn_trigger_argomenti. Riconosce la forma di un codice di progetto, non la grammatica di un BB: un BB che passasse i codici in una lista va letto dalla funzione di grammatica che usa il trigger stesso.';

              COMMENT ON VIEW dbops.vw_codici_errore_da_dichiarare IS
                'Misura canonica del terzo lato del presidio sui codici errore: ogni codice E_* nominato da un corpo vivo leggibile, plpgsql o sql (dbops.fn_corpo_leggibile; commenti esclusi), o passato da un trigger alla sua funzione negli ARGOMENTI (dbops.vw_codici_errore_argomenti_trigger), con da_trigger = la funzione che lo nomina e'' agganciata a un trigger, quindi sta sul percorso di una richiesta. VOLUTAMENTE LARGA: raccoglie ogni letterale, non solo quelli dentro una chiamata a fn_log_and_raise_error, perche'' restringere perderebbe i codici che arrivano da espressione (v_motivi -> 0 ->> ''codice''). Fra i due errori possibili si sceglie quello che si corregge guardando i falsi positivi, non quello che non si vede. Non vede i codici costruiti per concatenazione, ne'' i RAISE EXCEPTION diretti che non passano dall''helper. Il cancello che la legge e'' il test del backend test_error_codes_db_policy_guardrail.';

              COMMENT ON VIEW dbops.vw_codici_errore_forme_condizione IS
                'Misura degli accumulatori sulla FORMA DELLA CONDIZIONE al punto che solleva un codice (non sul dominio della funzione). NON filtra di proposito. Tre query canoniche, da usare INSIEME. (1) CANDIDATI: SELECT codice, n_punti, famiglie FROM dbops.vw_codici_errore_forme_condizione WHERE n_famiglie_note > 1 ORDER BY n_punti DESC; (2) COPERTURA, senza cui la (1) si legge come una verita'': SELECT count(*) AS codici, count(*) FILTER (WHERE NOT solo_ignoto) AS classificati, count(*) FILTER (WHERE solo_ignoto) AS invisibili FROM dbops.vw_codici_errore_forme_condizione; (3) LA CLASSE E'' ANCORA VERA?, l''incrocio fra la guardia (cosa FA il punto) e la classe (cosa DICE il catalogo): SELECT unnest(f.famiglie) AS famiglia, c.classe, count(*) AS codici FROM dbops.vw_codici_errore_forme_condizione f JOIN config.codici_errore c USING (codice) WHERE NOT f.solo_ignoto AND c.obsoleto_dal IS NULL GROUP BY 1,2 ORDER BY 1, 3 DESC. Nella (3) le righe con famiglia IGNOTO non sono una famiglia: sono la misura che dichiara di non saper leggere quella guardia, e restano (toglierle farebbe sembrare piena la copertura); «fuori dominante» non vuol dire sbagliato. E'' una lista DA GUARDARE, non di difetti. FAMIGLIE. VALORE_ATTESO: «il valore letto non e'' quello ammesso» (x <> ''LETTERALE''), la forma delle guardie di stato e di perimetro; e'' una famiglia a se'' e non un ENUM allargato, perche'' le letture di questa vista si confrontano nel tempo; il CASE la mette DOPO ENUM e PARAMETRO (un NOT IN resta ENUM, una guardia su un parametro nullo resta PARAMETRO). PARAMETRO non si legge su un campo di un record: in «IF p_ddt.causale_trasporto_id IS NULL» p_ddt e'' il documento e la condizione e'' un dato mancante (DATO_ERRATO), non un chiamante rotto (TECNICO); il p_ deve NON essere seguito da un punto, e se sulla riga c''e'' anche un parametro vero resta PARAMETRO; chi non si legge cade in IGNOTO. Provato dai test 7-8 di db/pgtap/dbops/test-vw-codici-errore-motivo-nominato.sql. PUNTI. E'' un punto anche la riga che DICHIARA un motivo (''codice'', ''E_...'') dentro una fn_check_* (il pattern «la madre chiama la check» di linee-guida-sql), con la guardia presa dall''IF che la precede dentro la check, dov''e'' la condizione vera; NON si risale dalla chiamata alla check, perche'' sopra il punto che solleva la guardia e'' sempre «IF jsonb_array_length(v_motivi) > 0», muta sul perche''. Il marcatore e'' per FORMA, non per nome di funzione. Ogni codice distinto di una riga e'' un punto, con la stessa guardia. Le righe si tagliano dal corpo letto da dbops.fn_corpo_funzione, senza commenti e con i letterali intatti; le distanze sono 6 righe per la chiamata vicina e 25 dalla guardia. IMPRECISIONE DICHIARATA: la forma prende anche del normale control-flow entro 25 righe da un RAISE (IF TG_OP = ''DELETE'', IF v_id_type = ''uuid''): chi legge la (1) guarda i codici, non da'' per buono il conteggio. PERIMETRO: il solo plpgsql, di proposito, a differenza delle viste sorelle sui codici (dbops.vw_codici_errore_da_dichiarare, dbops.vw_punti_canale_campo, dbops.vw_funzioni_check_codici, dbops.vw_punti_primo_motivo, dbops.vw_bersagli_non_dichiarati), che leggono ogni corpo leggibile: la guardia si riconosce dalle righe IF / ELSIF / ELSE / EXCEPTION WHEN, che una funzione sql non ha. Una funzione sql che solleva un codice resta visibile in dbops.vw_codici_errore_da_dichiarare. La vista e'' una misura; il cancello e'' il confronto in CI dello snapshot (scripts/sql/codici_errore_famiglie_snapshot.sql) con la sua baseline: un codice che allarga il proprio significato ferma la build. Implementata a window function.';

              COMMENT ON VIEW dbops.vw_credenziali_da_sanare IS
                'Presidio ZERO delle credenziali. NESSUNA_VESTE: la credenziale non ha alcuna veste, nemmeno spenta (anagrafiche.vw_accessi_altri.nessun_accesso: una regola sola); una credenziale con sole vesti spente e'' una persona disattivata e non entra. PERSONA_E_SISTEMA: vesti di persona e di macchina sulla stessa credenziale (script.fn_veste_di_sistema), che il guard trgfn_identita_digitali_guard_natura_credenziale rifiuta: escono le righe scritte prima del guard e quelle di una gara fra transazioni. NESSUNA_VESTE si sana dando una veste alla credenziale o cancellandola (spegnerla in Django non basta: resta una credenziale senza veste); PERSONA_E_SISTEMA separando le due nature su due credenziali.';

              COMMENT ON VIEW dbops.vw_ddt_trasferimenti_consegnati_senza_arrivo IS
                'Presidio, DEVE restare vuota. Una riga e'' una bolla di TRASFERIMENTO (vendite.fn_ddt_causale_magazzino = TRASF_OUT) che muove merce (vendite.fn_ddt_muove_merce), con un magazzino, in uno stato dalla consegna in poi (ordine >= quello di CONSEGNATO e non abortito, dal catalogo config.stati_doc_ddt), con almeno un prelievo di una riga attiva senza la sua ENTRATA nel magazzino d''arrivo (provenienza DDT_VENDITA: la bolla, la riga, il prelievo come dettaglio; quantita'' positiva, non uno storno). Alla consegna il verbo vendite.fn_cambia_stato_ddt scrive un arrivo per prelievo (vendite.fn_posta_ddt ARRIVO, TRASF_IN): una riga qui e'' merce uscita dalla partenza e mai entrata a destinazione, cioe'' due giacenze che mentono. prelievi_senza_arrivo dice quanti. Il rimedio non e'' scrivere il movimento a mano: e'' capire da dove e'' passata la consegna. Gemella di dbops.vw_ddt_emessi_senza_scarico sull''altro capo del trasferimento. security_invoker; il digest conta da proprietario (dbops.fn_conta_presidio, perimetro DEFINER).';

              COMMENT ON VIEW dbops.vw_diag_v_clienti_links IS
                'Diagnostica dei legami di un cliente: billing account, istanza utility, soggetto e tipo ruolo, con i tre flag ba_match_istanza, ba_match_soggetto_ruolo e ba_match_utility che dicono dove il legame si rompe. Inventario (dbops.presidi), non un presidio. security_invoker=on: legge nel perimetro di chi interroga.';

              COMMENT ON VIEW dbops.vw_email_da_guardare IS
                'PRESIDIO: le email che la coda deve a qualcuno da oltre un''ora e che nessuno ha preso in mano. DEVE restare VUOTA. Si presidia l''EFFETTO e non lo schedulatore: se send_pending_emails non gira (o gira e non svuota) le email si accumulano qui, e questo prende anche il timer mai installato. La definizione di «in coda» non e'' scritta qui: sta in config.vw_email_in_coda, una volta sola, per il cron e per questo presidio; qui c''e'' SOLO la soglia. Un''ora non deriva dalla cadenza del cron: una soglia dedotta dai tempi di oggi si taglierebbe addosso al carico di oggi. Il backoff dei RETRY e'' rispettato per costruzione, perche'' dovuta_dal misura da quando la riga era DOVUTA e non da quando e'' nata. Perimetro DEFINER a catalogo: email_log ha la RLS e la vista e'' security_invoker; una persona la legge col suo perimetro, il digest la CONTA da proprietario con dbops.fn_conta_presidio e riporta il numero, mai le righe. Sta in dbops e non in config perche'' il catalogo dei presidi legge il perimetro dagli schemi che vi compaiono.';

              COMMENT ON VIEW dbops.vw_emittenti_regime_non_confermato IS
                'Gli emittenti fiscali attivi il cui regime fiscale nessuno ha mai dichiarato (regime_fiscale_confermato_il NULL): il regime e'' quello scritto alla creazione, o il default RF01. Ogni UPDATE che nomina regime_fiscale_rf lo conferma (anagrafiche.trgfn_emittenti_fiscali_regime_conferma), quindi un cambio di regime non lascia mai la riga qui. DEVE restare VUOTA. Copre un guasto che non assomiglia a un errore: un emittente in IVA per cassa lasciato a RF01 emette tutte le fatture a esigibilita'' immediata. Tutti i regimi e non solo RF01: un regime non confermato e'' un regime che nessuno ha dichiarato, qualunque codice abbia. Si svuota confermando il regime dal form dell''emittente.';

              COMMENT ON VIEW dbops.vw_eventi_non_dichiarati IS
                'I codici evento finiti in vendite.event_log e assenti da config.eventi_dominio. NON e'' la gemella di dbops.vw_codici_errore_da_dichiarare, e non puo'' esserlo: quella legge pg_proc perche'' i codici errore li solleva il DATABASE, mentre i codici evento li scrive PYTHON; una vista su pg_proc tornerebbe vuota per sempre, cioe'' direbbe «tutto a posto» guardando nel posto sbagliato. Il cancello vero e'' lato backend, dove i codici sono scritti. Questa fa un lavoro complementare: la deriva GIA'' AVVENUTA, che nessun controllo sul sorgente vede (un codice costruito a runtime, o scritto da qualcosa che non e'' il backend). Dipende dai dati: su un ambiente senza traffico e'' cieca. E'' una spia da guardare (natura LAVORAZIONE), non un semaforo che ferma. Il rubinetto NON si chiude con una FK su event_code: sarebbe il diario che smette di scrivere per un problema di configurazione.';

              COMMENT ON VIEW dbops.vw_fatture_stampa_coda_da_guardare IS
                'PRESIDIO: le stampe in coda (vendite.fatture_stampa_coda, non archiviate) che chiedono un occhio, col motivo: fallite (ERRORE), prese e mai chiuse (IN_CORSO da oltre un''ora: il worker e'' morto a meta'' e il reaper non e'' passato), mai prese (PENDING da oltre un''ora: il drenatore della stampa non sta girando). DEVE restare VUOTA. Gemella di dbops.vw_coda_lavori_da_guardare. L''orologio e'' data_update, cioe'' l''ultima transizione di stato: l''audit trigger lo porta a now() a ogni scrittura, e sulle righe vive l''unica scrittura del drenatore e'' una transizione (archiviato vale solo sugli stati terminali); il reaper lo legge allo stesso modo. Non e'' un vincolo: una scrittura non di stato su una riga viva azzererebbe l''orologio, e il presidio tacerebbe un''ora in piu'' (non suonerebbe a vuoto). Un''ora non deriva dalla cadenza del drenatore: una soglia dedotta dai tempi di oggi si taglierebbe addosso al carico di oggi. Niente ANNULLATO: la stampa non ce l''ha. La fattura e'' in sorgente_id. Perimetro DEFINER a catalogo: la tabella ha la RLS e la vista e'' security_invoker; una persona legge col suo perimetro, il digest conta da proprietario e riporta il numero.';

              COMMENT ON VIEW dbops.vw_funzioni_check_codici IS
                'SEDE UNICA della risalita «funzione dal corpo leggibile (plpgsql o sql: dbops.fn_corpo_leggibile) -> fn_check_* nominate nel corpo -> codici che quelle nominano come motivo». Una riga per (funzione, check, codice); codice NULL se la check non nomina motivi (il legame compare lo stesso). motivo_chiave = ''campo''/''parametro'' se il MOTIVO che nomina il codice porta la chiave del canale nel suo dettaglio (che fn_raise_primo_motivo_se_presente fonde nel context): PESSIMISTA, solo se tutti i motivi di quel codice la portano; n_motivi = quante volte la check lo nomina. LA DELEGA: una check che RESTITUISCE i motivi di un''altra fn_check_* (v_motivi || x.fn_check_…, v_m := x.fn_check_…, jsonb_agg sugli elementi) ne EREDITA i codici, a qualunque profondita''; una che la CONSUMA (count, EXISTS, IF) no: emette un motivo suo. Se nell''istruzione della delega il codice e'' confrontato con dei letterali (->> ''codice'' = ''E_X'' o IN (…)) eredita SOLO quelli: script.fn_check_prezzi_in_attesa eredita da fn_check_prezzi_autorizzati il solo E_DOC_PREZZO_PENDENTE. Anche check_emette_valori si propaga. <> e NOT IN non sono riconosciuti come filtro: si eredita tutto, cioe'' un legame in piu'', mai un ramo cieco. Lettori: dbops.vw_punti_primo_motivo (i soli punti che sollevano il primo motivo a mano) e dbops.vw_punti_canale_campo (tutti i siti). Le fn_check_* si cercano nel corpo SENZA commenti (dbops.fn_corpo_funzione, che lascia intatti i letterali); un codice che arriva da piu'' strade si aggrega. La finestra di un motivo NON e'' «fino al ;»: le check a CTE costruiscono piu'' motivi in uno statement, quindi il corpo si spezza sulle occorrenze di ''codice'',. Euristica sulla forma scritta, non sul significato. PRESTAZIONI, proprieta'' invisibili nei risultati: un prefiltro prosrc LIKE ''%fn\_check\_%'' sulla CTE delle funzioni (piu'' le sql BEGIN ATOMIC, che hanno prosrc vuoto e passano tutte al filtro sul corpo) tiene la stima sotto la soglia del JIT; le estrazioni passano da dbops.fn_regexp_occorrenze (ROWS 1), il taglio dei motivi da unnest(regexp_split_to_array), e le deleghe si estraggono una volta in una CTE MATERIALIZED. Un REPLACE che le perde non rompe niente e torna lento: le presidia db/pgtap/dbops/test-vw-funzioni-check-codici-sotto-jit-v1.sql.';

              COMMENT ON VIEW dbops.vw_liste_multi_emittente_non_certificate IS
                'Le liste che dichiarano multi_emittente = true SENZA esporre l''emittente in nessuna colonna attiva di ui.lista_colonna. DEVE restare a ZERO righe: una riga qui e'' una lista che si dichiara collaudata per piu'' aziende senza un collaudo dietro, cioe'' il flag usato per far sparire un fastidio invece che per dichiarare un lavoro fatto. Una lista si guadagna il flag esponendo l''emittente nella riga, non prima. Controllo di PURO CATALOGO: non sa nulla delle viste ne'' del backend, quindi non prova che la colonna arrivi a video, prova che qualcuno l''abbia dichiarata.';

              COMMENT ON VIEW dbops.vw_lotti_congelati_con_errori_da_guardare IS
                'PRESIDIO: i lotti CONGELATI (stato fiscale non piu'' pre-fiscale, o ignoto) che contengono documenti in ERRORE, qualunque sia stato_lotto. DEVE restare VUOTA. E'' un LETTORE: la contraddizione la definisce vendite.vw_lotti_congelati_con_gruppi_in_errore, qui si aggiunge solo l''emittente, per chi arriva dal digest. Si spartisce l''asse fiscale con dbops.vw_lotti_fermi_da_guardare: pre-fiscale a quel presidio, congelato a questo, senza buchi ne'' doppioni. Un lotto ANNULLATO non compare perche'' l''annullo gli chiude gli esiti, non perche'' qualcuno lo filtri. In dbops e non in vendite: iscrivere a catalogo una vista di vendite porterebbe l''intero schema nel perimetro di db/pgtap/dbops/test-catalogo-presidi-v1.sql. Perimetro DEFINER a catalogo: le tabelle sotto hanno la RLS e le viste sono security_invoker; da una sessione senza contesto risponde zero PER CECITA'', il digest conta da proprietario con dbops.fn_conta_presidio, una persona legge col proprio perimetro.';

              COMMENT ON VIEW dbops.vw_lotti_fermi_da_guardare IS
                'PRESIDIO: i giri di fatturazione PRE-FISCALI (vendite.vw_lotti_fase.pre_fiscale) che la sede unica vendite.vw_lotti_segnalazioni_summary dichiara fermo (critiche vive, riga di ponte in ERRORE o esito ERRORE) da OLTRE UN''ORA, e che nessuno ha rilanciato ne'' sciolto, qualunque sia stato_lotto (un COMPLETATO in bozza con un esito in errore e'' qui). DEVE restare VUOTA. Il banner lo dice a chi apre il lotto; questa riga lo dice a chi non lo apre. E'' un LETTORE: nessun addendo e'' ricalcolato qui; motivo e fermo_da sono le colonne della sede, e un addendo nuovo del verdetto lo vedono insieme il banner, il digest e il pallino (una sede a DB, il backend trasporta). Un lotto congelato con un esito ERRORE, o con lo stato fiscale ignoto, e'' la contraddizione di vendite.vw_lotti_congelati_con_gruppi_in_errore e sta in dbops.vw_lotti_congelati_con_errori_da_guardare: i due presidi si spartiscono l''asse fiscale senza buchi ne'' doppioni. Un''ora non e'' una misura: il rilancio e'' il gesto di una persona, e le viste delle code usano la stessa soglia per la stessa ragione. L''orologio e'' fermo_da, il fatto PIU'' RECENTE che ferma il lotto: un rilancio che fallisce di nuovo lo riparte, e la domanda resta «da quanto nessuno ci mette le mani». La soglia sta qui, non nel catalogo. Perimetro DEFINER a catalogo: le tabelle sotto hanno la RLS e la vista e'' security_invoker; da una sessione senza contesto risponde zero PER CECITA'', il digest conta da proprietario con dbops.fn_conta_presidio, una persona legge col proprio perimetro.';

              COMMENT ON VIEW dbops.vw_magazzino_dipendenze_inverse IS
                'CANCELLO, deve restare VUOTA. Gli oggetti dello schema magazzino che nominano uno schema di processo (vendite, acquisti, pagamenti: il perimetro e'' scritto nella vista, uno schema nuovo si aggiunge qui). Il registro di magazzino e'' un servizio dell''anello 2: chi muove merce scrive il proprio posting e chiama la primitiva, e il registro non conosce i suoi consumatori. Due lenti: CATALOGO (pg_depend: FK, viste, default, policy, trigger, firme, corpi SQL standard) e CORPO (il corpo delle funzioni senza dipendenze registrate, letto da dbops.fn_corpo_funzione: senza commenti, con i letterali intatti). Non vede gli argomenti dei trigger (i block_deact generati dal framework ATTIVO riflettono una FK che punta verso il registro: il verso giusto). Una riga fa rosso db/pgtap/magazzino/test-registro-non-nomina-i-consumatori-v1.sql, che gira in CI. security_invoker: legge solo il catalogo.';

              COMMENT ON VIEW dbops.vw_magazzino_movimenti_senza_costo IS
                'Le ENTRATE (qta > 0) scritte SENZA costo unitario, esclusi gli storni. Chi le scrive, tutti attraverso la primitiva magazzino.fn_scrivi_movimento: il primo carico senza valore (magazzino.fn_posta_inventario, riga senza costo_unitario e nessuna media), una rettifica positiva senza media (magazzino.fn_posta_rettifica), il carico da reso di una merce uscita senza costo e senza media al rientro (vendite.fn_posta_reso), l''entrata gemella di un trasferimento la cui uscita era senza costo (magazzino.fn_posta_trasferimento, vendite.fn_posta_ddt all''arrivo). Un''entrata senza costo non e'' un errore: e'' un fatto dichiarato, il movimento nasce con costo NULL, il valore resta com''e'' e la media si diluisce. Le uscite a NULL sono la CONSEGUENZA (nessuna media), non la causa, e non entrano. Gli STORNI non entrano (magazzino.fn_storna_movimenti_sorgente): lo storno di un''uscita senza costo e'' un''entrata senza costo che rende allo stesso magazzino la quantita'' uscita a valore zero, e la media torna com''era; la causa e'' gia'' qui. L''entrata gemella di un trasferimento invece resta: diluisce la media del magazzino d''arrivo. Natura LAVORAZIONE (una tendenza da guardare, non un guasto): compare nel digest invece di sparire nella media. security_invoker, perimetro DEFINER, cadenza SETTIMANALE.';

              COMMENT ON VIEW dbops.vw_magazzino_valore_giacenza_divergente IS
                'Le coppie (articolo, magazzino) in cui la COPIA del valore (valore_giacenza) e la RI-SOMMA del registro (round(qta * costo, 6) per movimento) DIFFERISCONO: IS DISTINCT FROM su un FULL JOIN, quindi una giacenza con movimenti e senza riga di valore, e una riga di valore senza movimenti, sono divergenze. DEVE RESTARE VUOTA. Non prova l''aritmetica (l''accumulatore somma gli stessi round che la primitiva ha scritto: coincidono per costruzione): prova che NESSUNO HA SCRITTO FUORI DALLA PORTA. Il rimedio e'' fn_ricalcola_valore_giacenza. security_invoker; presidio natura ZERO, perimetro DEFINER (la legge dbops.fn_conta_presidio: da un percorso senza contesto darebbe zero per cecita''), cadenza SETTIMANALE.';

              COMMENT ON VIEW dbops.vw_operatori_senza_emittente IS
                'Diagnostica degli operatori configurati a META'': identita'' OPERATORE attiva, NON super admin, e nessuna riga in config.user_emittenti_fiscali. Col perimetro fail-closed queste persone non vedono NULLA, e il difetto non si annuncia: nessun errore, solo schermate vuote. DEVE restare a zero righe: una riga qui e'' qualcuno che apre l''applicazione e non trova niente. Il super admin e'' escluso di proposito (il suo perimetro passa da fn_is_super_admin). Per assegnare l''emittente mancante si usa la funzione di dominio script.fn_change_user_emittenti_scope(auth_user_id, ARRAY[ef_id]), non un INSERT a mano.';

              COMMENT ON VIEW dbops.vw_processi_che_bypassano IS
                'PRESIDIO, deve restare VUOTA. I ruoli APPLICATIVI (con login, non superuser) che hanno BYPASSRLS: un ruolo cosi'' scavalca la separazione dei dati fra aziende emittenti. Non dice «nessuno scavalca la RLS»: il superuser la scavalca per definizione, e il proprietario delle tabelle non la subisce (nessuna ha FORCE ROW LEVEL SECURITY); i job di pgAgent passano di li'', con le procedure SECURITY DEFINER del proprietario. Nessun debito dichiarato per nome: un ruolo che torna con BYPASSRLS e'' una riga, e un debito nuovo si dichiara con un changeSet sulla vista e sul presidio, non con una lista di nomi. A catalogo in dbops.presidi, soglia ZERO; lo prova db/pgtap/dbops/test-processi-registro.sql. security_invoker: legge solo pg_roles.';

              COMMENT ON VIEW dbops.vw_processi_programmazione_da_guardare IS
                'PRESIDIO: i processi automatici la cui sveglia e la cui ultima corsa non tornano. DEVE restare VUOTA. E'' il panorama (dbops.vw_processi_programmazione) proiettato sulla colonna da_guardare (causa non NULL), NON un secondo criterio: ripetere qui un NOT IN sugli stati sarebbe la seconda enumerazione dello stesso vocabolario, e la seconda diverge. Il panorama non puo'' stare al suo posto: elenca anche i sani, e un presidio che mostra il verde insegna a leggere il verde come debito. Restano fuori, con causa NULL, OK, IN_ATTESA (mai girato, prima corsa futura), SPENTO (sveglia spenta su questa installazione), FUORI_PORTATA (i COMMAND senza contratto: li sveglia systemd, e chi li presidia e'' il backend da deploy/sveglie.json) e SU_RICHIESTA (un CODA lo sveglia una persona: una cadenza da confrontare non esiste). Lo stato che vale piu'' di tutti e'' GIRA_E_NON_REGISTRA: pgAgent dice che il job e'' girato, il giornale non ha la corsa di pgAgent: un lavoro che muore prima di riuscire a raccontarlo. Il verdetto poggia su giornale_ultima_corsa_pgagent (le sole corse scritte dal percorso DB), e giornale_ultima_corsa sta accanto perche'' la DIFFERENZA fra le due e'' informazione: se la seconda e'' avanti e la prima indietro, qualcuno ha registrato sotto questo codice senza essere pgAgent. Quando il giornale tace su un job che pgAgent dice girato, la storia degli esiti dello scheduler sta in pgagent.*, che zeroerp_app non legge: si comincia da li''. La colonna causa, proiettata dal panorama come lo stato, distingue i rimedi dove uno stato ne ha due (MUTO: TIMER_FERMO o SERVIZIO_GIU; MAI_PARTITO: TIMER_NON_INSTALLATO o JOB_MAI_PARTITO) e sceglie il testo per chi agisce (dbops.presidi.colonna_variante = ''causa''); qui non e'' mai NULL.';

              COMMENT ON VIEW dbops.vw_punti_canale_campo IS
                'La meta'' database del presidio del canale dei campi: per ogni (funzione dal corpo leggibile, plpgsql o sql (dbops.fn_corpo_leggibile), codice E_*) COME il codice viene sollevato e SE il context porta la chiave che script.fn_log_and_raise_error legge per la COLUMN dell''eccezione (''campo'', ripiego ''parametro''): il canale che a video accende il campo del form (fields -> campiErrati), l''unico che realizza la promessa ui_action = highlight_form_fields. I codici della funzione sono quelli del corpo PIU'' quelli che un trigger le passa negli ARGOMENTI (dbops.vw_codici_errore_argomenti_trigger): un building block trigger che riceve il codice da TG_ARGV e lo solleva da una variabile e'' un sito DIRETTO, attribuito al massimo IN_VARIABILE. via: DIRETTO (chiamata a fn_log_and_raise_error col codice letterale, o col codice in variabile), PRIMO_MOTIVO (il codice di un motivo, via fn_raise_primo_motivo_se_presente o a mano: codici = UNIONE delle fn_check_* del corpo, da dbops.vw_funzioni_check_codici), MOTIVO (la fn_check_* che lo emette: sede del campo, non un sito), NOMINATO (letterale nel corpo, mai sollevato con l''helper: canale NULL). canale: IN_CHIAMATA (chiave nella chiamata, o p_campo letterale, o nel motivo della check), IN_VARIABILE (in una variabile del corpo, o non attribuibile: mai un «ok» silenzioso), CHIAVE_NON_LETTA (la colonna sta nel context come CHIAVE: sanabile, nome_in_chiave dice quale), NESSUNO. chiave: campo / parametro. Per (funzione, codice) il canale e'' il MIGLIORE fra le chiamate attribuite (la regola e'' «almeno un punto»), e n_chiamate / n_con_canale dicono quando una funzione lo porta in 2 chiamate su 3. Il verso 1 del presidio si legge da canale IN (IN_CHIAMATA, IN_VARIABILE) su via IN (DIRETTO, PRIMO_MOTIVO); il verso 2 da n_con_canale = n_chiamate. Euristica sul corpo senza commenti: chiamata = testo fino al primo ;, p_campo letto a un livello di parentesi; i RAISE diretti non si vedono; gli helper sono esclusi. Il cancello e'' il test del backend test_ui_action_e_canale_campi; la forma la prova db/pgtap/dbops/test-punti-canale-campo-v1.sql.';

              COMMENT ON VIEW dbops.vw_punti_primo_motivo IS
                'I punti che sollevano A MANO il codice del PRIMO MOTIVO di una script.fn_check_* (fn_log_and_raise_error(... ->> ''codice''), il pattern «la madre chiama la check» di linee-guida-sql), legati alla check da cui il motivo viene e ai codici che quella nomina. Una riga per (punto, check, codice). E'' il RUBINETTO: i chiamanti di script.fn_raise_primo_motivo_se_presente non ci stanno, per costruzione. Il perimetro sono i corpi leggibili, plpgsql e sql (dbops.fn_corpo_leggibile). La risalita punto -> check -> codici si legge da dbops.vw_funzioni_check_codici, sede unica condivisa con dbops.vw_punti_canale_campo; qui resta il solo marcatore dei punti. COME SI USA. (A) il perimetro dell''helper: SELECT sch, fn, count(check_funzione) AS check_trovate, coalesce(bool_or(check_emette_valori), false) AS in_perimetro FROM dbops.vw_punti_primo_motivo GROUP BY 1,2; (B) i codici che un punto puo'' sollevare: SELECT DISTINCT funzione, codice FROM dbops.vw_punti_primo_motivo WHERE codice IS NOT NULL. PESSIMISTA DI PROPOSITO: i codici sono l''UNIONE di quelli nominati da TUTTE le check citate nel corpo, perche'' la vista legge il testo e non sa quale ramo sia stato preso; un presidio che scegliesse il ramo ottimista assolverebbe il caso che deve segnalare, e un falso positivo qui costa una riga in piu'' nel VARIADIC, non un rifiuto sbagliato. RAMO CIECO: un punto con check_funzione NULL non e'' «a posto», e'' un sito che la lettura non sa legare alla sua check, e va visto (test 3 di db/pgtap/script/test-rubinetto-primo-motivo-v1.sql). NON serve a dbops.vw_codici_errore_forme_condizione: quella classifica la forma della guardia, e sopra questi punti la guardia e'' sempre «IF jsonb_array_length(v_motivi) > 0»; li'' si classifica dove il codice e'' NOMINATO. Euristica sul corpo senza commenti (dbops.fn_corpo_funzione): riconosce la forma scritta, non il significato; una chiamata rimasta in un commento non e'' un punto.';

              COMMENT ON VIEW dbops.vw_radici_di_prova_in_produzione IS
                'PRESIDIO: le radici di prova (le righe di dbops.credenziali_di_prova e dbops.soggetti_di_prova) in un database dichiarato PRODUZIONE. DEVE restare vuota: il guard dbops.trgfn_etichette_di_prova_guard impedisce che un''etichetta nasca in PRODUZIONE e l''ambiente non cambia; questa e'' l''ultima rete per cio'' che i guard non vedono (un dump di sviluppo ripristinato su un server di produzione con l''ambiente riscritto a mano, un trigger disattivato). Legge script.fn_ambiente_dichiarato(), che non solleva: su un''installazione non dichiarata e'' vuota. Legge solo dbops: in CI non e'' rotta.';

              COMMENT ON VIEW dbops.vw_riferimenti_morti_da_sanare IS
                'Riferimenti morti (REALE/ORFANA) e funzioni che NON SI SONO POTUTE CONTROLLARE (NON_MISURATO), non coperti dal registro del debito (dbops.riferimenti_morti_esenzioni): e'' la lista di lavoro. Deve essere vuota. Ogni SELECT ricompila con plpgsql_check tutte le funzioni plpgsql (dbops.fn_check_funzioni_riferimenti_morti): e'' una lettura pesante. NON_MISURATO non e'' un dettaglio: senza quelle righe la vista tornerebbe VUOTA proprio quando plpgsql_check e'' rotto, cioe'' direbbe «nessun riferimento morto» quando nessuno ha potuto guardare. Una riga NON_MISURATO non e'' un riferimento morto e non si registra come debito: si ripara lo strumento. Ma resta lavoro, e resta VISIBILE: la conta anche il digest dei presidi, per cui questa vista e'' un REGISTRO a cadenza settimanale (perimetro DEFINER).';

              COMMENT ON VIEW dbops.vw_rls_perimetro_scoperto IS
                'Le tabelle che dovrebbero filtrare e non filtrano, per due criteri indipendenti letti dal catalogo di PostgreSQL: FIGLIA_DI_TABELLA_PROTETTA (ha una FK verso una tabella con la row level security accesa) e POLICY_INERTE (porta una policy e la row level security spenta). L''invariante NON e'' «la vista e'' vuota»: e'' «nessuna riga fuori da DEBITO_DICHIARATO» (in dbops.presidi colonna_stato = stato, stato_atteso = DEBITO_DICHIARATO): un debito dichiarato in dbops.rls_perimetro_debito e'' una riga attesa, un NON_DICHIARATO e'' un allarme, un DEBITO_ESTINTO e'' una riga di registro da togliere. FORCE ROW LEVEL SECURITY non entra nel criterio: nessuna tabella lo usa, e l''applicazione non e'' proprietaria. Presidio: db/pgtap/rls/test-rls-perimetro-scoperto.sql.';

              COMMENT ON VIEW dbops.vw_stati_check_da_sanare IS
                'La lista di lavoro del presidio degli stati mai scritti: i valori di una colonna di stato che nessuno scrive e nessuno ha dichiarato (NON_DICHIARATO), e le righe del registro dbops.stati_check_dichiarazioni che non servono piu'' (DEBITO_ESTINTO), dalla misura dbops.vw_stati_check_scrittori. DEVE restare vuota, ed e'' un CANCELLO: la fa rossa in CI db/pgtap/dbops/test-stati-check-scrittori-v1.sql, e sul lato Python il test del backend test_stati_check_scrittori_python verifica le righe DICHIARATO_APPLICAZIONE della misura. Non e'' un filtro da allargare per farla tacere: si allarga il registro, con la ragione.';

              COMMENT ON VIEW dbops.vw_stati_check_scrittori IS
                'La misura del presidio degli stati mai scritti: uno stato previsto dal modello (nel CHECK a lista di una colonna di stato) e mai scritto. Una riga per (colonna, valore) con il suo esito: SCRITTO (una funzione scrive la tabella e nomina il letterale, oppure lo passa a uno scrittore posizionale: il secondo salto), SCRITTO_DA_DEFAULT, DICHIARATO_APPLICAZIONE / ESENTE (sta in dbops.stati_check_dichiarazioni), NON_DICHIARATO (il debito da sanare) e DEBITO_ESTINTO nei due versi. La lista di lavoro e'' dbops.vw_stati_check_da_sanare. Il criterio e'' TESTUALE e ha due limiti, dichiarati nel suo pgTAP: nominare non e'' scrivere (test 6) e a tre salti il letterale non si segue piu'' (test 9). I nomi scritti da ogni funzione e i letterali citati si estraggono una volta, con un passaggio solo, e si confrontano per uguaglianza. Le funzioni di fixture pgTAP (prefisso fn_pgtap_ in dbops e script) NON contano, ne'' come scrittori ne'' come chiamanti: il presidio misura il sistema, non le fixture che lo collaudano.';

              COMMENT ON VIEW dbops.vw_storico_scope_da_dichiarare IS
                'ZERO, deve restare VUOTA. Il debito della mappa dello scope di storico (dbops.storico_scope_policy), in tre motivi: SENZA_RIGA (una madre col trigger di storico che nessuno ha ancora guardato), PROTETTA_NESSUNO (una madre in RLS dichiarata NESSUNO: la sua storia e'' ancora aperta, con la ragione dichiarata), RIGA_SENZA_MADRE (una riga di mappa senza piu'' una madre col trigger: tabella cancellata o storicizzazione tolta). Il marcatore delle madri e'' il trigger. La madre di una riga si cerca sul catalogo (pg_class, pg_namespace; l''alias pg_temp e'' lo schema temporaneo della sessione), non con to_regclass, che solleva su uno schema senza USAGE per chi legge: la vista e'' security_invoker e non dipende dai privilegi del lettore sugli schemi. Porta nel digest settimanale cio'' che il pgTAP db/pgtap/dbops/test-storico-scope-policy-v1.sql asserisce in CI (test 2, 4, 5; i test 29-33 provano che questa vista dica il vero su casi costruiti).';

              COMMENT ON VIEW dbops.vw_trigger_functions IS
                'INVENTARIO: ogni trigger montato nel database con la tabella su cui sta, la funzione che esegue e la definizione COMPLETA di quella funzione (pg_get_functiondef). E'' un attrezzo per leggere, non un presidio: a database sano ha una riga per trigger, e la non-vuotezza e'' la condizione NORMALE. Non entra in nessun digest: un elenco lungo non e'' un allarme, e un avviso rumoroso viene ignorato al secondo invio. Porta il corpo INTERO di ogni funzione trigger: una SELECT senza WHERE e'' pesante, e non e'' il modo di usarla; si filtra per tabella o per nome funzione. Dichiarata come INVENTARIO in dbops.presidi: se una vista mancasse dal catalogo non si saprebbe se e'' un inventario o una dimenticanza.';

              COMMENT ON COLUMN dbops.vw_processi_programmazione.causa IS
                'Perche'' la riga e'' da guardare, piu'' fine di stato dove lo stato ha due cause: MUTO -> TIMER_FERMO (COMMAND col giornale) o SERVIZIO_GIU (COMMAND con la sessione); MAI_PARTITO -> TIMER_NON_INSTALLATO (COMMAND) o JOB_MAI_PARTITO (PGAGENT); IN_RITARDO -> JOB_IN_RITARDO. Altrove e'' lo stato stesso: NON_PROGRAMMATO, JOB_ASSENTE, JOB_SPENTO, GIRA_E_NON_REGISTRA. NULL sui processi sani (OK, IN_ATTESA, SPENTO, FUORI_PORTATA, SU_RICHIESTA), ed e'' cio'' che li fa sani: da_guardare = causa IS NOT NULL. Esce dallo stesso ramo del CASE che produce lo stato. Sceglie il testo per chi agisce (dbops.presidi.colonna_variante -> dbops.presidi_testi.variante).';

              COMMENT ON COLUMN dbops.vw_processi_programmazione.da_guardare IS
                'Vero se questo stato e'' un guasto (causa non NULL). E'' la SEDE UNICA del criterio: la vista di presidio la proietta invece di ripetere un NOT IN, che sarebbe la seconda enumerazione degli stati, e la seconda diverge. Non e'' stato <> OK: IN_ATTESA, SPENTO, FUORI_PORTATA e SU_RICHIESTA non sono OK e non sono guasti.';

              COMMENT ON COLUMN dbops.vw_processi_programmazione_da_guardare.causa IS
                'La causa del guasto, dal panorama (dbops.vw_processi_programmazione.causa): TIMER_FERMO, TIMER_NON_INSTALLATO, SERVIZIO_GIU, NON_PROGRAMMATO, JOB_ASSENTE, JOB_SPENTO, JOB_MAI_PARTITO, JOB_IN_RITARDO, GIRA_E_NON_REGISTRA. Mai NULL qui. Sceglie il testo per chi agisce: dbops.presidi.colonna_variante -> dbops.presidi_testi.variante.';

              COMMENT ON COLUMN dbops.vw_processi_programmazione.giornale_ultima_corsa IS
                'L''inizio della corsa piu'' recente del processo nel giornale (maintenance.job_run_log, per processo_codice o jobname), qualunque origine. CONTA anche le corse saltate per lock occupato: e'' il segno di vita della SVEGLIA (alimenta MAI_PARTITO e TIMER_FERMO per i COMMAND col giornale), e una corsa saltata prova che il timer si e'' svegliato. Il lavoro fermo si vede in maintenance.vw_job_run_da_guardare.';

              COMMENT ON COLUMN dbops.vw_processi_programmazione.giornale_ultima_corsa_pgagent IS
                'L''inizio della corsa piu'' recente registrata da pgAgent (origine PGAGENT). Alimenta GIRA_E_NON_REGISTRA, confrontata con l''ultima esecuzione che pgAgent dichiara. CONTA anche le corse saltate: una corsa saltata e'' una registrazione, e prova che il job scatta e il giornale lo sa.';

              COMMENT ON COLUMN dbops.vw_processi_programmazione.ultimo_esito IS
                'L''esito (ok) dell''ultima corsa VERA del processo nel giornale: TRUE riuscita, FALSE fallita, NULL ancora aperta (o nessuna corsa). Le corse SALTATE per lock occupato sono escluse (maintenance.job_run_log.saltata): non hanno fatto lavoro, quindi non hanno esito.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON TABLE dbops.audit_log IS
                NULL;

              COMMENT ON TABLE dbops.automation_delete_block IS
                'Configurazione trigger delete-block per tabelle sensibili (ruoli).';

              COMMENT ON TABLE dbops.automation_scope IS
                'Scope opzionale per rollout filtrato';

              COMMENT ON TABLE dbops.automazione_attivo_eccezioni IS
                'Le FK che l''automazione ATTIVO NON lega: per una riga qui, dbops.fn_run_automations_attivo non genera ne'' il block sul padre ne'' il require sul figlio, e dbops.fn_ritira_attivo_eccezioni toglie quelli gia'' generati. Una FK per riga (schema e tabella del FIGLIO, colonna FK), col MOTIVO obbligatorio: un''eccezione senza perche'' e'' un buco nel framework. Prima riga il 2026-09-25: config.profili_accesso_bindings.identita_digitale_id — porta e profili si sganciano (brief-db-blocco-login-per-credenziale §12.3). Seed da 80_data (CSV dbops/automazione_attivo_eccezioni.csv).';

              COMMENT ON TABLE dbops.automazione_chiusura_scadenze IS
                'Configurazione del framework di chiusura automatica per scadenza. Ogni riga descrive una tabella target con ciclo stato + valido_al. Letta da dbops.fn_apply_chiusura_scadenze() chiamata dal job notturno chiusura_scadenze_daily (85_pgagent).';

              COMMENT ON TABLE dbops.automazione_codice_eccezioni IS
                'Le colonne codice che l''automazione CODICE_MAIUSCOLO NON normalizza. La regola e'' per esclusione (decisione Tid 2026-11-04): ogni colonna codice di una tabella dell''ambito si salva in upper(btrim(...)) (script.trgfn_codice_maiuscolo), e una tabella nuova nasce presidiata. Qui stanno le colonne codice che non sono un codice dell''operatore: una chiave tecnica letta dal codice per nome, o un codice esterno dove il maiuscolo conta. Il MOTIVO e'' obbligatorio. Una riga toglie il trigger al giro successivo (dbops.fn_run_automations_codice_maiuscolo, azione TOGLIE). codice_interno non e'' nel perimetro: lo scrive la migrazione. Seed da 80_data (CSV dbops/automazione_codice_eccezioni.csv).';

              COMMENT ON TABLE dbops.automazione_overlap IS
                'Configura anti-overlap temporale per tabelle con valido_dal/valido_al o valid_from/valid_to.';

              COMMENT ON TABLE dbops.cause_fallimento IS
                'Il vocabolario delle cause per cui un lavoro automatico fallisce: AMBIENTE (server, connessione, risorse, ruoli del database), PROGRAMMA (serve una modifica al codice o al database), CONFIGURAZIONE (si sistema dalle impostazioni dell''applicazione). Lo dichiarano dbops.processi.causa_fallimento (la natura dei fallimenti del processo quando l''ambiente e'' sano) e config.codici_errore.causa_fallimento (la natura di un errore preciso, quando lo sa), con FK verso questa tabella. maintenance.vw_job_run_da_guardare ne ricava la causa di ogni riga, e dbops.presidi_cause dice a chi tocca: le cause di quel presidio coincidono con questo vocabolario (pgTAP maintenance/test-vw-job-run-da-guardare-causa-v1). Seed: 80_data/sql/dbops/cause_fallimento.csv. Brief: brief-db-presidio-job-run-a-chi-tocca (D4).';

              COMMENT ON TABLE dbops.coda_lavori_tipi IS
                'Registry dei tipi di job della coda lavori generica (dbops.coda_lavori). codice = job_type; handler_code = chiave di dispatch verso il handler_registry Python (no dynamic import); default per-tipo run_as/max_tentativi. Brief: brief-db-coda-lavori-generica §2.';

              COMMENT ON TABLE dbops.codici_errore_senza_policy IS
                'Registro del debito del "terzo lato": i codici errore che una funzione plpgsql viva puo'' nominare e che NON hanno una voce in backend/apps/core/services/error_policies.py. Effetto del difetto: l''operatore legge comunque la frase giusta (viene dal catalogo), ma il TIPO di risposta HTTP resta appiattito su 400 anche quando la verita'' e'' 404 o 403. UNA sola decisione (brief-db-be-terzo-lato-presidio-codici, 2026-08-05): non e'' una regressione, si chiude a lotti per dominio partendo dai da_trigger. Esiste per permettere di accendere il cancello SUBITO invece che a bonifica finita: un cancello rosso dal primo giorno viene disattivato. E'' un debito: DEVE calare, e il cancello deve pretendere che una voce che ha ottenuto la sua policy venga tolta. Misura canonica: dbops.vw_codici_errore_da_dichiarare.';

              COMMENT ON TABLE dbops.installazione IS
                'L''ambiente di questa installazione: SVILUPPO o PRODUZIONE. Una riga sola (id = 1), vuota alla nascita: la scrive la fase post di scripts/sql/provision_zeroerp.sql col parametro -v ambiente=..., una volta, e poi non cambia piu'' (guard trgfn_installazione_guard_immutabile, E_AMBIENTE_IMMUTABILE). Nessun default: un changeSet troverebbe database gia'' esistenti e li dichiarerebbe al posto di chi li conosce. Fuori da config.parameters: il mirror CSV la riscriverebbe e l''app la potrebbe cambiare. L''app la legge e non la scrive. Si legge con script.fn_ambiente_installazione() (che fallisce se manca) o script.fn_ambiente_dichiarato() (che torna NULL, per i panorami). Brief: brief-db-processi-accensione-per-ambiente (A-1, R-1, R-2, R-3).';

              COMMENT ON TABLE dbops.lock_columns_conditional IS
                'Registro lock condizionali: colonne immutabili SE condition_expr valutata sul record indicato da $1 (id come text) ritorna TRUE. Complementare a dbops.automation_lock_columns (lock statici). Scrivibile solo via migration. rev 2026-05-22.';

              COMMENT ON TABLE dbops.messaggi_errore_codici_legacy IS
                'Registro del DEBITO EREDITATO sulla convenzione dei codici errore (E_{MODULO}_{TIPO}, W_ per i warning — docs/it/dev/api.md). Ci va un codice che arriva da fuori gia'' fuori convenzione e che non conviene rinominare; il CHECK chk_..._non_conforme impedisce di registrarci un codice conforme. ⭐ A ZERO RIGHE dal 2026-08-07: le 57 voci del 2026-08-05 sono state tutte smaltite, l''ultima col rename MESSAGGIO_NON_DEFINITO -> E_MESSAGGIO_NON_DEFINITO. ⛔ NON DROPPARE (decisione Tid 2026-08-08): a zero righe il drop sarebbe neutro nel comportamento, ma costerebbe mettere mano al controllo (B) di scripts/sql/guardrail_codice_errore_strutturato.sql — l''unica cosa che tiene la convenzione — in un presidio verde, e toglierebbe il meccanismo pronto per la prossima eredita'' di codici. Un registro vuoto non e'' un registro inutile: e'' un registro in pari. ⚠️ NON e'' una whitelist di eccezioni: una FAMIGLIA nuova con una semantica sua (com''e'' stato per i W_, changeSet 20260805-28) si risolve ALLARGANDO la convenzione, non registrandola qui — per questo non c''e'' una colonna «motivo», e l''orologio del debito e'' data_registrazione. ⚠️ Da non confondere con dbops.codici_errore_senza_policy, che e'' il registro del terzo lato (codici senza policy BE). Piano: docs/it/dev/work-done/piano-db-classe-codici-errore.md §5.5.';

              COMMENT ON TABLE dbops.presidi IS
                'Catalogo delle viste di presidio: per ogni vista, CHE COSA SIGNIFICA una sua riga. E'' il terzo pezzo accanto alla misura (la vista) e al registro del debito (le voci note): dice chi la legge. ⛔ Non e'' un elenco in Python perche'' sarebbe una seconda sorgente di verita'', e diverge alla prima vista nuova — il presidio nascerebbe fuori dal digest, in silenzio, cioe'' lo stesso guasto che il digest chiude. ⭐ Non e'' un''ipotesi: la trentaduesima vista e'' nata il 2026-09-09, lo stesso giorno in cui il brief ne contava trentuno. ⛔ Nessuna colonna `soglia`: il debito si tiene con un registro di voci PER NOME, perche'' un intero e'' cieco sullo scambio (un debito saldato piu'' un difetto nuovo lasciano il numero fermo). ⛔ E nessun destinatario: a chi arriva la posta di questa macchina e'' un fatto di deploy, non di catalogo. Brief: brief-db-un-destinatario-per-i-presidi §4.1.';

              COMMENT ON TABLE dbops.presidi_cause IS
                'Le cause di un presidio le cui righe sono guasti DIVERSI (dbops.presidi.colonna_variante valorizzata), ognuna con CHI la spegne. ⭐ La causa e'' un''entita'': ha il suo «a chi tocca» (chi_agisce, stesso dominio di dbops.presidi.chi_agisce) e i suoi testi per lingua (dbops.presidi_testi, FK (vista, variante) → (vista, causa)). Nasce perche'' un valore di chi_agisce per presidio e'' sbagliato per alcune righe esattamente come lo era un testo unico: il presidio dei processi e'' SISTEMISTA, ma NON_PROGRAMMATO e GIRA_E_NON_REGISTRA toccano allo SVILUPPO. dbops.presidi.chi_agisce resta il valore del presidio nel suo insieme. Completezza nei pgTAP: le cause stanno solo sui presidi che dichiarano colonna_variante, ognuna ha il testo `it` (dbops/test-presidi-testi-v1); il catalogo coincide con le cause che la vista puo'' produrre (il test del presidio). Seed: 80_data/sql/dbops/presidi_cause.csv, caricato dal mirror dei testi PRIMA dei testi. Brief: brief-db-presidio-processi-testo-per-causa §5.5 (b).';

              COMMENT ON TABLE dbops.presidi_testi IS
                'Il testo di un presidio per CHI DEVE AGIRE, per lingua: `significato` (cosa vuol dire una riga) e `azione` (cosa fare per spegnerlo). ⛔ Non sostituisce il COMMENT della vista ne'' la `nota` di dbops.presidi: quelli sono scritti per chi MANTIENE il presidio e restano com''erano. Chi lo spegne e'' un dato del presidio, non del testo: dbops.presidi.chi_agisce. Lo leggono il pannello dei processi automatici e il digest (che va per email, senza i locali del frontend: per questo il testo sta a DB, come config.messaggi_errore). ⭐ VARIANTI, dal 2026-10-09: `variante` NULL e'' il testo del presidio; valorizzata e'' il testo delle righe la cui colonna dbops.presidi.colonna_variante vale quel valore. Chiave (vista, lingua, variante) NULLS NOT DISTINCT. ⛔ Il testo generico non fa da ripiego per una variante senza testo; una lingua che manca ripiega sull''italiano DELLA STESSA variante. La completezza — ogni presidio attivo, non obsoleto e non INVENTARIO ha la riga `it` generica; le varianti stanno solo sui presidi che dichiarano colonna_variante, e ognuna ha la sua riga `it` — la garantisce il pgTAP dbops/test-presidi-testi-v1, perche'' un CHECK non guarda un''altra tabella; che ogni causa che la vista puo'' produrre abbia il suo testo lo garantisce il pgTAP del presidio. Seed: 80_data/sql/dbops/presidi_testi.csv. Brief: brief-db-presidi-cosa-significa-cosa-fare §4.1, brief-db-presidio-processi-testo-per-causa §3 B.';

              COMMENT ON TABLE dbops.processi IS
                'Registro di CATALOGO dei processi automatici: quali esistono, di che classe e su quale canale. Il codice e'' l''attore di un run (maintenance.job_run_log.processo_codice, hard FK). La classe e'' una dichiarazione di chi progetta il processo, verificata dal DB in una direzione sola (DOMINIO senza percorso verso un emittente -> dbops.vw_processi_dominio_senza_emittente). Il legame processo -> utente tecnico e'' dati di macchina e sta in dbops.processi_identita. Brief: brief-db-processi-automatici-identita-e-perimetro §2.2.';

              COMMENT ON TABLE dbops.processi_accensione IS
                'La scelta a mano di questa installazione sulla sveglia di un processo: acceso, spento o tornato al default, col motivo. Scavalca il default per ambiente di dbops.processi (acceso_in_sviluppo, acceso_in_produzione). La riga dice l''ULTIMO gesto (chi, quando, perche''): acceso NULL = segue il default; assenza della riga = nessuno l''ha mai toccata. La storia dei gesti e'' in storico.processi_accensione (storicizza, automazioni di ci_apply); chi e'' l''utente lo scrive l''audit generato (app.jwt_user). Dato di MACCHINA (come dbops.processi_identita): nessun seed, la scrive l''operatore col verbo dbops.fn_imposta_accensione_processo. Un non spegnibile non si spegne e un processo senza sveglia (CODA, ritirato) non ha righe: dbops.trgfn_processi_accensione_guard. Lo stato effettivo lo dice dbops.fn_processo_acceso_dichiarato (e maintenance.fn_sveglia_accesa per le sveglie). Brief: brief-db-processi-accensione-per-ambiente (A-2, S-1).';

              COMMENT ON TABLE dbops.processi_identita IS
                'Legame processo -> utente tecnico (django.auth_user.id). ⭐ Rev 2026-09-04: un processo ha un utente PER EMITTENTE, non uno in tutto — perche'' config.user_emittenti_fiscali e'' 1-a-1 sull''utente (UNIQUE(auth_user_id), changeSet 20260408-11) e in questo modello solo il super admin e'' multi-emittente. Il vincolo qui e'' quindi UNIQUE(auth_user_id): un utente tecnico serve un processo solo, un processo puo'' averne N. ⛔ L''emittente NON si ripete in questa tabella: sta in config.user_emittenti_fiscali, e duplicarlo sarebbe una seconda sorgente di verita''. Meta'' di MACCHINA del registro: il suo seed va marcato context: dati_macchina. Brief: brief-db-processi-automatici-identita-e-perimetro §4.';

              COMMENT ON TABLE dbops.rls_perimetro_debito IS
                'Registro del debito del perimetro RLS: le tabelle che il criterio di dbops.vw_rls_perimetro_scoperto trova scoperte e che restano tali per una DECISIONE. Una riga zittisce il presidio su quella tabella e su quel criterio soltanto. ⚠️ Dichiarare un debito non lo assolve: dice «sappiamo perche'' e'' qui», non «va bene che ci sia». E'' un registro e DEVE calare — il presidio pretende che una riga rientrata venga tolta (stato DEBITO_ESTINTO). Brief: brief-db-perimetro-emittente-righe-documento §8.';

              COMMENT ON TABLE dbops.soggetti_di_prova IS
                'L''etichetta di un soggetto di prova: una riga per ogni soggetto creato dal verbo dei dati di sviluppo (anagrafiche.fn_provisiona_dati_di_sviluppo), nella stessa transazione: gli emittenti, i clienti, il fornitore, le persone dietro le credenziali. Si etichettano le radici, non le righe: contratti, BA e documenti si ritrovano dalla radice a cui sono legati. Non cambia e non si toglie; in un''installazione PRODUZIONE non nasce (guard dbops.trgfn_etichette_di_prova_guard). L''app la legge e non la scrive. Il presidio dbops.vw_radici_di_prova_in_produzione la guarda. Brief: brief-db-processi-accensione-per-ambiente (R-4).';

              COMMENT ON TABLE dbops.stati_check_dichiarazioni IS
                'Registro del presidio C1 (uno stato previsto dal modello e mai scritto): i valori ammessi dal CHECK di una colonna di stato che il criterio di dbops.vw_stati_check_scrittori non trova scritti da nessuna funzione ne'' dal default, e che restano cosi'' per una DICHIARAZIONE. Il canale dice CHI verifica la riga: APPLICAZIONE = lo scrive un repository Python, lo verifica il test del backend; ESENTE = esente dal criterio per la ragione scritta, lo verifica il pgTAP nel verso DEBITO_ESTINTO. ⚠️ ESENTE non vuol dire «non scritto»: vuol dire che il criterio testuale non lo vede (es. una copia colonna→colonna). E'' un registro e DEVE calare: una riga rientrata va tolta. Brief: brief-db-presidio-stati-mai-scritti §2.4 e §3-bis.4.';

              COMMENT ON TABLE dbops.storico_scope_policy IS
                'La mappa «dove sta l''emittente di questa tabella», una riga per madre storicizzata (chiave schema + tabella). La legge dbops.fn_storico_risolvi_scope quando il trigger di storico scrive una versione: il valore risolto si congela nella shadow (scope_emittente_fiscale_id) e non si ricalcola più — un archivio che cambia col presente non è un archivio. Cinque modi: EF (colonna emittente_fiscale_id in riga), SR (colonna emittente_soggetto_ruolo_id, convertita in EF 1:1), PADRE (si risale via FK e si continua sulla riga del padre, ricorsivamente), BA (un billing account ha esattamente un emittente), NESSUNO (la madre non è protetta: la shadow non si arma e la ragione dice perché). ⭐ È anche il registro del debito: una madre col trigger di storico senza riga, o in RLS con modo NESSUNO, è un rosso di db/pgtap/dbops/test-storico-scope-policy-v1.sql. Brief: brief-db-rls-storico-scope-congelato §4b (D3).';

              COMMENT ON COLUMN dbops.automation_scope.schema_name IS
                NULL;

              COMMENT ON COLUMN dbops.automation_scope.table_like IS
                'Filtro tabellare: ''*all'' = tutte; altrimenti pattern LIKE';

              COMMENT ON COLUMN dbops.audit_log.executed_by IS
                'Ruolo di database che ha eseguito l''operazione (default current_user). ⚠️ È il RUOLO, non l''operatore: zeroerp_app per ciò che passa da Django, il migratore per le automazioni, il ruolo del canale dblink per le righe scritte fuori transazione. L''operatore viaggia nelle GUC app.* e nel tx_id. ⛔ Fino al 2026-09-11 il default era la STRINGA ''CURRENT_USER'' — le righe che portano ancora quella parola sono il pregresso, non ricostruibile e lasciato in chiaro di proposito. Brief: brief-db-rls-storico-scope-congelato §8.4.';

              COMMENT ON COLUMN dbops.audit_sources.storico_table IS
                'Nome qualificato schema.tabella della storico target (es. ''storico.user_override_aree''). Letto solo da script.fn_audit_summary per dispatch dinamico (format %I.%I). NON esposto dalla vista pubblica.';

              COMMENT ON COLUMN dbops.automazione_chiusura_scadenze.verbo_chiusura IS
                'Il verbo che chiude le righe scadute della testata, quando la testata e'' sotto la porta del modello del documento (script.trgfn_doc_stato_solo_dal_verbo): schema.funzione, senza argomenti, ritorna quante righe ha chiuso. NULL = nessuna porta, il job fa l''UPDATE dinamico. Una testata sotto la porta senza verbo e'' una configurazione non valida (E_AUTOMAZIONE_CHIUSURA_CONFIG_INVALIDA). Testo e non regprocedure: che punti a una funzione viva lo controlla il job. Brief: brief-modello-documento-vendita §16 (L-2, Tid 2026-10-28).';

              COMMENT ON COLUMN dbops.automazione_overlap.where_predicate IS
                'Predicato per EXCLUDE parziale (es. ''attivo IS TRUE''). NULL = vincolo totale. Frammento DDL di fiducia, iniettato as-is nel constraint: scrivibile SOLO da DBA, mai da input applicativo. rev 2026-06-02 (refactor-overlap-v2).';

              COMMENT ON COLUMN dbops.coda_lavori.archiviato IS
                'La riga e'' stata MESSA VIA dall''elenco, non spenta. ⭐ Esiste perche'' l''operatore deve poter ripulire la lista delle code senza spostare i numeri che sta leggendo: i conteggi del pannello Esiti fatturazione sono un GROUP BY sullo stato SENZA filtro di visibilita'', quindi una cancellazione li fa calare e un annullamento sposta la ripartizione. ⛔ UN SOLO LETTORE: la lista. Se la leggessero anche claim, drainer o reaper, archiviare diventerebbe un annullamento silenzioso — cioe'' peggio della cancellazione che questa colonna esiste per evitare. ⛔ Non si chiama `disabilitato` (il nome della stessa idea su fatture_log e fatturazione_lotti_log): la'' le righe sono segnali passivi, qui sono LAVORO, e «disabilitato» su una riga di coda si legge «non eseguirlo». ⚠️ Solo una riga NON VIVA si archivia (chk_coda_lavori_archiviato_non_vivo + trg_coda_lavori_a10_archiviazione_upd): archiviarne una viva la lascerebbe nel conteggio del badge e fuori dall''elenco, senza nessun modo di arrivarci. E una riga che TORNA viva (requeue) riabbassa la bandiera da sola. Piano: brief-db-archiviazione-righe-code.';

              COMMENT ON COLUMN dbops.coda_lavori.archiviato_da IS
                'Chi ha messo via la riga: la GUC app.jwt_user (l''utente reale del token), con ripiego su CURRENT_USER fuori dal web — la stessa espressione di script.trgfn_audit_data_user_generic. ⭐ DERIVATA come archiviato_il, dallo stesso trigger. ⚠️ Esiste perche'' l''argomento contro `data_update` vale IDENTICO contro `user_update`: entrambe dicono «l''ultima scrittura, qualunque essa sia», e accettare la coincidenza per l''una rifiutandola per l''altra sarebbe la stessa premessa con due conclusioni diverse (decisione di Tid, 2026-09-04). ⚠️ L''archiviazione vale per TUTTI, non per operatore: questa colonna dice CHI, non A CHI — la riga sparisce dall''elenco di chiunque. Piano: brief-db-archiviazione-righe-code.';

              COMMENT ON COLUMN dbops.coda_lavori.archiviato_il IS
                'Quando la riga e'' stata messa via. ⭐ DERIVATA: la scrive dbops.trgfn_coda_archiviazione, non chi archivia — una colonna scritta a mano potrebbe dire una cosa che `archiviato` smentisce, e nessuno se ne accorgerebbe. ⛔ `data_update` non e'' un sostituto e sembra esserlo: oggi sulle righe terminali non scrive piu'' nessuno, quindi coinciderebbe, ma e'' una coincidenza che regge finche'' nessuno tocca il drainer. La ragione vera non e'' la coincidenza: `data_update` risponde a «quando e'' stata toccata», questa a «quando e'' stata messa via», e sono due domande. ⚠️ Torna NULL quando la bandiera si abbassa: chi alza la bandiera la abbassa, e la data viene dietro. Piano: brief-db-archiviazione-righe-code.';

              COMMENT ON COLUMN dbops.coda_lavori.run_as IS
                'Con o senza EMITTENTE. OPERATORE = il job lavora dentro il perimetro di un emittente, e lo `scope` catturato all''enqueue porta l''identita'' completa di chi l''ha chiesto (RLS attiva, nessun bypass). SISTEMA = nessun emittente: il job tocca solo cio'' che non appartiene a un perimetro (manutenzione del database, amministrazione). ⚠️ Rev 2026-09-04: prima diceva «il worker apre il canale BYPASSRLS» — quel canale si ritira, e il significato che resta vero e'' l''emittente, non il privilegio. L''ATTORE non e'' questa colonna: e'' il codice del processo su maintenance.job_run_log, e ce l''hanno entrambi i valori.';

              COMMENT ON COLUMN dbops.coda_lavori_tipi.processo_codice IS
                'Il processo di dbops.processi a cui questo tipo di job appartiene (hard FK). ⭐ La CLASSE non si ripete qui: si legge da dbops.processi, cosi'' non ci sono due scritture dello stesso fatto che possano dissentire. La usa dbops.fn_accoda_lavoro per rifiutare un job di classe DOMINIO accodato con run_as diverso da OPERATORE — il default per-tipo e'' un suggerimento sovrascrivibile, questo e'' il vincolo. Brief: brief-db-processi-automatici-identita-e-perimetro §5.2.';

              COMMENT ON COLUMN dbops.coda_lavori_tipi.run_as_default IS
                'Default per coda_lavori.run_as se non passato all''enqueue. OPERATORE: il lavoro gira con l''identita'' catturata nello scope e appartiene a un''azienda. SISTEMA: niente scope ne'' azienda; sotto la row level security della coda lo vedono il super admin e l''utente tecnico del drenatore. Sotto un processo CODA di DOMINIO il tipo e'' OPERATORE; sotto un CODA di MANUTENZIONE puo'' essere SISTEMA, con chi preme come attore nel payload; sotto un PGAGENT e'' SISTEMA (pgTAP test-coda-tipi-canale-e-run-as). Il vincolo vero e'' il guard di classe di dbops.fn_accoda_lavoro: un lavoro DOMINIO e'' sempre OPERATORE. rev 2026-11-07.';

              COMMENT ON COLUMN dbops.codici_errore_senza_policy.da_trigger IS
                'La funzione che nomina il codice e'' agganciata a un trigger, quindi il codice sta sul percorso di una richiesta vera e arriva davvero a un utente. Al 2026-08-05: 90 su 141. Serve a dare un ordine alle decisioni — questi vengono prima — non a escludere gli altri.';

              COMMENT ON COLUMN dbops.idempotency_keys.endpoint IS
                'Metodo e percorso della richiesta che ha prenotato la key, senza query string. Obbligatorio: ogni key e'' legata alla richiesta che l''ha prenotata, e si rimanda solo su quella (D7). Brief: brief-be-verifica-documentazione-api D7, §I.5.';

              COMMENT ON COLUMN dbops.idempotency_keys.prenotata_at IS
                'Ora della prenotazione della key, o della sua ultima ripresa (dbops.fn_idempotency_prenota). Una key in_progress piu'' vecchia di SYSTEM_IDEMPOTENZA_IN_CORSO_SECONDI conta come abbandonata e si riprende (D6). Non data_update: quella la riscrive il trigger di audit a ogni UPDATE. Brief: brief-be-verifica-documentazione-api D6.';

              COMMENT ON COLUMN dbops.installazione.ambiente IS
                'SVILUPPO o PRODUZIONE. Si sceglie all''installazione, come parametro della fase post del provisioning, e non cambia piu'': un database di sviluppo contiene dati nati fuori da ogni regola (smoke, prove) e non si certifica pulito; una copia della produzione resta produzione. Brief: brief-db-processi-accensione-per-ambiente (R-2).';

              COMMENT ON COLUMN dbops.messaggi_errore_codici_legacy.codice IS
                'Codice cosi'' come sta in config.messaggi_errore. Esce da questo registro quando viene rinominato secondo convenzione oppure eliminato: in entrambi i casi la riga va TOLTA con un changeSet 80_data, e il controllo (C) del guardrail lo pretende. ⚠️ Convenzione allargata il 2026-08-05 (20260805-28): sono conformi sia `E_` (errori, si sollevano) sia `W_` (warning, si scrivono solo nel log). Un `W_` sollevato darebbe HTTP 500 lato backend, e il controllo (E) del guardrail lo vieta.';

              COMMENT ON COLUMN dbops.presidi.chi_agisce IS
                'Chi puo'' spegnere il presidio. AMMINISTRATORE: si spegne dall''applicazione, quindi chi legge il pannello. SISTEMISTA: server, servizi, schedulatori, ruoli del database. SVILUPPO: serve una modifica al codice o al database. ⭐ E'' un DATO e non una frase dentro `dbops.presidi_testi.azione` perche'' il pannello deve poter distinguere «tocca a te» da «inoltra» e il digest deve poter raggruppare. Obbligatoria su ogni natura tranne INVENTARIO, che non si accende (chk_presidi_chi_agisce_se_allarma, nato in 90_end perche'' il valore lo scrive il mirror del CSV). Brief: brief-db-presidi-cosa-significa-cosa-fare §4.2.';

              COMMENT ON COLUMN dbops.presidi.colonna_variante IS
                'La colonna della vista da cui si legge, per ogni riga, la variante del testo per chi agisce (dbops.presidi_testi.variante). NULL = il presidio ha un testo solo. ⭐ Serve quando le righe della vista sono guasti diversi con rimedi diversi: un testo unico e'' sbagliato per alcune di loro (il 2026-10-09 il presidio dei processi diceva «Esegui ora» a un servizio sempre acceso). ⛔ Il testo generico NON fa da ripiego per una variante senza testo: tornerebbe a dare il rimedio sbagliato, in silenzio. Che la colonna esista nella vista, e che ogni valore che la vista puo'' produrre abbia il suo testo italiano, lo presidiano i pgTAP (dbops/test-presidi-testi-v1 e il test del presidio). Brief: brief-db-presidio-processi-testo-per-causa §3 B.3.';

              COMMENT ON COLUMN dbops.presidi.nota IS
                'Il MOTIVO: perche'' quella natura, e su un debito che cosa lo chiuderebbe. ⛔ NOT NULL e non vuota per vincolo del DATABASE e non per test, come vuole la guida dei presidi §2: e'' l''unica regola che non si puo'' dimenticare di applicare.';

              COMMENT ON COLUMN dbops.presidi.presidiato_da IS
                'Dove il presidio gia'' vive, per la natura CANCELLO: il file del test o del guardrail. Obbligatorio su quella natura — «e'' gia'' presidiata» senza dire dove e'' l''etichetta rassicurante che la guida dei presidi §4-bis dichiara piu'' pericolosa di un errore.';

              COMMENT ON COLUMN dbops.presidi.stato_atteso IS
                'L''unico valore di `colonna_stato` che NON chiede un intervento: l''allarme e'' «diverso da questo». ⛔ Si dichiara lo stato ATTESO e non quelli di allarme, e il verso e'' la scelta portante: elencare gli allarmi e'' permissivo, perche'' uno stato NUOVO aggiunto domani alla vista non sarebbe nell''elenco e cadrebbe nel silenzio — l''unico verso in cui un presidio marcisce senza che nessuno se ne accorga. Cosi'' invece uno stato nuovo cade nell''allarme, e chi lo aggiunge deve venire qui a decidere: e'' la stessa scelta scritta nel COMMENT di dbops.vw_processi_programmazione per la colonna `da_guardare`. ⭐ E prende gratis il caso a piu'' valori: su dbops.vw_rls_perimetro_scoperto gli stati sono tre, e «diverso da DEBITO_DICHIARATO» prende sia NON_DICHIARATO (un allarme) sia DEBITO_ESTINTO (una riga di registro da togliere) senza nominarli.';

              COMMENT ON COLUMN dbops.presidi_testi.variante IS
                'NULL = il testo del presidio. Valorizzata = il testo delle righe della vista la cui colonna dbops.presidi.colonna_variante ha questo valore (per il presidio dei processi: la `causa`). ⛔ Il generico non fa da ripiego per una variante che manca: darebbe il rimedio sbagliato, in silenzio — e'' il difetto del 2026-10-09. Non vuota per vincolo. Brief: brief-db-presidio-processi-testo-per-causa §3 B.2.';

              COMMENT ON COLUMN dbops.processi.accendibile_in_produzione IS
                'Se in un''installazione di PRODUZIONE la sveglia del processo si puo'' accendere a mano. false per un processo che li'' non deve girare mai, per esempio perche'' scrive dati di prova (smoke_notturno): la scelta a mano accesa e'' rifiutata (E_PROCESSO_NON_ACCENDIBILE_IN_PRODUZIONE) e, se c''e'' gia'', lo stato effettivo la ignora. Il gemello di spegnibile. Un non accendibile e'' spento di default in produzione (chk_processi_accensione). In SVILUPPO non conta. NULL per i processi senza sveglia (CODA, ritirati). La regola: dbops.fn_accensione_a_mano_ammessa_su_valori. Brief: brief-db-processi-accensione-per-ambiente (R-BE-5).';

              COMMENT ON COLUMN dbops.processi.acceso_in_produzione IS
                'Se la sveglia del processo e'' accesa di default in un''installazione di PRODUZIONE. NULL per i processi senza sveglia (CODA, ritirati). La scelta a mano di una macchina (dbops.processi_accensione) lo scavalca. Brief: brief-db-processi-accensione-per-ambiente (A-2).';

              COMMENT ON COLUMN dbops.processi.acceso_in_sviluppo IS
                'Se la sveglia del processo e'' accesa di default in un''installazione di SVILUPPO (dbops.installazione.ambiente). NULL per i processi senza sveglia (CODA, ritirati). La scelta a mano di una macchina (dbops.processi_accensione) lo scavalca. Brief: brief-db-processi-accensione-per-ambiente (A-2).';

              COMMENT ON COLUMN dbops.processi_bersagli.debito_dichiarato IS
                'Dice se la comparsa di questa riga in un presidio e'' ATTESA. ⛔ Chiude una contraddizione: la descrizione delle viste diceva «DEVE restare vuota» mentre il seed diceva «riga attesa finche'' il cantiere non chiude» — e un presidio sempre acceso viene ignorato, quindi il giorno in cui compare una riga VERA nessuno la distingue dal rumore. ⭐ Una colonna e non un elenco dentro la vista: i bersagli crescono coi processi, e un elenco in una vista invecchia il giorno dopo — e si aggiornerebbe con un changeSet invece che col CSV. ⚠️ Il PERCHE'' sta in `note`: questo flag risponde a una domanda sola. ⛔ Il default e'' false, ed e'' la parte che protegge: un bersaglio nuovo nasce NON dichiarato, quindi se finisce in un presidio e'' un allarme. Brief: brief-db-processi-automatici-residui-be, DB-2.';

              COMMENT ON COLUMN dbops.processi.canale IS
                'Chi fa partire il processo. PGAGENT: lo scheduler del database. COMMAND: una persona o un cron. CODA: un operatore che lo accoda dall''applicazione, e il lavoro porta la SUA identita''. ⭐ CODA_AUTOMATICA (rev 2026-09-05): passa dalla coda, ma a metterlo in coda e'' un automatismo — quindi nessuno gli presta un nome, e l''identita'' tecnica gli serve come a un job di pgAgent. ⚠️ Non e'' CODA_SISTEMA: un lavoro di dominio va accodato con run_as = OPERATORE anche qui (lo pretende il guard di classe in dbops.fn_accoda_lavoro). Cio'' che distingue non e'' COME gira, ma CHI lo mette in coda. Brief: brief-db-processi-automatici-residui-be, sezione 1-quater (R-E, strada B).';

              COMMENT ON COLUMN dbops.processi.causa_fallimento IS
                'Di che natura sono i fallimenti di questo processo quando l''ambiente e'' sano (dbops.cause_fallimento): PROGRAMMA se un suo rosso chiede una modifica al codice, AMBIENTE se chiede un intervento sul server o sui ruoli del database, CONFIGURAZIONE se si sistema dalle impostazioni dell''applicazione. maintenance.vw_job_run_da_guardare la usa come ultima parola: prima vengono la corsa morta senza chiudersi e lo SQLSTATE dell''ambiente (AMBIENTE), poi il codice d''errore che dichiara la sua causa (config.codici_errore.causa_fallimento). Obbligatoria su ogni processo, anche CODA e ritirati (NOT NULL e FK in 90_end). Seed: 80_data/sql/dbops/processi.csv. Brief: brief-db-presidio-job-run-a-chi-tocca.';

              COMMENT ON COLUMN dbops.processi.ci_esclusione IS
                'Perche'' il job pgAgent NON gira nella convergenza strutturale in CI (job operativo su dati e orologio, oppure con un giro suo altrove). Distingue «fuori apposta» da «dimenticato». Brief: brief-db-job-notturni-in-ci.';

              COMMENT ON COLUMN dbops.processi.ci_ordine IS
                'Posizione del job nella convergenza strutturale eseguita in CI (90_end/ci_apply/20260926-10), in ordine crescente. Valorizzata insieme a ci_procedura, in alternativa a ci_esclusione, per ogni processo con un job pgAgent. Brief: brief-db-job-notturni-in-ci.';

              COMMENT ON COLUMN dbops.processi.ci_procedura IS
                'La procedura che il job pgAgent chiama, per esteso con la firma (es. maintenance.proc_automations_attivo_job()): la convergenza in CI fa CALL di questa. Non si deriva dal codice del processo. Brief: brief-db-job-notturni-in-ci.';

              COMMENT ON COLUMN dbops.processi.corsa_verdetto_completo IS
                'Ogni corsa di questo processo e'' un VERDETTO COMPLETO: ricontrolla tutto il suo perimetro, quindi un verde chiude i rossi che lo precedono. Il criterio: dopo un verde, resta qualcosa che il rosso aveva lasciato e il verde non ha ricontrollato? Se si'', false (le code, l''invio mail, la fatturazione batch: un elemento fallito resta fallito, la corsa dopo ne lavora altri). Lo legge maintenance.vw_job_run_da_guardare: per un verdetto completo il motivo «intermittente» scatta solo se il lavoro e'' RICADUTO dopo essere tornato verde (almeno due tratti rossi nei sette giorni, cioe'' instabile), e una corsa in corso da meno di un''ora non conta finche'' non chiude. Con false la vista resta com''era: un rosso negli ultimi sette giorni basta. Vale per ogni corsia del processo (jobname): ognuna dev''essere completa sul proprio perimetro. Seed: 80_data/sql/dbops/processi.csv. Brief: brief-db-intermittente-e-verdetto-completo.';

              COMMENT ON COLUMN dbops.processi.jobname_pgagent IS
                'Il nome del job pgAgent che sveglia questo processo. ⛔ NON e'' derivabile dal codice: misurato il 2026-09-06, due job su quattordici hanno un nome diverso da quello che registrano nel giornale — il job automations_cleanup_weekly chiama un wrapper che registra come automations_cleanup. Niente e'' rotto (giornale e registro concordano), ma un presidio costruito sul join per nome sarebbe nato con due falsi allarmi, e un presidio che grida a vuoto viene spento. ⚠️ NULL non e'' un dato mancante: significa «questo processo non lo sveglia pgAgent» — i COMMAND li programma crontab, fuori dal database, e i CODA li sveglia il backend. ⚠️ Nessuna FK verso pgagent.pga_job: in CI quella tabella non esiste (85_pgagent e'' MARK_RAN) e una FK la renderebbe un prerequisito strutturale. Il legame lo verifica dbops.vw_processi_programmazione: se il job nominato non c''e'', la riga lo dice invece di sparire.';

              COMMENT ON COLUMN dbops.processi.segno_di_vita IS
                'DOVE il database cerca il segno di vita del processo. GIORNALE (default): l''ultima corsa su maintenance.job_run_log, confrontata con tolleranza_minuti — e'' la forma dei timer. SESSIONE: una connessione VIVA in pg_stat_activity con application_name = codice — e'' la forma dei servizi sempre accesi, come un listener LISTEN/NOTIFY, che scrivono un solo run all''avvio (decisione di Tid del 2026-09-05, che RESTA). ⭐ Una sessione e'' un FATTO, non una dichiarazione: se il processo muore la sessione sparisce, se sta riconnettendo non c''e'' — ed e'' vero. Niente battito sul giornale (che e'' il giornale delle CORSE), niente tabella nuova. application_name si legge da qualunque ruolo senza pg_read_all_stats (verificato 2026-09-11). ⚠️ Il backend deve presentarsi con application_name = codice del processo: e'' una riga in notify_listener._get_conninfo(). Per SESSIONE la tolleranza e'' NULL (chk_processi_sessione_senza_tolleranza): la domanda e'' «c''e'' ADESSO?». Brief della sveglia §8.6: «che sia un listener il database non lo sa… se serve, e'' una colonna». Serviva. rev 2026-09-11.';

              COMMENT ON COLUMN dbops.processi.spegnibile IS
                'Se la sveglia del processo si puo'' spegnere. false quando, spento, si rompe la sicurezza o la correttezza dei dati senza che nessuno se ne accorga (A-5): un non spegnibile e'' acceso di default in tutti e due gli ambienti (chk_processi_accensione), la scelta a mano non lo spegne (E_PROCESSO_NON_SPEGNIBILE) e lo stato effettivo non legge l''ambiente. NULL per i processi senza sveglia. Brief: brief-db-processi-accensione-per-ambiente (A-5).';

              COMMENT ON COLUMN dbops.processi.tolleranza_minuti IS
                'Il CONTRATTO di liveness del processo: «se sto bene, lascio un segno di vita almeno ogni N minuti». NULL = la liveness non si presidia da qui (un timer spento per decisione, un processo a SESSIONE, i PGAGENT che hanno la programmazione in pgagent.*). ⭐ Sta a CATALOGO e non nel deploy (rev 2026-09-11, decisione di Tid) perche'' il lettore che serve vive nel database: il guardiano del digest e'' un job pgAgent e legge solo qui. Una sede sola: il campo tolleranza_minuti ESCE da backend/deploy/sveglie.json. ⚠️ Non e'' indipendente dalla cadenza: la tolleranza e'' il contratto, la cadenza (oncalendar, nel deploy) e'' come l''host lo onora — e un timer piu'' lento della tolleranza lo viola. Quella verifica e'' del backend, sul JSON. ⛔ LIMITE DICHIARATO: il catalogo non sa quali processi sono ACCESI su questo host. Oggi ogni sveglia accesa e'' universale e run_fatturazione_batch e'' spento per decisione di prodotto (NULL); un processo acceso su un host e spento su un altro vorra'' un registro di silenziamento, non una colonna nel JSON. Solo sui COMMAND (chk_processi_contratto_solo_command). Lo legge dbops.vw_processi_programmazione: un COMMAND con contratto e'' OK, MUTO o MAI_PARTITO — non piu'' FUORI_PORTATA.';

              COMMENT ON COLUMN dbops.request_log.emittente_attivo_id IS
                'anagrafiche.emittenti_fiscali.id su cui l''utente stava operando (GUC app.current_emittente_id). NULL = nessuna impersonazione. Nessuna FK deliberata: log ad alto volume con purge, un record storico non deve impedire di rimuovere un emittente. Insieme a storico.user_emittente_attivo copre l''audit del brief: qui i tentativi, anche respinti (status 403), nella gemella storica i cambi riusciti.';

              COMMENT ON COLUMN dbops.stati_check_dichiarazioni.canale IS
                'Chi verifica la dichiarazione. APPLICAZIONE = il valore lo scrive un repository Python (anche passandolo come parametro a una funzione): il test del backend pretende il letterale in un .py non di test che nomini la tabella o uno dei suoi scrittori, e fa rosso se sparisce. ESENTE = il criterio non lo vede per la ragione scritta (cantiere aperto, tabella senza scrittori, copia da un''altra colonna): il pgTAP fa rosso se uno scrittore compare a DB (DEBITO_ESTINTO). ⭐ Il CHECK e'' la sorgente da cui il pgTAP legge i canali ammessi.';


              COMMENT ON INDEX dbops.ix_error_log_area_occurred_at IS
                'Filtro `area` (esatto) della consultazione di error_log, con il tempo in coda per l''ORDER BY. Da solo o insieme a function_name (il planner sceglie il piu'' selettivo). P-3 di brief-db-osservabilita-lotto-fermo-r6-indici (2026-09-19).';

              COMMENT ON INDEX dbops.ix_error_log_function_name_occurred_at IS
                'Filtro `function_name` della consultazione di error_log, esatto o a PREFISSO. ⛔ text_pattern_ops: la collation del database e'' it_IT.UTF-8 e un btree ordinario non serve `LIKE ''x%''`; serve `=` e `LIKE ''x%''`, MAI ILIKE — il backend filtri con LIKE (i nomi di funzione sono minuscoli per convenzione). P-3 di brief-db-osservabilita-lotto-fermo-r6-indici (2026-09-19).';

              COMMENT ON INDEX dbops.ix_error_log_occurred_at IS
                'La finestra data_da/data_a della consultazione di error_log (pezzo E): il filtro sempre presente e la prima pagina (ORDER BY occurred_at DESC LIMIT n). P-3 di brief-db-osservabilita-lotto-fermo-r6-indici (2026-09-19).';

              COMMENT ON INDEX dbops.ix_error_log_tx_id IS
                'Il PONTE dal giornale (script.vw_giornale_entita.tx_id) agli appunti tecnici della stessa transazione: lettura esatta, tx_id NOT NULL. P-3 di brief-db-osservabilita-lotto-fermo-r6-indici (2026-09-19).';

              COMMENT ON VIEW dbops.vw_af_senza_giro IS
                'Attivita'' fatturabili libere e non fatturate che NESSUN GIRO ha marchiato (emit_batch_id NULL). ⭐ Deve restare vuota, ed e'' la controparte obbligatoria del marchio introdotto dal 20260904-31: il rimedio a D1 trasforma un danno RUMOROSO (una fattura di troppo, che si vede) in uno MUTO (una fattura che non nasce, e nessuno se ne accorge) — questa vista e'' cio'' che lo rende di nuovo visibile. ⭐ Nasce PIENA: e'' il registro del debito, e cala da sola perche'' il pull ri-adotta le righe esistenti e ci scrive sopra il proprio giro. ⛔ Non si esclude il pregresso per farla partire verde: quelle righe sono esattamente la popolazione del difetto. ⚠️ NON elenca il lavoro mai entrato in fatturazione (una commessa che nessun giro ha pullato non ha righe qui): quella domanda ha gia'' la sua superficie nella lane. Piano: brief-residuo-fatturabili-e-bandiere-esito-parziale, sezione 9.';

              COMMENT ON VIEW dbops.vw_ambiente_non_dichiarato IS
                'PRESIDIO: una riga se questa installazione non ha ancora dichiarato il suo ambiente (dbops.installazione vuota). DEVE restare vuota. La tabella nasce vuota di proposito (nessun default da un changeSet, R-2): l''ambiente lo scrive la fase post di scripts/sql/provision_zeroerp.sql con -v ambiente=SVILUPPO|PRODUZIONE, una volta. Finche'' manca, script.fn_ambiente_installazione() da'' E_CONFIG_MANCANTE: il provisioning di sviluppo non parte e le sveglie spegnibili falliscono. Questo presidio dice la causa una volta, a chi la sistema. Il panorama dei processi non ha una causa per questo: un fatto, un presidio. Legge script.fn_ambiente_dichiarato(), che non solleva. Brief: brief-db-processi-accensione-per-ambiente (R-2).';

              COMMENT ON VIEW dbops.vw_articoli_a_magazzino_prontezza IS
                'Presidio di PRONTEZZA del magazzino (brief modifiche certe sezione 7, D-L2-k): UNA riga, stato = MARCATI se esiste almeno un articolo attivo con gestito_a_magazzino, altrimenti NESSUNO_MARCATO. Esiste perche'' al rilascio nessun articolo e'' gestito (default false, fail-safe) e senza una spia il magazzino resterebbe un mobile vuoto senza che nessun rosso lo dica. In presidi.csv: natura ZERO, colonna_stato = stato, stato_atteso = MARCATI — fn_conta_presidio conta le righe IS DISTINCT FROM MARCATI: lo zero suona, il pieno tace. catalogo.articoli non ha RLS: perimetro LIBERO. Cadenza SETTIMANALE: una condizione di prontezza, non un incidente. Brief: brief-db-magazzino-lotto-2-motore, sezione 4.8.';

              COMMENT ON VIEW dbops.vw_audit_log_scrittori_fuori_perimetro IS
                'CANCELLO — deve restare VUOTA. Le funzioni che scrivono in dbops.audit_log (DML diretto, o via la porta dbops.fn_audit_log_once) e che stanno FUORI dal perimetro dichiarato nella vista stessa: dbops e maintenance. dbops.audit_log è un registro TECNICO — le automazioni e gli strumenti DBA, letto dall''amministrazione — e non deve poter contenere dati di dominio (decisione §8.3, brief brief-db-rls-storico-scope-congelato, 2026-09-11): il presidio giusto non è una policy di perimetro sul registro ma impedire alla fonte che una funzione di vendite, anagrafiche, pagamenti ci scriva. Una riga qui fa rosso db/pgtap/dbops/test-audit-log-perimetro-scrittori-v1.sql, che gira in CI. Allargare il perimetro è un changeSet su questa vista. Il corpo si legge con dbops.fn_corpo_funzione: senza commenti, con i letterali intatti, e anche per le funzioni SQL BEGIN ATOMIC. Le letture del registro non contano; la porta è esclusa per nome. security_invoker: legge solo il catalogo.';

              COMMENT ON VIEW dbops.vw_bersagli_non_dichiarati IS
                'Il cancello del vocabolario dei bersagli: ogni tipo scritto in un corpo vivo leggibile, plpgsql o sql (dbops.fn_corpo_leggibile), che costruisce un bersaglio (commenti esclusi) e che config.tipi_entita non dichiara — motivo ASSENTE — o dichiara come ritirato — motivo OBSOLETO, perche'' un bersaglio NUOVO verso una voce ritirata manda l''operatore dove il progetto ha smesso di andare. ⭐ E'' cio'' che rende sicura la decisione di far crescere il catalogo UNA VOCE PER VOLTA insieme al messaggio che la usa (Tid, 2026-08-22): dimenticare la voce fa fallire la BUILD, non l''operatore. ⚠️ Gemella di dbops.vw_codici_errore_da_dichiarare, che legge il SORGENTE — e NON di dbops.vw_eventi_non_dichiarati, che legge i dati perche'' quei codici li scrive Python: qui il bersaglio lo scrive il database, quindi la misura giusta e'' pg_proc. Una vista sui dati sarebbe cieca su un ambiente senza traffico, e da una misura cieca non si puo'' far dipendere una build. ⚠️ Non vede i tipi costruiti per concatenazione o passati in una variabile: stesso limite della gemella, e la stessa scelta — fra i due errori possibili si preferisce quello che si corregge guardando i falsi positivi. ⛔ E il rubinetto non si chiude con una FK: il bersaglio vive in un jsonb, e comunque il canale d''errore non puo'' smettere di funzionare perche'' manca una voce di catalogo — il bersaglio storto si perde (W_BERSAGLIO_MALFORMATO) e l''errore di dominio parte lo stesso.';

              COMMENT ON VIEW dbops.vw_coda_lavori_da_guardare IS
                'I lavori di coda che chiedono un occhio: falliti (ERRORE), presi e mai chiusi (IN_CORSO da oltre un''ora: il worker e'' morto a meta''), o mai presi (PENDING da oltre un''ora: ⛔ il worker non sta girando). DEVE restare VUOTA. ⭐ Esiste PRIMA della migrazione dei processi di dominio dalla coda, e non dopo: l''argomento per lasciare pgAgent e'' che pgAgent non racconta i suoi fallimenti — apply_storicizza_weekly e'' morto ogni settimana per sei mesi e lo si e'' scoperto per caso (R-12). ⛔ Ma la coda senza questa vista non era meglio: 4 lavori in ERRORE e nessuno a nominarli. Spostarci il lavoro prima avrebbe TRASFERITO il silenzio invece di toglierlo. ⚠️ Il terzo motivo e'' il piu'' importante e il meno visibile: un worker spento non produce errori, produce ASSENZA. ⚠️ Le soglie di un''ora non vengono da una misura ma dal fatto che il drenatore gira di continuo: una soglia dedotta dai tempi di oggi si taglierebbe addosso al carico di oggi. ⛔ Fuori ANNULLATO (deciso da qualcuno) e archiviato (gia'' guardato): un presidio che elenca cio'' che qualcuno ha gia'' visto smette di essere una lista di cose da fare.';

              COMMENT ON VIEW dbops.vw_codici_errore_argomenti_trigger IS
                'SEDE UNICA della lettura «i codici E_* che un trigger passa alla sua funzione negli argomenti» (pg_trigger.tgargs, tagliati da dbops.fn_trigger_argomenti): una riga per (trigger, argomento) che e'' per INTERO un codice (^E_[A-Z0-9_]+$ — una sottostringa no: ORDINE_VENDITA non e'' E_VENDITA). Serve ai building block trigger che ricevono il codice da TG_ARGV (trgfn_lock_columns, trgfn_doc_*_lock_fuori_bozza, trgfn_doc_guard_emittente_ba…), che il corpo della funzione non nomina.
              LETTORI: dbops.vw_punti_canale_campo (presidio C2) e dbops.vw_codici_errore_da_dichiarare (misura del terzo lato). Prima tutti e due cercavano i codici solo nel corpo, e per loro questi siti non esistevano.
              tabella e funzione sono TESTO schema.nome (un regclass in colonna si stampa col search_path di chi legge); posizione parte da 1, come fn_trigger_argomenti. ⚠️ Riconosce la forma di un codice di progetto, non la grammatica di un BB: un BB che passasse i codici in una lista va letto dalla funzione di grammatica che usa il trigger stesso. Origine: D24 di migliorie-generali-da-test-valutazione.';

              COMMENT ON VIEW dbops.vw_codici_errore_da_dichiarare IS
                'Misura canonica del "terzo lato" del presidio sui codici errore: ogni codice E_* nominato da un corpo vivo leggibile, plpgsql o sql (dbops.fn_corpo_leggibile; commenti esclusi) o passato da un trigger alla sua funzione negli ARGOMENTI (dbops.vw_codici_errore_argomenti_trigger, rev 20261103-03), con da_trigger = la funzione che lo nomina e'' agganciata a un trigger, quindi sta sul percorso di una richiesta. ⚠️ VOLUTAMENTE LARGA: raccoglie ogni letterale, non solo quelli dentro una chiamata a fn_log_and_raise_error, perche'' restringere perderebbe i codici che arrivano da espressione (gruppo C: v_motivi -> 0 ->> ''codice'') — 19 codici, 4 dei quali senza policy. Fra i due errori possibili si sceglie quello che si corregge guardando i falsi positivi, non quello che non si vede. Prima della rev 20261103-03 non vedeva i codici dei building block trigger che li ricevono da TG_ARGV (30 al 2026-11-03, D24). Non vede: codici costruiti per concatenazione, e i RAISE EXCEPTION diretti che non passano dall''helper. Brief: brief-db-be-terzo-lato-presidio-codici.md.';

              COMMENT ON VIEW dbops.vw_codici_errore_forme_condizione IS
                E'Misura degli accumulatori sulla FORMA DELLA CONDIZIONE al punto che solleva (non sul dominio della funzione: quell''asse segnalava E_VALIDAZIONE, che e'' il caso su cui la risposta e'' no). NON filtra di proposito.
              TRE query canoniche, da usare INSIEME.
              (1) CANDIDATI — SELECT codice, n_punti, famiglie FROM dbops.vw_codici_errore_forme_condizione WHERE n_famiglie_note > 1 ORDER BY n_punti DESC;
              (2) COPERTURA, senza cui la (1) si legge come una verita'' — SELECT count(*) AS codici, count(*) FILTER (WHERE NOT solo_ignoto) AS classificati, count(*) FILTER (WHERE solo_ignoto) AS invisibili FROM dbops.vw_codici_errore_forme_condizione;
              (3) LA CLASSE E'' ANCORA VERA? incrocia le due letture indipendenti dello stesso codice — la guardia (cosa FA il punto) e la classe (cosa DICE il catalogo). E'' la query che ha trovato E_ERRORE_PARAMETRI, 4 punti su 13 che dicevano il falso:
                  SELECT unnest(f.famiglie) AS famiglia, c.classe, count(*) AS codici
                    FROM dbops.vw_codici_errore_forme_condizione f
                    JOIN config.codici_errore c USING (codice)
                   WHERE NOT f.solo_ignoto AND c.obsoleto_dal IS NULL
                   GROUP BY 1,2 ORDER BY 1, 3 DESC;
              COME SI LEGGE LA (3): le righe famiglia = IGNOTO NON sono una famiglia, sono la misura che dichiara di non saper leggere quella guardia — vanno lasciate (toglierle farebbe sembrare piena la copertura) ma non lette come un incrocio. E "fuori dominante" non vuol dire sbagliato: NOT_FOUND ha 19 codici su NON_TROVATO e 20 altrove, e la maggioranza dei 20 e'' deliberata ("guard parametro NULL riconducibile a NOT FOUND", scritto dentro le funzioni). E'' una lista DA GUARDARE, non una lista di difetti.
              ⭐ FAMIGLIA VALORE_ATTESO, dal 2026-09-07 — «il valore letto non e'' quello ammesso» (x <> ''LETTERALE''), che e'' la forma di ogni guardia di STATO o di PERIMETRO del progetto. Non era un caso di nicchia: era una famiglia intera che l''asse non nominava, e finiva tutta in IGNOTO. ⛔ E'' una famiglia NUOVA e non un ENUM allargato di proposito: le letture di questa vista sono datate e si confrontano nel tempo, quindi cambiare che cosa significa ENUM renderebbe la lettura del 2026-08-08 incomparabile con la prossima, in silenzio. ⚠️ L''ordine del CASE la mette DOPO ENUM e PARAMETRO: un NOT IN resta ENUM, e una guardia su un parametro nullo resta PARAMETRO anche se confronta un letterale.
              ⚠️ IMPRECISIONE DICHIARATA, perche'' si scopre subito e vale la pena saperlo prima: la forma prende anche del normale control-flow che capita entro 25 righe da un RAISE — IF TG_OP = ''DELETE'', IF v_id_type = ''uuid''. Sta dentro la natura gia'' dichiarata di questa vista (una MISURA, non un cancello), ma non e'' zero: chi legge la (1) guarda i codici, non da'' per buono il conteggio.
              ⭐ PERCHE'' E'' STATA FATTA, ed e'' il caso che la giustifica: E_VALIDAZIONE leggeva famiglie {IGNOTO, PARAMETRO} con n_famiglie_note = 1, quindi NON compariva nella query (1), che filtra > 1. La sua seconda forma era la terza guardia di config.fn_chiudi_email_sistema — «qualcuno sta usando la porta di sistema per l''email di un''azienda», cioe'' il punto piu'' pericoloso di quella funzione. Il rubinetto era cieco su qualunque codice la cui seconda forma fosse una che il classificatore non sapeva leggere. Segnalato dal backend: brief-db-sveglia-dei-processi §3.2, risposta §8.4.
              Letture datate. Al 2026-08-08: 344 codici, 75 classificati, 269 invisibili. Al 2026-09-06, prima di VALORE_ATTESO: 453 codici, 96 classificati, 357 invisibili — il buco cresceva. Subito dopo, sugli stessi 453: 148 classificati, 305 invisibili, e i candidati della (1) passano da 6 a 10. E'' una MISURA, non un cancello: un codice legittimamente trasversale esiste. Implementazione a window function (20260808-01): 349 ms, contro i 145 secondi della prima versione a sottoquery correlate.
              ⭐ FORMA «CODICE NOMINATO IN UN MOTIVO», dal 2026-09-08 — nel pattern linee-guida-sql §12.5 («la madre CHIAMA la check») il letterale E_* sta DENTRO la fn_check_*, dove nessuna chiamata a fn_log_and_raise_error gli sta vicino: 35 codici su 50 codici-motivo erano invisibili a questa vista, e quindi al rubinetto degli accumulatori B-7. Adesso e'' un punto anche la riga che DICHIARA un motivo (''codice'', ''E_...''), e la guardia si prende dall''IF che la precede DENTRO la check — dov''e'' la condizione vera. ⛔ NON si risale dalla chiamata alla check, ed e'' l''errore da non rifare: sopra il punto che SOLLEVA la guardia e'' sempre «IF jsonb_array_length(v_motivi) > 0», identica ovunque e muta sul perche''; attribuirle i codici li archivierebbe tutti sotto IGNOTO, che lo snapshot del rubinetto scarta (WHERE NOT solo_ignoto) — zero candidati nuovi e una copertura che SEMBRA cresciuta. ⚠️ Il marcatore e'' per FORMA e non per nome di funzione: prende allo stesso modo le due righe di fn_available_actions_* che dichiarano un motivo, ed e'' giusto cosi'' — un perimetro scritto a elenco invecchia da solo. Lettura datata 2026-09-08: da 455 a 486 codici e da 150 a 155 classificati; 5 codici passano da invisibili a leggibili, 1 (E_DDT_CAUSALE_OBBLIGATORIA) acquista una famiglia nota.
              ⭐ PARAMETRO NON SI LEGGE SU UN CAMPO DI UN RECORD, dal 2026-09-09 — «IF p_ddt.causale_trasporto_id IS NULL» non e'' una guardia di parametro: p_ddt e'' il documento, causale_trasporto_id un suo CAMPO, e la condizione e'' «manca la causale», cioe'' un dato che una persona correggge. La regola vecchia bastava un ''\\mp_\\w+'' qualunque sulla riga e la leggeva PARAMETRO. ⛔ Non e'' un''imprecisione fra le altre: PARAMETRO significa «chi ha chiamato e'' rotto» ed e'' l''asse TECNICO/500, mentre quella e'' DATO_ERRATO/400 — il classificatore confondeva le due cose proprio sull''asse per cui esiste. Adesso il p_ deve NON essere seguito da un punto; se sulla riga c''e'' anche un parametro vero, resta PARAMETRO. Chi non si legge piu'' cade in IGNOTO, che e'' la risposta onesta. ⚠️ Misurato prima di farlo: UNA sola riga di guardia in tutto il database aveva questa forma (script.fn_check_ddt_emittibile), quindi il perimetro era noto e non e'' un criterio cambiato al buio. Effetto: E_DDT_CAUSALE_OBBLIGATORIA torna a una famiglia sola e la baseline B-7 non si tocca. Presidiato dai test 7-8 di db/pgtap/dbops/test-vw-codici-errore-motivo-nominato.sql.
              ⭐ TUTTI I CODICI DI UNA RIGA, E IL CORPO SENZA COMMENTI, dal 2026-11-04 — una riga che nomina due codici (''E_A'' e ''E_B'' nello stesso IF o nello stesso motivo) dava un punto al primo e perdeva il secondo: adesso ogni codice distinto della riga e'' un punto, con la stessa guardia. E le righe si tagliano dal corpo letto da dbops.fn_corpo_funzione, senza commenti e con i letterali intatti: prima si scartavano solo le righe che COMINCIANO con --, quindi un codice in un commento a blocco o in coda a una riga contava come punto. ⚠️ Le distanze (6 righe per la chiamata vicina, 25 dalla guardia) cambiano solo dove c''era un commento a blocco su piu'' righe, che non le allunga piu''; un commento di riga lascia il suo a capo, e la riga vuota conta come prima. Al 2026-11-04 la misura non cambiava una riga sul codice vivo: le letture datate restano confrontabili, e la baseline B-7 non si e'' mossa.
              ⚠️ PERIMETRO: il solo plpgsql, di proposito, a differenza delle viste sorelle sui codici (dbops.vw_codici_errore_da_dichiarare, dbops.vw_punti_canale_campo, dbops.vw_funzioni_check_codici, dbops.vw_punti_primo_motivo, dbops.vw_bersagli_non_dichiarati), che leggono ogni corpo leggibile (dbops.fn_corpo_leggibile). Questa vista riconosce la guardia dalle righe IF / ELSIF / ELSE / EXCEPTION WHEN, e una funzione sql non le ha: la sua condizione sta in un WHERE o in un CASE, e letta con questa grammatica non darebbe punti, ne'' giusti ne'' sbagliati. Una funzione sql che solleva un codice resta visibile nella misura dei codici (dbops.vw_codici_errore_da_dichiarare).';

              COMMENT ON VIEW dbops.vw_credenziali_da_sanare IS
                'Presidio ZERO delle credenziali. NESSUNA_VESTE: la credenziale non ha alcuna veste, nemmeno spenta (anagrafiche.vw_accessi_altri.nessun_accesso: una regola sola); una credenziale con sole vesti spente e'' una persona disattivata e non entra (V-3). PERSONA_E_SISTEMA: vesti di persona e di macchina sulla stessa credenziale (script.fn_veste_di_sistema), che il guard trgfn_identita_digitali_guard_natura_credenziale rifiuta: escono le righe nate prima del guard e quelle di una gara fra transazioni. NESSUNA_VESTE si sana dando una veste alla credenziale o cancellandola (spegnerla in Django non basta: resta una credenziale senza veste); PERSONA_E_SISTEMA separando le due nature su due credenziali. Brief: brief-db-be-fe-area-accessi (R-DB-2).';

              COMMENT ON VIEW dbops.vw_ddt_trasferimenti_consegnati_senza_arrivo IS
                'Presidio, DEVE restare vuota. Una riga e'' una bolla di TRASFERIMENTO (vendite.fn_ddt_causale_magazzino = TRASF_OUT) che muove merce (vendite.fn_ddt_muove_merce), con un magazzino, in uno stato dalla consegna in poi (ordine >= quello di CONSEGNATO e non abortito, dal catalogo config.stati_doc_ddt), con almeno un prelievo di una riga attiva senza la sua ENTRATA nel magazzino d''arrivo (provenienza DDT_VENDITA: la bolla, la riga, il prelievo come dettaglio; quantita'' positiva, non uno storno). Alla consegna il verbo vendite.fn_cambia_stato_ddt scrive un arrivo per prelievo (vendite.fn_posta_ddt ARRIVO, TRASF_IN): una riga qui e'' merce uscita dalla partenza e mai entrata a destinazione, cioe'' due giacenze che mentono. prelievi_senza_arrivo dice quanti. Il rimedio non e'' scrivere il movimento a mano: e'' capire da dove e'' passata la consegna. Gemella di dbops.vw_ddt_emessi_senza_scarico sull''altro capo del trasferimento. security_invoker; il digest conta da proprietario (fn_conta_presidio, perimetro DEFINER). Brief: brief-db-sorgente-documento-e-riga lotto M (decisione C di Tid, 2026-11-08).';

              COMMENT ON VIEW dbops.vw_diag_v_clienti_links IS
                'Diagnostica dei legami di un cliente: billing account, istanza utility, soggetto e tipo ruolo, con i tre flag ba_match_* che dicono dove il legame si rompe. security_invoker=on: legge nel perimetro di chi interroga. ⭐ rev 2026-08-29 (brief-db-be-iva-risolutore-e-regime-cliente, I0-B): fuori il blocco IVA (iva_id/iva_codice/iva_descrizione e il LEFT JOIN su config.iva). Era l''unica vista del database che leggeva anagrafiche.clienti.iva_id, colonna rimossa da 20260829-17 perché non aveva più un lavoro: l''aliquota la decide la merce, e il regime del soggetto passa da un titolo documentato. Il blocco non viene sostituito perché non rispondeva alla domanda di questa vista.';

              COMMENT ON VIEW dbops.vw_email_da_guardare IS
                'PRESIDIO: le email che la coda deve a qualcuno da oltre un''ora e che nessuno ha preso in mano. DEVE restare VUOTA. ⭐ Si presidia l''EFFETTO e non lo schedulatore: se send_pending_emails non gira (o gira e non svuota) le email si accumulano qui, e questo prende anche il timer mai installato — che e'' esattamente cio'' che era successo su backend-dev senza che nessuno se ne accorgesse. ⭐ La definizione di «in coda» NON e'' scritta qui: sta in config.vw_email_in_coda, una volta sola, per il cron e per questo presidio; qui c''e'' SOLO la soglia. ⚠️ Un''ora non deriva dalla cadenza del cron (5 minuti): una soglia dedotta dai tempi di oggi si taglierebbe addosso al carico di oggi. Il backoff dei RETRY e'' rispettato per costruzione, perche'' dovuta_dal misura da quando la riga era DOVUTA e non da quando e'' nata. ⛔ Perimetro DEFINER a catalogo: email_log ha la RLS e la vista e'' security_invoker — una persona la legge col suo perimetro, il digest la CONTA da proprietario con fn_conta_presidio e riporta il numero, mai le righe. Sta in dbops e non in config perche'' il catalogo dei presidi legge il perimetro dagli schemi che vi compaiono. Brief: brief-db-quattro-processi-senza-presidio §5.';

              COMMENT ON VIEW dbops.vw_emittenti_regime_non_confermato IS
                'Gli emittenti fiscali attivi il cui regime fiscale nessuno ha confermato (regime_fiscale_confermato_il NULL): il regime e'' quello del default RF01 (D-1) o di un cambio senza conferma. DEVE restare VUOTA. ⛔ Copre un guasto che non assomiglia a un errore: un emittente in IVA per cassa lasciato a RF01 emette tutte le fatture a esigibilita'' immediata. Tutti i regimi e non solo RF01: un regime non confermato e'' un regime che nessuno ha dichiarato, qualunque codice abbia. Si svuota confermando il regime dal form dell''emittente. Brief: brief-db-esigibilita-iva-per-cassa-emittente (D-1, D-11).';

              COMMENT ON VIEW dbops.vw_eventi_non_dichiarati IS
                'I codici evento finiti in vendite.event_log e assenti da config.eventi_dominio. ⚠️ NON e'' il gemello di dbops.vw_codici_errore_da_dichiarare, e non puo'' esserlo: quella legge pg_proc perche'' i codici errore li solleva il DATABASE, mentre i codici evento li scrive PYTHON — una vista su pg_proc tornerebbe vuota per sempre, cioe'' direbbe sempre «tutto a posto» guardando nel posto sbagliato. Il cancello vero e'' lato backend (consegna BE-9), dove i codici sono scritti. ⭐ Questa fa un lavoro complementare: la deriva GIA'' AVVENUTA, che nessun controllo sul sorgente vede — un codice costruito a runtime, o scritto da qualcosa che non e'' il backend. ⚠️ E'' data-dependent: su un ambiente senza traffico e'' cieca. E'' una spia da guardare, non un semaforo che ferma. ⛔ E il rubinetto NON si chiude con una FK su event_code: sarebbe il diario che smette di scrivere per un problema di configurazione, cioe'' la D-12 violata.';

              COMMENT ON VIEW dbops.vw_fatture_stampa_coda_da_guardare IS
                'PRESIDIO: le stampe in coda che chiedono un occhio — fallite (ERRORE), prese e mai chiuse (IN_CORSO da oltre un''ora: il worker e'' morto a meta'' e il reaper non e'' passato), o mai prese (PENDING da oltre un''ora: ⛔ il drenatore della stampa non sta girando). DEVE restare VUOTA. E'' la gemella di dbops.vw_coda_lavori_da_guardare, nata il 2026-09-11 perche'' delle due code gemelle una sola aveva il presidio. ⭐ data_update e'' l''ultima transizione di stato: l''audit trigger lo porta a now() a ogni scrittura, e sulle righe vive l''unica scrittura del drenatore e'' una transizione (archiviato vale solo sugli stati terminali) — il reaper lo legge gia'' cosi''. ⚠️ Non e'' un vincolo: una scrittura non di stato su una riga viva azzererebbe l''orologio, e il presidio tacerebbe un''ora in piu'' (non suonerebbe a vuoto). ⚠️ Un''ora non deriva dalla cadenza di due minuti: una soglia dedotta dai tempi di oggi si taglierebbe addosso al carico di oggi. ⚠️ Niente ANNULLATO: la stampa non ce l''ha. Fuori archiviato (gia'' guardato). La fattura e'' in sorgente_id. ⛔ Perimetro DEFINER a catalogo: la tabella ha la RLS e la vista e'' security_invoker — una persona legge col suo perimetro, il digest conta da proprietario e riporta il numero. Brief: brief-db-quattro-processi-senza-presidio §4.';

              COMMENT ON VIEW dbops.vw_funzioni_check_codici IS
                E'SEDE UNICA della risalita «funzione dal corpo leggibile (plpgsql o sql: dbops.fn_corpo_leggibile) -> fn_check_* nominate nel corpo -> codici che quelle nominano come motivo». Una riga per (funzione, check, codice); codice NULL se la check non nomina motivi (il legame compare lo stesso). motivo_chiave = ''campo''/''parametro'' se il MOTIVO che nomina il codice porta la chiave del canale nel suo dettaglio (che fn_raise_primo_motivo_se_presente fonde nel context) — PESSIMISTA: solo se tutti i motivi di quel codice la portano; n_motivi = quante volte la check lo nomina.
              ⭐ rev 2026-09-24 (20260924-08) — LA DELEGA: una check che RESTITUISCE i motivi di un''altra fn_check_* (v_motivi || x.fn_check_…, v_m := x.fn_check_…, jsonb_agg sugli elementi) ne EREDITA i codici, a qualunque profondita''; una che la CONSUMA (count, EXISTS, IF) no — emette un motivo suo. Se nell''istruzione della delega il codice e'' confrontato con dei letterali (`->> ''codice'' = ''E_X''` o `IN (…)`) eredita SOLO quelli: script.fn_check_prezzi_in_attesa eredita da fn_check_prezzi_autorizzati il solo E_DOC_PREZZO_PENDENTE. Anche check_emette_valori si propaga. Prima la risalita si fermava a un livello, e le due madri di revisione (20260924-34/-35) uscivano come ramo cieco nel presidio C2. ⚠️ `<>` / NOT IN non sono riconosciuti come filtro: si eredita tutto — un legame in piu'', mai un ramo cieco.
              LETTORI: dbops.vw_punti_primo_motivo (il rubinetto: i soli punti che sollevano il primo motivo a mano) e dbops.vw_punti_canale_campo (il presidio C2: tutti i siti, bonificati compresi). Prima la risalita viveva dentro la sola vw_punti_primo_motivo, e la seconda l''avrebbe ricopiata.
              ⚠️ Le fn_check_* si cercano nel sorgente SENZA commenti; una riga per (funzione, check, codice) — un codice che arriva da piu'' strade si aggrega. ⚠️ La finestra di un motivo NON e'' «fino al ;»: le check a CTE costruiscono piu'' motivi in uno statement, quindi il sorgente si spezza sulle occorrenze di ''codice'',. ⚠️ Euristica sul corpo senza commenti (dbops.fn_corpo_funzione, che lascia intatti i letterali): riconosce la forma scritta, non il significato. Brief: brief-be-presidio-ui-action-e-canale-campi §4.
              ⭐ rev 2026-10-10 (20261010-43) — PREFILTRO `prosrc LIKE ''%fn\\_check\\_%''` sulla CTE funzioni (piu'' le sql BEGIN ATOMIC, che hanno prosrc vuoto e passano tutte al filtro sul corpo): senza, la stima arrivava a ~304 milioni (funzioni di sistema a cardinalita'' fissa sopra 1.221 corpi, moltiplicata dalla ricorsione) e PostgreSQL compilava la vista col JIT — ~1,1 s di compilazione per ~110 ms di lavoro, pagati da ogni lettore. Risultato identico (un nome di funzione e'' un token: un commento non lo compone). ⛔ Il prefiltro e'' una proprieta'' invisibile nei risultati: un REPLACE che lo perde non rompe niente e torna lento. Lo presidia db/pgtap/dbops/test-vw-funzioni-check-codici-sotto-jit-v1.sql.
              ⭐ rev 2026-10-12 (20261012-26) — LA CARDINALITA'' DICHIARATA: il prefiltro da solo teneva la stima sotto la soglia solo finche'' le statistiche di pg_proc stimavano pochi corpi con fn_check_ (32 stimati, 170 veri dopo un autoanalyze: vw_punti_canale_campo a ~192.000 su zeroerp_ci). Le estrazioni passano da dbops.fn_regexp_occorrenze (ROWS 1: regexp_matches ne dichiara 10, le occorrenze vere per corpo sono fra 0,03 e 0,94), il taglio dei motivi da unnest(regexp_split_to_array) (regexp_split_to_table ne dichiara 1.000) e l''estrazione delle deleghe sta in deleghe_grezze MATERIALIZED (prima si rifaceva per ogni coppia di check). Righe identiche (EXCEPT ALL a zero sulle tre viste); la stima resta sotto la soglia anche con un prefiltro stimato tre volte e mezzo piu'' largo del vero. Lo presidia lo stesso pgTAP, test 4 e 5.';

              COMMENT ON VIEW dbops.vw_liste_multi_emittente_non_certificate IS
                'Controllo automatico di P-2b (brief perimetro-emittente, §7 decisione 3): liste che dichiarano multi_emittente = true SENZA esporre l''emittente in nessuna colonna attiva di ui.lista_colonna. ⚠️ DEVE restare a ZERO righe: una riga qui e'' una lista con l''adesivo «collaudato» addosso e nessun collaudo dietro — cioe'' il flag usato per far sparire un fastidio invece che per dichiarare un lavoro fatto. E'' il «prezzo del biglietto» reso verificabile a macchina: una lista si guadagna il flag esponendo l''emittente nella riga (P-4), non prima. Controllo di PURO CATALOGO: non sa nulla delle viste ne'' del backend, quindi non prova che la colonna arrivi a video — prova che qualcuno l''abbia dichiarata.';

              COMMENT ON VIEW dbops.vw_lotti_congelati_con_errori_da_guardare IS
                'PRESIDIO: i lotti CONGELATI (stato fiscale non piu'' pre-fiscale, o ignoto) che contengono documenti in ERRORE, qualunque sia stato_lotto. DEVE restare VUOTA. ⭐ E'' un LETTORE: la contraddizione la definisce vendite.vw_lotti_congelati_con_gruppi_in_errore, qui si aggiunge solo l''emittente, per chi arriva dal digest. ⭐ Si spartisce l''asse fiscale con dbops.vw_lotti_fermi_da_guardare: pre-fiscale -> quel presidio, congelato -> questo, senza buchi ne'' doppioni. Un lotto ANNULLATO non compare perche'' l''annullo gli chiude gli esiti, non perche'' qualcuno lo filtri. ⚠️ In dbops e non in vendite: iscrivere a catalogo una vista di vendite porterebbe l''intero schema nel perimetro di test-catalogo-presidi-v1 (test 2). ⛔ Perimetro DEFINER a catalogo: le tabelle sotto hanno la RLS e le viste sono security_invoker — da una sessione senza GUC risponde zero PER CECITA'', il digest conta da proprietario con fn_conta_presidio, una persona legge col proprio perimetro. Fino al 2026-11-07 si chiamava vw_lotti_chiusi_con_errori_da_guardare (brief-db-annullamento-chiude-la-vita §9.6). Brief: brief-db-revisione-dbops, giro 6 (Q14 ⑦).';

              COMMENT ON VIEW dbops.vw_lotti_fermi_da_guardare IS
                'PRESIDIO: i giri di fatturazione PRE-FISCALI che la sede unica (vendite.vw_lotti_segnalazioni_summary) dichiara `fermo` — critiche vive, riga di ponte in ERRORE o esito ERRORE — da OLTRE UN''ORA, e che nessuno ha rilanciato ne'' sciolto, qualunque sia stato_lotto (un COMPLETATO in bozza con un esito in errore e'' qui). DEVE restare VUOTA. Il banner lo dice a chi apre il lotto; questa riga lo dice a chi non lo apre. ⭐ E'' un LETTORE: nessun addendo e'' ricalcolato qui — `motivo` e `fermo_da` sono le colonne della sede, e un addendo nuovo del verdetto lo vedono insieme il banner, il digest e il pallino (D-1 di Tid, 18-09: una sede a DB, il backend trasporta). ⭐ SOLO PRE-FISCALI (vw_lotti_fase.pre_fiscale): un lotto congelato con un esito ERRORE, o con lo stato fiscale ignoto, e'' la contraddizione di vendite.vw_lotti_congelati_con_gruppi_in_errore — i due presidi si spartiscono lo stesso asse, quello fiscale, senza buchi ne'' doppioni (rev 2026-11-07, brief-db-revisione-dbops giro 6: prima l''altro guardava stato_lotto). ⚠️ Un''ora non e'' una misura: il rilancio e'' il gesto di una persona, e le tre viste delle code usano la stessa soglia per la stessa ragione. L''orologio e'' `fermo_da`, il fatto PIU'' RECENTE che ferma il lotto: un rilancio che fallisce di nuovo lo riparte, e la domanda resta «da quanto nessuno ci mette le mani». La soglia sta qui, non nel catalogo. ⛔ Perimetro DEFINER a catalogo: le tabelle sotto hanno la RLS e la vista e'' security_invoker — da una sessione senza GUC risponde zero PER CECITA'', il digest conta da proprietario con fn_conta_presidio, una persona legge col proprio perimetro. Brief: brief-db-osservabilita-lotto-fermo-r6-indici §2; analisi-osservabilita-log §4 Passo C.';

              COMMENT ON VIEW dbops.vw_magazzino_dipendenze_inverse IS
                'CANCELLO — deve restare VUOTA. Gli oggetti dello schema magazzino che nominano uno schema di processo (vendite, acquisti, pagamenti: il perimetro e'' scritto nella vista, uno schema nuovo si aggiunge qui). Il registro di magazzino e'' un servizio dell''anello 2 (D-1): chi muove merce scrive il proprio posting e chiama la primitiva, e il registro non conosce i suoi consumatori. Due lenti: CATALOGO (pg_depend — FK, viste, default, policy, trigger, firme, corpi SQL standard) e CORPO (il corpo delle funzioni senza dipendenze registrate, letto da dbops.fn_corpo_funzione: senza commenti, con i letterali intatti). Non vede gli argomenti dei trigger (i block_deact generati dal framework ATTIVO riflettono una FK che punta verso il registro: il verso giusto). Una riga fa rosso db/pgtap/magazzino/test-registro-non-nomina-i-consumatori-v1.sql, che gira in CI. security_invoker: legge solo il catalogo. Brief: brief-db-magazzino-registro-anello-interno (P-6).';

              COMMENT ON VIEW dbops.vw_magazzino_movimenti_senza_costo IS
                'Le ENTRATE (qta > 0) scritte SENZA costo unitario, esclusi gli storni. Chi le scrive, tutti attraverso la primitiva magazzino.fn_scrivi_movimento: il primo carico senza valore (magazzino.fn_posta_inventario, riga senza costo_unitario e nessuna media), una rettifica positiva senza media (magazzino.fn_posta_rettifica), il carico da reso di una merce uscita senza costo e senza media al rientro (vendite.fn_posta_reso), l''entrata gemella di un trasferimento la cui uscita era senza costo (magazzino.fn_posta_trasferimento, vendite.fn_posta_ddt all''arrivo). Un''entrata senza costo non e'' un errore: e'' un fatto dichiarato (D-L2-c) — il movimento nasce con costo NULL, il valore resta com''e'' e la media si diluisce. Le uscite a NULL sono la CONSEGUENZA (nessuna media), non la causa, e non entrano. Gli STORNI non entrano (magazzino.fn_storna_movimenti_sorgente): lo storno di un''uscita senza costo e'' un''entrata senza costo che rende allo stesso magazzino la quantita'' uscita a valore zero, e la media torna com''era; la causa e'' gia'' qui (Q14 ⑧). L''entrata gemella di un trasferimento invece resta: diluisce la media del magazzino d''arrivo. Natura LAVORAZIONE (una tendenza da guardare, non un guasto): compare nel digest invece di sparire nella media. security_invoker, perimetro DEFINER, cadenza SETTIMANALE. Brief: brief-db-magazzino-lotto-2-motore 4.4; rev 2026-11-09 (brief-db-sorgente-documento-e-riga lotto M; Q14 ⑧ e M23 di brief-db-revisione-dbops).';

              COMMENT ON VIEW dbops.vw_magazzino_valore_giacenza_divergente IS
                'Le coppie (articolo, magazzino) in cui la COPIA del valore (valore_giacenza) e la RI-SOMMA del registro (round(qta * costo, 6) per movimento) DIFFERISCONO — IS DISTINCT FROM su un FULL JOIN: una giacenza con movimenti e senza riga di valore, e una riga di valore senza movimenti, sono divergenze. DEVE RESTARE VUOTA. Non prova l''aritmetica (l''accumulatore somma gli stessi round che la primitiva ha scritto: coincidono per costruzione): prova che NESSUNO HA SCRITTO FUORI DALLA PORTA (M-4, D-L2-b). Il rimedio e'' fn_ricalcola_valore_giacenza. security_invoker; presidio natura ZERO, perimetro DEFINER (la legge fn_conta_presidio: da un percorso senza contesto darebbe zero per cecita''), cadenza SETTIMANALE. Brief: brief-db-magazzino-lotto-2-motore, sezione 4.4.';

              COMMENT ON VIEW dbops.vw_operatori_senza_emittente IS
                'Diagnostica P-2a: operatori configurati a META'' — identita'' OPERATORE attiva, NON super admin, e nessuna riga in config.user_emittenti_fiscali. Dal fail-closed del 2026-08-18 queste persone non vedono NULLA, e il difetto non si annuncia: nessun errore, solo schermate vuote. ⚠️ DEVE restare a zero righe: una riga qui e'' qualcuno che apre l''applicazione e non trova niente. Il super admin e'' escluso di proposito (il suo scope passa da fn_is_super_admin). Per assegnare l''emittente mancante si usa la funzione di dominio script.fn_change_user_emittenti_scope(auth_user_id, ARRAY[ef_id]), non un INSERT a mano. Brief perimetro-emittente P-2a.';

              COMMENT ON VIEW dbops.vw_processi_che_bypassano IS
                'PRESIDIO — deve restare VUOTA. I ruoli APPLICATIVI (con login, non superuser) che hanno BYPASSRLS: un ruolo cosi'' scavalca la separazione dei dati fra aziende emittenti. ⚠️ Non dice «nessuno bypassa la RLS»: pgAgent bypassa perche'' e'' superuser e il proprietario delle tabelle per proprieta'', e devono, perche'' fanno DDL. Fino al 2026-11-04 la vista ammetteva un debito dichiarato per nome (zeroerp_batch_fatturazione, ritirato il 2026-10-15) e il presidio contava solo le righe non dichiarate: un ruolo tornato con quel nome sarebbe passato muto. Un debito nuovo si dichiara con un changeSet sulla vista e sul presidio, non con una lista di nomi. A catalogo in dbops.presidi, soglia ZERO; lo prova db/pgtap/dbops/test-processi-registro.sql. security_invoker: legge solo pg_roles.';

              COMMENT ON VIEW dbops.vw_processi_programmazione_da_guardare IS
                'PRESIDIO: i processi automatici la cui sveglia e la cui ultima corsa non tornano. DEVE restare VUOTA. ⭐ E'' il panorama (dbops.vw_processi_programmazione) proiettato sulla colonna `da_guardare`, NON un secondo criterio: ripetere qui un NOT IN sugli stati sarebbe la seconda enumerazione dello stesso vocabolario, e la seconda diverge — il giorno in cui uno stato nuovo entra, qualcuno dovrebbe ricordarsi di venire a decidere da che parte cade. ⛔ Il panorama non puo'' stare al suo posto: elenca anche i sani (12 righe OK al 2026-09-06), e un presidio che mostra il verde insegna a leggere il verde come debito, cioe'' a ignorare l''avviso. ⚠️ Restano FUORI di proposito FUORI_PORTATA e SU_RICHIESTA, che non sono guasti per ragioni opposte: il primo e'' un limite di vista del database (i COMMAND li sveglia systemd, e chi li presidia e'' il backend da deploy/sveglie.json), il secondo e'' la natura del processo (un CODA lo sveglia una persona: una cadenza da confrontare non esiste). ⭐ Lo stato che vale piu'' di tutti e'' GIRA_E_NON_REGISTRA: pgAgent dice che il job e'' girato, il giornale non lo sa. E'' la firma di R-12 — un lavoro che muore prima di riuscire a raccontarlo. ⭐ LE DUE DATE DEL GIORNALE SONO DUE, rev 2026-09-07: il verdetto poggia su `giornale_ultima_corsa_pgagent` (le sole corse scritte dal percorso DB), e `giornale_ultima_corsa` sta accanto perche'' la DIFFERENZA fra le due e'' informazione — se la seconda e'' avanti e la prima indietro, qualcuno ha registrato sotto questo codice senza essere pgAgent. Brief §9.5-bis. ⚠️ UNA CAUSA NON ACCERTATA, e non e'' una condizione di riapertura: fra il 21-02-2026 e il 05-09-2026 apply_storicizza_weekly e'' girato ogni settimana senza lasciare una riga, e la corsa forzata del 2026-09-07 e'' andata VERDE — quindi il difetto non era nel job, era nel verbale, ma perche'' sei mesi e mezzo di corse riuscite non abbiano scritto niente resta senza risposta. Da qui non si accerta: lo storico degli esiti dello scheduler sta in pgagent.*, che zeroerp_app non legge. ⇒ La prossima volta che questo giornale tace, si comincia da li''. ⭐ LA CAUSA, rev 2026-10-09 (brief-db-presidio-processi-testo-per-causa §3 B.1): colonna `causa` in coda, proiettata dal panorama come lo stato. Due stati hanno due cause con rimedi diversi (MUTO: TIMER_FERMO o SERVIZIO_GIU; MAI_PARTITO: TIMER_NON_INSTALLATO o JOB_MAI_PARTITO), e la causa sceglie il testo per chi agisce (dbops.presidi.colonna_variante = ''causa''). Qui non e'' mai NULL: nel panorama da_guardare E'' «la riga ha una causa».';

              COMMENT ON VIEW dbops.vw_punti_canale_campo IS
                'La meta'' database del presidio C2 (brief-be-presidio-ui-action-e-canale-campi §4): per ogni (funzione dal corpo leggibile, plpgsql o sql — dbops.fn_corpo_leggibile —, codice E_*) COME il codice viene sollevato e SE il context porta la chiave che script.fn_log_and_raise_error legge per la COLUMN dell''eccezione (''campo'', ripiego ''parametro'') — cioe'' il canale che a video accende il campo del form (fields -> campiErrati), l''unico che realizza la promessa ui_action = highlight_form_fields.
              via: DIRETTO (chiamata a fn_log_and_raise_error col codice letterale, o col codice in variabile), PRIMO_MOTIVO (il codice di un motivo, via fn_raise_primo_motivo_se_presente o a mano: codici = UNIONE delle fn_check_* del corpo, da vw_funzioni_check_codici), MOTIVO (la fn_check_* che lo emette: sede del campo, non un sito), NOMINATO (letterale nel corpo, mai sollevato con l''helper: canale NULL).
              canale: IN_CHIAMATA (chiave nella chiamata, o p_campo letterale, o nel motivo della check), IN_VARIABILE (in una variabile del corpo, o non attribuibile — mai un «ok» silenzioso), CHIAVE_NON_LETTA (la colonna sta nel context come CHIAVE: sanabile, nome_in_chiave dice quale), NESSUNO. chiave: campo / parametro.
              ⭐ Per (funzione, codice) il canale e'' il MIGLIORE fra le chiamate attribuite — la regola e'' «almeno un punto» — e n_chiamate / n_con_canale dicono quando una funzione lo porta in 2 chiamate su 3. Il verso 1 del presidio si legge da canale IN (IN_CHIAMATA, IN_VARIABILE) su via IN (DIRETTO, PRIMO_MOTIVO); il verso 2 da n_con_canale = n_chiamate.
              ⭐ rev 20261103-02: i codici della funzione sono quelli del corpo PIU'' quelli che un trigger le passa negli ARGOMENTI (dbops.vw_codici_errore_argomenti_trigger): un building block trigger che riceve il codice da TG_ARGV e lo solleva da una variabile e'' un sito DIRETTO, attribuito al massimo IN_VARIABILE. Prima per la vista quel sito non esisteva (D24).
              ⚠️ Euristica sul sorgente senza commenti: chiamata = testo fino al primo `;`; p_campo letto a un livello di parentesi; solo i corpi leggibili (plpgsql e sql); i RAISE diretti non si vedono. Gli helper sono esclusi. Presidio: db/pgtap/dbops/test-punti-canale-campo-v1.sql.';

              COMMENT ON VIEW dbops.vw_punti_primo_motivo IS
                'I punti che sollevano il codice del PRIMO MOTIVO di una script.fn_check_* (linee-guida-sql §12.5.2) A MANO — `fn_log_and_raise_error(... ->> ''codice''` — legati alla check da cui il motivo viene e ai codici che quella nomina. Una riga per (punto, check, codice). E'' il RUBINETTO: i chiamanti di script.fn_raise_primo_motivo_se_presente (i bonificati) NON ci stanno, per costruzione. Il perimetro sono i corpi leggibili, plpgsql e sql (dbops.fn_corpo_leggibile).
              ⭐ DAL 2026-09-21 LA RISALITA punto->check->codici si LEGGE da dbops.vw_funzioni_check_codici (sede unica, condivisa col presidio C2 dbops.vw_punti_canale_campo); qui resta il solo marcatore dei punti. Prima viveva in una vista temporanea dentro db/pgtap/script/test-rubinetto-primo-motivo-v1.sql, poi in questa vista — e la seconda lettrice l''avrebbe ricopiata.
              COME SI USA. (A) il perimetro dell''helper: SELECT sch, fn, count(check_funzione) AS check_trovate, coalesce(bool_or(check_emette_valori), false) AS in_perimetro FROM dbops.vw_punti_primo_motivo GROUP BY 1,2; (B) i codici che un punto puo'' sollevare: SELECT DISTINCT funzione, codice FROM dbops.vw_punti_primo_motivo WHERE codice IS NOT NULL.
              ⭐ PESSIMISTA DI PROPOSITO: i codici sono l''UNIONE di quelli nominati da TUTTE le check citate nel corpo, perche'' la vista legge il testo e non sa quale ramo sia stato preso. Un presidio che scegliesse il ramo ottimista assolverebbe il caso che deve segnalare; un falso positivo qui costa una riga in piu'' nel VARIADIC, non un rifiuto sbagliato.
              ⚠️ RAMO CIECO — un punto con check_funzione NULL non e'' «a posto»: e'' un sito che la lettura non sa legare alla sua check, e va visto. E'' il test 3 di test-rubinetto-primo-motivo-v1.sql.
              ⛔ NON serve a dbops.vw_codici_errore_forme_condizione: quella classifica la forma della GUARDIA, e sopra questi punti la guardia e'' sempre «IF jsonb_array_length(v_motivi) > 0», che non dice niente. Li'' si classifica dove il codice e'' NOMINATO (changeSet 20260908-35).
              ⚠️ E'' un''euristica sul corpo senza commenti (dbops.fn_corpo_funzione): riconosce la forma scritta, non il significato; una chiamata rimasta in un commento non e'' un punto. Brief: brief-db-i-motivi-si-fermano-dentro-la-check.md (V-0); risalita condivisa: brief-be-presidio-ui-action-e-canale-campi §4.';

              COMMENT ON VIEW dbops.vw_radici_di_prova_in_produzione IS
                'PRESIDIO: le radici di prova (le righe di dbops.credenziali_di_prova e dbops.soggetti_di_prova) in un database dichiarato PRODUZIONE. DEVE restare vuota: il guard dbops.trgfn_etichette_di_prova_guard impedisce che un''etichetta nasca in PRODUZIONE e l''ambiente non cambia; questa e'' l''ultima rete per cio'' che i guard non vedono (un dump di sviluppo ripristinato su un server di produzione con l''ambiente riscritto a mano, un trigger disattivato). Legge script.fn_ambiente_dichiarato(), che non solleva: su un''installazione non dichiarata e'' vuota. Legge solo dbops: in CI non e'' rotta. Brief: brief-db-processi-accensione-per-ambiente (R-4).';

              COMMENT ON VIEW dbops.vw_riferimenti_morti_da_sanare IS
                'Riferimenti morti (REALE/ORFANA) e funzioni che NON SI SONO POTUTE CONTROLLARE (NON_MISURATO), non coperti dal registro del debito: e'' la lista di lavoro. Deve essere vuota. ⚠️ Ogni SELECT ri-compila ~500 funzioni. ⭐ NON_MISURATO entra qui dal 2026-09-10 (20260910-37) e non e'' un dettaglio: quelle righe prima uscivano come falsi REALE, e toglierle senza rimetterle da un''altra porta avrebbe fatto tornare la vista VUOTA mentre plpgsql_check era rotto — cioe'' avrebbe detto «nessun riferimento morto» proprio quando nessuno aveva potuto guardare. ⛔ Una riga NON_MISURATO non e'' un riferimento morto e non si registra come debito: si ripara lo strumento. Ma resta lavoro, e resta VISIBILE — la conta anche il digest dei presidi, per cui questa vista e'' un REGISTRO a cadenza settimanale.';

              COMMENT ON VIEW dbops.vw_rls_perimetro_scoperto IS
                'Le tabelle che dovrebbero filtrare e non filtrano, per due criteri indipendenti letti dal catalogo di PostgreSQL: FIGLIA_DI_TABELLA_PROTETTA (ha una FK verso una tabella con la row level security accesa) e POLICY_INERTE (porta una policy e la row level security spenta). ⛔ L''invariante NON e'' «la vista e'' vuota»: e'' «nessuna riga fuori da DEBITO_DICHIARATO» — un debito dichiarato in dbops.rls_perimetro_debito e'' una riga attesa, un NON_DICHIARATO e'' un allarme, un DEBITO_ESTINTO e'' una riga di registro da togliere. ⚠️ FORCE ROW LEVEL SECURITY non entra nel criterio: in questo database nessuna tabella lo usa, e l''applicazione non e'' owner. Presidio: db/pgtap/rls/test-rls-perimetro-scoperto.sql. Brief: brief-db-perimetro-emittente-righe-documento §8.';

              COMMENT ON VIEW dbops.vw_stati_check_da_sanare IS
                'La lista di lavoro del presidio C1: i valori di una colonna di stato che nessuno scrive e nessuno ha dichiarato (NON_DICHIARATO), e le righe del registro dbops.stati_check_dichiarazioni che non servono piu'' (DEBITO_ESTINTO). DEVE restare vuota, ed e'' un CANCELLO: la fa rossa in CI db/pgtap/dbops/test-stati-check-scrittori-v1.sql, e sul lato Python il test del backend verifica le righe DICHIARATO_APPLICAZIONE della misura. Non e'' un filtro da allargare per farla tacere: si allarga il registro, con la ragione. Brief: brief-db-presidio-stati-mai-scritti §2.4.';

              COMMENT ON VIEW dbops.vw_stati_check_scrittori IS
                'PRESIDIO C1 — uno stato previsto dal modello (nel CHECK a lista di una colonna di stato) e mai scritto. Una riga per (colonna, valore) con il suo esito: SCRITTO (una funzione scrive la tabella e nomina il letterale, oppure lo passa a uno scrittore posizionale: il secondo salto), SCRITTO_DA_DEFAULT, DICHIARATO_APPLICAZIONE / ESENTE (sta in dbops.stati_check_dichiarazioni), NON_DICHIARATO (il debito da sanare) e DEBITO_ESTINTO nei due versi. ⚠️ Il criterio e'' TESTUALE e ha due limiti, dichiarati nel suo pgTAP: nominare non e'' scrivere (test 6) e a tre salti il letterale non si segue piu'' (test 9). ⭐ Rev 2026-09-22: stessa misura, estratta UNA volta invece che provata per coppia — i nomi scritti da ogni funzione e i letterali citati si ricavano con un passaggio solo, poi si confrontano per uguaglianza. Output identico riga per riga (EXCEPT nei due versi su dbdev), costo per chiamata da ~535 ms a ~230 ms. ⛔ Rev 2026-09-23: le funzioni di fixture pgTAP (prefisso fn_pgtap_ in dbops e script) NON contano, ne'' come scrittori ne'' come chiamanti: il presidio misura il sistema, non le fixture che lo collaudano. Brief: brief-db-presidio-stati-mai-scritti §3-bis; brief-db-fixture-che-costruiscono-giro-2 §11.';

              COMMENT ON VIEW dbops.vw_storico_scope_da_dichiarare IS
                'ZERO — deve restare VUOTA. Il debito della mappa dello scope di storico (dbops.storico_scope_policy), in tre motivi: SENZA_RIGA (una madre col trigger di storico che nessuno ha ancora guardato), PROTETTA_NESSUNO (una madre in RLS dichiarata NESSUNO: la sua storia è ancora aperta, con la ragione dichiarata), RIGA_SENZA_MADRE (una riga di mappa senza più una madre col trigger: tabella cancellata o storicizzazione tolta). Il marcatore delle madri è il trigger. La madre di una riga si cerca sul catalogo (pg_class, pg_namespace; l''alias pg_temp è lo schema temporaneo della sessione), non con to_regclass, che solleva su uno schema senza USAGE per chi legge: la vista è security_invoker e non dipende dai privilegi del lettore sugli schemi. Porta nel digest settimanale ciò che il pgTAP db/pgtap/dbops/test-storico-scope-policy-v1.sql asserisce in CI (test 2, 4, 5 — e i test 29-33 provano che questa vista dica il vero su casi costruiti). Brief: brief-db-rls-storico-scope-congelato §4.2, §4d; brief-db-revisione-dbops §22.';

              COMMENT ON VIEW dbops.vw_trigger_functions IS
                'INVENTARIO: ogni trigger montato nel database con la tabella su cui sta, la funzione che esegue e la definizione COMPLETA di quella funzione (pg_get_functiondef). E'' un attrezzo per leggere, non un presidio: la sua non-vuotezza e'' la condizione NORMALE — a database sano ha una riga per trigger, e nel 2026 sono migliaia. ⛔ Non entra in nessun digest, ed e'' il caso da cui la regola si vede meglio: un elenco che si apre con duemila righe non e'' un allarme, e un avviso rumoroso viene ignorato al secondo invio, cioe'' finisce come il presidio che voleva salvare. ⚠️ Porta il corpo INTERO di ogni funzione-trigger: una SELECT senza WHERE su questa vista e'' pesante, e non e'' il modo di usarla — si filtra per tabella o per nome funzione. ⭐ Dichiarata come INVENTARIO in dbops.presidi: se una vista mancasse dal catalogo non si saprebbe se e'' un inventario o una dimenticanza. Brief: brief-db-un-destinatario-per-i-presidi §2.';

              COMMENT ON COLUMN dbops.vw_processi_programmazione.causa IS
                'Perche'' la riga e'' da guardare, piu'' fine di `stato` dove lo stato ha due cause: MUTO → TIMER_FERMO (COMMAND col giornale) o SERVIZIO_GIU (COMMAND con la sessione); MAI_PARTITO → TIMER_NON_INSTALLATO (COMMAND) o JOB_MAI_PARTITO (PGAGENT). Altrove e'' lo stato stesso: NON_PROGRAMMATO, JOB_ASSENTE, JOB_SPENTO, GIRA_E_NON_REGISTRA. NULL sui processi sani (OK, FUORI_PORTATA, SU_RICHIESTA), ed e'' cio'' che li fa sani: da_guardare = causa IS NOT NULL. Esce dallo stesso ramo del CASE che produce lo stato. Sceglie il testo per chi agisce (dbops.presidi.colonna_variante → dbops.presidi_testi.variante). Brief: brief-db-presidio-processi-testo-per-causa §3 B.1.';

              COMMENT ON COLUMN dbops.vw_processi_programmazione.da_guardare IS
                'Vero se questo stato e'' un guasto. ⭐ E'' la SEDE UNICA del criterio: la vista di presidio la proietta invece di ripetere un NOT IN, che sarebbe la seconda enumerazione degli stati — e la seconda diverge. ⛔ Non e'' `stato <> OK`: FUORI_PORTATA e SU_RICHIESTA non sono OK e non sono guasti, sono «questa domanda non si fa da qui».';

              COMMENT ON COLUMN dbops.vw_processi_programmazione_da_guardare.causa IS
                'La causa del guasto, dal panorama (dbops.vw_processi_programmazione.causa): TIMER_FERMO, TIMER_NON_INSTALLATO, SERVIZIO_GIU, NON_PROGRAMMATO, JOB_ASSENTE, JOB_SPENTO, JOB_MAI_PARTITO, GIRA_E_NON_REGISTRA. Mai NULL qui. Sceglie il testo per chi agisce: dbops.presidi.colonna_variante → dbops.presidi_testi.variante. Brief: brief-db-presidio-processi-testo-per-causa §3 B.1.';

              COMMENT ON COLUMN dbops.vw_processi_programmazione.giornale_ultima_corsa IS
                'L''inizio della corsa piu'' recente del processo nel giornale, qualunque origine. ⭐ CONTA anche le corse saltate per lock occupato: e'' il segno di vita della SVEGLIA (alimenta TIMER_FERMO per i COMMAND col giornale), e una skip prova che il timer si e'' svegliato. Il lavoro fermo si vede in maintenance.vw_job_run_da_guardare. Rev 2026-10-10, brief-db-corsa-saltata-non-e-una-corsa §8 (D3).';

              COMMENT ON COLUMN dbops.vw_processi_programmazione.giornale_ultima_corsa_pgagent IS
                'L''inizio della corsa piu'' recente registrata da pgAgent (origine PGAGENT). Alimenta GIRA_E_NON_REGISTRA, confrontata con l''ultima esecuzione che pgAgent dichiara. ⭐ CONTA anche le corse saltate: una skip e'' una registrazione, e prova che il job scatta e il giornale lo sa. Rev 2026-10-10, brief-db-corsa-saltata-non-e-una-corsa §8 (D3).';

              COMMENT ON COLUMN dbops.vw_processi_programmazione.ultimo_esito IS
                'L''esito (ok) dell''ultima corsa VERA del processo nel giornale: TRUE riuscita, FALSE fallita, NULL ancora aperta (o nessuna corsa). ⛔ Le corse SALTATE per lock occupato sono escluse (maintenance.job_run_log.saltata): non hanno fatto lavoro, quindi non hanno esito. Rev 2026-10-10, brief-db-corsa-saltata-non-e-una-corsa §8.';
