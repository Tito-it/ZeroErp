# dbops.fn_cleanup_at_regola: la regola di scadenza di una tabella, una sede sola per il trigger
#   alla nascita, il runner sul pregresso e il login (D16 con N3). Prima il trigger sceglieva la
#   regola senza esclusioni, partiva da now() senza colonna base e scriveva sempre cleanup_at; il
#   runner applicava le esclusioni, la catena data_insert/executed_at/occurred_at/created_at e la
#   colonna di cleanup_column. La colonna e' cleanup_at, nome fisso (decisione di Tid, §27.2).
#   Brief: brief-db-revisione-dbops, giro 10b, blocco 10b-3 (§27).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261109-85-create-fn-cleanup-at-regola-mctit.yaml

  - changeSet:
      id: 20261109-85-create-fn-cleanup-at-regola
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.fn_cleanup_at_regola: la regola di scadenza di una tabella, per trigger, runner e login. Brief: brief-db-revisione-dbops, giro 10b, blocco 10b-3 (§27).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 0
            sql: >
              SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'dbops' AND p.proname = 'fn_cleanup_at_regola'
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_proc
               WHERE oid = to_regprocedure('dbops.fn_cleanup_esclusa(text,text)')
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE FUNCTION dbops.fn_cleanup_at_regola(
                  p_schema dbops.automation_rules_tbl.target_schema%TYPE,
                  p_table  dbops.automation_rules_tbl.target_table%TYPE)
               RETURNS TABLE (
                  regola_id       dbops.automation_rules_tbl.id%TYPE,
                  -- integer, text, boolean: valori letti dai params jsonb della regola,
                  -- nessuna colonna li porta
                  ttl_days        integer,
                  base_ts_column  text,
                  apply_on_update boolean,
                  -- il motivo per cui la regola non si applica (lo skip_reason del runner)
                  motivo_salto    text)
               LANGUAGE plpgsql
               STABLE
              AS $function$
              DECLARE
                  v_params dbops.automation_rules_tbl.params%TYPE;
                  -- un nome di colonna, nessuna colonna lo porta
                  v_base   text;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   La regola di scadenza di una tabella, una sola sede per i tre che la
                  --   applicano: il trigger alla nascita (dbops.trgfn_cleanup_at_alla_nascita),
                  --   il runner sul pregresso (dbops.fn_run_automations_cleanup) e chi ricalcola
                  --   la scadenza da se' (script.fn_registra_tentativo_login).
                  --
                  -- Regole:
                  --   - la regola e' la CLEANUP_AT abilitata piu' specifica che copre la tabella:
                  --     priority, poi id; la *all vale se non c'e' niente di piu' specifico;
                  --   - nessuna regola → nessuna riga: la tabella non scade;
                  --   - una riga col motivo_salto valorizzato → la regola c'e' ma non si applica,
                  --     e la tabella non scade:
                  --       EXCLUDED               la tabella e' in automation_cleanup_exclusions;
                  --       NO_CLEANUP_COLUMN      la tabella non ha la colonna cleanup_at;
                  --       MISSING_BASE_TS_COLUMN la colonna base dichiarata non c'e', o non e'
                  --                              dichiarata e la catena non ne trova nessuna;
                  --   - la colonna base: base_ts_column della regola se dichiarata; se no la prima
                  --     che la tabella ha fra data_insert, executed_at, occurred_at, created_at;
                  --   - la scadenza si scrive in cleanup_at, nome fisso del framework.
                  --
                  -- ⚠️ Tutto qualificato: la chiama anche una funzione SECURITY DEFINER con
                  --   search_path stretto (script.fn_registra_tentativo_login).
                  -- =========================================================
                  IF NULLIF(btrim(p_schema), '') IS NULL OR NULLIF(btrim(p_table), '') IS NULL THEN
                      RETURN;
                  END IF;

                  SELECT r.id, r.params
                    INTO regola_id, v_params
                    FROM dbops.automation_rules_tbl r
                   WHERE r.enabled
                     AND r.rule_type = 'CLEANUP_AT'
                     AND dbops.fn_schema_match(r.target_schema, p_schema)
                     AND (upper(r.target_table) = '*ALL' OR p_table ILIKE r.target_table)
                   ORDER BY r.priority, r.id
                   LIMIT 1;

                  IF NOT FOUND THEN
                      RETURN;
                  END IF;

                  -- La forma dei params la garantisce chk_automation_rules_tbl_regola_valida:
                  -- ttl_days intero >= 1, apply_on_update booleano.
                  ttl_days        := (v_params ->> 'ttl_days')::integer;
                  apply_on_update := COALESCE((v_params ->> 'apply_on_update')::boolean, false);
                  v_base          := NULLIF(btrim(v_params ->> 'base_ts_column'), '');

                  IF dbops.fn_cleanup_esclusa(p_schema, p_table) THEN
                      motivo_salto := 'EXCLUDED';
                  ELSIF NOT dbops.fn_col_exists(p_schema, p_table, 'cleanup_at') THEN
                      motivo_salto := 'NO_CLEANUP_COLUMN';
                  ELSIF v_base IS NOT NULL THEN
                      base_ts_column := v_base;
                      IF NOT dbops.fn_col_exists(p_schema, p_table, v_base) THEN
                          motivo_salto := 'MISSING_BASE_TS_COLUMN';
                      END IF;
                  ELSE
                      SELECT c.col
                        INTO base_ts_column
                        FROM unnest(ARRAY['data_insert', 'executed_at', 'occurred_at', 'created_at'])
                             WITH ORDINALITY AS c(col, ord)
                       WHERE dbops.fn_col_exists(p_schema, p_table, c.col)
                       ORDER BY c.ord
                       LIMIT 1;
                      IF base_ts_column IS NULL THEN
                          motivo_salto := 'MISSING_BASE_TS_COLUMN';
                      END IF;
                  END IF;

                  RETURN NEXT;
              END
              $function$;

              COMMENT ON FUNCTION dbops.fn_cleanup_at_regola(
                  dbops.automation_rules_tbl.target_schema%TYPE,
                  dbops.automation_rules_tbl.target_table%TYPE) IS
              'La regola di scadenza (CLEANUP_AT) di una tabella, letta da chi scrive cleanup_at: dbops.trgfn_cleanup_at_alla_nascita all''INSERT, dbops.fn_run_automations_cleanup sul pregresso, script.fn_registra_tentativo_login a ogni fallimento. La regola e'' la CLEANUP_AT abilitata piu'' specifica di dbops.automation_rules_tbl (priority, poi id; la *all se non c''e'' altro). Nessuna riga = nessuna regola, la tabella non scade. Una riga con motivo_salto valorizzato = la regola c''e'' ma non si applica, e la tabella non scade: EXCLUDED (dbops.fn_cleanup_esclusa), NO_CLEANUP_COLUMN (manca cleanup_at), MISSING_BASE_TS_COLUMN (la colonna base dichiarata non c''e'', o non e'' dichiarata e la tabella non ha data_insert, executed_at, occurred_at ne'' created_at, la catena in quest''ordine). Colonne: regola_id, ttl_days, base_ts_column (quella dichiarata o quella della catena), apply_on_update (default false), motivo_salto. Schema o tabella vuoti: nessuna riga. La scadenza e'' base + ttl_days e sta in cleanup_at, nome fisso del framework.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION IF EXISTS dbops.fn_cleanup_at_regola(text, text);
