databaseChangeLog:
  - logicalFilePath: /migrations_v2/20_code/dbops/20260113-05-update-fn-drop-triggers-by-function-args-mctit.yaml

  - changeSet:
      id: 20260113-05-update-fn-drop-triggers-by-function-args
      # runAlways: true
      validCheckSum:
        - ANY
      author: mctit
      comment: >
        Drop del parent,Evita drop di trigger interni e su tabelle partizionate.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_drop_triggers_by_function_args(
                p_rel         regclass,
                p_func_schema text,
                p_func_name   text,
                VARIADIC p_args text[]
              ) RETURNS int
              LANGUAGE plpgsql AS $$
              DECLARE
                r    record;
                n    int := 0;
                pat  text;
              BEGIN
                pat := format(
                        'EXECUTE FUNCTION %I.%I(%s)',
                        p_func_schema, p_func_name,
                        array_to_string(ARRAY(SELECT quote_literal(a) FROM unnest(p_args) a), ', ')
                      );

                FOR r IN
                  SELECT t.tgname
                  FROM pg_trigger t
                  JOIN pg_class c ON c.oid = t.tgrelid
                  WHERE t.tgrelid = p_rel
                    AND NOT t.tgisinternal
                    AND NOT c.relispartition
                    --AND c.relkind <> 'p'
                    AND pg_get_triggerdef(t.oid) ILIKE ('%'||pat||'%')
                LOOP
                  EXECUTE format('DROP TRIGGER IF EXISTS %I ON %s', r.tgname, p_rel::text);
                  n := n + 1;
                END LOOP;

                RETURN n;
              END;
              $$;
