# D1+D2 pezzo 3 — IL PRESIDIO: LAVORO CHE NESSUN GIRO RIVENDICA
#   dbops.vw_af_senza_giro
#   Piano: brief-residuo-fatturabili-e-bandiere-esito-parziale, sezione 9
#
# ── ⭐⭐ PERCHE' ESISTE, ED E' LA PARTE CHE SI DIMENTICA ────────────
#   Il rimedio di D1 cambia il RUMORE del danno, e va detto prima che qualcuno
#   se ne accorga dopo:
#
#     OGGI    una riga libera di troppo produce una FATTURA IN PIU'.
#             Sbagliato, ma SI VEDE: c'e' un documento che non doveva nascere.
#     DOMANI  una riga che nessun giro ri-marchia NON VIENE FATTURATA.
#             Per sempre, e SENZA NESSUN ERRORE.
#
#   ⛔ E «non e' successo niente» lo nota solo chi si aspettava qualcosa. E' la
#   stessa forma del «FATTO, 0 elaborate» che nessuno legge: il fail-closed da
#   solo non e' un presidio, e' un silenzio piu' educato.
#   ⇒ Questa vista e' la controparte obbligatoria del marchio. Senza, D1 si
#   chiude scambiando un difetto rumoroso con uno muto.
#
# ── ⭐ NASCE PIENA, E SI SVUOTA DA SE' ─────────────────────────────
#   Al primo giro dopo il 20260904-31 nessuna riga porta un marchio: la vista
#   elenca tutto il lavoro libero. Non e' un difetto della vista, e' il
#   REGISTRO DEL DEBITO — e cala da solo, perche' il pull ri-adotta le righe
#   esistenti e ci scrive sopra il proprio nome (una per una, al primo giro in
#   cui quella commessa passa).
#   ⭐ Cio' che RESTA dopo qualche giro e' la domanda vera: lavoro libero, in
#   competenza, che nessun giro ha mai rivendicato. Ed e' esattamente la riga
#   da guardare.
#
# ── ⛔ LA SCORCIATOIA DA NON PRENDERE ──────────────────────────────
#   «Contiamo solo le righe nate dopo la colonna, cosi' la vista parte vuota».
#   No: escludere il pregresso e' il modo classico di far nascere un presidio
#   gia' verde. Le righe di prima sono ESATTAMENTE la popolazione del difetto
#   D1 — le tre del collaudo del 2026-09-04 sono di quelle.
#
# ── ⚠️ COSA QUESTA VISTA NON DICE ─────────────────────────────────
#   Non elenca il lavoro che in fatturazione non e' MAI ENTRATO: una commessa
#   che nessun giro ha pullato non ha nessuna riga qui, e non deve averla —
#   quella domanda ha gia' la sua superficie, la lane
#   (fn_list_commesse_emittibili / fn_list_emittibili_lane). Confonderle
#   renderebbe questa vista un elenco di due cose diverse, e quindi di nessuna.
#   E' il caso del §7 del brief, chiuso il 2026-09-04.
#
# ── ⚠️ `fatturato` E' GENERATA ────────────────────────────────────
#   Si legge, non si scrive: e' `fattura_riga_id IS NOT NULL`. Sta nel
#   predicato perche' una riga gia' fatturata non e' lavoro che aspetta —
#   qualunque sia il suo marchio.
#
# ── ℹ️ security_invoker ───────────────────────────────────────────
#   `vendite.attivita_fatturabili` oggi non ha RLS, quindi non cambia nulla in
#   pratica; si mette lo stesso, come le sorelle di dbops, perche' una vista
#   non deve poter dare piu' di quanto chi la interroga possa gia' leggere.
#   ⚠️ E si mette DENTRO la CREATE OR REPLACE: l'opzione si azzera a ogni
#   sostituzione della vista, quindi un ALTER separato sopravvive fino alla
#   prossima riscrittura e poi sparisce in silenzio.
#
# Dipendenze: la colonna del 20260904-31.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20260904-34-create-vw-af-senza-giro-mctit.yaml

  - changeSet:
      id: 20260904-34-create-vw-af-senza-giro
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Crea dbops.vw_af_senza_giro: attivita'' fatturabili LIBERE, non ancora fatturate, che nessun giro
        ha marchiato. ⭐ E'' la controparte obbligatoria del marchio: il rimedio di D1 trasforma una
        fattura di troppo — che si vede — in una fattura che non nasce, che non si vede. ⭐ Nasce PIENA
        ed e'' il registro del debito: cala da sola perche'' il pull ri-adotta le righe esistenti e le
        rimarchia. ⛔ Non si esclude il pregresso per farla partire verde: quelle righe SONO la
        popolazione del difetto. ⚠️ Non elenca il lavoro mai entrato in fatturazione — quella domanda ha
        gia'' la lane. Piano: brief-residuo-fatturabili-e-bandiere-esito-parziale, sezione 9.
      preConditions:
        - onFail: HALT
        - columnExists:
            schemaName: vendite
            tableName: attivita_fatturabili
            columnName: emit_batch_id
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- =========================================================
              -- Scopo:
              --   Elencare il lavoro che sta in coda di fatturazione e che
              --   NESSUN GIRO rivendica: riga libera, non fatturata, senza
              --   marchio di consegna.
              --
              -- ⭐ Deve restare VUOTA. Finche' non lo e', ogni riga e' una
              --   domanda con una risposta sola: «quale giro doveva
              --   consegnarla, e perche' non l'ha fatto?».
              --
              -- ⚠️ Il predicato e' quello della select di fatturazione, meno
              --   le coordinate: `fatturato IS FALSE` e non lucchettata sono
              --   le due condizioni che dicono «lavoro che aspetta». Le
              --   coordinate (competenza, tipo documento, emittente) NON ci
              --   sono di proposito: una riga senza giro e' un problema
              --   qualunque sia il mese in cui cadrebbe.
              -- =========================================================
              CREATE OR REPLACE VIEW dbops.vw_af_senza_giro
                  WITH (security_invoker = true) AS
              SELECT a.id                   AS attivita_fatturabile_id,
                     a.commessa_id,
                     a.commessa_attivita_id,
                     a.competenza_mese,
                     a.data_attivita,
                     a.billing_account_id,
                     -- Chi deve guardarla: e' la stessa risoluzione che usa
                     -- fn_select_attivita_fatturabili per il proprio filtro
                     -- di emittente.
                     anagrafiche.fn_get_emittente_fiscale_id(a.billing_account_id)
                                            AS emittente_soggetto_ruolo_id,
                     a.tipo_doc_fiscale_id,
                     a.tipo_movimento,
                     -- Quanto e' vecchia l'omissione: contesto, non criterio.
                     a.data_insert
                FROM vendite.attivita_fatturabili a
               WHERE a.emit_batch_id IS NULL
                 -- `fatturato` e' GENERATA (fattura_riga_id IS NOT NULL):
                 -- si legge e basta.
                 AND a.fatturato IS FALSE
                 AND COALESCE(a.lock_in_fatturazione, false) IS FALSE;

              COMMENT ON VIEW dbops.vw_af_senza_giro IS
              'Attivita'' fatturabili libere e non fatturate che NESSUN GIRO ha marchiato (emit_batch_id NULL). ⭐ Deve restare vuota, ed e'' la controparte obbligatoria del marchio introdotto dal 20260904-31: il rimedio a D1 trasforma un danno RUMOROSO (una fattura di troppo, che si vede) in uno MUTO (una fattura che non nasce, e nessuno se ne accorge) — questa vista e'' cio'' che lo rende di nuovo visibile. ⭐ Nasce PIENA: e'' il registro del debito, e cala da sola perche'' il pull ri-adotta le righe esistenti e ci scrive sopra il proprio giro. ⛔ Non si esclude il pregresso per farla partire verde: quelle righe sono esattamente la popolazione del difetto. ⚠️ NON elenca il lavoro mai entrato in fatturazione (una commessa che nessun giro ha pullato non ha righe qui): quella domanda ha gia'' la sua superficie nella lane. Piano: brief-residuo-fatturabili-e-bandiere-esito-parziale, sezione 9.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP VIEW IF EXISTS dbops.vw_af_senza_giro;
