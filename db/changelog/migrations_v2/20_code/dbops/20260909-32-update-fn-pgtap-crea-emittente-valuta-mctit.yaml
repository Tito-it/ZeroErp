# ------------------------------------------------------------
# `dbops.fn_pgtap_crea_emittente` valorizza anche la VALUTA dell'emittente.
#
# ── ⛔ IL DIFETTO, e si vede solo da zero ─────────────────────────────
#   `vendite.fn_get_valuta_id` risolve in cascata: billing account, poi
#   EMITTENTE, poi gestore. Su dbdev il terzo anello regge — un gestore c'e' —
#   quindi un emittente senza valuta non da' fastidio a nessuno. Su un database
#   ricostruito dai changelog non c'e' nessuno dei tre, e il primo documento
#   muore con «Configurazione mancante: valuta non risolta (BA/emittente/gestore)».
#   ⭐ Misurato il 2026-09-09: e' la causa di 11 dei 185 file di
#   `db/pgtap/vendite/` che sul database scratch morivano nel fixture.
#
# ── ⚠️ E NON BASTA METTERLA SUL BILLING ACCOUNT ──────────────────────
#   Provato lo stesso giorno: quando il resolver gira dentro un trigger
#   sull'INSERT del BA, la riga del BA non e' ancora visibile e il primo anello
#   risponde NULL. L'emittente invece esiste gia', ed e' l'anello che entrambi
#   gli emittenti veri di dbdev hanno valorizzato.
#
# ⚠️ CREATE OR REPLACE in un changeSet NUOVO: `20260909-26` e' gia' applicato e
#   non si tocca. La firma e il `RETURNS TABLE` non cambiano, quindi non serve
#   un DROP.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20260909-32-update-fn-pgtap-crea-emittente-valuta-mctit.yaml

  - changeSet:
      id: 20260909-32-update-fn-pgtap-crea-emittente-valuta
      author: mctit
      runOnChange: false
      comment: >
        dbops.fn_pgtap_crea_emittente valorizza anche valuta_id: senza,
        vendite.fn_get_valuta_id non risolve su un database ricostruito dai
        changelog (nessun BA, nessun emittente con valuta, nessun gestore) e
        ogni fixture che crea un documento muore su E_CONFIG_MANCANTE.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_pgtap_crea_emittente(
                  p_sigla anagrafiche.emittenti_fiscali.codice%TYPE DEFAULT NULL
              )
               RETURNS TABLE (
                  emittente_fiscale_id anagrafiche.emittenti_fiscali.id%TYPE,
                  emittente_codice     anagrafiche.emittenti_fiscali.codice%TYPE,
                  soggetto_ruolo_id    anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE,
                  soggetto_id          anagrafiche.soggetti.id%TYPE
               )
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: creare per una fixture pgTAP un emittente fiscale nuovo,
              --   completo del soggetto persona giuridica, del ruolo EF e della
              --   valuta.
              DECLARE
                  v_soggetto_id anagrafiche.soggetti.id%TYPE;
                  v_sr_id       anagrafiche.soggetti_ruoli.id%TYPE;
                  v_codice      anagrafiche.emittenti_fiscali.codice%TYPE;
                  v_ef_id       anagrafiche.emittenti_fiscali.id%TYPE;
                  v_try         integer := 0;
                  v_libera      boolean := FALSE;
              BEGIN
                  -- Sigla LIBERA: `uq:codice` e' UNIQUE senza filtro su
                  -- `attivo`, quindi una sigla fissa farebbe collidere la
                  -- seconda corsa col residuo della prima.
                  -- ⚠️ La forma la impone chk_emittenti_fiscali_codice_forma:
                  -- solo maiuscole e cifre, da 2 a 10 caratteri.
                  IF p_sigla IS NOT NULL THEN
                      v_codice := p_sigla;
                  ELSE
                      LOOP
                          v_try := v_try + 1;
                          EXIT WHEN v_try > 9999;
                          v_codice := 'PGTR' || lpad(v_try::text, 4, '0');
                          IF NOT EXISTS (SELECT 1
                                           FROM anagrafiche.emittenti_fiscali e
                                          WHERE e.codice = v_codice) THEN
                              v_libera := TRUE;
                              EXIT;
                          END IF;
                      END LOOP;

                      IF NOT v_libera THEN
                          RAISE EXCEPTION
                              'fn_pgtap_crea_emittente: nessuna sigla PGTRnnnn libera';
                      END IF;
                  END IF;

                  v_soggetto_id := dbops.fn_pgtap_crea_soggetto_pg(
                                       'Emittente pgTAP ' || v_codice);
                  v_sr_id       := dbops.fn_pgtap_crea_soggetto_ruolo(
                                       v_soggetto_id, 'EF'::character varying);

                  -- ⚠️ `valuta_id` VALORIZZATA (rev 20260909-32).
                  --   `vendite.fn_get_valuta_id` risolve «BA -> EMITTENTE ->
                  --   gestore». Su dbdev regge l'ultimo anello; da zero non ne
                  --   regge nessuno, e il primo documento muore su
                  --   E_CONFIG_MANCANTE.
                  --   ⛔ Il primo anello non basta: quando il resolver gira
                  --   dentro un trigger sull'INSERT del billing account, la
                  --   riga del BA non e' ancora visibile.
                  -- ⭐ Nascendo, l'emittente fa nascere anche i propri registri
                  --   di numerazione (vendite.fn_provision_registri_emittente).
                  INSERT INTO anagrafiche.emittenti_fiscali
                      (soggetto_ruolo_id, codice, valuta_id)
                  VALUES (v_sr_id, v_codice,
                          (SELECT v.id FROM config.valute v ORDER BY v.id LIMIT 1))
                  RETURNING id INTO v_ef_id;

                  RETURN QUERY SELECT v_ef_id, v_codice, v_sr_id, v_soggetto_id;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_pgtap_crea_emittente(character varying)
              IS 'Helper di fixture pgTAP: crea un emittente fiscale nuovo — soggetto persona giuridica, ruolo EF, riga in anagrafiche.emittenti_fiscali con una sigla PGTRnnnn libera e la VALUTA valorizzata. ⚠️ La valuta non e'' un di piu'': vendite.fn_get_valuta_id risolve «BA -> emittente -> gestore», e su un database ricostruito dai changelog nessuno dei tre e'' valorizzato — il primo documento morirebbe su E_CONFIG_MANCANTE. Da sola NON basta a far vedere l''emittente a un test: per quello serve dbops.fn_pgtap_crea_emittente_operatore. Rev 20260909-32.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Per tornare alla forma senza `valuta_id` si ri-applica
              -- 20260909-26, che e' la revisione precedente della stessa
              -- funzione. Qui non c'e' niente da annullare.
              SELECT 1;
