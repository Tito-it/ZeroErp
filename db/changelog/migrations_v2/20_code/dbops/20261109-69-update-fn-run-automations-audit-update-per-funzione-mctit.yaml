# dbops.fn_run_automations_audit_update: il trigger si riconosce dalla funzione (D17,
#   N1), il nome dal registro (D20, N6), le colonne di audit col loro nome fisso: via
#   gli override AUDIT_TS/AUDIT_USER e i params audit_ts/audit_user, che decidevano solo
#   se montare un trigger che poi scriveva i nomi fissi (D27, N5); il dry run firma col
#   proprio nome (R1). Brief: brief-db-revisione-dbops, giro 10b (§26).
#   Corpo di partenza dal catalogo dello scratch (2026-11-08), uguale alla scheda
#   auto-generata; rollback = corpo e COMMENT di prima.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261109-69-update-fn-run-automations-audit-update-per-funzione-mctit.yaml

  - changeSet:
      id: 20261109-69-update-fn-run-automations-audit-update-per-funzione
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        fn_run_automations_audit_update: il trigger si riconosce dalla funzione, il nome sta nel registro. Brief: brief-db-revisione-dbops, giro 10b.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_proc
               WHERE oid = to_regprocedure('dbops.fn_run_automations_audit_update(text,text[],boolean)')
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_run_automations_audit_update(p_exec_mode text, p_schemas text[], p_dry_run boolean)
               RETURNS void
               LANGUAGE plpgsql
              AS $function$
                  DECLARE
                -- ⭐ Rev 2026-10-16: il contesto dell'errore, costruito una volta e usato
                --   dalle due chiamate del gestore (registro e involucro).
                v_ctx_errore dbops.error_log.context%TYPE;
                    v_schemas text[];
                    rtab record;
                    rrule record;
                    rel  regclass;
                    has_du boolean;
                    has_uu boolean;
                    tmpl     text;
                    trg_name text;
                  BEGIN

                    /*
                      Scopo
                      -----
                      Esegue l'automazione di provisioning dei trigger "AUDIT_UPDATE" sulle tabelle in scope,
                      applicando le regole abilitate in dbops.automation_rules_tbl (rule_type = 'AUDIT_UPDATE').

                      Obiettivo del trigger:
                      - mantenere aggiornati i campi audit (data_update, user_update, user_insert)
                        ad ogni INSERT e UPDATE, secondo la convenzione di audit del database.
                      - user_insert/user_update usano la GUC app.jwt_user se disponibile (JWT reale).

                      Trigger generato
                      ----------------
                      BEFORE INSERT OR UPDATE
                      EXECUTE FUNCTION script.trgfn_audit_data_user_generic()
                    */

                    v_schemas := dbops.fn_resolve_scope(p_schemas);
                    FOR rtab IN
                      SELECT n.nspname AS schema_name,
                            c.relname AS table_name,
                            (quote_ident(n.nspname)||'.'||quote_ident(c.relname))::regclass AS rel
                      FROM pg_class c
                      JOIN pg_namespace n ON n.oid=c.relnamespace
                      WHERE c.relkind='r'
                        AND n.nspname = ANY(v_schemas)
                        AND dbops.fn_table_in_scope(n.nspname, c.relname)
                    LOOP
                      rel := rtab.rel;

                      FOR rrule IN
                        SELECT *
                          FROM dbops.automation_rules_tbl r
                        WHERE r.enabled
                          AND upper(btrim(r.rule_type))='AUDIT_UPDATE'
                          AND dbops.fn_schema_match(r.target_schema, rtab.schema_name)
                          AND (UPPER(r.target_table) = '*ALL' OR rtab.table_name ILIKE r.target_table)
                          AND (upper(btrim(r.exec_mode)) = 'AUTO' OR r.exec_mode = p_exec_mode)
                        ORDER BY r.priority, r.id
                      LOOP

                        -- Le colonne di audit hanno nome fisso per contratto (linee-guida-sql
                        -- §7): script.trgfn_audit_data_user_generic le scrive per nome.
                        SELECT dbops.fn_col_exists(rtab.schema_name, rtab.table_name, 'data_update')
                            , dbops.fn_col_exists(rtab.schema_name, rtab.table_name, 'user_update')
                          INTO has_du, has_uu;

                        IF has_du AND has_uu THEN
                          tmpl     := rrule.name_template;
                          trg_name := dbops.fn_name_from_template(tmpl, rtab.schema_name, rtab.table_name, NULL,NULL,NULL,NULL);

                          IF NOT dbops.fn_trigger_exists_by_function(rel, 'script', 'trgfn_audit_data_user_generic')
                          THEN
                            IF p_dry_run THEN

                                PERFORM dbops.fn_audit_log_once(
                                p_function_name => 'dbops.fn_run_automations_audit_update',
                                p_status        => 'DRYRUN',
                                p_rule_type     => 'AUDIT_UPDATE',
                                p_exec_mode     => p_exec_mode,
                                p_parts         => ARRAY['AUDIT_UPDATE'],
                                p_dry_run       => true,
                                p_params        => jsonb_build_object(
                                                    'table', rtab.schema_name||'.'||rtab.table_name,
                                                    'trigger', trg_name,
                                                    'action', 'DRYRUN_CREATE_TRIGGER'
                                                  ),
                                p_message       => 'Trigger would be created'
                              );

                            ELSE
                              BEGIN
                                EXECUTE format($f$
                                  CREATE TRIGGER %I
                                  BEFORE INSERT OR UPDATE ON %I.%I
                                  FOR EACH ROW
                                  EXECUTE FUNCTION script.trgfn_audit_data_user_generic()
                                $f$, trg_name, rtab.schema_name, rtab.table_name);
                              EXCEPTION WHEN others THEN

                                  -- ⭐ Rev 2026-10-16 (brief-db-presidio-job-run-a-chi-tocca D8, D10, D11):
                                  --   un guasto dell'AMBIENTE (script.fn_sqlstate_di_ambiente: connessione,
                                  --   risorse, arresto, sistema, privilegio, lock) si rilancia COM'E', col suo
                                  --   SQLSTATE: l'involucro lo faceva diventare P0001, e il presidio dei job lo
                                  --   mandava allo sviluppo. Prima si scrive nel registro errori, col contesto.
                                  v_ctx_errore := jsonb_build_object(
                                      'where','AUDIT_UPDATE',
                                      'table', rtab.schema_name||'.'||rtab.table_name,
                                      'error', SQLERRM
                                    );
                                  IF script.fn_sqlstate_di_ambiente(SQLSTATE) THEN
                                    PERFORM script.fn_log_error_only(
                                        'dbops', 'run_automations', 'E_AUDIT_UPDATE',
                                        v_ctx_errore, NULL::uuid, SQLERRM);
                                    RAISE;
                                  END IF;
                                  PERFORM script.fn_log_and_raise_error(
                                      'dbops', 'run_automations', 'E_AUDIT_UPDATE',
                                      v_ctx_errore, NULL::uuid, SQLERRM);
                              END;
                            END IF;
                          END IF;
                        END IF;
                      END LOOP;
                    END LOOP;
                  END;

              $function$;

              COMMENT ON FUNCTION dbops.fn_run_automations_audit_update(text, text[], boolean) IS
                  'Automazione AUDIT_UPDATE: monta script.trgfn_audit_data_user_generic (BEFORE INSERT OR UPDATE, utente dalla GUC app.jwt_user) sulle tabelle dell''ambito che hanno data_update e user_update, secondo le regole AUDIT_UPDATE di dbops.automation_rules_tbl. Le colonne di audit hanno nome fisso: il trigger le scrive per nome. Il trigger si riconosce dalla funzione, qualunque nome abbia; il nome di uno nuovo viene dal name_template della regola. In simulazione una riga DRYRUN per trigger in dbops.audit_log, firmata col proprio nome. Un guasto dell''ambiente (script.fn_sqlstate_di_ambiente) si scrive nel registro errori e si rilancia col suo SQLSTATE; i difetti di struttura escono col codice dell''automazione.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_run_automations_audit_update(p_exec_mode text, p_schemas text[], p_dry_run boolean)
               RETURNS void
               LANGUAGE plpgsql
              AS $function$
                  DECLARE
                -- ⭐ Rev 2026-10-16: il contesto dell'errore, costruito una volta e usato
                --   dalle due chiamate del gestore (registro e involucro).
                v_ctx_errore dbops.error_log.context%TYPE;
                    v_schemas text[];
                    rtab record;
                    rrule record;
                    rel  regclass;
                    has_du boolean;
                    has_uu boolean;
                    col_ts   text;
                    col_user text;
                    tmpl     text;
                    trg_name text;
                    exist_strat text;
                  BEGIN

                    /*
                      Scopo
                      -----
                      Esegue l'automazione di provisioning dei trigger "AUDIT_UPDATE" sulle tabelle in scope,
                      applicando le regole abilitate in dbops.automation_rules_tbl (rule_type = 'AUDIT_UPDATE').

                      Obiettivo del trigger:
                      - mantenere aggiornati i campi audit (data_update, user_update, user_insert)
                        ad ogni INSERT e UPDATE, secondo la convenzione di audit del database.
                      - user_insert/user_update usano la GUC app.jwt_user se disponibile (JWT reale).

                      Trigger generato
                      ----------------
                      BEFORE INSERT OR UPDATE
                      EXECUTE FUNCTION script.trgfn_audit_data_user_generic()
                    */

                    v_schemas := dbops.fn_resolve_scope(p_schemas);
                    FOR rtab IN
                      SELECT n.nspname AS schema_name,
                            c.relname AS table_name,
                            (quote_ident(n.nspname)||'.'||quote_ident(c.relname))::regclass AS rel
                      FROM pg_class c
                      JOIN pg_namespace n ON n.oid=c.relnamespace
                      WHERE c.relkind='r'
                        AND n.nspname = ANY(v_schemas)
                        AND dbops.fn_table_in_scope(n.nspname, c.relname)
                    LOOP
                      rel := rtab.rel;

                      FOR rrule IN
                        SELECT *
                          FROM dbops.automation_rules_tbl r
                        WHERE r.enabled
                          AND upper(btrim(r.rule_type))='AUDIT_UPDATE'
                          AND dbops.fn_schema_match(r.target_schema, rtab.schema_name)
                          AND (UPPER(r.target_table) = '*ALL' OR rtab.table_name ILIKE r.target_table)
                          AND (upper(btrim(r.exec_mode)) = 'AUTO' OR r.exec_mode = p_exec_mode)
                        ORDER BY r.priority, r.id
                      LOOP
                        exist_strat := COALESCE(rrule.existence_strategy,'BY_NAME');

                        col_ts   := dbops.fn_get_override_col(rtab.schema_name, rtab.table_name, 'AUDIT_TS',   COALESCE(rrule.params->>'audit_ts','data_update'));
                        col_user := dbops.fn_get_override_col(rtab.schema_name, rtab.table_name, 'AUDIT_USER', COALESCE(rrule.params->>'audit_user','user_update'));

                        SELECT dbops.fn_col_exists(rtab.schema_name, rtab.table_name, col_ts)
                            , dbops.fn_col_exists(rtab.schema_name, rtab.table_name, col_user)
                          INTO has_du, has_uu;

                        IF has_du AND has_uu THEN
                          tmpl     := COALESCE(rrule.name_template,'trg_{table}_audit_data_user_upd');
                          trg_name := dbops.fn_name_from_template(tmpl, rtab.schema_name, rtab.table_name, NULL,NULL,NULL,NULL);

                          IF (exist_strat='BY_NAME'     AND NOT dbops.fn_trigger_exists_by_name(rel, trg_name))
                          OR (exist_strat='BY_FUNCTION' AND NOT dbops.fn_trigger_exists_by_function(rel,'script','trgfn_audit_data_user_generic'))
                          OR (exist_strat='BOTH'        AND NOT (dbops.fn_trigger_exists_by_name(rel, trg_name)
                                                            OR dbops.fn_trigger_exists_by_function(rel,'script','trgfn_audit_data_user_generic')))
                          THEN
                            IF p_dry_run THEN

                                PERFORM dbops.fn_audit_log_once(
                                p_function_name => 'dbops.fn_run_automations',
                                p_status        => 'DRYRUN',
                                p_rule_type     => 'AUDIT_UPDATE',
                                p_exec_mode     => p_exec_mode,
                                p_parts         => ARRAY['AUDIT_UPDATE'],
                                p_dry_run       => true,
                                p_params        => jsonb_build_object(
                                                    'table', rtab.schema_name||'.'||rtab.table_name,
                                                    'trigger', trg_name,
                                                    'action', 'DRYRUN_CREATE_TRIGGER'
                                                  ),
                                p_message       => 'Trigger would be created'
                              );

                            ELSE
                              BEGIN
                                EXECUTE format($f$
                                  CREATE TRIGGER %I
                                  BEFORE INSERT OR UPDATE ON %I.%I
                                  FOR EACH ROW
                                  EXECUTE FUNCTION script.trgfn_audit_data_user_generic()
                                $f$, trg_name, rtab.schema_name, rtab.table_name);
                              EXCEPTION WHEN others THEN

                                  -- ⭐ Rev 2026-10-16 (brief-db-presidio-job-run-a-chi-tocca D8, D10, D11):
                                  --   un guasto dell'AMBIENTE (script.fn_sqlstate_di_ambiente: connessione,
                                  --   risorse, arresto, sistema, privilegio, lock) si rilancia COM'E', col suo
                                  --   SQLSTATE: l'involucro lo faceva diventare P0001, e il presidio dei job lo
                                  --   mandava allo sviluppo. Prima si scrive nel registro errori, col contesto.
                                  v_ctx_errore := jsonb_build_object(
                                      'where','AUDIT_UPDATE',
                                      'table', rtab.schema_name||'.'||rtab.table_name,
                                      'error', SQLERRM
                                    );
                                  IF script.fn_sqlstate_di_ambiente(SQLSTATE) THEN
                                    PERFORM script.fn_log_error_only(
                                        'dbops', 'run_automations', 'E_AUDIT_UPDATE',
                                        v_ctx_errore, NULL::uuid, SQLERRM);
                                    RAISE;
                                  END IF;
                                  PERFORM script.fn_log_and_raise_error(
                                      'dbops', 'run_automations', 'E_AUDIT_UPDATE',
                                      v_ctx_errore, NULL::uuid, SQLERRM);
                              END;
                            END IF;
                          END IF;
                        END IF;
                      END LOOP;
                    END LOOP;
                  END;

              $function$;

              COMMENT ON FUNCTION dbops.fn_run_automations_audit_update(text, text[], boolean) IS
                  'Crea i trigger di audit INSERT OR UPDATE (timestamp/utente con JWT). ⭐ Rev 2026-10-16: nel gestore WHEN others, un guasto dell''AMBIENTE (script.fn_sqlstate_di_ambiente: 08, 53, 57, 58, 42501, 55P03) si rilancia COM''E'', col suo SQLSTATE, dopo averlo scritto nel registro errori con lo stesso codice e contesto (fn_log_error_only). Prima diventava P0001 col codice dell''involucro, e il presidio dei job (maintenance.vw_job_run_da_guardare) lo mandava allo sviluppo. I difetti di struttura escono come prima. Brief: brief-db-presidio-job-run-a-chi-tocca D8, D11.';
