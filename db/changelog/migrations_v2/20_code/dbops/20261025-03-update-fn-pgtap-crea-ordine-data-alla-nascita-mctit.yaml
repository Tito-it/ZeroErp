            sql: |
              DROP FUNCTION IF EXISTS dbops.fn_pgtap_crea_ordine(text, config.stati_doc_ordini.codice_interno%TYPE, vendite.ordini.billing_account_id%TYPE, vendite.ordini.data%TYPE);

