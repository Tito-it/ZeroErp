# ⛔ IL CONFRONTO A DUE FONTI NON GUARDAVA CHI HA SCRITTO LA RISPOSTA.
#   Segnalazione: backend, brief-db-sveglia-dei-processi §9.5-bis. Risposta qui.
#
#   `GIRA_E_NON_REGISTRA` mette a confronto due fonti: pgAgent dice che il job
#   e' girato, e il giornale dovrebbe dirlo anche lui. ⚠️ Ma la LATERAL del
#   giornale leggeva
#
#       WHERE r.processo_codice = p.codice OR r.jobname = p.codice
#
#   senza guardare `origine`. ⇒ Una corsa registrata da CHIUNQUE ALTRO sotto lo
#   stesso codice sposta avanti `giornale_ultima_corsa`, il confronto torna, e
#   il rilevatore di R-12 si spegne — sul job che sta sorvegliando, e lo spegne
#   un attore che non e' pgAgent.
#
# ── ⛔ E NON E' UN'IPOTESI: IL CONTROESEMPIO ERA VIVO ───────────────
#   Letto su dbdev il 2026-09-07. `sync_auth_user_expired_daily`:
#
#       pgAgent ultima corsa   2026-09-07 06:00:04
#       giornale ultima corsa  2026-09-07 11:11:00   ← origine COMMAND, jobname 'x'
#
#   Sei righe scritte in tre millisecondi da una suite di collaudo del backend,
#   e il panorama le raccontava come «l'ultima corsa di quel processo». ⚠️ Su un
#   job GIORNALIERO il difetto rientra da solo il giorno dopo; su uno
#   SETTIMANALE — cioe' su `apply_storicizza_weekly`, il job da cui questo intero
#   cantiere e' nato — una riga estranea nella settimana lo maschera per intero.
#
# ── ⛔ LA PREMESSA DEL §9.5-bis E' SBAGLIATA, E VA CORRETTA ─────────
#   Il backend scrive: «un filtro secco origine = 'PGAGENT' taglierebbe fuori
#   chiusura_scadenze_daily, che e' CODA_AUTOMATICA: lo sveglia pgAgent ma il
#   run lo registra il worker della coda, con un'altra origine».
#   ⚠️ Non e' cosi', ed e' STRUTTURA, non una fotografia: il wrapper di quel job
#   e' `maintenance.proc_accoda_chiusura_scadenze_job`, una procedura DB che
#   chiama `fn_run_and_log` — e `maintenance.job_run_log.origine` ha DEFAULT
#   'PGAGENT'. La corsa che quel job registra E' la sveglia, e porta PGAGENT.
#   ⭐ Cio' che il worker della coda registra DOPO e' un altro processo
#   (`draina_coda_lavori`), con una riga di catalogo sua e una riga sua nel
#   panorama: la sveglia e il lavoro sono due processi, e il catalogo li separa
#   gia'.
#
# ── ⚠️ IL LIMITE, DETTO QUI E NON SCOPERTO DOPO ────────────────────
#   `origine` e' un DEFAULT, non una dichiarazione: chiunque chiami
#   `fn_run_and_log` senza dire niente scrive 'PGAGENT'. ⇒ Questo filtro chiude
#   il buco dal lato che DICHIARA — il backend, che passa ORIGINE_CRON o
#   ORIGINE_COMMAND — e NON lo chiude su un wrapper lanciato a mano da psql, che
#   e' indistinguibile da pgAgent. E' meno di quanto sembra e piu' di niente, e
#   sta scritto nel commento della colonna perche' chi legge il verdetto sappia
#   su che cosa poggia.
#
# ── ⭐ DUE COLONNE, E LA SECONDA NON SOSTITUISCE LA PRIMA ───────────
#   `giornale_ultima_corsa` RESTA la fotografia piena, e non e' un ripiego: per
#   i sei processi `COMMAND` — che pgAgent non sveglia affatto — e' l'unica
#   informazione utile della riga, e filtrarla li' vorrebbe dire svuotarla.
#   ⇒ Il verdetto si appoggia a `giornale_ultima_corsa_pgagent`, che nasce
#   accanto e si vede: un presidio la cui prova non e' esposta e' un presidio
#   che non si puo' contestare.
#   ⚠️ `ultimo_esito` NON viene filtrato, ed e' una scelta: e' l'esito
#   dell'ultima corsa CHIUNQUE l'abbia scritta, cioe' contesto. Il verdetto
#   poggia sulle due date, e i run rossi hanno il loro presidio altrove
#   (maintenance.vw_job_run_da_guardare).
#
# ── ⚠️ LA COLONNA VA IN CODA, E NON E' UNA SCELTA ──────────────────
#   `CREATE OR REPLACE VIEW` sa solo AGGIUNGERE colonne in fondo. `da_guardare`
#   era l'ultima (20260907-01), quindi la nuova le va dietro — anche se per
#   lettura starebbe bene accanto a `giornale_ultima_corsa`. Nomi, tipi e ordine
#   di tutte le altre restano identici.
#
# ── ⚠️ E ANCHE QUESTO E' UN VOCABOLARIO CHIUSO IN DUE POSTI ────────
#   `chk_job_run_log_origine` ammette PGAGENT / CRON / COMMAND; questa vista ne
#   nomina uno. Un'origine nuova domani non conterebbe come risposta di pgAgent
#   e produrrebbe un falso allarme su un processo sano — che e' esattamente il
#   difetto contro cui il §7 del backend mette in guardia. ⇒ I due elenchi li
#   tiene legati un pgTAP (test 11), come gia' per i canali: un valore nuovo fa
#   rosso il test, non un allarme in produzione.
#
# Verifica: db/pgtap/dbops/test-vw-processi-programmazione.sql
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20260907-06-update-vw-processi-programmazione-origine-mctit.yaml

  - changeSet:
      id: 20260907-06-update-vw-processi-programmazione-origine
      author: mctit
      failOnError: true
      comment: >
        dbops.vw_processi_programmazione: il confronto a due fonti guarda solo
        le corse scritte dal percorso DB (origine PGAGENT), esposte nella
        colonna nuova `giornale_ultima_corsa_pgagent`. ⛔ Prima una corsa
        registrata da un attore qualunque sotto lo stesso codice spegneva il
        rilevatore di R-12: successo davvero il 2026-09-07 su
        sync_auth_user_expired_daily, con sei righe di collaudo del backend.
        ⚠️ `giornale_ultima_corsa` resta piena: per i COMMAND e' l'unica cosa
        utile della riga.
      preConditions:
        - onFail: HALT
        - and:
            - columnExists:
                schemaName: maintenance
                tableName: job_run_log
                columnName: origine
            - sqlCheck:
                expectedResult: 1
                sql: >-
                  SELECT count(*) FROM pg_attribute a
                   WHERE a.attrelid = 'dbops.vw_processi_programmazione'::regclass
                     AND a.attname = 'da_guardare'
                     AND NOT a.attisdropped
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW dbops.vw_processi_programmazione AS
              -- ⭐ La CTE non e' un vezzo: serve a calcolare `stato` UNA volta e
              --   a poterlo poi leggere per dire se e' un guasto. Ripetere il
              --   CASE per costruire `da_guardare` avrebbe rimesso il criterio
              --   in due posti dentro la stessa vista.
              WITH panorama AS (
                  SELECT p.codice            AS processo_codice,
                         p.classe,
                         p.canale,
                         p.jobname_pgagent,
                         -- Che cosa ne sa pgAgent. ⚠️ Colonne vuote = «di questo
                         -- job non so niente»: estensione assente, o job
                         -- inesistente.
                         g.abilitato           AS job_abilitato,
                         g.prossima_esecuzione AS prossima_corsa,
                         g.ultima_esecuzione   AS pgagent_ultima_corsa,
                         -- Che cosa ne sa il nostro giornale — TUTTE le corse,
                         -- chiunque le abbia scritte. ⚠️ Per i sei COMMAND, che
                         -- pgAgent non sveglia affatto, e' l'unica informazione
                         -- utile della riga: qui non si filtra niente.
                         l.ultima_corsa        AS giornale_ultima_corsa,
                         -- ⭐ E che cosa ne sa il giornale LIMITATAMENTE a chi
                         --   puo' rispondere per pgAgent. E' questa che regge il
                         --   confronto, non quella sopra.
                         l.ultima_corsa_pgagent,
                         l.ultimo_esito,
                         CASE
                             -- ⭐ Una cadenza NON ESISTE: lo sveglia una persona.
                             --   Non e' un limite di vista, e' la natura del
                             --   processo — quindi non diventera' mai un guasto.
                             WHEN p.canale = 'CODA'
                                 THEN 'SU_RICHIESTA'
                             -- ⚠️ Una cadenza esiste e vive fuori: il database
                             --   non puo' sapere se stanno partendo. ⭐ Chi puo'
                             --   saperlo e' il backend, e dal 2026-09-06
                             --   presidia (deploy/sveglie.json + il suo test).
                             WHEN p.canale = 'COMMAND'
                                 THEN 'FUORI_PORTATA'
                             -- ⛔ Nessun job dichiarato su un canale che pgAgent
                             --   dovrebbe svegliare: o non lo sveglia nessuno, o
                             --   non l'abbiamo scritto. In entrambi i casi non
                             --   si sa.
                             WHEN p.jobname_pgagent IS NULL
                                 THEN 'NON_PROGRAMMATO'
                             -- Il processo dichiara un job che pgAgent non ha.
                             WHEN g.abilitato IS NULL
                                 THEN 'JOB_ASSENTE'
                             WHEN g.abilitato IS FALSE
                                 THEN 'JOB_SPENTO'
                             -- ⭐ IL CASO PER CUI QUESTA VISTA ESISTE: pgAgent
                             --   dice che e' girato, il giornale non lo sa. E' un
                             --   lavoro che muore prima di riuscire a
                             --   raccontarlo.
                             --   ⚠️ Un'ora di tolleranza: le due scritture non
                             --   sono simultanee, e un job partito da poco puo'
                             --   non aver ancora chiuso la sua riga.
                             --   ⛔ E si confronta con `ultima_corsa_pgagent`,
                             --     NON con `ultima_corsa`: la domanda e' «la
                             --     sveglia di pgAgent ha lasciato traccia?», e
                             --     una corsa scritta da un altro attore non e'
                             --     una risposta a quella domanda. Con
                             --     `ultima_corsa` bastava una riga estranea
                             --     sotto lo stesso codice per spegnere questo
                             --     ramo — brief §9.5-bis, e successo davvero.
                             WHEN g.ultima_esecuzione IS NOT NULL
                                  AND COALESCE(l.ultima_corsa_pgagent, '-infinity'::timestamptz)
                                      < g.ultima_esecuzione - interval '1 hour'
                                 THEN 'GIRA_E_NON_REGISTRA'
                             -- Programmato, acceso, e non ha mai girato.
                             WHEN g.ultima_esecuzione IS NULL
                                 THEN 'MAI_PARTITO'
                             ELSE 'OK'
                         END AS stato
                    FROM dbops.processi p
                    -- ⛔ LATERAL su una funzione, non un JOIN su pgagent.*: una
                    --   vista che nomina quello schema non si crea dove
                    --   l'estensione manca (85_pgagent e' MARK_RAN in CI).
                    LEFT JOIN LATERAL dbops.fn_get_pgagent_job_stato(p.jobname_pgagent) g
                           ON true
                    -- ⚠️ Il giornale si legge per PROCESSO (obbligatorio dal
                    --   20260905-16) **oppure** per jobname, che e' come si
                    --   riconoscono le corse storiche: quelle hanno
                    --   processo_codice vuoto, e senza il ripiego ogni processo
                    --   sembrerebbe non aver mai girato prima di settembre.
                    LEFT JOIN LATERAL (
                        SELECT max(r.started_at) AS ultima_corsa,
                               -- ⭐ Le sole corse che possono valere come
                               --   RISPOSTA di pgAgent: quelle scritte dal
                               --   percorso DB. ⚠️ `origine` e' un DEFAULT, non
                               --   una dichiarazione — chi passa da
                               --   fn_run_and_log senza dire niente scrive
                               --   PGAGENT. Questo distingue il backend (che
                               --   dichiara CRON/COMMAND) da pgAgent, e NON
                               --   distingue pgAgent da un wrapper lanciato a
                               --   mano da psql.
                               max(r.started_at) FILTER (WHERE r.origine = 'PGAGENT')
                                   AS ultima_corsa_pgagent,
                               (SELECT r2.ok
                                  FROM maintenance.job_run_log r2
                                 WHERE (r2.processo_codice = p.codice
                                        OR r2.jobname = p.codice)
                                 ORDER BY r2.started_at DESC, r2.id DESC
                                 LIMIT 1) AS ultimo_esito
                          FROM maintenance.job_run_log r
                         WHERE r.processo_codice = p.codice
                            OR r.jobname = p.codice
                    ) l ON true
                   WHERE p.attivo
                     AND p.obsoleto_dal IS NULL
              )
              SELECT panorama.processo_codice,
                     panorama.classe,
                     panorama.canale,
                     panorama.jobname_pgagent,
                     panorama.job_abilitato,
                     panorama.prossima_corsa,
                     panorama.pgagent_ultima_corsa,
                     panorama.giornale_ultima_corsa,
                     panorama.ultimo_esito,
                     panorama.stato,
                     -- ⭐ QUI, E IN NESSUN ALTRO POSTO, si dice quali stati sono
                     --   un guasto. I tre sani si nominano una riga sotto il
                     --   CASE che li produce: uno stato nuovo non ha un default
                     --   in cui cadere, e chi lo aggiunge deve passare di qui.
                     -- ⛔ Non e' `stato <> 'OK'`: `FUORI_PORTATA` e
                     --   `SU_RICHIESTA` non sono OK e non sono guasti — sono
                     --   «questa domanda non si fa da qui».
                     panorama.stato NOT IN ('OK', 'FUORI_PORTATA', 'SU_RICHIESTA')
                         AS da_guardare,
                     -- ⚠️ In coda per forza: CREATE OR REPLACE VIEW sa solo
                     --   aggiungere in fondo, e `da_guardare` era l'ultima.
                     --   Per lettura starebbe accanto a giornale_ultima_corsa.
                     panorama.ultima_corsa_pgagent AS giornale_ultima_corsa_pgagent
                FROM panorama
               ORDER BY panorama.canale, panorama.processo_codice;

              COMMENT ON VIEW dbops.vw_processi_programmazione IS
                  'PANORAMA: per ogni processo automatico attivo — quale job pgAgent lo '
                  'sveglia, quando girera'', quando ha girato secondo pgAgent e secondo il '
                  'nostro giornale. ⭐ La colonna che vale piu'' di tutte e'' `stato`, e il '
                  'valore che conta e'' GIRA_E_NON_REGISTRA: pgAgent dice che il job e'' '
                  'girato, il giornale non lo sa — e'' la firma esatta di un lavoro che '
                  'muore prima di riuscire a raccontarlo, cioe'' di R-12, il job morto per '
                  'sei mesi con l''ultimo verdetto a «done». Questo confronto lo avrebbe '
                  'trovato in un giorno. ⚠️ Il legame col job NON e'' il nome: si legge da '
                  'dbops.processi.jobname_pgagent, perche'' due job su quattordici si '
                  'chiamano diversamente dal processo che registrano. ⚠️ Il giornale si '
                  'legge per processo_codice OPPURE per jobname: le corse storiche hanno '
                  'la prima colonna vuota, e senza il ripiego ogni processo sembrerebbe '
                  'non aver mai girato prima di settembre 2026. '
                  '⛔ IL CONFRONTO GUARDA CHI HA SCRITTO LA RISPOSTA, rev 2026-09-07 '
                  '(brief-db-sveglia-dei-processi §9.5-bis, segnalato dal backend): il '
                  'ramo GIRA_E_NON_REGISTRA legge `giornale_ultima_corsa_pgagent`, non '
                  '`giornale_ultima_corsa`. La domanda e'' «la sveglia di pgAgent ha '
                  'lasciato traccia?», e una corsa scritta da un altro attore sotto lo '
                  'stesso codice non e'' una risposta a quella domanda — spostava avanti '
                  'la data e spegneva il rilevatore di R-12 sul job sorvegliato. '
                  '⭐ DUE STATI NON SONO GUASTI E NON LO SARANNO MAI, ma per ragioni '
                  'OPPOSTE (rev 2026-09-06, brief-db-sveglia-dei-processi §8.6): '
                  'FUORI_PORTATA e'' un limite di VISTA — i COMMAND li sveglia systemd e '
                  'di loro il database non puo'' sapere se stanno partendo; chi puo'' '
                  'saperlo e'' il backend, che dal 2026-09-06 lo presidia da '
                  'backend/deploy/sveglie.json. SU_RICHIESTA e'' invece un fatto della '
                  'NATURA del processo: i CODA li sveglia una persona, quindi una cadenza '
                  'da confrontare non esiste affatto. Tenerli sotto la stessa parola '
                  'faceva contare insieme cose diverse. ⚠️ listen_cambio_reparto resta fra '
                  'i COMMAND di proposito: e'' un listener che scrive un solo run, ma che '
                  'sia un listener il database non lo sa — nessuna colonna lo dice, e '
                  'dedurlo dal nome sarebbe una coincidenza travestita da regola. '
                  '⭐ E'' un panorama, non un presidio: elenca anche i sani, perche'' senza '
                  'sapere quanti sono i sani un guasto sembra la norma. ⛔ Il presidio NON '
                  'si scrive piu'' come un NOT IN a mano: e'' la colonna `da_guardare`, '
                  'calcolata qui accanto al CASE che produce gli stati, e la vista '
                  'dbops.vw_processi_programmazione_da_guardare la proietta. Il criterio '
                  'del guasto sta in UN posto solo: uno stato nuovo non ha un default in '
                  'cui cadere, e chi lo aggiunge deve decidere qui.';

              COMMENT ON COLUMN dbops.vw_processi_programmazione.da_guardare IS
                  'Vero se questo stato e'' un guasto. ⭐ E'' la SEDE UNICA del criterio: '
                  'la vista di presidio la proietta invece di ripetere un NOT IN, che '
                  'sarebbe la seconda enumerazione degli stati — e la seconda diverge. '
                  '⛔ Non e'' `stato <> OK`: FUORI_PORTATA e SU_RICHIESTA non sono OK e '
                  'non sono guasti, sono «questa domanda non si fa da qui».';

              COMMENT ON COLUMN dbops.vw_processi_programmazione.giornale_ultima_corsa IS
                  'L''ultima corsa registrata sotto questo processo, CHIUNQUE l''abbia '
                  'scritta. ⚠️ Non e'' la colonna su cui poggia il verdetto: per quello '
                  'c''e'' `giornale_ultima_corsa_pgagent`. Resta piena perche'' per i '
                  'processi COMMAND — che pgAgent non sveglia affatto — e'' l''unica '
                  'informazione utile della riga, e filtrarla la svuoterebbe.';

              COMMENT ON COLUMN dbops.vw_processi_programmazione.giornale_ultima_corsa_pgagent IS
                  'L''ultima corsa che puo'' valere come RISPOSTA di pgAgent, cioe'' '
                  'scritta dal percorso DB (maintenance.job_run_log.origine = PGAGENT). '
                  '⭐ E'' la colonna su cui poggia GIRA_E_NON_REGISTRA, ed e'' esposta '
                  'apposta: un verdetto la cui prova non si vede non si puo'' contestare. '
                  '⛔ Nasce il 2026-09-07 da un controesempio vivo — sei righe di collaudo '
                  'del backend (origine COMMAND, jobname «x») scritte alle 11:11 sotto '
                  'sync_auth_user_expired_daily spostavano avanti giornale_ultima_corsa e '
                  'coprivano la corsa pgAgent delle 06:00. Su un job giornaliero il '
                  'difetto rientra da solo, su uno settimanale no. '
                  '⚠️ IL LIMITE, dichiarato: `origine` e'' un DEFAULT, non una '
                  'dichiarazione — chi chiama fn_run_and_log senza dire niente scrive '
                  'PGAGENT. Questo distingue il backend, che dichiara CRON o COMMAND, e '
                  'NON distingue pgAgent da un wrapper lanciato a mano da psql. '
                  '⚠️ E vale anche per i CODA_AUTOMATICA: la loro sveglia la registra un '
                  'wrapper DB (proc_accoda_chiusura_scadenze_job), quindi porta PGAGENT. '
                  'Cio'' che il worker della coda scrive dopo e'' un ALTRO processo, con '
                  'una riga di catalogo sua.';

              DO $grant$
              BEGIN
                  IF EXISTS (SELECT 1 FROM pg_catalog.pg_roles
                              WHERE rolname = 'zeroerp_app') THEN
                      GRANT SELECT ON dbops.vw_processi_programmazione TO zeroerp_app;
                  ELSE
                      RAISE NOTICE 'ruolo zeroerp_app assente: GRANT saltato';
                  END IF;
              END
              $grant$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- ⚠️ Tornare indietro rimette il confronto su TUTTE le corse: una
              --   riga scritta da un attore qualunque sotto lo stesso codice
              --   tornerebbe a spegnere il rilevatore di R-12.
              --   ⛔ Serve il DROP: CREATE OR REPLACE non sa TOGLIERE una colonna,
              --   e la vista-presidio dipende da questa.
              DROP VIEW IF EXISTS dbops.vw_processi_programmazione_da_guardare;
              DROP VIEW IF EXISTS dbops.vw_processi_programmazione;
