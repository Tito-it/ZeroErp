# dbops.fn_ritira_attivo_orfani(): toglie i trigger ATTIVO che nominano una
#   tabella o una colonna che non esiste piu'. Brief: brief-be-utenti-di-sviluppo
#   §9.5 (R-1, Q-1).
#
# ── CHI GENERA RITIRA ────────────────────────────────────────────────
#   La chiama dbops.fn_run_automations_attivo in testa a ogni giro (20261021-23),
#   accanto a fn_ritira_attivo_eccezioni: un DROP TABLE della figlia non deve
#   piu' essere ricordato da chi lo scrive (20260610-01 e listini_associazioni:
#   due volte dimenticato). In CI non trova niente — ci_apply gira dopo i DROP —;
#   su dev ripulisce al primo job automations_attivo.
#   Nessun changeSet una tantum in 90_end (decisione di Tid, 2026-10-20: non c'e'
#   produzione, dbdev converge al job o con la CALL a mano).
#
# ── COSA TOGLIE ──────────────────────────────────────────────────────
#   Solo TABELLA_ASSENTE e COLONNA_ASSENTE del lettore unico
#   dbops.fn_trigger_attivo_orfani (20261021-21). ARGOMENTI_INSUFFICIENTI resta:
#   e' un errore di scrittura, lo vede il presidio e lo corregge una persona.
#
# ⚠️ §11.5 delle linee guida: DDL su trigger generati da ci_apply, lecito per lo
#   stesso motivo di fn_ritira_attivo_eccezioni: DROP … IF EXISTS, e su un
#   database nuovo non trova niente e torna 0.
# INVOKER: gira come il migratore o come il job, proprietari delle tabelle.
# Ritorna un conteggio: integer, nessuna colonna da ancorare.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261021-22-create-fn-ritira-attivo-orfani-mctit.yaml

  - changeSet:
      id: 20261021-22-create-fn-ritira-attivo-orfani
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.fn_ritira_attivo_orfani(): toglie i trigger ATTIVO che dbops.fn_trigger_attivo_orfani
        trova con una tabella o una colonna assente (non quelli con argomenti insufficienti). Torna
        quanti ne ha tolti. Chiamata dal generatore (20261021-23). Brief: brief-be-utenti-di-sviluppo §9.5.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_proc p
               WHERE p.oid = to_regprocedure('dbops.fn_trigger_attivo_orfani()')
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_ritira_attivo_orfani()
              RETURNS integer
              LANGUAGE plpgsql
              SECURITY INVOKER
              AS $function$
              -- Scopo: togliere i trigger ATTIVO che nominano una tabella o una
              --   colonna che non esiste piu'.
              -- Uso: SELECT dbops.fn_ritira_attivo_orfani();  -- quanti ne ha tolti
              DECLARE
                  v_tabella   pg_catalog.pg_trigger.tgrelid%TYPE;
                  v_trigger   pg_catalog.pg_trigger.tgname%TYPE;
                  -- motivo e dettaglio vengono dal lettore, calcolati: text
                  v_motivo    text;
                  v_dettaglio text;
                  -- conteggio: nessuna colonna da ancorare
                  v_n         integer := 0;
              BEGIN
                  FOR v_tabella, v_trigger, v_motivo, v_dettaglio IN
                      SELECT o.tabella, o.trigger_nome, o.motivo, o.dettaglio
                        FROM dbops.fn_trigger_attivo_orfani() AS o
                       WHERE o.motivo IN ('TABELLA_ASSENTE', 'COLONNA_ASSENTE')
                  LOOP
                      EXECUTE format('DROP TRIGGER IF EXISTS %I ON %s', v_trigger, v_tabella::regclass);
                      RAISE NOTICE 'fn_ritira_attivo_orfani: ritirato % su % (% : %)',
                          v_trigger, v_tabella::regclass, v_motivo, v_dettaglio;
                      v_n := v_n + 1;
                  END LOOP;

                  RETURN v_n;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_ritira_attivo_orfani() IS
                  'Toglie i trigger ATTIVO che nominano una tabella o una colonna che non esiste piu'' (motivi TABELLA_ASSENTE e COLONNA_ASSENTE di dbops.fn_trigger_attivo_orfani, il lettore unico). Non tocca ARGOMENTI_INSUFFICIENTI: e'' un errore di scrittura, lo segnala il presidio. Torna quanti ne ha tolti. Chiamata in testa da dbops.fn_run_automations_attivo, fuori dal dry run, accanto a fn_ritira_attivo_eccezioni: chi genera ritira, e un DROP TABLE della figlia non lascia piu'' il block sul padre (E_ATTIVO_BLOCK_FKCOL_NOT_FOUND). Brief: brief-be-utenti-di-sviluppo §9.5 (R-1, Q-1).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS dbops.fn_ritira_attivo_orfani();
