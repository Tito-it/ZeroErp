#   dbops.fn_pgtap_crea_operatore_umano non accende piu' la veste OPERATORE
#   con un UPDATE suo: chiama anagrafiche.fn_accendi_veste (20261018-63).
#   Firma, ritorno e comportamento invariati.
#   Brief: brief-db-processi-accensione-per-ambiente, §5-ter.2 (2b-3).
#   Corpo di partenza: la doc auto-generata.
