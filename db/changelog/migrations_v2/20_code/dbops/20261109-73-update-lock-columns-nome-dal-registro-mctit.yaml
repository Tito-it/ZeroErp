            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_lock_columns_divergenze(p_exec_mode text, p_schemas text[])
               RETURNS TABLE(schema_name text, table_name text, azione text, trigger_atteso text, colonne_attese text[], argomenti_attesi text[], trigger_vivi text[], colonne_perse text[])
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: il lock di colonna ATTESO confrontato con quello VIVO, una riga
              --   per tabella che diverge. Criterio unico del runner
              --   (dbops.fn_run_automations_lock_columns) e del presidio pgTAP.
              -- Parametri: p_exec_mode come il runner (AUTO/CI/SCHEDULED);
              --   p_schemas NULL = ambito risolto da dbops.fn_resolve_scope.
              -- Le tabelle dell'ambito sono di tre specie:
              --   1) coperte da una regola LOCK_COLUMNS attiva del modo della corsa: il lock
              --      atteso e' codice_interno + le righe del registro;
              --   2) coperte SOLO da regole attive di un altro modo: nessuna azione (le
              --      governa l'altra corsa, come una riga del registro di un altro modo);
              --   3) senza regola attiva (spenta, cancellata o mai scritta): niente di
              --      atteso, il lock vivo si toglie.
              -- codice_interno e' la colonna implicita del framework: non e' mai una
              --   colonna «persa», anche dove nessuna regola la chiede piu'.
              DECLARE
                  v_schemas text[] := dbops.fn_resolve_scope(p_schemas);
              BEGIN
                  RETURN QUERY
                  -- ha_ci si calcola qui, una volta per tabella: valutato nei JOIN, il
                  -- planner (che stima una riga per i CTE) lo ripeteva tabelle x tabelle.
                  WITH tab AS MATERIALIZED (
                      SELECT n.nspname::text AS sch, c.relname::text AS tbl, c.oid AS rel,
                             dbops.fn_col_exists(n.nspname, c.relname, 'codice_interno') AS ha_ci
                        FROM pg_class c
                        JOIN pg_namespace n ON n.oid = c.relnamespace
                       WHERE c.relkind = 'r'
                         AND n.nspname = ANY (v_schemas)
                         AND dbops.fn_table_in_scope(n.nspname, c.relname)
                  ),
                  -- Le regole LOCK_COLUMNS attive che coprono la tabella, di qualunque modo.
                  copertura AS (
                      SELECT t.rel, r.id, r.priority, r.name_template,
                             (upper(btrim(r.exec_mode)) = 'AUTO' OR r.exec_mode = p_exec_mode) AS del_modo
                        FROM tab t
                        JOIN dbops.automation_rules_tbl r
                          ON r.enabled
                         AND upper(btrim(r.rule_type)) = 'LOCK_COLUMNS'
                         AND dbops.fn_schema_match(r.target_schema, t.sch)
                         AND (upper(r.target_table) = '*ALL' OR t.tbl ILIKE r.target_table)
                  ),
                  -- La prima regola del modo della corsa: ne da' il nome.
                  regola AS (
                      SELECT DISTINCT ON (t.rel)
                             t.rel,
                             dbops.fn_name_from_template(
                                 cp.name_template,
                                 t.sch, t.tbl, NULL, NULL, NULL, NULL) AS trg
                        FROM tab t
                        JOIN copertura cp ON cp.rel = t.rel AND cp.del_modo
                       ORDER BY t.rel, cp.priority, cp.id
                  ),
                  -- Le tabelle che solo un'altra corsa governa: fuori dal confronto.
                  altro_modo AS (
                      SELECT cp.rel
                        FROM copertura cp
                       GROUP BY cp.rel
                      HAVING NOT bool_or(cp.del_modo)
                  ),
                  -- Ogni trigger su trgfn_lock_columns, qualunque nome abbia (sede: la vista).
                  vivo AS (
                      SELECT v.tabella_oid AS rel,
                             v.trigger_name AS trg,
                             v.trigger_tipo AS tgtype,
                             v.abilitato,
                             v.argomenti AS args,
                             v.colonne_update_of AS cols_update_of
                        FROM dbops.vw_lock_columns_vivi v
                        JOIN tab t ON t.rel = v.tabella_oid
                  ),
                  -- Le colonne che i vivi bloccano: argomenti dispari + UPDATE OF.
                  vivo_col AS (
                      SELECT DISTINCT v.rel, x.col
                        FROM vivo v
                        CROSS JOIN LATERAL (
                            SELECT v.args[i] FROM generate_subscripts(v.args, 1) AS g(i) WHERE i % 2 = 1
                            UNION
                            SELECT unnest(v.cols_update_of)
                        ) AS x(col)
                  ),
                  -- L'atteso esiste solo sulle tabelle che una regola del modo copre.
                  atteso_col AS (
                      SELECT t.rel, 'codice_interno'::text AS col,
                             'E_CODICE_NON_MODIFICABILE'::text AS codice, 0 AS ord
                        FROM tab t
                        JOIN regola rg ON rg.rel = t.rel
                       WHERE t.ha_ci
                      UNION ALL
                      SELECT t.rel, l.column_name::text, l.error_code::text, 1
                        FROM tab t
                        JOIN regola rg ON rg.rel = t.rel
                        JOIN dbops.automation_lock_columns l
                          ON l.enabled
                         AND l.target_schema = t.sch
                         AND l.target_table  = t.tbl
                         AND l.column_name  <> 'codice_interno'
                       WHERE dbops.fn_col_exists(t.sch, t.tbl, l.column_name)
                         AND (   upper(btrim(l.exec_mode)) = 'AUTO'
                              OR l.exec_mode = p_exec_mode
                              -- un altro modo: resta attesa se e' gia' bloccata
                              OR EXISTS (SELECT 1 FROM vivo_col vc
                                          WHERE vc.rel = t.rel AND vc.col = l.column_name))
                  ),
                  atteso AS (
                      SELECT a.rel,
                             array_agg(a.col ORDER BY a.ord, a.col) AS cols,
                             ARRAY(SELECT w.x
                                     FROM atteso_col b
                                     CROSS JOIN LATERAL unnest(ARRAY[b.col, b.codice])
                                          WITH ORDINALITY AS w(x, j)
                                    WHERE b.rel = a.rel
                                    ORDER BY b.ord, b.col, w.j) AS args
                        FROM atteso_col a
                       GROUP BY a.rel
                  ),
                  vivo_tab AS (
                      SELECT v.rel,
                             array_agg(v.trg ORDER BY v.trg) AS trgs,
                             count(*) AS n,
                             min(v.trg) AS trg1
                        FROM vivo v
                       GROUP BY v.rel
                  ),
                  confronto AS (
                      SELECT t.sch, t.tbl, rg.trg, at.cols, at.args, vt.trgs,
                             CASE
                               WHEN at.rel IS NULL AND vt.rel IS NULL THEN NULL
                               WHEN at.rel IS NULL THEN 'TOGLIE'
                               WHEN vt.rel IS NULL THEN 'CREA'
                               WHEN vt.n = 1
                                AND v1.trg = rg.trg
                                AND v1.abilitato
                                AND v1.args = at.args
                                AND v1.cols_update_of = ARRAY(SELECT c FROM unnest(at.cols) AS u(c) ORDER BY 1)
                                AND v1.tgtype = 19           -- BEFORE | ROW | UPDATE
                               THEN NULL
                               ELSE 'RIGENERA'
                             END AS azione,
                             ARRAY(SELECT vc.col
                                     FROM vivo_col vc
                                    WHERE vc.rel = t.rel
                                      AND vc.col <> 'codice_interno'
                                      AND dbops.fn_col_exists(t.sch, t.tbl, vc.col)
                                      AND NOT (vc.col = ANY (COALESCE(at.cols, ARRAY[]::text[])))
                                      AND NOT EXISTS (
                                            SELECT 1 FROM dbops.automation_lock_columns l
                                             WHERE l.target_schema = t.sch
                                               AND l.target_table  = t.tbl
                                               AND l.column_name   = vc.col)
                                    ORDER BY 1) AS perse
                        FROM tab t
                        LEFT JOIN regola rg   ON rg.rel = t.rel
                        LEFT JOIN atteso at   ON at.rel = t.rel
                        LEFT JOIN vivo_tab vt ON vt.rel = t.rel
                        -- il primo (e, se allineato, unico) trigger vivo, per confrontarlo
                        LEFT JOIN vivo v1     ON v1.rel = t.rel AND v1.trg = vt.trg1
                       WHERE NOT EXISTS (SELECT 1 FROM altro_modo am WHERE am.rel = t.rel)
                  )
                  SELECT cf.sch, cf.tbl, cf.azione, cf.trg, cf.cols, cf.args,
                         COALESCE(cf.trgs, ARRAY[]::text[]), cf.perse
                    FROM confronto cf
                   WHERE cf.azione IS NOT NULL
                   ORDER BY cf.sch, cf.tbl;
              END;
              $function$;

              CREATE OR REPLACE FUNCTION dbops.fn_run_automations_lock_columns(p_exec_mode text, p_schemas text[], p_dry_run boolean)
               RETURNS void
               LANGUAGE plpgsql
              AS $function$
              /*
                Scopo
                -----
                Porta i trigger LOCK_COLUMNS (script.trgfn_lock_columns) delle tabelle in
                scope allo stato che il registro dichiara:
                - codice_interno, se presente in tabella (implicito);
                - colonne extra attive in dbops.automation_lock_columns.
                Il confronto fra atteso e vivo lo fa dbops.fn_lock_columns_divergenze:
                qui si esegue l'azione di ogni riga.

                Azioni
                ------
                CREA      trigger unico col nome da template (dbops.automation_rules_tbl)
                RIGENERA  toglie tutti i lock vivi della tabella, qualunque nome abbiano,
                          e crea quello atteso
                TOGLIE    toglie tutti i lock vivi (nessuna colonna da bloccare)

                Colonne fuori dal registro
                --------------------------
                Una colonna bloccata dal vivo che il registro non nomina affatto ferma il
                giro con E_LOCK_COLUMNS, prima di qualunque DDL: convergere la
                cancellerebbe in silenzio. Si aggiunge la riga (enabled = false se il
                blocco va tolto).

                DRY RUN
                -------
                p_dry_run = true: nessuna DDL, azione e colonne perse nell'audit
                (dbops.fn_audit_log_once).
              */
              DECLARE
                -- ⭐ Rev 2026-10-16: il contesto dell'errore, costruito una volta e usato
                --   dalle due chiamate del gestore (registro e involucro).
                v_ctx_errore dbops.error_log.context%TYPE;
                  r        record;
                  v_trg    text;
                  v_cols   text;
                  v_args   text;
                  v_perse  text;
              BEGIN
                  -- ⭐ Prima di qualunque DDL, e per TUTTE le tabelle insieme: un lock nato
                  --    fuori dal registro non si cancella. Chi lancia la migrate riceve
                  --    l'elenco intero, non la prima tabella.
                  IF NOT p_dry_run THEN
                      SELECT string_agg(d.schema_name||'.'||d.table_name||' ('||array_to_string(d.colonne_perse, ', ')||')',
                                        '; ' ORDER BY d.schema_name, d.table_name)
                        INTO v_perse
                        FROM dbops.fn_lock_columns_divergenze(p_exec_mode, p_schemas) AS d
                       WHERE cardinality(d.colonne_perse) > 0;

                      IF v_perse IS NOT NULL THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database',
                              'dbops.fn_run_automations_lock_columns',
                              'E_LOCK_COLUMNS',
                              jsonb_build_object('where', 'LOCK_COLUMNS_FUORI_REGISTRO', 'tabelle', v_perse),
                              NULL::uuid,
                              format('colonne bloccate da un trigger che il registro dbops.automation_lock_columns '
                                     'non nomina: %s. Aggiungere le righe (enabled = false se il blocco va tolto) '
                                     'prima di convergere', v_perse)
                          );
                      END IF;
                  END IF;

                  FOR r IN
                      SELECT d.*
                        FROM dbops.fn_lock_columns_divergenze(p_exec_mode, p_schemas) AS d
                       ORDER BY d.schema_name, d.table_name
                  LOOP
                      IF p_dry_run THEN
                          PERFORM dbops.fn_audit_log_once(
                              p_function_name => 'dbops.fn_run_automations_lock_columns',
                              p_status        => 'DRYRUN',
                              p_rule_type     => 'LOCK_COLUMNS',
                              p_exec_mode     => p_exec_mode,
                              p_parts         => ARRAY['LOCK_COLUMNS'],
                              p_dry_run       => true,
                              p_params        => jsonb_build_object(
                                                  'table',         r.schema_name||'.'||r.table_name,
                                                  'trigger',       r.trigger_atteso,
                                                  'columns',       r.colonne_attese,
                                                  'trigger_vivi',  r.trigger_vivi,
                                                  'colonne_perse', r.colonne_perse,
                                                  'action',        'DRYRUN_'||r.azione
                                                ),
                              p_message       => 'Lock columns: '||r.azione
                          );
                          CONTINUE;
                      END IF;

                      BEGIN
                          FOREACH v_trg IN ARRAY r.trigger_vivi LOOP
                              EXECUTE format('DROP TRIGGER IF EXISTS %I ON %I.%I',
                                             v_trg, r.schema_name, r.table_name);
                          END LOOP;

                          IF r.azione IN ('CREA', 'RIGENERA') THEN
                              SELECT string_agg(quote_ident(c), ', ' ORDER BY i)
                                INTO v_cols
                                FROM unnest(r.colonne_attese) WITH ORDINALITY AS u(c, i);
                              SELECT string_agg(quote_literal(a), ', ' ORDER BY i)
                                INTO v_args
                                FROM unnest(r.argomenti_attesi) WITH ORDINALITY AS u(a, i);

                              EXECUTE format($f$
                                CREATE TRIGGER %I
                                BEFORE UPDATE OF %s ON %I.%I
                                FOR EACH ROW
                                EXECUTE FUNCTION script.trgfn_lock_columns(%s)
                              $f$, r.trigger_atteso, v_cols, r.schema_name, r.table_name, v_args);
                          END IF;
                      EXCEPTION WHEN others THEN
                          -- ⭐ Rev 2026-10-16 (brief-db-presidio-job-run-a-chi-tocca D8, D10, D11):
                          --   un guasto dell'AMBIENTE (script.fn_sqlstate_di_ambiente: connessione,
                          --   risorse, arresto, sistema, privilegio, lock) si rilancia COM'E', col suo
                          --   SQLSTATE: l'involucro lo faceva diventare P0001, e il presidio dei job lo
                          --   mandava allo sviluppo. Prima si scrive nel registro errori, col contesto.
                          v_ctx_errore := jsonb_build_object(
                                  'where',  'LOCK_COLUMNS',
                                  'table',  r.schema_name||'.'||r.table_name,
                                  'azione', r.azione,
                                  'error',  SQLERRM
                              );
                          IF script.fn_sqlstate_di_ambiente(SQLSTATE) THEN
                            PERFORM script.fn_log_error_only(
                                'database', 'dbops.fn_run_automations_lock_columns', 'E_LOCK_COLUMNS',
                                v_ctx_errore, NULL::uuid, SQLERRM);
                            RAISE;
                          END IF;
                          PERFORM script.fn_log_and_raise_error(
                              'database', 'dbops.fn_run_automations_lock_columns', 'E_LOCK_COLUMNS',
                              v_ctx_errore, NULL::uuid, SQLERRM);
                      END;

                      RAISE NOTICE 'LOCK_COLUMNS: % %.% (vivi: %; attese: %)',
                          r.azione, r.schema_name, r.table_name,
                          COALESCE(array_to_string(r.trigger_vivi, ', '), ''),
                          COALESCE(array_to_string(r.colonne_attese, ', '), '');
                  END LOOP;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_run_automations_lock_columns(text, text[], boolean) IS
                  'Converge i trigger di lock di colonna (script.trgfn_lock_columns) verso lo stato dichiarato: codice_interno implicito + colonne attive di dbops.automation_lock_columns. Crea, rigenera (anche i lock scritti a mano, qualunque nome abbiano) o toglie, secondo dbops.fn_lock_columns_divergenze. Si ferma con E_LOCK_COLUMNS, prima di qualunque DDL, se una colonna bloccata non e'' nominata dal registro. Il dry run scrive l''azione in dbops.audit_log, firmato col proprio nome. Un guasto dell''ambiente (script.fn_sqlstate_di_ambiente) si scrive nel registro errori e si rilancia col suo SQLSTATE; i difetti di struttura escono con E_LOCK_COLUMNS.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_lock_columns_divergenze(p_exec_mode text, p_schemas text[])
               RETURNS TABLE(schema_name text, table_name text, azione text, trigger_atteso text, colonne_attese text[], argomenti_attesi text[], trigger_vivi text[], colonne_perse text[])
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: il lock di colonna ATTESO confrontato con quello VIVO, una riga
              --   per tabella che diverge. Criterio unico del runner
              --   (dbops.fn_run_automations_lock_columns) e del presidio pgTAP.
              -- Parametri: p_exec_mode come il runner (AUTO/CI/SCHEDULED);
              --   p_schemas NULL = ambito risolto da dbops.fn_resolve_scope.
              -- Le tabelle dell'ambito sono di tre specie:
              --   1) coperte da una regola LOCK_COLUMNS attiva del modo della corsa: il lock
              --      atteso e' codice_interno + le righe del registro;
              --   2) coperte SOLO da regole attive di un altro modo: nessuna azione (le
              --      governa l'altra corsa, come una riga del registro di un altro modo);
              --   3) senza regola attiva (spenta, cancellata o mai scritta): niente di
              --      atteso, il lock vivo si toglie.
              -- codice_interno e' la colonna implicita del framework: non e' mai una
              --   colonna «persa», anche dove nessuna regola la chiede piu'.
              DECLARE
                  v_schemas text[] := dbops.fn_resolve_scope(p_schemas);
              BEGIN
                  RETURN QUERY
                  -- ha_ci si calcola qui, una volta per tabella: valutato nei JOIN, il
                  -- planner (che stima una riga per i CTE) lo ripeteva tabelle x tabelle.
                  WITH tab AS MATERIALIZED (
                      SELECT n.nspname::text AS sch, c.relname::text AS tbl, c.oid AS rel,
                             dbops.fn_col_exists(n.nspname, c.relname, 'codice_interno') AS ha_ci
                        FROM pg_class c
                        JOIN pg_namespace n ON n.oid = c.relnamespace
                       WHERE c.relkind = 'r'
                         AND n.nspname = ANY (v_schemas)
                         AND dbops.fn_table_in_scope(n.nspname, c.relname)
                  ),
                  -- Le regole LOCK_COLUMNS attive che coprono la tabella, di qualunque modo.
                  copertura AS (
                      SELECT t.rel, r.id, r.priority, r.name_template,
                             (upper(btrim(r.exec_mode)) = 'AUTO' OR r.exec_mode = p_exec_mode) AS del_modo
                        FROM tab t
                        JOIN dbops.automation_rules_tbl r
                          ON r.enabled
                         AND upper(btrim(r.rule_type)) = 'LOCK_COLUMNS'
                         AND dbops.fn_schema_match(r.target_schema, t.sch)
                         AND (upper(r.target_table) = '*ALL' OR t.tbl ILIKE r.target_table)
                  ),
                  -- La prima regola del modo della corsa: ne da' il nome.
                  regola AS (
                      SELECT DISTINCT ON (t.rel)
                             t.rel,
                             dbops.fn_name_from_template(
                                 COALESCE(cp.name_template, 'trg_{table}_a10_lock_columns_upd'),
                                 t.sch, t.tbl, NULL, NULL, NULL, NULL) AS trg
                        FROM tab t
                        JOIN copertura cp ON cp.rel = t.rel AND cp.del_modo
                       ORDER BY t.rel, cp.priority, cp.id
                  ),
                  -- Le tabelle che solo un'altra corsa governa: fuori dal confronto.
                  altro_modo AS (
                      SELECT cp.rel
                        FROM copertura cp
                       GROUP BY cp.rel
                      HAVING NOT bool_or(cp.del_modo)
                  ),
                  -- Ogni trigger su trgfn_lock_columns, qualunque nome abbia (sede: la vista).
                  vivo AS (
                      SELECT v.tabella_oid AS rel,
                             v.trigger_name AS trg,
                             v.trigger_tipo AS tgtype,
                             v.abilitato,
                             v.argomenti AS args,
                             v.colonne_update_of AS cols_update_of
                        FROM dbops.vw_lock_columns_vivi v
                        JOIN tab t ON t.rel = v.tabella_oid
                  ),
                  -- Le colonne che i vivi bloccano: argomenti dispari + UPDATE OF.
                  vivo_col AS (
                      SELECT DISTINCT v.rel, x.col
                        FROM vivo v
                        CROSS JOIN LATERAL (
                            SELECT v.args[i] FROM generate_subscripts(v.args, 1) AS g(i) WHERE i % 2 = 1
                            UNION
                            SELECT unnest(v.cols_update_of)
                        ) AS x(col)
                  ),
                  -- L'atteso esiste solo sulle tabelle che una regola del modo copre.
                  atteso_col AS (
                      SELECT t.rel, 'codice_interno'::text AS col,
                             'E_CODICE_NON_MODIFICABILE'::text AS codice, 0 AS ord
                        FROM tab t
                        JOIN regola rg ON rg.rel = t.rel
                       WHERE t.ha_ci
                      UNION ALL
                      SELECT t.rel, l.column_name::text, l.error_code::text, 1
                        FROM tab t
                        JOIN regola rg ON rg.rel = t.rel
                        JOIN dbops.automation_lock_columns l
                          ON l.enabled
                         AND l.target_schema = t.sch
                         AND l.target_table  = t.tbl
                         AND l.column_name  <> 'codice_interno'
                       WHERE dbops.fn_col_exists(t.sch, t.tbl, l.column_name)
                         AND (   upper(btrim(l.exec_mode)) = 'AUTO'
                              OR l.exec_mode = p_exec_mode
                              -- un altro modo: resta attesa se e' gia' bloccata
                              OR EXISTS (SELECT 1 FROM vivo_col vc
                                          WHERE vc.rel = t.rel AND vc.col = l.column_name))
                  ),
                  atteso AS (
                      SELECT a.rel,
                             array_agg(a.col ORDER BY a.ord, a.col) AS cols,
                             ARRAY(SELECT w.x
                                     FROM atteso_col b
                                     CROSS JOIN LATERAL unnest(ARRAY[b.col, b.codice])
                                          WITH ORDINALITY AS w(x, j)
                                    WHERE b.rel = a.rel
                                    ORDER BY b.ord, b.col, w.j) AS args
                        FROM atteso_col a
                       GROUP BY a.rel
                  ),
                  vivo_tab AS (
                      SELECT v.rel,
                             array_agg(v.trg ORDER BY v.trg) AS trgs,
                             count(*) AS n,
                             min(v.trg) AS trg1
                        FROM vivo v
                       GROUP BY v.rel
                  ),
                  confronto AS (
                      SELECT t.sch, t.tbl, rg.trg, at.cols, at.args, vt.trgs,
                             CASE
                               WHEN at.rel IS NULL AND vt.rel IS NULL THEN NULL
                               WHEN at.rel IS NULL THEN 'TOGLIE'
                               WHEN vt.rel IS NULL THEN 'CREA'
                               WHEN vt.n = 1
                                AND v1.trg = rg.trg
                                AND v1.abilitato
                                AND v1.args = at.args
                                AND v1.cols_update_of = ARRAY(SELECT c FROM unnest(at.cols) AS u(c) ORDER BY 1)
                                AND v1.tgtype = 19           -- BEFORE | ROW | UPDATE
                               THEN NULL
                               ELSE 'RIGENERA'
                             END AS azione,
                             ARRAY(SELECT vc.col
                                     FROM vivo_col vc
                                    WHERE vc.rel = t.rel
                                      AND vc.col <> 'codice_interno'
                                      AND dbops.fn_col_exists(t.sch, t.tbl, vc.col)
                                      AND NOT (vc.col = ANY (COALESCE(at.cols, ARRAY[]::text[])))
                                      AND NOT EXISTS (
                                            SELECT 1 FROM dbops.automation_lock_columns l
                                             WHERE l.target_schema = t.sch
                                               AND l.target_table  = t.tbl
                                               AND l.column_name   = vc.col)
                                    ORDER BY 1) AS perse
                        FROM tab t
                        LEFT JOIN regola rg   ON rg.rel = t.rel
                        LEFT JOIN atteso at   ON at.rel = t.rel
                        LEFT JOIN vivo_tab vt ON vt.rel = t.rel
                        -- il primo (e, se allineato, unico) trigger vivo, per confrontarlo
                        LEFT JOIN vivo v1     ON v1.rel = t.rel AND v1.trg = vt.trg1
                       WHERE NOT EXISTS (SELECT 1 FROM altro_modo am WHERE am.rel = t.rel)
                  )
                  SELECT cf.sch, cf.tbl, cf.azione, cf.trg, cf.cols, cf.args,
                         COALESCE(cf.trgs, ARRAY[]::text[]), cf.perse
                    FROM confronto cf
                   WHERE cf.azione IS NOT NULL
                   ORDER BY cf.sch, cf.tbl;
              END;
              $function$;

              CREATE OR REPLACE FUNCTION dbops.fn_run_automations_lock_columns(p_exec_mode text, p_schemas text[], p_dry_run boolean)
               RETURNS void
               LANGUAGE plpgsql
              AS $function$
              /*
                Scopo
                -----
                Porta i trigger LOCK_COLUMNS (script.trgfn_lock_columns) delle tabelle in
                scope allo stato che il registro dichiara:
                - codice_interno, se presente in tabella (implicito);
                - colonne extra attive in dbops.automation_lock_columns.
                Il confronto fra atteso e vivo lo fa dbops.fn_lock_columns_divergenze:
                qui si esegue l'azione di ogni riga.

                Azioni
                ------
                CREA      trigger unico col nome da template (dbops.automation_rules_tbl)
                RIGENERA  toglie tutti i lock vivi della tabella, qualunque nome abbiano,
                          e crea quello atteso
                TOGLIE    toglie tutti i lock vivi (nessuna colonna da bloccare)

                Colonne fuori dal registro
                --------------------------
                Una colonna bloccata dal vivo che il registro non nomina affatto ferma il
                giro con E_LOCK_COLUMNS, prima di qualunque DDL: convergere la
                cancellerebbe in silenzio. Si aggiunge la riga (enabled = false se il
                blocco va tolto).

                DRY RUN
                -------
                p_dry_run = true: nessuna DDL, azione e colonne perse nell'audit
                (dbops.fn_audit_log_once).
              */
              DECLARE
                -- ⭐ Rev 2026-10-16: il contesto dell'errore, costruito una volta e usato
                --   dalle due chiamate del gestore (registro e involucro).
                v_ctx_errore dbops.error_log.context%TYPE;
                  r        record;
                  v_trg    text;
                  v_cols   text;
                  v_args   text;
                  v_perse  text;
              BEGIN
                  -- ⭐ Prima di qualunque DDL, e per TUTTE le tabelle insieme: un lock nato
                  --    fuori dal registro non si cancella. Chi lancia la migrate riceve
                  --    l'elenco intero, non la prima tabella.
                  IF NOT p_dry_run THEN
                      SELECT string_agg(d.schema_name||'.'||d.table_name||' ('||array_to_string(d.colonne_perse, ', ')||')',
                                        '; ' ORDER BY d.schema_name, d.table_name)
                        INTO v_perse
                        FROM dbops.fn_lock_columns_divergenze(p_exec_mode, p_schemas) AS d
                       WHERE cardinality(d.colonne_perse) > 0;

                      IF v_perse IS NOT NULL THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database',
                              'dbops.fn_run_automations_lock_columns',
                              'E_LOCK_COLUMNS',
                              jsonb_build_object('where', 'LOCK_COLUMNS_FUORI_REGISTRO', 'tabelle', v_perse),
                              NULL::uuid,
                              format('colonne bloccate da un trigger che il registro dbops.automation_lock_columns '
                                     'non nomina: %s. Aggiungere le righe (enabled = false se il blocco va tolto) '
                                     'prima di convergere', v_perse)
                          );
                      END IF;
                  END IF;

                  FOR r IN
                      SELECT d.*
                        FROM dbops.fn_lock_columns_divergenze(p_exec_mode, p_schemas) AS d
                       ORDER BY d.schema_name, d.table_name
                  LOOP
                      IF p_dry_run THEN
                          PERFORM dbops.fn_audit_log_once(
                              p_function_name => 'dbops.fn_run_automations',
                              p_status        => 'DRYRUN',
                              p_rule_type     => 'LOCK_COLUMNS',
                              p_exec_mode     => p_exec_mode,
                              p_parts         => ARRAY['LOCK_COLUMNS'],
                              p_dry_run       => true,
                              p_params        => jsonb_build_object(
                                                  'table',         r.schema_name||'.'||r.table_name,
                                                  'trigger',       r.trigger_atteso,
                                                  'columns',       r.colonne_attese,
                                                  'trigger_vivi',  r.trigger_vivi,
                                                  'colonne_perse', r.colonne_perse,
                                                  'action',        'DRYRUN_'||r.azione
                                                ),
                              p_message       => 'Lock columns: '||r.azione
                          );
                          CONTINUE;
                      END IF;

                      BEGIN
                          FOREACH v_trg IN ARRAY r.trigger_vivi LOOP
                              EXECUTE format('DROP TRIGGER IF EXISTS %I ON %I.%I',
                                             v_trg, r.schema_name, r.table_name);
                          END LOOP;

                          IF r.azione IN ('CREA', 'RIGENERA') THEN
                              SELECT string_agg(quote_ident(c), ', ' ORDER BY i)
                                INTO v_cols
                                FROM unnest(r.colonne_attese) WITH ORDINALITY AS u(c, i);
                              SELECT string_agg(quote_literal(a), ', ' ORDER BY i)
                                INTO v_args
                                FROM unnest(r.argomenti_attesi) WITH ORDINALITY AS u(a, i);

                              EXECUTE format($f$
                                CREATE TRIGGER %I
                                BEFORE UPDATE OF %s ON %I.%I
                                FOR EACH ROW
                                EXECUTE FUNCTION script.trgfn_lock_columns(%s)
                              $f$, r.trigger_atteso, v_cols, r.schema_name, r.table_name, v_args);
                          END IF;
                      EXCEPTION WHEN others THEN
                          -- ⭐ Rev 2026-10-16 (brief-db-presidio-job-run-a-chi-tocca D8, D10, D11):
                          --   un guasto dell'AMBIENTE (script.fn_sqlstate_di_ambiente: connessione,
                          --   risorse, arresto, sistema, privilegio, lock) si rilancia COM'E', col suo
                          --   SQLSTATE: l'involucro lo faceva diventare P0001, e il presidio dei job lo
                          --   mandava allo sviluppo. Prima si scrive nel registro errori, col contesto.
                          v_ctx_errore := jsonb_build_object(
                                  'where',  'LOCK_COLUMNS',
                                  'table',  r.schema_name||'.'||r.table_name,
                                  'azione', r.azione,
                                  'error',  SQLERRM
                              );
                          IF script.fn_sqlstate_di_ambiente(SQLSTATE) THEN
                            PERFORM script.fn_log_error_only(
                                'database', 'dbops.fn_run_automations_lock_columns', 'E_LOCK_COLUMNS',
                                v_ctx_errore, NULL::uuid, SQLERRM);
                            RAISE;
                          END IF;
                          PERFORM script.fn_log_and_raise_error(
                              'database', 'dbops.fn_run_automations_lock_columns', 'E_LOCK_COLUMNS',
                              v_ctx_errore, NULL::uuid, SQLERRM);
                      END;

                      RAISE NOTICE 'LOCK_COLUMNS: % %.% (vivi: %; attese: %)',
                          r.azione, r.schema_name, r.table_name,
                          COALESCE(array_to_string(r.trigger_vivi, ', '), ''),
                          COALESCE(array_to_string(r.colonne_attese, ', '), '');
                  END LOOP;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_run_automations_lock_columns(text, text[], boolean) IS
                  'Converge i trigger di lock columns (script.trgfn_lock_columns) verso lo stato dichiarato: codice_interno implicito + colonne attive di dbops.automation_lock_columns. Crea, rigenera (anche i lock scritti a mano, qualunque nome abbiano) o toglie, secondo dbops.fn_lock_columns_divergenze. Si ferma con E_LOCK_COLUMNS, prima di qualunque DDL, se una colonna bloccata non e'' nominata dal registro. Rev 20260926-04: assorbe dbops.fn_run_automations_drop_lock_trg (ritirata). Brief: brief-db-lock-di-colonna-fuori-registro §4 D2. ⭐ Rev 2026-10-16: nel gestore WHEN others, un guasto dell''AMBIENTE (script.fn_sqlstate_di_ambiente: 08, 53, 57, 58, 42501, 55P03) si rilancia COM''E'', col suo SQLSTATE, dopo averlo scritto nel registro errori con lo stesso codice e contesto (fn_log_error_only). Prima diventava P0001 col codice dell''involucro, e il presidio dei job (maintenance.vw_job_run_da_guardare) lo mandava allo sviluppo. I difetti di struttura escono come prima. Brief: brief-db-presidio-job-run-a-chi-tocca D8, D11.';
