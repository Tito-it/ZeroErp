# Il seed della guard utility->tipo_ruolo smette di scrivere: la configurazione
# la porta il CSV
#   Accompagna: 20260818-57 (il mirror CSV che diventa la sorgente)
#   Rosso di partenza: db/pgtap/dbops/test-automazione-guard-utility-tipo-ruolo.sql, test 2
#   Brief: docs/it/dev/work-done/brief-db-automazione-guard-utility-righe-sfuggite.md
#
# ── LA REGOLA ──────────────────────────────────────────────────────────
#   Decisione di Tid, 2026-08-18: **tutti i seed girano da CSV**. Un misto di
#   script e CSV sulla stessa tabella e' gia' stato verificato piu' volte e non
#   si applica: sono due sorgenti che divergono fra sviluppo e CI, perche' il
#   mirror e' `runOnChange` e ri-legge a ogni migrate mentre chi scrive da
#   codice gira quando gira.
#   Questa funzione era l'ultima che scriveva configurazione da codice in
#   `dbops`: le sorelle `automazione_*` sono tutte mirror di un CSV.
#
# ── COSA AVEVA PRODOTTO, IN CONCRETO ───────────────────────────────────
#   L'INSERT chiudeva con `ON CONFLICT (schema_name, table_name) DO NOTHING`:
#   una riga scritta una volta non si raddrizzava mai piu'. La configurazione e'
#   rimasta ferma al 2026-02-16 mentre lo schema andava avanti, e al 2026-08-18
#   **4 righe su 7 descrivevano tabelle che non qualificano piu'**:
#
#     bank_branches, fornitori, vettori  -> hanno perso la colonna `utility_id`
#     reseller                           -> rinominata `resellers` (e senza `utility_id`)
#
#   ⚠️ **Nessuna tabella era rimasta scoperta**, e va detto perche' cambia la
#   gravita': le due che oggi qualificano davvero (`categorie_clienti_listini`,
#   `emittenti_fiscali_utilities`) il trigger ce l'hanno entrambe. Il danno era
#   una configurazione che **dichiarava protezioni inesistenti**, e una riga che
#   nominava una colonna che la sua tabella non ha mentre il trigger vivo sulla
#   stessa tabella ne usava un'altra.
#
# ── COSA RESTA DELLA FUNZIONE ──────────────────────────────────────────
#   La rilevazione, che e' la meta' utile: percorre gli schemi in scope, trova
#   le tabelle con `utility_id` e una colonna `*_soggetto_ruolo_id`, e se
#   qualcuna non e' nel CSV lo dice con un `RAISE NOTICE`. Non scrive niente.
#   E' l'opt-in esplicito, la stessa forma di `dbops.fk_index_policy`.
#
#   ⚠️ Firma e punto di chiamata invariati: `90_end/ci_apply/20250627-31`
#   continua a chiamarla prima di `fn_apply_*` e non va toccato. Era l'altra via
#   possibile — togliere la riga da li' — ed e' peggiore: quel changeSet esegue
#   in fila altre sette automazioni, e riscriverlo per toglierne una avrebbe
#   messo a rischio le altre sette per un motivo che non le riguarda.
#
#   ⚠️ Il NOTICE e' un compromesso dichiarato: si legge se lo si va a cercare.
#   La sede giusta per una diagnosi e' una vista accanto alle altre di `dbops`;
#   non e' stata aggiunta per non allargare il perimetro, ed e' il primo posto
#   dove tornare se questa segnalazione dovesse servire davvero.
#
# ── NOTE DI CASA ────────────────────────────────────────────────────────
#   · Permessi: la funzione e' di `titodb`, non `SECURITY DEFINER`, non nel
#     registro `dbops.sec_functions_owner` — `CREATE OR REPLACE` liscio, nessun
#     blocco `GRANT` (stesso precedente del `20260808-04`).
#   · Corpo dalla doc auto-gen, col `;` dopo `$function$` aggiunto a mano.
#   · Firma e `RETURNS` invariati.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20260818-56-fn-seed-automazione-guard-utility-solo-diagnosi-mctit.yaml

  - changeSet:
      id: 20260818-56-fn-seed-automazione-guard-utility-solo-diagnosi
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Il seed della guard utility->tipo_ruolo non scrive piu' in
        dbops.automazione_guard_utility_tipo_ruolo: la configurazione diventa un mirror del CSV
        (20260818-57). Resta la rilevazione, che segnala con un NOTICE le tabelle che qualificano
        ma non sono a catalogo. Scriveva con ON CONFLICT DO NOTHING e la configurazione e' rimasta
        ferma al 2026-02-16: 4 righe su 7 descrivevano tabelle che non qualificano piu'.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: |
              SELECT count(*) FROM pg_proc p
                JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'dbops'
                 AND p.proname = 'fn_seed_automazione_guard_utility_tipo_ruolo'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_seed_automazione_guard_utility_tipo_ruolo(p_schemas text[] DEFAULT NULL::text[])
               RETURNS void
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_schemas text[];
                rtab record;
                v_soggetto_ruolo_col text;
                v_non_a_catalogo text[] := ARRAY[]::text[];
              BEGIN
                v_schemas := dbops.fn_resolve_scope(p_schemas);

                FOR rtab IN
                  SELECT n.nspname AS schema_name,
                         c.relname AS table_name
                    FROM pg_class c
                    JOIN pg_namespace n ON n.oid = c.relnamespace
                   WHERE c.relkind = 'r'
                     AND n.nspname = ANY(v_schemas)
                     AND n.nspname <> 'storico'
                     AND dbops.fn_table_in_scope(n.nspname, c.relname)
                     AND dbops.fn_col_exists(n.nspname, c.relname, 'utility_id')
                LOOP
                  SELECT att.attname
                    INTO v_soggetto_ruolo_col
                    FROM pg_constraint con
                    JOIN unnest(con.conkey) WITH ORDINALITY AS k(attnum, ord) ON true
                    JOIN pg_attribute att
                      ON att.attrelid = con.conrelid
                     AND att.attnum = k.attnum
                    JOIN pg_class cref ON cref.oid = con.confrelid
                    JOIN pg_namespace nref ON nref.oid = cref.relnamespace
                    JOIN pg_class c ON c.oid = con.conrelid
                    JOIN pg_namespace n ON n.oid = c.relnamespace
                   WHERE con.contype = 'f'
                     AND n.nspname = rtab.schema_name
                     AND c.relname = rtab.table_name
                     AND nref.nspname = 'anagrafiche'
                     AND cref.relname = 'soggetti_ruoli'
                     AND att.attname LIKE '%_soggetto_ruolo_id'
                   ORDER BY
                     att.attname
                   LIMIT 1;

                  IF v_soggetto_ruolo_col IS NULL THEN
                    SELECT a.attname
                      INTO v_soggetto_ruolo_col
                      FROM pg_attribute a
                      JOIN pg_class c ON c.oid = a.attrelid
                      JOIN pg_namespace n ON n.oid = c.relnamespace
                     WHERE n.nspname = rtab.schema_name
                       AND c.relname = rtab.table_name
                       AND a.attnum > 0
                       AND NOT a.attisdropped
                       AND a.attname LIKE '%_soggetto_ruolo_id'
                     ORDER BY a.attname
                     LIMIT 1;
                  END IF;

                  IF v_soggetto_ruolo_col IS NULL THEN
                    CONTINUE;
                  END IF;

                  -- ⭐ QUI NON SI SCRIVE PIU' — 18-08-2026.
                  --
                  --   La configurazione di questa automazione e' un MIRROR DEL CSV
                  --   `80_data/sql/dbops/automazione_guard_utility_tipo_ruolo.csv`, come per
                  --   tutte le altre `automazione_*` di dbops. Decisione di Tid: i seed
                  --   girano da CSV, e un misto di script SQL e CSV sulla stessa tabella non
                  --   regge — sono due sorgenti di verita' che divergono fra sviluppo e CI,
                  --   perche' il mirror e' `runOnChange` e ri-legge a ogni migrate mentre chi
                  --   scrive da codice gira quando gira.
                  --
                  --   ⚠️ Il danno che ha fatto scrivere da qui non e' teorico. L'INSERT
                  --   chiudeva con `ON CONFLICT (schema_name, table_name) DO NOTHING`: una
                  --   riga scritta una volta non si raddrizzava mai piu'. La configurazione
                  --   e' rimasta ferma al 2026-02-16 mentre lo schema andava avanti, e al
                  --   2026-08-18 **4 righe su 7 descrivevano tabelle che nel frattempo
                  --   avevano perso `utility_id` o erano state rinominate**. Rilevare dallo
                  --   schema e' utile; rilevare dallo schema e *scrivere* significa che la
                  --   configurazione racconta lo schema del giorno in cui l'ha vista.
                  --
                  --   Resta la meta' utile: la funzione dice cosa vede e non lo mette in
                  --   tabella. Chi legge la diagnosi decide se aggiungere la riga al CSV —
                  --   e' l'opt-in esplicito, la stessa forma di `dbops.fk_index_policy`.
                  IF NOT EXISTS (
                    SELECT 1
                      FROM dbops.automazione_guard_utility_tipo_ruolo a
                     WHERE a.schema_name = rtab.schema_name
                       AND a.table_name  = rtab.table_name
                  ) THEN
                    v_non_a_catalogo := v_non_a_catalogo
                      || (rtab.schema_name || '.' || rtab.table_name
                          || ' (' || v_soggetto_ruolo_col || ')');
                  END IF;
                END LOOP;

                -- ⚠️ Un NOTICE e non un errore: una tabella nuova che qualifica non e' un
                --   guasto, e' una decisione da prendere. Farla fallire bloccherebbe il
                --   `ci_apply` per una cosa che non e' rotta.
                --   ⚠️ Ed e' anche il limite di questa forma, detto: un NOTICE in mezzo
                --   all'output del `ci_apply` si legge se lo si va a cercare. La sede giusta
                --   sarebbe una vista di diagnosi accanto alle altre di `dbops`; qui si e'
                --   scelto di non aggiungerne una per non allargare il perimetro.
                IF array_length(v_non_a_catalogo, 1) IS NOT NULL THEN
                  RAISE NOTICE
                    'dbops.fn_seed_automazione_guard_utility_tipo_ruolo: % tabelle qualificano ma non sono nel CSV di configurazione: %. Se vanno protette, aggiungerle a 80_data/sql/dbops/automazione_guard_utility_tipo_ruolo.csv.',
                    array_length(v_non_a_catalogo, 1),
                    array_to_string(v_non_a_catalogo, ', ');
                END IF;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_seed_automazione_guard_utility_tipo_ruolo(p_schemas text[])
              IS 'Popola dbops.automazione_guard_utility_tipo_ruolo autodetectando tabelle con utility_id + colonna ruolo (FK diretta o naming *_soggetto_ruolo_id). Post 18-08-2026: NON SCRIVE PIU''. La configurazione e'' un mirror del CSV 80_data/sql/dbops/automazione_guard_utility_tipo_ruolo.csv, come le altre automazione_* di dbops; questa funzione rileva soltanto e segnala con un NOTICE le tabelle che qualificano ma non sono a catalogo. Scriveva con ON CONFLICT DO NOTHING, quindi una riga scritta una volta non si raddrizzava piu'' e la configurazione e'' rimasta ferma al 2026-02-16 mentre lo schema andava avanti: al 2026-08-18, 4 righe su 7 descrivevano tabelle che avevano perso utility_id o erano state rinominate.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Vuoto di proposito: rimettere la scrittura riaprirebbe la
              -- seconda sorgente di verita' accanto al CSV.
              SELECT 1;
