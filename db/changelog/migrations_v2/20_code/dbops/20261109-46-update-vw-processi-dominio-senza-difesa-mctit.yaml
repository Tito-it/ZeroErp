# dbops.vw_processi_dominio_senza_difesa (Q14 ⑤, scelta 3 di §18.4 / N3, D11):
#   - il guard si riconosce per OID ('script.trgfn_guard_emittente_scope'::regproc), solo
#     se acceso (tgenabled <> 'D') e montato su INSERT e su UPDATE: un'omonima in un altro
#     schema o un trigger disattivato non sono difese;
#   - la porta dichiarata (dbops.processi_bersagli.porta_scrittura, 20261109-41) e' una
#     difesa di scrittura se e' SECURITY DEFINER, con la RLS attiva e policy permissive
#     su INSERT e UPDATE;
#   - il processo vivo da script.fn_e_obsoleto.
#   Colonne invariate; due testi nuovi di `manca` per la porta dichiarata ma insufficiente.
#   Brief: brief-db-revisione-dbops, giro 9, blocco 9a (§24).
#   Corpo di partenza dal catalogo dello scratch (2026-11-08); rollback = corpo e COMMENT di prima.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261109-46-update-vw-processi-dominio-senza-difesa-mctit.yaml

  - changeSet:
      id: 20261109-46-update-vw-processi-dominio-senza-difesa
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vw_processi_dominio_senza_difesa riconosce il guard per OID e acceso, e la porta DEFINER dichiarata. Brief: brief-db-revisione-dbops, giro 9.
      preConditions:
        - onFail: HALT
        - columnExists: { schemaName: dbops, tableName: processi_bersagli, columnName: porta_scrittura }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW dbops.vw_processi_dominio_senza_difesa AS
               WITH bersagli AS (
                       SELECT p.codice AS processo_codice,
                          b.schema_tabella,
                          b.nome_tabella,
                          b.emittente_via,
                          b.debito_dichiarato,
                          b.note,
                          b.porta_scrittura,
                          c.oid AS rel_oid,
                          c.relrowsecurity AS rls_attiva
                         FROM dbops.processi p
                           JOIN dbops.processi_bersagli b ON b.processo_id = p.id
                           JOIN pg_class c ON c.relname = b.nome_tabella
                           JOIN pg_namespace n ON n.oid = c.relnamespace AND n.nspname = b.schema_tabella
                        WHERE p.classe = 'DOMINIO'::text AND NOT script.fn_e_obsoleto(p.obsoleto_dal) AND b.emittente_via IS NOT NULL AND (c.relkind = ANY (ARRAY['r'::"char", 'p'::"char"]))
                      ), difese AS (
                       SELECT b.processo_codice,
                          b.schema_tabella,
                          b.nome_tabella,
                          b.emittente_via,
                          b.debito_dichiarato,
                          b.note,
                          b.porta_scrittura,
                          b.rel_oid,
                          b.rls_attiva,
                          (EXISTS ( SELECT 1
                                 FROM pg_policy pol
                                WHERE pol.polrelid = b.rel_oid)) AS ha_policy_scritta,
                          -- Il guard e' la funzione esatta (per OID, non per nome), montata
                          -- su INSERT e su UPDATE e non disattivata.
                          (EXISTS ( SELECT 1
                                 FROM pg_trigger t
                                WHERE t.tgrelid = b.rel_oid AND NOT t.tgisinternal
                                  AND t.tgfoid = 'script.trgfn_guard_emittente_scope'::regproc::oid
                                  AND t.tgenabled <> 'D'::"char"
                                  AND (t.tgtype::integer & 4) <> 0
                                  AND (t.tgtype::integer & 16) <> 0)) AS ha_guard,
                          -- La porta dichiarata: una funzione SECURITY DEFINER con quel nome.
                          (b.porta_scrittura IS NOT NULL AND (EXISTS ( SELECT 1
                                 FROM pg_proc pr
                                   JOIN pg_namespace pn ON pn.oid = pr.pronamespace
                                WHERE pn.nspname = split_part(b.porta_scrittura, '.', 1)
                                  AND pr.proname = split_part(b.porta_scrittura, '.', 2)
                                  AND pr.prosecdef))) AS porta_valida,
                          -- Le scritture dell'applicazione: policy permissive che coprono
                          -- INSERT e UPDATE (FOR ALL, o una per comando).
                          ((EXISTS ( SELECT 1
                                 FROM pg_policy pol
                                WHERE pol.polrelid = b.rel_oid AND pol.polpermissive
                                  AND (pol.polcmd = ANY (ARRAY['*'::"char", 'a'::"char"]))))
                           AND (EXISTS ( SELECT 1
                                 FROM pg_policy pol
                                WHERE pol.polrelid = b.rel_oid AND pol.polpermissive
                                  AND (pol.polcmd = ANY (ARRAY['*'::"char", 'w'::"char"]))))) AS policy_su_scrittura
                         FROM bersagli b
                      ), giudizio AS (
                       SELECT d.*,
                          d.ha_guard OR (d.porta_valida AND d.rls_attiva AND d.policy_su_scrittura) AS scrittura_difesa
                         FROM difese d
                      )
               SELECT processo_codice,
                  schema_tabella,
                  nome_tabella,
                  emittente_via,
                      CASE
                          WHEN NOT ha_policy_scritta AND NOT scrittura_difesa THEN 'policy RLS e write-guard'::text
                          WHEN ha_policy_scritta AND NOT rls_attiva AND NOT scrittura_difesa THEN 'la policy c''e'' ma la ROW LEVEL SECURITY non e'' attiva sulla tabella, e manca il write-guard'::text
                          WHEN ha_policy_scritta AND NOT rls_attiva THEN 'la policy c''e'' ma la ROW LEVEL SECURITY non e'' attiva sulla tabella: non filtra niente'::text
                          WHEN NOT ha_policy_scritta THEN 'policy RLS (lettura scoperta)'::text
                          WHEN porta_scrittura IS NOT NULL AND NOT porta_valida THEN 'la porta di scrittura dichiarata non esiste o non e'' SECURITY DEFINER, e manca il write-guard'::text
                          WHEN porta_scrittura IS NOT NULL THEN 'la porta di scrittura e'' dichiarata ma le policy non coprono INSERT e UPDATE, e manca il write-guard'::text
                          ELSE 'write-guard (scrittura scoperta)'::text
                      END AS manca,
                      CASE
                          WHEN debito_dichiarato THEN 'DEBITO_DICHIARATO'::text
                          ELSE 'NON_DICHIARATO'::text
                      END AS stato,
                  note AS nota
                 FROM giudizio
                WHERE NOT (ha_policy_scritta AND rls_attiva) OR NOT scrittura_difesa;

              COMMENT ON VIEW dbops.vw_processi_dominio_senza_difesa IS
                  'LIVELLO 2 del presidio sui processi: bersagli dei processi DOMINIO vivi (ritiro non raggiunto, script.fn_e_obsoleto) in cui si SA dove sta l''emittente ma nessuno lo usa per filtrare. DEVE restare senza righe NON_DICHIARATO. Due difese, guardate separatamente: la LETTURA vuole una policy e la ROW LEVEL SECURITY attiva (PostgreSQL conserva le policy di una tabella con la RLS disabilitata e non le applica); la SCRITTURA vuole il guard script.trgfn_guard_emittente_scope, riconosciuto per OID, montato su INSERT e UPDATE e non disattivato, oppure la porta dichiarata in dbops.processi_bersagli.porta_scrittura: una funzione SECURITY DEFINER, con la RLS attiva e policy permissive che coprono INSERT e UPDATE (la policy difende le scritture dell''applicazione, la porta quelle del proprietario). `manca` dice quale difesa manca; una porta dichiarata che non esiste o non e'' DEFINER, o senza policy sulla scrittura, lo dice. FORCE ROW LEVEL SECURITY non entra nel criterio: nessuna tabella lo usa, perche'' il proprietario deve leggere fuori dalla row security nelle SECURITY DEFINER che derivano il perimetro. Dichiarare un debito (`stato` DEBITO_DICHIARATO) dice «sappiamo perche'' e'' qui», non «va bene che ci sia».';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW dbops.vw_processi_dominio_senza_difesa AS
               WITH bersagli AS (
                       SELECT p.codice AS processo_codice,
                          b.schema_tabella,
                          b.nome_tabella,
                          b.emittente_via,
                          b.debito_dichiarato,
                          b.note,
                          c.oid AS rel_oid,
                          c.relrowsecurity AS rls_attiva
                         FROM dbops.processi p
                           JOIN dbops.processi_bersagli b ON b.processo_id = p.id
                           JOIN pg_class c ON c.relname = b.nome_tabella
                           JOIN pg_namespace n ON n.oid = c.relnamespace AND n.nspname = b.schema_tabella
                        WHERE p.classe = 'DOMINIO'::text AND p.attivo AND p.obsoleto_dal IS NULL AND b.emittente_via IS NOT NULL AND (c.relkind = ANY (ARRAY['r'::"char", 'p'::"char"]))
                      ), difese AS (
                       SELECT b.processo_codice,
                          b.schema_tabella,
                          b.nome_tabella,
                          b.emittente_via,
                          b.debito_dichiarato,
                          b.note,
                          b.rel_oid,
                          b.rls_attiva,
                          (EXISTS ( SELECT 1
                                 FROM pg_policy pol
                                WHERE pol.polrelid = b.rel_oid)) AS ha_policy_scritta,
                          (EXISTS ( SELECT 1
                                 FROM pg_trigger t
                                   JOIN pg_proc pr ON pr.oid = t.tgfoid
                                WHERE t.tgrelid = b.rel_oid AND NOT t.tgisinternal AND pr.proname = 'trgfn_guard_emittente_scope'::name)) AS ha_guard
                         FROM bersagli b
                      )
               SELECT processo_codice,
                  schema_tabella,
                  nome_tabella,
                  emittente_via,
                      CASE
                          WHEN NOT ha_policy_scritta AND NOT ha_guard THEN 'policy RLS e write-guard'::text
                          WHEN ha_policy_scritta AND NOT rls_attiva AND NOT ha_guard THEN 'la policy c''e'' ma la ROW LEVEL SECURITY non e'' attiva sulla tabella, e manca il write-guard'::text
                          WHEN ha_policy_scritta AND NOT rls_attiva THEN 'la policy c''e'' ma la ROW LEVEL SECURITY non e'' attiva sulla tabella: non filtra niente'::text
                          WHEN NOT ha_policy_scritta THEN 'policy RLS (lettura scoperta)'::text
                          ELSE 'write-guard (scrittura scoperta)'::text
                      END AS manca,
                      CASE
                          WHEN debito_dichiarato THEN 'DEBITO_DICHIARATO'::text
                          ELSE 'NON_DICHIARATO'::text
                      END AS stato,
                  note AS nota
                 FROM difese
                WHERE NOT (ha_policy_scritta AND rls_attiva) OR NOT ha_guard;

              COMMENT ON VIEW dbops.vw_processi_dominio_senza_difesa IS
                  'Tabelle di dominio in cui si SA dove sta l''emittente ma nessuno lo usa per filtrare: manca la policy RLS, manca il write-guard, o entrambi. ⛔ Una policy conta solo se la ROW LEVEL SECURITY e'' ATTIVA sulla tabella (rev 2026-09-05): PostgreSQL conserva le policy di una tabella con la RLS disabilitata e non le applica, quindi prima bastava SCRIVERE una policy per far sparire la riga da qui lasciando la tabella aperta a tutti. ⭐ Non e'' nato da una misura — nessun bersaglio era in quello stato — ma dalla scorciatoia che si stava per prendere sulla policy di config.email_outbox: un presidio che si spegne con una decorazione e'' peggio di nessun presidio. ⚠️ FORCE ROW LEVEL SECURITY NON entra nel criterio: in questo database nessuna tabella lo usa, perche'' l''owner deve poter leggere fuori dalla row security per le SECURITY DEFINER che derivano il perimetro. ⚠️ La regola resta «deve restare VUOTA», ma l''invariante verificabile e'' «nessuna riga NON_DICHIARATO»: dichiarare un debito dice «sappiamo perche'' e'' qui», non «va bene che ci sia».';
