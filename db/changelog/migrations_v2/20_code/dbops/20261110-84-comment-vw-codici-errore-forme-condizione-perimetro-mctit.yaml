# dbops.vw_codici_errore_forme_condizione: il perimetro dichiarato nel COMMENT.
#   Brief: brief-db-revisione-dbops, giro 12 (Q15, N2).
#
# Le viste sorelle sui codici leggono da questo giro ogni corpo leggibile
# (plpgsql e sql, dbops.fn_corpo_leggibile). Questa resta sul plpgsql, per
# decisione (Tid, 2026-11-09): la sua grammatica e' quella della guardia
# plpgsql (IF / EXCEPTION WHEN), che una funzione sql non ha. La vista non
# cambia; il COMMENT, che prima non diceva il perimetro, lo dice e dice perche'.
# Testo: il COMMENT vivo, verificato uguale su scratch e dbdev, piu' un capoverso.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261110-84-comment-vw-codici-errore-forme-condizione-perimetro-mctit.yaml

  - changeSet:
      id: 20261110-84-comment-vw-codici-errore-forme-condizione-perimetro
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Il COMMENT di dbops.vw_codici_errore_forme_condizione dichiara il perimetro (il solo plpgsql) e
        perche'. Brief: brief-db-revisione-dbops, giro 12.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_class c
                JOIN pg_catalog.pg_namespace n ON n.oid = c.relnamespace
               WHERE n.nspname = 'dbops' AND c.relname = 'vw_codici_errore_forme_condizione';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON VIEW dbops.vw_codici_errore_forme_condizione IS
              'Misura degli accumulatori sulla FORMA DELLA CONDIZIONE al punto che solleva (non sul dominio della funzione: quell''asse segnalava E_VALIDAZIONE, che e'' il caso su cui la risposta e'' no). NON filtra di proposito.
              TRE query canoniche, da usare INSIEME.
              (1) CANDIDATI — SELECT codice, n_punti, famiglie FROM dbops.vw_codici_errore_forme_condizione WHERE n_famiglie_note > 1 ORDER BY n_punti DESC;
              (2) COPERTURA, senza cui la (1) si legge come una verita'' — SELECT count(*) AS codici, count(*) FILTER (WHERE NOT solo_ignoto) AS classificati, count(*) FILTER (WHERE solo_ignoto) AS invisibili FROM dbops.vw_codici_errore_forme_condizione;
              (3) LA CLASSE E'' ANCORA VERA? incrocia le due letture indipendenti dello stesso codice — la guardia (cosa FA il punto) e la classe (cosa DICE il catalogo). E'' la query che ha trovato E_ERRORE_PARAMETRI, 4 punti su 13 che dicevano il falso:
                  SELECT unnest(f.famiglie) AS famiglia, c.classe, count(*) AS codici
                    FROM dbops.vw_codici_errore_forme_condizione f
                    JOIN config.codici_errore c USING (codice)
                   WHERE NOT f.solo_ignoto AND c.obsoleto_dal IS NULL
                   GROUP BY 1,2 ORDER BY 1, 3 DESC;
              COME SI LEGGE LA (3): le righe famiglia = IGNOTO NON sono una famiglia, sono la misura che dichiara di non saper leggere quella guardia — vanno lasciate (toglierle farebbe sembrare piena la copertura) ma non lette come un incrocio. E "fuori dominante" non vuol dire sbagliato: NOT_FOUND ha 19 codici su NON_TROVATO e 20 altrove, e la maggioranza dei 20 e'' deliberata ("guard parametro NULL riconducibile a NOT FOUND", scritto dentro le funzioni). E'' una lista DA GUARDARE, non una lista di difetti.
              ⭐ FAMIGLIA VALORE_ATTESO, dal 2026-09-07 — «il valore letto non e'' quello ammesso» (x <> ''LETTERALE''), che e'' la forma di ogni guardia di STATO o di PERIMETRO del progetto. Non era un caso di nicchia: era una famiglia intera che l''asse non nominava, e finiva tutta in IGNOTO. ⛔ E'' una famiglia NUOVA e non un ENUM allargato di proposito: le letture di questa vista sono datate e si confrontano nel tempo, quindi cambiare che cosa significa ENUM renderebbe la lettura del 2026-08-08 incomparabile con la prossima, in silenzio. ⚠️ L''ordine del CASE la mette DOPO ENUM e PARAMETRO: un NOT IN resta ENUM, e una guardia su un parametro nullo resta PARAMETRO anche se confronta un letterale.
              ⚠️ IMPRECISIONE DICHIARATA, perche'' si scopre subito e vale la pena saperlo prima: la forma prende anche del normale control-flow che capita entro 25 righe da un RAISE — IF TG_OP = ''DELETE'', IF v_id_type = ''uuid''. Sta dentro la natura gia'' dichiarata di questa vista (una MISURA, non un cancello), ma non e'' zero: chi legge la (1) guarda i codici, non da'' per buono il conteggio.
              ⭐ PERCHE'' E'' STATA FATTA, ed e'' il caso che la giustifica: E_VALIDAZIONE leggeva famiglie {IGNOTO, PARAMETRO} con n_famiglie_note = 1, quindi NON compariva nella query (1), che filtra > 1. La sua seconda forma era la terza guardia di config.fn_chiudi_email_sistema — «qualcuno sta usando la porta di sistema per l''email di un''azienda», cioe'' il punto piu'' pericoloso di quella funzione. Il rubinetto era cieco su qualunque codice la cui seconda forma fosse una che il classificatore non sapeva leggere. Segnalato dal backend: brief-db-sveglia-dei-processi §3.2, risposta §8.4.
              Letture datate. Al 2026-08-08: 344 codici, 75 classificati, 269 invisibili. Al 2026-09-06, prima di VALORE_ATTESO: 453 codici, 96 classificati, 357 invisibili — il buco cresceva. Subito dopo, sugli stessi 453: 148 classificati, 305 invisibili, e i candidati della (1) passano da 6 a 10. E'' una MISURA, non un cancello: un codice legittimamente trasversale esiste. Implementazione a window function (20260808-01): 349 ms, contro i 145 secondi della prima versione a sottoquery correlate.
              ⭐ FORMA «CODICE NOMINATO IN UN MOTIVO», dal 2026-09-08 — nel pattern linee-guida-sql §12.5 («la madre CHIAMA la check») il letterale E_* sta DENTRO la fn_check_*, dove nessuna chiamata a fn_log_and_raise_error gli sta vicino: 35 codici su 50 codici-motivo erano invisibili a questa vista, e quindi al rubinetto degli accumulatori B-7. Adesso e'' un punto anche la riga che DICHIARA un motivo (''codice'', ''E_...''), e la guardia si prende dall''IF che la precede DENTRO la check — dov''e'' la condizione vera. ⛔ NON si risale dalla chiamata alla check, ed e'' l''errore da non rifare: sopra il punto che SOLLEVA la guardia e'' sempre «IF jsonb_array_length(v_motivi) > 0», identica ovunque e muta sul perche''; attribuirle i codici li archivierebbe tutti sotto IGNOTO, che lo snapshot del rubinetto scarta (WHERE NOT solo_ignoto) — zero candidati nuovi e una copertura che SEMBRA cresciuta. ⚠️ Il marcatore e'' per FORMA e non per nome di funzione: prende allo stesso modo le due righe di fn_available_actions_* che dichiarano un motivo, ed e'' giusto cosi'' — un perimetro scritto a elenco invecchia da solo. Lettura datata 2026-09-08: da 455 a 486 codici e da 150 a 155 classificati; 5 codici passano da invisibili a leggibili, 1 (E_DDT_CAUSALE_OBBLIGATORIA) acquista una famiglia nota.
              ⭐ PARAMETRO NON SI LEGGE SU UN CAMPO DI UN RECORD, dal 2026-09-09 — «IF p_ddt.causale_trasporto_id IS NULL» non e'' una guardia di parametro: p_ddt e'' il documento, causale_trasporto_id un suo CAMPO, e la condizione e'' «manca la causale», cioe'' un dato che una persona correggge. La regola vecchia bastava un ''\mp_\w+'' qualunque sulla riga e la leggeva PARAMETRO. ⛔ Non e'' un''imprecisione fra le altre: PARAMETRO significa «chi ha chiamato e'' rotto» ed e'' l''asse TECNICO/500, mentre quella e'' DATO_ERRATO/400 — il classificatore confondeva le due cose proprio sull''asse per cui esiste. Adesso il p_ deve NON essere seguito da un punto; se sulla riga c''e'' anche un parametro vero, resta PARAMETRO. Chi non si legge piu'' cade in IGNOTO, che e'' la risposta onesta. ⚠️ Misurato prima di farlo: UNA sola riga di guardia in tutto il database aveva questa forma (script.fn_check_ddt_emittibile), quindi il perimetro era noto e non e'' un criterio cambiato al buio. Effetto: E_DDT_CAUSALE_OBBLIGATORIA torna a una famiglia sola e la baseline B-7 non si tocca. Presidiato dai test 7-8 di db/pgtap/dbops/test-vw-codici-errore-motivo-nominato.sql.
              ⭐ TUTTI I CODICI DI UNA RIGA, E IL CORPO SENZA COMMENTI, dal 2026-11-04 — una riga che nomina due codici (''E_A'' e ''E_B'' nello stesso IF o nello stesso motivo) dava un punto al primo e perdeva il secondo: adesso ogni codice distinto della riga e'' un punto, con la stessa guardia. E le righe si tagliano dal corpo letto da dbops.fn_corpo_funzione, senza commenti e con i letterali intatti: prima si scartavano solo le righe che COMINCIANO con --, quindi un codice in un commento a blocco o in coda a una riga contava come punto. ⚠️ Le distanze (6 righe per la chiamata vicina, 25 dalla guardia) cambiano solo dove c''era un commento a blocco su piu'' righe, che non le allunga piu''; un commento di riga lascia il suo a capo, e la riga vuota conta come prima. Al 2026-11-04 la misura non cambiava una riga sul codice vivo: le letture datate restano confrontabili, e la baseline B-7 non si e'' mossa.
              ⚠️ PERIMETRO: il solo plpgsql, di proposito, a differenza delle viste sorelle sui codici (dbops.vw_codici_errore_da_dichiarare, dbops.vw_punti_canale_campo, dbops.vw_funzioni_check_codici, dbops.vw_punti_primo_motivo, dbops.vw_bersagli_non_dichiarati), che leggono ogni corpo leggibile (dbops.fn_corpo_leggibile). Questa vista riconosce la guardia dalle righe IF / ELSIF / ELSE / EXCEPTION WHEN, e una funzione sql non le ha: la sua condizione sta in un WHERE o in un CASE, e letta con questa grammatica non darebbe punti, ne'' giusti ne'' sbagliati. Una funzione sql che solleva un codice resta visibile nella misura dei codici (dbops.vw_codici_errore_da_dichiarare).';
      rollback:
        - sql:
            dbms: postgresql
            sql: |
              -- Il verso di ritiro e' un changeSet nuovo con il COMMENT di prima.
              SELECT 1;
