# ------------------------------------------------------------
# dbops.fn_run_automations_storico - via il ramo drop_legacy_ud
#   (coda C del brief brief-db-richieste-aperte-dal-backend-2)
#
# -- COSA CAMBIA ---------------------------------------------------------
#   Quattro righe in meno: il blocco IF su params->>'drop_legacy_ud' e le tre
#   righe di documentazione interna che lo descrivevano. Nient'altro e'
#   toccato: il corpo e' stato preso dalla funzione VIVA (pg_proc) e la
#   rimozione e' chirurgica, non una riscrittura.
#
# -- PERCHE' - e NON e' "una migrazione finita" --------------------------
#   [X] Il ramo era una pulizia PUNTATA SUL NOME SBAGLIATO. Cancellava
#         trg_{table}_upd_storico  /  trg_{table}_dlt_storico
#   mentre le forme realmente esistite sono altre DUE:
#         trg_<tab>_upd_dlt_storico_<tab>   <- creati dai changelog storici
#         trg_z90_{table}_storico_upd_dlt   <- la convenzione di oggi
#   Tre forme diverse: il DROP TRIGGER IF EXISTS non ha mai potuto
#   agganciare nessuna delle altre due. Non ha "finito il suo lavoro": non
#   ha mai potuto farlo.
#
#   [!] E il flag era COALESCE(..., false): il ramo non e' mai stato
#   eseguito nemmeno per sbaglio. Si toglie una LEVA CHE PROMETTEVA UNA
#   PULIZIA IMPOSSIBILE, non un comportamento.
#
#   Fatto datato 2026-09-01, che conferma e non motiva: zero trigger di
#   entrambe le forme legacy, e 118 trigger di storicizzazione tutti sulla
#   convenzione z90.
#
# -- CONSEGUENZA SUL SEED ------------------------------------------------
#   drop_legacy_ud era l'UNICA chiave di params che questa regola leggesse.
#   Tolto il ramo, la riga STORICO di dbops.automation_rules_tbl non ha piu'
#   niente da dichiarare: params passa da {"apply_triggers": true}
#   (dichiarata e mai letta) a {}. Il seed e' nel CSV, mirror runOnChange -
#   nessun changeSet per quello.
#
# -- PERIMETRO -----------------------------------------------------------
#   Firma invariata, RETURNS void invariato: CREATE OR REPLACE non crea
#   overload e non richiede DROP.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20260901-01-update-fn-run-automations-storico-via-drop-legacy-mctit.yaml

  - changeSet:
      id: 20260901-01-update-fn-run-automations-storico-via-drop-legacy
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Rimosso il ramo drop_legacy_ud da fn_run_automations_storico:
        cancellava un pattern di nome che nessun trigger legacy ha mai usato,
        dietro un flag con default false. Era una leva che prometteva una
        pulizia impossibile. Con lui esce l'ultima chiave di params letta da
        questa regola.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_run_automations_storico(p_exec_mode text, p_schemas text[], p_dry_run boolean)
               RETURNS void
               LANGUAGE plpgsql
              AS $function$

              DECLARE
                v_schemas text[];
                rtab record;
                rrule record;
                rel  regclass;
                has_sto boolean;
                fk_col   text;
                tmpl     text;
                trg_name text;
                exist_strat text;
              BEGIN

                    /*
                      Scopo
                      -----
                      Esegue l'automazione di provisioning dei trigger di storico sulle tabelle "in scope",
                      applicando le regole abilitate in dbops.automation_rules_tbl di tipo 'STORICO'.

                      La funzione:
                      1) risolve lo scope degli schemi (dbops.fn_resolve_scope),
                      2) scorre tutte le tabelle (relkind='r') degli schemi target (escluso 'storico'),
                        filtrate da dbops.fn_table_in_scope(schema, table),
                      3) per ogni tabella applica le regole STORICO compatibili con:
                        - enabled = true
                        - exec_mode = 'AUTO' oppure exec_mode = p_exec_mode
                        - match su schema (dbops.fn_schema_match)
                        - match su tabella: '*ALL' oppure pattern ILIKE su r.target_table
                      4) se esiste la tabella storico corrispondente (storico.<table_name>),
                        assicura la presenza del trigger UPDATE+DELETE sulla tabella base usando:
                        - nome trigger derivato da template (rrule.name_template, default 'trg_z90_{table}_storico_upd_dlt')
                        - funzione trigger generica script.trgfn_storico_generic(fk_col)

                      Esistenza trigger / strategie
                      -----------------------------
                      La creazione del trigger è condizionata da rrule.existence_strategy (default 'BY_NAME'):
                      - BY_NAME     : verifica esistenza per nome trigger
                      - BY_FUNCTION : verifica esistenza per funzione trigger
                      - BOTH        : considera presente se esiste per nome OR per funzione
                      Questo evita duplicazioni e permette migrazioni graduali da trigger legacy a trigger generici.

                      Colonna FK logica (fk_col)
                      --------------------------
                      Determina la colonna FK logica passata alla funzione trigger tramite:
                      - override (dbops.fn_get_override_col) con chiave 'STORICO_FK'
                      - fallback: <table_name>_id

                      Modalità DRY RUN
                      ---------------
                      Se p_dry_run=true non esegue DDL (CREATE TRIGGER/DROP TRIGGER) e registra invece
                      un audit con dbops.fn_audit_log_once indicando cosa verrebbe creato.

                      Error handling
                      --------------
                      - duplicate_object: logga SKIP_EXISTS su audit (trigger già presente)
                      - altri errori: log strutturato e rilancio tramite script.fn_log_and_raise_error
                        includendo tabella e messaggio SQLERRM.
                    */




              v_schemas := dbops.fn_resolve_scope(p_schemas);

              FOR rtab IN
                SELECT n.nspname AS schema_name,
                      c.relname  AS table_name,
                      (quote_ident(n.nspname)||'.'||quote_ident(c.relname))::regclass AS rel
                FROM pg_class c
                JOIN pg_namespace n ON n.oid=c.relnamespace
                WHERE c.relkind='r'
                  AND n.nspname = ANY(v_schemas)
                  AND n.nspname <> 'storico'                  
                  AND dbops.fn_table_in_scope(n.nspname, c.relname)
              LOOP
                FOR rrule IN
                  SELECT *
                  FROM dbops.automation_rules_tbl r
                  WHERE r.enabled
                    AND upper(btrim(r.rule_type))='STORICO'
                    AND (upper(btrim(r.exec_mode)) = 'AUTO' OR r.exec_mode = p_exec_mode)
                    AND dbops.fn_schema_match(r.target_schema, rtab.schema_name)
                    AND (UPPER (r.target_table) = '*ALL' OR rtab.table_name ILIKE r.target_table)

                    ORDER BY r.priority, r.id
                  LOOP
                    exist_strat := COALESCE(rrule.existence_strategy,'BY_NAME');

                    SELECT EXISTS(
                      SELECT 1 FROM pg_class c2
                      JOIN pg_namespace n2 ON n2.oid=c2.relnamespace
                    WHERE n2.nspname='storico'
                      AND c2.relkind='r'
                      AND c2.relname=rtab.table_name
                    ) INTO has_sto;

                    IF has_sto THEN
                      fk_col := dbops.fn_get_override_col(rtab.schema_name, rtab.table_name, 'STORICO_FK', rtab.table_name||'_id');

                      tmpl     := COALESCE(rrule.name_template, 'trg_z90_{table}_storico_upd_dlt');
                      trg_name := dbops.fn_name_from_template(tmpl, rtab.schema_name, rtab.table_name, NULL,NULL,NULL, 'upd_dlt');
                      exist_strat := COALESCE(rrule.existence_strategy,'BY_NAME');

                      IF (exist_strat='BY_NAME'     AND NOT dbops.fn_trigger_exists_by_name(rtab.rel, trg_name))
                      OR (exist_strat='BY_FUNCTION' AND NOT dbops.fn_trigger_exists_by_function(rtab.rel,'script','trgfn_upd_dlt_storico_generic'))
                      OR (exist_strat='BOTH'        AND NOT (dbops.fn_trigger_exists_by_name(rtab.rel, trg_name)
                                                        OR dbops.fn_trigger_exists_by_function(rtab.rel,'script','trgfn_upd_dlt_storico_generic')))
                      THEN
                        IF p_dry_run THEN
                          PERFORM dbops.fn_audit_log_once(
                            p_function_name => 'fn_run_automations_storico',
                            p_status => 'DRYRUN', p_rule_type => 'STORICO', p_dry_run => true,
                            p_params => jsonb_build_object('table', rtab.schema_name||'.'||rtab.table_name,'trigger', trg_name,'action','DRYRUN_CREATE_TRIGGER_UD'),
                            p_message => 'Storico UPDATE+DELETE trigger would be created'
                          );
                        ELSE
                          BEGIN
                            EXECUTE format($f$
                              CREATE TRIGGER %I
                              BEFORE UPDATE OR DELETE ON %I.%I
                              FOR EACH ROW
                              EXECUTE FUNCTION script.trgfn_storico_generic(%L)
                            $f$, trg_name, rtab.schema_name, rtab.table_name, fk_col);
                          EXCEPTION WHEN duplicate_object THEN
                            -- rev 2026-08-04 (bonifica F3): la chiamata era posizionale con
                            --   il 3o e 4o argomento invertiti (rule_type al posto di
                            --   p_params jsonb, e il jsonb al posto di p_message). Resa a
                            --   nomi, come la sorella in DRYRUN qui sopra.
                            PERFORM dbops.fn_audit_log_once(
                              p_function_name => 'fn_run_automations_storico',
                              p_status        => 'SKIP_EXISTS',
                              p_rule_type     => 'STORICO',
                              p_params        => jsonb_build_object('table', rtab.schema_name||'.'||rtab.table_name,'trigger', trg_name::text),
                              p_message       => 'Trigger already present');
                          WHEN OTHERS THEN
                            PERFORM script.fn_log_and_raise_error('dbops','run_automations','E_STORICO_UD',
                              jsonb_build_object('table', rtab.schema_name||'.'||rtab.table_name,'error',SQLERRM), NULL::uuid, SQLERRM);
                          END;
                        END IF;
                      END IF;

                    END IF;
                  END LOOP;
                END LOOP;
              END;


              $function$;

              COMMENT ON FUNCTION dbops.fn_run_automations_storico(text, text[], boolean)
              IS 'Automazione STORICO: monta il trigger generico di storicizzazione sulle tabelle che hanno la gemella in schema storico. rev 2026-09-01: RIMOSSO il ramo drop_legacy_ud, e con lui l''ultima chiave di params che questa regola leggeva (ora params vuoto). NON era una migrazione finita: era una pulizia PUNTATA SUL NOME SBAGLIATO. Cancellava trg_{table}_upd_storico e trg_{table}_dlt_storico, mentre i trigger legacy davvero creati dai changelog storici si chiamano trg_<tab>_upd_dlt_storico_<tab> e quelli di oggi trg_z90_{table}_storico_upd_dlt: tre forme diverse, e il DROP IF EXISTS non ha mai potuto agganciare nessuna delle altre due. Il flag era COALESCE(...,false), quindi il ramo non e'' mai stato eseguito nemmeno per sbaglio: si toglie una leva che prometteva una pulizia impossibile, non un comportamento. Fatto datato 2026-09-01, che conferma e non motiva: zero trigger di entrambe le forme legacy, 118 trigger storico tutti sulla convenzione z90. Richiesta: brief-db-richieste-aperte-dal-backend-2, coda C.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: true
            sql: |
              SELECT 1;
