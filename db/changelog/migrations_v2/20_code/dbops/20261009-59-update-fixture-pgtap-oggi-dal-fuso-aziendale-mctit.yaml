            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_pgtap_crea_commessa_attivita(p_commessa_id vendite.commesse.id%TYPE, p_prezzo_snapshot vendite.commesse_attivita.prezzo_snapshot%TYPE DEFAULT 10)
               RETURNS TABLE(attivita_id vendite.commesse_attivita.id%TYPE, articolo_id vendite.commesse_attivita.articolo_id%TYPE, uom_id vendite.commesse_attivita.uom_id%TYPE, competenza_dal vendite.commesse_attivita.competenza_dal%TYPE, competenza_al vendite.commesse_attivita.competenza_al%TYPE)
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: dare a una fixture pgTAP un'ATTIVITA' approvata su una
              --   commessa gia' costruita, scritta dalla madre del dominio.
              -- Uso:
              --   CREATE TEMP TABLE tmp_a AS
              --   SELECT * FROM dbops.fn_pgtap_crea_commessa_attivita(
              --              (SELECT commessa_id FROM tmp_c));
              -- ⛔ L'emissione NON la fa: e' il caso del test.
              -- ⚠️ Esce con i vincoli IMMEDIATE, come ogni helper.
              DECLARE
                  v_ba_id    vendite.commesse.billing_account_id%TYPE;
                  v_dal      vendite.commesse_attivita.competenza_dal%TYPE;
                  v_al       vendite.commesse_attivita.competenza_al%TYPE;
                  v_ist_id   anagrafiche.billing_account.istanza_utility_id%TYPE;
                  v_articolo vendite.commesse_attivita.articolo_id%TYPE;
                  v_uom      vendite.commesse_attivita.uom_id%TYPE;
                  v_attivita vendite.commesse_attivita.id%TYPE;
              BEGIN
                  SELECT c.billing_account_id,
                         COALESCE(c.competenza_dal, date_trunc('month', (SELECT script.fn_data_operativa()))::date),
                         COALESCE(c.competenza_al,
                                  (date_trunc('month', (SELECT script.fn_data_operativa())) + interval '1 month - 1 day')::date)
                    INTO v_ba_id, v_dal, v_al
                    FROM vendite.commesse c
                   WHERE c.id = p_commessa_id;

                  -- ⚠️ Guard sul parametro: una commessa che non esiste
                  --   farebbe morire la madre su un NULL che non la nomina.
                  IF v_ba_id IS NULL THEN
                      RAISE EXCEPTION
                          'fn_pgtap_crea_commessa_attivita: nessuna commessa con id = %',
                          p_commessa_id;
                  END IF;

                  SELECT ba.istanza_utility_id INTO v_ist_id
                    FROM anagrafiche.billing_account ba
                   WHERE ba.id = v_ba_id;

                  -- L'articolo si costruisce: il catalogo, da zero, e' vuoto.
                  v_articolo := dbops.fn_pgtap_crea_articolo(
                      ('PGT-ATT-' || substr(md5(clock_timestamp()::text || p_commessa_id::text), 1, 12))::varchar,
                      false);

                  SELECT a.uom_id INTO v_uom
                    FROM catalogo.articoli a
                   WHERE a.id = v_articolo;

                  SELECT r.attivita_id INTO v_attivita
                    FROM vendite.fn_upsert_commessa_attivita(
                      p_commessa_id                   => p_commessa_id,
                      p_segment_key                   => ('PGT-SEG-' || substr(md5(clock_timestamp()::text || v_articolo::text), 1, 12))::varchar,
                      p_articolo_id                   => v_articolo,
                      p_istanza_utility_id            => v_ist_id,
                      p_data_attivita                 => v_dal,
                      p_uom_id                        => v_uom,
                      p_quantita                      => 1.000000,
                      p_competenza_mese               => date_trunc('month', v_dal)::date,
                      p_competenza_dal                => v_dal,
                      p_competenza_al                 => v_al,
                      p_prezzo_snapshot               => p_prezzo_snapshot,
                      p_prezzo_base_snapshot          => NULL,
                      p_origine_prezzo                => NULL,
                      p_tipo_variazione_applicata     => NULL,
                      p_valore_variazione_applicata   => NULL,
                      p_promo_id                      => NULL,
                      p_contratto_id                  => NULL,
                      p_categoria_cliente_id_snapshot => NULL,
                      p_classe_utenza_id_snapshot     => NULL,
                      p_stato_approvazione            => 'APPROVATA',
                      p_stato_emissione               => 'NON_EMESSA',
                      p_sorgente_tipo_id              => (SELECT s.id FROM config.sorgenti s
                                                           WHERE s.codice_interno = 'COMMESSA' AND s.attivo),
                      p_sorgente_uid                  => p_commessa_id::text,
                      p_tipo_movimento                => 'NORMALE',
                      p_tipo_consumo                  => 'CONGUAGLIO',
                      p_meta                          => jsonb_build_object('test_scope', 'pgtap_commessa_attivita')) r;

                  -- Contratto dichiarato, non fiducia nel chiamato.
                  SET CONSTRAINTS ALL IMMEDIATE;

                  RETURN QUERY
                  SELECT v_attivita, v_articolo, v_uom, v_dal, v_al;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_pgtap_crea_ddt(p_billing_account_id vendite.ddt.billing_account_id%TYPE, p_destinatario_sr_id vendite.ddt.destinatario_soggetto_ruolo_id%TYPE, p_causale_codice config.causali_trasporto.codice%TYPE, p_magazzino_id vendite.ddt.magazzino_id%TYPE DEFAULT NULL::bigint, p_magazzino_arrivo_id vendite.ddt.magazzino_arrivo_id%TYPE DEFAULT NULL::bigint)
               RETURNS bigint
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: una bolla in bozza per un pgTAP, costruita e non pescata.
              -- Uso: v_ddt := dbops.fn_pgtap_crea_ddt(<ba>, <sr cliente>, 'VENDITA', <mag>);
              DECLARE
                  v_ef      vendite.ddt.emittente_fiscale_id%TYPE;
                  v_draft   config.stati_doc_ddt.id%TYPE;
                  v_causale config.causali_trasporto.id%TYPE;
                  v_utility vendite.ddt.utility_id%TYPE;
                  v_valuta  vendite.ddt.valuta_id%TYPE;
                  v_id      vendite.ddt.id%TYPE;
              BEGIN
                  v_ef := script.fn_pgtap_emittente_operatore();
                  IF v_ef IS NULL THEN
                      RAISE EXCEPTION 'fn_pgtap_crea_ddt: nessun emittente per l''operatore in sessione — chiamare prima fn_pgtap_set_contesto_operatore';
                  END IF;
                  SELECT s.id INTO v_draft FROM config.stati_doc_ddt s WHERE s.codice_interno = 'DRAFT' AND s.attivo;
                  SELECT c.id INTO v_causale FROM config.causali_trasporto c WHERE c.codice = p_causale_codice AND c.attivo;
                  IF v_draft IS NULL OR v_causale IS NULL THEN
                      RAISE EXCEPTION 'fn_pgtap_crea_ddt: stato DRAFT o causale di trasporto % assenti — sono seed di 80_data', p_causale_codice;
                  END IF;
                  SELECT ba.utility_id INTO v_utility FROM anagrafiche.billing_account ba WHERE ba.id = p_billing_account_id;
                  SELECT v.id INTO v_valuta FROM config.valute v ORDER BY v.id LIMIT 1;

                  INSERT INTO vendite.ddt (data, stato_doc_ddt_id, destinatario_soggetto_ruolo_id,
                                           billing_account_id, utility_id, valuta_id, emittente_fiscale_id,
                                           causale_trasporto_id, magazzino_id, magazzino_arrivo_id,
                                           storicizza, meta)
                  VALUES ((SELECT script.fn_data_operativa()), v_draft, p_destinatario_sr_id,
                          p_billing_account_id, v_utility, v_valuta, v_ef,
                          v_causale, p_magazzino_id, p_magazzino_arrivo_id,
                          false, jsonb_build_object('test_scope', 'pgtap_crea_ddt'))
                  RETURNING id INTO v_id;

                  -- Gli indirizzi che l'emissione pretende per l'ambito DDT.
                  INSERT INTO vendite.ddt_indirizzi (ddt_id, tipo_indirizzo_id, snapshot)
                  SELECT v_id, ti.id, '{"display":"pgtap"}'::jsonb
                    FROM config.tipi_indirizzi ti
                   WHERE ti.codice_interno = ANY (script.fn_indirizzi_obbligatori_mancanti('DDT', NULL))
                  ON CONFLICT DO NOTHING;

                  SET CONSTRAINTS ALL IMMEDIATE;
                  RETURN v_id;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_pgtap_crea_fattura(p_etichetta text DEFAULT 'pgTAP'::text, p_stato_codice_interno config.stati_doc_fiscale.codice_interno%TYPE DEFAULT 'DRAFT'::character varying, p_billing_account_id anagrafiche.billing_account.id%TYPE DEFAULT NULL::bigint)
               RETURNS TABLE(fattura_id vendite.fatture.id%TYPE, registro_id vendite.registri_fatturazione.id%TYPE, emittente_fiscale_id anagrafiche.emittenti_fiscali.id%TYPE, emittente_soggetto_ruolo_id anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE, auth_user_id anagrafiche.identita_digitali.auth_user_id%TYPE, billing_account_id anagrafiche.billing_account.id%TYPE, istanza_utility_id anagrafiche.billing_account.istanza_utility_id%TYPE, cliente_soggetto_ruolo_id anagrafiche.billing_account.soggetto_ruolo_id%TYPE, utility_id anagrafiche.billing_account.utility_id%TYPE, tipo_doc_fiscale_id config.tipi_doc_fiscale.id%TYPE, stato_doc_fiscale_id config.stati_doc_fiscale.id%TYPE, valuta_id config.valute.id%TYPE)
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: dare a una fixture pgTAP una FATTURA del mondo in una
              --   chiamata — azienda, operatore, cliente, configurazione della
              --   coppia (emittente, utility), registro coerente e testata —
              --   con l'ordine obbligato dentro l'oggetto invece che nel file.
              -- Uso:
              --   CREATE TEMP TABLE tmp_f AS
              --   SELECT * FROM dbops.fn_pgtap_crea_fattura('sistemazioni');
              --   -- la seconda fattura dello STESSO cliente:
              --   SELECT * FROM dbops.fn_pgtap_crea_fattura(
              --              'sistemazioni 2', 'DRAFT',
              --              (SELECT billing_account_id FROM tmp_f));
              -- ⛔ Righe, scadenze, contabili e movimenti NON li scrive: sono il
              --   caso del test.
              -- ⚠️ Esce con i vincoli IMMEDIATE, come ogni helper.
              DECLARE
                  v_ef_id     anagrafiche.emittenti_fiscali.id%TYPE;
                  v_ef_sr_id  anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE;
                  v_user_id   anagrafiche.identita_digitali.auth_user_id%TYPE;
                  v_ba_id     anagrafiche.billing_account.id%TYPE;
                  v_ist_id    anagrafiche.billing_account.istanza_utility_id%TYPE;
                  v_cli_sr_id anagrafiche.billing_account.soggetto_ruolo_id%TYPE;
                  v_utility   anagrafiche.billing_account.utility_id%TYPE;
                  v_tipo_id   config.tipi_doc_fiscale.id%TYPE;
                  v_stato_id  config.stati_doc_fiscale.id%TYPE;
                  v_valuta_id config.valute.id%TYPE;
                  v_registro  vendite.registri_fatturazione.id%TYPE;
                  v_fattura   vendite.fatture.id%TYPE;
                  v_link_sr   anagrafiche.emittenti_fiscali_billing_account.emittente_soggetto_ruolo_id%TYPE;
              BEGIN
                  -- 1. Il mondo. Senza p_billing_account_id costruisce anche il
                  --    cliente; con, riusa quello e prende solo l'azienda di chi
                  --    agisce (il mondo la riusa quando un contesto c'e').
                  SELECT m.emittente_fiscale_id, m.emittente_soggetto_ruolo_id,
                         m.auth_user_id, m.billing_account_id, m.istanza_utility_id,
                         m.cliente_soggetto_ruolo_id, m.utility_id
                    INTO v_ef_id, v_ef_sr_id, v_user_id, v_ba_id, v_ist_id,
                         v_cli_sr_id, v_utility
                    FROM dbops.fn_pgtap_crea_mondo_cliente(p_etichetta) m;

                  IF p_billing_account_id IS NOT NULL THEN
                      -- ⚠️ Il BA chiesto si VERIFICA prima di usarlo: uno di
                      --   un'altra azienda produrrebbe una testata che il guard
                      --   emittente/BA rifiuta piu' avanti, con un messaggio che
                      --   non nomina la fixture.
                      SELECT efba.emittente_soggetto_ruolo_id INTO v_link_sr
                        FROM anagrafiche.emittenti_fiscali_billing_account efba
                       WHERE efba.billing_account_id = p_billing_account_id;

                      IF v_link_sr IS DISTINCT FROM v_ef_sr_id THEN
                          RAISE EXCEPTION
                              'fn_pgtap_crea_fattura: il billing account % e'' legato all''emittente sr = % e non a % (l''azienda di chi agisce): la seconda fattura si chiede su un BA costruito dallo stesso mondo',
                              p_billing_account_id, v_link_sr, v_ef_sr_id;
                      END IF;

                      SELECT ba.id, ba.istanza_utility_id, ba.soggetto_ruolo_id, ba.utility_id
                        INTO v_ba_id, v_ist_id, v_cli_sr_id, v_utility
                        FROM anagrafiche.billing_account ba
                       WHERE ba.id = p_billing_account_id;
                  END IF;

                  -- 2. La coppia (emittente, utility): una testata fiscale la
                  --    pretende. Si scrive una volta sola — la seconda fattura
                  --    dello stesso mondo la trova gia' fatta.
                  INSERT INTO anagrafiche.emittenti_fiscali_utilities
                      (emittente_soggetto_ruolo_id, utility_id,
                       arrotondamento_importi_dec, metodo_arrotondamento_importi, attivo)
                  SELECT v_ef_sr_id, v_utility, 2, 'HALF_UP', TRUE
                   WHERE NOT EXISTS (
                      SELECT 1 FROM anagrafiche.emittenti_fiscali_utilities efu
                       WHERE efu.emittente_soggetto_ruolo_id = v_ef_sr_id
                         AND efu.utility_id = v_utility);

                  -- 3. Il catalogo si SCEGLIE, e ogni scelta ha il suo ORDER BY.
                  SELECT t.id INTO v_tipo_id
                    FROM config.tipi_doc_fiscale t
                   WHERE t.attivo IS TRUE ORDER BY t.id LIMIT 1;

                  SELECT s.id INTO v_stato_id
                    FROM config.stati_doc_fiscale s
                   WHERE s.codice_interno = p_stato_codice_interno;

                  IF v_stato_id IS NULL THEN
                      RAISE EXCEPTION
                          'fn_pgtap_crea_fattura: nessuno stato documento fiscale con codice_interno = %',
                          p_stato_codice_interno;
                  END IF;

                  SELECT v.id INTO v_valuta_id
                    FROM config.valute v ORDER BY v.id LIMIT 1;

                  -- 4. Il registro dell'azienda di chi agisce: lo crea se non
                  --    c'e', e non ne pesca uno di un'altra (il guard
                  --    trgfn_fatture_guard_registro_emittente lo rifiuterebbe).
                  v_registro := script.fn_pgtap_registro_fattura(v_ef_sr_id);

                  INSERT INTO vendite.fatture (
                      registro_id, data, emittente_soggetto_ruolo_id, billing_account_id,
                      tipo_doc_fiscale_id, stato_doc_fiscale_id, valuta_id, utility_id, meta)
                  VALUES (v_registro, (SELECT script.fn_data_operativa()), v_ef_sr_id, v_ba_id,
                          v_tipo_id, v_stato_id, v_valuta_id, v_utility,
                          jsonb_build_object('test_scope', 'pgtap_' || p_etichetta))
                  RETURNING id INTO v_fattura;

                  -- Contratto dichiarato, non fiducia nel chiamato.
                  SET CONSTRAINTS ALL IMMEDIATE;

                  RETURN QUERY
                  SELECT v_fattura, v_registro, v_ef_id, v_ef_sr_id, v_user_id,
                         v_ba_id, v_ist_id, v_cli_sr_id, v_utility,
                         v_tipo_id, v_stato_id, v_valuta_id;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_pgtap_crea_listino(p_utility_id vendite.listini.utility_id%TYPE, p_etichetta text DEFAULT 'pgTAP'::text, p_valido_dal vendite.listini_versioni.valido_dal%TYPE DEFAULT script.fn_data_operativa(), p_valido_al vendite.listini_versioni.valido_al%TYPE DEFAULT NULL::date)
               RETURNS TABLE(listino_id vendite.listini.id%TYPE, listino_versione_id vendite.listini_versioni.id%TYPE, tipologia_id vendite.listini.tipologia_id%TYPE)
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: dare a una fixture pgTAP un LISTINO con una versione ATTIVA,
              --   dell'azienda di chi agisce, per l'utility scelta dal test.
              --   vendite.listini e' anagrafica: su un database ricostruito e' vuota.
              -- Uso:
              --   CREATE TEMP TABLE tmp_listino AS
              --   SELECT * FROM dbops.fn_pgtap_crea_listino(<utility_id>, 'offerta');
              --   -- versione scaduta, per chi collauda la chiusura:
              --   SELECT * FROM dbops.fn_pgtap_crea_listino(<utility_id>, 'chiusura',
              --                                             DATE '2022-01-01', DATE '2022-12-31');
              -- ⚠️ L'emittente non si sceglie: e' quello di CHI AGISCE
              --   (script.fn_pgtap_emittente_sr_operatore), perche' il guard
              --   emittente_scope di vendite.listini non ne accetta un altro. Quindi
              --   il contesto va aperto PRIMA.
              -- ⚠️ La tipologia e' la prima AMMESSA per l'utility
              --   (config.listini_tipologie_utilities, guard
              --   trgfn_listini_guard_tipologia_utility): una qualunque sbatterebbe
              --   sul guard per le utility che non la prevedono.
              -- ⛔ Le RIGHE del listino non le scrive: prezzi e componenti sono il
              --   caso del test.
              DECLARE
                  v_emittente_sr vendite.listini.emittente_soggetto_ruolo_id%TYPE;
                  v_tipologia    vendite.listini.tipologia_id%TYPE;
                  v_listino      vendite.listini.id%TYPE;
                  v_versione     vendite.listini_versioni.id%TYPE;
              BEGIN
                  v_emittente_sr := script.fn_pgtap_emittente_sr_operatore();

                  IF v_emittente_sr IS NULL THEN
                      RAISE EXCEPTION
                          'fn_pgtap_crea_listino: nessun emittente per chi agisce — aprire il contesto prima (script.fn_pgtap_set_contesto_operatore)';
                  END IF;

                  SELECT ltu.tipologia_id INTO v_tipologia
                    FROM config.listini_tipologie_utilities ltu
                    JOIN config.listini_tipologie lt
                      ON lt.id = ltu.tipologia_id
                     AND lt.attivo
                   WHERE ltu.utility_id = p_utility_id
                     AND ltu.attivo
                   ORDER BY lt.ordinamento, lt.id
                   LIMIT 1;

                  IF v_tipologia IS NULL THEN
                      RAISE EXCEPTION
                          'fn_pgtap_crea_listino: nessuna tipologia di listino ammessa per l''utility % (config.listini_tipologie_utilities)',
                          p_utility_id;
                  END IF;

                  -- Codice libero: uq_listini_codice e' globale, una sigla fissa
                  -- farebbe collidere la seconda chiamata con la prima.
                  INSERT INTO vendite.listini (
                      codice, descrizione, utility_id, tipologia_id, emittente_soggetto_ruolo_id
                  )
                  VALUES (
                      'PGTAP_LST_' || substr(md5(clock_timestamp()::text || random()::text), 1, 16),
                      'Fixture pgTAP: listino ' || p_etichetta,
                      p_utility_id, v_tipologia, v_emittente_sr
                  )
                  RETURNING id INTO v_listino;

                  INSERT INTO vendite.listini_versioni (
                      listino_id, codice_versione, valido_dal, valido_al, stato
                  )
                  VALUES (v_listino, 'PGTAP_V1', p_valido_dal, p_valido_al, 'ATTIVA')
                  RETURNING id INTO v_versione;

                  RETURN QUERY SELECT v_listino, v_versione, v_tipologia;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_pgtap_crea_preventivo(p_etichetta text DEFAULT 'pgTAP'::text, p_stato_codice_interno config.stati_doc_preventivi.codice_interno%TYPE DEFAULT 'DRAFT'::character varying)
               RETURNS TABLE(preventivo_id vendite.preventivi.id%TYPE, preventivo_uid vendite.preventivi.uid%TYPE, emittente_fiscale_id anagrafiche.emittenti_fiscali.id%TYPE, emittente_soggetto_ruolo_id anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE, auth_user_id anagrafiche.identita_digitali.auth_user_id%TYPE, billing_account_id anagrafiche.billing_account.id%TYPE, istanza_utility_id anagrafiche.billing_account.istanza_utility_id%TYPE, cliente_soggetto_ruolo_id anagrafiche.billing_account.soggetto_ruolo_id%TYPE, utility_id anagrafiche.billing_account.utility_id%TYPE, stato_doc_preventivo_id config.stati_doc_preventivi.id%TYPE, valuta_id config.valute.id%TYPE)
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: dare a una fixture pgTAP un PREVENTIVO del mondo in una
              --   chiamata: azienda, operatore, cliente e testata.
              -- Uso:
              --   CREATE TEMP TABLE tmp_p AS
              --   SELECT * FROM dbops.fn_pgtap_crea_preventivo('rls preventivi');
              -- ⛔ Le righe NON le scrive: sono il caso del test.
              -- ⚠️ Senza contesto aperto, il mondo lo apre sull'operatore che
              --   costruisce. Esce con i vincoli IMMEDIATE, come ogni helper.
              DECLARE
                  v_ef_id      anagrafiche.emittenti_fiscali.id%TYPE;
                  v_ef_sr_id   anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE;
                  v_user_id    anagrafiche.identita_digitali.auth_user_id%TYPE;
                  v_ba_id      anagrafiche.billing_account.id%TYPE;
                  v_ist_id     anagrafiche.billing_account.istanza_utility_id%TYPE;
                  v_cli_sr_id  anagrafiche.billing_account.soggetto_ruolo_id%TYPE;
                  v_utility    anagrafiche.billing_account.utility_id%TYPE;
                  v_stato_id   config.stati_doc_preventivi.id%TYPE;
                  v_valuta_id  config.valute.id%TYPE;
                  v_preventivo vendite.preventivi.id%TYPE;
                  v_uid        vendite.preventivi.uid%TYPE;
              BEGIN
                  -- Il guard sul parametro PRIMA di costruire: uno stato
                  -- sbagliato non deve lasciare un mondo a meta'.
                  SELECT s.id INTO v_stato_id
                    FROM config.stati_doc_preventivi s
                   WHERE s.codice_interno = p_stato_codice_interno;

                  IF v_stato_id IS NULL THEN
                      RAISE EXCEPTION
                          'fn_pgtap_crea_preventivo: nessuno stato documento preventivo con codice_interno = %',
                          p_stato_codice_interno;
                  END IF;

                  SELECT m.emittente_fiscale_id, m.emittente_soggetto_ruolo_id,
                         m.auth_user_id, m.billing_account_id, m.istanza_utility_id,
                         m.cliente_soggetto_ruolo_id, m.utility_id
                    INTO v_ef_id, v_ef_sr_id, v_user_id, v_ba_id, v_ist_id,
                         v_cli_sr_id, v_utility
                    FROM dbops.fn_pgtap_crea_mondo_cliente(p_etichetta) m;

                  SELECT v.id INTO v_valuta_id
                    FROM config.valute v ORDER BY v.id LIMIT 1;

                  INSERT INTO vendite.preventivi (
                      billing_account_id, istanza_utility_id, utility_id,
                      validita_dal, validita_al, valuta_id,
                      stato_doc_preventivo_id, emittente_fiscale_id, meta)
                  VALUES (v_ba_id, v_ist_id, v_utility,
                          (SELECT script.fn_data_operativa()), (SELECT script.fn_data_operativa()) + 30, v_valuta_id,
                          v_stato_id, v_ef_id,
                          jsonb_build_object('test_scope', 'pgtap_' || p_etichetta))
                  RETURNING id, uid INTO v_preventivo, v_uid;

                  -- Contratto dichiarato, non fiducia nel chiamato.
                  SET CONSTRAINTS ALL IMMEDIATE;

                  RETURN QUERY
                  SELECT v_preventivo, v_uid, v_ef_id, v_ef_sr_id, v_user_id,
                         v_ba_id, v_ist_id, v_cli_sr_id, v_utility,
                         v_stato_id, v_valuta_id;
              END;
              $function$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_pgtap_concedi_azione(p_auth_user_id config.user_override_azioni.auth_user_id%TYPE, p_permission_codename config.azioni_processo.permission_codename%TYPE)
               RETURNS bigint
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: concedere a un utente di fixture un'azione di processo, con un
              --   override utente valido da oggi e senza scadenza, e fare in modo che
              --   VALGA: dal tetto d'area (brief-db-permessi-tetto-area) anche l'area
              --   dell'azione deve arrivare al suo livello_minimo_area. Solo per i pgTAP.
              -- Uso: PERFORM dbops.fn_pgtap_concedi_azione(
              --          (SELECT auth_user_id FROM _mondo), 'registra_magazzino');
              DECLARE
                  v_azione_id   config.azioni_processo.id%TYPE;
                  v_area_id     config.azioni_processo.area_id%TYPE;
                  v_minimo      config.azioni_processo.livello_minimo_area%TYPE;
                  v_schema_db   config.aree_funzionali.schema_db%TYPE;
                  v_override_id config.user_override_azioni.id%TYPE;
              BEGIN
                  SELECT ap.id, ap.area_id, ap.livello_minimo_area, af.schema_db
                    INTO v_azione_id, v_area_id, v_minimo, v_schema_db
                    FROM config.azioni_processo ap
                    JOIN config.aree_funzionali af ON af.id = ap.area_id
                   WHERE ap.permission_codename = p_permission_codename;

                  IF v_azione_id IS NULL THEN
                      RAISE EXCEPTION 'fn_pgtap_concedi_azione: azione di processo % inesistente', p_permission_codename;
                  END IF;

                  INSERT INTO config.user_override_azioni
                         (auth_user_id, azione_id, abilitata, motivo, valido_dal, valido_al)
                  VALUES (p_auth_user_id, v_azione_id, true, 'Fixture pgTAP', CURRENT_DATE, NULL)
                  ON CONFLICT ON CONSTRAINT uq_user_override_azioni_user_azione
                  DO UPDATE SET abilitata  = true,
                                valido_dal = CURRENT_DATE,
                                valido_al  = NULL
                  RETURNING id INTO v_override_id;

                  -- Il tetto d'area: se l'area non arriva al minimo dell'azione, la si apre
                  -- AL MINIMO (non di piu'), con un override d'area come lo scrive il pannello.
                  IF NOT script.fn_area_consente_azione(
                             script.fn_resolve_livello_area(p_auth_user_id, v_schema_db), v_minimo) THEN
                      -- ⛔ Un override d'area valido scritto dal test e' una scelta del test: la
                      --    fixture non lo scavalca, lo dice.
                      IF EXISTS (SELECT 1
                                   FROM config.user_override_aree uoa
                                  WHERE uoa.auth_user_id = p_auth_user_id
                                    AND uoa.area_id      = v_area_id
                                    AND uoa.validita @> CURRENT_DATE) THEN
                          RAISE EXCEPTION 'fn_pgtap_concedi_azione: l''area % dell''azione % e'' chiusa da un override d''area del test: l''azione non varrebbe (tetto d''area)',
                                          v_schema_db, p_permission_codename;
                      END IF;

                      INSERT INTO config.user_override_aree
                             (auth_user_id, area_id, livello, motivo, valido_dal, valido_al)
                      VALUES (p_auth_user_id, v_area_id, v_minimo,
                              'Fixture pgTAP: tetto d''area di ' || p_permission_codename,
                              CURRENT_DATE, NULL)
                      ON CONFLICT ON CONSTRAINT uq_user_override_aree_user_area
                      DO UPDATE SET livello    = EXCLUDED.livello,
                                    valido_dal = CURRENT_DATE,
                                    valido_al  = NULL;
                  END IF;

                  RETURN v_override_id;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_pgtap_crea_commessa(p_etichetta text DEFAULT 'pgTAP'::text)
               RETURNS TABLE(commessa_id vendite.commesse.id%TYPE, commessa_codice vendite.commesse.codice%TYPE, emittente_fiscale_id anagrafiche.emittenti_fiscali.id%TYPE, emittente_soggetto_ruolo_id anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE, auth_user_id anagrafiche.identita_digitali.auth_user_id%TYPE, billing_account_id anagrafiche.billing_account.id%TYPE, istanza_utility_id anagrafiche.billing_account.istanza_utility_id%TYPE, cliente_soggetto_ruolo_id anagrafiche.billing_account.soggetto_ruolo_id%TYPE, utility_id anagrafiche.billing_account.utility_id%TYPE)
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: dare a una fixture pgTAP una COMMESSA del mondo in una
              --   chiamata: azienda, operatore, cliente e commessa aperta
              --   dalla madre del dominio.
              -- Uso:
              --   CREATE TEMP TABLE tmp_c AS
              --   SELECT * FROM dbops.fn_pgtap_crea_commessa('rls commesse');
              -- ⛔ Le attivita' NON le scrive: sono il caso del test
              --   (dbops.fn_pgtap_crea_commessa_attivita ne da' una).
              -- ⚠️ Senza contesto aperto, il mondo lo apre sull'operatore che
              --   costruisce. Esce con i vincoli IMMEDIATE, come ogni helper.
              DECLARE
                  v_ef_id     anagrafiche.emittenti_fiscali.id%TYPE;
                  v_ef_sr_id  anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE;
                  v_user_id   anagrafiche.identita_digitali.auth_user_id%TYPE;
                  v_ba_id     anagrafiche.billing_account.id%TYPE;
                  v_ist_id    anagrafiche.billing_account.istanza_utility_id%TYPE;
                  v_cli_sr_id anagrafiche.billing_account.soggetto_ruolo_id%TYPE;
                  v_utility   anagrafiche.billing_account.utility_id%TYPE;
                  v_commessa  vendite.commesse.id%TYPE;
                  v_codice    vendite.commesse.codice%TYPE;
              BEGIN
                  SELECT m.emittente_fiscale_id, m.emittente_soggetto_ruolo_id,
                         m.auth_user_id, m.billing_account_id, m.istanza_utility_id,
                         m.cliente_soggetto_ruolo_id, m.utility_id
                    INTO v_ef_id, v_ef_sr_id, v_user_id, v_ba_id, v_ist_id,
                         v_cli_sr_id, v_utility
                    FROM dbops.fn_pgtap_crea_mondo_cliente(p_etichetta) m;

                  -- La madre: codice, emittente e stato li decide lei.
                  v_commessa := vendite.fn_get_or_create_commessa(
                      p_billing_account_id => v_ba_id,
                      p_utility_id         => v_utility,
                      p_competenza_dal     => date_trunc('month', CURRENT_DATE)::date,
                      p_competenza_al      => (date_trunc('month', CURRENT_DATE)
                                               + interval '1 month - 1 day')::date,
                      p_meta               => jsonb_build_object('test_scope', 'pgtap_' || p_etichetta),
                      p_force_new          => true);

                  SELECT c.codice INTO v_codice
                    FROM vendite.commesse c
                   WHERE c.id = v_commessa;

                  -- Contratto dichiarato, non fiducia nel chiamato.
                  SET CONSTRAINTS ALL IMMEDIATE;

                  RETURN QUERY
                  SELECT v_commessa, v_codice, v_ef_id, v_ef_sr_id, v_user_id,
                         v_ba_id, v_ist_id, v_cli_sr_id, v_utility;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_pgtap_crea_commessa_attivita(p_commessa_id vendite.commesse.id%TYPE, p_prezzo_snapshot vendite.commesse_attivita.prezzo_snapshot%TYPE DEFAULT 10)
               RETURNS TABLE(attivita_id vendite.commesse_attivita.id%TYPE, articolo_id vendite.commesse_attivita.articolo_id%TYPE, uom_id vendite.commesse_attivita.uom_id%TYPE, competenza_dal vendite.commesse_attivita.competenza_dal%TYPE, competenza_al vendite.commesse_attivita.competenza_al%TYPE)
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: dare a una fixture pgTAP un'ATTIVITA' approvata su una
              --   commessa gia' costruita, scritta dalla madre del dominio.
              -- Uso:
              --   CREATE TEMP TABLE tmp_a AS
              --   SELECT * FROM dbops.fn_pgtap_crea_commessa_attivita(
              --              (SELECT commessa_id FROM tmp_c));
              -- ⛔ L'emissione NON la fa: e' il caso del test.
              -- ⚠️ Esce con i vincoli IMMEDIATE, come ogni helper.
              DECLARE
                  v_ba_id    vendite.commesse.billing_account_id%TYPE;
                  v_dal      vendite.commesse_attivita.competenza_dal%TYPE;
                  v_al       vendite.commesse_attivita.competenza_al%TYPE;
                  v_ist_id   anagrafiche.billing_account.istanza_utility_id%TYPE;
                  v_articolo vendite.commesse_attivita.articolo_id%TYPE;
                  v_uom      vendite.commesse_attivita.uom_id%TYPE;
                  v_attivita vendite.commesse_attivita.id%TYPE;
              BEGIN
                  SELECT c.billing_account_id,
                         COALESCE(c.competenza_dal, date_trunc('month', CURRENT_DATE)::date),
                         COALESCE(c.competenza_al,
                                  (date_trunc('month', CURRENT_DATE) + interval '1 month - 1 day')::date)
                    INTO v_ba_id, v_dal, v_al
                    FROM vendite.commesse c
                   WHERE c.id = p_commessa_id;

                  -- ⚠️ Guard sul parametro: una commessa che non esiste
                  --   farebbe morire la madre su un NULL che non la nomina.
                  IF v_ba_id IS NULL THEN
                      RAISE EXCEPTION
                          'fn_pgtap_crea_commessa_attivita: nessuna commessa con id = %',
                          p_commessa_id;
                  END IF;

                  SELECT ba.istanza_utility_id INTO v_ist_id
                    FROM anagrafiche.billing_account ba
                   WHERE ba.id = v_ba_id;

                  -- L'articolo si costruisce: il catalogo, da zero, e' vuoto.
                  v_articolo := dbops.fn_pgtap_crea_articolo(
                      ('PGT-ATT-' || substr(md5(clock_timestamp()::text || p_commessa_id::text), 1, 12))::varchar,
                      false);

                  SELECT a.uom_id INTO v_uom
                    FROM catalogo.articoli a
                   WHERE a.id = v_articolo;

                  SELECT r.attivita_id INTO v_attivita
                    FROM vendite.fn_upsert_commessa_attivita(
                      p_commessa_id                   => p_commessa_id,
                      p_segment_key                   => ('PGT-SEG-' || substr(md5(clock_timestamp()::text || v_articolo::text), 1, 12))::varchar,
                      p_articolo_id                   => v_articolo,
                      p_istanza_utility_id            => v_ist_id,
                      p_data_attivita                 => v_dal,
                      p_uom_id                        => v_uom,
                      p_quantita                      => 1.000000,
                      p_competenza_mese               => date_trunc('month', v_dal)::date,
                      p_competenza_dal                => v_dal,
                      p_competenza_al                 => v_al,
                      p_prezzo_snapshot               => p_prezzo_snapshot,
                      p_prezzo_base_snapshot          => NULL,
                      p_origine_prezzo                => NULL,
                      p_tipo_variazione_applicata     => NULL,
                      p_valore_variazione_applicata   => NULL,
                      p_promo_id                      => NULL,
                      p_contratto_id                  => NULL,
                      p_categoria_cliente_id_snapshot => NULL,
                      p_classe_utenza_id_snapshot     => NULL,
                      p_stato_approvazione            => 'APPROVATA',
                      p_stato_emissione               => 'NON_EMESSA',
                      p_sorgente_tipo_id              => (SELECT s.id FROM config.sorgenti s
                                                           WHERE s.codice_interno = 'COMMESSA' AND s.attivo),
                      p_sorgente_uid                  => p_commessa_id::text,
                      p_tipo_movimento                => 'NORMALE',
                      p_tipo_consumo                  => 'CONGUAGLIO',
                      p_meta                          => jsonb_build_object('test_scope', 'pgtap_commessa_attivita')) r;

                  -- Contratto dichiarato, non fiducia nel chiamato.
                  SET CONSTRAINTS ALL IMMEDIATE;

                  RETURN QUERY
                  SELECT v_attivita, v_articolo, v_uom, v_dal, v_al;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_pgtap_crea_ddt(p_billing_account_id vendite.ddt.billing_account_id%TYPE, p_destinatario_sr_id vendite.ddt.destinatario_soggetto_ruolo_id%TYPE, p_causale_codice config.causali_trasporto.codice%TYPE, p_magazzino_id vendite.ddt.magazzino_id%TYPE DEFAULT NULL::bigint, p_magazzino_arrivo_id vendite.ddt.magazzino_arrivo_id%TYPE DEFAULT NULL::bigint)
               RETURNS bigint
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: una bolla in bozza per un pgTAP, costruita e non pescata.
              -- Uso: v_ddt := dbops.fn_pgtap_crea_ddt(<ba>, <sr cliente>, 'VENDITA', <mag>);
              DECLARE
                  v_ef      vendite.ddt.emittente_fiscale_id%TYPE;
                  v_draft   config.stati_doc_ddt.id%TYPE;
                  v_causale config.causali_trasporto.id%TYPE;
                  v_utility vendite.ddt.utility_id%TYPE;
                  v_valuta  vendite.ddt.valuta_id%TYPE;
                  v_id      vendite.ddt.id%TYPE;
              BEGIN
                  v_ef := script.fn_pgtap_emittente_operatore();
                  IF v_ef IS NULL THEN
                      RAISE EXCEPTION 'fn_pgtap_crea_ddt: nessun emittente per l''operatore in sessione — chiamare prima fn_pgtap_set_contesto_operatore';
                  END IF;
                  SELECT s.id INTO v_draft FROM config.stati_doc_ddt s WHERE s.codice_interno = 'DRAFT' AND s.attivo;
                  SELECT c.id INTO v_causale FROM config.causali_trasporto c WHERE c.codice = p_causale_codice AND c.attivo;
                  IF v_draft IS NULL OR v_causale IS NULL THEN
                      RAISE EXCEPTION 'fn_pgtap_crea_ddt: stato DRAFT o causale di trasporto % assenti — sono seed di 80_data', p_causale_codice;
                  END IF;
                  SELECT ba.utility_id INTO v_utility FROM anagrafiche.billing_account ba WHERE ba.id = p_billing_account_id;
                  SELECT v.id INTO v_valuta FROM config.valute v ORDER BY v.id LIMIT 1;

                  INSERT INTO vendite.ddt (data, stato_doc_ddt_id, destinatario_soggetto_ruolo_id,
                                           billing_account_id, utility_id, valuta_id, emittente_fiscale_id,
                                           causale_trasporto_id, magazzino_id, magazzino_arrivo_id,
                                           storicizza, meta)
                  VALUES (CURRENT_DATE, v_draft, p_destinatario_sr_id,
                          p_billing_account_id, v_utility, v_valuta, v_ef,
                          v_causale, p_magazzino_id, p_magazzino_arrivo_id,
                          false, jsonb_build_object('test_scope', 'pgtap_crea_ddt'))
                  RETURNING id INTO v_id;

                  -- Gli indirizzi che l'emissione pretende per l'ambito DDT.
                  INSERT INTO vendite.ddt_indirizzi (ddt_id, tipo_indirizzo_id, snapshot)
                  SELECT v_id, ti.id, '{"display":"pgtap"}'::jsonb
                    FROM config.tipi_indirizzi ti
                   WHERE ti.codice_interno = ANY (script.fn_indirizzi_obbligatori_mancanti('DDT', NULL))
                  ON CONFLICT DO NOTHING;

                  SET CONSTRAINTS ALL IMMEDIATE;
                  RETURN v_id;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_pgtap_crea_fattura(p_etichetta text DEFAULT 'pgTAP'::text, p_stato_codice_interno config.stati_doc_fiscale.codice_interno%TYPE DEFAULT 'DRAFT'::character varying, p_billing_account_id anagrafiche.billing_account.id%TYPE DEFAULT NULL::bigint)
               RETURNS TABLE(fattura_id vendite.fatture.id%TYPE, registro_id vendite.registri_fatturazione.id%TYPE, emittente_fiscale_id anagrafiche.emittenti_fiscali.id%TYPE, emittente_soggetto_ruolo_id anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE, auth_user_id anagrafiche.identita_digitali.auth_user_id%TYPE, billing_account_id anagrafiche.billing_account.id%TYPE, istanza_utility_id anagrafiche.billing_account.istanza_utility_id%TYPE, cliente_soggetto_ruolo_id anagrafiche.billing_account.soggetto_ruolo_id%TYPE, utility_id anagrafiche.billing_account.utility_id%TYPE, tipo_doc_fiscale_id config.tipi_doc_fiscale.id%TYPE, stato_doc_fiscale_id config.stati_doc_fiscale.id%TYPE, valuta_id config.valute.id%TYPE)
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: dare a una fixture pgTAP una FATTURA del mondo in una
              --   chiamata — azienda, operatore, cliente, configurazione della
              --   coppia (emittente, utility), registro coerente e testata —
              --   con l'ordine obbligato dentro l'oggetto invece che nel file.
              -- Uso:
              --   CREATE TEMP TABLE tmp_f AS
              --   SELECT * FROM dbops.fn_pgtap_crea_fattura('sistemazioni');
              --   -- la seconda fattura dello STESSO cliente:
              --   SELECT * FROM dbops.fn_pgtap_crea_fattura(
              --              'sistemazioni 2', 'DRAFT',
              --              (SELECT billing_account_id FROM tmp_f));
              -- ⛔ Righe, scadenze, contabili e movimenti NON li scrive: sono il
              --   caso del test.
              -- ⚠️ Esce con i vincoli IMMEDIATE, come ogni helper.
              DECLARE
                  v_ef_id     anagrafiche.emittenti_fiscali.id%TYPE;
                  v_ef_sr_id  anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE;
                  v_user_id   anagrafiche.identita_digitali.auth_user_id%TYPE;
                  v_ba_id     anagrafiche.billing_account.id%TYPE;
                  v_ist_id    anagrafiche.billing_account.istanza_utility_id%TYPE;
                  v_cli_sr_id anagrafiche.billing_account.soggetto_ruolo_id%TYPE;
                  v_utility   anagrafiche.billing_account.utility_id%TYPE;
                  v_tipo_id   config.tipi_doc_fiscale.id%TYPE;
                  v_stato_id  config.stati_doc_fiscale.id%TYPE;
                  v_valuta_id config.valute.id%TYPE;
                  v_registro  vendite.registri_fatturazione.id%TYPE;
                  v_fattura   vendite.fatture.id%TYPE;
                  v_link_sr   anagrafiche.emittenti_fiscali_billing_account.emittente_soggetto_ruolo_id%TYPE;
              BEGIN
                  -- 1. Il mondo. Senza p_billing_account_id costruisce anche il
                  --    cliente; con, riusa quello e prende solo l'azienda di chi
                  --    agisce (il mondo la riusa quando un contesto c'e').
                  SELECT m.emittente_fiscale_id, m.emittente_soggetto_ruolo_id,
                         m.auth_user_id, m.billing_account_id, m.istanza_utility_id,
                         m.cliente_soggetto_ruolo_id, m.utility_id
                    INTO v_ef_id, v_ef_sr_id, v_user_id, v_ba_id, v_ist_id,
                         v_cli_sr_id, v_utility
                    FROM dbops.fn_pgtap_crea_mondo_cliente(p_etichetta) m;

                  IF p_billing_account_id IS NOT NULL THEN
                      -- ⚠️ Il BA chiesto si VERIFICA prima di usarlo: uno di
                      --   un'altra azienda produrrebbe una testata che il guard
                      --   emittente/BA rifiuta piu' avanti, con un messaggio che
                      --   non nomina la fixture.
                      SELECT efba.emittente_soggetto_ruolo_id INTO v_link_sr
                        FROM anagrafiche.emittenti_fiscali_billing_account efba
                       WHERE efba.billing_account_id = p_billing_account_id;

                      IF v_link_sr IS DISTINCT FROM v_ef_sr_id THEN
                          RAISE EXCEPTION
                              'fn_pgtap_crea_fattura: il billing account % e'' legato all''emittente sr = % e non a % (l''azienda di chi agisce): la seconda fattura si chiede su un BA costruito dallo stesso mondo',
                              p_billing_account_id, v_link_sr, v_ef_sr_id;
                      END IF;

                      SELECT ba.id, ba.istanza_utility_id, ba.soggetto_ruolo_id, ba.utility_id
                        INTO v_ba_id, v_ist_id, v_cli_sr_id, v_utility
                        FROM anagrafiche.billing_account ba
                       WHERE ba.id = p_billing_account_id;
                  END IF;

                  -- 2. La coppia (emittente, utility): una testata fiscale la
                  --    pretende. Si scrive una volta sola — la seconda fattura
                  --    dello stesso mondo la trova gia' fatta.
                  INSERT INTO anagrafiche.emittenti_fiscali_utilities
                      (emittente_soggetto_ruolo_id, utility_id,
                       arrotondamento_importi_dec, metodo_arrotondamento_importi, attivo)
                  SELECT v_ef_sr_id, v_utility, 2, 'HALF_UP', TRUE
                   WHERE NOT EXISTS (
                      SELECT 1 FROM anagrafiche.emittenti_fiscali_utilities efu
                       WHERE efu.emittente_soggetto_ruolo_id = v_ef_sr_id
                         AND efu.utility_id = v_utility);

                  -- 3. Il catalogo si SCEGLIE, e ogni scelta ha il suo ORDER BY.
                  SELECT t.id INTO v_tipo_id
                    FROM config.tipi_doc_fiscale t
                   WHERE t.attivo IS TRUE ORDER BY t.id LIMIT 1;

                  SELECT s.id INTO v_stato_id
                    FROM config.stati_doc_fiscale s
                   WHERE s.codice_interno = p_stato_codice_interno;

                  IF v_stato_id IS NULL THEN
                      RAISE EXCEPTION
                          'fn_pgtap_crea_fattura: nessuno stato documento fiscale con codice_interno = %',
                          p_stato_codice_interno;
                  END IF;

                  SELECT v.id INTO v_valuta_id
                    FROM config.valute v ORDER BY v.id LIMIT 1;

                  -- 4. Il registro dell'azienda di chi agisce: lo crea se non
                  --    c'e', e non ne pesca uno di un'altra (il guard
                  --    trgfn_fatture_guard_registro_emittente lo rifiuterebbe).
                  v_registro := script.fn_pgtap_registro_fattura(v_ef_sr_id);

                  INSERT INTO vendite.fatture (
                      registro_id, data, emittente_soggetto_ruolo_id, billing_account_id,
                      tipo_doc_fiscale_id, stato_doc_fiscale_id, valuta_id, utility_id, meta)
                  VALUES (v_registro, CURRENT_DATE, v_ef_sr_id, v_ba_id,
                          v_tipo_id, v_stato_id, v_valuta_id, v_utility,
                          jsonb_build_object('test_scope', 'pgtap_' || p_etichetta))
                  RETURNING id INTO v_fattura;

                  -- Contratto dichiarato, non fiducia nel chiamato.
                  SET CONSTRAINTS ALL IMMEDIATE;

                  RETURN QUERY
                  SELECT v_fattura, v_registro, v_ef_id, v_ef_sr_id, v_user_id,
                         v_ba_id, v_ist_id, v_cli_sr_id, v_utility,
                         v_tipo_id, v_stato_id, v_valuta_id;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_pgtap_crea_listino(p_utility_id vendite.listini.utility_id%TYPE, p_etichetta text DEFAULT 'pgTAP'::text, p_valido_dal vendite.listini_versioni.valido_dal%TYPE DEFAULT CURRENT_DATE, p_valido_al vendite.listini_versioni.valido_al%TYPE DEFAULT NULL::date)
               RETURNS TABLE(listino_id vendite.listini.id%TYPE, listino_versione_id vendite.listini_versioni.id%TYPE, tipologia_id vendite.listini.tipologia_id%TYPE)
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: dare a una fixture pgTAP un LISTINO con una versione ATTIVA,
              --   dell'azienda di chi agisce, per l'utility scelta dal test.
              --   vendite.listini e' anagrafica: su un database ricostruito e' vuota.
              -- Uso:
              --   CREATE TEMP TABLE tmp_listino AS
              --   SELECT * FROM dbops.fn_pgtap_crea_listino(<utility_id>, 'offerta');
              --   -- versione scaduta, per chi collauda la chiusura:
              --   SELECT * FROM dbops.fn_pgtap_crea_listino(<utility_id>, 'chiusura',
              --                                             DATE '2022-01-01', DATE '2022-12-31');
              -- ⚠️ L'emittente non si sceglie: e' quello di CHI AGISCE
              --   (script.fn_pgtap_emittente_sr_operatore), perche' il guard
              --   emittente_scope di vendite.listini non ne accetta un altro. Quindi
              --   il contesto va aperto PRIMA.
              -- ⚠️ La tipologia e' la prima AMMESSA per l'utility
              --   (config.listini_tipologie_utilities, guard
              --   trgfn_listini_guard_tipologia_utility): una qualunque sbatterebbe
              --   sul guard per le utility che non la prevedono.
              -- ⛔ Le RIGHE del listino non le scrive: prezzi e componenti sono il
              --   caso del test.
              DECLARE
                  v_emittente_sr vendite.listini.emittente_soggetto_ruolo_id%TYPE;
                  v_tipologia    vendite.listini.tipologia_id%TYPE;
                  v_listino      vendite.listini.id%TYPE;
                  v_versione     vendite.listini_versioni.id%TYPE;
              BEGIN
                  v_emittente_sr := script.fn_pgtap_emittente_sr_operatore();

                  IF v_emittente_sr IS NULL THEN
                      RAISE EXCEPTION
                          'fn_pgtap_crea_listino: nessun emittente per chi agisce — aprire il contesto prima (script.fn_pgtap_set_contesto_operatore)';
                  END IF;

                  SELECT ltu.tipologia_id INTO v_tipologia
                    FROM config.listini_tipologie_utilities ltu
                    JOIN config.listini_tipologie lt
                      ON lt.id = ltu.tipologia_id
                     AND lt.attivo
                   WHERE ltu.utility_id = p_utility_id
                     AND ltu.attivo
                   ORDER BY lt.ordinamento, lt.id
                   LIMIT 1;

                  IF v_tipologia IS NULL THEN
                      RAISE EXCEPTION
                          'fn_pgtap_crea_listino: nessuna tipologia di listino ammessa per l''utility % (config.listini_tipologie_utilities)',
                          p_utility_id;
                  END IF;

                  -- Codice libero: uq_listini_codice e' globale, una sigla fissa
                  -- farebbe collidere la seconda chiamata con la prima.
                  INSERT INTO vendite.listini (
                      codice, descrizione, utility_id, tipologia_id, emittente_soggetto_ruolo_id
                  )
                  VALUES (
                      'PGTAP_LST_' || substr(md5(clock_timestamp()::text || random()::text), 1, 16),
                      'Fixture pgTAP: listino ' || p_etichetta,
                      p_utility_id, v_tipologia, v_emittente_sr
                  )
                  RETURNING id INTO v_listino;

                  INSERT INTO vendite.listini_versioni (
                      listino_id, codice_versione, valido_dal, valido_al, stato
                  )
                  VALUES (v_listino, 'PGTAP_V1', p_valido_dal, p_valido_al, 'ATTIVA')
                  RETURNING id INTO v_versione;

                  RETURN QUERY SELECT v_listino, v_versione, v_tipologia;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_pgtap_crea_preventivo(p_etichetta text DEFAULT 'pgTAP'::text, p_stato_codice_interno config.stati_doc_preventivi.codice_interno%TYPE DEFAULT 'DRAFT'::character varying)
               RETURNS TABLE(preventivo_id vendite.preventivi.id%TYPE, preventivo_uid vendite.preventivi.uid%TYPE, emittente_fiscale_id anagrafiche.emittenti_fiscali.id%TYPE, emittente_soggetto_ruolo_id anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE, auth_user_id anagrafiche.identita_digitali.auth_user_id%TYPE, billing_account_id anagrafiche.billing_account.id%TYPE, istanza_utility_id anagrafiche.billing_account.istanza_utility_id%TYPE, cliente_soggetto_ruolo_id anagrafiche.billing_account.soggetto_ruolo_id%TYPE, utility_id anagrafiche.billing_account.utility_id%TYPE, stato_doc_preventivo_id config.stati_doc_preventivi.id%TYPE, valuta_id config.valute.id%TYPE)
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: dare a una fixture pgTAP un PREVENTIVO del mondo in una
              --   chiamata: azienda, operatore, cliente e testata.
              -- Uso:
              --   CREATE TEMP TABLE tmp_p AS
              --   SELECT * FROM dbops.fn_pgtap_crea_preventivo('rls preventivi');
              -- ⛔ Le righe NON le scrive: sono il caso del test.
              -- ⚠️ Senza contesto aperto, il mondo lo apre sull'operatore che
              --   costruisce. Esce con i vincoli IMMEDIATE, come ogni helper.
              DECLARE
                  v_ef_id      anagrafiche.emittenti_fiscali.id%TYPE;
                  v_ef_sr_id   anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE;
                  v_user_id    anagrafiche.identita_digitali.auth_user_id%TYPE;
                  v_ba_id      anagrafiche.billing_account.id%TYPE;
                  v_ist_id     anagrafiche.billing_account.istanza_utility_id%TYPE;
                  v_cli_sr_id  anagrafiche.billing_account.soggetto_ruolo_id%TYPE;
                  v_utility    anagrafiche.billing_account.utility_id%TYPE;
                  v_stato_id   config.stati_doc_preventivi.id%TYPE;
                  v_valuta_id  config.valute.id%TYPE;
                  v_preventivo vendite.preventivi.id%TYPE;
                  v_uid        vendite.preventivi.uid%TYPE;
              BEGIN
                  -- Il guard sul parametro PRIMA di costruire: uno stato
                  -- sbagliato non deve lasciare un mondo a meta'.
                  SELECT s.id INTO v_stato_id
                    FROM config.stati_doc_preventivi s
                   WHERE s.codice_interno = p_stato_codice_interno;

                  IF v_stato_id IS NULL THEN
                      RAISE EXCEPTION
                          'fn_pgtap_crea_preventivo: nessuno stato documento preventivo con codice_interno = %',
                          p_stato_codice_interno;
                  END IF;

                  SELECT m.emittente_fiscale_id, m.emittente_soggetto_ruolo_id,
                         m.auth_user_id, m.billing_account_id, m.istanza_utility_id,
                         m.cliente_soggetto_ruolo_id, m.utility_id
                    INTO v_ef_id, v_ef_sr_id, v_user_id, v_ba_id, v_ist_id,
                         v_cli_sr_id, v_utility
                    FROM dbops.fn_pgtap_crea_mondo_cliente(p_etichetta) m;

                  SELECT v.id INTO v_valuta_id
                    FROM config.valute v ORDER BY v.id LIMIT 1;

                  INSERT INTO vendite.preventivi (
                      billing_account_id, istanza_utility_id, utility_id,
                      validita_dal, validita_al, valuta_id,
                      stato_doc_preventivo_id, emittente_fiscale_id, meta)
                  VALUES (v_ba_id, v_ist_id, v_utility,
                          CURRENT_DATE, CURRENT_DATE + 30, v_valuta_id,
                          v_stato_id, v_ef_id,
                          jsonb_build_object('test_scope', 'pgtap_' || p_etichetta))
                  RETURNING id, uid INTO v_preventivo, v_uid;

                  -- Contratto dichiarato, non fiducia nel chiamato.
                  SET CONSTRAINTS ALL IMMEDIATE;

                  RETURN QUERY
                  SELECT v_preventivo, v_uid, v_ef_id, v_ef_sr_id, v_user_id,
                         v_ba_id, v_ist_id, v_cli_sr_id, v_utility,
                         v_stato_id, v_valuta_id;
              END;
              $function$;
