# dbops.fn_pgtap_*: LE FIXTURE PRENDONO «OGGI» DOVE LO PRENDE LA PRODUZIONE
#   brief-be-db-fe-un-solo-fuso-aziendale §5.1 D-7.
#
# ── PERCHE' ─────────────────────────────────────────────────────────
#   Le fixture pgTAP scrivevano CURRENT_DATE (il giorno della SESSIONE) in
#   colonne che la produzione ora valorizza con script.fn_data_operativa()
#   (il giorno dell'AZIENDA): vendite.fatture.data, ddt.data,
#   preventivi.data, le validita' degli override. Finche' i due giorni
#   coincidono il test e' verde per coincidenza; quando la sessione gira in un
#   fuso diverso (la CI col fuso ostile, decisione T-5) la fixture fabbrica un
#   documento datato «ieri» o «domani» rispetto al codice che lo esamina. La
#   fixture deve chiedere il giorno alla stessa sede del codice che prova.
#
# ── LA CORREZIONE ───────────────────────────────────────────────────
#   CURRENT_DATE -> script.fn_data_operativa(): la sottoquery scalare dentro
#   un'istruzione SQL, la chiamata diretta nel DEFAULT di un parametro. Corpo
#   vivo (pg_get_functiondef su zeroerp_ci, 2026-10-09) con la sola
#   sostituzione; firme e tipi invariati.
#
# ── %TYPE: FIRMA, RETURNS TABLE, DECLARE ───────────────────────────
#   Il corpo vivo (pg_get_functiondef) scioglie i %TYPE della firma: quelli
#   gia' scritti nell'ultimo changeSet di ogni funzione sono stati RIPRESI
#   (anche nel rollback), e in questo giro si sono ancorati i parametri, le
#   colonne di RETURNS TABLE e le variabili che riflettono una colonna.
#   Verificato in transazione annullata su zeroerp_ci: argomenti e risultato
#   di ogni funzione restano byte-identici (nessun overload, nessun chiamante
#   rotto). Restano a TIPO ESPLICITO, perche' non sono il riflesso di nessuna
#   colonna, le voci elencate sotto per funzione: contatori, interruttori del
#   chiamante, jsonb e testi di lavoro, valori calcolati o costanti tipizzate,
#   chiavi polimorfe, il giorno operativo.
#
# ── FUNZIONI (7) ──────────────────────────────────────────────
#     - dbops.fn_pgtap_concedi_azione — tutto ancorato
#     - dbops.fn_pgtap_crea_commessa — tipo esplicito: p_etichetta
#     - dbops.fn_pgtap_crea_commessa_attivita — tutto ancorato
#     - dbops.fn_pgtap_crea_ddt — tutto ancorato
#     - dbops.fn_pgtap_crea_fattura — tipo esplicito: p_etichetta
#     - dbops.fn_pgtap_crea_listino — tipo esplicito: p_etichetta
#     - dbops.fn_pgtap_crea_preventivo — tipo esplicito: p_etichetta
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261009-59-update-fixture-pgtap-oggi-dal-fuso-aziendale-mctit.yaml

  - changeSet:
      id: 20261009-59-update-fixture-pgtap-oggi-dal-fuso-aziendale
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        dbops: fixture pgTAP, CURRENT_DATE -> script.fn_data_operativa() in 7 funzioni:
        lo stesso «oggi» del codice che provano.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 8
            sql: |
              SELECT count(*) FROM pg_proc p
                JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE (n.nspname = 'dbops' AND p.proname IN ('fn_pgtap_concedi_azione', 'fn_pgtap_crea_commessa', 'fn_pgtap_crea_commessa_attivita', 'fn_pgtap_crea_ddt', 'fn_pgtap_crea_fattura', 'fn_pgtap_crea_listino', 'fn_pgtap_crea_preventivo'))
                  OR (n.nspname = 'script' AND p.proname = 'fn_fuso_operativo');
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_pgtap_concedi_azione(p_auth_user_id config.user_override_azioni.auth_user_id%TYPE, p_permission_codename config.azioni_processo.permission_codename%TYPE)
               RETURNS bigint
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: concedere a un utente di fixture un'azione di processo, con un
              --   override utente valido da oggi e senza scadenza, e fare in modo che
              --   VALGA: dal tetto d'area (brief-db-permessi-tetto-area) anche l'area
              --   dell'azione deve arrivare al suo livello_minimo_area. Solo per i pgTAP.
              -- Uso: PERFORM dbops.fn_pgtap_concedi_azione(
              --          (SELECT auth_user_id FROM _mondo), 'registra_magazzino');
              DECLARE
                  v_azione_id   config.azioni_processo.id%TYPE;
                  v_area_id     config.azioni_processo.area_id%TYPE;
                  v_minimo      config.azioni_processo.livello_minimo_area%TYPE;
                  v_schema_db   config.aree_funzionali.schema_db%TYPE;
                  v_override_id config.user_override_azioni.id%TYPE;
              BEGIN
                  SELECT ap.id, ap.area_id, ap.livello_minimo_area, af.schema_db
                    INTO v_azione_id, v_area_id, v_minimo, v_schema_db
                    FROM config.azioni_processo ap
                    JOIN config.aree_funzionali af ON af.id = ap.area_id
                   WHERE ap.permission_codename = p_permission_codename;

                  IF v_azione_id IS NULL THEN
                      RAISE EXCEPTION 'fn_pgtap_concedi_azione: azione di processo % inesistente', p_permission_codename;
                  END IF;

                  INSERT INTO config.user_override_azioni
                         (auth_user_id, azione_id, abilitata, motivo, valido_dal, valido_al)
                  VALUES (p_auth_user_id, v_azione_id, true, 'Fixture pgTAP', (SELECT script.fn_data_operativa()), NULL)
                  ON CONFLICT ON CONSTRAINT uq_user_override_azioni_user_azione
                  DO UPDATE SET abilitata  = true,
                                valido_dal = (SELECT script.fn_data_operativa()),
                                valido_al  = NULL
                  RETURNING id INTO v_override_id;

                  -- Il tetto d'area: se l'area non arriva al minimo dell'azione, la si apre
                  -- AL MINIMO (non di piu'), con un override d'area come lo scrive il pannello.
                  IF NOT script.fn_area_consente_azione(
                             script.fn_resolve_livello_area(p_auth_user_id, v_schema_db), v_minimo) THEN
                      -- ⛔ Un override d'area valido scritto dal test e' una scelta del test: la
                      --    fixture non lo scavalca, lo dice.
                      IF EXISTS (SELECT 1
                                   FROM config.user_override_aree uoa
                                  WHERE uoa.auth_user_id = p_auth_user_id
                                    AND uoa.area_id      = v_area_id
                                    AND uoa.validita @> (SELECT script.fn_data_operativa())) THEN
                          RAISE EXCEPTION 'fn_pgtap_concedi_azione: l''area % dell''azione % e'' chiusa da un override d''area del test: l''azione non varrebbe (tetto d''area)',
                                          v_schema_db, p_permission_codename;
                      END IF;

                      INSERT INTO config.user_override_aree
                             (auth_user_id, area_id, livello, motivo, valido_dal, valido_al)
                      VALUES (p_auth_user_id, v_area_id, v_minimo,
                              'Fixture pgTAP: tetto d''area di ' || p_permission_codename,
                              (SELECT script.fn_data_operativa()), NULL)
                      ON CONFLICT ON CONSTRAINT uq_user_override_aree_user_area
                      DO UPDATE SET livello    = EXCLUDED.livello,
                                    valido_dal = (SELECT script.fn_data_operativa()),
                                    valido_al  = NULL;
                  END IF;

                  RETURN v_override_id;
              END;
              $function$;
        - sql:
            dbms: postgresql
