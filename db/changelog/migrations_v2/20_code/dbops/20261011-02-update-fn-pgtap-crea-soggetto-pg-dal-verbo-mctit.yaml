# LA FIXTURE DELLE SOCIETA' SCRIVE I DATI SOCIETARI COME L'APP
#   dbops.fn_pgtap_crea_soggetto_pg  (stessa firma, CREATE OR REPLACE)
#   Brief: brief-db-dati-fiscali-e-societari-del-soggetto (B-5, C-1, B-6)
#
# -- COSA CAMBIA ------------------------------------------------------
#   Corpo vivo = quello del 20261010-40 (verificato sul catalogo di dbdev).
#   Cambia solo il pezzo dei dati societari:
#   * passa dal verbo anagrafiche.fn_scrivi_dati_societari (20261010-99): dal
#     20261011-04 l'app non scrive piu' la tabella, e una fixture scrive dove
#     scrive l'applicazione (un permesso negato che l'app non incontrerebbe
#     mai e' un difetto della fixture, non un'eccezione da marcare);
#   * la forma giuridica non e' piu' NULL: e' la prima AMMESSA dalla natura
#     (anagrafiche.fn_forma_giuridica_ammessa, C-1) dello stesso Stato; dal
#     20261011-03 la colonna e' NOT NULL;
#   * REA e capitale solo se la forma li prevede (B-6): per un ente o una
#     ditta, capitale NULL;
#   * niente dati societari se la natura li vieta.
#   Resta SECURITY INVOKER, come ogni fixture (nessuna scorciatoia DEFINER:
#   un helper DEFINER eseguibile dall'app sarebbe una porta senza regole).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261011-02-update-fn-pgtap-crea-soggetto-pg-dal-verbo-mctit.yaml

  - changeSet:
      id: 20261011-02-update-fn-pgtap-crea-soggetto-pg-dal-verbo
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.fn_pgtap_crea_soggetto_pg scrive i dati societari col verbo
        anagrafiche.fn_scrivi_dati_societari: forma ammessa dalla natura, REA e capitale secondo la
        forma, niente dati societari se la natura li vieta. Brief:
        brief-db-dati-fiscali-e-societari-del-soggetto (B-5, C-1, B-6).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "2"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'anagrafiche'
                 AND p.proname IN ('fn_scrivi_dati_societari', 'fn_forma_giuridica_ammessa');
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_pgtap_crea_soggetto_pg(
                  p_ragione_sociale            anagrafiche.soggetti.ragione_sociale%TYPE,
                  -- ⚠️ integer esplicito: la colonna e' bigint, e ancorarla cambierebbe
                  --   l'identita' della firma (un overload accanto a questa).
                  p_tipo_soggetto_dettaglio_id integer                                     DEFAULT 3,
                  p_stato_id                   anagrafiche.soggetti.stato_id%TYPE          DEFAULT 1,
                  p_piva                       anagrafiche.soggetti.partita_iva%TYPE       DEFAULT NULL
              )
              RETURNS anagrafiche.soggetti.id%TYPE
              LANGUAGE plpgsql
              SECURITY INVOKER
              AS $function$
              -- Scopo: creare per una fixture pgTAP un soggetto PERSONA
              --   GIURIDICA gia' valido — testata, dati societari, indirizzi
              --   obbligatori, contatto — in un colpo solo.
              -- Uso:
              --   CREATE TEMP TABLE tmp_s AS
              --   SELECT dbops.fn_pgtap_crea_soggetto_pg('Banca Zero pgTAP') AS id;
              DECLARE
                  v_soggetto_id anagrafiche.soggetti.id%TYPE;
                  v_piva        anagrafiche.soggetti.partita_iva%TYPE;
                  v_prov_id     config.province.id%TYPE;
                  v_tipo_cont   config.tipi_contatti.id%TYPE;
                  v_n_ind       integer;   -- un conteggio: nessuna colonna da ancorare
                  v_forma_id    anagrafiche.dati_societari.forma_giuridica_id%TYPE;
                  v_rea_policy  config.forme_giuridiche.rea_policy%TYPE;
                  v_cap_policy  config.forme_giuridiche.capitale_sociale_policy%TYPE;
                  v_ds_policy   config.tipi_soggetto_dettaglio.dati_societari_policy%TYPE;
              BEGIN
                  v_piva := COALESCE(p_piva, dbops.fn_pgtap_piva_libera());

                  SELECT p.id INTO v_prov_id FROM config.province p ORDER BY p.id LIMIT 1;
                  SELECT t.id INTO v_tipo_cont FROM config.tipi_contatti t ORDER BY t.id LIMIT 1;

                  -- ⭐ FINESTRA DIFFERITA. I tre guard di completezza su
                  --   anagrafiche.soggetti (dati societari, indirizzi, contatti)
                  --   sono DEFERRABLE INITIALLY DEFERRED apposta, perche' un
                  --   soggetto e' una SAGA e la completezza ha senso verificarla
                  --   quando la saga e' finita, non dopo il primo INSERT.
                  --   Si costruisce con i guard aperti e si RICHIUDE in fondo.
                  --   ⚠️ La richiusura non e' facoltativa: senza, la chiusura in
                  --   ROLLBACK del file di test se li porterebbe via NON
                  --   verificati, e il test sarebbe verde per sottrazione.
                  SET CONSTRAINTS ALL DEFERRED;

                  INSERT INTO anagrafiche.soggetti (
                      ragione_sociale, cognome, nome, sesso, stato_id,
                      partita_iva, codice_fiscale, tipo_soggetto_dettaglio_id,
                      storicizza, attivo
                  )
                  VALUES (
                      -- ⭐ Rev 20261009-29: sesso NULL, non 'S'. Per societa' ed enti il
                      --   sesso non si indica (sesso_policy NONE), e 'S' e' fuori dal
                      --   vocabolario (chk_soggetti_sesso). brief-db-sesso-senza-default.
                      p_ragione_sociale, NULL, NULL, NULL, p_stato_id,
                      -- Per una persona giuridica italiana il codice fiscale
                      -- coincide con la partita IVA, e il guard cf/piva lo esige.
                      v_piva, v_piva, p_tipo_soggetto_dettaglio_id,
                      TRUE, TRUE
                  )
                  RETURNING id INTO v_soggetto_id;

                  -- ⭐ Rev 20261011-02 (brief-db-dati-fiscali-e-societari-del-soggetto):
                  --   i dati societari si scrivono col VERBO, come l'applicazione
                  --   (anagrafiche.fn_scrivi_dati_societari: dal 20261011-04 l'app non
                  --   scrive la tabella). E i valori li decide la configurazione, non la
                  --   fixture: la forma e' la prima AMMESSA dalla natura (C-1), REA e
                  --   capitale ci sono solo se la forma li prevede (B-6). Prima scriveva
                  --   sempre REA e capitale e nessuna forma: per un ente o una ditta
                  --   sarebbe ora un dato fuori regola.
                  --   Niente dati societari se la natura li vieta (dati_societari_policy NONE).
                  SELECT tsd.dati_societari_policy INTO v_ds_policy
                    FROM config.tipi_soggetto_dettaglio tsd WHERE tsd.id = p_tipo_soggetto_dettaglio_id;

                  SELECT m.forma_giuridica_id, fg.rea_policy, fg.capitale_sociale_policy
                    INTO v_forma_id, v_rea_policy, v_cap_policy
                    FROM config.forme_giuridiche_tipi_soggetto_dettaglio m
                    JOIN config.forme_giuridiche fg ON fg.id = m.forma_giuridica_id
                   WHERE m.tipo_soggetto_dettaglio_id = p_tipo_soggetto_dettaglio_id
                     AND fg.attivo
                     AND fg.stato_id = p_stato_id
                     AND anagrafiche.fn_forma_giuridica_ammessa(m.forma_giuridica_id, m.tipo_soggetto_dettaglio_id,
                                                                script.fn_giorno_operativo(now()))
                   ORDER BY m.forma_giuridica_id
                   LIMIT 1;

                  IF v_ds_policy IS DISTINCT FROM 'NONE' THEN
                      -- ⚠️ uq_ds_prov_cea e' UNIQUE su (provincia, numero REA): il numero si
                      --   deriva dalla partita IVA, che e' gia' unica per costruzione.
                      PERFORM anagrafiche.fn_scrivi_dati_societari(
                          p_soggetto_id        := v_soggetto_id,
                          p_forma_giuridica_id := v_forma_id,
                          p_id_prov_iscri_rea  := CASE WHEN v_rea_policy <> 'NONE' THEN v_prov_id END,
                          p_iscrizione_rea     := CASE WHEN v_rea_policy <> 'NONE' THEN 'REA-' || v_piva END,
                          p_capitale_sociale   := CASE WHEN v_cap_policy <> 'NONE' THEN 10000.00 END,
                          p_socio_unico        := 'SM',
                          p_liquidazione       := 'LN',
                          p_destinatario_fe    := NULL,   -- nessun canale FE (rev 20261010-40)
                          p_pec_fatturazione   := NULL,
                          p_codice_sdi         := NULL,
                          p_data_costituzione  := NULL);
                  END IF;

                  -- Gli indirizzi ammessi li decide la matrice per il
                  -- TIPO SOGGETTO DETTAGLIO, non quella dei ruoli: si legge la
                  -- configurazione invece di elencare i codici a mano.
                  INSERT INTO anagrafiche.indirizzi_soggetti (
                      soggetto_id, tipo_indirizzo_id,
                      indirizzo_libero, stato_id, locality, postal_box, administrative_area
                  )
                  SELECT v_soggetto_id, m.tipo_indirizzo_id,
                         'Via pgTAP 1', p_stato_id, 'Roma', '00100', 'RM'
                    FROM config.tipi_soggetto_dettaglio_tipi_indirizzo m
                   WHERE m.tipo_soggetto_dettaglio_id = p_tipo_soggetto_dettaglio_id
                     AND m.attivo
                     AND m.obbligatorio;
                  GET DIAGNOSTICS v_n_ind = ROW_COUNT;

                  -- Nessun tipo obbligatorio per questo tipo soggetto: ne serve
                  -- comunque almeno uno, perche' il guard indirizzi pretende una
                  -- riga, non un tipo preciso.
                  IF v_n_ind = 0 THEN
                      INSERT INTO anagrafiche.indirizzi_soggetti (
                          soggetto_id, tipo_indirizzo_id,
                          indirizzo_libero, stato_id, locality, postal_box, administrative_area
                      )
                      SELECT v_soggetto_id, m.tipo_indirizzo_id,
                             'Via pgTAP 1', p_stato_id, 'Roma', '00100', 'RM'
                        FROM config.tipi_soggetto_dettaglio_tipi_indirizzo m
                       WHERE m.tipo_soggetto_dettaglio_id = p_tipo_soggetto_dettaglio_id
                         AND m.attivo
                       ORDER BY m.tipo_indirizzo_id
                       LIMIT 1;
                  END IF;

                  INSERT INTO anagrafiche.contatti (
                      tipo_contatto_id, soggetto_id, nominativo, email,
                      is_default, default_context
                  )
                  VALUES (v_tipo_cont, v_soggetto_id,
                          'Referente ' || p_ragione_sociale,
                          'pgtap@example.com', TRUE, 'soggetto');

                  -- Saga completa: i tre guard differiti scattano QUI, su un
                  -- soggetto finito. E' esattamente la verifica che il modello vuole.
                  SET CONSTRAINTS ALL IMMEDIATE;

                  RETURN v_soggetto_id;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_pgtap_crea_soggetto_pg(
                  anagrafiche.soggetti.ragione_sociale%TYPE, integer,
                  anagrafiche.soggetti.stato_id%TYPE, anagrafiche.soggetti.partita_iva%TYPE)
              IS 'Crea per una fixture pgTAP un soggetto PERSONA GIURIDICA gia'' valido: testata, dati societari, indirizzi obbligatori letti da config.tipi_soggetto_dettaglio_tipi_indirizzo, contatto. ⭐ Apre e RICHIUDE la finestra dei tre guard DEFERRABLE INITIALLY DEFERRED di anagrafiche.soggetti: e'' il punto che nessun test indovinava, perche'' il SET CONSTRAINTS ALL IMMEDIATE del preambolo obbligatorio li fa scattare prima che la saga possa esistere. Al ritorno i vincoli sono IMMEDIATE: un chiamante che dopo costruisce a mano un''altra saga deve aprirsi la sua finestra. Ritorna l''id del soggetto. Brief: brief-db-bonifica-baseline-pgtap-vendite.md Rev 20261009-29 (brief-db-sesso-senza-default): il sesso e'' NULL (era ''S'', fuori vocabolario); una natura PF qui viene rifiutata dal guard del sesso, perche'' il builder non ne ha uno da dare. Rev 20261010-40 (brief-db-character-n-spazi-di-riempimento D-6): i dati societari nascono senza canale FE (destinatario_fe NULL), non piu'' con il codice ''0000000''. Rev 20261011-02: i dati societari passano dal verbo anagrafiche.fn_scrivi_dati_societari; forma = la prima ammessa dalla natura, REA e capitale solo se la forma li prevede, niente dati societari se la natura li vieta. Brief: brief-db-dati-fiscali-e-societari-del-soggetto.';

      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Il corpo precedente e' quello del 20261010-40: si ripristina rieseguendone il blocco.
              SELECT 1;
