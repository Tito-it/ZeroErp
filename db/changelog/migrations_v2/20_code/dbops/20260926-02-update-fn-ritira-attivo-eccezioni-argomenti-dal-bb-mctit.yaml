# ------------------------------------------------------------
# dbops.fn_ritira_attivo_eccezioni: gli argomenti dei trigger dal building
#   block dbops.fn_trigger_argomenti (20260926-01), non piu' decodificati sul
#   posto. Ritiro della prima copia, nello stesso giro dell'estrazione.
#   Brief: brief-db-lock-di-colonna-fuori-registro, sezione 7
#
# Corpo dal vivo: stesso md5 di prosrc su dbdev e su zeroerp_ci il
# 2026-09-26 (rev 20260925-47, uguale alla doc auto-gen). Cambia UNA
# espressione, quella che leggeva tgargs; il resto e' identico.
#
# ⚠️ Che cosa correggeva di fatto: niente di osservato. Nessuno dei trigger
#   ATTIVO vivi ha un ultimo argomento che finisce con uno zero o un
#   carattere non ASCII: la forma vecchia e la nuova coincidono su tutti i
#   trigger di zeroerp_ci (provato il 26-09). Il difetto era latente, e sta
#   nel commento di 20260926-01.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20260926-02-update-fn-ritira-attivo-eccezioni-argomenti-dal-bb-mctit.yaml

  - changeSet:
      id: 20260926-02-update-fn-ritira-attivo-eccezioni-argomenti-dal-bb
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        fn_ritira_attivo_eccezioni legge gli argomenti dei trigger con
        dbops.fn_trigger_argomenti invece di decodificarli sul posto.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_proc
               WHERE proname = 'fn_trigger_argomenti'
                 AND pronamespace = 'dbops'::regnamespace
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_ritira_attivo_eccezioni()
               RETURNS integer
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: togliere i trigger ATTIVO gia' generati per le FK dichiarate
              --   eccezione in dbops.automazione_attivo_eccezioni.
              -- Uso: SELECT dbops.fn_ritira_attivo_eccezioni();  -- quanti ne ha tolti
              DECLARE
                  r      record;
                  v_n    integer := 0;
              BEGIN
                  FOR r IN
                      WITH trg AS (
                          SELECT t.tgname,
                                 t.tgrelid,
                                 p.proname,
                                 -- rev 20260926-02: argomenti dal building block.
                                 dbops.fn_trigger_argomenti(t.tgargs) AS a
                            FROM pg_trigger t
                            JOIN pg_proc p      ON p.oid = t.tgfoid
                            JOIN pg_namespace n ON n.oid = p.pronamespace
                           WHERE NOT t.tgisinternal
                             AND n.nspname = 'dbops'
                             AND p.proname IN ('trgfn_child_requires_active_parent',
                                               'trgfn_prevent_deactivate_if_children')
                      )
                      SELECT trg.tgname, trg.tgrelid::regclass AS rel
                        FROM trg
                        JOIN dbops.automazione_attivo_eccezioni e
                          ON (    trg.proname = 'trgfn_child_requires_active_parent'
                              AND trg.tgrelid = to_regclass(format('%I.%I', e.schema_figlia, e.tabella_figlia))
                              AND trg.a[4]    = e.colonna_fk)
                          OR (    trg.proname = 'trgfn_prevent_deactivate_if_children'
                              AND trg.a[1]    = e.schema_figlia
                              AND trg.a[2]    = e.tabella_figlia
                              AND trg.a[3]    = e.colonna_fk)
                  LOOP
                      EXECUTE format('DROP TRIGGER IF EXISTS %I ON %s', r.tgname, r.rel);
                      RAISE NOTICE 'fn_ritira_attivo_eccezioni: ritirato % su %', r.tgname, r.rel;
                      v_n := v_n + 1;
                  END LOOP;

                  RETURN v_n;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_ritira_attivo_eccezioni()
              IS 'Toglie i trigger ATTIVO gia'' generati per le FK dichiarate eccezione in dbops.automazione_attivo_eccezioni: il require sul figlio (dbops.trgfn_child_requires_active_parent, colonna FK = argomento 4) e il block sul padre (dbops.trgfn_prevent_deactivate_if_children, argomenti 1-3 = schema, tabella e colonna FK della figlia). Li riconosce per FUNZIONE e ARGOMENTI, non per nome (i nomi generati oltre 63 caratteri sono hashati); gli argomenti li legge dbops.fn_trigger_argomenti (rev 20260926-02). Torna quanti ne ha tolti. Chiamata in testa da dbops.fn_run_automations_attivo (chi genera ritira) e una volta da 90_end/20260925-50. Brief: brief-db-blocco-login-per-credenziale §12.3.';
      rollback:
        - sql:
            dbms: postgresql
            sql: |
              -- Nessun ritorno alla decodifica sul posto: e' la forma che tronca
              -- un argomento finale con uno zero. Il rollback e' un no-op dichiarato.
              SELECT 1;
