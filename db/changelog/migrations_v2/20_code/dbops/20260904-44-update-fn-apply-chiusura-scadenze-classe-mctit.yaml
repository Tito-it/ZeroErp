# brief-db-processi-automatici-identita-e-perimetro §6 (fase 5) — la funzione
# lavora solo i bersagli della CLASSE con cui viene chiamata.
#
# ⭐ DUE COSE DIVERSE, e vale la pena tenerle separate:
#   * il FILTRO `p_classe` sceglie quali bersagli lavorare in QUESTO giro. Con
#     `NULL` li lavora tutti — che e' il comportamento storico, ed e' voluto:
#     il job pgAgent chiama `dbops.fn_apply_chiusura_scadenze()` senza argomenti
#     e continua a funzionare identico. ⛔ Non si tocca `85_pgagent`, una fase
#     che in CI non gira mai (MARK_RAN) e che si collauda solo a mano;
#   * il CANCELLO e' un'altra cosa: il `NOT NULL` su `classe` (changeSet -45).
#     Una riga nuova nel CSV deve dichiarare di che natura e', o non entra
#     nemmeno in tabella.
#   ⇒ Il filtro serve DOPO, quando i bersagli di DOMINIO migreranno sulla coda:
#     il worker chiamera' con `'DOMINIO'` e pgAgent con `'AMMINISTRAZIONE'`, e i
#     due mondi smetteranno di mescolarsi. Quella migrazione e' backend.
#
# ⚠️ DROP prima del CREATE: aggiungere un parametro a una funzione a ZERO
# argomenti crea un OVERLOAD, e la chiamata `fn_apply_chiusura_scadenze()`
# diventerebbe ambigua fra le due. Con la vecchia rimossa, `()` risolve sulla
# nuova usando il default.
#   ⭐ Verificato che il DROP qui non porta via niente: la funzione non ha mai
#   avuto un `REVOKE`/`GRANT` suo (cercato nei changeSet che la definiscono).
#   E' la lezione di 20260904-21, applicata come verifica invece che come danno.
#
# Corpo preso dalla doc auto-gen (l'oggetto vivo) e modificato in DUE punti
# soli: la firma e il predicato del ciclo.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20260904-44-update-fn-apply-chiusura-scadenze-classe-mctit.yaml

  - changeSet:
      id: 20260904-44-update-fn-apply-chiusura-scadenze-classe
      author: mctit
      failOnError: true
      comment: >
        dbops.fn_apply_chiusura_scadenze prende p_classe (default NULL = tutte,
        comportamento storico) e lavora solo i bersagli di quella classe. DROP
        della firma a zero argomenti per non lasciare un overload ambiguo.
      preConditions:
        - onFail: HALT
        - and:
            - columnExists:
                { schemaName: dbops, tableName: automazione_chiusura_scadenze, columnName: classe }
            - sqlCheck:
                expectedResult: "1"
                sql: |
                  SELECT COUNT(*)
                    FROM pg_proc p
                    JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'dbops'
                     AND p.proname = 'fn_apply_chiusura_scadenze';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- La firma a zero argomenti se ne va: restando, la chiamata
              -- `fn_apply_chiusura_scadenze()` sarebbe ambigua fra le due.
              DROP FUNCTION IF EXISTS dbops.fn_apply_chiusura_scadenze();

                        CREATE OR REPLACE FUNCTION dbops.fn_apply_chiusura_scadenze(
                            p_classe dbops.automazione_chiusura_scadenze.classe%TYPE DEFAULT NULL)
                         RETURNS jsonb
                         LANGUAGE plpgsql
                        AS $function$
                        -- Scopo:
                        --   Esegue la chiusura di stato per scadenza temporale su
                        --   tutte le tabelle configurate in
                        --   dbops.automazione_chiusura_scadenze (attivo=true).
                        --   Ritorna JSONB con conteggio righe chiuse per tabella
                        --   target + meta-info esecuzione.
                        --
                        -- Algoritmo:
                        --   1. Pre-check struttura: schema/tabella/colonne esistono;
                        --      per tipo_stato=FK anche tabella lookup e codici.
                        --   2. UPDATE dinamico (VARCHAR diretto o FK con lookup id).
                        --   3. Aggregazione conteggio in JSONB.
                        --   4. Audit log dell'esito.
                        --
                        -- GUC app.cessazione_automatica:
                        --   Impostato a 'true' (LOCAL) prima del loop per segnalare
                        --   ai guard trigger che questa e' una chiusura automatica
                        --   (non una transizione manuale da UI). Permette ai guard
                        --   di usare regole piu' permissive per la chiusura automatica
                        --   (es. valido_al < CURRENT_DATE ammessa dal job ma non dall'utente).
                        --
                        -- Sicurezza SQL dinamico:
                        --   - format(%I) per identificatori (quote_ident implicito)
                        --   - format(%L) per valori (quote_literal implicito)
                        --   - I valori della config sono comunque controllati
                        --     amministrativamente (Liquibase seed), ma applichiamo
                        --     igiene comunque.
                        DECLARE
                            v_row              dbops.automazione_chiusura_scadenze%ROWTYPE;
                            v_result           jsonb := '{}'::jsonb;
                            v_total            bigint := 0;
                            v_count            bigint;
                            v_target_key       text;
                            v_sql              text;
                            v_id_chiuso        bigint;
                            v_id_attivo        bigint;
                            v_col_count        smallint;
                        BEGIN
                            -- Segnala ai guard trigger che si tratta di chiusura automatica.
                            -- LOCAL: il GUC torna al valore precedente alla fine della transazione.
                            PERFORM set_config('app.cessazione_automatica', 'true', true);

                            FOR v_row IN
                                SELECT *
                                  FROM dbops.automazione_chiusura_scadenze
                                 WHERE attivo = TRUE
                                   -- ⭐ Filtro di CLASSE (2026-09-04). p_classe NULL = tutte, che e'
                                   --   il comportamento storico: il job pgAgent chiama senza argomenti
                                   --   e continua a lavorare tutto. Quando i bersagli di DOMINIO
                                   --   migreranno sulla coda, il chiamante passera' la propria classe
                                   --   e i due mondi smetteranno di mescolarsi.
                                   -- ⛔ Il vero cancello NON e' questo filtro: e' il NOT NULL su
                                   --   `classe` (changeSet -45). Una riga nuova nel CSV deve
                                   --   dichiarare di che natura e', o non entra nemmeno in tabella.
                                   AND (p_classe IS NULL OR classe = p_classe)
                                 ORDER BY id
                            LOOP
                                v_target_key := v_row.schema_tabella || '.' || v_row.nome_tabella;

                                -- =====================================================
                                -- 1) Pre-check: tabella e colonne target
                                -- to_regclass restituisce NULL se la tabella non esiste
                                -- (idiomatico PG, una riga vs JOIN su pg_class/pg_namespace).
                                -- =====================================================
                                IF to_regclass(format('%I.%I', v_row.schema_tabella, v_row.nome_tabella)) IS NULL THEN
                                    PERFORM script.fn_log_and_raise_error(
                                        'database',
                                        'fn_apply_chiusura_scadenze',
                                        'E_AUTOMAZIONE_CHIUSURA_CONFIG_INVALIDA',
                                        jsonb_build_object(
                                            'config_id', v_row.id,
                                            'target',    v_target_key,
                                            'motivo',    'tabella_inesistente'
                                        ),
                                        NULL::uuid,
                                        v_target_key,
                                        'tabella inesistente'
                                    );
                                END IF;

                                -- Verifica esistenza congiunta col_stato + col_valido_al.
                                SELECT count(*)::smallint INTO v_col_count
                                  FROM pg_attribute a
                                  JOIN pg_class    c ON c.oid = a.attrelid
                                  JOIN pg_namespace n ON n.oid = c.relnamespace
                                 WHERE n.nspname = v_row.schema_tabella
                                   AND c.relname = v_row.nome_tabella
                                   AND a.attname IN (v_row.col_stato, v_row.col_valido_al)
                                   AND a.attnum > 0
                                   AND NOT a.attisdropped;

                                IF v_col_count < 2 THEN
                                    PERFORM script.fn_log_and_raise_error(
                                        'database',
                                        'fn_apply_chiusura_scadenze',
                                        'E_AUTOMAZIONE_CHIUSURA_CONFIG_INVALIDA',
                                        jsonb_build_object(
                                            'config_id',     v_row.id,
                                            'target',        v_target_key,
                                            'col_stato',     v_row.col_stato,
                                            'col_valido_al', v_row.col_valido_al,
                                            'motivo',        'colonna_mancante'
                                        ),
                                        NULL::uuid,
                                        v_target_key,
                                        format('colonne %s/%s non trovate',
                                               v_row.col_stato, v_row.col_valido_al)
                                    );
                                END IF;

                                -- =====================================================
                                -- 2) Esecuzione: dispatch su tipo_stato
                                -- =====================================================
                                IF v_row.tipo_stato = 'VARCHAR' THEN
                                    -- UPDATE diretto con valori varchar.
                                    v_sql := format(
                                        $f$
                                        UPDATE %I.%I
                                           SET %I = %L
                                         WHERE %I = %L
                                           AND %I IS NOT NULL
                                           AND %I < CURRENT_DATE
                                        $f$,
                                        v_row.schema_tabella, v_row.nome_tabella,
                                        v_row.col_stato,      v_row.stato_chiuso_codice,
                                        v_row.col_stato,      v_row.stato_attivo_codice,
                                        v_row.col_valido_al,
                                        v_row.col_valido_al
                                    );

                                    EXECUTE v_sql;
                                    GET DIAGNOSTICS v_count = ROW_COUNT;

                                ELSIF v_row.tipo_stato = 'FK' THEN
                                    -- Pre-check tabella lookup (to_regclass idiomatico).
                                    IF to_regclass(format('%I.%I', v_row.fk_lookup_schema, v_row.fk_lookup_table)) IS NULL THEN
                                        PERFORM script.fn_log_and_raise_error(
                                            'database',
                                            'fn_apply_chiusura_scadenze',
                                            'E_AUTOMAZIONE_CHIUSURA_CONFIG_INVALIDA',
                                            jsonb_build_object(
                                                'config_id',  v_row.id,
                                                'target',     v_target_key,
                                                'fk_lookup',  v_row.fk_lookup_schema || '.' || v_row.fk_lookup_table,
                                                'motivo',     'fk_lookup_inesistente'
                                            ),
                                            NULL::uuid,
                                            v_target_key,
                                            'fk_lookup inesistente'
                                        );
                                    END IF;

                                    -- Lookup combinato id_attivo + id_chiuso in 1 round-trip.
                                    -- MAX(CASE...) e' la classica idempotente "pivot": ritorna
                                    -- l'unico id matching per ciascun codice, NULL se assente.
                                    v_sql := format(
                                        'SELECT max(CASE WHEN %I = %L THEN %I END),'
                                        '       max(CASE WHEN %I = %L THEN %I END)'
                                        '  FROM %I.%I'
                                        ' WHERE %I IN (%L, %L)',
                                        v_row.fk_lookup_codice_col, v_row.stato_attivo_codice, v_row.fk_lookup_id_col,
                                        v_row.fk_lookup_codice_col, v_row.stato_chiuso_codice, v_row.fk_lookup_id_col,
                                        v_row.fk_lookup_schema, v_row.fk_lookup_table,
                                        v_row.fk_lookup_codice_col,
                                        v_row.stato_attivo_codice, v_row.stato_chiuso_codice
                                    );
                                    EXECUTE v_sql INTO v_id_attivo, v_id_chiuso;

                                    IF v_id_chiuso IS NULL THEN
                                        PERFORM script.fn_log_and_raise_error(
                                            'database',
                                            'fn_apply_chiusura_scadenze',
                                            'E_AUTOMAZIONE_CHIUSURA_CONFIG_INVALIDA',
                                            jsonb_build_object(
                                                'config_id',           v_row.id,
                                                'target',              v_target_key,
                                                'stato_chiuso_codice', v_row.stato_chiuso_codice,
                                                'motivo',              'codice_chiuso_non_trovato'
                                            ),
                                            NULL::uuid,
                                            v_target_key,
                                            'codice chiuso non trovato'
                                        );
                                    END IF;

                                    IF v_id_attivo IS NULL THEN
                                        PERFORM script.fn_log_and_raise_error(
                                            'database',
                                            'fn_apply_chiusura_scadenze',
                                            'E_AUTOMAZIONE_CHIUSURA_CONFIG_INVALIDA',
                                            jsonb_build_object(
                                                'config_id',           v_row.id,
                                                'target',              v_target_key,
                                                'stato_attivo_codice', v_row.stato_attivo_codice,
                                                'motivo',              'codice_attivo_non_trovato'
                                            ),
                                            NULL::uuid,
                                            v_target_key,
                                            'codice attivo non trovato'
                                        );
                                    END IF;

                                    -- UPDATE con id risolti.
                                    v_sql := format(
                                        $f$
                                        UPDATE %I.%I
                                           SET %I = %L
                                         WHERE %I = %L
                                           AND %I IS NOT NULL
                                           AND %I < CURRENT_DATE
                                        $f$,
                                        v_row.schema_tabella, v_row.nome_tabella,
                                        v_row.col_stato,      v_id_chiuso::text,
                                        v_row.col_stato,      v_id_attivo::text,
                                        v_row.col_valido_al,
                                        v_row.col_valido_al
                                    );

                                    EXECUTE v_sql;
                                    GET DIAGNOSTICS v_count = ROW_COUNT;
                                ELSE
                                    -- Difesa in profondita': il CHECK constraint
                                    -- esclude gia' tipi diversi, ma per chiarezza.
                                    PERFORM script.fn_log_and_raise_error(
                                        'database',
                                        'fn_apply_chiusura_scadenze',
                                        'E_AUTOMAZIONE_CHIUSURA_CONFIG_INVALIDA',
                                        jsonb_build_object(
                                            'config_id',  v_row.id,
                                            'target',     v_target_key,
                                            'tipo_stato', v_row.tipo_stato,
                                            'motivo',     'tipo_stato_non_gestito'
                                        ),
                                        NULL::uuid,
                                        v_target_key,
                                        v_row.tipo_stato
                                    );
                                    v_count := 0;
                                END IF;

                                -- =====================================================
                                -- 3) Aggregazione risultato
                                -- =====================================================
                                v_result := v_result || jsonb_build_object(v_target_key, v_count);
                                v_total  := v_total + v_count;
                            END LOOP;

                            -- Meta-info.
                            v_result := v_result
                                        || jsonb_build_object('_total', v_total)
                                        || jsonb_build_object('_executed_at', now());

                            -- =====================================================
                            -- 4) Audit log esecuzione (best-effort, non blocca)
                            -- Pattern progetto: dbops.fn_audit_log_once con parametri named.
                            -- WHEN OTHERS perche' un fallimento di audit non deve
                            -- propagarsi: il caller (job pgAgent) deve comunque
                            -- ricevere il JSONB con i conteggi.
                            -- =====================================================
                            BEGIN
                                PERFORM dbops.fn_audit_log_once(
                                    p_function_name => 'dbops.fn_apply_chiusura_scadenze',
                                    p_status        => 'INFO',
                                    p_params        => v_result
                                );
                            EXCEPTION WHEN OTHERS THEN
                                NULL;
                            END;

                            RETURN v_result;
                        END;
                        $function$;

              COMMENT ON FUNCTION dbops.fn_apply_chiusura_scadenze(text)
              IS 'Framework di chiusura per scadenza: chiude lo stato gestionale (CHIUSA/CESSATO) sulle tabelle configurate in dbops.automazione_chiusura_scadenze quando valido_al < CURRENT_DATE. ⭐ Rev 2026-09-04: prende p_classe e lavora SOLO i bersagli di quella classe. p_classe NULL = tutte, che e'' il comportamento storico — il job pgAgent chiama senza argomenti e non e'' stato toccato. ⛔ Il filtro NON e'' il cancello: il cancello e'' il NOT NULL su automazione_chiusura_scadenze.classe, che obbliga ogni riga nuova a dichiarare la propria natura. Il filtro serve quando i bersagli di DOMINIO migreranno sulla coda (lavoro di backend): da li'' il worker chiamera'' con DOMINIO e pgAgent con AMMINISTRAZIONE, e i due mondi smetteranno di mescolarsi. Brief: brief-db-processi-automatici-identita-e-perimetro §6.';
      rollback:
        - sql:
            splitStatements: false
            sql: |
              -- Si torna alla forma a zero argomenti rilanciando il changeSet
              -- che la definiva.
              DROP FUNCTION IF EXISTS dbops.fn_apply_chiusura_scadenze(text);
