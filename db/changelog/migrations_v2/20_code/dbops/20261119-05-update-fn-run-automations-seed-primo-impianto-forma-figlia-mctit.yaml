                    p_function_name => 'dbops.fn_run_automations_seed_primo_impianto',
                    p_status        => 'OK',
                    p_rule_type     => 'SEED_PRIMO_IMPIANTO',
                    p_exec_mode     => p_exec_mode,
                    p_parts         => ARRAY['SEED_PRIMO_IMPIANTO'],
                    p_dry_run       => false,
                    p_params        => jsonb_build_object(
                                        'table',          r.schema_name||'.'||r.table_name,
                                        'trigger',        r.trigger_atteso,
                                        'argomenti',      r.argomenti_attesi,
                                        'trigger_vivi',   r.trigger_vivi,
                                        'action',         r.azione,
                                        'righe_segnate',  v_segnate
                                      ),
                    p_message       => 'Seed primo impianto: '||r.azione
                  );
                END LOOP;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_run_automations_seed_primo_impianto(p_exec_mode text, p_schemas text[], p_dry_run boolean) IS
                  'Runner della regola SEED_PRIMO_IMPIANTO: porta i trigger su script.trgfn_seed_primo_impianto delle tabelle in scope allo stato che dichiara dbops.automazione_seed_primo_impianto, con il confronto di dbops.fn_seed_primo_impianto_divergenze. CREA monta il trigger (BEFORE INSERT OR UPDATE OR DELETE FOR EACH ROW, fase a00) e iscrive le righe di seed gia'' presenti in dbops.seed_righe: user_insert = ''SEED'' o un ruolo del migratore (dbops.fn_ruolo_del_migratore), segnata_da ISCRIZIONE; RIGENERA toglie i trigger vivi della funzione e rimonta l''atteso, senza ripassare dall''iscrizione; TOGLIE li toglie (riga spenta), il registro resta. NON_CLASSIFICATA e SENZA_ID non fanno DDL: WARN nell''audit, il trigger di prima resta. Un trigger della funzione su una tabella che il registro non nomina ferma il giro (E_SEED_PRIMO_IMPIANTO), come una tabella iscritta senza user_insert. Un guasto dell''ambiente esce col suo SQLSTATE. p_dry_run = true: nessuna DDL, l''azione nell''audit. Lo chiamano maintenance.proc_automations_lock_columns_job (convergenza del rilascio e giro notturno) e la rete di 90_end a ogni migrate.';
