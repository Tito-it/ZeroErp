# LO SPOSTAMENTO DELLO SCOPE NEI pgTAP ENTRA ED ESCE DAL CONTESTO COMUNE
#   dbops.fn_pgtap_sposta_scope_operatore
#   Brief: brief-db-porte-aperte-dalla-sola-guc §14 (giro 10-bis; D-AC a, D-AD b, D-AE a, D-AF a di Tid, 2026-11-26).
#
#   Regola del 2: il gesto «entra come SUPER_ADMIN di fixture, chiama il verbo,
#   rimetti il contesto» e' estratto in dbops.fn_pgtap_entra_come_super_admin e
#   dbops.fn_pgtap_rimetti_contesto (20261126-19, -20). Il builder smette di
#   ricopiarlo. Firma, risultato e comportamento invariati (20261124-05).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261126-21-update-fn-pgtap-sposta-scope-operatore-dal-contesto-comune-mctit.yaml

  - changeSet:
      id: 20261126-21-update-fn-pgtap-sposta-scope-operatore-dal-contesto-comune
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.fn_pgtap_sposta_scope_operatore: il contesto del SUPER_ADMIN di fixture dalle due fixture comuni, firma invariata. brief-db-porte-aperte-dalla-sola-guc §14.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_pgtap_sposta_scope_operatore(
                  p_auth_user_id         config.user_emittenti_fiscali.auth_user_id%TYPE,
                  p_emittente_fiscale_id config.user_emittenti_fiscali.emittente_fiscale_id%TYPE)
               RETURNS jsonb
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: in un pgTAP, portare l'operatore p_auth_user_id sull'azienda
              --   p_emittente_fiscale_id, oppure togliergli l'azienda (NULL, solo per un
              --   SUPER_ADMIN), dal verbo script.fn_change_user_emittenti_scope.
              --   Restituisce il risultato del verbo.
              -- Uso:
              --   PERFORM dbops.fn_pgtap_sposta_scope_operatore(
              --       (SELECT user_id FROM tmp_refs), (SELECT emittente_b FROM tmp_refs));
              -- ⚠️ Il verbo chiede il SUPER_ADMIN: lo fa un SUPER_ADMIN di fixture
              --   (dbops.fn_pgtap_entra_come_super_admin); il contesto di prima si rimette,
              --   anche in errore. app.current_emittente_id non si tocca.
              -- ⚠️ Le regole sono quelle del verbo. Un rifiuto arriva al test com'e'.
              DECLARE
                  v_prima jsonb;  -- il contesto di prima, dalla fixture: nessuna colonna
                  v_esito jsonb;  -- il risultato del verbo: nessuna colonna
              BEGIN
                  v_prima := dbops.fn_pgtap_entra_come_super_admin('sposta-scope');

                  BEGIN
                      v_esito := script.fn_change_user_emittenti_scope(
                                     p_auth_user_id,
                                     CASE WHEN p_emittente_fiscale_id IS NULL
                                          THEN ARRAY[]::bigint[]
                                          ELSE ARRAY[p_emittente_fiscale_id] END);
                  EXCEPTION
                      WHEN OTHERS THEN
                          PERFORM dbops.fn_pgtap_rimetti_contesto(v_prima);
                          RAISE;
                  END;

                  PERFORM dbops.fn_pgtap_rimetti_contesto(v_prima);

                  RETURN v_esito;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_pgtap_sposta_scope_operatore(p_auth_user_id integer, p_emittente_fiscale_id bigint)
              IS 'Solo per i pgTAP: porta l''operatore sull''azienda indicata dal verbo script.fn_change_user_emittenti_scope, e restituisce il suo risultato. Con NULL toglie l''azienda, e il verbo lo ammette solo per un SUPER_ADMIN (E_OPERATORE_SCOPE_GLOBALE_SOLO_SUPER_ADMIN): l''operatore senza azienda di un test si costruisce con dbops.fn_pgtap_crea_operatore_umano, che nasce senza, non si ottiene togliendogliela. Il verbo chiede il SUPER_ADMIN: lo fa un SUPER_ADMIN di fixture (dbops.fn_pgtap_entra_come_super_admin), e il contesto di prima torna com''era con dbops.fn_pgtap_rimetti_contesto, anche in errore. Le regole e i rifiuti sono quelli del verbo.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_pgtap_sposta_scope_operatore(p_auth_user_id integer, p_emittente_fiscale_id bigint)
               RETURNS jsonb
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: in un pgTAP, portare l'operatore p_auth_user_id sull'azienda
              --   p_emittente_fiscale_id, oppure togliergli l'azienda (NULL), dal verbo
              --   script.fn_change_user_emittenti_scope. Restituisce il risultato del verbo.
              -- Uso:
              --   PERFORM dbops.fn_pgtap_sposta_scope_operatore(
              --       (SELECT user_id FROM tmp_refs), (SELECT emittente_b FROM tmp_refs));
              -- ⚠️ Il verbo chiede il SUPER_ADMIN: lo fa un SUPER_ADMIN di fixture,
              --   creato a ogni chiamata, che entra nel contesto e ne esce. Il contesto di
              --   prima (app.current_user_id, app.ruolo_applicativo) si rimette, anche
              --   in errore. app.current_emittente_id non si tocca.
              -- ⚠️ Le regole sono quelle del verbo: l'ultimo SUPER_ADMIN attivo non si
              --   sposta, piu' di un'azienda no. Un rifiuto arriva al test com'e'.
              DECLARE
                  v_utente_prima config.user_emittenti_fiscali.auth_user_id%TYPE
                      := script.fn_utente_di_sessione('dbops.fn_pgtap_sposta_scope_operatore');
                  -- il valore della GUC di contesto com'era, anche vuoto
                  v_ruolo_prima  text := current_setting('app.ruolo_applicativo', true);
                  v_super_admin  config.user_emittenti_fiscali.auth_user_id%TYPE;
                  v_esito        jsonb;
              BEGIN
                  SELECT o.auth_user_id
                    INTO v_super_admin
                    FROM dbops.fn_pgtap_crea_operatore_umano('sposta-scope', true) o;

                  PERFORM set_config('app.ruolo_applicativo', 'OPERATORE', false);
                  PERFORM set_config('app.current_user_id', v_super_admin::text, false);

                  BEGIN
                      v_esito := script.fn_change_user_emittenti_scope(
                                     p_auth_user_id,
                                     CASE WHEN p_emittente_fiscale_id IS NULL
                                          THEN ARRAY[]::bigint[]
                                          ELSE ARRAY[p_emittente_fiscale_id] END);
                  EXCEPTION
                      WHEN OTHERS THEN
                          PERFORM set_config('app.current_user_id', COALESCE(v_utente_prima::text, ''), false);
                          PERFORM set_config('app.ruolo_applicativo', COALESCE(v_ruolo_prima, ''), false);
                          RAISE;
                  END;

                  PERFORM set_config('app.current_user_id', COALESCE(v_utente_prima::text, ''), false);
                  PERFORM set_config('app.ruolo_applicativo', COALESCE(v_ruolo_prima, ''), false);

                  RETURN v_esito;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_pgtap_sposta_scope_operatore(p_auth_user_id integer, p_emittente_fiscale_id bigint)
              IS 'Solo per i pgTAP: porta l''operatore sull''azienda indicata dal verbo script.fn_change_user_emittenti_scope, e restituisce il suo risultato. Con NULL toglie l''azienda, e il verbo lo ammette solo per un SUPER_ADMIN (E_OPERATORE_SCOPE_GLOBALE_SOLO_SUPER_ADMIN): l''operatore senza azienda di un test si costruisce con dbops.fn_pgtap_crea_operatore_umano, che nasce senza, non si ottiene togliendogliela. Il verbo chiede il SUPER_ADMIN: lo fa un SUPER_ADMIN di fixture (dbops.fn_pgtap_crea_operatore_umano) che entra nel contesto e ne esce; app.current_user_id e app.ruolo_applicativo tornano com''erano, anche in errore. Le regole e i rifiuti sono quelli del verbo.';
