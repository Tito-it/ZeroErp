# dbops.fn_pgtap_crea_contratto: IL CONTRATTO FIGLIO DI UN'OFFERTA
#   Brief: brief-modello-documento-vendita §4-quinquies, Q-2 (Tid, 2026-10-24:
#   «estendi i builder esistenti»).
#
# -- IL DIFETTO -----------------------------------------------------------
#   Le fixture delle dashboard facevano nascere a mano, con un INSERT, un
#   contratto con offerta_id valorizzato: un documento che in produzione non
#   nasce cosi'. vendite.fn_create_contratto non accetta l'offerta; un
#   contratto figlio di un'offerta lo fa nascere SOLO la push
#   (vendite.fn_push_offerta_a_contratto), che copia listino, indirizzi,
#   righe e utility dell'offerta e ne controlla stato e idempotenza. L'INSERT a
#   mano saltava tutto questo.
#
# -- IL PARAMETRO NUOVO (in coda, DEFAULT NULL) ---------------------------
#   * p_offerta_id: l'offerta (ACCETTATA: e' il caso del test portarla li')
#     da cui il contratto nasce, dalla push. Il cliente e' quello
#     dell'offerta: un p_billing_account_id diverso solleva, e il BA si
#     verifica col building block dbops.fn_pgtap_cliente_ba_del_mondo come
#     sempre. Il listino viene dall'offerta: per ATTIVO il builder non ne
#     costruisce un altro.
#   ⭐ ANNULLATO di un figlio: il guard dell'annullo con legami
#   (trgfn_doc_guard_annullo_con_legami) vuole la conferma. Il builder la
#   DICHIARA come fa il backend: conta i legami da vendite.fn_documento_legami
#   e li passa al verbo vendite.fn_annulla_contratto. Senza legami, come
#   prima.
#
# -- LA FIRMA: DROP + CREATE -----------------------------------------------
#   Un parametro in coda: un CREATE OR REPLACE creerebbe un overload. RETURNS
#   invariato. Chiamanti censiti il 2026-10-24: 2 pgTAP, 2 smoke
#   (smoke-group-attivita-contratto, smoke-test-rls-emittente-operatore), con
#   al piu' tre argomenti: restano validi.
#   Corpo dal catalogo vivo (2026-10-24), dichiarazione dal 20261022-12.
#   Permessi: funzione di chi migra, non SECURITY DEFINER.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261024-28-update-fn-pgtap-crea-contratto-figlio-di-offerta-mctit.yaml

  - changeSet:
      id: 20261024-28-update-fn-pgtap-crea-contratto-figlio-di-offerta
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.fn_pgtap_crea_contratto: un parametro in coda (p_offerta_id). Il contratto figlio di
        un'offerta nasce dalla push vendite.fn_push_offerta_a_contratto, sul cliente dell'offerta;
        l'annullo di un figlio dichiara i legami da vendite.fn_documento_legami. DROP + CREATE. Brief:
        brief-modello-documento-vendita (Q-2).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION IF EXISTS dbops.fn_pgtap_crea_contratto(text, config.stati_doc_contratti.codice_interno%TYPE, vendite.contratti.billing_account_id%TYPE);

              CREATE FUNCTION dbops.fn_pgtap_crea_contratto(
                   -- l'etichetta e' un frammento di testo della fixture, non
                   -- il riflesso di una colonna: tipo nudo.
                   p_etichetta            text DEFAULT 'pgTAP'::text,
                   p_stato_codice_interno config.stati_doc_contratti.codice_interno%TYPE DEFAULT 'DRAFT',
                   p_billing_account_id   vendite.contratti.billing_account_id%TYPE DEFAULT NULL,
                   p_offerta_id           vendite.contratti.offerta_id%TYPE DEFAULT NULL)
               RETURNS TABLE(
                   contratto_id                vendite.contratti.id%TYPE,
                   numero                      vendite.contratti.numero%TYPE,
                   emittente_fiscale_id        anagrafiche.emittenti_fiscali.id%TYPE,
                   emittente_soggetto_ruolo_id anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE,
                   auth_user_id                anagrafiche.identita_digitali.auth_user_id%TYPE,
                   billing_account_id          anagrafiche.billing_account.id%TYPE,
                   istanza_utility_id          anagrafiche.billing_account.istanza_utility_id%TYPE,
                   cliente_soggetto_ruolo_id   anagrafiche.billing_account.soggetto_ruolo_id%TYPE,
                   utility_id                  anagrafiche.billing_account.utility_id%TYPE,
                   stato_doc_contratto_id      vendite.contratti.stato_doc_contratto_id%TYPE)
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              -- Scopo: dare a una fixture pgTAP (o a uno smoke) un CONTRATTO del
              --   mondo in una chiamata — azienda, operatore, cliente e testata
              --   nello stato scelto — nato dalla madre di produzione.
              -- Uso:
              --   CREATE TEMP TABLE tmp_k AS
              --   SELECT * FROM dbops.fn_pgtap_crea_contratto('atto', 'ATTIVO');
              --   -- il contratto del cliente di un'altra fixture:
              --   SELECT * FROM dbops.fn_pgtap_crea_contratto(
              --              'atto', 'ATTIVO',
              --              (SELECT billing_account_id FROM tmp_commessa));
              --   -- il figlio di un'offerta ACCETTATA, poi annullato:
              --   SELECT * FROM dbops.fn_pgtap_crea_contratto(
              --              'figlio', 'ANNULLATO', NULL,
              --              (SELECT offerta_id FROM tmp_offerta));
              -- ⛔ Righe, eccezioni e scheda di fornitura NON le scrive: sono il
              --   caso del test (un figlio le eredita dall'offerta, dalla push).
              -- ⚠️ Esce con i vincoli IMMEDIATE, come ogni helper.
              -- rev 2026-10-24 (20261024-28, brief-modello-documento-vendita
              --   Q-2): p_offerta_id, il figlio nasce dalla push.
              DECLARE
                  v_ef_id     anagrafiche.emittenti_fiscali.id%TYPE;
                  v_ef_sr_id  anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE;
                  v_user_id   anagrafiche.identita_digitali.auth_user_id%TYPE;
                  v_ba_id     anagrafiche.billing_account.id%TYPE;
                  v_ist_id    anagrafiche.billing_account.istanza_utility_id%TYPE;
                  v_cli_sr_id anagrafiche.billing_account.soggetto_ruolo_id%TYPE;
                  v_utility   anagrafiche.billing_account.utility_id%TYPE;
                  v_contratto vendite.contratti.id%TYPE;
                  v_numero    vendite.contratti.numero%TYPE;
                  v_stato_id  vendite.contratti.stato_doc_contratto_id%TYPE;
                  v_listino   vendite.contratti.listino_id%TYPE;
                  v_ba_off    vendite.offerte_commerciali.billing_account_id%TYPE;
                  -- CONTEGGIO dei legami da confermare all'annullo.
                  v_legami    integer;
              BEGIN
                  -- 0. Lo stato si giudica PRIMA di costruire (D-2 di Tid):
                  --    CESSATO vuole valido_al e passa da ATTIVO con la regola
                  --    della cessazione, ed e' il caso del test.
                  IF p_stato_codice_interno IS NULL
                     OR p_stato_codice_interno NOT IN ('DRAFT', 'ATTIVO', 'ANNULLATO') THEN
                      RAISE EXCEPTION
                          'fn_pgtap_crea_contratto: stato % non costruibile dal builder (DRAFT, ATTIVO, ANNULLATO). CESSATO vuole valido_al e passa da ATTIVO: lo costruisce il test',
                          coalesce(p_stato_codice_interno::text, 'NULL');
                  END IF;

                  -- 0-bis. L'offerta: il figlio ha il cliente della madre.
                  IF p_offerta_id IS NOT NULL THEN
                      SELECT o.billing_account_id INTO v_ba_off
                        FROM vendite.offerte_commerciali o
                       WHERE o.id = p_offerta_id;
                      IF NOT FOUND THEN
                          RAISE EXCEPTION
                              'fn_pgtap_crea_contratto: nessuna offerta con id = % visibile a chi agisce',
                              p_offerta_id;
                      END IF;
                      IF p_billing_account_id IS NOT NULL
                         AND p_billing_account_id IS DISTINCT FROM v_ba_off THEN
                          RAISE EXCEPTION
                              'fn_pgtap_crea_contratto: il billing account % non e'' quello dell''offerta % (%): il figlio nasce sul cliente della madre',
                              p_billing_account_id, p_offerta_id, v_ba_off;
                      END IF;
                  END IF;

                  -- 1. Il mondo. Senza p_billing_account_id costruisce anche il
                  --    cliente; con, riusa quello e prende solo l'azienda di chi
                  --    agisce (il mondo la riusa quando un contesto c'e').
                  SELECT m.emittente_fiscale_id, m.emittente_soggetto_ruolo_id,
                         m.auth_user_id, m.billing_account_id, m.istanza_utility_id,
                         m.cliente_soggetto_ruolo_id, m.utility_id
                    INTO v_ef_id, v_ef_sr_id, v_user_id, v_ba_id, v_ist_id,
                         v_cli_sr_id, v_utility
                    FROM dbops.fn_pgtap_crea_mondo_cliente(p_etichetta) m;

                  IF COALESCE(p_billing_account_id, v_ba_off) IS NOT NULL THEN
                      -- ⚠️ Il BA chiesto (o quello dell'offerta) si VERIFICA prima
                      --   di usarlo, dal building block (rev 20261022, regola del
                      --   2): uno di un'altra azienda solleva qui, nominando
                      --   questo builder, invece che sul guard emittente/BA della
                      --   testata piu' avanti.
                      SELECT c.billing_account_id, c.istanza_utility_id,
                             c.cliente_soggetto_ruolo_id, c.utility_id
                        INTO v_ba_id, v_ist_id, v_cli_sr_id, v_utility
                        FROM dbops.fn_pgtap_cliente_ba_del_mondo(
                                 COALESCE(p_billing_account_id, v_ba_off), v_ef_sr_id,
                                 'fn_pgtap_crea_contratto') c;
                  END IF;

                  IF p_offerta_id IS NOT NULL THEN
                      -- 2-3. Il figlio nasce dalla push: listino, indirizzi,
                      --    righe e utility dall'offerta; stato e idempotenza li
                      --    giudica lei.
                      v_contratto := vendite.fn_push_offerta_a_contratto(p_offerta_id, NULL, false);

                      SELECT k.numero INTO v_numero
                        FROM vendite.contratti k
                       WHERE k.id = v_contratto;
                  ELSE
                      -- 2. Il listino, solo per ATTIVO: un contratto si attiva su un
                      --    listino con una versione attiva, o con una riga AGGIUNTA
                      --    con prezzo (trgfn_contratti_freeze_listino_versione). Le
                      --    righe sono del test; il listino del mondo e' quello di
                      --    chi agisce, per l'utility del cliente
                      --    (dbops.fn_pgtap_crea_listino). DRAFT e ANNULLATO nascono
                      --    senza: il listino lo sceglie il test.
                      IF p_stato_codice_interno = 'ATTIVO' THEN
                          SELECT l.listino_id INTO v_listino
                            FROM dbops.fn_pgtap_crea_listino(v_utility, p_etichetta) l;
                      END IF;

                      -- 3. La nascita dalla madre: numero, testata DRAFT, indirizzo
                      --    di default. L'emittente si dichiara: e' quello di chi
                      --    agisce, a cui il BA e' legato.
                      SELECT c.contratto_id, c.numero
                        INTO v_contratto, v_numero
                        -- jsonb_strip_nulls: senza listino la chiave non si
                        -- manda, e la colonna prende il suo default.
                        FROM vendite.fn_create_contratto(
                                 jsonb_strip_nulls(jsonb_build_object(
                                     'billing_account_id',   v_ba_id,
                                     'istanza_utility_id',   v_ist_id,
                                     'utility_id',           v_utility,
                                     'emittente_fiscale_id', v_ef_id,
                                     'listino_id',           v_listino,
                                     'meta', jsonb_build_object('test_scope', 'pgtap_' || p_etichetta)))) c;
                  END IF;

                  -- 4. Lo stato, per la strada dell'applicazione.
                  IF p_stato_codice_interno = 'ATTIVO' THEN
                      -- Il guard di transizione giudica: prezzi, indirizzi,
                      -- righe, contratto sovrapposto.
                      UPDATE vendite.contratti k
                         SET stato_doc_contratto_id = (SELECT s.id
                                                         FROM config.stati_doc_contratti s
                                                        WHERE s.codice_interno = 'ATTIVO')
                       WHERE k.id = v_contratto;
                  ELSIF p_stato_codice_interno = 'ANNULLATO' THEN
                      -- Il verbo. I legami (un figlio ha la sua offerta) si
                      -- dichiarano come fa chi conferma: contati dalla sede unica.
                      SELECT count(*)::integer INTO v_legami
                        FROM vendite.fn_documento_legami('CONTRATTO', v_contratto);
                      PERFORM vendite.fn_annulla_contratto(v_contratto, NULLIF(v_legami, 0));
                  END IF;

                  -- Contratto dichiarato, non fiducia nel chiamato.
                  SET CONSTRAINTS ALL IMMEDIATE;

                  SELECT k.stato_doc_contratto_id INTO v_stato_id
                    FROM vendite.contratti k
                   WHERE k.id = v_contratto;

                  RETURN QUERY
                  SELECT v_contratto, v_numero, v_ef_id, v_ef_sr_id, v_user_id,
                         v_ba_id, v_ist_id, v_cli_sr_id, v_utility, v_stato_id;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_pgtap_crea_contratto(text, config.stati_doc_contratti.codice_interno%TYPE, vendite.contratti.billing_account_id%TYPE, vendite.contratti.offerta_id%TYPE)
              IS 'Fixture pgTAP (e smoke): un CONTRATTO del mondo in una chiamata — azienda, operatore e cliente (dbops.fn_pgtap_crea_mondo_cliente) e la testata nello stato scelto — e ritorna tutte le chiavi. ⭐ Nasce dalla MADRE di produzione vendite.fn_create_contratto (numero, testata DRAFT, indirizzo di default), con l''emittente di chi agisce dichiarato. ⚠️ Terzo parametro: il billing account di un cliente gia'' costruito (per esempio quello di una commessa, perche'' un contratto citato da una riga deve essere del BA della sua commessa); viene verificato, e un BA di un''altra azienda solleva. ⭐ Quarto parametro: l''offerta da cui il contratto nasce, dalla push vendite.fn_push_offerta_a_contratto (stato ACCETTATA e idempotenza li giudica lei; listino, indirizzi, righe e utility dall''offerta), sul cliente dell''offerta: un billing account diverso solleva. Stati (D-2 di Tid, 2026-10-21): DRAFT; ATTIVO per la strada del guard di transizione (senza righe nessun motivo scatta; un secondo ATTIVO sovrapposto sullo stesso BA lo rifiuta il modello); ANNULLATO dal verbo vendite.fn_annulla_contratto, con i legami dichiarati da vendite.fn_documento_legami (il figlio ha la sua offerta). ⛔ CESSATO e ogni altro codice sollevano prima di scrivere: CESSATO vuole valido_al e passa da ATTIVO, e'' il caso del test. ⛔ NON scrive righe, eccezioni ne'' scheda di fornitura. ⚠️ Esce con i vincoli IMMEDIATE, come ogni helper. Richiesta BE R-1 del 2026-10-21 (smoke-group-attivita-contratto). Rev 2026-10-22: il billing account del terzo parametro lo verifica il building block dbops.fn_pgtap_cliente_ba_del_mondo (regola del 2, estratto alla terza copia). Rev 2026-10-24 (20261024-28, brief-modello-documento-vendita Q-2): il figlio di un''offerta, DROP + CREATE.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- ⚠️ Il rollback NON ricrea la versione precedente: va ri-applicato il
              --    20261022-12 dopo questo DROP.
              DROP FUNCTION IF EXISTS dbops.fn_pgtap_crea_contratto(text, config.stati_doc_contratti.codice_interno%TYPE, vendite.contratti.billing_account_id%TYPE, vendite.contratti.offerta_id%TYPE);
