# ------------------------------------------------------------
# IL PRESIDIO DELLE RADICI DI PROVA VEDE ANCHE I REGIMI DI PROVA
#   dbops.vw_radici_di_prova_in_produzione: un terzo ramo, tipo REGIME, per i
#   regimi di config.regimi_fiscali con meta->>'di_prova' = 'true', quando
#   l'ambiente dichiarato e' PRODUZIONE. DEVE restare vuota.
#   Brief: brief-db-fornitore-doppioni-del-soggetto §7.4, D-9 «a» (Tid 2026-11-22).
#
# -- PERCHE' --------------------------------------------------------------
#   I regimi di prova li crea dbops.fn_crea_regime_fiscale_di_prova
#   (20261121-17), che in PRODUZIONE non si apre. Restano i casi che la porta
#   non vede, gli stessi delle altre due etichette: un dump di sviluppo
#   ripristinato in produzione con l'ambiente riscritto a mano. Un dato di
#   prova ha un solo presidio, e questo e' il suo.
#
# -- LA FORMA -------------------------------------------------------
#   Corpo dal catalogo (pg_get_viewdef), i due rami esistenti invariati.
#   CREATE OR REPLACE: le colonne restano le stesse, nello stesso ordine.
#   Il segno sta in meta (NOT NULL): il codice_interno ha la forma del
#   tracciato e non lo puo' portare.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261121-18-update-vw-radici-di-prova-in-produzione-regimi-mctit.yaml

  - changeSet:
      id: 20261121-18-update-vw-radici-di-prova-in-produzione-regimi
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.vw_radici_di_prova_in_produzione vede anche i regimi fiscali di prova (meta di_prova) in un
        database dichiarato PRODUZIONE.
      preConditions:
        - onFail: HALT
        - viewExists: { schemaName: dbops, viewName: vw_radici_di_prova_in_produzione }
        - tableExists: { schemaName: config, tableName: regimi_fiscali }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW dbops.vw_radici_di_prova_in_produzione AS
              SELECT 'CREDENZIALE'::text     AS tipo,
                     c.chiave,
                     c.auth_user_id::text    AS radice_id,
                     c.data_insert
                FROM dbops.credenziali_di_prova c
               WHERE script.fn_ambiente_dichiarato() = 'PRODUZIONE'
              UNION ALL
              SELECT 'SOGGETTO'::text,
                     s.chiave,
                     s.soggetto_id::text,
                     s.data_insert
                FROM dbops.soggetti_di_prova s
               WHERE script.fn_ambiente_dichiarato() = 'PRODUZIONE'
              UNION ALL
              SELECT 'REGIME'::text,
                     r.codice_interno::text,
                     r.id::text,
                     r.data_insert
                FROM config.regimi_fiscali r
               WHERE (r.meta ->> 'di_prova') = 'true'
                 AND script.fn_ambiente_dichiarato() = 'PRODUZIONE';

              COMMENT ON VIEW dbops.vw_radici_di_prova_in_produzione IS
                  'PRESIDIO: le radici di prova (le righe di dbops.credenziali_di_prova e dbops.soggetti_di_prova, e i regimi di config.regimi_fiscali col segno meta di_prova) in un database dichiarato PRODUZIONE. DEVE restare vuota: il guard dbops.trgfn_etichette_di_prova_guard impedisce che un''etichetta nasca in PRODUZIONE, dbops.fn_crea_regime_fiscale_di_prova in PRODUZIONE non si apre, e l''ambiente non cambia; questa e'' l''ultima rete per cio'' che i guard non vedono (un dump di sviluppo ripristinato su un server di produzione con l''ambiente riscritto a mano, un trigger disattivato). Legge script.fn_ambiente_dichiarato(), che non solleva: su un''installazione non dichiarata e'' vuota. Legge dbops e config.regimi_fiscali, che nascono prima della vista: in CI non e'' rotta.';
              COMMENT ON COLUMN dbops.vw_radici_di_prova_in_produzione.tipo IS
                  'CREDENZIALE, SOGGETTO o REGIME: di quale dato di prova e'' la riga.';
              COMMENT ON COLUMN dbops.vw_radici_di_prova_in_produzione.chiave IS
                  'La chiave di prova: lo username alla nascita per una credenziale, il codice di prova per un soggetto, il codice_interno per un regime.';
              COMMENT ON COLUMN dbops.vw_radici_di_prova_in_produzione.radice_id IS
                  'L''id della radice, come testo: auth_user_id per una credenziale, soggetto_id per un soggetto, l''id del regime per un regime.';
              COMMENT ON COLUMN dbops.vw_radici_di_prova_in_produzione.data_insert IS
                  'Quando il dato di prova e'' nato.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Il verso di ritiro e' un changeSet nuovo dal corpo di 20261018-62.
              SELECT 1;
