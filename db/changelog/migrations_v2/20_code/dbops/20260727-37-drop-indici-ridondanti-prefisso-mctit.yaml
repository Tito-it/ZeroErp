# Bonifica: 48 indici btree ridondanti per PREFISSO
#   (bonifica indici del 2026-07-27, PASSO C1)
#
# COSA SONO. Btree non-unique le cui colonne chiave sono la testa di quelle di
#   un altro btree sulla stessa tabella, con identici opclass, collation,
#   ordinamento e predicato. PostgreSQL usa gia' l'indice piu' largo per ogni
#   ricerca su quelle colonne, controllo referenziale delle foreign key
#   compreso: il piu' stretto e' scrittura, spazio e manutenzione senza
#   ritorno. L'elenco esatto e' quello prodotto da
#   dbops.vw_indici_ridondanti_prefisso (changeSet 20260727-21) il 2026-07-27,
#   trascritto qui riga per riga con l'indice coprente in commento.
#
# VENTISETTE VENGONO DALL'AUTOMAZIONE, ventuno sono scritti a mano nei
#   changelog. I primi nascono dal difetto di dbops.vw_fk_senza_indice
#   corretto dal 20260727-22: la copertura era valutata per uguaglianza
#   dell'array di colonne invece che per prefisso, quindi una FK gia' servita
#   da una UNIQUE piu' larga risultava scoperta e l'automazione ci piantava
#   sopra un gemello.
#
# ⚠️ IL DROP DA SOLO NON BASTA, per quei ventisette. Le loro righe in
#   dbops.fk_index_policy hanno consentito=true, e CALL
#   dbops.apply_fk_index_policy() gira runAlways in 90_end: al PRIMO migrate
#   successivo li ricreerebbe tutti. Il changeSet 20260727-38 porta quelle
#   righe a consentito=false, e sta in 80_data cioe' PRIMA di 90_end nello
#   stesso migrate. I due changeSet vanno insieme: applicare questo senza
#   quello e' inutile.
#
# PERCHE' ANCHE IL DROP ESPLICITO, visto che consentito=false li farebbe
#   togliere comunque da apply in 90_end (decisione di Tid). Perche' il flag e'
#   un interruttore: finche' l'effetto dipende solo da lui, un true rimesso per
#   errore rifa' il danno. Qui la rimozione e' un fatto compiuto e tracciato
#   nel changelog, indipendente dal giro successivo del job. La terza difesa e'
#   il 20260727-36, che impedisce ad apply di ricreare cio' che risulta gia'
#   coperto anche a flag true.
#
# LETTURE NON NULLE, e vanno lette per quello che sono. Undici dei
#   quarantotto hanno idx_scan > 50, tre sopra i mille
#   (ix_vendite_ordini_righe_ordine_id 45.192,
#    ix_anagrafiche_soggetti_ruoli_soggetto_id 18.726,
#    ix_utilities_tipi_ruolo_utility_id 1.296). Non e' un
#   controindicazione: il planner sceglie l'indice piu' stretto quando ci sono
#   entrambi, perche' costa meno pagine, ed e' esattamente per questo che
#   quelle letture stanno li'. Tolto il piu' stretto, le stesse query passano
#   sul piu' largo. Verificato il rapporto di dimensione fra i due su tutti
#   gli undici: otto sono IDENTICI (16 kB contro 16 kB), quindi il piu' stretto
#   non porta alcun vantaggio di cache; i tre residui hanno il coprente
#   piu' grande di 1,17x, 1,75x e 2,23x, su indici da 96, 160 e 104 kB —
#   differenze irrilevanti a queste dimensioni. Se un domani una di queste
#   tabelle crescesse di ordini di grandezza, la scelta va rimisurata: il
#   caso in cui un indice stretto merita di sopravvivere accanto a uno largo
#   esiste, semplicemente qui non si presenta.
#
# ORDINE DEL FILE: prima i ventisette dell'automazione, poi i ventuno manuali,
#   ciascun gruppo per schema e tabella. Ogni DROP porta in commento origine,
#   indice coprente e letture rilevate.
#
# IF EXISTS ovunque: su un DB ricostruito da zero i ventisette non esistono
#   ancora quando questo changeSet gira (li creerebbe 90_end), e i ventuno
#   manuali potrebbero essere stati creati da un changeSet 00_schema che nel
#   frattempo e' cambiato.
#
# Dipendenze: nessuna oltre alle tabelle coinvolte.
# ------------------------------------------------------------

