# dbops.fn_pgtap_crea_emittente_operatore: l'operatore dell'azienda puo' essere
# una PERSONA (p_persona), per i test che lo fanno SUPER_ADMIN.
#
#   La fixture costruiva sempre un utente TECNICO (script.fn_crea_utente_tecnico
#   era l'unico percorso che legava un utente a un emittente), e il suo COMMENT
#   diceva di non usarla dove il soggetto e' l'operatore umano. Nove pgTAP la
#   usavano lo stesso per costruire un SUPER_ADMIN con un'azienda nel
#   perimetro: dal 20261125-64/-65 (D-G2-3) il SUPER_ADMIN su un'identita'
#   tecnica si rifiuta, e quei test si fermavano nella fixture.
#
#   Il builder si estende (non se ne scrive un secondo): p_persona in coda,
#   DEFAULT false, quindi ogni chiamante di oggi resta com'e'. Con true
#   l'operatore e' un operatore umano (dbops.fn_pgtap_crea_operatore_umano, non
#   super admin: il test lo promuove da se', ed e' spesso proprio cio' che
#   prova) legato all'azienda con script.fn_applica_user_emittenti_scope, la
#   primitiva che usa il verbo dei dati di sviluppo, e con l'azienda come
#   emittente attivo. p_processo_codice con p_persona e' ignorato.
#
#   Firma nuova: DROP della vecchia (esatta, ancorata) e CREATE (linee-guida-sql
#   §5f); RETURNS TABLE invariato. Il COMMENT si riscrive (il DROP lo porta via).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261125-71-update-fn-pgtap-crea-emittente-operatore-persona-mctit.yaml

  - changeSet:
      id: 20261125-71-update-fn-pgtap-crea-emittente-operatore-persona
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.fn_pgtap_crea_emittente_operatore: p_persona in coda; con true l'operatore dell'azienda e' una
        persona (operatore umano) invece di un utente tecnico.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc
               WHERE proname = 'fn_pgtap_crea_operatore_umano'
                 AND pronamespace = 'dbops'::regnamespace
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION IF EXISTS dbops.fn_pgtap_crea_emittente_operatore(
                  anagrafiche.emittenti_fiscali.codice%TYPE,
                  text);  -- il codice del processo: chiave del registro, testo libero

              CREATE FUNCTION dbops.fn_pgtap_crea_emittente_operatore(
                  p_sigla           anagrafiche.emittenti_fiscali.codice%TYPE DEFAULT NULL,
                  p_processo_codice text DEFAULT 'chiusura_scadenze_daily',  -- chiave del registro dei processi, testo libero
                  p_persona         boolean DEFAULT false                      -- un interruttore del chiamante
              )
               RETURNS TABLE (
                  emittente_fiscale_id anagrafiche.emittenti_fiscali.id%TYPE,
                  emittente_codice     anagrafiche.emittenti_fiscali.codice%TYPE,
                  soggetto_ruolo_id    anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE,
                  auth_user_id         anagrafiche.identita_digitali.auth_user_id%TYPE,
                  identita_id          anagrafiche.identita_digitali.id%TYPE
               )
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_ef          record;
                  v_auth_user   anagrafiche.identita_digitali.auth_user_id%TYPE;
                  v_identita_id anagrafiche.identita_digitali.id%TYPE;
              BEGIN
                  SELECT * INTO v_ef FROM dbops.fn_pgtap_crea_emittente(p_sigla);

                  IF p_persona THEN
                      -- Una persona: l'operatore umano dal percorso di
                      -- produzione, poi l'azienda nel suo perimetro.
                      SELECT ou.auth_user_id, ou.identita_id
                        INTO v_auth_user, v_identita_id
                        FROM dbops.fn_pgtap_crea_operatore_umano(
                                 'pgTAP-' || v_ef.emittente_codice, false) ou;
                      PERFORM script.fn_applica_user_emittenti_scope(
                                  v_auth_user, ARRAY[v_ef.emittente_fiscale_id]);
                      PERFORM config.fn_imposta_emittente_attivo(
                                  v_auth_user, v_ef.emittente_fiscale_id);
                  ELSE
                      SET CONSTRAINTS ALL DEFERRED;

                      v_auth_user := script.fn_crea_utente_tecnico(
                                         p_processo_codice  := p_processo_codice,
                                         p_emittente_codice := v_ef.emittente_codice);

                      SET CONSTRAINTS ALL IMMEDIATE;

                      SELECT idg.id
                        INTO v_identita_id
                        FROM anagrafiche.identita_digitali idg
                       WHERE idg.auth_user_id = v_auth_user
                         AND idg.attivo;
                  END IF;

                  IF v_identita_id IS NULL THEN
                      RAISE EXCEPTION
                          'fn_pgtap_crea_emittente_operatore: nessuna identita'' attiva per auth_user_id=%',
                          v_auth_user;
                  END IF;

                  RETURN QUERY
                  SELECT v_ef.emittente_fiscale_id, v_ef.emittente_codice,
                         v_ef.soggetto_ruolo_id, v_auth_user, v_identita_id;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_pgtap_crea_emittente_operatore(
                  anagrafiche.emittenti_fiscali.codice%TYPE, text, boolean) IS
                  'Helper di fixture pgTAP: un''azienda su cui lavorare PIU'' l''operatore che la ha nel perimetro. Senza operatore il contesto di sessione resta vuoto e il dominio solleva «Nessun emittente fiscale attivo». Di default l''operatore e'' un utente TECNICO (script.fn_crea_utente_tecnico, col processo p_processo_codice): per cio'' che i test attraversano e'' un operatore a tutti gli effetti (identita'' OPERATORE attiva, non super admin, un emittente nel perimetro). Con p_persona l''operatore e'' una PERSONA (dbops.fn_pgtap_crea_operatore_umano, non super admin), legata all''azienda con script.fn_applica_user_emittenti_scope e con l''azienda come emittente attivo: serve dove il test fa dell''operatore un SUPER_ADMIN o gli lega un profilo, perche'' un''identita'' tecnica non ha mai il SUPER_ADMIN. Il chiamante deve poi puntarci il contesto: PERFORM script.fn_pgtap_set_contesto_operatore(auth_user_id). ⚠️ Esce con i vincoli IMMEDIATE, come ogni helper.';
      rollback:
        - sql:
            splitStatements: false
            sql: |
              SELECT 1;  -- forward-only: la versione precedente e' il 20260909-26
