# Bonifica riferimenti morti — F2, famiglia stradario/contatti
#   Brief: docs/it/dev/work-done/brief-db-bonifica-riferimenti-morti.md
#
#   `config.codici_postali.codice_postale` non esiste: e' `codice` dal
#   **2025-08-17** (`20250817-24-codici_postali-rename-codice_postale-to-codice`).
#   Stessa rinomina non propagata di `script.fn_get_stradario`
#   (`20260804-38`): sono due funzioni della stessa catena, rotte lo stesso
#   giorno dallo stesso `renameColumn`, e nessuna delle due ha protestato
#   per undici mesi.
#
#   ⚠️ Ordine: questa funzione chiama `script.fn_get_stradario` e legge
#   `rec.cod_postale`, che il changeSet -38 porta da `character` a `text`.
#   Il confronto `codice = rec.cod_postale` regge in entrambi i casi
#   (varchar vs text), ma i due changeSet vanno applicati nello stesso
#   migrate: -38 prima, questo dopo, come impone la numerazione.
#
#   Nessun consumatore nel repo (BE, FE, pgTAP, altre funzioni): e' una
#   utility di normalizzazione indirizzi mai messa in servizio. Si ripara
#   invece di droppare perche' e' un difetto di una riga su logica
#   completa, e la catena `fn_get_stradario` -> normalizzazione non ha
#   rimpiazzi.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20260804-58-fix-fn-normalize-indirizzo-colonna-mctit.yaml

  - changeSet:
      id: 20260804-58-fix-fn-normalize-indirizzo-colonna
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        F2 — dbops.fn_normalize_indirizzo: config.codici_postali.codice_postale
        non esiste dal 2025-08-17 (ora codice). Stessa rinomina non propagata di
        script.fn_get_stradario (20260804-38).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_normalize_indirizzo(p_comune_id integer, p_indirizzo_libero text)
               RETURNS TABLE(indirizzo_dettaglio_id integer, via_norm text, civico_norm text, codice_postale_id integer, geoloc geometry)
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  rec RECORD;
              BEGIN

              -- Usage Example:
              -- SELECT * FROM dbops.fn_normalize_indirizzo(123, 'Via Roma 10');
              -- Attenzione questa è una base perchè lastringa indirizzo sarà più 
              -- complessa e successivamente dovrà prevedere più eccezioni.
              -- esemmpi 'Via Roma 10/e batt.4 int.7 piano 4 ecc.'
                  SELECT * INTO rec
                  FROM script.fn_get_stradario(p_comune_id, p_indirizzo_libero)
                  LIMIT 1;

                  IF FOUND THEN
                      indirizzo_dettaglio_id := rec.stradario_id;
                      via_norm := UPPER(TRIM(rec.descrizione_completa));
                      civico_norm := '';

                      -- rev 2026-08-04 (bonifica riferimenti morti, F2): la colonna e'
                      --   `codice` dal 2025-08-17 (20250817-24), non `codice_postale`.
                      SELECT id INTO codice_postale_id
                      FROM config.codici_postali
                      WHERE codice = rec.cod_postale
                        AND comune_id = p_comune_id
                      LIMIT 1;

                      geoloc := rec.geoloc;
                  ELSE
                      indirizzo_dettaglio_id := NULL;
                      via_norm := NULL;
                      civico_norm := NULL;
                      codice_postale_id := NULL;
                      geoloc := NULL;
                  END IF;

                  RETURN NEXT;
              END;
              $function$
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              SELECT 1;
