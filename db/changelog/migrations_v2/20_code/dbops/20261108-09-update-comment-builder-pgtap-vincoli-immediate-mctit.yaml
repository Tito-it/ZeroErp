# QUATTRO BUILDER PGTAP DICHIARANO CHE ESCONO COI VINCOLI IMMEDIATE
#   Brief: brief-db-sorgente-documento-e-riga §8.11 «Gli smoke» (richiesta del team
#   BE, risposta del team DB, via di Tid del 2026-11-07).
#
# ── PERCHE' ─────────────────────────────────────────────────────────
#   I builder dbops.fn_pgtap_* chiudono la propria unita' di lavoro con
#   SET CONSTRAINTS ALL IMMEDIATE, e l'impostazione resta per il resto della
#   transazione: chi poi esegue un verbo vero (uno smoke) e vuole la finestra
#   differita la riapre. E' il contratto della guida pgTAP («gli helper escono
#   con i vincoli IMMEDIATE»), e 21 builder lo dicono nel COMMENT; questi quattro
#   lo fanno senza dirlo. Lo smoke del backend che li chiama lo deve sapere dal
#   catalogo, non dal corpo.
#
# ── CHE COSA CAMBIA ─────────────────────────────────────────────────
#   Solo i COMMENT: il testo vivo (uguale su dbdev e scratch, 2026-11-07) con la
#   frase degli altri builder in coda. Nessun corpo, nessuna firma. Lo presidia
#   dbops/test-builder-pgtap-vincoli-immediate-v1: ogni funzione dbops.fn_pgtap_*
#   che chiude i vincoli lo dichiara.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261108-09-update-comment-builder-pgtap-vincoli-immediate-mctit.yaml

  - changeSet:
      id: 20261108-09-update-comment-builder-pgtap-vincoli-immediate
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Quattro builder pgTAP (cliente_ba, emittente_operatore, soggetto_ruolo, porta_a_stato) dichiarano nel COMMENT
        che escono coi vincoli IMMEDIATE, come gli altri. brief-db-sorgente-documento-e-riga §8.11.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION dbops.fn_pgtap_crea_cliente_ba(text, integer, bigint) IS
                'Fixture pgTAP: crea la catena minima di un cliente fatturabile (soggetto -> ruolo CL -> istanza utility -> billing account). Rev 20261018-37: istanza, BA e legame li scrive il BB anagrafiche.fn_crea_billing_account (regola del 2, brief-db-processi-accensione-per-ambiente 2b-1 lotto 5); il builder sceglie il codice libero PGTAPBAnnnnn (dalle istanze, fuori dalla RLS) per istanza e BA, la prima categoria cliente e la prima valuta, e apre e richiude la finestra dei vincoli differiti. Il terzo parametro, opzionale, e'' il soggetto_ruolo dell''EMITTENTE a cui legare il billing account: serve alle testate con billing_account_id NOT NULL (contratti, offerte_commerciali), il cui guard confronta l''emittente del documento con anagrafiche.fn_get_emittente_fiscale_pk(ba); senza legame quella funzione ricade sull''emittente di DEFAULT. Usabile anche come zeroerp_app CON un operatore in sessione: il BB rilegge il BA a istruzione finita, e il legame lo scrive il trigger z90 verso l''emittente di chi agisce; un terzo parametro discorde e'' E_SCRIPT_CHIAMATA_NON_VALIDA (costruire il cliente PRIMA di aprire il contesto, o non passarlo). ⚠️ Esce con i vincoli IMMEDIATE, come ogni helper.';

              COMMENT ON FUNCTION dbops.fn_pgtap_crea_emittente_operatore(character varying, text) IS
                'Helper di fixture pgTAP: un''azienda su cui lavorare PIU'' l''operatore che la ha nel perimetro. Senza operatore il contesto di sessione resta vuoto e il dominio solleva «Nessun emittente fiscale attivo» — misurato il 2026-09-09 su 102 dei 185 file di vendite che sul database scratch morivano nel fixture. ⚠️ L''operatore e'' un utente TECNICO, perche'' script.fn_crea_utente_tecnico e'' l''unico percorso di produzione che lega un utente a un emittente; per cio'' che i test attraversano e'' un operatore a tutti gli effetti (identita'' OPERATORE attiva, non super admin, un emittente nel perimetro). ⛔ Non usarlo dove il soggetto del test e'' l''operatore UMANO — flag tecnica, profili di accesso: li'' il caso va costruito. Il chiamante deve poi puntarci il contesto: PERFORM script.fn_pgtap_set_contesto_operatore(auth_user_id). ⚠️ Esce con i vincoli IMMEDIATE, come ogni helper.';

              COMMENT ON FUNCTION dbops.fn_pgtap_crea_soggetto_ruolo(anagrafiche.soggetti.id%TYPE, config.tipi_ruoli.codice_interno%TYPE, integer) IS
                'Assegna a un soggetto un ruolo gia'' completo dei suoi indirizzi OBBLIGATORI, letti da config.tipi_ruolo_tipi_indirizzo. ⚠️ Gli indirizzi di RUOLO sono un layer separato da quelli di SOGGETTO: hanno una matrice propria e un guard proprio, e un indirizzo di soggetto non soddisfa il guard del ruolo — il suo fallback porta a un altro TIPO, non all''altro LAYER. Come la sorella, apre e RICHIUDE la finestra dei vincoli differiti. Idempotente sugli indirizzi: il ruolo puo'' gia'' esistere (fn_get_or_create_soggetto_ruolo) e non si duplica cio'' che ha gia''. Ritorna il soggetto_ruolo_id. Brief: brief-db-bonifica-baseline-pgtap-vendite.md Rev 2026-10-17: gli indirizzi li scrive il verbo anagrafiche.fn_crea_indirizzi_ruolo (auto-clone dei tipi obbligatori, skip dei presenti; regola del 2, brief-db-processi-accensione-per-ambiente 2b-1 lotto 2). Firma e ritorno invariati. Rev 2026-10-18: l''indirizzo libero nella forma che il guard pretende per lo stato (dbops.fn_pgtap_indirizzo_libero_forma: comune e CAP del catalogo, oppure localita''); prima Roma/00100/RM nella forma estera anche per l''Italia. ⚠️ Esce con i vincoli IMMEDIATE, come ogni helper.';

              COMMENT ON FUNCTION dbops.fn_pgtap_porta_a_stato(regclass, bigint, text) IS
                'Fixture pgTAP: porta una testata di vendita dallo stato corrente allo stato p_stato (codice_interno) per il percorso piu'' corto della sua matrice dei passaggi, sotto i guard veri: le condizioni d''uscita dalla bozza (righe, indirizzi, prezzi…) le scrive prima il test. La mappa delle testate (colonna di stato, vocabolario, matrice, filtro della fattura e del lotto) la legge da script.fn_doc_stato_modello. Testate senza la porta: un UPDATE per passo, tutti i passaggi della matrice (la fattura i soli solo_lotto = false, il lotto VUOTO i soli solo_fattura = false; un lotto con fatture si muove col verbo vendite.fn_sync_lotto_fatture_stato). Testate con la porta (script.trgfn_doc_stato_solo_dal_verbo montato, letto dal catalogo): ogni passo e'' il verbo del documento — bolla vendite.fn_cambia_stato_ddt, preventivo vendite.fn_cambia_stato_preventivo, reso vendite.fn_conferma_reso / vendite.fn_annulla_reso — sui soli passaggi manuali (quelli di processo li scrive il verbo che ne e'' la causa), e l''azione del passaggio (script.fn_doc_passaggio) viene CONCESSA all''utente del contesto con dbops.fn_pgtap_concedi_azione: la fixture porta lo stato, non prova il permesso. Restituisce il codice_interno dello stato raggiunto. Un documento nasce solo nello stato iniziale (script.trgfn_doc_stato_iniziale): una fixture che vuole un documento avanti lo crea e lo porta avanti da qui. Errori del chiamante (testata non gestita, id, stato o percorso inesistenti, porta senza verbo noto): RAISE EXCEPTION. rev 2026-10-24: tutte le testate (brief-modello-documento-vendita N-1); 20261024-30: il lotto di fatturazione (R-4); 20261025-19: la mappa comune e i verbi sotto la porta (§7). 20261025-48: il preventivo sotto la porta col suo verbo; lo stato voluto da script.fn_doc_stato_id (§8). 20261025-82: l''ordine sotto la porta col suo verbo (vendite.fn_cambia_stato_ordine); EVASO e PARZIALMENTE_EVASO sono di processo e non si raggiungono da qui: si costruiscono evadendo (dbops.fn_pgtap_crea_ddt_da_ordine) (§9). rev 2026-10-26 (20261026-12, brief-modello-documento-vendita §11): il contratto ha la porta, ogni passo e'' il suo verbo (vendite.fn_cambia_stato_contratto); CESSATO vuole valido_al arrivata, che scrive il test. rev 2026-10-26 (20261026-28, brief-modello-documento-vendita §13): l''offerta ha la porta, ogni passo e'' il suo verbo (vendite.fn_cambia_stato_offerta), con una motivazione della fixture dove la riga del passaggio la chiede (rifiuto, annulli). SUPERATA e'' di processo: si costruisce creando una revisione; l''annullo con legami passa da vendite.fn_annulla_offerta. rev 2026-10-26 (20261026-36, brief-modello-documento-vendita §14): la commessa ha la porta, ogni passo e'' il suo verbo (vendite.fn_cambia_stato_commessa, firma senza p_user). rev 2026-10-27 (20261027-20, brief-modello-documento-vendita §15): fattura e lotto hanno la porta; per loro il percorso comprende anche i passaggi di processo, e ogni passo e'' un verbo: il lotto vendite.fn_cambia_stato_lotto sui passaggi manuali (con l''azione concessa all''utente del contesto) e vendite.fn_lotto_proietta_stato_step sugli altri, la fattura vendite.fn_fattura_proietta_stato. Un lotto con fatture si muove col giro (le fatture con vendite.fn_sync_lotto_fatture_stato). Rev 2026-10-28 (20261028-24, brief-modello-documento-vendita §16): la versione di listino ha la porta; ATTIVA da vendite.fn_attiva_versione_listino, CHIUSA (di processo, con valido_al passata scritta dal test) da vendite.fn_chiudi_versioni_listino_scadute. ⚠️ Esce con i vincoli IMMEDIATE, come ogni helper.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- I COMMENT di prima tornano rieseguendo gli ultimi changeSet di ciascun builder.
              SELECT 1;
