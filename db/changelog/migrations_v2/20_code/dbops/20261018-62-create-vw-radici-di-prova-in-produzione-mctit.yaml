# ------------------------------------------------------------
# PRESIDIO: RADICI DI PROVA IN UN DATABASE DI PRODUZIONE
#   dbops.vw_radici_di_prova_in_produzione: le righe delle due etichette di
#   prova quando l'ambiente dichiarato e' PRODUZIONE. DEVE restare vuota.
#   Brief: brief-db-processi-accensione-per-ambiente, R-4 (2b-3).
#
# -- PERCHE', SE IL GUARD LE IMPEDISCE --------------------------------
#   E' l'ultima rete, per cio' che i guard non vedono: un dump di sviluppo
#   ripristinato su un server di produzione con l'ambiente riscritto a mano,
#   o un trigger disattivato. Impedire prima, e guardare lo stesso.
#
# -- LA FORMA -------------------------------------------------------
#   Legge script.fn_ambiente_dichiarato(), che non solleva: su
#   un'installazione non dichiarata e' vuota (lo dice
#   vw_ambiente_non_dichiarato, una volta). Legge solo le tabelle di dbops:
#   in CI, dove lo schema django nasce dopo, non e' rotta.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261018-62-create-vw-radici-di-prova-in-produzione-mctit.yaml

  - changeSet:
      id: 20261018-62-create-vw-radici-di-prova-in-produzione
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Crea il presidio dbops.vw_radici_di_prova_in_produzione: le etichette di prova in un database
        dichiarato PRODUZIONE. Brief: brief-db-processi-accensione-per-ambiente (R-4).
      preConditions:
        - onFail: HALT
        - tableExists: { schemaName: dbops, tableName: credenziali_di_prova }
        - tableExists: { schemaName: dbops, tableName: soggetti_di_prova }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE VIEW dbops.vw_radici_di_prova_in_produzione AS
              SELECT 'CREDENZIALE'::text     AS tipo,
                     c.chiave,
                     c.auth_user_id::text    AS radice_id,
                     c.data_insert
                FROM dbops.credenziali_di_prova c
               WHERE script.fn_ambiente_dichiarato() = 'PRODUZIONE'
              UNION ALL
              SELECT 'SOGGETTO'::text,
                     s.chiave,
                     s.soggetto_id::text,
                     s.data_insert
                FROM dbops.soggetti_di_prova s
               WHERE script.fn_ambiente_dichiarato() = 'PRODUZIONE';

              COMMENT ON VIEW dbops.vw_radici_di_prova_in_produzione IS
                  'PRESIDIO: le radici di prova (le righe di dbops.credenziali_di_prova e dbops.soggetti_di_prova) in un database dichiarato PRODUZIONE. DEVE restare vuota: il guard dbops.trgfn_etichette_di_prova_guard impedisce che un''etichetta nasca in PRODUZIONE e l''ambiente non cambia; questa e'' l''ultima rete per cio'' che i guard non vedono (un dump di sviluppo ripristinato su un server di produzione con l''ambiente riscritto a mano, un trigger disattivato). Legge script.fn_ambiente_dichiarato(), che non solleva: su un''installazione non dichiarata e'' vuota. Legge solo dbops: in CI non e'' rotta. Brief: brief-db-processi-accensione-per-ambiente (R-4).';
              COMMENT ON COLUMN dbops.vw_radici_di_prova_in_produzione.tipo IS
                  'CREDENZIALE o SOGGETTO: di quale etichetta e'' la riga.';
              COMMENT ON COLUMN dbops.vw_radici_di_prova_in_produzione.chiave IS
                  'La chiave di prova: lo username alla nascita per una credenziale, il codice di prova per un soggetto.';
              COMMENT ON COLUMN dbops.vw_radici_di_prova_in_produzione.radice_id IS
                  'L''id della radice, come testo: auth_user_id per una credenziale, soggetto_id per un soggetto.';
              COMMENT ON COLUMN dbops.vw_radici_di_prova_in_produzione.data_insert IS
                  'Quando l''etichetta e'' nata.';
      rollback:
        - sql:
            dbms: postgresql
            sql: DROP VIEW IF EXISTS dbops.vw_radici_di_prova_in_produzione;
