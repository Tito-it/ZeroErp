# LA RISALITA FUNZIONE -> CHECK -> CODICI NON PAGA PIU' IL JIT
#   dbops.vw_funzioni_check_codici
#   Nasce dai pgTAP lenti script/test-rubinetto-primo-motivo-v1 e
#   script/test-catalogo-messaggi-errore-completo (2026-10-10).
#
# ── IL DIFETTO ──────────────────────────────────────────────────────
#   La CTE `funzioni` prende TUTTI i corpi plpgsql, e sopra ci sono funzioni
#   di sistema a cardinalita' fissa (regexp_split_to_table 1000 righe,
#   regexp_matches 10) e due ricorsioni che il pianificatore moltiplica per
#   dieci: la stima di codici_rec arriva a ~304 milioni. Sopra 100.000
#   (jit_above_cost) PostgreSQL compila la query col JIT, con inlining e
#   ottimizzazione sopra 500.000. Misurato su dbdev il 2026-10-10, come app:
#   1.300 ms, di cui 1.120 di compilazione JIT (221 funzioni) per ~110 ms di
#   esecuzione vera. Lo pagano tutti i lettori: vw_punti_primo_motivo,
#   vw_punti_canale_campo e i loro pgTAP.
#   E' la stessa malattia di 20261008-21 (stima falsa -> JIT), con un'altra
#   origine: li' era una cardinalita' della funzione da DICHIARARE (ROWS 1),
#   qui e' un insieme di partenza piu' largo di quello che la vista usa.
#
# ── LA CURA, SUL MODELLO ────────────────────────────────────────────
#   `funzioni` tiene solo i corpi che contengono `fn_check_`. Un legame nasce
#   da una chiamata `schema.fn_check_…(` nel sorgente senza commenti; in
#   PostgreSQL un commento SEPARA due token, non li unisce, quindi il nome
#   della check sta per intero nel corpo, e la sottostringa c'e'. Un corpo
#   che non la contiene non puo' dare legami: il filtro non toglie nessuna
#   riga, restringe l'insieme su cui il pianificatore stima.
#   ⚠️ La chiusura `check_nomi` legge pg_proc per NOME e non passa da
#   `funzioni`: una check LANGUAGE sql delegata entra come prima.
#
# ── ⛔ PERCHE' NON SPEGNERE IL JIT ───────────────────────────────────
#   Come in 20261008-21: SET jit = off nel pgTAP (o per ruolo) nasconde il
#   sintomo in un solo posto e lascia falsa la stima, che governa anche i
#   join. E i lettori sono tre.
#
# ── PROVA (2026-10-10) ─────────────────────────────────────────────
#   Copia della vista con il filtro, come app su dbdev: costo stimato da
#   ~304 milioni a ~8.800 (sotto jit_above_cost), 1.300 -> ~82 ms; righe
#   IDENTICHE nei due versi (EXCEPT ALL a zero, 502 righe).
#
# ── ⛔ IL FILTRO E' UNA PROPRIETA' INVISIBILE ─────────────────────────
#   Come ROWS e security_invoker: un REPLACE che lo perde non cambia nessun
#   risultato e torna lento in silenzio. Lo presidia
#   db/pgtap/dbops/test-vw-funzioni-check-codici-sotto-jit-v1.sql (costo
#   stimato della vista e dei due lettori sotto la soglia del JIT).
#
# ── LE COLONNE NON CAMBIANO ──────────────────────────────────────
#   Stesse nove, stesso ordine: CREATE OR REPLACE basta, e i due lettori
#   (vw_punti_primo_motivo, vw_punti_canale_campo) restano come sono.
#   security_invoker ripetuto (si azzera a ogni REPLACE). COMMENT riscritto
#   con la riga della revisione, GRANT conservato dal REPLACE.
#
# Corpo di partenza: doc auto-generata (docs/it/dbzero/dbops/views/
#   vw_funzioni_check_codici.md), revisione 20260924-08. Cambia SOLO la
#   WHERE della CTE `funzioni` (piu' il COMMENT).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261010-43-update-vw-funzioni-check-codici-prefiltro-jit-mctit.yaml

  - changeSet:
      id: 20261010-43-update-vw-funzioni-check-codici-prefiltro-jit
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        dbops.vw_funzioni_check_codici: la CTE funzioni tiene solo i corpi che contengono
        fn_check_ (un corpo senza non puo' dare legami). Risultato identico; la stima scende da
        ~304 milioni a ~8.800 e la vista non paga piu' ~1,1 s di compilazione JIT.
        Colonne invariate: i due lettori restano come sono.
      preConditions:
        - onFail: HALT
        - viewExists:
            schemaName: dbops
            viewName: vw_funzioni_check_codici
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW dbops.vw_funzioni_check_codici
              WITH (security_invoker=true) AS
              WITH RECURSIVE funzioni AS MATERIALIZED (
                  -- Ogni funzione plpgsql viva, sorgente SENZA commenti di
                  -- riga e di blocco: una check nominata nella prosa non e'
                  -- un legame.
                  SELECT p.oid,
                         n.nspname::text AS sch,
                         p.proname::text AS fn,
                         n.nspname::text || '.' || p.proname::text AS funzione,
                         regexp_replace(regexp_replace(p.prosrc, '/\*.*?\*/', '', 'g'),
                                        '--[^\n]*', '', 'g') AS sorgente
                    FROM pg_proc p
                    JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname <> ALL (ARRAY['pg_catalog'::name, 'information_schema'::name])
                     AND p.prolang = (SELECT pg_language.oid FROM pg_language
                                       WHERE pg_language.lanname = 'plpgsql')
                     -- ⭐ rev 2026-10-10 (20261010-43): solo i corpi che
                     --   contengono `fn_check_`. Un legame nasce da una
                     --   chiamata `schema.fn_check_…(`, e il nome di una
                     --   funzione e' un token: un commento lo SEPARA, non lo
                     --   compone. Quindi un corpo senza la sottostringa non
                     --   da' legami, e togliere i commenti toglie testo, non
                     --   ne aggiunge. Risultato identico; la stima del
                     --   pianificatore crolla e il JIT non scatta piu'.
                     AND p.prosrc LIKE '%fn\_check\_%'
              ), legami AS (
                  SELECT DISTINCT f.oid, f.sch, f.fn, f.funzione,
                         m.m[1] AS csch,
                         m.m[2] AS cfn
                    FROM funzioni f
                    CROSS JOIN LATERAL regexp_matches(f.sorgente, '(\w+)\.(fn_check_\w+)\s*\(', 'g') m(m)
              ), check_nomi (csch, cfn) AS (
                  -- ⭐ CHIUSURA: le check nominate dalle funzioni, e quelle
                  --   nominate nel corpo di un'altra check (a qualunque
                  --   profondita'). UNION, non UNION ALL: un ciclo di deleghe
                  --   non fa girare la ricorsione all'infinito.
                  SELECT l.csch, l.cfn FROM legami l
                  UNION
                  SELECT d.m[1], d.m[2]
                    FROM check_nomi cn
                    JOIN pg_namespace ns ON ns.nspname = cn.csch
                    JOIN pg_proc p ON p.proname = cn.cfn AND p.pronamespace = ns.oid
                    CROSS JOIN LATERAL regexp_matches(
                        regexp_replace(regexp_replace(p.prosrc, '/\*.*?\*/', '', 'g'), '--[^\n]*', '', 'g'),
                        '(\w+)\.(fn_check_\w+)\s*\(', 'g') d(m)
              ), checks AS MATERIALIZED (
                  SELECT DISTINCT c.oid AS check_oid,
                         cn.csch,
                         cn.cfn,
                         (c.prosrc ~ '''valori''') AS emette_valori,
                         regexp_replace(regexp_replace(c.prosrc, '/\*.*?\*/', '', 'g'),
                                        '--[^\n]*', '', 'g') AS csrc
                    FROM check_nomi cn
                    JOIN pg_namespace ns ON ns.nspname = cn.csch
                    JOIN pg_proc c ON c.proname = cn.cfn AND c.pronamespace = ns.oid
              ), deleghe AS (
                  -- ⭐ DELEGA, non semplice chiamata. Una check DELEGA a
                  --   un'altra quando ne RESTITUISCE i motivi:
                  --     v_motivi := v_motivi || x.fn_check_…(…)   (li accoda)
                  --     v_m := x.fn_check_…(…)                    (li prende per rilanciarli)
                  --     jsonb_agg(…) … jsonb_array_elements(x.fn_check_…(…)) … WHERE …
                  --                                               (li filtra)
                  --   ⛔ Una check che la CONSUMA — count(*), EXISTS,
                  --   jsonb_array_length, un IF — emette un motivo SUO (gia'
                  --   in motivi_propri) e non eredita niente: e' il caso di
                  --   fn_check_preventivo_annullabile, che CONTA i motivi di
                  --   fn_check_sorgente_chiudibile.
                  --   `resto` = l'istruzione dalla chiamata al primo `;`: il
                  --   filtro si cerca li', non in tutto il corpo.
                  SELECT DISTINCT c.check_oid, d.check_oid AS delegata_oid, x.resto
                    FROM checks c
                    CROSS JOIN LATERAL (
                        SELECT m.m[1] AS dsch, m.m[2] AS dfn, m.m[3] AS resto
                          FROM regexp_matches(c.csrc,
                                 '(?:\|\||:=)\s*(\w+)\.(fn_check_\w+)\s*\(([^;]*)', 'g') m(m)
                        UNION ALL
                        SELECT m.m[1], m.m[2], m.m[3]
                          FROM regexp_matches(c.csrc,
                                 'jsonb_agg\s*\([^;]*?jsonb_array_elements\s*\(\s*(\w+)\.(fn_check_\w+)\s*\(([^;]*)', 'g') m(m)
                    ) x
                    JOIN checks d ON d.csch = x.dsch AND d.cfn = x.dfn
                   WHERE d.check_oid <> c.check_oid
              ), filtri AS (
                  -- ⭐ I letterali con cui la delega confronta il codice, nella
                  --   SUA istruzione: `->> 'codice' = 'E_X'` o `IN ('E_X', …)`.
                  --   ⚠️ `<>` / NOT IN non sono riconosciuti: senza filtro si
                  --   eredita tutto (un legame in piu', mai un ramo cieco).
                  SELECT DISTINCT dl.check_oid, dl.delegata_oid, l.m[1] AS codice
                    FROM deleghe dl
                    CROSS JOIN LATERAL regexp_matches(
                        dl.resto,
                        '->>\s*''codice''\s*(?:=\s*''E_[A-Z0-9_]+''|IN\s*\([^)]*\))', 'g') f(m)
                    CROSS JOIN LATERAL regexp_matches(f.m[1], '''(E_[A-Z0-9_]+)''', 'g') l(m)
              ), motivi AS (
                  -- Il sorgente si SPEZZA sulle occorrenze di `'codice',`: ogni
                  -- pezzo e' un motivo, tagliato al primo `;` (la finestra).
                  SELECT c.check_oid,
                         (regexp_match(s.pz, '^''(E_[A-Z0-9_]+)'''))[1] AS codice,
                         split_part(s.pz, ';', 1) AS finestra
                    FROM checks c
                    CROSS JOIN LATERAL regexp_split_to_table(c.csrc, '''codice''\s*,\s*')
                         WITH ORDINALITY s(pz, k)
                   WHERE s.k > 1
              ), motivi_propri AS (
                  SELECT m.check_oid,
                         m.codice,
                         count(*)::integer AS n_motivi,
                         CASE
                             WHEN bool_and(m.finestra ~ '''campo''\s*,') THEN 'campo'
                             WHEN bool_and(m.finestra ~ '''(campo|parametro)''\s*,') THEN 'parametro'
                             ELSE NULL
                         END AS motivo_chiave
                    FROM motivi m
                   WHERE m.codice IS NOT NULL
                   GROUP BY m.check_oid, m.codice
              ), codici_rec (check_oid, codice, n_motivi, motivo_chiave) AS (
                  -- I motivi propri, poi quelli ereditati risalendo le deleghe.
                  -- Il filtro vale per la check che delega: se ne ha uno,
                  -- passano solo i codici che nomina.
                  SELECT mp.check_oid, mp.codice, mp.n_motivi, mp.motivo_chiave
                    FROM motivi_propri mp
                  UNION
                  SELECT dl.check_oid, cr.codice, cr.n_motivi, cr.motivo_chiave
                    FROM deleghe dl
                    JOIN codici_rec cr ON cr.check_oid = dl.delegata_oid
                   WHERE NOT EXISTS (SELECT 1 FROM filtri f
                                      WHERE f.check_oid = dl.check_oid
                                        AND f.delegata_oid = dl.delegata_oid)
                      OR EXISTS (SELECT 1 FROM filtri f
                                  WHERE f.check_oid = dl.check_oid
                                    AND f.delegata_oid = dl.delegata_oid
                                    AND f.codice = cr.codice)
              ), motivi_per_codice AS (
                  -- Una riga per (check, codice) anche quando il codice arriva
                  -- da piu' strade: n_motivi sommato, motivo_chiave pessimista.
                  SELECT cr.check_oid,
                         cr.codice,
                         sum(cr.n_motivi)::integer AS n_motivi,
                         CASE
                             WHEN bool_and(cr.motivo_chiave IS NOT DISTINCT FROM 'campo') THEN 'campo'
                             WHEN bool_and(cr.motivo_chiave IN ('campo', 'parametro')) THEN 'parametro'
                             ELSE NULL
                         END AS motivo_chiave
                    FROM codici_rec cr
                   GROUP BY cr.check_oid, cr.codice
              ), valori_rec (check_oid) AS (
                  -- Emette `valori` se lo fa lei o una check a cui delega.
                  SELECT c.check_oid FROM checks c WHERE c.emette_valori
                  UNION
                  SELECT dl.check_oid
                    FROM deleghe dl
                    JOIN valori_rec v ON v.check_oid = dl.delegata_oid
              )
              SELECT l.sch,
                     l.fn,
                     l.funzione,
                     l.csch AS check_schema,
                     l.cfn  AS check_funzione,
                     EXISTS (SELECT 1 FROM valori_rec v WHERE v.check_oid = c.check_oid)
                            AS check_emette_valori,
                     m.codice,
                     m.n_motivi,
                     m.motivo_chiave
                FROM legami l
                JOIN checks c ON c.csch = l.csch AND c.cfn = l.cfn
                LEFT JOIN motivi_per_codice m ON m.check_oid = c.check_oid;

              COMMENT ON VIEW dbops.vw_funzioni_check_codici IS
              'SEDE UNICA della risalita «funzione plpgsql -> fn_check_* nominate nel corpo -> codici che quelle nominano come motivo». Una riga per (funzione, check, codice); codice NULL se la check non nomina motivi (il legame compare lo stesso). motivo_chiave = ''campo''/''parametro'' se il MOTIVO che nomina il codice porta la chiave del canale nel suo dettaglio (che fn_raise_primo_motivo_se_presente fonde nel context) — PESSIMISTA: solo se tutti i motivi di quel codice la portano; n_motivi = quante volte la check lo nomina.
              ⭐ rev 2026-09-24 (20260924-08) — LA DELEGA: una check che RESTITUISCE i motivi di un''altra fn_check_* (v_motivi || x.fn_check_…, v_m := x.fn_check_…, jsonb_agg sugli elementi) ne EREDITA i codici, a qualunque profondita''; una che la CONSUMA (count, EXISTS, IF) no — emette un motivo suo. Se nell''istruzione della delega il codice e'' confrontato con dei letterali (`->> ''codice'' = ''E_X''` o `IN (…)`) eredita SOLO quelli: script.fn_check_prezzi_in_attesa eredita da fn_check_prezzi_autorizzati il solo E_DOC_PREZZO_PENDENTE. Anche check_emette_valori si propaga. Prima la risalita si fermava a un livello, e le due madri di revisione (20260924-34/-35) uscivano come ramo cieco nel presidio C2. ⚠️ `<>` / NOT IN non sono riconosciuti come filtro: si eredita tutto — un legame in piu'', mai un ramo cieco.
              LETTORI: dbops.vw_punti_primo_motivo (il rubinetto: i soli punti che sollevano il primo motivo a mano) e dbops.vw_punti_canale_campo (il presidio C2: tutti i siti, bonificati compresi). Prima la risalita viveva dentro la sola vw_punti_primo_motivo, e la seconda l''avrebbe ricopiata.
              ⚠️ Le fn_check_* si cercano nel sorgente SENZA commenti; una riga per (funzione, check, codice) — un codice che arriva da piu'' strade si aggrega. ⚠️ La finestra di un motivo NON e'' «fino al ;»: le check a CTE costruiscono piu'' motivi in uno statement, quindi il sorgente si spezza sulle occorrenze di ''codice'',. ⚠️ Euristica su pg_proc.prosrc: riconosce la forma scritta, non il significato. Brief: brief-be-presidio-ui-action-e-canale-campi §4.
              ⭐ rev 2026-10-10 (20261010-43) — PREFILTRO `prosrc LIKE ''%fn\_check\_%''` sulla CTE funzioni: senza, la stima arrivava a ~304 milioni (funzioni di sistema a cardinalita'' fissa sopra 1.221 corpi, moltiplicata dalla ricorsione) e PostgreSQL compilava la vista col JIT — ~1,1 s di compilazione per ~110 ms di lavoro, pagati da ogni lettore. Risultato identico (un nome di funzione e'' un token: un commento non lo compone). ⛔ Il prefiltro e'' una proprieta'' invisibile nei risultati: un REPLACE che lo perde non rompe niente e torna lento. Lo presidia db/pgtap/dbops/test-vw-funzioni-check-codici-sotto-jit-v1.sql.';
