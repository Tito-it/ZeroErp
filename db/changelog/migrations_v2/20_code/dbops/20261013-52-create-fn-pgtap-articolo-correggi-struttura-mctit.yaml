# NUOVO BUILDER pgTAP: dbops.fn_pgtap_articolo_correggi_struttura(articolo, campi)
#   Cambia i flag strutturali di un articolo GIA' USATO, dalla porta vera.
#   Brief: brief-db-articoli-ammessi-per-documento (§8.6 A-10, §9.3 Lotto 3u)
#
# -- PERCHE' -------------------------------------------------------------
#   Dal 20261013-48 un articolo usato non cambia i flag strutturali. I test
#   che provano cosa succede a valle quando l'articolo cambia DOPO l'uso (la
#   natura congelata sulle righe, la riconsegna esente, l'erogazione) hanno
#   ancora un caso vero: la correzione dell'amministratore. Quattro file la
#   ripetevano (costruisci un SUPER_ADMIN, agisci come lui, correggi, torna
#   com'eri): alla seconda copia si estrae (regola del 2).
#
# -- LA FORMA ------------------------------------------------------------
#   ⛔ INVOKER, e passa dal verbo vero (catalogo.fn_articolo_correggi_struttura)
#   come un SUPER_ADMIN vero (dbops.fn_pgtap_crea_operatore_umano(.., true)):
#   un helper DEFINER che aggira la porta sarebbe una scorciatoia eseguibile
#   dall'app. Il contesto di chi chiama (app.current_user_id,
#   app.ruolo_applicativo) si rimette com'era, anche vuoto.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261013-52-create-fn-pgtap-articolo-correggi-struttura-mctit.yaml

  - changeSet:
      id: 20261013-52-create-fn-pgtap-articolo-correggi-struttura
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Nuovo builder pgTAP dbops.fn_pgtap_articolo_correggi_struttura: cambia i flag strutturali di un
        articolo usato passando dal verbo amministratore come un SUPER_ADMIN costruito, e rimette il
        contesto di chi chiama. Brief: brief-db-articoli-ammessi-per-documento (§8.6 A-10).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_pgtap_articolo_correggi_struttura(
                  p_articolo_id catalogo.articoli.id%TYPE,
                  p_campi       jsonb)
              RETURNS void
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_utente_prima text := current_setting('app.current_user_id', true);
                  v_ruolo_prima  text := current_setting('app.ruolo_applicativo', true);
                  v_admin        integer;
              BEGIN
                  -- Scopo: cambiare i flag strutturali di un articolo usato
                  --   dalla porta vera (verbo + SUPER_ADMIN), poi tornare al
                  --   contesto di prima. Solo per fixture pgTAP.
                  SELECT o.auth_user_id INTO v_admin
                    FROM dbops.fn_pgtap_crea_operatore_umano('pgTAP correggi struttura', true) o;

                  PERFORM script.fn_pgtap_set_contesto_operatore(v_admin);
                  PERFORM catalogo.fn_articolo_correggi_struttura(p_articolo_id, p_campi);

                  PERFORM set_config('app.current_user_id',   COALESCE(v_utente_prima, ''), false);
                  PERFORM set_config('app.ruolo_applicativo', COALESCE(v_ruolo_prima, ''),  false);
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_pgtap_articolo_correggi_struttura(uuid, jsonb)
              IS 'Builder pgTAP (A-10 di brief-db-articoli-ammessi-per-documento, 2026-10-13): cambia i flag strutturali di un articolo gia'' usato dalla porta vera, catalogo.fn_articolo_correggi_struttura, come un SUPER_ADMIN costruito (dbops.fn_pgtap_crea_operatore_umano(.., true)), poi rimette app.current_user_id e app.ruolo_applicativo di chi chiama (anche vuoti). INVOKER: non aggira niente. Per i test che provano cosa succede a valle quando un articolo cambia dopo l''uso.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS dbops.fn_pgtap_articolo_correggi_struttura(uuid, jsonb);
