# ------------------------------------------------------------
# dbops.fn_ritira_attivo_eccezioni: non tocca i cloni dei trigger della
#   radice partizionata, e ritira quelli propri di una FK ereditata.
#
# ── PERCHE' (Tid, 2026-11-21, D-5 «a») ────────────────────────────────
#   Una FK ereditata da una radice partizionata si lega e si esclude sulla
#   radice: il require della radice PostgreSQL lo clona su ogni partizione
#   (tgparentid <> 0). Un clone non e' un trigger da ritirare: lo governa
#   la radice, e un DROP TRIGGER sul clone e' rifiutato («il trigger sulla
#   tabella radice lo richiede»). Senza il filtro, una partizione con il
#   clone di una FK che il building block esclude fermerebbe il giro.
#   Brief: brief-db-attivo-fk-senza-suffisso-id §5 e §8.1.
#
# ── COSA CAMBIA ───────────────────────────────────────────────────────
#   * Il filtro t.tgparentid = 0: si guardano solo i trigger propri.
#   * Cosa ritira lo dice dbops.fn_attivo_fk_esclusa (20261121-21), come
#     prima: le eccezioni dichiarate e, al posto delle FK senza _id, le FK
#     ereditate. Un trigger proprio montato su una partizione per una FK
#     ereditata (il raddoppio del caso B, §3.1 del brief) si ritira; oggi
#     non ce n'e' nessuno, perche' le sole FK ereditate verso un padre con
#     attivo sono id_lingua e id_stile delle note, che il filtro _id saltava.
#
# INVARIATI: la firma, il ritorno (quanti ne ha tolti), il NOTICE, chi la
#   chiama (il runner in testa al giro, e i provision di 90_end).
# Corpo di partenza: 20261121-13-update-fn-ritira-attivo-eccezioni-inclusioni-mctit.yaml,
#   uguale al vivo dello scratch e di dbdev (2026-11-22). Il ritorno
#   indietro rimette quel corpo e il suo COMMENT.
# Presidio: dbops/test-automazione-attivo-senza-filtro-nome-v1, dbops/test-automazione-attivo-eccezioni-v1.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261121-23-update-fn-ritira-attivo-eccezioni-cloni-mctit.yaml

  - changeSet:
      id: 20261121-23-update-fn-ritira-attivo-eccezioni-cloni
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.fn_ritira_attivo_eccezioni guarda solo i trigger propri (tgparentid = 0): un clone
        sulla partizione lo governa la radice. Ritira le eccezioni e le FK ereditate.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_proc
               WHERE oid = to_regprocedure('dbops.fn_attivo_fk_esclusa(text,text,text)')
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_ritira_attivo_eccezioni()
               RETURNS integer
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: togliere i trigger ATTIVO gia' generati per le FK che
              --   l'automazione non lega (dbops.fn_attivo_fk_esclusa): le eccezioni
              --   dichiarate e le FK ereditate da una radice partizionata.
              --   ⛔ Un clone (tgparentid <> 0) non si tocca: lo governa il trigger
              --   della radice, e PostgreSQL ne rifiuta il DROP.
              -- Uso: SELECT dbops.fn_ritira_attivo_eccezioni();  -- quanti ne ha tolti
              DECLARE
                  v_trigger pg_catalog.pg_trigger.tgname%TYPE;
                  v_tabella pg_catalog.pg_trigger.tgrelid%TYPE;
                  -- conteggio: nessuna colonna da ancorare
                  v_n       integer := 0;
              BEGIN
                  FOR v_trigger, v_tabella IN
                      WITH trg AS (
                          SELECT t.tgname,
                                 t.tgrelid,
                                 -- la figlia: il block la nomina negli argomenti,
                                 -- il require sta sulla figlia stessa
                                 CASE WHEN p.proname = 'trgfn_prevent_deactivate_if_children'
                                      THEN g.figlia_schema  ELSE cn.nspname END AS figlia_schema,
                                 CASE WHEN p.proname = 'trgfn_prevent_deactivate_if_children'
                                      THEN g.figlia_tabella ELSE c.relname  END AS figlia_tabella,
                                 g.fk_col
                            FROM pg_catalog.pg_trigger t
                            JOIN pg_catalog.pg_class c      ON c.oid = t.tgrelid
                            JOIN pg_catalog.pg_namespace cn ON cn.oid = c.relnamespace
                            JOIN pg_catalog.pg_proc p       ON p.oid = t.tgfoid
                            JOIN pg_catalog.pg_namespace n  ON n.oid = p.pronamespace
                            CROSS JOIN LATERAL dbops.fn_trigger_attivo_argomenti(
                                p.proname, dbops.fn_trigger_argomenti(t.tgargs)) AS g
                           WHERE NOT t.tgisinternal
                             AND t.tgparentid = 0
                             AND n.nspname = 'dbops'
                             AND p.proname IN ('trgfn_child_requires_active_parent',
                                               'trgfn_prevent_deactivate_if_children')
                             -- un montaggio fuori grammatica non e' un ritiro:
                             -- lo riporta dbops.fn_trigger_attivo_orfani
                             AND g.valido
                      )
                      SELECT trg.tgname, trg.tgrelid
                        FROM trg
                       WHERE dbops.fn_attivo_fk_esclusa(trg.figlia_schema, trg.figlia_tabella, trg.fk_col) IS NOT NULL
                  LOOP
                      EXECUTE format('DROP TRIGGER IF EXISTS %I ON %s', v_trigger, v_tabella::regclass);
                      RAISE NOTICE 'fn_ritira_attivo_eccezioni: ritirato % su %', v_trigger, v_tabella::regclass;
                      v_n := v_n + 1;
                  END LOOP;

                  RETURN v_n;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_ritira_attivo_eccezioni() IS
                'Toglie i trigger ATTIVO gia'' generati per le FK che l''automazione non lega, chiedendolo a dbops.fn_attivo_fk_esclusa: le FK dichiarate in dbops.automazione_attivo_eccezioni e le FK ereditate da una radice partizionata, che si legano o si escludono sulla radice. Toglie il require sul figlio (dbops.trgfn_child_requires_active_parent, sulla tabella figlia, con quella colonna FK) e il block sul padre (dbops.trgfn_prevent_deactivate_if_children, che nomina quella figlia e quella colonna FK); vale anche per un trigger ATTIVO montato a mano. Non tocca un clone (tgparentid <> 0), il trigger che PostgreSQL copia su una partizione da quello della radice: lo governa la radice. Li riconosce per FUNZIONE e ARGOMENTI, non per nome (i nomi generati oltre 63 caratteri sono troncati con un hash); gli argomenti li legge per nome dbops.fn_trigger_attivo_argomenti, la grammatica delle funzioni trigger. Un montaggio fuori grammatica non si tocca: lo riporta dbops.fn_trigger_attivo_orfani. Torna quanti ne ha tolti. Chiamata in testa da dbops.fn_run_automations_attivo (chi genera ritira).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_ritira_attivo_eccezioni()
               RETURNS integer
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: togliere i trigger ATTIVO gia' generati per le FK che
              --   l'automazione non lega (dbops.fn_attivo_fk_esclusa): le eccezioni
              --   dichiarate e le FK senza _id fuori dal registro delle inclusioni.
              -- Uso: SELECT dbops.fn_ritira_attivo_eccezioni();  -- quanti ne ha tolti
              DECLARE
                  v_trigger pg_catalog.pg_trigger.tgname%TYPE;
                  v_tabella pg_catalog.pg_trigger.tgrelid%TYPE;
                  -- conteggio: nessuna colonna da ancorare
                  v_n       integer := 0;
              BEGIN
                  FOR v_trigger, v_tabella IN
                      WITH trg AS (
                          SELECT t.tgname,
                                 t.tgrelid,
                                 -- la figlia: il block la nomina negli argomenti,
                                 -- il require sta sulla figlia stessa
                                 CASE WHEN p.proname = 'trgfn_prevent_deactivate_if_children'
                                      THEN g.figlia_schema  ELSE cn.nspname END AS figlia_schema,
                                 CASE WHEN p.proname = 'trgfn_prevent_deactivate_if_children'
                                      THEN g.figlia_tabella ELSE c.relname  END AS figlia_tabella,
                                 g.fk_col
                            FROM pg_catalog.pg_trigger t
                            JOIN pg_catalog.pg_class c      ON c.oid = t.tgrelid
                            JOIN pg_catalog.pg_namespace cn ON cn.oid = c.relnamespace
                            JOIN pg_catalog.pg_proc p       ON p.oid = t.tgfoid
                            JOIN pg_catalog.pg_namespace n  ON n.oid = p.pronamespace
                            CROSS JOIN LATERAL dbops.fn_trigger_attivo_argomenti(
                                p.proname, dbops.fn_trigger_argomenti(t.tgargs)) AS g
                           WHERE NOT t.tgisinternal
                             AND n.nspname = 'dbops'
                             AND p.proname IN ('trgfn_child_requires_active_parent',
                                               'trgfn_prevent_deactivate_if_children')
                             -- un montaggio fuori grammatica non e' un ritiro:
                             -- lo riporta dbops.fn_trigger_attivo_orfani
                             AND g.valido
                      )
                      SELECT trg.tgname, trg.tgrelid
                        FROM trg
                       WHERE dbops.fn_attivo_fk_esclusa(trg.figlia_schema, trg.figlia_tabella, trg.fk_col) IS NOT NULL
                  LOOP
                      EXECUTE format('DROP TRIGGER IF EXISTS %I ON %s', v_trigger, v_tabella::regclass);
                      RAISE NOTICE 'fn_ritira_attivo_eccezioni: ritirato % su %', v_trigger, v_tabella::regclass;
                      v_n := v_n + 1;
