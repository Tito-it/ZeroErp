                      RETURN false;
                  END IF;

                  IF p_rule_type IN ('TX_ID', 'AUDIT_UPDATE', 'STORICO', 'LOCK_COLUMNS',
                                     'DATE_VALIDITA', 'CODICE_MAIUSCOLO')
