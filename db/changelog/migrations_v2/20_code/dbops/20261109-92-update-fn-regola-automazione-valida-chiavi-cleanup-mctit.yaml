                  END IF;

                  IF p_rule_type = 'CLEANUP_AT' THEN
                      IF jsonb_typeof(p_params -> 'ttl_days') IS DISTINCT FROM 'number'
                         OR (p_params ->> 'ttl_days')::numeric <> trunc((p_params ->> 'ttl_days')::numeric)
                         OR (p_params ->> 'ttl_days')::numeric < 1 THEN
