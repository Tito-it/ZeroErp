                         OR position('{fkhash6' IN v_t ->> 'require') = 0 THEN
                          RETURN false;
                      END IF;
                  END IF;

                  IF p_rule_type IN ('CLEANUP_AT', 'CLEANUP_PURGE') AND p_exec_mode <> 'AUTO' THEN
