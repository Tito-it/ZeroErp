# ------------------------------------------------------------
# ⭐ I `COMMAND` CON UN CONTRATTO NON SONO PIU' `FUORI_PORTATA`.
#   Brief: brief-db-quattro-processi-senza-presidio §10.2 · §10.3 · B3
#
# Fino a oggi il panorama diceva `FUORI_PORTATA` a OGNI `COMMAND`: i timer li
# sveglia systemd, e il database non poteva sapere che cosa aspettarsi. Dal
# changeSet `20260911-13` il catalogo dichiara il contratto di liveness
# (`tolleranza_minuti`, `segno_di_vita`), quindi il database SA:
#
#   COMMAND + GIORNALE + tolleranza  → OK / MUTO / MAI_PARTITO
#   COMMAND + SESSIONE               → OK (sessione viva) / MUTO
#   COMMAND senza contratto          → FUORI_PORTATA, come prima
#
# ── ⭐ `MUTO`: uno stato nuovo, non un ramo in piu' di FUORI_PORTATA ─
#   «Dichiara di farsi vivo ogni N minuti e l'ultimo segno e' piu' vecchio».
#   E' il processo che ERA vivo ed e' TACIUTO — la firma di un timer morto, di
#   un servizio caduto, di un digest che non gira piu'. E' l'unico stato nuovo:
#   MAI_PARTITO e OK esistono gia' e dicono la stessa cosa che dicono per
#   pgAgent.
#
# ── ⭐ CHE COSA CHIUDE, senza nessuna vista nuova ────────────────────
#   `da_guardare` NON cambia forma (stato ∉ OK/FUORI_PORTATA/SU_RICHIESTA), quindi
#   MUTO e MAI_PARTITO entrano da soli nel presidio
#   `vw_processi_programmazione_da_guardare`, nel pannello e nel digest.
#   ⇒ Il §11.5 del brief dei presidi («fra dichiarato e installato non guarda
#     nessuno») e' chiuso dal lato del database: un timer dichiarato e mai
#     installato non ha corse ⇒ MAI_PARTITO ⇒ presidio.
#   ⇒ E `maintenance.vw_job_run_da_guardare`, che nel COMMENT dichiarava «non
#     vede il job che non parte affatto», ha finalmente il suo complemento.
#
# ── ⭐ `SESSIONE`: si legge `pg_stat_activity` ─────────────────────
#   Una connessione viva con `application_name = codice` sul database corrente.
#   `application_name` e `backend_start` si leggono da qualunque ruolo, senza
#   pg_read_all_stats (verificato 2026-09-11). Il segno di vita e' un FATTO.
#
# ── ⚠️ Colonne nuove IN CODA: `CREATE OR REPLACE VIEW` non riordina ──
#   tolleranza_minuti, segno_di_vita, ultimo_segno_di_vita. La proiezione
#   `_da_guardare` enumera le sue colonne e non cambia.
#
# ⚠️ Corpo preso dalla doc auto-gen, non dallo YAML `20260907-06`.
#
# Verifica: db/pgtap/dbops/test-vw-processi-programmazione.sql
#           (test 7 riscritto, 14..17 nuovi)
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20260911-14-update-vw-processi-programmazione-muto-mctit.yaml

  - changeSet:
      id: 20260911-14-update-vw-processi-programmazione-muto
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.vw_processi_programmazione legge il contratto di liveness del
        catalogo: un COMMAND con tolleranza_minuti e' OK, MUTO (ultima corsa
        piu' vecchia della tolleranza) o MAI_PARTITO; un COMMAND a SESSIONE e'
        OK se esiste una connessione viva con application_name = codice,
        altrimenti MUTO. FUORI_PORTATA resta per i COMMAND senza contratto.
        da_guardare non cambia forma, quindi MUTO entra da solo nel presidio,
        nel pannello e nel digest. Tre colonne in coda.
      preConditions:
        - onFail: HALT
        - and:
            - columnExists:
                schemaName: dbops
                tableName: processi
                columnName: tolleranza_minuti
            - columnExists:
                schemaName: dbops
                tableName: processi
                columnName: segno_di_vita
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW dbops.vw_processi_programmazione AS
              WITH panorama AS (
                  SELECT p.codice AS processo_codice,
                         p.classe,
                         p.canale,
                         p.jobname_pgagent,
                         p.tolleranza_minuti,
                         p.segno_di_vita,
                         g.abilitato          AS job_abilitato,
                         g.prossima_esecuzione AS prossima_corsa,
                         g.ultima_esecuzione  AS pgagent_ultima_corsa,
                         l.ultima_corsa       AS giornale_ultima_corsa,
                         l.ultima_corsa_pgagent,
                         l.ultimo_esito,
                         s.viva_dal           AS sessione_viva_dal,
                         CASE
                             WHEN p.canale = 'CODA' THEN 'SU_RICHIESTA'
                             -- ⭐ Un COMMAND con CONTRATTO: il database sa che
                             --   cosa aspettarsi, e lo confronta.
                             WHEN p.canale = 'COMMAND' AND p.segno_di_vita = 'SESSIONE' THEN
                                 CASE WHEN s.viva_dal IS NOT NULL THEN 'OK' ELSE 'MUTO' END
                             WHEN p.canale = 'COMMAND' AND p.tolleranza_minuti IS NOT NULL THEN
                                 CASE
                                     WHEN l.ultima_corsa IS NULL THEN 'MAI_PARTITO'
                                     WHEN l.ultima_corsa
                                          < now() - make_interval(mins => p.tolleranza_minuti)
                                         THEN 'MUTO'
                                     ELSE 'OK'
                                 END
                             -- ⚠️ Senza contratto resta un limite di VISTA, come
                             --   prima: la sveglia vive fuori e nessuno l'ha
                             --   dichiarata qui.
                             WHEN p.canale = 'COMMAND' THEN 'FUORI_PORTATA'
                             WHEN p.jobname_pgagent IS NULL THEN 'NON_PROGRAMMATO'
                             WHEN g.abilitato IS NULL THEN 'JOB_ASSENTE'
                             WHEN g.abilitato IS FALSE THEN 'JOB_SPENTO'
                             WHEN g.ultima_esecuzione IS NOT NULL
                                  AND COALESCE(l.ultima_corsa_pgagent, '-infinity'::timestamptz)
                                      < g.ultima_esecuzione - interval '1 hour'
                                 THEN 'GIRA_E_NON_REGISTRA'
                             WHEN g.ultima_esecuzione IS NULL THEN 'MAI_PARTITO'
                             ELSE 'OK'
                         END AS stato
                    FROM dbops.processi p
                    LEFT JOIN LATERAL dbops.fn_get_pgagent_job_stato(p.jobname_pgagent)
                         g(abilitato, ultima_esecuzione, prossima_esecuzione) ON true
                    LEFT JOIN LATERAL (
                        SELECT max(r.started_at) AS ultima_corsa,
                               max(r.started_at) FILTER (WHERE r.origine::text = 'PGAGENT')
                                   AS ultima_corsa_pgagent,
                               (SELECT r2.ok
                                  FROM maintenance.job_run_log r2
                                 WHERE r2.processo_codice = p.codice OR r2.jobname = p.codice
                                 ORDER BY r2.started_at DESC, r2.id DESC
                                 LIMIT 1) AS ultimo_esito
                          FROM maintenance.job_run_log r
                         WHERE r.processo_codice = p.codice OR r.jobname = p.codice
                    ) l ON true
                    -- ⭐ SESSIONE: il segno di vita e' una connessione, non una riga.
                    --   application_name lo legge qualunque ruolo; il processo
                    --   si presenta con il proprio codice.
                    LEFT JOIN LATERAL (
                        SELECT min(a.backend_start) AS viva_dal
                          FROM pg_stat_activity a
                         WHERE p.segno_di_vita = 'SESSIONE'
                           AND a.datname = current_database()
                           AND a.application_name = p.codice
                    ) s ON true
                   WHERE p.attivo AND p.obsoleto_dal IS NULL
              )
              SELECT processo_codice,
                     classe,
                     canale,
                     jobname_pgagent,
                     job_abilitato,
                     prossima_corsa,
                     pgagent_ultima_corsa,
                     giornale_ultima_corsa,
                     ultimo_esito,
                     stato,
                     -- ⛔ Il criterio del guasto sta QUI, accanto al CASE: uno
                     --   stato nuovo non ha un default in cui cadere. MUTO e
                     --   MAI_PARTITO sono da guardare senza toccare questa riga.
                     stato NOT IN ('OK', 'FUORI_PORTATA', 'SU_RICHIESTA') AS da_guardare,
                     ultima_corsa_pgagent AS giornale_ultima_corsa_pgagent,
                     -- Colonne nuove, IN CODA.
                     tolleranza_minuti,
                     segno_di_vita,
                     -- ⭐ L'ultimo segno di vita che il verdetto ha usato: la
                     --   corsa per GIORNALE, l'avvio della sessione per SESSIONE.
                     CASE WHEN segno_di_vita = 'SESSIONE' THEN sessione_viva_dal
                          ELSE giornale_ultima_corsa END AS ultimo_segno_di_vita
                FROM panorama
               ORDER BY canale, processo_codice;

              COMMENT ON VIEW dbops.vw_processi_programmazione IS
                  'PANORAMA: per ogni processo automatico attivo — quale job pgAgent lo sveglia, quando girera'', quando ha girato secondo pgAgent e secondo il nostro giornale. ⭐ La colonna che vale piu'' di tutte e'' `stato`, e il valore che conta e'' GIRA_E_NON_REGISTRA: pgAgent dice che il job e'' girato, il giornale non lo sa — e'' la firma esatta di un lavoro che muore prima di riuscire a raccontarlo, cioe'' di R-12, il job morto per sei mesi con l''ultimo verdetto a «done». Questo confronto lo avrebbe trovato in un giorno. ⚠️ Il legame col job NON e'' il nome: si legge da dbops.processi.jobname_pgagent, perche'' due job su quattordici si chiamano diversamente dal processo che registrano. ⚠️ Il giornale si legge per processo_codice OPPURE per jobname: le corse storiche hanno la prima colonna vuota, e senza il ripiego ogni processo sembrerebbe non aver mai girato prima di settembre 2026. ⛔ IL CONFRONTO GUARDA CHI HA SCRITTO LA RISPOSTA, rev 2026-09-07 (brief-db-sveglia-dei-processi §9.5-bis, segnalato dal backend): il ramo GIRA_E_NON_REGISTRA legge `giornale_ultima_corsa_pgagent`, non `giornale_ultima_corsa`. ⭐ I COMMAND CON UN CONTRATTO NON SONO PIU'' FUORI_PORTATA, rev 2026-09-11 (brief-db-quattro-processi-senza-presidio §10.2, decisione di Tid): dal 20260911-13 il catalogo dichiara tolleranza_minuti e segno_di_vita, quindi il database SA che cosa aspettarsi. GIORNALE + tolleranza: OK se l''ultima corsa e'' entro la tolleranza, MUTO se e'' piu'' vecchia, MAI_PARTITO se non c''e'' — e MAI_PARTITO su un COMMAND e'' il timer dichiarato e mai installato, cioe'' il §11.5 dei presidi visto dal database. SESSIONE: OK se in pg_stat_activity c''e'' una connessione viva con application_name = codice sul database corrente, altrimenti MUTO — e'' la forma dei servizi sempre accesi (listen_cambio_reparto), il segno di vita e'' un FATTO e non una dichiarazione. MUTO e'' l''unico stato nuovo: «era vivo ed e'' taciuto». FUORI_PORTATA resta per i COMMAND SENZA contratto: un limite di vista, non un guasto. SU_RICHIESTA resta per i CODA: una cadenza non esiste. ⭐ E'' un panorama, non un presidio: elenca anche i sani. ⛔ Il presidio NON si scrive come un NOT IN a mano: e'' la colonna `da_guardare`, calcolata qui accanto al CASE, e dbops.vw_processi_programmazione_da_guardare la proietta — MUTO e MAI_PARTITO ci entrano da soli, senza toccare quella riga. Tre colonne in coda dal 2026-09-11: tolleranza_minuti, segno_di_vita, ultimo_segno_di_vita (la corsa per GIORNALE, l''avvio della sessione per SESSIONE).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- ⚠️ Tornare al corpo di 20260907-06 rimetterebbe FUORI_PORTATA su
              --   ogni COMMAND lasciando il contratto a catalogo senza lettore.
              --   Il verso di ritiro e' un changeSet nuovo, con le colonne.
              SELECT 1;
