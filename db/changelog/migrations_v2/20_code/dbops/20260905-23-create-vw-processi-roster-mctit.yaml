# ⭐ IL ROSTER — con quale identita' un processo lavora OGNI azienda.
#
# ── 🔴 CORREZIONE 2026-09-05: UNA VISTA NON PUO' NOMINARE `django.*` ────
#   La prima stesura faceva `JOIN django.auth_user`, e il migrate della CI si e'
#   fermato qui: `la relazione "django.auth_user" non esiste`.
#   ⛔ Non e' un ordine da sistemare: quella tabella **non esiste in nessun
#   momento** del migrate. Lo schema `django` lo crea Liquibase (`90_end`,
#   `20250924-01`), le TABELLE dentro le crea `manage.py migrate` — cioe' un
#   passo che in `ci.yaml` non c'e' affatto e in `ci-validate.yaml` viene DOPO.
#   ⚠️ Su dbdev non si vedeva: li' `django.auth_user` c'e' da mesi.
#   ⭐ Le ~40 funzioni del progetto che leggono `django.*` se la cavano perche'
#   sono **plpgsql**: il corpo non viene risolto alla `CREATE`. Una **vista** si',
#   ed e' la differenza. Non a caso `anagrafiche.risorse_umane_auth_user` — una
#   vista che si chiama cosi' — passa da `identita_digitali` e non da Django.
#   ⇒ La regola che ne esce: **il DB puo' CHIAMARE dentro `django.*`, non puo'
#   DIPENDERNE strutturalmente** (vista, FK, colonna generata).
#   ⇒ Il riferimento sta ora dietro `script.fn_get_auth_user_stato`, plpgsql e
#   quindi late-bound. Le cinque condizioni restano cinque.
#
# ── ⚠️ QUESTA E' LA COPIA STORICA: LA DEFINIZIONE VIVA E' `20260905-30` ─
#   Il changeSet e' gia' EXECUTED su dbdev, quindi li' **non ri-esegue**: senza
#   un secondo changeSet dbdev resterebbe con la vista vecchia e la CI con
#   quella nuova — due macchine, due definizioni. Il corpo qui sotto serve a un
#   database ricostruito **da zero** (e a soddisfare la preCondition di
#   `20260905-24`, che pretende la vista); ad allineare dbdev ci pensa
#   `20260905-30`, con la stessa DDL. ⛔ Da qui in poi questo file non si tocca
#   piu': chi deve cambiare il roster scrive un changeSet nuovo, come per ogni
#   altro oggetto.
#   ⚠️ `validCheckSums: ANY` e' obbligatorio (al PLURALE): senza, il prossimo
#   migrate su dbdev fallirebbe la validazione del checksum.
#
# ── ⛔ PERCHE' NASCE, E NON E' UN'AGGIUNTA DI COMODO ─────────────────
#   Questo fatto ESISTE GIA', ma vive in una **stringa SQL dentro Python**
#   (`backend/apps/core/db/processi_repository.py`, `roster_processo`). Serviva
#   solo al produttore della fatturazione, che e' backend.
#   ⚠️ Da adesso serve anche al DB: il job pgAgent che accoda la chiusura
#   scadenze deve sapere, per ogni azienda, con quale identita' accodare.
#   ⛔ Riscriverlo in una funzione plpgsql sarebbe stata una SECONDA scrittura
#   dello stesso fatto — e due scritture prima o poi dissentono, per esempio il
#   giorno in cui si aggiunge una condizione a una sola delle due.
#   ⇒ Il fatto diventa una vista, e i due lati la leggono.
#
# ── ⚠️ AL BACKEND: la query inline puo' sparire ─────────────────────
#   `roster_processo` puo' diventare un `SELECT * FROM dbops.vw_processi_roster
#   WHERE processo_codice = %s`. Non e' urgente e non lo facciamo noi — ma
#   finche' restano due copie, sono due copie.
#
# ── ⭐ LE CINQUE CONDIZIONI SONO TUTTE NECESSARIE, e vale dirlo ─────
#   Un'identita' vale come «con questa il processo puo' lavorare» solo se:
#     pi.attivo          il legame processo-utente non e' stato spento
#     idg.attivo         l'identita' applicativa e' viva
#     ruolo OPERATORE    e' la veste che le policy RLS riconoscono
#     au.is_active       l'utente Django non e' stato disattivato
#     ef.attivo          l'azienda e' ancora da servire
#   ⛔ Toglierne una lascerebbe passare un'identita' spenta a un livello solo, e
#   il lavoro partirebbe per fermarsi dopo — o peggio, girerebbe a vuoto.
#   ⛔ E la quarta NON si e' persa nella correzione: sarebbe stata la scorciatoia
#   ovvia («tanto `idg.attivo` la rispecchia»). Non la rispecchia: la sincronia
#   e' a senso unico (identita' -> Django), quindi un utente disattivato dentro
#   Django resterebbe attivo per il DB.
#   ⚠️ E' la stessa terna che `script.fn_riattiva_utente_tecnico` riaccende
#   tutta insieme: spegnerne uno basta a fermare, quindi guardarne uno solo
#   basta a sbagliare.
#
# ── ⚠️ `ORDER BY` STABILE ──────────────────────────────────────────
#   Il produttore accoda nell'ordine in cui legge. Senza un ordine, due giri
#   accoderebbero le stesse aziende in ordine diverso, e un confronto fra due
#   corse diventerebbe illeggibile.
#
# Verifica: db/pgtap/dbops/test-vw-processi-roster.sql
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20260905-23-create-vw-processi-roster-mctit.yaml

  - changeSet:
      id: 20260905-23-create-vw-processi-roster
      author: mctit
      failOnError: true
      validCheckSums:
        - ANY
      comment: >
        dbops.vw_processi_roster: per ogni processo, con quale identita' lavora
        ciascuna azienda. Il riferimento a django.auth_user passa da
        script.fn_get_auth_user_stato (plpgsql, late-bound): una vista si
        risolve alla CREATE, e le tabelle di Django durante il migrate non
        esistono. Copia storica — la definizione viva e' 20260905-30.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                { schemaName: dbops, tableName: processi_identita }
            - columnExists:
                schemaName: anagrafiche
                tableName: identita_digitali
                columnName: tecnica
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- =====================================================
              -- 1) L'ACCESSORE late-bound su django.auth_user.
              --    plpgsql e non sql: il corpo di una funzione plpgsql non
              --    viene risolto alla CREATE, quindi puo' nominare una tabella
              --    che durante il migrate non esiste ancora. E' la stessa
              --    ragione per cui tutte le funzioni del progetto che leggono
              --    django.* sono plpgsql (AGENTS.md).
              -- ⛔ Niente %TYPE sulle colonne di django.*: la stessa regola.
              -- ⚠️ SECURITY INVOKER (il default) e non DEFINER: chi legge il
              --    roster o e' zeroerp_app — che su django.auth_user ha SELECT —
              --    o e' il job pgAgent, che gira come superuser. Darle privilegi
              --    propri sarebbe darli a chiunque possa eseguirla, ed e' la
              --    stessa scelta gia' motivata in fn_accoda_chiusura_scadenze.
              -- =====================================================
              CREATE OR REPLACE FUNCTION script.fn_get_auth_user_stato(
                  p_auth_user_id integer)
               RETURNS TABLE (username text, is_active boolean)
               LANGUAGE plpgsql
               STABLE
              AS $function$
              BEGIN
                  -- ⚠️ Nessun guard sul parametro, ed e' una scelta motivata:
                  --   questa non e' una funzione applicativa chiamata da un
                  --   form, e' la CHIAVE DI UN JOIN. Un id assente (utente
                  --   cancellato) deve dare ZERO RIGHE — che in un INNER JOIN
                  --   LATERAL fa sparire la riga, cioe' fail-closed. Sollevare
                  --   fermerebbe la lettura del roster INTERO per una riga sola.
                  RETURN QUERY
                  SELECT au.username::text, au.is_active
                    FROM django.auth_user au
                   WHERE au.id = p_auth_user_id;
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_get_auth_user_stato(integer) IS
                  'Lo stato di un utente Django (username, is_active) per '
                  'auth_user_id. ⭐ Esiste per una ragione sola e va detta: una '
                  'VISTA si risolve alla CREATE, e le tabelle dello schema django '
                  'le crea manage.py migrate — non Liquibase — quindi durante il '
                  'migrate non esistono. Una funzione plpgsql invece e'' '
                  'late-bound. ⇒ Il DB puo'' CHIAMARE dentro django.*, non puo'' '
                  'DIPENDERNE strutturalmente (vista, FK, colonna generata): chi '
                  'ha bisogno di auth_user dentro una vista passa da qui. '
                  '⚠️ Zero righe su id assente e'' la risposta giusta, non un '
                  'errore: e'' la chiave di un join, e in un INNER JOIN LATERAL '
                  'fa sparire la riga (fail-closed).';

              DO $grant_fn$
              BEGIN
                  IF EXISTS (SELECT 1 FROM pg_catalog.pg_roles
                              WHERE rolname = 'zeroerp_app') THEN
                      GRANT EXECUTE ON FUNCTION script.fn_get_auth_user_stato(integer)
                          TO zeroerp_app;
                  ELSE
                      RAISE NOTICE 'ruolo zeroerp_app assente: GRANT saltato';
                  END IF;
              END
              $grant_fn$;

              -- =====================================================
              -- 2) IL ROSTER.
              -- ⚠️ DROP + CREATE e non CREATE OR REPLACE: `username` cambia
              --    tipo (varchar(150) di Django -> text dell'accessore), e
              --    CREATE OR REPLACE VIEW non sa cambiare il tipo di una
              --    colonna. Il GRANT si rimette qui sotto, nello stesso
              --    changeSet: un DROP porta via anche i privilegi.
              -- =====================================================
              DROP VIEW IF EXISTS dbops.vw_processi_roster;

              CREATE VIEW dbops.vw_processi_roster AS
              SELECT p.codice              AS processo_codice,
                     p.classe,
                     p.canale,
                     idg.auth_user_id,
                     au.username,
                     idg.id                AS identita_id,
                     ef.id                 AS emittente_fiscale_id,
                     ef.codice             AS emittente_codice,
                     ef.soggetto_ruolo_id  AS emittente_soggetto_ruolo_id
                FROM dbops.processi p
                JOIN dbops.processi_identita pi
                  ON pi.processo_id = p.id
                 AND pi.attivo
                JOIN anagrafiche.identita_digitali idg
                  ON idg.auth_user_id = pi.auth_user_id
                 AND idg.attivo
                 AND idg.ruolo_applicativo = 'OPERATORE'::config.ruolo_applicativo
                -- ⛔ NON `JOIN django.auth_user`: una vista si risolve alla
                --   CREATE e quella tabella durante il migrate non esiste.
                --   La condizione e' la stessa (`au.is_active`), letta da un
                --   accessore plpgsql: il join resta INNER, quindi un utente
                --   assente o spento fa sparire la riga come prima.
                JOIN LATERAL script.fn_get_auth_user_stato(pi.auth_user_id) au
                  ON au.is_active
                JOIN config.user_emittenti_fiscali uef
                  ON uef.auth_user_id = pi.auth_user_id
                JOIN anagrafiche.emittenti_fiscali ef
                  ON ef.id = uef.emittente_fiscale_id
                 AND ef.attivo
               WHERE p.attivo
                 AND p.obsoleto_dal IS NULL
               -- ⚠️ Ordine stabile: il produttore accoda nell'ordine in cui
               --   legge, e due corse devono essere confrontabili.
               ORDER BY p.codice, ef.codice, idg.auth_user_id;

              COMMENT ON VIEW dbops.vw_processi_roster IS
                  'Per ogni processo automatico, con quale IDENTITA'' lavora ciascuna '
                  'azienda: la terna (auth_user_id, username, identita_id) piu'' '
                  'l''emittente. ⭐ Il fatto esisteva gia'' ma viveva in una stringa SQL '
                  'dentro Python (processi_repository.roster_processo): serviva solo al '
                  'produttore della fatturazione. Da quando anche il DB deve accodare — il '
                  'job pgAgent della chiusura scadenze — riscriverlo sarebbe stata una '
                  'SECONDA scrittura dello stesso fatto. ⚠️ Le cinque condizioni sono '
                  'tutte necessarie (legame attivo, identita'' attiva, ruolo OPERATORE, '
                  'utente Django attivo, emittente attivo): spegnerne uno basta a fermare '
                  'il processo, quindi guardarne uno solo basta a sbagliare — e'' la stessa '
                  'terna che script.fn_riattiva_utente_tecnico riaccende tutta insieme. '
                  '⚠️ La condizione sull''utente Django passa da '
                  'script.fn_get_auth_user_stato e non da un JOIN diretto: una vista si '
                  'risolve alla CREATE e le tabelle di django le crea manage.py migrate, '
                  'non Liquibase. ⚠️ Al backend: roster_processo puo'' diventare un SELECT '
                  'su questa vista. Finche'' restano due copie, sono due copie.';

              DO $grant$
              BEGIN
                  IF EXISTS (SELECT 1 FROM pg_catalog.pg_roles
                              WHERE rolname = 'zeroerp_app') THEN
                      GRANT SELECT ON dbops.vw_processi_roster TO zeroerp_app;
                  ELSE
                      RAISE NOTICE 'ruolo zeroerp_app assente: GRANT saltato';
                  END IF;
              END
              $grant$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP VIEW IF EXISTS dbops.vw_processi_roster;
              DROP FUNCTION IF EXISTS script.fn_get_auth_user_stato(integer);
