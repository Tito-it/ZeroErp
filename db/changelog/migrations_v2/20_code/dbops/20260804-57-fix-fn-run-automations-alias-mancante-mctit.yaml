# Bonifica riferimenti morti — F6
#   Brief: docs/it/dev/work-done/brief-db-bonifica-riferimenti-morti.md
#
#   «elemento FROM per la tabella "n" mancante»: il `FROM pg_namespace` non
#   dichiarava l'alias `n`, che poi le tre condizioni del `WHERE` usano.
#
#   Severita' bassa, e vale la pena dirlo invece di gonfiarla: il ramo e'
#   il fallback «prendi tutti gli schemi» e si prende **solo** se
#   `dbops.automation_scope` e' assente o vuota. Al 2026-08-04 ha 14 righe,
#   quindi il ramo non e' mai stato preso — ed e' il motivo per cui il
#   motore delle automazioni gira da sempre senza accorgersene.
#
#   Resta da riparare perche' e' il ramo di emergenza: si prende il giorno
#   in cui `automation_scope` si svuota, cioe' l'unico giorno in cui
#   nessuno ha voglia di scoprire che non funziona.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20260804-57-fix-fn-run-automations-alias-mancante-mctit.yaml

  - changeSet:
      id: 20260804-57-fix-fn-run-automations-alias-mancante
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        F6 — dbops.fn_run_automations: alias `n` non dichiarato nel FROM del ramo
        fallback «tutti gli schemi». Ramo mai preso finche' dbops.automation_scope
        e' popolata (14 righe oggi), ma e' il ramo di emergenza.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_run_automations(p_exec_mode text DEFAULT 'AUTO'::text, p_schemas text[] DEFAULT NULL::text[], p_dry_run boolean DEFAULT false, p_parts text[] DEFAULT ARRAY['TX_ID'::text, 'AUDIT_UPDATE'::text, 'STORICO'::text, 'LOCK_COLUMNS'::text, 'ATTIVO'::text])
               RETURNS void
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_schemas text[];
                needs_table_rules boolean;
              BEGIN
                -- Orchestratore: calcola scope e chiama le parti richieste.
                -- p_parts: 'TX_ID','AUDIT_UPDATE','STORICO','LOCK_COLUMNS','ATTIVO','CLEANUP' (e 'TABLE_RULES' per compatibilita')

                -- Scope schemi
                IF p_schemas IS NOT NULL THEN
                  v_schemas := p_schemas;
                ELSE
                  IF EXISTS (
                    SELECT 1
                      FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
                    WHERE n.nspname='dbops' AND c.relname='automation_scope' AND c.relkind='r'
                  ) AND EXISTS (SELECT 1 FROM dbops.automation_scope)
                  THEN
                    SELECT array_agg(DISTINCT schema_name) INTO v_schemas
                      FROM dbops.automation_scope;
                  ELSE
                    -- rev 2026-08-04 (bonifica riferimenti morti, F6): il FROM non
                    --   dichiarava l'alias `n` che le tre condizioni del WHERE usano.
                    SELECT array_agg(n.nspname) INTO v_schemas
                      FROM pg_namespace n
                    WHERE n.nspname NOT LIKE 'pg_%'
                      AND n.nspname <> 'information_schema'
                      AND n.nspname <> 'storico';
                  END IF;
                END IF;

                -- Compatibilita': se p_parts contiene 'TABLE_RULES', abilita i moduli tabellari
                needs_table_rules := ('TABLE_RULES' = ANY(p_parts));

                IF needs_table_rules OR 'TX_ID' = ANY(p_parts) THEN
                  PERFORM dbops.fn_run_automations_tx_id(p_exec_mode, v_schemas, p_dry_run);
                END IF;

                IF needs_table_rules OR 'AUDIT_UPDATE' = ANY(p_parts) THEN
                  PERFORM dbops.fn_run_automations_audit_update(p_exec_mode, v_schemas, p_dry_run);
                END IF;

                IF needs_table_rules OR 'STORICO' = ANY(p_parts) THEN
                  PERFORM dbops.fn_run_automations_storico(p_exec_mode, v_schemas, p_dry_run);
                END IF;

                IF needs_table_rules OR 'LOCK_COLUMNS' = ANY(p_parts) THEN
                  PERFORM dbops.fn_run_automations_lock_columns(p_exec_mode, v_schemas, p_dry_run);
                END IF;

                IF 'ATTIVO' = ANY(p_parts) THEN
                  PERFORM dbops.fn_run_automations_attivo(p_exec_mode, v_schemas, p_dry_run);
                END IF;

                IF 'CLEANUP' = ANY(p_parts) THEN
                  PERFORM dbops.fn_run_automations_cleanup(p_exec_mode, v_schemas, p_dry_run);
                END IF;
              END;
              $function$
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              SELECT 1;
