                          END IF;
                          IF v_padre IS NULL THEN
                              -- Nemmeno l'archivio lo conosce: NULL, fail-closed sulla shadow.
                              RETURN NULL;
                          END IF;
                          -- Si continua sulla riga di mappa del padre.
                          RETURN dbops.fn_storico_risolvi_scope(
                                     v_mappa.padre_schema, v_mappa.padre_tabella,
                                     v_padre, p_profondita + 1);
                  END CASE;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_storico_risolvi_scope(
                  dbops.storico_scope_policy.schema_tabella%TYPE,
                  dbops.storico_scope_policy.nome_tabella%TYPE,
                  jsonb,
                  integer) IS
              'Risolve l''emittenti_fiscali.id a cui appartiene la riga (to_jsonb) di una madre storicizzata, seguendo la strada dichiarata in dbops.storico_scope_policy: EF (copia), SR (converte 1:1), BA (l''unico emittente del billing account), PADRE (carica la riga del padre per id — o, se il padre non è più vivo, la sua ULTIMA VERSIONE nello storico: normale in un DELETE a cascata, dove il padre sparisce prima che il figlio scriva — e si richiama, ricorsivamente), NESSUNO (NULL). La chiama il trigger di storico per congelare lo scope nella shadow. ⚠️ SECURITY DEFINER del PROPRIETARIO, non di un superuser: catturare lo scope è un atto di sistema e deve vedere il padre anche quando chi scrive non lo vedrebbe sotto RLS; attraversa la RLS perché chi migra possiede le tabelle (ENABLE senza FORCE), e il pgTAP lo asserisce. Non solleva mai — madre non mappata, colonna vuota, padre sparito danno NULL, fail-closed sulla shadow — tranne su una catena che non termina (E_STORICO_SCOPE_CATENA_CICLICA). Brief: brief-db-rls-storico-scope-congelato §4b. rev 2026-10-09 (brief-db-istanza-nasce-col-ba, decisione di Tid): modo COPPIA — la colonna dichiara due nomi, «<istanza>,<utility>», la chiave di anagrafiche.billing_account (istanza_utility_id, utility_id); il resolver trova il BA della coppia e ne prende l''emittente come nel modo BA, la strada della policy via_coppia. Coppia senza BA o colonna vuota: NULL. Primo adottante: anagrafiche.istanze_dati_precontrattuali (RLS accesa in 28d9beeb6).';
