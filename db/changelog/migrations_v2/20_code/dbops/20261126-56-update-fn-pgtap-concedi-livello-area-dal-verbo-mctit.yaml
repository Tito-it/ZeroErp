# ------------------------------------------------------------
# IL LIVELLO D'AREA DI FIXTURE DAL VERBO DEL SUPER_ADMIN
#   dbops.fn_pgtap_concedi_livello_area
#   Brief: brief-db-porte-aperte-dalla-sola-guc §15 (giro 10-quater; D-AI a, D-AJ a, D-AK a di Tid, 2026-11-27).
#
#   Con config.user_override_aree in sola lettura per l'app (90_end/20261126-62)
#   l'upsert diretto si ferma: la voce la scrive dbops.fn_pgtap_scrivi_override
#   (20261126-55), dal verbo config.fn_imposta_override_aree come SUPER_ADMIN
#   di fixture. ⛔ Firma e ritorno identici (la condizione del BE al 10-bis,
#   §14.5): ritorna l'id della riga, che col verbo e' nuovo a ogni giro.
#   Rollback: il corpo di prima, dal catalogo di dbdev (ultimo 20261125-26).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261126-56-update-fn-pgtap-concedi-livello-area-dal-verbo-mctit.yaml

  - changeSet:
      id: 20261126-56-update-fn-pgtap-concedi-livello-area-dal-verbo
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.fn_pgtap_concedi_livello_area: l'override d'area dal verbo del SUPER_ADMIN (dbops.fn_pgtap_scrivi_override), firma invariata. brief-db-porte-aperte-dalla-sola-guc §15.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_pgtap_concedi_livello_area(
                  p_auth_user_id   config.user_override_aree.auth_user_id%TYPE,
                  p_area_schema_db config.aree_funzionali.schema_db%TYPE,
                  p_livello        config.user_override_aree.livello%TYPE)
               RETURNS config.user_override_aree.id%TYPE
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: dare a un utente di fixture un livello su un'AREA funzionale, con un
              --   override utente valido da oggi e senza scadenza. Gemello di
              --   dbops.fn_pgtap_concedi_azione, per i verbi che chiedono un livello
              --   d'area (script.fn_guard_livello_area) o un livello d'oggetto che ricade
              --   sull'area (script.fn_guard_livello). Solo per i pgTAP.
              -- Uso: PERFORM dbops.fn_pgtap_concedi_livello_area(
              --          (SELECT auth_user_id FROM _mondo), 'vendite', 'TUTTO');
              -- ⚠️ Scrive il livello chiesto, anche piu' basso di quello che c'e': e' cosi'
              --   che un test costruisce il caso «senza il livello» (LETTURA, BLOCCATO).
              -- ⚠️ La scrive il verbo del SUPER_ADMIN (dbops.fn_pgtap_scrivi_override): le
              --   altre voci dell'utente restano, i loro id cambiano.
              DECLARE
                  v_area_id     config.aree_funzionali.id%TYPE;
                  v_override_id config.user_override_aree.id%TYPE;
              BEGIN
                  SELECT af.id INTO v_area_id
                    FROM config.aree_funzionali af
                   WHERE af.schema_db = p_area_schema_db;

                  IF v_area_id IS NULL THEN
                      RAISE EXCEPTION 'fn_pgtap_concedi_livello_area: area funzionale % inesistente', p_area_schema_db;
                  END IF;
                  IF p_auth_user_id IS NULL OR p_livello IS NULL THEN
                      RAISE EXCEPTION 'fn_pgtap_concedi_livello_area: utente e livello obbligatori';
                  END IF;

                  PERFORM dbops.fn_pgtap_scrivi_override(
                      'config.user_override_aree'::regclass, p_auth_user_id,
                      jsonb_build_object('area_id', v_area_id),
                      jsonb_build_object('livello',    p_livello,
                                         'motivo',     'Fixture pgTAP',
                                         'valido_dal', (SELECT script.fn_data_operativa()),
                                         'valido_al',  NULL));

                  SELECT uoa.id INTO v_override_id
                    FROM config.user_override_aree uoa
                   WHERE uoa.auth_user_id = p_auth_user_id
                     AND uoa.area_id      = v_area_id;

                  RETURN v_override_id;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_pgtap_concedi_livello_area(config.user_override_aree.auth_user_id%TYPE, config.aree_funzionali.schema_db%TYPE, config.user_override_aree.livello%TYPE) IS $c$Fixture pgTAP: dà a un utente un livello su un'area funzionale con un override (config.user_override_aree, valido da oggi senza scadenza), idempotente sulla UNIQUE (utente, area): il secondo giro scrive il livello nuovo, anche più basso, ed è così che un test costruisce il caso «senza il livello». Lo scrive il verbo del SUPER_ADMIN config.fn_imposta_override_aree, da dbops.fn_pgtap_scrivi_override: le altre voci dell'utente restano, i loro id cambiano. Ritorna l'id della riga. Area inesistente, utente o livello nulli -> RAISE. Gemello di dbops.fn_pgtap_concedi_azione, per i verbi che chiedono un livello d'area (script.fn_guard_livello_area) o d'oggetto con la ricaduta sull'area (script.fn_guard_livello): l'operatore di dbops.fn_pgtap_crea_emittente_operatore non ha né azioni né aree. Solo per i pgTAP.$c$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_pgtap_concedi_livello_area(
                  p_auth_user_id   config.user_override_aree.auth_user_id%TYPE,
                  p_area_schema_db config.aree_funzionali.schema_db%TYPE,
                  p_livello        config.user_override_aree.livello%TYPE)
               RETURNS config.user_override_aree.id%TYPE
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: dare a un utente di fixture un livello su un'AREA funzionale, con un
              --   override utente valido da oggi e senza scadenza. Gemello di
              --   dbops.fn_pgtap_concedi_azione, per i verbi che chiedono un livello
              --   d'area (script.fn_guard_livello_area) o un livello d'oggetto che ricade
              --   sull'area (script.fn_guard_livello). Solo per i pgTAP.
              -- Uso: PERFORM dbops.fn_pgtap_concedi_livello_area(
              --          (SELECT auth_user_id FROM _mondo), 'vendite', 'TUTTO');
              -- ⚠️ Scrive il livello chiesto, anche piu' basso di quello che c'e': e' cosi'
              --   che un test costruisce il caso «senza il livello» (LETTURA, BLOCCATO).
              DECLARE
                  v_area_id     config.aree_funzionali.id%TYPE;
                  v_override_id config.user_override_aree.id%TYPE;
              BEGIN
                  SELECT af.id INTO v_area_id
                    FROM config.aree_funzionali af
                   WHERE af.schema_db = p_area_schema_db;

                  IF v_area_id IS NULL THEN
                      RAISE EXCEPTION 'fn_pgtap_concedi_livello_area: area funzionale % inesistente', p_area_schema_db;
                  END IF;
                  IF p_auth_user_id IS NULL OR p_livello IS NULL THEN
                      RAISE EXCEPTION 'fn_pgtap_concedi_livello_area: utente e livello obbligatori';
                  END IF;

                  INSERT INTO config.user_override_aree
                         (auth_user_id, area_id, livello, motivo, valido_dal, valido_al)
                  VALUES (p_auth_user_id, v_area_id, p_livello, 'Fixture pgTAP',
                          (SELECT script.fn_data_operativa()), NULL)
                  ON CONFLICT ON CONSTRAINT uq_user_override_aree_user_area
                  DO UPDATE SET livello    = EXCLUDED.livello,
                                valido_dal = (SELECT script.fn_data_operativa()),
                                valido_al  = NULL
                  RETURNING id INTO v_override_id;

                  RETURN v_override_id;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_pgtap_concedi_livello_area(config.user_override_aree.auth_user_id%TYPE, config.aree_funzionali.schema_db%TYPE, config.user_override_aree.livello%TYPE) IS $c$Fixture pgTAP: da' a un utente un livello su un'area funzionale con un override (config.user_override_aree, valido da oggi senza scadenza), idempotente sulla UNIQUE (utente, area): il secondo giro scrive il livello nuovo, anche piu' basso, ed e' cosi' che un test costruisce il caso «senza il livello». Area inesistente, utente o livello nulli -> RAISE. Gemello di dbops.fn_pgtap_concedi_azione, per i verbi che chiedono un livello d'area (script.fn_guard_livello_area) o d'oggetto con la ricaduta sull'area (script.fn_guard_livello): l'operatore di dbops.fn_pgtap_crea_emittente_operatore non ha ne' azioni ne' aree. Solo per i pgTAP.$c$;
