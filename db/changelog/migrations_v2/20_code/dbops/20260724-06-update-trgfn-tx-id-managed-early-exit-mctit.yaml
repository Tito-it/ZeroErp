# trgfn_tx_id_managed: uscita anticipata quando il tx_id e' gia' fornito
#   (brief-db-tx-id-uscita-anticipata.md, 2026-07-24)
#
# COSA CAMBIA: due blocchi gia' presenti a fondo funzione salgono in testa,
#   subito dopo BEGIN, nell'ordine:
#     1. normalizzazione del tx_id "stringa vuota" -> NULL
#     2. IF NEW.tx_id IS NOT NULL THEN RETURN NEW; END IF;
#   Il resto del corpo resta identico riga per riga.
#
# ORDINE VINCOLANTE fra i due: invertirli lascerebbe passare un tx_id "stringa
#   vuota" senza normalizzarlo. Per una colonna UUID quel ramo e' di fatto
#   irraggiungibile (un uuid convertito a testo non e' mai vuoto), ma NON viene
#   rimosso qui: si sposta com'e'. Toglierlo e' una decisione separata.
#
# PERCHE': quando il chiamante fornisce gia' il tx_id, tutto cio' che sta sopra
#   NON ha alcun effetto sul risultato — v_new_tx_id e' consumato solo dalla
#   COALESCE finale, raggiunta unicamente se NEW.tx_id IS NULL. Il trigger e'
#   installato su 280 tabelle: ogni scrittura che porta gia' il proprio tx_id
#   paga una lettura di config.parameters e un giro di rami inutili.
#
# SBLOCCA IL CANALE DI LOG (senza toccare un solo grant). script.fn_log_error_only
#   spedisce via dblink un INSERT su dbops.error_log che fornisce SEMPRE il
#   proprio tx_id. La sessione remota gira con un ruolo ristretto (grant sul solo
#   schema dbops); il trigger, che NON e' SECURITY DEFINER, toccava config e
#   script e falliva con "permesso negato per lo schema script", lasciando gli
#   errori non persistiti. Con l'uscita in testa il trigger ritorna subito e non
#   chiede piu' quei permessi. trg_error_log_gen_tx_id_ins_upd e' l'unico trigger
#   su dbops.error_log (verificato), quindi non restano altri ostacoli.
#
# COSA SI PERDE: il warning W_TXID_NOT_REGISTERED non viene piu' emesso sulle
#   righe che portano gia' il proprio tx_id. E' una diagnosi sulla SESSIONE (la
#   GUC dbops.tx_id impostata con un id non registrato), non sulla riga, quindi
#   basta una sola scrittura della stessa sessione che lasci il tx_id vuoto
#   perche' l'allarme suoni lo stesso. Sul canale di log la perdita e' ZERO: la
#   sessione dblink e' nuova a ogni chiamata e quella GUC non le viene mai
#   impostata (scope locale alla transazione), quindi il warning non poteva
#   scattare ne' prima ne' dopo. Analisi completa nel brief §5.
#
# NON e' una regressione recente: la revisione di novembre 2025 (20251114-04) e
#   quella attuale (20260722-11) leggono entrambe config.parameters come primo
#   statement e chiamano le stesse tre funzioni script.*. L'accoppiamento c'e'
#   dall'origine; e' emerso ora solo perche' i guard nuovi esercitano il log.
#
# Base: doc auto-gen docs/it/dbzero/dbops/funzioni/trgfn_tx_id_managed.md
#   (tre revisioni sovrapposte: un singolo YAML e' stale). Nessun trigger nuovo.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20260724-06-update-trgfn-tx-id-managed-early-exit-mctit.yaml

  - changeSet:
      id: 20260724-06-update-trgfn-tx-id-managed-early-exit
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        trgfn_tx_id_managed: normalizzazione + uscita anticipata spostate in testa.
        Quando il chiamante fornisce gia' il tx_id il trigger ritorna subito, senza
        leggere config.parameters ne' toccare script.*. Sblocca il canale di log
        dblink e toglie lavoro inutile a 280 tabelle. Nessun valore di riga cambia.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.trgfn_tx_id_managed()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_bypass_enabled BOOLEAN := FALSE;
                  v_session_tx_id     UUID;
                  v_new_tx_id      UUID;
              BEGIN
                  -- =========================================================
                  -- USCITA ANTICIPATA (rev 2026-07-24,
                  -- brief-db-tx-id-uscita-anticipata.md).
                  -- Se il chiamante ha gia' valorizzato il tx_id non c'e' niente
                  -- da gestire: tutto il corpo sottostante serve solo a calcolare
                  -- v_new_tx_id, che e' consumato unicamente dalla COALESCE finale
                  -- -- raggiunta solo quando NEW.tx_id IS NULL. Prima questi due
                  -- blocchi stavano in fondo: la funzione faceva il giro completo
                  -- (lettura di config.parameters + rami su script.*) per poi
                  -- restituire NEW invariato.
                  -- Due effetti: il trigger, installato su 280 tabelle, smette di
                  -- pagare lavoro inutile; e la sessione remota del canale di log
                  -- -- che fornisce sempre il proprio tx_id e ha grant sul solo
                  -- schema dbops -- non chiede piu' permessi su config e script.
                  --
                  -- ORDINE VINCOLANTE: la normalizzazione DEVE precedere l'uscita,
                  -- altrimenti un tx_id "stringa vuota" sfuggirebbe. Per una
                  -- colonna UUID e' di fatto irraggiungibile, ma resta dov'era
                  -- nella logica: spostato, non rimosso.
                  -- =========================================================
                  IF NEW.tx_id IS NOT NULL AND NEW.tx_id::text = '' THEN
                    NEW.tx_id := NULL;
                  END IF;

                  IF NEW.tx_id IS NOT NULL THEN
                    RETURN NEW;
                  END IF;

                  BEGIN
                      SELECT default_value::BOOLEAN
                        INTO v_bypass_enabled
                        FROM config.parameters
                      WHERE code = 'tx_id_bypass_enabled';

                      IF NOT FOUND THEN

                          PERFORM script.fn_log_error_only(
                              'database',
                              'dbops.trgfn_tx_id_managed',
                              'ERRORE_PARAMETRI_TABELLA',
                              jsonb_build_object(
                                  'codice_parametro', 'tx_id_bypass_enabled',
                                  'nome_tabella',      'config.parameters',
                                  'action', 'default bypass=false'
                              ),
                                NULL::uuid,
                                'tx_id_bypass_enabled',
                                'config.parameters'
                            );
                      END IF;

                  EXCEPTION WHEN OTHERS THEN

                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          'dbops.trgfn_tx_id_managed',
                          'E_SQL_READ_TABLE',
                          jsonb_build_object(
                            'parameter', 'tx_id_bypass_enabled',
                            'error', SQLERRM
                          ),
                          NULL::uuid,
                          TG_TABLE_NAME::text,
                          SQLERRM::text
                      );

                      RAISE;
                  END;

                  IF NOT v_bypass_enabled THEN
                      BEGIN
                          v_bypass_enabled := current_setting('myapp.bypass_tx_id_check', TRUE)::BOOLEAN;
                      EXCEPTION WHEN OTHERS THEN

                          NULL;
                      END;
                  END IF;

                  BEGIN
                      v_session_tx_id := current_setting('dbops.tx_id', TRUE)::UUID;
                  EXCEPTION WHEN OTHERS THEN
                      v_session_tx_id := NULL;
                  END;

                  IF v_bypass_enabled THEN

                      v_new_tx_id := COALESCE(v_session_tx_id, script.uuid_nil());

                  ELSE
                      IF v_session_tx_id IS NOT NULL THEN

                          PERFORM 1
                            FROM dbops.transaction_ids
                          WHERE id = v_session_tx_id;
                          IF FOUND THEN
                              v_new_tx_id := v_session_tx_id;

                          ELSE
                              -- Caso C) id di sessione non presente nel registro.
                              -- AVVERTE e prosegue con la sentinella: e' il comportamento che
                              -- la guida descrive ("logga WARNING e assegna nil") e che il
                              -- prefisso W_ promette. Prima qui si sollevava, quindi la riga
                              -- uuid_nil() sotto era irraggiungibile e un id non registrato
                              -- bloccava ogni scrittura tracciata.
                              -- Vedi brief-db-coerenza-tx-id-non-registrato.md §4.2.
                              -- NB dal 2026-07-24: questo ramo non viene piu' raggiunto dalle
                              -- righe che portano gia' il proprio tx_id (uscita anticipata in
                              -- testa). Resta la diagnosi di sessione: qualunque altra
                              -- scrittura che lasci il tx_id vuoto la fa scattare lo stesso.
                              PERFORM script.fn_log_error_only(
                                  'database',
                                  'dbops.trgfn_tx_id_managed',
                                  'W_TXID_NOT_REGISTERED',
                                  jsonb_build_object( 'tx_id', v_session_tx_id ),
                                  NULL::uuid,
                                  VARIADIC ARRAY[]::text[]
                              );
                              v_new_tx_id := script.uuid_nil();

                          END IF;

                      ELSE

                          BEGIN

                            v_new_tx_id := dbops.fn_get_or_create_session_tx_id();

                          EXCEPTION WHEN OTHERS THEN

                              PERFORM script.fn_log_and_raise_error(
                                  'database',
                                  'dbops.trgfn_tx_id_managed',
                                  'E_TXID_GENERATION',
                                  jsonb_build_object(
                                    'error', SQLERRM
                                  ) ,
                                  NULL::uuid,
                                  VARIADIC ARRAY[]::text[]
                              );
                              v_new_tx_id := script.uuid_nil();
                          END;
                      END IF;
                  END IF;

                  -- Qui si arriva solo con NEW.tx_id NULL (vedi uscita in testa).
                  NEW.tx_id := COALESCE(
                      NULLIF(current_setting('dbops.tx_id', true), '')::uuid,
                      v_new_tx_id,
                      uuidv7()
                  );
                RETURN NEW;

              END;
              $function$;

              COMMENT ON FUNCTION dbops.trgfn_tx_id_managed()
              IS 'Trigger function di audit: valorizza NEW.tx_id. USCITA ANTICIPATA (rev 2026-07-24, brief-db-tx-id-uscita-anticipata): se NEW.tx_id e'' gia'' valorizzato la funzione normalizza la stringa vuota e ritorna subito, senza leggere config.parameters ne'' toccare script.* -- tutto il corpo sottostante serve solo a calcolare il valore da assegnare quando manca. Conseguenze: niente lavoro inutile sulle 280 tabelle tracciate, e il canale di log dblink (che fornisce sempre il proprio tx_id e ha grant sul solo schema dbops) smette di fallire per permessi. Sulle righe che portano il proprio tx_id non viene piu'' emesso W_TXID_NOT_REGISTERED: e'' una diagnosi di SESSIONE, che qualunque altra scrittura senza tx_id fa scattare comunque. Percorso completo invariato quando NEW.tx_id IS NULL: bypass a due livelli (config.parameters.tx_id_bypass_enabled e GUC myapp.bypass_tx_id_check); se la GUC dbops.tx_id e'' impostata, l''id deve esistere in dbops.transaction_ids -- altrimenti AVVERTE (W_TXID_NOT_REGISTERED, non bloccante) e assegna script.uuid_nil(); se la GUC e'' assente chiama dbops.fn_get_or_create_session_tx_id(). Convenzione: E_ = errore bloccante, W_ = avvertimento. Vedi brief-db-coerenza-tx-id-non-registrato.md.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Rollback: firma invariata (trigger function), nessun overload da
              -- rimuovere. Per tornare alla revisione con i due blocchi in fondo
              -- va ri-applicato il changeset precedente che definisce questa
              -- funzione. ATTENZIONE: quella revisione riporta la lettura di
              -- config.parameters su ogni scrittura tracciata e richiude il
              -- canale di log dblink.
              SELECT 1;
