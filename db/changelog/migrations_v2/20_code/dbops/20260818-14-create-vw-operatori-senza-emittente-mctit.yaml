# ------------------------------------------------------------
# Passo 2 (P-2a) — la vista di diagnostica.
#
# PERCHE' ESISTE. Con il fail-closed, un operatore senza riga in
# config.user_emittenti_fiscali non vede piu' niente. E' il comportamento
# corretto, ma NON si annuncia: non c'e' un errore, c'e' una schermata vuota.
# A differenza di un guard, che dice cosa e' successo, questo difetto e'
# silenzioso per costruzione.
#
# Questa vista lo rende una cosa che si GUARDA invece che una cosa che si
# scopre da una segnalazione. E' la misura DL-A resa permanente: prima
# dell'apply era un conteggio una-tantum, adesso e' un cruscotto.
#
# ⚠️ Deve restare a ZERO righe. Una riga qui e' un operatore configurato a
#    meta', cioe' una persona che apre l'applicazione e non trova niente.
#
# brief-db-perimetro-emittente-liste-e-gerarchia-ba.md
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20260818-14-create-vw-operatori-senza-emittente-mctit.yaml

  - changeSet:
      id: 20260818-14-create-vw-operatori-senza-emittente
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      comment: >
        P-2a: vista di diagnostica con gli operatori configurati a meta' —
        identita' OPERATORE attiva, non super admin, senza riga in
        config.user_emittenti_fiscali. Dopo il fail-closed non vedono nulla, e
        il difetto non si annuncia: questa vista lo rende osservabile. Deve
        restare a zero righe. Brief P-2a punto 3.
      preConditions:
        - onFail: HALT
        - and:
          - tableExists: { schemaName: config, tableName: user_emittenti_fiscali }
          - tableExists: { schemaName: anagrafiche, tableName: identita_digitali }
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW dbops.vw_operatori_senza_emittente AS
              SELECT DISTINCT
                     idg.auth_user_id,
                     sr.id                        AS soggetto_ruolo_id,
                     s.id                         AS soggetto_id,
                     s.ragione_sociale_completa   AS operatore,
                     idg.attivo                   AS identita_attiva
                FROM anagrafiche.identita_digitali idg
                JOIN anagrafiche.soggetti_ruoli sr ON sr.id = idg.soggetto_ruolo_id
                JOIN anagrafiche.soggetti s        ON s.id  = sr.soggetto_id
               WHERE idg.ruolo_applicativo = 'OPERATORE'::config.ruolo_applicativo
                 AND idg.attivo
                 -- Il super admin e' legittimamente senza riga: il suo scope
                 -- passa da fn_is_super_admin, non da questa tabella.
                 AND NOT script.fn_is_super_admin(idg.auth_user_id)
                 AND NOT EXISTS (
                         SELECT 1
                           FROM config.user_emittenti_fiscali uef
                          WHERE uef.auth_user_id = idg.auth_user_id);

              COMMENT ON VIEW dbops.vw_operatori_senza_emittente IS
                  'Diagnostica P-2a: operatori configurati a META'' — identita'' OPERATORE '
                  'attiva, NON super admin, e nessuna riga in config.user_emittenti_fiscali. '
                  'Dal fail-closed del 2026-08-18 queste persone non vedono NULLA, e il difetto '
                  'non si annuncia: nessun errore, solo schermate vuote. ⚠️ DEVE restare a zero '
                  'righe: una riga qui e'' qualcuno che apre l''applicazione e non trova niente. '
                  'Il super admin e'' escluso di proposito (il suo scope passa da '
                  'fn_is_super_admin). Per assegnare l''emittente mancante si usa la funzione di '
                  'dominio script.fn_change_user_emittenti_scope(auth_user_id, ARRAY[ef_id]), '
                  'non un INSERT a mano. Brief perimetro-emittente P-2a.';
      rollback:
        - sql:
            sql: |
              DROP VIEW IF EXISTS dbops.vw_operatori_senza_emittente;
