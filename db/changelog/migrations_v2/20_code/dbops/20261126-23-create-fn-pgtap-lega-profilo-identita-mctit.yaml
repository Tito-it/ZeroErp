# ------------------------------------------------------------
# IL BUILDER DEI pgTAP CHE LEGA UN PROFILO A UN'IDENTITA' DAL VERBO
#   dbops.fn_pgtap_lega_profilo_identita
#   Brief: brief-db-porte-aperte-dalla-sola-guc §14 (giro 10-bis; D-AC a, D-AD b, D-AE a, D-AF a di Tid, 2026-11-26).
#
#   Con la tabella in sola lettura per l'app (90_end/20261126-24), un pgTAP
#   che lega un profilo a un'identita' come fixture non lo fa piu' con un INSERT diretto ne' col verbo
#   da un operatore qualunque. Il builder chiama il verbo vero config.fn_lega_profilo_identita
#   da un SUPER_ADMIN di fixture (dbops.fn_pgtap_entra_come_super_admin,
#   20261126-19) e rimette il contesto, anche in errore: prova il verbo, non lo
#   aggira (come dbops.fn_pgtap_sposta_scope_operatore). Firma e risultato
#   quelli del verbo: un test cambia solo il nome della chiamata.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261126-23-create-fn-pgtap-lega-profilo-identita-mctit.yaml

  - changeSet:
      id: 20261126-23-create-fn-pgtap-lega-profilo-identita
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.fn_pgtap_lega_profilo_identita: lega un profilo a un'identita' nei pgTAP dal verbo config.fn_lega_profilo_identita, da un SUPER_ADMIN di fixture. brief-db-porte-aperte-dalla-sola-guc §14.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_pgtap_lega_profilo_identita(
                  p_profilo_accesso_id   config.profili_accesso_bindings.profilo_accesso_id%TYPE,
                  p_identita_digitale_id config.profili_accesso_bindings.identita_digitale_id%TYPE)
               RETURNS config.profili_accesso_bindings.id%TYPE
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: in un pgTAP, lega un profilo a un'identita' dal verbo config.fn_lega_profilo_identita, da un SUPER_ADMIN di
              --   fixture. Restituisce il risultato del verbo; un rifiuto arriva al test
              --   com'e'. Il contesto di prima si rimette, anche in errore.
              DECLARE
                  v_prima jsonb;  -- il contesto di prima, dalla fixture: nessuna colonna
                  v_esito config.profili_accesso_bindings.id%TYPE;
              BEGIN
                  v_prima := dbops.fn_pgtap_entra_come_super_admin('lega-profilo-identita');

                  BEGIN
                      v_esito := config.fn_lega_profilo_identita(p_profilo_accesso_id, p_identita_digitale_id);
                  EXCEPTION
                      WHEN OTHERS THEN
                          PERFORM dbops.fn_pgtap_rimetti_contesto(v_prima);
                          RAISE;
                  END;

                  PERFORM dbops.fn_pgtap_rimetti_contesto(v_prima);

                  RETURN v_esito;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_pgtap_lega_profilo_identita(p_profilo_accesso_id integer, p_identita_digitale_id bigint)
              IS 'Builder dei pgTAP: lega un''identità digitale a un profilo di accesso dal verbo config.fn_lega_profilo_identita, da un SUPER_ADMIN di fixture (dbops.fn_pgtap_entra_come_super_admin), e rimette il contesto di prima, anche in errore (dbops.fn_pgtap_rimetti_contesto). Argomenti e risultato sono quelli del verbo; un rifiuto del verbo arriva al test com''è.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION IF EXISTS dbops.fn_pgtap_lega_profilo_identita(p_profilo_accesso_id integer, p_identita_digitale_id bigint);
