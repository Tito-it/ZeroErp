# IL VERBO DI CHIUSURA DI UNA TESTATA SOTTO LA PORTA, DAL REGISTRO
#   Brief: brief-modello-documento-vendita §16 (giro 12; L-2 di Tid,
#   2026-10-28).
#
#   Per una testata sotto la porta del modello il framework chiama il suo
#   verbo di chiusura. Fin qui il verbo era scritto nel corpo per UNA testata
#   (IF vendite.contratti -> vendite.fn_cessa_contratti_scaduti, 20261026-08).
#   La versione di listino e' la seconda (regola del 2): il verbo si legge
#   dalla colonna dbops.automazione_chiusura_scadenze.verbo_chiusura
#   (20261028-05; valori nel CSV: il contratto e la versione di listino,
#   vendite.fn_chiudi_versioni_listino_scadute), e l'IF si ritira.
#   * sotto la porta, verbo assente: E_AUTOMAZIONE_CHIUSURA_CONFIG_INVALIDA,
#     motivo porta_senza_verbo_di_chiusura (come prima);
#   * verbo dichiarato ma non una funzione viva senza argomenti: stesso
#     codice, motivo verbo_di_chiusura_inesistente. Fallisce forte.
#   La chiamata e' EXECUTE con l'identificatore risolto da
#   to_regprocedure(...)::regproc: nessun testo del registro finisce nel SQL
#   cosi' com'e'.
#
#   Corpo dal vivo (20261026-08, uguale alla doc auto-generata); firma,
#   sicurezza (INVOKER) e GRANT invariati: CREATE OR REPLACE li conserva.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261028-14-update-fn-apply-chiusura-scadenze-verbo-dal-registro-mctit.yaml

  - changeSet:
      id: 20261028-14-update-fn-apply-chiusura-scadenze-verbo-dal-registro
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.fn_apply_chiusura_scadenze: per una testata sotto la porta del modello chiama il
        verbo di chiusura dichiarato nel registro (verbo_chiusura), non piu' un IF sul contratto.
        Brief: brief-modello-documento-vendita §16 (L-2).
      preConditions:
        - onFail: HALT
        - columnExists:
            schemaName: dbops
            tableName: automazione_chiusura_scadenze
            columnName: verbo_chiusura
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_apply_chiusura_scadenze(p_classe dbops.automazione_chiusura_scadenze.classe%TYPE DEFAULT NULL::text)
               RETURNS jsonb
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
                        -- Scopo:
                        --   Esegue la chiusura di stato per scadenza temporale su
                        --   tutte le tabelle configurate in
                        --   dbops.automazione_chiusura_scadenze (attivo=true).
                        --   Ritorna JSONB con conteggio righe chiuse per tabella
                        --   target + meta-info esecuzione.
                        --
                        -- Algoritmo:
                        --   1. Pre-check struttura: schema/tabella/colonne esistono;
                        --      per tipo_stato=FK anche tabella lookup e codici.
                        --   2. UPDATE dinamico (VARCHAR diretto o FK con lookup id).
                        --   3. Aggregazione conteggio in JSONB.
                        --   4. Audit log dell'esito.
                        --
                        -- Le testate sotto la porta del modello del documento (rev
                        --   2026-10-26, 20261026-08, brief-modello-documento-vendita §11,
                        --   Y-2): lo stato lo scrive solo un verbo, e l'UPDATE dinamico
                        --   sarebbe rifiutato (E_DOC_STATO_SOLO_DAL_VERBO). Per loro il
                        --   framework chiama il verbo di chiusura della testata, dichiarato
                        --   in verbo_chiusura del registro (rev 2026-10-28); una testata
                        --   sotto la porta senza verbo di chiusura e' una configurazione
                        --   non valida. La GUC app.cessazione_automatica e' ritirata: la
                        --   accendeva qui per il guard del contratto, e la poteva accendere
                        --   chiunque.
                        --
                        -- Sicurezza SQL dinamico:
                        --   - format(%I) per identificatori (quote_ident implicito)
                        --   - format(%L) per valori (quote_literal implicito)
                        --   - I valori della config sono comunque controllati
                        --     amministrativamente (Liquibase seed), ma applichiamo
                        --     igiene comunque.
                        DECLARE
                            v_row              dbops.automazione_chiusura_scadenze%ROWTYPE;
                            v_result           jsonb := '{}'::jsonb;
                            v_total            bigint := 0;
                            v_count            bigint;
                            v_target_key       text;
                            v_sql              text;
                            v_id_chiuso        bigint;
                            v_id_attivo        bigint;
                            v_col_count        smallint;
                            v_verbo            regprocedure;  -- il verbo di chiusura, risolto dal catalogo
                        BEGIN
                            FOR v_row IN
                                SELECT *
                                  FROM dbops.automazione_chiusura_scadenze
                                 WHERE attivo = TRUE
                                   -- ⭐ Filtro di CLASSE (2026-09-04). p_classe NULL = tutte, che e'
                                   --   il comportamento storico: il job pgAgent chiama senza argomenti
                                   --   e continua a lavorare tutto. Quando i bersagli di DOMINIO
                                   --   migreranno sulla coda, il chiamante passera' la propria classe
                                   --   e i due mondi smetteranno di mescolarsi.
                                   -- ⛔ Il vero cancello NON e' questo filtro: e' il NOT NULL su
                                   --   `classe` (changeSet -45). Una riga nuova nel CSV deve
                                   --   dichiarare di che natura e', o non entra nemmeno in tabella.
                                   AND (p_classe IS NULL OR classe = p_classe)
                                 ORDER BY id
                            LOOP
                                v_target_key := v_row.schema_tabella || '.' || v_row.nome_tabella;

                                -- =====================================================
                                -- 1) Pre-check: tabella e colonne target
                                -- to_regclass restituisce NULL se la tabella non esiste
                                -- (idiomatico PG, una riga vs JOIN su pg_class/pg_namespace).
                                -- =====================================================
                                IF to_regclass(format('%I.%I', v_row.schema_tabella, v_row.nome_tabella)) IS NULL THEN
                                    PERFORM script.fn_log_and_raise_error(
                                        'database',
                                        'fn_apply_chiusura_scadenze',
                                        'E_AUTOMAZIONE_CHIUSURA_CONFIG_INVALIDA',
                                        jsonb_build_object(
                                            'config_id', v_row.id,
                                            'target',    v_target_key,
                                            'motivo',    'tabella_inesistente'
                                        ),
                                        NULL::uuid,
                                        v_target_key,
                                        'tabella inesistente'
                                    );
                                END IF;

                                -- Verifica esistenza congiunta col_stato + col_valido_al.
                                SELECT count(*)::smallint INTO v_col_count
                                  FROM pg_attribute a
                                  JOIN pg_class    c ON c.oid = a.attrelid
                                  JOIN pg_namespace n ON n.oid = c.relnamespace
                                 WHERE n.nspname = v_row.schema_tabella
                                   AND c.relname = v_row.nome_tabella
                                   AND a.attname IN (v_row.col_stato, v_row.col_valido_al)
                                   AND a.attnum > 0
                                   AND NOT a.attisdropped;

                                IF v_col_count < 2 THEN
                                    PERFORM script.fn_log_and_raise_error(
                                        'database',
                                        'fn_apply_chiusura_scadenze',
                                        'E_AUTOMAZIONE_CHIUSURA_CONFIG_INVALIDA',
                                        jsonb_build_object(
                                            'config_id',     v_row.id,
                                            'target',        v_target_key,
                                            'col_stato',     v_row.col_stato,
                                            'col_valido_al', v_row.col_valido_al,
                                            'motivo',        'colonna_mancante'
                                        ),
                                        NULL::uuid,
                                        v_target_key,
                                        format('colonne %s/%s non trovate',
                                               v_row.col_stato, v_row.col_valido_al)
                                    );
                                END IF;

                                -- =====================================================
                                -- 2) Esecuzione: dispatch su tipo_stato
                                -- =====================================================
                                IF v_row.tipo_stato = 'VARCHAR' THEN
                                    -- UPDATE diretto con valori varchar.
                                    v_sql := format(
                                        $f$
                                        UPDATE %I.%I
                                           SET %I = %L
                                         WHERE %I = %L
                                           AND %I IS NOT NULL
                                           AND %I < (SELECT script.fn_data_operativa())
                                        $f$,
                                        v_row.schema_tabella, v_row.nome_tabella,
                                        v_row.col_stato,      v_row.stato_chiuso_codice,
                                        v_row.col_stato,      v_row.stato_attivo_codice,
                                        v_row.col_valido_al,
                                        v_row.col_valido_al
                                    );

                                    EXECUTE v_sql;
                                    GET DIAGNOSTICS v_count = ROW_COUNT;

                                ELSIF v_row.tipo_stato = 'FK' THEN
                                    -- Pre-check tabella lookup (to_regclass idiomatico).
                                    IF to_regclass(format('%I.%I', v_row.fk_lookup_schema, v_row.fk_lookup_table)) IS NULL THEN
                                        PERFORM script.fn_log_and_raise_error(
                                            'database',
                                            'fn_apply_chiusura_scadenze',
                                            'E_AUTOMAZIONE_CHIUSURA_CONFIG_INVALIDA',
                                            jsonb_build_object(
                                                'config_id',  v_row.id,
                                                'target',     v_target_key,
                                                'fk_lookup',  v_row.fk_lookup_schema || '.' || v_row.fk_lookup_table,
                                                'motivo',     'fk_lookup_inesistente'
                                            ),
                                            NULL::uuid,
                                            v_target_key,
                                            'fk_lookup inesistente'
                                        );
                                    END IF;

                                    -- Lookup combinato id_attivo + id_chiuso in 1 round-trip.
                                    -- MAX(CASE...) e' la classica idempotente "pivot": ritorna
                                    -- l'unico id matching per ciascun codice, NULL se assente.
                                    v_sql := format(
                                        'SELECT max(CASE WHEN %I = %L THEN %I END),'
                                        '       max(CASE WHEN %I = %L THEN %I END)'
                                        '  FROM %I.%I'
                                        ' WHERE %I IN (%L, %L)',
                                        v_row.fk_lookup_codice_col, v_row.stato_attivo_codice, v_row.fk_lookup_id_col,
                                        v_row.fk_lookup_codice_col, v_row.stato_chiuso_codice, v_row.fk_lookup_id_col,
                                        v_row.fk_lookup_schema, v_row.fk_lookup_table,
                                        v_row.fk_lookup_codice_col,
                                        v_row.stato_attivo_codice, v_row.stato_chiuso_codice
                                    );
                                    EXECUTE v_sql INTO v_id_attivo, v_id_chiuso;

                                    IF v_id_chiuso IS NULL THEN
                                        PERFORM script.fn_log_and_raise_error(
                                            'database',
                                            'fn_apply_chiusura_scadenze',
                                            'E_AUTOMAZIONE_CHIUSURA_CONFIG_INVALIDA',
                                            jsonb_build_object(
                                                'config_id',           v_row.id,
                                                'target',              v_target_key,
                                                'stato_chiuso_codice', v_row.stato_chiuso_codice,
                                                'motivo',              'codice_chiuso_non_trovato'
                                            ),
                                            NULL::uuid,
                                            v_target_key,
                                            'codice chiuso non trovato'
                                        );
                                    END IF;

                                    IF v_id_attivo IS NULL THEN
                                        PERFORM script.fn_log_and_raise_error(
                                            'database',
                                            'fn_apply_chiusura_scadenze',
                                            'E_AUTOMAZIONE_CHIUSURA_CONFIG_INVALIDA',
                                            jsonb_build_object(
                                                'config_id',           v_row.id,
                                                'target',              v_target_key,
                                                'stato_attivo_codice', v_row.stato_attivo_codice,
                                                'motivo',              'codice_attivo_non_trovato'
                                            ),
                                            NULL::uuid,
                                            v_target_key,
                                            'codice attivo non trovato'
                                        );
                                    END IF;

                                    -- Una testata sotto la porta: il suo verbo di chiusura
                                    -- (rev 2026-10-26, 20261026-08). La porta si legge dal
                                    -- catalogo, come fa la fixture degli stati.
                                    IF EXISTS (SELECT 1 FROM pg_catalog.pg_trigger tg
                                                WHERE tg.tgrelid = to_regclass(format('%I.%I', v_row.schema_tabella, v_row.nome_tabella))
                                                  AND tg.tgfoid  = 'script.trgfn_doc_stato_solo_dal_verbo()'::regprocedure
                                                  AND NOT tg.tgisinternal) THEN
                                        IF v_row.verbo_chiusura IS NULL THEN
                                            PERFORM script.fn_log_and_raise_error(
                                                'database',
                                                'fn_apply_chiusura_scadenze',
                                                'E_AUTOMAZIONE_CHIUSURA_CONFIG_INVALIDA',
                                                jsonb_build_object(
                                                    'config_id', v_row.id,
                                                    'target',    v_target_key,
                                                    'motivo',    'porta_senza_verbo_di_chiusura'
                                                ),
                                                NULL::uuid,
                                                v_target_key,
                                                'lo stato si scrive solo da un verbo, e la testata non ha il verbo di chiusura'
                                            );
                                        END IF;
                                        
                                        -- Il verbo dichiarato (rev 2026-10-28, 20261028-14): una
                                        -- funzione viva, senza argomenti. L'identificatore lo da' il
                                        -- catalogo, non il testo del registro.
                                        v_verbo := to_regprocedure(v_row.verbo_chiusura || '()');
                                        IF v_verbo IS NULL THEN
                                            PERFORM script.fn_log_and_raise_error(
                                                'database',
                                                'fn_apply_chiusura_scadenze',
                                                'E_AUTOMAZIONE_CHIUSURA_CONFIG_INVALIDA',
                                                jsonb_build_object(
                                                    'config_id',      v_row.id,
                                                    'target',         v_target_key,
                                                    'verbo_chiusura', v_row.verbo_chiusura,
                                                    'motivo',         'verbo_di_chiusura_inesistente'
                                                ),
                                                NULL::uuid,
                                                v_target_key,
                                                'il verbo di chiusura dichiarato non e'' una funzione senza argomenti'
                                            );
                                        END IF;
                                        
                                        EXECUTE format('SELECT %s()', v_verbo::regproc) INTO v_count;
                                    ELSE
                                    -- UPDATE con id risolti.
                                    v_sql := format(
                                        $f$
                                        UPDATE %I.%I
                                           SET %I = %L
                                         WHERE %I = %L
                                           AND %I IS NOT NULL
                                           AND %I < (SELECT script.fn_data_operativa())
                                        $f$,
                                        v_row.schema_tabella, v_row.nome_tabella,
                                        v_row.col_stato,      v_id_chiuso::text,
                                        v_row.col_stato,      v_id_attivo::text,
                                        v_row.col_valido_al,
                                        v_row.col_valido_al
                                    );

                                    EXECUTE v_sql;
                                    GET DIAGNOSTICS v_count = ROW_COUNT;
                                    END IF;
                                ELSE
                                    -- Difesa in profondita': il CHECK constraint
                                    -- esclude gia' tipi diversi, ma per chiarezza.
                                    PERFORM script.fn_log_and_raise_error(
                                        'database',
                                        'fn_apply_chiusura_scadenze',
                                        'E_AUTOMAZIONE_CHIUSURA_CONFIG_INVALIDA',
                                        jsonb_build_object(
                                            'config_id',  v_row.id,
                                            'target',     v_target_key,
                                            'tipo_stato', v_row.tipo_stato,
                                            'motivo',     'tipo_stato_non_gestito'
                                        ),
                                        NULL::uuid,
                                        v_target_key,
                                        v_row.tipo_stato
                                    );
                                    v_count := 0;
                                END IF;

                                -- =====================================================
                                -- 3) Aggregazione risultato
                                -- =====================================================
                                v_result := v_result || jsonb_build_object(v_target_key, v_count);
                                v_total  := v_total + v_count;
                            END LOOP;

                            -- Meta-info.
                            v_result := v_result
                                        || jsonb_build_object('_total', v_total)
                                        || jsonb_build_object('_executed_at', now());

                            -- =====================================================
                            -- 4) Audit log esecuzione (best-effort, non blocca)
                            -- Pattern progetto: dbops.fn_audit_log_once con parametri named.
                            -- WHEN OTHERS perche' un fallimento di audit non deve
                            -- propagarsi: il caller (job pgAgent) deve comunque
                            -- ricevere il JSONB con i conteggi.
                            -- =====================================================
                            BEGIN
                                PERFORM dbops.fn_audit_log_once(
                                    p_function_name => 'dbops.fn_apply_chiusura_scadenze',
                                    p_status        => 'INFO',
                                    p_params        => v_result
                                );
                            EXCEPTION WHEN OTHERS THEN
                                NULL;
                            END;

                            RETURN v_result;
                        END;
                        $function$;

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION dbops.fn_apply_chiusura_scadenze(dbops.automazione_chiusura_scadenze.classe%TYPE)
                IS 'Framework di chiusura per scadenza: chiude lo stato gestionale (CHIUSA/CESSATO) sulle tabelle configurate in dbops.automazione_chiusura_scadenze quando valido_al < CURRENT_DATE. ⭐ Rev 2026-09-04: prende p_classe e lavora SOLO i bersagli di quella classe. p_classe NULL = tutte, che e'' il comportamento storico — il job pgAgent chiama senza argomenti e non e'' stato toccato. ⛔ Il filtro NON e'' il cancello: il cancello e'' il NOT NULL su automazione_chiusura_scadenze.classe, che obbliga ogni riga nuova a dichiarare la propria natura. Il filtro serve quando i bersagli di DOMINIO migreranno sulla coda (lavoro di backend): da li'' il worker chiamera'' con DOMINIO e pgAgent con AMMINISTRAZIONE, e i due mondi smetteranno di mescolarsi. Brief: brief-db-processi-automatici-identita-e-perimetro §6. ⭐ rev 2026-10-26 (20261026-08, brief-modello-documento-vendita §11, Y-2): una testata sotto la porta del modello del documento (script.trgfn_doc_stato_solo_dal_verbo) non si chiude con l''UPDATE dinamico ma col suo verbo di chiusura, oggi il contratto (vendite.fn_cessa_contratti_scaduti); sotto la porta senza verbo: E_AUTOMAZIONE_CHIUSURA_CONFIG_INVALIDA. La GUC app.cessazione_automatica e'' ritirata. ⭐ rev 2026-10-28 (20261028-14, brief-modello-documento-vendita §16, L-2): il verbo di chiusura si legge da dbops.automazione_chiusura_scadenze.verbo_chiusura (il contratto e la versione di listino), non piu'' da un IF sul contratto; verbo assente o non una funzione viva senza argomenti: E_AUTOMAZIONE_CHIUSURA_CONFIG_INVALIDA.';
