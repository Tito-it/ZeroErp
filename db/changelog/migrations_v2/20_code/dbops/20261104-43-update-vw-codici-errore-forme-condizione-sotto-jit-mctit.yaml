# ------------------------------------------------------------
# dbops.vw_codici_errore_forme_condizione: la stessa misura, sotto la soglia
# di ottimizzazione del JIT.
#   Brief: brief-db-revisione-dbops, D56 (giro 1, blocco 1a), seguito di 20261104-29.
#
# ── IL DIFETTO, VISTO DA TID DOPO L'APPLY ───────────────────────────────
#   dbops/test-vw-codici-errore-motivo-nominato, che legge la vista dieci
#   volte, era diventato lento. Misura sullo scratch, 2026-11-04: una lettura
#   da ~730 ms a ~1.170 ms, e ~300 ms di quei 1.170 sono compilazione JIT
#   (inlining + ottimizzazione).
#   La causa e' la STIMA, non il lavoro: il 20261104-29 portava i codici di una
#   riga in un array e lo espandeva con unnest, che dichiara 10 righe per
#   chiamata (vere: 0,15). Il costo stimato saliva da ~297.000 a ~789.000,
#   oltre jit_optimize_above_cost (500.000): sopra quella soglia PostgreSQL
#   non compila soltanto, ottimizza e inlinea, e lo paga a ogni lettura.
#   E' la trappola per cui esiste dbops.fn_regexp_occorrenze (ROWS 1).
#
# ── LA CURA ──────────────────────────────────────────────────────────────
#   - in `marcata` la riga porta solo il flag `ha_codice`;
#   - in `classificato`, dopo le window function, le occorrenze si estraggono
#     con dbops.fn_regexp_occorrenze, che dichiara 1 riga, e solo sulle righe
#     che hanno un codice e passano i filtri;
#   - n_punti conta le coppie distinte (riga, codice): due volte lo stesso
#     codice sulla stessa riga resta un punto solo, come col DISTINCT di prima.
#   Output identico al -29 (EXCEPT nei due versi sullo scratch, e i test 9 e
#   10 di test-vw-codici-errore-motivo-nominato verdi). COMMENT invariato.
#   ⛔ security_invoker si ripete: un CREATE OR REPLACE che non lo dice lo azzera.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261104-43-update-vw-codici-errore-forme-condizione-sotto-jit-mctit.yaml

  - changeSet:
      id: 20261104-43-update-vw-codici-errore-forme-condizione-sotto-jit
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.vw_codici_errore_forme_condizione estrae i codici di una riga con dbops.fn_regexp_occorrenze
        (ROWS 1) invece di unnest di un array (ROWS 10): la stima torna sotto la soglia di ottimizzazione
        del JIT. Output invariato.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'dbops' AND p.proname = 'fn_regexp_occorrenze';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW dbops.vw_codici_errore_forme_condizione
              WITH (security_invoker=true) AS
              WITH righe AS (
                       SELECT (n.nspname)::text AS sch, (p.proname)::text AS fn, p.oid, l.riga, l.n
                         FROM ((pg_proc p
                           JOIN pg_namespace n ON ((n.oid = p.pronamespace)))
                           CROSS JOIN LATERAL regexp_split_to_table((dbops.fn_corpo_funzione(p.oid) COLLATE "C"), '
              '::text) WITH ORDINALITY l(riga, n))
                        WHERE ((p.prolang = ( SELECT pg_language.oid FROM pg_language WHERE (pg_language.lanname = 'plpgsql'::name)))
                           AND (n.nspname <> ALL (ARRAY['pg_catalog'::name, 'information_schema'::name])))
                      ), marcata AS (
                       SELECT r.sch, r.fn, r.oid, r.riga, r.n,
                          (r.riga ~* 'fn_log_and_raise_error'::text) AS e_chiamata,
                          (r.riga ~* '^\s*(IF|ELSIF|ELSE|EXCEPTION\s+WHEN|WHEN\s+OTHERS|WHEN\s+SQLSTATE)\M'::text) AS e_guardia,
                          (r.riga ~ '''codice''\s*,\s*''E_[A-Z0-9_]+'''::text) AS e_motivo,
                          -- la riga nomina almeno un codice: le occorrenze si
                          -- estraggono in `classificato`, dopo le window function
                          (r.riga ~ '''E_[A-Z0-9_]+'''::text) AS ha_codice
                         FROM righe r
                      ), isole AS (
                       SELECT m.*,
                          count(*) FILTER (WHERE m.e_guardia) OVER (PARTITION BY m.oid ORDER BY m.n) AS isola,
                          bool_or(m.e_chiamata) OVER (PARTITION BY m.oid ORDER BY m.n ROWS BETWEEN 6 PRECEDING AND CURRENT ROW) AS chiamata_vicina
                         FROM marcata m
                      ), propagata AS (
                       SELECT i.*,
                          first_value(i.riga) OVER (PARTITION BY i.oid, i.isola ORDER BY i.n) AS guardia,
                          first_value(i.n) OVER (PARTITION BY i.oid, i.isola ORDER BY i.n) AS n_guardia
                         FROM isole i
                      ), classificato AS (
                       SELECT o.m[1] AS codice, p.oid, p.n, ((p.sch || '.'::text) || p.fn) AS funzione,
                              CASE
                                  WHEN (p.guardia ~* '(EXCEPTION\s+WHEN|WHEN\s+OTHERS|WHEN\s+SQLSTATE)'::text) THEN 'ECCEZIONE'::text
                                  WHEN (p.guardia ~* '^\s*IF\s+NOT\s+FOUND\M'::text) THEN 'NOT_FOUND'::text
                                  WHEN ((p.guardia ~* '(\mIS\s+NULL\M|<=\s*0|<\s*0)'::text) AND (p.guardia ~* '\mp_\w+\M(?!\s*\.)'::text)) THEN 'PARAMETRO'::text
                                  WHEN (p.guardia ~* 'NOT\s+IN\s*\('::text) THEN 'ENUM'::text
                                  WHEN (p.guardia ~* '(<>|!=|=)\s*''[A-Za-z0-9_]+'''::text) THEN 'VALORE_ATTESO'::text
                                  ELSE 'IGNOTO'::text
                              END AS famiglia
                         FROM propagata p
                         -- TUTTI i codici della riga. ⚠️ dbops.fn_regexp_occorrenze e
                         -- non unnest di un array: unnest dichiara 10 righe (vere: 0,15),
                         -- la stima del piano passava la soglia di ottimizzazione del JIT
                         -- e ogni lettura pagava ~300 ms di compilazione.
                         CROSS JOIN LATERAL dbops.fn_regexp_occorrenze(p.riga, '''(E_[A-Z0-9_]+)'''::text) AS o(m)
                        WHERE (p.ha_codice AND (p.chiamata_vicina OR p.e_motivo) AND (p.isola > 0) AND ((p.n - p.n_guardia) <= 25))
                      )
               SELECT codice,
                  -- un punto per (riga, codice): lo stesso codice due volte sulla
                  -- stessa riga e' un punto solo
                  (count(DISTINCT (oid, n)))::integer AS n_punti,
                  (count(DISTINCT funzione))::integer AS n_funzioni,
                  array_agg(DISTINCT famiglia ORDER BY famiglia) AS famiglie,
                  (count(DISTINCT famiglia))::integer AS n_famiglie,
                  (count(DISTINCT famiglia) FILTER (WHERE (famiglia <> 'IGNOTO'::text)))::integer AS n_famiglie_note,
                  bool_and((famiglia = 'IGNOTO'::text)) AS solo_ignoto
                 FROM classificato
                GROUP BY codice;
      rollback:
        - sql:
            dbms: postgresql
            sql: |
              -- Il verso di ritiro e' un changeSet nuovo dal corpo di 20261104-29.
              SELECT 1;
