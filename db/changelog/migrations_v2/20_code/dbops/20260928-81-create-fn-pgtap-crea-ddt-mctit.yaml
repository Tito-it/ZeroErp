# P-15 — Fixture pgTAP: una bolla in bozza, pronta a ricevere righe
#   dbops.fn_pgtap_crea_ddt(p_billing_account_id, p_destinatario_sr_id,
#                           p_causale_codice, p_magazzino_id, p_magazzino_arrivo_id)
#   Brief: brief-db-magazzino-lotto-3-scarico-da-ddt, sezione 5
#
# -- PERCHE' UN HELPER ----------------------------------------------------------------------------
#   Tre file del Lotto 3 (scarico, trasferimento, testata) costruiscono bolle
#   con la stessa sequenza — testata dell'emittente di chi agisce, causale
#   scelta, indirizzi obbligatori — ed e' la sequenza che le fixture di vendite
#   ricopiano a mano, PESCANDO billing account e soggetto dal database: su un
#   database da zero (CI) quelle fixture non trovano niente e muoiono (guida
#   pgTAP, «il mondo si costruisce, non si cerca»). Qui il cliente lo passa il
#   test, dal suo dbops.fn_pgtap_crea_mondo_cliente. Regola del 2.
#
# -- COSA FA E COSA NO ----------------------------------------------------------------------------
#   La testata in DRAFT con l'emittente dell'operatore in sessione, la causale
#   di trasporto per CODICE (config.causali_trasporto non ha codice_interno:
#   linee-guida-sql §6d, la chiave stabile per-design e' il codice del seed), i
#   magazzini passati (NULL = il default del predefinito, D-L3-h), gli indirizzi
#   obbligatori per l'ambito DDT. Le righe restano al test: sono il suo caso.
#   Esce con i vincoli IMMEDIATE, come ogni helper.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20260928-81-create-fn-pgtap-crea-ddt-mctit.yaml

  - changeSet:
      id: 20260928-81-create-fn-pgtap-crea-ddt
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Fixture pgTAP dbops.fn_pgtap_crea_ddt: una bolla in bozza dell'emittente dell'operatore in
        sessione, con la causale di trasporto per codice, i magazzini scelti e gli indirizzi
        obbligatori; le righe restano al test. Brief: brief-db-magazzino-lotto-3-scarico-da-ddt,
        sezione 5.
      preConditions:
        - onFail: HALT
        - columnExists:
            schemaName: vendite
            tableName: ddt
            columnName: magazzino_arrivo_id
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_pgtap_crea_ddt(
                  p_billing_account_id  vendite.ddt.billing_account_id%TYPE,
                  p_destinatario_sr_id  vendite.ddt.destinatario_soggetto_ruolo_id%TYPE,
                  p_causale_codice      config.causali_trasporto.codice%TYPE,
                  p_magazzino_id        vendite.ddt.magazzino_id%TYPE DEFAULT NULL,
                  p_magazzino_arrivo_id vendite.ddt.magazzino_arrivo_id%TYPE DEFAULT NULL)
               RETURNS vendite.ddt.id%TYPE
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: una bolla in bozza per un pgTAP, costruita e non pescata.
              -- Uso: v_ddt := dbops.fn_pgtap_crea_ddt(<ba>, <sr cliente>, 'VENDITA', <mag>);
              DECLARE
                  v_ef      vendite.ddt.emittente_fiscale_id%TYPE;
                  v_draft   config.stati_doc_ddt.id%TYPE;
                  v_causale config.causali_trasporto.id%TYPE;
                  v_utility vendite.ddt.utility_id%TYPE;
                  v_valuta  vendite.ddt.valuta_id%TYPE;
                  v_id      vendite.ddt.id%TYPE;
              BEGIN
                  v_ef := script.fn_pgtap_emittente_operatore();
                  IF v_ef IS NULL THEN
                      RAISE EXCEPTION 'fn_pgtap_crea_ddt: nessun emittente per l''operatore in sessione — chiamare prima fn_pgtap_set_contesto_operatore';
                  END IF;
                  SELECT s.id INTO v_draft FROM config.stati_doc_ddt s WHERE s.codice_interno = 'DRAFT' AND s.attivo;
                  SELECT c.id INTO v_causale FROM config.causali_trasporto c WHERE c.codice = p_causale_codice AND c.attivo;
                  IF v_draft IS NULL OR v_causale IS NULL THEN
                      RAISE EXCEPTION 'fn_pgtap_crea_ddt: stato DRAFT o causale di trasporto % assenti — sono seed di 80_data', p_causale_codice;
                  END IF;
                  SELECT ba.utility_id INTO v_utility FROM anagrafiche.billing_account ba WHERE ba.id = p_billing_account_id;
                  SELECT v.id INTO v_valuta FROM config.valute v ORDER BY v.id LIMIT 1;

                  INSERT INTO vendite.ddt (data, stato_doc_ddt_id, destinatario_soggetto_ruolo_id,
                                           billing_account_id, utility_id, valuta_id, emittente_fiscale_id,
                                           causale_trasporto_id, magazzino_id, magazzino_arrivo_id,
                                           storicizza, meta)
                  VALUES (CURRENT_DATE, v_draft, p_destinatario_sr_id,
                          p_billing_account_id, v_utility, v_valuta, v_ef,
                          v_causale, p_magazzino_id, p_magazzino_arrivo_id,
                          false, jsonb_build_object('test_scope', 'pgtap_crea_ddt'))
                  RETURNING id INTO v_id;

                  -- Gli indirizzi che l'emissione pretende per l'ambito DDT.
                  INSERT INTO vendite.ddt_indirizzi (ddt_id, tipo_indirizzo_id, snapshot)
                  SELECT v_id, ti.id, '{"display":"pgtap"}'::jsonb
                    FROM config.tipi_indirizzi ti
                   WHERE ti.codice_interno = ANY (script.fn_indirizzi_obbligatori_mancanti('DDT', NULL))
                  ON CONFLICT DO NOTHING;

                  SET CONSTRAINTS ALL IMMEDIATE;
                  RETURN v_id;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_pgtap_crea_ddt(bigint, bigint, character varying, bigint, bigint) IS
                  'Fixture pgTAP: una bolla in DRAFT dell''emittente dell''operatore in sessione '
                  '(script.fn_pgtap_emittente_operatore), per il cliente passato dal test (dal suo '
                  'fn_pgtap_crea_mondo_cliente: costruito, non pescato), con la causale di trasporto '
                  'per CODICE, i magazzini scelti (NULL = il default del predefinito, D-L3-h) e gli '
                  'indirizzi obbligatori dell''ambito DDT. Le righe restano al test. Esce con i '
                  'vincoli IMMEDIATE. Solo per i pgTAP (brief-db-magazzino-lotto-3-scarico-da-ddt, '
                  'sezione 5).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS dbops.fn_pgtap_crea_ddt(bigint, bigint, character varying, bigint, bigint);
