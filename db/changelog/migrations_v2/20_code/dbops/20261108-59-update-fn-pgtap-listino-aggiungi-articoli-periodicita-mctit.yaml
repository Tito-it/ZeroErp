# dbops.fn_pgtap_listino_aggiungi_articoli: la periodicita' delle righe, facoltativa.
#   Brief: brief-db-revisione-dbops, D69 (giro 8, blocco 8c).
#
# Base: doc auto-generata del 2026-11-07, verificata uguale al vivo dello scratch.
#
# ⚠️ PERCHE'. Le righe nascevano senza periodicita' anche su una quota fissa a
#   canone, che dal motivo 3 di script.fn_check_versione_listino_attivabile non
#   lascia attivare la versione: un test non aveva modo di darla. Nasce
#   p_periodicita, in coda e con DEFAULT NULL: le chiamate di oggi (per
#   posizione, tre argomenti) restano valide. Firma nuova: DROP + CREATE nello
#   stesso changeSet (nessun dipendente nel catalogo: la chiamano per nome
#   dbops.fn_pgtap_crea_listino e i pgTAP, risolti a ogni chiamata). I GRANT
#   li ridanno i privilegi di default e il loop dei grant. Firma con %TYPE.
#   COMMENT al presente (§5d). Presidio: dbops/test-fn-pgtap-crea-listino-v1.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261108-59-update-fn-pgtap-listino-aggiungi-articoli-periodicita-mctit.yaml

  - changeSet:
      id: 20261108-59-update-fn-pgtap-listino-aggiungi-articoli-periodicita
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.fn_pgtap_listino_aggiungi_articoli: p_periodicita facoltativa (D69).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'dbops' AND p.proname = 'fn_pgtap_listino_aggiungi_articoli'
                 AND pg_catalog.pg_get_function_identity_arguments(p.oid) LIKE '%uuid[]%'
                 AND p.pronargs = 3;
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION dbops.fn_pgtap_listino_aggiungi_articoli(
                  vendite.listini_righe.listino_versione_id%TYPE, uuid[], vendite.listini_righe.prezzo%TYPE);

              CREATE FUNCTION dbops.fn_pgtap_listino_aggiungi_articoli(
                  p_listino_versione_id vendite.listini_righe.listino_versione_id%TYPE,
                  p_articoli            uuid[],
                  p_prezzo              vendite.listini_righe.prezzo%TYPE DEFAULT 100,
                  p_periodicita         vendite.listini_righe.periodicita%TYPE DEFAULT NULL)
               RETURNS void
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              -- Scopo: mettere degli articoli in una versione di listino, per le
              --   fixture pgTAP che scrivono OVERRIDE o ESCLUSIONE, o che vogliono un
              --   listino col loro prezzo.
              -- ⚠️ p_periodicita: la periodicita' delle righe. Una quota fissa a canone
              --   (vendite.fn_articolo_quota_fissa_a_canone) senza periodicita' non
              --   lascia attivare la versione (script.fn_check_versione_listino_attivabile):
              --   il test che la mette in listino la da'.
              DECLARE
                  v_tipologia vendite.listini.tipologia_id%TYPE;
              BEGIN
                  SELECT l.tipologia_id INTO v_tipologia
                    FROM vendite.listini_versioni lv
                    JOIN vendite.listini l ON l.id = lv.listino_id
                   WHERE lv.id = p_listino_versione_id;
                  IF v_tipologia IS NULL THEN
                      RAISE EXCEPTION
                          'fn_pgtap_listino_aggiungi_articoli: versione di listino % assente o senza tipologia',
                          p_listino_versione_id;
                  END IF;

                  UPDATE catalogo.articoli a
                     SET listino_tipologia_id = v_tipologia
                   WHERE a.id = ANY (p_articoli)
                     AND a.listino_tipologia_id IS DISTINCT FROM v_tipologia;

                  INSERT INTO vendite.listini_righe (listino_versione_id, articolo_id, uom_id, prezzo, periodicita)
                  SELECT p_listino_versione_id, a.id, a.uom_id, p_prezzo, p_periodicita
                    FROM catalogo.articoli a
                   WHERE a.id = ANY (p_articoli);
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_pgtap_listino_aggiungi_articoli(vendite.listini_righe.listino_versione_id%TYPE, uuid[], vendite.listini_righe.prezzo%TYPE, vendite.listini_righe.periodicita%TYPE) IS
                  'Fixture pgTAP: mette degli articoli in una versione di listino, una riga attiva per articolo con la unita'' di misura base, il prezzo dato (p_prezzo, default 100) e la periodicita'' data (p_periodicita, default nessuna). Allinea prima la tipologia dell''articolo a quella del listino, se diversa (su un articolo gia'' usato la tipologia non cambia: va chiamato prima di usarlo). La periodicita'' serve a una quota fissa a canone (vendite.fn_articolo_quota_fissa_a_canone): senza, la versione non si attiva (script.fn_check_versione_listino_attivabile). La usano le fixture che scrivono OVERRIDE o ESCLUSIONE, che pretendono l''articolo nel listino del documento, e dbops.fn_pgtap_crea_listino per la riga d''appoggio. Versione inesistente o senza tipologia: RAISE EXCEPTION. INVOKER.';
      rollback:
        - sql:
            dbms: postgresql
            sql: |
              -- Il verso di ritiro e' un changeSet nuovo dal corpo della doc auto-generata
              -- del 2026-11-07.
              SELECT 1;
