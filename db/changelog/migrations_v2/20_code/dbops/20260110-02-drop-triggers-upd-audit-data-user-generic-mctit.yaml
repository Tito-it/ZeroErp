databaseChangeLog:
  - logicalFilePath: /migrations_v2/20_code/dbops/20260110-02-drop-triggers-upd-audit-data-user-generic-mctit.yaml

  - changeSet:
      id: 20260110-02-drop-triggers-upd-audit-data-user-generic
      author: mctit
      # runOnChange: true
      validCheckSum:
        - ANY
      comment: >
        Rimuove i trigger basati su script.trgfn_audit_data_user_generic
        per evitare duplicazioni con la generazione automatica.

      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |

              DO $$
              DECLARE
                r_trg record;
              BEGIN
                FOR r_trg IN
                  SELECT n.nspname AS table_schema,
                         c.relname AS table_name,
                         t.tgname  AS trigger_name
                    FROM pg_trigger t
                    JOIN pg_class c ON c.oid = t.tgrelid
                    JOIN pg_namespace n ON n.oid = c.relnamespace
                    JOIN pg_proc p ON p.oid = t.tgfoid
                    JOIN pg_namespace pn ON pn.oid = p.pronamespace
                   WHERE NOT t.tgisinternal
                     AND pn.nspname = 'script'
                     AND p.proname  = 'trgfn_audit_data_user_generic'
                LOOP
                  EXECUTE format(
                    'DROP TRIGGER IF EXISTS %I ON %I.%I',
                    r_trg.trigger_name,
                    r_trg.table_schema,
                    r_trg.table_name
                  );
                END LOOP;
              END$$;

