# dbops: i lettori di app.current_user_id passano a script.fn_utente_di_sessione.
#   Brief: brief-db-revisione-ui (§3.6-sexies, giro 8; Q60 (a)).
#
# Il perche': ognuna convertiva la GUC da se',
#   NULLIF(current_setting('app.current_user_id', true), '')::integer, e un
#   valore che non e' un intero dava il 22P02 grezzo. Ora la legge il BB
#   (20261123-16): assente o vuota resta NULL, come prima; un valore che non
#   e' l'id di un utente da' E_SCRIPT_CHIAMATA_NON_VALIDA, col nome della
#   funzione che legge.
# Funzioni: fn_accoda_lavoro e i builder pgTAP fn_pgtap_apri_area_per_nascita,
#   fn_pgtap_azienda_di_chi_agisce, fn_pgtap_crea_ddt_da_ordine,
#   fn_pgtap_crea_mondo_cliente, fn_pgtap_crea_ordine_con_righe,
#   fn_pgtap_crea_preventivo_con_righe, fn_pgtap_porta_a_stato,
#   fn_pgtap_scope_operatore.
# Testata ri-ancorata dove era nuda (linee-guida §5g): p_id di
#   fn_pgtap_porta_a_stato porta la ragione sulla sua riga.
# Cambia solo la lettura. Corpo dal vivo (dbdev, 2026-11-23); firma, RETURNS e
#   attributi dall'ultimo changeSet che ha ancora i %TYPE. Firma, volatilita',
#   sicurezza, proprietario e GRANT invariati: CREATE OR REPLACE. La rollback
#   riporta i corpi di prima.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261123-22-update-lettori-utente-di-sessione-dbops-mctit.yaml

  - changeSet:
      id: 20261123-22-update-lettori-utente-di-sessione-dbops
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops: le funzioni che leggono app.current_user_id passano a script.fn_utente_di_sessione invece di
        convertire la GUC da se'. Brief: brief-db-revisione-ui (§3.6-sexies, Q60).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "10"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE (n.nspname, p.proname) IN (('script', 'fn_utente_di_sessione'), ('dbops', 'fn_accoda_lavoro'), ('dbops', 'fn_pgtap_apri_area_per_nascita'), ('dbops', 'fn_pgtap_azienda_di_chi_agisce'), ('dbops', 'fn_pgtap_crea_ddt_da_ordine'), ('dbops', 'fn_pgtap_crea_mondo_cliente'), ('dbops', 'fn_pgtap_crea_ordine_con_righe'), ('dbops', 'fn_pgtap_crea_preventivo_con_righe'), ('dbops', 'fn_pgtap_porta_a_stato'), ('dbops', 'fn_pgtap_scope_operatore'))
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_accoda_lavoro(
                  p_job_type        dbops.coda_lavori.job_type%TYPE,
                  p_payload         dbops.coda_lavori.payload%TYPE         DEFAULT '{}'::jsonb,
                  p_run_as          dbops.coda_lavori.run_as%TYPE          DEFAULT NULL,
                  p_scope           dbops.coda_lavori.scope%TYPE           DEFAULT NULL,
                  p_idempotency_key dbops.coda_lavori.idempotency_key%TYPE DEFAULT NULL,
                  p_priorita        dbops.coda_lavori.priorita%TYPE        DEFAULT 100,
                  p_run_after       dbops.coda_lavori.run_after%TYPE       DEFAULT NULL,
                  p_max_tentativi   dbops.coda_lavori.max_tentativi%TYPE   DEFAULT NULL,
                  p_origine         dbops.coda_lavori.origine%TYPE         DEFAULT 'API')
               RETURNS dbops.coda_lavori.id%TYPE
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              DECLARE
                  v_tipo         dbops.coda_lavori_tipi%ROWTYPE;
                  v_classe       dbops.processi.classe%TYPE;
                  v_run_as       dbops.coda_lavori.run_as%TYPE;
                  v_max_tent     dbops.coda_lavori.max_tentativi%TYPE;
                  v_emittente    dbops.coda_lavori.emittente_fiscale_id%TYPE;
                  v_id           dbops.coda_lavori.id%TYPE;
                  v_vivo_run_as  dbops.coda_lavori.run_as%TYPE;
                  v_vivo_emitt   dbops.coda_lavori.emittente_fiscale_id%TYPE;
                  v_da_app       boolean;
                  -- ⚠️ `integer` esplicito: django.auth_user.id, a cui il DB non si lega.
                  v_chiamante    integer;
                  -- ⚠️ `bigint[]` esplicito: elementi = anagrafiche.emittenti_fiscali.id.
                  v_perimetro    bigint[];
              BEGIN
                  -- Scopo: la porta della coda. Valida il tipo, risolve i
                  --   default, controlla classe e scope, scrive l'azienda del
                  --   lavoro, accoda idempotente sui lavori vivi. SECURITY
                  --   DEFINER: vede tutte le righe, quindi controlla da se' chi
                  --   puo' accodare che cosa (vedi testata del changeSet).

                  -- Guard parametro: job_type obbligatorio e non vuoto.
                  IF p_job_type IS NULL OR btrim(p_job_type) = '' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'dbops.fn_accoda_lavoro', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_job_type'),
                          NULL::uuid, 'p_job_type obbligatorio');
                  END IF;

                  -- Guard: tipo registrato in coda_lavori_tipi.
                  SELECT * INTO v_tipo
                    FROM dbops.coda_lavori_tipi
                   WHERE codice = p_job_type;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'dbops.fn_accoda_lavoro', 'E_JOB_TYPE_NON_TROVATO',
                          jsonb_build_object('job_type', p_job_type),
                          NULL::uuid, p_job_type);
                  END IF;

                  -- Guard: tipo attivo (l'handler dev'essere registrato lato BE).
                  IF NOT v_tipo.attivo THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'dbops.fn_accoda_lavoro', 'E_JOB_TYPE_NON_ATTIVO',
                          jsonb_build_object('job_type', p_job_type),
                          NULL::uuid, p_job_type);
                  END IF;

                  -- Default per tipo, se non passati.
                  v_run_as   := COALESCE(p_run_as, v_tipo.run_as_default);
                  v_max_tent := COALESCE(p_max_tentativi, v_tipo.max_tentativi_default);

                  -- Guard di classe: il default del tipo e' un suggerimento che
                  --   p_run_as sovrascrive; un lavoro di DOMINIO resta OPERATORE.
                  --   La classe si legge dal registro dei processi, non da una
                  --   copia. ⚠️ Sotto-select scalare: un tipo senza processo da' NULL
                  --   e il ramo non scatta (processo_codice e' NOT NULL, ma qui non
                  --   si assume).
                  v_classe := (SELECT pr.classe
                                 FROM dbops.processi pr
                                WHERE pr.codice = v_tipo.processo_codice);

                  IF v_classe = 'DOMINIO' AND v_run_as <> 'OPERATORE' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'dbops.fn_accoda_lavoro',
                          'E_JOB_DOMINIO_SENZA_OPERATORE',
                          jsonb_build_object('job_type', p_job_type,
                                             'run_as', v_run_as,
                                             'processo_codice', v_tipo.processo_codice),
                          NULL::uuid, p_job_type, v_run_as);
                  END IF;

                  -- Guard run_as <-> scope (messaggio parlante prima del CHECK):
                  --   un OPERATORE senza scope girerebbe senza identita'. Il caso
                  --   simmetrico (SISTEMA con scope) lo copre il CHECK.
                  IF v_run_as = 'OPERATORE' AND p_scope IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'dbops.fn_accoda_lavoro', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_scope', 'run_as', v_run_as),
                          NULL::uuid, 'p_scope obbligatorio per run_as=OPERATORE');
                  END IF;

                  -- Un lavoro OPERATORE appartiene a un'azienda: l'emittente
                  --   attivo di chi l'ha accodato, catturato nello scope.
                  IF v_run_as = 'OPERATORE' THEN
                      v_emittente := (p_scope ->> 'emittente_attivo_id')::bigint;
                      IF v_emittente IS NULL THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', 'dbops.fn_accoda_lavoro',
                              'E_CODA_LAVORO_SENZA_EMITTENTE',
                              jsonb_build_object('job_type', p_job_type,
                                                 'parametro', 'p_scope'),
                              NULL::uuid, p_job_type);
                      END IF;
                  END IF;

                  -- Chi chiama. ⭐ Da una sessione dell'applicazione la porta
                  --   controlla cio' che la policy controllerebbe; fuori la
                  --   raggiunge solo il proprietario (l'esecuzione e' tolta a
                  --   PUBLIC), cioe' le procedure di pgAgent e la migrazione.
                  --   ⚠️ session_user e non current_user: qui dentro current_user
                  --   e' il proprietario, sempre.
                  v_da_app := CASE
                                  WHEN EXISTS (SELECT 1 FROM pg_catalog.pg_roles
                                                WHERE rolname = 'zeroerp_app')
                                  THEN pg_catalog.pg_has_role(session_user, 'zeroerp_app', 'MEMBER')
                                  ELSE false
                              END;

                  IF v_da_app THEN
                      v_chiamante := script.fn_utente_di_sessione('dbops.fn_accoda_lavoro');
                      v_perimetro := script.fn_get_emittenti_scope_pk_ids(v_chiamante);

                      IF v_run_as = 'OPERATORE'
                         AND (v_chiamante IS NULL
                              OR current_setting('app.ruolo_applicativo', true) IS DISTINCT FROM 'OPERATORE'
                              OR (p_scope ->> 'auth_user_id')::integer IS DISTINCT FROM v_chiamante
                              OR NOT script.fn_scope_ef_perimetro(v_perimetro, v_emittente)) THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', 'dbops.fn_accoda_lavoro', 'E_CODA_SCOPE_ALTRUI',
                              jsonb_build_object('job_type', p_job_type,
                                                 'emittente_fiscale_id', v_emittente,
                                                 'scope_auth_user_id', p_scope ->> 'auth_user_id',
                                                 'chiamante', v_chiamante),
                              NULL::uuid, p_job_type);
                      END IF;
                  END IF;

                  -- ⛔ D9: il ciclo dell'upsert. L'unique parziale
                  --   uq_coda_lavori_vivo_idem assorbe il doppione vivo (stessa
                  --   job_type + idempotency_key in PENDING/IN_CORSO); se il vivo
                  --   si chiude fra l'INSERT e la rilettura, si riprova l'INSERT.
                  LOOP
                      INSERT INTO dbops.coda_lavori (
                          job_type, payload, run_as, scope, emittente_fiscale_id,
                          origine, priorita, stato, max_tentativi, run_after,
                          idempotency_key
                      ) VALUES (
                          p_job_type,
                          COALESCE(p_payload, '{}'::jsonb),
                          v_run_as,
                          p_scope,
                          v_emittente,
                          p_origine,
                          COALESCE(p_priorita, 100::smallint),
                          'PENDING',
                          v_max_tent,
                          p_run_after,
                          p_idempotency_key
                      )
                      ON CONFLICT (job_type, idempotency_key)
                          WHERE idempotency_key IS NOT NULL
                            AND stato IN ('PENDING', 'IN_CORSO')
                          DO NOTHING
                      RETURNING id INTO v_id;

                      EXIT WHEN v_id IS NOT NULL;

                      -- Conflitto: il lavoro vivo con la stessa chiave.
                      SELECT c.id, c.run_as, c.emittente_fiscale_id
                        INTO v_id, v_vivo_run_as, v_vivo_emitt
                        FROM dbops.coda_lavori c
                       WHERE c.job_type = p_job_type
                         AND c.idempotency_key = p_idempotency_key
                         AND c.stato IN ('PENDING', 'IN_CORSO')
                       ORDER BY c.id
                       LIMIT 1;

                      IF v_id IS NOT NULL THEN
                          -- ⛔ La porta vede oltre la policy: restituisce solo cio'
                          --   che chi chiama potrebbe vedere. Un lavoro SISTEMA non
                          --   ha azienda, e lo si accoda anche da operatore.
                          IF v_da_app
                             AND v_vivo_run_as = 'OPERATORE'
                             AND NOT script.fn_scope_ef_perimetro(v_perimetro, v_vivo_emitt) THEN
                              PERFORM script.fn_log_and_raise_error(
                                  'database', 'dbops.fn_accoda_lavoro', 'E_CODA_CHIAVE_ALTRUI',
                                  jsonb_build_object('job_type', p_job_type,
                                                     'idempotency_key', p_idempotency_key),
                                  NULL::uuid, p_job_type, p_idempotency_key);
                          END IF;
                          EXIT;
                      END IF;
                      -- Il vivo si e' chiuso nel frattempo: si riprova l'INSERT.
                  END LOOP;

                  RETURN v_id;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_pgtap_apri_area_per_nascita(
                  p_app_label  config.user_override_oggetti.app_label%TYPE,
                  p_model_name config.user_override_oggetti.model_name%TYPE)
               RETURNS jsonb  -- il ricordo dell'override di prima: nessuna colonna di cui sia il riflesso
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: dare all'operatore in sessione TUTTO sull'oggetto per il tempo
              --   di una nascita fatta da un builder. Ritorna il ricordo di cio' che
              --   c'era, da passare a dbops.fn_pgtap_richiudi_area; NULL se il livello
              --   c'era gia'.
              -- Uso: v_ricordo := dbops.fn_pgtap_apri_area_per_nascita('magazzino', 'magazzini');
              --      ... il verbo ...
              --      PERFORM dbops.fn_pgtap_richiudi_area(v_ricordo);
              DECLARE
                  v_utente  config.user_override_aree.auth_user_id%TYPE;
                  v_area    config.aree_funzionali.schema_db%TYPE;
                  v_area_id config.aree_funzionali.id%TYPE;
                  v_prima   config.user_override_aree%ROWTYPE;
                  v_ov      config.user_override_aree.id%TYPE;
              BEGIN
                  v_utente := script.fn_utente_di_sessione('dbops.fn_pgtap_apri_area_per_nascita');
                  IF v_utente IS NULL THEN
                      RAISE EXCEPTION 'fn_pgtap_apri_area_per_nascita: nessun operatore in sessione — chiamare prima fn_pgtap_set_contesto_operatore';
                  END IF;

                  v_area := script.fn_area_di_oggetto(p_app_label, p_model_name);
                  IF script.fn_resolve_livello_oggetto(v_utente, p_app_label, p_model_name, v_area)
                         IS NOT DISTINCT FROM 'TUTTO'::config.livello_accesso THEN
                      RETURN NULL;
                  END IF;

                  SELECT af.id INTO v_area_id
                    FROM config.aree_funzionali af
                   WHERE af.schema_db = v_area;
                  IF v_area_id IS NULL THEN
                      RAISE EXCEPTION 'fn_pgtap_apri_area_per_nascita: nessuna area funzionale per %.%', p_app_label, p_model_name;
                  END IF;

                  -- Un override d'area che c'e' (del test, o del database) si alza per
                  -- il tempo della nascita e si rimette com'era: se ne tiene il ricordo.
                  SELECT * INTO v_prima
                    FROM config.user_override_aree uoa
                   WHERE uoa.auth_user_id = v_utente
                     AND uoa.area_id      = v_area_id;

                  IF v_prima.id IS NULL THEN
                      INSERT INTO config.user_override_aree
                             (auth_user_id, area_id, livello, motivo, valido_dal, valido_al)
                      VALUES (v_utente, v_area_id, 'TUTTO',
                              'Fixture pgTAP: nascita di ' || p_app_label || '.' || p_model_name,
                              (SELECT script.fn_data_operativa()), NULL)
                      RETURNING id INTO v_ov;
                  ELSE
                      UPDATE config.user_override_aree uoa
                         SET livello    = 'TUTTO',
                             valido_dal = (SELECT script.fn_data_operativa()),
                             valido_al  = NULL
                       WHERE uoa.id = v_prima.id;
                      v_ov := v_prima.id;
                  END IF;

                  -- Un override sull'OGGETTO resta sotto il tetto: lo si dice.
                  IF script.fn_resolve_livello_oggetto(v_utente, p_app_label, p_model_name, v_area)
                         IS DISTINCT FROM 'TUTTO'::config.livello_accesso THEN
                      RAISE EXCEPTION 'fn_pgtap_apri_area_per_nascita: %.% non arriva a TUTTO anche con l''area aperta (override d''oggetto)',
                                      p_app_label, p_model_name;
                  END IF;

                  RETURN jsonb_build_object(
                      'override_id', v_ov,
                      'nuovo',       v_prima.id IS NULL,
                      'livello',     v_prima.livello,
                      'valido_dal',  v_prima.valido_dal,
                      'valido_al',   v_prima.valido_al);
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_pgtap_azienda_di_chi_agisce(
                   -- il nome del builder che chiede, per i messaggi: tipo nudo.
                   p_chiamante text DEFAULT 'dbops.fn_pgtap_azienda_di_chi_agisce'::text)
               RETURNS TABLE(
                   emittente_fiscale_id        anagrafiche.emittenti_fiscali.id%TYPE,
                   emittente_codice            anagrafiche.emittenti_fiscali.codice%TYPE,
                   emittente_soggetto_ruolo_id anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE,
                   auth_user_id                anagrafiche.identita_digitali.auth_user_id%TYPE,
                   identita_id                 anagrafiche.identita_digitali.id%TYPE)
               LANGUAGE plpgsql
               STABLE
               SECURITY INVOKER
              AS $function$
              -- Scopo: l'azienda su cui una fixture scrive quando un contesto
              --   e' gia' aperto: quella di CHI AGISCE, con la regola di
              --   produzione. Estratta dal «ramo B» di
              --   dbops.fn_pgtap_crea_mondo_cliente (rev 20261024-37).
              DECLARE
                  v_user_id   anagrafiche.identita_digitali.auth_user_id%TYPE;
                  v_identita  anagrafiche.identita_digitali.id%TYPE;
                  v_ef_id     anagrafiche.emittenti_fiscali.id%TYPE;
                  v_ef_codice anagrafiche.emittenti_fiscali.codice%TYPE;
                  v_ef_sr_id  anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE;
              BEGIN
                  -- La domanda e' «c'e' un contesto?», alla GUC che le policy
                  -- leggono davvero.
                  v_user_id := script.fn_utente_di_sessione('dbops.fn_pgtap_azienda_di_chi_agisce');
                  IF v_user_id IS NULL THEN
                      RAISE EXCEPTION
                          '%: nessun contesto aperto (app.current_user_id): l''azienda di chi agisce non c''e''. Si costruisce prima il mondo (dbops.fn_pgtap_crea_mondo_cliente) o si apre il contesto (script.fn_pgtap_set_contesto_operatore)',
                          p_chiamante;
                  END IF;

                  -- ⭐ L'azienda di chi agisce con la regola di produzione: l'emittente
                  --   scelto in alto (app.current_emittente_id) se l'utente lo puo'
                  --   usare, altrimenti la sua riga in config.user_emittenti_fiscali.
                  --   E' la stessa domanda che fa il trigger z90 quando lega il BA.
                  SELECT ef.id, ef.codice, ef.soggetto_ruolo_id
                    INTO v_ef_id, v_ef_codice, v_ef_sr_id
                    FROM anagrafiche.emittenti_fiscali ef
                   WHERE ef.id = script.fn_resolve_emittente_for_user(v_user_id);
                  -- ⚠️ Guard sul RISULTATO: un operatore senza riga in
                  --   user_emittenti_fiscali e' fail-closed dal 2026-08-18 (P-2a);
                  --   un super admin non ha azienda finche' non ne sceglie una.
                  IF v_ef_id IS NULL THEN
                      RAISE EXCEPTION
                          '%: l''utente di contesto (auth_user_id = %) non ha un''azienda su cui scrivere: ne'' una riga in config.user_emittenti_fiscali ne'' un emittente scelto (app.current_emittente_id, per il super admin). Aprire il contesto senza argomento (script.fn_pgtap_set_contesto_operatore()), scegliere l''emittente, o costruire il mondo PRIMA del contesto',
                          p_chiamante, v_user_id;
                  END IF;

                  -- Una sola riga per costruzione: uq_identita_digitali_auth_user_ruolo_attivo
                  -- e' UNIQUE su (auth_user_id, ruolo_applicativo) WHERE attivo.
                  SELECT idg.id
                    INTO v_identita
                    FROM anagrafiche.identita_digitali idg
                   WHERE idg.auth_user_id = v_user_id
                     AND idg.ruolo_applicativo = 'OPERATORE'::config.ruolo_applicativo
                     AND idg.attivo;
                  IF v_identita IS NULL THEN
                      RAISE EXCEPTION
                          '%: nessuna identita'' OPERATORE attiva per auth_user_id = %: il contesto e'' aperto su un utente che l''applicazione non farebbe entrare',
                          p_chiamante, v_user_id;
                  END IF;

                  RETURN QUERY
                  SELECT v_ef_id, v_ef_codice, v_ef_sr_id, v_user_id, v_identita;
              END;
              $function$;
        - sql:
            dbms: postgresql
