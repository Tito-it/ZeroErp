# Helper di fixture pgTAP: una FILIALE BANCARIA — il soggetto della banca, il
#   suo ruolo BANK_B e la filiale — in una chiamata sola.
#
# ── ⛔ PERCHE' UN BUILDER, e non tre copie ───────────────────────────
#   `anagrafiche.bank_branches` e' **vuota** su un database ricostruito: e'
#   dato di macchina, non seed di 80_data. Tre file di `pagamenti` la pescano
#   (`enti-incasso-conto-incasso`, `enti-incasso-psp`,
#   `sistemazioni-giro-completo`) e in CI muoiono su
#   «bank_branch_id viola il vincolo non nullo».
#   ⇒ E' la regola del 2: alla seconda copia si estrae, e le copie si ritirano
#   nello STESSO giro.
#
# ── ⚠️ E ha la sua TRAPPOLA D'ORDINE, che e' il criterio di questi BB ─
#   La catena e' una saga: il soggetto della banca, il suo ruolo BANK_B coi
#   suoi indirizzi obbligatori, e solo allora la filiale. I guard di quel
#   layer sono DEFERRABLE INITIALLY DEFERRED, e il preambolo dei pgTAP mette i
#   vincoli IMMEDIATE: senza riaprire la finestra la catena muore a meta'.
#   Chi la ricopia deve saperlo — ed e' esattamente cio' che un builder
#   toglie dalle spalle del file.
#
# ── ⭐ COSA NON ENTRA ────────────────────────────────────────────────
#   Il conto bancario (`anagrafiche.conti_bancari`) e il suo legame col
#   soggetto NO: l'IBAN e il titolare sono il CASO del test — i tre file ne
#   scrivono ognuno uno diverso, e uno di loro ne vuole due.
#
# Permessi: funzione di chi migra, non SECURITY DEFINER, non in
# dbops.sec_functions_owner. Stessa forma di 20260909-31 e 20260923-04.
# Brief: brief-db-fixture-che-costruiscono-giro-2.md §10, lotto 1.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20260923-05-create-fn-pgtap-crea-filiale-bancaria-mctit.yaml

  - changeSet:
      id: 20260923-05-create-fn-pgtap-crea-filiale-bancaria
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Helper di fixture pgTAP: dbops.fn_pgtap_crea_filiale_bancaria()
        costruisce soggetto della banca, ruolo BANK_B e filiale dentro la
        finestra dei vincoli differiti, e ne ritorna le chiavi.
        anagrafiche.bank_branches e' dato di macchina: su un database
        ricostruito e' vuota, e i tre file di pagamenti che la pescavano
        morivano sul NOT NULL di bank_branch_id.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_pgtap_crea_filiale_bancaria(
                  p_etichetta text DEFAULT 'pgTAP'
              )
               RETURNS TABLE (
                  bank_branch_id          anagrafiche.bank_branches.id%TYPE,
                  banca_soggetto_ruolo_id anagrafiche.bank_branches.soggetto_ruolo_id%TYPE,
                  banca_soggetto_id       anagrafiche.soggetti.id%TYPE
               )
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: dare a una fixture pgTAP una filiale bancaria su cui
              --   agganciare un conto. `anagrafiche.bank_branches` e' dato di
              --   MACCHINA: su un database ricostruito e' vuota, e pescarne una
              --   e' copertura zero.
              -- Uso:
              --   CREATE TEMP TABLE tmp_banca AS
              --   SELECT * FROM dbops.fn_pgtap_crea_filiale_bancaria('enti incasso');
              -- ⛔ Il CONTO non lo scrive: IBAN e titolare sono il caso del test.
              -- ⚠️ Esce con i vincoli IMMEDIATE, come ogni helper.
              DECLARE
                  v_sog uuid;
                  v_sr  anagrafiche.bank_branches.soggetto_ruolo_id%TYPE;
                  v_br  anagrafiche.bank_branches.id%TYPE;
              BEGIN
                  -- ⛔ LA FINESTRA DIFFERITA: il ruolo BANK_B ha i suoi indirizzi
                  --   obbligatori e un guard differito, e il preambolo dei pgTAP
                  --   mette i vincoli IMMEDIATE. Senza queste righe la catena
                  --   muore a meta', e l'errore parla di indirizzi a chi voleva
                  --   una banca.
                  SET CONSTRAINTS ALL DEFERRED;

                  v_sog := dbops.fn_pgtap_crea_soggetto_pg('Banca ' || p_etichetta);
                  v_sr  := dbops.fn_pgtap_crea_soggetto_ruolo(
                               v_sog, 'BANK_B'::character varying);

                  -- ⚠️ I codici possono essere fissi: l'unicita' e'
                  --   (soggetto_ruolo, bank_code, branch_code), e il soggetto
                  --   ruolo e' nuovo a ogni chiamata.
                  INSERT INTO anagrafiche.bank_branches
                      (soggetto_ruolo_id, bank_code, branch_code, name, attivo)
                  VALUES (v_sr, '01234', '56789',
                          'Filiale pgTAP ' || p_etichetta, TRUE)
                  RETURNING id INTO v_br;

                  -- Saga completa: i guard differiti scattano QUI, su un mondo
                  -- finito. Senza la richiusura il ROLLBACK del test se li
                  -- porterebbe via NON verificati.
                  SET CONSTRAINTS ALL IMMEDIATE;

                  RETURN QUERY SELECT v_br, v_sr, v_sog;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_pgtap_crea_filiale_bancaria(text)
              IS 'Fixture pgTAP: una filiale bancaria costruita — soggetto della banca, ruolo BANK_B coi suoi indirizzi obbligatori, e la filiale — dentro la finestra dei vincoli differiti, che e'' la trappola per cui questo builder esiste. ⚠️ anagrafiche.bank_branches e'' dato di MACCHINA, non seed di 80_data: su un database ricostruito e'' vuota, e i tre file di pagamenti che la pescavano morivano sul NOT NULL di bank_branch_id. ⛔ Il conto bancario NON lo scrive: IBAN e titolare sono il caso del test. ⚠️ Esce con i vincoli IMMEDIATE, come ogni helper. Brief: brief-db-fixture-che-costruiscono-giro-2.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS dbops.fn_pgtap_crea_filiale_bancaria(text);
