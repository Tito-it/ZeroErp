# ⭐ IL PANORAMA DICE LA CAUSA, NON SOLO LO STATO.
#   Brief: brief-db-presidio-processi-testo-per-causa §3 B.1 (forma B, Tid 2026-10-09)
#
# ── Che cosa e' successo ─────────────────────────────────────────────
#   2026-10-09, pannello Processi automatici: `listen_permessi` MUTO, e il testo
#   del presidio diceva «il timer di quel processo non sta girando… lancialo a
#   mano con Esegui ora». E' un servizio sempre acceso: non ha timer, e «Esegui
#   ora» per lui non esiste. Il guasto vero era la connessione persa dopo il
#   riavvio di Postgres.
#
# ── Il difetto, sul modello ─────────────────────────────────────────
#   Due stati hanno due cause, con due rimedi e spesso due persone diverse:
#     MUTO         COMMAND + GIORNALE  → il timer non gira piu'      TIMER_FERMO
#                  COMMAND + SESSIONE  → servizio spento o scollegato SERVIZIO_GIU
#     MAI_PARTITO  COMMAND + GIORNALE  → timer mai installato         TIMER_NON_INSTALLATO
#                  PGAGENT             → il programmatore non gira    JOB_MAI_PARTITO
#   Dove lo stato basta, la causa E' lo stato: NON_PROGRAMMATO, JOB_ASSENTE,
#   JOB_SPENTO, GIRA_E_NON_REGISTRA. Otto cause, otto testi (80_data,
#   presidi_testi.csv): il testo lo sceglie la causa, attraverso
#   dbops.presidi.colonna_variante = 'causa'.
#   ⛔ Non si accorpano cause con rimedi diversi sotto una etichetta: sarebbe
#     lo stesso difetto spostato di un livello.
#
# ── ⭐ UN CASE SOLO, CHE DICE DUE COSE ──────────────────────────────
#   Ogni ramo consegna la COPPIA [stato, causa] (`verdetto`, text[2]), e le due
#   colonne la proiettano. Un secondo CASE per la causa farebbe due elenchi
#   degli stessi casi — e il giorno in cui un ramo cambia in uno, l'altro
#   resta indietro senza che niente se ne accorga.
#   ⭐ E per lo stesso motivo `da_guardare` diventa `causa IS NOT NULL`: un
#   ramo sano (OK, FUORI_PORTATA, SU_RICHIESTA) non ha causa, uno guasto ce
#   l'ha per costruzione. Il `NOT IN ('OK','FUORI_PORTATA','SU_RICHIESTA')` era
#   un secondo elenco degli stati sani scritto accanto al CASE; ora il guasto
#   e' DEFINITO dall'avere una causa, e non puo' esistere una riga da guardare
#   senza il suo rimedio. Il risultato e' identico ramo per ramo (lo prova il
#   pgTAP: ogni causa costruita e' da guardare, ogni stato sano no).
#
# ⚠️ Stesse colonne, stesso ordine, `causa` IN CODA: CREATE OR REPLACE VIEW.
#   Corpo dal 20260914-01, che e' l'ultima revisione e coincide con la doc
#   auto-gen (docs/it/dbzero/dbops/views/vw_processi_programmazione.md,
#   verificato 2026-10-09). Nessuna reloption da ripetere: la vista non ha
#   security_invoker (doc auto-gen senza «Opzioni di sicurezza»).
# ⚠️ Lettori del contratto: dbops.fn_guardiano_digest legge `stato` (invariato),
#   la vista sorella _da_guardare (20261009-35 le aggiunge `causa`), il backend
#   (processi_repository, presidi_repository) per nome di colonna.
#
# Verifica: db/pgtap/dbops/test-presidio-processi-testo-per-causa-v1.sql
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261009-34-update-vw-processi-programmazione-causa-mctit.yaml

  - changeSet:
      id: 20261009-34-update-vw-processi-programmazione-causa
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.vw_processi_programmazione: colonna `causa` in coda, piu' fine di
        `stato` dove lo stato ha due cause (MUTO, MAI_PARTITO), calcolata nello
        stesso ramo del CASE che produce lo stato; `da_guardare` = la riga ha
        una causa. brief-db-presidio-processi-testo-per-causa §3 B.1.
      preConditions:
        - onFail: HALT
        - and:
            - viewExists:
                schemaName: dbops
                viewName: vw_processi_programmazione
            - columnExists:
                schemaName: dbops
                tableName: processi
                columnName: segno_di_vita
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW dbops.vw_processi_programmazione AS
              WITH panorama AS (
                  SELECT p.codice AS processo_codice,
                         p.classe,
                         p.canale,
                         p.jobname_pgagent,
                         p.tolleranza_minuti,
                         p.segno_di_vita,
                         g.abilitato          AS job_abilitato,
                         g.prossima_esecuzione AS prossima_corsa,
                         g.ultima_esecuzione  AS pgagent_ultima_corsa,
                         l.ultima_corsa       AS giornale_ultima_corsa,
                         l.ultima_corsa_pgagent,
                         l.ultimo_esito,
                         s.viva_dal           AS sessione_viva_dal,
                         -- ⭐ [stato, causa]: un ramo, due fatti. La causa e'
                         --   NULL solo sui rami sani, ed e' cio' che li fa sani
                         --   (vedi `da_guardare`). Rev 2026-10-09.
                         CASE
                             WHEN p.canale = 'CODA' THEN ARRAY['SU_RICHIESTA', NULL]
                             -- ⭐ Un COMMAND con CONTRATTO: il database sa che
                             --   cosa aspettarsi, e lo confronta.
                             -- ⛔ Il verdetto poggia su s.viva (ESISTE una sessione),
                             --   non su s.viva_dal: backend_start e' mascherato a
                             --   chi non e' lo stesso utente della sessione ne'
                             --   pg_read_all_stats, e «NULL» li' vuol dire «non
                             --   ti e' dato vedere», non «non c'e'». Rev 2026-09-14.
                             -- ⭐ Un servizio sempre acceso non ha timer: se tace e'
                             --   spento, o acceso ma senza connessione al database.
                             WHEN p.canale = 'COMMAND' AND p.segno_di_vita = 'SESSIONE' THEN
                                 CASE WHEN s.viva THEN ARRAY['OK', NULL]
                                      ELSE ARRAY['MUTO', 'SERVIZIO_GIU'] END
                             WHEN p.canale = 'COMMAND' AND p.tolleranza_minuti IS NOT NULL THEN
                                 CASE
                                     -- Il timer dichiarato e mai installato.
                                     WHEN l.ultima_corsa IS NULL
                                         THEN ARRAY['MAI_PARTITO', 'TIMER_NON_INSTALLATO']
                                     -- Era vivo, e il suo timer ha smesso.
                                     WHEN l.ultima_corsa
                                          < now() - make_interval(mins => p.tolleranza_minuti)
                                         THEN ARRAY['MUTO', 'TIMER_FERMO']
                                     ELSE ARRAY['OK', NULL]
                                 END
                             -- ⚠️ Senza contratto resta un limite di VISTA, come
                             --   prima: la sveglia vive fuori e nessuno l'ha
                             --   dichiarata qui.
                             WHEN p.canale = 'COMMAND' THEN ARRAY['FUORI_PORTATA', NULL]
                             -- Dove lo stato identifica gia' la causa, la causa E'
                             -- lo stato.
                             WHEN p.jobname_pgagent IS NULL
                                 THEN ARRAY['NON_PROGRAMMATO', 'NON_PROGRAMMATO']
                             WHEN g.abilitato IS NULL
                                 THEN ARRAY['JOB_ASSENTE', 'JOB_ASSENTE']
                             WHEN g.abilitato IS FALSE
                                 THEN ARRAY['JOB_SPENTO', 'JOB_SPENTO']
                             WHEN g.ultima_esecuzione IS NOT NULL
                                  AND COALESCE(l.ultima_corsa_pgagent, '-infinity'::timestamptz)
                                      < g.ultima_esecuzione - interval '1 hour'
                                 THEN ARRAY['GIRA_E_NON_REGISTRA', 'GIRA_E_NON_REGISTRA']
                             -- Il job e' acceso e non e' mai girato: e' il
                             -- programmatore pgAgent che non gira, non un timer.
                             WHEN g.ultima_esecuzione IS NULL
                                 THEN ARRAY['MAI_PARTITO', 'JOB_MAI_PARTITO']
                             ELSE ARRAY['OK', NULL]
                         END::text[] AS verdetto
                    FROM dbops.processi p
                    LEFT JOIN LATERAL dbops.fn_get_pgagent_job_stato(p.jobname_pgagent)
                         g(abilitato, ultima_esecuzione, prossima_esecuzione) ON true
                    LEFT JOIN LATERAL (
                        SELECT max(r.started_at) AS ultima_corsa,
                               max(r.started_at) FILTER (WHERE r.origine::text = 'PGAGENT')
                                   AS ultima_corsa_pgagent,
                               (SELECT r2.ok
                                  FROM maintenance.job_run_log r2
                                 WHERE r2.processo_codice = p.codice OR r2.jobname = p.codice
                                 ORDER BY r2.started_at DESC, r2.id DESC
                                 LIMIT 1) AS ultimo_esito
                          FROM maintenance.job_run_log r
                         WHERE r.processo_codice = p.codice OR r.jobname = p.codice
                    ) l ON true
                    -- ⭐ SESSIONE: il segno di vita e' una connessione, non una riga.
                    --   Il processo si presenta con il proprio codice.
                    -- ⚠️ pg_stat_activity mostra a TUTTI la riga della sessione
                    --   (pid, usename, application_name), ma MASCHERA le altre
                    --   colonne — backend_start compresa — a chi non e' lo
                    --   stesso utente ne' pg_read_all_stats. Una vista non cambia
                    --   l'utente che pg_stat_get_activity() guarda. Percio':
                    --   `viva` = esiste la riga (visibile a chiunque, e' il
                    --   verdetto); `viva_dal` = da quando (informazione, NULL a
                    --   chi non puo' leggerla). Il 14-09 il digest ha contato un
                    --   MUTO su listen_cambio_reparto VIVO da 31 ore: contava
                    --   come titodb, e la sessione era di zeroerp_app.
                    LEFT JOIN LATERAL (
                        SELECT count(*) > 0          AS viva,
                               min(a.backend_start)  AS viva_dal
                          FROM pg_stat_activity a
                         WHERE p.segno_di_vita = 'SESSIONE'
                           AND a.datname = current_database()
                           AND a.application_name = p.codice
                    ) s ON true
                   WHERE p.attivo AND p.obsoleto_dal IS NULL
              )
              SELECT processo_codice,
                     classe,
                     canale,
                     jobname_pgagent,
                     job_abilitato,
                     prossima_corsa,
                     pgagent_ultima_corsa,
                     giornale_ultima_corsa,
                     ultimo_esito,
                     verdetto[1] AS stato,
                     -- ⛔ Il criterio del guasto sta nel CASE: e' guasto cio'
                     --   che ha una causa. Rev 2026-10-09 — prima era un NOT IN
                     --   sugli stati sani, cioe' un secondo elenco.
                     (verdetto[2] IS NOT NULL) AS da_guardare,
                     ultima_corsa_pgagent AS giornale_ultima_corsa_pgagent,
                     -- Colonne nuove, IN CODA.
                     tolleranza_minuti,
                     segno_di_vita,
                     -- ⭐ L'ultimo segno di vita che il verdetto ha usato: la
                     --   corsa per GIORNALE, l'avvio della sessione per SESSIONE.
                     -- ⚠️ Per SESSIONE e' informazione, non verdetto: NULL per un
                     --   lettore che non puo' vedere backend_start della sessione
                     --   altrui (vedi il LATERAL s). Lo stato dice OK lo stesso.
                     CASE WHEN segno_di_vita = 'SESSIONE' THEN sessione_viva_dal
                          ELSE giornale_ultima_corsa END AS ultimo_segno_di_vita,
                     -- ⭐ Rev 2026-10-09: la causa del guasto, che sceglie il
                     --   testo per chi agisce (dbops.presidi.colonna_variante).
                     verdetto[2] AS causa
                FROM panorama
               ORDER BY canale, processo_codice;


              COMMENT ON VIEW dbops.vw_processi_programmazione IS
                  'PANORAMA: per ogni processo automatico attivo — quale job pgAgent lo sveglia, quando girera'', quando ha girato secondo pgAgent e secondo il nostro giornale. ⭐ La colonna che vale piu'' di tutte e'' `stato`, e il valore che conta e'' GIRA_E_NON_REGISTRA: pgAgent dice che il job e'' girato, il giornale non lo sa — e'' la firma esatta di un lavoro che muore prima di riuscire a raccontarlo, cioe'' di R-12, il job morto per sei mesi con l''ultimo verdetto a «done». Questo confronto lo avrebbe trovato in un giorno. ⚠️ Il legame col job NON e'' il nome: si legge da dbops.processi.jobname_pgagent, perche'' due job su quattordici si chiamano diversamente dal processo che registrano. ⚠️ Il giornale si legge per processo_codice OPPURE per jobname: le corse storiche hanno la prima colonna vuota, e senza il ripiego ogni processo sembrerebbe non aver mai girato prima di settembre 2026. ⛔ IL CONFRONTO GUARDA CHI HA SCRITTO LA RISPOSTA, rev 2026-09-07 (brief-db-sveglia-dei-processi §9.5-bis, segnalato dal backend): il ramo GIRA_E_NON_REGISTRA legge `giornale_ultima_corsa_pgagent`, non `giornale_ultima_corsa`. ⭐ I COMMAND CON UN CONTRATTO NON SONO PIU'' FUORI_PORTATA, rev 2026-09-11 (brief-db-quattro-processi-senza-presidio §10.2, decisione di Tid): dal 20260911-13 il catalogo dichiara tolleranza_minuti e segno_di_vita, quindi il database SA che cosa aspettarsi. GIORNALE + tolleranza: OK se l''ultima corsa e'' entro la tolleranza, MUTO se e'' piu'' vecchia, MAI_PARTITO se non c''e'' — e MAI_PARTITO su un COMMAND e'' il timer dichiarato e mai installato, cioe'' il §11.5 dei presidi visto dal database. SESSIONE: OK se in pg_stat_activity c''e'' una connessione viva con application_name = codice sul database corrente, altrimenti MUTO — e'' la forma dei servizi sempre accesi (listen_cambio_reparto), il segno di vita e'' un FATTO e non una dichiarazione. MUTO e'' l''unico stato nuovo: «era vivo ed e'' taciuto». FUORI_PORTATA resta per i COMMAND SENZA contratto: un limite di vista, non un guasto. SU_RICHIESTA resta per i CODA: una cadenza non esiste. ⭐ E'' un panorama, non un presidio: elenca anche i sani. ⛔ Il presidio NON si scrive come un NOT IN a mano: e'' la colonna `da_guardare`, calcolata qui accanto al CASE, e dbops.vw_processi_programmazione_da_guardare la proietta — MUTO e MAI_PARTITO ci entrano da soli, senza toccare quella riga. Tre colonne in coda dal 2026-09-11: tolleranza_minuti, segno_di_vita, ultimo_segno_di_vita (la corsa per GIORNALE, l''avvio della sessione per SESSIONE). ⛔ IL VERDETTO SESSIONE POGGIA SULL''ESISTENZA DELLA SESSIONE, rev 2026-09-14: pg_stat_activity mostra a tutti la riga (pid, usename, application_name) ma maschera backend_start e il resto a chi non e'' lo stesso utente della sessione ne'' pg_read_all_stats — e una vista non cambia l''utente che pg_stat_get_activity() guarda. Fino a quel giorno il ramo leggeva `viva_dal IS NOT NULL`: OK per zeroerp_app (la sessione del listener e'' sua) e MUTO per chiunque altro, titodb compreso — cioe'' per fn_conta_presidio, che e'' SECURITY DEFINER. Il primo digest della giornaliera (14-09 07:00) ha contato 1 su un listener vivo da 31 ore e il perimetro LIBERO del presidio ha protestato: il conteggio diceva 1 e l''elenco letto come app era vuoto. Il pgTAP non lo vedeva perche'' la sessione del test e'' del suo stesso utente. ultimo_segno_di_vita per SESSIONE resta informazione (NULL a chi non puo'' leggerlo), non verdetto. ⭐ LA CAUSA, rev 2026-10-09 (brief-db-presidio-processi-testo-per-causa §3 B.1, forma B di Tid): colonna `causa` in coda. Due stati hanno due cause con due rimedi — MUTO e'' TIMER_FERMO su un COMMAND col giornale e SERVIZIO_GIU su un COMMAND con la sessione; MAI_PARTITO e'' TIMER_NON_INSTALLATO su un COMMAND e JOB_MAI_PARTITO su un PGAGENT — e un testo unico dava il rimedio sbagliato (il 2026-10-09 diceva «Esegui ora» a un servizio sempre acceso). Ogni ramo del CASE consegna la coppia [stato, causa]: un secondo CASE farebbe due elenchi degli stessi casi. E `da_guardare` e'' ora `causa IS NOT NULL`: i rami sani non hanno causa, i guasti ce l''hanno per costruzione, e il NOT IN sugli stati sani — un secondo elenco — non c''e'' piu''. La causa sceglie il testo per chi agisce: dbops.presidi.colonna_variante = ''causa'', dbops.presidi_testi.variante.';

              COMMENT ON COLUMN dbops.vw_processi_programmazione.causa IS
                  'Perche'' la riga e'' da guardare, piu'' fine di `stato` dove lo stato ha due cause: MUTO → TIMER_FERMO (COMMAND col giornale) o SERVIZIO_GIU (COMMAND con la sessione); MAI_PARTITO → TIMER_NON_INSTALLATO (COMMAND) o JOB_MAI_PARTITO (PGAGENT). Altrove e'' lo stato stesso: NON_PROGRAMMATO, JOB_ASSENTE, JOB_SPENTO, GIRA_E_NON_REGISTRA. NULL sui processi sani (OK, FUORI_PORTATA, SU_RICHIESTA), ed e'' cio'' che li fa sani: da_guardare = causa IS NOT NULL. Esce dallo stesso ramo del CASE che produce lo stato. Sceglie il testo per chi agisce (dbops.presidi.colonna_variante → dbops.presidi_testi.variante). Brief: brief-db-presidio-processi-testo-per-causa §3 B.1.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- ⚠️ Una colonna in coda non si toglie con CREATE OR REPLACE, e
              --   tornare al corpo del 20260914-01 rimetterebbe un testo unico
              --   per cause diverse. Il verso di ritiro e' un changeSet nuovo.
              SELECT 1;
