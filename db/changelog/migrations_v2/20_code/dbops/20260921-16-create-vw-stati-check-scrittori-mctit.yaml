# brief-db-presidio-stati-mai-scritti §2 / §3-bis — LA MISURA del presidio C1:
# per ogni valore ammesso dal CHECK di una colonna di stato, chi lo scrive.
#
# ── ⭐ IL PERIMETRO E' UN CRITERIO, LETTO DA pg_constraint ────────────
#   Ogni CHECK su UNA colonna nella forma `col = ANY (ARRAY[...])`, sulle
#   colonne il cui nome dice «stato»: `stato`, `stato_*`, `status`, `esito`,
#   `severity`. Una tabella nuova con un vocabolario chiuso entra da sola.
#   ⚠️ Il filtro sul NOME e' il confine dichiarato fra uno STATO e una
#   CLASSIFICAZIONE (`tipo_lotto`, `canale`, `natura`, `esito_richiesto` di una
#   regola): un valore mai usato in una classificazione e' una scelta di
#   configurazione non esercitata, non un fallimento muto. Si scrive in forma
#   POSITIVA (`^stato(_|$)`), cosi' `tipo_stato` resta fuori per costruzione e
#   non per un ramo «escludi tipo_*». Chi vuole allargarlo tocca una riga.
#
# ── ⛔ LE DUE FORME DEL CAST, e la misura che ne vedeva una sola ───────
#   PostgreSQL scrive lo stesso CHECK in due modi: `(stato = ANY
#   (ARRAY['A'::text, …]))` su text, e `((stato)::text = ANY ((ARRAY['A'::
#   character varying, …])::text[]))` su varchar. Il §3 del brief (19-09)
#   misurava con una regex che vedeva la prima: 18 colonne. Con tutte e due
#   sono 32 (misurato il 21-09). E' la stessa trappola gia' pagata da
#   `valori_check` nel backend (catalogo BB): una regex «per caso» copre una
#   forma e l'altra e' verde per sottrazione.
#
# ── ⭐ TRE SCRITTORI VISIBILI, E IL SECONDO SALTO ────────────────────
#   1. il DEFAULT di colonna (pg_attrdef): scritto da ogni INSERT che non lo
#      nomina — rende raggiungibile il SOLO valore del default;
#   2. una funzione plpgsql/sql che SCRIVE la tabella (`UPDATE|INSERT INTO|
#      MERGE INTO schema.tabella` nel corpo) e porta il letterale nel corpo
#      → `scrittori_fn`;
#   3. una funzione che CHIAMA uno scrittore della tabella passandogli il
#      letterale dentro la chiamata (`fn_scrittore( … 'VALORE' …` prima del
#      `;`) → `scrittori_indiretti`.
#   ⛔ Il terzo esiste perche' il «parametrico» NON si legge dalla forma
#   `SET col = p_x`: la forma in uso e' POSIZIONALE (`INSERT … (…, status, …)
#   VALUES (…, p_status, …)` in fn_audit_log_once, fn_segna_esito_gruppo_lotto,
#   fn_log_event) e legare la posizione della colonna a quella del valore e'
#   un parser, non una regex. Il secondo salto chiude dbops.audit_log a DB
#   (OK 10, WARN 8, DRYRUN 13, ERROR 3 chiamanti, misurati il 21-09).
#
# ── ⚠️ LIMITI DICHIARATI, e sono quattro ────────────────────────────
#   a) Nominare non e' scrivere: un `UPDATE t SET x = 1 WHERE stato = 'X'`
#      conta come scrittore di X. Il criterio pretende «letterale + scrittura
#      della tabella nello STESSO corpo», ed e' un'approssimazione.
#   b) Due salti, non tre: un letterale che passa per due funzioni intermedie
#      resta invisibile (pgTAP test 9 lo costruisce).
#   c) Un valore assegnato a una variabile e scritto altrove NON lo vede se il
#      letterale sta fuori dal corpo dello scrittore (es. una COPIA
#      colonna→colonna: fn_log_pipeline_fase copia stato_operativo dal lotto
#      nel log — il valore APERTO e' scritto 1193 volte e nessun letterale
#      compare). Si dichiara ESENTE nel registro, con quella ragione.
#   d) Il quarto scrittore — un repository Python — il database non lo vede:
#      si dichiara APPLICAZIONE nel registro e lo verifica il backend (§6).
#   Il sorgente si legge senza commenti di riga e di blocco: un presidio sul
#   testo si accende sulla prosa che spiega il difetto.
#
# ── ⛔ L'INVARIANTE NON E' «LA VISTA E' VUOTA» ─────────────────────
#   E' «nessuna riga NON_DICHIARATO e nessuna DEBITO_ESTINTO»: una riga
#   dichiarata e' attesa, una non dichiarata e' un allarme, una di registro il
#   cui valore ha trovato uno scrittore (o e' uscito dal CHECK) va tolta.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20260921-16-create-vw-stati-check-scrittori-mctit.yaml

  - changeSet:
      id: 20260921-16-create-vw-stati-check-scrittori
      author: mctit
      failOnError: true
      comment: >
        Crea dbops.vw_stati_check_scrittori: una riga per ogni valore ammesso
        dal CHECK di una colonna di stato (perimetro letto da pg_constraint),
        con chi lo scrive — default, funzione col letterale, chiamante che lo
        passa — e l'esito SCRITTO / SCRITTO_DA_DEFAULT /
        DICHIARATO_APPLICAZIONE / ESENTE / DEBITO_ESTINTO / NON_DICHIARATO
        letto dal registro dbops.stati_check_dichiarazioni. E' la misura del
        presidio C1 di brief-db-presidio-stati-mai-scritti.
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: dbops
            tableName: stati_check_dichiarazioni
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW dbops.vw_stati_check_scrittori AS
              WITH colonne AS (
                      -- Il perimetro: un CHECK su UNA colonna, forma
                      -- `= ANY (ARRAY[...])` in TUTTE E DUE le scritture del
                      -- cast (text e varchar), nome della colonna in forma
                      -- positiva.
                      SELECT n.nspname::text AS schema_tabella,
                             c.relname::text AS nome_tabella,
                             a.attname::text AS colonna,
                             k.oid           AS con_oid,
                             k.conname::text AS vincolo,
                             substring(pg_get_expr(d.adbin, d.adrelid) FROM '^''([^'']*)''') AS valore_default
                        FROM pg_constraint k
                        JOIN pg_class      c ON c.oid = k.conrelid
                        JOIN pg_namespace  n ON n.oid = c.relnamespace
                        JOIN pg_attribute  a ON a.attrelid = c.oid AND a.attnum = k.conkey[1]
                        LEFT JOIN pg_attrdef d ON d.adrelid = c.oid AND d.adnum = a.attnum
                       WHERE k.contype = 'c'
                         AND array_length(k.conkey, 1) = 1
                         AND c.relkind = ANY (ARRAY['r'::"char", 'p'::"char"])
                         AND n.nspname NOT IN ('pg_catalog', 'information_schema')
                         AND pg_get_constraintdef(k.oid) ~ '= ANY \(\(?ARRAY\['
                         AND (   a.attname ~ '^stato(_|$)'
                              OR a.attname = 'status'
                              OR a.attname = 'esito'
                              OR a.attname = 'severity')
              ), valori AS (
                      -- Un valore per riga, letto dal vincolo cosi' com'e'
                      -- scritto (maiuscole comprese). `letterale` e' la forma
                      -- con gli apici, quella che si cerca nei sorgenti.
                      SELECT co.*, m[1] AS valore, '''' || m[1] || '''' AS letterale
                        FROM colonne co,
                             regexp_matches(pg_get_constraintdef(co.con_oid),
                                            '''([^'']*)''::', 'g') m
              ), funzioni AS MATERIALIZED (
                      -- Il sorgente vivo, senza commenti di riga e di blocco.
                      -- MATERIALIZED: e' la parte cara (2240 funzioni, 3,5 MB
                      -- di sorgente il 21-09) e va letta UNA volta.
                      SELECT p.oid,
                             p.proname::text AS proname,
                             pn.nspname::text || '.' || p.proname::text AS funzione,
                             regexp_replace(regexp_replace(p.prosrc, '/\*.*?\*/', '', 'g'),
                                            '--[^\n]*', '', 'g') AS sorgente
                        FROM pg_proc p
                        JOIN pg_namespace pn ON pn.oid = p.pronamespace
                        JOIN pg_language  l  ON l.oid  = p.prolang
                       WHERE pn.nspname NOT IN ('pg_catalog', 'information_schema')
                         AND l.lanname IN ('plpgsql', 'sql')
              ), scrittori AS MATERIALIZED (
                      -- Chi SCRIVE la tabella, a prescindere dal valore.
                      -- ⚠️ Il `strpos` prima della regex non cambia il criterio:
                      --   toglie dalla regex i corpi che il nome della tabella
                      --   non lo contengono affatto (la quasi totalita').
                      SELECT t.schema_tabella, t.nome_tabella,
                             f.oid, f.proname, f.funzione, f.sorgente
                        FROM (SELECT DISTINCT schema_tabella, nome_tabella FROM colonne) t
                        JOIN funzioni f
                          ON strpos(lower(f.sorgente), t.schema_tabella || '.' || t.nome_tabella) > 0
                         AND f.sorgente ~* ('(UPDATE|INSERT\s+INTO|MERGE\s+INTO)\s+(ONLY\s+)?'
                                            || t.schema_tabella || '\.' || t.nome_tabella || '\M')
              ), diretti AS (
                      -- scrittore diretto: il letterale nel corpo di chi scrive la tabella
                      SELECT v.con_oid, v.valore, s.funzione
                        FROM valori v
                        JOIN scrittori s
                          ON s.schema_tabella = v.schema_tabella
                         AND s.nome_tabella   = v.nome_tabella
                         AND strpos(s.sorgente, v.letterale) > 0
              ), indiretti AS (
                      -- scrittore indiretto: il letterale DENTRO la chiamata a
                      -- uno scrittore della tabella (prima del `;`). Il
                      -- `strpos` sul letterale screma i corpi prima della regex.
                      SELECT DISTINCT v.con_oid, v.valore, c.funzione
                        FROM valori v
                        JOIN funzioni c
                          ON strpos(c.sorgente, v.letterale) > 0
                        JOIN scrittori s
                          ON s.schema_tabella = v.schema_tabella
                         AND s.nome_tabella   = v.nome_tabella
                         AND s.oid <> c.oid
                         AND strpos(c.sorgente, s.proname) > 0
                         AND c.sorgente ~ ('\m' || s.proname || '\s*\([^;]*' || v.letterale)
              ), misura AS (
                      SELECT v.schema_tabella, v.nome_tabella, v.colonna, v.vincolo, v.valore,
                             (v.valore_default = v.valore) AS ha_default,
                             (SELECT count(*)::int FROM diretti x
                               WHERE x.con_oid = v.con_oid AND x.valore = v.valore) AS scrittori_fn,
                             (SELECT count(*)::int FROM indiretti x
                               WHERE x.con_oid = v.con_oid AND x.valore = v.valore) AS scrittori_indiretti,
                             (SELECT string_agg(DISTINCT x.funzione, ', ' ORDER BY x.funzione)
                                FROM (SELECT funzione FROM diretti   WHERE con_oid = v.con_oid AND valore = v.valore
                                      UNION ALL
                                      SELECT funzione FROM indiretti WHERE con_oid = v.con_oid AND valore = v.valore) x) AS scrittori_nomi,
                             -- tutte le funzioni che scrivono la tabella: l'indizio per il
                             -- lato Python (dove cercare il letterale accanto al nome)
                             (SELECT string_agg(DISTINCT s.funzione, ', ' ORDER BY s.funzione)
                                FROM scrittori s
                               WHERE s.schema_tabella = v.schema_tabella
                                 AND s.nome_tabella   = v.nome_tabella) AS scrittori_tabella
                        FROM valori v
              )
              SELECT m.schema_tabella,
                     m.nome_tabella,
                     m.colonna,
                     m.vincolo,
                     m.valore,
                     m.ha_default,
                     m.scrittori_fn,
                     m.scrittori_indiretti,
                     m.scrittori_nomi,
                     m.scrittori_tabella,
                     CASE
                         WHEN m.scrittori_fn > 0 OR m.scrittori_indiretti > 0 THEN
                              CASE WHEN d.id IS NULL THEN 'SCRITTO' ELSE 'DEBITO_ESTINTO' END
                         WHEN m.ha_default THEN
                              CASE WHEN d.id IS NULL THEN 'SCRITTO_DA_DEFAULT' ELSE 'DEBITO_ESTINTO' END
                         WHEN d.id IS NULL              THEN 'NON_DICHIARATO'
                         WHEN d.canale = 'APPLICAZIONE' THEN 'DICHIARATO_APPLICAZIONE'
                         ELSE 'ESENTE'
                     END AS esito,
                     d.canale,
                     d.ragione,
                     d.data_registrazione
                FROM misura m
                LEFT JOIN dbops.stati_check_dichiarazioni d
                       ON d.schema_tabella = m.schema_tabella
                      AND d.nome_tabella   = m.nome_tabella
                      AND d.colonna        = m.colonna
                      AND d.valore         = m.valore
              UNION ALL
              -- Una riga di registro il cui valore NON e' piu' nel perimetro
              -- (tolto dal CHECK, colonna o tabella sparite): va tolta.
              SELECT d.schema_tabella,
                     d.nome_tabella,
                     d.colonna,
                     NULL::text  AS vincolo,
                     d.valore,
                     NULL::boolean AS ha_default,
                     NULL::int   AS scrittori_fn,
                     NULL::int   AS scrittori_indiretti,
                     NULL::text  AS scrittori_nomi,
                     NULL::text  AS scrittori_tabella,
                     'DEBITO_ESTINTO' AS esito,
                     d.canale,
                     d.ragione,
                     d.data_registrazione
                FROM dbops.stati_check_dichiarazioni d
               WHERE NOT EXISTS (SELECT 1
                                   FROM valori v
                                  WHERE v.schema_tabella = d.schema_tabella
                                    AND v.nome_tabella   = d.nome_tabella
                                    AND v.colonna        = d.colonna
                                    AND v.valore         = d.valore);

              COMMENT ON VIEW dbops.vw_stati_check_scrittori IS
                  'La misura del presidio C1: per ogni valore ammesso dal CHECK di una colonna di stato (una colonna, forma = ANY(ARRAY[...]) in entrambe le scritture del cast, nome ^stato(_|$) | status | esito | severity — il filtro sul nome e'' il confine dichiarato fra stato e classificazione), chi lo scrive: il DEFAULT di colonna, una funzione che scrive la tabella col letterale nel corpo (scrittori_fn), una funzione che chiama uno scrittore passandogli il letterale nella chiamata (scrittori_indiretti). Esito: SCRITTO, SCRITTO_DA_DEFAULT, DICHIARATO_APPLICAZIONE e ESENTE (dal registro dbops.stati_check_dichiarazioni), DEBITO_ESTINTO (riga di registro il cui valore ha trovato uno scrittore o e'' uscito dal CHECK: da togliere), NON_DICHIARATO (allarme). ⛔ L''invariante NON e'' «vuota»: e'' «nessuna NON_DICHIARATO e nessuna DEBITO_ESTINTO». ⚠️ Limiti: nominare non e'' scrivere (un letterale in un WHERE dentro uno scrittore conta); due salti e non tre; una copia colonna→colonna e un valore in variabile fuori dallo scrittore restano invisibili (si dichiarano ESENTE); un repository Python il database non lo vede (si dichiara APPLICAZIONE, lo verifica il backend). Sorgenti letti senza commenti. Presidio: db/pgtap/dbops/test-stati-check-scrittori-v1.sql. Brief: brief-db-presidio-stati-mai-scritti §2 e §3-bis.';

              -- ⛔ Il GRANT che le sorelle di presidio hanno tutte: una vista
              --   che solo l'owner puo' leggere e' un presidio che nessuna
              --   schermata potra' mai mostrare. Solo zeroerp_app: i ruoli
              --   batch li copre il provisioning (linee-guida-sql §11.6).
              DO $grant$
              BEGIN
                  IF EXISTS (SELECT 1 FROM pg_catalog.pg_roles
                              WHERE rolname = 'zeroerp_app') THEN
                      GRANT SELECT ON dbops.vw_stati_check_scrittori TO zeroerp_app;
                  ELSE
                      RAISE NOTICE 'ruolo zeroerp_app assente: GRANT saltato';
                  END IF;
              END
              $grant$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP VIEW IF EXISTS dbops.vw_stati_check_scrittori;
