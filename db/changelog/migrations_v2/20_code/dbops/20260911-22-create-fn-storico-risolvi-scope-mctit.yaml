# ⭐ CHI LEGGE LA MAPPA: `dbops.fn_storico_risolvi_scope` — passo 2 del brief.
#   Brief: brief-db-rls-storico-scope-congelato.md §4b (D1, D3)
#
# Data una madre (schema, tabella) e la sua riga serializzata (`to_jsonb`),
# risponde con l'`emittenti_fiscali.id` a cui quella riga appartiene, seguendo
# la strada dichiarata in `dbops.storico_scope_policy`:
#   EF      legge la colonna e la restituisce
#   SR      legge la colonna e converte in EF (1:1 su soggetto_ruolo_id)
#   BA      legge il billing account, ne prende l'unico emittente (SR) e converte
#   PADRE   legge la FK, carica la riga del padre e SI RICHIAMA sulla riga di
#           mappa del padre — anche a più salti
#   NESSUNO NULL, come una madre senza riga di mappa
#
# ── PERCHÉ SECURITY DEFINER (del PROPRIETARIO, non di un superuser) ────
#   La chiama il trigger di storico, che gira come chi scrive la madre — cioè
#   l'applicazione, sotto RLS. Il padre di un satellite può non essere
#   visibile a chi scrive (un processo di sistema, una veste diversa): se la
#   risalita leggesse sotto la RLS del chiamante, la shadow porterebbe NULL e
#   quella versione sparirebbe a TUTTI, in silenzio. Catturare lo scope è un
#   atto di sistema: legge come il proprietario delle tabelle. ⚠️ Attraversa la
#   RLS solo perché chi migra possiede anche le tabelle (RLS ENABLE senza
#   FORCE): il pgTAP lo asserisce (test sul proprietario dei padri), non lo
#   presume. ⚠️ Non è una porta: restituisce un solo id, derivato da una riga
#   che il chiamante ha già in mano.
#
# ── PERCHÉ NON SOLLEVA, tranne in un caso ──────────────────────────────
#   Una madre senza riga di mappa, una colonna vuota, un padre sparito danno
#   NULL: la storicizzazione NON deve fermare la scrittura della madre per un
#   difetto della mappa, e il NULL è fail-closed sulla shadow (la riga non si
#   vede) e visibile al presidio pgTAP. L'unica eccezione è la catena che non
#   termina — un ciclo nella mappa — perché lì l'alternativa è la ricorsione
#   infinita: E_STORICO_SCOPE_CATENA_CICLICA, TECNICO.
#
# ── ⚠️ IL PADRE SI CERCA PER `id`, COL SUO TIPO ───────────────────────
#   Le madri hanno PK `id` di tipi diversi (bigint, integer, smallint, uuid):
#   il valore letto dal JSON è testo, e si casta al tipo VERO della colonna
#   del padre, letto dal catalogo — altrimenti `id::text = $1` scarterebbe
#   l'indice.
#
# Verifica: db/pgtap/dbops/test-storico-scope-policy-v1.sql
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20260911-22-create-fn-storico-risolvi-scope-mctit.yaml

  - changeSet:
      id: 20260911-22-create-fn-storico-risolvi-scope
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Crea dbops.fn_storico_risolvi_scope(schema, tabella, riga jsonb): legge
        dbops.storico_scope_policy e restituisce l'emittenti_fiscali.id della
        riga seguendo il modo dichiarato (EF, SR, BA, PADRE ricorsivo, NESSUNO).
        SECURITY DEFINER del proprietario: catturare lo scope è un atto di
        sistema e deve vedere il padre anche quando chi scrive non lo vedrebbe.
        Non solleva mai, tranne su una catena che non termina
        (E_STORICO_SCOPE_CATENA_CICLICA). La chiamerà il trigger di storico
        (passo 4). Brief brief-db-rls-storico-scope-congelato §4b.
      preConditions:
        - onFail: HALT
        - tableExists:
            { schemaName: dbops, tableName: storico_scope_policy }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_storico_risolvi_scope(
                  p_schema      text,
                  p_tabella     text,
                  p_riga        jsonb,
                  p_profondita  integer DEFAULT 0
              )
              RETURNS anagrafiche.emittenti_fiscali.id%TYPE
              LANGUAGE plpgsql
              STABLE
              SECURITY DEFINER
              SET search_path = pg_catalog, pg_temp
              AS $function$
              DECLARE
                  -- Oltre questa profondità non c'è una catena legittima: la più
                  -- lunga dichiarata è a due salti. È un tetto contro il ciclo,
                  -- non un limite di disegno.
                  c_max_profondita CONSTANT integer := 8;
                  v_mappa     dbops.storico_scope_policy%ROWTYPE;
                  v_ef_id     anagrafiche.emittenti_fiscali.id%TYPE;
                  v_sr_id     anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE;
                  v_chiave    text;
                  v_padre_oid oid;
                  v_tipo_id   text;
                  v_padre     jsonb;
              BEGIN
                  -- 0) Il tetto: una catena che a questo punto è ancora PADRE gira
                  --    in cerchio. È l'unico caso in cui si solleva.
                  IF p_profondita > c_max_profondita THEN
                      PERFORM script.fn_log_and_raise_error(
                          'dbops', 'fn_storico_risolvi_scope',
                          'E_STORICO_SCOPE_CATENA_CICLICA',
                          jsonb_build_object('schema', p_schema, 'tabella', p_tabella,
                                             'profondita', p_profondita),
                          NULL::uuid,
                          p_schema || '.' || p_tabella, p_profondita::text);
                  END IF;

                  -- 1) La riga di mappa della madre. Senza riga: NULL, e il
                  --    presidio pgTAP vede la madre non dichiarata.
                  SELECT * INTO v_mappa
                    FROM dbops.storico_scope_policy m
                   WHERE m.schema_tabella = p_schema
                     AND m.nome_tabella   = p_tabella;
                  IF NOT FOUND THEN
                      RETURN NULL;
                  END IF;

                  -- 2) La strada dichiarata.
                  CASE v_mappa.modo
                      WHEN 'NESSUNO' THEN
                          RETURN NULL;

                      WHEN 'EF' THEN
                          -- La colonna È l'emittente fiscale: si copia.
                          v_ef_id := NULLIF(p_riga ->> v_mappa.colonna, '')::bigint;
                          RETURN v_ef_id;

                      WHEN 'SR' THEN
                          -- Soggetto-ruolo dell'emittente: 1:1 con l'emittente
                          -- fiscale, si normalizza alla rappresentazione della
                          -- canonica. Nessuna riga -> NULL (fail-closed).
                          v_sr_id := NULLIF(p_riga ->> v_mappa.colonna, '')::bigint;
                          IF v_sr_id IS NULL THEN
                              RETURN NULL;
                          END IF;
                          SELECT ef.id INTO v_ef_id
                            FROM anagrafiche.emittenti_fiscali ef
                           WHERE ef.soggetto_ruolo_id = v_sr_id;
                          RETURN v_ef_id;

                      WHEN 'BA' THEN
                          -- Un billing account ha ESATTAMENTE UN emittente
                          -- (specifico, o il gestore globale): lo dice la
                          -- funzione che già serve le policy via_efba.
                          v_sr_id := script.fn_get_ba_emittente_sr_id(
                                         NULLIF(p_riga ->> v_mappa.colonna, '')::bigint);
                          IF v_sr_id IS NULL THEN
                              RETURN NULL;
                          END IF;
                          SELECT ef.id INTO v_ef_id
                            FROM anagrafiche.emittenti_fiscali ef
                           WHERE ef.soggetto_ruolo_id = v_sr_id;
                          RETURN v_ef_id;

                      WHEN 'PADRE' THEN
                          -- La FK verso il padre. Vuota (FK nullable) -> NULL.
                          v_chiave := NULLIF(p_riga ->> v_mappa.colonna, '');
                          IF v_chiave IS NULL THEN
                              RETURN NULL;
                          END IF;
                          -- Il padre si risolve per NOME QUALIFICATO con to_regclass,
                          -- non cercando nspname nel catalogo: così vale anche per
                          -- `pg_temp` (alias della temp schema, che nel catalogo si
                          -- chiama pg_temp_N) — è ciò che permette al pgTAP di
                          -- costruire una catena su tabelle temporanee.
                          v_padre_oid := pg_catalog.to_regclass(
                                             pg_catalog.format('%I.%I', v_mappa.padre_schema,
                                                                        v_mappa.padre_tabella));
                          IF v_padre_oid IS NULL THEN
                              -- Padre dichiarato che non esiste: lo vede il pgTAP; qui NULL.
                              RETURN NULL;
                          END IF;
                          -- Il tipo VERO della PK `id` del padre, per castare il
                          -- testo del JSON e usare l'indice.
                          SELECT pg_catalog.format_type(a.atttypid, a.atttypmod)
                            INTO v_tipo_id
                            FROM pg_catalog.pg_attribute a
                           WHERE a.attrelid = v_padre_oid
                             AND a.attname  = 'id'
                             AND NOT a.attisdropped;
                          IF v_tipo_id IS NULL THEN
                              -- Padre senza `id`: la mappa dice una cosa che il
                              -- catalogo non conferma. Lo vede il pgTAP; qui NULL.
                              RETURN NULL;
                          END IF;
                          -- La riga del padre, letta come proprietario: è il
                          -- motivo del SECURITY DEFINER.
                          EXECUTE pg_catalog.format(
                              'SELECT pg_catalog.to_jsonb(t) FROM %I.%I t WHERE t.id = %L::%s',
                              v_mappa.padre_schema, v_mappa.padre_tabella, v_chiave, v_tipo_id)
                             INTO v_padre;
                          IF v_padre IS NULL THEN
                              -- Padre sparito: ammesso dal modello (nessuna FK sulle
                              -- shadow, e l'ordine delle cancellazioni non è nostro).
                              RETURN NULL;
                          END IF;
                          -- Si continua sulla riga di mappa del padre.
                          RETURN dbops.fn_storico_risolvi_scope(
                                     v_mappa.padre_schema, v_mappa.padre_tabella,
                                     v_padre, p_profondita + 1);
                  END CASE;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_storico_risolvi_scope(text, text, jsonb, integer) IS
                  'Risolve l''emittenti_fiscali.id a cui appartiene la riga (to_jsonb) di una madre storicizzata, seguendo la strada dichiarata in dbops.storico_scope_policy: EF (copia), SR (converte 1:1), BA (l''unico emittente del billing account), PADRE (carica la riga del padre per id e si richiama, ricorsivamente), NESSUNO (NULL). La chiama il trigger di storico per congelare lo scope nella shadow. ⚠️ SECURITY DEFINER del PROPRIETARIO, non di un superuser: catturare lo scope è un atto di sistema e deve vedere il padre anche quando chi scrive non lo vedrebbe sotto RLS; attraversa la RLS perché chi migra possiede le tabelle (ENABLE senza FORCE), e il pgTAP lo asserisce. Non solleva mai — madre non mappata, colonna vuota, padre sparito danno NULL, fail-closed sulla shadow — tranne su una catena che non termina (E_STORICO_SCOPE_CATENA_CICLICA). Brief: brief-db-rls-storico-scope-congelato §4b.';

              -- La chiama il trigger, che gira come l'applicazione: l'EXECUTE
              -- deve restare concesso all''app. PUBLIC non serve.
              REVOKE EXECUTE ON FUNCTION dbops.fn_storico_risolvi_scope(text, text, jsonb, integer) FROM PUBLIC;
              DO $grant$
              BEGIN
                  IF EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = 'zeroerp_app') THEN
                      GRANT EXECUTE ON FUNCTION dbops.fn_storico_risolvi_scope(text, text, jsonb, integer) TO zeroerp_app;
                  END IF;
              END
              $grant$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS dbops.fn_storico_risolvi_scope(text, text, jsonb, integer);
