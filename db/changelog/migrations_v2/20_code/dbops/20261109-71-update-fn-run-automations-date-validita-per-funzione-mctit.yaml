      comment: >
        fn_run_automations_date_validita: il trigger si riconosce dalla funzione, il nome sta nel registro. Brief: brief-db-revisione-dbops, giro 10b.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
