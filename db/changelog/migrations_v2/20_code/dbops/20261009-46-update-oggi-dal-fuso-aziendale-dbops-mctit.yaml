                  RAISE EXCEPTION 'Stradario % non trovato', p_id_orig;
                END IF;
                PERFORM 1 FROM config.stradario WHERE id = p_id_target;
                IF NOT FOUND THEN
                  RAISE EXCEPTION 'Stradario % non trovato', p_id_target;
                END IF;

                -- La trasformazione, nel suo registro (non e' una shadow: e' il registro
                -- delle fusioni, letto da script.fn_get_vie_discendenti).
                INSERT INTO storico.stradario_trasformazioni(via_id_orig, via_id_nuovo, tipo_evento, data_evento, note)
                VALUES (p_id_orig, p_id_target, p_event_type, p_event_date, p_note);

                -- Propagazione: chi riferiva l'origine ora riferisce la destinazione.
                UPDATE anagrafiche.indirizzi_dettaglio
                   SET stradario_id = p_id_target
                 WHERE stradario_id = p_id_orig;
                GET DIAGNOSTICS v_ripuntati = ROW_COUNT;

                -- Audit dalla porta, una volta, con esito e conteggi.
                PERFORM dbops.fn_audit_log_once(
                  p_function_name => 'fn_admin_merge_stradario',
                  p_status        => 'OK',
                  p_params        => v_params,
                  p_rows_affected => v_ripuntati,
                  p_result        => jsonb_build_object('indirizzi_ripuntati', v_ripuntati,
                                                        'duration_ms', floor(extract(epoch from clock_timestamp() - v_start_ts) * 1000)),
                  p_message       => format('Stradario %s fuso in %s', p_id_orig, p_id_target));
              EXCEPTION WHEN OTHERS THEN
                -- In transazione questa riga si annulla col RAISE, com'era gia'; con il
                -- canale dblink acceso sopravvive, ed e' l'unico caso in cui serve.
                PERFORM dbops.fn_audit_log_once(
                  p_function_name => 'fn_admin_merge_stradario',
                  p_status        => 'ERROR',
                  p_params        => v_params,
                  p_message       => SQLERRM,
                  p_sqlstate      => SQLSTATE);
                RAISE;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_apply_chiusura_scadenze(p_classe dbops.automazione_chiusura_scadenze.classe%TYPE DEFAULT NULL::text)
               RETURNS jsonb
               LANGUAGE plpgsql
              AS $function$
                        -- Scopo:
                        --   Esegue la chiusura di stato per scadenza temporale su
                        --   tutte le tabelle configurate in
                        --   dbops.automazione_chiusura_scadenze (attivo=true).
                        --   Ritorna JSONB con conteggio righe chiuse per tabella
                        --   target + meta-info esecuzione.
                        --
                        -- Algoritmo:
                        --   1. Pre-check struttura: schema/tabella/colonne esistono;
                        --      per tipo_stato=FK anche tabella lookup e codici.
                        --   2. UPDATE dinamico (VARCHAR diretto o FK con lookup id).
                        --   3. Aggregazione conteggio in JSONB.
                        --   4. Audit log dell'esito.
                        --
                        -- GUC app.cessazione_automatica:
                        --   Impostato a 'true' (LOCAL) prima del loop per segnalare
                        --   ai guard trigger che questa e' una chiusura automatica
                        --   (non una transizione manuale da UI). Permette ai guard
                        --   di usare regole piu' permissive per la chiusura automatica
                        --   (es. valido_al < CURRENT_DATE ammessa dal job ma non dall'utente).
                        --
                        -- Sicurezza SQL dinamico:
                        --   - format(%I) per identificatori (quote_ident implicito)
                        --   - format(%L) per valori (quote_literal implicito)
                        --   - I valori della config sono comunque controllati
                        --     amministrativamente (Liquibase seed), ma applichiamo
                        --     igiene comunque.
                        DECLARE
                            v_row              dbops.automazione_chiusura_scadenze%ROWTYPE;
                            v_result           jsonb := '{}'::jsonb;
                            v_total            bigint := 0;
                            v_count            bigint;
                            v_target_key       text;
                            v_sql              text;
                            v_id_chiuso        bigint;
                            v_id_attivo        bigint;
                            v_col_count        smallint;
                        BEGIN
                            -- Segnala ai guard trigger che si tratta di chiusura automatica.
                            -- LOCAL: il GUC torna al valore precedente alla fine della transazione.
                            PERFORM set_config('app.cessazione_automatica', 'true', true);

                            FOR v_row IN
                                SELECT *
                                  FROM dbops.automazione_chiusura_scadenze
                                 WHERE attivo = TRUE
                                   -- ⭐ Filtro di CLASSE (2026-09-04). p_classe NULL = tutte, che e'
                                   --   il comportamento storico: il job pgAgent chiama senza argomenti
                                   --   e continua a lavorare tutto. Quando i bersagli di DOMINIO
                                   --   migreranno sulla coda, il chiamante passera' la propria classe
                                   --   e i due mondi smetteranno di mescolarsi.
                                   -- ⛔ Il vero cancello NON e' questo filtro: e' il NOT NULL su
                                   --   `classe` (changeSet -45). Una riga nuova nel CSV deve
                                   --   dichiarare di che natura e', o non entra nemmeno in tabella.
                                   AND (p_classe IS NULL OR classe = p_classe)
                                 ORDER BY id
                            LOOP
                                v_target_key := v_row.schema_tabella || '.' || v_row.nome_tabella;

                                -- =====================================================
                                -- 1) Pre-check: tabella e colonne target
                                -- to_regclass restituisce NULL se la tabella non esiste
                                -- (idiomatico PG, una riga vs JOIN su pg_class/pg_namespace).
                                -- =====================================================
                                IF to_regclass(format('%I.%I', v_row.schema_tabella, v_row.nome_tabella)) IS NULL THEN
                                    PERFORM script.fn_log_and_raise_error(
                                        'database',
                                        'fn_apply_chiusura_scadenze',
                                        'E_AUTOMAZIONE_CHIUSURA_CONFIG_INVALIDA',
                                        jsonb_build_object(
                                            'config_id', v_row.id,
                                            'target',    v_target_key,
                                            'motivo',    'tabella_inesistente'
                                        ),
                                        NULL::uuid,
                                        v_target_key,
                                        'tabella inesistente'
                                    );
                                END IF;

                                -- Verifica esistenza congiunta col_stato + col_valido_al.
                                SELECT count(*)::smallint INTO v_col_count
                                  FROM pg_attribute a
                                  JOIN pg_class    c ON c.oid = a.attrelid
                                  JOIN pg_namespace n ON n.oid = c.relnamespace
                                 WHERE n.nspname = v_row.schema_tabella
                                   AND c.relname = v_row.nome_tabella
                                   AND a.attname IN (v_row.col_stato, v_row.col_valido_al)
                                   AND a.attnum > 0
                                   AND NOT a.attisdropped;

                                IF v_col_count < 2 THEN
                                    PERFORM script.fn_log_and_raise_error(
                                        'database',
                                        'fn_apply_chiusura_scadenze',
                                        'E_AUTOMAZIONE_CHIUSURA_CONFIG_INVALIDA',
                                        jsonb_build_object(
                                            'config_id',     v_row.id,
                                            'target',        v_target_key,
                                            'col_stato',     v_row.col_stato,
                                            'col_valido_al', v_row.col_valido_al,
                                            'motivo',        'colonna_mancante'
                                        ),
                                        NULL::uuid,
                                        v_target_key,
                                        format('colonne %s/%s non trovate',
                                               v_row.col_stato, v_row.col_valido_al)
                                    );
                                END IF;

                                -- =====================================================
                                -- 2) Esecuzione: dispatch su tipo_stato
                                -- =====================================================
                                IF v_row.tipo_stato = 'VARCHAR' THEN
                                    -- UPDATE diretto con valori varchar.
                                    v_sql := format(
                                        $f$
                                        UPDATE %I.%I
                                           SET %I = %L
                                         WHERE %I = %L
                                           AND %I IS NOT NULL
                                           AND %I < (SELECT script.fn_data_operativa())
                                        $f$,
                                        v_row.schema_tabella, v_row.nome_tabella,
                                        v_row.col_stato,      v_row.stato_chiuso_codice,
                                        v_row.col_stato,      v_row.stato_attivo_codice,
                                        v_row.col_valido_al,
                                        v_row.col_valido_al
                                    );

                                    EXECUTE v_sql;
                                    GET DIAGNOSTICS v_count = ROW_COUNT;

                                ELSIF v_row.tipo_stato = 'FK' THEN
                                    -- Pre-check tabella lookup (to_regclass idiomatico).
                                    IF to_regclass(format('%I.%I', v_row.fk_lookup_schema, v_row.fk_lookup_table)) IS NULL THEN
                                        PERFORM script.fn_log_and_raise_error(
                                            'database',
                                            'fn_apply_chiusura_scadenze',
                                            'E_AUTOMAZIONE_CHIUSURA_CONFIG_INVALIDA',
                                            jsonb_build_object(
                                                'config_id',  v_row.id,
                                                'target',     v_target_key,
                                                'fk_lookup',  v_row.fk_lookup_schema || '.' || v_row.fk_lookup_table,
                                                'motivo',     'fk_lookup_inesistente'
                                            ),
                                            NULL::uuid,
                                            v_target_key,
                                            'fk_lookup inesistente'
                                        );
                                    END IF;

                                    -- Lookup combinato id_attivo + id_chiuso in 1 round-trip.
                                    -- MAX(CASE...) e' la classica idempotente "pivot": ritorna
                                    -- l'unico id matching per ciascun codice, NULL se assente.
                                    v_sql := format(
                                        'SELECT max(CASE WHEN %I = %L THEN %I END),'
                                        '       max(CASE WHEN %I = %L THEN %I END)'
                                        '  FROM %I.%I'
                                        ' WHERE %I IN (%L, %L)',
                                        v_row.fk_lookup_codice_col, v_row.stato_attivo_codice, v_row.fk_lookup_id_col,
                                        v_row.fk_lookup_codice_col, v_row.stato_chiuso_codice, v_row.fk_lookup_id_col,
                                        v_row.fk_lookup_schema, v_row.fk_lookup_table,
                                        v_row.fk_lookup_codice_col,
                                        v_row.stato_attivo_codice, v_row.stato_chiuso_codice
                                    );
                                    EXECUTE v_sql INTO v_id_attivo, v_id_chiuso;

                                    IF v_id_chiuso IS NULL THEN
                                        PERFORM script.fn_log_and_raise_error(
                                            'database',
                                            'fn_apply_chiusura_scadenze',
                                            'E_AUTOMAZIONE_CHIUSURA_CONFIG_INVALIDA',
                                            jsonb_build_object(
                                                'config_id',           v_row.id,
                                                'target',              v_target_key,
                                                'stato_chiuso_codice', v_row.stato_chiuso_codice,
                                                'motivo',              'codice_chiuso_non_trovato'
                                            ),
                                            NULL::uuid,
                                            v_target_key,
                                            'codice chiuso non trovato'
                                        );
                                    END IF;

                                    IF v_id_attivo IS NULL THEN
                                        PERFORM script.fn_log_and_raise_error(
                                            'database',
                                            'fn_apply_chiusura_scadenze',
                                            'E_AUTOMAZIONE_CHIUSURA_CONFIG_INVALIDA',
                                            jsonb_build_object(
                                                'config_id',           v_row.id,
                                                'target',              v_target_key,
                                                'stato_attivo_codice', v_row.stato_attivo_codice,
                                                'motivo',              'codice_attivo_non_trovato'
                                            ),
                                            NULL::uuid,
                                            v_target_key,
                                            'codice attivo non trovato'
                                        );
                                    END IF;

                                    -- UPDATE con id risolti.
                                    v_sql := format(
                                        $f$
                                        UPDATE %I.%I
                                           SET %I = %L
                                         WHERE %I = %L
                                           AND %I IS NOT NULL
                                           AND %I < (SELECT script.fn_data_operativa())
                                        $f$,
                                        v_row.schema_tabella, v_row.nome_tabella,
                                        v_row.col_stato,      v_id_chiuso::text,
                                        v_row.col_stato,      v_id_attivo::text,
                                        v_row.col_valido_al,
                                        v_row.col_valido_al
                                    );

                                    EXECUTE v_sql;
                                    GET DIAGNOSTICS v_count = ROW_COUNT;
                                ELSE
                                    -- Difesa in profondita': il CHECK constraint
                                    -- esclude gia' tipi diversi, ma per chiarezza.
                                    PERFORM script.fn_log_and_raise_error(
                                        'database',
                                        'fn_apply_chiusura_scadenze',
                                        'E_AUTOMAZIONE_CHIUSURA_CONFIG_INVALIDA',
                                        jsonb_build_object(
                                            'config_id',  v_row.id,
                                            'target',     v_target_key,
                                            'tipo_stato', v_row.tipo_stato,
                                            'motivo',     'tipo_stato_non_gestito'
                                        ),
                                        NULL::uuid,
                                        v_target_key,
                                        v_row.tipo_stato
                                    );
                                    v_count := 0;
                                END IF;

                                -- =====================================================
                                -- 3) Aggregazione risultato
                                -- =====================================================
                                v_result := v_result || jsonb_build_object(v_target_key, v_count);
                                v_total  := v_total + v_count;
                            END LOOP;

                            -- Meta-info.
                            v_result := v_result
                                        || jsonb_build_object('_total', v_total)
                                        || jsonb_build_object('_executed_at', now());

                            -- =====================================================
                            -- 4) Audit log esecuzione (best-effort, non blocca)
                            -- Pattern progetto: dbops.fn_audit_log_once con parametri named.
                            -- WHEN OTHERS perche' un fallimento di audit non deve
                            -- propagarsi: il caller (job pgAgent) deve comunque
                            -- ricevere il JSONB con i conteggi.
                            -- =====================================================
                            BEGIN
                                PERFORM dbops.fn_audit_log_once(
                                    p_function_name => 'dbops.fn_apply_chiusura_scadenze',
                                    p_status        => 'INFO',
                                    p_params        => v_result
                                );
                            EXCEPTION WHEN OTHERS THEN
                                NULL;
                            END;

                            RETURN v_result;
                        END;
                        $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_get_lookup_codici(p_rel regclass, p_order_col text DEFAULT 'descrizione'::text, p_order_dir text DEFAULT 'ASC'::text, p_attivo_only boolean DEFAULT true, p_limit integer DEFAULT 500, p_offset integer DEFAULT 0, p_includi_obsoleti boolean DEFAULT true)
               RETURNS TABLE(id bigint, codice text, codice_interno text, descrizione text, attivo boolean)
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_order_col   text    := lower(btrim(COALESCE(p_order_col, 'descrizione')));
                v_order_dir   text    := upper(btrim(COALESCE(p_order_dir, 'ASC')));
                v_offset      integer := COALESCE(p_offset, 0);
                v_id_type     text;
                v_has_codice          boolean;
                v_has_codice_interno  boolean;
                v_has_descrizione     boolean;
                v_has_attivo          boolean;
                v_attivo_is_boolean   boolean;
                v_has_obsoleto        boolean;
                v_obsoleto_is_date    boolean;
                v_conds       text[]  := ARRAY[]::text[];
                v_sql         text;
                -- Override dichiarativi da automation_overrides_cols.
                v_rel_schema              text;
                v_rel_table               text;
                v_codice_col_override         text;
                v_codice_interno_col_override text;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Estrazione lookup veloce per tabelle con colonne
                --   id/codice/codice_interno/descrizione/attivo, con filtri
                --   opzionali su attivo e obsoleto_dal.
                --
                -- Regole:
                --   - id deve essere integer/bigint (uuid non ammesso)
                --   - ordinamento ammesso solo su codice|descrizione e ASC|DESC
                --   - se la tabella ha colonna attivo e p_attivo_only=true,
                --     applica attivo IS TRUE
                --   - se la tabella ha colonna obsoleto_dal e
                --     p_includi_obsoleti=false, esclude i record con
                --     obsoleto_dal <= CURRENT_DATE (selezione per il nuovo).
                --     Default p_includi_obsoleti=true: mostra tutto (storico).
                --   - attivo e obsoleto_dal sono OPZIONALI: se la colonna manca,
                --     il relativo predicato non viene applicato (lista intera).
                --   - codice: colonna 'codice' o override CODICE_COL,
                --     altrimenti COALESCE(codice_interno/override, id::text)
                --   - codice_interno: colonna 'codice_interno' o override
                --     CODICE_INTERNO_COL, altrimenti NULL::text
                --   - Override dichiarativi in automation_overrides_cols
                --     (col_role CODICE_COL / CODICE_INTERNO_COL) hanno
                --     precedenza sull'introspezione pg_attribute
                -- =========================================================

                IF p_rel IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'dbops', 'fn_get_lookup_codici', 'E_PARAMETRO_INVALIDO',
                    jsonb_build_object('detail', 'p_rel obbligatorio'),
                    NULL::uuid,
                    'p_rel non puo'' essere NULL'
                  );
                END IF;

                IF v_order_col NOT IN ('descrizione', 'codice') THEN
                  PERFORM script.fn_log_and_raise_error(
                    'dbops', 'fn_get_lookup_codici', 'E_PARAMETRO_INVALIDO',
                    jsonb_build_object('detail', 'p_order_col non valido', 'p_order_col', p_order_col),
                    NULL::uuid,
                    format('p_order_col=%s non ammesso (solo: descrizione, codice)', p_order_col)
                  );
                END IF;

                IF v_order_dir NOT IN ('ASC', 'DESC') THEN
                  PERFORM script.fn_log_and_raise_error(
                    'dbops', 'fn_get_lookup_codici', 'E_PARAMETRO_INVALIDO',
                    jsonb_build_object('detail', 'p_order_dir non valido', 'p_order_dir', p_order_dir),
                    NULL::uuid,
                    format('p_order_dir=%s non ammesso (solo: ASC, DESC)', p_order_dir)
                  );
                END IF;

                IF p_limit IS NOT NULL AND p_limit <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'dbops', 'fn_get_lookup_codici', 'E_PARAMETRO_INVALIDO',
                    jsonb_build_object('detail', 'p_limit non valido', 'p_limit', p_limit),
                    NULL::uuid,
                    format('p_limit deve essere > 0 (ricevuto %s)', p_limit)
                  );
                END IF;

                IF v_offset < 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'dbops', 'fn_get_lookup_codici', 'E_PARAMETRO_INVALIDO',
                    jsonb_build_object('detail', 'p_offset non valido', 'p_offset', p_offset),
                    NULL::uuid,
                    format('p_offset deve essere >= 0 (ricevuto %s)', v_offset)
                  );
                END IF;

                -- Check colonna id (obbligatoria, integer/bigint)
                SELECT t.typname
                  INTO v_id_type
                  FROM pg_attribute a
                  JOIN pg_type t ON t.oid = a.atttypid
                 WHERE a.attrelid = p_rel
                   AND a.attname = 'id'
                   AND a.attnum > 0
                   AND NOT a.attisdropped;

                IF v_id_type IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'dbops', 'fn_get_lookup_codici', 'E_LOOKUP_STRUTTURA_TABELLA_INVALIDA',
                    jsonb_build_object('detail', 'colonna id mancante', 'tabella', p_rel::text),
                    NULL::uuid,
                    p_rel::text, 'colonna id mancante'
                  );
                END IF;

                IF v_id_type = 'uuid' THEN
                  PERFORM script.fn_log_and_raise_error(
                    'dbops', 'fn_get_lookup_codici', 'E_LOOKUP_STRUTTURA_TABELLA_INVALIDA',
                    jsonb_build_object('detail', 'id uuid non ammesso', 'tabella', p_rel::text),
                    NULL::uuid,
                    p_rel::text, 'id uuid non ammesso (serve integer/bigint)'
                  );
                END IF;

                IF v_id_type NOT IN ('int2', 'int4', 'int8') THEN
                  PERFORM script.fn_log_and_raise_error(
                    'dbops', 'fn_get_lookup_codici', 'E_LOOKUP_STRUTTURA_TABELLA_INVALIDA',
                    jsonb_build_object('detail', 'tipo id non supportato', 'tabella', p_rel::text, 'id_type', v_id_type),
                    NULL::uuid,
                    p_rel::text, format('tipo colonna id non supportato: %s (serve integer/bigint)', v_id_type)
                  );
                END IF;

                -- Legge schema e table name dall'OID (piu' robusto di split_part su text).
                SELECT ns.nspname, c.relname
                  INTO v_rel_schema, v_rel_table
                  FROM pg_catalog.pg_class c
                  JOIN pg_catalog.pg_namespace ns ON ns.oid = c.relnamespace
                 WHERE c.oid = p_rel;

                -- Override dichiarativi per colonne codice/codice_interno non-standard.
                SELECT col_name INTO v_codice_col_override
                  FROM dbops.automation_overrides_cols
                 WHERE schema_name = v_rel_schema
                   AND table_name  = v_rel_table
                   AND col_role    = 'CODICE_COL';

                SELECT col_name INTO v_codice_interno_col_override
                  FROM dbops.automation_overrides_cols
                 WHERE schema_name = v_rel_schema
                   AND table_name  = v_rel_table
                   AND col_role    = 'CODICE_INTERNO_COL';

                -- Check colonna codice (pg_attribute, poi override)
                SELECT EXISTS (
                  SELECT 1 FROM pg_attribute a
                   WHERE a.attrelid = p_rel AND a.attname = 'codice'
                     AND a.attnum > 0 AND NOT a.attisdropped
                ) INTO v_has_codice;

                -- Check colonna codice_interno (pg_attribute, poi override)
                SELECT EXISTS (
                  SELECT 1 FROM pg_attribute a
                   WHERE a.attrelid = p_rel AND a.attname = 'codice_interno'
                     AND a.attnum > 0 AND NOT a.attisdropped
                ) INTO v_has_codice_interno;

                -- Applica override: se presente segnala la colonna come disponibile.
                IF v_codice_col_override IS NOT NULL THEN
                  v_has_codice := TRUE;
                END IF;
                IF v_codice_interno_col_override IS NOT NULL THEN
                  v_has_codice_interno := TRUE;
                END IF;

                -- Almeno una tra codice e codice_interno (reale o via override) deve esistere.
                IF NOT v_has_codice AND NOT v_has_codice_interno THEN
                  PERFORM script.fn_log_and_raise_error(
                    'dbops', 'fn_get_lookup_codici', 'E_LOOKUP_STRUTTURA_TABELLA_INVALIDA',
                    jsonb_build_object('detail', 'ne codice ne codice_interno presenti', 'tabella', p_rel::text),
                    NULL::uuid,
                    p_rel::text, 'serve colonna codice, codice_interno o override CODICE_COL/CODICE_INTERNO_COL'
                  );
                END IF;

                -- Check colonna descrizione (obbligatoria)
                SELECT EXISTS (
                  SELECT 1 FROM pg_attribute a
                   WHERE a.attrelid = p_rel AND a.attname = 'descrizione'
                     AND a.attnum > 0 AND NOT a.attisdropped
                ) INTO v_has_descrizione;

                IF NOT v_has_descrizione THEN
                  PERFORM script.fn_log_and_raise_error(
                    'dbops', 'fn_get_lookup_codici', 'E_LOOKUP_STRUTTURA_TABELLA_INVALIDA',
                    jsonb_build_object('detail', 'colonna descrizione mancante', 'tabella', p_rel::text),
                    NULL::uuid,
                    p_rel::text, 'colonna descrizione mancante'
                  );
                END IF;

                -- Check colonna attivo (opzionale, deve essere boolean)
                SELECT EXISTS (
                  SELECT 1 FROM pg_attribute a
                   WHERE a.attrelid = p_rel AND a.attname = 'attivo'
                     AND a.attnum > 0 AND NOT a.attisdropped
                ) INTO v_has_attivo;

                IF v_has_attivo THEN
                  SELECT EXISTS (
                    SELECT 1 FROM pg_attribute a
                    JOIN pg_type t ON t.oid = a.atttypid
                    WHERE a.attrelid = p_rel AND a.attname = 'attivo'
                      AND a.attnum > 0 AND NOT a.attisdropped AND t.typname = 'bool'
                  ) INTO v_attivo_is_boolean;

                  IF NOT v_attivo_is_boolean THEN
                    PERFORM script.fn_log_and_raise_error(
                      'dbops', 'fn_get_lookup_codici', 'E_LOOKUP_STRUTTURA_TABELLA_INVALIDA',
                      jsonb_build_object('detail', 'colonna attivo non booleana', 'tabella', p_rel::text),
                      NULL::uuid,
                      p_rel::text, 'colonna attivo presente ma non di tipo boolean'
                    );
                  END IF;
                END IF;

                -- Check colonna obsoleto_dal (opzionale, deve essere date).
                -- Gemella di attivo: se manca, nessun filtro (lista intera).
                SELECT EXISTS (
                  SELECT 1 FROM pg_attribute a
                   WHERE a.attrelid = p_rel AND a.attname = 'obsoleto_dal'
                     AND a.attnum > 0 AND NOT a.attisdropped
                ) INTO v_has_obsoleto;

                IF v_has_obsoleto THEN
                  SELECT EXISTS (
                    SELECT 1 FROM pg_attribute a
                    JOIN pg_type t ON t.oid = a.atttypid
                    WHERE a.attrelid = p_rel AND a.attname = 'obsoleto_dal'
                      AND a.attnum > 0 AND NOT a.attisdropped AND t.typname = 'date'
                  ) INTO v_obsoleto_is_date;

                  IF NOT v_obsoleto_is_date THEN
                    PERFORM script.fn_log_and_raise_error(
                      'dbops', 'fn_get_lookup_codici', 'E_LOOKUP_STRUTTURA_TABELLA_INVALIDA',
                      jsonb_build_object('detail', 'colonna obsoleto_dal non date', 'tabella', p_rel::text),
                      NULL::uuid,
                      p_rel::text, 'colonna obsoleto_dal presente ma non di tipo date'
                    );
                  END IF;
                END IF;

                -- Risolvi colonna effettiva per ORDER BY 'codice'.
                -- Se override CODICE_COL: usa il nome reale (es. 'codice_iso').
                -- Se codice non esiste (neanche override): fallback a 'descrizione'.
                IF v_order_col = 'codice' THEN
                  IF v_codice_col_override IS NOT NULL THEN
                    v_order_col := v_codice_col_override;
                  ELSIF NOT v_has_codice THEN
                    v_order_col := 'descrizione';
                  END IF;
                END IF;

                -- Costruzione SQL dinamico con override colonne.
                v_sql := format(
                  'SELECT t.id::bigint, %s, %s, t.descrizione::text, %s FROM %s t',
                  CASE WHEN v_has_codice
                       THEN format('t.%I::text', COALESCE(v_codice_col_override, 'codice'))
                       ELSE format('COALESCE(t.%I::text, t.id::text)', COALESCE(v_codice_interno_col_override, 'codice_interno'))
                  END,
                  CASE WHEN v_has_codice_interno
                       THEN format('t.%I::text', COALESCE(v_codice_interno_col_override, 'codice_interno'))
                       ELSE 'NULL::text AS codice_interno'
                  END,
                  CASE WHEN v_has_attivo
                       THEN 't.attivo::boolean'
                       ELSE 'NULL::boolean AS attivo'
                  END,
                  p_rel::text
                );

                -- Accumulatore predicati: con piu' filtri possibili (attivo +
                -- obsoleto) le condizioni si concatenano con AND. Concatenare
                -- piu' "WHERE" produrrebbe SQL invalido.
                IF p_attivo_only AND v_has_attivo THEN
                  v_conds := array_append(v_conds, 't.attivo IS TRUE');
                END IF;

                IF NOT p_includi_obsoleti AND v_has_obsoleto THEN
                  v_conds := array_append(v_conds, '(t.obsoleto_dal IS NULL OR t.obsoleto_dal > (SELECT script.fn_data_operativa()))');
                END IF;

                IF array_length(v_conds, 1) > 0 THEN
                  v_sql := v_sql || ' WHERE ' || array_to_string(v_conds, ' AND ');
                END IF;

                v_sql := v_sql || format(' ORDER BY t.%I %s NULLS LAST', v_order_col, v_order_dir);

                IF p_limit IS NOT NULL THEN
                  v_sql := v_sql || format(' LIMIT %s', p_limit);
                END IF;

                IF v_offset > 0 THEN
                  v_sql := v_sql || format(' OFFSET %s', v_offset);
                END IF;

                RETURN QUERY EXECUTE v_sql;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_guardiano_digest()
               RETURNS text
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_processo  CONSTANT dbops.processi.codice%TYPE          := 'digest_presidi';
                  v_job_type  CONSTANT dbops.coda_lavori_tipi.codice%TYPE  := 'NOTIFICA_DIGEST_MUTO';
                  v_stato     dbops.vw_processi_programmazione.stato%TYPE;
                  v_toll      dbops.processi.tolleranza_minuti%TYPE;
                  v_ultimo    timestamptz;
                  v_key       dbops.coda_lavori.idempotency_key%TYPE;
                  v_job_id    dbops.coda_lavori.id%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Guardare il guardiano. Se il digest dei presidi ha
                  --   smesso di girare, accodare UN lavoro al giorno che lo
                  --   dica a una persona — dal drenatore, con il destinatario
                  --   del backend.
                  --
                  -- ⭐ Il criterio di «MUTO» NON e' qui: si legge dal
                  --   panorama, dove sta accanto al CASE che lo produce.
                  -- =========================================================
                  SELECT v.stato, v.tolleranza_minuti, v.ultimo_segno_di_vita
                    INTO v_stato, v_toll, v_ultimo
                    FROM dbops.vw_processi_programmazione v
                   WHERE v.processo_codice = v_processo;

                  -- ⛔ Il digest non e' a catalogo, o e' spento/ritirato: il
                  --   guardiano non ha niente da guardare, e lo DICE. Un
                  --   ritorno silenzioso qui sarebbe un guardiano che dorme.
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'dbops', 'fn_guardiano_digest', 'E_CONFIG_MANCANTE',
                          jsonb_build_object('processo_codice', v_processo),
                          NULL::uuid,
                          'il processo ' || v_processo || ' non e'' attivo in dbops.processi: '
                          'il guardiano non ha niente da guardare');
                  END IF;

                  -- ⚠️ Solo MUTO: «era vivo ed e' taciuto». MAI_PARTITO lo
                  --   dice gia' il panorama nel pannello, e un nagging orario
                  --   su un'installazione nuova insegnerebbe a ignorarlo.
                  IF v_stato <> 'MUTO' THEN
                      RETURN 'DIGEST_' || v_stato;
                  END IF;

                  -- ⭐ Una notifica per GIORNO di silenzio. La chiave si
                  --   controlla in qualunque stato: fn_accoda_lavoro dedupe
                  --   solo fra PENDING/IN_CORSO, e un lavoro gia' FATTO non
                  --   deve far partire il successivo un'ora dopo.
                  v_key := 'guardiano_digest:' || script.fn_data_operativa()::text;
                  IF EXISTS (SELECT 1
                               FROM dbops.coda_lavori c
                              WHERE c.job_type = v_job_type
                                AND c.idempotency_key = v_key) THEN
                      RETURN 'GIA_NOTIFICATO_OGGI';
                  END IF;

                  -- ⚠️ Se il tipo e' ancora attivo = false (backend senza
                  --   handler), fn_accoda_lavoro SOLLEVA E_JOB_TYPE_NON_ATTIVO
                  --   e la corsa e' rossa nel giornale: «ho visto e non ho
                  --   potuto dirlo». E' voluto — non si aggira.
                  v_job_id := dbops.fn_accoda_lavoro(
                      p_job_type => v_job_type,
                      p_payload  => jsonb_build_object(
                          'processo_codice',    v_processo,
                          'stato',              v_stato,
                          'tolleranza_minuti',  v_toll,
                          'ultimo_segno_di_vita', v_ultimo,
                          'muto_da',            (now() - v_ultimo)::text),
                      -- SISTEMA: un avviso di manutenzione non appartiene a
                      -- un'azienda, e il processo e' di classe MANUTENZIONE.
                      p_run_as   => 'SISTEMA',
                      p_scope    => NULL,
                      p_idempotency_key => v_key,
                      p_origine  => 'CRON');

                  RETURN 'ACCODATO:' || v_job_id::text;
              END
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.trgfn_child_requires_non_obsolete_parent()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_parent_schema       text;
                v_parent_table        text;
                v_parent_obsoleto_col text;
                v_fk_col              text;
                v_parent_ref_col      text;   -- colonna referenziata dalla FK (non sempre la PK)
                v_fk_val_text         text;   -- valore FK dal figlio (come text)
                v_fk_old_text         text;   -- valore FK precedente (su UPDATE)
                v_parent_ref_type     text;   -- tipo della colonna referenziata (per cast)
                v_sql                 text;
                v_obsoleto_dal        date;
              BEGIN
                /*
                  Scopo
                  -----
                  Trigger function (OBSOLETO/REQUIRE): impedisce INSERT/UPDATE sul
                  figlio se il catalogo padre referenziato e' OBSOLETO
                  (obsoleto_dal <= CURRENT_DATE). Asse separato da attivo: serve
                  perche' i record obsoleti restano attivo=true (il REQUIRE-ATTIVO
                  non li intercetta).

                  Argomenti attesi (TG_ARGV)
                  --------------------------
                  [0] parent_schema       - schema della tabella padre
                  [1] parent_table        - nome tabella padre
                  [2] parent_obsoleto_col - nome colonna obsoleto_dal del padre
                  [3] fk_col              - nome colonna FK sul figlio
                  [4] parent_ref_col      - colonna del padre referenziata dalla FK
                                            (puo' essere UNIQUE diversa da PK).
                                            Se omesso, fallback 'id'.
                */

                IF array_length(TG_ARGV, 1) < 4 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database',
                    TG_NAME,
                    'E_CATALOGO_OBSOLETO_NUOVA_ISTANZA',
                    jsonb_build_object(
                      'trigger', TG_NAME,
                      'table',   TG_TABLE_SCHEMA||'.'||TG_TABLE_NAME,
                      'tg_argv', TG_ARGV
                    ),
                    NULL::uuid,
                    'Attesi: parent_schema, parent_table, parent_obsoleto_col, fk_col [, parent_ref_col]'
                  );
                END IF;

                v_parent_schema       := TG_ARGV[0];
                v_parent_table        := TG_ARGV[1];
                v_parent_obsoleto_col := TG_ARGV[2];
                v_fk_col              := TG_ARGV[3];
                v_parent_ref_col      := COALESCE(TG_ARGV[4], 'id');

                IF NOT (TG_OP = 'INSERT' OR TG_OP = 'UPDATE') THEN
                  RETURN NEW;
                END IF;

                -- Estrai il valore della FK dal record NEW (via to_jsonb, no EXECUTE per riga)
                v_fk_val_text := to_jsonb(NEW)->>v_fk_col;

                -- FK NULL ammessa: se non valorizzata, nessun controllo sul padre
                IF v_fk_val_text IS NULL THEN
                  RETURN NEW;
                END IF;

                -- Su UPDATE: se la FK NON cambia, nessun controllo. Gli avanzamenti
                -- di lifecycle (cambio stato, ecc.) sulle istanze storiche non
                -- ri-puntano il catalogo e non devono mai essere bloccati.
                IF TG_OP = 'UPDATE' THEN
                  v_fk_old_text := to_jsonb(OLD)->>v_fk_col;
                  IF v_fk_old_text IS NOT DISTINCT FROM v_fk_val_text THEN
                    RETURN NEW;
                  END IF;
                END IF;

                -- Ricava il tipo della colonna referenziata sul padre per cast corretto
                SELECT a.atttypid::regtype::text
                  INTO v_parent_ref_type
                  FROM pg_attribute a
                  JOIN pg_class c     ON c.oid = a.attrelid
                  JOIN pg_namespace n ON n.oid = c.relnamespace
                 WHERE n.nspname = v_parent_schema
                   AND c.relname = v_parent_table
                   AND a.attname = v_parent_ref_col
                   AND a.attnum > 0
                   AND NOT a.attisdropped;

                IF v_parent_ref_type IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database',
                    TG_NAME,
                    'E_CATALOGO_OBSOLETO_NUOVA_ISTANZA',
                    jsonb_build_object(
                      'parent_table', v_parent_schema||'.'||v_parent_table,
                      'ref_col',      v_parent_ref_col
                    ),
                    NULL::uuid,
                    'Colonna referenziata padre non trovata'
                  );
                END IF;

                -- Legge obsoleto_dal del padre (cast del parametro al tipo della colonna referenziata)
                v_sql := format(
                  'SELECT %I FROM %I.%I WHERE %I = ($1)::%s',
                  v_parent_obsoleto_col, v_parent_schema, v_parent_table,
                  v_parent_ref_col, v_parent_ref_type
                );

                BEGIN
                  EXECUTE v_sql INTO v_obsoleto_dal USING v_fk_val_text;

                  IF NOT FOUND THEN
                    -- Coerente con REQUIRE: il padre dovrebbe esistere (FK), ma se
                    -- non trovato segnaliamo configurazione/dato incoerente.
                    PERFORM script.fn_log_and_raise_error(
                      'database',
                      TG_NAME,
                      'E_CATALOGO_OBSOLETO_NUOVA_ISTANZA',
                      jsonb_build_object(
                        'parent_table', v_parent_schema||'.'||v_parent_table,
                        'ref_col',      v_parent_ref_col,
                        'ref_val',      v_fk_val_text
                      ),
                      NULL::uuid,
                      'Catalogo padre non trovato per la FK indicata'
                    );
                  END IF;

                  -- Obsoleto se obsoleto_dal valorizzata e raggiunta. NULL o futura = ok.
                  IF v_obsoleto_dal IS NOT NULL AND v_obsoleto_dal <= script.fn_data_operativa() THEN
                    PERFORM script.fn_log_and_raise_error(
                      'database',
                      TG_NAME,
                      'E_CATALOGO_OBSOLETO_NUOVA_ISTANZA',
                      jsonb_build_object(
                        'parent_table',  v_parent_schema||'.'||v_parent_table,
                        'ref_col',       v_parent_ref_col,
                        'ref_val',       v_fk_val_text,
                        'obsoleto_dal',  v_obsoleto_dal
                      ),
                      NULL::uuid,
                      format('Catalogo %s.%s obsoleto dal %s: non utilizzabile per nuove istanze',
                             v_parent_schema, v_parent_table, v_obsoleto_dal)
                    );
                  END IF;

                EXCEPTION
                  WHEN undefined_column OR undefined_table THEN
                    PERFORM script.fn_log_and_raise_error(
                      'database',
                      TG_NAME,
                      'E_CATALOGO_OBSOLETO_NUOVA_ISTANZA',
                      jsonb_build_object(
                        'parent_table', v_parent_schema||'.'||v_parent_table,
                        'fk_col',       v_fk_col,
                        'obsoleto_col', v_parent_obsoleto_col
                      ),
                      NULL::uuid,
                      'Configurazione errata: tabella/colonna non esistente'
                    );
                END;

                RETURN NEW;
              END;
              $function$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_accoda_chiusura_scadenze()
               RETURNS jsonb
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_processo  dbops.processi.codice%TYPE := 'chiusura_scadenze_daily';
                  v_job_type  dbops.coda_lavori_tipi.codice%TYPE := 'CHIUSURA_SCADENZE';
                  v_riga      record;
                  v_job_id    dbops.coda_lavori.id%TYPE;
                  v_accodati  integer := 0;
                  v_falliti   integer := 0;
                  v_dettaglio jsonb   := '[]'::jsonb;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Svegliare la chiusura scadenze, non eseguirla. Un lavoro
                  --   per azienda, ciascuno con l'identita' tecnica di quella
                  --   azienda: da li' in poi e' la RLS a garantire il perimetro,
                  --   e non piu' la buona volonta' di una query.
                  --
                  -- ⭐ Isolamento per azienda: se A fallisce, B e C vengono
                  --   accodate lo stesso. Prima era un giro unico — un errore
                  --   su una tabella fermava tutto, per tutti, in silenzio.
                  -- =========================================================
                  FOR v_riga IN
                      SELECT r.auth_user_id, r.username, r.identita_id,
                             r.emittente_fiscale_id, r.emittente_codice
                        FROM dbops.vw_processi_roster r
                       WHERE r.processo_codice = v_processo
                       -- L'ordine lo da' gia' la vista: qui non si ri-ordina,
                       -- o sarebbero due posti che decidono la stessa cosa.
                  LOOP
                      BEGIN
                          v_job_id := dbops.fn_accoda_lavoro(
                              p_job_type => v_job_type,
                              p_payload  => jsonb_build_object(
                                  'emittente_fiscale_id', v_riga.emittente_fiscale_id,
                                  'emittente_codice',     v_riga.emittente_codice),
                              -- ⛔ OPERATORE, non SISTEMA: il guard di classe in
                              --   fn_accoda_lavoro lo pretende per un processo di
                              --   dominio, ed e' la ragione per cui questo
                              --   cantiere esiste.
                              p_run_as   => 'OPERATORE',
                              p_scope    => jsonb_build_object(
                                  'auth_user_id', v_riga.auth_user_id,
                                  'username',     v_riga.username,
                                  'identita_id',  v_riga.identita_id,
                                  -- ⚠️ CONGELATO all'accodamento: il worker
                                  --   esegue minuti dopo, e senza questo valore
                                  --   girerebbe in modalita' globale — cioe' un
                                  --   lavoro chiesto «dentro A» toccherebbe
                                  --   anche B, silenziosamente.
                                  'emittente_attivo_id', v_riga.emittente_fiscale_id,
                                  'emittente_ids', jsonb_build_array(
                                                       v_riga.emittente_fiscale_id)),
                              -- ⚠️ Per (azienda, GIORNO), senza l'ora: due
                              --   sveglie nello stesso giorno sono la stessa
                              --   intenzione, non due.
                              p_idempotency_key => v_job_type || ':' ||
                                                   v_riga.emittente_codice || ':' ||
                                                   CURRENT_DATE::text,
                              p_origine  => 'CRON');

                          v_accodati := v_accodati + 1;
                          v_dettaglio := v_dettaglio || jsonb_build_object(
                              'emittente', v_riga.emittente_codice,
                              'job_id',    v_job_id);
                      EXCEPTION WHEN OTHERS THEN
                          -- ⭐ Si continua: l'isolamento per azienda e' il
                          --   guadagno principale della migrazione sulla coda.
                          v_falliti := v_falliti + 1;
                          v_dettaglio := v_dettaglio || jsonb_build_object(
                              'emittente', v_riga.emittente_codice,
                              'errore',    left(SQLERRM, 200));
                      END;
                  END LOOP;

                  -- ⚠️ Si RITORNA un riepilogo invece di sollevare: chi chiama e'
                  --   un job notturno, e un riepilogo finisce nel giornale
                  --   mentre un'eccezione si perde.
                  RETURN jsonb_build_object(
                      '_processo',    v_processo,
                      '_accodati',    v_accodati,
                      '_falliti',     v_falliti,
                      '_dettaglio',   v_dettaglio,
                      '_executed_at', now());
              END
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_admin_merge_comune(p_id_orig config.comuni.id%TYPE, p_id_target config.comuni.id%TYPE, p_event_type storico.comune_trasformazioni.tipo_evento%TYPE DEFAULT 'F'::bpchar, p_event_date storico.comune_trasformazioni.data_evento%TYPE DEFAULT CURRENT_DATE, p_note storico.comune_trasformazioni.note%TYPE DEFAULT NULL::text)
               RETURNS void
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: fondere due comuni (config.comuni): registra la trasformazione in
              --   storico.comune_trasformazioni e ripunta chi riferiva l'origine sulla
              --   destinazione. Strumento DBA.
              --
              -- rev 2026-09-12 (brief-db-rls-storico-scope-congelato §4d, decisione a): il
              --   registro dbops.audit_log si scrive dalla PORTA fn_audit_log_once, una volta
              --   a fine lavoro, come le altre funzioni di dbops. Prima: INSERT diretto con
              --   status 'STARTED' — che chk_audit_status NON ammette, quindi la funzione
              --   falliva alla prima riga — e UPDATE di chiusura, che l'applicazione non puo'
              --   piu' fare (REVOKE del 2026-09-11) e che nel ramo ERROR veniva comunque
              --   annullato dal RAISE. Il ramo ERROR resta per la scrittura fuori transazione
              --   (dblink), dove ha senso; in transazione si annulla col resto, com'era.
              DECLARE
                v_start_ts  timestamptz := clock_timestamp();
                v_ripuntati integer := 0;
                v_params    jsonb := jsonb_build_object(
                    'p_id_orig',    p_id_orig,
                    'p_id_target',  p_id_target,
                    'p_event_type', p_event_type,
                    'p_event_date', p_event_date,
                    'p_note',       p_note);
              BEGIN
                -- Validazioni. ⚠️ Messaggi in chiaro, senza codice registrato: e' uno
                -- strumento DBA che oggi nessuno chiama dall'applicazione. Quando lo fara',
                -- i tre motivi vanno a catalogo (debito registrato nel brief).
                IF p_id_orig = p_id_target THEN
                  RAISE EXCEPTION 'Origine e destinazione devono differire';
                END IF;
                PERFORM 1 FROM config.comuni WHERE id = p_id_orig;
                IF NOT FOUND THEN
                  RAISE EXCEPTION 'Comune % non trovato', p_id_orig;
                END IF;
                PERFORM 1 FROM config.comuni WHERE id = p_id_target;
                IF NOT FOUND THEN
                  RAISE EXCEPTION 'Comune % non trovato', p_id_target;
                END IF;

                -- La trasformazione, nel suo registro (non e' una shadow: e' il registro
                -- delle fusioni, letto da script.fn_get_vie_discendenti).
                INSERT INTO storico.comune_trasformazioni(id_comune_orig, id_comune_nuovo, tipo_evento, data_evento, note)
                VALUES (p_id_orig, p_id_target, p_event_type, p_event_date, p_note);

                -- Propagazione: chi riferiva l'origine ora riferisce la destinazione.
                UPDATE config.stradario
                   SET comune_id = p_id_target
                 WHERE comune_id = p_id_orig;
                GET DIAGNOSTICS v_ripuntati = ROW_COUNT;

                -- Audit dalla porta, una volta, con esito e conteggi.
                PERFORM dbops.fn_audit_log_once(
                  p_function_name => 'fn_admin_merge_comune',
                  p_status        => 'OK',
                  p_params        => v_params,
                  p_rows_affected => v_ripuntati,
                  p_result        => jsonb_build_object('stradario_ripuntati', v_ripuntati,
                                                        'duration_ms', floor(extract(epoch from clock_timestamp() - v_start_ts) * 1000)),
                  p_message       => format('Comune %s fuso in %s', p_id_orig, p_id_target));
              EXCEPTION WHEN OTHERS THEN
                -- In transazione questa riga si annulla col RAISE, com'era gia'; con il
                -- canale dblink acceso sopravvive, ed e' l'unico caso in cui serve.
                PERFORM dbops.fn_audit_log_once(
                  p_function_name => 'fn_admin_merge_comune',
                  p_status        => 'ERROR',
                  p_params        => v_params,
                  p_message       => SQLERRM,
                  p_sqlstate      => SQLSTATE);
                RAISE;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_admin_merge_stradario(p_id_orig config.stradario.id%TYPE, p_id_target config.stradario.id%TYPE, p_event_type storico.stradario_trasformazioni.tipo_evento%TYPE DEFAULT 'F'::bpchar, p_event_date storico.stradario_trasformazioni.data_evento%TYPE DEFAULT CURRENT_DATE, p_note storico.stradario_trasformazioni.note%TYPE DEFAULT NULL::text)
               RETURNS void
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: fondere due vie (config.stradario): registra la trasformazione in
              --   storico.stradario_trasformazioni e ripunta chi riferiva l'origine sulla
              --   destinazione. Strumento DBA.
              --
              -- rev 2026-09-12 (brief-db-rls-storico-scope-congelato §4d, decisione a): il
              --   registro dbops.audit_log si scrive dalla PORTA fn_audit_log_once, una volta
              --   a fine lavoro, come le altre funzioni di dbops. Prima: INSERT diretto con
              --   status 'STARTED' — che chk_audit_status NON ammette, quindi la funzione
              --   falliva alla prima riga — e UPDATE di chiusura, che l'applicazione non puo'
              --   piu' fare (REVOKE del 2026-09-11) e che nel ramo ERROR veniva comunque
              --   annullato dal RAISE. Il ramo ERROR resta per la scrittura fuori transazione
              --   (dblink), dove ha senso; in transazione si annulla col resto, com'era.
              DECLARE
                v_start_ts  timestamptz := clock_timestamp();
                v_ripuntati integer := 0;
                v_params    jsonb := jsonb_build_object(
                    'p_id_orig',    p_id_orig,
                    'p_id_target',  p_id_target,
                    'p_event_type', p_event_type,
                    'p_event_date', p_event_date,
                    'p_note',       p_note);
              BEGIN
                -- Validazioni. ⚠️ Messaggi in chiaro, senza codice registrato: e' uno
                -- strumento DBA che oggi nessuno chiama dall'applicazione. Quando lo fara',
                -- i tre motivi vanno a catalogo (debito registrato nel brief).
                IF p_id_orig = p_id_target THEN
                  RAISE EXCEPTION 'Origine e destinazione devono differire';
                END IF;
                PERFORM 1 FROM config.stradario WHERE id = p_id_orig;
                IF NOT FOUND THEN
                  RAISE EXCEPTION 'Stradario % non trovato', p_id_orig;
                END IF;
                PERFORM 1 FROM config.stradario WHERE id = p_id_target;
                IF NOT FOUND THEN
                  RAISE EXCEPTION 'Stradario % non trovato', p_id_target;
                END IF;

                -- La trasformazione, nel suo registro (non e' una shadow: e' il registro
                -- delle fusioni, letto da script.fn_get_vie_discendenti).
                INSERT INTO storico.stradario_trasformazioni(via_id_orig, via_id_nuovo, tipo_evento, data_evento, note)
                VALUES (p_id_orig, p_id_target, p_event_type, p_event_date, p_note);

                -- Propagazione: chi riferiva l'origine ora riferisce la destinazione.
                UPDATE anagrafiche.indirizzi_dettaglio
                   SET stradario_id = p_id_target
                 WHERE stradario_id = p_id_orig;
                GET DIAGNOSTICS v_ripuntati = ROW_COUNT;

                -- Audit dalla porta, una volta, con esito e conteggi.
                PERFORM dbops.fn_audit_log_once(
                  p_function_name => 'fn_admin_merge_stradario',
                  p_status        => 'OK',
                  p_params        => v_params,
                  p_rows_affected => v_ripuntati,
                  p_result        => jsonb_build_object('indirizzi_ripuntati', v_ripuntati,
                                                        'duration_ms', floor(extract(epoch from clock_timestamp() - v_start_ts) * 1000)),
                  p_message       => format('Stradario %s fuso in %s', p_id_orig, p_id_target));
              EXCEPTION WHEN OTHERS THEN
                -- In transazione questa riga si annulla col RAISE, com'era gia'; con il
                -- canale dblink acceso sopravvive, ed e' l'unico caso in cui serve.
                PERFORM dbops.fn_audit_log_once(
                  p_function_name => 'fn_admin_merge_stradario',
                  p_status        => 'ERROR',
                  p_params        => v_params,
                  p_message       => SQLERRM,
                  p_sqlstate      => SQLSTATE);
                RAISE;
              END;
              $function$;
        - sql:
            dbms: postgresql
