# dbops: «OGGI» E' IL GIORNO DELL'AZIENDA, NON QUELLO DELLA SESSIONE
#   brief-be-db-fe-un-solo-fuso-aziendale §5.1 D-3.
#
# ── IL DIFETTO ──────────────────────────────────────────────────────
#   CURRENT_DATE e' il giorno nel fuso della SESSIONE che esegue, e le
#   sessioni non hanno tutte lo stesso fuso: il backend si connette in UTC,
#   psql/Liquibase/pgAgent nel fuso del server. Fra la mezzanotte dell'azienda
#   e quella della sessione, la stessa funzione risponde un giorno diverso
#   secondo chi la chiama: una data documento di ieri, un guard di validita'
#   che scatta o non scatta. Non dipende dai dati: e' la struttura, e vale per
#   ogni installazione il cui fuso non coincide con quello della sessione.
#
# ── LA CORREZIONE ───────────────────────────────────────────────────
#   Ogni CURRENT_DATE di codice diventa script.fn_data_operativa() (il giorno
#   nel fuso di SYSTEM_FUSO_ORARIO, letto dalla sede unica
#   script.fn_fuso_operativo, 20261009-40/41). Tre forme, scelte dal posto:
#   - in un'istruzione SQL (WHERE, SELECT, VALUES, SQL dinamico):
#     `(SELECT script.fn_data_operativa())` — la sottoquery scalare e'
#     valutata UNA volta per istruzione, non per riga (misurato su
#     zeroerp_ci il 2026-10-09: 20.000 righe, 122 ms per riga contro 2 ms);
#   - in un'espressione PL/pgSQL (`:=`, IF, RETURN) la chiamata diretta,
#     valutata una volta;
#   - nel DEFAULT di un parametro la chiamata diretta: li' una sottoquery non
#     e' ammessa.
#   I commenti che citano CURRENT_DATE restano: raccontano la regola di prima.
#
# ── COSA NON CAMBIA ─────────────────────────────────────────────────
#   Firme, tipi, volatilita', sicurezza, commenti e GRANT delle funzioni (il
#   CREATE OR REPLACE li conserva). Il corpo e' quello vivo, preso da
#   pg_get_functiondef su zeroerp_ci il 2026-10-09 e confrontato con la doc
#   auto-generata (identici), con la sola sostituzione di CURRENT_DATE.
#
# ── %TYPE: FIRMA, RETURNS TABLE, DECLARE ───────────────────────────
#   Il corpo vivo (pg_get_functiondef) scioglie i %TYPE della firma: quelli
#   gia' scritti nell'ultimo changeSet di ogni funzione sono stati RIPRESI
#   (anche nel rollback), e in questo giro si sono ancorati i parametri, le
#   colonne di RETURNS TABLE e le variabili che riflettono una colonna.
#   Verificato in transazione annullata su zeroerp_ci: argomenti e risultato
#   di ogni funzione restano byte-identici (nessun overload, nessun chiamante
#   rotto). Restano a TIPO ESPLICITO, perche' non sono il riflesso di nessuna
#   colonna, le voci elencate sotto per funzione: contatori, interruttori del
#   chiamante, jsonb e testi di lavoro, valori calcolati o costanti tipizzate,
#   chiavi polimorfe, il giorno operativo.
#
# ── FUNZIONI (7) ──────────────────────────────────────────────
#     - dbops.fn_accoda_chiusura_scadenze — tipo esplicito: v_accodati,
#         v_falliti, v_saltati, v_dettaglio, v_oggi. ⚠️ UNICA ECCEZIONE alla
#         «sola sostituzione»: con la sveglia oraria (T-4, changeSet
#         85_pgagent di questo giro) la funzione salta l'azienda che ha gia'
#         un lavoro FATTO con la chiave del giorno aziendale, e lo conta in
#         _saltati. La chiave idempotente di fn_accoda_lavoro protegge solo i
#         lavori vivi: senza questo controllo la chiusura si riaccoderebbe
#         ogni ora. ERRORE e ANNULLATO non chiudono il giorno: la sveglia dopo
#         ci riprova
#     - dbops.fn_admin_merge_comune — tipo esplicito: v_start_ts, v_ripuntati,
#         v_params
#     - dbops.fn_admin_merge_stradario — tipo esplicito: v_start_ts,
#         v_ripuntati, v_params
#     - dbops.fn_apply_chiusura_scadenze — tutto ancorato
#     - dbops.fn_get_lookup_codici — tipo esplicito: p_rel, p_order_col,
#         p_order_dir, p_attivo_only, p_limit, p_offset, p_includi_obsoleti,
#         id, codice, codice_interno, descrizione, attivo, v_order_col,
#         v_order_dir, v_offset, v_id_type, v_has_codice,
#         v_has_codice_interno, v_has_descrizione, v_has_attivo,
#         v_attivo_is_boolean, v_has_obsoleto, v_obsoleto_is_date, v_conds,
#         v_sql, v_rel_schema, v_rel_table, v_codice_col_override,
#         v_codice_interno_col_override. Funzione POLIMORFA: legge una tabella
#         di catalogo qualsiasi (p_rel), quindi nessuna colonna e' la sua
#     - dbops.fn_guardiano_digest — tipo esplicito: v_ultimo
#     - dbops.trgfn_child_requires_non_obsolete_parent — tipo esplicito:
#         v_parent_schema, v_parent_table, v_parent_obsoleto_col, v_fk_col,
#         v_parent_ref_col, v_fk_val_text, v_fk_old_text, v_parent_ref_type,
#         v_sql, v_obsoleto_dal. Trigger GENERICO: tabelle e colonne arrivano
#         dagli argomenti, il SQL e' dinamico
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20261009-46-update-oggi-dal-fuso-aziendale-dbops-mctit.yaml

  - changeSet:
      id: 20261009-46-update-oggi-dal-fuso-aziendale-dbops
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        dbops: CURRENT_DATE -> script.fn_data_operativa() in 7 funzioni, perche'
        «oggi» e' il giorno dell'azienda (SYSTEM_FUSO_ORARIO) e non quello della sessione.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 8
            sql: |
              SELECT count(*) FROM pg_proc p
                JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE (n.nspname = 'dbops' AND p.proname IN ('fn_accoda_chiusura_scadenze', 'fn_admin_merge_comune', 'fn_admin_merge_stradario', 'fn_apply_chiusura_scadenze', 'fn_get_lookup_codici', 'fn_guardiano_digest', 'trgfn_child_requires_non_obsolete_parent'))
                  OR (n.nspname = 'script' AND p.proname = 'fn_fuso_operativo');
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_accoda_chiusura_scadenze()
               RETURNS jsonb
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_processo  dbops.processi.codice%TYPE := 'chiusura_scadenze_daily';
                  v_job_type  dbops.coda_lavori_tipi.codice%TYPE := 'CHIUSURA_SCADENZE';
                  v_riga      record;
                  v_job_id    dbops.coda_lavori.id%TYPE;
                  v_accodati  integer := 0;
                  v_falliti   integer := 0;
                  v_saltati   integer := 0;
                  v_dettaglio jsonb   := '[]'::jsonb;
                  -- ⭐ Il GIORNO AZIENDALE, letto una volta: la chiave del lavoro e il
                  --   controllo «gia' fatto oggi» devono parlare dello stesso giorno.
                  v_oggi      date    := script.fn_data_operativa();
                  v_chiave    dbops.coda_lavori.idempotency_key%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Svegliare la chiusura scadenze, non eseguirla. Un lavoro
                  --   per azienda, ciascuno con l'identita' tecnica di quella
                  --   azienda: da li' in poi e' la RLS a garantire il perimetro,
                  --   e non piu' la buona volonta' di una query.
                  --
                  -- ⭐ Isolamento per azienda: se A fallisce, B e C vengono
                  --   accodate lo stesso. Prima era un giro unico — un errore
                  --   su una tabella fermava tutto, per tutti, in silenzio.
                  -- =========================================================
                  FOR v_riga IN
                      SELECT r.auth_user_id, r.username, r.identita_id,
                             r.emittente_fiscale_id, r.emittente_codice
                        FROM dbops.vw_processi_roster r
                       WHERE r.processo_codice = v_processo
                       -- L'ordine lo da' gia' la vista: qui non si ri-ordina,
                       -- o sarebbero due posti che decidono la stessa cosa.
                  LOOP
                      v_chiave := v_job_type || ':' || v_riga.emittente_codice || ':' || v_oggi::text;

                      -- ⭐ UNA VOLTA PER GIORNO AZIENDALE (brief-be-db-fe-un-solo-fuso-aziendale,
                      --   T-4): la sveglia e' oraria, e il giorno lo decide il fuso
                      --   dell'azienda, non l'orario dell'host. La chiave idempotente di
                      --   fn_accoda_lavoro protegge solo i lavori VIVI (PENDING/IN_CORSO): un
                      --   lavoro gia' FATTO oggi per questa azienda chiude il giorno e non si
                      --   riaccoda. Uno in ERRORE o ANNULLATO no: la sveglia dopo ci riprova.
                      IF EXISTS (SELECT 1 FROM dbops.coda_lavori cl
                                  WHERE cl.job_type = v_job_type
                                    AND cl.idempotency_key = v_chiave
                                    AND cl.stato = 'FATTO') THEN
                          v_saltati := v_saltati + 1;
                          CONTINUE;
                      END IF;

                      BEGIN
                          v_job_id := dbops.fn_accoda_lavoro(
                              p_job_type => v_job_type,
                              p_payload  => jsonb_build_object(
                                  'emittente_fiscale_id', v_riga.emittente_fiscale_id,
                                  'emittente_codice',     v_riga.emittente_codice),
                              -- ⛔ OPERATORE, non SISTEMA: il guard di classe in
                              --   fn_accoda_lavoro lo pretende per un processo di
                              --   dominio, ed e' la ragione per cui questo
                              --   cantiere esiste.
                              p_run_as   => 'OPERATORE',
                              p_scope    => jsonb_build_object(
                                  'auth_user_id', v_riga.auth_user_id,
                                  'username',     v_riga.username,
                                  'identita_id',  v_riga.identita_id,
                                  -- ⚠️ CONGELATO all'accodamento: il worker
                                  --   esegue minuti dopo, e senza questo valore
                                  --   girerebbe in modalita' globale — cioe' un
                                  --   lavoro chiesto «dentro A» toccherebbe
                                  --   anche B, silenziosamente.
                                  'emittente_attivo_id', v_riga.emittente_fiscale_id,
                                  'emittente_ids', jsonb_build_array(
                                                       v_riga.emittente_fiscale_id)),
                              -- ⚠️ Per (azienda, GIORNO), senza l'ora: due
                              --   sveglie nello stesso giorno sono la stessa
                              --   intenzione, non due.
                              p_idempotency_key => v_chiave,
                              p_origine  => 'CRON');

                          v_accodati := v_accodati + 1;
                          v_dettaglio := v_dettaglio || jsonb_build_object(
                              'emittente', v_riga.emittente_codice,
                              'job_id',    v_job_id);
                      EXCEPTION WHEN OTHERS THEN
                          -- ⭐ Si continua: l'isolamento per azienda e' il
                          --   guadagno principale della migrazione sulla coda.
                          v_falliti := v_falliti + 1;
                          v_dettaglio := v_dettaglio || jsonb_build_object(
                              'emittente', v_riga.emittente_codice,
                              'errore',    left(SQLERRM, 200));
                      END;
                  END LOOP;

                  -- ⚠️ Si RITORNA un riepilogo invece di sollevare: chi chiama e'
                  --   un job notturno, e un riepilogo finisce nel giornale
                  --   mentre un'eccezione si perde.
                  RETURN jsonb_build_object(
                      '_processo',    v_processo,
                      '_accodati',    v_accodati,
                      '_falliti',     v_falliti,
                      '_saltati',     v_saltati,
                      '_dettaglio',   v_dettaglio,
                      '_executed_at', now());
              END
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_admin_merge_comune(p_id_orig config.comuni.id%TYPE, p_id_target config.comuni.id%TYPE, p_event_type storico.comune_trasformazioni.tipo_evento%TYPE DEFAULT 'F'::bpchar, p_event_date storico.comune_trasformazioni.data_evento%TYPE DEFAULT script.fn_data_operativa(), p_note storico.comune_trasformazioni.note%TYPE DEFAULT NULL::text)
               RETURNS void
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: fondere due comuni (config.comuni): registra la trasformazione in
              --   storico.comune_trasformazioni e ripunta chi riferiva l'origine sulla
              --   destinazione. Strumento DBA.
              --
              -- rev 2026-09-12 (brief-db-rls-storico-scope-congelato §4d, decisione a): il
              --   registro dbops.audit_log si scrive dalla PORTA fn_audit_log_once, una volta
              --   a fine lavoro, come le altre funzioni di dbops. Prima: INSERT diretto con
              --   status 'STARTED' — che chk_audit_status NON ammette, quindi la funzione
              --   falliva alla prima riga — e UPDATE di chiusura, che l'applicazione non puo'
              --   piu' fare (REVOKE del 2026-09-11) e che nel ramo ERROR veniva comunque
              --   annullato dal RAISE. Il ramo ERROR resta per la scrittura fuori transazione
              --   (dblink), dove ha senso; in transazione si annulla col resto, com'era.
              DECLARE
                v_start_ts  timestamptz := clock_timestamp();
                v_ripuntati integer := 0;
                v_params    jsonb := jsonb_build_object(
                    'p_id_orig',    p_id_orig,
                    'p_id_target',  p_id_target,
                    'p_event_type', p_event_type,
                    'p_event_date', p_event_date,
                    'p_note',       p_note);
              BEGIN
                -- Validazioni. ⚠️ Messaggi in chiaro, senza codice registrato: e' uno
                -- strumento DBA che oggi nessuno chiama dall'applicazione. Quando lo fara',
                -- i tre motivi vanno a catalogo (debito registrato nel brief).
                IF p_id_orig = p_id_target THEN
                  RAISE EXCEPTION 'Origine e destinazione devono differire';
                END IF;
                PERFORM 1 FROM config.comuni WHERE id = p_id_orig;
                IF NOT FOUND THEN
                  RAISE EXCEPTION 'Comune % non trovato', p_id_orig;
                END IF;
                PERFORM 1 FROM config.comuni WHERE id = p_id_target;
                IF NOT FOUND THEN
                  RAISE EXCEPTION 'Comune % non trovato', p_id_target;
                END IF;

                -- La trasformazione, nel suo registro (non e' una shadow: e' il registro
                -- delle fusioni, letto da script.fn_get_vie_discendenti).
                INSERT INTO storico.comune_trasformazioni(id_comune_orig, id_comune_nuovo, tipo_evento, data_evento, note)
                VALUES (p_id_orig, p_id_target, p_event_type, p_event_date, p_note);

                -- Propagazione: chi riferiva l'origine ora riferisce la destinazione.
                UPDATE config.stradario
                   SET comune_id = p_id_target
                 WHERE comune_id = p_id_orig;
                GET DIAGNOSTICS v_ripuntati = ROW_COUNT;

                -- Audit dalla porta, una volta, con esito e conteggi.
                PERFORM dbops.fn_audit_log_once(
                  p_function_name => 'fn_admin_merge_comune',
                  p_status        => 'OK',
                  p_params        => v_params,
                  p_rows_affected => v_ripuntati,
                  p_result        => jsonb_build_object('stradario_ripuntati', v_ripuntati,
                                                        'duration_ms', floor(extract(epoch from clock_timestamp() - v_start_ts) * 1000)),
                  p_message       => format('Comune %s fuso in %s', p_id_orig, p_id_target));
              EXCEPTION WHEN OTHERS THEN
                -- In transazione questa riga si annulla col RAISE, com'era gia'; con il
                -- canale dblink acceso sopravvive, ed e' l'unico caso in cui serve.
                PERFORM dbops.fn_audit_log_once(
                  p_function_name => 'fn_admin_merge_comune',
                  p_status        => 'ERROR',
                  p_params        => v_params,
                  p_message       => SQLERRM,
                  p_sqlstate      => SQLSTATE);
                RAISE;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_admin_merge_stradario(p_id_orig config.stradario.id%TYPE, p_id_target config.stradario.id%TYPE, p_event_type storico.stradario_trasformazioni.tipo_evento%TYPE DEFAULT 'F'::bpchar, p_event_date storico.stradario_trasformazioni.data_evento%TYPE DEFAULT script.fn_data_operativa(), p_note storico.stradario_trasformazioni.note%TYPE DEFAULT NULL::text)
               RETURNS void
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: fondere due vie (config.stradario): registra la trasformazione in
              --   storico.stradario_trasformazioni e ripunta chi riferiva l'origine sulla
              --   destinazione. Strumento DBA.
              --
              -- rev 2026-09-12 (brief-db-rls-storico-scope-congelato §4d, decisione a): il
              --   registro dbops.audit_log si scrive dalla PORTA fn_audit_log_once, una volta
              --   a fine lavoro, come le altre funzioni di dbops. Prima: INSERT diretto con
              --   status 'STARTED' — che chk_audit_status NON ammette, quindi la funzione
              --   falliva alla prima riga — e UPDATE di chiusura, che l'applicazione non puo'
              --   piu' fare (REVOKE del 2026-09-11) e che nel ramo ERROR veniva comunque
              --   annullato dal RAISE. Il ramo ERROR resta per la scrittura fuori transazione
              --   (dblink), dove ha senso; in transazione si annulla col resto, com'era.
              DECLARE
                v_start_ts  timestamptz := clock_timestamp();
                v_ripuntati integer := 0;
                v_params    jsonb := jsonb_build_object(
                    'p_id_orig',    p_id_orig,
                    'p_id_target',  p_id_target,
                    'p_event_type', p_event_type,
                    'p_event_date', p_event_date,
                    'p_note',       p_note);
              BEGIN
                -- Validazioni. ⚠️ Messaggi in chiaro, senza codice registrato: e' uno
                -- strumento DBA che oggi nessuno chiama dall'applicazione. Quando lo fara',
                -- i tre motivi vanno a catalogo (debito registrato nel brief).
                IF p_id_orig = p_id_target THEN
