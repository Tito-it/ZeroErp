databaseChangeLog:
  - logicalFilePath: /migrations_v2/20_code/dbops/20251227-03-fn-run-automations-audit-update-mctit.yaml

  - changeSet:
      id: 20251227-03-fn-run-automations-audit-update
      author: mctit
      # runAlways: true
      validCheckSum:
        - ANY
      comment: >
        Esegue l'automazione di provisioning dei trigger "AUDIT_UPDATE" sulle tabelle in scope,
        applicando le regole abilitate in dbops.automation_rules_tbl (rule_type = 'AUDIT_UPDATE').

      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |


              CREATE OR REPLACE FUNCTION dbops.fn_run_automations_audit_update(
                p_exec_mode text,
                p_schemas text[],
                p_dry_run boolean)
                  RETURNS void
                  LANGUAGE 'plpgsql'
                  COST 100
                  VOLATILE PARALLEL UNSAFE
              AS $BODY$
                  DECLARE
                    v_schemas text[];
                    rtab record;
                    rrule record;
                    rel  regclass;
                    has_du boolean;
                    has_uu boolean;
                    col_ts   text;
                    col_user text;
                    tmpl     text;
                    trg_name text;
                    exist_strat text;
                  BEGIN

                    /*
                      Scopo
                      -----
                      Esegue l'automazione di provisioning dei trigger "AUDIT_UPDATE" sulle tabelle in scope,
                      applicando le regole abilitate in dbops.automation_rules_tbl (rule_type = 'AUDIT_UPDATE').

                      Obiettivo del trigger:
                      - mantenere aggiornati i campi "data_update" e "user_update" (o equivalenti) ad ogni UPDATE,
                        secondo la convenzione di audit del database.

                      Flusso operativo
                      ----------------
                      1) Risolve lo scope degli schemi con dbops.fn_resolve_scope(p_schemas).
                      2) Scorre tutte le tabelle fisiche (pg_class.relkind='r') degli schemi target, filtrate da:
                        - dbops.fn_table_in_scope(schema, table)
                      3) Per ogni tabella applica le regole AUDIT_UPDATE compatibili con:
                        - enabled = true
                        - exec_mode = 'AUTO' oppure exec_mode = p_exec_mode
                        - match su schema (dbops.fn_schema_match)
                        - match su tabella (r.target_table): se NULL vale per tutte; altrimenti pattern LIKE
                      4) Determina i nomi delle colonne audit da gestire:
                        - colonna timestamp (default: 'data_update', overridabile via rrule.params->>'audit_ts' e/o override 'AUDIT_TS')
                        - colonna utente     (default: 'user_update', overridabile via rrule.params->>'audit_user' e/o override 'AUDIT_USER')
                      5) Verifica le pre-condizioni tecniche:
                        - crea trigger solo se entrambe le colonne esistono (dbops.fn_col_exists).
                        - non crea colonne: gestisce solo trigger.

                      Trigger generato
                      ----------------
                      Se la tabella è idonea e il trigger non esiste già (secondo existence_strategy),
                      crea un trigger:
                        BEFORE UPDATE
                        EXECUTE FUNCTION script.trgfn_audit_data_user_generic()

                      Nome trigger ed esistenza (existence_strategy)
                      ----------------------------------------------
                      Il nome è derivato da rrule.name_template (default 'trg_{table}_audit_data_user_upd')
                      tramite dbops.fn_name_from_template.
                      La creazione è condizionata da rrule.existence_strategy (default 'BY_NAME'):
                      - BY_NAME     : verifica esistenza per nome trigger
                      - BY_FUNCTION : verifica esistenza per funzione trigger (script.trgfn_upd_audit_data_user_generic / generic)
                      - BOTH        : presente se esiste per nome OR per funzione
                      Serve a evitare duplicazioni e a supportare migrazioni graduali.

                      Modalità DRY RUN
                      ---------------
                      Se p_dry_run=true non esegue DDL (CREATE TRIGGER) e registra un audit con
                      dbops.fn_audit_log_once indicando cosa verrebbe creato.

                      Error handling
                      --------------
                      In caso di errore nella creazione del trigger, log strutturato e rilancio tramite
                      script.fn_log_and_raise_error con contesto ('AUDIT_UPDATE') e SQLERRM.
                    */


                    v_schemas := dbops.fn_resolve_scope(p_schemas);
                    FOR rtab IN
                      SELECT n.nspname AS schema_name,
                            c.relname AS table_name,
                            (quote_ident(n.nspname)||'.'||quote_ident(c.relname))::regclass AS rel
                      FROM pg_class c
                      JOIN pg_namespace n ON n.oid=c.relnamespace
                      WHERE c.relkind='r'
                        AND n.nspname = ANY(v_schemas)
                        AND dbops.fn_table_in_scope(n.nspname, c.relname)
                    LOOP
                      rel := rtab.rel;

                      FOR rrule IN
                        SELECT *
                          FROM dbops.automation_rules_tbl r
                        WHERE r.enabled
                          AND upper(btrim(r.rule_type))='AUDIT_UPDATE'
                          AND dbops.fn_schema_match(r.target_schema, rtab.schema_name)
                          AND (UPPER(r.target_table) = '*ALL' OR rtab.table_name ILIKE r.target_table)
                          --AND (r.exec_mode='AUTO' OR r.exec_mode=p_exec_mode)
                          AND (upper(btrim(r.exec_mode)) = 'AUTO' OR r.exec_mode = p_exec_mode)
                        ORDER BY r.priority, r.id
                      LOOP
                        exist_strat := COALESCE(rrule.existence_strategy,'BY_NAME');

                        col_ts   := dbops.fn_get_override_col(rtab.schema_name, rtab.table_name, 'AUDIT_TS',   COALESCE(rrule.params->>'audit_ts','data_update'));
                        col_user := dbops.fn_get_override_col(rtab.schema_name, rtab.table_name, 'AUDIT_USER', COALESCE(rrule.params->>'audit_user','user_update'));

                        SELECT dbops.fn_col_exists(rtab.schema_name, rtab.table_name, col_ts)
                            , dbops.fn_col_exists(rtab.schema_name, rtab.table_name, col_user)
                          INTO has_du, has_uu;

                        IF has_du AND has_uu THEN
                          tmpl     := COALESCE(rrule.name_template,'trg_{table}_audit_data_user_upd');
                          trg_name := dbops.fn_name_from_template(tmpl, rtab.schema_name, rtab.table_name, NULL,NULL,NULL,NULL);

                          IF (exist_strat='BY_NAME'     AND NOT dbops.fn_trigger_exists_by_name(rel, trg_name))
                          OR (exist_strat='BY_FUNCTION' AND NOT dbops.fn_trigger_exists_by_function(rel,'script','trgfn_upd_audit_data_user_generic'))
                          OR (exist_strat='BOTH'        AND NOT (dbops.fn_trigger_exists_by_name(rel, trg_name)
                                                            OR dbops.fn_trigger_exists_by_function(rel,'script','trgfn_upd_audit_data_user_generic')))
                          THEN
                            IF p_dry_run THEN
                              
                                PERFORM dbops.fn_audit_log_once(
                                p_function_name => 'dbops.fn_run_automations',
                                p_status        => 'DRYRUN',
                                p_rule_type     => 'AUDIT_UPDATE',
                                p_exec_mode     => p_exec_mode,
                                p_parts         => ARRAY['AUDIT_UPDATE'],
                                p_dry_run       => true,
                                p_params        => jsonb_build_object(
                                                    'table', rtab.schema_name||'.'||rtab.table_name,
                                                    'trigger', trg_name,
                                                    'action', 'DRYRUN_CREATE_TRIGGER'   
                                                  ),
                                p_message       => 'Trigger would be created'
                              );

                            ELSE
                              BEGIN
                                EXECUTE format($f$
                                  CREATE TRIGGER %I
                                  BEFORE UPDATE ON %I.%I
                                  FOR EACH ROW
                                  EXECUTE FUNCTION script.trgfn_audit_data_user_generic()
                                $f$, trg_name, rtab.schema_name, rtab.table_name);
                              EXCEPTION WHEN others THEN
                              
                                  PERFORM script.fn_log_and_raise_error(
                                    'dbops',
                                    'run_automations',
                                    'E_AUDIT_UPDATE',
                                    jsonb_build_object(
                                      'where','AUDIT_UPDATE',
                                      'table', rtab.schema_name||'.'||rtab.table_name,
                                      'error', SQLERRM
                                    ) , NULL::uuid, SQLERRM
                                  );
                              END;
                            END IF;
                          END IF;
                        END IF;
                      END LOOP;
                    END LOOP;
                  END;
                  
              $BODY$;


              COMMENT ON FUNCTION dbops.fn_run_automations_audit_update(text, text[], boolean)
                  IS 'Crea i trigger di audit update (timestamp/utente).';
