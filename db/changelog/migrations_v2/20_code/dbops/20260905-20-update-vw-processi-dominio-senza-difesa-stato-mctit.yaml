# DB-2 (pezzo 3 di 3) — il LIVELLO 2 parla la stessa lingua del livello 1.
#   Richiesta: brief-db-processi-automatici-residui-be.md, DB-2
#
# ⛔ COSA CAMBIA: la vista smette di essere un elenco muto e dice, per ogni
# riga, se la sua comparsa era ATTESA. Due colonne nuove:
#
#     stato   DEBITO_DICHIARATO | NON_DICHIARATO
#     nota    il perche', preso da dbops.processi_bersagli.note
#
# ⭐ E' la forma di `dbops.vw_processi_che_bypassano`, che il backend cita come
# precedente — con una differenza che conta: li' l'elenco dei debiti sta DENTRO
# la vista, qui sta nel DATO. I ruoli con BYPASSRLS sono una manciata e non
# cambiano; i bersagli crescono coi processi, e un elenco dentro una vista
# invecchierebbe il giorno dopo.
#
# ── ⭐ CHE COSA PERMETTE DI FARE, che prima non si poteva ───────────
#   Rispondere a **«c'e' qualcosa di NUOVO?»** senza sapere a memoria quali
#   righe erano previste. Il frontend mostra le sei viste in un pannello solo:
#   se una dice «zero o allarme» e l'altra «cala», deve poterlo leggere dal
#   dato, non da una tabella di eccezioni scritta a mano nel codice.
#
# ── ⚠️ LA REGOLA RESTA «DEVE RESTARE VUOTA» ────────────────────────
#   Dichiarare un debito non lo assolve: `debito_dichiarato` dice «sappiamo
#   perche' e'  qui», non «va bene che ci sia». Una riga DEBITO_DICHIARATO
#   e' un lavoro con un nome; una NON_DICHIARATO e' un allarme.
#
# ⛔ `DROP` + `CREATE`, non `CREATE OR REPLACE`: le colonne cambiano, e una
# REPLACE sa solo aggiungerne in coda. ⚠️ E il DROP porta via il GRANT, che va
# rimesso NELLO STESSO changeSet.
# ⚠️ Il corpo di partenza e' quello VIVO, estratto da `pg_get_viewdef`.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20260905-20-update-vw-processi-dominio-senza-difesa-stato-mctit.yaml

  - changeSet:
      id: 20260905-20-update-vw-processi-dominio-senza-difesa-stato
      author: mctit
      failOnError: true
      comment: >
        dbops.vw_processi_dominio_senza_difesa porta `stato` e `nota`, come la
        sorella del livello 1. Le due viste sono della stessa famiglia e il
        frontend le mostra in un pannello solo: devono raccontare il debito allo
        stesso modo, o va letto da una tabella di eccezioni scritta nel codice.
      preConditions:
        - onFail: HALT
        - columnExists:
            schemaName: dbops
            tableName: processi_bersagli
            columnName: debito_dichiarato
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP VIEW IF EXISTS dbops.vw_processi_dominio_senza_difesa;

              CREATE VIEW dbops.vw_processi_dominio_senza_difesa AS
               WITH bersagli AS (
                       SELECT p.codice AS processo_codice,
                          b.schema_tabella,
                          b.nome_tabella,
                          b.emittente_via,
                          b.debito_dichiarato,
                          b.note,
                          c.oid AS rel_oid
                         FROM dbops.processi p
                           JOIN dbops.processi_bersagli b ON b.processo_id = p.id
                           JOIN pg_class c ON c.relname = b.nome_tabella
                           JOIN pg_namespace n ON n.oid = c.relnamespace AND n.nspname = b.schema_tabella
                        WHERE p.classe = 'DOMINIO'::text AND p.attivo AND p.obsoleto_dal IS NULL AND b.emittente_via IS NOT NULL AND (c.relkind = ANY (ARRAY['r'::"char", 'p'::"char"]))
                      ), difese AS (
                       SELECT b.processo_codice,
                          b.schema_tabella,
                          b.nome_tabella,
                          b.emittente_via,
                          b.debito_dichiarato,
                          b.note,
                          b.rel_oid,
                          (EXISTS ( SELECT 1
                                 FROM pg_policy pol
                                WHERE pol.polrelid = b.rel_oid)) AS ha_policy,
                          (EXISTS ( SELECT 1
                                 FROM pg_trigger t
                                   JOIN pg_proc pr ON pr.oid = t.tgfoid
                                WHERE t.tgrelid = b.rel_oid AND NOT t.tgisinternal AND pr.proname = 'trgfn_guard_emittente_scope'::name)) AS ha_guard
                         FROM bersagli b
                      )
               SELECT processo_codice,
                  schema_tabella,
                  nome_tabella,
                  emittente_via,
                      CASE
                          WHEN NOT ha_policy AND NOT ha_guard THEN 'policy RLS e write-guard'::text
                          WHEN NOT ha_policy THEN 'policy RLS (lettura scoperta)'::text
                          ELSE 'write-guard (scrittura scoperta)'::text
                      END AS manca,
                  CASE WHEN debito_dichiarato THEN 'DEBITO_DICHIARATO'::text
                       ELSE 'NON_DICHIARATO'::text END AS stato,
                  note AS nota
                 FROM difese
                WHERE NOT ha_policy OR NOT ha_guard;

              -- ⛔ Il GRANT che il DROP ha portato via. Non basta contare su un
              --   `runOnChange` in 90_end: quello ri-esegue solo se il SUO file
              --   cambia, e non cambia (lezione di 20260904-21/-38).
              DO $grant$
              BEGIN
                  IF EXISTS (SELECT 1 FROM pg_catalog.pg_roles
                              WHERE rolname = 'zeroerp_app') THEN
                      GRANT SELECT ON dbops.vw_processi_dominio_senza_difesa TO zeroerp_app;
                  ELSE
                      RAISE NOTICE 'ruolo zeroerp_app assente: GRANT saltato';
                  END IF;
              END
              $grant$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- ⚠️ Si torna alla forma precedente rilanciando il changeSet che
              --   l'ha definita: togliere `stato` rende di nuovo indistinguibile
              --   una riga attesa da una nuova.
              DROP VIEW IF EXISTS dbops.vw_processi_dominio_senza_difesa;
