  - changeSet:
      id: 20261108-49-update-fn-pgtap-crea-ddt-riconsegna-stato-dal-building-block
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.fn_pgtap_crea_ddt_riconsegna: lo stato da script.fn_doc_stato_id (D73).
      preConditions:
