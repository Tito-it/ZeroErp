# fn_get_or_create_session_tx_id: sta sul percorso di scrittura di 305 trigger
#   tx_id, cioe' quasi ogni scrittura del sistema. Chiama `dblink(...)` NON
#   qualificato: e' il motivo per cui il pin DEVE contenere `public`.
# ── D6 di migliorie-generali-da-test-valutazione.md ───────────────────
#   Tre `SECURITY DEFINER` di proprieta' di `postgres`, eseguibili da PUBLIC,
#   SENZA `search_path`. Non sfruttabili oggi (i corpi qualificano quasi tutto e
#   `zeroerp_app` non ha CREATE su nessuno schema nel path), ma la difesa era
#   tutta in un GRANT che nessun presidio verificava: il giorno in cui a un
#   ruolo servisse CREATE da qualche parte, tre funzioni con i privilegi del
#   superutente diventerebbero una scala.
#
# ── ⭐ IL PIN E LA SUA FORMA ───────────────────────────────────────────
#   `SET search_path TO 'pg_catalog', 'public', 'pg_temp'` — NELLA DEFINIZIONE,
#   non con `ALTER FUNCTION`: un `CREATE OR REPLACE` successivo che dimentica la
#   clausola azzererebbe il pin in silenzio (provato il 2026-09-12, memoria
#   «una DEFINER col search_path blindato accieca la INVOKER»). E con `public`
#   dentro, perche' il path della DEFINER vale per TUTTO cio' che chiama, e la
#   catena tocca estensioni che vivono in `public` (`dblink`): la forma
#   «prudente» `pg_catalog, pg_temp` la accecherebbe. `pg_temp` ULTIMO ed
#   esplicito: se non e' elencato PostgreSQL lo cerca per PRIMO per le
#   relazioni.
#
# ── ⛔ PRESTITO DI PROPRIETA', non provision-post ─────────────────────
#   La funzione e' di `postgres` (dbops.sec_functions_owner): dal migratore un
#   `CREATE OR REPLACE` muore su «bisogna essere proprietari della funzione»
#   — successo il 2026-09-12 alla prima stesura di questo file, che stava in
#   changelog-provision-post.yaml. ⚠️ Quel changelog NON gira come postgres in
#   sviluppo (precedente 20260722-10, in testa): la sede giusta e' la timeline
#   normale con il PRESTITO — nel registro si dichiara owner il ruolo corrente,
#   fn_sync_functions_owner() (DEFINER di postgres) gliela passa, si fa il
#   CREATE OR REPLACE, si rimette postgres e si risincronizza. Un changeSet =
#   una transazione: un errore in mezzo annulla anche l'UPDATE sul registro.
#   Su un DB non ancora indurito (CI da zero) prestito e restituzione sono
#   no-op innocui: la funzione e' gia' del migratore e la sync, non essendo
#   ancora di postgres, si limita a un WARNING.
#
# Corpo dalla doc auto-gen (= vivo); firma/RETURNS/DECLARE con %TYPE dove il
# tipo e' quello di una colonna (la doc auto-gen li scioglie).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/dbops/20260912-40-update-fn-get-or-create-session-tx-id-search-path-mctit.yaml

  - changeSet:
      id: 20260912-40-update-fn-get-or-create-session-tx-id-search-path
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.fn_get_or_create_session_tx_id: pin search_path = pg_catalog, public, pg_temp nella definizione (D6). Corpo invariato; %TYPE in RETURNS e DECLARE.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'dbops' AND p.proname = 'fn_get_or_create_session_tx_id'
                 AND pg_catalog.pg_get_function_identity_arguments(p.oid) = '';
        # Serve il meccanismo di gestione owner: senza, su un DB gia' indurito
        # questo changeSet non potrebbe sostituire la funzione (owner postgres).
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'dbops' AND p.proname = 'fn_sync_functions_owner';
        # ⛔ Nessuna preCondition sulla riga di dbops.sec_functions_owner: e' un
        #   seed di 80_data e un cancello di 20_code non lo interroga
        #   (guardrail_precondition_seed, linee-guida-sql §11.4). Se la riga
        #   mancasse, il prestito sarebbe un no-op e il CREATE OR REPLACE
        #   fallirebbe da solo, a voce alta, su «bisogna essere proprietari».
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- ========================================================
              -- PRESTITO DI PROPRIETA' (vedi testata) — precedente 20260722-10
              -- ========================================================
              UPDATE dbops.sec_functions_owner
                 SET required_owner = current_user
               WHERE schema_name   = 'dbops'
                 AND function_name = 'fn_get_or_create_session_tx_id';

              SELECT dbops.fn_sync_functions_owner();

              CREATE OR REPLACE FUNCTION dbops.fn_get_or_create_session_tx_id()
               RETURNS dbops.transaction_ids.id%TYPE
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              DECLARE
                  v_tx_id        dbops.transaction_ids.id%TYPE;
                  v_dblink_conn  text;
              BEGIN
                  ----------------------------------------------------------------------
                  -- 0) Se esiste gia' un tx_id in sessione, riusalo e basta
                  ----------------------------------------------------------------------
                  BEGIN
                      v_tx_id := current_setting('dbops.tx_id', true)::uuid;
                  EXCEPTION WHEN OTHERS THEN
                      v_tx_id := NULL;
                  END;

                  IF v_tx_id IS NOT NULL THEN
                      RETURN v_tx_id;
                  END IF;

                  ----------------------------------------------------------------------
                  -- 1) Assicura la connessione di log (helper canonico, come in v1).
                  --    Rispetta myapp.log_with_dblink (default 'on'), la connstring
                  --    assente e il too_many_connections: non blocca mai il chiamante.
                  ----------------------------------------------------------------------
                  PERFORM script.fn_ensure_logconn();

                  ----------------------------------------------------------------------
                  -- 2) Verifica che il parametro di connessione dblink sia impostato
                  ----------------------------------------------------------------------
                  BEGIN
                      v_dblink_conn := current_setting('myapp.dblink_log_connection', true);
                  EXCEPTION WHEN OTHERS THEN
                      v_dblink_conn := NULL;
                  END;

                  IF v_dblink_conn IS NULL OR length(trim(v_dblink_conn)) = 0 THEN
                      -- Ripiego (a): nessun canale. Sentinella, e NIENTE set_config:
                      -- pubblicare un id non registrato avvelenerebbe la sessione e
                      -- farebbe fallire ogni scrittura tx_id-managed successiva.
                      RAISE WARNING
                          'dbops.fn_get_or_create_session_tx_id: parametro myapp.dblink_log_connection non impostato; uso la sentinella uuid_nil e non pubblico la GUC di sessione. '
                          'Impostare il parametro a livello DATABASE/ROLE o ALTER SYSTEM.';

                      RETURN script.uuid_nil();
                  END IF;

                  ----------------------------------------------------------------------
                  -- 3) Generazione tx_id tramite dblink verso il DB di log.
                  --    E' l'unico percorso che REGISTRA in dbops.transaction_ids, e lo
                  --    fa su una connessione separata: la registrazione sopravvive al
                  --    rollback della transazione di business (autonomia).
                  ----------------------------------------------------------------------
                  BEGIN
                      SELECT tx_id
                      INTO v_tx_id
                      FROM dblink(
                          v_dblink_conn,
                          $gen$
                              SELECT dbops.fn_generate_tx_id(
                                  'dbops.fn_get_or_create_session_tx_id',
                                  jsonb_build_object('source','fn_get_or_create')
                              )
                          $gen$
                      ) AS t(tx_id uuid);

                      -- Ripiego (b): dblink ha risposto ma con NULL -> niente id
                      -- registrato, quindi sentinella e nessuna pubblicazione.
                      IF v_tx_id IS NULL THEN
                          RAISE WARNING
                              'dbops.fn_get_or_create_session_tx_id: dblink ha restituito NULL; uso la sentinella uuid_nil e non pubblico la GUC di sessione.';
                          RETURN script.uuid_nil();
                      END IF;

                      -- Solo qui l'id e' REGISTRATO: si puo' pubblicare.
                      -- Scope LOCALE alla transazione (v1): un identificativo di
                      -- transazione non deve sopravvivere alla transazione.
                      PERFORM set_config('dbops.tx_id', v_tx_id::text, TRUE);

                  EXCEPTION WHEN OTHERS THEN
                      -- Ripiego (c): errore dblink -> sentinella, nessuna pubblicazione.
                      RAISE WARNING
                          'dbops.fn_get_or_create_session_tx_id: errore durante la chiamata dblink a dbops.fn_generate_tx_id: %; uso la sentinella uuid_nil e non pubblico la GUC di sessione.',
                          SQLERRM;

                      RETURN script.uuid_nil();
                  END;

                  ----------------------------------------------------------------------
                  -- 4) Ritorna il tx_id (mai NULL)
                  ----------------------------------------------------------------------
                  RETURN v_tx_id;
              END;
              $function$;

              COMMENT ON FUNCTION dbops.fn_get_or_create_session_tx_id()
              IS 'Restituisce il tx_id della sessione (GUC dbops.tx_id) o ne genera uno nuovo via dblink verso il canale di log (dbops.fn_generate_tx_id), registrandolo in dbops.transaction_ids fuori dalla transazione di business. Senza canale: sentinella uuid_nil, nessuna GUC pubblicata. SECURITY DEFINER di postgres: dal 2026-09-12 (D6) con search_path pinnato a pg_catalog, public, pg_temp — public e'' necessario perche'' dblink vive li''; il pin sta nella definizione, un CREATE OR REPLACE che lo dimentica lo azzera.';

              -- ========================================================
              -- RESTITUZIONE DELLA PROPRIETA': il registro torna a dichiarare
              -- postgres e si risincronizza. Rete di sicurezza: 90_end/20251123-04
              -- (runAlways) riallinea comunque gli owner al registro.
              -- ========================================================
              UPDATE dbops.sec_functions_owner
                 SET required_owner = 'postgres'
               WHERE schema_name   = 'dbops'
                 AND function_name = 'fn_get_or_create_session_tx_id';

              SELECT dbops.fn_sync_functions_owner();
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Il corpo precedente (senza pin) e' nella doc auto-gen alla revisione
              -- prima di questa. Non si riscrive un corpo stantio.
              SELECT 1;
