# ------------------------------------------------------------
# documenti.fn_pubblica_template_documento_versione: il controllo
#   «p_valido_al < p_valido_dal» -> E_DOCUMENTI_PUBBLICA_INPUT_INVALIDO si
#   ritira — l'ordine delle date lo dice il guard comune sull'UPDATE della
#   versione. Il codice RESTA per gli altri due rami (versione_id non
#   positivo, valido_dal mancante).
#
# ── ⭐ PERCHE' ────────────────────────────────────────────────────────
#   La regola del periodo ha UNA sede dal 23-09: script.trgfn_guard_date_validita
#   (20260923-40), montata dall'automazione DATE_VALIDITA anche su
#   documenti.template_documenti_versioni. Qui la funzione la ripeteva sui
#   PARAMETRI, con un altro codice. Regola del 2 (AGENTS.md): la copia si
#   ritira. L'UPDATE finale (stato, valido_dal, valido_al) scatta il guard
#   comune: `…_a10_date_validita_…` precede `…_a10_protect_pubblicata_…`, e la
#   riga e' BOZZA.
#
# ── ⛔ TOGLIERE IL RAMO NON BASTAVA ───────────────────────────────────────
#   La ricerca delle versioni da chiudere costruiva
#   daterange(p_valido_dal, COALESCE(p_valido_al, 'infinity'), '[]'): con le date
#   invertite quel costruttore solleva 22000 («il limite inferiore … minore o
#   uguale …») PRIMA che l'UPDATE arrivi al guard — cioe' esattamente la frase
#   tecnica da cui e' nato il brief. Il ramo tolto la stava coprendo.
#   La condizione si riscrive su [p_valido_dal, oltre): le candidate partono
#   PRIMA di p_valido_dal, quindi si sovrappongono alla finestra nuova se e solo
#   se sono ancora aperte a p_valido_dal — p_valido_al non entra nel giudizio.
#   Con date valide l'insieme chiuso e' identico; con date invertite non si
#   solleva niente qui, e l'UPDATE finale incontra il guard (le chiusure gia'
#   fatte si annullano con la transazione).
#
# ── ORIGINE DEL CORPO ───────────────────────────────────────────────────
#   Corpo VIVO (pg_get_functiondef, 24-09); stesso md5 del prosrc su dbdev e
#   su zeroerp_ci. md5 ancorato in preCondition, come in 20260921-46.
#   ⚠️ Il COMMENT si riscrive: CREATE OR REPLACE lo conserva, ma quello vivo
#   non diceva nulla delle date.
#
# Ricaduta BE (non in questo changeSet): il test
#   backend/apps/core/tests/db/test_date_validita_guard_comune_db.py dichiara per
#   la pubblicazione codice="E_DOCUMENTI_PUBBLICA_INPUT_INVALIDO": dopo l'apply
#   va rosso finche' non si toglie `codice=` (torna il default, E_DATA_AL_MINORE_DAL).
# Presidio: dbops/test-punti-canale-campo-v1 t.1 (la riga del codice resta: il
#   ramo di valido_dal porta ancora 'campo').
# Brief: brief-db-guard-date-validita.md §13

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/documenti/20260924-02-update-fn-pubblica-template-documento-versione-date-al-guard-comune-mctit.yaml

  - changeSet:
      id: 20260924-02-update-fn-pubblica-template-documento-versione-date-al-guard-comune
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        documenti.fn_pubblica_template_documento_versione: ritirato il controllo sull'ordine
        delle date dei parametri (ora in script.trgfn_guard_date_validita); la ricerca delle
        versioni da chiudere non costruisce piu' un daterange dai due parametri. md5 ancorato.
      preConditions:
        - onFail: HALT
        - onFailMessage: >-
            documenti.fn_pubblica_template_documento_versione: il corpo non e' quello letto
            il 24-09 (md5 diverso): qualcuno l'ha toccata dopo. Rileggere il vivo e
            rigenerare questo changeSet, non applicarlo.
        - sqlCheck:
            expectedResult: 1
            sql: >-
              SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'documenti' AND p.proname = 'fn_pubblica_template_documento_versione'
                 AND md5(p.prosrc) = '5553eb5587167ad675d7b25155491251'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION documenti.fn_pubblica_template_documento_versione(
                  p_versione_id documenti.template_documenti_versioni.id%TYPE,
                  p_valido_dal  documenti.template_documenti_versioni.valido_dal%TYPE,
                  p_valido_al   documenti.template_documenti_versioni.valido_al%TYPE DEFAULT NULL
              )
               RETURNS TABLE(
                  versione_id           documenti.template_documenti_versioni.id%TYPE,
                  template_documento_id documenti.template_documenti_versioni.template_documento_id%TYPE,
                  -- un CONTEGGIO: nessuna colonna di cui sia il riflesso
                  versioni_obsolete     integer
              )
               LANGUAGE plpgsql
              AS $function$
              -- Scopo:
              --   Pubblica una versione template documento in modo atomico.
              --
              -- Regole:
              --   - la versione target deve esistere ed essere BOZZA;
              --   - p_valido_dal e' obbligatorio;
              --   - l'ordine delle date (p_valido_al non precede p_valido_dal) NON si
              --     giudica qui: lo giudica il guard comune script.trgfn_guard_date_validita
              --     sull'UPDATE della versione (rev 20260924-02: ritirata la copia sui
              --     parametri, che rispondeva con E_DOCUMENTI_PUBBLICA_INPUT_INVALIDO);
              --   - prima della pubblicazione vengono rese OBSOLETE e chiuse a
              --     p_valido_dal - 1 le versioni PUBBLICATE attive dello stesso
              --     template con valido_dal < p_valido_dal e intervallo sovrapposto;
              --   - il vincolo EXCLUDE resta il guardrail finale contro overlap
              --     residui o race concorrenti.
              DECLARE
                  v_template_id  documenti.template_documenti_versioni.template_documento_id%TYPE;
                  v_stato        documenti.template_documenti_versioni.stato%TYPE;
                  -- id di documenti.template_documenti_versioni: %TYPE[] non e' sintassi valida
                  v_closed_ids   bigint[] := ARRAY[]::bigint[];
                  -- un conteggio: nessuna colonna di cui sia il riflesso
                  v_closed_count integer  := 0;
              BEGIN
                  IF p_versione_id IS NULL OR p_versione_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'documenti',
                          'fn_pubblica_template_documento_versione',
                          'E_DOCUMENTI_PUBBLICA_INPUT_INVALIDO',
                          jsonb_build_object('versione_id', p_versione_id),
                          NULL::uuid,
                          'versione_id deve essere un intero positivo'
                      );
                  END IF;

                  IF p_valido_dal IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'documenti',
                          'fn_pubblica_template_documento_versione',
                          'E_DOCUMENTI_PUBBLICA_INPUT_INVALIDO',
                          jsonb_build_object('campo', 'valido_dal', 'versione_id', p_versione_id),
                          NULL::uuid,
                          'valido_dal e'' obbligatorio'
                      );
                  END IF;

                  SELECT v.template_documento_id, v.stato
                    INTO v_template_id, v_stato
                    FROM documenti.template_documenti_versioni v
                   WHERE v.id = p_versione_id
                   FOR UPDATE;

                  IF v_template_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'documenti',
                          'fn_pubblica_template_documento_versione',
                          'E_DOCUMENTI_VERSIONE_NOT_FOUND',
                          jsonb_build_object('versione_id', p_versione_id),
                          NULL::uuid,
                          p_versione_id::text
                      );
                  END IF;

                  IF v_stato <> 'BOZZA' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'documenti',
                          'fn_pubblica_template_documento_versione',
                          'E_DOCUMENTI_VERSIONE_PUBBLICA_STATO_INVALIDO',
                          jsonb_build_object(
                              'versione_id',   p_versione_id,
                              'stato_corrente', v_stato
                          ),
                          NULL::uuid,
                          p_versione_id::text, v_stato
                      );
                  END IF;

                  -- Lock ordinato di tutte le versioni del template: evita race fra
                  -- due pubblicazioni concorrenti dello stesso template.
                  PERFORM 1
                    FROM documenti.template_documenti_versioni v
                   WHERE v.template_documento_id = v_template_id
                   ORDER BY v.id
                   FOR UPDATE;

                  SELECT COALESCE(array_agg(c.id ORDER BY c.valido_dal, c.id), ARRAY[]::bigint[])
                    INTO v_closed_ids
                    FROM (
                        SELECT v.id, v.valido_dal
                          FROM documenti.template_documenti_versioni v
                         WHERE v.template_documento_id = v_template_id
                           AND v.id <> p_versione_id
                           AND v.stato = 'PUBBLICATA'
                           AND v.attivo IS TRUE
                           AND v.valido_dal < p_valido_dal
                           -- ⚠️ rev 20260924-02: la finestra nuova e' [p_valido_dal, oltre).
                           --   Una versione che parte PRIMA di p_valido_dal si sovrappone
                           --   alla nuova se e solo se e' ancora aperta a p_valido_dal:
                           --   p_valido_al non conta. Prima qui si costruiva
                           --   daterange(p_valido_dal, p_valido_al): con le date invertite
                           --   sollevava 22000 (limite inferiore > superiore) PRIMA che
                           --   l'UPDATE incontrasse il guard comune delle date.
                           AND v.validita && daterange(p_valido_dal, NULL, '[)')
                         ORDER BY v.valido_dal, v.id
                         FOR UPDATE
                    ) c;

                  -- Calcola subito: evita GET DIAGNOSTICS post-UPDATE.
                  v_closed_count := COALESCE(array_length(v_closed_ids, 1), 0);

                  IF v_closed_count > 0 THEN
                      -- Il trigger A1 blocca UPDATE OF valido_al quando OLD.stato = PUBBLICATA.
                      -- Step 1: porta a OBSOLETA (colonna stato non e' nell''UPDATE OF' del trigger).
                      -- Step 2: aggiorna valido_al (ora OLD.stato = OBSOLETA, trigger non blocca).
                      UPDATE documenti.template_documenti_versioni
                         SET stato = 'OBSOLETA'
                       WHERE id = ANY(v_closed_ids);

                      UPDATE documenti.template_documenti_versioni
                         SET valido_al = p_valido_dal - 1
                       WHERE id = ANY(v_closed_ids);
                  END IF;

                  UPDATE documenti.template_documenti_versioni
                     SET stato      = 'PUBBLICATA',
                         valido_dal = p_valido_dal,
                         valido_al  = p_valido_al
                   WHERE id    = p_versione_id
                     AND stato = 'BOZZA';

                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'documenti',
                          'fn_pubblica_template_documento_versione',
                          'E_DOCUMENTI_VERSIONE_PUBBLICA_STATO_INVALIDO',
                          jsonb_build_object(
                              'versione_id',    p_versione_id,
                              'stato_corrente', v_stato
                          ),
                          NULL::uuid,
                          p_versione_id::text, v_stato
                      );
                  END IF;

                  versione_id           := p_versione_id;
                  template_documento_id := v_template_id;
                  versioni_obsolete     := v_closed_count;
                  RETURN NEXT;
              END;
              $function$;

              COMMENT ON FUNCTION documenti.fn_pubblica_template_documento_versione(
                  documenti.template_documenti_versioni.id%TYPE,
                  documenti.template_documenti_versioni.valido_dal%TYPE,
                  documenti.template_documenti_versioni.valido_al%TYPE)
              IS 'Pubblica una versione template documento con auto-close atomico delle versioni PUBBLICATE precedenti sovrapposte. Rev 20260924-02: l''ordine delle date non e'' piu'' giudicato sui parametri: lo giudica il guard comune script.trgfn_guard_date_validita sull''UPDATE della versione (E_DATA_AL_MINORE_DAL).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Il corpo precedente e' nella doc auto-gen alla revisione prima di
              -- questa (20260921-46). Non si riscrive un corpo stantio.
              SELECT 1;
