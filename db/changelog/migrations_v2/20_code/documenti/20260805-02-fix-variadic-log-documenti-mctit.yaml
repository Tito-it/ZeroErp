# ------------------------------------------------------------
# Riferimenti morti — F8: chiamate a fn_log_and_raise_error SENZA valori
#   variadici (schema `documenti`)
#   Guida: docs/it/guide/presidi-e-registri-del-debito.md
#   Regola corretta da: 20260805-01
#
# ── IL DIFETTO ───────────────────────────────────────────────────────────
#   `script.fn_log_and_raise_error(..., VARIADIC p_valori text[])` veniva
#   chiamata con **5 argomenti**, cioe' senza alcun valore variadico. In
#   PostgreSQL un `VARIADIC <tipo>[]` NON ammette zero argomenti variadici
#   (solo `VARIADIC "any"` lo fa), quindi la chiamata **non si risolve**:
#
#     BEGIN; DELETE FROM documenti.template_asset WHERE id = ...;
#     ERRORE: la funzione script.fn_log_and_raise_error(unknown, unknown,
#             unknown, jsonb, uuid) non esiste
#     CONTESTO: funzione PL/pgSQL documenti.trgfn_template_asset_block_delete()
#
# ── PERCHE' CONTA, AL DI LA' DEL MESSAGGIO BRUTTO ────────────────────────
#   Sono tutti guard di **blocco**: scattano per impedire una cancellazione
#   o una modifica vietata. Il blocco funziona — l'operazione fallisce
#   comunque — ma:
#     · il codice di dominio (es. `E_DOCUMENTI_ASSET_DELETE_BLOCKED`) non
#       arriva mai al backend, che traduce in `E_DATABASE` e restituisce un
#       400 generico con il dettaglio soppresso perche' classificato tecnico;
#     · il log non viene scritto: `fn_log_and_raise_error` non gira proprio.
#   L'utente vede «errore del database» dove doveva leggere perche' quel
#   documento non si puo' cancellare.
#
# ── ⚠️ ERANO ETICHETTATE COME RUMORE ────────────────────────────────────
#   Il controllo le classificava `FP_VARIADIC` per una premessa falsa
#   scritta nella v1 («PostgreSQL ammette di omettere i valori variadici»).
#   Segnalato dal team BE il 2026-08-05 e verificato: la regola e' corretta
#   in `20260805-01`, e queste righe sono emerse come difetti veri.
#   Lezione: un difetto nascosto sotto un'etichetta rassicurante e' peggio
#   di uno nascosto sotto un altro difetto — nessuno ricontrolla le etichette.
#
# ── IL RIMEDIO ───────────────────────────────────────────────────────────
#   `VARIADIC ARRAY[]::text[]` come sesto argomento. Verificato che nessuno
#   dei 10 messaggi coinvolti contenga segnaposto `%s`: sono testi fissi,
#   quindi non serve passare valori e un array vuoto e' la forma esatta.
#   (`fn_log_and_raise_error` fa `format` solo se `array_length` non e' NULL.)
#
#   Corpi presi dall'oggetto vivo e modificati con un solo inserimento per
#   call site: nessun'altra riga cambia.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/documenti/20260805-02-fix-variadic-log-documenti-mctit.yaml

  - changeSet:
      id: 20260805-02-fix-variadic-log-documenti
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        F8 — 14 chiamate a script.fn_log_and_raise_error senza valori variadici in
        10 guard dello schema documenti: un VARIADIC tipizzato non ammette zero
        argomenti variadici, quindi la chiamata non si risolve e il codice di dominio
        non arriva al backend. Aggiunto VARIADIC ARRAY[]::text[].
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION documenti.trgfn_documenti_generati_block_delete()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo:
              --   Blocca la cancellazione fisica di documenti generati.
              --
              -- Regola:
              --   La tabella è append-only sulla generazione storica.
              --   Il ciclo vita si gestisce tramite stato (GENERATO → ARCHIVIATO/ANNULLATO).
              --   Non si cancella mai fisicamente: la cancellazione invaliderebbe
              --   il tracciamento della generazione e l'audit tramite context_json.
              --
              -- Errore:
              --   E_DOCUMENTI_GENERATO_DELETE_BLOCKED
              BEGIN
                PERFORM script.fn_log_and_raise_error(
                  'documenti', 'trgfn_documenti_generati_block_delete',
                  'E_DOCUMENTI_GENERATO_DELETE_BLOCKED',
                  jsonb_build_object(
                    'documento_generato_id', OLD.id,
                    'uid', OLD.uid::text,
                    'stato', OLD.stato
                  ),
                  NULL::uuid,
                  VARIADIC ARRAY[]::text[]
                );
                RETURN OLD;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION documenti.trgfn_documenti_generati_check_coerenza()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo:
              --   Valida la coerenza referenziale del documento generato.
              --
              -- Regole:
              --   1. template_versione_id.template_documento_id ==
              --      template_documento_id
              --   2. template_documento_id.tipo_documento_output_id ==
              --      tipo_documento_output_id
              --   3. template_documento_id.sorgente_tipo_id ==
              --      sorgente_tipo_id
              --   4. template_documento_id.emittente_fiscale_id ==
              --      emittente_fiscale_id
              --
              -- Se una di queste fallisce il record nasce inconsistente,
              -- rendendo inaffidabile l'audit tramite context_json snapshot.
              --
              -- Errore:
              --   E_DOCUMENTI_GENERATO_COERENZA
              DECLARE
                v_tv_template_id documenti.template_documenti_versioni.template_documento_id%TYPE;
                v_tv_tipo_id documenti.template_documenti.tipo_documento_output_id%TYPE;
                v_tv_sorgente_id documenti.template_documenti.sorgente_tipo_id%TYPE;
                v_tv_emittente_id documenti.template_documenti.emittente_fiscale_id%TYPE;
              BEGIN
                SELECT
                  template_documento_id,
                  (SELECT tipo_documento_output_id
                     FROM documenti.template_documenti
                    WHERE id = template_documento_id) AS tipo_id,
                  (SELECT sorgente_tipo_id
                     FROM documenti.template_documenti
                    WHERE id = template_documento_id) AS sorgente_id,
                  (SELECT emittente_fiscale_id
                     FROM documenti.template_documenti
                    WHERE id = template_documento_id) AS emittente_id
                  INTO v_tv_template_id, v_tv_tipo_id, v_tv_sorgente_id, v_tv_emittente_id
                  FROM documenti.template_documenti_versioni
                 WHERE id = NEW.template_versione_id;

                IF v_tv_template_id != NEW.template_documento_id THEN
                  PERFORM script.fn_log_and_raise_error(
                    'documenti', 'trgfn_documenti_generati_check_coerenza',
                    'E_DOCUMENTI_GENERATO_COERENZA',
                    jsonb_build_object(
                      'template_versione_id', NEW.template_versione_id,
                      'template_documento_id_atteso', v_tv_template_id,
                      'template_documento_id_fornito', NEW.template_documento_id
                    ),
                    NULL::uuid,
                    VARIADIC ARRAY[]::text[]
                  );
                END IF;

                IF v_tv_tipo_id != NEW.tipo_documento_output_id THEN
                  PERFORM script.fn_log_and_raise_error(
                    'documenti', 'trgfn_documenti_generati_check_coerenza',
                    'E_DOCUMENTI_GENERATO_COERENZA',
                    jsonb_build_object(
                      'template_documento_id', NEW.template_documento_id,
                      'tipo_documento_output_id_atteso', v_tv_tipo_id,
                      'tipo_documento_output_id_fornito', NEW.tipo_documento_output_id
                    ),
                    NULL::uuid,
                    VARIADIC ARRAY[]::text[]
                  );
                END IF;

                IF v_tv_sorgente_id != NEW.sorgente_tipo_id THEN
                  PERFORM script.fn_log_and_raise_error(
                    'documenti', 'trgfn_documenti_generati_check_coerenza',
                    'E_DOCUMENTI_GENERATO_COERENZA',
                    jsonb_build_object(
                      'template_documento_id', NEW.template_documento_id,
                      'sorgente_tipo_id_atteso', v_tv_sorgente_id,
                      'sorgente_tipo_id_fornito', NEW.sorgente_tipo_id
                    ),
                    NULL::uuid,
                    VARIADIC ARRAY[]::text[]
                  );
                END IF;

                IF v_tv_emittente_id != NEW.emittente_fiscale_id THEN
                  PERFORM script.fn_log_and_raise_error(
                    'documenti', 'trgfn_documenti_generati_check_coerenza',
                    'E_DOCUMENTI_GENERATO_COERENZA',
                    jsonb_build_object(
                      'template_documento_id', NEW.template_documento_id,
                      'emittente_fiscale_id_atteso', v_tv_emittente_id,
                      'emittente_fiscale_id_fornito', NEW.emittente_fiscale_id
                    ),
                    NULL::uuid,
                    VARIADIC ARRAY[]::text[]
                  );
                END IF;

                RETURN NEW;
              END;
              $function$;
