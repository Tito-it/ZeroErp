            sql: |
              CREATE OR REPLACE FUNCTION documenti.trgfn_documenti_generati_file_protect_file()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo:
              --   Blocca l'UPDATE di campi file su documenti_generati_file.
              --
              -- Regole:
              --   Campi immutabili:
              --     - documento_generato_id, file_tipo_id
              --     - storage_key, sha256, file_size_bytes, mime_type, file_name
              --     - is_principale
              --   Campi modificabili (per futuro Fase B):
              --     - meta, ordinamento (condizionatamente)
              --
              -- Errore:
              --   E_DOCUMENTI_GENERATO_FILE_IMMUTABILE
              BEGIN
                IF  (NEW.documento_generato_id != OLD.documento_generato_id OR
                     NEW.file_tipo_id          != OLD.file_tipo_id          OR
                     NEW.storage_key           != OLD.storage_key           OR
                     NEW.sha256                != OLD.sha256                OR
                     NEW.file_size_bytes       != OLD.file_size_bytes       OR
                     NEW.mime_type             != OLD.mime_type             OR
                     NEW.file_name             != OLD.file_name             OR
                     NEW.is_principale         != OLD.is_principale) THEN
                  PERFORM script.fn_log_and_raise_error(
                    'documenti', 'trgfn_documenti_generati_file_protect_file',
                    'E_DOCUMENTI_GENERATO_FILE_IMMUTABILE',
                    jsonb_build_object(
                      'documento_generato_id', OLD.documento_generato_id,
                      'file_tipo_id', OLD.file_tipo_id
                    ),
                    NULL::uuid,
                    VARIADIC ARRAY[]::text[]
                  );
                END IF;
                RETURN NEW;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION documenti.trgfn_documenti_generati_protect_snapshot()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo:
              --   Blocca l'UPDATE di campi snapshot su un documento generato.
              --
              -- Regole:
              --   Campi immutabili (snapshot):
              --     - tipo_documento_output_id, template_documento_id,
              --       template_versione_id, sorgente_tipo_id, sorgente_uid,
              --       sorgente_riga, progressivo_sorgente, emittente_fiscale_id
              --     - context_json, context_hash, template_hash, pdf_hash
              --     - titolo, nome_file, uid
              --     - generato_at, generato_da_user_id
              --   Campi modificabili:
              --     - stato, meta
              --
              --   Il documento rappresenta un'istantanea di generazione.
              --   Se cambia il template, il tipo documento, la sorgente,
              --   il context o i dati, quell'istantanea è corrotta.
              --
              -- Errore:
              --   E_DOCUMENTI_GENERATO_SNAPSHOT_IMMUTABILE
              BEGIN
                IF  (NEW.tipo_documento_output_id      != OLD.tipo_documento_output_id      OR
                     NEW.template_documento_id         != OLD.template_documento_id         OR
                     NEW.template_versione_id          != OLD.template_versione_id          OR
                     NEW.sorgente_tipo_id              != OLD.sorgente_tipo_id              OR
                     NEW.sorgente_uid                  != OLD.sorgente_uid                  OR
                     NEW.sorgente_riga                 IS DISTINCT FROM OLD.sorgente_riga   OR
                     NEW.progressivo_sorgente          != OLD.progressivo_sorgente          OR
                     NEW.emittente_fiscale_id          != OLD.emittente_fiscale_id          OR
                     NEW.context_json                  != OLD.context_json                  OR
                     NEW.context_hash                  != OLD.context_hash                  OR
                     NEW.template_hash                 != OLD.template_hash                 OR
                     NEW.pdf_hash                      != OLD.pdf_hash                      OR
                     NEW.titolo                        != OLD.titolo                        OR
                     NEW.nome_file                     != OLD.nome_file                     OR
                     NEW.uid                           != OLD.uid                           OR
                     NEW.generato_at                   != OLD.generato_at                   OR
                     NEW.generato_da_user_id           IS DISTINCT FROM OLD.generato_da_user_id) THEN
                  PERFORM script.fn_log_and_raise_error(
                    'documenti', 'trgfn_documenti_generati_protect_snapshot',
                    'E_DOCUMENTI_GENERATO_SNAPSHOT_IMMUTABILE',
                    jsonb_build_object(
                      'documento_generato_id', OLD.id,
                      'uid', OLD.uid::text
                    ),
                    NULL::uuid,
                    VARIADIC ARRAY[]::text[]
                  );
                END IF;
                RETURN NEW;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION documenti.trgfn_template_asset_block_delete()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo:
              --   Blocca la cancellazione fisica di asset.
              --
              -- Regola:
              --   Non si cancellano mai asset fisicamente. Se un asset non
              --   serve piu', si chiude impostando valido_al. Questo preserva
              --   l'integrità storica dei documenti generati (che referenziano
              --   via template_asset_id).
              --
              -- Errore:
              --   E_DOCUMENTI_ASSET_DELETE_BLOCKED
              BEGIN
                PERFORM script.fn_log_and_raise_error(
                  'documenti', 'trgfn_template_asset_block_delete',
                  'E_DOCUMENTI_ASSET_DELETE_BLOCKED',
                  jsonb_build_object(
                    'template_asset_id', OLD.id,
                    'emittente_fiscale_id', OLD.emittente_fiscale_id,
                    'codice_interno', OLD.codice_interno
                  ),
                  NULL::uuid,
                  VARIADIC ARRAY[]::text[]
                );
                RETURN OLD;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION documenti.trgfn_template_asset_protect_file()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo:
              --   Blocca la modifica di colonne file su asset.
              --
              -- Regole:
              --   Campi immutabili (file specifics):
              --     - storage_key, sha256, file_size_bytes, mime_type, file_name
              --   Campi modificabili:
              --     - meta, validita (via valido_al)
              --
              --   Il file (e il suo hash) non si modificano mai.
              --   Se serve un file diverso si crea un nuovo asset.
              --
              -- Errore:
              --   E_DOCUMENTI_ASSET_FILE_IMMUTABILE
              BEGIN
                IF  (NEW.storage_key    != OLD.storage_key    OR
                     NEW.sha256         != OLD.sha256         OR
                     NEW.file_size_bytes != OLD.file_size_bytes OR
                     NEW.mime_type      != OLD.mime_type      OR
                     NEW.file_name      != OLD.file_name) THEN
                  PERFORM script.fn_log_and_raise_error(
                    'documenti', 'trgfn_template_asset_protect_file',
                    'E_DOCUMENTI_ASSET_FILE_IMMUTABILE',
                    jsonb_build_object(
                      'template_asset_id', OLD.id,
                      'emittente_fiscale_id', OLD.emittente_fiscale_id,
                      'codice_interno', OLD.codice_interno
                    ),
                    NULL::uuid,
                    VARIADIC ARRAY[]::text[]
                  );
                END IF;
                RETURN NEW;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION documenti.trgfn_template_documenti_versioni_block_delete()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo:
              --   Blocca la cancellazione fisica di versioni template
              --   quando sono in stato protetto o gia' utilizzate.
              --
              -- Regole:
              --   1. Non si cancellano versioni PUBBLICATA o OBSOLETA
              --      (manteniamo la storia per audit dei documenti generati).
              --   2. Non si cancellano versioni gia' usate da almeno un
              --      documento generato (integrità referenziale storica).
              --   3. Solo versioni BOZZA non usate possono essere cancellate.
              --
              -- Errore:
              --   E_DOCUMENTI_VERSIONE_DELETE_BLOCKED
              DECLARE
                v_count_documenti integer;
              BEGIN
                IF OLD.stato IN ('PUBBLICATA', 'OBSOLETA') THEN
                  PERFORM script.fn_log_and_raise_error(
                    'documenti', 'trgfn_template_documenti_versioni_block_delete',
                    'E_DOCUMENTI_VERSIONE_DELETE_BLOCKED',
                    jsonb_build_object(
                      'template_documento_id', OLD.template_documento_id,
                      'versione', OLD.versione,
                      'stato', OLD.stato
                    ),
                    NULL::uuid,
                    VARIADIC ARRAY[]::text[]
                  );
                END IF;

                SELECT COUNT(*)
                  INTO v_count_documenti
                  FROM documenti.documenti_generati
                 WHERE template_versione_id = OLD.id;

                IF v_count_documenti > 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'documenti', 'trgfn_template_documenti_versioni_block_delete',
                    'E_DOCUMENTI_VERSIONE_DELETE_BLOCKED',
                    jsonb_build_object(
                      'template_documento_id', OLD.template_documento_id,
                      'versione', OLD.versione,
                      'documento_generati_count', v_count_documenti
                    ),
                    NULL::uuid,
                    VARIADIC ARRAY[]::text[]
                  );
                END IF;

                RETURN OLD;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION documenti.trgfn_template_documenti_versioni_protect_pubblicata()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo:
              --   Blocca l'UPDATE su una versione template quando e' in stato PUBBLICATA.
              --   Una versione PUBBLICATA è immutabile: HTML, CSS, render engine,
              --   validita', template_documento_id, versione non si modificano.
              --   Per ogni cambio si crea una nuova BOZZA.
              --
              -- Errore:
              --   E_DOCUMENTI_VERSIONE_PUBBLICATA_IMMUTABILE
              BEGIN
                IF OLD.stato = 'PUBBLICATA' THEN
                  PERFORM script.fn_log_and_raise_error(
                    'documenti', 'trgfn_template_documenti_versioni_protect_pubblicata',
                    'E_DOCUMENTI_VERSIONE_PUBBLICATA_IMMUTABILE',
                    jsonb_build_object(
                      'template_documento_id', OLD.template_documento_id,
                      'versione', OLD.versione,
                      'stato', OLD.stato
                    ),
                    NULL::uuid,
                    VARIADIC ARRAY[]::text[]
                  );
                END IF;
                RETURN NEW;
              END;
              $function$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              SELECT 1;
