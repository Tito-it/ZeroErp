# LO SNAPSHOT DEL DOCUMENTO GENERATO CONGELA ANCHE sorgente_id
#   Brief: brief-db-sorgente-documento-e-riga §7.2 lotto D, giro D.1.
#
#   Dal 20261108-14 la chiave del documento stampato sta in sorgente_id oppure
#   in sorgente_uid, e una delle due e' sempre NULL. Il confronto con `!=` su una
#   colonna NULL da' NULL, cioe' «uguale»: le due chiavi si confrontano con IS
#   DISTINCT FROM, come gia' sorgente_riga. Il resto del corpo e' quello di
#   20260805-02, uguale al vivo (dbdev e scratch, 2026-11-07). Stessa firma,
#   nessun DROP. Rollback: il corpo di prima rieseguendo 20260805-02.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/documenti/20261108-16-update-trgfn-documenti-generati-protect-snapshot-sorgente-id-mctit.yaml

  - changeSet:
      id: 20261108-16-update-trgfn-documenti-generati-protect-snapshot-sorgente-id
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        documenti.trgfn_documenti_generati_protect_snapshot: sorgente_id entra nello snapshot, le due
        chiavi si confrontano con IS DISTINCT FROM. brief-db-sorgente-documento-e-riga §7.2 lotto D, giro D.1.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION documenti.trgfn_documenti_generati_protect_snapshot()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo:
              --   Blocca l'UPDATE di campi snapshot su un documento generato.
              --
              -- Regole:
              --   Campi immutabili (snapshot):
              --     - tipo_documento_output_id, template_documento_id,
              --       template_versione_id, sorgente_tipo_id, sorgente_id,
              --       sorgente_uid, sorgente_riga, progressivo_sorgente,
              --       emittente_fiscale_id
              --     - context_json, context_hash, template_hash, pdf_hash
              --     - titolo, nome_file, uid
              --     - generato_at, generato_da_user_id
              --   Campi modificabili:
              --     - stato, meta
              --
              --   Il documento rappresenta un'istantanea di generazione.
              --   Se cambia il template, il tipo documento, la sorgente,
              --   il context o i dati, quell'istantanea è corrotta.
              --   ⚠️ Le due chiavi della sorgente (sorgente_id, sorgente_uid) e la
              --      riga possono essere NULL: si confrontano con IS DISTINCT FROM.
              --
              -- Errore:
              --   E_DOCUMENTI_GENERATO_SNAPSHOT_IMMUTABILE
              BEGIN
                IF  (NEW.tipo_documento_output_id      != OLD.tipo_documento_output_id      OR
                     NEW.template_documento_id         != OLD.template_documento_id         OR
                     NEW.template_versione_id          != OLD.template_versione_id          OR
                     NEW.sorgente_tipo_id              != OLD.sorgente_tipo_id              OR
                     NEW.sorgente_id                   IS DISTINCT FROM OLD.sorgente_id     OR
                     NEW.sorgente_uid                  IS DISTINCT FROM OLD.sorgente_uid    OR
                     NEW.sorgente_riga                 IS DISTINCT FROM OLD.sorgente_riga   OR
                     NEW.progressivo_sorgente          != OLD.progressivo_sorgente          OR
                     NEW.emittente_fiscale_id          != OLD.emittente_fiscale_id          OR
                     NEW.context_json                  != OLD.context_json                  OR
                     NEW.context_hash                  != OLD.context_hash                  OR
                     NEW.template_hash                 != OLD.template_hash                 OR
                     NEW.pdf_hash                      != OLD.pdf_hash                      OR
                     NEW.titolo                        != OLD.titolo                        OR
                     NEW.nome_file                     != OLD.nome_file                     OR
                     NEW.uid                           != OLD.uid                           OR
                     NEW.generato_at                   != OLD.generato_at                   OR
                     NEW.generato_da_user_id           IS DISTINCT FROM OLD.generato_da_user_id) THEN
                  PERFORM script.fn_log_and_raise_error(
                    'documenti', 'trgfn_documenti_generati_protect_snapshot',
                    'E_DOCUMENTI_GENERATO_SNAPSHOT_IMMUTABILE',
                    jsonb_build_object(
                      'documento_generato_id', OLD.id,
                      'uid', OLD.uid::text
                    ),
                    NULL::uuid,
                    VARIADIC ARRAY[]::text[]
                  );
                END IF;
                RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION documenti.trgfn_documenti_generati_protect_snapshot() IS
                'Guard A7: blocca UPDATE su snapshot. Documento generato = istantanea immutabile di generazione. Solo stato e meta modificabili. La sorgente fa parte dello snapshot con tutte e due le chiavi (sorgente_id, sorgente_uid) e la riga, confrontate con IS DISTINCT FROM perche'' possono essere NULL.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Il corpo di prima torna rieseguendo 20260805-02 (CREATE OR REPLACE, stessa firma).
              SELECT 1;
