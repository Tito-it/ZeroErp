# UNA STAMPA NASCE DALLA VERSIONE CON CUI IL MODELLO STAMPA OGGI
#   documenti.trgfn_documenti_generati_check_coerenza
#
# -- PERCHE' --------------------------------------------------------------
#   Dal giro 1 della revisione di documenti le FK della stampa verso modello,
#   versione, tipo, sorgente e azienda stanno fra le eccezioni ATTIVO: una
#   stampa e' storia, e non tiene accesi i padri. L'eccezione toglie anche il
#   controllo opposto, «il padre e' acceso quando il figlio nasce»: dopo il
#   giro 1 una stampa poteva nascere da un modello spento, da una versione
#   spenta, da una bozza o da una versione superata, e lo impediva solo la
#   risoluzione del servizio prima del render.
#   Q13 di Tid (2026-11-16, strada b): la coerenza alla nascita chiede anche
#   la stampabilita', con la regola della risoluzione e non una copia. Il
#   trigger chiama documenti.fn_template_motivo_non_stampabile (20261116-05)
#   con la versione della stampa: il modello deve stampare oggi, e proprio con
#   quella versione. «Oggi» e' la data operativa, la stessa che la
#   risoluzione usa un istante prima.
#   Il rifiuto e' E_DOCUMENTI_GENERATO_COERENZA, come per le altre regole
#   della nascita, col motivo per nome nel contesto (MODELLO_SPENTO,
#   NESSUNA_VERSIONE_VALIDA, VERSIONE_NON_IN_USO). La ristampa fedele non
#   passa di qui: rilegge la stampa, non ne scrive una nuova.
#   Non si chiede che sorgente e azienda siano accese: la risoluzione non lo
#   chiede, e la stampa segue il suo documento, che esiste.
#   Commento del corpo al presente (linee-guida-sql §5d).
#
#   Corpo dalla doc auto-generata (ultimo changeSet sull'oggetto prima di
#   questo: 20261115-86). Il montaggio non cambia (BEFORE INSERT,
#   trg_documenti_generati_a10_check_coerenza_ins). LANGUAGE, SECURITY INVOKER
#   invariati: legge modelli e versioni con i privilegi di chi scrive, come la
#   risoluzione un istante prima. Le due tabelle non hanno sicurezza di riga:
#   non c'e' una riga che chi scrive non vede (linee-guida-trigger, «un guard
#   che decide su una riga correlata»).
#
# -- CHI SCRIVE STAMPE (censito 2026-11-16) --------------------------------
#   BE: genera_documento, dopo fn_risolvi_template_applicabile. Nessun seed.
#   pgTAP: le fixture che registrano stampe pubblicano la versione prima, con
#   valido_dal nel passato: la versione e' quella in uso.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/documenti/20261116-07-update-check-coerenza-stampa-dalla-versione-in-uso-mctit.yaml

  - changeSet:
      id: 20261116-07-update-check-coerenza-stampa-dalla-versione-in-uso
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        La coerenza alla nascita di una stampa chiede anche che il modello stampi oggi con la versione
        della stampa (documenti.fn_template_motivo_non_stampabile).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION documenti.trgfn_documenti_generati_check_coerenza()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: alla nascita di una stampa, i suoi riferimenti stanno
              --   insieme e il modello puo' stampare con quella versione.
              --
              -- Regole, nell'ordine:
              --   1. la versione appartiene al modello indicato;
              --   2. il modello va bene per il documento: stessa sorgente,
              --      stesso tipo di output, e la stessa azienda oppure un
              --      modello standard (fn_template_motivo_non_coerente);
              --   3. il modello stampa oggi, e proprio con questa versione
              --      (fn_template_motivo_non_stampabile).
              --   Le regole 2 e 3 sono le stesse che la risoluzione applica
              --   prima del render.
              --
              -- Errore: E_DOCUMENTI_GENERATO_COERENZA, col motivo nel contesto.
              DECLARE
                v_tv_template_id documenti.template_documenti_versioni.template_documento_id%TYPE;
                -- tipo esplicito: il motivo dei BB, non una colonna
                v_motivo         text;
              BEGIN
                SELECT v.template_documento_id
                  INTO v_tv_template_id
                  FROM documenti.template_documenti_versioni v
                 WHERE v.id = NEW.template_versione_id;

                IF v_tv_template_id IS DISTINCT FROM NEW.template_documento_id THEN
                  PERFORM script.fn_log_and_raise_error(
                    'documenti', 'trgfn_documenti_generati_check_coerenza',
                    'E_DOCUMENTI_GENERATO_COERENZA',
                    jsonb_build_object(
                      'motivo', 'VERSIONE_DI_ALTRO_MODELLO',
                      'template_versione_id', NEW.template_versione_id,
                      'template_documento_id_atteso', v_tv_template_id,
                      'template_documento_id_fornito', NEW.template_documento_id
                    ),
                    NULL::uuid,
                    VARIADIC ARRAY[]::text[]
                  );
                END IF;

                v_motivo := documenti.fn_template_motivo_non_coerente(
                    NEW.template_documento_id, NEW.sorgente_tipo_id,
                    NEW.emittente_fiscale_id, NEW.tipo_documento_output_id);

                IF v_motivo IS NOT NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'documenti', 'trgfn_documenti_generati_check_coerenza',
                    'E_DOCUMENTI_GENERATO_COERENZA',
                    jsonb_build_object(
                      'template_documento_id', NEW.template_documento_id,
                      'motivo', v_motivo,
                      'sorgente_tipo_id', NEW.sorgente_tipo_id,
                      'tipo_documento_output_id', NEW.tipo_documento_output_id,
                      'emittente_fiscale_id', NEW.emittente_fiscale_id
                    ),
                    NULL::uuid,
                    VARIADIC ARRAY[]::text[]
                  );
                END IF;

                v_motivo := documenti.fn_template_motivo_non_stampabile(
                    NEW.template_documento_id, NEW.template_versione_id);

                IF v_motivo IS NOT NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'documenti', 'trgfn_documenti_generati_check_coerenza',
                    'E_DOCUMENTI_GENERATO_COERENZA',
                    jsonb_build_object(
                      'template_documento_id', NEW.template_documento_id,
                      'template_versione_id', NEW.template_versione_id,
                      'motivo', v_motivo
                    ),
                    NULL::uuid,
                    VARIADIC ARRAY[]::text[]
                  );
                END IF;

                RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION documenti.trgfn_documenti_generati_check_coerenza() IS
                  'Giudica, alla nascita di una stampa, che i suoi riferimenti stiano insieme e che il modello possa stampare: la versione appartiene al modello indicato (motivo VERSIONE_DI_ALTRO_MODELLO); il modello va bene per il documento, stessa sorgente, stesso tipo di output, stessa azienda oppure modello standard (motivi SORGENTE, TIPO, EMITTENTE, MODELLO_INESISTENTE: documenti.fn_template_motivo_non_coerente); il modello stampa oggi, e proprio con la versione della stampa (motivi MODELLO_SPENTO, NESSUNA_VERSIONE_VALIDA, VERSIONE_NON_IN_USO: documenti.fn_template_motivo_non_stampabile). Sono le regole che la risoluzione applica prima del render. Solleva E_DOCUMENTI_GENERATO_COERENZA, col motivo per nome nel contesto. Montata solo su INSERT: un cambio successivo del modello, o il suo spegnimento, non tocca le stampe gia'' fatte.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Il corpo di prima (senza la stampabilita') lo rimette il
              -- changeSet 20261115-86, rilanciato.
              SELECT 1;
