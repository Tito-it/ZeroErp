# Arita' dei valori — `E_SHOP_RICEVUTA_BA_CANALE_INVALIDO` passava 1 valore su 2 segnaposto
#   Brief: docs/it/dev/work-done/brief-db-segnaposti-messaggi-errore.md §7
#   Lotto: 20260818-47 .. -54, uno per funzione. Decisione Tid, 2026-08-18.
#
# ── IL DIFETTO, IN UNA RIGA ────────────────────────────────────────────
#   `script.fn_log_and_raise_error` compone il testo con
#   `format(messaggio, VARIADIC valori)`. Con MENO valori dei segnaposto,
#   `format()` non degrada: **alza `22023`**. E alza da DENTRO la funzione,
#   quindi il `RAISE` di dominio due righe sotto non viene mai eseguito —
#   niente `P0001`, niente codice nel canale `CONSTRAINT`, niente campo nel
#   canale `COLUMN`. Il guard blocca lo stesso (il dato resta integro, ed e'
#   il motivo per cui non se n'era accorto nessuno), ma il backend perde il
#   codice su cui decide 409/404/403 e l'operatore legge un errore interno al
#   posto della frase scritta per lui.
#
# ── ⚠️ LA FORMA: DUE MESSAGGI SCRITTI DUE VOLTE ────────────────────────
#   Qui non manca un valore per distrazione: il chiamante passava una **frase
#   gia' composta** come valore unico, mentre a catalogo il messaggio ha i suoi
#   segnaposto. Sono due testi che dicono la stessa cosa e non si compongono.
#   ⭐ Ed e' un difetto anche quando non alza: una frase composta dentro al
#   plpgsql **non e' traducibile**, perche' non passa da
#   `config.messaggi_errore`. I valori vanno passati sciolti; il testo lo
#   compone il catalogo, che e' l'unico posto da cui si puo' tradurre.
#
# ── NOTE DI CASA ────────────────────────────────────────────────────────
#   · ⚠️ **PERMESSI — nessun prestito di proprieta', nessun `GRANT`.** Misurato
#     il 2026-08-18, non dedotto: questa funzione e' di **`titodb`** (che e' chi
#     migra), **non** e' `SECURITY DEFINER` e **non** e' nel registro
#     `dbops.sec_functions_owner`. Il precedente e' il `20260808-04` su
#     `script.fn_log_and_raise_error`, che documenta anche il perche' l'ACL
#     esplicita (`=X/titodb`, `zeroerp_app=X`, `zeroerp_batch_fatturazione=X`)
#     **sopravvive** a un `CREATE OR REPLACE` — sarebbe diverso con
#     `DROP` + `CREATE`, dove i privilegi si perdono e il loop di grant
#     `20260205-41` li rimetterebbe solo alla corsa `ci_apply` successiva.
#     ⚠️ Da non confondere con `script.fn_log_error_only`, che invece e' di
#     `postgres`, **e'** `SECURITY DEFINER` ed **e'** nel registro: quella,
#     riscriverla, il prestito lo richiede.
#   · Corpo dalla doc auto-gen `docs/it/dbzero/`, col `;` dopo `$function$`
#     aggiunto a mano: l'auto-gen non ce l'ha e senza quello il `COMMENT`
#     sotto da' «errore di sintassi a o presso COMMENT».
#   · Firma e `RETURNS` invariati: cambia solo la lista dei valori.
#   · Presidio: `db/pgtap/script/test-catalogo-messaggi-errore-completo.sql`
#     test 5. Rientra quando l'ultimo degli 8 changeSet e' applicato — e a
#     quel punto va tolta la riga di questo file da `baseline-rossi.tsv`.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/shop/20260818-52-update-trgfn-ricevute-guard-ba-canale-arita-mctit.yaml

  - changeSet:
      id: 20260818-52-update-trgfn-ricevute-guard-ba-canale-arita
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Il guard passava a fn_log_and_raise_error una copia letterale del messaggio a
        catalogo, gia' composta con format(), come valore unico: il template ha due
        segnaposto, quindi la format() interna alzava 22023 e il P0001 di dominio non
        arrivava. Ora passa id ricevuta e canale del BA sciolti.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: |
              SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'shop' AND p.proname = 'trgfn_ricevute_guard_ba_canale'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION shop.trgfn_ricevute_guard_ba_canale()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_ba_canale config.canale_origine;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Vincolare shop.ricevute.billing_account_id a puntare
                  --   SOLO a billing_account con canale_origine='SHOP'.
                  --   L'invariante protegge la separazione di canale
                  --   (decisione dominio 20-04-2026): ricevute shop vivono
                  --   su BA dedicati, portale su BA portale, ADMIN su BA
                  --   ADMIN.
                  --
                  -- Regole:
                  --   1. INSERT: sempre verifica (NEW.billing_account_id e'
                  --      NOT NULL per constraint tabella).
                  --   2. UPDATE OF billing_account_id: scatta solo se la FK
                  --      cambia; eventuali UPDATE su altri campi sono
                  --      trasparenti (performance).
                  --   3. SELECT lookup su billing_account: gia' protetto
                  --      dalla FK fk_shop_ricevute_billing_account; qui
                  --      interroghiamo la colonna canale_origine.
                  --   4. Se BA non trovato (race con DELETE): la FK
                  --      fk_shop_ricevute_billing_account gia' garantisce
                  --      l'esistenza. Il v_ba_canale NULL non dovrebbe
                  --      mai verificarsi in pratica, ma fail-closed.
                  -- =========================================================

                  SELECT ba.canale_origine
                    INTO v_ba_canale
                    FROM anagrafiche.billing_account ba
                   WHERE ba.id = NEW.billing_account_id;

                  IF v_ba_canale IS DISTINCT FROM 'SHOP'::config.canale_origine THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          'shop.trgfn_ricevute_guard_ba_canale',
                          'E_SHOP_RICEVUTA_BA_CANALE_INVALIDO',
                          jsonb_build_object(
                              'op', TG_OP,
                              'ricevuta_id', NEW.id,
                              'billing_account_id', NEW.billing_account_id,
                              'canale_ba', COALESCE(v_ba_canale::text, 'NULL')
                          ),
                          NULL::uuid,
                          -- ⚠️ ARITA' (2026-08-18): la frase composta qui dentro era la
                          --   COPIA ESATTA del messaggio a catalogo, passata come valore
                          --   unico a un template che ha due segnaposto -> 22023.
                          --   Si vede bene, in questo punto, perche' comporre nel plpgsql sia
                          --   sbagliato in se': la frase era scritta due volte, e la copia nel
                          --   codice non sarebbe stata traducibile.
                          NEW.id::text,
                          COALESCE(v_ba_canale::text, 'NULL')
                      );
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION shop.trgfn_ricevute_guard_ba_canale()
              IS 'Trigger function: blocca INSERT/UPDATE di shop.ricevute se billing_account_id punta a un BA con canale_origine != SHOP. Applicata BEFORE INSERT + UPDATE OF billing_account_id. Codice errore E_SHOP_RICEVUTA_BA_CANALE_INVALIDO (id 386).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Vuoto di proposito: il ripristino della versione precedente
              -- rimetterebbe in servizio la chiamata che alza 22023. Se serve
              -- tornare indietro, si scrive un changeSet in avanti.
              SELECT 1;
