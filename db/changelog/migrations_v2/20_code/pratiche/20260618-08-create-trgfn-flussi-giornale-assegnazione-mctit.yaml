# Assegnazione flusso — Intervento 3b (brief-db-assegnazione-flusso §4).
# Trigger giornale per il cambio assegnazione del FLUSSO (la pratica ce l'ha
# gia': trgfn_pratiche_giornale_assegnazione). Mirror a livello flusso.
#
# Differenze dal mirror pratica (decisioni DEC-3/DEC-4):
#   - azione  = 'FLUSSO_ASSEGNAZIONE_CAMBIATA' (simmetrica a FLUSSO_STATO_CAMBIATO;
#               ammessa dal CHECK aggiornato in 20260618-07)
#   - origine = 'UTENTE' (qui assegna l'operatore; un domani un algoritmo -> SISTEMA.
#               L'assegnazione PRATICA resta 'SISTEMA', allineamento futuro)
#   - pratica_id = NEW.pratica_id, flusso_id = NEW.id
#
# user_insert NON elencato: lo imposta l'audit (Part B, 20260618-04 + automation)
# dalla GUC app.jwt_user. Guard IS DISTINCT FROM nella clausola WHEN del trigger.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/pratiche/20260618-08-create-trgfn-flussi-giornale-assegnazione-mctit.yaml

  - changeSet:
      id: 20260618-08-create-trgfn-flussi-giornale-assegnazione
      author: mctit
      runOnChange: false
      comment: >
        Trigger giornale assegnazione flusso: registra FLUSSO_ASSEGNAZIONE_CAMBIATA
        (origine UTENTE) su AFTER UPDATE OF risorsa_umana_id/unita_organizzativa_id
        in pratiche.flussi, con dettaglio OLD/NEW. Guard IS DISTINCT FROM.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION pratiche.trgfn_flussi_giornale_assegnazione()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              -- Scopo:
              --   Registra FLUSSO_ASSEGNAZIONE_CAMBIATA nel giornale.
              --   Trigger AFTER UPDATE OF risorsa_umana_id, unita_organizzativa_id
              --   su pratiche.flussi (mirror del livello pratica).
              BEGIN
                INSERT INTO pratiche.giornale
                  (pratica_id, flusso_id, azione, origine, dettaglio, tx_id)
                VALUES (
                  NEW.pratica_id,
                  NEW.id,
                  'FLUSSO_ASSEGNAZIONE_CAMBIATA',
                  'UTENTE',
                  jsonb_build_object(
                    'risorsa_umana_precedente_id', OLD.risorsa_umana_id,
                    'risorsa_umana_nuova_id', NEW.risorsa_umana_id,
                    'unita_organizzativa_precedente_id', OLD.unita_organizzativa_id,
                    'unita_organizzativa_nuova_id', NEW.unita_organizzativa_id
                  ),
                  NEW.tx_id
                );
                RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION pratiche.trgfn_flussi_giornale_assegnazione()
                IS 'AFTER UPDATE OF risorsa_umana_id/unita_organizzativa_id su pratiche.flussi: registra FLUSSO_ASSEGNAZIONE_CAMBIATA (origine UTENTE) nel giornale con dettaglio OLD/NEW.';

              DROP TRIGGER IF EXISTS trg_flussi_z90_giornale_assegnazione_upd
                ON pratiche.flussi;

              CREATE TRIGGER trg_flussi_z90_giornale_assegnazione_upd
                AFTER UPDATE OF risorsa_umana_id, unita_organizzativa_id
                ON pratiche.flussi
                FOR EACH ROW
                WHEN (
                  OLD.risorsa_umana_id IS DISTINCT FROM NEW.risorsa_umana_id
                  OR OLD.unita_organizzativa_id IS DISTINCT FROM NEW.unita_organizzativa_id
                )
                EXECUTE FUNCTION pratiche.trgfn_flussi_giornale_assegnazione();

      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_flussi_z90_giornale_assegnazione_upd
                ON pratiche.flussi;
              DROP FUNCTION IF EXISTS pratiche.trgfn_flussi_giornale_assegnazione();
