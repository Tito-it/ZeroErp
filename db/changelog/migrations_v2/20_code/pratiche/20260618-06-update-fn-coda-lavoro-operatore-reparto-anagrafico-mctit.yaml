# Assegnazione flusso — Intervento 2 (brief-db-assegnazione-flusso §3).
# fn_coda_lavoro_operatore allineata alla policy reparto-first (design §2.2).
#
# Livelli (mutuamente esclusivi, priorita' decrescente):
#   ASSEGNATO  — assegnato direttamente all'operatore (invariato)
#   COMPETENZA — non assegnato, DA_ESEGUIRE, operatore competente per il
#                template (casi A/D) (invariato nella sostanza)
#   REPARTO    — RIDEFINITO: non assegnato, DA_ESEGUIRE, f.unita_organizzativa_id
#                = reparto ANAGRAFICO dell'operatore (risorse_umane.unita_organizzativa_id,
#                NON piu' reparto-da-competenza) e NESSUNO skill-lock attivo sul
#                template (caso B: presa libera nel reparto)
#   LIBERO     — NUOVO (decisione DEC-1): non assegnato, DA_ESEGUIRE, niente reparto
#                e niente skill-lock (caso C), mostrato all'operatore della PRATICA
#                (p.risorsa_umana_id = operatore) per non lasciarlo invisibile
#
# skill-lock = ∃ competenza ATTIVA per il template (coerente con fn_prendi_in_carico_flusso).
# Esclusione pratiche terminali invariata. Firma/RETURNS invariati (CREATE OR REPLACE).
# Nota: competenze_flussi.unita_organizzativa_id non e' piu' usata qui (DEC-5).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/pratiche/20260618-06-update-fn-coda-lavoro-operatore-reparto-anagrafico-mctit.yaml

  - changeSet:
      id: 20260618-06-update-fn-coda-lavoro-operatore-reparto-anagrafico
      author: mctit
      runOnChange: false
      comment: >
        fn_coda_lavoro_operatore: REPARTO su reparto anagrafico + no skill-lock
        (caso B); nuovo livello LIBERO (caso C) all'operatore della pratica.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION pratiche.fn_coda_lavoro_operatore(
                  p_risorsa_umana_id     anagrafiche.risorse_umane.id%TYPE,
                  p_emittente_fiscale_id anagrafiche.emittenti_fiscali.id%TYPE
              )
              RETURNS TABLE (
                  livello                 TEXT,
                  flusso_id               pratiche.flussi.id%TYPE,
                  pratica_id              pratiche.pratiche.id%TYPE,
                  pratica_codice          pratiche.pratiche.codice%TYPE,
                  pratica_descrizione     pratiche.pratiche.descrizione%TYPE,
                  priorita_codice         config.priorita_pratiche.codice_interno%TYPE,
                  tipo_prestazione_codice pratiche.tipi_prestazione.codice%TYPE,
                  template_flusso_codice  pratiche.template_flussi.codice%TYPE,
                  template_flusso_desc    pratiche.template_flussi.descrizione%TYPE,
                  stato_flusso_codice     config.stati_flussi_pratiche.codice_interno%TYPE,
                  sequenza                pratiche.flussi.sequenza%TYPE,
                  data_scadenza           pratiche.pratiche.data_scadenza%TYPE,
                  risorsa_assegnata       TEXT
              )
              LANGUAGE sql
              STABLE
              AS $function$
              -- Coda di lavoro operatore su quattro livelli (policy reparto-first §2.2):
              --   ASSEGNATO > COMPETENZA (A/D) > REPARTO (B) > LIBERO (C).
              -- Ogni flusso appare in un solo livello (il piu' alto applicabile).
              WITH stati_pendenti AS (
                  SELECT id, codice_interno
                    FROM config.stati_flussi_pratiche
                   WHERE codice_interno IN ('DA_ESEGUIRE', 'IN_CORSO')
              ),
              operatore AS (
                  -- Reparto ANAGRAFICO dell'operatore (NON i reparti-da-competenza)
                  SELECT unita_organizzativa_id AS reparto_anagrafico
                    FROM anagrafiche.risorse_umane
                   WHERE id = p_risorsa_umana_id
              ),
              competenze_op AS (
                  -- Template per cui l'operatore ha competenza attiva (casi A/D)
                  SELECT cf.template_flusso_id
                    FROM pratiche.competenze_flussi cf
                   WHERE cf.risorsa_umana_id = p_risorsa_umana_id
                     AND cf.attivo = true
              ),
              flussi_base AS (
                  SELECT
                      f.id AS flusso_id,
                      f.pratica_id,
                      f.template_flusso_id,
                      f.risorsa_umana_id,
                      f.unita_organizzativa_id,
                      f.sequenza,
                      f.data_scadenza AS flusso_scadenza,
                      sf.codice_interno AS stato_codice,
                      p.risorsa_umana_id AS pratica_risorsa
                  FROM pratiche.flussi f
                  JOIN stati_pendenti sf ON sf.id = f.stato_id
                  JOIN pratiche.pratiche p ON p.id = f.pratica_id
                  WHERE p.emittente_fiscale_id = p_emittente_fiscale_id
                    -- Escludi pratiche TERMINALI (nessuna transizione di stato in uscita attiva)
                    AND EXISTS (
                        SELECT 1 FROM config.transizioni_stati_pratiche t
                         WHERE t.stato_da_id = p.stato_id AND t.attivo
                    )
              ),
              classificati AS (
                  SELECT
                      fb.*,
                      CASE
                          -- ASSEGNATO: assegnato direttamente all'operatore
                          WHEN fb.risorsa_umana_id = p_risorsa_umana_id
                              THEN 'ASSEGNATO'
                          -- COMPETENZA (A/D): prendibile per skill
                          WHEN fb.risorsa_umana_id IS NULL
                               AND fb.stato_codice = 'DA_ESEGUIRE'
                               AND EXISTS (SELECT 1 FROM competenze_op co
                                            WHERE co.template_flusso_id = fb.template_flusso_id)
                              THEN 'COMPETENZA'
                          -- REPARTO (B): reparto anagrafico match, nessuno skill-lock attivo
                          WHEN fb.risorsa_umana_id IS NULL
                               AND fb.stato_codice = 'DA_ESEGUIRE'
                               AND fb.unita_organizzativa_id IS NOT NULL
                               AND fb.unita_organizzativa_id = (SELECT reparto_anagrafico FROM operatore)
                               AND NOT EXISTS (SELECT 1 FROM pratiche.competenze_flussi cf
                                                WHERE cf.template_flusso_id = fb.template_flusso_id
                                                  AND cf.attivo = true)
                              THEN 'REPARTO'
                          -- LIBERO (C): niente reparto, niente skill-lock, pratica dell'operatore
                          WHEN fb.risorsa_umana_id IS NULL
                               AND fb.stato_codice = 'DA_ESEGUIRE'
                               AND fb.unita_organizzativa_id IS NULL
                               AND fb.pratica_risorsa = p_risorsa_umana_id
                               AND NOT EXISTS (SELECT 1 FROM pratiche.competenze_flussi cf
                                                WHERE cf.template_flusso_id = fb.template_flusso_id
                                                  AND cf.attivo = true)
                              THEN 'LIBERO'
                      END AS livello
                  FROM flussi_base fb
              )
              SELECT
                  c.livello,
                  c.flusso_id,
                  p.id,
                  p.codice,
                  p.descrizione,
                  pp.codice_interno,
                  tp.codice,
                  tf.codice,
                  tf.descrizione,
                  c.stato_codice,
                  c.sequenza,
                  COALESCE(c.flusso_scadenza, p.data_scadenza),
                  -- risorsa_assegnata: i livelli mostrati sono auto-assegnato o non
                  -- assegnati -> nessun "altro" da mostrare (NULL).
                  NULL::text
              FROM classificati c
              JOIN pratiche.pratiche p ON p.id = c.pratica_id
              JOIN config.priorita_pratiche pp ON pp.id = p.priorita_id
              JOIN pratiche.tipi_prestazione tp ON tp.id = p.tipo_prestazione_id
              LEFT JOIN pratiche.template_flussi tf ON tf.id = c.template_flusso_id
              WHERE c.livello IS NOT NULL
              ORDER BY
                  CASE c.livello
                      WHEN 'ASSEGNATO'  THEN 1
                      WHEN 'COMPETENZA' THEN 2
                      WHEN 'REPARTO'    THEN 3
                      WHEN 'LIBERO'     THEN 4
                  END,
                  pp.codice_interno DESC,
                  COALESCE(c.flusso_scadenza, p.data_scadenza) NULLS LAST,
                  c.sequenza;
              $function$;

              COMMENT ON FUNCTION pratiche.fn_coda_lavoro_operatore(
                  anagrafiche.risorse_umane.id%TYPE,
                  anagrafiche.emittenti_fiscali.id%TYPE
              ) IS 'Coda di lavoro operatore su quattro livelli: ASSEGNATO, COMPETENZA (A/D), REPARTO (B, reparto anagrafico + no skill-lock), LIBERO (C, all''operatore della pratica). Esclude pratiche terminali.';
