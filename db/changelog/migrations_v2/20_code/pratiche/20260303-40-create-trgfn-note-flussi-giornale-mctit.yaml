# Liquibase changelog per Zero ERP
# Trigger function pratiche.trgfn_note_flussi_giornale
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/pratiche/20260303-40-create-trgfn-note-flussi-giornale-mctit.yaml

  - changeSet:
      id: 20260303-40-create-trgfn-note-flussi-giornale
      author: mctit
      runOnChange: false
      comment: "Logga NOTA_AGGIUNTA nel giornale su INSERT nota flusso."
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION pratiche.trgfn_note_flussi_giornale()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_pratica_id pratiche.pratiche.id%TYPE;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Registra NOTA_AGGIUNTA nel giornale a livello flusso.
                --   Trigger AFTER INSERT su pratiche.note_flussi.
                --
                -- Dettaglio:
                --   Recupera pratica_id dal flusso per inserire nel giornale.
                -- =========================================================

                -- Recupera pratica_id dal flusso
                SELECT f.pratica_id INTO v_pratica_id
                  FROM pratiche.flussi f
                 WHERE f.id = NEW.flusso_id;

                INSERT INTO pratiche.giornale
                  (pratica_id, flusso_id, azione, origine, dettaglio, tx_id)
                VALUES (
                  v_pratica_id,
                  NEW.flusso_id,
                  'NOTA_AGGIUNTA',
                  'SISTEMA',
                  jsonb_build_object(
                    'nota_id', NEW.id,
                    'tipo_nota_id', NEW.tipo_nota_id
                  ),
                  NEW.tx_id
                );
                RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION pratiche.trgfn_note_flussi_giornale()
                IS 'AFTER INSERT su note_flussi: logga NOTA_AGGIUNTA nel giornale.';
