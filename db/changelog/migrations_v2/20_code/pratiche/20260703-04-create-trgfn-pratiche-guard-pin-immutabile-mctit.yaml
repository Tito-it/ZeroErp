# ------------------------------------------------------------
# Immutabilita' del PIN della pratica (D2-9b, Fase 1).
# (brief-db-step-dominio-e-definizioni-versionate Parte 2 / Fase 1)
#
# BEFORE UPDATE OF definizione_id su pratiche.pratiche: il pin, una volta
# valorizzato, non cambia piu' -> PRATICHE_PIN_IMMUTABILE (513). E' il cuore di
# V6: la pratica resta per sempre sull'edizione con cui e' nata.
#
# Ammette SOLO la transizione NULL -> valore: e' il caso del backfill Fase 0
# (20260702-25), che in replay CI gira in 80_data DOPO questo guard (creato in
# 20_code). Condizione: OLD.definizione_id IS NOT NULL AND OLD IS DISTINCT FROM
# NEW. Una pratica non ancora pinnata (OLD NULL) puo' ricevere il pin; una gia'
# pinnata non puo' cambiarlo.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/pratiche/20260703-04-create-trgfn-pratiche-guard-pin-immutabile-mctit.yaml

  - changeSet:
      id: 20260703-04-create-trgfn-pratiche-guard-pin-immutabile
      author: mctit
      runOnChange: false
      comment: >
        Guard BEFORE UPDATE OF definizione_id su pratiche.pratiche: il pin, una
        volta valorizzato, e' immutabile (PRATICHE_PIN_IMMUTABILE 513). Ammette
        solo NULL->valore (backfill Fase 0).
      preConditions:
        - onFail: HALT
        - columnExists:
            schemaName: pratiche
            tableName: pratiche
            columnName: definizione_id
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION pratiche.trgfn_pratiche_guard_pin_immutabile()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              -- Scopo: il PIN dell'edizione di workflow e' definitivo. Una volta
              --        valorizzato non cambia: le pratiche in volo non migrano di
              --        edizione (V6). Ammessa solo la prima valorizzazione
              --        (NULL -> valore), es. il backfill Fase 0.
              BEGIN
                IF OLD.definizione_id IS NOT NULL
                   AND NEW.definizione_id IS DISTINCT FROM OLD.definizione_id THEN
                  PERFORM script.fn_log_and_raise_error(
                    'pratiche',
                    'pratiche.trgfn_pratiche_guard_pin_immutabile',
                    'PRATICHE_PIN_IMMUTABILE',
                    jsonb_build_object(
                      'pratica_id',      NEW.id,
                      'definizione_da',  OLD.definizione_id,
                      'definizione_a',   NEW.definizione_id
                    ),
                    NEW.tx_id,
                    NEW.id::text,
                    OLD.definizione_id::text
                  );
                END IF;
                RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION pratiche.trgfn_pratiche_guard_pin_immutabile()
                IS 'BEFORE UPDATE OF definizione_id su pratiche.pratiche: il pin dell''edizione di workflow e'' immutabile una volta valorizzato (PRATICHE_PIN_IMMUTABILE 513). Ammette solo NULL->valore (backfill Fase 0). Cuore di V6.';

              DROP TRIGGER IF EXISTS trg_pratiche_a10_guard_pin_immutabile_upd
                ON pratiche.pratiche;

              CREATE TRIGGER trg_pratiche_a10_guard_pin_immutabile_upd
                BEFORE UPDATE OF definizione_id
                ON pratiche.pratiche
                FOR EACH ROW
                EXECUTE FUNCTION pratiche.trgfn_pratiche_guard_pin_immutabile();

      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_pratiche_a10_guard_pin_immutabile_upd
                ON pratiche.pratiche;
              DROP FUNCTION IF EXISTS pratiche.trgfn_pratiche_guard_pin_immutabile();
