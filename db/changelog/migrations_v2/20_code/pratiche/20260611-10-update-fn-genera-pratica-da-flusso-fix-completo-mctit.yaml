# D-fix (2/3) — fn_genera_pratica_da_flusso: chiusura dei 4 buchi
# rilevati dall'analisi critica (analisi-pratiche-workflow-v2 §7.B):
#
#   fix-1 IDEMPOTENZA: se esiste gia' una pratica figlia per
#         (flusso_origine_id, tipo destinazione) la funzione ritorna
#         l'id esistente senza crearne un'altra. Copre sia il trigger
#         sia la chiamata manuale via API /genera/. Cintura
#         strutturale: uq_pratiche_flusso_origine_tipo (20260611-09).
#   fix-2 PRATICA_PADRE: valorizza pratica_padre_id = pratica del
#         flusso origine (prima era codice morto: mai scritto).
#   fix-3 FLUSSO INIZIALE: se la regola dichiara
#         template_flusso_dest_id, crea il flusso iniziale
#         (DA_ESEGUIRE, sequenza del template) nella pratica figlia
#         (prima la colonna era ignorata). Il template destinazione
#         deve essere senza prerequisiti (la figlia nasce vuota):
#         in caso contrario il guard prerequisiti fa fallire la
#         generazione — fail-fast voluto, e' un errore di seed regola.
#   fix-4 CONTESTO: propaga soggetto_ruolo_id e istanza_utility_id
#         alla figlia (coerenti col soggetto copiato, quindi il guard
#         contesto e' soddisfatto per costruzione): senza, le figlie
#         cadevano fuori dalle lenti per contesto (D1).
#
# Corpo di partenza dalla doc auto-gen
# docs/it/dbzero/pratiche/funzioni/fn_genera_pratica_da_flusso.md
# (oggetto vivo). MAI modificato in place 20260303-43: nuovo file.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/pratiche/20260611-10-update-fn-genera-pratica-da-flusso-fix-completo-mctit.yaml

  - changeSet:
      id: 20260611-10-update-fn-genera-pratica-da-flusso-fix-completo
      author: mctit
      # ⚠️ Era `true`: con validCheckSums ANY il checksum e' sempre "cambiato",
      #   quindi il changeSet ri-eseguiva a OGNI invocazione di liquibase. In CI
      #   ce ne sono due (--contexts="!provision" poi --contexts=ci_apply) e la
      #   seconda rimetteva questo corpo SOPRA le revisioni piu' recenti, che
      #   sono runOnChange:false e non ri-eseguono. Su dev non si vedeva: una
      #   sola invocazione. Non rimetterlo a true (2026-08-06).
      runOnChange: false
      validCheckSums: [ANY]
      failOnError: true
      comment: >
        fn_genera_pratica_da_flusso: idempotenza (ritorna figlia
        esistente), pratica_padre_id valorizzato, flusso iniziale da
        template_flusso_dest_id, propagazione contesto ruolo/istanza.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION pratiche.fn_genera_pratica_da_flusso(
                  p_flusso_id pratiche.flussi.id%TYPE,
                  p_regola_id pratiche.regole_generazione.id%TYPE
              )
              RETURNS bigint
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_pratica_sorgente_id   pratiche.pratiche.id%TYPE;
                  v_emittente_id          pratiche.pratiche.emittente_fiscale_id%TYPE;
                  v_soggetto_id           pratiche.pratiche.soggetto_id%TYPE;
                  v_soggetto_ruolo_id     pratiche.pratiche.soggetto_ruolo_id%TYPE;
                  v_istanza_utility_id    pratiche.pratiche.istanza_utility_id%TYPE;
                  v_priorita_id           pratiche.pratiche.priorita_id%TYPE;
                  v_tipo_prest_dest_id    pratiche.regole_generazione.tipo_prestazione_dest_id%TYPE;
                  v_template_dest_id      pratiche.regole_generazione.template_flusso_dest_id%TYPE;
                  v_stato_iniziale_id     config.stati_pratiche.id%TYPE;
                  v_stato_flusso_id       config.stati_flussi_pratiche.id%TYPE;
                  v_dest_sequenza         pratiche.template_flussi.sequenza%TYPE;
                  v_nuova_pratica_id      pratiche.pratiche.id%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Genera la pratica figlia da un flusso completato secondo
                  --   una regola di generazione. Idempotente: per la stessa
                  --   coppia (flusso, tipo destinazione) esiste al massimo una
                  --   figlia; le chiamate successive ritornano l'id esistente.
                  --   Copia emittente/soggetto/contesto/priorita, valorizza
                  --   pratica_padre_id + flusso_origine_id e, se la regola lo
                  --   dichiara, crea il flusso iniziale della figlia.
                  -- =========================================================

                  -- Guard: parametri obbligatori
                  IF p_flusso_id IS NULL OR p_flusso_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          'fn_genera_pratica_da_flusso',
                          'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_flusso_id', 'valore', p_flusso_id),
                          NULL::uuid,
                          'p_flusso_id obbligatorio e > 0'
                      );
                  END IF;

                  IF p_regola_id IS NULL OR p_regola_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          'fn_genera_pratica_da_flusso',
                          'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_regola_id', 'valore', p_regola_id),
                          NULL::uuid,
                          'p_regola_id obbligatorio e > 0'
                      );
                  END IF;

                  -- Recupera pratica_id dal flusso
                  SELECT f.pratica_id
                    INTO v_pratica_sorgente_id
                    FROM pratiche.flussi f
                   WHERE f.id = p_flusso_id;

                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          'fn_genera_pratica_da_flusso',
                          'E_VALORE_MANCANTE',
                          jsonb_build_object('flusso_id', p_flusso_id),
                          NULL::uuid,
                          concat('flusso_id ', p_flusso_id)
                      );
                  END IF;

                  -- Recupera dati pratica sorgente (incluso contesto, fix-4)
                  SELECT p.emittente_fiscale_id, p.soggetto_id,
                         p.soggetto_ruolo_id, p.istanza_utility_id, p.priorita_id
                    INTO v_emittente_id, v_soggetto_id,
                         v_soggetto_ruolo_id, v_istanza_utility_id, v_priorita_id
                    FROM pratiche.pratiche p
                   WHERE p.id = v_pratica_sorgente_id;

                  -- Recupera regola di generazione (incluso flusso iniziale, fix-3)
                  SELECT rg.tipo_prestazione_dest_id, rg.template_flusso_dest_id
                    INTO v_tipo_prest_dest_id, v_template_dest_id
                    FROM pratiche.regole_generazione rg
                   WHERE rg.id = p_regola_id
                     AND rg.attivo = true;

                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          'fn_genera_pratica_da_flusso',
                          'E_CODICE',
                          jsonb_build_object('regola_id', p_regola_id),
                          NULL::uuid,
                          p_regola_id::text, 'pratiche.regole_generazione'
                      );
                  END IF;

                  -- Idempotenza (fix-1): figlia gia' esistente per
                  -- (flusso, tipo destinazione) -> ritorna l'id esistente.
                  -- Vale per trigger auto, API /genera/ e doppi eventi.
                  SELECT p.id
                    INTO v_nuova_pratica_id
                    FROM pratiche.pratiche p
                   WHERE p.flusso_origine_id  = p_flusso_id
                     AND p.tipo_prestazione_id = v_tipo_prest_dest_id
                   LIMIT 1;

                  IF FOUND THEN
                      RETURN v_nuova_pratica_id;
                  END IF;

                  -- Determina stato iniziale (BOZZA)
                  SELECT sp.id
                    INTO v_stato_iniziale_id
                    FROM config.stati_pratiche sp
                   WHERE sp.codice_interno = 'BOZZA'
                     AND sp.attivo = true
                   LIMIT 1;

                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          'fn_genera_pratica_da_flusso',
                          'E_CODICE',
                          jsonb_build_object('codice_interno', 'BOZZA'),
                          NULL::uuid,
                          'BOZZA', 'config.stati_pratiche'
                      );
                  END IF;

                  -- Crea pratica target: genealogia completa (fix-2) e
                  -- contesto propagato (fix-4, coerente col soggetto copiato).
                  INSERT INTO pratiche.pratiche (
                      emittente_fiscale_id,
                      tipo_prestazione_id,
                      soggetto_id,
                      soggetto_ruolo_id,
                      istanza_utility_id,
                      stato_id,
                      priorita_id,
                      pratica_padre_id,
                      flusso_origine_id
                  ) VALUES (
                      v_emittente_id,
                      v_tipo_prest_dest_id,
                      v_soggetto_id,
                      v_soggetto_ruolo_id,
                      v_istanza_utility_id,
                      v_stato_iniziale_id,
                      v_priorita_id,
                      v_pratica_sorgente_id,
                      p_flusso_id
                  )
                  RETURNING id INTO v_nuova_pratica_id;

                  -- Flusso iniziale della figlia (fix-3): solo se la regola
                  -- lo dichiara. Il template deve essere senza prerequisiti
                  -- (la figlia nasce senza flussi): in caso contrario il
                  -- guard prerequisiti blocca — errore di seed, fail-fast.
                  IF v_template_dest_id IS NOT NULL THEN
                      SELECT sfp.id
                        INTO v_stato_flusso_id
                        FROM config.stati_flussi_pratiche sfp
                       WHERE sfp.codice_interno = 'DA_ESEGUIRE'
                         AND sfp.attivo = true
                       LIMIT 1;

                      IF NOT FOUND THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database',
                              'fn_genera_pratica_da_flusso',
                              'E_CODICE',
                              jsonb_build_object('codice_interno', 'DA_ESEGUIRE'),
                              NULL::uuid,
                              'DA_ESEGUIRE', 'config.stati_flussi_pratiche'
                          );
                      END IF;

                      -- Sequenza dal template (ordinamento percorso coerente).
                      SELECT tf.sequenza
                        INTO v_dest_sequenza
                        FROM pratiche.template_flussi tf
                       WHERE tf.id = v_template_dest_id;

                      INSERT INTO pratiche.flussi (
                          pratica_id,
                          template_flusso_id,
                          stato_id,
                          sequenza
                      ) VALUES (
                          v_nuova_pratica_id,
                          v_template_dest_id,
                          v_stato_flusso_id,
                          COALESCE(v_dest_sequenza, 0)
                      );
                  END IF;

                  RETURN v_nuova_pratica_id;
              END;
              $function$;

              COMMENT ON FUNCTION pratiche.fn_genera_pratica_da_flusso(p_flusso_id bigint, p_regola_id bigint)
              IS 'Genera pratica figlia da flusso completato secondo regola di generazione. Idempotente per (flusso, tipo dest): ritorna la figlia esistente. Copia emittente/soggetto/contesto/priorita; valorizza pratica_padre_id e flusso_origine_id; crea il flusso iniziale se la regola dichiara template_flusso_dest_id. Stato iniziale BOZZA.';

      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Ripristino versione precedente: vedi 20260303-43 (corpo storico
              -- senza idempotenza/padre/contesto/flusso iniziale).
              SELECT 1;
