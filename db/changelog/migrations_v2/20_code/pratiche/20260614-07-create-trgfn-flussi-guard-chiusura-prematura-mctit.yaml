# Chiusura guidata dal workflow: guard pre-completamento (D2).
# (brief-db-chiusura-pratica-workflow, 2026-06-14)
#
# trgfn_flussi_guard_chiusura_prematura + trigger BEFORE UPDATE OF
# stato_id su pratiche.flussi: impedisce di completare il flusso "di
# chiusura" finche' restano altri obbligatori bloccanti. Cosi' il flusso
# di chiusura non scavalca obbligatori pendenti e l'auto-chiusura
# (20260614-06) trova sempre la pratica chiudibile (niente rollback della
# transazione per il guard di chiusura della pratica).
# Codice errore: PRATICHE_CHIUSURA_FLUSSO_PREMATURO (seed 20260614-08).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/pratiche/20260614-07-create-trgfn-flussi-guard-chiusura-prematura-mctit.yaml

  - changeSet:
      id: 20260614-07-create-trgfn-flussi-guard-chiusura-prematura
      author: mctit
      # ⚠️ Era `true`: con validCheckSums ANY il checksum e' sempre "cambiato",
      #   quindi il changeSet ri-eseguiva a OGNI invocazione di liquibase. In CI
      #   ce ne sono due (--contexts="!provision" poi --contexts=ci_apply) e la
      #   seconda rimetteva questo corpo SOPRA le revisioni piu' recenti, che
      #   sono runOnChange:false e non ri-eseguono. Su dev non si vedeva: una
      #   sola invocazione. Non rimetterlo a true (2026-08-06).
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        trgfn_flussi_guard_chiusura_prematura + trigger BEFORE UPDATE OF
        stato_id: blocca il completamento del flusso di chiusura se restano
        altri obbligatori bloccanti.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION pratiche.trgfn_flussi_guard_chiusura_prematura()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              -- Scopo: il flusso "di chiusura" (template.chiude_pratica) chiude la
              --   pratica: non puo' essere completato finche' restano ALTRI
              --   obbligatori bloccanti. Coerente col guard di chiusura della
              --   pratica; evita che l'auto-chiusura conseguente fallisca.
              -- Regole:
              --   1. Scatta solo alla transizione di stato verso COMPLETATO.
              --   2. Solo se il template del flusso e' chiude_pratica.
              --   3. fn_check_pratica_chiudibile escludendo il template di chiusura
              --      stesso (non ancora COMPLETATO): se false -> errore parlante.
              DECLARE
                  v_completato_id config.stati_flussi_pratiche.id%TYPE;
                  v_e_chiusura    boolean;
              BEGIN
                  -- (1) Solo verso COMPLETATO, e solo a stato realmente cambiato.
                  SELECT id INTO v_completato_id
                    FROM config.stati_flussi_pratiche
                   WHERE codice_interno = 'COMPLETATO';

                  IF NEW.stato_id IS DISTINCT FROM v_completato_id
                     OR OLD.stato_id = NEW.stato_id THEN
                      RETURN NEW;
                  END IF;

                  -- (2) Solo flussi da template "di chiusura".
                  IF NEW.template_flusso_id IS NULL THEN
                      RETURN NEW;
                  END IF;

                  SELECT tf.chiude_pratica INTO v_e_chiusura
                    FROM pratiche.template_flussi tf
                   WHERE tf.id = NEW.template_flusso_id;

                  IF NOT COALESCE(v_e_chiusura, false) THEN
                      RETURN NEW;
                  END IF;

                  -- (3) Ammesso solo se nessun ALTRO obbligatorio e' bloccante.
                  IF NOT pratiche.fn_check_pratica_chiudibile(NEW.pratica_id, NEW.template_flusso_id) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'pratiche',
                          'pratiche.trgfn_flussi_guard_chiusura_prematura',
                          'PRATICHE_CHIUSURA_FLUSSO_PREMATURO',
                          jsonb_build_object(
                              'pratica_id', NEW.pratica_id,
                              'flusso_id', NEW.id,
                              'template_flusso_id', NEW.template_flusso_id
                          ),
                          NEW.tx_id,
                          NEW.id::text
                      );
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION pratiche.trgfn_flussi_guard_chiusura_prematura()
              IS 'BEFORE UPDATE OF stato_id su flussi: blocca il completamento del flusso di chiusura (template.chiude_pratica) se restano altri obbligatori bloccanti (fn_check_pratica_chiudibile escludendo il template stesso).';

              DROP TRIGGER IF EXISTS trg_flussi_a10_guard_chiusura_prematura_upd
                ON pratiche.flussi;

              CREATE TRIGGER trg_flussi_a10_guard_chiusura_prematura_upd
                BEFORE UPDATE OF stato_id
                ON pratiche.flussi
                FOR EACH ROW
                EXECUTE FUNCTION pratiche.trgfn_flussi_guard_chiusura_prematura();

      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_flussi_a10_guard_chiusura_prematura_upd
                ON pratiche.flussi;
              DROP FUNCTION IF EXISTS pratiche.trgfn_flussi_guard_chiusura_prematura();
