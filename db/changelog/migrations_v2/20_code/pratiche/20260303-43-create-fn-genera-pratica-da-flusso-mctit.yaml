# Liquibase changelog per Zero ERP
# Funzione pratiche.fn_genera_pratica_da_flusso
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/pratiche/20260303-43-create-fn-genera-pratica-da-flusso-mctit.yaml

  - changeSet:
      id: 20260303-43-create-fn-genera-pratica-da-flusso
      author: mctit
      runOnChange: false
      comment: >
        Genera una nuova pratica a partire da un flusso completato,
        secondo la regola configurata in regole_generazione.
        Imposta flusso_origine_id sulla pratica generata.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION pratiche.fn_genera_pratica_da_flusso(
                p_flusso_id  pratiche.flussi.id%TYPE,
                p_regola_id  pratiche.regole_generazione.id%TYPE
              )
              RETURNS pratiche.pratiche.id%TYPE
              LANGUAGE plpgsql
              AS $$
              DECLARE
                v_pratica_sorgente_id  pratiche.pratiche.id%TYPE;
                v_emittente_id         pratiche.pratiche.emittente_fiscale_id%TYPE;
                v_soggetto_id          pratiche.pratiche.soggetto_id%TYPE;
                v_priorita_id          pratiche.pratiche.priorita_id%TYPE;
                v_tipo_prest_dest_id   pratiche.regole_generazione.tipo_prestazione_dest_id%TYPE;
                v_stato_iniziale_id    config.stati_pratiche.id%TYPE;
                v_nuova_pratica_id     pratiche.pratiche.id%TYPE;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Genera una nuova pratica a partire da un flusso completato,
                --   secondo la regola configurata in regole_generazione.
                --   Imposta flusso_origine_id sulla pratica generata.
                --
                -- Regole:
                --   - p_flusso_id e p_regola_id obbligatori e > 0
                --   - Copia emittente, soggetto, priorita dalla pratica
                --     sorgente (quella a cui appartiene il flusso)
                --   - tipo_prestazione preso da regola.tipo_prestazione_dest_id
                --   - stato iniziale: primo stato con codice_interno = 'BOZZA'
                --   - flusso_origine_id = p_flusso_id
                --
                -- Dipendenze:
                --   - pratiche.flussi, pratiche.pratiche, pratiche.regole_generazione
                --   - config.stati_pratiche (codice_interno = 'BOZZA')
                --   - script.fn_log_and_raise_error()
                -- =========================================================

                -- Guard: validazione parametri
                IF p_flusso_id IS NULL OR p_flusso_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database',
                    'fn_genera_pratica_da_flusso',
                    'E_GENERICO',
                    jsonb_build_object(
                      'context', 'flusso_id obbligatorio',
                      'flusso_id', p_flusso_id
                    ),
                    NULL::uuid,
                    'flusso_id obbligatorio'
                  );
                END IF;

                IF p_regola_id IS NULL OR p_regola_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database',
                    'fn_genera_pratica_da_flusso',
                    'E_GENERICO',
                    jsonb_build_object(
                      'context', 'regola_id obbligatorio',
                      'regola_id', p_regola_id
                    ),
                    NULL::uuid,
                    'regola_id obbligatorio'
                  );
                END IF;

                -- Recupera pratica_id dal flusso
                SELECT f.pratica_id
                  INTO v_pratica_sorgente_id
                  FROM pratiche.flussi f
                 WHERE f.id = p_flusso_id;

                IF NOT FOUND THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database',
                    'fn_genera_pratica_da_flusso',
                    'E_GENERICO',
                    jsonb_build_object(
                      'context', 'flusso non trovato',
                      'flusso_id', p_flusso_id
                    ),
                    NULL::uuid,
                    concat('flusso non trovato: ', p_flusso_id::text)
                  );
                END IF;

                -- Recupera dati pratica sorgente
                SELECT p.emittente_fiscale_id, p.soggetto_id, p.priorita_id
                  INTO v_emittente_id, v_soggetto_id, v_priorita_id
                  FROM pratiche.pratiche p
                 WHERE p.id = v_pratica_sorgente_id;

                -- Recupera regola di generazione
                SELECT rg.tipo_prestazione_dest_id
                  INTO v_tipo_prest_dest_id
                  FROM pratiche.regole_generazione rg
                 WHERE rg.id = p_regola_id
                   AND rg.attivo = true;

                IF NOT FOUND THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database',
                    'fn_genera_pratica_da_flusso',
                    'E_GENERICO',
                    jsonb_build_object(
                      'context', 'regola generazione non trovata o non attiva',
                      'regola_id', p_regola_id
                    ),
                    NULL::uuid,
                    concat('regola non trovata: ', p_regola_id::text)
                  );
                END IF;

                -- Determina stato iniziale (BOZZA)
                SELECT sp.id
                  INTO v_stato_iniziale_id
                  FROM config.stati_pratiche sp
                 WHERE sp.codice_interno = 'BOZZA'
                   AND sp.attivo = true
                 LIMIT 1;

                IF NOT FOUND THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database',
                    'fn_genera_pratica_da_flusso',
                    'E_GENERICO',
                    jsonb_build_object(
                      'context', 'stato BOZZA non trovato in config.stati_pratiche'
                    ),
                    NULL::uuid,
                    'stato BOZZA non configurato'
                  );
                END IF;

                -- Crea pratica target
                INSERT INTO pratiche.pratiche (
                  emittente_fiscale_id,
                  tipo_prestazione_id,
                  soggetto_id,
                  stato_id,
                  priorita_id,
                  flusso_origine_id
                ) VALUES (
                  v_emittente_id,
                  v_tipo_prest_dest_id,
                  v_soggetto_id,
                  v_stato_iniziale_id,
                  v_priorita_id,
                  p_flusso_id
                )
                RETURNING id INTO v_nuova_pratica_id;

                RETURN v_nuova_pratica_id;
              END;
              $$;

              COMMENT ON FUNCTION pratiche.fn_genera_pratica_da_flusso(bigint, bigint)
                IS 'Genera una nuova pratica da un flusso completato secondo regola di generazione configurata.';
