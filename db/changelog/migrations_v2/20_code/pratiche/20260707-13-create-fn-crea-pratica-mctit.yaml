databaseChangeLog:
    - logicalFilePath: migrations_v2/20_code/pratiche/20260707-13-create-fn-crea-pratica-mctit.yaml

    - changeSet:
          id: 20260707-13-create-fn-crea-pratica
          author: mctit

          # ------------------------------------------------------------
          # Scopo
          # ------------------------------------------------------------
          # Building block CONDIVISO per la creazione di una pratica.
          #
          # Contesto (piano analisi-fix-transazioni, Classe A):
          #   La creazione della pratica e' identica per ogni sorgente
          #   (preventivo #3, ordine #4/#5, futuri domini): risolve lo stato
          #   iniziale APERTA + priorita' default NORMALE e fa l'INSERT. Questa
          #   funzione la incapsula UNA volta; ogni madre di dominio la chiama e
          #   vi aggiunge la sola parte specifica (risoluzione contesto + link).
          #   Cosi' l'atomicita' di ogni dominio si ottiene senza duplicare la
          #   logica transazionale.
          #
          # I guard di dominio sulla pratica sono gia' TRIGGER su pratiche.pratiche
          # e si applicano automaticamente all'INSERT:
          #   - trgfn_pratiche_guard_contesto  (coerenza istanza/soggetto)
          #   - trgfn_guard_emittente_scope    (scope emittente)
          #   - trgfn_pratiche_default_definizione (pin definizione)
          #   - trgfn_child_requires_active_parent (emittente/tipo/stato/priorita/
          #     soggetto/UO/canale attivi), audit, tx_id, gen_codice, giornale.
          #
          # NOTA IMPORTANTE — guard pre/post-attivazione NON incluso qui:
          #   Il controllo "tipo prestazione ammesso pre/post attivazione cliente"
          #   vive SOLO nel service Python (pratiche_service.crea_pratica, via
          #   repo.ha_ba_attivo): NON esiste un trigger DB equivalente. Questa
          #   funzione NON lo replica (nessuna regressione: non era in DB). I
          #   chiamanti che lo richiedono devono pre-verificarlo a monte.
          #
          # Ritorno: id della pratica creata (pratiche.pratiche.id%TYPE).
          #
          # NOTE tecniche:
          #   - Tipi ancorati con %TYPE. SECURITY INVOKER: RLS su pratiche.pratiche
          #     valutata come dal Python (vincolo invariante §2-bis).
          #   - VOLATILE (default): esegue DML.
          # ------------------------------------------------------------

          preConditions:
              - onFail: HALT
              - onError: HALT
              - tableExists:
                    schemaName: pratiche
                    tableName: pratiche

          changes:
              - sql:
                    splitStatements: FALSE
                    stripComments: false
                    endDelimiter: ";"

                    sql: |

                        DROP FUNCTION IF EXISTS pratiche.fn_crea_pratica(
                            pratiche.pratiche.emittente_fiscale_id%TYPE,
                            pratiche.pratiche.tipo_prestazione_id%TYPE,
                            pratiche.pratiche.soggetto_id%TYPE,
                            pratiche.pratiche.soggetto_ruolo_id%TYPE,
                            pratiche.pratiche.istanza_utility_id%TYPE,
                            pratiche.pratiche.priorita_id%TYPE,
                            pratiche.pratiche.descrizione%TYPE,
                            jsonb
                        );

                        CREATE OR REPLACE FUNCTION pratiche.fn_crea_pratica(
                            p_emittente_fiscale_id pratiche.pratiche.emittente_fiscale_id%TYPE,
                            p_tipo_prestazione_id  pratiche.pratiche.tipo_prestazione_id%TYPE,
                            p_soggetto_id          pratiche.pratiche.soggetto_id%TYPE DEFAULT NULL,
                            p_soggetto_ruolo_id    pratiche.pratiche.soggetto_ruolo_id%TYPE DEFAULT NULL,
                            p_istanza_utility_id   pratiche.pratiche.istanza_utility_id%TYPE DEFAULT NULL,
                            p_priorita_id          pratiche.pratiche.priorita_id%TYPE DEFAULT NULL,
                            p_descrizione          pratiche.pratiche.descrizione%TYPE DEFAULT NULL,
                            p_meta                 jsonb DEFAULT '{}'::jsonb
                        )
                        RETURNS pratiche.pratiche.id%TYPE
                        LANGUAGE plpgsql
                        SECURITY INVOKER
                        AS
                        $BODY$
                        DECLARE
                            v_stato_id    pratiche.pratiche.stato_id%TYPE;
                            v_priorita_id pratiche.pratiche.priorita_id%TYPE := p_priorita_id;
                            v_pratica_id  pratiche.pratiche.id%TYPE;
                        BEGIN
                            -- Stato iniziale APERTA.
                            SELECT sp.id INTO v_stato_id
                              FROM config.stati_pratiche sp
                             WHERE sp.codice_interno = 'APERTA';
                            IF NOT FOUND THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'database', 'pratiche.fn_crea_pratica', 'E_CONFIG_MANCANTE',
                                    jsonb_build_object('config', 'config.stati_pratiche.APERTA'),
                                    NULL::uuid,
                                    VARIADIC ARRAY['stato iniziale APERTA (config.stati_pratiche)']);
                            END IF;

                            -- Priorita' default NORMALE se non fornita.
                            IF v_priorita_id IS NULL THEN
                                SELECT pp.id INTO v_priorita_id
                                  FROM config.priorita_pratiche pp
                                 WHERE pp.codice_interno = 'NORMALE';
                                IF NOT FOUND THEN
                                    PERFORM script.fn_log_and_raise_error(
                                        'database', 'pratiche.fn_crea_pratica', 'E_CONFIG_MANCANTE',
                                        jsonb_build_object('config', 'config.priorita_pratiche.NORMALE'),
                                        NULL::uuid,
                                        VARIADIC ARRAY['priorita default NORMALE (config.priorita_pratiche)']);
                                END IF;
                            END IF;

                            INSERT INTO pratiche.pratiche (
                                emittente_fiscale_id, tipo_prestazione_id, soggetto_id,
                                soggetto_ruolo_id, istanza_utility_id, stato_id, priorita_id,
                                descrizione, meta
                            ) VALUES (
                                p_emittente_fiscale_id, p_tipo_prestazione_id, p_soggetto_id,
                                p_soggetto_ruolo_id, p_istanza_utility_id, v_stato_id, v_priorita_id,
                                p_descrizione, COALESCE(p_meta, '{}'::jsonb)
                            )
                            RETURNING id INTO v_pratica_id;

                            RETURN v_pratica_id;
                        END;
                        $BODY$;

                        COMMENT ON FUNCTION pratiche.fn_crea_pratica(
                            pratiche.pratiche.emittente_fiscale_id%TYPE,
                            pratiche.pratiche.tipo_prestazione_id%TYPE,
                            pratiche.pratiche.soggetto_id%TYPE,
                            pratiche.pratiche.soggetto_ruolo_id%TYPE,
                            pratiche.pratiche.istanza_utility_id%TYPE,
                            pratiche.pratiche.priorita_id%TYPE,
                            pratiche.pratiche.descrizione%TYPE,
                            jsonb
                        ) IS
                        'Building block condiviso: crea una pratica (stato APERTA, '
                        'priorita'' default NORMALE) con INSERT guardato dai trigger di '
                        'pratiche.pratiche. NON include il guard pre/post-attivazione '
                        '(solo Python). SECURITY INVOKER. Riusata dai madre di dominio '
                        '(preventivo/ordine/...). Piano: analisi-fix-transazioni Classe A.';

          rollback:
              - sql:
                    sql: |
                        DROP FUNCTION IF EXISTS pratiche.fn_crea_pratica(
                            pratiche.pratiche.emittente_fiscale_id%TYPE,
                            pratiche.pratiche.tipo_prestazione_id%TYPE,
                            pratiche.pratiche.soggetto_id%TYPE,
                            pratiche.pratiche.soggetto_ruolo_id%TYPE,
                            pratiche.pratiche.istanza_utility_id%TYPE,
                            pratiche.pratiche.priorita_id%TYPE,
                            pratiche.pratiche.descrizione%TYPE,
                            jsonb
                        );
