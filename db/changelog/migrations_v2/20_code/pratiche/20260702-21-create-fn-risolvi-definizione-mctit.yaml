# pratiche.fn_risolvi_definizione — risoluzione dell'edizione di workflow.
# (brief-db-step-dominio-e-definizioni-versionate Parte 2 / Fase 0;
#  ex D2-5, anticipata dalla Fase 1: serve all'auto-pin/auto-default per
#  rendere sicuro il SET NOT NULL del backfill — fix bug di sequenza,
#  vedi brief §2.1 "Raffinamenti")
#
# Catena di risoluzione (design brief §3.4):
#   1. edizione PUBBLICATA dell'emittente, se esiste (fork, da Fase 2);
#   2. altrimenti il PRESET PUBBLICATA (emittente_fiscale_id IS NULL);
#   3. altrimenti errore parlante DEFINIZIONE_NON_TROVATA (507).
#
# VOLATILE (non STABLE): il ramo di errore scrive il log via
# script.fn_log_and_raise_error (INSERT vietato nelle funzioni non-volatile).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/pratiche/20260702-21-create-fn-risolvi-definizione-mctit.yaml

  - changeSet:
      id: 20260702-21-create-fn-risolvi-definizione
      author: mctit
      runOnChange: false
      comment: >
        fn_risolvi_definizione(tipo, emittente): edizione PUBBLICATA
        dell'emittente > preset PUBBLICATA > errore 507. Usata dai trigger di
        auto-pin (pratiche) e auto-default (template_flussi).
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: pratiche
            tableName: workflow_definizioni
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- %TYPE anche in firma e RETURNS (convenzione di casa): PG li
              -- risolve alla CREATE nei tipi base (integer, bigint) — DROP e
              -- COMMENT usano quindi la firma risolta.
              CREATE OR REPLACE FUNCTION pratiche.fn_risolvi_definizione(
                  p_tipo_prestazione_id  pratiche.tipi_prestazione.id%TYPE,
                  p_emittente_fiscale_id anagrafiche.emittenti_fiscali.id%TYPE DEFAULT NULL
              )
              RETURNS pratiche.workflow_definizioni.id%TYPE
              LANGUAGE plpgsql
              VOLATILE
              AS $function$
              -- Scopo: risolve l'edizione di workflow da pinnare/usare per un
              --        tipo prestazione e uno scope emittente:
              --        1) PUBBLICATA dell'emittente; 2) preset PUBBLICATA;
              --        3) errore parlante 507. Un solo punto di risoluzione
              --        (usato da auto-pin pratiche e auto-default template).
              DECLARE
                v_definizione_id pratiche.workflow_definizioni.id%TYPE;
              BEGIN
                -- Guard esplicito sul parametro id (no normalizzazione silenziosa).
                IF p_tipo_prestazione_id IS NULL OR p_tipo_prestazione_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'pratiche',
                    'pratiche.fn_risolvi_definizione',
                    'DEFINIZIONE_NON_TROVATA',
                    jsonb_build_object(
                      'motivo',               'parametro_tipo_invalido',
                      'tipo_prestazione_id',  p_tipo_prestazione_id,
                      'emittente_fiscale_id', p_emittente_fiscale_id
                    ),
                    NULL::uuid,
                    COALESCE(p_tipo_prestazione_id::text, 'NULL'),
                    COALESCE(p_emittente_fiscale_id::text, 'preset')
                  );
                END IF;

                -- 1) Edizione pubblicata dell'emittente (fork — da Fase 2).
                IF p_emittente_fiscale_id IS NOT NULL THEN
                  SELECT wd.id INTO v_definizione_id
                    FROM pratiche.workflow_definizioni wd
                   WHERE wd.tipo_prestazione_id  = p_tipo_prestazione_id
                     AND wd.emittente_fiscale_id = p_emittente_fiscale_id
                     AND wd.stato = 'PUBBLICATA';
                  IF FOUND THEN
                    RETURN v_definizione_id;
                  END IF;
                END IF;

                -- 2) Preset pubblicato (emittente NULL).
                SELECT wd.id INTO v_definizione_id
                  FROM pratiche.workflow_definizioni wd
                 WHERE wd.tipo_prestazione_id = p_tipo_prestazione_id
                   AND wd.emittente_fiscale_id IS NULL
                   AND wd.stato = 'PUBBLICATA';
                IF FOUND THEN
                  RETURN v_definizione_id;
                END IF;

                -- 3) Nessuna edizione risolvibile: errore parlante.
                PERFORM script.fn_log_and_raise_error(
                  'pratiche',
                  'pratiche.fn_risolvi_definizione',
                  'DEFINIZIONE_NON_TROVATA',
                  jsonb_build_object(
                    'motivo',               'nessuna_pubblicata',
                    'tipo_prestazione_id',  p_tipo_prestazione_id,
                    'emittente_fiscale_id', p_emittente_fiscale_id
                  ),
                  NULL::uuid,
                  p_tipo_prestazione_id::text,
                  COALESCE(p_emittente_fiscale_id::text, 'preset')
                );
                RETURN NULL; -- irraggiungibile (la fn sopra solleva)
              END;
              $function$;

              COMMENT ON FUNCTION pratiche.fn_risolvi_definizione(integer, bigint)
                IS 'Risolve l''edizione di workflow per (tipo prestazione, emittente): PUBBLICATA dell''emittente > preset PUBBLICATA > errore DEFINIZIONE_NON_TROVATA (507). Punto unico di risoluzione, usato dall''auto-pin delle pratiche e dall''auto-default dei template. VOLATILE perche'' il ramo di errore logga.';

      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS pratiche.fn_risolvi_definizione(integer, bigint);
