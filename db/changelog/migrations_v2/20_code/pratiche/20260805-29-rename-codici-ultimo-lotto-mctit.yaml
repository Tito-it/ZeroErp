# L'ULTIMO LOTTO — 26 codici, 28 funzioni: il registro del debito va a ZERO
#   Brief: brief-db-codice-errore-strutturato.md §15.17
#   Lotti precedenti: 20260805-19 (4), -20 (4), -25 (3), -26 (11)
#   Sbloccato da: brief-be-rinomina-codici-known-markers.md (BE, chiuso 2026-08-05)
#
# ── PERCHE' ORA SI PUO' ─────────────────────────────────────────────────
#   Questi 27 erano gli unici "accoppiati al backend": il Python li riconosceva
#   da una substring del MESSAGGIO e ne restituiva il codice, quindi rinominarli
#   a DB avrebbe fatto uscire dall'API il vecchio nome ormai ritirato — senza
#   rompere niente, e senza che nessun test protestasse.
#
#   Il BE ha chiuso l'accoppiamento non allungando la lista ma cambiando la
#   CONDIZIONE che la usa: il campo strutturato viene accettato se il codice e'
#   dichiarato **oppure se lo e' la sua forma senza prefisso**
#   (`structured.removeprefix("E_") in _CODICI_DICHIARATI`). La lista e' un
#   PERIMETRO — «i codici che questo dominio si aspetta» — non un elenco di
#   stringhe esatte.
#
#   Effetto: l'ordine di rilascio e' indifferente, prima e dopo questo changeSet
#   l'API restituisce il codice giusto, e non serve avvisare nessuno.
#
# ── ⚠️ E PERCHE' LA RINOMINA DEVE RESTARE IL SOLO PREFISSO ──────────────
#   `ERRORE_PARAMETRI` diventa `E_ERRORE_PARAMETRI`, che e' brutto: «errore
#   errore», e senza modulo. Verrebbe voglia di ribattezzarlo
#   `E_PARAMETRI_NON_VALIDI` — e sarebbe uno sbaglio **tecnico**, non di gusto:
#   `removeprefix("E_")` darebbe `PARAMETRI_NON_VALIDI`, che il BE non ha
#   dichiarato, quindi il campo strutturato verrebbe scartato e vincerebbe il
#   marker, restituendo il nome vecchio.
#
#   Qualunque rinomina che non sia il SOLO prefisso richiede di nuovo il
#   coordinamento. La bruttezza si corregge dopo, come slice a se'. Vale anche
#   per `ERRORE_PARAMETRI_TABELLA` e `MESSAGGIO_NON_DEFINITO`.
#
# ── ⚠️ ESCLUSO: `MESSAGGIO_NON_DEFINITO` ───────────────────────────────
#   Non e' un errore di dominio: e' il **segnaposto** che `fn_log_error_only`
#   scrive in `dbops.error_log` quando il codice richiesto non e' a catalogo.
#   Non arriva mai a un client — quando `fn_log_and_raise_error` viene chiamata
#   con un codice sconosciuto, il campo CONSTRAINT porta comunque il codice
#   ORIGINALE, non questo. E' un marcatore di log, stessa famiglia di
#   `W_TXID_NOT_REGISTERED`.
#
#   ⚠️ E c'e' un secondo motivo, indipendente e dirimente: l'unica funzione che
#   lo nomina e' `script.fn_log_error_only`, di proprieta' di **postgres** —
#   mentre le altre 28 sono di `titodb`, l'utente con cui gira Liquibase. Un
#   `CREATE OR REPLACE` su quella funzione fallirebbe con «bisogna essere
#   proprietari». Sarebbe possibile solo dal changelog di provision, che gira
#   come postgres: macchinario sproporzionato per un codice che nessuno legge.
#
#   Resta quindi l'unica voce del registro. Proposta a Tid: rinominarlo
#   `W_MESSAGGIO_NON_DEFINITO` — la famiglia dei warning ora esiste ed e'
#   presidiata dal controllo (E) — oppure lasciarlo e accettare che il registro
#   si fermi a uno.
#
# ── ⚠️ L'UNITA' DEL RITIRO E' IL CODICE, NON LA FUNZIONE ────────────────
#   Quattro codici su 27 vivono in piu' di una funzione — `ERRORE_PARAMETRI` in
#   **sette** — e le 29 funzioni qui sotto sono l'elenco COMPLETO ricavato da
#   `pg_proc`, non a memoria. Rinominarne uno solo in parte lascerebbe l'altra
#   funzione a sollevare un codice ritirato: il controllo (D) del guardrail lo
#   vieta, ed e' cosi' che l'errore fu preso la prima volta (20260805-25).
#
# ── ⚠️ IL `;` DOPO `$function$` ─────────────────────────────────────────
#   La doc auto-gen chiude i corpi senza punto e virgola: senza, il COMMENT che
#   segue e' un errore di sintassi. Aggiunto a tutte e 28. Lezione del -19.
#
# ── DOPO QUESTO CHANGESET ───────────────────────────────────────────────
#   `dbops.messaggi_errore_codici_legacy` resta **VUOTO**. Era nato per calare
#   fino a zero e poi sparire: il DROP della tabella e' una decisione a se',
#   perche' finche' c'e' il controllo (B) continua a leggerla e a impedire che
#   un codice nuovo fuori convenzione entri senza registrazione.
#
#   Restano al BE, senza fretta: togliere le voci vecchie da
#   `_KNOWN_DB_ERROR_MARKERS` e da `error_policies.py`. La condizione NON va
#   toccata: quando nella lista ci saranno solo nomi `E_*`, `removeprefix` non
#   trovera' piu' nulla e il ramo diventera' inerte da solo.
#
#   Corpi dalla doc auto-gen. Cambiano solo i 47 letterali.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/pratiche/20260805-29-rename-codici-ultimo-lotto-mctit.yaml

  - changeSet:
      id: 20260805-29-rename-codici-ultimo-lotto
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Antepone il prefisso E_ agli ultimi 26 codici fuori convenzione, in tutte
        e 28 le funzioni che li sollevano. Il registro del debito va a zero. I
        vecchi nomi restano a catalogo ritirati con obsoleto_dal: hanno righe di
        log e la FK di dbops.error_log non ne permette la cancellazione.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- ── dbops.trgfn_tx_id_managed · ERRORE_PARAMETRI_TABELLA
              CREATE OR REPLACE FUNCTION dbops.trgfn_tx_id_managed()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_bypass_enabled BOOLEAN := FALSE;
                  v_session_tx_id     UUID;
                  v_new_tx_id      UUID;
              BEGIN
                  -- =========================================================
                  -- USCITA ANTICIPATA (rev 2026-07-24,
                  -- brief-db-tx-id-uscita-anticipata.md).
                  -- Se il chiamante ha gia' valorizzato il tx_id non c'e' niente
                  -- da gestire: tutto il corpo sottostante serve solo a calcolare
                  -- v_new_tx_id, che e' consumato unicamente dalla COALESCE finale
                  -- -- raggiunta solo quando NEW.tx_id IS NULL. Prima questi due
                  -- blocchi stavano in fondo: la funzione faceva il giro completo
                  -- (lettura di config.parameters + rami su script.*) per poi
                  -- restituire NEW invariato.
                  -- Due effetti: il trigger, installato su 280 tabelle, smette di
                  -- pagare lavoro inutile; e la sessione remota del canale di log
                  -- -- che fornisce sempre il proprio tx_id e ha grant sul solo
                  -- schema dbops -- non chiede piu' permessi su config e script.
                  --
                  -- ORDINE VINCOLANTE: la normalizzazione DEVE precedere l'uscita,
                  -- altrimenti un tx_id "stringa vuota" sfuggirebbe. Per una
                  -- colonna UUID e' di fatto irraggiungibile, ma resta dov'era
                  -- nella logica: spostato, non rimosso.
                  -- =========================================================
                  IF NEW.tx_id IS NOT NULL AND NEW.tx_id::text = '' THEN
                    NEW.tx_id := NULL;
                  END IF;

                  IF NEW.tx_id IS NOT NULL THEN
                    RETURN NEW;
                  END IF;

                  BEGIN
                      SELECT default_value::BOOLEAN
                        INTO v_bypass_enabled
                        FROM config.parameters
                      WHERE code = 'tx_id_bypass_enabled';

                      IF NOT FOUND THEN

                          PERFORM script.fn_log_error_only(
                              'database',
                              'dbops.trgfn_tx_id_managed',
                              'E_ERRORE_PARAMETRI_TABELLA',
                              jsonb_build_object(
                                  'codice_parametro', 'tx_id_bypass_enabled',
                                  'nome_tabella',      'config.parameters',
                                  'action', 'default bypass=false'
                              ),
                                NULL::uuid,
                                'tx_id_bypass_enabled',
                                'config.parameters'
                            );
                      END IF;

                  EXCEPTION WHEN OTHERS THEN

                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          'dbops.trgfn_tx_id_managed',
                          'E_SQL_READ_TABLE',
                          jsonb_build_object(
                            'parameter', 'tx_id_bypass_enabled',
                            'error', SQLERRM
                          ),
                          NULL::uuid,
                          TG_TABLE_NAME::text,
                          SQLERRM::text
                      );

                      RAISE;
                  END;

                  IF NOT v_bypass_enabled THEN
                      BEGIN
                          v_bypass_enabled := current_setting('myapp.bypass_tx_id_check', TRUE)::BOOLEAN;
                      EXCEPTION WHEN OTHERS THEN

                          NULL;
                      END;
                  END IF;

                  BEGIN
                      v_session_tx_id := current_setting('dbops.tx_id', TRUE)::UUID;
                  EXCEPTION WHEN OTHERS THEN
                      v_session_tx_id := NULL;
                  END;

                  IF v_bypass_enabled THEN

                      v_new_tx_id := COALESCE(v_session_tx_id, script.uuid_nil());

                  ELSE
                      IF v_session_tx_id IS NOT NULL THEN

                          PERFORM 1
                            FROM dbops.transaction_ids
                          WHERE id = v_session_tx_id;
                          IF FOUND THEN
                              v_new_tx_id := v_session_tx_id;

                          ELSE
                              -- Caso C) id di sessione non presente nel registro.
                              -- AVVERTE e prosegue con la sentinella: e' il comportamento che
                              -- la guida descrive ("logga WARNING e assegna nil") e che il
                              -- prefisso W_ promette. Prima qui si sollevava, quindi la riga
                              -- uuid_nil() sotto era irraggiungibile e un id non registrato
                              -- bloccava ogni scrittura tracciata.
                              -- Vedi brief-db-coerenza-tx-id-non-registrato.md §4.2.
                              -- NB dal 2026-07-24: questo ramo non viene piu' raggiunto dalle
                              -- righe che portano gia' il proprio tx_id (uscita anticipata in
                              -- testa). Resta la diagnosi di sessione: qualunque altra
                              -- scrittura che lasci il tx_id vuoto la fa scattare lo stesso.
                              PERFORM script.fn_log_error_only(
                                  'database',
                                  'dbops.trgfn_tx_id_managed',
                                  'W_TXID_NOT_REGISTERED',
                                  jsonb_build_object( 'tx_id', v_session_tx_id ),
                                  NULL::uuid,
                                  VARIADIC ARRAY[]::text[]
                              );
                              v_new_tx_id := script.uuid_nil();

                          END IF;

                      ELSE

                          BEGIN

                            v_new_tx_id := dbops.fn_get_or_create_session_tx_id();

                          EXCEPTION WHEN OTHERS THEN

                              PERFORM script.fn_log_and_raise_error(
                                  'database',
                                  'dbops.trgfn_tx_id_managed',
                                  'E_TXID_GENERATION',
                                  jsonb_build_object(
                                    'error', SQLERRM
                                  ) ,
                                  NULL::uuid,
                                  VARIADIC ARRAY[]::text[]
                              );
                              v_new_tx_id := script.uuid_nil();
                          END;
                      END IF;
                  END IF;

                  -- Qui si arriva solo con NEW.tx_id NULL (vedi uscita in testa).
                  NEW.tx_id := COALESCE(
                      NULLIF(current_setting('dbops.tx_id', true), '')::uuid,
                      v_new_tx_id,
                      uuidv7()
                  );
                RETURN NEW;

              END;
              $function$;

              COMMENT ON FUNCTION dbops.trgfn_tx_id_managed()
              IS 'Trigger function di audit: valorizza NEW.tx_id. USCITA ANTICIPATA (rev 2026-07-24, brief-db-tx-id-uscita-anticipata): se NEW.tx_id e'' gia'' valorizzato la funzione normalizza la stringa vuota e ritorna subito, senza leggere config.parameters ne'' toccare script.* -- tutto il corpo sottostante serve solo a calcolare il valore da assegnare quando manca. Conseguenze: niente lavoro inutile sulle 280 tabelle tracciate, e il canale di log dblink (che fornisce sempre il proprio tx_id e ha grant sul solo schema dbops) smette di fallire per permessi. Sulle righe che portano il proprio tx_id non viene piu'' emesso W_TXID_NOT_REGISTERED: e'' una diagnosi di SESSIONE, che qualunque altra scrittura senza tx_id fa scattare comunque. Percorso completo invariato quando NEW.tx_id IS NULL: bypass a due livelli (config.parameters.tx_id_bypass_enabled e GUC myapp.bypass_tx_id_check); se la GUC dbops.tx_id e'' impostata, l''id deve esistere in dbops.transaction_ids -- altrimenti AVVERTE (W_TXID_NOT_REGISTERED, non bloccante) e assegna script.uuid_nil(); se la GUC e'' assente chiama dbops.fn_get_or_create_session_tx_id(). Convenzione: E_ = errore bloccante, W_ = avvertimento. Vedi brief-db-coerenza-tx-id-non-registrato.md.';

              -- ── pratiche.fn_fork_definizione · DEFINIZIONE_BOZZA_ESISTENTE
              CREATE OR REPLACE FUNCTION pratiche.fn_fork_definizione(p_definizione_id integer, p_emittente_fiscale_id bigint)
               RETURNS integer
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'pratiche', 'script', 'config', 'dbops', 'pg_temp'
              AS $function$
              -- Scopo: creare l'edizione di un emittente da una definizione (di
              --        solito il preset), in BOZZA, con provenance per il drift.
              --        SECURITY DEFINER: la DML interna (via fn_copia) gira come owner.
              DECLARE
                v_tipo_id pratiche.workflow_definizioni.tipo_prestazione_id%TYPE;
              BEGIN
                IF p_emittente_fiscale_id IS NULL OR p_emittente_fiscale_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'pratiche', 'pratiche.fn_fork_definizione', 'E_PARAMETRO_INVALIDO',
                    jsonb_build_object('parametro','p_emittente_fiscale_id',
                                       'valore',p_emittente_fiscale_id),
                    NULL::uuid,
                    'il fork richiede un emittente valido; per una nuova versione dello stesso scope usare fn_nuova_versione_definizione');
                END IF;

                -- Scope destinazione = tipo della sorgente + emittente. Se la
                -- sorgente non esiste, il guard bozza si salta e fn_copia solleva
                -- E_VALORE_MANCANTE.
                SELECT wd.tipo_prestazione_id INTO v_tipo_id
                  FROM pratiche.workflow_definizioni wd
                 WHERE wd.id = p_definizione_id;

                IF v_tipo_id IS NOT NULL AND EXISTS (
                     SELECT 1 FROM pratiche.workflow_definizioni wd
                      WHERE wd.tipo_prestazione_id  = v_tipo_id
                        AND wd.emittente_fiscale_id IS NOT DISTINCT FROM p_emittente_fiscale_id
                        AND wd.stato = 'BOZZA'
                   ) THEN
                  PERFORM script.fn_log_and_raise_error(
                    'pratiche', 'pratiche.fn_fork_definizione', 'E_DEFINIZIONE_BOZZA_ESISTENTE',
                    jsonb_build_object('tipo_prestazione_id', v_tipo_id,
                                       'emittente_fiscale_id', p_emittente_fiscale_id),
                    NULL::uuid,
                    v_tipo_id::text,
                    p_emittente_fiscale_id::text);
                END IF;

                RETURN pratiche.fn_copia_definizione(p_definizione_id, p_emittente_fiscale_id, true);
              END;
              $function$;

              COMMENT ON FUNCTION pratiche.fn_fork_definizione(p_definizione_id integer, p_emittente_fiscale_id bigint)
              IS 'Crea l''edizione di un emittente da una definizione (di solito il preset), in BOZZA, con provenance per il drift. Wrapper di fn_copia_definizione(..., true). Guard: emittente NOT NULL; scope destinazione senza BOZZA aperta (DEFINIZIONE_BOZZA_ESISTENTE 515, invariante ≤1 BOZZA per scope). SECURITY DEFINER (search_path fisso): DML interna senza grant diretto; autorizzazione al gate app-layer (AdminAPIView).';

              -- ── pratiche.fn_guard_prerequisiti_flusso · PRATICHE_PREREQUISITI_NON_SODDISFATTI
              CREATE OR REPLACE FUNCTION pratiche.fn_guard_prerequisiti_flusso(p_pratica_id bigint, p_template_flusso_id integer)
               RETURNS void
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_non_soddisfatti text;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Guard fail-fast (fn_guard_*): solleva errore se esistono
                --   prerequisiti non soddisfatti per il template flusso.
                --
                -- Dipendenze:
                --   - pratiche.fn_check_prerequisiti_flusso()
                --   - script.fn_log_and_raise_error()
                --   - config.messaggi_errore: PRATICHE_PREREQUISITI_NON_SODDISFATTI
                -- =========================================================

                -- Raccoglie i codici dei prerequisiti non soddisfatti
                SELECT string_agg(codice, ', ')
                  INTO v_non_soddisfatti
                  FROM pratiche.fn_check_prerequisiti_flusso(p_pratica_id, p_template_flusso_id)
                 WHERE NOT soddisfatto;

                IF v_non_soddisfatti IS NOT NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database',
                    'fn_guard_prerequisiti_flusso',
                    'E_PRATICHE_PREREQUISITI_NON_SODDISFATTI',
                    jsonb_build_object(
                      'pratica_id', p_pratica_id,
                      'template_flusso_id', p_template_flusso_id,
                      'prerequisiti_mancanti', v_non_soddisfatti
                    ),
                    NULL::uuid,
                    v_non_soddisfatti
                  );
                END IF;
              END;
              $function$;

              COMMENT ON FUNCTION pratiche.fn_guard_prerequisiti_flusso(p_pratica_id bigint, p_template_flusso_id integer)
              IS 'Guard fail-fast: solleva eccezione se prerequisiti non soddisfatti.';

              -- ── pratiche.fn_guard_ripetibilita_flusso · PRATICHE_FLUSSO_NON_RIPETIBILE
              CREATE OR REPLACE FUNCTION pratiche.fn_guard_ripetibilita_flusso(p_pratica_id bigint, p_template_flusso_id integer)
               RETURNS void
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_codice         pratiche.template_flussi.codice%TYPE;
                  v_ripetibilita   pratiche.template_flussi.ripetibilita%TYPE;
                  v_ultimo_stato   config.stati_flussi_pratiche.codice_interno%TYPE;
                  v_ultimo_esito   pratiche.flussi.esito%TYPE;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Guard fail-fast (fn_guard_*): solleva errore se la
                --   regola di ripetibilita' del template vieta una nuova
                --   istanza nella pratica.
                --
                -- Dipendenze:
                --   - pratiche.fn_check_ripetibilita_flusso()
                --   - script.fn_log_and_raise_error()
                --   - config.messaggi_errore: PRATICHE_FLUSSO_NON_RIPETIBILE
                -- =========================================================

                IF pratiche.fn_check_ripetibilita_flusso(p_pratica_id, p_template_flusso_id) THEN
                  RETURN;
                END IF;

                -- Contesto per il messaggio: regola + ultima istanza valida.
                SELECT tf.codice, tf.ripetibilita
                  INTO v_codice, v_ripetibilita
                  FROM pratiche.template_flussi tf
                 WHERE tf.id = p_template_flusso_id;

                SELECT sfp.codice_interno, f.esito
                  INTO v_ultimo_stato, v_ultimo_esito
                  FROM pratiche.flussi f
                  JOIN config.stati_flussi_pratiche sfp ON sfp.id = f.stato_id
                 WHERE f.pratica_id         = p_pratica_id
                   AND f.template_flusso_id = p_template_flusso_id
                   AND sfp.codice_interno  <> 'ANNULLATO'
                 ORDER BY f.id DESC
                 LIMIT 1;

                PERFORM script.fn_log_and_raise_error(
                  'pratiche',
                  'pratiche.fn_guard_ripetibilita_flusso',
                  'E_PRATICHE_FLUSSO_NON_RIPETIBILE',
                  jsonb_build_object(
                    'pratica_id', p_pratica_id,
                    'template_flusso_id', p_template_flusso_id,
                    'template_codice', v_codice,
                    'ripetibilita', v_ripetibilita,
                    'ultima_istanza_stato', v_ultimo_stato,
                    'ultima_istanza_esito', v_ultimo_esito
                  ),
                  NULL::uuid,
                  coalesce(v_codice, p_template_flusso_id::text),
                  coalesce(v_ripetibilita, '?'),
                  concat(coalesce(v_ultimo_stato, '?'),
                         coalesce('/' || v_ultimo_esito, ''))
                );
              END;
              $function$;

              COMMENT ON FUNCTION pratiche.fn_guard_ripetibilita_flusso(p_pratica_id bigint, p_template_flusso_id integer)
              IS 'Guard fail-fast: solleva PRATICHE_FLUSSO_NON_RIPETIBILE se la regola di ripetibilita'' del template vieta una nuova istanza nella pratica.';

              -- ── pratiche.fn_lista_pratiche_per_contesto · PRATICHE_LISTA_CONTESTO_PARAMETRI_ESCLUSIVI
              CREATE OR REPLACE FUNCTION pratiche.fn_lista_pratiche_per_contesto(p_emittente_fiscale_id bigint, p_soggetto_ruolo_id bigint DEFAULT NULL::bigint, p_istanza_utility_id bigint DEFAULT NULL::bigint, p_solo_interne boolean DEFAULT false)
               RETURNS TABLE(pratica_id bigint, codice text, descrizione text, contesto text, tipo_prestazione_codice character varying, stato_codice character varying, priorita_codice character varying, soggetto_id uuid, soggetto_ragione_sociale text, soggetto_ruolo_id bigint, istanza_utility_id bigint, risorsa_umana_id bigint, unita_organizzativa_id integer, data_apertura date, data_scadenza date)
               LANGUAGE plpgsql
               STABLE
              AS $function$
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Lista pratiche per contesto anagrafico — lente canonica
                --   D1. Tre lenti mutuamente alternative (ruolo / istanza /
                --   interne); nessuna lente = tutte le pratiche
                --   dell'emittente. Bucket "contesto" calcolato per il
                --   raggruppamento FE: RUOLO / ISTANZA / SOGGETTO / INTERNA.
                -- =========================================================

                -- Guard: emittente obbligatorio (segregazione multi-company).
                IF p_emittente_fiscale_id IS NULL OR p_emittente_fiscale_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'pratiche',
                    'pratiche.fn_lista_pratiche_per_contesto',
                    'E_PARAMETRO_INVALIDO',
                    jsonb_build_object('parametro', 'p_emittente_fiscale_id',
                                       'valore', p_emittente_fiscale_id),
                    NULL::uuid,
                    'p_emittente_fiscale_id obbligatorio e > 0'
                  );
                END IF;

                -- Guard: lenti mutuamente alternative (al massimo una).
                IF (p_soggetto_ruolo_id IS NOT NULL)::int
                   + (p_istanza_utility_id IS NOT NULL)::int
                   + p_solo_interne::int > 1 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'pratiche',
                    'pratiche.fn_lista_pratiche_per_contesto',
                    'E_PRATICHE_LISTA_CONTESTO_PARAMETRI_ESCLUSIVI',
                    jsonb_build_object(
                      'soggetto_ruolo_id', p_soggetto_ruolo_id,
                      'istanza_utility_id', p_istanza_utility_id,
                      'solo_interne', p_solo_interne
                    ),
                    NULL::uuid,
                    VARIADIC ARRAY[]::text[]
                  );
                END IF;

                RETURN QUERY
                SELECT
                  p.id,
                  p.codice,
                  p.descrizione,
                  -- Bucket canonico del contesto (D1): un solo valore per pratica.
                  CASE
                    WHEN p.soggetto_ruolo_id IS NOT NULL THEN 'RUOLO'
                    WHEN p.istanza_utility_id IS NOT NULL THEN 'ISTANZA'
                    WHEN p.soggetto_id IS NOT NULL THEN 'SOGGETTO'
                    ELSE 'INTERNA'
                  END,
                  tp.codice,
                  sp.codice_interno,
                  pp.codice_interno,
                  p.soggetto_id,
                  sog.ragione_sociale_completa,
                  p.soggetto_ruolo_id,
                  p.istanza_utility_id,
                  p.risorsa_umana_id,
                  p.unita_organizzativa_id,
                  p.data_apertura,
                  p.data_scadenza
                FROM pratiche.pratiche p
                JOIN pratiche.tipi_prestazione tp ON tp.id = p.tipo_prestazione_id
                JOIN config.stati_pratiche sp     ON sp.id = p.stato_id
                JOIN config.priorita_pratiche pp  ON pp.id = p.priorita_id
                LEFT JOIN anagrafiche.soggetti sog ON sog.id = p.soggetto_id
                WHERE p.emittente_fiscale_id = p_emittente_fiscale_id
                  -- Lente ruolo: pratiche del ruolo soggetto indicato.
                  AND (p_soggetto_ruolo_id IS NULL
                       OR p.soggetto_ruolo_id = p_soggetto_ruolo_id)
                  -- Lente istanza: pratiche dell'istanza utility indicata.
                  AND (p_istanza_utility_id IS NULL
                       OR p.istanza_utility_id = p_istanza_utility_id)
                  -- Lente interne: nessun contesto cliente (soggetto NULL;
                  -- il guard contesto garantisce ruolo/istanza NULL a cascata).
                  AND (NOT p_solo_interne OR p.soggetto_id IS NULL)
                ORDER BY
                  pp.sequenza DESC,
                  p.data_scadenza NULLS LAST,
                  p.id;
              END;
              $function$;

              COMMENT ON FUNCTION pratiche.fn_lista_pratiche_per_contesto(p_emittente_fiscale_id bigint, p_soggetto_ruolo_id bigint, p_istanza_utility_id bigint, p_solo_interne boolean)
              IS 'Lente canonica D1: lista pratiche per contesto (ruolo soggetto / istanza utility / interne / tutte), lenti mutuamente alternative. Bucket contesto calcolato: RUOLO/ISTANZA/SOGGETTO/INTERNA. Ogni vista "pratiche di X" passa da qui.';

              -- ── pratiche.fn_nuova_versione_definizione · DEFINIZIONE_BOZZA_ESISTENTE, DEFINIZIONE_NO_PUBBLICATA
              CREATE OR REPLACE FUNCTION pratiche.fn_nuova_versione_definizione(p_definizione_id integer)
               RETURNS integer
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'pratiche', 'script', 'config', 'dbops', 'pg_temp'
              AS $function$
              -- Scopo: creare una nuova versione BOZZA nello stesso scope, derivata
              --        dalla PUBBLICATA corrente. Per modificare in sicurezza
              --        un'edizione gia' pubblicata. SECURITY DEFINER.
              DECLARE
                v_tipo_id   pratiche.workflow_definizioni.tipo_prestazione_id%TYPE;
                v_emittente pratiche.workflow_definizioni.emittente_fiscale_id%TYPE;
                v_stato     pratiche.workflow_definizioni.stato%TYPE;
                v_found     boolean;
              BEGIN
                SELECT wd.tipo_prestazione_id, wd.emittente_fiscale_id, wd.stato, true
                  INTO v_tipo_id, v_emittente, v_stato, v_found
                  FROM pratiche.workflow_definizioni wd
                 WHERE wd.id = p_definizione_id;

                IF v_found IS NOT TRUE THEN
                  PERFORM script.fn_log_and_raise_error(
                    'pratiche', 'pratiche.fn_nuova_versione_definizione', 'E_VALORE_MANCANTE',
                    jsonb_build_object('definizione_sorgente_id', p_definizione_id),
                    NULL::uuid, concat('workflow_definizioni id ', p_definizione_id));
                END IF;

                -- (1) La nuova versione si deriva SOLO da una PUBBLICATA.
                IF v_stato <> 'PUBBLICATA' THEN
                  PERFORM script.fn_log_and_raise_error(
                    'pratiche', 'pratiche.fn_nuova_versione_definizione', 'E_DEFINIZIONE_NO_PUBBLICATA',
                    jsonb_build_object('definizione_id', p_definizione_id, 'stato', v_stato),
                    NULL::uuid, p_definizione_id::text);
                END IF;

                -- (2) Invariante ≤1 BOZZA per scope.
                IF EXISTS (
                     SELECT 1 FROM pratiche.workflow_definizioni wd
                      WHERE wd.tipo_prestazione_id  = v_tipo_id
                        AND wd.emittente_fiscale_id IS NOT DISTINCT FROM v_emittente
                        AND wd.stato = 'BOZZA'
                   ) THEN
                  PERFORM script.fn_log_and_raise_error(
                    'pratiche', 'pratiche.fn_nuova_versione_definizione', 'E_DEFINIZIONE_BOZZA_ESISTENTE',
                    jsonb_build_object('tipo_prestazione_id', v_tipo_id,
                                       'emittente_fiscale_id', v_emittente),
                    NULL::uuid,
                    v_tipo_id::text,
                    COALESCE(v_emittente::text, 'preset'));
                END IF;

                RETURN pratiche.fn_copia_definizione(p_definizione_id, v_emittente, false);
              END;
              $function$;

              COMMENT ON FUNCTION pratiche.fn_nuova_versione_definizione(p_definizione_id integer)
              IS 'Crea una nuova versione BOZZA nello stesso scope, derivata dalla PUBBLICATA corrente (la sorgente DEVE essere PUBBLICATA: da BOZZA/RITIRATA -> DEFINIZIONE_NO_PUBBLICATA 516). Guard invariante ≤1 BOZZA per scope (DEFINIZIONE_BOZZA_ESISTENTE 515). Wrapper di fn_copia_definizione(..., false). SECURITY DEFINER (search_path fisso).';

              -- ── pratiche.fn_prendi_in_carico_flusso · FLUSSI_COMPETENZA_MANCANTE, FLUSSI_GIA_ASSEGNATO, FLUSSI_PRESA_CARICO_STATO_ERRATO, FLUSSI_PRESA_NON_ELIGIBILE
              CREATE OR REPLACE FUNCTION pratiche.fn_prendi_in_carico_flusso(p_flusso_id bigint, p_risorsa_umana_id bigint)
               RETURNS boolean
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: assegnare un flusso DA_ESEGUIRE all'operatore corrente,
              --        applicando la policy di eligibilita' reparto-first +
              --        competenza opzionale (design assegnazione-flusso §2.2).
              -- Regole:
              --   1. Il flusso deve esistere
              --   2. Stato DA_ESEGUIRE
              --   3. Non gia' assegnato ad altro operatore
              --   4. Eligibilita' (casi A/B/C/D, vedi sotto)
              -- Risultato: true se assegnato, false se gia' assegnato allo stesso operatore.
              -- Nota: SELECT ... FOR UPDATE per evitare race condition.
              DECLARE
                  v_stato_id          pratiche.flussi.stato_id%TYPE;
                  v_risorsa_attuale   pratiche.flussi.risorsa_umana_id%TYPE;
                  v_template_id       pratiche.flussi.template_flusso_id%TYPE;
                  v_unita_org         pratiche.flussi.unita_organizzativa_id%TYPE;
                  v_da_eseguire_id    config.stati_flussi_pratiche.id%TYPE;
                  v_has_skill_lock    BOOLEAN;
                  v_competente        BOOLEAN;
                  v_reparto_operatore anagrafiche.risorse_umane.unita_organizzativa_id%TYPE;
                  v_righe_aggiornate  INTEGER;
              BEGIN
                  -- Guard: parametri obbligatori
                  IF p_flusso_id IS NULL OR p_flusso_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'pratiche', 'pratiche.fn_prendi_in_carico_flusso',
                          'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('p_flusso_id', p_flusso_id),
                          NULL::uuid, 'p_flusso_id'
                      );
                  END IF;

                  IF p_risorsa_umana_id IS NULL OR p_risorsa_umana_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'pratiche', 'pratiche.fn_prendi_in_carico_flusso',
                          'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('p_risorsa_umana_id', p_risorsa_umana_id),
                          NULL::uuid, 'p_risorsa_umana_id'
                      );
                  END IF;

                  -- Recupera stato + routing del flusso CON LOCK (FOR UPDATE)
                  SELECT f.stato_id, f.risorsa_umana_id, f.template_flusso_id, f.unita_organizzativa_id
                    INTO v_stato_id, v_risorsa_attuale, v_template_id, v_unita_org
                    FROM pratiche.flussi f
                   WHERE f.id = p_flusso_id
                     FOR UPDATE;

                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'pratiche', 'pratiche.fn_prendi_in_carico_flusso',
                          'E_VALORE_MANCANTE',
                          jsonb_build_object('flusso_id', p_flusso_id),
                          NULL::uuid, concat('flusso_id ', p_flusso_id)
                      );
                  END IF;

                  -- Verifica stato DA_ESEGUIRE
                  SELECT id INTO v_da_eseguire_id
                    FROM config.stati_flussi_pratiche
                   WHERE codice_interno = 'DA_ESEGUIRE';

                  IF v_stato_id <> v_da_eseguire_id THEN
                      PERFORM script.fn_log_and_raise_error(
                          'pratiche', 'pratiche.fn_prendi_in_carico_flusso',
                          'E_FLUSSI_PRESA_CARICO_STATO_ERRATO',
                          jsonb_build_object('flusso_id', p_flusso_id, 'stato_id', v_stato_id, 'stato_richiesto', v_da_eseguire_id),
                          NULL::uuid, p_flusso_id::text
                      );
                  END IF;

                  -- Gia' assegnato allo stesso operatore: noop
                  IF v_risorsa_attuale = p_risorsa_umana_id THEN
                      RETURN FALSE;
                  END IF;

                  -- Gia' assegnato ad altro operatore: errore
                  IF v_risorsa_attuale IS NOT NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'pratiche', 'pratiche.fn_prendi_in_carico_flusso',
                          'E_FLUSSI_GIA_ASSEGNATO',
                          jsonb_build_object('flusso_id', p_flusso_id, 'risorsa_attuale', v_risorsa_attuale, 'risorsa_richiedente', p_risorsa_umana_id),
                          NULL::uuid, p_flusso_id::text, v_risorsa_attuale::text
                      );
                  END IF;

                  -- ============================================================
                  -- Eligibilita' (policy reparto-first + competenza opzionale)
                  -- ============================================================
                  -- skill-lock: la matrice competenze e' configurata (attiva) per il template
                  v_has_skill_lock := (v_template_id IS NOT NULL) AND EXISTS (
                      SELECT 1 FROM pratiche.competenze_flussi cf
                       WHERE cf.template_flusso_id = v_template_id
                         AND cf.attivo = true
                  );

                  IF v_has_skill_lock THEN
                      -- Casi A/D: serve competenza ATTIVA dell'operatore
                      SELECT EXISTS (
                          SELECT 1 FROM pratiche.competenze_flussi cf
                           WHERE cf.template_flusso_id = v_template_id
                             AND cf.risorsa_umana_id = p_risorsa_umana_id
                             AND cf.attivo = true
                      ) INTO v_competente;

                      IF NOT v_competente THEN
                          PERFORM script.fn_log_and_raise_error(
                              'pratiche', 'pratiche.fn_prendi_in_carico_flusso',
                              'E_FLUSSI_COMPETENZA_MANCANTE',
                              jsonb_build_object('flusso_id', p_flusso_id, 'template_flusso_id', v_template_id, 'risorsa_umana_id', p_risorsa_umana_id),
                              NULL::uuid, p_flusso_id::text, p_risorsa_umana_id::text
                          );
                      END IF;

                  ELSIF v_unita_org IS NOT NULL THEN
                      -- Caso B: niente skill-lock ma reparto valorizzato -> serve
                      -- appartenenza al reparto ANAGRAFICO dell'operatore
                      SELECT unita_organizzativa_id INTO v_reparto_operatore
                        FROM anagrafiche.risorse_umane
                       WHERE id = p_risorsa_umana_id;

                      IF v_reparto_operatore IS NULL OR v_reparto_operatore <> v_unita_org THEN
                          PERFORM script.fn_log_and_raise_error(
                              'pratiche', 'pratiche.fn_prendi_in_carico_flusso',
                              'E_FLUSSI_PRESA_NON_ELIGIBILE',
                              jsonb_build_object(
                                  'flusso_id', p_flusso_id,
                                  'unita_organizzativa_flusso', v_unita_org,
                                  'unita_organizzativa_operatore', v_reparto_operatore,
                                  'risorsa_umana_id', p_risorsa_umana_id
                              ),
                              NULL::uuid, p_flusso_id::text, p_risorsa_umana_id::text
                          );
                      END IF;

                  -- ELSE: Caso C (niente reparto, niente skill-lock) -> presa libera
                  END IF;

                  -- Assegna il flusso e verifica risultato
                  UPDATE pratiche.flussi
                     SET risorsa_umana_id = p_risorsa_umana_id
                   WHERE id = p_flusso_id;

                  GET DIAGNOSTICS v_righe_aggiornate = ROW_COUNT;

                  IF v_righe_aggiornate <> 1 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'pratiche', 'pratiche.fn_prendi_in_carico_flusso',
                          'E_QUERY_FAILED',
                          jsonb_build_object('flusso_id', p_flusso_id),
                          NULL::uuid, 'pratiche', 'flussi', 'UPDATE'
                      );
                  END IF;

                  RETURN TRUE;
              END;
              $function$;

              COMMENT ON FUNCTION pratiche.fn_prendi_in_carico_flusso(p_flusso_id bigint, p_risorsa_umana_id bigint)
              IS 'Assegna un flusso DA_ESEGUIRE all''operatore con policy eligibilita'' reparto-first + competenza opzionale (casi A/B/C/D). FOR UPDATE anti-race.';

              -- ── pratiche.fn_pubblica_definizione · DEFINIZIONE_NON_PUBBLICABILE
              CREATE OR REPLACE FUNCTION pratiche.fn_pubblica_definizione(p_definizione_id integer)
               RETURNS integer
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'pratiche', 'script', 'config', 'dbops', 'pg_temp'
              AS $function$
              -- Scopo: validare e pubblicare una BOZZA, ritirando la precedente
              --        PUBBLICATA dello stesso scope (atomico).
              -- SECURITY DEFINER: gli UPDATE su workflow_definizioni girano come owner.
              DECLARE
                v_tipo_id   pratiche.workflow_definizioni.tipo_prestazione_id%TYPE;
                v_emittente pratiche.workflow_definizioni.emittente_fiscale_id%TYPE;
                v_stato     pratiche.workflow_definizioni.stato%TYPE;
                v_n_attivi  integer;
                v_has_cycle boolean;
              BEGIN
                IF p_definizione_id IS NULL OR p_definizione_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'pratiche', 'pratiche.fn_pubblica_definizione', 'E_PARAMETRO_INVALIDO',
                    jsonb_build_object('parametro','p_definizione_id','valore',p_definizione_id),
                    NULL::uuid, 'p_definizione_id obbligatorio e > 0');
                END IF;

                SELECT wd.tipo_prestazione_id, wd.emittente_fiscale_id, wd.stato
                  INTO v_tipo_id, v_emittente, v_stato
                  FROM pratiche.workflow_definizioni wd
                 WHERE wd.id = p_definizione_id;
                IF NOT FOUND THEN
                  PERFORM script.fn_log_and_raise_error(
                    'pratiche', 'pratiche.fn_pubblica_definizione', 'E_VALORE_MANCANTE',
                    jsonb_build_object('definizione_id', p_definizione_id),
                    NULL::uuid, concat('workflow_definizioni id ', p_definizione_id));
                END IF;

                -- (a) deve essere in BOZZA.
                IF v_stato <> 'BOZZA' THEN
                  PERFORM script.fn_log_and_raise_error(
                    'pratiche', 'pratiche.fn_pubblica_definizione', 'E_DEFINIZIONE_NON_PUBBLICABILE',
                    jsonb_build_object('definizione_id', p_definizione_id, 'stato', v_stato),
                    NULL::uuid, p_definizione_id::text,
                    concat('non e'' in BOZZA (stato ', v_stato, ')'));
                END IF;

                -- (b) almeno uno step attivo.
                SELECT count(*) INTO v_n_attivi
                  FROM pratiche.template_flussi tf
                 WHERE tf.definizione_id = p_definizione_id AND tf.attivo;
                IF v_n_attivi = 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'pratiche', 'pratiche.fn_pubblica_definizione', 'E_DEFINIZIONE_NON_PUBBLICABILE',
                    jsonb_build_object('definizione_id', p_definizione_id),
                    NULL::uuid, p_definizione_id::text, 'nessuno step attivo nella definizione');
                END IF;

                -- (c) nessun ciclo nel grafo dei prerequisiti (chiusura transitiva).
                WITH RECURSIVE closure(start_node, cur) AS (
                  SELECT p.template_flusso_id, p.prerequisito_id
                    FROM pratiche.template_flussi_prerequisiti p
                    JOIN pratiche.template_flussi t
                         ON t.id = p.template_flusso_id AND t.definizione_id = p_definizione_id
                  UNION
                  SELECT c.start_node, p.prerequisito_id
                    FROM closure c
                    JOIN pratiche.template_flussi_prerequisiti p ON p.template_flusso_id = c.cur
                    JOIN pratiche.template_flussi t
                         ON t.id = p.template_flusso_id AND t.definizione_id = p_definizione_id
                )
                SELECT EXISTS (SELECT 1 FROM closure WHERE start_node = cur) INTO v_has_cycle;
                IF v_has_cycle THEN
                  PERFORM script.fn_log_and_raise_error(
                    'pratiche', 'pratiche.fn_pubblica_definizione', 'E_DEFINIZIONE_NON_PUBBLICABILE',
                    jsonb_build_object('definizione_id', p_definizione_id),
                    NULL::uuid, p_definizione_id::text, 'ciclo nel grafo dei prerequisiti');
                END IF;

                -- Ritira la precedente PUBBLICATA dello scope, poi pubblica.
                UPDATE pratiche.workflow_definizioni
                   SET stato = 'RITIRATA'
                 WHERE tipo_prestazione_id = v_tipo_id
                   AND emittente_fiscale_id IS NOT DISTINCT FROM v_emittente
                   AND stato = 'PUBBLICATA';

                UPDATE pratiche.workflow_definizioni
                   SET stato = 'PUBBLICATA'
                 WHERE id = p_definizione_id;

                RETURN p_definizione_id;
              END;
              $function$;

              COMMENT ON FUNCTION pratiche.fn_pubblica_definizione(p_definizione_id integer)
              IS 'Valida una BOZZA e la pubblica, ritirando in transazione la precedente PUBBLICATA dello scope (una sola per scope). Validazioni fail-fast DEFINIZIONE_NON_PUBBLICABILE (511): non-BOZZA, nessuno step attivo, ciclo prerequisiti. SECURITY DEFINER (search_path fisso): gli UPDATE passano senza grant diretto; autorizzazione al gate app-layer (AdminAPIView).';

              -- ── pratiche.fn_risolvi_definizione · DEFINIZIONE_NON_TROVATA
              CREATE OR REPLACE FUNCTION pratiche.fn_risolvi_definizione(p_tipo_prestazione_id integer, p_emittente_fiscale_id bigint DEFAULT NULL::bigint)
               RETURNS integer
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: risolve l'edizione di workflow da pinnare/usare per un
              --        tipo prestazione e uno scope emittente:
              --        1) PUBBLICATA dell'emittente; 2) preset PUBBLICATA;
              --        3) errore parlante 507. Un solo punto di risoluzione
              --        (usato da auto-pin pratiche e auto-default template).
              DECLARE
                v_definizione_id pratiche.workflow_definizioni.id%TYPE;
              BEGIN
                -- Guard esplicito sul parametro id (no normalizzazione silenziosa).
                IF p_tipo_prestazione_id IS NULL OR p_tipo_prestazione_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'pratiche',
                    'pratiche.fn_risolvi_definizione',
                    'E_DEFINIZIONE_NON_TROVATA',
                    jsonb_build_object(
                      'motivo',               'parametro_tipo_invalido',
                      'tipo_prestazione_id',  p_tipo_prestazione_id,
                      'emittente_fiscale_id', p_emittente_fiscale_id
                    ),
                    NULL::uuid,
                    COALESCE(p_tipo_prestazione_id::text, 'NULL'),
                    COALESCE(p_emittente_fiscale_id::text, 'preset')
                  );
                END IF;

                -- 1) Edizione pubblicata dell'emittente (fork — da Fase 2).
                IF p_emittente_fiscale_id IS NOT NULL THEN
                  SELECT wd.id INTO v_definizione_id
                    FROM pratiche.workflow_definizioni wd
                   WHERE wd.tipo_prestazione_id  = p_tipo_prestazione_id
                     AND wd.emittente_fiscale_id = p_emittente_fiscale_id
                     AND wd.stato = 'PUBBLICATA';
                  IF FOUND THEN
                    RETURN v_definizione_id;
                  END IF;
                END IF;

                -- 2) Preset pubblicato (emittente NULL).
                SELECT wd.id INTO v_definizione_id
                  FROM pratiche.workflow_definizioni wd
                 WHERE wd.tipo_prestazione_id = p_tipo_prestazione_id
                   AND wd.emittente_fiscale_id IS NULL
                   AND wd.stato = 'PUBBLICATA';
                IF FOUND THEN
                  RETURN v_definizione_id;
                END IF;

                -- 3) Nessuna edizione risolvibile: errore parlante.
                PERFORM script.fn_log_and_raise_error(
                  'pratiche',
                  'pratiche.fn_risolvi_definizione',
                  'E_DEFINIZIONE_NON_TROVATA',
                  jsonb_build_object(
                    'motivo',               'nessuna_pubblicata',
                    'tipo_prestazione_id',  p_tipo_prestazione_id,
                    'emittente_fiscale_id', p_emittente_fiscale_id
                  ),
                  NULL::uuid,
                  p_tipo_prestazione_id::text,
                  COALESCE(p_emittente_fiscale_id::text, 'preset')
                );
                RETURN NULL; -- irraggiungibile (la fn sopra solleva)
              END;
              $function$;

              COMMENT ON FUNCTION pratiche.fn_risolvi_definizione(p_tipo_prestazione_id integer, p_emittente_fiscale_id bigint)
              IS 'Risolve l''edizione di workflow per (tipo prestazione, emittente): PUBBLICATA dell''emittente > preset PUBBLICATA > errore DEFINIZIONE_NON_TROVATA (507). Punto unico di risoluzione, usato dall''auto-pin delle pratiche e dall''auto-default dei template. VOLATILE perche'' il ramo di errore logga.';

              -- ── pratiche.trgfn_flussi_guard_chiusura_prematura · PRATICHE_CHIUSURA_FLUSSO_PREMATURO
              CREATE OR REPLACE FUNCTION pratiche.trgfn_flussi_guard_chiusura_prematura()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: il flusso "di chiusura" (template.chiude_pratica) chiude la
              --   pratica: non puo' essere completato finche' la pratica non e'
              --   chiudibile (fn_check_pratica_chiudibile) ESCLUDENDO se stesso
              --   (template dai bloccanti, istanza dai flussi aperti). Coerente col guard
              --   di chiusura della pratica; evita che l'auto-chiusura conseguente fallisca.
              -- Regole:
              --   1. Scatta solo alla transizione di stato verso COMPLETATO.
              --   2. Solo se il template del flusso e' chiude_pratica.
              --   3. fn_check_pratica_chiudibile escludendo il template (bloccanti) e
              --      l'istanza (flussi aperti) del flusso di chiusura stesso: se false
              --      -> errore parlante.
              DECLARE
                  v_completato_id config.stati_flussi_pratiche.id%TYPE;
                  v_e_chiusura    boolean;
              BEGIN
                  -- (1) Solo verso COMPLETATO, e solo a stato realmente cambiato.
                  SELECT id INTO v_completato_id
                    FROM config.stati_flussi_pratiche
                   WHERE codice_interno = 'COMPLETATO';

                  IF NEW.stato_id IS DISTINCT FROM v_completato_id
                     OR OLD.stato_id = NEW.stato_id THEN
                      RETURN NEW;
                  END IF;

                  -- (2) Solo flussi da template "di chiusura".
                  IF NEW.template_flusso_id IS NULL THEN
                      RETURN NEW;
                  END IF;

                  SELECT tf.chiude_pratica INTO v_e_chiusura
                    FROM pratiche.template_flussi tf
                   WHERE tf.id = NEW.template_flusso_id;

                  IF NOT COALESCE(v_e_chiusura, false) THEN
                      RETURN NEW;
                  END IF;

                  -- (3) Ammesso solo se la pratica e' chiudibile escludendo SE STESSO
                  --     (template dai bloccanti + istanza NEW.id dai flussi aperti, D1).
                  IF NOT pratiche.fn_check_pratica_chiudibile(NEW.pratica_id, NEW.template_flusso_id, NEW.id) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'pratiche',
                          'pratiche.trgfn_flussi_guard_chiusura_prematura',
                          'E_PRATICHE_CHIUSURA_FLUSSO_PREMATURO',
                          jsonb_build_object(
                              'pratica_id', NEW.pratica_id,
                              'flusso_id', NEW.id,
                              'template_flusso_id', NEW.template_flusso_id
                          ),
                          NEW.tx_id,
                          NEW.id::text
                      );
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION pratiche.trgfn_flussi_guard_chiusura_prematura()
              IS 'BEFORE UPDATE OF stato_id su flussi: blocca il completamento del flusso di chiusura (template.chiude_pratica) se la pratica non e'' chiudibile escludendo se stesso (fn_check_pratica_chiudibile con p_escludi_template_id + p_escludi_flusso_id=NEW.id).';

              -- ── pratiche.trgfn_flussi_guard_definizione · FLUSSI_TEMPLATE_FUORI_DEFINIZIONE
              CREATE OR REPLACE FUNCTION pratiche.trgfn_flussi_guard_definizione()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: un flusso appartiene a una pratica; il suo template deve
              --        stare nella STESSA edizione di workflow che la pratica ha
              --        pinnato alla nascita. Difesa a DB della coerenza pin<->step.
              DECLARE
                v_pratica_definizione_id  pratiche.pratiche.definizione_id%TYPE;
                v_template_definizione_id pratiche.template_flussi.definizione_id%TYPE;
                v_template_codice         pratiche.template_flussi.codice%TYPE;
              BEGIN
                SELECT p.definizione_id
                  INTO v_pratica_definizione_id
                  FROM pratiche.pratiche p
                 WHERE p.id = NEW.pratica_id;

                SELECT tf.definizione_id, tf.codice
                  INTO v_template_definizione_id, v_template_codice
                  FROM pratiche.template_flussi tf
                 WHERE tf.id = NEW.template_flusso_id;

                IF v_template_definizione_id IS DISTINCT FROM v_pratica_definizione_id THEN
                  PERFORM script.fn_log_and_raise_error(
                    'pratiche',
                    'pratiche.trgfn_flussi_guard_definizione',
                    'E_FLUSSI_TEMPLATE_FUORI_DEFINIZIONE',
                    jsonb_build_object(
                      'flusso_pratica_id',       NEW.pratica_id,
                      'template_flusso_id',      NEW.template_flusso_id,
                      'template_codice',         v_template_codice,
                      'template_definizione_id', v_template_definizione_id,
                      'pratica_definizione_id',  v_pratica_definizione_id
                    ),
                    NEW.tx_id,
                    COALESCE(v_template_codice, NEW.template_flusso_id::text),
                    COALESCE(v_pratica_definizione_id::text, 'NULL'),
                    NEW.pratica_id::text
                  );
                END IF;

                RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION pratiche.trgfn_flussi_guard_definizione()
              IS 'BEFORE INSERT su pratiche.flussi: il template del flusso deve appartenere alla definizione (edizione di workflow) pinnata dalla pratica -> FLUSSI_TEMPLATE_FUORI_DEFINIZIONE (508). Difesa a DB della coerenza pin<->step (V6/versionamento).';

              -- ── pratiche.trgfn_flussi_guard_esito_classe · FLUSSI_ESITO_NON_AMMESSO
              CREATE OR REPLACE FUNCTION pratiche.trgfn_flussi_guard_esito_classe()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: al completamento di un flusso la CLASSE dell'esito deve
              --        corrispondere alla modalita_esito del template:
              --          DOMINIO     => esito di ramo (is_verdetto = false);
              --          non-DOMINIO => verdetto      (is_verdetto = true).
              --        Difesa in profondita' autoritativa: vale per qualunque
              --        percorso di scrittura (BE di dominio, generico, SQL).
              -- Regole:
              --   1. Scoped alla TRANSIZIONE verso COMPLETATO: le righe gia'
              --      completate (legacy PRA-0000243) restano toccabili.
              --   2. Esito NULL a COMPLETATO -> competenza del guard 477.
              --   3. Flusso senza template -> classe verdetto (come il BE, che
              --      tratta il template assente come MANUALE).
              DECLARE
                v_modalita        pratiche.template_flussi.modalita_esito%TYPE;
                v_template_codice pratiche.template_flussi.codice%TYPE;
                v_is_verdetto     config.esiti_flussi_pratiche.is_verdetto%TYPE;
              BEGIN
                -- (1) Solo la transizione di completamento. L'evento e' UPDATE OF
                -- stato_id: si esclude lo "stato riscritto identico" (no transizione).
                IF TG_OP = 'UPDATE' AND OLD.stato_id = NEW.stato_id THEN
                  RETURN NEW;
                END IF;

                -- (2) Senza esito non c'e' classe da validare (guard 477 presidia).
                IF NEW.esito IS NULL THEN
                  RETURN NEW;
                END IF;

                IF NOT EXISTS (
                  SELECT 1
                    FROM config.stati_flussi_pratiche sfp
                   WHERE sfp.id = NEW.stato_id
                     AND sfp.codice_interno = 'COMPLETATO'
                ) THEN
                  RETURN NEW;
                END IF;

                -- (3) Classe attesa dal template.
                SELECT tf.modalita_esito, tf.codice
                  INTO v_modalita, v_template_codice
                  FROM pratiche.template_flussi tf
                 WHERE tf.id = NEW.template_flusso_id;
                IF NOT FOUND THEN
                  v_modalita        := 'MANUALE';
                  v_template_codice := NULL;
                END IF;

                -- Classe dell'esito (esistenza gia' garantita da fk_flussi_esito;
                -- guard difensivo comunque).
                SELECT e.is_verdetto
                  INTO v_is_verdetto
                  FROM config.esiti_flussi_pratiche e
                 WHERE e.codice_interno = NEW.esito;
                IF NOT FOUND THEN
                  RETURN NEW;
                END IF;

                IF v_modalita = 'DOMINIO' AND v_is_verdetto THEN
                  -- Il caso PRA-0000243: verdetto generico su step a esito
                  -- calcolato dal dominio -> ramo mai attivato, in silenzio.
                  PERFORM script.fn_log_and_raise_error(
                    'pratiche',
                    'pratiche.trgfn_flussi_guard_esito_classe',
                    'E_FLUSSI_ESITO_NON_AMMESSO',
                    jsonb_build_object(
                      'flusso_id',          NEW.id,
                      'pratica_id',         NEW.pratica_id,
                      'template_flusso_id', NEW.template_flusso_id,
                      'template_codice',    v_template_codice,
                      'modalita_esito',     v_modalita,
                      'esito',              NEW.esito
                    ),
                    NEW.tx_id,
                    NEW.esito,
                    COALESCE(v_template_codice, NEW.id::text),
                    'ramo (calcolato dal dominio)'
                  );
                ELSIF v_modalita <> 'DOMINIO' AND NOT v_is_verdetto THEN
                  -- Simmetrico: esito di ramo scritto su uno step normale
                  -- (prima fermato solo dal guard BE lato operatore).
                  PERFORM script.fn_log_and_raise_error(
                    'pratiche',
                    'pratiche.trgfn_flussi_guard_esito_classe',
                    'E_FLUSSI_ESITO_NON_AMMESSO',
                    jsonb_build_object(
                      'flusso_id',          NEW.id,
                      'pratica_id',         NEW.pratica_id,
                      'template_flusso_id', NEW.template_flusso_id,
                      'template_codice',    v_template_codice,
                      'modalita_esito',     v_modalita,
                      'esito',              NEW.esito
                    ),
                    NEW.tx_id,
                    NEW.esito,
                    COALESCE(v_template_codice, NEW.id::text),
                    'verdetto'
                  );
                END IF;

                RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION pratiche.trgfn_flussi_guard_esito_classe()
              IS 'BEFORE INSERT OR UPDATE OF stato_id su pratiche.flussi: alla transizione verso COMPLETATO la classe dell''esito deve corrispondere alla modalita_esito del template (DOMINIO => ramo is_verdetto=false, altrimenti verdetto is_verdetto=true) — FLUSSI_ESITO_NON_AMMESSO (504). Scoped alla transizione: righe gia'' COMPLETATE non ri-validate (legacy PRA-0000243).';

              -- ── pratiche.trgfn_flussi_guard_esito_completato · FLUSSI_ESITO_OBBLIGATORIO
              CREATE OR REPLACE FUNCTION pratiche.trgfn_flussi_guard_esito_completato()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: una fase (flusso) non puo' chiudersi senza verdetto.
              -- Se il nuovo stato e' COMPLETATO l'esito e' obbligatorio.
              -- BEFORE INSERT OR UPDATE OF stato_id su pratiche.flussi.
              BEGIN
                IF NEW.esito IS NULL
                   AND EXISTS (
                     SELECT 1
                       FROM config.stati_flussi_pratiche sfp
                      WHERE sfp.id = NEW.stato_id
                        AND sfp.codice_interno = 'COMPLETATO'
                   )
                THEN
                  PERFORM script.fn_log_and_raise_error(
                    'pratiche',
                    'pratiche.trgfn_flussi_guard_esito_completato',
                    'E_FLUSSI_ESITO_OBBLIGATORIO',
                    jsonb_build_object(
                      'flusso_id', NEW.id,
                      'pratica_id', NEW.pratica_id,
                      'template_flusso_id', NEW.template_flusso_id
                    ),
                    NEW.tx_id,
                    NEW.id::text
                  );
                END IF;

                RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION pratiche.trgfn_flussi_guard_esito_completato()
              IS 'BEFORE INSERT OR UPDATE OF stato_id su flussi: COMPLETATO richiede esito NOT NULL (nessuna fase si chiude senza verdetto).';

              -- ── pratiche.trgfn_flussi_guard_pratica_terminale · PRATICHE_TERMINALE_FLUSSO_NON_MODIFICABILE, PRATICHE_TERMINALE_NUOVO_FLUSSO_BLOCCATO
              CREATE OR REPLACE FUNCTION pratiche.trgfn_flussi_guard_pratica_terminale()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: difesa lato DB. Una pratica in stato TERMINALE e' conclusa
              --   e i suoi flussi sono congelati: ne' nuovi flussi (INSERT) ne'
              --   modifiche a flussi esistenti (UPDATE: stato, esito, note_esito,
              --   qualunque campo operativo).
              -- Regole:
              --   1. "Terminale" = stato pratica senza alcuna transizione di stato
              --      in uscita attiva (config.transizioni_stati_pratiche). Nessun
              --      id/codice hardcodato: la definizione si auto-mantiene.
              --   2. Il guard e' su pratiche.flussi: la transizione della pratica
              --      verso lo stato terminale (UPDATE su pratiche.pratiche) non
              --      passa di qui e resta permessa.
              --   3. Codice errore distinto per operazione (creazione vs modifica)
              --      per messaggi utente piu' chiari lato BE/FE.
              DECLARE
                  v_stato_id      pratiche.pratiche.stato_id%TYPE;
                  v_stato_codice  config.stati_pratiche.codice_interno%TYPE;
              BEGIN
                  -- Stato corrente della pratica padre (esiste sempre: FK fk_flussi_pratica).
                  SELECT p.stato_id, sp.codice_interno
                    INTO v_stato_id, v_stato_codice
                    FROM pratiche.pratiche p
                    JOIN config.stati_pratiche sp ON sp.id = p.stato_id
                   WHERE p.id = NEW.pratica_id;

                  -- Pratica ancora operabile (lo stato ha almeno una uscita attiva):
                  -- nessun blocco.
                  IF EXISTS (
                      SELECT 1
                        FROM config.transizioni_stati_pratiche t
                       WHERE t.stato_da_id = v_stato_id
                         AND t.attivo
                  ) THEN
                      RETURN NEW;
                  END IF;

                  -- Pratica terminale: blocca con errore parlante.
                  IF TG_OP = 'INSERT' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'pratiche',
                          'pratiche.trgfn_flussi_guard_pratica_terminale',
                          'E_PRATICHE_TERMINALE_NUOVO_FLUSSO_BLOCCATO',
                          jsonb_build_object(
                              'pratica_id', NEW.pratica_id,
                              'stato', v_stato_codice
                          ),
                          NEW.tx_id,
                          v_stato_codice
                      );
                  ELSE
                      PERFORM script.fn_log_and_raise_error(
                          'pratiche',
                          'pratiche.trgfn_flussi_guard_pratica_terminale',
                          'E_PRATICHE_TERMINALE_FLUSSO_NON_MODIFICABILE',
                          jsonb_build_object(
                              'pratica_id', NEW.pratica_id,
                              'flusso_id', NEW.id,
                              'stato', v_stato_codice
                          ),
                          NEW.tx_id,
                          v_stato_codice
                      );
                  END IF;

                  RETURN NEW;  -- non raggiunto: fn_log_and_raise_error solleva.
              END;
              $function$;

              COMMENT ON FUNCTION pratiche.trgfn_flussi_guard_pratica_terminale()
              IS 'BEFORE INSERT OR UPDATE su flussi: blocca creazione/modifica di flussi se la pratica padre e'' in stato terminale (stato senza transizioni di stato in uscita attive). Non blocca la transizione della pratica a terminale (guard su flussi, non su pratiche).';

              -- ── pratiche.trgfn_flussi_guard_transizione · FLUSSI_TRANSIZIONE_NON_AMMESSA
              CREATE OR REPLACE FUNCTION pratiche.trgfn_flussi_guard_transizione()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: blocca transizioni di stato non ammesse per i flussi.
              -- Consulta la matrice config.transizioni_stati_flussi_pratiche (solo righe attive).
              -- Risolve i codici interni degli stati per messaggi di errore leggibili.
              DECLARE
                  v_codice_da config.stati_flussi_pratiche.codice_interno%TYPE;
                  v_codice_a  config.stati_flussi_pratiche.codice_interno%TYPE;
              BEGIN
                  -- Nessuna transizione: niente da validare
                  IF OLD.stato_id = NEW.stato_id THEN
                      RETURN NEW;
                  END IF;

                  -- Verifica che la transizione sia ammessa
                  IF NOT EXISTS (
                      SELECT 1 FROM config.transizioni_stati_flussi_pratiche
                      WHERE stato_da_id = OLD.stato_id
                        AND stato_a_id  = NEW.stato_id
                        AND attivo = true
                  ) THEN
                      SELECT codice_interno INTO v_codice_da
                      FROM config.stati_flussi_pratiche WHERE id = OLD.stato_id;

                      SELECT codice_interno INTO v_codice_a
                      FROM config.stati_flussi_pratiche WHERE id = NEW.stato_id;



                       PERFORM script.fn_log_and_raise_error(
                          'pratiche',
                          'pratiche. trgfn_flussi_guard_transizione',
                          'E_FLUSSI_TRANSIZIONE_NON_AMMESSA',
                          jsonb_build_object(
                              'transizione', format('Transizione flusso non ammessa: %s -> %s',
                               v_codice_da, v_codice_a)   
                          ),
                          NULL::uuid,
                          concat('Transizione flusso non ammessa: ', v_codice_da, ' -> ', v_codice_a)
                      );


                  END IF;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION pratiche.trgfn_flussi_guard_transizione()
              IS 'BEFORE UPDATE OF stato_id: blocca transizioni non ammesse per i flussi.';

              -- ── pratiche.trgfn_pratiche_guard_chiusura_flussi · PRATICHE_CHIUSURA_FLUSSI_APERTI, PRATICHE_CHIUSURA_FLUSSI_OBBLIGATORI_MANCANTI
              CREATE OR REPLACE FUNCTION pratiche.trgfn_pratiche_guard_chiusura_flussi()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_codice_a  config.stati_pratiche.codice_interno%TYPE;
                  v_bloccanti text;
                  v_aperti    text;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Blocca la transizione a CHIUSA se la pratica ha ancora lavoro:
                --   (a) flussi obbligatori non completati e ancora percorribili
                --       (fn_check_chiusura_pratica; ramo morto di un bivio non blocca), OPPURE
                --   (b) flussi ISTANZIATI in stato non terminale (fn_pratica_flussi_aperti, D1).
                --   Stesso predicato dell'auto-chiusura (fn_check_pratica_chiudibile).
                --   ANNULLATA non passa di qui (stato diverso da CHIUSA).
                -- =========================================================

                -- Nessuna transizione: niente da validare.
                IF OLD.stato_id = NEW.stato_id THEN
                    RETURN NEW;
                END IF;

                -- Solo verso CHIUSA.
                SELECT sp.codice_interno
                  INTO v_codice_a
                  FROM config.stati_pratiche sp
                 WHERE sp.id = NEW.stato_id;

                IF v_codice_a IS DISTINCT FROM 'CHIUSA' THEN
                    RETURN NEW;
                END IF;

                -- (a) Template bloccanti: obbligatori, non completati, percorribili.
                SELECT string_agg(c.codice, ', ' ORDER BY c.codice)
                  INTO v_bloccanti
                  FROM pratiche.fn_check_chiusura_pratica(NEW.id) c
                 WHERE c.bloccante;

                IF v_bloccanti IS NOT NULL THEN
                    PERFORM script.fn_log_and_raise_error(
                        'pratiche',
                        'pratiche.trgfn_pratiche_guard_chiusura_flussi',
                        'E_PRATICHE_CHIUSURA_FLUSSI_OBBLIGATORI_MANCANTI',
                        jsonb_build_object(
                            'pratica_id', NEW.id,
                            'flussi_bloccanti', v_bloccanti
                        ),
                        NULL::uuid,
                        v_bloccanti
                    );
                END IF;

                -- (b) D1: flussi istanziati ancora aperti (lavoro avviato pendente).
                SELECT string_agg(
                         COALESCE(a.codice, 'flusso#' || a.flusso_id) || ' (' || a.stato_codice_interno || ')',
                         ', ' ORDER BY COALESCE(a.codice, 'flusso#' || a.flusso_id)
                       )
                  INTO v_aperti
                  FROM pratiche.fn_pratica_flussi_aperti(NEW.id) a;

                IF v_aperti IS NOT NULL THEN
                    PERFORM script.fn_log_and_raise_error(
                        'pratiche',
                        'pratiche.trgfn_pratiche_guard_chiusura_flussi',
                        'E_PRATICHE_CHIUSURA_FLUSSI_APERTI',
                        jsonb_build_object(
                            'pratica_id', NEW.id,
                            'flussi_aperti', v_aperti
                        ),
                        NULL::uuid,
                        v_aperti
                    );
                END IF;

                RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION pratiche.trgfn_pratiche_guard_chiusura_flussi()
              IS 'BEFORE UPDATE OF stato_id: blocca la transizione a CHIUSA se restano (a) flussi obbligatori non completati ancora percorribili (fn_check_chiusura_pratica, err 485) o (b) flussi istanziati non terminali (fn_pratica_flussi_aperti, err 501, D1). Ramo morto di un bivio non blocca. Stesso predicato dell''auto-chiusura.';

              -- ── pratiche.trgfn_pratiche_guard_transizione · PRATICHE_TRANSIZIONE_NON_AMMESSA
              CREATE OR REPLACE FUNCTION pratiche.trgfn_pratiche_guard_transizione()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: blocca transizioni di stato non ammesse per le pratiche.
              -- Consulta la matrice config.transizioni_stati_pratiche (solo righe attive).
              -- Risolve i codici interni degli stati per messaggi di errore leggibili.
              DECLARE
                  v_codice_da config.stati_pratiche.codice_interno%TYPE;
                  v_codice_a  config.stati_pratiche.codice_interno%TYPE;
              BEGIN
                  -- Nessuna transizione: niente da validare
                  IF OLD.stato_id = NEW.stato_id THEN
                      RETURN NEW;
                  END IF;

                  -- Verifica che la transizione sia ammessa
                  IF NOT EXISTS (
                      SELECT 1 FROM config.transizioni_stati_pratiche
                      WHERE stato_da_id = OLD.stato_id
                        AND stato_a_id  = NEW.stato_id
                        AND attivo = true
                  ) THEN
                      SELECT codice_interno INTO v_codice_da
                      FROM config.stati_pratiche WHERE id = OLD.stato_id;

                      SELECT codice_interno INTO v_codice_a
                      FROM config.stati_pratiche WHERE id = NEW.stato_id;

                      PERFORM script.fn_log_and_raise_error(
                          'pratiche',
                          'pratiche.trgfn_pratiche_guard_transizione',
                          'E_PRATICHE_TRANSIZIONE_NON_AMMESSA',
                          jsonb_build_object(
                              'stato_da', v_codice_da,
                              'stato_a', v_codice_a
                          ),
                          NULL::uuid,
                          concat('Transizione pratica non ammessa: ', v_codice_da, ' -> ', v_codice_a)
                      );
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION pratiche.trgfn_pratiche_guard_transizione()
              IS 'BEFORE UPDATE OF stato_id: blocca transizioni non ammesse per le pratiche.';

              -- ── pratiche.trgfn_template_flussi_figli_guard_immutabile · TEMPLATE_DEFINIZIONE_CONGELATA
              CREATE OR REPLACE FUNCTION pratiche.trgfn_template_flussi_figli_guard_immutabile()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: immutabilita' strutturale «Leggera» dei figli (strategia C).
              --   INSERT/UPDATE vietati su edizione forkata emessa; DELETE vietato
              --   solo su pubblicata. La colonna FK verso template arriva in
              --   TG_ARGV[0]. Nessuna eccezione display sui figli.
              DECLARE
                v_rec   jsonb;
                v_tf_id pratiche.template_flussi.id%TYPE;
                v_def   pratiche.workflow_definizioni.id%TYPE;
                v_tx    uuid;
                v_bloccata boolean;
              BEGIN
                IF TG_OP = 'DELETE' THEN
                  v_rec := to_jsonb(OLD);
                ELSE
                  v_rec := to_jsonb(NEW);
                END IF;

                v_tf_id := (v_rec ->> TG_ARGV[0])::integer;
                -- FK non risolvibile: non e' compito di questo guard.
                IF v_tf_id IS NULL THEN
                  RETURN CASE WHEN TG_OP = 'DELETE' THEN OLD ELSE NEW END;
                END IF;

                SELECT tf.definizione_id
                  INTO v_def
                  FROM pratiche.template_flussi tf
                 WHERE tf.id = v_tf_id;

                -- DELETE -> solo PUBBLICATA (congelata); INSERT/UPDATE -> anche
                -- RITIRATA (struttura_bloccata).
                IF TG_OP = 'DELETE' THEN
                  v_bloccata := pratiche.fn_check_definizione_congelata(v_def);
                ELSE
                  v_bloccata := pratiche.fn_check_definizione_struttura_bloccata(v_def);
                END IF;

                IF v_bloccata THEN
                  v_tx := NULLIF(v_rec ->> 'tx_id', '')::uuid;
                  PERFORM script.fn_log_and_raise_error(
                    'pratiche',
                    'pratiche.trgfn_template_flussi_figli_guard_immutabile',
                    'E_TEMPLATE_DEFINIZIONE_CONGELATA',
                    jsonb_build_object(
                      'operazione',        TG_OP,
                      'tabella',           TG_TABLE_NAME,
                      'template_flusso_id', v_tf_id,
                      'definizione_id',     v_def
                    ),
                    v_tx,
                    v_def::text
                  );
                END IF;

                RETURN CASE WHEN TG_OP = 'DELETE' THEN OLD ELSE NEW END;
              END;
              $function$;

              COMMENT ON FUNCTION pratiche.trgfn_template_flussi_figli_guard_immutabile()
              IS 'Guard generico BEFORE INS/UPD/DEL sui figli di template_flussi (canali, handler_eventi, competenze, prerequisiti, formule_tempo, regole_generazione), strategia C: INSERT/UPDATE vietati su edizione forkata emessa (pubblicata o ritirata, fn_check_definizione_struttura_bloccata); DELETE vietato solo su pubblicata (fn_check_definizione_congelata) -> figli di RITIRATA cancellabili. FK verso template in TG_ARGV[0]. Errore TEMPLATE_DEFINIZIONE_CONGELATA (514).';

              -- ── pratiche.trgfn_template_flussi_guard_immutabile · TEMPLATE_DEFINIZIONE_CONGELATA
              CREATE OR REPLACE FUNCTION pratiche.trgfn_template_flussi_guard_immutabile()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: immutabilita' strutturale «Leggera» dei template (strategia C).
              --   INSERT/UPDATE vietati su edizione forkata emessa (pubblicata o
              --   ritirata); DELETE vietato solo su pubblicata (in uso). RITIRATA:
              --   non editabile ma cancellabile. descrizione sempre correggibile.
              --   Preset e BOZZA liberi.
              DECLARE
                v_old_bloccata boolean;
                v_new_bloccata boolean;
                v_def_report   pratiche.workflow_definizioni.id%TYPE;
              BEGIN
                IF TG_OP = 'DELETE' THEN
                  -- Cancellazione: vietata solo su edizione PUBBLICATA (in uso).
                  -- Una RITIRATA-emittente resta cancellabile (housekeeping).
                  IF pratiche.fn_check_definizione_congelata(OLD.definizione_id) THEN
                    PERFORM script.fn_log_and_raise_error(
                      'pratiche',
                      'pratiche.trgfn_template_flussi_guard_immutabile',
                      'E_TEMPLATE_DEFINIZIONE_CONGELATA',
                      jsonb_build_object(
                        'operazione',        'DELETE',
                        'tabella',           'template_flussi',
                        'template_flusso_id', OLD.id,
                        'codice',             OLD.codice,
                        'definizione_id',     OLD.definizione_id
                      ),
                      OLD.tx_id,
                      OLD.definizione_id::text
                    );
                  END IF;
                  RETURN OLD;

                ELSIF TG_OP = 'INSERT' THEN
                  -- Inserimento: vietato su edizione emessa (pubblicata o ritirata).
                  IF pratiche.fn_check_definizione_struttura_bloccata(NEW.definizione_id) THEN
                    PERFORM script.fn_log_and_raise_error(
                      'pratiche',
                      'pratiche.trgfn_template_flussi_guard_immutabile',
                      'E_TEMPLATE_DEFINIZIONE_CONGELATA',
                      jsonb_build_object(
                        'operazione',     'INSERT',
                        'tabella',        'template_flussi',
                        'codice',         NEW.codice,
                        'definizione_id', NEW.definizione_id
                      ),
                      NEW.tx_id,
                      NEW.definizione_id::text
                    );
                  END IF;
                  RETURN NEW;

                ELSE  -- UPDATE
                  v_old_bloccata := pratiche.fn_check_definizione_struttura_bloccata(OLD.definizione_id);
                  v_new_bloccata := pratiche.fn_check_definizione_struttura_bloccata(NEW.definizione_id);

                  -- Blocca se una delle due edizioni (origine/destinazione del
                  -- re-parent) e' emessa e cambia qualcosa oltre alla descrizione
                  -- (+ audit tecnici esclusi dal confronto).
                  IF (v_old_bloccata OR v_new_bloccata)
                     AND (to_jsonb(NEW) - 'descrizione' - 'tx_id'
                                        - 'data_insert' - 'user_insert'
                                        - 'data_update' - 'user_update')
                         IS DISTINCT FROM
                         (to_jsonb(OLD) - 'descrizione' - 'tx_id'
                                        - 'data_insert' - 'user_insert'
                                        - 'data_update' - 'user_update')
                  THEN
                    v_def_report := CASE WHEN v_old_bloccata
                                         THEN OLD.definizione_id
                                         ELSE NEW.definizione_id END;
                    PERFORM script.fn_log_and_raise_error(
                      'pratiche',
                      'pratiche.trgfn_template_flussi_guard_immutabile',
                      'E_TEMPLATE_DEFINIZIONE_CONGELATA',
                      jsonb_build_object(
                        'operazione',        'UPDATE',
                        'tabella',           'template_flussi',
                        'template_flusso_id', NEW.id,
                        'codice',             NEW.codice,
                        'definizione_id',     v_def_report
                      ),
                      NEW.tx_id,
                      v_def_report::text
                    );
                  END IF;
                  RETURN NEW;
                END IF;
              END;
              $function$;

              COMMENT ON FUNCTION pratiche.trgfn_template_flussi_guard_immutabile()
              IS 'BEFORE INS/UPD/DEL su pratiche.template_flussi: immutabilita'' strutturale «Leggera» strategia C. INSERT/UPDATE (oltre descrizione) vietati su edizione forkata emessa (pubblicata o ritirata, fn_check_definizione_struttura_bloccata); DELETE vietato solo su pubblicata (fn_check_definizione_congelata) -> RITIRATA cancellabile. Errore TEMPLATE_DEFINIZIONE_CONGELATA (514). Preset (emittente NULL) e BOZZA editabili.';

              -- ── pratiche.trgfn_workflow_definizioni_guard · DEFINIZIONE_PUBBLICATA_IMMUTABILE, DEFINIZIONE_TRANSIZIONE_NON_AMMESSA
              CREATE OR REPLACE FUNCTION pratiche.trgfn_workflow_definizioni_guard()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: proteggere il ciclo di vita dell'edizione di workflow.
              --   Inv A: transizioni di stato ammesse (BOZZA->PUBBLICATA,
              --          PUBBLICATA->RITIRATA).
              --   Inv B: header strutturale immutabile fuori da BOZZA.
              BEGIN
                -- Inv A: transizioni di stato.
                IF NEW.stato IS DISTINCT FROM OLD.stato THEN
                  IF NOT (
                       (OLD.stato = 'BOZZA'      AND NEW.stato = 'PUBBLICATA')
                    OR (OLD.stato = 'PUBBLICATA' AND NEW.stato = 'RITIRATA')
                  ) THEN
                    PERFORM script.fn_log_and_raise_error(
                      'pratiche',
                      'pratiche.trgfn_workflow_definizioni_guard',
                      'E_DEFINIZIONE_TRANSIZIONE_NON_AMMESSA',
                      jsonb_build_object(
                        'definizione_id', NEW.id,
                        'stato_da',       OLD.stato,
                        'stato_a',        NEW.stato
                      ),
                      NEW.tx_id,
                      OLD.stato,
                      NEW.stato
                    );
                  END IF;
                END IF;

                -- Inv B: header strutturale immutabile fuori da BOZZA.
                IF OLD.stato <> 'BOZZA' AND (
                       NEW.tipo_prestazione_id  IS DISTINCT FROM OLD.tipo_prestazione_id
                    OR NEW.emittente_fiscale_id IS DISTINCT FROM OLD.emittente_fiscale_id
                    OR NEW.versione             IS DISTINCT FROM OLD.versione
                    OR NEW.preset_origine_id    IS DISTINCT FROM OLD.preset_origine_id
                    OR NEW.versione_origine     IS DISTINCT FROM OLD.versione_origine
                ) THEN
                  PERFORM script.fn_log_and_raise_error(
                    'pratiche',
                    'pratiche.trgfn_workflow_definizioni_guard',
                    'E_DEFINIZIONE_PUBBLICATA_IMMUTABILE',
                    jsonb_build_object(
                      'definizione_id', NEW.id,
                      'stato',          OLD.stato
                    ),
                    NEW.tx_id,
                    NEW.id::text,
                    OLD.stato
                  );
                END IF;

                RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION pratiche.trgfn_workflow_definizioni_guard()
              IS 'BEFORE UPDATE OF stato/header su pratiche.workflow_definizioni: transizioni ammesse BOZZA->PUBBLICATA e PUBBLICATA->RITIRATA (510); header strutturale (tipo/emittente/versione/provenance) immutabile fuori da BOZZA (509). descrizione/meta sempre correggibili (fuori dall''evento UPDATE OF).';

              -- ── script.fn_clone_catasto_from_parent_by_istanza · ERRORE_PARAMETRI
              CREATE OR REPLACE FUNCTION script.fn_clone_catasto_from_parent_by_istanza(p_istanza_utilities_id bigint)
               RETURNS bigint
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_parent_istanza_id     anagrafiche.istanze_utilities.parent_istanza_id%TYPE;
                  v_curr_catasto_id       anagrafiche.istanze_utilities.catasto_unita_immobiliare_id%TYPE;
                  v_src                   anagrafiche.catasto_unita_immobiliari;
                  v_new_catasto_id        anagrafiche.catasto_unita_immobiliari.id%TYPE;
              BEGIN
                  -- Parametro obbligatorio
                  IF p_istanza_utilities_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          'script.fn_clone_catasto_from_parent_by_istanza',
                          'E_ERRORE_PARAMETRI',
                          jsonb_build_object('p_istanza_utilities_id', 'NULL'),
                          NULL,
                          'Parametro p_istanza_utilities_id non puo'' essere NULL'
                      );
                  END IF;

                  -- Lock riga istanza (anti race)
                  SELECT iu.parent_istanza_id,
                         iu.catasto_unita_immobiliare_id
                    INTO v_parent_istanza_id,
                         v_curr_catasto_id
                  FROM anagrafiche.istanze_utilities iu
                  WHERE iu.id = p_istanza_utilities_id
                  FOR UPDATE;

                  -- Idempotenza: istanza gia' agganciata a catasto
                  IF v_curr_catasto_id IS NOT NULL THEN
                      RETURN v_curr_catasto_id;
                  END IF;

                  -- Senza parent non c'e' sorgente da clonare
                  IF v_parent_istanza_id IS NULL THEN
                      RETURN NULL;
                  END IF;

                  -- Lookup sorgente basato su parent_istanza_id
                  SELECT *
                    INTO v_src
                  FROM script.fn_get_catasto_source_by_istanza(p_istanza_utilities_id);

                  -- Parent senza catasto: no-op (non blocca il flusso cliente/istanza)
                  IF v_src.id IS NULL THEN
                      RETURN NULL;
                  END IF;

                  -- Clone catasto
                  INSERT INTO anagrafiche.catasto_unita_immobiliari (
                      sezione_catastale,
                      foglio_catastale,
                      particella,
                      subalterno,
                      categoria_catastale,
                      classe_catastale,
                      rendita_catastale,
                      consistenza,
                      tipo_accatastamento,
                      immobile_rurale,
                      destinazione_immobile,
                      anno_protocollo,
                      superficie,
                      storicizza
                  )
                  VALUES (
                      v_src.sezione_catastale,
                      v_src.foglio_catastale,
                      v_src.particella,
                      v_src.subalterno,
                      v_src.categoria_catastale,
                      v_src.classe_catastale,
                      v_src.rendita_catastale,
                      v_src.consistenza,
                      v_src.tipo_accatastamento,
                      v_src.immobile_rurale,
                      v_src.destinazione_immobile,
                      v_src.anno_protocollo,
                      v_src.superficie,
                      COALESCE(v_src.storicizza, true)
                  )
                  RETURNING id INTO v_new_catasto_id;

                  -- Aggancio su istanza corrente
                  UPDATE anagrafiche.istanze_utilities iu
                     SET catasto_unita_immobiliare_id = v_new_catasto_id
                   WHERE iu.id = p_istanza_utilities_id
                     AND iu.catasto_unita_immobiliare_id IS NULL;

                  RETURN v_new_catasto_id;
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_clone_catasto_from_parent_by_istanza(p_istanza_utilities_id bigint)
              IS 'Clona il catasto dalla parent_istanza sulla istanza corrente. Se parent o sorgente non disponibili ritorna NULL senza errore.';

              -- ── script.fn_get_catasto_source_by_istanza · ERRORE_PARAMETRI
              CREATE OR REPLACE FUNCTION script.fn_get_catasto_source_by_istanza(p_istanza_utilities_id bigint)
               RETURNS anagrafiche.catasto_unita_immobiliari
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_parent_istanza_id anagrafiche.istanze_utilities.parent_istanza_id%TYPE;
                  v_catasto           anagrafiche.catasto_unita_immobiliari;
              BEGIN
                  -- ============================================================
                  -- Funzione: script.fn_get_catasto_source_by_istanza
                  --
                  -- Scopo:
                  --   - Recupera il record catastale "sorgente" da clonare
                  --     per una istanza_utilities (subentro).
                  --
                  -- Regola di individuazione sorgente:
                  --   - ESCLUSIVAMENTE tramite:
                  --       istanze_utilities.parent_istanza_id
                  --
                  -- Note di modellazione (post-refactor):
                  --   - Il legame ufficiale istanza -> catasto è:
                  --       istanze_utilities.catasto_unita_immobiliare_id
                  --   - La tabella catasto_unita_immobiliari NON contiene più
                  --     il riferimento all'istanza (rimossa istanza_utility_id).
                  --
                  -- Ritorna:
                  --   - record anagrafiche.catasto_unita_immobiliari (sorgente)
                  --   - NULL se non esiste parent o se la parent non ha catasto agganciato
                  --
                  -- Side effects:
                  --   - Nessuno (lookup puro).
                  -- ============================================================

                  IF p_istanza_utilities_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          'script.fn_get_catasto_source_by_istanza',
                          'E_ERRORE_PARAMETRI',
                          jsonb_build_object('p_istanza_utilities_id', 'NULL'),
                          NULL,
                          'Parametro p_istanza_utilities_id non può essere NULL'
                      );
                  END IF;

                  -- 1) Recupero parent_istanza_id
                  SELECT iu.parent_istanza_id
                  INTO v_parent_istanza_id
                  FROM anagrafiche.istanze_utilities iu
                  WHERE iu.id = p_istanza_utilities_id;

                  IF v_parent_istanza_id IS NULL THEN
                      RETURN NULL;
                  END IF;

                  -- 2) Recupero catasto agganciato alla parent istanza
                  SELECT c.*
                  INTO v_catasto
                  FROM anagrafiche.istanze_utilities iu_parent
                  JOIN anagrafiche.catasto_unita_immobiliari c
                  ON c.id = iu_parent.catasto_unita_immobiliare_id
                  WHERE iu_parent.id = v_parent_istanza_id
                  LIMIT 1;

                  IF NOT FOUND THEN
                      RETURN NULL;
                  END IF;

                  RETURN v_catasto;
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_get_catasto_source_by_istanza(p_istanza_utilities_id bigint)
              IS 'Recupera il record catastale "sorgente" da clonare per una istanza_utilities.
                La sorgente è determinata ESCLUSIVAMENTE da:
                istanze_utilities.parent_istanza_id';

              -- ── script.fn_get_parameter_full · ERRORE_PARAMETRI_TABELLA
              CREATE OR REPLACE FUNCTION script.fn_get_parameter_full(p_code text, p_emittente_fiscale_id bigint DEFAULT NULL::bigint, p_django_user_id integer DEFAULT NULL::integer, p_group_ids integer[] DEFAULT NULL::integer[], p_session_key text DEFAULT NULL::text, p_function_name text DEFAULT NULL::text, p_categoria_cliente_id smallint DEFAULT NULL::smallint)
               RETURNS text
               LANGUAGE plpgsql
               STABLE
              AS $function$
              -- Cascata: user -> categoria_cliente -> group -> emittente -> session -> function -> default.
              -- p_categoria_cliente_id e' l'ultimo parametro per backward compatibility:
              -- i caller posizionali a 6 arg usano l'overload precedente senza modifiche.
              -- Ogni subquery usa NULL-equality: se il param di scope e' NULL, la WHERE
              -- restituisce 0 righe e quel livello viene saltato naturalmente.
              -- p_group_ids resta integer[] esplicito: %TYPE[] non e' sintassi valida in PG.
              DECLARE
                  v_param_id  config.parameters.id%TYPE;
                  v_default   config.parameters.default_value%TYPE;
                  v_result    config.parameter_overrides.overridden_value%TYPE;
              BEGIN
                  SELECT id, default_value
                    INTO v_param_id, v_default
                    FROM config.parameters
                   WHERE code = p_code;

                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          'fn_get_parameter_full',
                          'E_ERRORE_PARAMETRI_TABELLA',
                          jsonb_build_object(
                              'codice_parametro', p_code,
                              'nome_tabella',      'config.parameters'
                          ),
                          NULL::uuid,
                          'config.parameters',
                          p_code::text
                      );
                  END IF;

                  SELECT COALESCE(
                      -- 1. user (massima priorita')
                      (SELECT po.overridden_value
                         FROM config.parameter_overrides po
                        WHERE po.parameter_id    = v_param_id
                          AND po.django_user_id  = p_django_user_id
                          AND po.attivo          = true
                        LIMIT 1),
                      -- 2. categoria_cliente (NUOVO: vince su group/emittente)
                      (SELECT po.overridden_value
                         FROM config.parameter_overrides po
                        WHERE po.parameter_id         = v_param_id
                          AND po.categoria_cliente_id = p_categoria_cliente_id
                          AND po.attivo               = true
                        LIMIT 1),
                      -- 3. group
                      (SELECT po.overridden_value
                         FROM config.parameter_overrides po
                        WHERE po.parameter_id    = v_param_id
                          AND po.django_group_id = ANY(p_group_ids)
                          AND po.attivo          = true
                        ORDER BY po.id
                        LIMIT 1),
                      -- 4. emittente
                      (SELECT po.overridden_value
                         FROM config.parameter_overrides po
                        WHERE po.parameter_id          = v_param_id
                          AND po.emittente_fiscale_id  = p_emittente_fiscale_id
                          AND po.attivo                = true
                        LIMIT 1),
                      -- 5. session
                      (SELECT po.overridden_value
                         FROM config.parameter_overrides po
                        WHERE po.parameter_id  = v_param_id
                          AND po.session_key   = p_session_key
                          AND po.attivo        = true
                        LIMIT 1),
                      -- 6. function
                      (SELECT po.overridden_value
                         FROM config.parameter_overrides po
                        WHERE po.parameter_id  = v_param_id
                          AND po.function_name = p_function_name
                          AND po.attivo        = true
                        LIMIT 1),
                      -- 7. default
                      v_default
                  ) INTO v_result;

                  RETURN v_result;
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_get_parameter_full(p_code text, p_emittente_fiscale_id bigint, p_django_user_id integer, p_group_ids integer[], p_session_key text, p_function_name text, p_categoria_cliente_id smallint)
              IS 'Cascata 7 livelli: user -> categoria_cliente -> group -> emittente -> session -> function -> default. p_categoria_cliente_id (smallint, ultimo param) abilita il livello categoria cliente; a NULL il livello si salta da solo (NULL-equality). p_group_ids integer[] esplicito (%%TYPE[] non valido in PG). Usa config.parameter_overrides filtrato su attivo=TRUE. ⚠️ FIRMA UNICA, e deve restare tale: fino al 2026-07-27 conviveva un overload a 6 argomenti e, avendo entrambe i DEFAULT su tutti i parametri tranne il primo, OGNI chiamata con meno di 7 argomenti era ambigua — cast compreso. Due chiamanti erano rotti a runtime (ai_assistant/tool_registry.py con 1 arg, script.fn_get_default_by_param con 6). Per aggiungere un livello alla cascata NON creare un nuovo overload "backward compatible": si ricade nello stesso difetto. Estendere questa firma con un parametro opzionale in coda e aggiornare i chiamanti. rev 2026-07-27.';

              -- ── script.fn_guard_utility_tipo_ruolo · ERRORE_PARAMETRI
              CREATE OR REPLACE FUNCTION script.fn_guard_utility_tipo_ruolo(p_utility_id integer, p_tipo_ruolo_id integer, p_context text DEFAULT NULL::text)
               RETURNS void
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_has_matrix BOOLEAN := false;
                  v_is_allowed BOOLEAN := false;
              BEGIN
                  -- Guard: parametri obbligatori e > 0
                  IF p_utility_id IS NULL OR p_utility_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          'script.fn_guard_utility_tipo_ruolo',
                          'E_ERRORE_PARAMETRI',
                          jsonb_build_object(
                              'detail', 'p_utility_id obbligatorio e > 0',
                              'p_utility_id', p_utility_id,
                              'context', p_context
                          ),
                          NULL::uuid,
                          concat('p_utility_id non valido: ', p_utility_id::text, ' context: ', p_context)
                      );
                  END IF;

                  IF p_tipo_ruolo_id IS NULL OR p_tipo_ruolo_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          'script.fn_guard_utility_tipo_ruolo',
                          'E_ERRORE_PARAMETRI',
                          jsonb_build_object(
                              'detail', 'p_tipo_ruolo_id obbligatorio e > 0',
                              'p_tipo_ruolo_id', p_tipo_ruolo_id,
                              'context', p_context
                          ),
                          NULL::uuid,
                          concat('p_tipo_ruolo_id non valido: ', p_tipo_ruolo_id::text, ' context: ', p_context)
                      );
                  END IF;

                  -- NOTA: le due query EXISTS sulla matrice hanno condizioni
                  -- identiche tranne tipo_ruolo_id. Scelta progettuale: si
                  -- mantengono separate per rendere esplicito il pattern a 2 step
                  -- (1: la matrice esiste? → fail-open se no; 2: il ruolo e'
                  -- ammesso? → fail-close se no). Unificarle in una sola query
                  -- con FILTER peggiorerebbe la leggibilita' senza beneficio
                  -- prestazionale (tabella config con poche righe).

                  -- 1) Esiste matrice attiva/valida per utility?
                  SELECT EXISTS (
                      SELECT 1
                        FROM config.utilities_tipi_ruolo m
                       WHERE m.utility_id = p_utility_id
                         AND m.attivo = true
                         AND (m.valido_dal IS NULL OR m.valido_dal <= CURRENT_DATE)
                         AND (m.valido_al IS NULL OR m.valido_al >= CURRENT_DATE)
                  )
                  INTO v_has_matrix;

                  -- Fail-open: nessuna regola attiva/valida → nessun vincolo
                  IF NOT v_has_matrix THEN
                      RETURN;
                  END IF;

                  -- 2) Matrice presente: il ruolo deve essere esplicitamente ammesso
                  SELECT EXISTS (
                      SELECT 1
                        FROM config.utilities_tipi_ruolo m
                       WHERE m.utility_id = p_utility_id
                         AND m.tipo_ruolo_id = p_tipo_ruolo_id
                         AND m.attivo = true
                         AND (m.valido_dal IS NULL OR m.valido_dal <= CURRENT_DATE)
                         AND (m.valido_al IS NULL OR m.valido_al >= CURRENT_DATE)
                  )
                  INTO v_is_allowed;

                  IF NOT v_is_allowed THEN
                      -- Fix: E_GENERICO → E_UTILITY_RUOLO_NON_AMMESSO
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          'script.fn_guard_utility_tipo_ruolo',
                          'E_UTILITY_RUOLO_NON_AMMESSO',
                          jsonb_build_object(
                              'utility_id', p_utility_id,
                              'tipo_ruolo_id', p_tipo_ruolo_id,
                              'context', p_context
                          ),
                          NULL::uuid,
                          p_tipo_ruolo_id::text,
                          p_utility_id::text
                      );
                  END IF;
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_guard_utility_tipo_ruolo(p_utility_id integer, p_tipo_ruolo_id integer, p_context text)
              IS 'Guard utility→tipo_ruolo: fail-open se matrice assente; fail-close se presente e ruolo non ammesso. Errore: E_UTILITY_RUOLO_NON_AMMESSO.';

              -- ── script.fn_subentro_cliente · ERRORE_PARAMETRI
              CREATE OR REPLACE FUNCTION script.fn_subentro_cliente(p_pdp_id bigint, p_data_attivazione date)
               RETURNS bigint
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  --v_cliente_precedente_id bigint;
                  --v_stato_chiuso_id       integer;
                  --v_codice_chiuso         text := 'CH';
                  v_cliente_precedente_id anagrafiche.clienti.id%TYPE;
                  v_stato_chiuso_id       config.stati_cliente.id%TYPE;
                  v_codice_chiuso         config.stati_cliente.codice_interno%TYPE := 'CH';  

              BEGIN
              -- ------------------------------------------------------------
              -- Funzione: script.fn_subentro_cliente
              --
              -- Scopo:
              --   - Dato un PDP e una data di attivazione del nuovo cliente,
              --     chiude (se esiste) il cliente precedente su quel PDP
              --     per evitare overlap del periodo commerciale.
              --
              --   - Logica:
              --       * Cerca il cliente più recente su p_pdp_id con:
              --           - stato_cliente.codice_interno <> 'AN'
              --           - data_attivazione NOT NULL
              --           - data_attivazione < p_data_attivazione
              --           - data_chiusura IS NULL oppure >= p_data_attivazione
              --       * Se trovato:
              --           - imposta data_chiusura = p_data_attivazione - 1 giorno
              --           - imposta stato_cliente a 'CH'
              --         (il trigger trg_clienti_set_periodo normalizzerà periodo)
              --
              --   - Ritorna:
              --       * id del cliente chiuso
              --       * NULL se nessun cliente da chiudere (primo cliente sul PDP)
              --
              -- NOTE:
              --   - Non crea la nuova istanza né il nuovo cliente: questo
              --     viene fatto dal frontend / servizio applicativo subito dopo.
              --   - Va tipicamente chiamata in transazione:
              --       1) SELECT script.fn_subentro_cliente(...)
              --       2) INSERT nuovo cliente sullo stesso PDP
              --     in modo da rispettare il vincolo ex_clienti_no_overlap_stesso_pdp.
              -- ------------------------------------------------------------



                  ----------------------------------------------------------------
                  -- Validazioni minime parametri
                  ----------------------------------------------------------------
                  IF p_pdp_id IS NULL THEN

                       PERFORM script.fn_log_and_raise_error(
                                        'database',
                                        'script.fn_subentro_cliente',
                                        'E_ERRORE_PARAMETRI',
                                        jsonb_build_object(
                                            'p_pdp_id non può essere NULL', 
                                            'indicare un valore valido'  
                                        ),
                                        NULL,
                                        'Non è stato fornito un valore per pdp_id'
                                    );
                  END IF;

                  IF p_data_attivazione IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                                        'database',
                                        'script.fn_subentro_cliente',
                                        'E_ERRORE_PARAMETRI',
                                        jsonb_build_object(
                                            'fn_subentro_cliente: p_data_attivazione non può essere NULL', 
                                            'indicare un valore valido'  
                                        ),
                                        NULL,
                                        'Non è stato fornito un valore per data_attivazione'
                                    );
                  END IF;

                  ----------------------------------------------------------------
                  -- Recupero ID stato_cliente "CH" (Chiuso)
                  ----------------------------------------------------------------
                  SELECT sc.id
                    INTO v_stato_chiuso_id
                  FROM config.stati_cliente sc
                  WHERE sc.codice_interno = v_codice_chiuso
                  LIMIT 1;

                  IF v_stato_chiuso_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                                        'database',
                                        'script.fn_subentro_cliente',
                                        'E_ERRORE_PARAMETRI',
                                        jsonb_build_object(
                                                'codice id_cliente',
                                                v_codice_chiuso
                                        ),
                                        NULL,
                                        'stato_cliente con id_cliente' || v_codice_chiuso::text || ' non trovato'
                                    );               
                  END IF;

                  ----------------------------------------------------------------
                  -- Seleziono il cliente precedente da chiudere:
                  --   - stesso PDP
                  --   - non ANNULLATO
                  --   - con data_attivazione < nuova data attivazione
                  --   - con periodo ancora “aperto” rispetto alla nuova data
                  --   - prendo il più recente (data_attivazione DESC, id DESC)
                  ----------------------------------------------------------------
                  SELECT c.id
                    INTO v_cliente_precedente_id
                  FROM anagrafiche.clienti c
                  JOIN config.stati_cliente sc
                       ON sc.id = c.stato_cliente_id
                  WHERE c.pdp_id = p_pdp_id
                    AND sc.codice_interno <> 'AN'
                    AND c.data_attivazione IS NOT NULL
                    AND c.data_attivazione < p_data_attivazione
                    AND (c.data_chiusura IS NULL OR c.data_chiusura >= p_data_attivazione)
                  ORDER BY c.data_attivazione DESC,
                           c.id DESC
                  FOR UPDATE
                  LIMIT 1;

                  ----------------------------------------------------------------
                  -- Se non c'è nessun cliente da chiudere → primo cliente sul PDP
                  ----------------------------------------------------------------
                  IF v_cliente_precedente_id IS NULL THEN
                      RETURN NULL;
                  END IF;

                  ----------------------------------------------------------------
                  -- Chiusura del cliente precedente:
                  --   - data_chiusura = p_data_attivazione - 1 giorno
                  --   - stato_cliente  = CH
                  --
                  -- I trigger sulla tabella clienti si occupano di:
                  --   - normalizzare periodo (trg_clienti_set_periodo)
                  --   - aggiornare storico, stato PDP, ecc.
                  ----------------------------------------------------------------
                  UPDATE anagrafiche.clienti c
                     SET data_chiusura   = p_data_attivazione - INTERVAL '1 day',
                         stato_cliente_id = v_stato_chiuso_id
                   WHERE c.id = v_cliente_precedente_id;

                  RETURN v_cliente_precedente_id;
              END;
              $function$;

              -- ── script.trgfn_delete_block_by_guc · ERRORE_PARAMETRI
              CREATE OR REPLACE FUNCTION script.trgfn_delete_block_by_guc()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              BEGIN
                  -- Guard: argomento trigger obbligatorio
                  IF TG_NARGS < 1 THEN
                      PERFORM script.fn_log_and_raise_error(
                          TG_TABLE_SCHEMA,
                          TG_NAME,
                          'E_ERRORE_PARAMETRI',
                          jsonb_build_object(
                              'detail', 'Argomenti trigger mancanti',
                              'expected', 'guc_key',
                              'found', TG_NARGS
                          ),
                          NULL::uuid,
                          concat('TG_ARGV[0] (guc_key) mancante per trigger ', TG_NAME)
                      );
                  END IF;

                  -- Se la GUC e' abilitata → consente DELETE
                  IF current_setting(TG_ARGV[0], true) = 'on' THEN
                      RETURN OLD;
                  END IF;

                  -- Delete bloccata da policy
                  PERFORM script.fn_log_and_raise_error(
                      TG_TABLE_SCHEMA,
                      TG_NAME,
                      'E_DELETE_NOT_ALLOWED',
                      jsonb_build_object(
                          'table', TG_TABLE_SCHEMA || '.' || TG_TABLE_NAME,
                          'id', OLD.id
                      ),
                      NULL::uuid,
                      TG_TABLE_SCHEMA || '.' || TG_TABLE_NAME,
                      OLD.id::text
                  );

                  RETURN OLD;
              END;
              $function$;

              COMMENT ON FUNCTION script.trgfn_delete_block_by_guc()
              IS 'Blocca DELETE se GUC non abilitata. Errori: ERRORE_PARAMETRI, E_DELETE_NOT_ALLOWED.';

              -- ── script.trgfn_guard_utility_tipo_ruolo_by_cols · ERRORE_PARAMETRI
              CREATE OR REPLACE FUNCTION script.trgfn_guard_utility_tipo_ruolo_by_cols()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_utility_col        TEXT;
                  v_soggetto_ruolo_col TEXT;
                  v_utility_txt        TEXT;
                  v_soggetto_ruolo_txt TEXT;
                  v_utility_id         config.utilities.id%TYPE;
                  v_soggetto_ruolo_id  anagrafiche.soggetti_ruoli.id%TYPE;
                  v_tipo_ruolo_id      config.tipi_ruoli.id%TYPE;
              BEGIN
                  -- Guard: argomenti trigger
                  IF TG_NARGS <> 2 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          'script.trgfn_guard_utility_tipo_ruolo_by_cols',
                          'E_ERRORE_PARAMETRI',
                          jsonb_build_object(
                              'detail', 'Sono richiesti 2 argomenti trigger: utility_col, soggetto_ruolo_col',
                              'tg_nargs', TG_NARGS,
                              'trigger', TG_NAME
                          ),
                          NULL::uuid,
                          concat('Argomenti trigger non validi per ', TG_NAME, ': TG_NARGS=', TG_NARGS::text)
                      );
                  END IF;

                  v_utility_col := TG_ARGV[0];
                  v_soggetto_ruolo_col := TG_ARGV[1];

                  -- Estrai valori dal record NEW via jsonb
                  v_utility_txt := to_jsonb(NEW) ->> v_utility_col;
                  v_soggetto_ruolo_txt := to_jsonb(NEW) ->> v_soggetto_ruolo_col;

                  -- Se i valori non sono presenti non forziamo il controllo
                  IF v_utility_txt IS NULL OR v_soggetto_ruolo_txt IS NULL THEN
                      RETURN NEW;
                  END IF;

                  -- Cast a tipi numerici
                  BEGIN
                      v_utility_id := v_utility_txt::integer;
                      v_soggetto_ruolo_id := v_soggetto_ruolo_txt::bigint;
                  EXCEPTION
                      WHEN OTHERS THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database',
                              'script.trgfn_guard_utility_tipo_ruolo_by_cols',
                              'E_ERRORE_PARAMETRI',
                              jsonb_build_object(
                                  'detail', 'Valori colonna non castabili a ID',
                                  'utility_col', v_utility_col,
                                  'utility_value', v_utility_txt,
                                  'soggetto_ruolo_col', v_soggetto_ruolo_col,
                                  'soggetto_ruolo_value', v_soggetto_ruolo_txt
                              ),
                              NULL::uuid,
                              concat(
                                  'Valori non validi per guard utility/tipo_ruolo: ',
                                  v_utility_col, '=', coalesce(v_utility_txt, 'NULL'),
                                  ', ',
                                  v_soggetto_ruolo_col, '=', coalesce(v_soggetto_ruolo_txt, 'NULL')
                              )
                          );
                  END;

                  -- Recupera tipo_ruolo_id dal soggetto_ruolo
                  SELECT sr.tipo_ruolo_id
                    INTO v_tipo_ruolo_id
                    FROM anagrafiche.soggetti_ruoli sr
                   WHERE sr.id = v_soggetto_ruolo_id;

                  IF v_tipo_ruolo_id IS NULL THEN
                      -- Fix: E_GENERICO → E_CODICE
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          'script.trgfn_guard_utility_tipo_ruolo_by_cols',
                          'E_CODICE',
                          jsonb_build_object(
                              'soggetto_ruolo_id', v_soggetto_ruolo_id,
                              'table', concat(TG_TABLE_SCHEMA, '.', TG_TABLE_NAME)
                          ),
                          NULL::uuid,
                          v_soggetto_ruolo_id::text, 'anagrafiche.soggetti_ruoli'
                      );
                  END IF;

                  -- Delega validazione utility ↔ tipo_ruolo
                  PERFORM script.fn_guard_utility_tipo_ruolo(
                      p_utility_id    => v_utility_id,
                      p_tipo_ruolo_id => v_tipo_ruolo_id,
                      p_context       => concat(TG_TABLE_SCHEMA, '.', TG_TABLE_NAME, ' ', TG_OP)
                  );

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION script.trgfn_guard_utility_tipo_ruolo_by_cols()
              IS 'Trigger guard generico utility→tipo_ruolo: legge utility/soggetto_ruolo da TG_ARGV e valida con fn_guard_utility_tipo_ruolo.';

              -- ── vendite.fn_documento_lineage · ERRORE_PARAMETRI
              CREATE OR REPLACE FUNCTION vendite.fn_documento_lineage(p_tipo_id bigint, p_uid text, p_direzione text DEFAULT 'avanti'::text)
               RETURNS TABLE(livello integer, ordine integer, arco text, ruolo character varying, from_tipo_id bigint, from_uid text, from_codice text, to_tipo_id bigint, to_uid text, to_codice text, to_stato_codice_interno character varying, to_fase character varying, to_is_abortito boolean, is_ramo_inverso boolean)
               LANGUAGE plpgsql
               STABLE
              AS $function$
              BEGIN
                  -- Guard parametri (AGENTS: ID numerici NOT NULL e > 0).
                  IF p_tipo_id IS NULL OR p_tipo_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'vendite.fn_documento_lineage', 'E_ERRORE_PARAMETRI',
                          jsonb_build_object('detail', 'p_tipo_id obbligatorio e > 0',
                                             'p_tipo_id', p_tipo_id),
                          NULL::uuid,
                          concat('p_tipo_id non valido: ', COALESCE(p_tipo_id::text, 'NULL')));
                  END IF;

                  IF p_uid IS NULL OR btrim(p_uid) = '' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'vendite.fn_documento_lineage', 'E_ERRORE_PARAMETRI',
                          jsonb_build_object('detail', 'p_uid obbligatorio (chiave nodo)'),
                          NULL::uuid,
                          'p_uid non valido (NULL o vuoto)');
                  END IF;

                  IF p_direzione IS NULL OR p_direzione NOT IN ('avanti', 'indietro') THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'vendite.fn_documento_lineage', 'E_ERRORE_PARAMETRI',
                          jsonb_build_object('detail', 'p_direzione deve essere avanti|indietro',
                                             'p_direzione', p_direzione),
                          NULL::uuid,
                          concat('p_direzione non valido: ', COALESCE(p_direzione, 'NULL')));
                  END IF;

                  RETURN QUERY
                  WITH RECURSIVE trav AS (
                      -- Livello 1: archi adiacenti al nodo di partenza nella direzione scelta.
                      SELECT a.from_tipo_id, a.from_uid, a.from_codice,
                             a.to_tipo_id, a.to_uid, a.to_codice,
                             a.to_stato_codice_interno, a.to_fase, a.to_is_abortito,
                             a.ruolo, a.arco,
                             1 AS livello,
                             CASE WHEN p_direzione = 'avanti' THEN a.to_tipo_id ELSE a.from_tipo_id END AS cur_tipo,
                             CASE WHEN p_direzione = 'avanti' THEN a.to_uid    ELSE a.from_uid    END AS cur_uid,
                             ARRAY[
                                 p_tipo_id::text || ':' || p_uid,
                                 (CASE WHEN p_direzione = 'avanti' THEN a.to_tipo_id ELSE a.from_tipo_id END)::text
                                     || ':' ||
                                 (CASE WHEN p_direzione = 'avanti' THEN a.to_uid ELSE a.from_uid END)
                             ] AS visited
                        FROM vendite.vw_documento_lineage_archi a
                       WHERE (p_direzione = 'avanti'   AND a.from_tipo_id = p_tipo_id AND a.from_uid = p_uid)
                          OR (p_direzione = 'indietro' AND a.to_tipo_id   = p_tipo_id AND a.to_uid   = p_uid)
                      UNION ALL
                      -- Espansione: dal nodo corrente segui gli archi nella stessa direzione.
                      SELECT a.from_tipo_id, a.from_uid, a.from_codice,
                             a.to_tipo_id, a.to_uid, a.to_codice,
                             a.to_stato_codice_interno, a.to_fase, a.to_is_abortito,
                             a.ruolo, a.arco,
                             t.livello + 1,
                             CASE WHEN p_direzione = 'avanti' THEN a.to_tipo_id ELSE a.from_tipo_id END,
                             CASE WHEN p_direzione = 'avanti' THEN a.to_uid    ELSE a.from_uid    END,
                             t.visited || (
                                 (CASE WHEN p_direzione = 'avanti' THEN a.to_tipo_id ELSE a.from_tipo_id END)::text
                                     || ':' ||
                                 (CASE WHEN p_direzione = 'avanti' THEN a.to_uid ELSE a.from_uid END)
                             )
                        FROM trav t
                        JOIN vendite.vw_documento_lineage_archi a
                          ON (p_direzione = 'avanti'   AND a.from_tipo_id = t.cur_tipo AND a.from_uid = t.cur_uid)
                          OR (p_direzione = 'indietro' AND a.to_tipo_id   = t.cur_tipo AND a.to_uid   = t.cur_uid)
                       WHERE t.livello < 10
                         AND NOT (
                             (CASE WHEN p_direzione = 'avanti' THEN a.to_tipo_id ELSE a.from_tipo_id END)::text
                                 || ':' ||
                             (CASE WHEN p_direzione = 'avanti' THEN a.to_uid ELSE a.from_uid END)
                         ) = ANY (t.visited)
                  )
                  -- Cast espliciti al tipo dichiarato dalla RETURNS TABLE: la union di
                  -- vw_documento_lineage_nodi.codice risolve a varchar, quindi from_codice/
                  -- to_codice arrivano varchar mentre la firma li vuole text (PG e' rigido
                  -- sul match esatto, SQLSTATE 42804).
                  SELECT t.livello::integer,
                         (ROW_NUMBER() OVER (ORDER BY t.livello,
                                                      t.from_tipo_id, t.from_uid,
                                                      t.to_tipo_id, t.to_uid))::integer AS ordine,
                         t.arco::text, t.ruolo::varchar,
                         t.from_tipo_id, t.from_uid::text, t.from_codice::text,
                         t.to_tipo_id, t.to_uid::text, t.to_codice::text,
                         t.to_stato_codice_interno::varchar, t.to_fase::varchar, t.to_is_abortito,
                         (t.arco = 'R') AS is_ramo_inverso
                    FROM trav t
                   ORDER BY ordine;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_documento_lineage(p_tipo_id bigint, p_uid text, p_direzione text)
              IS 'Lineage documenti vendite (Step 4): traversal ricorsivo del grafo genealogia (vw_documento_lineage_archi) dal nodo (tipo,uid) in direzione avanti|indietro, per il pannello Passaggi. Ritorna gli archi con livello/ordine + stato/fase target; is_ramo_inverso marca l''arco R (DDT->Reso). SECURITY INVOKER (RLS emittente del chiamante).';

      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Rollback ai 26 codici senza prefisso: restano a catalogo
              -- (ritirati), quindi i messaggi si risolvono comunque.
              CREATE OR REPLACE FUNCTION dbops.trgfn_tx_id_managed()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_bypass_enabled BOOLEAN := FALSE;
                  v_session_tx_id     UUID;
                  v_new_tx_id      UUID;
              BEGIN
                  -- =========================================================
                  -- USCITA ANTICIPATA (rev 2026-07-24,
                  -- brief-db-tx-id-uscita-anticipata.md).
                  -- Se il chiamante ha gia' valorizzato il tx_id non c'e' niente
                  -- da gestire: tutto il corpo sottostante serve solo a calcolare
                  -- v_new_tx_id, che e' consumato unicamente dalla COALESCE finale
                  -- -- raggiunta solo quando NEW.tx_id IS NULL. Prima questi due
                  -- blocchi stavano in fondo: la funzione faceva il giro completo
                  -- (lettura di config.parameters + rami su script.*) per poi
                  -- restituire NEW invariato.
                  -- Due effetti: il trigger, installato su 280 tabelle, smette di
                  -- pagare lavoro inutile; e la sessione remota del canale di log
                  -- -- che fornisce sempre il proprio tx_id e ha grant sul solo
                  -- schema dbops -- non chiede piu' permessi su config e script.
                  --
                  -- ORDINE VINCOLANTE: la normalizzazione DEVE precedere l'uscita,
                  -- altrimenti un tx_id "stringa vuota" sfuggirebbe. Per una
                  -- colonna UUID e' di fatto irraggiungibile, ma resta dov'era
                  -- nella logica: spostato, non rimosso.
                  -- =========================================================
                  IF NEW.tx_id IS NOT NULL AND NEW.tx_id::text = '' THEN
                    NEW.tx_id := NULL;
                  END IF;

                  IF NEW.tx_id IS NOT NULL THEN
                    RETURN NEW;
                  END IF;

                  BEGIN
                      SELECT default_value::BOOLEAN
                        INTO v_bypass_enabled
                        FROM config.parameters
                      WHERE code = 'tx_id_bypass_enabled';

                      IF NOT FOUND THEN

                          PERFORM script.fn_log_error_only(
                              'database',
                              'dbops.trgfn_tx_id_managed',
                              'ERRORE_PARAMETRI_TABELLA',
                              jsonb_build_object(
                                  'codice_parametro', 'tx_id_bypass_enabled',
                                  'nome_tabella',      'config.parameters',
                                  'action', 'default bypass=false'
                              ),
                                NULL::uuid,
                                'tx_id_bypass_enabled',
                                'config.parameters'
                            );
                      END IF;

                  EXCEPTION WHEN OTHERS THEN

                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          'dbops.trgfn_tx_id_managed',
                          'E_SQL_READ_TABLE',
                          jsonb_build_object(
                            'parameter', 'tx_id_bypass_enabled',
                            'error', SQLERRM
                          ),
                          NULL::uuid,
                          TG_TABLE_NAME::text,
                          SQLERRM::text
                      );

                      RAISE;
                  END;

                  IF NOT v_bypass_enabled THEN
                      BEGIN
                          v_bypass_enabled := current_setting('myapp.bypass_tx_id_check', TRUE)::BOOLEAN;
                      EXCEPTION WHEN OTHERS THEN

                          NULL;
                      END;
                  END IF;

                  BEGIN
                      v_session_tx_id := current_setting('dbops.tx_id', TRUE)::UUID;
                  EXCEPTION WHEN OTHERS THEN
                      v_session_tx_id := NULL;
                  END;

                  IF v_bypass_enabled THEN

                      v_new_tx_id := COALESCE(v_session_tx_id, script.uuid_nil());

                  ELSE
                      IF v_session_tx_id IS NOT NULL THEN

                          PERFORM 1
                            FROM dbops.transaction_ids
                          WHERE id = v_session_tx_id;
                          IF FOUND THEN
                              v_new_tx_id := v_session_tx_id;

                          ELSE
                              -- Caso C) id di sessione non presente nel registro.
                              -- AVVERTE e prosegue con la sentinella: e' il comportamento che
                              -- la guida descrive ("logga WARNING e assegna nil") e che il
                              -- prefisso W_ promette. Prima qui si sollevava, quindi la riga
                              -- uuid_nil() sotto era irraggiungibile e un id non registrato
                              -- bloccava ogni scrittura tracciata.
                              -- Vedi brief-db-coerenza-tx-id-non-registrato.md §4.2.
                              -- NB dal 2026-07-24: questo ramo non viene piu' raggiunto dalle
                              -- righe che portano gia' il proprio tx_id (uscita anticipata in
                              -- testa). Resta la diagnosi di sessione: qualunque altra
                              -- scrittura che lasci il tx_id vuoto la fa scattare lo stesso.
                              PERFORM script.fn_log_error_only(
                                  'database',
                                  'dbops.trgfn_tx_id_managed',
                                  'W_TXID_NOT_REGISTERED',
                                  jsonb_build_object( 'tx_id', v_session_tx_id ),
                                  NULL::uuid,
                                  VARIADIC ARRAY[]::text[]
                              );
                              v_new_tx_id := script.uuid_nil();

                          END IF;

                      ELSE

                          BEGIN

                            v_new_tx_id := dbops.fn_get_or_create_session_tx_id();

                          EXCEPTION WHEN OTHERS THEN

                              PERFORM script.fn_log_and_raise_error(
                                  'database',
                                  'dbops.trgfn_tx_id_managed',
                                  'E_TXID_GENERATION',
                                  jsonb_build_object(
                                    'error', SQLERRM
                                  ) ,
                                  NULL::uuid,
                                  VARIADIC ARRAY[]::text[]
                              );
                              v_new_tx_id := script.uuid_nil();
                          END;
                      END IF;
                  END IF;

                  -- Qui si arriva solo con NEW.tx_id NULL (vedi uscita in testa).
                  NEW.tx_id := COALESCE(
                      NULLIF(current_setting('dbops.tx_id', true), '')::uuid,
                      v_new_tx_id,
                      uuidv7()
                  );
                RETURN NEW;

              END;
              $function$;

              CREATE OR REPLACE FUNCTION pratiche.fn_fork_definizione(p_definizione_id integer, p_emittente_fiscale_id bigint)
               RETURNS integer
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'pratiche', 'script', 'config', 'dbops', 'pg_temp'
              AS $function$
              -- Scopo: creare l'edizione di un emittente da una definizione (di
              --        solito il preset), in BOZZA, con provenance per il drift.
              --        SECURITY DEFINER: la DML interna (via fn_copia) gira come owner.
              DECLARE
                v_tipo_id pratiche.workflow_definizioni.tipo_prestazione_id%TYPE;
              BEGIN
                IF p_emittente_fiscale_id IS NULL OR p_emittente_fiscale_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'pratiche', 'pratiche.fn_fork_definizione', 'E_PARAMETRO_INVALIDO',
                    jsonb_build_object('parametro','p_emittente_fiscale_id',
                                       'valore',p_emittente_fiscale_id),
                    NULL::uuid,
                    'il fork richiede un emittente valido; per una nuova versione dello stesso scope usare fn_nuova_versione_definizione');
                END IF;

                -- Scope destinazione = tipo della sorgente + emittente. Se la
                -- sorgente non esiste, il guard bozza si salta e fn_copia solleva
                -- E_VALORE_MANCANTE.
                SELECT wd.tipo_prestazione_id INTO v_tipo_id
                  FROM pratiche.workflow_definizioni wd
                 WHERE wd.id = p_definizione_id;

                IF v_tipo_id IS NOT NULL AND EXISTS (
                     SELECT 1 FROM pratiche.workflow_definizioni wd
                      WHERE wd.tipo_prestazione_id  = v_tipo_id
                        AND wd.emittente_fiscale_id IS NOT DISTINCT FROM p_emittente_fiscale_id
                        AND wd.stato = 'BOZZA'
                   ) THEN
                  PERFORM script.fn_log_and_raise_error(
                    'pratiche', 'pratiche.fn_fork_definizione', 'DEFINIZIONE_BOZZA_ESISTENTE',
                    jsonb_build_object('tipo_prestazione_id', v_tipo_id,
                                       'emittente_fiscale_id', p_emittente_fiscale_id),
                    NULL::uuid,
                    v_tipo_id::text,
                    p_emittente_fiscale_id::text);
                END IF;

                RETURN pratiche.fn_copia_definizione(p_definizione_id, p_emittente_fiscale_id, true);
              END;
              $function$;

              CREATE OR REPLACE FUNCTION pratiche.fn_guard_prerequisiti_flusso(p_pratica_id bigint, p_template_flusso_id integer)
               RETURNS void
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_non_soddisfatti text;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Guard fail-fast (fn_guard_*): solleva errore se esistono
                --   prerequisiti non soddisfatti per il template flusso.
                --
                -- Dipendenze:
                --   - pratiche.fn_check_prerequisiti_flusso()
                --   - script.fn_log_and_raise_error()
                --   - config.messaggi_errore: PRATICHE_PREREQUISITI_NON_SODDISFATTI
                -- =========================================================

                -- Raccoglie i codici dei prerequisiti non soddisfatti
                SELECT string_agg(codice, ', ')
                  INTO v_non_soddisfatti
                  FROM pratiche.fn_check_prerequisiti_flusso(p_pratica_id, p_template_flusso_id)
                 WHERE NOT soddisfatto;

                IF v_non_soddisfatti IS NOT NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database',
                    'fn_guard_prerequisiti_flusso',
                    'PRATICHE_PREREQUISITI_NON_SODDISFATTI',
                    jsonb_build_object(
                      'pratica_id', p_pratica_id,
                      'template_flusso_id', p_template_flusso_id,
                      'prerequisiti_mancanti', v_non_soddisfatti
                    ),
                    NULL::uuid,
                    v_non_soddisfatti
                  );
                END IF;
              END;
              $function$;

              CREATE OR REPLACE FUNCTION pratiche.fn_guard_ripetibilita_flusso(p_pratica_id bigint, p_template_flusso_id integer)
               RETURNS void
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_codice         pratiche.template_flussi.codice%TYPE;
                  v_ripetibilita   pratiche.template_flussi.ripetibilita%TYPE;
                  v_ultimo_stato   config.stati_flussi_pratiche.codice_interno%TYPE;
                  v_ultimo_esito   pratiche.flussi.esito%TYPE;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Guard fail-fast (fn_guard_*): solleva errore se la
                --   regola di ripetibilita' del template vieta una nuova
                --   istanza nella pratica.
                --
                -- Dipendenze:
                --   - pratiche.fn_check_ripetibilita_flusso()
                --   - script.fn_log_and_raise_error()
                --   - config.messaggi_errore: PRATICHE_FLUSSO_NON_RIPETIBILE
                -- =========================================================

                IF pratiche.fn_check_ripetibilita_flusso(p_pratica_id, p_template_flusso_id) THEN
                  RETURN;
                END IF;

                -- Contesto per il messaggio: regola + ultima istanza valida.
                SELECT tf.codice, tf.ripetibilita
                  INTO v_codice, v_ripetibilita
                  FROM pratiche.template_flussi tf
                 WHERE tf.id = p_template_flusso_id;

                SELECT sfp.codice_interno, f.esito
                  INTO v_ultimo_stato, v_ultimo_esito
                  FROM pratiche.flussi f
                  JOIN config.stati_flussi_pratiche sfp ON sfp.id = f.stato_id
                 WHERE f.pratica_id         = p_pratica_id
                   AND f.template_flusso_id = p_template_flusso_id
                   AND sfp.codice_interno  <> 'ANNULLATO'
                 ORDER BY f.id DESC
                 LIMIT 1;

                PERFORM script.fn_log_and_raise_error(
                  'pratiche',
                  'pratiche.fn_guard_ripetibilita_flusso',
                  'PRATICHE_FLUSSO_NON_RIPETIBILE',
                  jsonb_build_object(
                    'pratica_id', p_pratica_id,
                    'template_flusso_id', p_template_flusso_id,
                    'template_codice', v_codice,
                    'ripetibilita', v_ripetibilita,
                    'ultima_istanza_stato', v_ultimo_stato,
                    'ultima_istanza_esito', v_ultimo_esito
                  ),
                  NULL::uuid,
                  coalesce(v_codice, p_template_flusso_id::text),
                  coalesce(v_ripetibilita, '?'),
                  concat(coalesce(v_ultimo_stato, '?'),
                         coalesce('/' || v_ultimo_esito, ''))
                );
              END;
              $function$;

              CREATE OR REPLACE FUNCTION pratiche.fn_lista_pratiche_per_contesto(p_emittente_fiscale_id bigint, p_soggetto_ruolo_id bigint DEFAULT NULL::bigint, p_istanza_utility_id bigint DEFAULT NULL::bigint, p_solo_interne boolean DEFAULT false)
               RETURNS TABLE(pratica_id bigint, codice text, descrizione text, contesto text, tipo_prestazione_codice character varying, stato_codice character varying, priorita_codice character varying, soggetto_id uuid, soggetto_ragione_sociale text, soggetto_ruolo_id bigint, istanza_utility_id bigint, risorsa_umana_id bigint, unita_organizzativa_id integer, data_apertura date, data_scadenza date)
               LANGUAGE plpgsql
               STABLE
              AS $function$
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Lista pratiche per contesto anagrafico — lente canonica
                --   D1. Tre lenti mutuamente alternative (ruolo / istanza /
                --   interne); nessuna lente = tutte le pratiche
                --   dell'emittente. Bucket "contesto" calcolato per il
                --   raggruppamento FE: RUOLO / ISTANZA / SOGGETTO / INTERNA.
                -- =========================================================

                -- Guard: emittente obbligatorio (segregazione multi-company).
                IF p_emittente_fiscale_id IS NULL OR p_emittente_fiscale_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'pratiche',
                    'pratiche.fn_lista_pratiche_per_contesto',
                    'E_PARAMETRO_INVALIDO',
                    jsonb_build_object('parametro', 'p_emittente_fiscale_id',
                                       'valore', p_emittente_fiscale_id),
                    NULL::uuid,
                    'p_emittente_fiscale_id obbligatorio e > 0'
                  );
                END IF;

                -- Guard: lenti mutuamente alternative (al massimo una).
                IF (p_soggetto_ruolo_id IS NOT NULL)::int
                   + (p_istanza_utility_id IS NOT NULL)::int
                   + p_solo_interne::int > 1 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'pratiche',
                    'pratiche.fn_lista_pratiche_per_contesto',
                    'PRATICHE_LISTA_CONTESTO_PARAMETRI_ESCLUSIVI',
                    jsonb_build_object(
                      'soggetto_ruolo_id', p_soggetto_ruolo_id,
                      'istanza_utility_id', p_istanza_utility_id,
                      'solo_interne', p_solo_interne
                    ),
                    NULL::uuid,
                    VARIADIC ARRAY[]::text[]
                  );
                END IF;

                RETURN QUERY
                SELECT
                  p.id,
                  p.codice,
                  p.descrizione,
                  -- Bucket canonico del contesto (D1): un solo valore per pratica.
                  CASE
                    WHEN p.soggetto_ruolo_id IS NOT NULL THEN 'RUOLO'
                    WHEN p.istanza_utility_id IS NOT NULL THEN 'ISTANZA'
                    WHEN p.soggetto_id IS NOT NULL THEN 'SOGGETTO'
                    ELSE 'INTERNA'
                  END,
                  tp.codice,
                  sp.codice_interno,
                  pp.codice_interno,
                  p.soggetto_id,
                  sog.ragione_sociale_completa,
                  p.soggetto_ruolo_id,
                  p.istanza_utility_id,
                  p.risorsa_umana_id,
                  p.unita_organizzativa_id,
                  p.data_apertura,
                  p.data_scadenza
                FROM pratiche.pratiche p
                JOIN pratiche.tipi_prestazione tp ON tp.id = p.tipo_prestazione_id
                JOIN config.stati_pratiche sp     ON sp.id = p.stato_id
                JOIN config.priorita_pratiche pp  ON pp.id = p.priorita_id
                LEFT JOIN anagrafiche.soggetti sog ON sog.id = p.soggetto_id
                WHERE p.emittente_fiscale_id = p_emittente_fiscale_id
                  -- Lente ruolo: pratiche del ruolo soggetto indicato.
                  AND (p_soggetto_ruolo_id IS NULL
                       OR p.soggetto_ruolo_id = p_soggetto_ruolo_id)
                  -- Lente istanza: pratiche dell'istanza utility indicata.
                  AND (p_istanza_utility_id IS NULL
                       OR p.istanza_utility_id = p_istanza_utility_id)
                  -- Lente interne: nessun contesto cliente (soggetto NULL;
                  -- il guard contesto garantisce ruolo/istanza NULL a cascata).
                  AND (NOT p_solo_interne OR p.soggetto_id IS NULL)
                ORDER BY
                  pp.sequenza DESC,
                  p.data_scadenza NULLS LAST,
                  p.id;
              END;
              $function$;

              CREATE OR REPLACE FUNCTION pratiche.fn_nuova_versione_definizione(p_definizione_id integer)
               RETURNS integer
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'pratiche', 'script', 'config', 'dbops', 'pg_temp'
              AS $function$
              -- Scopo: creare una nuova versione BOZZA nello stesso scope, derivata
              --        dalla PUBBLICATA corrente. Per modificare in sicurezza
              --        un'edizione gia' pubblicata. SECURITY DEFINER.
              DECLARE
                v_tipo_id   pratiche.workflow_definizioni.tipo_prestazione_id%TYPE;
                v_emittente pratiche.workflow_definizioni.emittente_fiscale_id%TYPE;
                v_stato     pratiche.workflow_definizioni.stato%TYPE;
                v_found     boolean;
              BEGIN
                SELECT wd.tipo_prestazione_id, wd.emittente_fiscale_id, wd.stato, true
                  INTO v_tipo_id, v_emittente, v_stato, v_found
                  FROM pratiche.workflow_definizioni wd
                 WHERE wd.id = p_definizione_id;

                IF v_found IS NOT TRUE THEN
                  PERFORM script.fn_log_and_raise_error(
                    'pratiche', 'pratiche.fn_nuova_versione_definizione', 'E_VALORE_MANCANTE',
                    jsonb_build_object('definizione_sorgente_id', p_definizione_id),
                    NULL::uuid, concat('workflow_definizioni id ', p_definizione_id));
                END IF;

                -- (1) La nuova versione si deriva SOLO da una PUBBLICATA.
                IF v_stato <> 'PUBBLICATA' THEN
                  PERFORM script.fn_log_and_raise_error(
                    'pratiche', 'pratiche.fn_nuova_versione_definizione', 'DEFINIZIONE_NO_PUBBLICATA',
                    jsonb_build_object('definizione_id', p_definizione_id, 'stato', v_stato),
                    NULL::uuid, p_definizione_id::text);
                END IF;

                -- (2) Invariante ≤1 BOZZA per scope.
                IF EXISTS (
                     SELECT 1 FROM pratiche.workflow_definizioni wd
                      WHERE wd.tipo_prestazione_id  = v_tipo_id
                        AND wd.emittente_fiscale_id IS NOT DISTINCT FROM v_emittente
                        AND wd.stato = 'BOZZA'
                   ) THEN
                  PERFORM script.fn_log_and_raise_error(
                    'pratiche', 'pratiche.fn_nuova_versione_definizione', 'DEFINIZIONE_BOZZA_ESISTENTE',
                    jsonb_build_object('tipo_prestazione_id', v_tipo_id,
                                       'emittente_fiscale_id', v_emittente),
                    NULL::uuid,
                    v_tipo_id::text,
                    COALESCE(v_emittente::text, 'preset'));
                END IF;

                RETURN pratiche.fn_copia_definizione(p_definizione_id, v_emittente, false);
              END;
              $function$;

              CREATE OR REPLACE FUNCTION pratiche.fn_prendi_in_carico_flusso(p_flusso_id bigint, p_risorsa_umana_id bigint)
               RETURNS boolean
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: assegnare un flusso DA_ESEGUIRE all'operatore corrente,
              --        applicando la policy di eligibilita' reparto-first +
              --        competenza opzionale (design assegnazione-flusso §2.2).
              -- Regole:
              --   1. Il flusso deve esistere
              --   2. Stato DA_ESEGUIRE
              --   3. Non gia' assegnato ad altro operatore
              --   4. Eligibilita' (casi A/B/C/D, vedi sotto)
              -- Risultato: true se assegnato, false se gia' assegnato allo stesso operatore.
              -- Nota: SELECT ... FOR UPDATE per evitare race condition.
              DECLARE
                  v_stato_id          pratiche.flussi.stato_id%TYPE;
                  v_risorsa_attuale   pratiche.flussi.risorsa_umana_id%TYPE;
                  v_template_id       pratiche.flussi.template_flusso_id%TYPE;
                  v_unita_org         pratiche.flussi.unita_organizzativa_id%TYPE;
                  v_da_eseguire_id    config.stati_flussi_pratiche.id%TYPE;
                  v_has_skill_lock    BOOLEAN;
                  v_competente        BOOLEAN;
                  v_reparto_operatore anagrafiche.risorse_umane.unita_organizzativa_id%TYPE;
                  v_righe_aggiornate  INTEGER;
              BEGIN
                  -- Guard: parametri obbligatori
                  IF p_flusso_id IS NULL OR p_flusso_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'pratiche', 'pratiche.fn_prendi_in_carico_flusso',
                          'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('p_flusso_id', p_flusso_id),
                          NULL::uuid, 'p_flusso_id'
                      );
                  END IF;

                  IF p_risorsa_umana_id IS NULL OR p_risorsa_umana_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'pratiche', 'pratiche.fn_prendi_in_carico_flusso',
                          'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('p_risorsa_umana_id', p_risorsa_umana_id),
                          NULL::uuid, 'p_risorsa_umana_id'
                      );
                  END IF;

                  -- Recupera stato + routing del flusso CON LOCK (FOR UPDATE)
                  SELECT f.stato_id, f.risorsa_umana_id, f.template_flusso_id, f.unita_organizzativa_id
                    INTO v_stato_id, v_risorsa_attuale, v_template_id, v_unita_org
                    FROM pratiche.flussi f
                   WHERE f.id = p_flusso_id
                     FOR UPDATE;

                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'pratiche', 'pratiche.fn_prendi_in_carico_flusso',
                          'E_VALORE_MANCANTE',
                          jsonb_build_object('flusso_id', p_flusso_id),
                          NULL::uuid, concat('flusso_id ', p_flusso_id)
                      );
                  END IF;

                  -- Verifica stato DA_ESEGUIRE
                  SELECT id INTO v_da_eseguire_id
                    FROM config.stati_flussi_pratiche
                   WHERE codice_interno = 'DA_ESEGUIRE';

                  IF v_stato_id <> v_da_eseguire_id THEN
                      PERFORM script.fn_log_and_raise_error(
                          'pratiche', 'pratiche.fn_prendi_in_carico_flusso',
                          'FLUSSI_PRESA_CARICO_STATO_ERRATO',
                          jsonb_build_object('flusso_id', p_flusso_id, 'stato_id', v_stato_id, 'stato_richiesto', v_da_eseguire_id),
                          NULL::uuid, p_flusso_id::text
                      );
                  END IF;

                  -- Gia' assegnato allo stesso operatore: noop
                  IF v_risorsa_attuale = p_risorsa_umana_id THEN
                      RETURN FALSE;
                  END IF;

                  -- Gia' assegnato ad altro operatore: errore
                  IF v_risorsa_attuale IS NOT NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'pratiche', 'pratiche.fn_prendi_in_carico_flusso',
                          'FLUSSI_GIA_ASSEGNATO',
                          jsonb_build_object('flusso_id', p_flusso_id, 'risorsa_attuale', v_risorsa_attuale, 'risorsa_richiedente', p_risorsa_umana_id),
                          NULL::uuid, p_flusso_id::text, v_risorsa_attuale::text
                      );
                  END IF;

                  -- ============================================================
                  -- Eligibilita' (policy reparto-first + competenza opzionale)
                  -- ============================================================
                  -- skill-lock: la matrice competenze e' configurata (attiva) per il template
                  v_has_skill_lock := (v_template_id IS NOT NULL) AND EXISTS (
                      SELECT 1 FROM pratiche.competenze_flussi cf
                       WHERE cf.template_flusso_id = v_template_id
                         AND cf.attivo = true
                  );

                  IF v_has_skill_lock THEN
                      -- Casi A/D: serve competenza ATTIVA dell'operatore
                      SELECT EXISTS (
                          SELECT 1 FROM pratiche.competenze_flussi cf
                           WHERE cf.template_flusso_id = v_template_id
                             AND cf.risorsa_umana_id = p_risorsa_umana_id
                             AND cf.attivo = true
                      ) INTO v_competente;

                      IF NOT v_competente THEN
                          PERFORM script.fn_log_and_raise_error(
                              'pratiche', 'pratiche.fn_prendi_in_carico_flusso',
                              'FLUSSI_COMPETENZA_MANCANTE',
                              jsonb_build_object('flusso_id', p_flusso_id, 'template_flusso_id', v_template_id, 'risorsa_umana_id', p_risorsa_umana_id),
                              NULL::uuid, p_flusso_id::text, p_risorsa_umana_id::text
                          );
                      END IF;

                  ELSIF v_unita_org IS NOT NULL THEN
                      -- Caso B: niente skill-lock ma reparto valorizzato -> serve
                      -- appartenenza al reparto ANAGRAFICO dell'operatore
                      SELECT unita_organizzativa_id INTO v_reparto_operatore
                        FROM anagrafiche.risorse_umane
                       WHERE id = p_risorsa_umana_id;

                      IF v_reparto_operatore IS NULL OR v_reparto_operatore <> v_unita_org THEN
                          PERFORM script.fn_log_and_raise_error(
                              'pratiche', 'pratiche.fn_prendi_in_carico_flusso',
                              'FLUSSI_PRESA_NON_ELIGIBILE',
                              jsonb_build_object(
                                  'flusso_id', p_flusso_id,
                                  'unita_organizzativa_flusso', v_unita_org,
                                  'unita_organizzativa_operatore', v_reparto_operatore,
                                  'risorsa_umana_id', p_risorsa_umana_id
                              ),
                              NULL::uuid, p_flusso_id::text, p_risorsa_umana_id::text
                          );
                      END IF;

                  -- ELSE: Caso C (niente reparto, niente skill-lock) -> presa libera
                  END IF;

                  -- Assegna il flusso e verifica risultato
                  UPDATE pratiche.flussi
                     SET risorsa_umana_id = p_risorsa_umana_id
                   WHERE id = p_flusso_id;

                  GET DIAGNOSTICS v_righe_aggiornate = ROW_COUNT;

                  IF v_righe_aggiornate <> 1 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'pratiche', 'pratiche.fn_prendi_in_carico_flusso',
                          'E_QUERY_FAILED',
                          jsonb_build_object('flusso_id', p_flusso_id),
                          NULL::uuid, 'pratiche', 'flussi', 'UPDATE'
                      );
                  END IF;

                  RETURN TRUE;
              END;
              $function$;

              CREATE OR REPLACE FUNCTION pratiche.fn_pubblica_definizione(p_definizione_id integer)
               RETURNS integer
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'pratiche', 'script', 'config', 'dbops', 'pg_temp'
              AS $function$
              -- Scopo: validare e pubblicare una BOZZA, ritirando la precedente
              --        PUBBLICATA dello stesso scope (atomico).
              -- SECURITY DEFINER: gli UPDATE su workflow_definizioni girano come owner.
              DECLARE
                v_tipo_id   pratiche.workflow_definizioni.tipo_prestazione_id%TYPE;
                v_emittente pratiche.workflow_definizioni.emittente_fiscale_id%TYPE;
                v_stato     pratiche.workflow_definizioni.stato%TYPE;
                v_n_attivi  integer;
                v_has_cycle boolean;
              BEGIN
                IF p_definizione_id IS NULL OR p_definizione_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'pratiche', 'pratiche.fn_pubblica_definizione', 'E_PARAMETRO_INVALIDO',
                    jsonb_build_object('parametro','p_definizione_id','valore',p_definizione_id),
                    NULL::uuid, 'p_definizione_id obbligatorio e > 0');
                END IF;

                SELECT wd.tipo_prestazione_id, wd.emittente_fiscale_id, wd.stato
                  INTO v_tipo_id, v_emittente, v_stato
                  FROM pratiche.workflow_definizioni wd
                 WHERE wd.id = p_definizione_id;
                IF NOT FOUND THEN
                  PERFORM script.fn_log_and_raise_error(
                    'pratiche', 'pratiche.fn_pubblica_definizione', 'E_VALORE_MANCANTE',
                    jsonb_build_object('definizione_id', p_definizione_id),
                    NULL::uuid, concat('workflow_definizioni id ', p_definizione_id));
                END IF;

                -- (a) deve essere in BOZZA.
                IF v_stato <> 'BOZZA' THEN
                  PERFORM script.fn_log_and_raise_error(
                    'pratiche', 'pratiche.fn_pubblica_definizione', 'DEFINIZIONE_NON_PUBBLICABILE',
                    jsonb_build_object('definizione_id', p_definizione_id, 'stato', v_stato),
                    NULL::uuid, p_definizione_id::text,
                    concat('non e'' in BOZZA (stato ', v_stato, ')'));
                END IF;

                -- (b) almeno uno step attivo.
                SELECT count(*) INTO v_n_attivi
                  FROM pratiche.template_flussi tf
                 WHERE tf.definizione_id = p_definizione_id AND tf.attivo;
                IF v_n_attivi = 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'pratiche', 'pratiche.fn_pubblica_definizione', 'DEFINIZIONE_NON_PUBBLICABILE',
                    jsonb_build_object('definizione_id', p_definizione_id),
                    NULL::uuid, p_definizione_id::text, 'nessuno step attivo nella definizione');
                END IF;

                -- (c) nessun ciclo nel grafo dei prerequisiti (chiusura transitiva).
                WITH RECURSIVE closure(start_node, cur) AS (
                  SELECT p.template_flusso_id, p.prerequisito_id
                    FROM pratiche.template_flussi_prerequisiti p
                    JOIN pratiche.template_flussi t
                         ON t.id = p.template_flusso_id AND t.definizione_id = p_definizione_id
                  UNION
                  SELECT c.start_node, p.prerequisito_id
                    FROM closure c
                    JOIN pratiche.template_flussi_prerequisiti p ON p.template_flusso_id = c.cur
                    JOIN pratiche.template_flussi t
                         ON t.id = p.template_flusso_id AND t.definizione_id = p_definizione_id
                )
                SELECT EXISTS (SELECT 1 FROM closure WHERE start_node = cur) INTO v_has_cycle;
                IF v_has_cycle THEN
                  PERFORM script.fn_log_and_raise_error(
                    'pratiche', 'pratiche.fn_pubblica_definizione', 'DEFINIZIONE_NON_PUBBLICABILE',
                    jsonb_build_object('definizione_id', p_definizione_id),
                    NULL::uuid, p_definizione_id::text, 'ciclo nel grafo dei prerequisiti');
                END IF;

                -- Ritira la precedente PUBBLICATA dello scope, poi pubblica.
                UPDATE pratiche.workflow_definizioni
                   SET stato = 'RITIRATA'
                 WHERE tipo_prestazione_id = v_tipo_id
                   AND emittente_fiscale_id IS NOT DISTINCT FROM v_emittente
                   AND stato = 'PUBBLICATA';

                UPDATE pratiche.workflow_definizioni
                   SET stato = 'PUBBLICATA'
                 WHERE id = p_definizione_id;

                RETURN p_definizione_id;
              END;
              $function$;

              CREATE OR REPLACE FUNCTION pratiche.fn_risolvi_definizione(p_tipo_prestazione_id integer, p_emittente_fiscale_id bigint DEFAULT NULL::bigint)
               RETURNS integer
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: risolve l'edizione di workflow da pinnare/usare per un
              --        tipo prestazione e uno scope emittente:
              --        1) PUBBLICATA dell'emittente; 2) preset PUBBLICATA;
              --        3) errore parlante 507. Un solo punto di risoluzione
              --        (usato da auto-pin pratiche e auto-default template).
              DECLARE
                v_definizione_id pratiche.workflow_definizioni.id%TYPE;
              BEGIN
                -- Guard esplicito sul parametro id (no normalizzazione silenziosa).
                IF p_tipo_prestazione_id IS NULL OR p_tipo_prestazione_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'pratiche',
                    'pratiche.fn_risolvi_definizione',
                    'DEFINIZIONE_NON_TROVATA',
                    jsonb_build_object(
                      'motivo',               'parametro_tipo_invalido',
                      'tipo_prestazione_id',  p_tipo_prestazione_id,
                      'emittente_fiscale_id', p_emittente_fiscale_id
                    ),
                    NULL::uuid,
                    COALESCE(p_tipo_prestazione_id::text, 'NULL'),
                    COALESCE(p_emittente_fiscale_id::text, 'preset')
                  );
                END IF;

                -- 1) Edizione pubblicata dell'emittente (fork — da Fase 2).
                IF p_emittente_fiscale_id IS NOT NULL THEN
                  SELECT wd.id INTO v_definizione_id
                    FROM pratiche.workflow_definizioni wd
                   WHERE wd.tipo_prestazione_id  = p_tipo_prestazione_id
                     AND wd.emittente_fiscale_id = p_emittente_fiscale_id
                     AND wd.stato = 'PUBBLICATA';
                  IF FOUND THEN
                    RETURN v_definizione_id;
                  END IF;
                END IF;

                -- 2) Preset pubblicato (emittente NULL).
                SELECT wd.id INTO v_definizione_id
                  FROM pratiche.workflow_definizioni wd
                 WHERE wd.tipo_prestazione_id = p_tipo_prestazione_id
                   AND wd.emittente_fiscale_id IS NULL
                   AND wd.stato = 'PUBBLICATA';
                IF FOUND THEN
                  RETURN v_definizione_id;
                END IF;

                -- 3) Nessuna edizione risolvibile: errore parlante.
                PERFORM script.fn_log_and_raise_error(
                  'pratiche',
                  'pratiche.fn_risolvi_definizione',
                  'DEFINIZIONE_NON_TROVATA',
                  jsonb_build_object(
                    'motivo',               'nessuna_pubblicata',
                    'tipo_prestazione_id',  p_tipo_prestazione_id,
                    'emittente_fiscale_id', p_emittente_fiscale_id
                  ),
                  NULL::uuid,
                  p_tipo_prestazione_id::text,
                  COALESCE(p_emittente_fiscale_id::text, 'preset')
                );
                RETURN NULL; -- irraggiungibile (la fn sopra solleva)
              END;
              $function$;

              CREATE OR REPLACE FUNCTION pratiche.trgfn_flussi_guard_chiusura_prematura()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: il flusso "di chiusura" (template.chiude_pratica) chiude la
              --   pratica: non puo' essere completato finche' la pratica non e'
              --   chiudibile (fn_check_pratica_chiudibile) ESCLUDENDO se stesso
              --   (template dai bloccanti, istanza dai flussi aperti). Coerente col guard
              --   di chiusura della pratica; evita che l'auto-chiusura conseguente fallisca.
              -- Regole:
              --   1. Scatta solo alla transizione di stato verso COMPLETATO.
              --   2. Solo se il template del flusso e' chiude_pratica.
              --   3. fn_check_pratica_chiudibile escludendo il template (bloccanti) e
              --      l'istanza (flussi aperti) del flusso di chiusura stesso: se false
              --      -> errore parlante.
              DECLARE
                  v_completato_id config.stati_flussi_pratiche.id%TYPE;
                  v_e_chiusura    boolean;
              BEGIN
                  -- (1) Solo verso COMPLETATO, e solo a stato realmente cambiato.
                  SELECT id INTO v_completato_id
                    FROM config.stati_flussi_pratiche
                   WHERE codice_interno = 'COMPLETATO';

                  IF NEW.stato_id IS DISTINCT FROM v_completato_id
                     OR OLD.stato_id = NEW.stato_id THEN
                      RETURN NEW;
                  END IF;

                  -- (2) Solo flussi da template "di chiusura".
                  IF NEW.template_flusso_id IS NULL THEN
                      RETURN NEW;
                  END IF;

                  SELECT tf.chiude_pratica INTO v_e_chiusura
                    FROM pratiche.template_flussi tf
                   WHERE tf.id = NEW.template_flusso_id;

                  IF NOT COALESCE(v_e_chiusura, false) THEN
                      RETURN NEW;
                  END IF;

                  -- (3) Ammesso solo se la pratica e' chiudibile escludendo SE STESSO
                  --     (template dai bloccanti + istanza NEW.id dai flussi aperti, D1).
                  IF NOT pratiche.fn_check_pratica_chiudibile(NEW.pratica_id, NEW.template_flusso_id, NEW.id) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'pratiche',
                          'pratiche.trgfn_flussi_guard_chiusura_prematura',
                          'PRATICHE_CHIUSURA_FLUSSO_PREMATURO',
                          jsonb_build_object(
                              'pratica_id', NEW.pratica_id,
                              'flusso_id', NEW.id,
                              'template_flusso_id', NEW.template_flusso_id
                          ),
                          NEW.tx_id,
                          NEW.id::text
                      );
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              CREATE OR REPLACE FUNCTION pratiche.trgfn_flussi_guard_definizione()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: un flusso appartiene a una pratica; il suo template deve
              --        stare nella STESSA edizione di workflow che la pratica ha
              --        pinnato alla nascita. Difesa a DB della coerenza pin<->step.
              DECLARE
                v_pratica_definizione_id  pratiche.pratiche.definizione_id%TYPE;
                v_template_definizione_id pratiche.template_flussi.definizione_id%TYPE;
                v_template_codice         pratiche.template_flussi.codice%TYPE;
              BEGIN
                SELECT p.definizione_id
                  INTO v_pratica_definizione_id
                  FROM pratiche.pratiche p
                 WHERE p.id = NEW.pratica_id;

                SELECT tf.definizione_id, tf.codice
                  INTO v_template_definizione_id, v_template_codice
                  FROM pratiche.template_flussi tf
                 WHERE tf.id = NEW.template_flusso_id;

                IF v_template_definizione_id IS DISTINCT FROM v_pratica_definizione_id THEN
                  PERFORM script.fn_log_and_raise_error(
                    'pratiche',
                    'pratiche.trgfn_flussi_guard_definizione',
                    'FLUSSI_TEMPLATE_FUORI_DEFINIZIONE',
                    jsonb_build_object(
                      'flusso_pratica_id',       NEW.pratica_id,
                      'template_flusso_id',      NEW.template_flusso_id,
                      'template_codice',         v_template_codice,
                      'template_definizione_id', v_template_definizione_id,
                      'pratica_definizione_id',  v_pratica_definizione_id
                    ),
                    NEW.tx_id,
                    COALESCE(v_template_codice, NEW.template_flusso_id::text),
                    COALESCE(v_pratica_definizione_id::text, 'NULL'),
                    NEW.pratica_id::text
                  );
                END IF;

                RETURN NEW;
              END;
              $function$;

              CREATE OR REPLACE FUNCTION pratiche.trgfn_flussi_guard_esito_classe()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: al completamento di un flusso la CLASSE dell'esito deve
              --        corrispondere alla modalita_esito del template:
              --          DOMINIO     => esito di ramo (is_verdetto = false);
              --          non-DOMINIO => verdetto      (is_verdetto = true).
              --        Difesa in profondita' autoritativa: vale per qualunque
              --        percorso di scrittura (BE di dominio, generico, SQL).
              -- Regole:
              --   1. Scoped alla TRANSIZIONE verso COMPLETATO: le righe gia'
              --      completate (legacy PRA-0000243) restano toccabili.
              --   2. Esito NULL a COMPLETATO -> competenza del guard 477.
              --   3. Flusso senza template -> classe verdetto (come il BE, che
              --      tratta il template assente come MANUALE).
              DECLARE
                v_modalita        pratiche.template_flussi.modalita_esito%TYPE;
                v_template_codice pratiche.template_flussi.codice%TYPE;
                v_is_verdetto     config.esiti_flussi_pratiche.is_verdetto%TYPE;
              BEGIN
                -- (1) Solo la transizione di completamento. L'evento e' UPDATE OF
                -- stato_id: si esclude lo "stato riscritto identico" (no transizione).
                IF TG_OP = 'UPDATE' AND OLD.stato_id = NEW.stato_id THEN
                  RETURN NEW;
                END IF;

                -- (2) Senza esito non c'e' classe da validare (guard 477 presidia).
                IF NEW.esito IS NULL THEN
                  RETURN NEW;
                END IF;

                IF NOT EXISTS (
                  SELECT 1
                    FROM config.stati_flussi_pratiche sfp
                   WHERE sfp.id = NEW.stato_id
                     AND sfp.codice_interno = 'COMPLETATO'
                ) THEN
                  RETURN NEW;
                END IF;

                -- (3) Classe attesa dal template.
                SELECT tf.modalita_esito, tf.codice
                  INTO v_modalita, v_template_codice
                  FROM pratiche.template_flussi tf
                 WHERE tf.id = NEW.template_flusso_id;
                IF NOT FOUND THEN
                  v_modalita        := 'MANUALE';
                  v_template_codice := NULL;
                END IF;

                -- Classe dell'esito (esistenza gia' garantita da fk_flussi_esito;
                -- guard difensivo comunque).
                SELECT e.is_verdetto
                  INTO v_is_verdetto
                  FROM config.esiti_flussi_pratiche e
                 WHERE e.codice_interno = NEW.esito;
                IF NOT FOUND THEN
                  RETURN NEW;
                END IF;

                IF v_modalita = 'DOMINIO' AND v_is_verdetto THEN
                  -- Il caso PRA-0000243: verdetto generico su step a esito
                  -- calcolato dal dominio -> ramo mai attivato, in silenzio.
                  PERFORM script.fn_log_and_raise_error(
                    'pratiche',
                    'pratiche.trgfn_flussi_guard_esito_classe',
                    'FLUSSI_ESITO_NON_AMMESSO',
                    jsonb_build_object(
                      'flusso_id',          NEW.id,
                      'pratica_id',         NEW.pratica_id,
                      'template_flusso_id', NEW.template_flusso_id,
                      'template_codice',    v_template_codice,
                      'modalita_esito',     v_modalita,
                      'esito',              NEW.esito
                    ),
                    NEW.tx_id,
                    NEW.esito,
                    COALESCE(v_template_codice, NEW.id::text),
                    'ramo (calcolato dal dominio)'
                  );
                ELSIF v_modalita <> 'DOMINIO' AND NOT v_is_verdetto THEN
                  -- Simmetrico: esito di ramo scritto su uno step normale
                  -- (prima fermato solo dal guard BE lato operatore).
                  PERFORM script.fn_log_and_raise_error(
                    'pratiche',
                    'pratiche.trgfn_flussi_guard_esito_classe',
                    'FLUSSI_ESITO_NON_AMMESSO',
                    jsonb_build_object(
                      'flusso_id',          NEW.id,
                      'pratica_id',         NEW.pratica_id,
                      'template_flusso_id', NEW.template_flusso_id,
                      'template_codice',    v_template_codice,
                      'modalita_esito',     v_modalita,
                      'esito',              NEW.esito
                    ),
                    NEW.tx_id,
                    NEW.esito,
                    COALESCE(v_template_codice, NEW.id::text),
                    'verdetto'
                  );
                END IF;

                RETURN NEW;
              END;
              $function$;

              CREATE OR REPLACE FUNCTION pratiche.trgfn_flussi_guard_esito_completato()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: una fase (flusso) non puo' chiudersi senza verdetto.
              -- Se il nuovo stato e' COMPLETATO l'esito e' obbligatorio.
              -- BEFORE INSERT OR UPDATE OF stato_id su pratiche.flussi.
              BEGIN
                IF NEW.esito IS NULL
                   AND EXISTS (
                     SELECT 1
                       FROM config.stati_flussi_pratiche sfp
                      WHERE sfp.id = NEW.stato_id
                        AND sfp.codice_interno = 'COMPLETATO'
                   )
                THEN
                  PERFORM script.fn_log_and_raise_error(
                    'pratiche',
                    'pratiche.trgfn_flussi_guard_esito_completato',
                    'FLUSSI_ESITO_OBBLIGATORIO',
                    jsonb_build_object(
                      'flusso_id', NEW.id,
                      'pratica_id', NEW.pratica_id,
                      'template_flusso_id', NEW.template_flusso_id
                    ),
                    NEW.tx_id,
                    NEW.id::text
                  );
                END IF;

                RETURN NEW;
              END;
              $function$;

              CREATE OR REPLACE FUNCTION pratiche.trgfn_flussi_guard_pratica_terminale()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: difesa lato DB. Una pratica in stato TERMINALE e' conclusa
              --   e i suoi flussi sono congelati: ne' nuovi flussi (INSERT) ne'
              --   modifiche a flussi esistenti (UPDATE: stato, esito, note_esito,
              --   qualunque campo operativo).
              -- Regole:
              --   1. "Terminale" = stato pratica senza alcuna transizione di stato
              --      in uscita attiva (config.transizioni_stati_pratiche). Nessun
              --      id/codice hardcodato: la definizione si auto-mantiene.
              --   2. Il guard e' su pratiche.flussi: la transizione della pratica
              --      verso lo stato terminale (UPDATE su pratiche.pratiche) non
              --      passa di qui e resta permessa.
              --   3. Codice errore distinto per operazione (creazione vs modifica)
              --      per messaggi utente piu' chiari lato BE/FE.
              DECLARE
                  v_stato_id      pratiche.pratiche.stato_id%TYPE;
                  v_stato_codice  config.stati_pratiche.codice_interno%TYPE;
              BEGIN
                  -- Stato corrente della pratica padre (esiste sempre: FK fk_flussi_pratica).
                  SELECT p.stato_id, sp.codice_interno
                    INTO v_stato_id, v_stato_codice
                    FROM pratiche.pratiche p
                    JOIN config.stati_pratiche sp ON sp.id = p.stato_id
                   WHERE p.id = NEW.pratica_id;

                  -- Pratica ancora operabile (lo stato ha almeno una uscita attiva):
                  -- nessun blocco.
                  IF EXISTS (
                      SELECT 1
                        FROM config.transizioni_stati_pratiche t
                       WHERE t.stato_da_id = v_stato_id
                         AND t.attivo
                  ) THEN
                      RETURN NEW;
                  END IF;

                  -- Pratica terminale: blocca con errore parlante.
                  IF TG_OP = 'INSERT' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'pratiche',
                          'pratiche.trgfn_flussi_guard_pratica_terminale',
                          'PRATICHE_TERMINALE_NUOVO_FLUSSO_BLOCCATO',
                          jsonb_build_object(
                              'pratica_id', NEW.pratica_id,
                              'stato', v_stato_codice
                          ),
                          NEW.tx_id,
                          v_stato_codice
                      );
                  ELSE
                      PERFORM script.fn_log_and_raise_error(
                          'pratiche',
                          'pratiche.trgfn_flussi_guard_pratica_terminale',
                          'PRATICHE_TERMINALE_FLUSSO_NON_MODIFICABILE',
                          jsonb_build_object(
                              'pratica_id', NEW.pratica_id,
                              'flusso_id', NEW.id,
                              'stato', v_stato_codice
                          ),
                          NEW.tx_id,
                          v_stato_codice
                      );
                  END IF;

                  RETURN NEW;  -- non raggiunto: fn_log_and_raise_error solleva.
              END;
              $function$;

              CREATE OR REPLACE FUNCTION pratiche.trgfn_flussi_guard_transizione()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: blocca transizioni di stato non ammesse per i flussi.
              -- Consulta la matrice config.transizioni_stati_flussi_pratiche (solo righe attive).
              -- Risolve i codici interni degli stati per messaggi di errore leggibili.
              DECLARE
                  v_codice_da config.stati_flussi_pratiche.codice_interno%TYPE;
                  v_codice_a  config.stati_flussi_pratiche.codice_interno%TYPE;
              BEGIN
                  -- Nessuna transizione: niente da validare
                  IF OLD.stato_id = NEW.stato_id THEN
                      RETURN NEW;
                  END IF;

                  -- Verifica che la transizione sia ammessa
                  IF NOT EXISTS (
                      SELECT 1 FROM config.transizioni_stati_flussi_pratiche
                      WHERE stato_da_id = OLD.stato_id
                        AND stato_a_id  = NEW.stato_id
                        AND attivo = true
                  ) THEN
                      SELECT codice_interno INTO v_codice_da
                      FROM config.stati_flussi_pratiche WHERE id = OLD.stato_id;

                      SELECT codice_interno INTO v_codice_a
                      FROM config.stati_flussi_pratiche WHERE id = NEW.stato_id;



                       PERFORM script.fn_log_and_raise_error(
                          'pratiche',
                          'pratiche. trgfn_flussi_guard_transizione',
                          'FLUSSI_TRANSIZIONE_NON_AMMESSA',
                          jsonb_build_object(
                              'transizione', format('Transizione flusso non ammessa: %s -> %s',
                               v_codice_da, v_codice_a)   
                          ),
                          NULL::uuid,
                          concat('Transizione flusso non ammessa: ', v_codice_da, ' -> ', v_codice_a)
                      );


                  END IF;

                  RETURN NEW;
              END;
              $function$;

              CREATE OR REPLACE FUNCTION pratiche.trgfn_pratiche_guard_chiusura_flussi()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_codice_a  config.stati_pratiche.codice_interno%TYPE;
                  v_bloccanti text;
                  v_aperti    text;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Blocca la transizione a CHIUSA se la pratica ha ancora lavoro:
                --   (a) flussi obbligatori non completati e ancora percorribili
                --       (fn_check_chiusura_pratica; ramo morto di un bivio non blocca), OPPURE
                --   (b) flussi ISTANZIATI in stato non terminale (fn_pratica_flussi_aperti, D1).
                --   Stesso predicato dell'auto-chiusura (fn_check_pratica_chiudibile).
                --   ANNULLATA non passa di qui (stato diverso da CHIUSA).
                -- =========================================================

                -- Nessuna transizione: niente da validare.
                IF OLD.stato_id = NEW.stato_id THEN
                    RETURN NEW;
                END IF;

                -- Solo verso CHIUSA.
                SELECT sp.codice_interno
                  INTO v_codice_a
                  FROM config.stati_pratiche sp
                 WHERE sp.id = NEW.stato_id;

                IF v_codice_a IS DISTINCT FROM 'CHIUSA' THEN
                    RETURN NEW;
                END IF;

                -- (a) Template bloccanti: obbligatori, non completati, percorribili.
                SELECT string_agg(c.codice, ', ' ORDER BY c.codice)
                  INTO v_bloccanti
                  FROM pratiche.fn_check_chiusura_pratica(NEW.id) c
                 WHERE c.bloccante;

                IF v_bloccanti IS NOT NULL THEN
                    PERFORM script.fn_log_and_raise_error(
                        'pratiche',
                        'pratiche.trgfn_pratiche_guard_chiusura_flussi',
                        'PRATICHE_CHIUSURA_FLUSSI_OBBLIGATORI_MANCANTI',
                        jsonb_build_object(
                            'pratica_id', NEW.id,
                            'flussi_bloccanti', v_bloccanti
                        ),
                        NULL::uuid,
                        v_bloccanti
                    );
                END IF;

                -- (b) D1: flussi istanziati ancora aperti (lavoro avviato pendente).
                SELECT string_agg(
                         COALESCE(a.codice, 'flusso#' || a.flusso_id) || ' (' || a.stato_codice_interno || ')',
                         ', ' ORDER BY COALESCE(a.codice, 'flusso#' || a.flusso_id)
                       )
                  INTO v_aperti
                  FROM pratiche.fn_pratica_flussi_aperti(NEW.id) a;

                IF v_aperti IS NOT NULL THEN
                    PERFORM script.fn_log_and_raise_error(
                        'pratiche',
                        'pratiche.trgfn_pratiche_guard_chiusura_flussi',
                        'PRATICHE_CHIUSURA_FLUSSI_APERTI',
                        jsonb_build_object(
                            'pratica_id', NEW.id,
                            'flussi_aperti', v_aperti
                        ),
                        NULL::uuid,
                        v_aperti
                    );
                END IF;

                RETURN NEW;
              END;
              $function$;

              CREATE OR REPLACE FUNCTION pratiche.trgfn_pratiche_guard_transizione()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: blocca transizioni di stato non ammesse per le pratiche.
              -- Consulta la matrice config.transizioni_stati_pratiche (solo righe attive).
              -- Risolve i codici interni degli stati per messaggi di errore leggibili.
              DECLARE
                  v_codice_da config.stati_pratiche.codice_interno%TYPE;
                  v_codice_a  config.stati_pratiche.codice_interno%TYPE;
              BEGIN
                  -- Nessuna transizione: niente da validare
                  IF OLD.stato_id = NEW.stato_id THEN
                      RETURN NEW;
                  END IF;

                  -- Verifica che la transizione sia ammessa
                  IF NOT EXISTS (
                      SELECT 1 FROM config.transizioni_stati_pratiche
                      WHERE stato_da_id = OLD.stato_id
                        AND stato_a_id  = NEW.stato_id
                        AND attivo = true
                  ) THEN
                      SELECT codice_interno INTO v_codice_da
                      FROM config.stati_pratiche WHERE id = OLD.stato_id;

                      SELECT codice_interno INTO v_codice_a
                      FROM config.stati_pratiche WHERE id = NEW.stato_id;

                      PERFORM script.fn_log_and_raise_error(
                          'pratiche',
                          'pratiche.trgfn_pratiche_guard_transizione',
                          'PRATICHE_TRANSIZIONE_NON_AMMESSA',
                          jsonb_build_object(
                              'stato_da', v_codice_da,
                              'stato_a', v_codice_a
                          ),
                          NULL::uuid,
                          concat('Transizione pratica non ammessa: ', v_codice_da, ' -> ', v_codice_a)
                      );
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              CREATE OR REPLACE FUNCTION pratiche.trgfn_template_flussi_figli_guard_immutabile()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: immutabilita' strutturale «Leggera» dei figli (strategia C).
              --   INSERT/UPDATE vietati su edizione forkata emessa; DELETE vietato
              --   solo su pubblicata. La colonna FK verso template arriva in
              --   TG_ARGV[0]. Nessuna eccezione display sui figli.
              DECLARE
                v_rec   jsonb;
                v_tf_id pratiche.template_flussi.id%TYPE;
                v_def   pratiche.workflow_definizioni.id%TYPE;
                v_tx    uuid;
                v_bloccata boolean;
              BEGIN
                IF TG_OP = 'DELETE' THEN
                  v_rec := to_jsonb(OLD);
                ELSE
                  v_rec := to_jsonb(NEW);
                END IF;

                v_tf_id := (v_rec ->> TG_ARGV[0])::integer;
                -- FK non risolvibile: non e' compito di questo guard.
                IF v_tf_id IS NULL THEN
                  RETURN CASE WHEN TG_OP = 'DELETE' THEN OLD ELSE NEW END;
                END IF;

                SELECT tf.definizione_id
                  INTO v_def
                  FROM pratiche.template_flussi tf
                 WHERE tf.id = v_tf_id;

                -- DELETE -> solo PUBBLICATA (congelata); INSERT/UPDATE -> anche
                -- RITIRATA (struttura_bloccata).
                IF TG_OP = 'DELETE' THEN
                  v_bloccata := pratiche.fn_check_definizione_congelata(v_def);
                ELSE
                  v_bloccata := pratiche.fn_check_definizione_struttura_bloccata(v_def);
                END IF;

                IF v_bloccata THEN
                  v_tx := NULLIF(v_rec ->> 'tx_id', '')::uuid;
                  PERFORM script.fn_log_and_raise_error(
                    'pratiche',
                    'pratiche.trgfn_template_flussi_figli_guard_immutabile',
                    'TEMPLATE_DEFINIZIONE_CONGELATA',
                    jsonb_build_object(
                      'operazione',        TG_OP,
                      'tabella',           TG_TABLE_NAME,
                      'template_flusso_id', v_tf_id,
                      'definizione_id',     v_def
                    ),
                    v_tx,
                    v_def::text
                  );
                END IF;

                RETURN CASE WHEN TG_OP = 'DELETE' THEN OLD ELSE NEW END;
              END;
              $function$;

              CREATE OR REPLACE FUNCTION pratiche.trgfn_template_flussi_guard_immutabile()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: immutabilita' strutturale «Leggera» dei template (strategia C).
              --   INSERT/UPDATE vietati su edizione forkata emessa (pubblicata o
              --   ritirata); DELETE vietato solo su pubblicata (in uso). RITIRATA:
              --   non editabile ma cancellabile. descrizione sempre correggibile.
              --   Preset e BOZZA liberi.
              DECLARE
                v_old_bloccata boolean;
                v_new_bloccata boolean;
                v_def_report   pratiche.workflow_definizioni.id%TYPE;
              BEGIN
                IF TG_OP = 'DELETE' THEN
                  -- Cancellazione: vietata solo su edizione PUBBLICATA (in uso).
                  -- Una RITIRATA-emittente resta cancellabile (housekeeping).
                  IF pratiche.fn_check_definizione_congelata(OLD.definizione_id) THEN
                    PERFORM script.fn_log_and_raise_error(
                      'pratiche',
                      'pratiche.trgfn_template_flussi_guard_immutabile',
                      'TEMPLATE_DEFINIZIONE_CONGELATA',
                      jsonb_build_object(
                        'operazione',        'DELETE',
                        'tabella',           'template_flussi',
                        'template_flusso_id', OLD.id,
                        'codice',             OLD.codice,
                        'definizione_id',     OLD.definizione_id
                      ),
                      OLD.tx_id,
                      OLD.definizione_id::text
                    );
                  END IF;
                  RETURN OLD;

                ELSIF TG_OP = 'INSERT' THEN
                  -- Inserimento: vietato su edizione emessa (pubblicata o ritirata).
                  IF pratiche.fn_check_definizione_struttura_bloccata(NEW.definizione_id) THEN
                    PERFORM script.fn_log_and_raise_error(
                      'pratiche',
                      'pratiche.trgfn_template_flussi_guard_immutabile',
                      'TEMPLATE_DEFINIZIONE_CONGELATA',
                      jsonb_build_object(
                        'operazione',     'INSERT',
                        'tabella',        'template_flussi',
                        'codice',         NEW.codice,
                        'definizione_id', NEW.definizione_id
                      ),
                      NEW.tx_id,
                      NEW.definizione_id::text
                    );
                  END IF;
                  RETURN NEW;

                ELSE  -- UPDATE
                  v_old_bloccata := pratiche.fn_check_definizione_struttura_bloccata(OLD.definizione_id);
                  v_new_bloccata := pratiche.fn_check_definizione_struttura_bloccata(NEW.definizione_id);

                  -- Blocca se una delle due edizioni (origine/destinazione del
                  -- re-parent) e' emessa e cambia qualcosa oltre alla descrizione
                  -- (+ audit tecnici esclusi dal confronto).
                  IF (v_old_bloccata OR v_new_bloccata)
                     AND (to_jsonb(NEW) - 'descrizione' - 'tx_id'
                                        - 'data_insert' - 'user_insert'
                                        - 'data_update' - 'user_update')
                         IS DISTINCT FROM
                         (to_jsonb(OLD) - 'descrizione' - 'tx_id'
                                        - 'data_insert' - 'user_insert'
                                        - 'data_update' - 'user_update')
                  THEN
                    v_def_report := CASE WHEN v_old_bloccata
                                         THEN OLD.definizione_id
                                         ELSE NEW.definizione_id END;
                    PERFORM script.fn_log_and_raise_error(
                      'pratiche',
                      'pratiche.trgfn_template_flussi_guard_immutabile',
                      'TEMPLATE_DEFINIZIONE_CONGELATA',
                      jsonb_build_object(
                        'operazione',        'UPDATE',
                        'tabella',           'template_flussi',
                        'template_flusso_id', NEW.id,
                        'codice',             NEW.codice,
                        'definizione_id',     v_def_report
                      ),
                      NEW.tx_id,
                      v_def_report::text
                    );
                  END IF;
                  RETURN NEW;
                END IF;
              END;
              $function$;

              CREATE OR REPLACE FUNCTION pratiche.trgfn_workflow_definizioni_guard()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: proteggere il ciclo di vita dell'edizione di workflow.
              --   Inv A: transizioni di stato ammesse (BOZZA->PUBBLICATA,
              --          PUBBLICATA->RITIRATA).
              --   Inv B: header strutturale immutabile fuori da BOZZA.
              BEGIN
                -- Inv A: transizioni di stato.
                IF NEW.stato IS DISTINCT FROM OLD.stato THEN
                  IF NOT (
                       (OLD.stato = 'BOZZA'      AND NEW.stato = 'PUBBLICATA')
                    OR (OLD.stato = 'PUBBLICATA' AND NEW.stato = 'RITIRATA')
                  ) THEN
                    PERFORM script.fn_log_and_raise_error(
                      'pratiche',
                      'pratiche.trgfn_workflow_definizioni_guard',
                      'DEFINIZIONE_TRANSIZIONE_NON_AMMESSA',
                      jsonb_build_object(
                        'definizione_id', NEW.id,
                        'stato_da',       OLD.stato,
                        'stato_a',        NEW.stato
                      ),
                      NEW.tx_id,
                      OLD.stato,
                      NEW.stato
                    );
                  END IF;
                END IF;

                -- Inv B: header strutturale immutabile fuori da BOZZA.
                IF OLD.stato <> 'BOZZA' AND (
                       NEW.tipo_prestazione_id  IS DISTINCT FROM OLD.tipo_prestazione_id
                    OR NEW.emittente_fiscale_id IS DISTINCT FROM OLD.emittente_fiscale_id
                    OR NEW.versione             IS DISTINCT FROM OLD.versione
                    OR NEW.preset_origine_id    IS DISTINCT FROM OLD.preset_origine_id
                    OR NEW.versione_origine     IS DISTINCT FROM OLD.versione_origine
                ) THEN
                  PERFORM script.fn_log_and_raise_error(
                    'pratiche',
                    'pratiche.trgfn_workflow_definizioni_guard',
                    'DEFINIZIONE_PUBBLICATA_IMMUTABILE',
                    jsonb_build_object(
                      'definizione_id', NEW.id,
                      'stato',          OLD.stato
                    ),
                    NEW.tx_id,
                    NEW.id::text,
                    OLD.stato
                  );
                END IF;

                RETURN NEW;
              END;
              $function$;

              CREATE OR REPLACE FUNCTION script.fn_clone_catasto_from_parent_by_istanza(p_istanza_utilities_id bigint)
               RETURNS bigint
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_parent_istanza_id     anagrafiche.istanze_utilities.parent_istanza_id%TYPE;
                  v_curr_catasto_id       anagrafiche.istanze_utilities.catasto_unita_immobiliare_id%TYPE;
                  v_src                   anagrafiche.catasto_unita_immobiliari;
                  v_new_catasto_id        anagrafiche.catasto_unita_immobiliari.id%TYPE;
              BEGIN
                  -- Parametro obbligatorio
                  IF p_istanza_utilities_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          'script.fn_clone_catasto_from_parent_by_istanza',
                          'ERRORE_PARAMETRI',
                          jsonb_build_object('p_istanza_utilities_id', 'NULL'),
                          NULL,
                          'Parametro p_istanza_utilities_id non puo'' essere NULL'
                      );
                  END IF;

                  -- Lock riga istanza (anti race)
                  SELECT iu.parent_istanza_id,
                         iu.catasto_unita_immobiliare_id
                    INTO v_parent_istanza_id,
                         v_curr_catasto_id
                  FROM anagrafiche.istanze_utilities iu
                  WHERE iu.id = p_istanza_utilities_id
                  FOR UPDATE;

                  -- Idempotenza: istanza gia' agganciata a catasto
                  IF v_curr_catasto_id IS NOT NULL THEN
                      RETURN v_curr_catasto_id;
                  END IF;

                  -- Senza parent non c'e' sorgente da clonare
                  IF v_parent_istanza_id IS NULL THEN
                      RETURN NULL;
                  END IF;

                  -- Lookup sorgente basato su parent_istanza_id
                  SELECT *
                    INTO v_src
                  FROM script.fn_get_catasto_source_by_istanza(p_istanza_utilities_id);

                  -- Parent senza catasto: no-op (non blocca il flusso cliente/istanza)
                  IF v_src.id IS NULL THEN
                      RETURN NULL;
                  END IF;

                  -- Clone catasto
                  INSERT INTO anagrafiche.catasto_unita_immobiliari (
                      sezione_catastale,
                      foglio_catastale,
                      particella,
                      subalterno,
                      categoria_catastale,
                      classe_catastale,
                      rendita_catastale,
                      consistenza,
                      tipo_accatastamento,
                      immobile_rurale,
                      destinazione_immobile,
                      anno_protocollo,
                      superficie,
                      storicizza
                  )
                  VALUES (
                      v_src.sezione_catastale,
                      v_src.foglio_catastale,
                      v_src.particella,
                      v_src.subalterno,
                      v_src.categoria_catastale,
                      v_src.classe_catastale,
                      v_src.rendita_catastale,
                      v_src.consistenza,
                      v_src.tipo_accatastamento,
                      v_src.immobile_rurale,
                      v_src.destinazione_immobile,
                      v_src.anno_protocollo,
                      v_src.superficie,
                      COALESCE(v_src.storicizza, true)
                  )
                  RETURNING id INTO v_new_catasto_id;

                  -- Aggancio su istanza corrente
                  UPDATE anagrafiche.istanze_utilities iu
                     SET catasto_unita_immobiliare_id = v_new_catasto_id
                   WHERE iu.id = p_istanza_utilities_id
                     AND iu.catasto_unita_immobiliare_id IS NULL;

                  RETURN v_new_catasto_id;
              END;
              $function$;

              CREATE OR REPLACE FUNCTION script.fn_get_catasto_source_by_istanza(p_istanza_utilities_id bigint)
               RETURNS anagrafiche.catasto_unita_immobiliari
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_parent_istanza_id anagrafiche.istanze_utilities.parent_istanza_id%TYPE;
                  v_catasto           anagrafiche.catasto_unita_immobiliari;
              BEGIN
                  -- ============================================================
                  -- Funzione: script.fn_get_catasto_source_by_istanza
                  --
                  -- Scopo:
                  --   - Recupera il record catastale "sorgente" da clonare
                  --     per una istanza_utilities (subentro).
                  --
                  -- Regola di individuazione sorgente:
                  --   - ESCLUSIVAMENTE tramite:
                  --       istanze_utilities.parent_istanza_id
                  --
                  -- Note di modellazione (post-refactor):
                  --   - Il legame ufficiale istanza -> catasto è:
                  --       istanze_utilities.catasto_unita_immobiliare_id
                  --   - La tabella catasto_unita_immobiliari NON contiene più
                  --     il riferimento all'istanza (rimossa istanza_utility_id).
                  --
                  -- Ritorna:
                  --   - record anagrafiche.catasto_unita_immobiliari (sorgente)
                  --   - NULL se non esiste parent o se la parent non ha catasto agganciato
                  --
                  -- Side effects:
                  --   - Nessuno (lookup puro).
                  -- ============================================================

                  IF p_istanza_utilities_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          'script.fn_get_catasto_source_by_istanza',
                          'ERRORE_PARAMETRI',
                          jsonb_build_object('p_istanza_utilities_id', 'NULL'),
                          NULL,
                          'Parametro p_istanza_utilities_id non può essere NULL'
                      );
                  END IF;

                  -- 1) Recupero parent_istanza_id
                  SELECT iu.parent_istanza_id
                  INTO v_parent_istanza_id
                  FROM anagrafiche.istanze_utilities iu
                  WHERE iu.id = p_istanza_utilities_id;

                  IF v_parent_istanza_id IS NULL THEN
                      RETURN NULL;
                  END IF;

                  -- 2) Recupero catasto agganciato alla parent istanza
                  SELECT c.*
                  INTO v_catasto
                  FROM anagrafiche.istanze_utilities iu_parent
                  JOIN anagrafiche.catasto_unita_immobiliari c
                  ON c.id = iu_parent.catasto_unita_immobiliare_id
                  WHERE iu_parent.id = v_parent_istanza_id
                  LIMIT 1;

                  IF NOT FOUND THEN
                      RETURN NULL;
                  END IF;

                  RETURN v_catasto;
              END;
              $function$;

              CREATE OR REPLACE FUNCTION script.fn_get_parameter_full(p_code text, p_emittente_fiscale_id bigint DEFAULT NULL::bigint, p_django_user_id integer DEFAULT NULL::integer, p_group_ids integer[] DEFAULT NULL::integer[], p_session_key text DEFAULT NULL::text, p_function_name text DEFAULT NULL::text, p_categoria_cliente_id smallint DEFAULT NULL::smallint)
               RETURNS text
               LANGUAGE plpgsql
               STABLE
              AS $function$
              -- Cascata: user -> categoria_cliente -> group -> emittente -> session -> function -> default.
              -- p_categoria_cliente_id e' l'ultimo parametro per backward compatibility:
              -- i caller posizionali a 6 arg usano l'overload precedente senza modifiche.
              -- Ogni subquery usa NULL-equality: se il param di scope e' NULL, la WHERE
              -- restituisce 0 righe e quel livello viene saltato naturalmente.
              -- p_group_ids resta integer[] esplicito: %TYPE[] non e' sintassi valida in PG.
              DECLARE
                  v_param_id  config.parameters.id%TYPE;
                  v_default   config.parameters.default_value%TYPE;
                  v_result    config.parameter_overrides.overridden_value%TYPE;
              BEGIN
                  SELECT id, default_value
                    INTO v_param_id, v_default
                    FROM config.parameters
                   WHERE code = p_code;

                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          'fn_get_parameter_full',
                          'ERRORE_PARAMETRI_TABELLA',
                          jsonb_build_object(
                              'codice_parametro', p_code,
                              'nome_tabella',      'config.parameters'
                          ),
                          NULL::uuid,
                          'config.parameters',
                          p_code::text
                      );
                  END IF;

                  SELECT COALESCE(
                      -- 1. user (massima priorita')
                      (SELECT po.overridden_value
                         FROM config.parameter_overrides po
                        WHERE po.parameter_id    = v_param_id
                          AND po.django_user_id  = p_django_user_id
                          AND po.attivo          = true
                        LIMIT 1),
                      -- 2. categoria_cliente (NUOVO: vince su group/emittente)
                      (SELECT po.overridden_value
                         FROM config.parameter_overrides po
                        WHERE po.parameter_id         = v_param_id
                          AND po.categoria_cliente_id = p_categoria_cliente_id
                          AND po.attivo               = true
                        LIMIT 1),
                      -- 3. group
                      (SELECT po.overridden_value
                         FROM config.parameter_overrides po
                        WHERE po.parameter_id    = v_param_id
                          AND po.django_group_id = ANY(p_group_ids)
                          AND po.attivo          = true
                        ORDER BY po.id
                        LIMIT 1),
                      -- 4. emittente
                      (SELECT po.overridden_value
                         FROM config.parameter_overrides po
                        WHERE po.parameter_id          = v_param_id
                          AND po.emittente_fiscale_id  = p_emittente_fiscale_id
                          AND po.attivo                = true
                        LIMIT 1),
                      -- 5. session
                      (SELECT po.overridden_value
                         FROM config.parameter_overrides po
                        WHERE po.parameter_id  = v_param_id
                          AND po.session_key   = p_session_key
                          AND po.attivo        = true
                        LIMIT 1),
                      -- 6. function
                      (SELECT po.overridden_value
                         FROM config.parameter_overrides po
                        WHERE po.parameter_id  = v_param_id
                          AND po.function_name = p_function_name
                          AND po.attivo        = true
                        LIMIT 1),
                      -- 7. default
                      v_default
                  ) INTO v_result;

                  RETURN v_result;
              END;
              $function$;

              CREATE OR REPLACE FUNCTION script.fn_guard_utility_tipo_ruolo(p_utility_id integer, p_tipo_ruolo_id integer, p_context text DEFAULT NULL::text)
               RETURNS void
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_has_matrix BOOLEAN := false;
                  v_is_allowed BOOLEAN := false;
              BEGIN
                  -- Guard: parametri obbligatori e > 0
                  IF p_utility_id IS NULL OR p_utility_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          'script.fn_guard_utility_tipo_ruolo',
                          'ERRORE_PARAMETRI',
                          jsonb_build_object(
                              'detail', 'p_utility_id obbligatorio e > 0',
                              'p_utility_id', p_utility_id,
                              'context', p_context
                          ),
                          NULL::uuid,
                          concat('p_utility_id non valido: ', p_utility_id::text, ' context: ', p_context)
                      );
                  END IF;

                  IF p_tipo_ruolo_id IS NULL OR p_tipo_ruolo_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          'script.fn_guard_utility_tipo_ruolo',
                          'ERRORE_PARAMETRI',
                          jsonb_build_object(
                              'detail', 'p_tipo_ruolo_id obbligatorio e > 0',
                              'p_tipo_ruolo_id', p_tipo_ruolo_id,
                              'context', p_context
                          ),
                          NULL::uuid,
                          concat('p_tipo_ruolo_id non valido: ', p_tipo_ruolo_id::text, ' context: ', p_context)
                      );
                  END IF;

                  -- NOTA: le due query EXISTS sulla matrice hanno condizioni
                  -- identiche tranne tipo_ruolo_id. Scelta progettuale: si
                  -- mantengono separate per rendere esplicito il pattern a 2 step
                  -- (1: la matrice esiste? → fail-open se no; 2: il ruolo e'
                  -- ammesso? → fail-close se no). Unificarle in una sola query
                  -- con FILTER peggiorerebbe la leggibilita' senza beneficio
                  -- prestazionale (tabella config con poche righe).

                  -- 1) Esiste matrice attiva/valida per utility?
                  SELECT EXISTS (
                      SELECT 1
                        FROM config.utilities_tipi_ruolo m
                       WHERE m.utility_id = p_utility_id
                         AND m.attivo = true
                         AND (m.valido_dal IS NULL OR m.valido_dal <= CURRENT_DATE)
                         AND (m.valido_al IS NULL OR m.valido_al >= CURRENT_DATE)
                  )
                  INTO v_has_matrix;

                  -- Fail-open: nessuna regola attiva/valida → nessun vincolo
                  IF NOT v_has_matrix THEN
                      RETURN;
                  END IF;

                  -- 2) Matrice presente: il ruolo deve essere esplicitamente ammesso
                  SELECT EXISTS (
                      SELECT 1
                        FROM config.utilities_tipi_ruolo m
                       WHERE m.utility_id = p_utility_id
                         AND m.tipo_ruolo_id = p_tipo_ruolo_id
                         AND m.attivo = true
                         AND (m.valido_dal IS NULL OR m.valido_dal <= CURRENT_DATE)
                         AND (m.valido_al IS NULL OR m.valido_al >= CURRENT_DATE)
                  )
                  INTO v_is_allowed;

                  IF NOT v_is_allowed THEN
                      -- Fix: E_GENERICO → E_UTILITY_RUOLO_NON_AMMESSO
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          'script.fn_guard_utility_tipo_ruolo',
                          'E_UTILITY_RUOLO_NON_AMMESSO',
                          jsonb_build_object(
                              'utility_id', p_utility_id,
                              'tipo_ruolo_id', p_tipo_ruolo_id,
                              'context', p_context
                          ),
                          NULL::uuid,
                          p_tipo_ruolo_id::text,
                          p_utility_id::text
                      );
                  END IF;
              END;
              $function$;

              CREATE OR REPLACE FUNCTION script.fn_subentro_cliente(p_pdp_id bigint, p_data_attivazione date)
               RETURNS bigint
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  --v_cliente_precedente_id bigint;
                  --v_stato_chiuso_id       integer;
                  --v_codice_chiuso         text := 'CH';
                  v_cliente_precedente_id anagrafiche.clienti.id%TYPE;
                  v_stato_chiuso_id       config.stati_cliente.id%TYPE;
                  v_codice_chiuso         config.stati_cliente.codice_interno%TYPE := 'CH';  

              BEGIN
              -- ------------------------------------------------------------
              -- Funzione: script.fn_subentro_cliente
              --
              -- Scopo:
              --   - Dato un PDP e una data di attivazione del nuovo cliente,
              --     chiude (se esiste) il cliente precedente su quel PDP
              --     per evitare overlap del periodo commerciale.
              --
              --   - Logica:
              --       * Cerca il cliente più recente su p_pdp_id con:
              --           - stato_cliente.codice_interno <> 'AN'
              --           - data_attivazione NOT NULL
              --           - data_attivazione < p_data_attivazione
              --           - data_chiusura IS NULL oppure >= p_data_attivazione
              --       * Se trovato:
              --           - imposta data_chiusura = p_data_attivazione - 1 giorno
              --           - imposta stato_cliente a 'CH'
              --         (il trigger trg_clienti_set_periodo normalizzerà periodo)
              --
              --   - Ritorna:
              --       * id del cliente chiuso
              --       * NULL se nessun cliente da chiudere (primo cliente sul PDP)
              --
              -- NOTE:
              --   - Non crea la nuova istanza né il nuovo cliente: questo
              --     viene fatto dal frontend / servizio applicativo subito dopo.
              --   - Va tipicamente chiamata in transazione:
              --       1) SELECT script.fn_subentro_cliente(...)
              --       2) INSERT nuovo cliente sullo stesso PDP
              --     in modo da rispettare il vincolo ex_clienti_no_overlap_stesso_pdp.
              -- ------------------------------------------------------------



                  ----------------------------------------------------------------
                  -- Validazioni minime parametri
                  ----------------------------------------------------------------
                  IF p_pdp_id IS NULL THEN

                       PERFORM script.fn_log_and_raise_error(
                                        'database',
                                        'script.fn_subentro_cliente',
                                        'ERRORE_PARAMETRI',
                                        jsonb_build_object(
                                            'p_pdp_id non può essere NULL', 
                                            'indicare un valore valido'  
                                        ),
                                        NULL,
                                        'Non è stato fornito un valore per pdp_id'
                                    );
                  END IF;

                  IF p_data_attivazione IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                                        'database',
                                        'script.fn_subentro_cliente',
                                        'ERRORE_PARAMETRI',
                                        jsonb_build_object(
                                            'fn_subentro_cliente: p_data_attivazione non può essere NULL', 
                                            'indicare un valore valido'  
                                        ),
                                        NULL,
                                        'Non è stato fornito un valore per data_attivazione'
                                    );
                  END IF;

                  ----------------------------------------------------------------
                  -- Recupero ID stato_cliente "CH" (Chiuso)
                  ----------------------------------------------------------------
                  SELECT sc.id
                    INTO v_stato_chiuso_id
                  FROM config.stati_cliente sc
                  WHERE sc.codice_interno = v_codice_chiuso
                  LIMIT 1;

                  IF v_stato_chiuso_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                                        'database',
                                        'script.fn_subentro_cliente',
                                        'ERRORE_PARAMETRI',
                                        jsonb_build_object(
                                                'codice id_cliente',
                                                v_codice_chiuso
                                        ),
                                        NULL,
                                        'stato_cliente con id_cliente' || v_codice_chiuso::text || ' non trovato'
                                    );               
                  END IF;

                  ----------------------------------------------------------------
                  -- Seleziono il cliente precedente da chiudere:
                  --   - stesso PDP
                  --   - non ANNULLATO
                  --   - con data_attivazione < nuova data attivazione
                  --   - con periodo ancora “aperto” rispetto alla nuova data
                  --   - prendo il più recente (data_attivazione DESC, id DESC)
                  ----------------------------------------------------------------
                  SELECT c.id
                    INTO v_cliente_precedente_id
                  FROM anagrafiche.clienti c
                  JOIN config.stati_cliente sc
                       ON sc.id = c.stato_cliente_id
                  WHERE c.pdp_id = p_pdp_id
                    AND sc.codice_interno <> 'AN'
                    AND c.data_attivazione IS NOT NULL
                    AND c.data_attivazione < p_data_attivazione
                    AND (c.data_chiusura IS NULL OR c.data_chiusura >= p_data_attivazione)
                  ORDER BY c.data_attivazione DESC,
                           c.id DESC
                  FOR UPDATE
                  LIMIT 1;

                  ----------------------------------------------------------------
                  -- Se non c'è nessun cliente da chiudere → primo cliente sul PDP
                  ----------------------------------------------------------------
                  IF v_cliente_precedente_id IS NULL THEN
                      RETURN NULL;
                  END IF;

                  ----------------------------------------------------------------
                  -- Chiusura del cliente precedente:
                  --   - data_chiusura = p_data_attivazione - 1 giorno
                  --   - stato_cliente  = CH
                  --
                  -- I trigger sulla tabella clienti si occupano di:
                  --   - normalizzare periodo (trg_clienti_set_periodo)
                  --   - aggiornare storico, stato PDP, ecc.
                  ----------------------------------------------------------------
                  UPDATE anagrafiche.clienti c
                     SET data_chiusura   = p_data_attivazione - INTERVAL '1 day',
                         stato_cliente_id = v_stato_chiuso_id
                   WHERE c.id = v_cliente_precedente_id;

                  RETURN v_cliente_precedente_id;
              END;
              $function$;

              CREATE OR REPLACE FUNCTION script.trgfn_delete_block_by_guc()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              BEGIN
                  -- Guard: argomento trigger obbligatorio
                  IF TG_NARGS < 1 THEN
                      PERFORM script.fn_log_and_raise_error(
                          TG_TABLE_SCHEMA,
                          TG_NAME,
                          'ERRORE_PARAMETRI',
                          jsonb_build_object(
                              'detail', 'Argomenti trigger mancanti',
                              'expected', 'guc_key',
                              'found', TG_NARGS
                          ),
                          NULL::uuid,
                          concat('TG_ARGV[0] (guc_key) mancante per trigger ', TG_NAME)
                      );
                  END IF;

                  -- Se la GUC e' abilitata → consente DELETE
                  IF current_setting(TG_ARGV[0], true) = 'on' THEN
                      RETURN OLD;
                  END IF;

                  -- Delete bloccata da policy
                  PERFORM script.fn_log_and_raise_error(
                      TG_TABLE_SCHEMA,
                      TG_NAME,
                      'E_DELETE_NOT_ALLOWED',
                      jsonb_build_object(
                          'table', TG_TABLE_SCHEMA || '.' || TG_TABLE_NAME,
                          'id', OLD.id
                      ),
                      NULL::uuid,
                      TG_TABLE_SCHEMA || '.' || TG_TABLE_NAME,
                      OLD.id::text
                  );

                  RETURN OLD;
              END;
              $function$;

              CREATE OR REPLACE FUNCTION script.trgfn_guard_utility_tipo_ruolo_by_cols()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_utility_col        TEXT;
                  v_soggetto_ruolo_col TEXT;
                  v_utility_txt        TEXT;
                  v_soggetto_ruolo_txt TEXT;
                  v_utility_id         config.utilities.id%TYPE;
                  v_soggetto_ruolo_id  anagrafiche.soggetti_ruoli.id%TYPE;
                  v_tipo_ruolo_id      config.tipi_ruoli.id%TYPE;
              BEGIN
                  -- Guard: argomenti trigger
                  IF TG_NARGS <> 2 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          'script.trgfn_guard_utility_tipo_ruolo_by_cols',
                          'ERRORE_PARAMETRI',
                          jsonb_build_object(
                              'detail', 'Sono richiesti 2 argomenti trigger: utility_col, soggetto_ruolo_col',
                              'tg_nargs', TG_NARGS,
                              'trigger', TG_NAME
                          ),
                          NULL::uuid,
                          concat('Argomenti trigger non validi per ', TG_NAME, ': TG_NARGS=', TG_NARGS::text)
                      );
                  END IF;

                  v_utility_col := TG_ARGV[0];
                  v_soggetto_ruolo_col := TG_ARGV[1];

                  -- Estrai valori dal record NEW via jsonb
                  v_utility_txt := to_jsonb(NEW) ->> v_utility_col;
                  v_soggetto_ruolo_txt := to_jsonb(NEW) ->> v_soggetto_ruolo_col;

                  -- Se i valori non sono presenti non forziamo il controllo
                  IF v_utility_txt IS NULL OR v_soggetto_ruolo_txt IS NULL THEN
                      RETURN NEW;
                  END IF;

                  -- Cast a tipi numerici
                  BEGIN
                      v_utility_id := v_utility_txt::integer;
                      v_soggetto_ruolo_id := v_soggetto_ruolo_txt::bigint;
                  EXCEPTION
                      WHEN OTHERS THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database',
                              'script.trgfn_guard_utility_tipo_ruolo_by_cols',
                              'ERRORE_PARAMETRI',
                              jsonb_build_object(
                                  'detail', 'Valori colonna non castabili a ID',
                                  'utility_col', v_utility_col,
                                  'utility_value', v_utility_txt,
                                  'soggetto_ruolo_col', v_soggetto_ruolo_col,
                                  'soggetto_ruolo_value', v_soggetto_ruolo_txt
                              ),
                              NULL::uuid,
                              concat(
                                  'Valori non validi per guard utility/tipo_ruolo: ',
                                  v_utility_col, '=', coalesce(v_utility_txt, 'NULL'),
                                  ', ',
                                  v_soggetto_ruolo_col, '=', coalesce(v_soggetto_ruolo_txt, 'NULL')
                              )
                          );
                  END;

                  -- Recupera tipo_ruolo_id dal soggetto_ruolo
                  SELECT sr.tipo_ruolo_id
                    INTO v_tipo_ruolo_id
                    FROM anagrafiche.soggetti_ruoli sr
                   WHERE sr.id = v_soggetto_ruolo_id;

                  IF v_tipo_ruolo_id IS NULL THEN
                      -- Fix: E_GENERICO → E_CODICE
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          'script.trgfn_guard_utility_tipo_ruolo_by_cols',
                          'E_CODICE',
                          jsonb_build_object(
                              'soggetto_ruolo_id', v_soggetto_ruolo_id,
                              'table', concat(TG_TABLE_SCHEMA, '.', TG_TABLE_NAME)
                          ),
                          NULL::uuid,
                          v_soggetto_ruolo_id::text, 'anagrafiche.soggetti_ruoli'
                      );
                  END IF;

                  -- Delega validazione utility ↔ tipo_ruolo
                  PERFORM script.fn_guard_utility_tipo_ruolo(
                      p_utility_id    => v_utility_id,
                      p_tipo_ruolo_id => v_tipo_ruolo_id,
                      p_context       => concat(TG_TABLE_SCHEMA, '.', TG_TABLE_NAME, ' ', TG_OP)
                  );

                  RETURN NEW;
              END;
              $function$;

              CREATE OR REPLACE FUNCTION vendite.fn_documento_lineage(p_tipo_id bigint, p_uid text, p_direzione text DEFAULT 'avanti'::text)
               RETURNS TABLE(livello integer, ordine integer, arco text, ruolo character varying, from_tipo_id bigint, from_uid text, from_codice text, to_tipo_id bigint, to_uid text, to_codice text, to_stato_codice_interno character varying, to_fase character varying, to_is_abortito boolean, is_ramo_inverso boolean)
               LANGUAGE plpgsql
               STABLE
              AS $function$
              BEGIN
                  -- Guard parametri (AGENTS: ID numerici NOT NULL e > 0).
                  IF p_tipo_id IS NULL OR p_tipo_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'vendite.fn_documento_lineage', 'ERRORE_PARAMETRI',
                          jsonb_build_object('detail', 'p_tipo_id obbligatorio e > 0',
                                             'p_tipo_id', p_tipo_id),
                          NULL::uuid,
                          concat('p_tipo_id non valido: ', COALESCE(p_tipo_id::text, 'NULL')));
                  END IF;

                  IF p_uid IS NULL OR btrim(p_uid) = '' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'vendite.fn_documento_lineage', 'ERRORE_PARAMETRI',
                          jsonb_build_object('detail', 'p_uid obbligatorio (chiave nodo)'),
                          NULL::uuid,
                          'p_uid non valido (NULL o vuoto)');
                  END IF;

                  IF p_direzione IS NULL OR p_direzione NOT IN ('avanti', 'indietro') THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'vendite.fn_documento_lineage', 'ERRORE_PARAMETRI',
                          jsonb_build_object('detail', 'p_direzione deve essere avanti|indietro',
                                             'p_direzione', p_direzione),
                          NULL::uuid,
                          concat('p_direzione non valido: ', COALESCE(p_direzione, 'NULL')));
                  END IF;

                  RETURN QUERY
                  WITH RECURSIVE trav AS (
                      -- Livello 1: archi adiacenti al nodo di partenza nella direzione scelta.
                      SELECT a.from_tipo_id, a.from_uid, a.from_codice,
                             a.to_tipo_id, a.to_uid, a.to_codice,
                             a.to_stato_codice_interno, a.to_fase, a.to_is_abortito,
                             a.ruolo, a.arco,
                             1 AS livello,
                             CASE WHEN p_direzione = 'avanti' THEN a.to_tipo_id ELSE a.from_tipo_id END AS cur_tipo,
                             CASE WHEN p_direzione = 'avanti' THEN a.to_uid    ELSE a.from_uid    END AS cur_uid,
                             ARRAY[
                                 p_tipo_id::text || ':' || p_uid,
                                 (CASE WHEN p_direzione = 'avanti' THEN a.to_tipo_id ELSE a.from_tipo_id END)::text
                                     || ':' ||
                                 (CASE WHEN p_direzione = 'avanti' THEN a.to_uid ELSE a.from_uid END)
                             ] AS visited
                        FROM vendite.vw_documento_lineage_archi a
                       WHERE (p_direzione = 'avanti'   AND a.from_tipo_id = p_tipo_id AND a.from_uid = p_uid)
                          OR (p_direzione = 'indietro' AND a.to_tipo_id   = p_tipo_id AND a.to_uid   = p_uid)
                      UNION ALL
                      -- Espansione: dal nodo corrente segui gli archi nella stessa direzione.
                      SELECT a.from_tipo_id, a.from_uid, a.from_codice,
                             a.to_tipo_id, a.to_uid, a.to_codice,
                             a.to_stato_codice_interno, a.to_fase, a.to_is_abortito,
                             a.ruolo, a.arco,
                             t.livello + 1,
                             CASE WHEN p_direzione = 'avanti' THEN a.to_tipo_id ELSE a.from_tipo_id END,
                             CASE WHEN p_direzione = 'avanti' THEN a.to_uid    ELSE a.from_uid    END,
                             t.visited || (
                                 (CASE WHEN p_direzione = 'avanti' THEN a.to_tipo_id ELSE a.from_tipo_id END)::text
                                     || ':' ||
                                 (CASE WHEN p_direzione = 'avanti' THEN a.to_uid ELSE a.from_uid END)
                             )
                        FROM trav t
                        JOIN vendite.vw_documento_lineage_archi a
                          ON (p_direzione = 'avanti'   AND a.from_tipo_id = t.cur_tipo AND a.from_uid = t.cur_uid)
                          OR (p_direzione = 'indietro' AND a.to_tipo_id   = t.cur_tipo AND a.to_uid   = t.cur_uid)
                       WHERE t.livello < 10
                         AND NOT (
                             (CASE WHEN p_direzione = 'avanti' THEN a.to_tipo_id ELSE a.from_tipo_id END)::text
                                 || ':' ||
                             (CASE WHEN p_direzione = 'avanti' THEN a.to_uid ELSE a.from_uid END)
                         ) = ANY (t.visited)
                  )
                  -- Cast espliciti al tipo dichiarato dalla RETURNS TABLE: la union di
                  -- vw_documento_lineage_nodi.codice risolve a varchar, quindi from_codice/
                  -- to_codice arrivano varchar mentre la firma li vuole text (PG e' rigido
                  -- sul match esatto, SQLSTATE 42804).
                  SELECT t.livello::integer,
                         (ROW_NUMBER() OVER (ORDER BY t.livello,
                                                      t.from_tipo_id, t.from_uid,
                                                      t.to_tipo_id, t.to_uid))::integer AS ordine,
                         t.arco::text, t.ruolo::varchar,
                         t.from_tipo_id, t.from_uid::text, t.from_codice::text,
                         t.to_tipo_id, t.to_uid::text, t.to_codice::text,
                         t.to_stato_codice_interno::varchar, t.to_fase::varchar, t.to_is_abortito,
                         (t.arco = 'R') AS is_ramo_inverso
                    FROM trav t
                   ORDER BY ordine;
              END;
              $function$;
