# Liquibase changelog per Zero ERP
# Trigger function pratiche.trgfn_note_pratiche_giornale
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/pratiche/20260303-39-create-trgfn-note-pratiche-giornale-mctit.yaml

  - changeSet:
      id: 20260303-39-create-trgfn-note-pratiche-giornale
      author: mctit
      runOnChange: false
      comment: "Logga NOTA_AGGIUNTA nel giornale su INSERT nota pratica."
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION pratiche.trgfn_note_pratiche_giornale()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Registra NOTA_AGGIUNTA nel giornale a livello pratica.
                --   Trigger AFTER INSERT su pratiche.note_pratiche.
                --
                -- Dettaglio:
                --   flusso_id e' NULL perche' la nota e' a livello pratica.
                -- =========================================================

                INSERT INTO pratiche.giornale
                  (pratica_id, flusso_id, azione, origine, dettaglio, tx_id)
                VALUES (
                  NEW.pratica_id,
                  NULL,
                  'NOTA_AGGIUNTA',
                  'SISTEMA',
                  jsonb_build_object(
                    'nota_id', NEW.id,
                    'tipo_nota_id', NEW.tipo_nota_id
                  ),
                  NEW.tx_id
                );
                RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION pratiche.trgfn_note_pratiche_giornale()
                IS 'AFTER INSERT su note_pratiche: logga NOTA_AGGIUNTA nel giornale.';
