# Aggancio documento->flusso (brief-db-aggancio-documento-flusso, 2026-06-16).
#
# trgfn_pratiche_sorgenti_guard_coerenza_flusso + trigger
# trg_pratiche_sorgenti_a10_guard_coerenza_flusso_ins_upd:
# quando flusso_id e' valorizzato, il flusso deve appartenere alla STESSA
# pratica del link (pratiche.flussi.pratica_id = NEW.pratica_id). La FK
# garantisce solo che flusso_id punti a un flusso esistente, non che sia il
# flusso della pratica giusta: senza questo guard una scrittura buggy potrebbe
# agganciare il ROOT al flusso di un'altra pratica (denormalizzazione
# pratica_id/flusso_id divergente).
#
# Un CHECK non puo' fare subquery cross-tabella -> guard trigger fail-fast.
# Scatta solo se flusso_id IS NOT NULL: i link COLLEGATO (flusso_id NULL) non
# sono toccati. Se il flusso non esiste, RETURN NEW e lascia sollevare la FK
# (errore corretto, non mascherato dal guard).
# Codice errore: PRATICHE_SORGENTI_FLUSSO_PRATICA_INCOERENTE (seed 20260616-06).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/pratiche/20260616-05-create-trgfn-pratiche-sorgenti-guard-coerenza-flusso-mctit.yaml

  - changeSet:
      id: 20260616-05-create-trgfn-pratiche-sorgenti-guard-coerenza-flusso
      author: mctit
      # ⚠️ Era `true`: con validCheckSums ANY il checksum e' sempre "cambiato",
      #   quindi il changeSet ri-eseguiva a OGNI invocazione di liquibase. In CI
      #   ce ne sono due (--contexts="!provision" poi --contexts=ci_apply) e la
      #   seconda rimetteva questo corpo SOPRA le revisioni piu' recenti, che
      #   sono runOnChange:false e non ri-eseguono. Su dev non si vedeva: una
      #   sola invocazione. Non rimetterlo a true (2026-08-06).
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        trgfn_pratiche_sorgenti_guard_coerenza_flusso + trigger BEFORE INSERT
        OR UPDATE OF flusso_id, pratica_id: il flusso del link deve appartenere
        alla stessa pratica del link.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION pratiche.trgfn_pratiche_sorgenti_guard_coerenza_flusso()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              -- Scopo: garantire che il flusso d'origine del link (flusso_id)
              --   appartenga alla stessa pratica del link. flusso_id ancora il
              --   ROOT documento->flusso (brief-db-aggancio-documento-flusso):
              --   deve essere un flusso DI quella pratica.
              -- Regole:
              --   1. Scatta solo se flusso_id e' valorizzato (COLLEGATO -> NULL,
              --      non vincolati).
              --   2. Se il flusso non esiste, RETURN NEW: la FK
              --      fk_pratiche_sorgenti_flusso solleva l'errore corretto.
              --   3. Se la pratica del flusso differisce da NEW.pratica_id ->
              --      errore parlante.
              DECLARE
                  v_flusso_pratica_id pratiche.flussi.pratica_id%TYPE;
              BEGIN
                  -- (1) Solo link agganciati a un flusso.
                  IF NEW.flusso_id IS NULL THEN
                      RETURN NEW;
                  END IF;

                  SELECT f.pratica_id INTO v_flusso_pratica_id
                    FROM pratiche.flussi f
                   WHERE f.id = NEW.flusso_id;

                  -- (2) Flusso inesistente: lascia decidere la FK.
                  IF NOT FOUND THEN
                      RETURN NEW;
                  END IF;

                  -- (3) Coerenza pratica del flusso = pratica del link.
                  IF v_flusso_pratica_id IS DISTINCT FROM NEW.pratica_id THEN
                      PERFORM script.fn_log_and_raise_error(
                          'pratiche',
                          'pratiche.trgfn_pratiche_sorgenti_guard_coerenza_flusso',
                          'PRATICHE_SORGENTI_FLUSSO_PRATICA_INCOERENTE',
                          jsonb_build_object(
                              'pratica_id', NEW.pratica_id,
                              'flusso_id', NEW.flusso_id,
                              'flusso_pratica_id', v_flusso_pratica_id,
                              'ruolo_link', NEW.ruolo_link
                          ),
                          NEW.tx_id,
                          NEW.flusso_id::text
                      );
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION pratiche.trgfn_pratiche_sorgenti_guard_coerenza_flusso()
              IS 'BEFORE INSERT/UPDATE OF flusso_id,pratica_id su pratiche_sorgenti: se flusso_id e'' valorizzato, il flusso deve appartenere alla stessa pratica del link. Flusso inesistente -> lascia sollevare la FK (brief-db-aggancio-documento-flusso).';

              DROP TRIGGER IF EXISTS trg_pratiche_sorgenti_a10_guard_coerenza_flusso_ins_upd
                ON pratiche.pratiche_sorgenti;

              CREATE TRIGGER trg_pratiche_sorgenti_a10_guard_coerenza_flusso_ins_upd
                BEFORE INSERT OR UPDATE OF flusso_id, pratica_id
                ON pratiche.pratiche_sorgenti
                FOR EACH ROW
                EXECUTE FUNCTION pratiche.trgfn_pratiche_sorgenti_guard_coerenza_flusso();

      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_pratiche_sorgenti_a10_guard_coerenza_flusso_ins_upd
                ON pratiche.pratiche_sorgenti;
              DROP FUNCTION IF EXISTS pratiche.trgfn_pratiche_sorgenti_guard_coerenza_flusso();
