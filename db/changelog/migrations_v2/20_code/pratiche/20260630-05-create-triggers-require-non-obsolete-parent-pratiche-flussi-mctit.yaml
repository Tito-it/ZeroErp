# Cablaggio (wiring) del guard OBSOLETO sui due consumatori attuali.
# (brief-db-obsoleto-dal-filtro-lookup-e-guard, Obiettivo 2, 2026-06-30)
#
# Usa la trigger function GENERICA dbops.trgfn_child_requires_non_obsolete_parent
# (20260630-04), gemella della REQUIRE-ATTIVO. Tier 2: il "cervello" e' una sola
# funzione; qui ci sono solo i "fili sottili", un CREATE TRIGGER per relazione.
# Aggiungere un nuovo catalogo (es. config.iva) domani = un altro CREATE TRIGGER,
# zero logica nuova.
#
# Timing AFTER INSERT OR UPDATE OF <fk>, in parallelo ai trigger REQUIRE-ATTIVO
# gia' presenti su queste tabelle (trg_*_require_attivo_*): AFTER per leggere la
# FK gia' finale (dopo i BEFORE trigger che potrebbero valorizzarla); UPDATE OF
# <fk> per non scattare sugli avanzamenti di lifecycle (cambio stato, ecc.) che
# non ri-puntano il catalogo. La trgfn salta comunque l'UPDATE se la FK non cambia.
#
# Relazioni cablate:
#   pratiche.pratiche.tipo_prestazione_id -> pratiche.tipi_prestazione(id)
#   pratiche.flussi.template_flusso_id    -> pratiche.template_flussi(id)
# Entrambi i cataloghi hanno obsoleto_dal (20260630-01).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/pratiche/20260630-05-create-triggers-require-non-obsolete-parent-pratiche-flussi-mctit.yaml

  - changeSet:
      id: 20260630-05-create-triggers-require-non-obsolete-parent-pratiche-flussi
      author: mctit
      runOnChange: false
      comment: >
        Wiring guard OBSOLETO: trigger AFTER INSERT OR UPDATE OF fk_catalogo su
        pratiche.pratiche (tipo_prestazione_id) e pratiche.flussi
        (template_flusso_id), entrambi via dbops.trgfn_child_requires_non_obsolete_parent.
        Vieta nuove istanze su un catalogo con obsoleto_dal <= CURRENT_DATE.
      preConditions:
        - onFail: HALT
        - and:
            - columnExists:
                schemaName: pratiche
                tableName: tipi_prestazione
                columnName: obsoleto_dal
            - columnExists:
                schemaName: pratiche
                tableName: template_flussi
                columnName: obsoleto_dal
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |

              -- pratiche.pratiche -> pratiche.tipi_prestazione(id)
              DROP TRIGGER IF EXISTS trg_pratiche_a10_tipi_prestazione_require_non_obsoleto_ins_upd
                ON pratiche.pratiche;

              CREATE TRIGGER trg_pratiche_a10_tipi_prestazione_require_non_obsoleto_ins_upd
                AFTER INSERT OR UPDATE OF tipo_prestazione_id
                ON pratiche.pratiche
                FOR EACH ROW
                EXECUTE FUNCTION dbops.trgfn_child_requires_non_obsolete_parent(
                  'pratiche', 'tipi_prestazione', 'obsoleto_dal', 'tipo_prestazione_id', 'id'
                );

              COMMENT ON TRIGGER trg_pratiche_a10_tipi_prestazione_require_non_obsoleto_ins_upd
                ON pratiche.pratiche
                IS 'Guard OBSOLETO: vieta nuove pratiche (o ri-collegamento) su un tipo_prestazione con obsoleto_dal <= CURRENT_DATE. Le pratiche esistenti e i loro avanzamenti di stato non sono toccati.';

              -- pratiche.flussi -> pratiche.template_flussi(id)
              DROP TRIGGER IF EXISTS trg_flussi_a10_template_flussi_require_non_obsoleto_ins_upd
                ON pratiche.flussi;

              CREATE TRIGGER trg_flussi_a10_template_flussi_require_non_obsoleto_ins_upd
                AFTER INSERT OR UPDATE OF template_flusso_id
                ON pratiche.flussi
                FOR EACH ROW
                EXECUTE FUNCTION dbops.trgfn_child_requires_non_obsolete_parent(
                  'pratiche', 'template_flussi', 'obsoleto_dal', 'template_flusso_id', 'id'
                );

              COMMENT ON TRIGGER trg_flussi_a10_template_flussi_require_non_obsoleto_ins_upd
                ON pratiche.flussi
                IS 'Guard OBSOLETO: vieta nuovi flussi (o ri-collegamento) su un template_flusso con obsoleto_dal <= CURRENT_DATE. I flussi esistenti e i loro avanzamenti di stato non sono toccati.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_flussi_a10_template_flussi_require_non_obsoleto_ins_upd ON pratiche.flussi;
              DROP TRIGGER IF EXISTS trg_pratiche_a10_tipi_prestazione_require_non_obsoleto_ins_upd ON pratiche.pratiche;
