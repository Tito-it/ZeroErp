# Liquibase changelog per Zero ERP
# Trigger function pratiche.trgfn_pratiche_giornale_assegnazione
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/pratiche/20260303-35-create-trgfn-pratiche-giornale-assegnazione-mctit.yaml

  - changeSet:
      id: 20260303-35-create-trgfn-pratiche-giornale-assegnazione
      author: mctit
      runOnChange: false
      comment: "Logga ASSEGNAZIONE_CAMBIATA nel giornale su UPDATE risorsa/UO."
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION pratiche.trgfn_pratiche_giornale_assegnazione()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Registra ASSEGNAZIONE_CAMBIATA nel giornale.
                --   Trigger AFTER UPDATE OF risorsa_umana_id, unita_organizzativa_id
                --   su pratiche.pratiche.
                --
                -- Dettaglio:
                --   Cattura valori precedenti e nuovi di risorsa_umana_id
                --   e unita_organizzativa_id.
                -- =========================================================

                INSERT INTO pratiche.giornale
                  (pratica_id, flusso_id, azione, origine, dettaglio, tx_id)
                VALUES (
                  NEW.id,
                  NULL,
                  'ASSEGNAZIONE_CAMBIATA',
                  'SISTEMA',
                  jsonb_build_object(
                    'risorsa_umana_precedente_id', OLD.risorsa_umana_id,
                    'risorsa_umana_nuova_id', NEW.risorsa_umana_id,
                    'unita_organizzativa_precedente_id', OLD.unita_organizzativa_id,
                    'unita_organizzativa_nuova_id', NEW.unita_organizzativa_id
                  ),
                  NEW.tx_id
                );
                RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION pratiche.trgfn_pratiche_giornale_assegnazione()
                IS 'AFTER UPDATE su pratiche: logga ASSEGNAZIONE_CAMBIATA quando risorsa/UO cambia.';
