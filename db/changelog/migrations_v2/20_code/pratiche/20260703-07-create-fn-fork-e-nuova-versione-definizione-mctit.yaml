# ------------------------------------------------------------
# fn_fork_definizione + fn_nuova_versione_definizione (D2-11/D2-12, Fase 2).
# (brief-db-step-dominio-e-definizioni-versionate Parte 2 / Fase 2)
# Wrapper sottili sul motore fn_copia_definizione (20260703-06):
#
#   fn_fork_definizione(sorgente, emittente): crea l'edizione di UN EMITTENTE a
#     partire da una definizione (tipicamente il preset). provenance=true ->
#     preset_origine_id/versione_origine valorizzati (drift). Guard: emittente
#     NOT NULL (il fork ha per definizione uno scope emittente; per una nuova
#     versione dello stesso scope usare fn_nuova_versione_definizione).
#
#   fn_nuova_versione_definizione(sorgente): crea una nuova versione BOZZA nello
#     STESSO scope della sorgente (stesso emittente, preset incluso).
#     provenance=false -> nessuna provenance (non e' un fork). Serve per
#     modificare in sicurezza un'edizione gia' PUBBLICATA (bozza -> modifica ->
#     pubblica, che RITIRA la precedente — vedi fn_pubblica_definizione).
#
# Entrambe ritornano l'id della nuova edizione BOZZA.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/pratiche/20260703-07-create-fn-fork-e-nuova-versione-definizione-mctit.yaml

  - changeSet:
      id: 20260703-07-create-fn-fork-e-nuova-versione-definizione
      author: mctit
      runOnChange: false
      comment: >
        fn_fork_definizione(sorgente, emittente) e
        fn_nuova_versione_definizione(sorgente): wrapper di fn_copia_definizione
        (fork con provenance / nuova versione stesso scope).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'pratiche' AND p.proname = 'fn_copia_definizione';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- FORK: nuova edizione per uno scope EMITTENTE (provenance).
              CREATE OR REPLACE FUNCTION pratiche.fn_fork_definizione(
                  p_definizione_id       pratiche.workflow_definizioni.id%TYPE,
                  p_emittente_fiscale_id pratiche.workflow_definizioni.emittente_fiscale_id%TYPE
              )
              RETURNS pratiche.workflow_definizioni.id%TYPE
              LANGUAGE plpgsql
              VOLATILE
              AS $function$
              -- Scopo: creare l'edizione di un emittente a partire da una
              --        definizione (di solito il preset), con provenance per il
              --        rilevamento drift. Wrapper di fn_copia_definizione.
              BEGIN
                IF p_emittente_fiscale_id IS NULL OR p_emittente_fiscale_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'pratiche', 'pratiche.fn_fork_definizione', 'E_PARAMETRO_INVALIDO',
                    jsonb_build_object('parametro','p_emittente_fiscale_id',
                                       'valore',p_emittente_fiscale_id),
                    NULL::uuid,
                    'il fork richiede un emittente valido; per una nuova versione dello stesso scope usare fn_nuova_versione_definizione');
                END IF;

                RETURN pratiche.fn_copia_definizione(p_definizione_id, p_emittente_fiscale_id, true);
              END;
              $function$;

              COMMENT ON FUNCTION pratiche.fn_fork_definizione(integer, bigint)
                IS 'Crea l''edizione di un emittente a partire da una definizione (di solito il preset), in stato BOZZA, con provenance (preset_origine_id/versione_origine) per il drift. Wrapper di fn_copia_definizione(..., true). Guard: emittente NOT NULL.';

              -- NUOVA VERSIONE: nuova BOZZA nello STESSO scope della sorgente.
              CREATE OR REPLACE FUNCTION pratiche.fn_nuova_versione_definizione(
                  p_definizione_id pratiche.workflow_definizioni.id%TYPE
              )
              RETURNS pratiche.workflow_definizioni.id%TYPE
              LANGUAGE plpgsql
              VOLATILE
              AS $function$
              -- Scopo: creare una nuova versione BOZZA nello stesso scope della
              --        sorgente (stesso emittente, preset incluso). Per modificare
              --        in sicurezza un'edizione gia' pubblicata.
              DECLARE
                v_emittente pratiche.workflow_definizioni.emittente_fiscale_id%TYPE;
                v_found     boolean;
              BEGIN
                SELECT wd.emittente_fiscale_id, true
                  INTO v_emittente, v_found
                  FROM pratiche.workflow_definizioni wd
                 WHERE wd.id = p_definizione_id;

                IF v_found IS NOT TRUE THEN
                  PERFORM script.fn_log_and_raise_error(
                    'pratiche', 'pratiche.fn_nuova_versione_definizione', 'E_VALORE_MANCANTE',
                    jsonb_build_object('definizione_sorgente_id', p_definizione_id),
                    NULL::uuid, concat('workflow_definizioni id ', p_definizione_id));
                END IF;

                RETURN pratiche.fn_copia_definizione(p_definizione_id, v_emittente, false);
              END;
              $function$;

              COMMENT ON FUNCTION pratiche.fn_nuova_versione_definizione(integer)
                IS 'Crea una nuova versione BOZZA nello stesso scope (tipo+emittente) della definizione sorgente, senza provenance. Per modificare in sicurezza un''edizione pubblicata (bozza -> modifica -> fn_pubblica_definizione, che ritira la precedente). Wrapper di fn_copia_definizione(..., false).';

      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS pratiche.fn_nuova_versione_definizione(integer);
              DROP FUNCTION IF EXISTS pratiche.fn_fork_definizione(integer, bigint);
