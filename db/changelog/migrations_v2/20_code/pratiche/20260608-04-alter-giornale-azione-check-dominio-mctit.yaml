# B-NEW (1/2) — apertura giornale agli eventi di dominio DOMINIO_*.
# pratiche.giornale.azione ha un CHECK whitelist (11 eventi di motore).
# Per i log applicativi di dominio (DOMINIO_COMMESSA_CREATA,
# DOMINIO_PREVENTIVO_EVASO, ...) si sostituisce la whitelist con:
#   azione IN (<11 eventi di motore, INALTERATI>)
#   OR azione ~ '^DOMINIO_[A-Z][A-Z0-9_]*$'
# Gli 11 eventi di motore restano blindati; i DOMINIO_* sono ammessi
# senza una nuova migration per evento.
# Costo accettato: nessuna protezione dai refusi sui DOMINIO_* (mitigazione:
# elencarli nel catalogo BB; rivalutare promozione a tabella config dopo
# 3-4 eventi reali).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/pratiche/20260608-04-alter-giornale-azione-check-dominio-mctit.yaml

  - changeSet:
      id: 20260608-04-alter-giornale-azione-check-dominio
      author: mctit
      comment: >
        Sostituisce chk_giornale_azione: whitelist 11 eventi di motore
        (inalterata) OR regex DOMINIO_* per gli eventi di dominio applicativi.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: true
            sql: |
              ALTER TABLE pratiche.giornale
                DROP CONSTRAINT chk_giornale_azione;

              ALTER TABLE pratiche.giornale
                ADD CONSTRAINT chk_giornale_azione
                CHECK (
                  azione IN (
                    'PRATICA_CREATA', 'STATO_CAMBIATO', 'ASSEGNAZIONE_CAMBIATA',
                    'PRIORITA_CAMBIATA', 'FLUSSO_CREATO', 'FLUSSO_STATO_CAMBIATO',
                    'NOTA_AGGIUNTA', 'ALLEGATO_AGGIUNTO', 'PRATICA_GENERATA',
                    'SOSPENSIONE_REGISTRATA', 'SOSPENSIONE_CHIUSA'
                  )
                  OR azione ~ '^DOMINIO_[A-Z][A-Z0-9_]*$'
                );

      rollback:
        - sql:
            dbms: postgresql
            splitStatements: true
            sql: |
              ALTER TABLE pratiche.giornale
                DROP CONSTRAINT chk_giornale_azione;

              ALTER TABLE pratiche.giornale
                ADD CONSTRAINT chk_giornale_azione
                CHECK (azione IN (
                  'PRATICA_CREATA', 'STATO_CAMBIATO', 'ASSEGNAZIONE_CAMBIATA',
                  'PRIORITA_CAMBIATA', 'FLUSSO_CREATO', 'FLUSSO_STATO_CAMBIATO',
                  'NOTA_AGGIUNTA', 'ALLEGATO_AGGIUNTO', 'PRATICA_GENERATA',
                  'SOSPENSIONE_REGISTRATA', 'SOSPENSIONE_CHIUSA'
                ));
