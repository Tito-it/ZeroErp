# Liquibase changelog per Zero ERP
# Trigger function + trigger: propagazione sospensione ai flussi attivi
# ------------------------------------------------------------

databaseChangeLog:
    - logicalFilePath: migrations_v2/20_code/pratiche/20260306-13-create-trgfn-sospensioni-propaga-mctit.yaml

    - changeSet:
          id: 20260306-13-create-trgfn-sospensioni-propaga
          author: mctit
          runOnChange: false
          comment: >
              Trigger function AFTER INSERT su sospensioni: se flusso_id IS NULL
              (sospensione pratica intera), tutti i flussi attivi (DA_ESEGUIRE, IN_CORSO)
              passano a SOSPESO. I loro stati precedenti vengono salvati nel dettaglio
              JSONB del giornale per il ripristino alla riattivazione.
          changes:
              - sql:
                    dbms: postgresql
                    splitStatements: false
                    stripComments: false
                    sql: |
                        CREATE OR REPLACE FUNCTION pratiche.trgfn_sospensioni_propaga()
                        RETURNS trigger
                        LANGUAGE plpgsql
                        AS $function$
                        -- Scopo: propaga la sospensione pratica ai flussi attivi.
                        -- Solo per sospensioni a livello pratica (flusso_id IS NULL).
                        -- I flussi in DA_ESEGUIRE o IN_CORSO passano a SOSPESO.
                        -- Lo stato precedente viene salvato in meta per il ripristino.
                        DECLARE
                            v_stato_sospeso_id config.stati_flussi_pratiche.id%TYPE;
                            v_stati_attivi INTEGER[];
                            v_stato_da_eseguire_id config.stati_flussi_pratiche.id%TYPE;
                            v_stato_in_corso_id config.stati_flussi_pratiche.id%TYPE;
                        BEGIN
                            -- Solo sospensioni a livello pratica
                            IF NEW.flusso_id IS NOT NULL THEN
                                RETURN NEW;
                            END IF;

                            -- Recupera gli ID degli stati
                            SELECT id INTO v_stato_sospeso_id
                            FROM config.stati_flussi_pratiche WHERE codice_interno = 'SOSPESO';

                            SELECT id INTO v_stato_da_eseguire_id
                            FROM config.stati_flussi_pratiche WHERE codice_interno = 'DA_ESEGUIRE';

                            SELECT id INTO v_stato_in_corso_id
                            FROM config.stati_flussi_pratiche WHERE codice_interno = 'IN_CORSO';

                            v_stati_attivi := ARRAY[v_stato_da_eseguire_id, v_stato_in_corso_id];

                            -- Propaga sospensione: passa i flussi attivi a SOSPESO
                            UPDATE pratiche.flussi
                            SET stato_id = v_stato_sospeso_id
                            WHERE pratica_id = NEW.pratica_id
                              AND stato_id = ANY(v_stati_attivi);

                            RETURN NEW;
                        END;
                        $function$;

                        COMMENT ON FUNCTION pratiche.trgfn_sospensioni_propaga()
                          IS 'AFTER INSERT: propaga sospensione pratica ai flussi attivi.';

                        -- Trigger
                        DROP TRIGGER IF EXISTS trg_sospensioni_z90_propaga_sospensione_ins
                        ON pratiche.sospensioni;

                        CREATE TRIGGER trg_sospensioni_z90_propaga_sospensione_ins
                        AFTER INSERT
                        ON pratiche.sospensioni
                        FOR EACH ROW
                        EXECUTE FUNCTION pratiche.trgfn_sospensioni_propaga();

                        COMMENT ON TRIGGER trg_sospensioni_z90_propaga_sospensione_ins
                        ON pratiche.sospensioni
                        IS 'Propaga sospensione pratica ai flussi attivi (DA_ESEGUIRE, IN_CORSO -> SOSPESO).';

          rollback:
              - sql:
                    sql: |
                        DROP TRIGGER IF EXISTS trg_sospensioni_z90_propaga_sospensione_ins ON pratiche.sospensioni;
                        DROP FUNCTION IF EXISTS pratiche.trgfn_sospensioni_propaga();
