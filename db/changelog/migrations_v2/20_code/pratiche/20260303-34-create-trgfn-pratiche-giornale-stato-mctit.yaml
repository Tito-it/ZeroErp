# Liquibase changelog per Zero ERP
# Trigger function pratiche.trgfn_pratiche_giornale_stato
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/pratiche/20260303-34-create-trgfn-pratiche-giornale-stato-mctit.yaml

  - changeSet:
      id: 20260303-34-create-trgfn-pratiche-giornale-stato
      author: mctit
      runOnChange: false
      comment: "Logga STATO_CAMBIATO nel giornale su UPDATE stato pratica."
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION pratiche.trgfn_pratiche_giornale_stato()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Registra STATO_CAMBIATO nel giornale.
                --   Trigger AFTER UPDATE OF stato_id su pratiche.pratiche.
                --
                -- Dettaglio:
                --   Cattura stato_precedente e stato_nuovo nel jsonb.
                -- =========================================================

                INSERT INTO pratiche.giornale
                  (pratica_id, flusso_id, azione, origine, dettaglio, tx_id)
                VALUES (
                  NEW.id,
                  NULL,
                  'STATO_CAMBIATO',
                  'SISTEMA',
                  jsonb_build_object(
                    'stato_precedente_id', OLD.stato_id,
                    'stato_nuovo_id', NEW.stato_id
                  ),
                  NEW.tx_id
                );
                RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION pratiche.trgfn_pratiche_giornale_stato()
                IS 'AFTER UPDATE su pratiche: logga STATO_CAMBIATO quando stato_id cambia.';
