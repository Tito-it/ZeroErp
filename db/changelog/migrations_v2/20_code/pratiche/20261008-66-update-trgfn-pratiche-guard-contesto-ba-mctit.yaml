# IL BILLING ACCOUNT DELLA PRATICA E' DEL SUO RUOLO
#   pratiche.trgfn_pratiche_guard_contesto: regola 5; il trigger
#   trg_pratiche_a10_guard_contesto_ins_upd scatta anche su billing_account_id.
#   Brief: brief-db-istanza-nasce-col-ba (R-8, D-9)
#
# -- PERCHE' QUI ----------------------------------------------------
#   Il guard di contesto e' la sede della coerenza fra soggetto, ruolo e
#   istanza della pratica (regole 1-4). Il BA (20261008-63) e' un quinto
#   pezzo dello stesso contesto: un guard nuovo accanto sarebbe una seconda
#   sede della stessa regola.
#   Regola 5: con billing_account_id valorizzato, il suo soggetto_ruolo_id deve
#   essere quello della pratica (ruolo NULL compreso: e' incoerente). Il legame
#   BA <-> istanza lo tiene la FK composta, la presenza dell'istanza il CHECK.
#   Codice E_PRATICHE_BA_NON_COERENTE (DATO_ERRATO come le regole gemelle),
#   campo billing_account_id, VARIADIC il codice del BA.
#
# -- UPDATE OF ------------------------------------------------------
#   Nessun altro trigger BEFORE della tabella scrive billing_account_id:
#   UPDATE OF resta la forma giusta (linee-guida-trigger).
#
# -- IL CORPO -------------------------------------------------------
#   Preso dal DB vivo (pg_get_functiondef, ultimo changeSet 20260805-20
#   applicato), con le sole aggiunte della regola 5 e del commento di testa
#   (il «prospect puro» col ruolo che arriva dopo non esiste piu').
#
# Ritorno indietro: corpo e trigger del 20260805-20.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/pratiche/20261008-66-update-trgfn-pratiche-guard-contesto-ba-mctit.yaml

  - changeSet:
      id: 20261008-66-update-trgfn-pratiche-guard-contesto-ba
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        trgfn_pratiche_guard_contesto: regola 5, il billing account della pratica e' del suo ruolo
        (E_PRATICHE_BA_NON_COERENTE); il trigger scatta anche su billing_account_id. Brief: brief-
        db-istanza-nasce-col-ba (R-8, D-9).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION pratiche.trgfn_pratiche_guard_contesto()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: validare la coerenza del contesto anagrafico sulla pratica
              --        nel modello a DUE RAMI indipendenti dal soggetto:
              --            soggetto -> soggetto_ruolo   (pratiche su ruoli)
              --            soggetto -> istanza_utility  (pratiche pre-contrattuali)
              --        L'istanza puo' essere agganciata senza ruolo sulla pratica.
              --        ⚠️ rev 2026-10-08: non e' piu' un «prospect puro» — l'istanza
              --        nasce col suo billing account, e il ruolo CLIENTE con lui
              --        (brief-db-istanza-nasce-col-ba). Il BA della pratica
              --        (billing_account_id, aggancio a grana fine del cliente) e'
              --        del ruolo della pratica: regola 5.
              --        Tutti i campi sono opzionali (pratica interna = tutti NULL).
              -- Regole:
              --   1. soggetto_ruolo_id NOT NULL -> soggetto_id obbligatorio
              --   2. istanza_utility_id NOT NULL -> soggetto_id obbligatorio
              --   3. soggetto_ruolo_id deve appartenere a soggetto_id
              --   4. istanza_utility_id deve appartenere a soggetto_id
              --   5. billing_account_id deve essere del soggetto_ruolo_id
              --      (l'istanza la lega la FK composta, la presenza dell'istanza
              --      chk_pratiche_ba_con_istanza)
              DECLARE
                  v_soggetto_id_ruolo   anagrafiche.soggetti_ruoli.soggetto_id%TYPE;
                  v_soggetto_id_istanza anagrafiche.istanze_utilities.soggetto_id%TYPE;
                  v_ba_ruolo_id         anagrafiche.billing_account.soggetto_ruolo_id%TYPE;
                  v_ba_codice           anagrafiche.billing_account.codice%TYPE;
              BEGIN
                  -- Regola 1: ruolo richiede soggetto (ramo ruolo)
                  IF NEW.soggetto_ruolo_id IS NOT NULL AND NEW.soggetto_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'pratiche',
                          'pratiche.trgfn_pratiche_guard_contesto',
                          'E_PRATICHE_RUOLO_SENZA_SOGGETTO',
                          jsonb_build_object(
                              'soggetto_ruolo_id', NEW.soggetto_ruolo_id
                          ),
                          NULL::uuid,
                          NEW.soggetto_ruolo_id::text
                      );
                  END IF;

                  -- Regola 2: istanza richiede soggetto (ramo istanza, indipendente
                  --           dal ruolo). Sostituisce la vecchia regola istanza=>ruolo.
                  IF NEW.istanza_utility_id IS NOT NULL AND NEW.soggetto_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'pratiche',
                          'pratiche.trgfn_pratiche_guard_contesto',
                          'E_PRATICHE_ISTANZA_SENZA_SOGGETTO',
                          jsonb_build_object(
                              'istanza_utility_id', NEW.istanza_utility_id
                          ),
                          NULL::uuid,
                          NEW.istanza_utility_id::text
                      );
                  END IF;

                  -- Regola 3: ruolo deve appartenere al soggetto
                  IF NEW.soggetto_ruolo_id IS NOT NULL THEN
                      SELECT sr.soggetto_id INTO v_soggetto_id_ruolo
                        FROM anagrafiche.soggetti_ruoli sr
                       WHERE sr.id = NEW.soggetto_ruolo_id;

                      IF v_soggetto_id_ruolo IS NULL
                         OR v_soggetto_id_ruolo IS DISTINCT FROM NEW.soggetto_id THEN
                          PERFORM script.fn_log_and_raise_error(
                              'pratiche',
                              'pratiche.trgfn_pratiche_guard_contesto',
                              'E_PRATICHE_RUOLO_NON_COERENTE',
                              jsonb_build_object(
                                  'soggetto_ruolo_id', NEW.soggetto_ruolo_id,
                                  'soggetto_id', NEW.soggetto_id,
                                  'soggetto_id_ruolo', v_soggetto_id_ruolo
                              ),
                              NULL::uuid,
                              NEW.soggetto_ruolo_id::text,
                              NEW.soggetto_id::text
                          );
                      END IF;
                  END IF;

                  -- Regola 4: istanza deve appartenere al soggetto
                  IF NEW.istanza_utility_id IS NOT NULL THEN
                      SELECT iu.soggetto_id INTO v_soggetto_id_istanza
                        FROM anagrafiche.istanze_utilities iu
                       WHERE iu.id = NEW.istanza_utility_id;

                      IF v_soggetto_id_istanza IS NULL
                         OR v_soggetto_id_istanza IS DISTINCT FROM NEW.soggetto_id THEN
                          PERFORM script.fn_log_and_raise_error(
                              'pratiche',
                              'pratiche.trgfn_pratiche_guard_contesto',
                              'E_PRATICHE_ISTANZA_NON_COERENTE',
                              jsonb_build_object(
                                  'istanza_utility_id', NEW.istanza_utility_id,
                                  'soggetto_id', NEW.soggetto_id,
                                  'soggetto_id_istanza', v_soggetto_id_istanza
                              ),
                              NULL::uuid,
                              NEW.istanza_utility_id::text,
                              NEW.soggetto_id::text
                          );
                      END IF;
                  END IF;

                  -- Regola 5: il BA della pratica e' del ruolo della pratica.
                  --   Un ruolo NULL con un BA e' incoerente quanto un ruolo diverso:
                  --   il BA dice di quale cliente parla la pratica, il ruolo chi e'.
                  IF NEW.billing_account_id IS NOT NULL THEN
                      SELECT ba.soggetto_ruolo_id, ba.codice
                        INTO v_ba_ruolo_id, v_ba_codice
                        FROM anagrafiche.billing_account ba
                       WHERE ba.id = NEW.billing_account_id;

                      IF v_ba_ruolo_id IS NULL
                         OR v_ba_ruolo_id IS DISTINCT FROM NEW.soggetto_ruolo_id THEN
                          PERFORM script.fn_log_and_raise_error(
                              'pratiche',
                              'pratiche.trgfn_pratiche_guard_contesto',
                              'E_PRATICHE_BA_NON_COERENTE',
                              jsonb_build_object(
                                  'campo', 'billing_account_id',
                                  'billing_account_id', NEW.billing_account_id,
                                  'soggetto_ruolo_id', NEW.soggetto_ruolo_id,
                                  'soggetto_ruolo_id_ba', v_ba_ruolo_id
                              ),
                              NULL::uuid,
                              COALESCE(v_ba_codice::text, NEW.billing_account_id::text)
                          );
                      END IF;
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION pratiche.trgfn_pratiche_guard_contesto()
              IS 'BEFORE INSERT OR UPDATE su pratiche.pratiche: coerenza del contesto anagrafico (soggetto / soggetto_ruolo / istanza_utility / billing_account). Codici rinominati il 2026-08-05 (20260805-20): E_PRATICHE_RUOLO_SENZA_SOGGETTO (846), E_PRATICHE_RUOLO_NON_COERENTE (847), E_PRATICHE_ISTANZA_NON_COERENTE (848), E_PRATICHE_ISTANZA_SENZA_SOGGETTO (849). I vecchi nomi senza prefisso restano a catalogo, ritirati con obsoleto_dal. rev 2026-10-08 (20261008-66): regola 5, il billing account della pratica e'' del suo ruolo (E_PRATICHE_BA_NON_COERENTE); il trigger scatta anche su billing_account_id. Brief: brief-db-istanza-nasce-col-ba (R-8, D-9).';

              DROP TRIGGER IF EXISTS trg_pratiche_a10_guard_contesto_ins_upd ON pratiche.pratiche;

              CREATE TRIGGER trg_pratiche_a10_guard_contesto_ins_upd
                BEFORE INSERT OR UPDATE OF soggetto_id, soggetto_ruolo_id, istanza_utility_id, billing_account_id
                ON pratiche.pratiche
                FOR EACH ROW
                EXECUTE FUNCTION pratiche.trgfn_pratiche_guard_contesto();
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION pratiche.trgfn_pratiche_guard_contesto()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: validare la coerenza del contesto anagrafico sulla pratica
              --        nel modello a DUE RAMI indipendenti dal soggetto:
              --            soggetto -> soggetto_ruolo   (pratiche su ruoli)
              --            soggetto -> istanza_utility  (pratiche pre-contrattuali)
              --        L'istanza puo' essere agganciata senza alcun ruolo
              --        (prospect puro): l'istanza nasce prima del contratto, il
              --        ruolo CLIENTE arriva a valle con il billing account.
              --        Tutti i campi sono opzionali (pratica interna = tutti NULL).
              -- Regole:
              --   1. soggetto_ruolo_id NOT NULL -> soggetto_id obbligatorio
              --   2. istanza_utility_id NOT NULL -> soggetto_id obbligatorio
              --   3. soggetto_ruolo_id deve appartenere a soggetto_id
              --   4. istanza_utility_id deve appartenere a soggetto_id
              DECLARE
                  v_soggetto_id_ruolo   anagrafiche.soggetti_ruoli.soggetto_id%TYPE;
                  v_soggetto_id_istanza anagrafiche.istanze_utilities.soggetto_id%TYPE;
              BEGIN
                  -- Regola 1: ruolo richiede soggetto (ramo ruolo)
                  IF NEW.soggetto_ruolo_id IS NOT NULL AND NEW.soggetto_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'pratiche',
                          'pratiche.trgfn_pratiche_guard_contesto',
                          'E_PRATICHE_RUOLO_SENZA_SOGGETTO',
                          jsonb_build_object(
                              'soggetto_ruolo_id', NEW.soggetto_ruolo_id
                          ),
                          NULL::uuid,
                          NEW.soggetto_ruolo_id::text
                      );
                  END IF;

                  -- Regola 2: istanza richiede soggetto (ramo istanza, indipendente
                  --           dal ruolo). Sostituisce la vecchia regola istanza=>ruolo.
                  IF NEW.istanza_utility_id IS NOT NULL AND NEW.soggetto_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'pratiche',
                          'pratiche.trgfn_pratiche_guard_contesto',
                          'E_PRATICHE_ISTANZA_SENZA_SOGGETTO',
                          jsonb_build_object(
                              'istanza_utility_id', NEW.istanza_utility_id
                          ),
                          NULL::uuid,
                          NEW.istanza_utility_id::text
                      );
                  END IF;

                  -- Regola 3: ruolo deve appartenere al soggetto
                  IF NEW.soggetto_ruolo_id IS NOT NULL THEN
                      SELECT sr.soggetto_id INTO v_soggetto_id_ruolo
                        FROM anagrafiche.soggetti_ruoli sr
                       WHERE sr.id = NEW.soggetto_ruolo_id;

                      IF v_soggetto_id_ruolo IS NULL
                         OR v_soggetto_id_ruolo IS DISTINCT FROM NEW.soggetto_id THEN
                          PERFORM script.fn_log_and_raise_error(
                              'pratiche',
                              'pratiche.trgfn_pratiche_guard_contesto',
                              'E_PRATICHE_RUOLO_NON_COERENTE',
                              jsonb_build_object(
                                  'soggetto_ruolo_id', NEW.soggetto_ruolo_id,
                                  'soggetto_id', NEW.soggetto_id,
                                  'soggetto_id_ruolo', v_soggetto_id_ruolo
                              ),
                              NULL::uuid,
                              NEW.soggetto_ruolo_id::text,
                              NEW.soggetto_id::text
                          );
                      END IF;
                  END IF;

                  -- Regola 4: istanza deve appartenere al soggetto
                  IF NEW.istanza_utility_id IS NOT NULL THEN
                      SELECT iu.soggetto_id INTO v_soggetto_id_istanza
                        FROM anagrafiche.istanze_utilities iu
                       WHERE iu.id = NEW.istanza_utility_id;

                      IF v_soggetto_id_istanza IS NULL
                         OR v_soggetto_id_istanza IS DISTINCT FROM NEW.soggetto_id THEN
                          PERFORM script.fn_log_and_raise_error(
                              'pratiche',
                              'pratiche.trgfn_pratiche_guard_contesto',
                              'E_PRATICHE_ISTANZA_NON_COERENTE',
                              jsonb_build_object(
                                  'istanza_utility_id', NEW.istanza_utility_id,
                                  'soggetto_id', NEW.soggetto_id,
                                  'soggetto_id_istanza', v_soggetto_id_istanza
                              ),
                              NULL::uuid,
                              NEW.istanza_utility_id::text,
                              NEW.soggetto_id::text
                          );
                      END IF;
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              DROP TRIGGER IF EXISTS trg_pratiche_a10_guard_contesto_ins_upd ON pratiche.pratiche;

              CREATE TRIGGER trg_pratiche_a10_guard_contesto_ins_upd
                BEFORE INSERT OR UPDATE OF soggetto_id, soggetto_ruolo_id, istanza_utility_id
                ON pratiche.pratiche
                FOR EACH ROW
                EXECUTE FUNCTION pratiche.trgfn_pratiche_guard_contesto();
