# D1: l'auto-chiusura usa il predicato aggiornato (clausola "flussi aperti").
# (brief-db-chiusura-pratica-nessun-lavoro-pendente §3.B)
#
# trgfn_flussi_autochiusura_pratica chiama fn_check_pratica_chiudibile: con D1 questa
# include ora la clausola (b) "nessun flusso istanziato aperto". Unica modifica: passare
# NEW.id come p_escludi_flusso_id (il flusso appena completato e' gia' terminale, quindi
# innocuo; ma la chiamata resta coerente ed esplicita). Richiede 20260701-07.
#
# Nota: l'auto-chiusura resta AFTER UPDATE (eager). Il bivio-per-esito (increment 2)
# fa si' che il predicato template-based blocchi gia' PRIMA di creare istanze a valle,
# quindi NON serve deferral (D2 scartato, vedi brief §3.C).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/pratiche/20260701-10-update-trgfn-flussi-autochiusura-escludi-flusso-mctit.yaml

  - changeSet:
      id: 20260701-10-update-trgfn-flussi-autochiusura-escludi-flusso
      author: mctit
      # ⚠️ Era `true`: con validCheckSums ANY il checksum e' sempre "cambiato",
      #   quindi il changeSet ri-eseguiva a OGNI invocazione di liquibase. In CI
      #   ce ne sono due (--contexts="!provision" poi --contexts=ci_apply) e la
      #   seconda rimetteva questo corpo SOPRA le revisioni piu' recenti, che
      #   sono runOnChange:false e non ri-eseguono. Su dev non si vedeva: una
      #   sola invocazione. Non rimetterlo a true (2026-08-06).
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        trgfn_flussi_autochiusura_pratica: passa NEW.id come p_escludi_flusso_id a
        fn_check_pratica_chiudibile (predicato D1 con clausola flussi aperti).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION pratiche.trgfn_flussi_autochiusura_pratica()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              -- Scopo: chiusura guidata dal workflow. Al completamento di un flusso
              --   chiude automaticamente la pratica padre (APERTA -> CHIUSA).
              -- Regole:
              --   1. Scatta solo alla transizione di stato verso COMPLETATO.
              --   2. Solo da pratica APERTA (no SOSPESA/BOZZA/terminale).
              --   3. Tipo CON flusso di chiusura -> chiude sse il flusso completato
              --      e' quello; nessun altro flusso chiude la pratica.
              --   4. Tipo SENZA flusso di chiusura ma con >=1 obbligatorio attivo
              --      -> chiude sse fn_check_pratica_chiudibile (D1: nessun bloccante E
              --      nessun flusso istanziato aperto, escluso NEW.id gia' terminale).
              --   5. Tipo senza obbligatori e senza flusso di chiusura -> no-op.
              --   6. La UPDATE su pratiche attraversa guard transizione/chiusura e
              --      giornale esistenti (chiusura registrata come la manuale).
              DECLARE
                  v_completato_id  config.stati_flussi_pratiche.id%TYPE;
                  v_pratica_stato  config.stati_pratiche.codice_interno%TYPE;
                  v_tipo_id        pratiche.pratiche.tipo_prestazione_id%TYPE;
                  v_chiusura_tmpl  pratiche.template_flussi.id%TYPE;
                  v_chiusa_id      config.stati_pratiche.id%TYPE;
                  v_aperta_id      config.stati_pratiche.id%TYPE;
                  v_ha_obbligatori boolean;
                  v_deve_chiudere  boolean := false;
              BEGIN
                  -- (1) Solo verso COMPLETATO, e solo se lo stato cambia davvero.
                  SELECT id INTO v_completato_id
                    FROM config.stati_flussi_pratiche
                   WHERE codice_interno = 'COMPLETATO';

                  IF NEW.stato_id IS DISTINCT FROM v_completato_id
                     OR OLD.stato_id = NEW.stato_id THEN
                      RETURN NEW;
                  END IF;

                  -- Stato e tipo prestazione della pratica padre.
                  SELECT sp.codice_interno, p.tipo_prestazione_id
                    INTO v_pratica_stato, v_tipo_id
                    FROM pratiche.pratiche p
                    JOIN config.stati_pratiche sp ON sp.id = p.stato_id
                   WHERE p.id = NEW.pratica_id;

                  -- (2) Auto-chiusura solo da APERTA.
                  IF v_pratica_stato IS DISTINCT FROM 'APERTA' THEN
                      RETURN NEW;
                  END IF;

                  -- Flusso di chiusura del tipo prestazione (0/1).
                  SELECT tf.id INTO v_chiusura_tmpl
                    FROM pratiche.template_flussi tf
                   WHERE tf.tipo_prestazione_id = v_tipo_id
                     AND tf.chiude_pratica
                     AND tf.attivo
                   LIMIT 1;

                  IF v_chiusura_tmpl IS NOT NULL THEN
                      -- (3) Modello con flusso di chiusura.
                      v_deve_chiudere := (NEW.template_flusso_id = v_chiusura_tmpl);
                  ELSE
                      -- (4)/(5) Modello auto: gate "almeno un obbligatorio".
                      SELECT EXISTS (
                          SELECT 1 FROM pratiche.template_flussi tf
                           WHERE tf.tipo_prestazione_id = v_tipo_id
                             AND tf.obbligatorio
                             AND tf.attivo
                      ) INTO v_ha_obbligatori;

                      v_deve_chiudere := v_ha_obbligatori
                                         AND pratiche.fn_check_pratica_chiudibile(NEW.pratica_id, NULL, NEW.id);
                  END IF;

                  IF v_deve_chiudere THEN
                      SELECT id INTO v_aperta_id FROM config.stati_pratiche WHERE codice_interno = 'APERTA';
                      SELECT id INTO v_chiusa_id FROM config.stati_pratiche WHERE codice_interno = 'CHIUSA';

                      -- Chiude solo se ancora APERTA (sicurezza concorrenza).
                      UPDATE pratiche.pratiche
                         SET stato_id = v_chiusa_id
                       WHERE id = NEW.pratica_id
                         AND stato_id = v_aperta_id;
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION pratiche.trgfn_flussi_autochiusura_pratica()
              IS 'AFTER UPDATE OF stato_id su flussi: al completamento chiude la pratica padre (APERTA -> CHIUSA) secondo il modello misto (flusso di chiusura | auto con >=1 obbligatorio | no-op). Il modello auto usa fn_check_pratica_chiudibile con predicato D1 (nessun bloccante E nessun flusso aperto, escluso NEW.id). Riusa guard transizione/chiusura e giornale.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- Ripristina la chiamata a 1 argomento (pre-D1).
              CREATE OR REPLACE FUNCTION pratiche.trgfn_flussi_autochiusura_pratica()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_completato_id  config.stati_flussi_pratiche.id%TYPE;
                  v_pratica_stato  config.stati_pratiche.codice_interno%TYPE;
                  v_tipo_id        pratiche.pratiche.tipo_prestazione_id%TYPE;
                  v_chiusura_tmpl  pratiche.template_flussi.id%TYPE;
                  v_chiusa_id      config.stati_pratiche.id%TYPE;
                  v_aperta_id      config.stati_pratiche.id%TYPE;
                  v_ha_obbligatori boolean;
                  v_deve_chiudere  boolean := false;
              BEGIN
                  SELECT id INTO v_completato_id
                    FROM config.stati_flussi_pratiche WHERE codice_interno = 'COMPLETATO';
                  IF NEW.stato_id IS DISTINCT FROM v_completato_id
                     OR OLD.stato_id = NEW.stato_id THEN
                      RETURN NEW;
                  END IF;
                  SELECT sp.codice_interno, p.tipo_prestazione_id
                    INTO v_pratica_stato, v_tipo_id
                    FROM pratiche.pratiche p
                    JOIN config.stati_pratiche sp ON sp.id = p.stato_id
                   WHERE p.id = NEW.pratica_id;
                  IF v_pratica_stato IS DISTINCT FROM 'APERTA' THEN
                      RETURN NEW;
                  END IF;
                  SELECT tf.id INTO v_chiusura_tmpl
                    FROM pratiche.template_flussi tf
                   WHERE tf.tipo_prestazione_id = v_tipo_id AND tf.chiude_pratica AND tf.attivo
                   LIMIT 1;
                  IF v_chiusura_tmpl IS NOT NULL THEN
                      v_deve_chiudere := (NEW.template_flusso_id = v_chiusura_tmpl);
                  ELSE
                      SELECT EXISTS (
                          SELECT 1 FROM pratiche.template_flussi tf
                           WHERE tf.tipo_prestazione_id = v_tipo_id AND tf.obbligatorio AND tf.attivo
                      ) INTO v_ha_obbligatori;
                      v_deve_chiudere := v_ha_obbligatori
                                         AND pratiche.fn_check_pratica_chiudibile(NEW.pratica_id);
                  END IF;
                  IF v_deve_chiudere THEN
                      SELECT id INTO v_aperta_id FROM config.stati_pratiche WHERE codice_interno = 'APERTA';
                      SELECT id INTO v_chiusa_id FROM config.stati_pratiche WHERE codice_interno = 'CHIUSA';
                      UPDATE pratiche.pratiche SET stato_id = v_chiusa_id
                       WHERE id = NEW.pratica_id AND stato_id = v_aperta_id;
                  END IF;
                  RETURN NEW;
              END;
              $function$;
