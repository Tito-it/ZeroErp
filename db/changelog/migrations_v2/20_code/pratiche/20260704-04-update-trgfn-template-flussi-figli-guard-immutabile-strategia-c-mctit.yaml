# ------------------------------------------------------------
# Immutabilita' strutturale «Leggera» dei FIGLI — strategia C (freeze modifica !=
# freeze cancellazione). (brief-db-accesso-write-editing-bozza §Problema 3;
#  sostituisce il comportamento di 20260703-12.)
#
# Stessa logica di 20260704-03 applicata ai 6 figli del set di copia (C6), via la
# funzione generica (FK verso template in TG_ARGV[0]):
#   INSERT / UPDATE -> vietati se il template appartiene a un'edizione forkata
#     emessa (pubblicata o ritirata): fn_check_definizione_struttura_bloccata.
#   DELETE          -> vietato solo se PUBBLICATA (fn_check_definizione_congelata)
#     -> i figli di una RITIRATA sono cancellabili (housekeeping).
# I figli non hanno campo display: nessuna eccezione descrizione.
#
# CREATE OR REPLACE (firma invariata; i 6 trigger restano quelli di 20260703-12).
# Gira dopo 20260703-12 -> stato finale.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/pratiche/20260704-04-update-trgfn-template-flussi-figli-guard-immutabile-strategia-c-mctit.yaml

  - changeSet:
      id: 20260704-04-update-trgfn-template-flussi-figli-guard-immutabile-strategia-c
      author: mctit
      runOnChange: false
      comment: >
        trgfn_template_flussi_figli_guard_immutabile strategia C: INSERT/UPDATE
        vietati su edizione emessa (struttura_bloccata), DELETE vietato solo su
        pubblicata (congelata). Figli di RITIRATA cancellabili.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'pratiche' AND p.proname = 'fn_check_definizione_struttura_bloccata';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION pratiche.trgfn_template_flussi_figli_guard_immutabile()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              -- Scopo: immutabilita' strutturale «Leggera» dei figli (strategia C).
              --   INSERT/UPDATE vietati su edizione forkata emessa; DELETE vietato
              --   solo su pubblicata. La colonna FK verso template arriva in
              --   TG_ARGV[0]. Nessuna eccezione display sui figli.
              DECLARE
                v_rec   jsonb;
                v_tf_id pratiche.template_flussi.id%TYPE;
                v_def   pratiche.workflow_definizioni.id%TYPE;
                v_tx    uuid;
                v_bloccata boolean;
              BEGIN
                IF TG_OP = 'DELETE' THEN
                  v_rec := to_jsonb(OLD);
                ELSE
                  v_rec := to_jsonb(NEW);
                END IF;

                v_tf_id := (v_rec ->> TG_ARGV[0])::integer;
                -- FK non risolvibile: non e' compito di questo guard.
                IF v_tf_id IS NULL THEN
                  RETURN CASE WHEN TG_OP = 'DELETE' THEN OLD ELSE NEW END;
                END IF;

                SELECT tf.definizione_id
                  INTO v_def
                  FROM pratiche.template_flussi tf
                 WHERE tf.id = v_tf_id;

                -- DELETE -> solo PUBBLICATA (congelata); INSERT/UPDATE -> anche
                -- RITIRATA (struttura_bloccata).
                IF TG_OP = 'DELETE' THEN
                  v_bloccata := pratiche.fn_check_definizione_congelata(v_def);
                ELSE
                  v_bloccata := pratiche.fn_check_definizione_struttura_bloccata(v_def);
                END IF;

                IF v_bloccata THEN
                  v_tx := NULLIF(v_rec ->> 'tx_id', '')::uuid;
                  PERFORM script.fn_log_and_raise_error(
                    'pratiche',
                    'pratiche.trgfn_template_flussi_figli_guard_immutabile',
                    'TEMPLATE_DEFINIZIONE_CONGELATA',
                    jsonb_build_object(
                      'operazione',        TG_OP,
                      'tabella',           TG_TABLE_NAME,
                      'template_flusso_id', v_tf_id,
                      'definizione_id',     v_def
                    ),
                    v_tx,
                    v_def::text
                  );
                END IF;

                RETURN CASE WHEN TG_OP = 'DELETE' THEN OLD ELSE NEW END;
              END;
              $function$;

              COMMENT ON FUNCTION pratiche.trgfn_template_flussi_figli_guard_immutabile()
                IS 'Guard generico BEFORE INS/UPD/DEL sui figli di template_flussi (canali, handler_eventi, competenze, prerequisiti, formule_tempo, regole_generazione), strategia C: INSERT/UPDATE vietati su edizione forkata emessa (pubblicata o ritirata, fn_check_definizione_struttura_bloccata); DELETE vietato solo su pubblicata (fn_check_definizione_congelata) -> figli di RITIRATA cancellabili. FK verso template in TG_ARGV[0]. Errore TEMPLATE_DEFINIZIONE_CONGELATA (514).';

      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- Ripristina la versione Fase 2b (20260703-12): tutto su congelata.
              CREATE OR REPLACE FUNCTION pratiche.trgfn_template_flussi_figli_guard_immutabile()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_rec   jsonb;
                v_tf_id pratiche.template_flussi.id%TYPE;
                v_def   pratiche.workflow_definizioni.id%TYPE;
                v_tx    uuid;
              BEGIN
                IF TG_OP = 'DELETE' THEN
                  v_rec := to_jsonb(OLD);
                ELSE
                  v_rec := to_jsonb(NEW);
                END IF;
                v_tf_id := (v_rec ->> TG_ARGV[0])::integer;
                IF v_tf_id IS NULL THEN
                  RETURN CASE WHEN TG_OP = 'DELETE' THEN OLD ELSE NEW END;
                END IF;
                SELECT tf.definizione_id INTO v_def
                  FROM pratiche.template_flussi tf WHERE tf.id = v_tf_id;
                IF pratiche.fn_check_definizione_congelata(v_def) THEN
                  v_tx := NULLIF(v_rec ->> 'tx_id', '')::uuid;
                  PERFORM script.fn_log_and_raise_error(
                    'pratiche', 'pratiche.trgfn_template_flussi_figli_guard_immutabile',
                    'TEMPLATE_DEFINIZIONE_CONGELATA',
                    jsonb_build_object('operazione',TG_OP,'tabella',TG_TABLE_NAME,
                                       'template_flusso_id',v_tf_id,'definizione_id',v_def),
                    v_tx, v_def::text);
                END IF;
                RETURN CASE WHEN TG_OP = 'DELETE' THEN OLD ELSE NEW END;
              END;
              $function$;
