# ------------------------------------------------------------
# Pratiche figlie auto-generate: nascono APERTA, non BOZZA.
#
# Coerenza col modello "la pratica nasce direttamente APERTA"
# (20260613-01): crea_pratica lato BE risolve gia' APERTA, ma
# fn_genera_pratica_da_flusso (generazione cross-pratica) creava
# ancora le figlie in BOZZA -> avrebbero richiesto un'apertura
# manuale. Una figlia auto-generata da un flusso completato e' un
# lavoro gia' avviato: deve nascere operativa.
#
# data_apertura: NON va valorizzata qui. L'INSERT con stato APERTA
# attiva il trigger trg_pratiche_m50_set_data_apertura_ins
# (20260613-01) che imposta data_apertura = CURRENT_DATE.
#
# DDL preso dalla doc auto-gen (oggetto vivo). Unica modifica: il
# lookup dello stato iniziale BOZZA -> APERTA (commento, WHERE,
# contesto errore) e il COMMENT della funzione. Resto invariato.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/pratiche/20260614-03-update-fn-genera-pratica-da-flusso-aperta-mctit.yaml

  - changeSet:
      id: 20260614-03-update-fn-genera-pratica-da-flusso-aperta
      author: mctit
      # ⚠️ Era `true`: con validCheckSums ANY il checksum e' sempre "cambiato",
      #   quindi il changeSet ri-eseguiva a OGNI invocazione di liquibase. In CI
      #   ce ne sono due (--contexts="!provision" poi --contexts=ci_apply) e la
      #   seconda rimetteva questo corpo SOPRA le revisioni piu' recenti, che
      #   sono runOnChange:false e non ri-eseguono. Su dev non si vedeva: una
      #   sola invocazione. Non rimetterlo a true (2026-08-06).
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        fn_genera_pratica_da_flusso: le pratiche figlie nascono APERTA
        (non BOZZA), coerente con il modello "pratica nasce APERTA".
        data_apertura valorizzata dal trigger INSERT esistente.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION pratiche.fn_genera_pratica_da_flusso(
                  p_flusso_id pratiche.flussi.id%TYPE,
                  p_regola_id pratiche.regole_generazione.id%TYPE
              )
               RETURNS bigint
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_pratica_sorgente_id   pratiche.pratiche.id%TYPE;
                  v_emittente_id          pratiche.pratiche.emittente_fiscale_id%TYPE;
                  v_soggetto_id           pratiche.pratiche.soggetto_id%TYPE;
                  v_soggetto_ruolo_id     pratiche.pratiche.soggetto_ruolo_id%TYPE;
                  v_istanza_utility_id    pratiche.pratiche.istanza_utility_id%TYPE;
                  v_priorita_id           pratiche.pratiche.priorita_id%TYPE;
                  v_tipo_prest_dest_id    pratiche.regole_generazione.tipo_prestazione_dest_id%TYPE;
                  v_template_dest_id      pratiche.regole_generazione.template_flusso_dest_id%TYPE;
                  v_stato_iniziale_id     config.stati_pratiche.id%TYPE;
                  v_stato_flusso_id       config.stati_flussi_pratiche.id%TYPE;
                  v_dest_sequenza         pratiche.template_flussi.sequenza%TYPE;
                  v_nuova_pratica_id      pratiche.pratiche.id%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Genera la pratica figlia da un flusso completato secondo
                  --   una regola di generazione. Idempotente: per la stessa
                  --   coppia (flusso, tipo destinazione) esiste al massimo una
                  --   figlia; le chiamate successive ritornano l'id esistente.
                  --   Copia emittente/soggetto/contesto/priorita, valorizza
                  --   pratica_padre_id + flusso_origine_id e, se la regola lo
                  --   dichiara, crea il flusso iniziale della figlia.
                  -- =========================================================

                  -- Guard: parametri obbligatori
                  IF p_flusso_id IS NULL OR p_flusso_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          'fn_genera_pratica_da_flusso',
                          'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_flusso_id', 'valore', p_flusso_id),
                          NULL::uuid,
                          'p_flusso_id obbligatorio e > 0'
                      );
                  END IF;

                  IF p_regola_id IS NULL OR p_regola_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          'fn_genera_pratica_da_flusso',
                          'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_regola_id', 'valore', p_regola_id),
                          NULL::uuid,
                          'p_regola_id obbligatorio e > 0'
                      );
                  END IF;

                  -- Recupera pratica_id dal flusso
                  SELECT f.pratica_id
                    INTO v_pratica_sorgente_id
                    FROM pratiche.flussi f
                   WHERE f.id = p_flusso_id;

                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          'fn_genera_pratica_da_flusso',
                          'E_VALORE_MANCANTE',
                          jsonb_build_object('flusso_id', p_flusso_id),
                          NULL::uuid,
                          concat('flusso_id ', p_flusso_id)
                      );
                  END IF;

                  -- Recupera dati pratica sorgente (incluso contesto, fix-4)
                  SELECT p.emittente_fiscale_id, p.soggetto_id,
                         p.soggetto_ruolo_id, p.istanza_utility_id, p.priorita_id
                    INTO v_emittente_id, v_soggetto_id,
                         v_soggetto_ruolo_id, v_istanza_utility_id, v_priorita_id
                    FROM pratiche.pratiche p
                   WHERE p.id = v_pratica_sorgente_id;

                  -- Recupera regola di generazione (incluso flusso iniziale, fix-3)
                  SELECT rg.tipo_prestazione_dest_id, rg.template_flusso_dest_id
                    INTO v_tipo_prest_dest_id, v_template_dest_id
                    FROM pratiche.regole_generazione rg
                   WHERE rg.id = p_regola_id
                     AND rg.attivo = true;

                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          'fn_genera_pratica_da_flusso',
                          'E_CODICE',
                          jsonb_build_object('regola_id', p_regola_id),
                          NULL::uuid,
                          p_regola_id::text, 'pratiche.regole_generazione'
                      );
                  END IF;

                  -- Idempotenza (fix-1): figlia gia' esistente per
                  -- (flusso, tipo destinazione) -> ritorna l'id esistente.
                  -- Vale per trigger auto, API /genera/ e doppi eventi.
                  SELECT p.id
                    INTO v_nuova_pratica_id
                    FROM pratiche.pratiche p
                   WHERE p.flusso_origine_id  = p_flusso_id
                     AND p.tipo_prestazione_id = v_tipo_prest_dest_id
                   LIMIT 1;

                  IF FOUND THEN
                      RETURN v_nuova_pratica_id;
                  END IF;

                  -- Determina stato iniziale (APERTA): la figlia auto-generata
                  -- e' un lavoro gia' avviato, nasce operativa (coerente con il
                  -- modello "la pratica nasce APERTA"). data_apertura viene
                  -- valorizzata dal trigger trg_pratiche_m50_set_data_apertura_ins.
                  SELECT sp.id
                    INTO v_stato_iniziale_id
                    FROM config.stati_pratiche sp
                   WHERE sp.codice_interno = 'APERTA'
                     AND sp.attivo = true
                   LIMIT 1;

                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          'fn_genera_pratica_da_flusso',
                          'E_CODICE',
                          jsonb_build_object('codice_interno', 'APERTA'),
                          NULL::uuid,
                          'APERTA', 'config.stati_pratiche'
                      );
                  END IF;

                  -- Crea pratica target: genealogia completa (fix-2) e
                  -- contesto propagato (fix-4, coerente col soggetto copiato).
                  INSERT INTO pratiche.pratiche (
                      emittente_fiscale_id,
                      tipo_prestazione_id,
                      soggetto_id,
                      soggetto_ruolo_id,
                      istanza_utility_id,
                      stato_id,
                      priorita_id,
                      pratica_padre_id,
                      flusso_origine_id
                  ) VALUES (
                      v_emittente_id,
                      v_tipo_prest_dest_id,
                      v_soggetto_id,
                      v_soggetto_ruolo_id,
                      v_istanza_utility_id,
                      v_stato_iniziale_id,
                      v_priorita_id,
                      v_pratica_sorgente_id,
                      p_flusso_id
                  )
                  RETURNING id INTO v_nuova_pratica_id;

                  -- Flusso iniziale della figlia (fix-3): solo se la regola
                  -- lo dichiara. Il template deve essere senza prerequisiti
                  -- (la figlia nasce senza flussi): in caso contrario il
                  -- guard prerequisiti blocca — errore di seed, fail-fast.
                  IF v_template_dest_id IS NOT NULL THEN
                      SELECT sfp.id
                        INTO v_stato_flusso_id
                        FROM config.stati_flussi_pratiche sfp
                       WHERE sfp.codice_interno = 'DA_ESEGUIRE'
                         AND sfp.attivo = true
                       LIMIT 1;

                      IF NOT FOUND THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database',
                              'fn_genera_pratica_da_flusso',
                              'E_CODICE',
                              jsonb_build_object('codice_interno', 'DA_ESEGUIRE'),
                              NULL::uuid,
                              'DA_ESEGUIRE', 'config.stati_flussi_pratiche'
                          );
                      END IF;

                      -- Sequenza dal template (ordinamento percorso coerente).
                      SELECT tf.sequenza
                        INTO v_dest_sequenza
                        FROM pratiche.template_flussi tf
                       WHERE tf.id = v_template_dest_id;

                      INSERT INTO pratiche.flussi (
                          pratica_id,
                          template_flusso_id,
                          stato_id,
                          sequenza
                      ) VALUES (
                          v_nuova_pratica_id,
                          v_template_dest_id,
                          v_stato_flusso_id,
                          COALESCE(v_dest_sequenza, 0)
                      );
                  END IF;

                  RETURN v_nuova_pratica_id;
              END;
              $function$;

              COMMENT ON FUNCTION pratiche.fn_genera_pratica_da_flusso(p_flusso_id bigint, p_regola_id bigint)
              IS 'Genera pratica figlia da flusso completato secondo regola di generazione. Idempotente per (flusso, tipo dest): ritorna la figlia esistente. Copia emittente/soggetto/contesto/priorita; valorizza pratica_padre_id e flusso_origine_id; crea il flusso iniziale se la regola dichiara template_flusso_dest_id. Stato iniziale APERTA (data_apertura dal trigger INSERT).';

      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Ripristina lo stato iniziale BOZZA (versione precedente).
              CREATE OR REPLACE FUNCTION pratiche.fn_genera_pratica_da_flusso(
                  p_flusso_id pratiche.flussi.id%TYPE,
                  p_regola_id pratiche.regole_generazione.id%TYPE
              )
               RETURNS bigint
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_pratica_sorgente_id   pratiche.pratiche.id%TYPE;
                  v_emittente_id          pratiche.pratiche.emittente_fiscale_id%TYPE;
                  v_soggetto_id           pratiche.pratiche.soggetto_id%TYPE;
                  v_soggetto_ruolo_id     pratiche.pratiche.soggetto_ruolo_id%TYPE;
                  v_istanza_utility_id    pratiche.pratiche.istanza_utility_id%TYPE;
                  v_priorita_id           pratiche.pratiche.priorita_id%TYPE;
                  v_tipo_prest_dest_id    pratiche.regole_generazione.tipo_prestazione_dest_id%TYPE;
                  v_template_dest_id      pratiche.regole_generazione.template_flusso_dest_id%TYPE;
                  v_stato_iniziale_id     config.stati_pratiche.id%TYPE;
                  v_stato_flusso_id       config.stati_flussi_pratiche.id%TYPE;
                  v_dest_sequenza         pratiche.template_flussi.sequenza%TYPE;
                  v_nuova_pratica_id      pratiche.pratiche.id%TYPE;
              BEGIN
                  IF p_flusso_id IS NULL OR p_flusso_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'fn_genera_pratica_da_flusso', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_flusso_id', 'valore', p_flusso_id),
                          NULL::uuid, 'p_flusso_id obbligatorio e > 0');
                  END IF;
                  IF p_regola_id IS NULL OR p_regola_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'fn_genera_pratica_da_flusso', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_regola_id', 'valore', p_regola_id),
                          NULL::uuid, 'p_regola_id obbligatorio e > 0');
                  END IF;

                  SELECT f.pratica_id INTO v_pratica_sorgente_id
                    FROM pratiche.flussi f WHERE f.id = p_flusso_id;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'fn_genera_pratica_da_flusso', 'E_VALORE_MANCANTE',
                          jsonb_build_object('flusso_id', p_flusso_id),
                          NULL::uuid, concat('flusso_id ', p_flusso_id));
                  END IF;

                  SELECT p.emittente_fiscale_id, p.soggetto_id,
                         p.soggetto_ruolo_id, p.istanza_utility_id, p.priorita_id
                    INTO v_emittente_id, v_soggetto_id,
                         v_soggetto_ruolo_id, v_istanza_utility_id, v_priorita_id
                    FROM pratiche.pratiche p WHERE p.id = v_pratica_sorgente_id;

                  SELECT rg.tipo_prestazione_dest_id, rg.template_flusso_dest_id
                    INTO v_tipo_prest_dest_id, v_template_dest_id
                    FROM pratiche.regole_generazione rg
                   WHERE rg.id = p_regola_id AND rg.attivo = true;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'fn_genera_pratica_da_flusso', 'E_CODICE',
                          jsonb_build_object('regola_id', p_regola_id),
                          NULL::uuid, p_regola_id::text, 'pratiche.regole_generazione');
                  END IF;

                  SELECT p.id INTO v_nuova_pratica_id
                    FROM pratiche.pratiche p
                   WHERE p.flusso_origine_id = p_flusso_id
                     AND p.tipo_prestazione_id = v_tipo_prest_dest_id
                   LIMIT 1;
                  IF FOUND THEN
                      RETURN v_nuova_pratica_id;
                  END IF;

                  SELECT sp.id INTO v_stato_iniziale_id
                    FROM config.stati_pratiche sp
                   WHERE sp.codice_interno = 'BOZZA' AND sp.attivo = true
                   LIMIT 1;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'fn_genera_pratica_da_flusso', 'E_CODICE',
                          jsonb_build_object('codice_interno', 'BOZZA'),
                          NULL::uuid, 'BOZZA', 'config.stati_pratiche');
                  END IF;

                  INSERT INTO pratiche.pratiche (
                      emittente_fiscale_id, tipo_prestazione_id, soggetto_id,
                      soggetto_ruolo_id, istanza_utility_id, stato_id,
                      priorita_id, pratica_padre_id, flusso_origine_id
                  ) VALUES (
                      v_emittente_id, v_tipo_prest_dest_id, v_soggetto_id,
                      v_soggetto_ruolo_id, v_istanza_utility_id, v_stato_iniziale_id,
                      v_priorita_id, v_pratica_sorgente_id, p_flusso_id
                  )
                  RETURNING id INTO v_nuova_pratica_id;

                  IF v_template_dest_id IS NOT NULL THEN
                      SELECT sfp.id INTO v_stato_flusso_id
                        FROM config.stati_flussi_pratiche sfp
                       WHERE sfp.codice_interno = 'DA_ESEGUIRE' AND sfp.attivo = true
                       LIMIT 1;
                      IF NOT FOUND THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', 'fn_genera_pratica_da_flusso', 'E_CODICE',
                              jsonb_build_object('codice_interno', 'DA_ESEGUIRE'),
                              NULL::uuid, 'DA_ESEGUIRE', 'config.stati_flussi_pratiche');
                      END IF;

                      SELECT tf.sequenza INTO v_dest_sequenza
                        FROM pratiche.template_flussi tf WHERE tf.id = v_template_dest_id;

                      INSERT INTO pratiche.flussi (
                          pratica_id, template_flusso_id, stato_id, sequenza
                      ) VALUES (
                          v_nuova_pratica_id, v_template_dest_id, v_stato_flusso_id,
                          COALESCE(v_dest_sequenza, 0)
                      );
                  END IF;

                  RETURN v_nuova_pratica_id;
              END;
              $function$;

              COMMENT ON FUNCTION pratiche.fn_genera_pratica_da_flusso(p_flusso_id bigint, p_regola_id bigint)
              IS 'Genera pratica figlia da flusso completato secondo regola di generazione. Idempotente per (flusso, tipo dest): ritorna la figlia esistente. Copia emittente/soggetto/contesto/priorita; valorizza pratica_padre_id e flusso_origine_id; crea il flusso iniziale se la regola dichiara template_flusso_dest_id. Stato iniziale BOZZA.';
