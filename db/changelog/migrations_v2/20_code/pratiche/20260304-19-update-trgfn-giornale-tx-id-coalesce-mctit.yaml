# Liquibase changelog per Zero ERP
# Fix: tutte le trigger function giornale ora usano
#   coalesce(NEW.tx_id, dbops.fn_get_or_create_session_tx_id())
# per resilienza quando il trigger standard tx_id non e' ancora applicato.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/pratiche/20260304-19-update-trgfn-giornale-tx-id-coalesce-mctit.yaml

  - changeSet:
      id: 20260304-19-update-trgfn-giornale-tx-id-coalesce
      author: mctit
      runOnChange: false
      comment: >
        Fix tx_id NULL nelle trigger function giornale: usa coalesce con
        dbops.fn_get_or_create_session_tx_id() come fallback quando il trigger
        standard trgfn_tx_id_managed non e' ancora applicato alla tabella.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- =========================================================
              -- 1. trgfn_pratiche_giornale_ins (PRATICA_CREATA)
              -- =========================================================
              CREATE OR REPLACE FUNCTION pratiche.trgfn_pratiche_giornale_ins()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              BEGIN
                INSERT INTO pratiche.giornale
                  (pratica_id, flusso_id, azione, origine, dettaglio, tx_id)
                VALUES (
                  NEW.id,
                  NULL,
                  'PRATICA_CREATA',
                  'SISTEMA',
                  jsonb_build_object(
                    'tipo_prestazione_id', NEW.tipo_prestazione_id,
                    'stato_id', NEW.stato_id,
                    'priorita_id', NEW.priorita_id,
                    'soggetto_id', NEW.soggetto_id,
                    'canale_origine_id', NEW.canale_origine_id
                  ),
                  coalesce(NEW.tx_id, dbops.fn_get_or_create_session_tx_id())
                );
                RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION pratiche.trgfn_pratiche_giornale_ins()
                IS 'AFTER INSERT su pratiche: logga PRATICA_CREATA nel giornale.';

              -- =========================================================
              -- 2. trgfn_pratiche_giornale_stato (STATO_CAMBIATO)
              -- =========================================================
              CREATE OR REPLACE FUNCTION pratiche.trgfn_pratiche_giornale_stato()
