# Bootstrap del preset v1 alla creazione di un tipo prestazione.
# (brief-db-step-dominio-e-definizioni-versionate Parte 2 / Fase 0,
#  raffinamento §2.1: invariante "ogni tipo ha il suo preset v1 PUBBLICATA")
#
# AFTER INSERT su tipi_prestazione: crea la workflow_definizioni preset
# (emittente NULL, versione 1, PUBBLICATA). Effetti:
#   - su DB fresco i SEED dei tipi generano i preset da soli (niente seed CSV
#     a id fissi per workflow_definizioni);
#   - i pgTAP che creano tipi sintetici restano invariati (l'auto-default dei
#     template trova sempre il preset);
#   - fn_risolvi_definizione non fallisce mai per un tipo appena creato.
# Idempotente: ON CONFLICT sull'indice unico parziale "una sola PUBBLICATA
# per scope" (uq_workflow_definizioni_pubblicata) -> DO NOTHING.
#
# NB: il preset bootstrap nasce PUBBLICATA e vuoto (i template arrivano dopo,
# dai seed) — e' la fotografia della realta' pre-fork, dove il set corrente di
# template del tipo E' la definizione. La validazione "pubblicabile solo con
# >=1 template" e' della fn_pubblica_definizione (Fase 2) e non riguarda il
# bootstrap. Fase z90 (side-effect finale, non guard).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/pratiche/20260702-22-create-trgfn-tipi-prestazione-bootstrap-definizione-mctit.yaml

  - changeSet:
      id: 20260702-22-create-trgfn-tipi-prestazione-bootstrap-definizione
      author: mctit
      runOnChange: false
      comment: >
        Trigger AFTER INSERT su pratiche.tipi_prestazione: crea il preset v1
        PUBBLICATA in workflow_definizioni (idempotente via ON CONFLICT sul
        parziale "una PUBBLICATA per scope"). Invariante: ogni tipo ha sempre
        il suo preset risolvibile.
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: pratiche
            tableName: workflow_definizioni
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION pratiche.trgfn_tipi_prestazione_bootstrap_definizione()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              -- Scopo: garantire l'invariante "ogni tipo di prestazione ha il
              --        suo preset v1 PUBBLICATA" fin dalla nascita del tipo.
              --        Cosi' auto-pin/auto-default risolvono sempre e i seed
              --        (o le fixture di test) non devono creare definizioni.
              BEGIN
                INSERT INTO pratiche.workflow_definizioni
                       (tipo_prestazione_id, emittente_fiscale_id, versione, stato,
                        descrizione, tx_id)
                VALUES (NEW.id, NULL, 1, 'PUBBLICATA',
                        'v1 — preset iniziale del tipo ' || NEW.codice_interno,
                        NEW.tx_id)
                ON CONFLICT (tipo_prestazione_id, emittente_fiscale_id)
                   WHERE stato = 'PUBBLICATA'
                   DO NOTHING;
                RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION pratiche.trgfn_tipi_prestazione_bootstrap_definizione()
                IS 'AFTER INSERT su pratiche.tipi_prestazione: crea il preset v1 PUBBLICATA della definizione workflow del nuovo tipo (idempotente). Invariante Fase 0: ogni tipo ha sempre un preset risolvibile da fn_risolvi_definizione.';

              DROP TRIGGER IF EXISTS trg_tipi_prestazione_z90_bootstrap_definizione_ins
                ON pratiche.tipi_prestazione;

              CREATE TRIGGER trg_tipi_prestazione_z90_bootstrap_definizione_ins
                AFTER INSERT
                ON pratiche.tipi_prestazione
                FOR EACH ROW
                EXECUTE FUNCTION pratiche.trgfn_tipi_prestazione_bootstrap_definizione();

      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_tipi_prestazione_z90_bootstrap_definizione_ins
                ON pratiche.tipi_prestazione;
              DROP FUNCTION IF EXISTS pratiche.trgfn_tipi_prestazione_bootstrap_definizione();
