# Liquibase changelog per Zero ERP
# ALTER CHECK su pratiche.giornale.azione — aggiungere azioni sospensione
# ------------------------------------------------------------

databaseChangeLog:
    - logicalFilePath: migrations_v2/20_code/pratiche/20260306-09-alter-giornale-azione-check-mctit.yaml

    - changeSet:
          id: 20260306-09-alter-giornale-azione-check
          author: mctit
          comment: >
              Aggiunge SOSPENSIONE_REGISTRATA e SOSPENSIONE_CHIUSA
              alla lista delle azioni ammesse nel giornale pratiche.
          changes:
              - sql:
                    dbms: postgresql
                    splitStatements: true
                    sql: |
                        ALTER TABLE pratiche.giornale
                          DROP CONSTRAINT chk_giornale_azione;

                        ALTER TABLE pratiche.giornale
                          ADD CONSTRAINT chk_giornale_azione
                          CHECK (azione IN (
                            'PRATICA_CREATA', 'STATO_CAMBIATO', 'ASSEGNAZIONE_CAMBIATA',
                            'PRIORITA_CAMBIATA', 'FLUSSO_CREATO', 'FLUSSO_STATO_CAMBIATO',
                            'NOTA_AGGIUNTA', 'ALLEGATO_AGGIUNTO', 'PRATICA_GENERATA',
                            'SOSPENSIONE_REGISTRATA', 'SOSPENSIONE_CHIUSA'
                          ));

          rollback:
              - sql:
                    sql: |
                        ALTER TABLE pratiche.giornale
                          DROP CONSTRAINT chk_giornale_azione;

                        ALTER TABLE pratiche.giornale
                          ADD CONSTRAINT chk_giornale_azione
                          CHECK (azione IN (
                            'PRATICA_CREATA', 'STATO_CAMBIATO', 'ASSEGNAZIONE_CAMBIATA',
                            'PRIORITA_CAMBIATA', 'FLUSSO_CREATO', 'FLUSSO_STATO_CAMBIATO',
                            'NOTA_AGGIUNTA', 'ALLEGATO_AGGIUNTO', 'PRATICA_GENERATA'
                          ));
