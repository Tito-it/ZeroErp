# B-PREREQ (2/3) — fn_check_prerequisiti_flusso esito-aware.
# Estende il pure-check: un prerequisito e' soddisfatto se il flusso
# precedente e' COMPLETATO E (esito_richiesto IS NULL OR esito coincide).
# Firma e RETURNS TABLE invariati -> CREATE OR REPLACE sufficiente
# (nessun cambio di tipo di ritorno, no DROP necessario).
# Retro-compatibile: prerequisiti con esito_richiesto NULL si comportano
# come prima (qualsiasi esito).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/pratiche/20260608-02-update-fn-check-prerequisiti-flusso-esito-aware-mctit.yaml

  - changeSet:
      id: 20260608-02-update-fn-check-prerequisiti-flusso-esito-aware
      author: mctit
      runOnChange: false
      comment: >
        fn_check_prerequisiti_flusso ora filtra anche sull'esito del flusso
        prerequisito (template_flussi_prerequisiti.esito_richiesto). NULL =
        qualsiasi esito (retro-compatibile).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION pratiche.fn_check_prerequisiti_flusso(
                p_pratica_id         pratiche.pratiche.id%TYPE,
                p_template_flusso_id pratiche.template_flussi.id%TYPE
              )
              RETURNS TABLE(
                prerequisito_id  pratiche.template_flussi.id%TYPE,
                codice           pratiche.template_flussi.codice%TYPE,
                descrizione      pratiche.template_flussi.descrizione%TYPE,
                soddisfatto      boolean
              )
              LANGUAGE plpgsql
              STABLE
              AS $$
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Verifica se tutti i prerequisiti di un template flusso
                --   sono soddisfatti per la pratica indicata.
                --   Funzione fn_check_*: puro boolean per riga, no raise.
                --
                -- Regole (esito-aware, da 2026-06-08):
                --   - Un prerequisito e' soddisfatto se esiste almeno un
                --     flusso per la stessa pratica con quel template_flusso_id
                --     in stato COMPLETATO (codice_interno) E con esito
                --     coerente: esito_richiesto IS NULL (qualsiasi esito,
                --     retro-compatibile) oppure f.esito = esito_richiesto.
                -- =========================================================

                RETURN QUERY
                SELECT
                  tfp.prerequisito_id,
                  tf.codice,
                  tf.descrizione,
                  EXISTS (
                    SELECT 1
                      FROM pratiche.flussi f
                      JOIN config.stati_flussi_pratiche sfp ON sfp.id = f.stato_id
                     WHERE f.pratica_id        = p_pratica_id
                       AND f.template_flusso_id = tfp.prerequisito_id
                       AND sfp.codice_interno   = 'COMPLETATO'
                       AND (
                             tfp.esito_richiesto IS NULL
                          OR f.esito = tfp.esito_richiesto
                       )
                  ) AS soddisfatto
                FROM pratiche.template_flussi_prerequisiti tfp
                JOIN pratiche.template_flussi tf ON tf.id = tfp.prerequisito_id
                WHERE tfp.template_flusso_id = p_template_flusso_id;
              END;
              $$;

              COMMENT ON FUNCTION pratiche.fn_check_prerequisiti_flusso(bigint, integer)
                IS 'Pure check: ritorna prerequisiti con flag soddisfatto per pratica/template. Esito-aware (2026-06-08): rispetta template_flussi_prerequisiti.esito_richiesto (NULL = qualsiasi esito).';
