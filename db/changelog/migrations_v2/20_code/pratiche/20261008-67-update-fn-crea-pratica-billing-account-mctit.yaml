# LA FIGLIA CONDIVISA CHE CREA LE PRATICHE PASSA ANCHE IL BA
#   pratiche.fn_crea_pratica(..., p_billing_account_id DEFAULT NULL) — parametro
#   in CODA.
#   Brief: brief-db-istanza-nasce-col-ba (R-8, D-9)
#
# -- LA FIRMA ------------------------------------------------------
#   Parametro nuovo in coda, DEFAULT NULL: chi chiama per nome (l'unico
#   chiamante, vendite.fn_genera_pratica_da_preventivo) non cambia. DROP della
#   firma vecchia prima del CREATE: altrimenti nasce un overload, e una
#   chiamata con i soli parametri vecchi diventa ambigua. Il backend non la
#   chiama (censimento del 2026-10-08).
#   Firma ancorata con %TYPE come nel 20260707-13; il corpo e' quello vivo
#   (identico al 20260707-13) con la sola colonna in piu'.
#
# Ritorno indietro: firma e corpo del 20260707-13.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/pratiche/20261008-67-update-fn-crea-pratica-billing-account-mctit.yaml

  - changeSet:
      id: 20261008-67-update-fn-crea-pratica-billing-account
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        pratiche.fn_crea_pratica con p_billing_account_id in coda (DEFAULT NULL): la pratica nasce
        col BA del cliente di cui parla. Brief: brief-db-istanza-nasce-col-ba (R-8, D-9).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- La firma cambia (parametro in coda): senza DROP nascerebbe un overload,
              -- e le chiamate per nome con i soli parametri vecchi diventerebbero ambigue.
              DROP FUNCTION pratiche.fn_crea_pratica(bigint, integer, uuid, bigint, bigint, integer, text, jsonb);

              CREATE OR REPLACE FUNCTION pratiche.fn_crea_pratica(
                  p_emittente_fiscale_id pratiche.pratiche.emittente_fiscale_id%TYPE,
                  p_tipo_prestazione_id  pratiche.pratiche.tipo_prestazione_id%TYPE,
                  p_soggetto_id          pratiche.pratiche.soggetto_id%TYPE DEFAULT NULL,
                  p_soggetto_ruolo_id    pratiche.pratiche.soggetto_ruolo_id%TYPE DEFAULT NULL,
                  p_istanza_utility_id   pratiche.pratiche.istanza_utility_id%TYPE DEFAULT NULL,
                  p_priorita_id          pratiche.pratiche.priorita_id%TYPE DEFAULT NULL,
                  p_descrizione          pratiche.pratiche.descrizione%TYPE DEFAULT NULL,
                  p_meta                 pratiche.pratiche.meta%TYPE DEFAULT '{}'::jsonb,
                  p_billing_account_id   pratiche.pratiche.billing_account_id%TYPE DEFAULT NULL
              )
              RETURNS pratiche.pratiche.id%TYPE
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_stato_id    pratiche.pratiche.stato_id%TYPE;
                  v_priorita_id pratiche.pratiche.priorita_id%TYPE := p_priorita_id;
                  v_pratica_id  pratiche.pratiche.id%TYPE;
              BEGIN
                  -- Stato iniziale APERTA.
                  SELECT sp.id INTO v_stato_id
                    FROM config.stati_pratiche sp
                   WHERE sp.codice_interno = 'APERTA';
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'pratiche.fn_crea_pratica', 'E_CONFIG_MANCANTE',
                          jsonb_build_object('config', 'config.stati_pratiche.APERTA'),
                          NULL::uuid,
                          VARIADIC ARRAY['stato iniziale APERTA (config.stati_pratiche)']);
                  END IF;

                  -- Priorita' default NORMALE se non fornita.
                  IF v_priorita_id IS NULL THEN
                      SELECT pp.id INTO v_priorita_id
                        FROM config.priorita_pratiche pp
                       WHERE pp.codice_interno = 'NORMALE';
                      IF NOT FOUND THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', 'pratiche.fn_crea_pratica', 'E_CONFIG_MANCANTE',
                              jsonb_build_object('config', 'config.priorita_pratiche.NORMALE'),
                              NULL::uuid,
                              VARIADIC ARRAY['priorita default NORMALE (config.priorita_pratiche)']);
                      END IF;
                  END IF;

                  INSERT INTO pratiche.pratiche (
                      emittente_fiscale_id, tipo_prestazione_id, soggetto_id,
                      soggetto_ruolo_id, istanza_utility_id, stato_id, priorita_id,
                      descrizione, meta,
                      billing_account_id
                  ) VALUES (
                      p_emittente_fiscale_id, p_tipo_prestazione_id, p_soggetto_id,
                      p_soggetto_ruolo_id, p_istanza_utility_id, v_stato_id, v_priorita_id,
                      p_descrizione, COALESCE(p_meta, '{}'::jsonb),
                      p_billing_account_id
                  )
                  RETURNING id INTO v_pratica_id;

                  RETURN v_pratica_id;
              END;
              $function$;

              COMMENT ON FUNCTION pratiche.fn_crea_pratica(bigint, integer, uuid, bigint, bigint, integer, text, jsonb, bigint)
              IS 'Building block condiviso: crea una pratica (stato APERTA, priorita'' default NORMALE) con INSERT guardato dai trigger di pratiche.pratiche. NON include il guard pre/post-attivazione (solo Python). SECURITY INVOKER. Riusata dai madre di dominio (preventivo/ordine/...). Piano: analisi-fix-transazioni Classe A. rev 2026-10-08 (20261008-67): parametro p_billing_account_id in CODA (DEFAULT NULL) — il cliente di cui parla la pratica, a grana fine; i chiamanti per nome non cambiano. Brief: brief-db-istanza-nasce-col-ba (R-8, D-9).';
      rollback:
