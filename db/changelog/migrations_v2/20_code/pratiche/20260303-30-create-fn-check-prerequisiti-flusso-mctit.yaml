# Liquibase changelog per Zero ERP
# Funzione pratiche.fn_check_prerequisiti_flusso — pure check
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/pratiche/20260303-30-create-fn-check-prerequisiti-flusso-mctit.yaml

  - changeSet:
      id: 20260303-30-create-fn-check-prerequisiti-flusso
      author: mctit
      runOnChange: false
      comment: >
        Pure check (fn_check_*): verifica se i prerequisiti di un template
        flusso sono soddisfatti per una pratica. Ritorna una riga per ogni
        prerequisito con flag soddisfatto. No RAISE.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION pratiche.fn_check_prerequisiti_flusso(
                p_pratica_id         pratiche.pratiche.id%TYPE,
                p_template_flusso_id pratiche.template_flussi.id%TYPE
              )
              RETURNS TABLE(
                prerequisito_id  pratiche.template_flussi.id%TYPE,
                codice           pratiche.template_flussi.codice%TYPE,
                descrizione      pratiche.template_flussi.descrizione%TYPE,
                soddisfatto      boolean
              )
              LANGUAGE plpgsql
              STABLE
              AS $$
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Verifica se tutti i prerequisiti di un template flusso
                --   sono soddisfatti per la pratica indicata.
                --   Funzione fn_check_*: puro boolean per riga, no raise.
                --
                -- Regole:
                --   - Un prerequisito e' soddisfatto se esiste almeno un
                --     flusso per la stessa pratica con quel template_flusso_id
                --     in stato COMPLETATO (codice_interno).
                -- =========================================================

                RETURN QUERY
                SELECT
                  tfp.prerequisito_id,
                  tf.codice,
                  tf.descrizione,
                  EXISTS (
                    SELECT 1
                      FROM pratiche.flussi f
                      JOIN config.stati_flussi_pratiche sfp ON sfp.id = f.stato_id
                     WHERE f.pratica_id        = p_pratica_id
                       AND f.template_flusso_id = tfp.prerequisito_id
                       AND sfp.codice_interno   = 'COMPLETATO'
                  ) AS soddisfatto
                FROM pratiche.template_flussi_prerequisiti tfp
                JOIN pratiche.template_flussi tf ON tf.id = tfp.prerequisito_id
                WHERE tfp.template_flusso_id = p_template_flusso_id;
              END;
              $$;

              COMMENT ON FUNCTION pratiche.fn_check_prerequisiti_flusso(bigint, integer)
                IS 'Pure check: ritorna prerequisiti con flag soddisfatto per pratica/template.';
