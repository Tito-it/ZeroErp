# Liquibase changelog per Zero ERP
# Trigger business-specific su allegati_pratiche e allegati_flussi
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/pratiche/20260303-53-trigger-business-allegati-mctit.yaml

  - changeSet:
      id: 20260303-53-trigger-business-allegati
      author: mctit
      runOnChange: false
      comment: >
        Applica trigger giornale su pratiche.allegati_pratiche e
        pratiche.allegati_flussi (AFTER INSERT).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- =========================================================
              -- Trigger giornale su allegati
              -- =========================================================

              -- 1. allegati_pratiche: ALLEGATO_AGGIUNTO su INSERT
              DROP TRIGGER IF EXISTS trg_allegati_pratiche_z90_giornale_ins
              ON pratiche.allegati_pratiche;

              CREATE TRIGGER trg_allegati_pratiche_z90_giornale_ins
              AFTER INSERT
              ON pratiche.allegati_pratiche
              FOR EACH ROW
              EXECUTE FUNCTION pratiche.trgfn_allegati_pratiche_giornale();

              COMMENT ON TRIGGER trg_allegati_pratiche_z90_giornale_ins
              ON pratiche.allegati_pratiche
              IS 'Logga ALLEGATO_AGGIUNTO nel giornale su INSERT allegato pratica.';

              -- 2. allegati_flussi: ALLEGATO_AGGIUNTO su INSERT
              DROP TRIGGER IF EXISTS trg_allegati_flussi_z90_giornale_ins
              ON pratiche.allegati_flussi;

              CREATE TRIGGER trg_allegati_flussi_z90_giornale_ins
              AFTER INSERT
              ON pratiche.allegati_flussi
              FOR EACH ROW
              EXECUTE FUNCTION pratiche.trgfn_allegati_flussi_giornale();

              COMMENT ON TRIGGER trg_allegati_flussi_z90_giornale_ins
              ON pratiche.allegati_flussi
              IS 'Logga ALLEGATO_AGGIUNTO nel giornale su INSERT allegato flusso.';
