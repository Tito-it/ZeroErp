databaseChangeLog:
  - changeSet:
      id: 20250825-01-automations-job-procs
      author: mctit
      runOnChange: true
      validCheckSums: 
        - ANY
      comments: >
        Wrapper per l'esecuzione del job automations job

      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              -- TX_ID
              CREATE OR REPLACE PROCEDURE maintenance.proc_automations_tx_id_job()
              LANGUAGE plpgsql AS $$
              BEGIN
                PERFORM maintenance.fn_run_and_log(
                  p_jobname  := 'automations_tx_id',
                  p_stepname := 'run_automations_tx_id',
                  p_sql      := 'SELECT dbops.fn_run_automations_tx_id(''SCHEDULED'', NULL, false);',
                  p_lock_key := hashtext('automations_tx_id')
                );
              END;
              $$;

              -- AUDIT_UPDATE
              CREATE OR REPLACE PROCEDURE maintenance.proc_automations_audit_update_job()
              LANGUAGE plpgsql AS $$
              BEGIN
                PERFORM maintenance.fn_run_and_log(
                  p_jobname  := 'automations_audit_update',
                  p_stepname := 'run_automations_audit_update',
                  p_sql      := 'SELECT dbops.fn_run_automations_audit_update(''SCHEDULED'', NULL, false);',
                  p_lock_key := hashtext('automations_audit_update')
                );
              END;
              $$;

              -- STORICO (provision tabelle)
              CREATE OR REPLACE PROCEDURE maintenance.proc_automations_storico_provision_job()
              LANGUAGE plpgsql AS $$
              BEGIN
                PERFORM maintenance.fn_run_and_log(
                  p_jobname  := 'automations_storico_provision',
                  p_stepname := 'run_automations_storico_provision',
                  p_sql      := 'SELECT dbops.fn_run_automations_storico_provision(''SCHEDULED'', NULL, false);',
                  p_lock_key := hashtext('automations_storico_provision')
                );
              END;
              $$;

              -- STORICO (trigger)
              CREATE OR REPLACE PROCEDURE maintenance.proc_automations_storico_job()
              LANGUAGE plpgsql AS $$
              BEGIN
                PERFORM maintenance.fn_run_and_log(
                  p_jobname  := 'automations_storico',
                  p_stepname := 'run_automations_storico',
                  p_sql      := 'SELECT dbops.fn_run_automations_storico(''SCHEDULED'', NULL, false);',
                  p_lock_key := hashtext('automations_storico')
                );
              END;
              $$;

              -- ATTIVO
              CREATE OR REPLACE PROCEDURE maintenance.proc_automations_attivo_job()
              LANGUAGE plpgsql AS $$
              BEGIN
                PERFORM maintenance.fn_run_and_log(
                  p_jobname  := 'automations_attivo',
