                  p_sql      := 'SELECT dbops.fn_run_automations_attivo(''SCHEDULED'', NULL, false);',
                  p_lock_key := hashtext('automations_attivo')
                );
              END;
              $$;

              
  - changeSet:
      id: 20250825-90-automations-job-procs
      author: mctit
      changes:
        - tagDatabase:
            tag: 220250811-01-automations-job-procs
