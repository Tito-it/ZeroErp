databaseChangeLog:
  - changeSet:
      id: 20250809-03-pr_run_apply_storicizza_defaults_job
      author: mctit
      runOnChange: true
      validCheckSums: 
        - ANY
      comments: >
        Wrapper per l'esecuzione del job run_apply_storicizza_defaults_job
      
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE PROCEDURE maintenance.proc_apply_storicizza_defaults_job()
                LANGUAGE plpgsql AS $$
                BEGIN
                  PERFORM maintenance.fn_run_and_log(
                    p_jobname  := 'apply_storicizza_weekly',
                    p_stepname := 'run_proc_apply_storicizza',
                    p_sql      := 'call dbops.proc_apply_storicizza_defaults();',
                    p_lock_key := hashtext('proc_apply_storicizza_defaults')  -- evita overlap
                  );
                END;
                $$;

              
  - changeSet:
      id: 20250809-90-pr_run_apply_storicizza_defaults_job
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250809-03-pr_run_apply_storicizza_defaults_job
