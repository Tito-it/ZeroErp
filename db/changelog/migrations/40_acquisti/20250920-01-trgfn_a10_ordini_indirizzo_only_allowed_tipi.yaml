# ------------------------------------------------------------
# SPDX-License-Identifier: AGPL-3.0-or-later
# Zero ERP — acquisti.ordini: validazione tipi indirizzo
# ------------------------------------------------------------
databaseChangeLog:
  # 1) Correggi comment refuso su FK tipo
  - changeSet:
      id: 20250920-01-trgfn_a10_ordini_indirizzo_only_allowed_tipi
      author: mctit
      changes:
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
                 CREATE OR REPLACE FUNCTION acquisti.trgfn_a10_ao_only_consegna_tipo_con()
                          RETURNS trigger
                            LANGUAGE plpgsql
                            AS $$
                            DECLARE
                              v_codice text;
                            BEGIN
                              -- indirizzo_consegna_id deve puntare a un indirizzo di tipo CON
                              SELECT ti.codice_interno
                                INTO v_codice
                                FROM anagrafiche.indirizzi i
                                JOIN config.tipi_indirizzi ti ON ti.id = i.tipo_indirizzo_id
                              WHERE i.id = NEW.indirizzo_consegna_id;

                              IF v_codice IS DISTINCT FROM 'CON' THEN

                                  PERFORM script.fn_log_and_raise_error(
                                    'database', TG_NAME, 'E_TIPO_INDIRIZZO',
                                    jsonb_build_object('table', 'acquisti.ordini',
                                    'ordine_id', NEW.id,
                                    'indirizzo_consegna_id', NEW.indirizzo_consegna_id,
                                    'codice_interno', v_codice),
                                    NULL::uuid,  NEW.id::text, v_codice, 'ordini' , 'CON'
                                  );
                              END IF;

                              RETURN NEW;
                  
                            END;
                  $$;
              
  # ) Trigger _a10: solo su INSERT e UPDATE OF indirizzo_consegna_id
  - changeSet:
      id: 20250920-02-trgfn_a10_ordini_indirizzo_only_allowed_tipi
      author: mctit
      changes:
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              DROP TRIGGER IF EXISTS trg_a10_ins_upd_ao_only_consegna_tipo_con ON acquisti.ordini;

              CREATE TRIGGER trg_a10_ins_upd_ao_only_consegna_tipo_con
              BEFORE INSERT OR UPDATE OF indirizzo_consegna_id
              ON acquisti.ordini
              FOR EACH ROW
              EXECUTE FUNCTION acquisti.trgfn_a10_ao_only_consegna_tipo_con();
 
  # Metto un tag fine modifiche
  - changeSet:
      id: 20250920-90-trgfn_a10_ordini_indirizzo_only_allowed_tipi
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250920-01-trgfn_a10_ordini_indirizzo_only_allowed_tipi