databaseChangeLog:
  - changeSet:
      id: 20250916-31-acq-ordini-protect-num-refactor-v1
      author: mctit
      preConditions:
        - onFail: HALT
        - tableExists: { schemaName: acquisti, tableName: ordini }
      changes:
        - sql:
            splitStatements: false
            sql: |
              -- Drop vecchio trigger/funzione (se esistono)
              DROP TRIGGER IF EXISTS trg_a10_ordini_ao_protect_num ON acquisti.ordini;
              DROP FUNCTION IF EXISTS acquisti.trgfn_a10_ordini_ao_protect_num();

              -- Nuova funzione: blocca numero/serie/anno/data dopo stati bloccanti
              CREATE OR REPLACE FUNCTION acquisti.trgfn_a10_ordini_protect_num()
              RETURNS trigger
              LANGUAGE plpgsql AS $$
              DECLARE
                v_codice_stato text;
              BEGIN
                -- legge il codice interno dello stato corrente
                SELECT s.codice_interno
                  INTO v_codice_stato
                  FROM config.stati_doc_ordini s
                 WHERE s.id = OLD.stato_doc_ordine_id;

                IF v_codice_stato IN ('SENT','CONFIRMED','RECEIVED','INVOICED','CANCELLED') THEN
                  IF NEW.numero IS DISTINCT FROM OLD.numero
                     OR NEW.serie IS DISTINCT FROM OLD.serie
                     OR NEW.anno  IS DISTINCT FROM OLD.anno
                     OR NEW.data  IS DISTINCT FROM OLD.data THEN
                    PERFORM script.fn_log_and_raise_error(
                      'database', TG_NAME, 'E_NUMERAZIONE_IMMUTABILE',
                      jsonb_build_object('ordine_id', OLD.id, 'stato', v_codice_stato),
                      NULL::uuid, 'acquisti.ordini', OLD.id::text
                    );
                  END IF;
                END IF;

                RETURN NEW;
              END$$;

              -- Trigger
              CREATE TRIGGER trg_a10_ordini_protect_num
              BEFORE UPDATE ON acquisti.ordini
              FOR EACH ROW
              EXECUTE FUNCTION acquisti.trgfn_a10_ordini_protect_num();

              COMMENT ON TRIGGER trg_a10_ordini_protect_num ON acquisti.ordini
                IS 'Blocca numero/serie/anno/data dopo stati: SENT|CONFIRMED|RECEIVED|INVOICED|CANCELLED';

  # Metto un tag fine modifiche
  - changeSet:
      id: 20250916-90-acq-ordini-protect-num-refactor_v1
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250916-31-acq-ordini-protect-num-refactor_v1