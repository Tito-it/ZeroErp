databaseChangeLog:
  - changeSet:
      id: 20250507-01-trg_stati_cliente_upd_lock_codiceinterno  
      author: mctit
      runOnChange: true   
      validCheckSums:
        - ANY
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
                -- 1) Creo/aggiorno il trigger che blocca modifiche al codice interno
                CREATE OR REPLACE TRIGGER trg_stati_cliente_upd_lock_codiceinterno
                  BEFORE UPDATE 
                  ON config.stati_cliente
                  FOR EACH ROW
                  WHEN (old.codice_interno::text IS DISTINCT FROM 
                        new.codice_interno::text)
                EXECUTE FUNCTION script.trgfn_lock_columns(
                  'codice_interno', 
                  'CODICE_NON_MODIFICABILE'
                );

                -- 2) Aggiungo un commento al trigger di lock
                COMMENT ON TRIGGER trg_stati_cliente_upd_lock_codiceinterno 
                ON config.stati_cliente
                IS 'Blocca la modifica del codice stato cliente interno';
