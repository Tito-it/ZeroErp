databaseChangeLog:

  
  - changeSet:
      id: 20250514-11  
      author: mctit
      runOnChange: true   
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
                -- 1) Creo/aggiorno il trigger che blocca modifiche al codice interno
                CREATE OR REPLACE TRIGGER  trg_upd_ambiti_audit_data_user
                  BEFORE UPDATE 
                  ON config.ambiti
                  FOR EACH ROW
                EXECUTE FUNCTION script.trgfn_upd_audit_data_user_generic();
                
                -- 2) Aggiungo un commento al trigger di lock
                COMMENT ON TRIGGER trg_upd_ambiti_audit_data_user 
                ON config.ambiti
                IS 'Aggiorna(audit) i valori di data e user ';
