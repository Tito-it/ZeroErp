databaseChangeLog:
  
  ############################################################
  # 1) drop trigger function trgfn_sync_stato_iso2
  ############################################################
  - changeSet:
      id: 20250803-01-trgfn_drop_sync_stato_iso2
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      changes:
        - sql:
            comment: "Drop trigger esistente e ricrea trigger sync"
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_sync_stato_iso2 
                ON config.tipi_soggetto_dettaglio;  
        - sql:
            comment: "Drop Function trgfn_sync_stato_iso2"
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS config.trgfn_sync_stato_iso2();
              

  
  
  - changeSet:
      id: 20250803-90-trgfn_drop_sync_stato_iso2
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250803-01-trgfn_drop_sync_stato_iso2