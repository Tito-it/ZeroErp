databaseChangeLog:
  

  - changeSet:
      id: 20250507-03-trg_tipi_attivita_upd_lock_codiceinterno  
      author: mctit
      runOnChange: true 
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
                -- 1) Creo/aggiorno il trigger che blocca modifiche al codice interno
                CREATE OR REPLACE TRIGGER trg_tipi_attivita_upd_lock_codiceinterno
                BEFORE UPDATE 
                ON config.tipi_attivita
                FOR EACH ROW
                WHEN (old.cd_int_tipo_attivita::text IS DISTINCT FROM new.cd_int_tipo_attivita::text)
                EXECUTE FUNCTION script.trgfn_lock_columns(
                  'cd_int_tipo_attivita', 
                  'CODICE_NON_MODIFICABILE'
                );

                -- 2) Aggiungo un commento al trigger di lock
                COMMENT ON TRIGGER trg_tipi_attivita_upd_lock_codiceinterno ON config.tipi_attivita
                IS 'Blocco modifica del codice interno tipo attività';
