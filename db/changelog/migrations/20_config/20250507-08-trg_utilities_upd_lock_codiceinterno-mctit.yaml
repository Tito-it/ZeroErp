databaseChangeLog:
  

  - changeSet:
      id: 20250507-08-trg_utilities_upd_lock_codiceinterno
      author: mctit
      runOnChange: true 
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
                -- 1) Creo/aggiorno il trigger che blocca modifiche al codice interno
                CREATE OR REPLACE TRIGGER trg_utilities_upd_lock_codiceinterno
                BEFORE UPDATE 
                ON config.utilities
                FOR EACH ROW
                WHEN (old.cd_int_utility::text IS DISTINCT FROM 
                      new.cd_int_utility::text)
                EXECUTE FUNCTION script.trgfn_lock_columns(
                  'cd_int_utility', 
                  'CODICE_NON_MODIFICABILE'
                );

                -- 2) Aggiungo un commento al trigger di lock
                COMMENT ON TRIGGER trg_utilities_upd_lock_codiceinterno 
                ON config.utilities
                IS 'Il codice interno utility non può essere modificato';