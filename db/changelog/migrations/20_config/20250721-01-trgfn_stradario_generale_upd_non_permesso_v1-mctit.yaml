  ############################################################
  # 1) Function per bloccare la modifica di stradario generale se presente su
  ############################################################
databaseChangeLog:
  - changeSet:
      id: 20250721-01-trgfn_stradario_generale_upd_non_permesso_v1
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      comments: >
        Trigger‐function che blocca UPDATE su config.stradario_generale 
        (descrizione, descrizione_breve, toponomastica_id) solo se esiste un record 
        in config.stradario, segnalando esattamente quale colonna è stata modificata.
      changes:
        - sql:
            comment: "1) Rimuove trigger e funzione precedente"
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_stradario_generale_upd_non_permesso
                ON config.stradario_generale;
              DROP FUNCTION IF EXISTS config.trgfn_stradario_generale_upd_non_permesso();

        - sql:
            comment: "2) Crea la nuova trigger‐function con controllo dipendenza + colonna specifica"
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION config.trgfn_stradario_generale_upd_non_permesso()
                RETURNS trigger
                LANGUAGE plpgsql
              AS $$
              BEGIN
                -- Se il record non è usato in config.stradario, lascio passare
                IF NOT EXISTS (
                  SELECT 1
                    FROM config.stradario
                   WHERE stradario_generale_id = OLD.id
                ) THEN
                  RETURN NEW;
                END IF;

                -- Se siamo qui, il record è in uso: controllo ciascuna colonna
                IF OLD.descrizione IS DISTINCT FROM NEW.descrizione THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database',
                    TG_NAME,
                    'E_COLONNA_NON_MODIFICABILE',
                    jsonb_build_object('column','descrizione','id',OLD.id),
                     NULL::uuid,
                    'descrizione'
                  );
                END IF;

                IF OLD.descrizione_breve IS DISTINCT FROM NEW.descrizione_breve THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database',
                    TG_NAME,
                    'E_COLONNA_NON_MODIFICABILE',
                    jsonb_build_object('column','descrizione_breve','id',OLD.id),
                     NULL::uuid,
                    'descrizione_breve'
                  );
                END IF;

                IF OLD.toponomastica_id IS DISTINCT FROM NEW.toponomastica_id THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database',
                    TG_NAME,
                    'E_COLONNA_NON_MODIFICABILE',
                    jsonb_build_object('column','toponomastica_id','id',OLD.id),
                     NULL::uuid,
                    'toponomastica_id'
                  );
                END IF;

                RETURN NEW;
              END;
              $$;

        - sql:
            comment: "3) Commento sulla trigger‐function"
            splitStatements: false
            sql: |
              COMMENT ON FUNCTION config.trgfn_stradario_generale_upd_non_permesso()
                IS 'Blocca UPDATE di descrizione, descrizione_breve, toponomastica_id se esistono righe in config.stradario, indicando la colonna modificata';

        - sql:
            comment: "4) Ricrea il trigger"
            splitStatements: false
            sql: |
              CREATE TRIGGER trg_stradario_generale_upd_non_permesso
                BEFORE UPDATE OF descrizione, descrizione_breve, toponomastica_id
                ON config.stradario_generale
                FOR EACH ROW
                EXECUTE FUNCTION config.trgfn_stradario_generale_upd_non_permesso();

        - sql:
            comment: "5) Commento sul trigger"
            splitStatements: false
            sql: |
              COMMENT ON TRIGGER trg_stradario_generale_upd_non_permesso
                ON config.stradario_generale
                IS 'Quando il record è in uso in config.stradario, blocca UPDATE delle colonne specificate e segnala quale';

            
  - changeSet:
      id: 20250721-90-trgfn_stradario_generale_upd_non_permesso_v1
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250721-01-trgfn_stradario_generale_upd_non_permesso_v1