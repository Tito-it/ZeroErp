databaseChangeLog:
  

  - changeSet:
      id: 20250507-02-trg_stati_pratiche_upd_lock_codiceinterno  
      author: mctit
      runOnChange: true 
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
                -- 1) Creo/aggiorno il trigger che blocca modifiche al codice interno
                CREATE OR REPLACE TRIGGER trg_stati_pratiche_upd_lock_codiceinterno
                  BEFORE UPDATE 
                  ON config.stati_pratiche
                  FOR EACH ROW
                  WHEN (old.cd_int_stato::text IS DISTINCT FROM 
                  new.cd_int_stato::text)
                EXECUTE FUNCTION script.trgfn_lock_columns(
                  'cod_int_stato', 
                  'CODICE_NON_MODIFICABILE'
                );

                -- 2) Aggiungo un commento al trigger di lock
                COMMENT ON TRIGGER trg_stati_pratiche_upd_lock_codiceinterno ON 
                config.stati_pratiche
                IS 'Blocco del codice interno stato pratica';