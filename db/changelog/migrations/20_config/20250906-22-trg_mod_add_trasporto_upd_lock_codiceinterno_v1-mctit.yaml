databaseChangeLog:
  

  - changeSet:
      id: 20250906-22-trg_mod_add_trasporto_upd_lock_codiceinterno_v1
      author: mctit
      runOnChange: true 
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
                -- 1) Creo/aggiorno il trigger che blocca modifiche al codice interno
                CREATE OR REPLACE TRIGGER trg_mod_add_trasporto_upd_lock_codiceinterno
                BEFORE UPDATE
                ON config.modalita_addebito_trasporto
                FOR EACH ROW
                WHEN (old.codice_interno::text IS DISTINCT FROM 
                      new.codice_interno::text)
                EXECUTE FUNCTION script.trgfn_lock_columns(
                  'codice_interno', 
                  'CODICE_NON_MODIFICABILE'
                );

                -- 2) Aggiungo un commento al trigger di lock
                COMMENT ON TRIGGER trg_mod_add_trasporto_upd_lock_codiceinterno
                ON config.modalita_addebito_trasporto
                IS 'Il codice interno  non può essere modificato';
