databaseChangeLog:  
  - changeSet:
      id: 20250803-03-trg_tipi_soggetto_dettaglio_ins_upd_sync_stato_iso2
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      comment: >
        Crea trigger su config.tipi_soggetto_dettaglio per assegnare stato_iso2
        tramite funzione script.trgfn_sync_stato_iso2, sincronizzando il campo
        stato_iso2.
      changes:
        - sql:
            comment: "2) Rimuove eventuale trigger esistente"
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_tipi_soggetto_dettaglio_ins_upd_sync_stato_iso2
                ON config.tipi_soggetto_dettaglio;

        - sql:
            comment: "1) Crea trigger " 
            splitStatements: false
            stripComments: true
            sql: |
              CREATE TRIGGER trg_tipi_soggetto_dettaglio_ins_upd_sync_stato_iso2
              BEFORE INSERT OR UPDATE ON config.tipi_soggetto_dettaglio
              FOR EACH ROW
              EXECUTE FUNCTION script.trgfn_sync_stato_iso2();

        - sql:
            comment: "Commento descrittivo sul  trigger"
            splitStatements: false      
            sql: |
                  COMMENT ON TRIGGER trg_tipi_soggetto_dettaglio_ins_upd_sync_stato_iso2
                    ON config.tipi_soggetto_dettaglio
                      IS 'Crea trigger su config.tipi_soggetto_dettaglio per assegnare stato_iso2 tramite
                          funzione script.trgfn_sync_stato_iso2, sincronizzando il campo stato_iso2.';

  # Metto un tag fine modifiche
  - changeSet:
      id: 20250803-90-trg_tipi_soggetto_dettaglio_ins_upd_sync_stato_iso2
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250803-03-trg_tipi_soggetto_dettaglio_ins_upd_sync_stato_iso2