databaseChangeLog:  
  - changeSet:
      id: 20250729-34-trg_Z90_parameter_overrides_upd_dlt_storico
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      comment: >
        Crea trigger su config.parameter_overrides per generare storico.parameter_overrides.
      changes:
        
        - sql:
            comment: "1) Rimuove eventuale trigger esistente"
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_Z90_parameter_overrides_upd_dlt_storico
                ON config.parameter_overrides;
        - sql:
            comment: "2) Ricrea il trigger con progressivo _Z90  " 
            splitStatements: false
            stripComments: true
            sql: |
                  CREATE TRIGGER trg_Z90_parameter_overrides_upd_dlt_storico
                    BEFORE UPDATE OR DELETE
                    ON config.parameter_overrides
                    FOR EACH ROW
                    EXECUTE FUNCTION script.trgfn_upd_dlt_storico_generic(
                      'parameter_override_id'
                    );
        - sql:
            comment: "Commento descrittivo sul  trigger"
            splitStatements: false      
            sql: |
                  COMMENT ON TRIGGER trg_Z90_parameter_overrides_upd_dlt_storico
                    ON config.parameter_overrides
                      IS ' Crea trigger su config.parameter_overrides 
                      per generare storico.parameter_overrides(snapshot)';

  

  # Metto un tag fine modifiche
  - changeSet:
      id: 20250729-90-trg_Z90_parameter_overrides_upd_dlt_storico
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250729-34-trg_Z90_parameter_overrides_upd_dlt_storico