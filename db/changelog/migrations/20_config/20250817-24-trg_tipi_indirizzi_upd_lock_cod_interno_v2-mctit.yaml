databaseChangeLog:
  

  - changeSet:
      id: 220250817-24-trg_tipi_indirizzi_upd_lock_cod_interno_v2
      author: mctit
      runOnChange: true 
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
                -- 1) Creo/aggiorno il trigger che blocca modifiche al codice interno
                CREATE OR REPLACE TRIGGER trg_tipi_indirizzi_upd_lock_cod_interno
                BEFORE UPDATE 
                ON config.tipi_indirizzi
                FOR EACH ROW
                WHEN (old.codice_interno::text IS DISTINCT FROM 
                      new.codice_interno::text)
                EXECUTE FUNCTION script.trgfn_lock_columns(
                  'codice_interno', 
                  'CODICE_NON_MODIFICABILE'
                );

                -- 2) Aggiungo un commento al trigger di lock
                COMMENT ON TRIGGER trg_tipi_indirizzi_upd_lock_cod_interno 
                ON config.tipi_indirizzi
                IS 'Il codice interno tipo indirizzo non può essere modificato';
