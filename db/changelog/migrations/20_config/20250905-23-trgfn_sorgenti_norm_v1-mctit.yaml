databaseChangeLog:
  
  - changeSet:
      id: 20250905-23-trgfn_sorgenti_norm_v1
      author: mctit
      runOnChange: true 
      changes:
        
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              -- Normalizza codice_interno (UPPER/TRIM) + audit generico (usiamo già la tua trigger fn)
              CREATE OR REPLACE FUNCTION config.trgfn_sorgenti_norm()
              RETURNS trigger LANGUAGE plpgsql AS $$
              BEGIN
                IF NEW.codice_interno IS NOT NULL THEN
                  NEW.codice_interno := upper(btrim(NEW.codice_interno));
                END IF;
                RETURN NEW;
              END$$;

              DROP TRIGGER IF EXISTS trg_sorgenti_ins_upd_norm ON config.sorgenti;
              CREATE TRIGGER trg_sorgenti_ins_upd_norm
              BEFORE INSERT OR UPDATE ON config.sorgenti
              FOR EACH ROW EXECUTE FUNCTION config.trgfn_sorgenti_norm();