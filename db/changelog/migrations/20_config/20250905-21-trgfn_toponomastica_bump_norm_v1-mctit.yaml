databaseChangeLog:
  
  - changeSet:
      id: 20250905-21-trgfn_toponomastica_bump_norm_v1
      author: mctit
      runOnChange: true 
      changes:
        
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              CREATE OR REPLACE FUNCTION config.trgfn_toponomastica_bump_norm()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $$
              BEGIN
                -- Tocco le righe figlie: il trigger su stradario_generale ricalcolerà il normalizzato
                UPDATE config.stradario_generale
                   SET toponomastica_id = toponomastica_id  -- no-op per scatenare il BEFORE
                 WHERE toponomastica_id = NEW.id;
                RETURN NEW;
              END$$;

              DROP TRIGGER IF EXISTS trg_toponomastica_bump_norm
                ON config.toponomastica;

              CREATE TRIGGER trg_toponomastica_bump_norm
              AFTER UPDATE OF descrizione
              ON config.toponomastica
              FOR EACH ROW
              EXECUTE FUNCTION config.trgfn_toponomastica_bump_norm();