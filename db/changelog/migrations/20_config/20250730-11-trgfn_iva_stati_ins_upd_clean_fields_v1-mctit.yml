databaseChangeLog:
   
  - changeSet:
      id: 20250730-11-trgfn_iva_stati_ins_upd_clean_fields_v1
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      comment: >
          Function che pulisce i campi di iva_stati in config.iva_stati e imposta i valori di default
          per le colonne che non hanno un valore specificato. (esempio: stato_id)
      changes:
        - sql:
            splitStatements: false
            sql: |              
                 CREATE OR REPLACE FUNCTION config.trgfn_iva_stati_ins_upd_clean_fields()
                    RETURNS trigger
                    LANGUAGE plpgsql
                  AS $$
                  BEGIN
                    ------------------------------------------------------------------
                    -- 1) Imposta stato_id di default da config.stati se è NULL
                    IF NEW.stato_id IS NULL THEN
                      NEW.stato_id := script.fn_get_default_by_param(
                        'config',           -- schema della tabella lookup
                        'stati',            -- tabella di lookup
                        'codice_iso3',        -- colonna di filtro in config.stati
                        'state_code_iso3',  -- codice parametro in config.parameters
                        TG_NAME             -- nome del trigger chiamante
                      )::integer;           -- cast al tipo integer di stato_id
                    END IF;
                    ------------------------------------------------------------------
                    -- 2) Altri cleanup (esempi)
                    --IF NEW.nome IS NOT NULL THEN
                    --  NEW.nome := UPPER(TRIM(NEW.nome));
                    --END IF;
                    --IF NEW.cognome IS NOT NULL THEN
                      --NEW.cognome := UPPER(TRIM(NEW.cognome));
                   -- END IF;
                    ------------------------------------------------------------------
                    RETURN NEW;
                  END;
                  $$;

                 COMMENT ON FUNCTION config.trgfn_iva_stati_ins_upd_clean_fields()
                  IS $comment$
                  'Function che pulisce i campi di iva_stati in config.iva_stati e imposta i valori di default
                       per le colonne che non hanno un valore specificato. (esempio: stato_id)';
                     $comment$

  - changeSet:
      id: 20250730-12-trgfn_iva_stati_ins_upd_clean_fields_v1
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      comment: >
          Trigger che pulisce i campi di iva_stati in config.iva_stati e imposta i valori di default
          per le colonne che non hanno un valore specificato. (esempio: stato_id)
      changes:
        - sql:
            splitStatements: false
            sql: |              
                -- Trigger collegato
                  DROP TRIGGER IF EXISTS trg_iva_stati_ins_upd_clean_fields ON config.iva_stati;

                  CREATE TRIGGER trg_iva_stati_ins_upd_clean_fields
                    BEFORE INSERT OR UPDATE ON config.iva_stati
                    FOR EACH ROW
                    EXECUTE FUNCTION config.trgfn_iva_stati_ins_upd_clean_fields();

                  -- Commento sul trigger
                  COMMENT ON TRIGGER trg_iva_stati_ins_upd_clean_fields ON config.iva_stati
                    IS $comment$ 
                    'Trigger che pulisce i campi di iva_stati in config.iva_stati e imposta i valori di default
                        per le colonne che non hanno un valore specificato. (esempio: stato_id)';
                    $comment$

  # Tag di fine modifica 
  - changeSet:
      id: 20250730-90-trgfn_iva_stati_ins_upd_clean_fields_v1
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250730-11-trgfn_iva_stati_ins_upd_clean_fields_v1