databaseChangeLog:
  
  - changeSet:
      id: 20250603-01-fn_generate_codice_v1
      author: mctit
      comments: >
        Crea la funzione generica script.fn_generate_codice(tipo TEXT) che:
        - legge da config.sistema_codici i parametri per quel tipo
        - invoca nextval sul nome di sequenza
        - concatena prefisso, separatore e numero formattato
      changes:
        - sql:
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_generate_codice;  
        - sqlFile:
            path: sql/fn_generate_codice_v1.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false


# Metto un  tag fine modifiche
  - changeSet:
      id: 20250603-90-fn_generate_codice_v1
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250603-01-fn_generate_codice_v1