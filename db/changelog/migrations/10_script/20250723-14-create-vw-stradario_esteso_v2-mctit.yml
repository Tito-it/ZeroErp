databaseChangeLog:  
  - changeSet:
      id: 20250723-14-create-vw-stradario_esteso_v2
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      comments: "CREATE OR REPLACE VIEW via Liquibase"
      changes:
        - createView:
            schemaName: script
            viewName: vw_stradario_esteso
            replaceIfExists: true     # qui facciamo OR REPLACE
            selectQuery: |
              SELECT
                v.id AS id_via,
                t.id AS id_toponomastica,
                t.descrizione AS tipo_toponimo,
                s.sigla_stato,
                v.descrizione AS nome_strada,
                v.descrizione_breve,
                concat(t.descrizione, ' ', v.descrizione) AS indirizzo_generale
              FROM config.stradario_generale v
                JOIN config.toponomastica t ON v.toponomastica_id = t.id
                LEFT JOIN config.stati s ON t.stato_id = s.id;

        - sql:
            comment: "Mantiene il commento sulla view"
            splitStatements: false
            sql: |
              COMMENT ON VIEW script.vw_stradario_esteso
                IS 'Stradario esteso: tipo toponimo + nome strada, 
                      stato e indirizzo composito.';


  # Metto un tag fine modifiche
  - changeSet:
      id: 20250723-90-create-vw-stradario_esteso_v2
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250723-14-create-vw-stradario_esteso_v2
