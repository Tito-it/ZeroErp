databaseChangeLog:
  
  # 
  - changeSet:
      id: 20250813-11-fn_ensure_logconn_v2
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      changes:
        - sql:
            splitStatements: false
            sql: |
                -- DROP FUNCTION IF EXISTS script.trgfn_lock_columns();
                CREATE OR REPLACE FUNCTION script.fn_ensure_logconn()
                RETURNS void LANGUAGE plpgsql
                SET search_path = public, pg_temp
                 AS $$
                DECLARE v_conn text := current_setting('myapp.dblink_log_connection', true);
                BEGIN
                  IF coalesce(current_setting('myapp.log_with_dblink', true), 'on') <> 'on' THEN
                    RETURN;
                  END IF;
                  --  
                  IF v_conn IS NULL OR length(trim(v_conn))=0 THEN RETURN; END IF;
                  -- se esiste già 'logconn', non riconnettere
                  IF 'logconn' = ANY (public.dblink_get_connections()) THEN
                    RETURN;
                  END IF; 

                  PERFORM public.dblink_connect('logconn'::text, v_conn); 
                  EXCEPTION WHEN duplicate_object THEN NULL;
                  WHEN SQLSTATE '53300' THEN
                  -- too_many_connections: non bloccare l'operazione chiamante
                  RETURN;
                END; 
                $$;

                COMMENT ON FUNCTION script.fn_ensure_logconn()
                  IS 'Verifica che la connessione dblink logconn sia attiva. 
                      Se non lo è, la crea usando la GUC dblink.log_connection.';

# Metto un  tag fine modifiche
  - changeSet:
      id: 20250813-90-fn_ensure_logconn_v2
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250813-11-fn_ensure_logconn_v2