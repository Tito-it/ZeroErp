databaseChangeLog:
  # 
  - changeSet:
      id: 20250709-12-fn_get_parameter_full_v2
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      changes:
        - sql:
            splitStatements: false
            sql: |
                  CREATE OR REPLACE FUNCTION script.fn_get_parameter_full(
                      p_code          TEXT,
                      p_tenant_id     INTEGER DEFAULT NULL,
                      p_user_id       INTEGER DEFAULT NULL,
                      p_session_key   TEXT    DEFAULT NULL,
                      p_function_name TEXT    DEFAULT NULL
                  )
                  RETURNS TEXT
                  LANGUAGE plpgsql
                  AS $$
                  DECLARE
                      v_param_id    BIGINT;
                      v_default     TEXT;
                      v_override    TEXT;
                     
                  BEGIN
                      

                      -- 1. Recupera id e default_value del parametro
                      SELECT id, default_value
                        INTO v_param_id, v_default
                        FROM config.parameters
                      WHERE code = p_code;

                      IF NOT FOUND THEN
                          -- Se il parametro non esiste, logga l'errore e solleva un'eccezione  
                          PERFORM script.fn_log_and_raise_error(
                              'database',
                              'fn_get_parameter_full',
                              'ERRORE_PARAMETRI_TABELLA',
                              jsonb_build_object(
                                'codice_parametro', p_code,
                                'nome_tabella',      'config.parameters'
                              ),
                              NULL::uuid,                                        
                              'config.parameters', p_code::text 
                            );

                      END IF;

                      -- 2. Cerca l'override più specifico
                      SELECT overridden_value
                        INTO v_override
                        FROM config.parameter_overrides
                      WHERE parameter_id = v_param_id
                        AND (
                            (function_name   IS NOT NULL AND function_name   = p_function_name)
                          OR (session_key     IS NOT NULL AND session_key     = p_session_key)
                          OR (user_id         IS NOT NULL AND user_id         = p_user_id)
                          OR (tenant_id       IS NOT NULL AND tenant_id       = p_tenant_id)
                        )
                      ORDER BY
                        CASE
                          WHEN function_name   = p_function_name THEN 1
                          WHEN session_key     = p_session_key   THEN 2
                          WHEN user_id         = p_user_id       THEN 3
                          WHEN tenant_id       = p_tenant_id     THEN 4
                          ELSE 5
                        END
                      LIMIT 1;

                      -- 3. Se trovato un override, restituiscilo; altrimenti il default
                      IF FOUND THEN
                          RETURN v_override;
                      ELSE
                          RETURN v_default;
                      END IF;
                  END;
                  $$;


                  COMMENT ON FUNCTION script.fn_get_parameter_full(TEXT, INTEGER, INTEGER, TEXT, TEXT) IS
                    'Cerca in config.parameters il parametro con code = p_code e prende il suo default_value.
                      Cerca in config.parameter_overrides tutti gli override che corrispondono al parameter_id 
                      e a uno dei quattro ambiti non-null.
                      Li ordina in base alla priorità funzione (1) → sessione (2) → utente (3) → tenant (4),
                       prendendo il primo valore trovato.
                      Se non ci sono override validi, restituisce il default_value.';
                
  # Tag di fine modifica per fn_get_messaggio v2
  - changeSet:
