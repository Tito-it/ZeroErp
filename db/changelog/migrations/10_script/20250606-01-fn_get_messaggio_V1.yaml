databaseChangeLog:
  
  # Versione 2 (quando modifichi la logica)
  - changeSet:
      id: 20250606-01-fn_get_messaggio_v1
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      changes:
        - sql:
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_get_messaggio(text, text, text);
        - sqlFile:
            path: sql/fn_get_messaggio_v1.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false

