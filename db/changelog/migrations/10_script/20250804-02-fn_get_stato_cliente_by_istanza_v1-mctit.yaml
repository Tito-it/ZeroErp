databaseChangeLog:
  - changeSet:
      id: 220250804-02-fn_get_stato_cliente_by_istanza_v1
      author: mctit
      runOnChange: true
      comments: "restituisce lo stato di un cliente in base all'istanza"
      validCheckSums:
        - ANY
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            comment: "restituisce lo stato di un cliente in base all'istanza"
            splitStatements: false
            sql: |     
                    CREATE OR REPLACE FUNCTION script.fn_get_stato_cliente_by_istanza(
                        p_istanza_id INTEGER
                    ) 
                    RETURNS INTEGER
                    LANGUAGE plpgsql
                    STABLE 
                    AS $$
                    BEGIN
                     -- 1. Funzione di recupero stato_cliente per un'istanza
                      SELECT COALESCE(
                        (SELECT c.stato_cliente_id
                          FROM anagrafiche.clienti c
                          WHERE c.istanza_utility_id = p_istanza_id 
                          ORDER BY c.id DESC
                          LIMIT 1),
                        (SELECT id
                          FROM config.stati_cliente
                          WHERE codice_interno = 'IS'
                          LIMIT 1)
                      );
                    END
                    $$;

        - sql:
            comment: "restituisce lo stato di un cliente in base all'istanza"
            splitStatements: false
            sql: |
                  COMMENT ON FUNCTION script.fn_get_stato_cliente_by_istanza(INTEGER)
                    IS  $$ Restituisce lo stato di un cliente in base alla istanza. $$;

  - changeSet:
      id: 220250804-90-fn_get_stato_cliente_by_istanza_v1 
      author: mctit
      changes:
        - tagDatabase:
            tag: 2220250804-02-fn_get_stato_cliente_by_istanza_v1
