databaseChangeLog:
  - changeSet:
      id: 20250709-01-fn_get_tipo_contatto_id
      author: mctit
      runOnChange: true
      comments: "Recupera l'ID del tipo di contatto dal codice interno"
      validCheckSums:
        - ANY
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            comment: "Recupera l'ID del tipo di contatto dal codice interno"
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_get_tipo_contatto_id(
                  p_cod_int_tipo_contatto CHARACTER VARYING
              )
              RETURNS INTEGER
              STABLE
              LANGUAGE plpgsql
              AS $$
              DECLARE
                  v_id  INTEGER;
                  v_tx  UUID;
              BEGIN
                  -- 0) Recupero o genero il tx_id per il log
                  v_tx := dbops.fn_get_or_create_session_tx_id();

                  -- 1) Recupera l'ID del tipo di contatto
                  SELECT id
                    INTO v_id
                    FROM config.tipi_contatti
                  WHERE cod_int_tipo_contatto = p_cod_int_tipo_contatto;

                  -- 2) Se non trovato, loggo e sollevo eccezione
                  IF v_id IS NULL THEN
                  
                      PERFORM script.fn_log_and_raise_error(
                          'database',                                 -- p_area
                          'script.fn_get_tipo_contatto_id',           -- p_function_name
                          'E_DEFAULT_CONTATTO_MISSING',                -- p_error_code
                          jsonb_build_object(                         -- p_context
                            'cod_int_tipo_contatto', p_cod_int_tipo_contatto,
                            'tabella', 'config.tipi_contatti',
                            'campo', 'cod_int_tipo_contatto'
                          ),
                          v_tx ,                                        -- p_tx_id       
                          VARIADIC ARRAY[]::text[]
                      );
                      
                  END IF;

                  RETURN v_id;
              END;
              $$;

        - sql:
            comment: "Aggiunge commento"
            splitStatements: false
            sql: |
              COMMENT ON FUNCTION script.fn_get_tipo_contatto_id(character varying)
              IS $$Recupera l'ID del tipo di contatto dal codice interno$$;  

  - changeSet:
      id: 20250709-90-fn_get_tipo_contatto_id
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250709-01-fn_get_tipo_contatto_id
