databaseChangeLog:
  - changeSet:
      id: 20250707-61-trgfn_lock_columns
      author: mctit
      comments: "Crea o sostituisce la trigger function script.trgfn_lock_columns"
      runOnChange: true
      validCheckSums:
        - ANY
      changes:
        
        - sql:
            comment: "2) Crea la funzione trgfn_lock_columns"
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.trgfn_lock_columns()
                RETURNS trigger
                LANGUAGE plpgsql
                COST 100
                VOLATILE NOT LEAKPROOF
              AS $BODY$
              DECLARE
                n_args  int := array_length(TG_ARGV, 1);
                i       int;
                col     text;
                msgcode text;
                oldval  text;
                newval  text;
              BEGIN
               

                -- 1) Se il numero di argomenti non è pari, errore
                IF n_args % 2 <> 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database',
                    TG_NAME,
                    'E_ARGOMENTI_A_COPPIE',
                    jsonb_build_object('expected_pairs', n_args/2),
                    NULL::uuid,
                    VARIADIC ARRAY[]::text[]
                  );
                END IF;

                -- 2) Ciclo sulle coppie (colonna, codice messaggio)
                FOR i IN 1..n_args BY 2 LOOP
                  col     := TG_ARGV[i-1];
                  msgcode := TG_ARGV[i];

                  -- Leggo dinamicamente OLD.col e NEW.col
                  EXECUTE format(
                    'SELECT ($1).%I::text, ($2).%I::text',
                    col, col
                  ) USING OLD, NEW INTO oldval, newval;

                  IF oldval IS DISTINCT FROM newval THEN
                    PERFORM script.fn_log_and_raise_error(
                      'database',
                      TG_NAME,
                      msgcode,
                      jsonb_build_object(
                        'column',    col,
                        'old_value', oldval,
                        'new_value', newval
                      ),
                      NULL::uuid,
                      col
                    );
                  END IF;
                END LOOP;

                RETURN NEW;
              END;
              $BODY$;


        - sql:
            comment: "4) Commento descrittivo sulla funzione"
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION script.trgfn_lock_columns()
                IS 'Verifica che le colonne specificate non vengano modificate: in caso contrario logga e solleva errore.';

  - changeSet:
      id: 20250707-90-trgfn_lock_columns
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250707-61-trgfn_lock_columns



