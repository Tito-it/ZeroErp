databaseChangeLog:
  
  ############################################################
  # 1) Creo la trigger‐function per sincronizzare stato_iso2
  ############################################################
  - changeSet:
      id: 20250803-02-trgfn_sync_stato_iso2
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      changes:
        - sql:
            comment: "Function per sovrascrivere il campo stato_iso2 da stato_id"
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION script.trgfn_sync_stato_iso2()
              RETURNS trigger
              LANGUAGE plpgsql AS $$
              BEGIN
              -- Sincronizza stato_iso2 da config.stati basandosi su stato_id
                SELECT s.codice_iso2
                  INTO NEW.stato_iso2
                  FROM config.stati s
                 WHERE s.id = NEW.stato_id;
                RETURN NEW;
              END;
              $$;

              COMMENT ON FUNCTION script.trgfn_sync_stato_iso2()
              IS $$
                Sincronizza il campo stato_iso2 
                basandosi sul valore di stato_id: prima di ogni INSERT o UPDATE,
                recupera da config.stati il codice_iso2 corrispondente e lo assegna
                a NEW.stato_iso2, garantendo che i due campi rimangano sempre
                coerenti.
              $$;

 
  - changeSet:
      id: 20250803-90-trgfn_sync_stato_iso2
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250803-02-trgfn_sync_stato_iso2
