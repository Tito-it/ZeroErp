databaseChangeLog:
  
  # Versione 2 (quando modifichi la logica)
  - changeSet:
      id: 20250602-11-fn_get_stradario_v2
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      changes:
        - sql:
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_get_stradario(integer, text);
        - sqlFile:
            path: sql/fn_get_stradario_v2.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false

# Metto un  tag fine modifiche
  - changeSet:
      id: 20250602-12-fn_get_stradario_v2
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250602-12-fn_get_stradario_v1