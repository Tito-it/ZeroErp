databaseChangeLog:
  
  # Versione 2 (quando modifichi la logica)
  - changeSet:
      id: 20250616-01-fn_log_and_raise_error
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      comments: >
        La funzione script.fn_log_and_raise_error centralizza il flusso di gestione errori in PL/pgSQL: 
        recupera testo, causa e soluzione dal catalogo dei messaggi, scrive un record nel log errori 
        e quindi rialza un’eccezione con dettaglio e hint. 
      changes:
        - sql:
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_log_and_raise_error(text, text, text, jsonb);
              CREATE OR REPLACE FUNCTION script.fn_log_and_raise_error(
                p_area           TEXT,           -- 'database' / 'backend' / 'frontend'
                p_function_name  TEXT,           -- nome di trigger o funzione chiamante
                p_error_code     TEXT,           -- codice testuale di messaggio
                p_context        JSONB DEFAULT '{}'::jsonb  -- payload di contesto
              )
              RETURNS VOID
              LANGUAGE plpgsql
              VOLATILE
              AS $$
              DECLARE
                v_id          BIGINT;
                v_messaggio   TEXT;
                v_causa       TEXT;
                v_soluzione   TEXT;
                v_lingua      TEXT := coalesce(
                                  current_setting('myapp.user_language', TRUE),
                                  'it'
                                );
              BEGIN
                -- 1) Unica SELECT per id, messaggio, causa, soluzione (tutte NULL se non trovato)
                SELECT id, messaggio, causa, soluzione
                  INTO v_id, v_messaggio, v_causa, v_soluzione
                  FROM config.messaggi_errore
                WHERE codice = p_error_code
                  AND lingua = v_lingua;

                -- 2) Se non trovato, imposto valori di default
                IF NOT FOUND THEN
                  v_messaggio := '[MESSAGGIO NON DEFINITO: ' || p_error_code || ']';
                  v_causa     := 'Catalogo non contiene ' 
                              || quote_literal(p_error_code)
                              || ' per lingua ' 
                              || quote_literal(v_lingua);
                  v_soluzione := 'Verificare record in config.messaggi_errore con codice='
                              || quote_literal(p_error_code)
                              || ' e lingua='
                              || quote_literal(v_lingua);
                  v_id := NULL;
                END IF;

                -- 3) Single INSERT nel log usando v_id che può essere NULL
                INSERT INTO dbops.error_log(
                  occurred_at,
                  area,
                  function_name,
                  messaggio_errore_id,
                  context,
                  tx_id
                ) VALUES (
                  now(),
                  p_area,
                  p_function_name,
                  v_id,
                  p_context,
                  (md5(txid_current()::text))::uuid
                );

                -- 4) Rialzo l’eccezione con messaggio + detail + hint
                RAISE EXCEPTION '%', coalesce(v_messaggio, '[Errore sconosciuto]')
                  USING
                    DETAIL = coalesce(v_causa, ''),
                    HINT   = coalesce(v_soluzione, '');
              END;
              $$;


              COMMENT ON FUNCTION script.fn_log_and_raise_error(text, text, text, jsonb)
                  IS 'La funzione fn_log_and_raise_error centralizza il flusso di gestione errori in PL/pgSQL: 
                  recupera testo, causa e soluzione dal catalogo dei messaggi, scrive un record nel log errori 
                  e quindi rialza una eccezione con dettaglio e hint.';
  

# Metto un  tag fine modifiche
  - changeSet:
