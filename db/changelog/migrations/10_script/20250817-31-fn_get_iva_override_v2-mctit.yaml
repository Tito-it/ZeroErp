databaseChangeLog:
  - changeSet:
      id: 20250817-31-fn_get_iva_override_v2
      author: mctit
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            comment: "Elimina la precedente funzione in config"
            splitStatements: false
            sql: |     
                    DROP FUNCTION IF EXISTS config.fn_get_iva_override(text, integer);

  - changeSet:
      id: 20250817-32-fn_get_iva_override_v2
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            comment: "Restituisce i dati base e override per un codice IVA in un determinato Stato"
            splitStatements: false
            sql: |     
                    CREATE OR REPLACE FUNCTION script.fn_get_iva_override(
                      p_codice_iva text,
                      p_stato_id integer)
                        RETURNS TABLE(id_iva integer, codice_iva character, desc_iva character varying, 
                        desc_breve_iva character varying, aliquota_base numeric, assoggettamento_base character, 
                        aliquota numeric, assoggettamento character, id_natura_iva integer, conto_iva_acquisti_id integer, 
                        conto_iva_vendita_id integer, stato_id integer, stato_sigla character varying, 
                        data_insert timestamp without time zone, user_insert text, 
                        data_update timestamp without time zone, user_update text) 
                        LANGUAGE 'sql'
                        COST 100
                        STABLE PARALLEL UNSAFE
                        ROWS 1000

                    AS $BODY$
                      SELECT
                        i.id,
                        i.codice,
                        i.descrizione,
                        i.descrizione_breve,
                        i.aliquota_iva      AS aliquota_base,
                        i.assoggettamento_iva AS assoggettamento_base,
                        COALESCE(s.aliquota_override, i.aliquota_iva)         AS aliquota,
                        COALESCE(s.assoggettamento_override, i.assoggettamento_iva) AS assoggettamento,
                        i.natura_iva_id,
                        i.conto_iva_acquisti_id,
                        i.conto_iva_vendita_id,
                        st.id                    AS stato_id,
                        st.sigla_stato           AS stato_sigla,
                        i.data_insert,
                        i.user_insert,
                        i.data_update,
                        i.user_update
                      FROM config.iva i
                      JOIN config.stati st
                        ON st.id = p_stato_id
                      LEFT JOIN config.iva_stati s
                        ON s.iva_id   = i.id
                      AND s.stato_id = p_stato_id
                      WHERE i.codice = p_codice_iva;
                    $BODY$;


        - sql:
            splitStatements: false
            sql: |
                  COMMENT ON FUNCTION script.fn_get_iva_override(text, integer)
                    IS 'Restituisce i dati base e override per un codice IVA in un determinato Stato.';

  - changeSet:
      id: 20250817-90-fn_get_iva_override_v2
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250817-31-fn_get_iva_override_v2