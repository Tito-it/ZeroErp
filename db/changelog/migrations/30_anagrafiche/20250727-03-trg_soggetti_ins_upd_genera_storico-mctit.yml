databaseChangeLog:  
  - changeSet:
      id: 20250727-03-trg_soggetti_ins_upd_genera_storico
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      comment: >
        Crea trigger su anagrafiche.soggetti per generare storico.soggetti.
      changes:
        - sql:
            comment: "2) Rimuove eventuale trigger esistente"
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_Z90_soggetti_upd_dlt_storico
                ON anagrafiche.soggetti;
            
        - sql:
            comment: "2) Ricrea il trigger come BEFORE che FOLLOWS il trigger di normalizzazione " 
            splitStatements: false
            stripComments: true
            sql: |
                  CREATE TRIGGER trg_Z90_soggetti_upd_dlt_storico
                    BEFORE UPDATE OR DELETE
                    ON anagrafiche.soggetti
                    FOR EACH ROW
                    EXECUTE FUNCTION script.trgfn_upd_dlt_storico_generic(
                      'soggetto_id'
                    );

        - sql:
            comment: "Commento descrittivo sul  trigger"
            splitStatements: false      
            sql: |
                  COMMENT ON TRIGGER trg_Z90_soggetti_upd_dlt_storico
                    ON anagrafiche.soggetti
                      IS ' Crea trigger su anagrafiche.soggetti 
                      per generare storico.soggetti(snapshot)';

  # Metto un tag fine modifiche
  - changeSet:
      id: 20250726-90-trg_soggetti_ins_upd_genera_storico
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250726-03-trg_soggetti_ins_upd_genera_storico