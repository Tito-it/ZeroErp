databaseChangeLog:

  
  - changeSet:
      id: 20250805-02-anagrafiche.trgfn_istanze_utilities_upd_protect_codice_istanza_v1
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      comments: >
         Protegge il codice istanza in modo che non possa essere modificato dopo essere stato valorizzato.
      changes:

        - sql:
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.trgfn_istanze_utilities_upd_protect_codice()
                    RETURNS trigger
                    LANGUAGE plpgsql 
                  AS $$
                  BEGIN
                    IF TG_OP = 'UPDATE'
                      AND OLD.codice IS NOT NULL
                      AND NEW.codice IS DISTINCT FROM OLD.codice
                    THEN
                      
                      PERFORM script.fn_log_and_raise_error(
                        'database',
                        TG_NAME,
                        'E_COLONNA_NON_MODIFICABILE',
                        jsonb_build_object('column','codice (istanza)','id',OLD.id),
                        NULL::uuid,
                        'codice (istanza)'
                      );
                    END IF;
                    RETURN NEW;
                  END;
                  $$;
 
              COMMENT ON FUNCTION anagrafiche.trgfn_istanze_utilities_upd_protect_codice()
                IS $comment$    
                  Triggere per proteggere il campo codice istanza da modifiche dopo la prima valorizzazione.
                $comment$;
        - sql:
            splitStatements: false  
            sql: |

             
              
              DROP TRIGGER IF EXISTS trg_istanze_utilities_upd_protect_codice
                ON anagrafiche.istanze_utilities;  
              CREATE TRIGGER trg_istanze_utilities_upd_protect_codice
                BEFORE UPDATE ON anagrafiche.istanze_utilities
                FOR EACH ROW
                EXECUTE FUNCTION anagrafiche.trgfn_istanze_utilities_upd_protect_codice();

              COMMENT ON TRIGGER trg_istanze_utilities_upd_protect_codice
                ON anagrafiche.istanze_utilities
                IS $comment$
                  Trigger per proteggere il campo codice istanza da modifiche dopo la prima valorizzazione.
                $comment$;

