databaseChangeLog:

  
  - changeSet:
      id: 20250804-17-anagrafiche.trgfn_istanze_utilities_upd_protect_codice_istanza_v1
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      comments: >
         Protegge il codice_istanza in modo che non possa essere modificato dopo essere stato valorizzato.
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.trgfn_istanze_utilities_upd_protect_codice_istanza()
                    RETURNS trigger
                    LANGUAGE plpgsql 
                  AS $$
                  BEGIN
                    IF TG_OP = 'UPDATE'
                      AND OLD.codice_istanza IS NOT NULL
                      AND NEW.codice_istanza IS DISTINCT FROM OLD.codice_istanza
                    THEN
                      
                      PERFORM script.fn_log_and_raise_error(
                        'database',
                        TG_NAME,
                        'E_COLONNA_NON_MODIFICABILE',
                        jsonb_build_object('column','codice_istanza','id',OLD.id),
                        NULL::uuid,
                        'codice_istanza'
                      );
                    END IF;
                    RETURN NEW;
                  END;
                  $$;
 
              COMMENT ON FUNCTION anagrafiche.trgfn_upd_istanze_utilities_protect_codice_istanza()
                IS $comment$    
                  Triggere per proteggere il campo codice_istanza da modifiche dopo la prima valorizzazione.
                $comment$;
        - sql:
            splitStatements: false  
            sql: |

              DROP TRIGGER IF EXISTS trg_upd_istanze_utilities_protect_codice_istanza
                ON anagrafiche.istanze_utilities;
              DROP FUNCTION IF EXISTS anagrafiche.trgfn_upd_istanze_utilities_protect_codice_istanza();



              DROP TRIGGER IF EXISTS trg_istanze_utilities_upd_protect_codice_istanza
                ON anagrafiche.istanze_utilities;
              CREATE TRIGGER trg_istanze_utilities_upd_protect_codice_istanza
                BEFORE UPDATE ON anagrafiche.istanze_utilities
                FOR EACH ROW
                EXECUTE FUNCTION anagrafiche.trgfn_istanze_utilities_upd_protect_codice_istanza();

              COMMENT ON TRIGGER trg_istanze_utilities_upd_protect_codice_istanza
                ON anagrafiche.istanze_utilities
                IS $comment$
                  Trigger per proteggere il campo codice_istanza da modifiche dopo la prima valorizzazione.
                $comment$;

