databaseChangeLog:

  - changeSet:
      id: 20250904-03-trgfn_resellers_ins_upd_normalize_v1
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      comments: >
         Protegge il codice in modo che non possa essere modificato dopo essere stato valorizzato.
      changes:
        - sql:
            splitStatements: false
            sql: |
                
                 CREATE OR REPLACE FUNCTION anagrafiche.trgfn_resellers_norm()
                  RETURNS trigger LANGUAGE plpgsql AS $$
                  BEGIN
                    IF NEW.codice IS NOT NULL THEN
                      NEW.codice := upper(btrim(NEW.codice));
                    ELSE
                      NEW.codice := script.fn_generate_codice('resellers');
                    END IF;
                    RETURN NEW;
                  END$$;

                   COMMENT ON FUNCTION anagrafiche.trgfn_resellers_norm()
                    IS 'Normalizza il codice emittente fiscale (UPPER/TRIM).';

                  DROP TRIGGER IF EXISTS trg_resellers_ins_upd_norm ON anagrafiche.resellers;
                  CREATE TRIGGER trg_resellers_ins_upd_norm
                  BEFORE INSERT OR UPDATE ON anagrafiche.resellers
                  FOR EACH ROW EXECUTE FUNCTION anagrafiche.trgfn_resellers_norm();

                 
  
# Metto un  tag fine modifiche
  - changeSet:
      id: 20250904-90-trgfn_resellers_ins_upd_normalize_v1
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250904-03-trgfn_resellers_ins_upd_normalize_v1