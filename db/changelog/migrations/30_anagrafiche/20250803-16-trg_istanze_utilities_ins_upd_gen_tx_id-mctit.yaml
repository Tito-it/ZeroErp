databaseChangeLog:  
  - changeSet:
      id: 20250803-14-trg_istanze_utilities_ins_upd_gen_tx_id
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      comment: >
        Crea trigger su anagrafiche.istanze_utilities per assegnare tx_id tramite
        funzione dbops.trgfn_tx_id_managed.
      changes:
        - sql:
            comment: "2) Rimuove eventuale trigger esistente"
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_istanze_utilities_ins_upd_gen_tx_id
                ON anagrafiche.istanze_utilities;
            
        - sql:
            comment: "1) Crea trigger " 
            splitStatements: false
            stripComments: true
            sql: |
              CREATE TRIGGER trg_istanze_utilities_ins_upd_gen_tx_id
              BEFORE INSERT OR UPDATE ON anagrafiche.istanze_utilities
              FOR EACH ROW
              EXECUTE FUNCTION dbops.trgfn_tx_id_managed();

        - sql:
            comment: "Commento descrittivo sul  trigger"
            splitStatements: false      
            sql: |
                  COMMENT ON TRIGGER trg_istanze_utilities_ins_upd_gen_tx_id
                    ON anagrafiche.istanze_utilities
                      IS 'Crea trigger su anagrafiche.istanze_utilities per assegnare tx_id tramite
                          funzione dbops.trgfn_tx_id_managed solo se il campo NEW.tx_id è NULL';

  # Metto un tag fine modifiche
  - changeSet:
      id: 20250803-90-trg_istanze_utilities_ins_upd_gen_tx_id
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250803-14-trg_istanze_utilities_ins_upd_gen_tx_id