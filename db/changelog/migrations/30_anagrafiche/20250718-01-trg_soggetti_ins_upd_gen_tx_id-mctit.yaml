databaseChangeLog:  
  - changeSet:
      id: 20250718-01-trg_soggetti_ins_upd_gen_tx_id
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      comment: >
        Crea trigger su anagrafiche.soggetti per assegnare tx_id tramite funzione
        dbops.trgfn_tx_id_managed solo se il campo NEW.tx_id è NULL.
      changes:
        - sql:
            comment: " Rimuove eventuale trigger esistente"
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_soggetti_ins_upd_gen_tx_id
                ON anagrafiche.soggetti;
      
        - sql:
            comment: " Crea  trigger "
            splitStatements: false
            stripComments: true
            sql: |
              CREATE TRIGGER trg_soggetti_ins_upd_gen_tx_id
              BEFORE INSERT OR UPDATE ON anagrafiche.soggetti
              FOR EACH ROW
              EXECUTE FUNCTION dbops.trgfn_tx_id_managed();
        - sql:
            comment: "Commento descrittivo sul trigger"
            splitStatements: false      
            sql: |
                  COMMENT ON TRIGGER trg_soggetti_ins_upd_gen_tx_id
                    ON anagrafiche.soggetti
                      IS 'Crea trigger su anagrafiche.soggetti per assegnare tx_id tramite funzione
                          dbops.trgfn_tx_id_managed solo se il campo NEW.tx_id è NULL.';

  # Metto un tag fine modifiche
  - changeSet:
      id: 220250718-90-trg_soggetti_ins_upd_gen_tx_id
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250718-01-trg_soggetti_ins_upd_gen_tx_id