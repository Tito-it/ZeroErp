databaseChangeLog:
   
  - changeSet:
      id: 20250804-11-trgfn_istanze_utilities_ins_upd_clean_fields_v1
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      comment: >
          Function che pulisce i campi di istanze_utilities in anagrafiche.istanze_utilities e imposta i valori di default
          per le colonne che non hanno un valore specificato. 
      changes:
        - sql:
            splitStatements: false
            sql: |              
                 CREATE OR REPLACE FUNCTION anagrafiche.trgfn_istanze_utilities_ins_upd_clean_fields()
                    RETURNS trigger
                    LANGUAGE plpgsql
                  AS $$
                  BEGIN
                    

                    ----------------------------------------------------------------
                    -- 1) Generazione codice automatico
                    IF NEW.codice IS NULL THEN
                      NEW.codice := script.fn_generate_codice('istanze_utilties');
                    END IF;
  
                    
                    ------------------------------------------------------------------
                    RETURN NEW;
                  END;
                  $$;

                 COMMENT ON FUNCTION anagrafiche.trgfn_istanze_utilities_ins_upd_clean_fields()
                  IS $comment$
                  'Function che pulisce i campi di istanze_utilities in anagrafiche.istanze_utilities e imposta i valori di default
                       per le colonne che non hanno un valore specificato. (esempio: stato_id)';
                     $comment$

  - changeSet:
      id: 20250804-11A-trgfn_istanze_utilities_ins_upd_clean_fields_v1
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      comment: >
          Trigger che pulisce i campi di istanze_utilities in anagrafiche.istanze_utilities e imposta i valori di default
          per le colonne che non hanno un valore specificato.
      changes:
        - sql:
            splitStatements: false
            sql: |              
                -- Trigger collegato
                  DROP TRIGGER IF EXISTS trg_istanze_utilities_ins_upd_clean_fields ON anagrafiche.istanze_utilities;

                  CREATE TRIGGER trg_istanze_utilities_ins_upd_clean_fields
                    BEFORE INSERT OR UPDATE ON anagrafiche.istanze_utilities
                    FOR EACH ROW
                    EXECUTE FUNCTION anagrafiche.trgfn_istanze_utilities_ins_upd_clean_fields();

                  -- Commento sul trigger
                  COMMENT ON TRIGGER trg_istanze_utilities_ins_upd_clean_fields ON anagrafiche.istanze_utilities
                    IS $comment$ 
                    'Trigger che pulisce i campi di istanze_utilities in anagrafiche.istanze_utilities e imposta i valori di default
                        per le colonne che non hanno un valore specificato.';
                    $comment$

  # Tag di fine modifica 
  - changeSet:
      id: 20250730-90-trgfn_istanze_utilities_ins_upd_clean_fields_v1
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250730-11-trgfn_istanze_utilities_ins_upd_clean_fields_v1