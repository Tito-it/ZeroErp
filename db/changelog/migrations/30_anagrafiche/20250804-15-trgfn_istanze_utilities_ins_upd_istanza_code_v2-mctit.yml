databaseChangeLog:

  
  - changeSet:
      id: 20250804-15-trgfn_istanze_utilities_ins_upd_istanza_code_v2
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      comments: >
        Elimino la funzione trigger anagrafiche.trgfn_istanze_utilities_ins_upd_genera_codice_istanza e relativo trigger
        che generava il campo codice istanza in anagrafiche.istanze_utilities.
      changes:
        - sql:
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_istanze_utilities_ins_set_istanza_codice
                ON anagrafiche.istanze_utilities;
               
              DROP FUNCTION IF EXISTS script.trgfn_istanze_utilities_ins_set_istanza_codice; 
              DROP FUNCTION IF EXISTS anagrafiche.trgfn_istanze_utilities_ins_set_istanza_codice; 
# Metto un  tag fine modifiche
  - changeSet:
      id: 20250804-90-trgfn_istanze_utilities_ins_upd_istanza_code_v2
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250804-15-trgfn_istanze_utilities_ins_upd_istanza_code_v2