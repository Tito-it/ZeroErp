databaseChangeLog:

  
  - changeSet:
      id: 20250804-18-anagrafiche.trgfn_upd_billing_account_protect_account_code_v1
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      comments: >
         Protegge il account_code in modo che non possa essere modificato dopo essere stato valorizzato.
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.trgfn_upd_billing_account_protect_account_code()
                    RETURNS trigger
                    LANGUAGE plpgsql 
                  AS $$
                  BEGIN
                    IF TG_OP = 'UPDATE'
                      AND OLD.account_code IS NOT NULL
                      AND NEW.account_code IS DISTINCT FROM OLD.account_code
                    THEN
                      
                      PERFORM script.fn_log_and_raise_error(
                        'database',
                        TG_NAME,
                        'E_COLONNA_NON_MODIFICABILE',
                        jsonb_build_object('column','account_code','id',OLD.id),
                        NULL::uuid,
                        'account_code'
                      );
                    END IF;
                    RETURN NEW;
                  END;
                  $$;
 
              COMMENT ON FUNCTION anagrafiche.trgfn_upd_billing_account_protect_account_code()
                IS $comment$    
                  Triggere per proteggere il campo account_code da modifiche dopo la prima valorizzazione.
                $comment$;
        - sql:
            splitStatements: false  
            sql: |
              DROP TRIGGER IF EXISTS trg_upd_billing_account_protect_account_code
                ON anagrafiche.billing_account;
              CREATE TRIGGER trg_upd_billing_account_protect_account_code
                BEFORE UPDATE ON anagrafiche.billing_account
                FOR EACH ROW
                EXECUTE FUNCTION anagrafiche.trgfn_upd_billing_account_protect_account_code();

              COMMENT ON TRIGGER trg_upd_billing_account_protect_account_code
                ON anagrafiche.billing_account
                IS $comment$
                  Trigger per proteggere il campo account_code da modifiche dopo la prima valorizzazione.
                $comment$;

# Metto un  tag fine modifiche
  - changeSet:
