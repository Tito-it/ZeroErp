databaseChangeLog:
  

  - changeSet:
      id: 20250831-50-trgfn_fornitore_ins_upd_check_ruolo_fornitore
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      changes:
        - sql:
            splitStatements: false
            sql: |
               
               -- 1) (Ri)Creo la funzione aggiornata
                CREATE OR REPLACE FUNCTION anagrafiche.trgfn_fornitori_ins_upd_check_ruolo_fornitore()
                    RETURNS trigger
                    LANGUAGE plpgsql
                AS $$
                BEGIN
                      
                      --   Ogni volta che inserisco/aggiorno in fornitori, gestisco la
                      --   creazione/verifica della riga corrispondente in soggetti_ruoli
                      --   alimentando poi in NEW.soggetto_ruolo_id il record finale.

                    -- Sostituisco NEW.soggetto_ruolo_id con l'ID vero (nuovo o esistente),
                    -- delegando completamente alla funzione generica:
                    NEW.soggetto_ruolo_id := script.fn_check_ins_soggetto_ruolo(
                                              p_soggetto_id       := NEW.soggetto_id,
                                              p_soggetto_ruolo_id := NEW.soggetto_ruolo_id,
                                              p_cd_int_ruolo      := 'FO'
                                            );
                    RETURN NEW;
                END;
                $$;


                COMMENT ON FUNCTION anagrafiche.trgfn_fornitori_ins_upd_check_ruolo_fornitore() IS
                  'Trigger che, prima di inserire/aggiornare in anagrafiche.fornitori,
                  chiama fn_check_ins_soggetto_ruolo per creare o validare il legame
                  soggetto→ruolo (cd_int_ruolo = ''FO'').';




# Metto un  tag fine modifiche
  - changeSet:
      id: 20250831-90-trgfn_fornitore_ins_upd_check_ruolo_fornitore
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250831-50-trgfn_fornitore_ins_upd_check_ruolo_fornitore