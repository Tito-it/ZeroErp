databaseChangeLog:
  

  - changeSet:
      id: 20250904-08-trgfn_vettori_ins_upd_check_ruolo_vettore
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      changes:
        - sql:
            splitStatements: false
            sql: |
               
               -- 1) (Ri)Creo la funzione aggiornata
                CREATE OR REPLACE FUNCTION anagrafiche.trgfn_vettori_ins_upd_check_ruolo_vettore()
                    RETURNS trigger
                    LANGUAGE plpgsql
                AS $$
                BEGIN
                      -- FUNCTION: 
                      --   Ogni volta che inserisco/aggiorno in vettori, gestisco la
                      --   creazione/verifica della riga corrispondente in soggetti_ruoli
                      --   alimentando poi in NEW.soggetto_ruolo_id il record finale.

                    -- Sostituisco NEW.soggetto_ruolo_id con l'ID vero (nuovo o esistente),
                    -- delegando completamente alla funzione generica:
                    NEW.soggetto_ruolo_id := script.fn_check_ins_soggetto_ruolo(
                                              p_soggetto_id       := NEW.soggetto_id,
                                              p_soggetto_ruolo_id := NEW.soggetto_ruolo_id,
                                              p_cd_int_ruolo      := 'VET'
                                            );
                    RETURN NEW;
                END;
                $$;


                COMMENT ON FUNCTION anagrafiche.trgfn_vettori_ins_upd_check_ruolo_vettore() IS
                  'Trigger che, prima di inserire/aggiornare in anagrafiche.vettori,
                  chiama fn_check_ins_soggetto_ruolo per creare o validare il legame
                  soggetto→ruolo (cd_int_ruolo = ''VET'').';



                CREATE OR REPLACE TRIGGER trg_vettori_ins_upd_check_ruolo_vettore
                    BEFORE INSERT OR UPDATE 
                    ON  anagrafiche.vettori
                    FOR EACH ROW
                    EXECUTE FUNCTION anagrafiche.trgfn_vettori_ins_upd_check_ruolo_vettore();

                COMMENT ON TRIGGER trg_vettori_ins_upd_check_ruolo_vettore ON anagrafiche.vettori
                    IS 'Controlla il ruolo del vettore prima di inserire o aggiornare. Se non esiste lo genera tramite la funzione script.fn_check_ins_soggetto_ruolo.';
 


# Metto un  tag fine modifiche
  - changeSet:
      id: 20250904-90-trgfn_vettori_ins_upd_check_ruolo_vettore
      author: mctit
