databaseChangeLog:
   
  - changeSet:
      id: 20250728-11-trgfn_dati_societari_ins_upd_check_tipo_soggetto_v1
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      comment: >
          Function che controlla che il soggetto associato in anagrafiche.dati_societari
          abbia tipo_soggetto_dettaglio con cod_int_tipo_soggetto ('SC','SP').
      changes:
        - sql:
            splitStatements: false
            sql: |              
                 -- Funzione per controllare tipo soggetto in dati_societari
                    CREATE OR REPLACE FUNCTION anagrafiche.trgfn_dati_societari_ins_upd_check_tipo_soggetto()
                    RETURNS TRIGGER AS $$
                    DECLARE
                      v_cod_int_tipo text;
                    BEGIN
                    -- Controlla che il soggetto associato abbia un tipo valido
                    -- solo SC e SP. In futuro si potrà estendere per altri tipi

                      SELECT tsd.cod_int_tipo_soggetto
                        INTO v_cod_int_tipo
                        FROM anagrafiche.soggetti s
                          JOIN config.tipi_soggetto_dettaglio tsd 
                            ON s.tipo_soggetto_dettaglio_id = tsd.id
                      WHERE s.id = NEW.soggetto_id;

                      IF v_cod_int_tipo NOT IN ('SC','SP') THEN
                        PERFORM script.fn_log_and_raise_error(
                          'database',
                          'anagrafiche.trgfn_check_tipo_soggetto_for_dati_societari',
                          'E_DATI_SOCIETARI_TIPO_SOGGETTO_NON_AMMESSO',
                          jsonb_build_object(
                            'soggetto_id', NEW.soggetto_id,
                            'cod_int_tipo_soggetto', v_cod_int_tipo
                          ),
                          NULL::uuid,
                          NEW.soggetto_id::text, v_cod_int_tipo
                        );
                      END IF;

                      RETURN NEW;
                    END;
                    $$ LANGUAGE plpgsql;


                 COMMENT ON FUNCTION anagrafiche.trgfn_dati_societari_ins_upd_check_tipo_soggetto()
                  IS $comment$
                  'Function che controlla che il soggetto associato in anagrafiche.dati_societari
                        abbia tipo_soggetto_dettaglio con cod_int_tipo_soggetto ('SC','SP').';
                     $comment$

  - changeSet:
      id: 20250728-12-trgfn_dati_societari_ins_upd_check_tipo_soggetto_v1
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      comment: >
          Trigger che controlla che il soggetto associato in anagrafiche.dati_societari
          abbia tipo_soggetto_dettaglio con cod_int_tipo_soggetto ('SC','SP').
      changes:
        - sql:
            splitStatements: false
            sql: |              
                -- Trigger collegato
                  DROP TRIGGER IF EXISTS trg_dati_societari_ins_upd_check_tipo_soggetto ON anagrafiche.dati_societari;

                  CREATE TRIGGER trg_dati_societari_ins_upd_check_tipo_soggetto
                    BEFORE INSERT OR UPDATE ON anagrafiche.dati_societari
                    FOR EACH ROW
                    EXECUTE FUNCTION anagrafiche.trgfn_dati_societari_ins_upd_check_tipo_soggetto();

                  -- Commento sul trigger
                  COMMENT ON TRIGGER trg_dati_societari_ins_upd_check_tipo_soggetto ON anagrafiche.dati_societari
                    IS $comment$ 
                    'Verifica che il soggetto associato abbia cod_int_tipo_soggetto (SC,SP)';
                    $comment$

  # Tag di fine modifica 
  - changeSet:
      id: 20250728-90-trgfn_dati_societari_ins_upd_check_tipo_soggetto_v1
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250728-11-trgfn_dati_societari_ins_upd_check_tipo_soggetto_v1