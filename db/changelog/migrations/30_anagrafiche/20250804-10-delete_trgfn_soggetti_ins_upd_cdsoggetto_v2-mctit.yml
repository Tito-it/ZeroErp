databaseChangeLog:

  
  - changeSet:
      id: 20250818-10-trgfn_soggetti_ins_upd_cdsoggetto_v2
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      comments: >
        Elimino la funzione trigger anagrafiche.trgfn_soggetti_ins_upd_genera_cdsoggetto e relativo trigger
        che generava il campo cdsoggetto in anagrafiche.soggetti.
      changes:
        - sql:
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_soggetti_ins_upd_genera_cdsoggetto
                ON anagrafiche.soggetti;
              DROP FUNCTION IF EXISTS anagrafiche.trgfn_soggetti_ins_upd_genera_cdsoggetto;  
              DROP FUNCTION IF EXISTS script.trgfn_generate_codice_generic; 

# Metto un  tag fine modifiche
  - changeSet:
      id: 20250818-90-trgfn_soggetti_ins_upd_cdsoggetto_v2
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250818-10-trgfn_soggetti_ins_upd_cdsoggetto_v2