databaseChangeLog:

  
  - changeSet:
      id: 20250603-10-remove_trgfn_soggetti_ins__cdsoggetto
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      comments: >
        Rimuove il vecchio trigger e la rispettiva trigger function. 
        Ho commesso un errore sul precedente file che non li ha cancellati
      changes:
        - sql:
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_soggetti_ins_genera_cdsoggetto 
                ON anagrafiche.soggetti;
              DROP FUNCTION IF EXISTS anagrafiche.trgfn_soggetti_ins_genera_cdsoggetto;  
        

# Metto un  tag fine modifiche
  - changeSet:
      id: 20250603-90-remove_trgfn_soggetti_ins__cdsoggetto   
      author: mctit
      changes:
