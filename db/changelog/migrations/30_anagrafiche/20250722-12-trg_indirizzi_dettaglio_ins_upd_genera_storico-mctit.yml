databaseChangeLog:  
  - changeSet:
      id: 20250722-12-trg_indirizzi_dettaglio_ins_upd_genera_storico
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      comment: >
        Crea trigger su anagrafiche.indirizzi_dettaglio per generare storico.indirizzi_dettaglio.
      changes:
        - sql:
            comment: "2) Rimuove eventuale trigger esistente"
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_Z90_indirizzi_dettaglio_upd_dlt_storico
                ON anagrafiche.indirizzi_dettaglio;
            
        - sql:
            comment: "2) Ricrea il trigger come BEFORE che FOLLOWS il trigger di normalizzazione " 
            splitStatements: false
            stripComments: true
            sql: |
                  CREATE TRIGGER trg_Z90_indirizzi_dettaglio_upd_dlt_storico
                    BEFORE UPDATE OR DELETE
                    ON anagrafiche.indirizzi_dettaglio
                    FOR EACH ROW
                    EXECUTE FUNCTION script.trgfn_upd_dlt_storico_generic(
                      'indirizzo_dettaglio_id'
                    );

        - sql:
            comment: "Commento descrittivo sul  trigger"
            splitStatements: false      
            sql: |
                  COMMENT ON TRIGGER trg_Z90_indirizzi_dettaglio_upd_dlt_storico
                    ON anagrafiche.indirizzi_dettaglio
                      IS ' Crea trigger su anagrafiche.indirizzi_dettaglio 
                      per generare storico.indirizzi_dettaglio(snapshot)';

  # Metto un tag fine modifiche
  - changeSet:
      id: 220250722-90-trg_indirizzi_dettaglio_ins_upd_genera_storico
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250722-12-trg_indirizzi_dettaglio_ins_upd_genera_storico