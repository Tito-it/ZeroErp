databaseChangeLog:

  - changeSet:
      id: 20250904-04-trgfn_resellers_upd_protect_code_v1
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      comments: >
         Protegge il codice in modo che non possa essere modificato dopo essere stato valorizzato.
      changes:
        - sql:
            splitStatements: false
            sql: |
                
                  CREATE OR REPLACE FUNCTION anagrafiche.trgfn_a10_resellers_protect_codice()
                  RETURNS trigger LANGUAGE plpgsql AS $$
                  BEGIN
                      -- ===========================================================
                      -- A10 Protect: codice non modificabile dopo creazione
                      -- ===========================================================
                    IF TG_OP = 'UPDATE'
                      AND OLD.codice IS NOT NULL
                      AND NEW.codice IS DISTINCT FROM OLD.codice THEN
                      PERFORM script.fn_log_and_raise_error(
                        'database', TG_NAME, 'E_COLONNA_NON_MODIFICABILE',
                        jsonb_build_object('table','anagrafiche.resellers','column','codice','id',OLD.id),
                        NULL::uuid, 'codice (reseller)'
                      );
                    END IF;
                    RETURN NEW;
                  END$$;

                  COMMENT ON FUNCTION anagrafiche.trgfn_a10_resellers_protect_codice()
                    IS 'Blocca la modifica del codice (chiave interna) dopo la creazione.';

                  DROP TRIGGER IF EXISTS trg_a10_resellers_upd_protect_codice ON anagrafiche.resellers;
                  CREATE TRIGGER trg_a10_resellers_upd_protect_codice
                  BEFORE UPDATE ON anagrafiche.resellers
                  FOR EACH ROW EXECUTE FUNCTION anagrafiche.trgfn_a10_resellers_protect_codice();

                  

                 
  
# Metto un  tag fine modifiche
  - changeSet:
      id: 20250904-90-trgfn_resellers_upd_protect_code_v1
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250904-04-trgfn_resellers_upd_protect_code_v1