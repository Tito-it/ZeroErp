databaseChangeLog:
  
  # 
  - changeSet:
      id: 20250725-02-trgfn_indirizzi_sync_geoloc_v1
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      changes:
        - sql:
            splitStatements: false
            sql: |              
                CREATE OR REPLACE FUNCTION anagrafiche.trgfn_indirizzi_ins_upd_sync_geoloc()
                  RETURNS trigger LANGUAGE plpgsql AS $$
                  BEGIN
                    IF NEW.indirizzo_dettaglio_id IS NOT NULL THEN
                      SELECT civic_geoloc INTO NEW.geoloc
                        FROM anagrafiche.indirizzi_dettaglio
                      WHERE id = NEW.indirizzo_dettaglio_id;
                    END IF;
                    RETURN NEW;
                  END;
                  $$;

                COMMENT ON FUNCTION anagrafiche.trgfn_indirizzi_ins_upd_sync_geoloc()
                  IS 'La funzione di trigger per sincronizzare la geolocalizzazione degli indirizzi da anagrafiche.indirizzi_dettaglio.';


        - sql:
            splitStatements: false
            sql: |    
              DROP TRIGGER IF EXISTS trg_indirizzi_ins_upd_sync_geoloc
                ON anagrafiche.indirizzi;
              CREATE TRIGGER trg_indirizzi_ins_upd_sync_geoloc
                BEFORE INSERT OR UPDATE ON anagrafiche.indirizzi
                FOR EACH ROW
                EXECUTE FUNCTION anagrafiche.trgfn_indirizzi_ins_upd_sync_geoloc();

        - sql:
            comment: "Commento descrittivo sul  trigger"
            splitStatements: false      
            sql: |
                  COMMENT ON TRIGGER trg_indirizzi_ins_upd_sync_geoloc
                    ON anagrafiche.indirizzi
                      IS '  trigger per sincronizzare la geolocalizzazione degli indirizzi da anagrafiche.indirizzi_dettaglio,
                       esegue anagrafiche.trgfn_indirizzi_ins_upd_sync_geoloc()';

  # Tag di fine modifica per fn_get_messaggio v2
  - changeSet:
      id: 20250725-90-trgfn_indirizzi_sync_geoloc_v1
      author: mctit
      changes:
