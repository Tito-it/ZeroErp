databaseChangeLog:

  
  - changeSet:
      id: 20250901-11-anagrafiche.trgfn_fornitori_upd_protect_account_code_v1
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      comments: >
         Protegge il account_code in modo che non possa essere modificato dopo essere stato valorizzato.
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.trgfn_fornitori_upd_protect_account_code()
                    RETURNS trigger
                    LANGUAGE plpgsql 
                  AS $$
                  BEGIN
                    IF TG_OP = 'UPDATE'
                      AND OLD.codice IS NOT NULL
                      AND NEW.codice IS DISTINCT FROM OLD.codice
                    THEN
                      
                      PERFORM script.fn_log_and_raise_error(
                        'database',
                        TG_NAME,
                        'E_COLONNA_NON_MODIFICABILE',
                        jsonb_build_object('column','codice (fornitore)','id',OLD.id),
                        NULL::uuid,
                        'codice (fornitore)'
                      );
                    END IF;
                    RETURN NEW;
                  END;
                  $$;

              COMMENT ON FUNCTION anagrafiche.trgfn_fornitori_upd_protect_account_code()
                IS $comment$
                  Triggere per proteggere il campo codice (fornitore) da modifiche dopo la prima valorizzazione.
                $comment$;
        - sql:
            splitStatements: false  
            sql: |

            
              DROP TRIGGER IF EXISTS trg_a10_fornitori_upd_protect_account_code
                ON anagrafiche.fornitori;
              CREATE TRIGGER trg_a10_fornitori_upd_protect_account_code
                BEFORE UPDATE ON anagrafiche.fornitori
                FOR EACH ROW
                EXECUTE FUNCTION anagrafiche.trgfn_fornitori_upd_protect_account_code();

              COMMENT ON TRIGGER trg_a10_fornitori_upd_protect_account_code
                ON anagrafiche.fornitori
                IS $comment$
                  Trigger per proteggere il campo account_code da modifiche dopo la prima valorizzazione.
                $comment$;

# Metto un  tag fine modifiche
  - changeSet:
