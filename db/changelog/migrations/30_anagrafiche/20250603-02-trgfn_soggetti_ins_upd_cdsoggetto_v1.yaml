databaseChangeLog:

  
  - changeSet:
      id: 20250603-02-trgfn_soggetti_ins_upd_cdsoggetto_v1
      author: mctit
      comments: >
        Crea la funzione trigger anagrafiche.trgfn_soggetti_ins_upd_genera_cdsoggetto
        che invoca script.fn_generate_codice('soggetto') se NEW.soggetto_codice è NULL.
        Viene eliminata la precedente versione che conteneva tutta la logica.
      changes:
        - sql:
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_soggetti_ins_upd_genera_cdsoggetto 
                ON anagrafiche.soggetti;
              DROP FUNCTION IF EXISTS anagrafiche.trgfn_soggetti_ins_cdsoggetto;  
        - sqlFile:
            path: sql/trgfn_soggetti_ins_upd_genera_cdsoggetto_v1.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false


  - changeSet:
      id: 20250603-06-attach-trg-soggetti_ins_upd
      author: mctit
      comments: >
        Associa il trigger anagrafiche.trgfn_soggetti_ins_upd_genera_cdsoggetto
        sulla tabella anagrafiche.soggetti per INSERT e UPDATE.
      changes:
        - sql:
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_soggetti_ins_upd_genera_cdsoggetto 
                ON anagrafiche.soggetti;
              CREATE TRIGGER trg_soggetti_ins_upd_genera_cdsoggetto
                BEFORE INSERT OR UPDATE ON anagrafiche.soggetti
                FOR EACH ROW
                EXECUTE FUNCTION anagrafiche.trgfn_soggetti_ins_upd_genera_cdsoggetto();



# Metto un  tag fine modifiche
  - changeSet:
      id: 20250603-90-trgfn_soggetti_ins_upd_cdsoggetto_v1   
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250603-02-trgfn_soggetti_ins_upd_cdsoggetto_v1