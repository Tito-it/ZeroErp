databaseChangeLog:  
  - changeSet:
      id: 20250818-22-trg_z90_pdp_ins_upd_genera_storico
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      comment: >
        Crea trigger su anagrafiche.pdp per generare storico.pdp.
      changes:
        - sql:
            comment: "2) Rimuove eventuale trigger esistente"
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_Z90_pdp_upd_dlt_storico
                ON anagrafiche.pdp;
            
        - sql:
            comment: "2) Ricrea il trigger come BEFORE il trigger di normalizzazione " 
            splitStatements: false
            stripComments: true
            sql: |
                  CREATE TRIGGER trg_Z90_pdp_upd_dlt_storico
                    BEFORE UPDATE OR DELETE
                    ON anagrafiche.pdp
                    FOR EACH ROW
                    EXECUTE FUNCTION script.trgfn_upd_dlt_storico_generic(
                      'pdp_id'
                    );

        - sql:
            comment: "Commento descrittivo sul  trigger"
            splitStatements: false      
            sql: |
                  COMMENT ON TRIGGER trg_Z90_pdp_upd_dlt_storico
                    ON anagrafiche.pdp
                      IS ' Crea trigger su anagrafiche.pdp 
                      per generare storico.pdp(snapshot)';

  # Metto un tag fine modifiche
  - changeSet:
      id: 20250818-90-trg_z90_pdp_ins_upd_genera_storico
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250818-22-trg_z90_pdp_ins_upd_genera_storico