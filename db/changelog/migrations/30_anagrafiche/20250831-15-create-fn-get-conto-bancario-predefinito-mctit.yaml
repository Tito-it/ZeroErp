databaseChangeLog:

  # 2) FUNCTION: anagrafiche.fn_get_conto_bancario_predefinito(soggetto_ruolo_id, uso)
  - changeSet:
      id: 20250831-15-create-fn-get-conto-bancario-predefinito
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      preConditions:
        - onFail: HALT
        - viewExists: { schemaName: anagrafiche, viewName: vw_conti_bancari_per_ruolo }
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.fn_get_conto_bancario_predefinito(
                  p_soggetto_ruolo_id BIGINT,
                  p_uso               VARCHAR
              )
              RETURNS TABLE (
                conto_bancario_id           BIGINT,
                fonte                       VARCHAR,
                soggetto_ruolo_conto_id     BIGINT,
                soggetto_conto_id           BIGINT
              )
              LANGUAGE plpgsql
              STABLE
              AS $$
              DECLARE
                v_uso VARCHAR := COALESCE(p_uso, 'GENERICO');
              BEGIN
                -- 1) Prova uso richiesto
                RETURN QUERY
                SELECT v.conto_bancario_id, v.fonte, v.soggetto_ruolo_conto_id, v.soggetto_conto_id
                  FROM anagrafiche.vw_conti_bancari_per_ruolo v
                 WHERE v.soggetto_ruolo_id = p_soggetto_ruolo_id
                   AND v.uso = v_uso
                 LIMIT 1;
                IF FOUND THEN
                  RETURN;
                END IF;

                -- 2) Fallback a GENERICO (se l’uso richiesto non è GENERICO)
                IF v_uso <> 'GENERICO' THEN
                  RETURN QUERY
                  SELECT v.conto_bancario_id, v.fonte, v.soggetto_ruolo_conto_id, v.soggetto_conto_id
                    FROM anagrafiche.vw_conti_bancari_per_ruolo v
                   WHERE v.soggetto_ruolo_id = p_soggetto_ruolo_id
                     AND v.uso = 'GENERICO'
                   LIMIT 1;
                END IF;
              END$$;

              COMMENT ON FUNCTION anagrafiche.fn_get_conto_bancario_predefinito(BIGINT, VARCHAR)
                IS 'Restituisce il conto bancario selezionato per (soggetto_ruolo, uso) con fallback: RUOLO → SOGGETTO, poi uso richiesto → GENERICO. Ritorna 0 o 1 riga.';
      
  - changeSet:
      id: 20250831-90-create-fn-get-conto-bancario-predefinito
      author: mctit
      changes:
        - tagDatabase:
            tag: 220250831-15-create-fn-get-conto-bancario-predefinito
