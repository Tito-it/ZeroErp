databaseChangeLog:

  
  - changeSet:
      id: 20250804-16-anagrafiche.trgfn_upd_soggetti_protect_codice_soggetto_v1
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      comments: >
         Protegge il codice_soggetto in modo che non possa essere modificato dopo essere stato valorizzato.
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.trgfn_upd_soggetti_protect_codice_soggetto()
                    RETURNS trigger
                    LANGUAGE plpgsql 
                  AS $$
                  BEGIN
                    IF TG_OP = 'UPDATE'
                      AND OLD.codice_soggetto IS NOT NULL
                      AND NEW.codice_soggetto IS DISTINCT FROM OLD.codice_soggetto
                    THEN
                      
                      PERFORM script.fn_log_and_raise_error(
                        'database',
                        TG_NAME,
                        'E_COLONNA_NON_MODIFICABILE',
                        jsonb_build_object('column','codice_soggetto','id',OLD.id),
                        NULL::uuid,
                        'codice_soggetto'
                      );
                    END IF;
                    RETURN NEW;
                  END;
                  $$;
 
              COMMENT ON FUNCTION anagrafiche.trgfn_upd_soggetti_protect_codice_soggetto()
                IS $comment$    
                  Triggere per proteggere il campo codice_soggetto da modifiche dopo la prima valorizzazione.
                $comment$;
        - sql:
            splitStatements: false  
            sql: |
              DROP TRIGGER IF EXISTS trg_upd_soggetti_protect_codice_soggetto
                ON anagrafiche.soggetti;
              CREATE TRIGGER trg_upd_soggetti_protect_codice_soggetto
                BEFORE UPDATE ON anagrafiche.soggetti
                FOR EACH ROW
                EXECUTE FUNCTION anagrafiche.trgfn_upd_soggetti_protect_codice_soggetto();

              COMMENT ON TRIGGER trg_upd_soggetti_protect_codice_soggetto
                ON anagrafiche.soggetti
                IS $comment$
                  Trigger per proteggere il campo codice_soggetto da modifiche dopo la prima valorizzazione.
                $comment$;

