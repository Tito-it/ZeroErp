databaseChangeLog:
  - changeSet:
      id: 20250626-03-create_indexes_per_foreign_key
      author: mctit
      comments: "Crea indici per le colonne frequentemente filtrate nelle tabelle dello schema storico. 
                 Sono indici per le foreign key che non sono stati creati automaticamente da Liquibase."
      changes:
        - createIndex:
            indexName: ix_dbops_error_log_messaggio_errore_id
            schemaName: dbops
            tableName: error_log
            columns:
              - column:
                  name: messaggio_errore_id
        
                                    
