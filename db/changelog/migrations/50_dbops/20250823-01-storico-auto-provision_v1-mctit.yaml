# Auto-provision storico tables per regola STORICO (storicizza=true)
# - Helper: dbops.fn_ensure_storico_table(...)
# - Runner: dbops.fn_run_automations_storico_provision(...)  (SOLO creazione tabelle)
# ------------------------------------------------------------
databaseChangeLog:
  - changeSet:
      id: 20250822-01-storico-auto-provision
      author: mctit
      runOnChange: true
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              
                    CREATE OR REPLACE FUNCTION dbops.fn_ensure_storico_table(
                      p_schema_base       text,
                      p_table_base        text,
                      p_fk_col            text,      -- es. '<table>_id'
                      p_create_gin_index  boolean,   -- index GIN su snapshot
                      p_dry_run           boolean
                    ) RETURNS void
                    LANGUAGE plpgsql AS $$
                    DECLARE
                      v_exists   boolean;
                      v_sql      text;
                      v_tbl_sto  text := format('%I_storico', p_table_base);
                      v_full_base text := format('%I.%I', p_schema_base, p_table_base);
                      v_full_sto  text := format('storico.%I', v_tbl_sto);
                    BEGIN 
                      -- Helper: crea (se manca) storico.<table>_storico con struttura standard
                      -- esiste già?
                      SELECT EXISTS (
                        SELECT 1
                        FROM pg_class c
                        JOIN pg_namespace n ON n.oid=c.relnamespace
                        WHERE n.nspname='storico' AND c.relname=v_tbl_sto AND c.relkind='r'
                      ) INTO v_exists;

                      IF v_exists THEN
                        RETURN;
                      END IF;

                      -- build DDL
                      v_sql := format($ddl$
                        CREATE SCHEMA IF NOT EXISTS storico;
                        CREATE TABLE IF NOT EXISTS %s (
                          id              BIGSERIAL PRIMARY KEY,
                          %I              bigint NOT NULL,
                          op              text NOT NULL,                      -- 'UPD' | 'DLT' | altro
                          ts              timestamptz NOT NULL DEFAULT now(), -- timestamp evento
                          snapshot        jsonb,                              -- contenuto riga (NEW/OLD)
                          user_update     text,
                          data_update     timestamptz,
                          tx_id           uuid,
                          valid_from      timestamptz DEFAULT now(),
                          valid_to        timestamptz
                        );
                        -- FK opzionale sulla base (commentata se non desideri vincolo)
                        ALTER TABLE %s
                          ADD CONSTRAINT fk_%I FOREIGN KEY (%I) REFERENCES %s(id);
                        CREATE INDEX IF NOT EXISTS ix_%s_%I_ts      ON %s (ts);
                        CREATE INDEX IF NOT EXISTS ix_%s_%I_fk      ON %s (%I);
                      $ddl$,
                        v_full_sto,
                        p_fk_col,
                        -- FK (commentata)
                        v_full_sto, p_table_base, p_fk_col, v_full_base,
                        p_table_base, p_fk_col, v_full_sto,
                        p_table_base, p_fk_col, v_full_sto, p_fk_col
                      );

                      IF p_create_gin_index THEN
                        v_sql := v_sql || format(E'\nCREATE INDEX IF NOT EXISTS ix_%s_snapshot_gin ON %s USING GIN (snapshot);\n',
                                                p_table_base, v_full_sto);
                      END IF;

                      IF p_dry_run THEN
                        PERFORM dbops.fn_audit_log_once(
                          p_function_name => 'fn_run_automations_storico',
                          p_status        => 'DRYRUN',
                          p_rule_type     => 'STORICO',
                          p_dry_run       => true,
                          p_params        => jsonb_build_object('table', v_full_sto, 'action','CREATE_STORICO_TABLE'),
                          p_message       => 'Storico table would be created'
                        );
                        RETURN;
                      END IF;

                      BEGIN
                        EXECUTE v_sql;
                        PERFORM dbops.fn_audit_log_once(
                          p_function_name => 'fn_run_automations_storico',
                          p_status        => 'OK',
                          p_rule_type     => 'STORICO',
                          p_params        => jsonb_build_object('table', v_full_sto, 'action','CREATE_STORICO_TABLE'),
                          p_message       => 'Storico table created'
                        );

                      EXCEPTION WHEN OTHERS THEN
                        PERFORM script.fn_log_and_raise_error(
                          'dbops',
                          'fn_run_automations_storico',          -- function_name / contesto
                          'E_STORICO_PROVISION',              -- codice breve dell’errore
                          jsonb_build_object(
                            'action','CREATE_STORICO_TABLE',
                            'schema', p_schema_base,
                            'table',  p_table_base,
                            'target', format('storico.%s_storico', p_table_base),
                            'fk',     p_fk_col
                          ),
                          NULL::uuid,
                          SQLERRM
                        );

                      END;
                    END;
                    $$;

                    
                    CREATE OR REPLACE FUNCTION dbops.fn_run_automations_storico_provision(
                      p_exec_mode text,             -- 'CI'|'SCHEDULED'|'AUTO'
                      p_schemas   text[],           -- lista schemi target
                      p_dry_run   boolean
                    ) RETURNS void
                    LANGUAGE plpgsql AS $$
                    DECLARE
                      rtab record;
                      rrule record;
                      v_schemas text[] := p_schemas;
                      has_flag boolean;
                      storicizza_col text;
                      fk_col text;
                      create_gin boolean;
                    BEGIN
                      -- Runner: scansiona regole STORICO con auto_provision, crea solo le tabelle storico mancanti
                      -- scope fallback se p_schemas è NULL
                      IF v_schemas IS NULL THEN
                        IF EXISTS (SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
                                  WHERE n.nspname='dbops' AND c.relname='automation_scope' AND c.relkind='r') THEN
                          SELECT array_agg(DISTINCT schema_name) INTO v_schemas FROM dbops.automation_scope;
                        ELSE
                          SELECT array_agg(nspname) INTO v_schemas
                          FROM pg_namespace
                          WHERE nspname NOT LIKE 'pg_%'
                            AND nspname <> 'information_schema'
                            AND nspname <> 'storico';
                        END IF;
                      END IF;

                      -- loop tabelle degli schemi target
                      FOR rtab IN
                        SELECT n.nspname AS schema_name, c.relname AS table_name
                        FROM pg_class c
                        JOIN pg_namespace n ON n.oid=c.relnamespace
                        WHERE c.relkind='r' AND n.nspname = ANY(v_schemas)
                      LOOP
                        -- regole STORICO pertinenti
                        FOR rrule IN
                          SELECT *
                          FROM dbops.automation_rules_tbl r
                          WHERE r.enabled
                            AND r.rule_type='STORICO'
                            AND (r.exec_mode='AUTO' OR r.exec_mode=p_exec_mode)
                            AND r.target_schema = rtab.schema_name
                            AND (r.target_table IS NULL OR rtab.table_name LIKE r.target_table)
                        LOOP
                          -- parametri
                          create_gin := COALESCE((rrule.params->>'create_gin_index')::boolean, false);
                          IF COALESCE((rrule.params->>'auto_provision')::boolean, false) IS NOT TRUE THEN
                            CONTINUE;
                          END IF;

                          -- colonna storicizza (override: STORICIZZA_COL)
                          storicizza_col := dbops.fn_get_override_col(rtab.schema_name, rtab.table_name, 'STORICIZZA_COL', 'storicizza');
                          has_flag := dbops.fn_col_exists(rtab.schema_name, rtab.table_name, storicizza_col);
                          IF NOT has_flag THEN
                            CONTINUE;
                          END IF;

                          -- fk storico (override: STORICO_FK)
                          fk_col := dbops.fn_get_override_col(rtab.schema_name, rtab.table_name, 'STORICO_FK', rtab.table_name||'_id');

                          -- crea tabella storico se manca
                          PERFORM dbops.fn_ensure_storico_table(rtab.schema_name, rtab.table_name, fk_col, create_gin, p_dry_run);
                        END LOOP;
                      END LOOP;
                    END;
                    $$;


              
