databaseChangeLog:

  - changeSet:
      id: 20250626-33-fn_populate_fk_index_policy
      author: mctit
      runOnChange: true
      validCheckSums:
          - ANY
      comments: >
        Popola automaticamente dbops.fk_index_policy per tutte le FK senza indice, con consentito=false.
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
                  
                  CREATE OR REPLACE FUNCTION dbops.fn_populate_fk_index_policy()
                  RETURNS void
                  LANGUAGE plpgsql
                  AS $$
                  DECLARE
                    rec RECORD;
                  BEGIN
                    FOR rec IN
                      SELECT schema_name, table_name, constraint_name, create_index_suggestion  
                        FROM dbops.vw_fk_senza_indice
                      WHERE (schema_name, table_name, constraint_name)
                        NOT IN (
                          SELECT schema_name, table_name, constraint_name
                            FROM dbops.fk_index_policy
                        )
                    LOOP
                      INSERT INTO dbops.fk_index_policy(
                        schema_name,
                        table_name,
                        constraint_name,
                        consentito,
                        dll_command
                      ) VALUES (
                        rec.schema_name,
                        rec.table_name,
                        rec.constraint_name,
                        false,
                        rec.create_index_suggestion
                      );
                    END LOOP;
                  END;
                  $$;

                  COMMENT ON FUNCTION dbops.fn_populate_fk_index_policy() IS
                    'Popola automaticamente dbops.fk_index_policy per tutte le FK senza indice, con consentito=false.';

  - changeSet:
      id: 20250626-90-fn_populate_fk_index_policy
      author: mctit
