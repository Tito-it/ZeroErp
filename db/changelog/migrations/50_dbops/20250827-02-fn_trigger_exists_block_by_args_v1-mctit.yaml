databaseChangeLog:
  - changeSet:
      id: 20250827-02-fn_trigger_exists_block_by_args_v1
      author: mctit
      runOnChange: true
      validCheckSums: [ "ANY" ]
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_trigger_exists_block_by_args(
                  p_parent_rel regclass,
                  p_child_schema text,
                  p_child_table  text,
                  p_fk_col       text
                ) RETURNS boolean
                LANGUAGE sql STABLE AS $$
                  SELECT EXISTS (
                    SELECT 1
                    FROM pg_trigger t
                    JOIN pg_proc p ON p.oid = t.tgfoid
                    WHERE t.tgrelid = p_parent_rel
                      AND NOT t.tgisinternal
                      AND p.proname = 'trgfn_prevent_deactivate_if_children'
                      AND pg_get_triggerdef(t.oid) ILIKE
                          format('%%EXECUTE FUNCTION dbops.trgfn_prevent_deactivate_if_children(''%s'',''%s'',''%s'')%%',
                                p_child_schema, p_child_table, p_fk_col)
                  );
                $$;

              
  - changeSet:
      id: 20250827-90-fn_trigger_exists_block_by_args_v1
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250827-02-fn_trigger_exists_block_by_args_v1