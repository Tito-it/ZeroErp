databaseChangeLog:
  - changeSet:
      id: 20250822-10-functions_audit_v1
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY 
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              
              CREATE OR REPLACE FUNCTION dbops.fn_audit_begin(
                p_function_name text,
                p_params       jsonb DEFAULT '{}'::jsonb,
                p_exec_mode    text DEFAULT NULL,
                p_parts        text[] DEFAULT NULL,
                p_rule_type    text DEFAULT NULL,
                p_dry_run      boolean DEFAULT NULL,
                p_host         text DEFAULT NULL,
                p_app_version  text DEFAULT NULL
              ) RETURNS bigint
              LANGUAGE plpgsql
              AS $$
              DECLARE
                v_id        bigint;
                v_use_dbk   boolean := COALESCE(current_setting('myapp.log_with_dblink', true)='on', false);
                v_has_dbk   boolean := EXISTS (SELECT 1 FROM pg_extension WHERE extname='dblink');
                v_can_use   boolean := false;
                v_sql       text;
              BEGIN
                -- BEGIN: inserisce START (usa dblink/logconn se attivo), ritorna id
                IF v_use_dbk AND v_has_dbk THEN
                  -- prova ad aprire/riusare 'logconn' (tua funzione)
                  BEGIN
                    EXECUTE 'SELECT script.fn_ensure_logconn()';
                  EXCEPTION WHEN undefined_function THEN
                    v_use_dbk := false;  -- funzione non presente → fallback
                  WHEN others THEN
                    v_use_dbk := false;  -- qualsiasi errore → fallback
                  END;
                END IF;

                IF v_use_dbk AND v_has_dbk THEN
                  v_can_use := 'logconn' = ANY (COALESCE(public.dblink_get_connections(), ARRAY[]::text[]));
                END IF;

                IF v_can_use THEN
                  -- out-of-tx
                  v_sql := format(
                    'INSERT INTO dbops.audit_log(function_name, params, status, exec_mode, parts, rule_type, dry_run, host, app_version)
                     VALUES (%L, %L::jsonb, %L, %L, %L::text[], %L, %s, %L, %L)
                     RETURNING id',
                     p_function_name,
                     COALESCE((p_params)::text,'null'),
                     'START',
                     p_exec_mode,
                     COALESCE((p_parts)::text,'null'),
                     p_rule_type,
                     CASE WHEN p_dry_run IS NULL THEN 'NULL' ELSE (p_dry_run::text) END,
                     p_host,
                     p_app_version
                  );
                  EXECUTE format($q$
                    SELECT id FROM dblink('logconn', %L) AS t(id bigint)
                  $q$, v_sql) INTO v_id;
                ELSE
                  -- locale (in transazione)
                  INSERT INTO dbops.audit_log(function_name, params, status, exec_mode, parts, rule_type, dry_run, host, app_version)
                  VALUES (p_function_name, p_params, 'START', p_exec_mode, p_parts, p_rule_type, p_dry_run, p_host, p_app_version)
                  RETURNING id INTO v_id;
                END IF;

                RETURN v_id;
              END;
              $$;

              
              CREATE OR REPLACE FUNCTION dbops.fn_audit_end(
                p_id            bigint,
                p_status        text DEFAULT 'OK',
                p_message       text DEFAULT NULL,
                p_sqlstate      text DEFAULT NULL,
                p_error_context text DEFAULT NULL,
                p_rows_affected integer DEFAULT NULL,
                p_result        jsonb DEFAULT NULL
              ) RETURNS void
              LANGUAGE plpgsql
              AS $$
              DECLARE
                v_use_dbk   boolean := COALESCE(current_setting('myapp.log_with_dblink', true)='on', false);
                v_has_dbk   boolean := EXISTS (SELECT 1 FROM pg_extension WHERE extname='dblink');
                v_can_use   boolean := false;
                v_sql       text;
                v_dummy     text;
              BEGIN
                -- END: aggiorna esito e durata (out-of-tx se possibile) 
                IF v_use_dbk AND v_has_dbk THEN
                  BEGIN
                    EXECUTE 'SELECT script.fn_ensure_logconn()';
                  EXCEPTION WHEN others THEN
                    v_use_dbk := false;
                  END;
                END IF;

                IF v_use_dbk AND v_has_dbk THEN
                  v_can_use := 'logconn' = ANY (COALESCE(public.dblink_get_connections(), ARRAY[]::text[]));
                END IF;

                IF v_can_use THEN
                  v_sql := format(
                    'UPDATE dbops.audit_log
                       SET status=%L,
                           message=%L,
                           sqlstate=%L,
                           error_context=%L,
                           rows_affected=%s,
                           result=%s,
                           duration_ms = COALESCE(duration_ms, ROUND(EXTRACT(EPOCH FROM (clock_timestamp() - executed_at))*1000)::int)
                     WHERE id=%s',
                     p_status,
                     p_message,
                     p_sqlstate,
                     p_error_context,
                     COALESCE(p_rows_affected::text,'NULL'),
                     CASE WHEN p_result IS NULL THEN 'NULL' ELSE format('%L::jsonb', (p_result)::text) END,
                     p_id::text
                  );
                  SELECT dblink_exec('logconn', v_sql) INTO v_dummy;
                ELSE
                  UPDATE dbops.audit_log
                     SET status        = COALESCE(p_status, status),
                         message       = p_message,
                         sqlstate      = COALESCE(p_sqlstate, sqlstate),
                         error_context = COALESCE(p_error_context, error_context),
                         rows_affected = COALESCE(p_rows_affected, rows_affected),
                         result        = COALESCE(p_result, result),
                         duration_ms   = COALESCE(duration_ms, ROUND(EXTRACT(EPOCH FROM (clock_timestamp() - executed_at))*1000)::int)
                   WHERE id=p_id;
                END IF;
              END;
              $$;

               CREATE OR REPLACE FUNCTION dbops.fn_audit_log_once(
                p_function_name text,
                p_status        text,
                p_params        jsonb DEFAULT '{}'::jsonb,
                p_message       text DEFAULT NULL,
                p_exec_mode     text DEFAULT NULL,
                p_parts         text[] DEFAULT NULL,
                p_rule_type     text DEFAULT NULL,
                p_dry_run       boolean DEFAULT NULL,
                p_sqlstate      text DEFAULT NULL,
                p_error_context text DEFAULT NULL,
                p_rows_affected integer DEFAULT NULL,
                p_result        jsonb DEFAULT NULL,
                p_host          text DEFAULT NULL,
                p_app_version   text DEFAULT NULL
              ) RETURNS bigint
              LANGUAGE plpgsql
              AS $$
              DECLARE
                v_id      bigint;
                v_use_dbk boolean := COALESCE(current_setting('myapp.log_with_dblink', true)='on', false);
                v_has_dbk boolean := EXISTS (SELECT 1 FROM pg_extension WHERE extname='dblink');
                v_can_use boolean := false;
                v_sql     text;
              BEGIN
                -- ONE-SHOT: inserisce direttamente una riga completa (es. DRYRUN)
             
                IF v_use_dbk AND v_has_dbk THEN
                  BEGIN
                    EXECUTE 'SELECT script.fn_ensure_logconn()';
                  EXCEPTION WHEN others THEN
                    v_use_dbk := false;
                  END;
                END IF;
                IF v_use_dbk AND v_has_dbk THEN
                  v_can_use := 'logconn' = ANY (COALESCE(public.dblink_get_connections(), ARRAY[]::text[]));
                END IF;

                IF v_can_use THEN
                  v_sql := format(
                    'INSERT INTO dbops.audit_log(function_name, status, params, message, exec_mode, parts, rule_type, dry_run, sqlstate, error_context, rows_affected, result, host, app_version)
                     VALUES (%L, %L, %L::jsonb, %L, %L, %L::text[], %L, %s, %L, %L, %s, %s, %L, %L)
                     RETURNING id',
                     p_function_name,
                     p_status,
                     COALESCE((p_params)::text,'null'),
                     p_message,
                     p_exec_mode,
                     COALESCE((p_parts)::text,'null'),
                     p_rule_type,
                     CASE WHEN p_dry_run IS NULL THEN 'NULL' ELSE (p_dry_run::text) END,
                     p_sqlstate,
                     p_error_context,
                     COALESCE(p_rows_affected::text,'NULL'),
                     CASE WHEN p_result IS NULL THEN 'NULL' ELSE format('%L::jsonb', (p_result)::text) END,
                     p_host,
                     p_app_version
                  );
                  EXECUTE format($q$
                    SELECT id FROM dblink('logconn', %L) AS t(id bigint)
                  $q$, v_sql) INTO v_id;
                ELSE
                  INSERT INTO dbops.audit_log(function_name, status, params, message, exec_mode, parts, rule_type, dry_run, sqlstate, error_context, rows_affected, result, host, app_version)
                  VALUES (p_function_name, p_status, p_params, p_message, p_exec_mode, p_parts, p_rule_type, p_dry_run, p_sqlstate, p_error_context, p_rows_affected, p_result, p_host, p_app_version)
                  RETURNING id INTO v_id;
                END IF;

                RETURN v_id;
              END;
              $$;
                  
