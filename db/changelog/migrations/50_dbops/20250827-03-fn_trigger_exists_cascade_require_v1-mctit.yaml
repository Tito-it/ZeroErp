                  -- REQUIRE (figlio): dbops.trgfn_child_requires_active_parent(parent_schema,parent_table,parent_attivo_col,fk_col)
                  CREATE OR REPLACE FUNCTION dbops.fn_trigger_exists_require_by_args(
                    p_child_rel         regclass,
                    p_parent_schema     text,
                    p_parent_table      text,
                    p_parent_attivo_col text,
                    p_fk_col            text
                  ) RETURNS boolean
                  LANGUAGE sql STABLE AS $$
                    SELECT EXISTS (
                      SELECT 1
                      FROM pg_trigger t
                      JOIN pg_proc p ON p.oid = t.tgfoid
                      WHERE t.tgrelid = p_child_rel
                        AND NOT t.tgisinternal
                        AND p.proname = 'trgfn_child_requires_active_parent'
                        AND pg_get_triggerdef(t.oid) ILIKE
                            format('%%EXECUTE FUNCTION dbops.trgfn_child_requires_active_parent(''%s'',''%s'',''%s'',''%s'')%%',
                                  p_parent_schema, p_parent_table, p_parent_attivo_col, p_fk_col)
                    );
                  $$;
                 

                  
