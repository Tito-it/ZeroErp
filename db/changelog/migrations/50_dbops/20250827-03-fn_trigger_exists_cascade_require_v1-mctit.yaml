databaseChangeLog:
  - changeSet:
      id: 20250827-03-fn_trigger_exists_cascade_require_v1
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: | 
                  -- CASCADE (padre): dbops.trgfn_soft_delete_cascade(child_schema, child_table, fk_col)
                  CREATE OR REPLACE FUNCTION dbops.fn_trigger_exists_cascade_by_args(
                    p_parent_rel   regclass,
                    p_child_schema text,
                    p_child_table  text,
                    p_fk_col       text
                  ) RETURNS boolean
                  LANGUAGE sql STABLE AS $$
                    SELECT EXISTS (
                      SELECT 1
                      FROM pg_trigger t
                      JOIN pg_proc p ON p.oid = t.tgfoid
                      WHERE t.tgrelid = p_parent_rel
                        AND NOT t.tgisinternal
                        AND p.proname = 'trgfn_soft_delete_cascade'
                        AND pg_get_triggerdef(t.oid) ILIKE
                            format('%%EXECUTE FUNCTION dbops.trgfn_soft_delete_cascade(''%s'',''%s'',''%s'')%%',
                                  p_child_schema, p_child_table, p_fk_col)
                    );
                  $$;

  - changeSet:
