databaseChangeLog:
  - changeSet:
      id: 20250626-30-create-proc-apply_fk_index_policy
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      comments: "Crea o sostituisce la procedure apply_fk_index_policy nello schema dbops"
      changes:
        - createProcedure:
            schemaName: dbops
            procedureName: apply_fk_index_policy
            procedureText: |
              CREATE OR REPLACE PROCEDURE dbops.apply_fk_index_policy()
              LANGUAGE plpgsql
              AS $$
              DECLARE
                rec RECORD;
                idx_name TEXT;
              BEGIN
                FOR rec IN SELECT * FROM dbops.fk_index_policy LOOP
                  IF rec.consentito THEN
                    EXECUTE rec.dll_command;
                  ELSE
                       -- estraggo solo il nome dell'indice
                      idx_name := split_part(rec.dll_command, ' ', 6);
                      EXECUTE format(
                        'DROP INDEX IF EXISTS %I.%I',
                        rec.schema_name,
                        idx_name
                    );
                  END IF;
                END LOOP;
              END;
              $$;
        - sql:
            comment: "Aggiunge il commento descrittivo alla procedura apply_fk_index_policy"
            splitStatements: false
            sql: |
              COMMENT ON PROCEDURE dbops.apply_fk_index_policy() IS
                'Applica le policy di indicizzazione definite in dbops.fk_index_policy: crea o rimuove gli indici sulle foreign key secondo il flag consentito.';

                                    
 # Metto un  tag fine modifiche
  - changeSet:
        id: 20250626-93-create-proc-apply_fk_index_policy
        author: mctit
        changes:
          - tagDatabase:
              tag: 20250626-30-create-proc-apply_fk_index_policy