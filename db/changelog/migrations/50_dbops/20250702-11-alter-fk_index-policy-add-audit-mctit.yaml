databaseChangeLog:
  - changeSet:
      id: 20250702-11-alter-fk_index-policy-add-audit
      author: mctit
      comments: "Estende dbops.fk_index_policy con campi di audit e crea trigger per popolarli automaticamente"
      changes:
        - addColumn:
            schemaName: dbops
            tableName: fk_index_policy
            columns:
              - column:
                  name: user_insert
                  type: varchar(30)
                  defaultValueComputed: CURRENT_USER
                  constraints:
                    nullable: false
              - column:
                  name: data_insert
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: user_update
                  type: varchar(30)
                  constraints:
                    nullable: true
              - column:
                  name: data_update
                  type: timestamp with time zone
                  constraints:
                    nullable: true

        
        - sql:
            comment: "Crea il trigger BEFORE UPDATE su fk_index_policy"
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_audit_fk_index_policy ON dbops.fk_index_policy;
              CREATE TRIGGER trg_audit_fk_index_policy
                BEFORE UPDATE ON dbops.fk_index_policy
                FOR EACH ROW
                EXECUTE FUNCTION script.trgfn_upd_audit_data_user_generic();

  
  - changeSet:
      id: 20250702-90-alter-fk_index-policy-add-audit
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250702-11-alter-fk_index-policy-add-audit