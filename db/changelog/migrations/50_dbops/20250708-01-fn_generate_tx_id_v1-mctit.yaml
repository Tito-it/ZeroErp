databaseChangeLog:
  - changeSet:
      id: 20250708-01-fn_generate_tx_id
      author: mctit
      comments: "Crea la funzione dbops.fn_generate_tx_id per generare e registrare un nuovo tx_id"
      runOnChange: true
      validCheckSums:
        - ANY
      changes:
        - sql:
            comment: "1) Crea o sostituisce la funzione fn_generate_tx_id"
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION dbops.fn_generate_tx_id(
                  p_generating_function TEXT,
                  p_session_info        JSONB DEFAULT '{}'::jsonb
              )
              RETURNS UUID
              LANGUAGE plpgsql
              SECURITY DEFINER
              AS $$
              DECLARE
                  v_tx UUID := gen_random_uuid();
              BEGIN
                  -- Genera un nuovo UUID e lo inserisce in dbops.transaction_ids
                  INSERT INTO dbops.transaction_ids (
                      id,
                      generating_function,
                      session_info
                  ) VALUES (
                      v_tx,
                      p_generating_function,
                      p_session_info
                  );
              
                  RETURN v_tx;
              END;
              $$;
        - sql:
            comment: "2) Commento descrittivo sulla funzione fn_generate_tx_id"
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION dbops.fn_generate_tx_id(
                TEXT, JSONB
              )
              IS 'Genera un nuovo tx_id UUID, lo inserisce in dbops.transaction_ids con generating_function e session_info, e lo restituisce';

  - changeSet:
      id: 20250708-90-fn_generate_tx_id
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250708-01-fn_generate_tx_id