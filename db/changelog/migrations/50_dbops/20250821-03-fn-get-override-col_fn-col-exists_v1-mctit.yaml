databaseChangeLog:
  - changeSet:
      id: 20250821-03-fn-get-override-col_fn-col-exists_v1
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: | 
                  
                   CREATE OR REPLACE FUNCTION dbops.fn_get_override_col(
                        p_schema text,
                        p_table  text,
                        p_role   text,
                        p_default text
                      ) RETURNS text
                      LANGUAGE sql
                      AS $$
                        SELECT COALESCE((
                          SELECT col_name
                            FROM dbops.automation_overrides_cols
                          WHERE schema_name=p_schema
                            AND table_name=p_table
                            AND col_role=p_role
                          LIMIT 1
                        ), p_default);
                      $$;

        - sql:
            splitStatements: false
            stripComments: false
            sql: |
                COMMENT ON FUNCTION dbops.fn_get_override_col(text, text, text, text) IS
                  $md$
                  Ritorna il **nome della colonna** da usare per un certo *ruolo logico* (es. `AUDIT_TS`,
                  `AUDIT_USER`, `ATTIVO_COL`, `STORICO_FK`) verificando prima un **override** nella tabella
                  `dbops.automation_overrides_cols`. Se non presente, restituisce il **valore di default**
                  passato in input.

                   **Ritorno**: `text` — Nome colonna effettivo (override se presente, altrimenti `p_default`).

                   **Parametri**
                    - `p_schema text`: schema della tabella.
                    - `p_table  text`: nome della tabella.
                    - `p_role   text`: ruolo logico della colonna (chiave su `automation_overrides_cols.col_role`).
                    - `p_default text`: nome colonna di default da usare in assenza di override.

                   **Note implementative**
                    - Query diretta su `dbops.automation_overrides_cols` con `LIMIT 1`.
                    - Usa `COALESCE(..., p_default)` per garantire sempre un valore di ritorno.

                   **Casi d’uso tipici**
                    - Generazione/validazione automatica di trigger e funzioni che dipendono da colonne “convenzione”.
                    - Personalizzazione per tabella di audit columns o fk di storico.

                   **Limitazioni**
                    - Non valida l’esistenza reale della colonna; in combinazione usare `dbops._col_exists`.
                  $md$;

  - changeSet:
      id: 20250821-04-fn-get-override-col_fn-col-exists_v1
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: | 
              CREATE OR REPLACE FUNCTION dbops.fn_col_exists(
                  p_schema text,
                  p_table  text,
                  p_col    text
                ) RETURNS boolean
                LANGUAGE sql
                AS $$
                  SELECT EXISTS(
                    SELECT 1
                      FROM information_schema.columns
                    WHERE table_schema=p_schema
                      AND table_name=p_table
                      AND column_name=p_col
                  );
                $$;
        - sql:
            splitStatements: false
            stripComments: false
            sql: |      
              COMMENT ON FUNCTION dbops.fn_col_exists(text, text, text) IS
                  $md$
                  Verifica se una **colonna** esiste in una tabella specificata, interrogando
                  `information_schema.columns`.

                  • **Ritorno**: `boolean` — TRUE se la colonna esiste (`schema`, `table`, `column`),
                    altrimenti FALSE.

                  • **Parametri**
                    - `p_schema text`: schema della tabella.
                    - `p_table  text`: nome della tabella.
                    - `p_col    text`: nome della colonna.

                  • **Note implementative**
                    - Usa `EXISTS(...)` su `information_schema.columns` con match esatto su `table_schema`,
                      `table_name`, `column_name`.
                    - Leggera e **idempotente**, adatta a controlli pre-creazione di trigger/constraint.

                  • **Casi d’uso tipici**
                    - Pipeline di automazione per generare solo ciò che è coerente con lo schema corrente.
                    - Validazioni in funzioni di provisioning/maintenance.

                  • **Limitazioni**
                    - Sensibile a maiuscole/minuscole se i nomi sono stati creati con doppie virgolette e case mixing.
                  $md$;
