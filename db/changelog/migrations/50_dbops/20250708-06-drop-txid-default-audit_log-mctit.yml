databaseChangeLog:
  - changeSet:
      id: 20250708-06-drop-txid-default-audit_log
      author: mctit
      comments: "Rimuove il DEFAULT basato su md5(txid_current()) dalla colonna tx_id in dbops.audit_log"
      changes:
        - dropDefaultValue:
            schemaName: dbops
            tableName: audit_log
            columnName: tx_id

  - changeSet:
      id: 20250708-07-add-txid-trigger-audit_log
      author: mctit
      runOnChange: true
      comments: "Aggiunge il trigger che assegna il tx_id tramite dbops.trgfn_tx_id_managed()"
      changes:
        - sql:
            comment: "Creazione trigger per popolare tx_id in dbops.audit_log"
            splitStatements: false
            sql: |
                CREATE TRIGGER trg_assign_tx_id_audit_log
                BEFORE INSERT OR UPDATE ON dbops.audit_log
                FOR EACH ROW
                EXECUTE FUNCTION dbops.trgfn_tx_id_managed();

  - changeSet:
      id: 20250708-90-tag-txid-audit_log
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250708-06-add-txid-trigger-audit_log
