databaseChangeLog:

  - changeSet:
      id: 20250615-21-modify-audit_log-tx_id-default
      author: mctit
      comments: >
        Aggiorna il default di tx_id in dbops.audit_log per usare
        (md5(txid_current()::text))::uuid anziché gen_random_uuid().
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE dbops.audit_log
                ALTER COLUMN tx_id
                SET DEFAULT (md5(txid_current()::text))::uuid;

        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              -- Imposta l’owner della tabella e della sequenza al ruolo titodb
              ALTER TABLE dbops.audit_log
                OWNER TO titodb;
              ALTER SEQUENCE IF EXISTS dbops.audit_log_id_seq
                OWNER TO titodb;

  - changeSet:
      id: 20250615-90-modify-audit_log-tx_id-default
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250615-22-modify-audit_log-tx_id-default