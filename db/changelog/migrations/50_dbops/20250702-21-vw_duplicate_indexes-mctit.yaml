databaseChangeLog:

  - changeSet:
      id: 20250702-21-vw_duplicate_indexes
      author: mctit 
      runOnChange: true
      validCheckSums:
            - ANY
      changes:
      - createView:
          fullDefinition: false
          remarks: view che individua tutti gli indici “doppi” (cioè con lo stesso insieme di colonne) su una stessa tabella, 
                    raggruppando per schema, tabella e chiavi di indicizzazione, e mostrando gli indici coinvolti quando ce n’è più di uno
          schemaName: dbops
          replaceIfExists: true
          selectQuery: |-
            -- View: tutti gli indici “doppi” su una stessa tabella         
              WITH index_cols AS (
                SELECT
                  i.oid                    AS index_oid,
                  n.nspname                AS schema_name,
                  t.relname                AS table_name,
                  i.relname                AS index_name,
                  ix.indisunique           AS is_unique,
                  ix.indisprimary          AS is_primary,
                  array_agg(a.attname ORDER BY x.ordinality) AS cols
                FROM pg_index ix
                JOIN pg_class i    ON i.oid = ix.indexrelid
                JOIN pg_class t    ON t.oid = ix.indrelid
                JOIN pg_namespace n ON n.oid = t.relnamespace
                JOIN LATERAL unnest(ix.indkey) WITH ORDINALITY AS x(attnum, ordinality) ON true
                JOIN pg_attribute a ON a.attrelid = t.oid AND a.attnum = x.attnum
                WHERE NOT ix.indisprimary    -- escludi PK
                  AND i.relkind = 'i'         -- solo indici
                GROUP BY i.oid, n.nspname, t.relname, i.relname, ix.indisunique, ix.indisprimary
              )
              SELECT
                schema_name,
                table_name,
                cols                AS index_columns,
                array_agg(index_name) AS duplicate_index_names,
                count(*)            AS count_of_indexes
              FROM index_cols
              GROUP BY schema_name, table_name, cols
              HAVING count(*) > 1
              ORDER BY schema_name, table_name, count_of_indexes DESC;

          viewName: vw_duplicate_indexes

  - changeSet:
      id: 20250702-90-vw_duplicate_indexes
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250702-21-vw_duplicate_indexes