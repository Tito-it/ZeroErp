      runOnChange: true
      validCheckSums:
        - ANY
      comments: "Rimuove l'overload a 5 parametri di script.fn_log_and_raise_error"
      changes:
      - sql:
            splitStatements: false
            stripComments: false
            sql: |
               DROP FUNCTION IF EXISTS script.fn_log_and_raise_error(
                  text,
                  text,
                  text,
                  jsonb,
                  text[]
                );
        
