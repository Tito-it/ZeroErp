databaseChangeLog:
  - changeSet:
      id: 20250626-25-drop-populate-and-apply-policy-and-view
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      changes:
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              -- Rimuove la funzione di popolamento della policy sugli indici
              DROP FUNCTION IF EXISTS dbops.fn_populate_fk_index_policy();
              
              -- Rimuove la procedura che applica la policy sugli indici
              DROP PROCEDURE IF EXISTS dbops.apply_fk_index_policy();
              
              


  - changeSet:
      id: 20250626-25-rename_note_to_dll_command
      author: mctit 
      comments: "Rinomina la colonna note in cmd in dbops.fk_index_policy per riflettere che contiene il comando SQL"
      changes:
        - renameColumn:
            schemaName: dbops
            tableName: fk_index_policy
            oldColumnName: note
            newColumnName: dll_command
            columnDataType: text


  - changeSet:
      id: 20250626-90-rename_note_to_dll_command
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250626-25-rename_note_to_dll_command