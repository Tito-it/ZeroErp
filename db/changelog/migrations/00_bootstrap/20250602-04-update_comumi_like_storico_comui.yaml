databaseChangeLog:

  
  - changeSet:
      id: 20250602-04-update-storico_comuni
      author: mctit
      changes:
        # 1) Aggiungo la colonna provincia_id
        - addColumn:
            schemaName: storico
            tableName: comuni
            columns:
              - column:
                  name: provincia_id
                  type: integer
        # 2) creo l’indice su provincia_id
        - createIndex:
            schemaName: storico
            tableName: comuni
            indexName: ix_storico_comuni_provincia_id
            columns:
              - column:
                  name: provincia_id

        # 3) Creo il vincolo di foreign key su province
        - addForeignKeyConstraint:
            baseTableSchemaName: storico
            baseTableName: comuni
            baseColumnNames: provincia_id
            referencedTableSchemaName: config
            referencedTableName: province
            referencedColumnNames: id
            constraintName: fk_storico_comuni_config_province_id
            onUpdate: CASCADE
            onDelete: SET NULL

# Metto un  tag fine modifiche
  - changeSet:
      id: 20250602-05-update-storico_comuni
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250602-05-update-storico_comuni