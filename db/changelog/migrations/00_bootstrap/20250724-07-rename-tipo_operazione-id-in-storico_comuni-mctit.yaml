databaseChangeLog:
  - changeSet:
      id: 20250724-07-rename-tipo_operazione-id-in-storico_comuni
      author: mctit
      comments: "Rinomina la colonna tipo_operazione_id in tipo_operazione su storico.comuni"
      runOnChange: true
      validCheckSums:
        - ANY
      preConditions:
        onFail: MARK_RAN     # se la colonna esiste, il changeSet viene saltato
        onError: CONTINUE
         #  Assicuro che NON esista ancora tx_id
        not:
        columnExists:
            schemaName: storico
            tableName: comuni
            columnName: tipo_operazione_id
      changes:
        - renameColumn:
            schemaName: storico
            tableName: comuni
            oldColumnName: tipo_operazione_id
            newColumnName: tipo_operazione
            columnDataType: SMALLINT
  
  - changeSet:
      id: 20250724-90-rename-tipo_operazione-id-in-storico_comuni
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250724-07-rename-tipo_operazione-id-in-storico_comuni