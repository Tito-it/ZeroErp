databaseChangeLog:

  # 1) VENDITE — amplia il CHECK del parent per includere ORDINE e DDT
  - changeSet:
      id: 20250916-05-vendite-note-extend-target-tipo
      author: mctit
      preConditions:
        - onFail: HALT
        - tableExists: { schemaName: vendite, tableName: note }
      changes:
        
        - sql:
            splitStatements: false
            sql: |
              ALTER TABLE IF EXISTS vendite.note DROP CONSTRAINT IF EXISTS chk_note_target_tipo; 
              ALTER TABLE vendite.note
              ADD CONSTRAINT chk_note_target_tipo
              CHECK (target_tipo IN ('PREVENTIVO','CONTRATTO','FATTURA','ORDINE','DDT'));    
        
        - sql:
            splitStatements: false
            sql: |
              COMMENT ON CONSTRAINT chk_note_target_tipo ON vendite.note
                IS 'Valori ammessi: PREVENTIVO | CONTRATTO | FATTURA | ORDINE | DDT.';

# Metto un  tag fine modifiche
  - changeSet:
      id: 20250916-90-vendite-note-extend-target-tipo
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250916-05-vendite-note-extend-target-tipo