databaseChangeLog:
  - changeSet:
      id: 20250817-15-tipi_attivita-rename-cd_int_tipo_attivita-to-codice_interno
      author: mctit
      context: ddl
      runOnChange: true
      failOnError: true

      preConditions:
        - onFail: HALT
        - onError: HALT
        - and:
            - tableExists:
                schemaName: config
                tableName: tipi_attivita
            - columnExists:
                schemaName: config
                tableName: tipi_attivita
                columnName: cd_int_tipo_attivita
            - not:
                - columnExists:
                    schemaName: config
                    tableName: tipi_attivita
                    columnName: codice_interno

      changes:
        # 1) Rinomina colonna
        - renameColumn:
            schemaName: config
            tableName: tipi_attivita
            oldColumnName: cd_int_tipo_attivita
            newColumnName: codice_interno

        # 2) Rinomina vincolo UNIQUE se presente come constraint
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_constraint c
                  JOIN pg_class t ON t.oid = c.conrelid
                  JOIN pg_namespace n ON n.oid = t.relnamespace
                  WHERE c.contype = 'u'
                    AND n.nspname = 'config'
                    AND t.relname = 'tipi_attivita'
                    AND c.conname = 'uq_tipi_attivita_cd_int_tipo_attivita'
                ) THEN
                  EXECUTE 'ALTER TABLE config.tipi_attivita RENAME CONSTRAINT uq_tipi_attivita_cd_int_tipo_attivita TO uq_tipi_attivita_codice_interno';
                END IF;
              END$$;

        # 3) Rinomina indice se presente come indice unico "standalone"
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_class i
                  JOIN pg_namespace n ON n.oid = i.relnamespace
                  WHERE i.relkind IN ('i','I')
                    AND n.nspname = 'config'
                    AND i.relname = 'uq_tipi_attivita_cd_int_tipo_attivita'
                ) THEN
                  EXECUTE 'ALTER INDEX IF EXISTS config.uq_tipi_attivita_cd_int_tipo_attivita RENAME TO uq_tipi_attivita_codice_interno';
                END IF;
              END$$;

      rollback:
        - renameColumn:
            schemaName: config
            tableName: tipi_attivita
            oldColumnName: codice_interno
            newColumnName: cd_int_tipo_attivita

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_constraint c
                  JOIN pg_class t ON t.oid = c.conrelid
                  JOIN pg_namespace n ON n.oid = t.relnamespace
                  WHERE c.contype = 'u'
                    AND n.nspname = 'config'
                    AND t.relname = 'tipi_attivita'
                    AND c.conname = 'uq_tipi_attivita_codice_interno'
                ) THEN
                  EXECUTE 'ALTER TABLE config.tipi_attivita RENAME CONSTRAINT uq_tipi_attivita_codice_interno TO uq_tipi_attivita_cd_int_tipo_attivita';
                END IF;
              END$$;

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_class i
                  JOIN pg_namespace n ON n.oid = i.relnamespace
                  WHERE i.relkind IN ('i','I')
                    AND n.nspname = 'config'
                    AND i.relname = 'uq_tipi_attivita_codice_interno'
                ) THEN
                  EXECUTE 'ALTER INDEX IF EXISTS config.uq_tipi_attivita_codice_interno RENAME TO uq_tipi_attivita_cd_int_tipo_attivita';
                END IF;
              END$$;

  - changeSet:
      id: 20250817-90-tipi_attivita-rename-cd_int_tipo_attivita-to-codice_interno
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250817-15-tipi_attivita-rename-cd_int_tipo_attivita-to-codice_interno