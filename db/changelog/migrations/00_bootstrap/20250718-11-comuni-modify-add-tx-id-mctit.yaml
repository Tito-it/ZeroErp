databaseChangeLog:
 
  - changeSet:
      id: 20250718-16-comuni-modify-add-tx-id
      author: mctit

      preConditions:
        onFail: HALT
        onError: HALT
       
        # 3) Assicuro che NON esista ancora tx_id
        not:
          columnExists:
            schemaName: config
            tableName: comuni
            columnName: tx_id

      changes:
      
        # 3) Aggiunta della colonna tx_id uuid 
        - addColumn:
            schemaName: config
            tableName: comuni
            columns:
              - column:
                  name: tx_id
                  type: uuid
                  constraints:
                    nullable: true
  - changeSet:
      id: 20250718-17-comuni-modify-add-tx-id
      author: mctit

      preConditions:
        onFail: HALT
        onError: HALT
       
        # 3) Assicuro che NON esista ancora tx_id
        not:
          columnExists:
            schemaName: storico
            tableName: comuni
            columnName: tx_id

      changes:
      
        # 3) Aggiunta della colonna tx_id uuid 
        - addColumn:
            schemaName: storico
            tableName: comuni
            columns:
              - column:
                  name: tx_id
                  type: uuid
                  constraints:
                    nullable: true
  - changeSet:
      id: 20250718-90-comuni-modify-add-tx-id
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250718-16-comuni-modify-add-tx-id