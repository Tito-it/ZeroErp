databaseChangeLog:
  - changeSet:
      id: 20250817-23-conti_contabili-rename-codice_conto-to-codice
      author: mctit
      context: ddl
      runOnChange: true
      failOnError: true

      preConditions:
        - onFail: HALT
        - onError: HALT
        - and:
            - tableExists:
                schemaName: config
                tableName: conti_contabili
            - columnExists:
                schemaName: config
                tableName: conti_contabili
                columnName: codice_conto
            - not:
                - columnExists:
                    schemaName: config
                    tableName: conti_contabili
                    columnName: codice

      changes:
        # 1) rename colonna
        - renameColumn:
            schemaName: config
            tableName: conti_contabili
            oldColumnName: codice_conto
            newColumnName: codice

        # 2) rename vincolo UNIQUE se presente (storico: uq_conti_contabili_codice_conto)
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_constraint c
                  JOIN pg_class t ON t.oid = c.conrelid
                  JOIN pg_namespace n ON n.oid = t.relnamespace
                  WHERE c.contype = 'u'
                    AND n.nspname = 'config'
                    AND t.relname = 'conti_contabili'
                    AND c.conname = 'uq_conti_contabili_codice_conto'
                ) THEN
                  EXECUTE 'ALTER TABLE config.conti_contabili RENAME CONSTRAINT uq_conti_contabili_codice_conto TO uq_conti_contabili_codice';
                END IF;
              END$$;

        # 3) rename indice standalone se presente (stesso nome storico)
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_class i
                  JOIN pg_namespace n ON n.oid = i.relnamespace
                  WHERE i.relkind IN ('i','I')
                    AND n.nspname = 'config'
                    AND i.relname = 'uq_conti_contabili_codice_conto'
                ) THEN
                  EXECUTE 'ALTER INDEX IF EXISTS config.uq_conti_contabili_codice_conto RENAME TO uq_conti_contabili_codice';
                END IF;
              END$$;

      rollback:
        - renameColumn:
            schemaName: config
            tableName: conti_contabili
            oldColumnName: codice
            newColumnName: codice_conto

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_constraint c
                  JOIN pg_class t ON t.oid = c.conrelid
                  JOIN pg_namespace n ON n.oid = t.relnamespace
                  WHERE c.contype = 'u'
                    AND n.nspname = 'config'
                    AND t.relname = 'conti_contabili'
                    AND c.conname = 'uq_conti_contabili_codice'
                ) THEN
                  EXECUTE 'ALTER TABLE config.conti_contabili RENAME CONSTRAINT uq_conti_contabili_codice TO uq_conti_contabili_codice_conto';
                END IF;
              END$$;

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_class i
                  JOIN pg_namespace n ON n.oid = i.relnamespace
                  WHERE i.relkind IN ('i','I')
                    AND n.nspname = 'config'
                    AND i.relname = 'uq_conti_contabili_codice'
                ) THEN
                  EXECUTE 'ALTER INDEX IF EXISTS config.uq_conti_contabili_codice RENAME TO uq_conti_contabili_codice_conto';
                END IF;
              END$$;

  - changeSet:
      id: 20250817-90-conti_contabili-rename-codice_conto-to-codice
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250817-23-conti_contabili-rename-codice_conto-to-codice