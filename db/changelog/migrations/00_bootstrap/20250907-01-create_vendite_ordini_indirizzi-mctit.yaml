databaseChangeLog:
  - changeSet:
      id: 20250907-01-create_vendite_ordini_indirizzi
      author: mctit
      runOnChange: true
      changes:
       
        - createTable:
            schemaName: vendite
            tableName: ordini_indirizzi
            remarks: "Snapshot indirizzi collegati alla ordine; uno per tipo (ordinezione, spedizione, fornitura, residenza). Includere nello snapshot la mail. "
            columns:
                  - column:
                        name: id
                        type: BIGINT 
                        remarks: "PK "
                        autoIncrement: true
                        generationType: BY DEFAULT
                        constraints:
                          primaryKey: true
                          primaryKeyName: pk_ordini_indirizzi
                          nullable: false
                  
                  - column:
                        name: ordine_id
                        type: BIGINT
                        remarks: "FK → vendite.ordini(id)."
                        constraints:
                          nullable: false
                  - column:
                        name: tipo_indirizzo_id
                        type: BIGINT
                        remarks: "FK → config.tipi_indirizzi(id). Sostituisce ordini_indirizzi.tipo_indirizzo (string)."
                  - column:
                        name: snapshot
                        type: JSONB
                        defaultValueComputed: "'{}'::jsonb"
                        remarks: "Snapshot completo dell'indirizzo al momento dell'emissione."
                        constraints:
                          nullable: false



        - addUniqueConstraint:
                  schemaName: vendite
                  tableName: ordini_indirizzi
                  columnNames: ordine_id, tipo_indirizzo_id
                  constraintName: uq_ordini_indirizzi_uno_per_tipo


        - addForeignKeyConstraint:
                  baseTableSchemaName: vendite
                  baseTableName: ordini_indirizzi
                  baseColumnNames: ordine_id
                  constraintName: fk_ordini_indir_ordine
                  referencedTableSchemaName: vendite
                  referencedTableName: ordini
                  referencedColumnNames: id
                  onDelete: CASCADE
                  onUpdate: CASCADE
        # 3) Vincolo FK + NOT NULL
        - addForeignKeyConstraint:
                  baseTableSchemaName: vendite
                  baseTableName: ordini_indirizzi
                  baseColumnNames: tipo_indirizzo_id
                  constraintName: fk_ordini_indir_tipo
                  referencedTableSchemaName: config
                  referencedTableName: tipi_indirizzi
                  referencedColumnNames: id
                  onUpdate: CASCADE
                  onDelete: NO ACTION
        - addNotNullConstraint:
                  schemaName: vendite
                  tableName: ordini_indirizzi
                  columnName: tipo_indirizzo_id
                  constraintName: ordini_indir_tipo_id_not_null         


        - createIndex:
                  schemaName: vendite
                  tableName: ordini_indirizzi
                  indexName: ix_ordini_indir_ordine
                  columns:
                  - column: { name: ordine_id }
          

        - sql:
                 sql: |
                  COMMENT ON CONSTRAINT fk_ordini_indir_ordine ON vendite.ordini_indirizzi IS 'FK → vendite.ordini(id)';
                  COMMENT ON CONSTRAINT fk_ordini_indir_tipo ON vendite.ordini_indirizzi IS 'FK → anagrafiche.indirizzi(id)';



# Metto un  tag fine modifiche
  - changeSet:
      id: 20250907-90-create_vendite_ordini_indirizzi
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250907-01-create_vendite_ordini_indirizzi