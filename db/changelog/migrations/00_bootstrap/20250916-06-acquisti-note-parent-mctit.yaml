databaseChangeLog:
  - changeSet:
      id: 20250916-06-acquisti-note-parent
      author: mctit
      changes:
       
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              CREATE TABLE IF NOT EXISTS acquisti.note (
                id               BIGINT GENERATED BY DEFAULT AS IDENTITY,
                target_tipo      VARCHAR(16)  NOT NULL,   -- chiave di partizione
                target_id        BIGINT       NOT NULL,   -- id testata
                target_riga_id   BIGINT,                  -- id riga (se anchor_tipo='RIGA')
                anchor_tipo      VARCHAR(12)  NOT NULL,   -- DOCUMENTO | RIGA
                posizione        VARCHAR(12)  NOT NULL,   -- HEADER | FOOTER | SEZIONE | BEFORE | AFTER
                seq              INTEGER      NOT NULL DEFAULT 10,
                testo            TEXT,
                testo_md         TEXT,
                stile            VARCHAR(16)  NOT NULL DEFAULT 'NORMALE',
                lingua           CHAR(5),
                visibile         BOOLEAN      NOT NULL DEFAULT true,
                solo_stampa      BOOLEAN      NOT NULL DEFAULT false,
                meta             JSONB        NOT NULL DEFAULT '{}'::jsonb,
                data_insert      TIMESTAMPTZ  NOT NULL DEFAULT now(),
                user_insert      VARCHAR(80)  NOT NULL DEFAULT CURRENT_USER,
                data_update      TIMESTAMPTZ  NOT NULL DEFAULT now(),
                user_update      VARCHAR(80)  DEFAULT CURRENT_USER,
                CONSTRAINT pk_note_acq PRIMARY KEY (target_tipo, id),
                CONSTRAINT chk_acq_note_target_tipo CHECK (target_tipo IN ('ORDINE','DDT','FATTURA','CONTRATTO')),
                CONSTRAINT chk_acq_note_anchor_tipo CHECK (anchor_tipo IN ('DOCUMENTO','RIGA')),
                CONSTRAINT chk_acq_note_posizione  CHECK (posizione IN ('HEADER','FOOTER','SEZIONE','BEFORE','AFTER')),
                CONSTRAINT chk_acq_note_seq_pos    CHECK (seq >= 0)
              )
              PARTITION BY LIST (target_tipo);

              COMMENT ON TABLE acquisti.note
                IS 'Note ancorabili a documenti/righe (acquisti); parent partizionato per target_tipo.';
              COMMENT ON CONSTRAINT chk_acq_note_target_tipo ON acquisti.note
                IS 'Valori ammessi: ORDINE | DDT | FATTURA | CONTRATTO.';
        
        - createIndex:
            schemaName: acquisti
            tableName: note
            indexName: ix_acq_note_render_order
            columns:
              - column: { name: target_tipo }
              - column: { name: target_id }
              - column: { name: anchor_tipo }
              - column: { name: posizione }
              - column: { name: seq }


# Metto un  tag fine modifiche
  - changeSet:
