databaseChangeLog:
  - changeSet:
      id: 20250816-02-add-user-tracking-iva_natura
      author: mctit
      changes:
        - addColumn:
            schemaName: config
            tableName: iva_natura
            columns:
              - column:
                  name: user_insert
                  type: varchar(50)
                  remarks: "Utente che ha creato il record"
              - column:
                  name: user_update
                  type: varchar(50)
                  remarks: "Ultimo utente che ha aggiornato il record"
                  
        - renameColumn:
            schemaName: config
            tableName: iva_natura
            oldColumnName: descrizione_natura
            newColumnName: descrizione
            columnDataType: varchar(255)

  - changeSet:
      id: 20250816-90-rename-desc_iva-to-descrizione_iva
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250816-01-rename-desc_iva-to-descrizione_iva