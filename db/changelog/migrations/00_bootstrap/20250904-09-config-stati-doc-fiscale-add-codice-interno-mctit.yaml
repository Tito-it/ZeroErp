databaseChangeLog:
  - changeSet:
      id: 20250904-09-config-stati-doc-fiscale-add-codice-interno
      author: mctit
      
      preConditions:
        - onFail: HALT
        - tableExists: { schemaName: config, tableName: stati_doc_fiscale }
      changes:
        - addColumn:
            schemaName: config
            tableName: stati_doc_fiscale
            columns:
              - column:
                  name: codice_interno
                  type: VARCHAR(32)
                  remarks: "Codice tecnico interno, stabile e non modificabile."
        - sql:
            splitStatements: false
            sql: |
              UPDATE config.stati_doc_fiscale
                 SET codice_interno = codice
               WHERE codice_interno IS NULL;

        - addNotNullConstraint:
            schemaName: config
            tableName: stati_doc_fiscale
            columnName: codice_interno
            constraintName: nn_stati_doc_fiscale_codice_interno

        - addUniqueConstraint:
            schemaName: config
            tableName: stati_doc_fiscale
            columnNames: codice_interno
            constraintName: uq_stati_doc_fiscale_codice_interno

# Metto un  tag fine modifiche
  - changeSet:
      id: 20250904-90-config-stati-doc-fiscale-add-codice-interno
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250904-09-config-stati-doc-fiscale-add-codice-interno
