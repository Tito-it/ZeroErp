databaseChangeLog:
  - changeSet:
      id: 220250722-07-rename-indirizzo-id-in-storico_indirizzi_dettaglio
      author: mctit
      comments: "Rinomina la colonna indirizzo_id in indirizzo_dettaglio_id nella tabella storico.indirizzi_dettaglio e aggiorna il commento"
      runOnChange: true
      validCheckSums:
        - ANY
      preConditions:
        onFail: MARK_RAN     # se la colonna esiste, il changeSet viene saltato
        onError: CONTINUE
         #  Assicuro che NON esista ancora indirizzo_dettaglio_id
        not:
          columnExists:
            schemaName: storico
            tableName: indirizzi_dettaglio
            columnName: indirizzo_dettaglio_id
      changes:
        
     #   - dropForeignKeyConstraint:
     #       baseTableSchemaName: storico
     #       baseTableName: indirizzi_dettaglio
     #       constraintName: fk_storico_indirizzi_dettaglio_indirizzo
        
        - renameColumn:
            schemaName: storico
            tableName: indirizzi_dettaglio
            oldColumnName: indirizzo_id
            newColumnName: indirizzo_dettaglio_id
            columnDataType: INTEGER

        - addForeignKeyConstraint:
            baseTableSchemaName: storico
            baseTableName: indirizzi_dettaglio
            baseColumnNames: indirizzo_dettaglio_id
            referencedTableSchemaName: anagrafiche
            referencedTableName: indirizzi_dettaglio
            referencedColumnNames: id
            constraintName: fk_storico_indirizzi_dettaglio_indirizzo
            onUpdate: CASCADE
            onDelete: SET NULL    
        
        - sql:
            comment: "Aggiorna commento della colonna rinominata"
            splitStatements: false
            sql: |
              COMMENT ON COLUMN storico.indirizzi_dettaglio.indirizzo_dettaglio_id
                IS 'Riferimento alla tabella anagrafiche.indirizzi_dettaglio (colonna storica indirizzi_dettaglio_id)';
  
                                    
 # Metto un  tag fine modifiche
  - changeSet:
        id: 20250722-90-rename-indirizzo-id-in-storico_indirizzi_dettaglio
        author: mctit
        changes:
          - tagDatabase:
              tag: 20250722-07-rename-indirizzo-id-in-storico_indirizzi_dettaglio