databaseChangeLog:
  - changeSet:
      id: 20250818-02-create-storico-pdp
      author: mctit
      runOnChange: true
      validCheckSums: [ "ANY" ]
      preConditions:
        - onFail: CONTINUE
        - not: 
          - tableExists:
              schemaName: storico
              tableName: pdp
            # NB: Se lo schema 'storico' non esiste, fermiamo. In alternativa, aggiungi un changeset che lo crea.
      changes:
        # 3) Tabella storico PDP (con valid_from/valid_to/tx_id)
        - sql:
            sql: |
              CREATE TABLE IF NOT EXISTS storico.pdp (
                id           BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                pdp_id       BIGINT      NOT NULL,
                tipo_operazione CHAR(1)  NOT NULL CHECK (tipo_operazione IN ('I','U','D')),
                snapshot     JSONB       NOT NULL,
                tx_id        UUID        NOT NULL,
                valid_from   TIMESTAMPTZ NOT NULL DEFAULT now(),
                valid_to     TIMESTAMPTZ NULL,
                data_insert        TIMESTAMPTZ NOT NULL DEFAULT now(),
                user_insert        varchar(80) NOT NULL DEFAULT CURRENT_USER,
                CONSTRAINT fk_st_pdp_base FOREIGN KEY (pdp_id) REFERENCES anagrafiche.pdp(id) ON DELETE CASCADE
              );
 
              COMMENT ON TABLE  storico.pdp IS
                'Storico dei PDP: snapshot JSONB, tipo operazione (I/U/D), tx_id, periodo di validità (valid_from/valid_to).';
              COMMENT ON COLUMN storico.pdp.valid_from IS 'Inizio validità dello stato snapshot.';
              COMMENT ON COLUMN storico.pdp.valid_to   IS 'Fine validità dello stato snapshot (NULL = corrente).';

              CREATE INDEX IF NOT EXISTS idx_storico_pdp_pdp_id   ON storico.pdp(pdp_id);
              CREATE INDEX IF NOT EXISTS idx_storico_pdp_open     ON storico.pdp(pdp_id) WHERE valid_to IS NULL;

        
  - changeSet:
      id: 20250818-90-create-storico-pdp
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250818-02-create-storico-pdp