# Zero ERP – Tipi Ruoli: rename cod_ruolo -> codice
# Tabella: config.tipi_ruoli
# ------------------------------------------------------------
databaseChangeLog:
  - changeSet:
      id: 20250817-06-tipi_ruoli-rename-cod_ruolo-to-codice
      author: mctit
      context: ddl
      runOnChange: true
      failOnError: true

      preConditions:
        - onFail: HALT
        - onError: HALT
        - and:
            - tableExists:
                schemaName: config
                tableName: tipi_ruoli
            - columnExists:
                schemaName: config
                tableName: tipi_ruoli
                columnName: cod_ruolo
            - not:
                - columnExists:
                    schemaName: config
                    tableName: tipi_ruoli
                    columnName: codice

      changes:
        # 1) Rinomina colonna
        - renameColumn:
            schemaName: config
            tableName: tipi_ruoli
            oldColumnName: cod_ruolo
            newColumnName: codice

        # 2) Rinomina vincolo UNIQUE se presente come constraint
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_constraint c
                  JOIN pg_class t ON t.oid = c.conrelid
                  JOIN pg_namespace n ON n.oid = t.relnamespace
                  WHERE c.contype = 'u'
                    AND n.nspname = 'config'
                    AND t.relname = 'tipi_ruoli'
                    AND c.conname = 'uq_tipi_ruoli_cod_ruolo'
                ) THEN
                  EXECUTE 'ALTER TABLE config.tipi_ruoli RENAME CONSTRAINT uq_tipi_ruoli_cod_ruolo TO uq_tipi_ruoli_codice';
                END IF;
              END$$;

        # 3) Rinomina indice se presente come indice unico "standalone"
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_class i
                  JOIN pg_namespace n ON n.oid = i.relnamespace
                  WHERE i.relkind IN ('i','I')
                    AND n.nspname = 'config'
                    AND i.relname = 'uq_tipi_ruoli_cod_ruolo'
                ) THEN
                  EXECUTE 'ALTER INDEX IF EXISTS config.uq_tipi_ruoli_cod_ruolo RENAME TO uq_tipi_ruoli_codice';
                END IF;
              END$$;

      rollback:
        - renameColumn:
            schemaName: config
            tableName: tipi_ruoli
            oldColumnName: codice
            newColumnName: cod_ruolo

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_constraint c
                  JOIN pg_class t ON t.oid = c.conrelid
                  JOIN pg_namespace n ON n.oid = t.relnamespace
                  WHERE c.contype = 'u'
                    AND n.nspname = 'config'
                    AND t.relname = 'tipi_ruoli'
                    AND c.conname = 'uq_tipi_ruoli_codice'
                ) THEN
                  EXECUTE 'ALTER TABLE config.tipi_ruoli RENAME CONSTRAINT uq_tipi_ruoli_codice TO uq_tipi_ruoli_cod_ruolo';
                END IF;
              END$$;

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_class i
                  JOIN pg_namespace n ON n.oid = i.relnamespace
                  WHERE i.relkind IN ('i','I')
                    AND n.nspname = 'config'
                    AND i.relname = 'uq_tipi_ruoli_codice'
                ) THEN
                  EXECUTE 'ALTER INDEX IF EXISTS config.uq_tipi_ruoli_codice RENAME TO uq_tipi_ruoli_cod_ruolo';
                END IF;
              END$$;


  - changeSet:
      id: 20250817-90-tipi_ruoli-rename-cod_ruolo-to-codice
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250817-06-tipi_ruoli-rename-cod_ruolo-to-codice