databaseChangeLog:
  - changeSet:
      id: 20250817-22-iva-rename-codice_iva-to-codice
      author: mctit
      context: ddl
      runOnChange: true
      failOnError: true

      preConditions:
        - onFail: HALT
        - onError: HALT
        - and:
            - tableExists:
                schemaName: config
                tableName: iva
            - columnExists:
                schemaName: config
                tableName: iva
                columnName: codice_iva
            - not:
                - columnExists:
                    schemaName: config
                    tableName: iva
                    columnName: codice

      changes:
        # 1) Rinomina colonna
        - renameColumn:
            schemaName: config
            tableName: iva
            oldColumnName: codice_iva
            newColumnName: codice

        # 2) (Opz.) Rinomina eventuali vincoli UNIQUE storici verso lo standard 'uq_iva_codice'
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                -- vincolo storico possibile
                IF EXISTS (
                  SELECT 1
                  FROM pg_constraint c
                  JOIN pg_class t ON t.oid = c.conrelid
                  JOIN pg_namespace n ON n.oid = t.relnamespace
                  WHERE c.contype = 'u'
                    AND n.nspname = 'config'
                    AND t.relname = 'iva'
                    AND c.conname = 'uq_iva_codice_iva'
                ) THEN
                  EXECUTE 'ALTER TABLE config.iva RENAME CONSTRAINT uq_iva_codice_iva TO uq_iva_codice';
                END IF;
              END$$;

        # 3) (Opz.) Rinomina eventuale indice standalone storico verso 'uq_iva_codice'
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_class i
                  JOIN pg_namespace n ON n.oid = i.relnamespace
                  WHERE i.relkind IN ('i','I')
                    AND n.nspname = 'config'
                    AND i.relname = 'uq_iva_codice_iva'
                ) THEN
                  EXECUTE 'ALTER INDEX IF EXISTS config.uq_iva_codice_iva RENAME TO uq_iva_codice';
                END IF;
              END$$;

      rollback:
        - renameColumn:
            schemaName: config
            tableName: iva
            oldColumnName: codice
            newColumnName: codice_iva

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                -- rollback vincolo se rinominato
                IF EXISTS (
                  SELECT 1
                  FROM pg_constraint c
                  JOIN pg_class t ON t.oid = c.conrelid
                  JOIN pg_namespace n ON n.oid = t.relnamespace
                  WHERE c.contype = 'u'
                    AND n.nspname = 'config'
                    AND t.relname = 'iva'
                    AND c.conname = 'uq_iva_codice'
                ) THEN
                  EXECUTE 'ALTER TABLE config.iva RENAME CONSTRAINT uq_iva_codice TO uq_iva_codice_iva';
                END IF;
              END$$;

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                -- rollback indice se rinominato
                IF EXISTS (
                  SELECT 1
                  FROM pg_class i
                  JOIN pg_namespace n ON n.oid = i.relnamespace
                  WHERE i.relkind IN ('i','I')
                    AND n.nspname = 'config'
                    AND i.relname = 'uq_iva_codice'
                ) THEN
                  EXECUTE 'ALTER INDEX IF EXISTS config.uq_iva_codice RENAME TO uq_iva_codice_iva';
                END IF;
              END$$;


  - changeSet:
      id: 20250817-90-iva-rename-codice_iva-to-codice
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250817-22-iva-rename-codice_iva-to-codice