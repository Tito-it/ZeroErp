databaseChangeLog:
  - changeSet:
      id: 20250819-60-create-vendite-regole-fatturazione
      author: mctit
      runOnChange: true
      changes:
        

        # 1) Tabella
        - createTable:
            schemaName: vendite
            tableName: articolo_regole_fatturazione
            remarks: "Policy di visibilità/calcolo/arrotondamenti per articolo "
            columns:
              
              - column:
                    name: id
                    type: BIGINT 
                    autoIncrement: true
                    generationType: BY DEFAULT
                    constraints:
                      primaryKey: true
                      primaryKeyName: pk_articolo_regole_fatturazione
                      nullable: false
                    remarks: "PK"
              - column: { name: articolo_id, type: UUID, remarks: "Articolo di riferimento (catalogo.articoli.id)", constraints: { nullable: false } }
              - column: { name: visibilita_componenti, type: VARCHAR(24), defaultValue: "solo_padre", remarks: "solo_padre | padre_componenti | solo_componenti", constraints: { nullable: false } }
              - column: { name: calcolo_qta_padre, type: VARCHAR(28), defaultValue: "fissa", remarks: "fissa | somma_componenti_flaggate", constraints: { nullable: false } }
              - column: { name: arrotondamento_importi_dec, type: SMALLINT, defaultValueNumeric: 2, remarks: "Decimali per importi (0..6)", constraints: { nullable: false } }
              - column: { name: arrotondamento_quantita_dec, type: SMALLINT, defaultValueNumeric: 3, remarks: "Decimali per quantità (0..6)", constraints: { nullable: false } }
              - column: { name: metodo_arrotondamento_importi, type: VARCHAR(12), defaultValue: "HALF_UP", remarks: "HALF_UP | HALF_EVEN | FLOOR | CEIL", constraints: { nullable: false } }
              - column: { name: metodo_arrotondamento_quantita, type: VARCHAR(12), defaultValue: "HALF_UP", remarks: "HALF_UP | HALF_EVEN | FLOOR | CEIL", constraints: { nullable: false } }
              - column: { name: meta, type: JSONB, defaultValue: "{}", remarks: "Metadati estensibili JSONB" }

              # Audit standard
              - column: { name: user_insert, type: VARCHAR(30), defaultValueComputed: CURRENT_USER, remarks: "Utente inserimento", constraints: { nullable: false } }
              - column: { name: user_update, type: VARCHAR(30), defaultValueComputed: CURRENT_USER, remarks: "Utente ultima modifica" }
              - column: { name: data_insert, type: TIMESTAMPTZ, defaultValueComputed: now(), remarks: "Data inserimento", constraints: { nullable: false } }
              - column: { name: data_update, type: TIMESTAMPTZ, defaultValueComputed: now(), remarks: "Data ultima modifica", constraints: { nullable: false } }
              - column:
                  name: tx_id
                  type: UUID
                  remarks: "Id transazione"
              - column:
                  name: storicizza
                  type: BOOLEAN
                  defaultValueBoolean: true
                  remarks: "Se true, abilita storicizzazione"
        # 2) FK e Unique
        - addForeignKeyConstraint:
            baseTableSchemaName: vendite
            baseTableName: articolo_regole_fatturazione
            baseColumnNames: articolo_id
            referencedTableSchemaName: catalogo
            referencedTableName: articoli
            referencedColumnNames: id
            constraintName: fk_articolo_regole_fatturazione_articoli
            onDelete: RESTRICT
            onUpdate: CASCADE

        - addUniqueConstraint:
            schemaName: vendite
            tableName: articolo_regole_fatturazione
            columnNames: articolo_id
            constraintName: uq_articolo_regole_fatturazione_articolo

        # 3) Check constraints, indice, trigger, commenti
        - sql:
            splitStatements: false
            sql: |
              -- Check enumerazioni
              ALTER TABLE vendite.articolo_regole_fatturazione
                ADD CONSTRAINT chk_regole_visibilita_componenti
                CHECK (visibilita_componenti IN ('solo_padre','padre_componenti','solo_componenti'));

              ALTER TABLE vendite.articolo_regole_fatturazione
                ADD CONSTRAINT chk_regole_calcolo_qta_padre
                CHECK (calcolo_qta_padre IN ('fissa','somma_componenti_flaggate'));

              ALTER TABLE vendite.articolo_regole_fatturazione
                ADD CONSTRAINT chk_regole_decimali_importi
                CHECK (arrotondamento_importi_dec BETWEEN 0 AND 6);

              ALTER TABLE vendite.articolo_regole_fatturazione
                ADD CONSTRAINT chk_regole_decimali_quantita
                CHECK (arrotondamento_quantita_dec BETWEEN 0 AND 6);

              ALTER TABLE vendite.articolo_regole_fatturazione
                ADD CONSTRAINT chk_regole_metodo_arrotondamento_importi
                CHECK (metodo_arrotondamento_importi IN ('HALF_UP','HALF_EVEN','FLOOR','CEIL'));

              ALTER TABLE vendite.articolo_regole_fatturazione
                ADD CONSTRAINT chk_regole_metodo_arrotondamento_quantita
                CHECK (metodo_arrotondamento_quantita IN ('HALF_UP','HALF_EVEN','FLOOR','CEIL'));

              -- Indice per join/lookup su articolo
              CREATE INDEX IF NOT EXISTS ix_articolo_regole_fatturazione_articolo
                ON vendite.articolo_regole_fatturazione (articolo_id);

              -- Trigger audit
              CREATE OR REPLACE TRIGGER trg_upd_articolo_regole_fatturazione_audit_data_user
                BEFORE UPDATE ON vendite.articolo_regole_fatturazione
                FOR EACH ROW
                EXECUTE FUNCTION script.trgfn_upd_audit_data_user_generic();

              -- Commenti tabella/colonne
              COMMENT ON TABLE vendite.articolo_regole_fatturazione
                IS 'Policy di visibilità/calcolo/arrotondamenti per articolo';
              COMMENT ON COLUMN vendite.articolo_regole_fatturazione.id IS 'PK (sequence vendite.articolo_regole_fatturazione_id_seq)';
              COMMENT ON COLUMN vendite.articolo_regole_fatturazione.articolo_id IS 'FK → catalogo.articoli.id';
              COMMENT ON COLUMN vendite.articolo_regole_fatturazione.visibilita_componenti IS 'solo_padre | padre_componenti | solo_componenti';
              COMMENT ON COLUMN vendite.articolo_regole_fatturazione.calcolo_qta_padre IS 'fissa | somma_componenti_flaggate';
              COMMENT ON COLUMN vendite.articolo_regole_fatturazione.arrotondamento_importi_dec IS 'Decimali importi (0..6)';
              COMMENT ON COLUMN vendite.articolo_regole_fatturazione.arrotondamento_quantita_dec IS 'Decimali quantità (0..6)';
              COMMENT ON COLUMN vendite.articolo_regole_fatturazione.metodo_arrotondamento_importi IS 'HALF_UP | HALF_EVEN | FLOOR | CEIL';
              COMMENT ON COLUMN vendite.articolo_regole_fatturazione.metodo_arrotondamento_quantita IS 'HALF_UP | HALF_EVEN | FLOOR | CEIL';
              COMMENT ON COLUMN vendite.articolo_regole_fatturazione.meta IS 'Metadati estensibili JSONB';
              COMMENT ON COLUMN vendite.articolo_regole_fatturazione.user_insert IS 'Utente inserimento';
              COMMENT ON COLUMN vendite.articolo_regole_fatturazione.user_update IS 'Utente ultima modifica';
              COMMENT ON COLUMN vendite.articolo_regole_fatturazione.data_insert IS 'Data inserimento';
              COMMENT ON COLUMN vendite.articolo_regole_fatturazione.data_update IS 'Data ultima modifica';

              -- Commenti vincoli/indice/trigger
              COMMENT ON CONSTRAINT fk_articolo_regole_fatturazione_articoli ON vendite.articolo_regole_fatturazione IS 'FK: vendite.articolo_regole_fatturazione → catalogo.articoli';
              COMMENT ON CONSTRAINT uq_articolo_regole_fatturazione_articolo ON vendite.articolo_regole_fatturazione IS 'Unicità regole per articolo';
              COMMENT ON CONSTRAINT pk_articolo_regole_fatturazione ON vendite.articolo_regole_fatturazione IS 'PK regole fatturazione articolo';
              COMMENT ON CONSTRAINT chk_regole_visibilita_componenti ON vendite.articolo_regole_fatturazione IS 'Valori ammessi per visibilità componenti';
              COMMENT ON CONSTRAINT chk_regole_calcolo_qta_padre ON vendite.articolo_regole_fatturazione IS 'Valori ammessi per calcolo_qta_padre';
              COMMENT ON CONSTRAINT chk_regole_decimali_importi ON vendite.articolo_regole_fatturazione IS '0..6 decimali per importi';
              COMMENT ON CONSTRAINT chk_regole_decimali_quantita ON vendite.articolo_regole_fatturazione IS '0..6 decimali per quantità';
              COMMENT ON CONSTRAINT chk_regole_metodo_arrotondamento_importi ON vendite.articolo_regole_fatturazione IS 'Metodi ammessi importi';
              COMMENT ON CONSTRAINT chk_regole_metodo_arrotondamento_quantita ON vendite.articolo_regole_fatturazione IS 'Metodi ammessi quantità';
              COMMENT ON INDEX vendite.ix_articolo_regole_fatturazione_articolo IS 'Lookup per articolo';
              COMMENT ON TRIGGER trg_upd_articolo_regole_fatturazione_audit_data_user ON vendite.articolo_regole_fatturazione IS 'Aggiorna (audit) data_update e user_update';




  - changeSet:
      id: 20250819-61-create-vendite-regole-fatturazione
      author: mctit
      runOnChange: true
      changes:
        - sql:
            splitStatements: false
            sql: |

                  DROP TRIGGER IF EXISTS trg_upd_regole_fatturazione_articolo_audit_data_user ON vendite.regole_fatturazione_articolo;                    
                  DROP TABLE IF EXISTS vendite.regole_fatturazione_articolo;

  - changeSet:
      id: 20250819-90-create-vendite-regole-fatturazione
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250819-60-create-vendite-regole-fatturazione