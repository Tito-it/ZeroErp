databaseChangeLog:
 
  - changeSet:
      id: 20250717-11-soggetti-modify-id-fiscale-and-add-tx-id
      author: mctit

      preConditions:
        onFail: HALT
        onError: HALT
        # 1) Assicuro che esista il unique constraint da droppare
        uniqueConstraintExists:
          schemaName: anagrafiche
          tableName: soggetti
          constraintName: key_soggetto_idstato_id_fiscale_univoco
        # 2) Assicuro che esista la colonna generata da droppare
        columnExists:
          schemaName: anagrafiche
          tableName: soggetti
          columnName: id_fiscale_univoco_cf_piva
        # 3) Assicuro che NON esista ancora tx_id
        not:
          columnExists:
            schemaName: anagrafiche
            tableName: soggetti
            columnName: tx_id

      changes:
        # 0) Drop del unique constraint esistente
        - dropUniqueConstraint:
            schemaName: anagrafiche
            tableName: soggetti
            constraintName: key_soggetto_idstato_id_fiscale_univoco

        # 1) Drop della colonna generata obsoleta
        - dropColumn:
            schemaName: anagrafiche
            tableName: soggetti
            columnName: id_fiscale_univoco_cf_piva
        # 2) Re‐creazione della colonna generata con il nuovo CASE…END
        - sql:
            comment: "Re-add generated column id_fiscale_univoco_cf_piva con CASE…END"
            splitStatements: false
            sql: |
              ALTER TABLE anagrafiche.soggetti
              ADD COLUMN id_fiscale_univoco_cf_piva text
                GENERATED ALWAYS AS (
                  CASE
                    WHEN codice_fiscale IS NOT NULL
                     AND partita_iva   IS NOT NULL
                     AND codice_fiscale <> partita_iva
                    THEN codice_fiscale || ' ' || partita_iva
                    ELSE COALESCE(codice_fiscale, partita_iva)
                  END
                ) STORED;
         # 2a) Ricreazione del unique constraint sulla coppia di colonne
        - addUniqueConstraint:
            schemaName: anagrafiche
            tableName: soggetti
            columnNames: stato_id, id_fiscale_univoco_cf_piva
            constraintName: key_soggetto_idstato_id_fiscale_univoco
        # 3) Aggiunta della colonna tx_id uuid 
        - addColumn:
            schemaName: anagrafiche
            tableName: soggetti
            columns:
              - column:
                  name: tx_id
                  type: uuid
                  constraints:
                    nullable: true
  
  - changeSet:
      id: 20250717-11A-soggetti-add-storicizza
      author: mctit

      preConditions:
        onFail: HALT
        onError: CONTINUE
        
        # ) Assicuro che NON esista ancora storicizza
        not:
          columnExists:
            schemaName: anagrafiche
            tableName: soggetti
            columnName: storicizza
            
      changes:
        - addColumn:
            schemaName: anagrafiche
            tableName: soggetti
            columns:
              - column:
                  name: storicizza
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
                  remarks: "Se true, il soggetto viene storicizzato in storico.soggetti"


  - changeSet:
      id: 20250717-90-soggetti-modify-id-fiscale-and-add-tx-id
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250717-11-soggetti-modify-id-fiscale-and-add-tx-id