databaseChangeLog:
  - changeSet:
      id: 20250817-17-stati_pratiche-rename-cd_int_stato-to-codice_interno
      author: mctit
      context: ddl
      runOnChange: true
      failOnError: true

      preConditions:
        - onFail: HALT
        - onError: HALT
        - and:
            - tableExists:
                schemaName: config
                tableName: stati_pratiche
            - columnExists:
                schemaName: config
                tableName: stati_pratiche
                columnName: cd_int_stato
            - not:
                - columnExists:
                    schemaName: config
                    tableName: stati_pratiche
                    columnName: codice_interno

      changes:
        # 1) Rinomina colonna
        - renameColumn:
            schemaName: config
            tableName: stati_pratiche
            oldColumnName: cd_int_stato
            newColumnName: codice_interno

        # 2) Rinomina vincolo UNIQUE (storico: uq_stati_pratiche_cd_int_stato)
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_constraint c
                  JOIN pg_class t ON t.oid = c.conrelid
                  JOIN pg_namespace n ON n.oid = t.relnamespace
                  WHERE c.contype = 'u'
                    AND n.nspname = 'config'
                    AND t.relname = 'stati_pratiche'
                    AND c.conname = 'uq_stati_pratiche_cd_int_stato'
                ) THEN
                  EXECUTE 'ALTER TABLE config.stati_pratiche RENAME CONSTRAINT uq_stati_pratiche_cd_int_stato TO uq_stati_pratiche_codice_interno';
                END IF;
              END$$;

        # 3) Rinomina indice standalone (storico: uq_stati_pratiche_cd_int_stato)
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_class i
                  JOIN pg_namespace n ON n.oid = i.relnamespace
                  WHERE i.relkind IN ('i','I')
                    AND n.nspname = 'config'
                    AND i.relname = 'uq_stati_pratiche_cd_int_stato'
                ) THEN
                  EXECUTE 'ALTER INDEX IF EXISTS config.uq_stati_pratiche_cd_int_stato RENAME TO uq_stati_pratiche_codice_interno';
                END IF;
              END$$;

      rollback:
        - renameColumn:
            schemaName: config
            tableName: stati_pratiche
            oldColumnName: codice_interno
            newColumnName: cd_int_stato

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_constraint c
                  JOIN pg_class t ON t.oid = c.conrelid
                  JOIN pg_namespace n ON n.oid = t.relnamespace
                  WHERE c.contype = 'u'
                    AND n.nspname = 'config'
                    AND t.relname = 'stati_pratiche'
                    AND c.conname = 'uq_stati_pratiche_codice_interno'
                ) THEN
                  EXECUTE 'ALTER TABLE config.stati_pratiche RENAME CONSTRAINT uq_stati_pratiche_codice_interno TO uq_stati_pratiche_cd_int_stato';
                END IF;
              END$$;

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_class i
                  JOIN pg_namespace n ON n.oid = i.relnamespace
                  WHERE i.relkind IN ('i','I')
                    AND n.nspname = 'config'
                    AND i.relname = 'uq_stati_pratiche_codice_interno'
                ) THEN
                  EXECUTE 'ALTER INDEX IF EXISTS config.uq_stati_pratiche_codice_interno RENAME TO uq_stati_pratiche_cd_int_stato';
                END IF;
              END$$;


  - changeSet:
      id: 20250817-90-stati_pratiche-rename-cd_int_stato-to-codice_interno
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250817-17-stati_pratiche-rename-cd_int_stato-to-codice_interno