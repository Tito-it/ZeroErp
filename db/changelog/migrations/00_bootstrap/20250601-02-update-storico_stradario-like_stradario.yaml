databaseChangeLog:

  
  - changeSet:
      id: 20250602-03-update-storico_stradario
      author: mctit
      changes:
        # 1) Rimuovo il vincolo di foreign key esistente su via_id
        - dropForeignKeyConstraint:
            baseTableSchemaName: storico
            baseTableName: stradario
            constraintName: fk_stradario_via_id_config

        # 2) Rimuovo l’indice esistente su via_id
        - dropIndex:
            schemaName: storico
            tableName: stradario
            indexName: ix_storico_stradario_via_id

        # 3) Rinomino la colonna via_id in stradario_generale_id
        - renameColumn:
            schemaName: storico
            tableName: stradario
            oldColumnName: via_id
            newColumnName: stradario_generale_id
            columnDataType: integer

        # 4) Aggiungo la colonna geoloc (geometry Point SRID 4326)
        - addColumn:
            schemaName: storico
            tableName: stradario
            columns:
              - column:
                  name: geoloc
                  type: geometry(Point,4326)

        # 5) Aggiungo la colonna extra_info (jsonb)
        - addColumn:
            schemaName: storico
            tableName: stradario
            columns:
              - column:
                  name: extra_info
                  type: jsonb

        # 6) Ricreo l’indice sul nuovo nome di colonna
        - createIndex:
            schemaName: storico
            tableName: stradario
            indexName: ix_storico_stradario_stradario_generale_id
            columns:
              - column:
                  name: stradario_generale_id

        # 7) Ricreo il vincolo di foreign key su stradario_generale_id
        - addForeignKeyConstraint:
            baseTableSchemaName: storico
            baseTableName: stradario
            baseColumnNames: stradario_generale_id
            referencedTableSchemaName: config
            referencedTableName: stradario_generale
            referencedColumnNames: id
            constraintName: fk_storico_stradario_stradario_generale_id_config
            onUpdate: CASCADE
            onDelete: RESTRICT

# Metto un  tag fine modifiche
  - changeSet:
      id: 20250601-04-update-storico_stradario
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250601-04-update-storico_stradario