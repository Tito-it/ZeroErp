databaseChangeLog:
  - changeSet:
      id: 20250713-20-add-unique-stati-codice_iso2
      author: mctit
      preConditions:
        onFail: MARK_RAN
        onError: HALT
       
  # 1) Aggiungo la nuova colonna stato_id (che referenzia la PK di config.stati)
        not:
            columnExists:
              schemaName: config
              tableName: tipi_soggetto_dettaglio
              columnName: stato_id
      changes:
        - addColumn:
            schemaName: config
            tableName: tipi_soggetto_dettaglio
            columns:
              - column:
                  name: stato_id
                  type: bigint

  # 2) Popolo stato_id in base al valore di stato_iso
  - changeSet:
      id: 20250713-2001-backfill-stato-id
      author: mctit
      preConditions:
        onFail: MARK_RAN
        onError: HALT
        not:
            sqlCheck:
              expectedResult: "0"
              # Se qualche stato_id è già nullo, allora lo popoliamo
              sql: |
                SELECT COUNT(*) FROM config.tipi_soggetto_dettaglio
                WHERE stato_id IS NOT NULL
      changes:
        - sql:
            splitStatements: false
            sql: |
              UPDATE config.tipi_soggetto_dettaglio AS t
              SET stato_id = s.id
              FROM config.stati AS s
              WHERE t.stato_iso = s.codice_iso2;

  # 3) Aggiungo il foreign key su stato_id
  - changeSet:
      id: 20250714-20-03-add-fk-stato-id
      author: mctit
      preConditions:
        onFail: MARK_RAN
        onError: HALT
        not:
            foreignKeyConstraintExists:
              schemaName: config
              tableName: tipi_soggetto_dettaglio
              constraintName: fk_tipi_soggetto_dettaglio_stato_id
      changes:
        - addForeignKeyConstraint:
            baseTableSchemaName: config
            baseTableName: tipi_soggetto_dettaglio
            baseColumnNames: stato_id
            referencedTableSchemaName: config
            referencedTableName: stati
            referencedColumnNames: id
            constraintName: fk_tipi_soggetto_dettaglio_stato_id
            onUpdate: CASCADE
            onDelete: RESTRICT

  - changeSet:
      id: 20250713-90-add-unique-stati-codice_iso2
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250713-20-add-unique-stati-codice_iso2