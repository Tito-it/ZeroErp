databaseChangeLog:
  - changeSet:
      id: 20250917-06-create_config_stati_doc_preventivi
      author: mctit
      runOnChange: true
      changes:

        - createTable:
            schemaName: config
            tableName: stati_doc_preventivi
            remarks: "Dominio stati del documento preventivo (codici stabili; descrizioni multilingua). "
            columns:
                - column:
                    name: id
                    type: BIGINT 
                    autoIncrement: true
                    generationType: BY DEFAULT
                    constraints:
                      primaryKey: true
                      primaryKeyName: pk_stati_doc_preventivi
                      nullable: false
                    remarks: "PK"
                - column:
                    name: codice_interno
                    type: VARCHAR(32)
                    remarks: "Codice interno immutabile."
                    constraints:
                      nullable: false
                - column:
                    name: codice
                    type: VARCHAR(32)
                    remarks: "Codice stabile (es. DRAFT, EMESSO,ACCETTATO,RIFIUTATO,SCADUTO)."
                    constraints:
                      nullable: false
                - column:
                    name: descrizione
                    type: VARCHAR(120)
                
                - column:
                    name: attivo
                    type: BOOLEAN
                    defaultValueBoolean: true
                    constraints:
                      nullable: false
                - column:
                    name: ordine
                    type: SMALLINT
                - column:
                    name: meta
                    type: JSONB
                    defaultValueComputed: "'{}'::jsonb"
                    constraints:
                      nullable: false   
                - column: { name: data_insert, type: TIMESTAMPTZ, defaultValueComputed: now(), constraints: { nullable: false }, remarks: "Audit: data inserimento" }
                - column: { name: user_insert, type: VARCHAR(80), defaultValueComputed: CURRENT_USER, constraints: { nullable: false }, remarks: "Audit: utente inserimento" }
                - column: { name: data_update, type: TIMESTAMPTZ, defaultValueComputed: now(), constraints: { nullable: false }, remarks: "Audit: data aggiornamento" }
                - column: { name: user_update, type: VARCHAR(80), defaultValueComputed: CURRENT_USER, remarks: "Audit: utente aggiornamento" }

        - addUniqueConstraint:
            schemaName: config
            tableName: stati_doc_preventivi
            columnNames: codice_interno
            constraintName: uq_stati_doc_preventivi_codice_interno
        - addUniqueConstraint:
            schemaName: config
            tableName: stati_doc_preventivi
            columnNames: codice
            constraintName: uq_stati_doc_preventivi_codice
        - createIndex:
            schemaName: config
            tableName: stati_doc_preventivi
            indexName: ix_stati_doc_preventivi_attivo
            columns:
                - column: { name: attivo }

        # Indice case-insensitive su codice (espressione)
        - sql:
            splitStatements: false
            sql: |
              CREATE INDEX IF NOT EXISTS ix_stati_doc_preventivi_codice_upper
                ON config.stati_doc_preventivi (upper(codice));
        - sql:
            splitStatements: false
            sql: |
              CREATE INDEX IF NOT EXISTS ix_stati_doc_preventivi_codice_interno_upper
                ON config.stati_doc_preventivi (upper(codice_interno));
        - sql:
            splitStatements: false
            sql: |
              CREATE INDEX IF NOT EXISTS ix_stati_doc_preventivi_descrizione_upper
                ON config.stati_doc_preventivi (upper(descrizione));

# Metto un  tag fine modifiche
  - changeSet:
      id: 20250917-90-create_config_stati_doc_preventivi
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250917-06-create_config_stati_doc_preventivi