databaseChangeLog:
  - changeSet:
      id: 20250904-10-modify_vendite_registri_fat_prog
      author: mctit
      changes:
        # Default normalizzati
        - addDefaultValue:
            schemaName: vendite
            tableName: registri_fatturazione_progressivi
            columnName: mese
            defaultValueNumeric: 0
        - addDefaultValue:
            schemaName: vendite
            tableName: registri_fatturazione_progressivi
            columnName: serie
            defaultValue: ""

        # NOT NULL per chiave canonica
        - addNotNullConstraint:
            schemaName: vendite
            tableName: registri_fatturazione_progressivi
            columnName: mese
            constraintName: nn_regprog_mese
        - addNotNullConstraint:
            schemaName: vendite
            tableName: registri_fatturazione_progressivi
            columnName: serie
            constraintName: nn_regprog_serie

        # Check aggiornato (0 = no reset mensile; 1..12 = mese valido)
        #- dropCheckConstraint:
        #    schemaName: vendite
        #    tableName: registri_fatturazione_progressivi
        #    constraintName: registri_fatturazione_progressivi
        
        # Check constraint
        - sql:
            splitStatements: false
            sql: |
              ALTER TABLE vendite.registri_fatturazione_progressivi
              DROP CONSTRAINT registri_fatturazione_progressivi;

              ALTER TABLE vendite.registri_fatturazione_progressivi
              ADD CONSTRAINT chk_regprog_mese_valid
              CHECK (mese = 0 OR (mese >= 1 AND mese <= 12));

        # Chiave univoca “pulita” sulla combinazione di progressione
        - addUniqueConstraint:
            schemaName: vendite
            tableName: registri_fatturazione_progressivi
            columnNames: registro_id, anno, mese, serie
            constraintName: uq_regprog_key


# Metto un  tag fine modifiche
  - changeSet:
      id: 20250904-90-modify_vendite_registri_fat_prog
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250904-10-modify_vendite_registri_fat_prog
    