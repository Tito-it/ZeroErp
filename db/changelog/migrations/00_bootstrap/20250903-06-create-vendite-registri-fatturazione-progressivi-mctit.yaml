databaseChangeLog:
  - changeSet:
      id: 20250903-03-create-vendite-registri-fatturazione-progressivi
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY

      preConditions:
        - onFail: HALT
        - tableExists:  { schemaName: vendite, tableName: registri_fatturazione }
      changes:
        - createTable:
            schemaName: vendite
            tableName: registri_fatturazione_progressivi
            remarks: "Progressivi per assegnazione numeri fattura (registro/anno[/mese]/serie)."
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  generationType: BY DEFAULT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_registri_progressivi
                    nullable: false
                  remarks: "PK"
              - column:
                  name: registro_id
                  type: BIGINT
                  constraints: { nullable: false }
                  remarks: "FK → vendite.registri_fatturazione.id (registro di riferimento)"
              - column:
                  name: anno
                  type: SMALLINT
                  constraints: { nullable: false }
                  remarks: "Anno del progressivo"
              - column:
                  name: mese
                  type: SMALLINT
                  remarks: "Mese (1-12); NULL se reset != MENSILE"
              - column:
                  name: serie
                  type: VARCHAR(8)
                  remarks: "Serie di fatturazione; può essere NULL"
              - column:
                  name: last_numero
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints: { nullable: false }
                  remarks: "Ultimo numero utilizzato per la combinazione (registro/anno[/mese]/serie)"
              - column:
                  name: ATTIVO
                  type: BOOLEAN
                  remarks: "Indica se il registro è attivo"

        # Foreign key
        - addForeignKeyConstraint:
            baseTableSchemaName: vendite
            baseTableName: registri_fatturazione_progressivi
            baseColumnNames: registro_id
            constraintName: fk_registri_progressivi_registro
            referencedTableSchemaName: vendite
            referencedTableName: registri_fatturazione
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: CASCADE

        
        # Check constraint
        - sql:
            splitStatements: false
            sql: |

              ALTER TABLE vendite.registri_fatturazione_progressivi
              ADD CONSTRAINT registri_fatturazione_progressivi
              CHECK (mese IS NULL OR (mese BETWEEN 1 AND 12));


  - changeSet:
      id: 20250903-04-create-vendite-registri-fatturazione-progressivi
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      changes:
        - sql:
            splitStatements: false
            sql: |
                  -- Unicità progressivo considerando NULL = '' per serie e NULL = 0 per mese
                  DO $$
                  BEGIN
                    IF NOT EXISTS (
                      SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
                      WHERE n.nspname='vendite' AND c.relname='uq_registri_progressivi_scope'
                    ) THEN
                      CREATE UNIQUE INDEX uq_registri_progressivi_scope
                        ON vendite.registri_fatturazione_progressivi(
                          registro_id, anno,
                          COALESCE(mese, 0),
                          COALESCE(serie, '')
                        );
                      COMMENT ON INDEX vendite.uq_registri_progressivi_scope IS 'Unicità per registro+anno+(mese se MENSILE)+serie (coalesce).';
                    END IF;
                  END$$;

# Metto un  tag fine modifiche
  - changeSet:
      id: 20250903-90-create-vendite-registri-fatturazione-progressivi
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250903-03-create-vendite-registri-fatturazione-progressivi