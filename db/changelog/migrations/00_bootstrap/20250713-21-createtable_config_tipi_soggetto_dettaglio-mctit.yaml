databaseChangeLog:
  - changeSet:
      id: 20250713-21-createtable_config_tipi_soggetto_dettaglio
      author: mctit
      comments: "Crea la tabella config.tipi_soggetto_dettaglio"
      runOnChange: true
      validCheckSums:
        - ANY

      preConditions:
        onFail: MARK_RAN
        onError: MARK_RAN
        preConditions:
          - not:
              tableExists:
                schemaName: config
                tableName: tipi_soggetto_dettaglio
      
      changes:
       # Sequence per tipi_soggetto_dettaglio
        - createSequence:
              schemaName: config
              sequenceName: tipi_soggetto_dettaglio_id_seq
              startValue: 1
        - createTable:
              schemaName: config
              tableName: tipi_soggetto_dettaglio
              columns:
                - column:
                    name: id
                    type: BIGINT
                    constraints:
                      primaryKey: true
                      nullable: false
                - column:
                    name: id_tipo_soggetto
                    type: VARCHAR(10)
                    constraints:
                      nullable: false
                      
                - column:
                    name: stato_iso
                    type: VARCHAR(2)
                    constraints:
                      nullable: false
                - column:
                    name: cod_int_tipo_soggetto
                    type: VARCHAR(10)
                    constraints:
                      unique: true
                      nullable: false
                - column:
                    name: descrizione_locale
                    type: VARCHAR(100)
                - column:
                    name: formato_cf
                    type: VARCHAR(20)
                - column:
                    name: formato_piva
                    type: VARCHAR(20)
                - column:
                    name: user_insert
                    type: TEXT
                    defaultValueComputed: current_user
                    constraints:
                      nullable: false
                - column:
                    name: data_insert
                    type: TIMESTAMP WITH TIME ZONE
                    defaultValueComputed: now()
                    constraints:
                      nullable: false
                - column:
                    name: user_update
                    type: TEXT
                    constraints:
                      nullable: true
                - column:
                    name: data_update
                    type: TIMESTAMP WITH TIME ZONE
                    constraints:
                      nullable: true
                # Foreign key tipi_soggetto_dettaglio → tipi_soggetto
        - addForeignKeyConstraint:
                    baseSchemaName: config
                    baseTableName: tipi_soggetto_dettaglio
                    baseColumnNames: codice_tipo_soggetto
                    referencedSchemaName: config
                    referencedTableName: tipi_soggetto
                    referencedColumnNames: codice
                    constraintName: fk_tipi_soggetto_dettaglio_codice_tipo
                    onUpdate: CASCADE
                    onDelete: RESTRICT
                # Foreign key tipi_soggetto_dettaglio → stati
        - addForeignKeyConstraint:
                    baseSchemaName: config
                    baseTableName: tipi_soggetto_dettaglio
                    baseColumnNames: stato_iso
                    referencedSchemaName: config
                    referencedTableName: stati
                    referencedColumnNames: codice_iso2
                    constraintName: fk_tipi_soggetto_dettaglio_stato_iso
                    onUpdate: CASCADE
                    onDelete: RESTRICT
        - sql:
              sql: |
                COMMENT ON TABLE config.tipi_soggetto_dettaglio IS 'Tipologia dettagliata soggetto con formato CF e P.IVA per paese';
                COMMENT ON COLUMN config.tipi_soggetto_dettaglio.cod_int_tipo_soggetto IS 'Codice interno non modificabile per controlli applicativi';

  - changeSet:
