databaseChangeLog:
  - changeSet:
      id: 20250917-02-create_acquisti_ddt_indirizzi
      author: mctit
      runOnChange: true
      changes:
       
        - createTable:
            schemaName: acquisti
            tableName: ddt_indirizzi
            remarks: "Snapshot indirizzi collegati al ddt; uno per tipo ( partenza, consegna). Includere nello snapshot la mail. "
            columns:
                  - column:
                        name: id
                        type: BIGINT 
                        remarks: "PK "
                        autoIncrement: true
                        generationType: BY DEFAULT
                        constraints:
                          primaryKey: true
                          primaryKeyName: pk_ddt_indirizzi
                          nullable: false
                  
                  - column:
                        name: ddt_id
                        type: BIGINT
                        remarks: "FK → acquisti.ddt(id)."
                        constraints:
                          nullable: false
                  - column:
                        name: tipo_indirizzo_id
                        type: BIGINT
                        remarks: "FK → config.tipi_indirizzi(id). Sostituisce ddt_indirizzi.tipo_indirizzo (string)."
                  - column:
                        name: snapshot
                        type: JSONB
                        defaultValueComputed: "'{}'::jsonb"
                        remarks: "Snapshot completo dell'indirizzo al momento dell'emissione."
                        constraints:
                          nullable: false
                  - column: { name: data_insert, type: TIMESTAMPTZ, defaultValueComputed: now(), constraints: { nullable: false }, remarks: "Audit: data inserimento" }
                  - column: { name: user_insert, type: VARCHAR(80), defaultValueComputed: CURRENT_USER, constraints: { nullable: false }, remarks: "Audit: utente inserimento" }
                  - column: { name: data_update, type: TIMESTAMPTZ, defaultValueComputed: now(), constraints: { nullable: false }, remarks: "Audit: data aggiornamento" }
                  - column: { name: user_update, type: VARCHAR(80), defaultValueComputed: CURRENT_USER, remarks: "Audit: utente aggiornamento" }

        - addUniqueConstraint:
                  schemaName: acquisti
                  tableName: ddt_indirizzi
                  columnNames: ddt_id, tipo_indirizzo_id
                  constraintName: uq_ddt_indirizzi_uno_per_tipo

        - addForeignKeyConstraint:
                  baseTableSchemaName: acquisti
                  baseTableName: ddt_indirizzi
                  baseColumnNames: ddt_id
                  constraintName: fk_ddt_indirizzo_ordine
                  referencedTableSchemaName: acquisti
                  referencedTableName: ddt
                  referencedColumnNames: id
                  onDelete: CASCADE
                  onUpdate: CASCADE
        # 3) Vincolo FK + NOT NULL
        - addForeignKeyConstraint:
                  baseTableSchemaName: acquisti
                  baseTableName: ddt_indirizzi
                  baseColumnNames: tipo_indirizzo_id
                  constraintName: fk_ddt_indirizzo_tipo
                  referencedTableSchemaName: config
                  referencedTableName: tipi_indirizzi
                  referencedColumnNames: id
                  onUpdate: CASCADE
                  onDelete: NO ACTION
        - addNotNullConstraint:
                  schemaName: acquisti
                  tableName: ddt_indirizzi
                  columnName: tipo_indirizzo_id
                  constraintName: ddt_indirizzo_tipo_id_not_null         

        - createIndex:
                  schemaName: acquisti
                  tableName: ddt_indirizzi
                  indexName: ix_ddt_indirizzo_ordine
                  columns:
                  - column: { name: ddt_id }
          
        - sql:
                 sql: |
                  COMMENT ON CONSTRAINT fk_ddt_indirizzo_ordine ON acquisti.ddt_indirizzi IS 'FK → acquisti.ddt(id)';
                  COMMENT ON CONSTRAINT fk_ddt_indirizzo_tipo ON acquisti.ddt_indirizzi IS 'FK → anagrafiche.indirizzi(id)';


# Metto un  tag fine modifiche
  - changeSet:
      id: 20250917-90-create_acquisti_ddt_indirizzi
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250917-02-create_acquisti_ddt_indirizzi