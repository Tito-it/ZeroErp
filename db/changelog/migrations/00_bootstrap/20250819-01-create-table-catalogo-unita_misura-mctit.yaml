databaseChangeLog:

  - changeSet:
      id: 20250819-01-create-table-catalogo-unita_misura
      author: mctit
      
      runOnChange: true
      validCheckSums:
      changes:
        - ANY 
        - createSequence:
            catalogName: default
            schemaName: catalogo
            sequenceName: unita_misura_id_seq
            startValue: 1
            incrementBy: 1
            minValue: 1

        # 1) Tabella
        - createTable:
            schemaName: catalogo
            tableName: unita_misura
            remarks: "Unità di misura standard (interna + descrizione stampa)"
            columns:
              - column:
                  name: id
                  type: INTEGER
                  defaultValueComputed: "nextval('catalogo.unita_misura_id_seq'::regclass)"
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_unita_misura
                    nullable: false
              - column:
                  name: codice
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: descrizione
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: descrizione_fattura
                  type: VARCHAR(100)
              - column:
                  name: attivo
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: user_insert
                  type: VARCHAR(30)
                  defaultValueComputed: CURRENT_USER
                  constraints:
                    nullable: false
              - column:
                  name: user_update
                  type: VARCHAR(30)
                  defaultValueComputed: CURRENT_USER
              - column:
                  name: data_insert
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: data_update
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false

        # 2) Vincoli, indici e trigger
        - addUniqueConstraint:
            schemaName: catalogo
            tableName: unita_misura
            columnNames: codice
            constraintName: uq_unita_misura_codice

        # Indice case-insensitive su codice (espressione)
        - sql:
            splitStatements: false
            sql: |
              CREATE INDEX IF NOT EXISTS ix_unita_misura_codice_upper
              ON catalogo.unita_misura (upper(codice));

        # Trigger audit per aggiornare user_update/data_update
        - sql:
            splitStatements: false
            sql: |
              CREATE OR REPLACE TRIGGER trg_upd_unita_misura_audit_data_user
                BEFORE UPDATE ON catalogo.unita_misura
                FOR EACH ROW
                EXECUTE FUNCTION script.trgfn_upd_audit_data_user_generic();

        # 3) Commenti tabella, colonne, constraint, indice e trigger
        - sql:
            splitStatements: false
            sql: |
              COMMENT ON TABLE catalogo.unita_misura
                IS 'Unità di misura standard (interna + descrizione stampa)';
              COMMENT ON COLUMN catalogo.unita_misura.id
                IS 'Id.UdM (sequence catalogo.unita_misura_id_seq)';
              COMMENT ON COLUMN catalogo.unita_misura.codice
                IS 'Codice interno UdM (univoco)';
              COMMENT ON COLUMN catalogo.unita_misura.descrizione
                IS 'Descrizione estesa UdM';
              COMMENT ON COLUMN catalogo.unita_misura.descrizione_fattura
                IS 'Descrizione da esporre sui documenti di fatturazione';
              COMMENT ON COLUMN catalogo.unita_misura.attivo
                IS 'Flag attivo/non attivo';
              COMMENT ON COLUMN catalogo.unita_misura.user_insert
                IS 'Utente che ha effettuato l''inserimento';
              COMMENT ON COLUMN catalogo.unita_misura.user_update
                IS 'Utente ultima modifica';
              COMMENT ON COLUMN catalogo.unita_misura.data_insert
                IS 'Data inserimento';
              COMMENT ON COLUMN catalogo.unita_misura.data_update
                IS 'Data ultima modifica';
              COMMENT ON CONSTRAINT uq_unita_misura_codice ON catalogo.unita_misura
                IS 'Key: codice UdM univoco';
             
              COMMENT ON TRIGGER trg_upd_unita_misura_audit_data_user ON catalogo.unita_misura
                IS 'Aggiorna (audit) data_update e user_update al BEFORE UPDATE';
              COMMENT ON INDEX catalogo.ix_unita_misura_codice_upper
                IS 'Ricerca case-insensitive per codice (upper(codice))';

  # Tag opzionale a fine changeset (come nel tuo esempio)
  - changeSet:
      id: 20250819-90-tag-catalogo-unita_misura
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250819-01-create-table-catalogo-unita_misura
