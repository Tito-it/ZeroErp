databaseChangeLog:
# 2.a) Partizione ACQUISTI: note_ordini (crea se parent c'è; FKs solo se esistono le tabelle)
  - changeSet:
      id: 20250916-21-1-acquisti-note-ordini
      author: mctit
      preConditions:
        - onFail: MARK_RAN
        - tableExists: { schemaName: acquisti, tableName: note }
        - not:
            - tableExists: { schemaName: acquisti, tableName: note_ordini }
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE TABLE acquisti.note_ordini
              PARTITION OF acquisti.note FOR VALUES IN ('ORDINE');
              COMMENT ON TABLE acquisti.note_ordini
                IS 'Partizione note per ordini di acquisto.';
        - preConditions:
            - onFail: CONTINUE
            - tableExists: { schemaName: acquisti, tableName: ordini }
          changes:
            - addForeignKeyConstraint:
                baseTableSchemaName: acquisti
                baseTableName: note_ordini
                baseColumnNames: target_id
                referencedTableSchemaName: acquisti
                referencedTableName: ordini
                referencedColumnNames: id
                constraintName: fk_acq_ordini_note_testata
                onUpdate: CASCADE
                onDelete: CASCADE
        - preConditions:
            - onFail: CONTINUE
            - tableExists: { schemaName: acquisti, tableName: ordini_righe }
          changes:
            - addForeignKeyConstraint:
                baseTableSchemaName: acquisti
                baseTableName: note_ordini
                baseColumnNames: target_riga_id
                referencedTableSchemaName: acquisti
                referencedTableName: ordini_righe
                referencedColumnNames: id
                constraintName: fk_acq_ordini_note_riga
                onUpdate: CASCADE
                onDelete: CASCADE
        - sql:
            splitStatements: false
            sql: |
              ALTER TABLE acquisti.note_ordini
              ADD CONSTRAINT chk_acq_ordini_note_anchor
              CHECK (
                (anchor_tipo = 'DOCUMENTO' AND target_riga_id IS NULL AND posizione IN ('HEADER','FOOTER','SEZIONE'))
                OR
                (anchor_tipo = 'RIGA'      AND target_riga_id IS NOT NULL AND posizione IN ('BEFORE','AFTER'))
              );
              COMMENT ON CONSTRAINT chk_acq_ordini_note_anchor ON acquisti.note_ordini
                IS 'Coerenza tra anchor_tipo, riga e posizione (ordini acquisto).';
        - createIndex:
            schemaName: acquisti
            tableName: note_ordini
            indexName: ix_acq_ordini_note_render
            columns:
              - column: { name: target_id }
              - column: { name: anchor_tipo }
              - column: { name: target_riga_id }
              - column: { name: posizione }
              - column: { name: seq }

# Metto un  tag fine modifiche
  - changeSet:
      id: 20250916-91-1-acquisti-note-ordini
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250916-21-1-acquisti-note-ordini