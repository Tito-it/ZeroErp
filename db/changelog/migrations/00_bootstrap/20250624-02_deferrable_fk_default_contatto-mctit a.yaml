databaseChangeLog:
  
  # 
  - changeSet:
      id: 20250624-02-deferrable-fk-default-contatto
      author: mctit
      changes:
        # 1) Drop del vecchio vincolo FK
        - dropForeignKeyConstraint:
            baseTableName: soggetti
            baseTableSchemaName: anagrafiche
            constraintName: fk_contatti_anagrafiche

        # 2) Aggiunta del vincolo FK deferrable
        - addForeignKeyConstraint:
            constraintName: fk_contatti_anagrafiche
            baseTableName: soggetti
            baseTableSchemaName: anagrafiche
            baseColumnNames: default_contatto_id
            referencedTableName: contatti
            referencedTableSchemaName: anagrafiche
            referencedColumnNames: id
            onDelete: RESTRICT
            onUpdate: NO ACTION
            deferrable: true
            initiallyDeferred: true

  # Tag di fine modifica
  - changeSet:
      id: 20250624-90-fn_get_messaggio
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250624-02-deferrable-fk-default-contatto