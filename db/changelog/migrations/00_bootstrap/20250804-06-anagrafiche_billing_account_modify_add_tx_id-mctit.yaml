databaseChangeLog:
  - changeSet:
      id: 220250804-06-anagrafiche_billing_account_modify_add_tx_id
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      preConditions:
        onFail: MARK_RAN     # se la colonna esiste, il changeSet viene saltato
        onError: CONTINUE
         #  Assicuro che NON esista ancora tx_id
        not:
          columnExists:
            schemaName: anagrafiche
            tableName: billing_account
            columnName: tx_id

      changes:
        # 1) Aggiunta della colonna tx_id se non esiste
        - addColumn:
            schemaName: anagrafiche
            tableName: billing_account
            columns:
              - column:
                  name: tx_id
                  type: uuid
                  constraints:
                    nullable: true
                  remarks: "Id transazione"  
        # 1) Aggiunta della colonna tx_id se non esiste
        - addColumn:
            schemaName: anagrafiche
            tableName: billing_account
            columns:
              - column:
                  name: storicizza
                  type: BOOLEAN
                  defaultValue: true
                  remarks: "Storicizza se true, non storicizza se false"
  
      
  - changeSet:
      id: 20250804-90-anagrafiche_billing_account_modify_add_tx_id
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250804-06-anagrafiche_billing_account_modify_add_tx_id