databaseChangeLog:
  - changeSet:
      id: 20250706-01-createtable_transaction_ids
      author: mctit
      comments: "Crea la tabella dbops.transaction_ids (serve per generare un unico id di transazione da utilizzare in tutte le tabelle che hanno la colonna tx_id)"
      
      preConditions:
        onFail: MARK_RAN
        onError: MARK_RAN
        preConditions:
          - not:
              tableExists:
                schemaName: dbops
                tableName: transaction_ids
      
      changes:
        - createTable:
            schemaName: dbops
            tableName: transaction_ids
            remarks: "Tabella dei transaction_ids per identificare una stessa transazione attraverso tx_id"
            
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_insert
                  type: TEXT
                  defaultValueComputed: current_user
                  constraints:
                    nullable: false
              - column:
                  name: data_insert
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: user_update
                  type: TEXT
                  constraints:
                    nullable: true
              - column:
                  name: data_update
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: true
              - column:
                  name: generating_function
                  type: TEXT
                  constraints:
                    nullable: true
              - column:
                  name: session_info
                  type: JSONB
                  defaultValueComputed: "'{}'::jsonb"
                  constraints:
                    nullable: false           

  - changeSet:
      id: 20250706-02-add-trigger-transaction-ids-audit
      author: mctit
      comments: "Aggiunge il trigger trg_upd_overrides_audit_data_user su dbops.transaction_ids"
      changes:
        - sql:
            splitStatements: false
            sql: |
              -- Rimuove eventuale trigger esistente
              DROP TRIGGER IF EXISTS trg_upd_overrides_audit_data_user ON dbops.transaction_ids;
              
              -- Crea trigger per aggiornare i campi audit usando la funzione generica
              CREATE TRIGGER trg_upd_overrides_audit_data_user
                BEFORE UPDATE ON dbops.transaction_ids
                FOR EACH ROW
                EXECUTE FUNCTION script.trgfn_upd_audit_data_user_generic();
  
  - changeSet:
      id: 20250706-90-createtable_transaction_ids
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250706-01-createtable_transaction_ids