databaseChangeLog:
  - changeSet:
      id: 20250817-19-stati_cliente-rename-codint-to-codice_interno
      author: mctit
      context: ddl
      runOnChange: true
      failOnError: true

      preConditions:
        - onFail: HALT
        - onError: HALT
        - and:
            - tableExists:
                schemaName: config
                tableName: stati_cliente
            - columnExists:
                schemaName: config
                tableName: stati_cliente
                columnName: cod_int_stato_cliente
            - not:
                - columnExists:
                    schemaName: config
                    tableName: stati_cliente
                    columnName: codice_interno

      changes:
        # 1) rename colonna
        - renameColumn:
            schemaName: config
            tableName: stati_cliente
            oldColumnName: cod_int_stato_cliente
            newColumnName: codice_interno

        # 2) rename vincolo UNIQUE se presente (storico: uq_stati_cli_cod_unq)
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_constraint c
                  JOIN pg_class t ON t.oid = c.conrelid
                  JOIN pg_namespace n ON n.oid = t.relnamespace
                  WHERE c.contype = 'u'
                    AND n.nspname = 'config'
                    AND t.relname = 'stati_cliente'
                    AND c.conname = 'uq_stati_cli_cod_unq'
                ) THEN
                  EXECUTE 'ALTER TABLE config.stati_cliente RENAME CONSTRAINT uq_stati_cli_cod_unq TO uq_stati_cli_codice_interno';
                END IF;
              END$$;

        # 3) rename indice standalone se presente (storico: uq_stati_cli_cod_unq)
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_class i
                  JOIN pg_namespace n ON n.oid = i.relnamespace
                  WHERE i.relkind IN ('i','I')
                    AND n.nspname = 'config'
                    AND i.relname = 'uq_stati_cli_cod_unq'
                ) THEN
                  EXECUTE 'ALTER INDEX IF EXISTS config.uq_stati_cli_cod_unq RENAME TO uq_stati_cli_codice_interno';
                END IF;
              END$$;

        
      rollback:
        # ripristino colonna
        - renameColumn:
            schemaName: config
            tableName: stati_cliente
            oldColumnName: codice_interno
            newColumnName: cod_int_stato_cliente

        # ripristino vincolo UNIQUE se rinominato
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_constraint c
                  JOIN pg_class t ON t.oid = c.conrelid
                  JOIN pg_namespace n ON n.oid = t.relnamespace
                  WHERE c.contype = 'u'
                    AND n.nspname = 'config'
                    AND t.relname = 'stati_cliente'
                    AND c.conname = 'uq_stati_cli_codice_interno'
                ) THEN
                  EXECUTE 'ALTER TABLE config.stati_cliente RENAME CONSTRAINT uq_stati_cli_codice_interno TO uq_stati_cli_cod_unq';
                END IF;
              END$$;

        # ripristino indice se rinominato
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_class i
                  JOIN pg_namespace n ON n.oid = i.relnamespace
                  WHERE i.relkind IN ('i','I')
                    AND n.nspname = 'config'
                    AND i.relname = 'uq_stati_cli_codice_interno'
                ) THEN
                  EXECUTE 'ALTER INDEX IF EXISTS config.uq_stati_cli_codice_interno RENAME TO uq_stati_cli_cod_unq';
                END IF;
              END$$;



  - changeSet:
      id: 20250817-90-stati_cliente-rename-codint-to-codice_interno
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250817-19-stati_cliente-rename-codint-to-codice_interno