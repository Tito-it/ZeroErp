databaseChangeLog:
  - changeSet:
      id: 20250817-24-codici_postali-rename-codice_postale-to-codice
      author: mctit
      context: ddl
      runOnChange: true
      failOnError: true

      preConditions:
        - onFail: HALT
        - onError: HALT
        - and:
            - tableExists:
                schemaName: config
                tableName: codici_postali
            - columnExists:
                schemaName: config
                tableName: codici_postali
                columnName: codice_postale
            - not:
                - columnExists:
                    schemaName: config
                    tableName: codici_postali
                    columnName: codice

      changes:
        # 1) Rinomina colonna
        - renameColumn:
            schemaName: config
            tableName: codici_postali
            oldColumnName: codice_postale
            newColumnName: codice

        # 2) (Opz.) Rinomina indice storico, se presente
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_class i
                  JOIN pg_namespace n ON n.oid = i.relnamespace
                  WHERE i.relkind IN ('i','I')
                    AND n.nspname = 'config'
                    AND i.relname = 'ix_codici_postali_codice_postale'
                ) THEN
                  EXECUTE 'ALTER INDEX IF EXISTS config.ix_codici_postali_codice_postale RENAME TO ix_codici_postali_codice';
                END IF;
              END$$;

      rollback:
        - renameColumn:
            schemaName: config
            tableName: codici_postali
            oldColumnName: codice
            newColumnName: codice_postale

        # (Opz.) rollback indice, se rinominato
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_class i
                  JOIN pg_namespace n ON n.oid = i.relnamespace
                  WHERE i.relkind IN ('i','I')
                    AND n.nspname = 'config'
                    AND i.relname = 'ix_codici_postali_codice'
                ) THEN
                  EXECUTE 'ALTER INDEX IF EXISTS config.ix_codici_postali_codice RENAME TO ix_codici_postali_codice_postale';
                END IF;
              END$$;

  - changeSet:
      id: 20250817-90-codici_postali-rename-codice_postale-to-codice
      author: mctit
      changes:
        - tagDatabase:
            tag: 220250817-24-codici_postali-rename-codice_postale-to-codice