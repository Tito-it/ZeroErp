databaseChangeLog:

  - changeSet:
      id: 20250601-01-rename-via_id-stradario_generale_id
      author: mctit
      changes:
        # 1) Rimuovo il vincolo di unique esistente (comune_id, via_id, codice_postale_id)
        - dropUniqueConstraint:
            schemaName: config
            tableName: stradario
            constraintName: uq_stradario_comune_via_cp

        # 2) Rimuovo il vincolo di foreign key esistente su via_id
        - dropForeignKeyConstraint:
            baseTableSchemaName: config
            baseTableName: stradario
            constraintName: fk_stradario_via_id

        # 3) Rimuovo l’indice esistente su via_id
        - dropIndex:
            schemaName: config
            tableName: stradario
            indexName: ix_stradario_via_id

        # 4) Rinomino la colonna via_id in stradario_generale_id
        - renameColumn:
            schemaName: config
            tableName: stradario
            oldColumnName: via_id
            newColumnName: stradario_generale_id
            columnDataType: integer

        # 5) Ricreo il vincolo unique con la nuova colonna (comune_id, stradario_generale_id, codice_postale_id)
        - addUniqueConstraint:
            schemaName: config
            tableName: stradario
            constraintName: uq_stradario_comune_stradario_gen_cp
            columnNames: comune_id,stradario_generale_id,codice_postale_id

        # 6) Ricreo l’indice sul nuovo nome di colonna
        - createIndex:
            schemaName: config
            tableName: stradario
            indexName: ix_stradario_stradario_generale_id
            columns:
              - column:
                  name: stradario_generale_id

        # 7) Ricreo il vincolo di foreign key sulla nuova colonna
        - addForeignKeyConstraint:
            baseTableSchemaName: config
            baseTableName: stradario
            baseColumnNames: stradario_generale_id
            referencedTableSchemaName: config
            referencedTableName: stradario_generale
            referencedColumnNames: id
            constraintName: fk_stradario_stradario_generale_id
            onUpdate: CASCADE
            onDelete: RESTRICT

 # 3) Metto un altro tag subito dopo aver ricreato il vincolo
  - changeSet:
      id: 20250601-02-rename-via_id-stradario_generale_id
      author: mctit
      changes:
        - tagDatabase:
            tag: rename-via_id-stradario_generale_id