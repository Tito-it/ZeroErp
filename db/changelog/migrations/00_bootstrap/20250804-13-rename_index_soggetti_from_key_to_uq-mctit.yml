databaseChangeLog:
  - changeSet:
      id: 20250804-13-rename_index_soggetti_from_key_to_uq
      author: mctit
      runOnChange: true
      validCheckSums: 
        - ANY
      comments: "Rinomina l'indice anagrafiche.soggetti_key in anagrafiche.soggetti_uq_codice_soggetto"
      preConditions:
        onFail: MARK_RAN     # se la colonna esiste, il changeSet viene saltato
        onError: CONTINUE
         #  Assicuro che NON esista già la tabella clienti
        not:
          indexExists:
            schemaName: anagrafiche
            tableName: soggetti
            indexName: uq_soggetto_idstato_id_fiscale_univoco
            
      changes:
        
        sql:
          splitStatements: false  
          sql: |
                ALTER TABLE anagrafiche.soggetti
                  RENAME CONSTRAINT key_soggetto_idstato_id_fiscale_univoco
                  TO uq_soggetto_idstato_id_fiscale_univoco;

                -- Rinomina il vincolo UNIQUE su (codice_soggetto)
                ALTER TABLE anagrafiche.soggetti
                  RENAME CONSTRAINT key_soggetto_soggetto_codice
                  TO uq_soggetto_soggetto_codice;

 # Metto un  tag fine modifiche
  - changeSet:
        id: 20250804-90-rename_index_soggetti_from_key_to_uq
        author: mctit
        changes:
          - tagDatabase:
              tag: 20250804-13-rename_index_soggetti_from_key_to_uq


  - changeSet:
      id: 20250804-03-set-storicizza-default-true
      author: mctit
      comments: "Imposta il valore di default di storicizza su TRUE in anagrafiche.soggetti"
      preConditions:
        onFail: HALT
        onError: CONTINUE
        columnExists:
            schemaName: anagrafiche
            tableName: soggetti
            columnName: storicizza
      changes:
        sql:
          splitStatements: false  
          sql: |
                  ALTER TABLE anagrafiche.soggetti
                    ALTER COLUMN storicizza SET DEFAULT true;
  - changeSet:
      id: 20250804-90-set-storicizza-default-true
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250804-03-set-storicizza-default-true
