databaseChangeLog:
  - changeSet:
      id: 20250806-01-config_sistema_codici_modify_add_tx_id
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      preConditions:
        onFail: MARK_RAN     # se la colonna esiste, il changeSet viene saltato
        onError: CONTINUE
         #  Assicuro che NON esista ancora tx_id
        not:
          columnExists:
            schemaName: config
            tableName: sistema_codici
            columnName: tx_id

      changes:
        # 1) Aggiunta della colonna tx_id se non esiste
        - addColumn:
            schemaName: config
            tableName: sistema_codici
            columns:
              - column:
                  name: tx_id
                  type: uuid
                  constraints:
                    nullable: true
                  remarks: "Id transazione"  
       
  - changeSet:
      id: 20250806-90-config_sistema_codici_modify_add_tx_id
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250806-01-config_sistema_codici_modify_add_tx_id