databaseChangeLog:
 
  # -------------------------------------------------------------------
  # 1) Rimuove FK, indici, vincoli e colonne catastali e soggetto_ruolo_id
  # -------------------------------------------------------------------
  - changeSet:
      id: 20250803-13A-refactor-istanze_utilities
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      comments: >
        Refactor della tabella istanze_utilities:
        - sostituisce soggetto_ruolo_id con soggetto_id UUID
        - rimuove i campi catastali
        - aggiunge indirizzo_dettaglio_id FK NOT NULL
        - aggiunge colonna tx_id
        - aggiorna vincoli, indici e commenti
      preConditions:
        onFail: MARK_RAN  # se la tabella non esiste, il changeSet viene saltato
        onError: CONTINUE
      
          # Assicuro che esista la tabella istanze_utilities
        columnExists:
            schemaName: anagrafiche
            tableName: istanze_utilities
            columnName: account_code

      changes:
        # 1.1) Rimuove FK esistente su soggetto_ruolo_id
        - dropForeignKeyConstraint:
            baseTableSchemaName: anagrafiche
            baseTableName: istanze_utilities
            constraintName: fk_soggetti_ruoli_anagrafiche

        # 1.2) Rimuove indice su soggetto_ruolo_id
        - dropIndex:
            schemaName: anagrafiche
            tableName: istanze_utilities
            indexName: ix_istanze_utilities_soggetto_ruolo_id
            ifExists: true

        # 1.3) Rimuove unique e check legati ai campi esistenti
        
        - sql:
            comment: "Rimuove vincoli univoci e check esistenti"
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE anagrafiche.istanze_utilities
                DROP CONSTRAINT IF EXISTS uq_istanze_utilities_account_code,
                DROP CONSTRAINT IF EXISTS uq_istanze_utilities_codice_istanza,
                DROP CONSTRAINT IF EXISTS chk_istanze_utilities_fittizia,
                DROP CONSTRAINT IF EXISTS chk_istanza_utilities_prop_inquilino,
                DROP CONSTRAINT IF EXISTS chk_istanza_utilities_imm_rurale;
        
        # 1.4) Rimuove colonne catastali spostate
        - dropColumn:
            schemaName: anagrafiche
            tableName: istanze_utilities
            columnName: destinazione_immobile
        - dropColumn:
            schemaName: anagrafiche
            tableName: istanze_utilities
            columnName: num_concessione
        - dropColumn:
            schemaName: anagrafiche
            tableName: istanze_utilities
            columnName: data_concessione
        - dropColumn:
            schemaName: anagrafiche
            tableName: istanze_utilities
            columnName: sezione_catastale
        - dropColumn:
            schemaName: anagrafiche
            tableName: istanze_utilities
            columnName: foglio_catastale
        - dropColumn:
            schemaName: anagrafiche
            tableName: istanze_utilities
            columnName: particella
        - dropColumn:
            schemaName: anagrafiche
            tableName: istanze_utilities
            columnName: subalterno
        - dropColumn:
            schemaName: anagrafiche
            tableName: istanze_utilities
            columnName: anno_protocollo
        - dropColumn:
            schemaName: anagrafiche
            tableName: istanze_utilities
            columnName: superficie
        - dropColumn:
            schemaName: anagrafiche
            tableName: istanze_utilities
            columnName: immobile_rurale
        - dropColumn:
            schemaName: anagrafiche
            tableName: istanze_utilities
            columnName: tipo_accatastamento
        - dropColumn:
            schemaName: anagrafiche
            tableName: istanze_utilities
            columnName: categoria_catastale
        - dropColumn:
            schemaName: anagrafiche
            tableName: istanze_utilities
            columnName: classe_catastale
        - dropColumn:
            schemaName: anagrafiche
            tableName: istanze_utilities
            columnName: rendita_catastale
        - dropColumn:
            schemaName: anagrafiche
            tableName: istanze_utilities
            columnName: consistenza

        # 1.5) Rimuove soggetto_ruolo_id e la sua colonna
        - dropColumn:
            schemaName: anagrafiche
            tableName: istanze_utilities
            columnName: soggetto_ruolo_id
        - dropColumn:
            schemaName: anagrafiche
            tableName: istanze_utilities
            columnName: account_code    

        # 1.6) Aggiunge nuova colonna soggetto_id UUID NOT NULL
        - addColumn:
            schemaName: anagrafiche
            tableName: istanze_utilities
            columns:
              - column:
                  name: soggetto_id
                  type: UUID
                  constraints:
                    nullable: false
                  remarks: "Riferimento al soggetto (anagrafiche.soggetti.id)"

        # 1.7) Aggiunge colonna indirizzo_dettaglio_id INTEGER NOT NULL
        - addColumn:
            schemaName: anagrafiche
            tableName: istanze_utilities
            columns:
              - column:
                  name: indirizzo_dettaglio_id
                  type: INTEGER
                  constraints:
                    nullable: false
                  remarks: "FK a anagrafiche.indirizzi_dettaglio(id)"

        # 1.8) Aggiunge colonna tx_id UUID
        - addColumn:
            schemaName: anagrafiche
            tableName: istanze_utilities
            columns:
              - column:
                  name: tx_id
                  type: UUID
                  remarks: "UUID di transazione"

        # 1.9) Ricrea gli indici e vincoli
        - createIndex:
            schemaName: anagrafiche
            tableName: istanze_utilities
            indexName: ix_istanze_utilities_soggetto_id
            columns:
              - column:
                  name: soggetto_id
        
        - addForeignKeyConstraint:
            baseTableSchemaName: anagrafiche
            baseTableName: istanze_utilities
            baseColumnNames: soggetto_id
            referencedTableSchemaName: anagrafiche
            referencedTableName: soggetti
            referencedColumnNames: id
            constraintName: fk_istanze_utilities_soggetto
            onUpdate: CASCADE
            onDelete: RESTRICT

        - addForeignKeyConstraint:
            baseTableSchemaName: anagrafiche
            baseTableName: istanze_utilities
            baseColumnNames: indirizzo_dettaglio_id
            referencedTableSchemaName: anagrafiche
            referencedTableName: indirizzi_dettaglio
            referencedColumnNames: id
            constraintName: fk_istanze_utilities_indirizzo_dettaglio
            onUpdate: CASCADE
            onDelete: RESTRICT

        
        - addUniqueConstraint:
            schemaName: anagrafiche
            tableName: istanze_utilities
            columnNames: codice_istanza
            constraintName: uq_istanze_utilities_codice_istanza

        # 1.11) Ricrea check constraints
        - sql:
            comment: "Rimuove vincoli univoci e check esistenti"
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE anagrafiche.istanze_utilities
              ADD CONSTRAINT chk_istanze_utilities_prop_inquilino CHECK (proprietario_inquilino IN ('P','I'));

        
        # 1.12) Aggiorna commenti esistenti
        - sql:
            splitStatements: false
            stripComments: false
            comment: "Aggiorna commento tabella e colonne"
            sql: |
              COMMENT ON TABLE anagrafiche.istanze_utilities
                IS 'Istanza di attivazione di una utility per un soggetto';
              COMMENT ON COLUMN anagrafiche.istanze_utilities.soggetto_id
                IS 'Riferimento al soggetto (anagrafiche.soggetti.id)';
              COMMENT ON COLUMN anagrafiche.istanze_utilities.indirizzo_dettaglio_id
                IS 'Riferimento a anagrafiche.indirizzi_dettaglio(id)';
              COMMENT ON COLUMN anagrafiche.istanze_utilities.tx_id
                IS 'UUID di transazione per audit e integrazione';

  - changeSet:
      id: 20250803-13B-refactor-istanze_utilities
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      comments: "Rende opzionale la colonna indirizzo_dettaglio_id in istanze_utilities"
      preConditions:
        onFail: MARK_RAN
        onError: CONTINUE
        columnExists:
            schemaName: anagrafiche
            tableName: istanze_utilities
            columnName: indirizzo_dettaglio_id
      changes:
        - dropNotNullConstraint:
            schemaName: anagrafiche
            tableName: istanze_utilities
            columnName: indirizzo_dettaglio_id
            columnDataType: INTEGER

  - changeSet:
      id: 20250803-13C-refactor-istanze_utilities
      author: mctit
      comments: "Aggiunge vincolo: se fittizia = false, allora indirizzo_dettaglio_id non può essere NULL"
      preConditions:
        onFail: HALT
        onError: CONTINUE
        tableExists:
            schemaName: anagrafiche
            tableName: istanze_utilities
      changes:
        - sql:
            comment: "Aggiunge vincolo: se fittizia = false, allora indirizzo_dettaglio_id non può essere NULL"
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE anagrafiche.istanze_utilities
                ADD CONSTRAINT chk_istanza_fittizia_indirizzo
                CHECK (
                  fittizia = true OR indirizzo_dettaglio_id IS NOT NULL
                );
  - changeSet:
      id: 20250803-13E-refactor-istanze_utilities
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      comments: "Aggiunge colonna parent_istanza_id per gestire istanze figlie"
      preConditions:
        onFail: MARK_RAN
        onError: CONTINUE
        not:
          # Controlla se la colonna parent_istanza_id esiste già
          columnExists:
            schemaName: anagrafiche
            tableName: istanze_utilities
            columnName: parent_istanza_id
      changes:      
        - addColumn:
            schemaName: anagrafiche
            tableName: istanze_utilities
            columns:
              - column:
                  name: parent_istanza_id
                  type: INTEGER
                  constraints:
                    nullable: false
                  remarks: "FK a anagrafiche.istanze_utilities(id)"
        - addForeignKeyConstraint:
            baseTableSchemaName: anagrafiche
            baseTableName: istanze_utilities
            baseColumnNames: parent_istanza_id
            referencedTableSchemaName: anagrafiche
            referencedTableName: istanze_utilities
            referencedColumnNames: id
            constraintName: fk_istanze_utilities_parent_istanza
            onUpdate: CASCADE
            onDelete: SET NULL


  - changeSet:
      id: 20250803-90-refactor-istanze_utilities
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250803-13-refactor-istanze_utilities