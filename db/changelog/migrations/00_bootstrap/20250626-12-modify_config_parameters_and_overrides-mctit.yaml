databaseChangeLog:
  - changeSet:
      id: 20250626-12-modify_config_parameters_and_overrides
      author: mctit
      
      databaseChangeLog:
  - changeSet:
      id: 20250701-01-modify_parameter_overrides
      author: mctit

      changes:
        # 1. Rimuovo la FK e l’unico vincolo esistenti
        - dropForeignKeyConstraint:
            baseTableSchemaName: config
            baseTableName: parameter_overrides
            constraintName: fk_overrides_parameter
        - dropUniqueConstraint:
            schemaName: config
            tableName: parameter_overrides
            constraintName: uq_overrides_param_scope

        # 2. Elimino le colonne scope_type e scope_id
        - dropColumn:
            schemaName: config
            tableName: parameter_overrides
            columnName: scope_type
        - dropColumn:
            schemaName: config
            tableName: parameter_overrides
            columnName: scope_id

        # 3. Aggiungo le colonne per il nuovo “full‐scope”
        - addColumn:
            schemaName: config
            tableName: parameter_overrides
            columns:
              - column:
                  name: tenant_id
                  type: INTEGER
                  remarks: "override per tenant"
              - column:
                  name: user_id
                  type: INTEGER
                  remarks: "override per user"
              - column:
                  name: session_key
                  type: TEXT
                  remarks: "override per sessione"
              - column:
                  name: function_name
                  type: TEXT
                  remarks: "override per funzione"

        # 4. Ricreo FK e vincolo unico “full‐scope”
        - addForeignKeyConstraint:
            baseTableSchemaName: config
            baseTableName: parameter_overrides
            baseColumnNames: parameter_id
            referencedTableSchemaName: config
            referencedTableName: parameters
            referencedColumnNames: id
            constraintName: fk_overrides_parameter
            onDelete: RESTRICT
            onUpdate: CASCADE

        - addUniqueConstraint:
            schemaName: config
            tableName: parameter_overrides
            columnNames: parameter_id,tenant_id,user_id,session_key,function_name
            constraintName: uq_overrides_full_scope

        # 5. Commento sulla nuova FK
        - sql:
            dbms: postgresql
            sql: |
              COMMENT ON CONSTRAINT fk_overrides_parameter ON config.parameter_overrides
                IS 'FK che collega override al parametro di base in config.parameters';
        


  # Tag this changeset for future reference
  - changeSet:
      id: 20250626-90-modify_config_parameters_and_overrides
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250626-12-modify-config_parameters_and_overrides
