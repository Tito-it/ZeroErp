databaseChangeLog:
  - changeSet:
      id: 20250620-04-update-contatti-nullable-add-titolo-cortesia
      author: mctit
      changes:

        # 1. Rendi NULLABLE soggetto_ruolo_id
        - dropNotNullConstraint:
            tableName: contatti
            columnName: soggetto_ruolo_id
            schemaName: anagrafiche
            columnDataType: integer

        # 2. Rendi NULLABLE utility_id
        - dropNotNullConstraint:
            tableName: contatti
            columnName: utility_id
            schemaName: anagrafiche
            columnDataType: integer

        # 3. Aggiungi titolo_cortesia_id (nullable)
        - addColumn:
            tableName: contatti
            schemaName: anagrafiche
            columns:
              - column:
                  name: titolo_cortesia_id
                  type: integer
                  constraints:
                    nullable: true

        # 4. Aggiungi Foreign Key per titolo_cortesia_id
        - addForeignKeyConstraint:
            constraintName: fk_titoli_cortesia_config
            baseTableName: contatti
            baseTableSchemaName: anagrafiche
            baseColumnNames: titolo_cortesia_id
            referencedTableName: titoli_cortesia
            referencedTableSchemaName: config
            referencedColumnNames: id
            onDelete: RESTRICT
            onUpdate: CASCADE

        # 5. Commenta la colonna titolo_cortesia_id
        - sql:
            sql: |
              COMMENT ON COLUMN anagrafiche.contatti.titolo_cortesia_id IS 
              'Opzionale. Titolo di cortesia del nominativo del contatto (es. Sig., Dott., ecc.)';

        # 6. Aggiorna commenti per soggetto_ruolo_id e utility_id
        - sql:
            sql: |
              COMMENT ON COLUMN anagrafiche.contatti.soggetto_ruolo_id IS 
              'Opzionale. Riferimento alla specifica assegnazione ruolo del soggetto';
              COMMENT ON COLUMN anagrafiche.contatti.utility_id IS 
              'Opzionale. Riferimento al servizio/utility (config.utilities)';


# Metto un  tag fine modifiche
  - changeSet:
      id: 20250620-90-update-contatti-nullable-add-titolo-cortesia
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250620-04-update-contatti-nullable-add-titolo-cortesia