databaseChangeLog:
  - changeSet:
      id: 20250915-02-create_vendite_note_ordini_fixed
      author: mctit
      preConditions:
        - onFail: MARK_RAN
        - tableExists: { schemaName: vendite, tableName: note }           # parent
        - not:
            - tableExists: { schemaName: vendite, tableName: note_ordini }# child assente
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE TABLE vendite.note_ordini
              PARTITION OF vendite.note FOR VALUES IN ('ordine');
              COMMENT ON TABLE vendite.note_ordini
                IS 'Partizione note per ordini (FK forti verso testata/righe ordine).';

        # FK verso ordini / ordini_righe
        - addForeignKeyConstraint:
            baseTableSchemaName: vendite
            baseTableName: note_ordini
            baseColumnNames: target_id
            referencedTableSchemaName: vendite
            referencedTableName: ordini
            referencedColumnNames: id
            constraintName: fk_ordini_note_testata
            onUpdate: CASCADE
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableSchemaName: vendite
            baseTableName: note_ordini
            baseColumnNames: target_riga_id
            referencedTableSchemaName: vendite
            referencedTableName: ordini_righe
            referencedColumnNames: id
            constraintName: fk_ordini_note_riga
            onUpdate: CASCADE
            onDelete: CASCADE

        # Check coerenza ancoraggio
        - sql:
            splitStatements: false
            sql: |
              ALTER TABLE vendite.note_ordini
              ADD CONSTRAINT chk_ordini_note_anchor
              CHECK (
                (anchor_tipo = 'DOCUMENTO' AND target_riga_id IS NULL AND posizione IN ('HEADER','FOOTER','SEZIONE'))
                OR
                (anchor_tipo = 'RIGA'      AND target_riga_id IS NOT NULL AND posizione IN ('BEFORE','AFTER'))
              );
              COMMENT ON CONSTRAINT chk_ordini_note_anchor ON vendite.note_ordini
                IS 'Regole di coerenza tra anchor_tipo, riga e posizione per ordini.';

        # Indice per rendering
        - createIndex:
            schemaName: vendite
            tableName: note_ordini
            indexName: ix_ordini_note_render
            columns:
              - column: { name: target_id }
              - column: { name: anchor_tipo }
              - column: { name: target_riga_id }
              - column: { name: posizione }
              - column: { name: seq }

  - changeSet:
      id: 20250915-03-tag-note-ordini
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250915-02-create_vendite_note_ordini_fixed
