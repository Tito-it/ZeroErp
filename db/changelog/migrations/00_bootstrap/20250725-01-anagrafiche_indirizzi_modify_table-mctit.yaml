databaseChangeLog:
  - changeSet:
      id: 20250725-01-anagrafiche_indirizzi_modify_table
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      preConditions:
        onFail: MARK_RAN     # se la colonna esiste, il changeSet viene saltato
        onError: CONTINUE
         #  Assicuro che NON esista ancora tx_id
        not:
          columnExists:
            schemaName: anagrafiche
            tableName: indirizzi
            columnName: tx_id
      changes:
        # 1) Aggiungi tx_id
        - addColumn:
            schemaName: anagrafiche
            tableName: indirizzi
            columns:
              - column:
                  name: tx_id
                  type: UUID
                  constraints:
                    nullable: true
                  remarks: "Id transazione"

        # 2) Rinomina modifica_storica → storicizza
        - renameColumn:
            schemaName: anagrafiche
            tableName: indirizzi
            oldColumnName: modifica_storica
            newColumnName: storicizza
            columnDataType: BOOLEAN

        - dropForeignKeyConstraint:
            baseTableSchemaName: storico
            baseTableName: indirizzi
            constraintName: fk_indirizzi_anagrafiche

            
        # Rinomina constraint PK
         #3) Drop della PK esistente
        - dropPrimaryKey:
            schemaName: anagrafiche
            tableName: indirizzi
            constraintName: pr_indirizzi_pk

        # 4) Aggiunta della PK con il nuovo nome
        - addPrimaryKey:
            schemaName: anagrafiche
            tableName: indirizzi
            columnNames: id
            constraintName: pk_indirizzi
        # 5) Ricreazione del FK su storico.indirizzi verso la nuova PK
        - addForeignKeyConstraint:
            constraintName: fk_indirizzi_anagrafiche
            baseTableSchemaName: storico
            baseTableName: indirizzi
            baseColumnNames: indirizzi_id
            referencedTableSchemaName: anagrafiche
            referencedTableName: indirizzi
            referencedColumnNames: id
            onUpdate: CASCADE
            
        - dropNotNullConstraint:
            schemaName: anagrafiche
            tableName: indirizzi
            columnName: comune_id
            columnDataType: integer

        - dropNotNullConstraint:
            schemaName: anagrafiche
            tableName: indirizzi
            columnName: codice_postale_id
            columnDataType: integer
           
  - changeSet:
      id: 20250725-90-anagrafiche_indirizzi_modify_table
      author: mctit
      changes:
        - tagDatabase:
            tag: 220250725-01-anagrafiche_indirizzi_modify_table