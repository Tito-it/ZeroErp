databaseChangeLog:


- changeSet:
    id: 20250829-02-migrazione_pk_da_nextval_a_identy_mantiene_la sequenza
    author: mctit
    runOnChange: true
    validCheckSums:
        - ANY
    preConditions:
      - dbms:
          type: postgresql
    changes:
      - sql:
          splitStatements: false
          stripComments: true
          sql: |
            DO $$
            DECLARE
              r record;
              seq_schema text;
              seq_name   text;
              seq_legacy text;
              legacy_last bigint;
              legacy_is_called boolean;
              max_id     bigint;
              desired_next bigint;
            BEGIN
              FOR r IN
                SELECT
                  n.nspname  AS schema_name,
                  c.relname  AS table_name,
                  a.attname  AS column_name,
                  (regexp_match(pg_get_expr(d.adbin, d.adrelid),
                   'nextval\(''([^'']+)''::regclass\)'))[1] AS seq_qualified
                FROM pg_attrdef d
                JOIN pg_class     c ON c.oid = d.adrelid
                JOIN pg_namespace n ON n.oid = c.relnamespace
                JOIN pg_attribute a ON a.attrelid = c.oid AND a.attnum = d.adnum
                JOIN information_schema.columns i
                  ON i.table_schema = n.nspname
                 AND i.table_name   = c.relname
                 AND i.column_name  = a.attname
                WHERE a.attname = 'id'                          -- solo colonna id
                  AND a.attnotnull                              -- NOT NULL
                  AND i.is_identity = 'NO'                      -- non già identity
                  AND pg_get_expr(d.adbin, d.adrelid) LIKE 'nextval(%'  -- usa nextval
                  AND c.relkind IN ('r','p')                    -- tabelle normali/parent partiz.
                  AND i.table_schema  in ('anagrafiche',   'catalogo', 'config', 'contabilita', 
                                          'dbops',    'maintenance', 'script',                   
                                          'vendite',   'storico')      -- schemi applicativi
                  --AND i.table_schema = 'config'
                  --AND i.table_name   = 'valute'
              LOOP
                IF position('.' in r.seq_qualified) > 0 THEN
                -- Qualifica schema/nome sequenza
                  seq_schema := split_part(r.seq_qualified, '.', 1);
                  seq_name   := split_part(r.seq_qualified, '.', 2);
                ELSE
                  -- nome non qualificato: assume lo schema della tabella
                  seq_schema := r.schema_name;
                  seq_name   := r.seq_qualified;
                END IF;

                -- 1) Lock tabella
                EXECUTE format('LOCK TABLE %I.%I IN ACCESS EXCLUSIVE MODE', r.schema_name, r.table_name);

                -- 2) Leggi stato corrente della VECCHIA sequenza
                EXECUTE format('SELECT last_value, is_called FROM %I.%I', seq_schema, seq_name)
                  INTO legacy_last, legacy_is_called;

                -- 3) Sgancia default nextval
                EXECUTE format('ALTER TABLE %I.%I ALTER COLUMN %I DROP DEFAULT',
                               r.schema_name, r.table_name, r.column_name);

                -- 4) Rinomina la vecchia sequenza per liberare il nome storico
                seq_legacy := seq_name || '_legacy_' || pg_backend_pid();
                EXECUTE format('ALTER SEQUENCE %I.%I RENAME TO %I', seq_schema, seq_name, seq_legacy);

                -- 5) Aggiungi IDENTITY BY DEFAULT riusando il nome originale
                EXECUTE format(
                  'ALTER TABLE %I.%I ALTER COLUMN %I ADD GENERATED BY DEFAULT AS IDENTITY (SEQUENCE NAME %I.%I)',
                  r.schema_name, r.table_name, r.column_name, seq_schema, seq_name
                );

                -- 6) Calcola il prossimo valore "giusto"
                --    - next derivato dalla vecchia seq: (legacy_last+1) se is_called, altrimenti legacy_last
                --    - confronta con MAX(id)+1 per evitare collisioni
                EXECUTE format('SELECT COALESCE(MAX(%I),0) FROM %I.%I', r.column_name, r.schema_name, r.table_name)
                  INTO max_id;
                desired_next := GREATEST(
                                  max_id + 1,
                                  CASE WHEN legacy_is_called THEN legacy_last + 1 ELSE legacy_last END
                                );

                -- 7) Imposta la NUOVA identity: setval(last = desired_next-1, is_called = true)
               EXECUTE format('SELECT setval(%L, %s, false)', seq_schema||'.'||seq_name, desired_next);

                -- 8) Drop sequenza legacy
                EXECUTE format('DROP SEQUENCE IF EXISTS %I.%I', seq_schema, seq_legacy);
              END LOOP;
            END$$;


- changeSet:
      id: 20250829-90-migrazione_pk_da_nextval_a_identy_mantiene_la sequenza
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250829-02-migrazione_pk_da_nextval_a_identy_mantiene_la sequenza