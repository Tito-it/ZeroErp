databaseChangeLog:
  - changeSet:
      id: 20250620-rename-contatti-ruoli-to-titoli-cortesia
      author: mctit
      changes:

        # 1. Drop FK da soggetti
        - dropForeignKeyConstraint:
            baseTableName: soggetti
            baseTableSchemaName: anagrafiche
            constraintName: fk_contatti_ruoli_config

        # 2. SQL: Rinomina tabella e sequenza
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              ALTER TABLE config.contatti_ruoli RENAME TO titoli_cortesia;
              ALTER SEQUENCE config.contatti_ruoli_id_seq RENAME TO titoli_cortesia_id_seq;

        # 3. SQL: Rinomina colonna in soggetti
        - sql:
            sql: ALTER TABLE anagrafiche.soggetti RENAME COLUMN contatto_ruolo_id TO titolo_cortesia_id;

        # 4. SQL: Aggiungi nuova FK coerente
        - sql:
            sql: |
              ALTER TABLE anagrafiche.soggetti
              ADD CONSTRAINT fk_titoli_cortesia_config
              FOREIGN KEY (titolo_cortesia_id)
              REFERENCES config.titoli_cortesia(id)
              ON UPDATE CASCADE
              ON DELETE RESTRICT;

        # 5. SQL: Rinomina trigger (opzionale)
        #- sql:
        #    sql: |
         #     ALTER TRIGGER trg_upd_contatti_ruoli_audit_data_user
         #     ON config.titoli_cortesia
          #    RENAME TO trg_upd_titoli_cortesia_audit_data_user;

        # 6. (opzionale) Aggiorna commento tabella
        - sql:
            sql: |
              COMMENT ON TABLE config.titoli_cortesia IS 'Titoli di cortesia per soggetti e contatti (es. Sig., Dott., Ing., ecc.)';

# Metto un  tag fine modifiche
  - changeSet:
      id: 20250620-90-rename-contatti-ruoli-to-titoli-cortesia
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250620-02-rename-contatti-ruoli-to-titoli-cortesia