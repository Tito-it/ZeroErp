databaseChangeLog:
  - changeSet:
      id: 20250917-08-vendite-preventivi-add-stato-doc-preventivo
      author: mctit
      preConditions:
        - onFail: MARK_RAN     # se la colonna esiste, il changeSet viene saltato
        - onError: CONTINUE
        - not:
            - columnExists:
                schemaName: vendite
                tableName: preventivi
                columnName: stato_doc_preventivo_id
      changes:
        - addColumn:
            schemaName: vendite
            tableName: preventivi
            columns:
              - column:
                  name: stato_doc_preventivo_id
                  type: BIGINT                  
                  constraints:
                    nullable: false
                  remarks: "Stato documento preventivo _id FK - stati_doc_preventivi BOZZA|EMESSO|ACCETTATO|RIFIUTATO|SCADUTO"

        - addForeignKeyConstraint:
            baseTableSchemaName: vendite
            baseTableName: preventivi
            baseColumnNames: stato_doc_preventivo_id
            constraintName: fk_v_preventivi_stato_ddt
            referencedTableSchemaName: config
            referencedTableName: stati_doc_preventivi
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: NO ACTION

        - dropColumn:
            schemaName: vendite
            tableName: preventivi
            columnName: stato
              
  - changeSet:
      id: 20250917-08a-vendite-preventivi-add-stato-doc-preventivo
      author: mctit
      preConditions:
        - onFail: MARK_RAN     # se la colonna esiste, il changeSet viene saltato
        - onError: CONTINUE
        - not:
            - columnExists:
                schemaName: vendite
                tableName: preventivi
                columnName: data
      changes:
        - addColumn:
            schemaName: vendite
            tableName: preventivi
            columns:
              - column: { name: data, type: DATE, defaultValueComputed: CURRENT_DATE, constraints: { nullable: false }, remarks: "Data preventivo" }

  - changeSet:
      id: 20250917-90-vendite-preventivi-add-stato-doc-preventivo
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250917-08-vendite-preventivi-add-stato-doc-preventivo