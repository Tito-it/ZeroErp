# Zero ERP — Vendite: fatture, migrazione da source_tipo → sorgente_tipo_id (FK)
# ------------------------------------------------------------
databaseChangeLog:
  - changeSet:
      id: 20250905-06-alter_vendite_fatture_source_to_fk
      author: mctit
      preConditions:
        - onFail: HALT
        - tableExists: { schemaName: vendite, tableName: fatture }
        - tableExists: { schemaName: config,  tableName: sorgenti }
      changes:
        # 1) Drop indice unico vecchio (source_tipo, source_id)
        - dropIndex:
            schemaName: vendite
            tableName: fatture
            indexName: uq_fatture_source
            # ignora se non esiste
            ifExists: true

        # 2) Add nuova colonna FK (se non esiste già)
        - addColumn:
            schemaName: vendite
            tableName: fatture
            columns:
              - column:
                  name: sorgente_tipo_id
                  type: BIGINT
                  remarks: "FK → config.sorgenti (ex source_tipo testuale)"

        # 3) Add FK constraint verso config.sorgenti
        - addForeignKeyConstraint:
            baseTableSchemaName: vendite
            baseTableName: fatture
            baseColumnNames: sorgente_tipo_id
            constraintName: fk_fatture_sorgente_tipo
            referencedTableSchemaName: config
            referencedTableName: sorgenti
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: NO ACTION

        # 4) Drop colonna obsoleta source_tipo (se presente)
        - dropColumn:
            schemaName: vendite
            tableName: fatture
            columnName: source_tipo
            ifExists: true

        # 5) Crea nuovo indice unico parziale per idempotenza
        - createIndex:
            schemaName: vendite
            tableName: fatture
            indexName: uq_fatture_source_fk
            unique: true
            columns:
              - column: { name: sorgente_tipo_id }
              - column: { name: source_id }
            where: "sorgente_tipo_id IS NOT NULL"
            remarks: "Idempotenza import testata (sorgente_tipo_id, source_id)"

        # 6) Commento sul vincolo FK
        - sql:
            splitStatements: false
            sql: |
              COMMENT ON CONSTRAINT fk_fatture_sorgente_tipo ON vendite.fatture
                IS 'FK → config.sorgenti (ex source_tipo testuale).';

             
                 

# Metto un  tag fine modifiche
  - changeSet:
      id: 20250905-90-alter_vendite_fatture_source_to_fk
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250905-06-alter_vendite_fatture_source_to_fk