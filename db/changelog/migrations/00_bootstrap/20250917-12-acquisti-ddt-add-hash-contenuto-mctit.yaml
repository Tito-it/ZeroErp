databaseChangeLog:
  - changeSet:
      id: 20250917-12-acquisti-ddt-add-hash-contenuto
      author: mctit
      preConditions:
        - onFail: MARK_RAN     # se la colonna esiste, il changeSet viene saltato
        - onError: CONTINUE
        - not:
            - columnExists:
                schemaName: acquisti
                tableName: ddt
                columnName: hash_contenuto
      changes:
        - addColumn:
            schemaName: acquisti
            tableName: ddt
            columns:
              - column: { name: hash_contenuto, type: VARCHAR(64), remarks: "SHA-256 hex del payload/record normalizzato" }
            
  - changeSet:
      id: 20250917-90-acquisti-ddt-add-hash-contenuto
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250917-12-acquisti-ddt-add-hash-contenuto