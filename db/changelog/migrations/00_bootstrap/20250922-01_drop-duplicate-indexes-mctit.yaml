databaseChangeLog:
# 1) Crea la sequenza per la PK
  - changeSet:
  
      id: 20250922-01_drop-duplicate-indexes
      author: mctit
      runOnChange: true
      validCheckSums: ["ANY"]  
      
      changes:
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
                  DROP INDEX IF EXISTS vendite.ix_preventivi_numero;  
                  DROP INDEX IF EXISTS acquisti.ix_ao_fornitore_stato_data;
                  DROP INDEX IF EXISTS anagrafiche.ix_fornitori_codice;
                  DROP INDEX IF EXISTS anagrafiche.ix_fornitori_soggetto_ruolo_id; 
                  DROP INDEX IF EXISTS vendite.ix_articolo_regole_fatturazione_articolo;
                  DROP INDEX IF EXISTS vendite.ix_fatture_r_iva_fattura;

  - changeSet:
      id: 20250922-90_drop-duplicate-indexes
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250922-01_drop-duplicate-indexes