      #        DO $$
      #        BEGIN
      #          IF EXISTS (
      #            SELECT 1 FROM information_schema.tables
      #            WHERE table_schema='vendite' AND table_name='fatture_righe'
      #          ) THEN
      #            -- Aggiunge la FK solo se esiste la tabella di destinazione
