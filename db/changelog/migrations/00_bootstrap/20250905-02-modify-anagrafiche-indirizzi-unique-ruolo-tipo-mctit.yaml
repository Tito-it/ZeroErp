databaseChangeLog:
  - changeSet:
      id: 20250905-02-modify-anagrafiche-indirizzi-unique-ruolo-tipo
      author: mctit
      changes:
        # Drop dei vincoli unici esistenti (indirizzo-dettaglio / indirizzo-libero)
        - dropUniqueConstraint:
            schemaName: anagrafiche
            tableName: indirizzi
            constraintName: uq_indirizzi_dettaglio_unique
        - dropUniqueConstraint:
            schemaName: anagrafiche
            tableName: indirizzi
            constraintName: uq_indirizzi_libero_unique

        # Nuovo vincolo unico: uno per (ruolo, tipo)
        - addUniqueConstraint:
            schemaName: anagrafiche
            tableName: indirizzi
            columnNames: soggetto_ruolo_id, tipo_indirizzo_id
            constraintName: uq_indirizzi_ruolo_tipo



# Metto un  tag fine modifiche
  - changeSet:
      id: 20250905-90-modify-anagrafiche-indirizzi-unique-ruolo-tipo
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250905-02-modify-anagrafiche-indirizzi-unique-ruolo-tipo
