databaseChangeLog:
  - changeSet:
      id: 20250830-09-create_vendite_note_parent
      author: mctit
      
      validCheckSums: [ANY]
      changes:
       
        # Creazione tabella già partizionata (PostgreSQL NON supporta ALTER ... PARTITION BY)
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              CREATE TABLE IF NOT EXISTS vendite.note (
                id               BIGINT GENERATED BY DEFAULT AS IDENTITY,
                target_tipo      VARCHAR(16)  NOT NULL,   -- chiave di partizione
                target_id        BIGINT       NOT NULL,   -- id testata
                target_riga_id   BIGINT,                  -- id riga (solo se anchor_tipo='RIGA')
                anchor_tipo      VARCHAR(12)  NOT NULL,   -- DOCUMENTO | RIGA
                posizione        VARCHAR(12)  NOT NULL,   -- HEADER | FOOTER | SEZIONE | BEFORE | AFTER
                seq              INTEGER      NOT NULL DEFAULT 10,
                testo            TEXT,
                testo_md         TEXT,
                stile            VARCHAR(16)  NOT NULL DEFAULT 'NORMALE',
                lingua           CHAR(5),
                visibile         BOOLEAN      NOT NULL DEFAULT true,
                solo_stampa      BOOLEAN      NOT NULL DEFAULT false,
                meta             JSONB        NOT NULL DEFAULT '{}',
                data_insert      TIMESTAMPTZ  NOT NULL DEFAULT now(),
                user_insert      VARCHAR(80)  NOT NULL DEFAULT CURRENT_USER,
                data_update      TIMESTAMPTZ  NOT NULL DEFAULT now(),
                user_update      VARCHAR(80)  DEFAULT CURRENT_USER,
                CONSTRAINT pk_note PRIMARY KEY (target_tipo, id),
                CONSTRAINT chk_note_target_tipo CHECK (target_tipo IN ('PREVENTIVO','CONTRATTO','FATTURA')),
                CONSTRAINT chk_note_anchor_tipo CHECK (anchor_tipo IN ('DOCUMENTO','RIGA')),
                CONSTRAINT chk_note_posizione  CHECK (posizione IN ('HEADER','FOOTER','SEZIONE','BEFORE','AFTER')),
                CONSTRAINT chk_note_seq_pos    CHECK (seq >= 0)
              )
              PARTITION BY LIST (target_tipo);

              COMMENT ON TABLE vendite.note
                IS 'Note testuali ancorabili al documento o alla riga; tabella padre partizionata per target_tipo.';
              COMMENT ON CONSTRAINT pk_note ON vendite.note
                IS 'PK composita (target_tipo, id) richiesta per tabella partizionata.';
              COMMENT ON CONSTRAINT chk_note_target_tipo ON vendite.note
                IS 'Valori ammessi: PREVENTIVO | CONTRATTO | FATTURA.';
              COMMENT ON CONSTRAINT chk_note_anchor_tipo ON vendite.note
                IS 'Valori ammessi: DOCUMENTO | RIGA.';
              COMMENT ON CONSTRAINT chk_note_posizione ON vendite.note
                IS 'Valori ammessi: HEADER | FOOTER | SEZIONE | BEFORE | AFTER.';
              COMMENT ON CONSTRAINT chk_note_seq_pos ON vendite.note
                IS 'seq obbligatoria e non negativa.';

        # Indice di rendering (indice partizionato sul parent; creerà gli indici sulle partizioni al momento della loro creazione/attach)
        #- sql:
        #    splitStatements: false
        #    sql: |
         #     CREATE INDEX IF NOT EXISTS ix_note_render_order
         #       ON vendite.note (target_tipo, target_id, anchor_tipo, posizione, seq);
        

        # Commenti su tabella/colonne/constraint
        - sql:
            splitStatements: false
            sql: |
              COMMENT ON TABLE vendite.note
                IS 'Note testuali ancorabili al documento o alla riga; tabella padre partizionata per target_tipo.';
              COMMENT ON CONSTRAINT pk_note ON vendite.note
                IS 'PK composita (target_tipo, id) richiesta per la tabella partizionata.';
              COMMENT ON CONSTRAINT chk_note_target_tipo ON vendite.note
                IS 'Valori ammessi per target_tipo.';
              COMMENT ON CONSTRAINT chk_note_anchor_tipo ON vendite.note
                IS 'Valori ammessi per anchor_tipo.';
              COMMENT ON CONSTRAINT chk_note_posizione ON vendite.note
                IS 'Valori ammessi per posizione.';
              COMMENT ON CONSTRAINT chk_note_seq_pos ON vendite.note
                IS 'seq obbligatoria e non negativa.';

        # Indice per il rendering/ordinamento (si materializza su ciascuna partizione)
        - createIndex:
            schemaName: vendite
            tableName: note
            indexName: ix_note_render_order
            columns:
              - column: { name: target_tipo }
              - column: { name: target_id }
              - column: { name: anchor_tipo }
              - column: { name: posizione }
              - column: { name: seq }

       
  
  - changeSet:
      id: 20250830-90-create_vendite_note_partizionata
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250830-09-create_vendite_note_partizionata