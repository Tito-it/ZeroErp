# ------------------------------------------------------------
# Zero ERP — Vista fallback conti per ruolo + funzione helper
# ------------------------------------------------------------
databaseChangeLog:

  # 1) VIEW: anagrafiche.vw_conti_bancari_per_ruolo
  - changeSet:
      id: 20250831-40-create-view-vw_conti_bancari_per_ruolo
      author: mctit
      runOnChange: true
      validCheckSums: [ "ANY" ]
      preConditions:
        - onFail: HALT
        - tableExists:
            { schemaName: anagrafiche, tableName: soggetti_ruoli }
        - tableExists:
           { schemaName: anagrafiche, tableName: soggetti_conti_bancari }
        - tableExists: 
            { schemaName: anagrafiche, tableName: soggetti_ruoli_conti_bancari }
        - tableExists:
           { schemaName: anagrafiche, tableName: conti_bancari }
      changes:
        - createView:
            schemaName: anagrafiche
            viewName: vw_conti_bancari_per_ruolo
            replaceIfExists: true
            remarks: "Selezione del conto bancario per ruolo con fallback: RUOLO → SOGGETTO; preferisce predefinito, valido oggi, non bloccato, conto attivo."
            selectQuery: |
              WITH role_cand AS (
                SELECT
                  sr.id                                  AS soggetto_ruolo_id,
                  r.uso                                   AS uso,
                  r.conto_bancario_id                     AS conto_bancario_id,
                  r.id                                    AS soggetto_ruolo_conto_id,
                  NULL::bigint                            AS soggetto_conto_id,
                  r.predefinito                           AS predefinito,
                  1                                       AS priority,
                  r.valido_dal                            AS valido_dal,
                  r.valido_al                             AS valido_al,
                  r.data_update                           AS data_update,
                  'RUOLO'::varchar(10)                    AS fonte
                FROM anagrafiche.soggetti_ruoli sr
                JOIN anagrafiche.soggetti_ruoli_conti_bancari r
                  ON r.soggetto_ruolo_id = sr.id
                JOIN anagrafiche.conti_bancari cb
                  ON cb.id = r.conto_bancario_id
                WHERE (r.valido_dal IS NULL OR r.valido_dal <= CURRENT_DATE)
                  AND (r.valido_al  IS NULL OR r.valido_al  >= CURRENT_DATE)
                  AND COALESCE(r.bloccato, false) = false
                  AND cb.attivo = true
              ),
              subj_cand AS (
                SELECT
                  sr.id                                  AS soggetto_ruolo_id,
                  s.uso                                   AS uso,
                  s.conto_bancario_id                     AS conto_bancario_id,
                  NULL::bigint                            AS soggetto_ruolo_conto_id,
                  s.id                                    AS soggetto_conto_id,
                  s.predefinito                           AS predefinito,
                  2                                       AS priority,
                  s.valido_dal                            AS valido_dal,
                  s.valido_al                             AS valido_al,
                  s.data_update                           AS data_update,
                  'SOGGETTO'::varchar(10)                 AS fonte
                FROM anagrafiche.soggetti_ruoli sr
                JOIN anagrafiche.soggetti_conti_bancari s
                  ON s.soggetto_id = sr.soggetto_id
                JOIN anagrafiche.conti_bancari cb
                  ON cb.id = s.conto_bancario_id
                WHERE (s.valido_dal IS NULL OR s.valido_dal <= CURRENT_DATE)
                  AND (s.valido_al  IS NULL OR s.valido_al  >= CURRENT_DATE)
                  AND COALESCE(s.bloccato, false) = false
                  AND cb.attivo = true
              ),
              candidates AS (
                SELECT * FROM role_cand
                UNION ALL
                SELECT * FROM subj_cand
              )
              SELECT DISTINCT ON (soggetto_ruolo_id, uso)
                soggetto_ruolo_id,
                uso,
                conto_bancario_id,
                soggetto_ruolo_conto_id,
                soggetto_conto_id,
                fonte,
                predefinito,
                valido_dal,
                valido_al,
                data_update
              FROM candidates
              ORDER BY
                soggetto_ruolo_id, uso,
                priority ASC,              -- 1=RUOLO, 2=SOGGETTO
                predefinito DESC,          -- preferisci predefinito
                data_update DESC,          -- poi il più recente
                soggetto_ruolo_conto_id NULLS LAST,
                soggetto_conto_id      NULLS LAST;

        - sql:
            splitStatements: false
            sql: |
              COMMENT ON VIEW anagrafiche.vw_conti_bancari_per_ruolo
                IS 'Vista di fallback per selezionare il conto bancario per ruolo: priorità RUOLO → SOGGETTO; filtra su validità odierna, non bloccato, conto attivo, preferendo il predefinito.';
              COMMENT ON COLUMN anagrafiche.vw_conti_bancari_per_ruolo.soggetto_ruolo_id
                IS 'Ruolo per cui si seleziona il conto.';
              COMMENT ON COLUMN anagrafiche.vw_conti_bancari_per_ruolo.uso
                IS 'Uso richiesto: INCASSO | PAGAMENTO | RIMBORSO | GENERICO.';
              COMMENT ON COLUMN anagrafiche.vw_conti_bancari_per_ruolo.conto_bancario_id
                IS 'Conto bancario selezionato (anagrafiche.conti_bancari.id).';
              COMMENT ON COLUMN anagrafiche.vw_conti_bancari_per_ruolo.soggetto_ruolo_conto_id
                IS 'Associazione di RUOLO usata (se fonte=RUOLO).';
              COMMENT ON COLUMN anagrafiche.vw_conti_bancari_per_ruolo.soggetto_conto_id
                IS 'Associazione di SOGGETTO usata (se fonte=SOGGETTO).';
              COMMENT ON COLUMN anagrafiche.vw_conti_bancari_per_ruolo.fonte
                IS 'Origine della selezione: RUOLO oppure SOGGETTO.';
              COMMENT ON COLUMN anagrafiche.vw_conti_bancari_per_ruolo.predefinito
                IS 'True se l’associazione usata è marcata come predefinita.';
              COMMENT ON COLUMN anagrafiche.vw_conti_bancari_per_ruolo.valido_dal
                IS 'Inizio validità dell’associazione selezionata.';
              COMMENT ON COLUMN anagrafiche.vw_conti_bancari_per_ruolo.valido_al
                IS 'Fine validità dell’associazione selezionata.';
              COMMENT ON COLUMN anagrafiche.vw_conti_bancari_per_ruolo.data_update
                IS 'Timestamp ultimo aggiornamento del legame usato.';
            
  
# Metto un  tag fine modifiche
  - changeSet:
      id: 20250831-90-create-view-vw_conti_bancari_per_ruolo
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250831-40-create-view-vw_conti_bancari_per_ruolo