databaseChangeLog:

  - changeSet:
      id: 20250818-01-create-anagrafiche-pdp
      author: mctit
      runOnChange: true
      validCheckSums: [ "ANY" ]
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: anagrafiche
            tableName: indirizzi_dettaglio
        - tableExists:
            schemaName: config
            tableName: utilities
        - tableExists:
            schemaName: anagrafiche
            tableName: clienti
      changes:
        # 1) Tabella base PDP
        - sql:
            sql: |
              CREATE TABLE IF NOT EXISTS anagrafiche.pdp (
                id                      BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                pdp                     VARCHAR(30) NOT NULL,
                utilities_id            BIGINT      NOT NULL,
                indirizzo_dettaglio_id  BIGINT      NOT NULL,
                cliente_id              BIGINT      NULL,
                -- audit/ops
                tx_id                   UUID        NOT NULL,
                data_insert             TIMESTAMPTZ NOT NULL DEFAULT now(),
                data_update             TIMESTAMPTZ NOT NULL DEFAULT now(),
                user_insert             VARCHAR(64) NOT NULL,
                user_update             VARCHAR(64) NOT NULL,
                storicizza              BOOLEAN     NOT NULL DEFAULT TRUE,
                extra_info              JSONB       NOT NULL DEFAULT '{}'::jsonb,
                -- vincoli
                CONSTRAINT uq_pdp_codice            UNIQUE (pdp),
                CONSTRAINT uq_pdp_addr_utility      UNIQUE (indirizzo_dettaglio_id, utilities_id),
                -- per FK composita da istanze_utilities
                CONSTRAINT uq_pdp_id_addr           UNIQUE (id, indirizzo_dettaglio_id),
                CONSTRAINT chk_pdp_codice_len       CHECK (char_length(pdp) BETWEEN 1 AND 30),
                CONSTRAINT fk_pdp_utilities         FOREIGN KEY (utilities_id)           REFERENCES config.utilities(id)            ON DELETE RESTRICT,
                CONSTRAINT fk_pdp_indirizzo_det     FOREIGN KEY (indirizzo_dettaglio_id) REFERENCES anagrafiche.indirizzi_dettaglio(id) ON DELETE RESTRICT,
                CONSTRAINT fk_pdp_cliente           FOREIGN KEY (cliente_id)             REFERENCES anagrafiche.clienti(id)       ON DELETE SET NULL
              );

              COMMENT ON TABLE  anagrafiche.pdp IS
                'Punti di prelievo ancorati a indirizzo_dettaglio; codice univoco globale; utility tipizzata; cliente corrente opzionale. Storicizzazione obbligatoria.';
              COMMENT ON COLUMN anagrafiche.pdp.pdp                    IS 'Codice PDP univoco (globale). Immutabile dopo prima valorizzazione.';
              COMMENT ON COLUMN anagrafiche.pdp.utilities_id           IS 'Tipo di utility (config.utilities).';
              COMMENT ON COLUMN anagrafiche.pdp.indirizzo_dettaglio_id IS 'Indirizzo fisico del PDP. Immutabile (il PDP non si sposta).';
              COMMENT ON COLUMN anagrafiche.pdp.cliente_id             IS 'Cliente corrente (può essere NULL). Timeline completa nello storico.';
              COMMENT ON COLUMN anagrafiche.pdp.tx_id                  IS 'Transaction ID applicativo, condiviso dalle DML nella stessa operazione.';
              COMMENT ON COLUMN anagrafiche.pdp.storicizza             IS 'Se TRUE, registra storico su I/U/D (obbligatorio per PDP).';

        # 2) Indici operativi
        - sql:
            sql: |
              CREATE INDEX IF NOT EXISTS idx_pdp_utilities_id           ON anagrafiche.pdp(utilities_id);
              CREATE INDEX IF NOT EXISTS idx_pdp_indirizzo_dettaglio_id ON anagrafiche.pdp(indirizzo_dettaglio_id);
              CREATE INDEX IF NOT EXISTS idx_pdp_cliente_id             ON anagrafiche.pdp(cliente_id);
        
  - changeSet:
      id: 20250818-90-create-anagrafiche-pdp
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250818-01-create-anagrafiche-pdp