databaseChangeLog:
  - changeSet:
      id: 20250714-01-add_tipo_soggetto_dettaglio_to_soggetti
      author: mctit
      comments: "Aggiunge il campo tipo_soggetto_dettaglio_id e la FK su config.tipi_soggetto_dettaglio"
      preConditions:
        onFail: MARK_RAN
        onError: HALT
        not:
          columnExists:
            schemaName: anagrafiche
            tableName: soggetti
            columnName: tipo_soggetto_dettaglio_id
      changes:
        # 1) Aggiunge il nuovo campo in anagrafiche.soggetti
        - addColumn:
            schemaName: anagrafiche
            tableName: soggetti
            columns:
              - column:
                  name: tipo_soggetto_dettaglio_id
                  type: BIGINT
                  remarks: "Riferimento a config.tipi_soggetto_dettaglio"
                  
        # 2) Crea vincolo FK su config.tipi_soggetto_dettaglio(id)
        - addForeignKeyConstraint:
            baseTableSchemaName: anagrafiche
            baseTableName: soggetti
            baseColumnNames: tipo_soggetto_dettaglio_id
            referencedTableSchemaName: config
            referencedTableName: tipi_soggetto_dettaglio
            referencedColumnNames: id
            constraintName: fk_soggetti_tipo_soggetto_dettaglio
            onUpdate: CASCADE
            onDelete: RESTRICT
        # 3) Commento sulla colonna
        - sql:
            dbms: postgresql
            sql: |
              COMMENT ON COLUMN anagrafiche.soggetti.tipo_soggetto_dettaglio_id
                IS 'Riferimento a config.tipi_soggetto_dettaglio per controlli CF/P.IVA';




  - changeSet:
      id: 20250713-26-createtable_config_tipi_soggetto_dettagli0
      author: mctit
      comments: "Rinomina id_tipo_soggetto in tipo_soggetto_id e vrea la foreign key"
      
      changes:
        changes:
        # 1) Rimuovo la FK che dipende dal PK
        - dropForeignKeyConstraint:
            baseTableSchemaName: anagrafiche
            baseTableName: soggetti
            constraintName: fk_soggetti_tipo_soggetto_dettaglio
          # 2) Rimuovo il PK col nome vecchio   
        - dropPrimaryKey:
            schemaName: config
            tableName: tipi_soggetto_dettaglio
            constraintName: tipi_soggetto_dettaglio_pkey
          # 3) Aggiungo il PK con il nuovo nome  
        - addPrimaryKey:
            schemaName: config
            tableName: tipi_soggetto_dettaglio
            columnNames: id
            constraintName: pk_tipi_soggetto_dettaglio
          # 4) Rimuovo il UQ col nome vecchio 
        - dropUniqueConstraint:
            schemaName: config
            tableName: tipi_soggetto_dettaglio
            constraintName: tipi_soggetto_dettaglio_cod_int_tipo_soggetto_key
          # 5) Aggiungo il UQ col nome nuovo 
        - addUniqueConstraint:
            schemaName: config
            tableName: tipi_soggetto_dettaglio
            columnNames: cod_int_tipo_soggetto
            constraintName: uq_tipi_soggetto_dettaglio_cod_int_tipo_soggetto

        - renameColumn:
            schemaName: config
            tableName: tipi_soggetto_dettaglio
            oldColumnName: id_tipo_soggetto
            newColumnName: tipo_soggetto_id
            columnDataType: VARCHAR(10)
        # Foreign key tipi_soggetto_dettaglio → tipi_soggetto
        - addForeignKeyConstraint:
                    baseTableSchemaName: config
                    baseTableName: tipi_soggetto_dettaglio
                    baseColumnNames: tipo_soggetto_id
                    referencedTableSchemaName: config
                    referencedTableName: tipi_soggetto
                    referencedColumnNames: id
                    constraintName: fk_tipi_soggetto_dettaglio_tipi_soggetto_id
                    onUpdate: CASCADE
                    onDelete: RESTRICT

        # 4) Ricreo la FK puntando al nuovo PK
        - addForeignKeyConstraint:
            baseTableSchemaName: anagrafiche
            baseTableName: soggetti
            baseColumnNames: tipo_soggetto_dettaglio_id
            referencedTableSchemaName: config
            referencedTableName: tipi_soggetto_dettaglio
            referencedColumnNames: id
            constraintName: fk_soggetti_tipo_soggetto_dettaglio
            onUpdate: CASCADE
            onDelete: RESTRICT


  - changeSet:
      id: 20250714-90-add_tipo_soggetto_dettaglio_to_soggetti
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250714-01-add_tipo_soggetto_dettaglio_to_soggetti