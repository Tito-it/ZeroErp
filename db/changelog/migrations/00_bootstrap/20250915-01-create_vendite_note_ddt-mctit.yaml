databaseChangeLog:


  - changeSet:
      id: 220250915-01-create_vendite_note_ddt
      author: mctit
      runOnChange: true
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists: { schemaName: vendite, tableName: note_ddt }

      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE TABLE IF NOT EXISTS vendite.note_ddt
              PARTITION OF vendite.note FOR VALUES IN ('ddt');
              COMMENT ON TABLE vendite.note_ddt
                IS 'Partizione note per ddt (FK forti verso testata/righe ddt ). ';

        # FK verso testata e (se presente) righe ddt
        - addForeignKeyConstraint:
            baseTableSchemaName: vendite
            baseTableName: note_ddt
            baseColumnNames: target_id
            referencedTableSchemaName: vendite
            referencedTableName: ddt
            referencedColumnNames: id
            constraintName: fk_ddt_note_testata
            onUpdate: CASCADE
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableSchemaName: vendite
            baseTableName: note_ddt
            baseColumnNames: target_riga_id
            referencedTableSchemaName: vendite
            referencedTableName: ddt_righe
            referencedColumnNames: id
            constraintName: fk_ddt_note_riga
            onUpdate: CASCADE
            onDelete: CASCADE

        # Check di coerenza ancoraggio
        - sql:
            splitStatements: false
            sql: |
              ALTER TABLE vendite.note_ddt
              ADD CONSTRAINT chk_ddt_note_anchor
              CHECK (
                (anchor_tipo = 'DOCUMENTO' AND target_riga_id IS NULL AND posizione IN ('HEADER','FOOTER','SEZIONE'))
                OR
                (anchor_tipo = 'RIGA'      AND target_riga_id IS NOT NULL AND posizione IN ('BEFORE','AFTER'))
              );
              COMMENT ON CONSTRAINT chk_ddt_note_anchor ON vendite.note_ddt
                IS 'Regole di coerenza tra anchor_tipo, riga e posizione per ddt. ';

        # Indice di rendering
        - createIndex:
            schemaName: vendite
            tableName: note_ddt
            indexName: ix_ddt_note_render
            columns:
              - column: { name: target_id }
              - column: { name: anchor_tipo }
              - column: { name: target_riga_id }
              - column: { name: posizione }
              - column: { name: seq }

  
  - changeSet:
      id: 20250915-90-create_vendite_note_ddt
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250915-01-create_vendite_note_ddt