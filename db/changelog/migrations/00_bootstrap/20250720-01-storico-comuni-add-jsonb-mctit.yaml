databaseChangeLog:
  - changeSet:
      id: 20250720-01-storico-comuni-add-jsonb
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      preConditions:
        onFail: MARK_RAN     # se la colonna esiste, il changeSet viene saltato
        onError: CONTINUE
        not:
            columnExists:
              schemaName: storico
              tableName: comuni
              columnName: snapshot
      changes:
        - addColumn:
            schemaName: storico
            tableName: comuni
            columns:
              - column:
                  name: snapshot
                  type: jsonb
                  remarks: "Snapshot JSON dei valori - storicizzazione dati"   
              - column:
                  name: tipo_operazione_id
                  type: smallint
                  remarks: "Tipo operazione (1=insert, 2=update, 3=delete)" 
        - dropColumn:
            schemaName: storico
            tableName: comuni
            columns:
              - column:
                  name: descrizione
              - column:
                  name: extra_country
              - column:
                  name: stato
             # - column:
             #     name: provincia_id    
  - changeSet:
      id: 20250720-90-storico-comuni-add-jsonb
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250720-01-storico-comuni-add-jsonb