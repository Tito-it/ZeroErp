# Zero ERP — Anagrafiche: resellers
# ------------------------------------------------------------
databaseChangeLog:
  - changeSet:
      id: 20250904-01-create_anagrafiche_resellers
      author: mctit
      
      preConditions:
        - onFail: HALT
        - tableExists:  { schemaName: anagrafiche, tableName: soggetti_ruoli }
      changes:
        - createTable:
            schemaName: anagrafiche
            tableName: resellers
            remarks: "Ruolo RES (rivenditori/reseller). Metadati generici, FK 1:1 al soggetto_ruolo."
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  generationType: BY DEFAULT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_resellers
                    nullable: false
                  remarks: "PK"
              - column:
                  name: uid
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints: { nullable: false }
                  remarks: "Identificatore esterno (UUID) per API/integrazioni."
              - column:
                  name: soggetto_ruolo_id
                  type: BIGINT
                  constraints: { nullable: false }
                  remarks: "FK → anagrafiche.soggetti_ruoli.id (ruolo atteso: RES)."
              - column:
                  name: codice
                  type: VARCHAR(32)
                  constraints: { nullable: false }
                  remarks: "Codice interno univoco reseller (immutabile)."
              - column:
                  name: descrizione
                  type: VARCHAR(120)
                  constraints: { nullable: false }
                  remarks: "Descrizione reseller."
              - column:
                  name: attivo
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints: { nullable: false }
                  remarks: "Se TRUE, reseller abilitato."
              - column:
                  name: meta
                  type: JSONB
                  defaultValue: "{}"
                  constraints: { nullable: false }
                  remarks: "Metadati estensibili (JSONB)."
              - column: { name: tx_id, type: UUID, remarks: "Id transazione" }
              - column:
                  name: storicizza
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints: { nullable: false }
                  remarks: "Snapshot su UPDATE/DELETE"
              - column:
                  name: data_insert
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints: { nullable: false }
                  remarks: "Audit: data inserimento"
              - column:
                  name: user_insert
                  type: VARCHAR(80)
                  defaultValueComputed: CURRENT_USER
                  constraints: { nullable: false }
                  remarks: "Audit: utente inserimento"
              - column:
                  name: data_update
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints: { nullable: false }
                  remarks: "Audit: data aggiornamento"
              - column:
                  name: user_update
                  type: VARCHAR(80)
                  defaultValueComputed: CURRENT_USER
                  remarks: "Audit: utente aggiornamento"

        # Vincoli di unicità
        - addUniqueConstraint:
            schemaName: anagrafiche
            tableName: resellers
            columnNames: uid
            constraintName: uq_resellers_uid

        - addUniqueConstraint:
            schemaName: anagrafiche
            tableName: resellers
            columnNames: codice
            constraintName: uq_resellers_codice

        - addUniqueConstraint:
            schemaName: anagrafiche
            tableName: resellers
            columnNames: soggetto_ruolo_id
            constraintName: uq_resellers_ruolo

        # Foreign key
        - addForeignKeyConstraint:
            baseTableSchemaName: anagrafiche
            baseTableName: resellers
            baseColumnNames: soggetto_ruolo_id
            constraintName: fk_resellers_ruolo
            referencedTableSchemaName: anagrafiche
            referencedTableName: soggetti_ruoli
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: NO ACTION

       

        # Indici
        - createIndex:
            schemaName: anagrafiche
            tableName: resellers
            indexName: ix_resellers_attivo
            columns:
              - column: { name: attivo }

        # Check constraint
        - sql:
            splitStatements: false
            sql: |

              ALTER TABLE anagrafiche.resellers
              ADD CONSTRAINT chk_resellers_codice_non_vuoto
              CHECK (btrim(codice) <> '');

        # Indice case-insensitive su codice (espressione)
        - sql:
            splitStatements: false
            sql: |
              CREATE INDEX IF NOT EXISTS ix_resellers_codice_upper
                ON anagrafiche.resellers (upper(codice));
                
# Metto un  tag fine modifiche
  - changeSet:
      id: 20250904-90-create_anagrafiche_resellers
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250904-01-create_anagrafiche_resellers