databaseChangeLog:
  - changeSet:
      id: 20250904-04-create_config_stati_doc_fiscale
      author: mctit
      runOnChange: true
      changes:

        - createTable:
            schemaName: config
            tableName: stati_doc_fiscale
            remarks: "Dominio stati del documento fiscale (codici stabili; descrizioni multilingua)."
            columns:
                - column:
                    name: id
                    type: BIGINT 
                    autoIncrement: true
                    generationType: BY DEFAULT
                    constraints:
                      primaryKey: true
                      primaryKeyName: pk_stati_doc_fiscale
                      nullable: false
                    remarks: "PK"
                
                - column:
                    name: codice
                    type: VARCHAR(32)
                    remarks: "Codice stabile (es. DRAFT, EMESSA, INVIATA, ...)."
                    constraints:
                      nullable: false
                - column:
                    name: descrizione
                    type: VARCHAR(120)
                
                - column:
                    name: attivo
                    type: BOOLEAN
                    defaultValueBoolean: true
                    constraints:
                      nullable: false
                - column:
                    name: ordine
                    type: SMALLINT
                - column:
                    name: meta
                    type: JSONB
                    defaultValueComputed: "'{}'::jsonb"
                    constraints:
                      nullable: false       
        - addUniqueConstraint:
            schemaName: config
            tableName: stati_doc_fiscale
            columnNames: codice
            constraintName: uq_stati_doc_fiscale_codice
        - createIndex:
            schemaName: config
            tableName: stati_doc_fiscale
            indexName: ix_stati_doc_fiscale_attivo
            columns:
                - column: { name: attivo }

# Metto un  tag fine modifiche
  - changeSet:
      id: 20250904-90-create_config_tipi_doc_fiscale
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250904-04-create_config_stati_doc_fiscale