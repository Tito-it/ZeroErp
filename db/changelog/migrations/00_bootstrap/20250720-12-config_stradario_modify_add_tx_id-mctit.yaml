databaseChangeLog:
 
  - changeSet:
      id: 20250720-12-config_stradario_modify_add_tx_id
      author: mctit
      preConditions:
        onFail: HALT
        onError: HALT
       
        # 1) Assicuro che NON esista ancora tx_id
        not:
          columnExists:
            schemaName: config
            tableName: stradario
            columnName: tx_id

      changes:
      
        # 2) Aggiunta della colonna tx_id uuid 
        - addColumn:
            schemaName: config
            tableName: stradario
            columns:
              - column:
                  name: tx_id
                  type: uuid
                  constraints:
                    nullable: true
 
  - changeSet:
      id: 20250720-90-config_stradario_modify_add_tx_id
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250720-12-config_stradario_modify_add_tx_id