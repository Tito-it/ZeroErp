databaseChangeLog:
  - changeSet:
      id: 20250905-04-script-fn-norm-testo-v1
      author: mctit
      changes:
                
        - sql:
            splitStatements: false
            stripComments: true
            sql: |              
        
              CREATE OR REPLACE FUNCTION script.fn_norm_testo(p_txt text)
              RETURNS text
              LANGUAGE sql
              IMMUTABLE
              AS $$
              
                -- Normalizza testo: lower, unaccent, spazi/punteggiatura compattati
                SELECT
                  trim(
                    regexp_replace(
                      regexp_replace(
                        lower(unaccent(coalesce(p_txt,''))),
                        '[^\w\s]', ' ', 'g'           -- rimuove punteggiatura
                      ),
                      '\s+', ' ', 'g'               -- comprime spazi
                    )
                  )
              
              $$;

              
              CREATE OR REPLACE FUNCTION script.fn_norm_via(p_topo text, p_via text)
              RETURNS text
              LANGUAGE sql
              IMMUTABLE
              AS $$
              
               -- Normalizza via: toponomastica + nome via
                SELECT script.fn_norm_testo(coalesce(p_topo,'') || ' ' || coalesce(p_via,''));
              
              $$;



