databaseChangeLog:
  - changeSet:
      id: 20250916-14-config-iva-add-attivo-storicizza
      author: mctit
      preConditions:
        - onFail: MARK_RAN     # se la colonna esiste, il changeSet viene saltato
        - onError: CONTINUE
         
        - not:
            - columnExists:
                schemaName: config
                tableName: iva
                columnName: storicizza

      changes:
        - addColumn:
            schemaName: config
            tableName: iva
            columns:
              - column:
                  name: attivo
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
                  remarks: "Stato attivo/inattivo del soggetto (DEFAULT TRUE)"

                # 1) Aggiunta della colonna tx_id se non esiste
        - addColumn:
            schemaName: config
            tableName: iva
            columns:
              - column:
                  name: storicizza
                  type: BOOLEAN
                  defaultValueBoolean: true
                  remarks: "Storicizza se true, non storicizza se false"

        
  
  - changeSet:
      id: 20250916-90-config-iva-add-attivo-storicizza
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250916-14-config-iva-add-attivo-storicizza