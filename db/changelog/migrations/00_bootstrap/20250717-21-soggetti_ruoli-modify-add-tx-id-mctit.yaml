databaseChangeLog:
 
  - changeSet:
      id: 20250717-21-soggetti_ruoli-modify-add-tx-id
      author: mctit

      preConditions:
        onFail: HALT
        onError: HALT
       
        # 3) Assicuro che NON esista ancora tx_id
        not:
          columnExists:
            schemaName: anagrafiche
            tableName: soggetti_ruoli
            columnName: tx_id

      changes:
      
        # 3) Aggiunta della colonna tx_id uuid 
        - addColumn:
            schemaName: anagrafiche
            tableName: soggetti_ruoli
            columns:
              - column:
                  name: tx_id
                  type: uuid
                  constraints:
                    nullable: true

  - changeSet:
      id: 20250717-90-soggetti_ruoli-modify-add-tx-id
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250717-21-soggetti_ruoli-modify-add-tx-id