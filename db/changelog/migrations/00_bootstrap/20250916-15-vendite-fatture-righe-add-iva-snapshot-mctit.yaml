databaseChangeLog:
  - changeSet:
      id: 20250916-15-vendite-fatture-righe-add-iva-snapshot
      author: mctit
      preConditions:
        - onFail: MARK_RAN     # se la colonna esiste, il changeSet viene saltato
        - onError: CONTINUE
         
        - not:
            - columnExists:
                schemaName: vedite
                tableName: fatture_righe
                columnName: iva_perc
 
      changes:
        - addColumn:
            schemaName: vendite
            tableName: fatture_righe
            columns:
              - column: { name: iva_perc, type: "NUMERIC(5,2)", remarks: "IVA % (snapshot)" }
              - column: { name: iva_natura, type: VARCHAR(10), remarks: "IVA natura (snapshot)" }
          sql:
            splitStatements: false
            sql: |
              ALTER TABLE vendite.fatture_righe
              ADD CONSTRAINT chk_fatr_iva_perc
              CHECK (iva_perc IS NULL OR (iva_perc >= 0 AND iva_perc <= 100));    
          
  
  - changeSet:
      id: 20250916-90-vendite-fatture-righe-add-iva-snapshot
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250916-15-vendite-fatture-righe-add-iva-snapshot