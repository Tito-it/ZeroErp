databaseChangeLog:
  - changeSet:
      id: 20250830-10-create_vendite_note_preventivo
      author: mctit
      runOnChange: true
      validCheckSums: [ANY]
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE TABLE IF NOT EXISTS vendite.note_preventivo
              PARTITION OF vendite.note FOR VALUES IN ('PREVENTIVO');
              COMMENT ON TABLE vendite.note_preventivo
                IS 'Partizione note per preventivi (FK forti verso testata/righe preventivo).';

        # FK verso testata e righe preventivo
        - addForeignKeyConstraint:
            baseTableSchemaName: vendite
            baseTableName: note_preventivo
            baseColumnNames: target_id
            referencedTableSchemaName: vendite
            referencedTableName: preventivi
            referencedColumnNames: id
            constraintName: fk_prevnote_testata
            onUpdate: CASCADE
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableSchemaName: vendite
            baseTableName: note_preventivo
            baseColumnNames: target_riga_id
            referencedTableSchemaName: vendite
            referencedTableName: preventivi_righe
            referencedColumnNames: id
            constraintName: fk_prevnote_riga
            onUpdate: CASCADE
            onDelete: CASCADE

        # Ancoraggio coerente con il tipo (documento vs riga)
        - sql:
            splitStatements: false
            sql: |
              ALTER TABLE vendite.note_preventivo
              ADD CONSTRAINT chk_prevnote_anchor
              CHECK (
                (anchor_tipo = 'DOCUMENTO' AND target_riga_id IS NULL AND posizione IN ('HEADER','FOOTER','SEZIONE'))
                OR
                (anchor_tipo = 'RIGA'      AND target_riga_id IS NOT NULL AND posizione IN ('BEFORE','AFTER'))
              );
              COMMENT ON CONSTRAINT chk_prevnote_anchor ON vendite.note_preventivo
                IS 'Regole di coerenza tra anchor_tipo, riga e posizione per preventivi.';

        # Indice di rendering
        - createIndex:
            schemaName: vendite
            tableName: note_preventivo
            indexName: ix_prevnote_render
            columns:
              - column: { name: target_id }
              - column: { name: anchor_tipo }
              - column: { name: target_riga_id }
              - column: { name: posizione }
              - column: { name: seq }

  
        
  
  - changeSet:
      id: 20250830-90-create_vendite_note_preventivi
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250830-10-create_vendite_note_preventivi