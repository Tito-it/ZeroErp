databaseChangeLog:
  - changeSet:
      id: 20250819-22-create-vendite-articoli-spesa
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY 
      changes:
       
        - createSequence:
            schemaName: vendite
            sequenceName: articoli_spesa_id_seq
            startValue: 1
            incrementBy: 1
            minValue: 1

        # 1) Tabella
        - createTable:
            schemaName: vendite
            tableName: articoli_spesa
            remarks: "Collegamento articoli → voci di spesa, utile per riepiloghi di fattura (energia, gas, ecc.)"
            columns:
              - column:
                  name: id
                  type: INTEGER
                  defaultValueComputed: "nextval('vendite.articoli_spesa_id_seq'::regclass)"
                  remarks: "Identificativo univoco"
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_articoli_spesa
                    nullable: false
              - column:
                  name: codice
                  type: VARCHAR(20)
                  remarks: "Codice univoco voce di spesa"
                  constraints:
                    nullable: false
              - column:
                  name: descrizione
                  type: VARCHAR(100)
                  remarks: "Descrizione estesa voce di spesa"
                  constraints:
                    nullable: false
              - column:
                  name: descrizione_fattura
                  type: VARCHAR(60)
                  remarks: "Descrizione da esporre sul documento di fatturazione"
              - column:
                  name: attivo
                  type: BOOLEAN
                  defaultValueBoolean: true
                  remarks: "Indica se la voce di spesa è attiva"
                  constraints:
                    nullable: false
              - column:
                  name: user_insert
                  type: VARCHAR(30)
                  defaultValueComputed: CURRENT_USER
                  remarks: "Utente che ha effettuato l'inserimento"
                  constraints:
                    nullable: false
              - column:
                  name: user_update
                  type: VARCHAR(30)
                  defaultValueComputed: CURRENT_USER
                  remarks: "Utente ultima modifica"
              - column:
                  name: data_insert
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  remarks: "Data inserimento"
                  constraints:
                    nullable: false
              - column:
                  name: data_update
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  remarks: "Data ultima modifica"
                  constraints:
                    nullable: false

        # 2) Vincolo univoco su codice
        - addUniqueConstraint:
            schemaName: vendite
            tableName: articoli_spesa
            columnNames: codice
            constraintName: uq_articoli_spesa_codice

        # 3) Indice case-insensitive su codice (prefisso ix_)
        - sql:
            splitStatements: false
            sql: |
              CREATE INDEX IF NOT EXISTS ix_articoli_spesa_codice_upper
              ON vendite.articoli_spesa (upper(codice));

        # 4) Trigger audit
        - sql:
            splitStatements: false
            sql: |
              CREATE OR REPLACE TRIGGER trg_upd_articoli_spesa_audit_data_user
                BEFORE UPDATE ON vendite.articoli_spesa
                FOR EACH ROW
                EXECUTE FUNCTION script.trgfn_upd_audit_data_user_generic();

        # 5) Commenti (tabella, colonne, constraint, indice qualificato, trigger)
        - sql:
            splitStatements: false
            sql: |
              COMMENT ON TABLE vendite.articoli_spesa
                IS 'Collegamento articoli a voci di spesa, utile per riepiloghi di fattura (energia, gas, ecc.).';
              COMMENT ON COLUMN vendite.articoli_spesa.id
                IS 'Id.Voce di spesa (sequence vendite.articoli_spesa_id_seq)';
              COMMENT ON COLUMN vendite.articoli_spesa.codice
                IS 'Codice univoco voce di spesa';
              COMMENT ON COLUMN vendite.articoli_spesa.descrizione
                IS 'Descrizione estesa voce di spesa';
              COMMENT ON COLUMN vendite.articoli_spesa.descrizione_fattura
                IS 'Descrizione da esporre sul documento di fatturazione';
              COMMENT ON COLUMN vendite.articoli_spesa.attivo
                IS 'Flag attivo/non attivo';
              COMMENT ON COLUMN vendite.articoli_spesa.user_insert
                IS 'Utente inserimento';
              COMMENT ON COLUMN vendite.articoli_spesa.user_update
                IS 'Utente ultima modifica';
              COMMENT ON COLUMN vendite.articoli_spesa.data_insert
                IS 'Data inserimento';
              COMMENT ON COLUMN vendite.articoli_spesa.data_update
                IS 'Data ultima modifica';

              COMMENT ON CONSTRAINT uq_articoli_spesa_codice ON vendite.articoli_spesa
                IS 'Key: codice voce di spesa univoco';

              COMMENT ON INDEX vendite.ix_articoli_spesa_codice_upper
                IS 'Ricerca case-insensitive su codice (upper(codice))';

              COMMENT ON TRIGGER trg_upd_articoli_spesa_audit_data_user ON vendite.articoli_spesa
                IS 'Aggiorna (audit) data_update e user_update al BEFORE UPDATE';

  - changeSet:
      id: 20250819-90-create-vendite-articoli-spesa
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250819-22-create-vendite-articoli-spesa
