databaseChangeLog:

  - changeSet:
      id: 20250711-0100-create-project-metadata
      author: mctit
      changes:
        - sql:
            sql: "CREATE SCHEMA IF NOT EXISTS internal;"
            comment: "Crea lo schema 'internal' se non esiste"
  - changeSet:
      id: 20250711-0102-create-project-metadata
      author: mctit
      changes:
        - createTable:
            schemaName: internal
            tableName: project_metadata
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: info_encrypted
                  type: bytea
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              
  - changeSet:
      id: 20250711-0202-insert-project-signature
      author: mctit
      changes:
        - sql:
            comment: Inserisce il testo cifrato del progetto
            sql: |
              TRUNCATE internal.project_metadata;
              INSERT INTO internal.project_metadata(info_encrypted)
              VALUES (
              decode('',
              'hex')
              );

  - changeSet:
      id: 20250711-03-trigger-block-modification
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      changes:
        - sql:
            sql: |
              CREATE OR REPLACE FUNCTION internal.trgfn_block_project_metadata()
                  RETURNS trigger
                  LANGUAGE plpgsql 
                AS $BODY$
                BEGIN
                  RAISE EXCEPTION 'Modifica non consentita sulla tabella internal.project_metadata';
                END;
                $BODY$ ;

              CREATE TRIGGER trg_block_modification
              BEFORE INSERT OR UPDATE OR DELETE ON internal.project_metadata
              FOR EACH STATEMENT
              EXECUTE FUNCTION internal.trgfn_block_project_metadata();

  - changeSet:
      id: 20250711-04-restrict-permissions
      author: mctit
      changes:
        - sql:
            sql: |
              REVOKE ALL ON TABLE internal.project_metadata FROM PUBLIC;
              GRANT SELECT ON TABLE internal.project_metadata TO PUBLIC;
