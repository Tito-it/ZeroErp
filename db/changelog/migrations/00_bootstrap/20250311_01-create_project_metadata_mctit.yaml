databaseChangeLog:
  # 1) Abilita l'estensione pgcrypto per la cifratura
  - changeSet:
      id: 20250513-01
      author: mctit
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE EXTENSION IF NOT EXISTS pgcrypto;

  
  #2) Crea lo schema "internal" e ne revoca i privilegi al PUBLIC
  - changeSet:
      id: 20250311-02-set-internal
      author: mctit
      context: provision
      changes:
        - sql:
            splitStatements: false
            sql: |
              -- 1) Creazione del ruolo se non esiste
              DO $$
              BEGIN
                IF NOT EXISTS (
                  SELECT 1 FROM pg_roles WHERE rolname = 'zeroerp_app'
                ) THEN
                  CREATE ROLE zeroerp_app LOGIN;
                END IF;
              END
              $$;

              -- 2) Creazione dello schema e gestione dei privilegi
              CREATE SCHEMA IF NOT EXISTS internal;
              REVOKE ALL ON SCHEMA internal FROM PUBLIC;
              GRANT USAGE ON SCHEMA internal TO zeroerp_app;

    
  - changeSet:
      id: 20250711-0102-create-project-metadata
      author: mctit
      changes:
        - createTable:
            schemaName: internal
            tableName: project_metadata
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: info_encrypted
                  type: bytea
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              
  - changeSet:
      id: 20250711-0202-insert-project-signature
      author: mctit
      changes:
        - sql:
            comment: Inserisce il testo cifrato del progetto
            sql: |
              TRUNCATE internal.project_metadata;
              INSERT INTO internal.project_metadata(info_encrypted)
              VALUES (
              decode('',
              'hex')
              );

  - changeSet:
      id: 20250711-0301-trigger-block-modification
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY

      changes:
      # 0) Rimuove il trigger se già esiste
      - sql:
          comment: "0) Drop trigger se esiste"
          splitStatements: false
          sql: |
            DROP TRIGGER IF EXISTS trg_block_modification
              ON internal.project_metadata;

      changes:
        - sql:
            comment: "1) Crea o sostituisce la trigger-function per bloccare modifiche"
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION internal.trgfn_block_project_metadata()
                  RETURNS trigger
                  LANGUAGE plpgsql 
                AS $BODY$
                BEGIN
                  RAISE EXCEPTION 'Modifica non consentita sulla tabella internal.project_metadata';
                END;
                $BODY$;

        - sql:
            comment: "2) Crea il trigger su project_metadata"
            splitStatements: false
            sql: |
              CREATE TRIGGER trg_block_modification
              BEFORE INSERT OR UPDATE OR DELETE ON internal.project_metadata
              FOR EACH STATEMENT
              EXECUTE FUNCTION internal.trgfn_block_project_metadata();


  # 4) Tabella per il tracking della versione in uso
  - changeSet:
      id: 20250513-04
      author: mctit
      changes:
        - createTable:
            tableName: version_info
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: app_name
                  type: VARCHAR(100)
                  defaultValue: "ZeroErp"
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: last_updated_by
                  type: VARCHAR(100)
                  defaultValueComputed: CURRENT_USER
                  constraints:
                    nullable: false
              - column:
                  name: last_updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - insert:
            tableName: version_info
            columns:
              - column:
                  name: app_name
                  value: "ZeroErp"
              - column:
                  name: version
                  value: "0.1.0"



  - changeSet:
      id: 20250711-04-restrict-permissions
      author: mctit
      changes:
        - sql:
            sql: |
              REVOKE ALL ON TABLE internal.project_metadata FROM PUBLIC;
              GRANT SELECT ON TABLE internal.project_metadata TO PUBLIC;
