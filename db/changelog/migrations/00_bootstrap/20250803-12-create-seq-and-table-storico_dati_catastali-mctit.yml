databaseChangeLog:
  - changeSet:
      id: 20250803-12-create-seq-and-table-storico_dati_catastali
      author: mctit
      runOnChange: true
      validCheckSums: 
        - ANY
      comments: >
        Definisce la sequence e crea la tabella storico.dati_catastali, 
        quindi aggiunge la FK verso anagrafiche.dati_catastali con onUpdate CASCADE e onDelete SET NULL.
      preConditions:
        onFail: MARK_RAN     # se la colonna esiste, il changeSet viene saltato
        onError: CONTINUE
         #  Assicuro che NON esista già la tabella dati_catastali
        not:
          tableExists:
            schemaName: storico
            tableName: dati_catastali
            
      changes:
        # 1) Creazione della sequence per id
        - createSequence:
            schemaName: storico
            sequenceName: dati_catastali_id_seq
            startValue: 1
            incrementBy: 1
            dataType: BIGINT
            remarks: "Sequence per la colonna id di storico.dati_catastali"

        # 2) Creazione della tabella con id BIGINT default nextval(...)
        - createTable:
            schemaName: storico
            tableName: dati_catastali
            remarks: "Tabella storica per i dati_catastali con snapshot JSONB e campi di audit"
            columns:
              - column:
                  name: id
                  type: BIGINT
                  defaultValueComputed: "nextval('storico.dati_catastali_id_seq'::regclass)"
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_storico_dati_catastali
                    nullable: false
                  remarks: "Chiave primaria di tipo BIGINT basata su sequence"
              - column:
                  name: valid_from
                  type: Timestamp with time zone
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
                  remarks: "Data di inizio validità del record"
              - column:
                  name: valid_to
                  type: Timestamp with time zone 
                  remarks: "Data di fine validità del record (se conosciuta)"
              - column:
                  name: change_type
                  type: CHAR(1)
                  defaultValue: "A"
                  remarks: "'Tipo di cambiamento: A=Active, S=Suppressed, F=Fused, D=Divided"
              - column:
                  name: data_insert
                  type: TIMESTAMP
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
                  remarks: "Timestamp di inserimento nella tabella storica"
              - column:
                  name: user_insert
                  type: VARCHAR(255)
                  defaultValueComputed: "CURRENT_USER"
                  constraints:
                    nullable: false
                  remarks: "Utente che ha creato questo record storico"
              - column:
                  name: dato_catastale_id
                  type: BIGINT
                  constraints:
                    nullable: false
                  remarks: "Riferimento alla tabella anagrafiche.dati_catastali"
              - column:
                  name: snapshot
                  type: JSONB
                  constraints:
                    nullable: false
                  remarks: "Snapshot JSONB dei dati dati_catastali al momento dell'operazione"
              - column:
                  name: tipo_operazione
                  type: SMALLINT
                  remarks: "Codice del tipo di operazione applicata"
              - column:
                  name: tx_id
                  type: UUID
                  remarks: "UUID di transazione per correlare più operazioni"
  
        # 3) Ricreazione del FK su storico.dati_catastali verso la nuova PK
        - addForeignKeyConstraint:
            constraintName: fk_storico_dati_catastali_anagrafiche_dati_catastali
            baseTableSchemaName: storico
            baseTableName: dati_catastali
            baseColumnNames: dato_catastale_id
            referencedTableSchemaName: anagrafiche
            referencedTableName: dati_catastali
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: SET NULL

        

 # Metto un  tag fine modifiche
  - changeSet:
        id: 20250729-90-create-seq-and-table-storico_dati_catastali
        author: mctit
        changes:
          - tagDatabase:
              tag: 20250729-32-create-seq-and-table-storico_dati_catastali