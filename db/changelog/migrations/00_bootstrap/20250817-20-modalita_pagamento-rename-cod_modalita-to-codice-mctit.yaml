# ------------------------------------------------------------
# Zero ERP – Modalità Pagamento: rename cod_modalita -> codice
# Tabella: config.modalita_pagamento
# ------------------------------------------------------------
databaseChangeLog:
  - changeSet:
      id: 20250817-20-modalita_pagamento-rename-cod_modalita-to-codice
      author: mctit
      context: ddl
      runOnChange: true
      failOnError: true

      preConditions:
        - onFail: HALT
        - onError: HALT
        - and:
            - tableExists:
                schemaName: config
                tableName: modalita_pagamento
            - columnExists:
                schemaName: config
                tableName: modalita_pagamento
                columnName: cod_modalita
            - not:
                - columnExists:
                    schemaName: config
                    tableName: modalita_pagamento
                    columnName: codice

      changes:
        # 1) Rinomina colonna
        - renameColumn:
            schemaName: config
            tableName: modalita_pagamento
            oldColumnName: cod_modalita
            newColumnName: codice

        # 2) Rinomina vincolo UNIQUE se presente come constraint
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_constraint c
                  JOIN pg_class t ON t.oid = c.conrelid
                  JOIN pg_namespace n ON n.oid = t.relnamespace
                  WHERE c.contype = 'u'
                    AND n.nspname = 'config'
                    AND t.relname = 'modalita_pagamento'
                    AND c.conname = 'uq_modalita_pagamento_cod'
                ) THEN
                  EXECUTE 'ALTER TABLE config.modalita_pagamento RENAME CONSTRAINT uq_modalita_pagamento_cod TO uq_modalita_pagamento_codice';
                END IF;
              END$$;

        # 3) Rinomina indice standalone se presente con lo stesso nome storico
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_class i
                  JOIN pg_namespace n ON n.oid = i.relnamespace
                  WHERE i.relkind IN ('i','I')
                    AND n.nspname = 'config'
                    AND i.relname = 'uq_modalita_pagamento_cod'
                ) THEN
                  EXECUTE 'ALTER INDEX IF EXISTS config.uq_modalita_pagamento_cod RENAME TO uq_modalita_pagamento_codice';
                END IF;
              END$$;

      rollback:
        - renameColumn:
            schemaName: config
            tableName: modalita_pagamento
            oldColumnName: codice
            newColumnName: cod_modalita

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_constraint c
                  JOIN pg_class t ON t.oid = c.conrelid
                  JOIN pg_namespace n ON n.oid = t.relnamespace
                  WHERE c.contype = 'u'
                    AND n.nspname = 'config'
                    AND t.relname = 'modalita_pagamento'
                    AND c.conname = 'uq_modalita_pagamento_codice'
                ) THEN
                  EXECUTE 'ALTER TABLE config.modalita_pagamento RENAME CONSTRAINT uq_modalita_pagamento_codice TO uq_modalita_pagamento_cod';
                END IF;
              END$$;

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_class i
                  JOIN pg_namespace n ON n.oid = i.relnamespace
                  WHERE i.relkind IN ('i','I')
                    AND n.nspname = 'config'
                    AND i.relname = 'uq_modalita_pagamento_codice'
                ) THEN
                  EXECUTE 'ALTER INDEX IF EXISTS config.uq_modalita_pagamento_codice RENAME TO uq_modalita_pagamento_cod';
                END IF;
              END$$;

  - changeSet:
      id: 20250817-99-modalita_pagamento-rename-cod_modalita-to-codice
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250817-20-modalita_pagamento-rename-cod_modalita-to-codice