databaseChangeLog:
  - changeSet:
      id: 20250808-01-table_maintenance_test_pgagent_log
      author: mctit
      runOnChange: true
      validCheckSums: 
        - ANY
      comments: >
        Tabella log di test per pgagent 
      preConditions:
        onFail: MARK_RAN
        onError: CONTINUE
        not:
            tableExists:
              schemaName: maintenance
              tableName: test_pgagent_log
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE IF NOT EXISTS maintenance.test_pgagent_log (
                id         SERIAL PRIMARY KEY,
                fired_at   TIMESTAMPTZ NOT NULL DEFAULT now(),
                jobname    TEXT        NOT NULL,
                status     INT         NOT NULL,
                message    TEXT
              );
              
  - changeSet:
      id: 20250808-90-table_maintenance_test_pgagent_log
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250808-01-table_maintenance_test_pgagent_log
