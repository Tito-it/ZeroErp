databaseChangeLog:
  - changeSet:
      id: 20250817-08-tipi_indirizzi-rename-cod_int-to-codice_interno
      author: mctit
      context: ddl
      runOnChange: true
      failOnError: true

      preConditions:
        - onFail: HALT
        - onError: HALT
        - and:
            - tableExists:
                schemaName: config
                tableName: tipi_indirizzi
            - columnExists:
                schemaName: config
                tableName: tipi_indirizzi
                columnName: cod_int_tipo_indirizzo
            - not:
                - columnExists:
                    schemaName: config
                    tableName: tipi_indirizzi
                    columnName: codice_interno

      changes:
        # 1) Rinomina colonna
        - renameColumn:
            schemaName: config
            tableName: tipi_indirizzi
            oldColumnName: cod_int_tipo_indirizzo
            newColumnName: codice_interno

        # 2) Rinomina vincolo UNIQUE (se esiste come constraint)
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_constraint c
                  JOIN pg_class t ON t.oid = c.conrelid
                  JOIN pg_namespace n ON n.oid = t.relnamespace
                  WHERE c.contype = 'u'
                    AND n.nspname = 'config'
                    AND t.relname = 'tipi_indirizzi'
                    AND c.conname = 'uq_tipi_indirizzi_cod_int_tipo_indirizzo'
                ) THEN
                  EXECUTE 'ALTER TABLE config.tipi_indirizzi RENAME CONSTRAINT uq_tipi_indirizzi_cod_int_tipo_indirizzo TO uq_tipi_indirizzi_codice_interno';
                END IF;
              END$$;

        # 3) Rinomina indice standalone (se creato con CREATE UNIQUE INDEX)
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_class i
                  JOIN pg_namespace n ON n.oid = i.relnamespace
                  WHERE i.relkind IN ('i','I')
                    AND n.nspname = 'config'
                    AND i.relname = 'uq_tipi_indirizzi_cod_int_tipo_indirizzo'
                ) THEN
                  EXECUTE 'ALTER INDEX IF EXISTS config.uq_tipi_indirizzi_cod_int_tipo_indirizzo RENAME TO uq_tipi_indirizzi_codice_interno';
                END IF;
              END$$;

        # 4) (Opzionale) Rinomina trigger storico per coerenza di naming
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_trigger tg
                  JOIN pg_class t ON t.oid = tg.tgrelid
                  JOIN pg_namespace n ON n.oid = t.relnamespace
                  WHERE n.nspname = 'config'
                    AND t.relname = 'tipi_indirizzi'
                    AND tg.tgname = 'trg_tipi_indirizzi_upd_lock_cod_interno'
                ) THEN
                  EXECUTE 'ALTER TRIGGER trg_tipi_indirizzi_upd_lock_cod_interno ON config.tipi_indirizzi RENAME TO trg_tipi_indirizzi_upd_lock_codice_interno';
                END IF;
              END$$;

      rollback:
        - renameColumn:
            schemaName: config
            tableName: tipi_indirizzi
            oldColumnName: codice_interno
            newColumnName: cod_int_tipo_indirizzo

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_constraint c
                  JOIN pg_class t ON t.oid = c.conrelid
                  JOIN pg_namespace n ON n.oid = t.relnamespace
                  WHERE c.contype = 'u'
                    AND n.nspname = 'config'
                    AND t.relname = 'tipi_indirizzi'
                    AND c.conname = 'uq_tipi_indirizzi_codice_interno'
                ) THEN
                  EXECUTE 'ALTER TABLE config.tipi_indirizzi RENAME CONSTRAINT uq_tipi_indirizzi_codice_interno TO uq_tipi_indirizzi_cod_int_tipo_indirizzo';
                END IF;
              END$$;

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_class i
                  JOIN pg_namespace n ON n.oid = i.relnamespace
                  WHERE i.relkind IN ('i','I')
                    AND n.nspname = 'config'
                    AND i.relname = 'uq_tipi_indirizzi_codice_interno'
                ) THEN
                  EXECUTE 'ALTER INDEX IF EXISTS config.uq_tipi_indirizzi_codice_interno RENAME TO uq_tipi_indirizzi_cod_int_tipo_indirizzo';
                END IF;
              END$$;

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_trigger tg
                  JOIN pg_class t ON t.oid = tg.tgrelid
                  JOIN pg_namespace n ON n.oid = t.relnamespace
                  WHERE n.nspname = 'config'
                    AND t.relname = 'tipi_indirizzi'
                    AND tg.tgname = 'trg_tipi_indirizzi_upd_lock_codice_interno'
                ) THEN
                  EXECUTE 'ALTER TRIGGER trg_tipi_indirizzi_upd_lock_codice_interno ON config.tipi_indirizzi RENAME TO trg_tipi_indirizzi_upd_lock_cod_interno';
                END IF;
              END$$;

  - changeSet:
      id: 20250817-90-tipi_indirizzi-rename-cod_int-to-codice_interno
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250817-08-tipi_indirizzi-rename-cod_int-to-codice_interno


