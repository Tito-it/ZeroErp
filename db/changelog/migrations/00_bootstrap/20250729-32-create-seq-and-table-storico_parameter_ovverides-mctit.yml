databaseChangeLog:
  - changeSet:
      id: 20250729-32-create-seq-and-table-storico_parameter_ovverides
      author: mctit
      runOnChange: true
      validCheckSums: 
        - ANY
      comments: >
        Definisce la sequence e crea la tabella storico.parameter_overrides, 
        quindi aggiunge la FK verso config.parameter_overrides con onUpdate CASCADE e onDelete SET NULL.
      preConditions:
        onFail: MARK_RAN     # se la colonna esiste, il changeSet viene saltato
        onError: CONTINUE
         #  Assicuro che NON esista già la tabella parameter_overrides
        not:
          tableExists:
            schemaName: storico
            tableName: parameter_overrides
            
      changes:
        # 1) Creazione della sequence per id
        - createSequence:
            schemaName: storico
            sequenceName: parameter_overrides_id_seq
            startValue: 1
            incrementBy: 1
            dataType: BIGINT
            remarks: "Sequence per la colonna id di storico.parameter_overrides"

        # 2) Creazione della tabella con id BIGINT default nextval(...)
        - createTable:
            schemaName: storico
            tableName: parameter_overrides
            remarks: "Tabella storica per i parameter_overrides con snapshot JSONB e campi di audit"
            columns:
              - column:
                  name: id
                  type: BIGINT
                  defaultValueComputed: "nextval('storico.parameter_overrides_id_seq'::regclass)"
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_storico_parameter_overrides
                    nullable: false
                  remarks: "Chiave primaria di tipo BIGINT basata su sequence"
              - column:
                  name: valid_from
                  type: Timestamp with time zone
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
                  remarks: "Data di inizio validità del record"
              - column:
                  name: valid_to
                  type: Timestamp with time zone 
                  remarks: "Data di fine validità del record (se conosciuta)"
              - column:
                  name: change_type
                  type: CHAR(1)
                  defaultValue: "A"
                  remarks: "'Tipo di cambiamento: A=Active, S=Suppressed, F=Fused, D=Divided"
              - column:
                  name: data_insert
                  type: TIMESTAMP
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
                  remarks: "Timestamp di inserimento nella tabella storica"
              - column:
                  name: user_insert
                  type: VARCHAR(255)
                  defaultValueComputed: "CURRENT_USER"
                  constraints:
                    nullable: false
                  remarks: "Utente che ha creato questo record storico"
              - column:
                  name: parameter_override_id
                  type: BIGINT
                  constraints:
                    nullable: false
                  remarks: "Riferimento alla tabella config.parameter_overrides"
              - column:
                  name: snapshot
                  type: JSONB
                  constraints:
                    nullable: false
                  remarks: "Snapshot JSONB dei dati parameter_overrides al momento dell'operazione"
              - column:
                  name: tipo_operazione
                  type: SMALLINT
                  remarks: "Codice del tipo di operazione applicata"
              - column:
                  name: tx_id
                  type: UUID
                  remarks: "UUID di transazione per correlare più operazioni"
  
        # 3) Ricreazione del FK su storico.parameter_overrides verso la nuova PK
        - addForeignKeyConstraint:
            constraintName: fk_storico_parameter_overrides_config_parameter_overrides
            baseTableSchemaName: storico
            baseTableName: parameter_overrides
            baseColumnNames: parameter_override_id
            referencedTableSchemaName: config
            referencedTableName: parameter_overrides
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: SET NULL

        - createIndex:
            indexName: ix_storico_parameter_overrides_parameter_override_id
            schemaName: storico
            tableName: parameter_overrides
            columns:
              - column:
                  name: parameter_override_id   

 # Metto un  tag fine modifiche
  - changeSet:
        id: 20250729-90-create-seq-and-table-storico_parameter_overrides
        author: mctit
        changes:
          - tagDatabase:
              tag: 20250729-32-create-seq-and-table-storico_parameter_overrides