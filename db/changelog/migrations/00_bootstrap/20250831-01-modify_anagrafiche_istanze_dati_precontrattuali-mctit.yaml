databaseChangeLog:


- changeSet:
    id: 20250831-01-uq-idp-istanza_utility_id-utility_id
    author: mctit
    runOnChange: true
    validCheckSums:
          - ANY
    preConditions:
      - onFail: HALT
      - tableExists:
          schemaName: anagrafiche
          tableName: istanze_dati_precontrattuali
        # Blocca se esistono già duplicati
      - sqlCheck:
          expectedResult: "0"
          sql: |
              SELECT COUNT(*) FROM (
                SELECT 1
                  FROM anagrafiche.istanze_dati_precontrattuali
                 GROUP BY istanza_utility_id, utility_id
                HAVING COUNT(*) > 1
              ) d;
        # Evita la ricreazione se il vincolo esiste già
      - not:
          uniqueConstraintExists:
            schemaName: anagrafiche
            tableName: istanze_dati_precontrattuali
            constraintName: uq_istanze_dati_precontrattuali_istanza_utility_id_utility_id
    changes:
        - addUniqueConstraint:
            schemaName: anagrafiche
            tableName: istanze_dati_precontrattuali
            columnNames: istanza_utility_id, utility_id
            constraintName: uq_istanze_dati_precontrattuali_id_utility_id
  
- changeSet:
      id: 20250831-90-modify_anagrafiche_istanze_dati_precontrattuali
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250831-01-modify_anagrafiche_istanze_dati_precontrattuali