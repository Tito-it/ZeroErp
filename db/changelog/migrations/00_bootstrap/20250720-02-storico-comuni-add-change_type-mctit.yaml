databaseChangeLog:
  - changeSet:
      id: 20250720-02-storico-comuni-add-change_type
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      preConditions:
        onFail: MARK_RAN     # se la colonna esiste, il changeSet viene saltato
        onError: CONTINUE
        not:
            columnExists:
              schemaName: storico
              tableName: comuni
              columnName: change_type
      changes:
        - addColumn:
            schemaName: storico
            tableName: comuni
            columns:
              - column:
                  name: change_type
                  type: char(1)
                  remarks: "tipo cambiamento (A=attivo , S=Soppresso, F=Fuso, D=Diviso)"   
                  defaultValue: 'A'
                  constraints:
                    nullable: false
  - changeSet:
      id: 20250720-03-storico-comuni-add-change_type
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      changes:
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
               COMMENT ON COLUMN storico.comuni.change_type
                IS  'Tipo di cambiamento: A=Active, S=Suppressed, F=Fused, D=Divided'       
             
  - changeSet:
      id: 20250720-90-storico-comuni-add-change_type
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250720-02-storico-comuni-add-change_type