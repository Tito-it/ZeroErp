databaseChangeLog:
  - changeSet:
      id: 20250728-02-create-seq-and-table-storico_dati_societari
      author: mctit
      runOnChange: true
      validCheckSums: 
        - ANY
      comments: >
        Definisce la sequence e crea la tabella storico.dati_societari, 
        quindi aggiunge la FK verso anagrafiche.dati_societari con onUpdate CASCADE e onDelete SET NULL.
      preConditions:
        onFail: MARK_RAN     # se la colonna esiste, il changeSet viene saltato
        onError: CONTINUE
         #  Assicuro che NON esista già la tabella dati_societari
        not:
          tableExists:
            schemaName: storico
            tableName: dati_societari
            
      changes:
        # 1) Creazione della sequence per id
        - createSequence:
            schemaName: storico
            sequenceName: dati_societari_id_seq
            startValue: 1
            incrementBy: 1
            dataType: BIGINT
            remarks: "Sequence per la colonna id di storico.dati_societari"

        # 2) Creazione della tabella con id BIGINT default nextval(...)
        - createTable:
            schemaName: storico
            tableName: dati_societari
            remarks: "Tabella storica per i dati_societari con snapshot JSONB e campi di audit"
            columns:
              - column:
                  name: id
                  type: BIGINT
                  defaultValueComputed: "nextval('storico.dati_societari_id_seq'::regclass)"
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_storico_dati_societari
                    nullable: false
                  remarks: "Chiave primaria di tipo BIGINT basata su sequence"
              - column:
                  name: valid_from
                  type: Timestamp with time zone
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
                  remarks: "Data di inizio validità del record"
              - column:
                  name: valid_to
                  type: Timestamp with time zone 
                  remarks: "Data di fine validità del record (se conosciuta)"
              - column:
                  name: change_type
                  type: CHAR(1)
                  defaultValue: "A"
                  remarks: "'A'=Add, 'U'=Update, 'D'=Delete"
              - column:
                  name: data_insert
                  type: TIMESTAMP
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
                  remarks: "Timestamp di inserimento nella tabella storica"
              - column:
                  name: user_insert
                  type: VARCHAR(255)
                  defaultValueComputed: "CURRENT_USER"
                  constraints:
                    nullable: false
                  remarks: "Utente che ha creato questo record storico"
              - column:
                  name: dati_societari_id
                  type: BIGINT
                  constraints:
                    nullable: false
                  remarks: "Riferimento alla tabella anagrafiche.dati_societari"
              - column:
                  name: snapshot
                  type: JSONB
                  constraints:
                    nullable: false
                  remarks: "Snapshot JSONB dei dati dati_societari al momento dell'operazione"
              - column:
                  name: tipo_operazione
                  type: SMALLINT
                  remarks: "Codice del tipo di operazione applicata"
              - column:
                  name: tx_id
                  type: UUID
                  remarks: "UUID di transazione per correlare più operazioni"
  
        # 3) Ricreazione del FK su storico.dati_societari verso la nuova PK
        - addForeignKeyConstraint:
            constraintName: fk_storico_dati_societari_anagrafiche_dati_societari
            baseTableSchemaName: storico
            baseTableName: dati_societari
            baseColumnNames: dati_societari_id
            referencedTableSchemaName: anagrafiche
            referencedTableName: dati_societari
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: SET NULL
                                    
 # Metto un  tag fine modifiche
  - changeSet:
        id: 20250728-90-create-seq-and-table-storico_dati_societari
        author: mctit
        changes:
          - tagDatabase:
              tag: 20250728-01-create-seq-and-table-storico_dati_societari