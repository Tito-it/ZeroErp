databaseChangeLog:
  - changeSet:
      id: 20250723-11-anagrafiche_indirizzi_dettaglio_modify_add_attivo_storico
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      preConditions:
        onFail: MARK_RAN     # se la colonna esiste, il changeSet viene saltato
        onError: CONTINUE
         #  Assicuro che NON esista ancora tx_id
        not:
          columnExists:
            schemaName: anagrafiche
            tableName: indirizzi_dettaglio
            columnName: storicizza

      changes:
        # 1) Aggiunta della colonna tx_id se non esiste
        - addColumn:
            schemaName: anagrafiche
            tableName: indirizzi_dettaglio
            columns:
              - column:
                  name: attivo
                  type: BOOLEAN
                  defaultValueBoolean: true     
                  constraints:
                    nullable: false
                  remarks: "Attivo/Disattivo"
              - column:
                  name: storicizza
                  type: BOOLEAN
                  defaultValueBoolean: false     
                  constraints:
                    nullable: false
                  remarks: "Storicizza Default=True"  
  - changeSet:
      id: 20250724-06-drop-generated-from-indirizzo_normalizzato
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      comments: >
        Rimuove la definizione GENERATED ALWAYS AS (…) STORED dalla colonna
        indirizzo_normalizzato e la trasforma in semplice TEXT.
      preConditions:
        onFail: MARK_RAN     # se la colonna esiste, il changeSet viene saltato
        onError: CONTINUE
         #  Assicuro che NON esista ancora tx_id
        not:
          columnExists:
            schemaName: anagrafiche
            tableName: indirizzi_dettaglio
            columnName: indirizzo_normalizzato
      changes:
        - sql:
            comment: "1) Rimuove l’espressione GENERATED dalla colonna"
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE anagrafiche.indirizzi_dettaglio
                ALTER COLUMN indirizzo_normalizzato DROP EXPRESSION;
         
  - changeSet:
      id: 20250723-90-anagrafiche_indirizzi_dettaglio_modify_add_attivo_storico
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250723-11-anagrafiche_indirizzi_dettaglio_modify_add_attivo_storico