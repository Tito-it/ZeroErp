# Zero ERP — Vendite: registri_fatturazione
# ------------------------------------------------------------
databaseChangeLog:
  - changeSet:
      id: 20250903-05-create-vendita_registri_fatturazione
      author: mctit

      changes:
        - createTable:
            schemaName: vendite
            tableName: registri_fatturazione
            remarks: "Registri/serie di numerazione per fatture di vendita (per emittente/brand)."
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, generationType: BY DEFAULT, constraints: { primaryKey: true, primaryKeyName: pk_regfatt, nullable: false }, remarks: "PK" }
              - column: { name: uid, type: UUID, defaultValueComputed: gen_random_uuid(), constraints: { nullable: false }, remarks: "Identificatore esterno (UUID) per API/integrazioni." }
              - column: { name: codice, type: VARCHAR(16), constraints: { nullable: false }, remarks: "Codice univoco registro (es. VEND-GESTORE, VEND-RESELLER-X)" }
              - column: { name: descrizione, type: VARCHAR(120), constraints: { nullable: false }, remarks: "Descrizione registro" }
              - column: { name: emittente_soggetto_ruolo_id, type: BIGINT, constraints: { nullable: false }, remarks: "Ruolo che emette fiscalmente (lega numerazione, intestazione, IBAN)." }
              - column: { name: serie_default, type: VARCHAR(8), remarks: "Serie di default associata al registro" }
              - column: { name: reset_policy, type: VARCHAR(8), defaultValue: "ANNUALE", constraints: { nullable: false }, remarks: "Politica reset progressivi: NESSUNA|ANNUALE|MENSILE." }
              - column: { name: attivo, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false }, remarks: "Se TRUE, registro utilizzabile" }
              - column: { name: meta, type: JSONB, defaultValue: "{}", constraints: { nullable: false }, remarks: "Estensioni JSON" }
              - column: { name: tx_id, type: UUID, remarks: "Id transazione" }
              - column: { name: storicizza, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false }, remarks: "Snapshot su UPDATE/DELETE" }
              - column: { name: data_insert, type: TIMESTAMPTZ, defaultValueComputed: now(), constraints: { nullable: false }, remarks: "Audit: data inserimento" }
              - column: { name: user_insert, type: VARCHAR(80), defaultValueComputed: CURRENT_USER, constraints: { nullable: false }, remarks: "Audit: utente inserimento" }
              - column: { name: data_update, type: TIMESTAMPTZ, defaultValueComputed: now(), constraints: { nullable: false }, remarks: "Audit: data aggiornamento" }
              - column: { name: user_update, type: VARCHAR(80), defaultValueComputed: CURRENT_USER, remarks: "Audit: utente aggiornamento" }

        # Vincoli unici
        - addUniqueConstraint:
            schemaName: vendite
            tableName: registri_fatturazione
            columnNames: codice
            constraintName: uq_registri_fatturazione_codice

        - addUniqueConstraint:
            schemaName: vendite
            tableName: registri_fatturazione
            columnNames: uid
            constraintName: uq_registri_fatturazione_uid

        # Foreign key
        - addForeignKeyConstraint:
            baseTableSchemaName: vendite
            baseTableName: registri_fatturazione
            baseColumnNames: emittente_soggetto_ruolo_id
            constraintName: fk_registri_fatturazione_emitt
            referencedTableSchemaName: anagrafiche
            referencedTableName: soggetti_ruoli
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: NO ACTION

        
        # Check constraint
        - sql:
            splitStatements: false
            sql: |

              ALTER TABLE vendite.registri_fatturazione
              ADD CONSTRAINT chk_registri_fatturazione_reset
              CHECK (reset_policy IN ('NESSUNA','ANNUALE','MENSILE'));

      
# Metto un  tag fine modifiche
  - changeSet:
      id: 20250903-90-create-vendita_registri_fatturazione
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250903-05-create-vendita_registri_fatturazione