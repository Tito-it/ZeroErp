# ==============================
# 3) TAB. RETTIFICHE: vendite.fatture_rettifiche
# Associa più documenti rettificanti a uno o più rettificati (N:N)
# ==============================
databaseChangeLog:
  - changeSet:
      id: 20250904-07-create_vendite_fatture_indirizzi
      author: mctit
      runOnChange: true
      changes:
       
        - createTable:
            schemaName: vendite
            tableName: fatture_indirizzi
            remarks: "Snapshot indirizzi collegati alla fattura; uno per tipo (fatturazione, spedizione, fornitura, residenza). Includere nello snapshot la mail."
            columns:
                  - column:
                        name: id
                        type: BIGINT 
                        remarks: "PK "
                        autoIncrement: true
                        generationType: BY DEFAULT
                        constraints:
                          primaryKey: true
                          primaryKeyName: pk_fatture_indirizzi
                          nullable: false
                  
                  - column:
                        name: fattura_id
                        type: BIGINT
                        remarks: "FK → vendite.fatture(id)."
                        constraints:
                          nullable: false
                  - column:
                        name: tipo_indirizzo_id
                        type: BIGINT
                        remarks: "FK → config.tipi_indirizzi(id). Sostituisce fatture_indirizzi.tipo_indirizzo (string)."
                  - column:
                        name: snapshot
                        type: JSONB
                        defaultValueComputed: "'{}'::jsonb"
                        remarks: "Snapshot completo dell'indirizzo al momento dell'emissione."
                        constraints:
                          nullable: false



        - addUniqueConstraint:
                  schemaName: vendite
                  tableName: fatture_indirizzi
                  columnNames: fattura_id, tipo_indirizzo_id
                  constraintName: uq_fatture_indirizzi_uno_per_tipo_


        - addForeignKeyConstraint:
                  baseTableSchemaName: vendite
                  baseTableName: fatture_indirizzi
                  baseColumnNames: fattura_id
                  constraintName: fk_fatture_indir_fattura
                  referencedTableSchemaName: vendite
                  referencedTableName: fatture
                  referencedColumnNames: id
                  onDelete: CASCADE
                  onUpdate: CASCADE
        # 3) Vincolo FK + NOT NULL
        - addForeignKeyConstraint:
                  baseTableSchemaName: vendite
                  baseTableName: fatture_indirizzi
                  baseColumnNames: tipo_indirizzo_id
                  constraintName: fk_fatture_indir_tipo
                  referencedTableSchemaName: config
                  referencedTableName: tipi_indirizzi
                  referencedColumnNames: id
                  onUpdate: CASCADE
                  onDelete: NO ACTION
        - addNotNullConstraint:
                  schemaName: vendite
                  tableName: fatture_indirizzi
                  columnName: tipo_indirizzo_id
                  constraintName: nn_fatture_indir_tipo_id          


        - createIndex:
                  schemaName: vendite
                  tableName: fatture_indirizzi
                  indexName: ix_fatture_indir_fattura
                  columns:
                  - column: { name: fattura_id }
          

        - sql:
                 sql: |
                  COMMENT ON CONSTRAINT fk_fatture_indir_fattura ON vendite.fatture_indirizzi IS 'FK → vendite.fatture(id)';
                  COMMENT ON CONSTRAINT fk_fatture_indir_tipo ON vendite.fatture_indirizzi IS 'FK → anagrafiche.indirizzi(id)';



# Metto un  tag fine modifiche
  - changeSet:
      id: 20250904-90-create_vendite_fatture_indirizzi
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250904-07-create_vendite_fatture_indirizzi