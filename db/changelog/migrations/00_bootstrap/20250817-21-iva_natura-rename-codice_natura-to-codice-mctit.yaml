databaseChangeLog:
  - changeSet:
      id: 20250817-21-iva_natura-rename-codice_natura-to-codice
      author: mctit
      context: ddl
      runOnChange: true
      failOnError: true

      preConditions:
        - onFail: HALT
        - onError: HALT
        - and:
            - tableExists:
                schemaName: config
                tableName: iva_natura
            - columnExists:
                schemaName: config
                tableName: iva_natura
                columnName: codice_natura
            - not:
                - columnExists:
                    schemaName: config
                    tableName: iva_natura
                    columnName: codice

      changes:
        # 1) Rinomina colonna
        - renameColumn:
            schemaName: config
            tableName: iva_natura
            oldColumnName: codice_natura
            newColumnName: codice

        # 2) (Opz.) Rinomina eventuale vincolo UNIQUE storico verso il nome standard
        #    La doc attuale usa già 'uq_iva_natura_codice' -> nessuna azione se assente
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_constraint c
                  JOIN pg_class t ON t.oid = c.conrelid
                  JOIN pg_namespace n ON n.oid = t.relnamespace
                  WHERE c.contype = 'u'
                    AND n.nspname = 'config'
                    AND t.relname = 'iva_natura'
                    AND c.conname = 'uq_iva_natura_codice_natura'
                ) THEN
                  EXECUTE 'ALTER TABLE config.iva_natura RENAME CONSTRAINT uq_iva_natura_codice_natura TO uq_iva_natura_codice';
                END IF;
              END$$;

        # 3) (Opz.) Rinomina eventuale indice standalone storico
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_class i
                  JOIN pg_namespace n ON n.oid = i.relnamespace
                  WHERE i.relkind IN ('i','I')
                    AND n.nspname = 'config'
                    AND i.relname = 'uq_iva_natura_codice_natura'
                ) THEN
                  EXECUTE 'ALTER INDEX IF EXISTS config.uq_iva_natura_codice_natura RENAME TO uq_iva_natura_codice';
                END IF;
              END$$;

      rollback:
        - renameColumn:
            schemaName: config
            tableName: iva_natura
            oldColumnName: codice
            newColumnName: codice_natura

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_constraint c
                  JOIN pg_class t ON t.oid = c.conrelid
                  JOIN pg_namespace n ON n.oid = t.relnamespace
                  WHERE c.contype = 'u'
                    AND n.nspname = 'config'
                    AND t.relname = 'iva_natura'
                    AND c.conname = 'uq_iva_natura_codice'
                ) THEN
                  EXECUTE 'ALTER TABLE config.iva_natura RENAME CONSTRAINT uq_iva_natura_codice TO uq_iva_natura_codice_natura';
                END IF;
              END$$;

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_class i
                  JOIN pg_namespace n ON n.oid = i.relnamespace
                  WHERE i.relkind IN ('i','I')
                    AND n.nspname = 'config'
                    AND i.relname = 'uq_iva_natura_codice'
                ) THEN
                  EXECUTE 'ALTER INDEX IF EXISTS config.uq_iva_natura_codice RENAME TO uq_iva_natura_codice_natura';
                END IF;
              END$$;


  - changeSet:
      id: 20250817-99-iva_natura-rename-codice_natura-to-codice
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250817-21-iva_natura-rename-codice_natura-to-codice