databaseChangeLog:

  - changeSet:
      id: 20250826-02-scope-tablelike-all
      author: mctit
      runOnChange: true
      validCheckSums:
          - ANY
      changes:
        - sql:
            splitStatements: false
            sql: |
 
               DO $$
                    BEGIN
                      PERFORM 1
                      FROM information_schema.columns
                      WHERE table_schema='dbops' AND table_name='automation_scope'
                        AND column_name='table_like'
                        AND column_default IS NOT NULL;
                      IF NOT FOUND THEN
                        ALTER TABLE dbops.automation_scope
                          ALTER COLUMN table_like SET DEFAULT '*all';
                        COMMENT ON COLUMN dbops.automation_scope.table_like
                          IS 'Filtro tabellare: ''*all'' = tutte; altrimenti pattern LIKE';
                      END IF;
                    END$$;
                  
  - changeSet:
      id: 220250826-90-scope-tablelike-null
      author: mctit
      changes:
        - tagDatabase:
            tag: 220250826-02-scope-tablelike-null