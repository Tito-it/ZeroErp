databaseChangeLog:
  - changeSet:
      id: 20250817-10-tipi_documenti-rename-cod_tipo_documento-to-codice
      author: mctit
      context: ddl
      runOnChange: true
      failOnError: true

      preConditions:
        - onFail: HALT
        - onError: HALT
        - and:
            - tableExists:
                schemaName: config
                tableName: tipi_documenti
            - columnExists:
                schemaName: config
                tableName: tipi_documenti
                columnName: cod_tipo_documento
            - not:
                - columnExists:
                    schemaName: config
                    tableName: tipi_documenti
                    columnName: codice

      changes:
        # 1) Rinomina colonna
        - renameColumn:
            schemaName: config
            tableName: tipi_documenti
            oldColumnName: cod_tipo_documento
            newColumnName: codice

        # 2) Rinomina vincolo UNIQUE se presente come constraint
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_constraint c
                  JOIN pg_class t ON t.oid = c.conrelid
                  JOIN pg_namespace n ON n.oid = t.relnamespace
                  WHERE c.contype = 'u'
                    AND n.nspname = 'config'
                    AND t.relname = 'tipi_documenti'
                    AND c.conname = 'uq_tipi_documenti_cod_tipo_documento'
                ) THEN
                  EXECUTE 'ALTER TABLE config.tipi_documenti RENAME CONSTRAINT uq_tipi_documenti_cod_tipo_documento TO uq_tipi_documenti_codice';
                END IF;
              END$$;

        # 3) Rinomina indice se presente come indice unico "standalone"
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_class i
                  JOIN pg_namespace n ON n.oid = i.relnamespace
                  WHERE i.relkind IN ('i','I')
                    AND n.nspname = 'config'
                    AND i.relname = 'uq_tipi_documenti_cod_tipo_documento'
                ) THEN
                  EXECUTE 'ALTER INDEX IF EXISTS config.uq_tipi_documenti_cod_tipo_documento RENAME TO uq_tipi_documenti_codice';
                END IF;
              END$$;

      rollback:
        - renameColumn:
            schemaName: config
            tableName: tipi_documenti
            oldColumnName: codice
            newColumnName: cod_tipo_documento

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_constraint c
                  JOIN pg_class t ON t.oid = c.conrelid
                  JOIN pg_namespace n ON n.oid = t.relnamespace
                  WHERE c.contype = 'u'
                    AND n.nspname = 'config'
                    AND t.relname = 'tipi_documenti'
                    AND c.conname = 'uq_tipi_documenti_codice'
                ) THEN
                  EXECUTE 'ALTER TABLE config.tipi_documenti RENAME CONSTRAINT uq_tipi_documenti_codice TO uq_tipi_documenti_cod_tipo_documento';
                END IF;
              END$$;

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_class i
                  JOIN pg_namespace n ON n.oid = i.relnamespace
                  WHERE i.relkind IN ('i','I')
                    AND n.nspname = 'config'
                    AND i.relname = 'uq_tipi_documenti_codice'
                ) THEN
                  EXECUTE 'ALTER INDEX IF EXISTS config.uq_tipi_documenti_codice RENAME TO uq_tipi_documenti_cod_tipo_documento';
                END IF;
              END$$;

  - changeSet:
      id: 20250817-90-tipi_documenti-rename-cod_tipo_documento-to-codice
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250817-10-tipi_documenti-rename-cod_tipo_documento-to-codice