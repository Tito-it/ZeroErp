            schemaName: anagrafiche
            tableName: gestori
            columns:
              - column:
                  name: valuta_id
        - createIndex:
            indexName: ix_anagrafiche_gestori_utilities_ruoli_gestore_id
            schemaName: anagrafiche
            tableName: gestori_utilities_ruoli
            columns:
              - column:
                  name: gestore_id
        - createIndex:
            indexName: ix_anagrafiche_gestori_utilities_ruoli_ruolo_id
