databaseChangeLog:
  - changeSet:
      id: 20250819-20-create-vendite-articoli-tipologie
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY 
      changes:
        # 0) Schema e sequenza PK
        - sql:
            splitStatements: false
            sql: |
              CREATE SCHEMA IF NOT EXISTS vendite;
        - createSequence:
            schemaName: vendite
            sequenceName: articoli_tipologie_id_seq
            startValue: 1
            incrementBy: 1
            minValue: 1

        # 1) Tabella
        - createTable:
            schemaName: vendite
            tableName: articoli_tipologie
            remarks: "Tipologie/categorie degli articoli, utili per riepiloghi e fatturazione"
            columns:
              - column:
                  name: id
                  type: INTEGER
                  defaultValueComputed: "nextval('vendite.articoli_tipologie_id_seq'::regclass)"
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_articoli_tipologie
                    nullable: false
              - column:
                  name: codice
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: descrizione
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: descrizione_breve
                  type: VARCHAR(60)
              - column:
                  name: attivo
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: user_insert
                  type: VARCHAR(30)
                  defaultValueComputed: CURRENT_USER
                  constraints:
                    nullable: false
              - column:
                  name: user_update
                  type: VARCHAR(30)
                  defaultValueComputed: CURRENT_USER
              - column:
                  name: data_insert
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: data_update
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false

        # 2) Vincoli e indice
        - addUniqueConstraint:
            schemaName: vendite
            tableName: articoli_tipologie
            columnNames: codice
            constraintName: uq_articoli_tipologie_codice

        - sql:
            splitStatements: false
            sql: |
              CREATE INDEX IF NOT EXISTS ix_articoli_tipologie_codice_upper
              ON vendite.articoli_tipologie (upper(codice));

        # 3) Trigger audit
        - sql:
            splitStatements: false
            sql: |
              CREATE OR REPLACE TRIGGER trg_upd_articoli_tipologie_audit_data_user
                BEFORE UPDATE ON vendite.articoli_tipologie
                FOR EACH ROW
                EXECUTE FUNCTION script.trgfn_upd_audit_data_user_generic();

        # 4) Commenti (tabella, colonne, constraint, indice, trigger)
        - sql:
            splitStatements: false
            sql: |
              COMMENT ON TABLE vendite.articoli_tipologie
                IS 'Tipologie/categorie degli articoli, utili per riepiloghi e fatturazione';
              COMMENT ON COLUMN vendite.articoli_tipologie.id
                IS 'Id.Tipologia (sequence vendite.articoli_tipologie_id_seq)';
              COMMENT ON COLUMN vendite.articoli_tipologie.codice
                IS 'Codice univoco tipologia';
              COMMENT ON COLUMN vendite.articoli_tipologie.descrizione
                IS 'Descrizione estesa della tipologia';
              COMMENT ON COLUMN vendite.articoli_tipologie.descrizione_breve
                IS 'Descrizione breve (max 60 caratteri)';
              COMMENT ON COLUMN vendite.articoli_tipologie.attivo
                IS 'Flag attivo/non attivo';
              COMMENT ON COLUMN vendite.articoli_tipologie.user_insert
                IS 'Utente che ha effettuato l''inserimento';
              COMMENT ON COLUMN vendite.articoli_tipologie.user_update
                IS 'Utente ultima modifica';
              COMMENT ON COLUMN vendite.articoli_tipologie.data_insert
                IS 'Data inserimento';
              COMMENT ON COLUMN vendite.articoli_tipologie.data_update
                IS 'Data ultima modifica';

              COMMENT ON CONSTRAINT uq_articoli_tipologie_codice ON vendite.articoli_tipologie
                IS 'Key: codice tipologia univoco';

              COMMENT ON INDEX vendite.ix_articoli_tipologie_codice_upper
                IS 'Ricerca case-insensitive su codice (upper(codice))';

              COMMENT ON TRIGGER trg_upd_articoli_tipologie_audit_data_user ON vendite.articoli_tipologie
                IS 'Aggiorna (audit) data_update e user_update al BEFORE UPDATE';
