databaseChangeLog:
  - changeSet:
      id: 20250817-03-utilities-rename-cd_int_utility-to-codice_interno
      author: mctit
      context: ddl
      runOnChange: true
      failOnError: true

      preConditions:
        - onFail: HALT
        - onError: HALT
        - and:
            - tableExists:
                schemaName: config
                tableName: utilities
            - columnExists:
                schemaName: config
                tableName: utilities
                columnName: cd_int_utility
            - not:
                - columnExists:
                    schemaName: config
                    tableName: utilities
                    columnName: codice_interno

      changes:
        # 1) Rinomina colonna
        - renameColumn:
            schemaName: config
            tableName: utilities
            oldColumnName: cd_int_utility
            newColumnName: codice_interno
            columnDataType: varchar(10)

        # 2) Rinomina vincolo UNIQUE se presente come constraint
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_constraint c
                  JOIN pg_class t ON t.oid = c.conrelid
                  JOIN pg_namespace n ON n.oid = t.relnamespace
                  WHERE c.contype = 'u'
                    AND n.nspname = 'config'
                    AND t.relname = 'utilities'
                    AND c.conname = 'uq_utilities_cd_int_utility'
                ) THEN
                  EXECUTE 'ALTER TABLE config.utilities RENAME CONSTRAINT uq_utilities_cd_int_utility TO uq_utilities_codice_interno';
                END IF;
              END$$;

        # 3) Rinomina indice se presente come indice unico "standalone"
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_class i
                  JOIN pg_namespace n ON n.oid = i.relnamespace
                  WHERE i.relkind IN ('i','I')
                    AND n.nspname = 'config'
                    AND i.relname = 'uq_utilities_cd_int_utility'
                ) THEN
                  EXECUTE 'ALTER INDEX IF EXISTS config.uq_utilities_cd_int_utility RENAME TO uq_utilities_codice_interno';
                END IF;
              END$$;

        # 4) (Opzionale) rinomina del trigger per coerenza di naming
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_trigger tg
                  JOIN pg_class t ON t.oid = tg.tgrelid
                  JOIN pg_namespace n ON n.oid = t.relnamespace
                  WHERE n.nspname = 'config'
                    AND t.relname = 'utilities'
                    AND tg.tgname = 'trg_utilities_upd_lock_codiceinterno'
                ) THEN
                  -- Già coerente, niente da fare
                  NULL;
                ELSIF EXISTS (
                  SELECT 1
                  FROM pg_trigger tg
                  JOIN pg_class t ON t.oid = tg.tgrelid
                  JOIN pg_namespace n ON n.oid = t.relnamespace
                  WHERE n.nspname = 'config'
                    AND t.relname = 'utilities'
                    AND tg.tgname = 'trg_utilities_upd_lock_cd_int_utility'
                ) THEN
                  EXECUTE 'ALTER TRIGGER trg_utilities_upd_lock_cd_int_utility ON config.utilities RENAME TO trg_utilities_upd_lock_codiceinterno';
                END IF;
              END$$;

      rollback:
        - renameColumn:
            schemaName: config
            tableName: utilities
            oldColumnName: codice_interno
            newColumnName: cd_int_utility
            columnDataType: varchar(10)

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_constraint c
                  JOIN pg_class t ON t.oid = c.conrelid
                  JOIN pg_namespace n ON n.oid = t.relnamespace
                  WHERE c.contype = 'u'
                    AND n.nspname = 'config'
                    AND t.relname = 'utilities'
                    AND c.conname = 'uq_utilities_codice_interno'
                ) THEN
                  EXECUTE 'ALTER TABLE config.utilities RENAME CONSTRAINT uq_utilities_codice_interno TO uq_utilities_cd_int_utility';
                END IF;
              END$$;

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_class i
                  JOIN pg_namespace n ON n.oid = i.relnamespace
                  WHERE i.relkind IN ('i','I')
                    AND n.nspname = 'config'
                    AND i.relname = 'uq_utilities_codice_interno'
                ) THEN
                  EXECUTE 'ALTER INDEX IF EXISTS config.uq_utilities_codice_interno RENAME TO uq_utilities_cd_int_utility';
                END IF;
              END$$;

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_trigger tg
                  JOIN pg_class t ON t.oid = tg.tgrelid
                  JOIN pg_namespace n ON n.oid = t.relnamespace
                  WHERE n.nspname = 'config'
                    AND t.relname = 'utilities'
                    AND tg.tgname = 'trg_utilities_upd_lock_codiceinterno'
                ) THEN
                  EXECUTE 'ALTER TRIGGER trg_utilities_upd_lock_codiceinterno ON config.utilities RENAME TO trg_utilities_upd_lock_cd_int_utility';
                END IF;
              END$$;


  - changeSet:
      id: 20250817-90-utilities-rename-cd_int_utility-to-codice_interno
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250817-03-utilities-rename-cd_int_utility-to-codice_interno