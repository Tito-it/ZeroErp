databaseChangeLog:
  - changeSet:
      id: 20250817-13-tipi_contatti-rename-cod_tipo_contatto-to-codice
      author: mctit
      context: ddl
      runOnChange: true
      failOnError: true

      preConditions:
        - onFail: HALT
        - onError: HALT
        - and:
            - tableExists:
                schemaName: config
                tableName: tipi_contatti
            - columnExists:
                schemaName: config
                tableName: tipi_contatti
                columnName: cod_tipo_contatto
            - not:
                - columnExists:
                    schemaName: config
                    tableName: tipi_contatti
                    columnName: codice

      changes:
        # 1) Rinomina colonna
        - renameColumn:
            schemaName: config
            tableName: tipi_contatti
            oldColumnName: cod_tipo_contatto
            newColumnName: codice

        # 2) Rinomina vincolo UNIQUE, se esiste (storico: uq_tipi_contatti_cod_tipo_contatto)
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_constraint c
                  JOIN pg_class t ON t.oid = c.conrelid
                  JOIN pg_namespace n ON n.oid = t.relnamespace
                  WHERE c.contype = 'u'
                    AND n.nspname = 'config'
                    AND t.relname = 'tipi_contatti'
                    AND c.conname = 'uq_tipi_contatti_cod_tipo_contatto'
                ) THEN
                  EXECUTE 'ALTER TABLE config.tipi_contatti RENAME CONSTRAINT uq_tipi_contatti_cod_tipo_contatto TO uq_tipi_contatti_codice';
                END IF;
              END$$;

        # 3) Rinomina indice standalone, se esiste (storico: uq_tipi_contatti_cod_tipo_contatto)
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_class i
                  JOIN pg_namespace n ON n.oid = i.relnamespace
                  WHERE i.relkind IN ('i','I')
                    AND n.nspname = 'config'
                    AND i.relname = 'uq_tipi_contatti_cod_tipo_contatto'
                ) THEN
                  EXECUTE 'ALTER INDEX IF EXISTS config.uq_tipi_contatti_cod_tipo_contatto RENAME TO uq_tipi_contatti_codice';
                END IF;
              END$$;

      rollback:
        - renameColumn:
            schemaName: config
            tableName: tipi_contatti
            oldColumnName: codice
            newColumnName: cod_tipo_contatto

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_constraint c
                  JOIN pg_class t ON t.oid = c.conrelid
                  JOIN pg_namespace n ON n.oid = t.relnamespace
                  WHERE c.contype = 'u'
                    AND n.nspname = 'config'
                    AND t.relname = 'tipi_contatti'
                    AND c.conname = 'uq_tipi_contatti_codice'
                ) THEN
                  EXECUTE 'ALTER TABLE config.tipi_contatti RENAME CONSTRAINT uq_tipi_contatti_codice TO uq_tipi_contatti_cod_tipo_contatto';
                END IF;
              END$$;

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_class i
                  JOIN pg_namespace n ON n.oid = i.relnamespace
                  WHERE i.relkind IN ('i','I')
                    AND n.nspname = 'config'
                    AND i.relname = 'uq_tipi_contatti_codice'
                ) THEN
                  EXECUTE 'ALTER INDEX IF EXISTS config.uq_tipi_contatti_codice RENAME TO uq_tipi_contatti_cod_tipo_contatto';
                END IF;
              END$$;

  - changeSet:
      id: 20250817-90-tipi_contatti-rename-cod_tipo_contatto-to-codice
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250817-13-tipi_contatti-rename-cod_tipo_contatto-to-codice