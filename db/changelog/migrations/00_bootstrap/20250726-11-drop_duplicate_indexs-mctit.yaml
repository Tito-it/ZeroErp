databaseChangeLog:
  - changeSet:
      id: 20250726-11-drop_duplicate_indexs
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      preConditions:
        onError: HALT    # se c’è un errore nella verifica, 
        onFail: CONTINUE     # se l’indice non esiste, salta il changeSet
        indexExists:
            schemaName: storico
            tableName: stradario
            indexName: ix_stradario_stradario_id
      changes:
            
         #1) Drop key
        - dropIndex:
            schemaName: storico
            tableName: stradario
            indexName: ix_stradario_stradario_id
            


  - changeSet:
      id: 20250726-01-drop-uq-indirizzi-dettaglio-norm
      author: mctit
      preConditions:
        onFail: HALT
        onError: CONTINUE
        uniqueConstraintExists:
            schemaName: anagrafiche
            tableName: indirizzi_dettaglio
            constraintName: uq_indirizzi_dettaglio_norm
      changes:
        - dropUniqueConstraint:
            schemaName: anagrafiche
            tableName: indirizzi_dettaglio
            constraintName: uq_indirizzi_dettaglio_norm
        
  - changeSet:
      id: 20250726-90-drop_duplicate_indexs
      author: mctit
      changes:
        - tagDatabase:
            tag: 220250726-11-drop_duplicate_indexs