# ------------------------------------------------------------
# Zero ERP – Billing Account: rename account_code -> codice
# Tabella: anagrafiche.billing_account
# ------------------------------------------------------------
databaseChangeLog:
  - changeSet:
      id: 20250817-28-billing_account-rename-account_code-to-codice
      author: mctit
      context: ddl
      runOnChange: true
      failOnError: true

      preConditions:
        - onFail: HALT
        - onError: HALT
        - and:
            - tableExists:
                schemaName: anagrafiche
                tableName: billing_account
            - columnExists:
                schemaName: anagrafiche
                tableName: billing_account
                columnName: account_code
            - not:
                - columnExists:
                    schemaName: anagrafiche
                    tableName: billing_account
                    columnName: codice

      changes:
        # 1) Rinomina colonna
        - renameColumn:
            schemaName: anagrafiche
            tableName: billing_account
            oldColumnName: account_code
            newColumnName: codice

        # 2) Rinomina UNIQUE/indice se presente (storico: uq_billing_account_code)
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                -- vincolo UNIQUE come constraint
                IF EXISTS (
                  SELECT 1
                  FROM pg_constraint c
                  JOIN pg_class t ON t.oid = c.conrelid
                  JOIN pg_namespace n ON n.oid = t.relnamespace
                  WHERE c.contype = 'u'
                    AND n.nspname = 'anagrafiche'
                    AND t.relname = 'billing_account'
                    AND c.conname = 'uq_billing_account_code'
                ) THEN
                  EXECUTE 'ALTER TABLE anagrafiche.billing_account RENAME CONSTRAINT uq_billing_account_code TO uq_billing_account_codice';
                END IF;

                -- indice UNIQUE "standalone"
                IF EXISTS (
                  SELECT 1
                  FROM pg_class i
                  JOIN pg_namespace n ON n.oid = i.relnamespace
                  WHERE i.relkind IN ('i','I')
                    AND n.nspname = 'anagrafiche'
                    AND i.relname = 'uq_billing_account_code'
                ) THEN
                  EXECUTE 'ALTER INDEX IF EXISTS anagrafiche.uq_billing_account_code RENAME TO uq_billing_account_codice';
                END IF;
              END$$;

        
      rollback:
        # Rollback colonna
        - renameColumn:
            schemaName: anagrafiche
            tableName: billing_account
            oldColumnName: codice
            newColumnName: account_code

        # Rollback vincolo/indice se rinominati
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_constraint c
                  JOIN pg_class t ON t.oid = c.conrelid
                  JOIN pg_namespace n ON n.oid = t.relnamespace
                  WHERE c.contype='u'
                    AND n.nspname='anagrafiche'
                    AND t.relname='billing_account'
                    AND c.conname='uq_billing_account_codice'
                ) THEN
                  EXECUTE 'ALTER TABLE anagrafiche.billing_account RENAME CONSTRAINT uq_billing_account_codice TO uq_billing_account_code';
                END IF;

                IF EXISTS (
                  SELECT 1
                  FROM pg_class i
                  JOIN pg_namespace n ON n.oid = i.relnamespace
                  WHERE i.relkind IN ('i','I')
                    AND n.nspname='anagrafiche'
                    AND i.relname='uq_billing_account_codice'
                ) THEN
                  EXECUTE 'ALTER INDEX IF EXISTS anagrafiche.uq_billing_account_codice RENAME TO uq_billing_account_code';
                END IF;
              END$$;

        
  - changeSet:
      id: 20250817-90-billing_account-rename-account_code-to-codice
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250817-28-billing_account-rename-account_code-to-codice