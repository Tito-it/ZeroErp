databaseChangeLog: 
  - changeSet:
      id: 20250907-01-update-tipi-doc-fiscale-fe-and-internal
      author: mctit
      runOnChange: true
      validCheckSums: ["ANY"]
      preConditions:
      - onFail: MARK_RAN     # se la precondition fallisce, segna come eseguito e salta
      - onError: MARK_RAN
      - not:
          - columnExists:
              schemaName: config
              tableName: tipi_doc_fiscale
              columnName: codice_interno
      changes:
        # 1) Aggiungo colonne
        - addColumn:
            schemaName: config
            tableName: tipi_doc_fiscale
            columns:
              - column:
                  name: codice_interno
                  type: VARCHAR(32)
                  remarks: "Codice tecnico stabile per logica/app (immutabile). "
              - column:
                  name: codice_fe
                  type: VARCHAR(8)
                  remarks: "Codice Fatturazione Elettronica (Italia), es. TD01/TD04. Facoltativo."

        # 2) Backfill codice_interno dagli attuali codici
        - sql:
            splitStatements: false
            sql: |
              UPDATE config.tipi_doc_fiscale
                 SET codice_interno = codice
               WHERE codice_interno IS NULL;

        # 3) Vincoli su codice_interno
        - addNotNullConstraint:
            schemaName: config
            tableName: tipi_doc_fiscale
            columnName: codice_interno
            constraintName: tipi_doc_fiscale_codice_interno_not_null
        - addUniqueConstraint:
            schemaName: config
            tableName: tipi_doc_fiscale
            columnNames: codice_interno
            constraintName: uq_tipi_doc_fiscale_codice_interno

        
        # 5) Vincoli/indici su codice_fe (pattern TD##, univoco quando valorizzato)
        
        - sql:
            splitStatements: false
            sql: |
              CREATE UNIQUE INDEX IF NOT EXISTS uq_tipi_doc_fiscale_codice_fe
                ON config.tipi_doc_fiscale(codice_fe)
              WHERE codice_fe IS NOT NULL;

        # 6) Commenti colonne (espliciti)
        - sql:
            splitStatements: false
            sql: |
              COMMENT ON COLUMN config.tipi_doc_fiscale.codice_interno
                IS 'Codice tecnico stabile per logica e mapping; immutabile.';
              COMMENT ON COLUMN config.tipi_doc_fiscale.codice_fe
                IS 'Codice FE Italia (es. TD01, TD04). NULL se non applicabile.';

  - changeSet:
      id: 20250912-02-update-config-tipi-doc-fiscale
      author: mctit
      changes:              
        - addColumn:
            schemaName: config
            tableName: tipi_doc_fiscale
            columns: 
              - column: { name: data_insert, type: TIMESTAMPTZ, defaultValueComputed: now(), constraints: { nullable: false }, remarks: "Audit: data inserimento" }
              - column: { name: user_insert, type: VARCHAR(80), defaultValueComputed: CURRENT_USER, constraints: { nullable: false }, remarks: "Audit: utente inserimento" }
              - column: { name: data_update, type: TIMESTAMPTZ, defaultValueComputed: now(), constraints: { nullable: false }, remarks: "Audit: data aggiornamento" }
              - column: { name: user_update, type: VARCHAR(80), defaultValueComputed: CURRENT_USER, remarks: "Audit: utente aggiornamento" }
  - changeSet:
      id: 20250912-90-update-config-tipi-doc-fiscale
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250912-01-update-config-tipi-doc-fiscale