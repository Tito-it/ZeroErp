# Zero ERP — Vendite: fatture_righe, migrazione da source_tipo → sorgente_tipo_id (FK)
# ------------------------------------------------------------
databaseChangeLog:
  - changeSet:
      id: 20250905-09-alter_vendite_fatture_source_to_sorgente
      author: mctit
      preConditions:
        - onFail: HALT
        - tableExists:  { schemaName: vendite, tableName: fatture }
        - tableExists:  { schemaName: config,  tableName: sorgenti }
      changes:
        # 1) Drop indice unico precedente (source_tipo, source_id, source_riga)
        
        - sql:
            splitStatements: false
            sql: |    
                DROP INDEX IF EXISTS vendite.uq_fatture_uid
        
        - dropColumn:
            schemaName: vendite
            tableName: fatture
            columnName: source_id
            ifExists: true
        
  # 2) Aggiunta nuove colonne con naming coerente
  - changeSet:
      id: 20250905-10-alter_vendite_fatture_source_to_sorgente
      author: mctit
      preConditions:
        - onFail: HALT
        - tableExists: { schemaName: vendite, tableName: fatture }
      changes:
        - addColumn:
            schemaName: vendite
            tableName: fatture
            columns:
              - column:
                  name: sorgente_id
                  type: UUID
                  remarks: "Identificatore esterno della risorsa padre nella sorgente"
              
        - sql:
            splitStatements: false
            sql: |
              COMMENT ON COLUMN vendite.fatture.sorgente_id
                IS 'Identificatore esterno della risorsa padre nella sorgente.';
              
        # 5) Crea nuovo indice unico parziale per idempotenza
        - createIndex:
            schemaName: vendite
            tableName: fatture
            indexName: uq_fatture_sorgente_fk
            unique: true
            columns:
              - column: { name: sorgente_tipo_id }
              - column: { name: sorgente_id }
            where: "sorgente_tipo_id IS NOT NULL"
            remarks: "Idempotenza import testata (sorgente_tipo_id, sorgente_id)"



# Metto un  tag fine modifiche
  - changeSet:
      id: 20250905-90-alter_vendite_fatture_source_to_sorgente
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250905-09-alter_vendite_fatture_source_to_sorgente