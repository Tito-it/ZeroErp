databaseChangeLog:
  # 1) Funzione generica (crea o aggiorna sempre)
  - changeSet:
      id: 20250514-01 
      author: mctit
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION script.trgfn_upd_audit_data_user_generic()
              RETURNS TRIGGER AS $$
              BEGIN
                NEW.data_upd := CURRENT_TIMESTAMP;
                NEW.user_upd := CURRENT_USER;
                RETURN NEW;
              END;
              $$ LANGUAGE plpgsql;
