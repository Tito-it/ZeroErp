databaseChangeLog:
  - changeSet:
      id: 20250905-06-create_config_sorgenti
      author: mctit
      changes:
        - sql:
            splitStatements: false
            sql: |

              CREATE TABLE IF NOT EXISTS config.sorgenti (
                id              BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                codice_interno  VARCHAR(50) NOT NULL,
                codice  VARCHAR(50) NOT NULL,
                categoria       VARCHAR(24),     -- DOCUMENTO|RIGA|EVENTO|ESTERNO...
                descrizione     VARCHAR(160),
                attivo          BOOLEAN NOT NULL DEFAULT true,
                meta            JSONB   NOT NULL DEFAULT '{}'::jsonb,
                data_insert     TIMESTAMPTZ NOT NULL DEFAULT now(),
                user_insert     VARCHAR(80) NOT NULL DEFAULT CURRENT_USER,
                data_update     TIMESTAMPTZ NOT NULL DEFAULT now(),
                user_update     VARCHAR(80) DEFAULT CURRENT_USER,
                CONSTRAINT uq_sorgenti_codice_interno UNIQUE (codice_interno),
                CONSTRAINT chk_sorgenti_codice_interno_non_vuoto CHECK (btrim(codice_interno) <> ''),
                CONSTRAINT uq_sorgenti_codice UNIQUE (codice)
              );

              COMMENT ON TABLE config.sorgenti IS 'Dizionario delle sorgenti applicative per collegamenti/idempotenza (ex source/sorgente_tipo).';
              COMMENT ON COLUMN config.sorgenti.codice_interno IS 'Codice interno immutabile (UPPER), es. ATTIVITA, PREVENTIVO_RIGA, DDT_VENDITA, ...';
  

# Metto un  tag fine modifiche
  - changeSet:
      id: 20250905-90-create-config-sorgenti
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250905-06-create-config-sorgenti