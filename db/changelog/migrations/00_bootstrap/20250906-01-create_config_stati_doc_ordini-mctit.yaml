databaseChangeLog:
  - changeSet:
      id: 20250904-04-create_config_stati_doc_ordini
      author: mctit
      runOnChange: true
      changes:

        - createTable:
            schemaName: config
            tableName: stati_doc_ordini
            remarks: "Dominio stati del documento ordini (codici stabili; descrizioni multilingua) ."
            columns:
                - column:
                    name: id
                    type: BIGINT 
                    autoIncrement: true
                    generationType: BY DEFAULT
                    constraints:
                      primaryKey: true
                      primaryKeyName: pk_stati_doc_ordini
                      nullable: false
                    remarks: "PK"
                - column:
                    name: codice_interno
                    type: VARCHAR(32)
                    remarks: "Codice interno immutabile."
                    constraints:
                      nullable: false
                - column:
                    name: codice
                    type: VARCHAR(32)
                    remarks: "Codice stabile (es. DRAFT, CONFERMATA, ALLOCATA, ...)."
                    constraints:
                      nullable: false
                - column:
                    name: descrizione
                    type: VARCHAR(120)
                
                - column:
                    name: attivo
                    type: BOOLEAN
                    defaultValueBoolean: true
                    constraints:
                      nullable: false
                - column:
                    name: ordine
                    type: SMALLINT
                - column:
                    name: meta
                    type: JSONB
                    defaultValueComputed: "'{}'::jsonb"
                    constraints:
                      nullable: false   
        - addUniqueConstraint:
            schemaName: config
            tableName: stati_doc_ordini
            columnNames: codice_interno
            constraintName: uq_stati_doc_ordini_codice_interno
        - addUniqueConstraint:
            schemaName: config
            tableName: stati_doc_ordini
            columnNames: codice
            constraintName: uq_stati_doc_ordini_codice
        - createIndex:
            schemaName: config
            tableName: stati_doc_ordini
            indexName: ix_stati_doc_ordini_attivo
            columns:
                - column: { name: attivo }

        # Indice case-insensitive su codice (espressione)
        - sql:
            splitStatements: false
            sql: |
              CREATE INDEX IF NOT EXISTS ix_stati_doc_ordini_codice_upper
                ON config.stati_doc_ordini (upper(codice));
        - sql:
            splitStatements: false
            sql: |
              CREATE INDEX IF NOT EXISTS ix_stati_doc_ordini_codice_interno_upper
                ON config.stati_doc_ordini (upper(codice_interno));
        - sql:
            splitStatements: false
            sql: |
              CREATE INDEX IF NOT EXISTS ix_stati_doc_ordini_descrizione_upper
                ON config.stati_doc_ordini (upper(descrizione));

# Metto un  tag fine modifiche
  - changeSet:
      id: 20250904-90-create_config_tipi_doc_ordini
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250904-04-create_config_stati_doc_ordini