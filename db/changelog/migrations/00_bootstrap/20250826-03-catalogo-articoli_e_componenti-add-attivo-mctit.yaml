databaseChangeLog:
  - changeSet:
      id: 20250826-03-catalogo-articoli_e_componenti-add-attivo-mctit
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      preConditions:
        - onFail: CONTINUE
        - not:
          - columnExists:
              schemaName: catalogo
              tableName: articoli
              columnName: attivo
      changes:
        - addColumn:
            schemaName: catalogo
            tableName: articoli
            columns:
              - column:
                  name: attivo
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
        - sql:
            splitStatements: false
            sql: |
              COMMENT ON COLUMN catalogo.articoli.attivo
                IS 'Stato attivo/inattivo del articolo (DEFAULT TRUE)';

  
        

