databaseChangeLog:
  - changeSet:
      id: 20250826-03-catalogo-articoli_e_componenti-add-attivo-mctit
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      changes:
        - addColumn:
            schemaName: catalogo
            tableName: articoli
            columns:
              - column:
                  name: attivo
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
        - sql:
            splitStatements: false
            sql: |
              COMMENT ON COLUMN catalogo.articoli.attivo
                IS 'Stato attivo/inattivo del articolo (DEFAULT TRUE)';

  
        # 2c) Indice per "ultimo snapshot": (articolo_id, valid_from DESC)
        - sql:
            splitStatements: false
            sql: |
              CREATE INDEX IF NOT EXISTS ix_storico_articoli_articolo_valid_from_desc
              ON storico.articoli (articoli_id, valid_from DESC);
              COMMENT ON INDEX storico.ix_storico_articoli_articolo_valid_from_desc
                IS 'Lookup per ultimo snapshot: (articoli_id, valid_from DESC)';

  - changeSet:
      id: 20250826-04-catalogo-articoli_e_componenti-add-attivo-mctit
      author: mctit
