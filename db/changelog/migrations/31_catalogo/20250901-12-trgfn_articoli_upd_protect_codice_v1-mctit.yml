databaseChangeLog:

  
  - changeSet:
      id: 20250901-12-trgfn_articoli_upd_protect_codice_v1
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      comments: >
         Protegge il codice articolo in modo che non possa essere modificato dopo essere stato valorizzato.
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION catalogo.trgfn_articoli_upd_protect_codice()
                    RETURNS trigger
                    LANGUAGE plpgsql 
                  AS $$
                  BEGIN
                    IF TG_OP = 'UPDATE'
                      AND OLD.codice IS NOT NULL
                      AND NEW.codice IS DISTINCT FROM OLD.codice
                    THEN
                      
                      PERFORM script.fn_log_and_raise_error(
                        'database',
                        TG_NAME,
                        'E_COLONNA_NON_MODIFICABILE',
                        jsonb_build_object('column','codice (articolo)','id',OLD.id),
                        NULL::uuid,
                        'codice (articolo)'
                      );
                    END IF;
                    RETURN NEW;
                  END;
                  $$;

              COMMENT ON FUNCTION catalogo.trgfn_articoli_upd_protect_codice()
                IS $comment$
                  Triggere per proteggere il campo codice (articolo) da modifiche dopo la prima valorizzazione.
                $comment$;
        - sql:
            splitStatements: false  
            sql: |

            
              DROP TRIGGER IF EXISTS trg_a10_articoli_upd_protect_codice
                ON catalogo.articoli;
              CREATE TRIGGER trg_a10_articoli_upd_protect_codice
                BEFORE UPDATE ON catalogo.articoli
                FOR EACH ROW
                EXECUTE FUNCTION catalogo.trgfn_articoli_upd_protect_codice();

              COMMENT ON TRIGGER trg_a10_articoli_upd_protect_codice
                ON catalogo.articoli
                IS $comment$
                  Trigger per proteggere il campo codice (articolo) da modifiche dopo la prima valorizzazione.
                $comment$;

# Metto un  tag fine modifiche
  - changeSet:
      id: 20250901-90-trgfn_articoli_upd_protect_codice_v1
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250901-12-trgfn_articoli_upd_protect_codice_v1