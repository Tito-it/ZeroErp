databaseChangeLog:  
  - changeSet:
      id: 20250819-02-trg-upd_unita_misura-unita_misura_data_user
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      comment: >
        Crea trigger per aggiornare il campo data_user e user.
      changes:
            
        - sql:
            comment: "1) Crea trigger " 
            splitStatements: false
            stripComments: true
            sql: |
              -- 1) Creo/aggiorno il trigger che blocca modifiche al codice interno
                CREATE OR REPLACE TRIGGER  trg_upd_unita_misura_data_user
                  BEFORE UPDATE 
                  ON catalogo.unita_misura
                  FOR EACH ROW
                EXECUTE FUNCTION script.trgfn_upd_audit_data_user_generic();
                
                -- 2) Aggiungo un commento al trigger di lock
                COMMENT ON TRIGGER trg_upd_unita_misura_data_user 
                ON catalogo.unita_misura
                IS 'Aggiorna(unita_misura) i valori di data e user ';

  # Metto un tag fine modifiche
  - changeSet:
      id: 20250819-90-trg-upd_unita_misura-unita_misura_data_user
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250819-02-trg-upd_unita_misura-unita_misura_data_user