databaseChangeLog:
  - changeSet:
      id: 20250915-01-upsert-stati_doc_ddt
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: stati_doc_ddt
      changes:
        # Upsert dei dati nella tabella tipi_indirizzi
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/stati_doc_ddt.csv
            tableName: stati_doc_ddt
            schemaName: config
            separator: ","
            encoding: UTF-8
            nullValue: ""
            primaryKey: 
                      - id
            columns:
              - column: { name: id,           type: STRING }
              
              - column: { name: codice,    type: STRING }
              
              - column: { name: descrizione,  type: STRING }
              - column: { name: attivo,  type: BOOLEAN }
              - column: { name: ordine,    type: STRING }
              - column:
                  name: meta
                  type: JSON
                  # se il CSV ha valore vuoto, usa {} come JSON valido
                  defaultValue: "{}"
              - column: { name: codice_interno,    type: STRING }
              #- column: { name: data_insert,  type: STRING }
              #- column: { name: user_insert,  type: STRING }
              #- column:
              #    name: data_update
               #   type: STRING 
               #   defaultValue: "NOW()"
              #- column: { name: user_update,  type: STRING }
             

  - changeSet:
      id: 20250915-90-upsert-stati_doc_ddt
      author: mctit
      changes:
        - tagDatabase:
            tag: 220250915-01-upsert-stati_doc_ddt
