databaseChangeLog:
  - changeSet:
      id: 220250911-02-upsert-sorgenti
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: sorgenti
      changes:
        # Upsert dei dati nella tabella tipi_indirizzi
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/sorgenti.csv
            tableName: sorgenti
            schemaName: config
            separator: ","
            encoding: UTF-8
            nullValue: ""
            primaryKey:
              - id
            columns:
              - column: { name: id,           type: STRING }
              - column: { name: codice_interno,    type: STRING }
              - column: { name: codice,    type: STRING }
              - column: { name: categoria,  type: STRING }
              - column: { name: descrizione,  type: STRING }
              - column: { name: attivo,  type: BOOLEAN }
              - column: { name: ordine,    type: STRING }
              - column:
                  name: meta
                  type: JSON
                  # se il CSV ha valore vuoto, usa {} come JSON valido
                  defaultValue: "{}"

              - column: { name: data_insert,  type: STRING }
              - column: { name: user_insert,  type: STRING }
              - column:
                  name: data_update
                  type: STRING 
                  defaultValue: "NOW()"
              - column: { name: user_update,  type: STRING }
             

  - changeSet:
      id: 220250911-90-upsert-sorgenti
      author: mctit
      changes:
        - tagDatabase:
            tag: 220250911-02-upsert-sorgenti
