databaseChangeLog:
  - changeSet:
      id: 20250715-01-upsert_parameters
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: parameters
      changes:
        # Upsert dei dati nella tabella parameters
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/parameters.csv
            tableName: parameters
            schemaName: config
            separator: ","
            encoding: UTF-8
            # nullValue: ""
            nullValue: "NULL"
            primaryKey:
              - id
            columns:
              - column: { name: id,           type: STRING }
              - column: { name: code,    type: STRING }
              - column: { name: default_value,  type: STRING }
              - column: { name: description,  type: STRING }
              - column: { name: data_insert,  type: STRING }
              - column: { name: user_insert,  type: STRING }
              - column:
                  name: data_update
                  type: STRING
                  defaultValue: "NOW()"
              - column: { name: user_update,  type: STRING }
              - column: { name: tx_id,    type: uuid  }
              - column: { name: storicizza,    type: STRING }
              
  - changeSet:
      id: 20250715-90-upsert_parameters
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250715-01-upsert_parameters
