databaseChangeLog:
  - changeSet:
      id: 20250717-22-upsert-messaggi_errore
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: messaggi_errore
      changes:
        # 1) Inserimento di tutte le colonne
        # 2) Upsert di tutte le colonne, 
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/messaggi_errore.csv
            tableName: messaggi_errore
            schemaName: config
            separator: ","
            encoding: UTF-8
            nullValue: ""
            primaryKey:
              - id
            
            columns:
              - column: { name: codice,  type: STRING }
              - column: { name: lingua,         type: STRING }
              - column: { name: messaggio, type: STRING }
              - column: { name: causa,    type: STRING }
              - column: { name: soluzione,   type: STRING }
              - column: { name: id,          type: STRING }
        
  - changeSet:
      id: 20250717-90-upsert-messaggi_errore
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250717-22-upsert-messaggi_errore