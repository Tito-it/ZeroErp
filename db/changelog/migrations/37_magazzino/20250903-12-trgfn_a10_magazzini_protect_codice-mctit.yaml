databaseChangeLog:  
  - changeSet:
      id: 20250903-12-trgfn_a10_magazzini_protect_codice
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      changes:
        - sql:
            splitStatements: false
            sql: |
              
              CREATE OR REPLACE FUNCTION magazzino.trgfn_a10_magazzini_protect_codice()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $$
              BEGIN
                IF TG_OP = 'UPDATE'
                   AND OLD.codice IS NOT NULL
                   AND NEW.codice IS DISTINCT FROM OLD.codice THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database',
                    TG_NAME,
                    'E_COLONNA_NON_MODIFICABILE',
                    jsonb_build_object('table','magazzino.magazzini','column','codice','id',OLD.id),
                    NULL::uuid,
                    'codice (magazzino)'
                  );
                END IF;
                RETURN NEW;
              END$$;

               COMMENT ON FUNCTION magazzino.trgfn_a10_magazzini_protect_codice()
                  IS 'Blocca la modifica del codice magazzino dopo la creazione.';


              DROP TRIGGER IF EXISTS trg_a10_magazzini_upd_protect_codice ON magazzino.magazzini;
              CREATE TRIGGER trg_a10_magazzini_upd_protect_codice
              BEFORE UPDATE ON magazzino.magazzini
              FOR EACH ROW
              EXECUTE FUNCTION magazzino.trgfn_a10_magazzini_protect_codice();

 
        
  # Metto un tag fine modifiche
  - changeSet:
      id: 20250903-90-trgfn_a10_magazzini_protect_codice
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250903-12-trgfn_a10_magazzini_protect_codice