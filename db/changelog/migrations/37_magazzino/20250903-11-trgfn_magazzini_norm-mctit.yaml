databaseChangeLog:  
  - changeSet:
      id: 20250903-11-trgfn_magazzini_norm-mctit
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      changes:
        - sql:
            splitStatements: false
            sql: |
              
              CREATE OR REPLACE FUNCTION magazzino.trgfn_magazzini_norm()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $$
              BEGIN
                IF NEW.codice IS NOT NULL THEN
                  NEW.codice := upper(btrim(NEW.codice));
                END IF;
                RETURN NEW;
              END$$;

              COMMENT ON FUNCTION magazzino.trgfn_magazzini_norm()
                IS 'Normalizza i dati magazzino.';
              
              DROP TRIGGER IF EXISTS trg_magazzini_ins_upd_norm ON magazzino.magazzini;
              CREATE TRIGGER trg_magazzini_ins_upd_norm
              BEFORE INSERT OR UPDATE ON magazzino.magazzini
              FOR EACH ROW
              EXECUTE FUNCTION magazzino.trgfn_magazzini_norm();

  # Metto un tag fine modifiche
  - changeSet:
      id: 20250903-90-trgfn_magazzini_norm-mctit
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250903-11-trgfn_magazzini_norm-mctit