databaseChangeLog:  
  - changeSet:
      id: 20250902-02-trgfn_a10_attivita_guard_fatturato
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      
      changes:
            
        # --- Funzione trigger: protezione righe già fatturate ---
        - sql:
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_a10_attivita_fatturabili_guard_fatturato()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $$
              BEGIN
                IF TG_OP = 'UPDATE' THEN
                  -- Una volta valorizzato fattura_riga_id (OLD non null), blocca qualsiasi UPDATE
                  IF OLD.fattura_riga_id IS NOT NULL THEN
                    PERFORM script.fn_log_and_raise_error(
                      'database', TG_NAME, 'E_RIGA_GIA_FATTURATA',
                      jsonb_build_object('id', OLD.id, 'fattura_riga_id', OLD.fattura_riga_id),
                      NULL::uuid, OLD.id::text
                    );
                  END IF;
                ELSIF TG_OP = 'DELETE' THEN
                  -- Vietato cancellare se già agganciata ad una riga di fattura
                  IF OLD.fattura_riga_id IS NOT NULL THEN
                    PERFORM script.fn_log_and_raise_error(
                      'database', TG_NAME, 'E_RIGA_GIA_FATTURATA',
                      jsonb_build_object('id', OLD.id, 'fattura_riga_id', OLD.fattura_riga_id),
                      NULL::uuid, OLD.id::text
                    );
                  END IF;
                END IF;

                RETURN NEW;
              END$$;

              COMMENT ON FUNCTION vendite.trgfn_a10_attivita_fatturabili_guard_fatturato()
                IS 'Blocca UPDATE/DELETE su vendite.attivita_fatturabili quando fattura_riga_id è valorizzato.';

        # --- Trigger fail-fast (ordine: A10) ---
        - sql:
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_a10_attivita_fatturabili_upd_dlt_guard_fatturato ON vendite.attivita_fatturabili;
              CREATE TRIGGER trg_a10_attivita_fatturabili_upd_dlt_guard_fatturato
              BEFORE UPDATE OR DELETE
              ON vendite.attivita_fatturabili
              FOR EACH ROW
              EXECUTE FUNCTION vendite.trgfn_a10_attivita_fatturabili_guard_fatturato();

              COMMENT ON TRIGGER trg_a10_attivita_fatturabili_upd_dlt_guard_fatturato ON vendite.attivita_fatturabili
                IS 'Fail-fast: impedisce modifiche a righe già legate a fatture.';

                    


  # Metto un tag fine modifiche
  - changeSet:
      id: 20250902-90-trgfn_a10_attivita_guard_fatturato
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250902-02-trgfn_a10_attivita_guard_fatturato