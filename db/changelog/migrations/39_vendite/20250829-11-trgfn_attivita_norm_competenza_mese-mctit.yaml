databaseChangeLog:  
  - changeSet:
      id: 20250829-11-trgfn_attivita_norm_competenza_mese
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      comment: >
        Crea trigger per aggiornare il campo data_user e user.
      changes:
            
        - sql:
            comment: "1) Crea trigger " 
            splitStatements: false
            stripComments: true
            sql: |
                  CREATE OR REPLACE FUNCTION vendite.trgfn_attivita_norm_competenza_mese()
                  RETURNS trigger
                  LANGUAGE plpgsql AS $$
                  BEGIN
                  -- Normalizza competenza_mese al 1° del mese (YYYY-MM-01)
             
                    IF NEW.competenza_mese IS NOT NULL THEN
                      NEW.competenza_mese := date_trunc('month', NEW.competenza_mese)::date;
                    END IF;
                    RETURN NEW;
                  END$$;
                  COMMENT ON FUNCTION vendite.trgfn_attivita_norm_competenza_mese()
                    IS 'Se competenza_mese è valorizzato, normalizza al primo giorno del mese.';


                            -- Triggers
                  DROP TRIGGER IF EXISTS trg_attivita_norm_competenza_mese ON vendite.attivita_fatturabili;
                  CREATE TRIGGER trg_attivita_norm_competenza_mese
                  BEFORE INSERT OR UPDATE ON vendite.attivita_fatturabili
                  FOR EACH ROW EXECUTE FUNCTION vendite.trgfn_attivita_norm_competenza_mese();  
                  COMMENT ON TRIGGER trg_attivita_norm_competenza_mese ON vendite.attivita_fatturabili
                    IS 'BEFORE INSERT OR UPDATE: normalizza competenza_mese al 1° del mese (YYYY-MM-01)';

  # Metto un tag fine modifiche
  - changeSet:
      id: 20250829-90-trgfn_attivita_norm_competenza_mese
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250829-11-trgfn_attivita_norm_competenza_mese