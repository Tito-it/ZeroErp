databaseChangeLog:  
  - changeSet:
      id: 20250829-13-trgfn_attivita_guard_ba_coerenza
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      comment: >
        Crea trigger per aggiornare il campo data_user e user.
      changes:
            
        - sql:
            comment: "1) Crea trigger " 
            splitStatements: false
            stripComments: true
            sql: |
                   
                   CREATE OR REPLACE FUNCTION vendite.trgfn_attivita_fatturabili_guard_ba_coerenza()
                      RETURNS trigger
                      LANGUAGE plpgsql AS $$
                      DECLARE v_iu_id INTEGER;
                      BEGIN
                       -- Guardia coerenza con billing_account: se BA presente, deve puntare alla stessa istanza_utility
                      
                        IF NEW.billing_account_id IS NOT NULL THEN
                          SELECT b.istanza_utility_id
                            INTO v_iu_id
                          FROM anagrafiche.billing_account b
                          WHERE b.id = NEW.billing_account_id;

                          IF NOT FOUND THEN
                              PERFORM script.fn_log_and_raise_error(
                              'database',
                              'attivita_fatturabili',
                              'E_PARAMETRI_TABELLA',
                              jsonb_build_object(
                                'context','validazione billing_account_id',
                                'billing_account_id', NEW.billing_account_id     
                              ),
                            NULL::uuid,
                            'billing_account', NEW.billing_account_id
                            );
                          END IF;
                          IF NEW.istanza_utility_id IS DISTINCT FROM v_iu_id THEN
                           
                              
                               PERFORM script.fn_log_and_raise_error(
                              'database',
                              'attivita_fatturabili',
                              'E_COERENZA_ID',
                              jsonb_build_object(
                                'context','validazione istanza_utility_id',
                                'istanza_utility_id', NEW.istanza_utility_id,
                                'billing_account_id',v_iu_id
                              ),
                            NULL::uuid,
                            'istanza_utility_id', NEW.istanza_utility_id,
                            'billing_account', NEW.billing_account_id
                            );

                          END IF;
                        END IF;
                        RETURN NEW;
                    END$$;

                      COMMENT ON FUNCTION vendite.trgfn_attivita_fatturabili_guard_ba_coerenza()
                        IS 'Se billing_account_id è valorizzato, verifica che l’istanza_utility sia la stessa dell’account.';


                          DROP TRIGGER IF EXISTS trg_a10_attivita_fatturabili_ins_upd_guard_ba_coerenza ON vendite.attivita_fatturabili;
                          CREATE TRIGGER trg_a10_attivita_fatturabili_ins_upd_guard_ba_coerenza
                          BEFORE INSERT OR UPDATE ON vendite.attivita_fatturabili
                          FOR EACH ROW EXECUTE FUNCTION vendite.trgfn_attivita_fatturabili_guard_ba_coerenza();

  

  # Metto un tag fine modifiche
  - changeSet:
      id: 20250829-90-trgfn_attivita_guard_ba_coerenza
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250829-13-trgfn_attivita_guard_ba_coerenza