databaseChangeLog:  
  - changeSet:
      id: 20250829-12-trgfn_attivita_guard_fonte
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      comment: >
        Crea trigger per aggiornare il campo data_user e user.
      changes:
            
        - sql:
           
            splitStatements: false
            stripComments: true
            sql: |
                    
                    CREATE OR REPLACE FUNCTION vendite.trgfn_attivita_fatturabili_guard_fonte()
                    RETURNS trigger
                    LANGUAGE plpgsql AS $$
                    DECLARE v_fonte TEXT;
                    BEGIN

                    -- Guardia: l'articolo deve avere fonte_quantita compatibile (TIMESHEET, MANUALE, FISSA)

                      SELECT r.fonte_quantita
                        INTO v_fonte
                      FROM vendite.regole_fatturazione_articolo r
                      WHERE r.prodotto_id = NEW.articolo_id;

                      IF v_fonte IS NULL THEN
                          PERFORM script.fn_log_and_raise_error(
                            'database',                              -- schema in cui è avvenuto l'errore
                            'attivita_fatturabili',                 -- tabella/funzione coinvolta
                            'E_REGOLA_FATTURAZIONE_MANCANTE',       -- codice interno errore
                            jsonb_build_object(
                              'context', 'inserimento/aggiornamento attivita_fatturabili',
                              'articolo_id', NEW.articolo_id
                            ),
                            NULL::uuid,
                            NEW.articolo_id
                          );    
                      END IF;

                      -- Se presente fonte_quantita, deve essere compatibile con vendite.attivita_fatturabili (TIMESHEET, MANUALE, FISSA)
                      
                      IF v_fonte NOT IN ('TIMESHEET','MANUALE','FISSA') THEN
                        PERFORM script.fn_log_and_raise_error(
                          'database',
                          'attivita_fatturabili',
                          'E_FONTE_QUANTITA_NON_VALIDA',
                          jsonb_build_object(
                            'context','validazione fonte_quantita',
                            'fonte_quantita', v_fonte,
                            'articolo_id', NEW.articolo_id
                          ),
                         NULL::uuid,
                         v_fonte, NEW.articolo_id
                        );
                      END IF;

                      -- Se presente competenza_mese, data_attivita non può superiore al mese di competenza
                      IF NEW.competenza_mese IS NOT NULL
                        AND date_trunc('month', NEW.data_attivita)::date > NEW.competenza_mese THEN
                        PERFORM script.fn_log_and_raise_error(
                          'database',
                          'attivita_fatturabili',
                          'E_COMPETENZA_SUPERATA',
                          jsonb_build_object(
                            'context','validazione competenza',
                            'data_attivita', NEW.data_attivita,
                            'competenza_mese', NEW.competenza_mese
                          ),
                         NULL::uuid,
                        NEW.data_attivita, NEW.competenza_mese
                        );
                      END IF;

                      -- Se presente competenza_mese, data_attivita non può essere superiore al data competenza 
                      IF NEW.competenza_data IS NOT NULL
                        AND  NEW.data_attivita > NEW.competenza_data THEN
                        PERFORM script.fn_log_and_raise_error(
                          'database',
                          'attivita_fatturabili',
                          'E_COMPETENZA_SUPERATA',
                          jsonb_build_object(
                            'context','validazione competenza',
                            'data_attivita', NEW.data_attivita,
                            'competenza_data', NEW.competenza_data
                          ),
                         NULL::uuid,
                        NEW.data_attivita, NEW.competenza_data
                        );
                      END IF;

                      -- Se indicata competenza_mese e competenza_data, errore
                      IF NEW.competenza_data IS NOT NULL 
                        AND  NEW.competenza_mese IS NOT NULL
                      THEN
                        PERFORM script.fn_log_and_raise_error(
                          'database',
                          'attivita_fatturabili',
                          'E_COMPETENZA',
                          jsonb_build_object(
                            'context','validazione competenza',
                            'competenza mese', NEW.competenza_mese,
                            'competenza_data', NEW.competenza_data
                          ),
                         NULL::uuid,
                        NEW.competenza_mese, NEW.competenza_data
                        );
                      END IF;

                      RETURN NEW;
                    END$$;


                    COMMENT ON FUNCTION vendite.trgfn_attivita_fatturabili_guard_fonte()
                      IS 'Blocca inserimenti/aggiornamenti se la fonte_quantita non è tra TIMESHEET, MANUALE, FISSA o se la competenza è incoerente.';

                    DROP TRIGGER IF EXISTS trg_a10_attivita_fatturabili_ins_upd_guard_fonte ON vendite.attivita_fatturabili;
                    CREATE TRIGGER trg_a10_attivita_fatturabili_ins_upd_guard_fonte
                    BEFORE INSERT OR UPDATE ON vendite.attivita_fatturabili
                    FOR EACH ROW EXECUTE FUNCTION vendite.trgfn_attivita_fatturabili_guard_fonte();



