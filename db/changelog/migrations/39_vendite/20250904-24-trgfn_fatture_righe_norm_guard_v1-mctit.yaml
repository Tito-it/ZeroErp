databaseChangeLog:  
  - changeSet:
      id: 20250904-24-trgfn_fatture_righe_norm_guard_v1
      author: mctit
      
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
             
              
              CREATE OR REPLACE FUNCTION vendite.trgfn_fatture_righe_norm_guard()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $$
              DECLARE
                v_parent INTEGER;
              BEGIN
                -- Normalizza source_tipo (UPPER+TRIM) e default BA = parent se NULL
                IF NEW.source_tipo IS NOT NULL THEN
                  NEW.source_tipo := upper(btrim(NEW.source_tipo));
                END IF;

                IF NEW.dest_billing_account_id IS NULL THEN
                  SELECT billing_account_id
                    INTO v_parent
                  FROM vendite.fatture
                  WHERE id = NEW.fattura_id;
                  NEW.dest_billing_account_id := v_parent;
                END IF;

                RETURN NEW;
              END$$;

              COMMENT ON FUNCTION vendite.trgfn_fatture_righe_norm_guard()
                IS 'Normalizza source_tipo (UPPER+TRIM) e, se NULL, setta dest_billing_account_id = BA della testata fattura.';

        # -----------------------------
        # Trigger
        # -----------------------------
        - sql:
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_fatture_righe_norm_guard ON vendite.fatture_righe;
              CREATE TRIGGER trg_fatture_righe_norm_guard
                BEFORE INSERT OR UPDATE ON vendite.fatture_righe
                FOR EACH ROW
                EXECUTE FUNCTION vendite.trgfn_fatture_righe_norm_guard();      
                    


  # Metto un tag fine modifiche
