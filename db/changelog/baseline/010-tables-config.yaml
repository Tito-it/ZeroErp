databaseChangeLog:
  - changeSet:
      id: 010-tables-config
      author: mctit
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 170004
            sql: "SHOW server_version_num"


  
  - changeSet:
      id: enable-postgis
      author: mctit
      comment: Abilita l'estensione PostGIS per tipi e indici spaziali
      changes:
      - sql:
          sql: CREATE EXTENSION IF NOT EXISTS postgis;
  - changeSet:
        id: enable-uuid-ossp
        author: mctit
        changes:
          - sql:
              dbms: postgresql
              sql: CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
  - changeSet:
      id: enable-postgis-topology
      author: mctit
      changes:
        - sql:
            dbms: postgresql
            sql: CREATE EXTENSION IF NOT EXISTS postgis_topology;

