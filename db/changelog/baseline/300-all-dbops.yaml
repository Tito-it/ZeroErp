- changeSet:
    id: 1745777666089-3
    author: mctit (generated)
    changes:
    - createView:
        fullDefinition: false
        remarks: Elenco delle foreign key senza indice esplicito, con suggerimento
          CREATE INDEX e rispetto policy da dbops.fk_index_policy
        schemaName: dbops
        selectQuery: |-
          WITH fk_columns AS (
                   SELECT con.oid AS constraint_oid,
                      con.conname AS constraint_name,
                      nsp.nspname AS schema_name,
                      rel.relname AS table_name,
                      unnest(con.conkey) AS attnum,
                      con.conrelid
                     FROM ((pg_constraint con
                       JOIN pg_class rel ON ((rel.oid = con.conrelid)))
                       JOIN pg_namespace nsp ON ((nsp.oid = rel.relnamespace)))
                    WHERE (con.contype = 'f'::"char")
                  ), fk_fields AS (
                   SELECT fk_1.constraint_name,
                      fk_1.schema_name,
                      fk_1.table_name,
                      a.attname AS column_name,
                      fk_1.conrelid,
                      fk_1.constraint_oid
                     FROM (fk_columns fk_1
                       JOIN pg_attribute a ON (((a.attrelid = fk_1.conrelid) AND (a.attnum = fk_1.attnum))))
                  ), indexed_columns AS (
                   SELECT i.relname AS index_name,
                      n.nspname AS schema_name,
                      t.relname AS table_name,
                      array_agg(a.attname ORDER BY x.ordinality) AS indexed_cols
                     FROM (((((pg_index ix
                       JOIN pg_class i ON ((i.oid = ix.indexrelid)))
                       JOIN pg_class t ON ((t.oid = ix.indrelid)))
                       JOIN pg_namespace n ON ((n.oid = t.relnamespace)))
                       JOIN LATERAL unnest(ix.indkey) WITH ORDINALITY x(attnum, ordinality) ON (true))
                       JOIN pg_attribute a ON (((a.attrelid = t.oid) AND (a.attnum = x.attnum))))
                    GROUP BY i.relname, n.nspname, t.relname
                  ), fk_grouped AS (
                   SELECT fk_fields.constraint_name,
                      fk_fields.schema_name,
                      fk_fields.table_name,
                      fk_fields.conrelid,
                      fk_fields.constraint_oid,
                      array_agg(fk_fields.column_name ORDER BY fk_fields.column_name) AS fk_cols
                     FROM fk_fields
                    GROUP BY fk_fields.constraint_name, fk_fields.schema_name, fk_fields.table_name, fk_fields.conrelid, fk_fields.constraint_oid
                  )
           SELECT fk.schema_name,
              fk.table_name,
              fk.constraint_name,
              fk.fk_cols,
              format('CREATE INDEX idx_%I_%I_%s ON %I.%I(%s);'::text, fk.schema_name, fk.table_name, array_to_string(fk.fk_cols, '_'::text), fk.schema_name, fk.table_name, array_to_string(fk.fk_cols, ', '::text)) AS create_index_suggestion
             FROM ((fk_grouped fk
               LEFT JOIN indexed_columns idx ON (((fk.schema_name = idx.schema_name) AND (fk.table_name = idx.table_name) AND (fk.fk_cols = idx.indexed_cols))))
               LEFT JOIN dbops.fk_index_policy pol ON (((fk.schema_name = pol.schema_name) AND (fk.table_name = pol.table_name) AND (fk.constraint_name = pol.constraint_name))))
            WHERE ((idx.index_name IS NULL) AND (COALESCE(pol.consentito, true) = true))
            ORDER BY fk.schema_name, fk.table_name;
        viewName: vw_fk_senza_indice
- changeSet:
    id: 1745777666089-4
    author: mctit (generated)
    changes:
    - createView:
        fullDefinition: false
        remarks: Vista degli oggetti presenti negli schemi dbops,script (tabelle,
          viste, sequenze, indici ecc.)
        schemaName: dbops
        selectQuery: |-
          SELECT n.nspname AS schema,
              c.relkind AS tipo_oggetto,
              c.relname AS nome_oggetto,
                  CASE c.relkind
                      WHEN 'r'::"char" THEN 't'::"char"
                      WHEN 'v'::"char" THEN 'v'::"char"
                      WHEN 'm'::"char" THEN 'm'::"char"
                      WHEN 'i'::"char" THEN 'i'::"char"
                      WHEN 'S'::"char" THEN 's'::"char"
                      WHEN 'f'::"char" THEN 'f'::"char"
                      ELSE c.relkind
                  END AS tipo_descrizione,
              pg_roles.rolname AS proprietario,
              obj_description(c.oid, 'pg_class'::name) AS descrizione
             FROM ((pg_class c
               JOIN pg_namespace n ON ((n.oid = c.relnamespace)))
               LEFT JOIN pg_roles ON ((pg_roles.oid = c.relowner)))
            WHERE (n.nspname = ANY (ARRAY['dbops'::name, 'script'::name]));
        viewName: vw_catalogo_oggetti
- changeSet:
    id: 1745777666089-5
    author: mctit (generated)
    changes:
    - createView:
        fullDefinition: false
        remarks: |-
          Elenco completo delle funzioni negli schemi dbops e script. Include:
          - OID per identificare overload
          - Argomenti e tipo di ritorno
          - Numero di argomenti
          - Commenti/documentazione (se presenti)
        schemaName: dbops
        selectQuery: |-
          SELECT n.nspname AS schema,
              p.oid AS function_oid,
              p.proname AS function_name,
              pg_get_function_arguments(p.oid) AS arguments,
              pg_get_function_result(p.oid) AS return_type,
              array_length(string_to_array(pg_get_function_arguments(p.oid), ','::text), 1) AS num_args,
              d.description AS comment
             FROM ((pg_proc p
               JOIN pg_namespace n ON ((n.oid = p.pronamespace)))
               LEFT JOIN pg_description d ON ((p.oid = d.objoid)))
            WHERE (n.nspname = ANY (ARRAY['dbops'::name, 'script'::name]));
        viewName: vw_function_list
- changeSet:
    id: 1745777666089-6
    author: mctit (generated)
    changes:
    - createView:
        fullDefinition: false
        schemaName: dbops
        selectQuery: |-
          SELECT n.nspname AS schema,
              cls.relname AS tabella,
              trg.tgname AS nome_trigger,
              p.proname AS nome_funzione,
              pg_get_functiondef(p.oid) AS definizione_funzione
             FROM (((pg_trigger trg
               JOIN pg_class cls ON ((trg.tgrelid = cls.oid)))
               JOIN pg_proc p ON ((trg.tgfoid = p.oid)))
               JOIN pg_namespace n ON ((n.oid = cls.relnamespace)))
            WHERE (NOT trg.tgisinternal)
            ORDER BY n.nspname, cls.relname, trg.tgname;
        viewName: vw_trigger_functions

