- changeSet:
    id: 1745773123574-9
    author: mctit
    changes:
      

      # 2) Aggiunge il vero exclusion constraint
      - sql:
          splitStatements: false
          stripComments: true
          
          sql: |
            DROP INDEX IF EXISTS anagrafiche.uq_gestori_singleton;

            -- Assicuriamoci di avere gli operatori GIST su integer
            CREATE EXTENSION IF NOT EXISTS btree_gist;

            DO $$
                BEGIN
                IF NOT EXISTS (
                    SELECT 1
                    FROM pg_constraint c
                    JOIN pg_class t ON c.conrelid = t.oid
                    JOIN pg_namespace n ON t.relnamespace = n.oid
                    WHERE c.conname = 'uq_gestori_singleton'
                    AND n.nspname = 'anagrafiche'
                ) THEN
                    
                    ALTER TABLE anagrafiche.gestori
                    ADD CONSTRAINT uq_gestori_singleton
                    EXCLUDE USING gist (
                        id WITH =
                    )
                    WHERE (id IS NOT NULL);
                END IF;
                END;
            $$;


