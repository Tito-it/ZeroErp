databaseChangeLog:
  - changeSet:
      id: 100-create-schemas
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      comment: Crea tutti gli schemi necessari (se non esistono già)
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE SCHEMA IF NOT EXISTS anagrafiche;
              CREATE SCHEMA IF NOT EXISTS config;
              CREATE SCHEMA IF NOT EXISTS dbops;
              CREATE SCHEMA IF NOT EXISTS script;
              CREATE SCHEMA IF NOT EXISTS storico;
              CREATE SCHEMA IF NOT EXISTS data_conversion;
              CREATE SCHEMA IF NOT EXISTS maintenance;
              CREATE SCHEMA IF NOT EXISTS catalogo;
              CREATE SCHEMA IF NOT EXISTS vendite;
              CREATE SCHEMA IF NOT EXISTS contabilita;
              CREATE SCHEMA IF NOT EXISTS pagamenti;
              CREATE SCHEMA IF NOT EXISTS magazzino;
              CREATE SCHEMA IF NOT EXISTS acquisti;