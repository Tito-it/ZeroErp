databaseChangeLog:
  # Prima validi/leggi SOLO la baseline
  - includeAll:
      path: baseline
      relativeToChangelogFile: true
      errorIfMissingOrEmpty: true

  # Esempio di eccezioni quando non si puÃ² eseguire l'ordine alfabetico in migartionis
  #  - include:
  #      file: migrations/script/20250507-01-trgfn-blocco-colonna-mctit.yaml
  # Poi tutto il resto (ordina alfabeticamente dentro ogni schema)
  - includeAll:
      path: migrations
      relativeToChangelogFile: true
      errorIfMissingOrEmpty: false

