databaseChangeLog:
        # Vecchia storia INALTERATA (baseline + migrations esistenti)
        - include:
                  file: changelog-master.yaml # il tuo master attuale
                  relativeToChangelogFile: true

        # Nuova storia v2 AUTOGENERATA (ordine temporale globale)
        - include:
                  file: migrations_v2/changelog-autogen.yaml
                  relativeToChangelogFile: true
        # 3-bis) Dati di SISTEMA senza cui il codice non gira (es. il fuso
        #   dell'azienda, che leggono trigger e DEFAULT): subito dopo il
        #   codice, PRIMA di qualunque seed. Esclusa dall'autogen.
        #   brief-be-db-fe-un-solo-fuso-aziendale, T-8 (2026-10-09).
        - includeAll:
                  path: migrations_v2/70_dati_sistema
                  relativeToChangelogFile: true
        # 4) Dati/config + job + step finali
        - includeAll:
                  path: migrations_v2/80_data
                  relativeToChangelogFile: true
        - includeAll:
                  path: migrations_v2/85_pgagent
                  relativeToChangelogFile: true
        - includeAll:
                  path: migrations_v2/90_end
                  relativeToChangelogFile: true
