repos:
  - repo: local
    hooks:
      # ⚠️ `python3`, non `python`: fuori da una virtualenv e dai shim di pyenv
      #    il nome senza il 3 NON esiste su questa macchina (verificato il
      #    2026-08-26: `/usr/bin/python` assente, `/usr/bin/python3` presente).
      #    L'hook reggeva perche' si committa da una shell che ha pyenv sul
      #    PATH; da un contesto che non ce l'ha sarebbe fallito con «command not
      #    found» — cioe' avrebbe bloccato il commit per il motivo sbagliato.
      - id: check-license-header
        name: Controlla header licenza
        entry: python3 scripts/check_license.py
        language: system
        files: \.(py|js|vue|ya?ml)$
        exclude: ^docs/
        # ⭐ `verbose` perche' questo hook e' stato VERDE IN CI PER MESI senza
        #    guardare niente (correzione 2026-09-09): pre-commit nasconde lo
        #    stdout di cio' che passa, quindi un «Passed» non distingueva «ho
        #    controllato dodici file nuovi» da «non ne ho visto nessuno».
        #    Con verbose il log dice sempre QUANTI file ha guardato e DA DOVE
        #    li ha presi (range della CI o indice staged del commit).
        verbose: true

      # Guard delle chiavi i18n: chiavi rotte, parita' it/en, radici, chiavi
      # EMESSE DAL DB non risolvibili, e chiavi definite due volte.
      # ⛔ Perche' in pre-commit: sono tutti difetti SILENZIOSI — non danno un
      #    errore a runtime, danno testo mancante o la frase sbagliata, e si
      #    scoprono guardando la schermata. Fino al 2026-08-26 il guard esisteva
      #    e non lo lanciava nessun automatismo: un presidio che nessuno lancia
      #    e' a un passo dall'essere spento.
      # ⚠️ `pass_filenames: false` e' obbligatorio, non stile: il guard e'
      #    GLOBALE — confronta l'intero frontend con i due locales, la doc
      #    auto-gen e i seed. Un elenco di file lo restringerebbe proprio dove
      #    serve intero (una chiave si rompe cambiando il locale, non il
      #    componente che la cita), e i nomi finirebbero comunque in `sys.argv`,
      #    che il guard legge per `--strict-roots`.
      # ⚠️ `files` elenca le QUATTRO sorgenti che il guard legge davvero
      #    (SRC, LOCALES, DBDOCS, SEED nel suo header) piu' se stesso: se una si
      #    sposta, va spostata anche qui o il guard smette di svegliarsi.
      # ⛔ La regex sta su UNA riga di proposito: scritta come scalare `>-` di
      #    YAML, ogni a capo diventa uno SPAZIO dentro il pattern — le
      #    alternative nascerebbero con uno spazio davanti e non matcherebbero
      #    piu' niente. Un guard che non si sveglia mai e' verde per
      #    sottrazione, ed e' il modo peggiore di sbagliare questo file.
      - id: check-i18n-keys
        name: Controlla chiavi i18n
        entry: python3 scripts/check_i18n_keys.py
        language: system
        pass_filenames: false
        files: '^(frontend/src/.*\.(vue|js|json)|docs/it/dbzero/.*\.md|db/changelog/migrations_v2/80_data/sql/.*\.csv|scripts/check_i18n_keys\.py)$'

      # ⭐ Le CLASSI MORTE del frontend (2026-09-17): un token in `class="..."`
      #    che nessun foglio definisce non fa niente e non lo dice. Trovate in
      #    tre passate: 21 utility PrimeFlex mai installate (`w-full` ×245),
      #    due classi del progetto mai scritte (`app-text-muted`,
      #    `form-field-wide`), 26 identificatori orfani. Il conto va tenuto a
      #    ZERO, e questo cancello e' l'unico modo perche' resti tale: il
      #    difetto TOGLIE un colore o un bordo, non aggiunge un errore.
      #    GLOBALE come il guard i18n: una classe muore quando cambia il foglio,
      #    non solo il template che la cita.
      - id: check-classi-morte
        name: Controlla classi CSS morte
        entry: python3 scripts/check_classi_morte.py
        language: system
        pass_filenames: false
        files: '^(frontend/src/.*\.(vue|css)|scripts/check_classi_morte\.py)$'

      # L'INDICE dei building block (2026-11-11) e' generato dai due cataloghi
      #    ed e' cio' che una sessione BE/FE legge per intero (CLAUDE.md). Un
      #    indice rimasto indietro non da' errore: nasconde un building block,
      #    e chi non lo vede lo riscrive. Si rigenera con
      #    `python3 scripts/gen_indice_bb.py`.
      - id: check-indice-bb
        name: Controlla indice building block
        entry: python3 scripts/gen_indice_bb.py --check
        language: system
        pass_filenames: false
        files: '^(docs/it/dev/(backend|frontend)/(catalogo|indice)-building-block-(backend|frontend)\.md|scripts/gen_indice_bb\.py)$'

  # ⭐ La PRIMA analisi statica del backend (2026-09-09). Fino a quel giorno su
  #    258.000 righe di Python non girava nessun linter, nessun type checker e
  #    nessun formattatore — mentre il frontend ne aveva gia' due.
  # ⛔ La selezione delle regole sta in `ruff.toml`, NON qui: un elenco di
  #    argomenti dentro un hook e' una seconda sorgente di verita' che diverge
  #    dal `ruff check` lanciato a mano. Il file spiega anche PERCHE' la
  #    selezione e' `F,E9` e non `E` (che aprirebbe un registro da 4.853 righe,
  #    il 96% delle quali di sola lunghezza riga).
  # ⭐ Il cancello nasce a ZERO: i 136 rilievi preesistenti sono stati sanati
  #    prima di accenderlo. Un rosso qui significa davvero «l'hai introdotto tu».
  # ⚠️ In CI lo esegue il passo `pre-commit run` di `ci-validate.yaml`, sui soli
  #    file cambiati — che e' la forma giusta per un cancello incrementale.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check

  # ⛔ SEGRETI NEL REPO (2026-09-26): `backend/.env` con SECRET_KEY e password
  #    del DB reali e' rimasto tracciato per 5 commit, nonostante `.gitignore`
  #    — era entrato prima della regola. Il `.gitignore` non e' un presidio: non
  #    ferma un `git add -f` ne' un file gia' tracciato. Questo si'.
  # ⛔ L'`entry` si SOVRASCRIVE, e non e' stile: quella dell'hook ufficiale e'
  #    `--staged`, cioe' guarda l'indice. In CI `pre-commit run --from-ref`
  #    non ha niente in staged e l'hook sarebbe VERDE PER SOTTRAZIONE, su ogni
  #    PR. pre-commit esporta il range in PRE_COMMIT_FROM_REF/TO_REF: se c'e'
  #    si scansionano i COMMIT del range (le sole righe aggiunte), altrimenti
  #    l'indice del commit in corso.
  # ⚠️ `--redact`: il log della CI e' pubblico, un segreto trovato non va
  #    ristampato per intero proprio li'.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        entry: >-
          bash -c 'if [ -n "$PRE_COMMIT_FROM_REF" ];
          then exec gitleaks git --redact --verbose --log-opts="$PRE_COMMIT_FROM_REF..$PRE_COMMIT_TO_REF";
          else exec gitleaks git --pre-commit --staged --redact --verbose; fi'