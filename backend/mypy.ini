# Type checker del backend — configurazione unica (piano-be-type-checker, L1,
# 2026-10-08). Si lancia SEMPRE attraverso il registro a cricchetto:
#     set -a && . ./env.sh && set +a                  (l'ambiente: il plugin Django
#                                                      importa le settings)
#     .venv/bin/python ../scripts/check_mypy_baseline.py   (da backend/, venv del backend)
# Un `mypy` lanciato a mano funziona (`mypy` da backend/ legge questo file), ma
# da solo non dice niente: l'arretrato sta in `mypy.baseline.json`.

[mypy]
# ⭐ Il perimetro e' TUTTO il codice applicativo (S3): le giunture stanno fra
#    gli strati (view → service → repository), e un cancello sui soli service non
#    vede la view che gli passa il tipo sbagliato.
files = apps, zeroerp_backend
# ⛔ Fuori i test (controllano mock, che per costruzione accettano tutto) e le
#    migration Django (codice generato).
exclude = (^|/)(tests|migrations)/

# ⭐ Senza, mypy SALTA il corpo delle funzioni senza annotazioni: proprio dove una
#    giuntura e' meno dichiarata (S5). Niente `strict`: e' un altro lavoro.
check_untyped_defs = True

# Il plugin Django legge settings e modelli (ORM, manager, campi); quello DRF la
# `Request`. Pyright non ne ha uno: per questo mypy (S1).
plugins = mypy_django_plugin.main, mypy_drf_plugin.main

[mypy.plugins.django-stubs]
django_settings_module = zeroerp_backend.settings

# ⛔ Le librerie SENZA tipi si elencano PER NOME, mai `ignore_missing_imports`
#    globale: globale, un import sbagliato del progetto diventerebbe `Any` senza
#    nessun avviso. Uno stub che arriva e' una dipendenza nuova: entra con l'ok
#    di Tid, e la sua voce qui si toglie (cosi' `bleach` e `openpyxl`, stub in
#    `requirements-dev.in` dal 2026-10-09). `weasyprint` non ha stub.
[mypy-weasyprint,weasyprint.*]
ignore_missing_imports = True

# `gunicorn` non porta tipi: lo importa il presidio di avvio
# `apps/core/services/soglia_idempotenza.py` per riconoscere il worker sync.
[mypy-gunicorn,gunicorn.*]
ignore_missing_imports = True
